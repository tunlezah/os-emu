<!--
  ===========================================================================
  THE OS MUSEUM — KolibriOS exhibit
  ---------------------------------------------------------------------------
  KolibriOS is a real, actively developed operating system for x86 PCs,
  written almost entirely in FASM assembly language: kernel, drivers and
  most applications.  It fits on a 1.44 MB floppy disk, wants an i586 and
  about 12 MB of RAM, and boots to a graphical desktop in a couple of
  seconds.  It was forked from MenuetOS in 2004 and is still being written
  in 2026.  It is free software (GPLv2).

      THE REAL THING IS AT  https://kolibrios.org  —  GO AND RUN IT.
      It is a free download, it runs in any virtual machine, and it is
      better than this page in every way that matters.

  THIS FILE IS NOT KOLIBRIOS.  It is an unofficial, fan-made, front-end-only
  simulation built for the museum: no real OS code, no emulated CPU, no
  binaries, no network.  Every pixel is original artwork drawn in code and
  every byte of it was written from scratch.  It exists because an exhibit
  can annotate, curate and measure itself in ways a raw emulator cannot —
  not because it is a substitute.

  With respect and thanks to the KolibriOS Team, and — as the project
  itself says — to Ville Turjanmaa, whose MenuetOS this began as.
  ===========================================================================
-->

const U = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  pad: (n, w, c) => { n = String(n); while (n.length < w) n = (c || "0") + n; return n; },
  rnd: n => (Math.random() * n) | 0,
  pick: a => a[(Math.random() * a.length) | 0],
  lerp: (a, b, t) => a + (b - a) * t,
  hex: (n, w) => U.pad(n.toString(16).toUpperCase(), w || 2),
  /* bytes -> human, in the deliberately old-fashioned way */
  kb: b => (b / 1024).toFixed(b < 10240 ? 1 : 0) + " KB",
  size: b => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB"
                                              : (b / 1048576).toFixed(2) + " MB",
  now: () => performance.now(),
  esc: s => s,
  wrap(str, cols) {
    const out = [];
    for (const para of String(str).split("\n")) {
      if (!para) { out.push(""); continue; }
      let line = "";
      for (const word of para.split(" ")) {
        if (!line.length) line = word;
        else if (line.length + 1 + word.length <= cols) line += " " + word;
        else { out.push(line); line = word; }
      }
      out.push(line);
    }
    return out;
  }
};

const GLYPH = new Map();                  /* char -> Uint8Array(9) row masks */

  const val = new Map();
  for (let i = 0; i < 64; i++) val.set(B64[i], i);
  for (let i = 0; i < FONT_CHARS.length; i++) {
    const rows = new Uint8Array(FH);
    for (let y = 0; y < FH; y++) rows[y] = val.get(FONT_DATA[i * FH + y]);

const GLYPH_ORDER = FONT_CHARS;
const GIDX = new Map();
for (let i = 0; i < GLYPH_ORDER.length; i++) GIDX.set(GLYPH_ORDER[i], i);

/* --- glyph atlas: one white-on-transparent strip, tinted per colour ------ */
const ATLAS_W = GLYPH_ORDER.length * FW;
const baseAtlas = (function () {
  const c = document.createElement("canvas");
  c.width = ATLAS_W; c.height = FH;
  const g = c.getContext("2d");
  const img = g.createImageData(ATLAS_W, FH);
  const d = img.data;
  for (let i = 0; i < GLYPH_ORDER.length; i++) {
    const rows = GLYPH.get(GLYPH_ORDER[i]);
    for (let y = 0; y < FH; y++) {
      const m = rows[y];
      for (let x = 0; x < FW; x++) {
        if (m & (1 << (5 - x))) {
          const o = ((y * ATLAS_W) + i * FW + x) * 4;
          d[o] = d[o + 1] = d[o + 2] = d[o + 3] = 255;

  g.putImageData(img, 0, 0);

const atlasCache = new Map();
function atlasFor(color) {
  let a = atlasCache.get(color);
  if (a) return a;
  const c = document.createElement("canvas");
  c.width = ATLAS_W; c.height = FH;
  const g = c.getContext("2d");
  g.drawImage(baseAtlas, 0, 0);
  g.globalCompositeOperation = "source-in";
  g.fillStyle = color;
  g.fillRect(0, 0, ATLAS_W, FH);

  atlasCache.set(color, c);

  clip(x, y, w, h) { const c = this.c; c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); },
  unclip() { this.c.restore(); },
  rect(x, y, w, h, col) { const c = this.c; c.fillStyle = col; c.fillRect(x | 0, y | 0, w | 0, h | 0); },
  frame(x, y, w, h, col) {
    this.rect(x, y, w, 1, col); this.rect(x, y + h - 1, w, 1, col);
    this.rect(x, y, 1, h, col); this.rect(x + w - 1, y, 1, h, col);
  },
  hline(x, y, w, col) { this.rect(x, y, w, 1, col); },
  vline(x, y, h, col) { this.rect(x, y, 1, h, col); },
  /* two-tone bevel, the way every 1990s widget was made */
  bevel(x, y, w, h, lt, dk) {
    this.hline(x, y, w - 1, lt); this.vline(x, y, h - 1, lt);
    this.hline(x, y + h - 1, w, dk); this.vline(x + w - 1, y, h, dk);
  },
  vgrad(x, y, w, h, c1, c2) {
    const g = this.c.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    this.c.fillStyle = g; this.c.fillRect(x | 0, y | 0, w | 0, h | 0);
  },
  hgrad(x, y, w, h, c1, c2) {
    const g = this.c.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    this.c.fillStyle = g; this.c.fillRect(x | 0, y | 0, w | 0, h | 0);
  },
  line(x0, y0, x1, y1, col) {                       /* Bresenham, on purpose */
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    this.c.fillStyle = col;
    for (;;) {
      this.c.fillRect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = err * 2;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }

  circle(cx, cy, r, col, fill) {

/* Title-bar renderer.  KolibriOS draws close/minimise/maximise at the right. */
function drawTitleBar(g, w, h, title, active, showBtns) {
  const s = skin, th = s.th;
  if (s.hgrad) g.hgrad(0, 0, w, th, active ? s.aTop : s.iTop, active ? s.aBot : s.iBot);
  else g.vgrad(0, 0, w, th, active ? s.aTop : s.iTop, active ? s.aBot : s.iBot);
  /* rounded top corners, cut by hand a pixel at a time */
  for (let i = 0; i < s.round; i++) {
    const n = s.round - i;
    g.rect(0, i, n, 1, s.frame); g.rect(w - n, i, n, 1, s.frame);
  }
  g.frame(0, 0, w, th + 1, s.frame);
  const ty = ((th - FH) / 2) | 0;
  const col = active ? s.aTxt : s.iTxt;
  const room = ((w - (showBtns ? 66 : 12)) / FW) | 0;

  if (s.aSha !== "#00000000" && active) g.text(7, ty + 1, t, s.aSha);
  if (s.bold) g.btext(6, ty, t, col); else g.text(6, ty, t, col);
  if (showBtns) drawTitleButtons(g, w, active);

=========================================================

READ THIS FIRST, THEN STOP LOOKING FOR THINGS THAT ARE NOT HERE.

KolibriOS is not UNIX. It is not a Linux distribution, it is not
POSIX-compliant, it is not POSIX-adjacent, and it is not trying to
become POSIX-compliant later when it grows up. It shares no code with
Linux. It is not "Kolibri Linux". There is no such thing.

There is no fork(). There is no /proc. There is no /dev. There is no
$PATH, no shell out of your way, no libc between you and the machine
unless you ask for one. There are no signals, no ptys, no inodes worth
the name, and nothing whatsoever named /etc.

What there is:

  * one interrupt, 0x40, and a function number in eax
  * a kernel, drivers and most applications written in FASM assembly
  * a graphical desktop, preemptive multitasking, TCP/IP, USB, audio
  * all of it on a 1.44 MB floppy disk, in about 12 MB of RAM
  * a cold boot to a working desktop in roughly two seconds

The whole application programming interface is a list of numbered
functions. It fits in one document. You can read all of it in an
afternoon, and then you know the system. Not a subset of the system:
the system.

This is not a limitation we are working around. It is the design.

If you want POSIX, POSIX is very widely available and extremely good at
being POSIX. We wanted to see what happens if nobody does that for
twenty-two years. This is what happens.

                                        -- the KolibriOS Team
                                           (paraphrased, warmly, by an
                                            exhibit that admires them)`,

"/RD/1/DOCS/HUMMINGBIRD.TXT":
`Why "Kolibri"?

Kolibri is the Russian word -- and the Slavic word generally -- for
hummingbird.

A hummingbird weighs about as much as two paperclips. It beats its
wings up to eighty times a second, flies backwards, hovers in place,
and has the highest metabolism of any vertebrate that is not currently
hibernating. It is the smallest bird there is, and it is the only one
that can do most of what it does.

Small, and therefore fast. Small, and therefore capable of things the
larger birds cannot attempt at all.

That is the entire argument of this operating system, and it was made
in one word, in 2004, before a line of the fork was written.

The logo is a hummingbird. Of course it is.`,

"/RD/1/DOCS/NOT-POSIX.TXT":
`NOTES ON NOT BEING POSIX-COMPLIANT

Q. How do I open a file?
A. eax = 70, ebx = pointer to a structure. One call. It does open,
   read, write, seek, delete, mkdir, rename and directory listing,
   selected by a number in the structure. There is no descriptor to
   leak and nothing to close.

Q. Where is the standard library?
A. /rd/1/lib/. It is optional. LIBC.OBJ exists and is maintained
   because ports need it, not because the system does.

Q. How do I start a thread?
A. eax = 51. It is one call and it does not consult a manual page.

Q. How do I print to standard output?
A. There is no standard output. There is a debug board (eax = 63),
   which every process can write to and any process can read. Run
   BOARD and watch the system talk to itself. It is better than a log
   file and it was free.

Q. Is this not all rather limiting?
A. Yes. Look at the size of it.`,

"/RD/1/DOCS/ANTIVIRUS.TXT":
`ON BEING MISTAKEN FOR A VIRUS

A 1.44 MB disk image containing a boot sector, a hand-written kernel,
and several hundred kilobytes of raw x86 machine code that was never
produced by a mainstream compiler is, from the point of view of an
automated scanner, indistinguishable from the worst thing it has ever
seen.

Consequences, over the years:

  * false positives from multiple antivirus engines on the disk images
  * browser safe-browsing warnings on the project's own download page
  * a certain amount of correspondence with vendors
  * a certain amount of patience

The project's answer has always been the only answer available to it:
the source is public, the build is reproducible, build it yourself and
compare. Which is more than most of the software on your machine can
offer, and it does not help even slightly with the warning dialog.

There is a lesson in here about what heuristics reward, and it is not
a lesson about KolibriOS.`,

`; HELLO.ASM -- the smallest thing that is still a window.
; Assemble with FASM (F9), run it (F5).  There is no build system,
; no linker script, no package manifest and no waiting.

use32
org 0

db 'MENUET01'          ; 1. magic.  Yes, still MenuetOS's magic.
dd 1                   ; 2. header version
dd START               ; 3. entry point
dd I_END               ; 4. size of image
dd 0x1000              ; 5. memory to allocate
dd 0x1000              ; 6. initial esp
dd 0, 0                ; 7,8. no parameters, no path

include 'macros.inc'

START:
        mcall 40, 0x27              ; event mask: redraw + key + button

redraw:
        mcall 12, 1                 ; begin redraw
        mcall 0, 80*65536+300, 90*65536+126, 0x33dfe4e9, 0, title
        mcall 4, 20*65536+30, 0x80000000, msg1, msg1.len
        mcall 4, 20*65536+48, 0x80808080, msg2, msg2.len
        mcall 12, 2                 ; end redraw

still:
        mcall 10                    ; wait for an event
        dec eax
        jz  redraw                  ; 1 = redraw
        dec eax
        jz  key                     ; 2 = key
        dec eax
        jz  button                  ; 3 = button
        jmp still

key:
        mcall 2                     ; read it and drop it
        jmp still

button:
        mcall 17                    ; which button?
        cmp ah, 1                   ; 1 is always the close box
        jne still
        mcall -1                    ; terminate this thread

title   db 'Hello, KolibriOS', 0
msg1    db 'Thirty lines. One window.'
msg1.len = $ - msg1
msg2    db 'No toolchain. No waiting.'
msg2.len = $ - msg2
I_END:`,

`; SPIN.ASM -- something that moves.
; There is no timer thread and no animation framework.  Function 23
; waits for an event WITH A TIMEOUT, and the timeout is the animation.
; The rotation is the magic-circle algorithm: two shifts and two adds,
; norm-preserving, no sine table, no floating point, no FPU at all.

use32
org 0
db 'MENUET01'
dd 1, START, I_END, 0x2000, 0x2000, 0, 0
include 'macros.inc'

START:
        mcall 40, 0x27

redraw:
        mcall 12, 1
        mcall 0, 300*65536+240, 110*65536+240, 0x34101820, 0, title
        mcall 4, 8*65536+8, 0x80c0c0c0, msg, msg.len
        mcall 12, 2
        call arms

still:
        mcall 23, 3                 ; wait up to 3/100 s for an event
        test eax, eax
        jz   step                   ; nothing happened: so animate
        dec  eax
        jz   redraw
        dec  eax
        jz   key
        dec  eax
        jz   button
        jmp  still

step:                               ; x = x - (y >> 5)
        mov  eax, [px]              ; y = y + (x >> 5)
        mov  ebx, [py]
        mov  ecx, ebx
        sar  ecx, 5
        sub  eax, ecx
        mov  ecx, eax
        sar  ecx, 5
        add  ebx, ecx
        mov  [px], eax
        mov  [py], ebx
        call arms
        jmp  still

arms:
        mcall 13, 8*65536+216, 26*65536+186, 0x101820   ; clear the field
        mov  eax, [px]
        mov  ebx, [py]
        call spoke
        mov  ecx, eax               ; turn the pair ninety degrees: (x,y)
        mov  eax, ebx               ; becomes (-y,x).  Four times round.
        neg  eax
        mov  ebx, ecx
        call spoke
        mov  ecx, eax
        mov  eax, ebx
        neg  eax
        mov  ebx, ecx
        call spoke
        mov  ecx, eax
        mov  eax, ebx
        neg  eax
        mov  ebx, ecx
        call spoke
        ret

spoke:                              ; a line from the middle of the work
        push eax                    ; area out to (eax, ebx)
        push ebx
        add  eax, 114
        shl  eax, 16
        add  eax, 114               ; ebx = x1*65536 + x2
        add  ebx, 118
        shl  ebx, 16
        add  ebx, 118               ; ecx = y1*65536 + y2
        mov  ecx, ebx
        mov  ebx, eax
        mov  edx, 0x40e0ff
        mov  eax, 38                ; fn 38: draw line
        int  0x40
        pop  ebx
        pop  eax
        ret

key:    mcall 2
        jmp  still
button: mcall 17
        cmp  ah, 1
        jne  still

`; MOUSE.ASM -- reading the mouse.
; Function 37 with ebx = 0 gives the pointer relative to this window's
; work area, packed as x*65536+y.  ebx = 2 gives the buttons.  That is
; the entire mouse API and you have just read all of it.
;
; Note the long-hand register loads before int 0x40 below: you cannot
; write "mcall 13, eax, ebx, colour", because the macro sets eax first
; and your value is gone.  Every KolibriOS programmer learns this once.

use32
org 0
db 'MENUET01'
dd 1, START, I_END, 0x2000, 0x2000, 0, 0
include 'macros.inc'

START:
        mcall 40, 0x27 + 0x20       ; ... and mouse events too (bit 5)

redraw:
        mcall 12, 1
        mcall 0, 250*65536+300, 190*65536+210, 0x34101010, 0, title
        mcall 4, 10*65536+10, 0x80a0a0a0, msg, msg.len
        mcall 12, 2
        jmp  still

paint:
        mcall 37, 0                 ; where is the pointer?
        mov  ebx, eax
        and  eax, 0xffff            ; low half is y
        shr  ebx, 16                ; high half is x
        mov  [my], eax
        mov  [mx], ebx
        mcall 37, 2                 ; which buttons are down?
        test eax, 1
        jz   show
        mov  eax, [mx]              ; a 7x7 blob under the pointer
        sub  eax, 3
        shl  eax, 16
        add  eax, 7
        mov  ebx, [my]
        sub  ebx, 3
        shl  ebx, 16
        add  ebx, 7
        mov  ecx, ebx
        mov  ebx, eax
        mov  edx, 0x40ff90
        mov  eax, 13
        int  0x40
show:
        mcall 13, 10*65536+150, 172*65536+12, 0x101010
        mcall 47, 0x30000, [mx], 12*65536+173, 0x80ffffff
        mcall 47, 0x30000, [my], 70*65536+173, 0x80ffffff
        jmp  still

still:
        mcall 10
        dec  eax
        jz   redraw
        dec  eax
        jz   key
        dec  eax
        jz   button
        jmp  paint                  ; anything else here is the mouse

key:    mcall 2
        jmp  still
button: mcall 17
        cmp  ah, 1
        jne  still
        mcall -1

title   db 'Mouse -- hold the button down', 0
msg     db 'fn 37: position, then buttons'
msg.len = $ - msg
mx      dd 0
my      dd 0
I_END:`,

`; BOARDMSG.ASM -- the debug board is a system service, not a log file.
; Anything any process writes with function 63 appears in BOARD, live.
; Open BOARD before you run this.

use32
org 0
db 'MENUET01'
dd 1, START, I_END, 0x1000, 0x1000, 0, 0
include 'macros.inc'

START:
        mov  esi, text
next:
        mov  cl, [esi]
        test cl, cl
        jz   done
        mov  eax, 63                ; ebx = 1: print the character in cl
        mov  ebx, 1
        int  0x40
        inc  esi
        jmp  next
done:
        mcall -1

text    db 'BOARDMSG: hello from sixteen instructions', 13, 10, 0
I_END:`,

`; ---------------------------------------------------------------------
; kernel/trunk/core/sys32.inc  --  excerpt
; This is what an operating system looks like when it is written in
; assembly language on purpose.  Note that the system call dispatcher
; is a jump table, and that is all it is.
; ---------------------------------------------------------------------

align 4
i40:
        pushad
        cld
        movzx   eax, al                 ; function number in al
        cmp     eax, 0xFF
        jae     .invalid
        mov     ebx, [servetable + eax*4]
        test    ebx, ebx
        jz      .invalid
        call    ebx
.exit:
        popad
        iretd
.invalid:
        mov     dword[esp + 32 - 4], -1 ; eax = -1 and no ceremony
        jmp     .exit

align 4
sys_getkey:                             ; function 2
        mov     edi, [current_slot]
        movzx   ebx, word[edi + APPDATA.keyboard_mode]
        test    ebx, ebx
        jnz     .scancodes
        mov     ebx, [KEY_COUNT]
        test    ebx, ebx
        jz      .nokey
        dec     byte[KEY_COUNT]
        movzx   eax, byte[KEY_BUFF]
        shl     eax, 8
        mov     esi, KEY_BUFF + 1
        mov     edi, KEY_BUFF
        mov     ecx, 120
        rep     movsb
        ret
.nokey:
        mov     al, 1                   ; "nothing pressed"
        ret

; ---------------------------------------------------------------------
; The scheduler.  Round robin over the slot table, honouring priority
; bands.  Preemption is a timer interrupt and a stack switch, and the
; whole thing is about two hundred lines including the comments.
; ---------------------------------------------------------------------

align 4
find_next_task:
        call    update_counters
        pushfd
        cli
        mov     ebx, [current_slot_idx]
.next_slot:
        inc     ebx
        cmp     ebx, [thread_count]
        jbe     .check
        xor     ebx, ebx
        inc     [context_counter]
        jmp     .next_slot
.check:
        shl     ebx, 5
        cmp     word[SLOT_BASE + ebx + APPDATA.state], TSTATE_RUNNING
        shr     ebx, 5
        jnz     .next_slot
        mov     [current_slot_idx], ebx
        popfd
        ret`,

/* ==========================================================================
   MODULE 4 — PROCESS MODEL, SCHEDULER, DEBUG BOARD
   --------------------------------------------------------------------------
   KolibriOS multitasks preemptively with a round-robin scheduler over a slot
   table, and a system monitor that reports per-process memory in kilobytes
   because kilobytes is the unit that fits.  System programs are prefixed
   with @ and that is not decoration: it is how you know the taskbar is just
   another process that could be killed, and sometimes is.
   ========================================================================== */
/* Where the memory actually goes, once KolibriOS is up.  The largest single
   item is not the kernel: it is the framebuffer, and after that the ramdisk,
   which is the whole floppy image held resident in RAM.  The kernel itself
   is the small print. */
const KMEM = [
  ["kernel.mnt", 189],
  ["drivers (sound, ahci, usb, net)", 190],
  ["ramdisk — kolibri.img, resident", 1440],
  ["kernel heap, stacks and buffers", 640],
  ["framebuffer 1024x768x32", 3072]
];
const KERNEL_KB = KMEM.reduce((a, k) => a + k[1], 0);   /* 5531 Kb */
const RAM_TOTAL_KB = 32768;      /* what the "machine" has fitted */

const Proc = {
  list: [], nextPid: 9, ctxSwitches: 0,
  boot() {
    this.list = [];
    const sys = (pid, name, mem) =>
      this.list.push({ pid, name, mem, cpu: 0, threads: 1, sys: true, win: null, t: 0 });
    sys(1, "IDLE", 0);
    sys(2, "OS", KERNEL_KB);
    sys(3, "@TASKBAR", 30);
    sys(4, "@ICON", 12);
    sys(5, "@DOCKY", 19);
    sys(6, "@NOTIFY", 25);
    sys(7, "@VOLUME", 13);
    sys(8, "@SS", 6);
    this.nextPid = 9;
  },
  spawn(name, mem, win) {
    const p = { pid: this.nextPid++, name, mem: mem || 32, cpu: 0, threads: 1,
                sys: false, win: win || null, t: 0, busy: 0 };
    this.list.push(p);
    return p;
  },
  kill(p) {
    const i = this.list.indexOf(p);
    if (i >= 0) this.list.splice(i, 1);
  },
  find(pid) { return this.list.find(p => p.pid === pid); },
  usedKB() { return this.list.reduce((a, p) => a + p.mem, 0); },
  /* the numbers behind the system monitor: honest bookkeeping of make-believe */
  tick(dt) {
    this.ctxSwitches += Math.round(dt * 1.2);
    let sum = 0;
    for (const p of this.list) {
      if (p.pid === 1) continue;
      let want = p.sys ? 0.2 : 0.4;
      if (p.win && p.win === WM.focus) want += 0.6;
      if (p.busy) { want += p.busy; p.busy *= 0.86; if (p.busy < 0.02) p.busy = 0; }
      p.cpu = U.clamp(p.cpu + (want - p.cpu) * 0.08, 0, 99);
      sum += p.cpu;
    }
    const idle = this.list[0];
    if (idle) idle.cpu = U.clamp(100 - sum, 0, 100);
  }
};

const Board = {
  lines: ["Kolibri OS " + KVER, "----------------------------------------"],
  cap: 500, seq: 0, dirty: false,
  log(s) {

/* ==========================================================================
   MODULE 5 — WINDOW MANAGER
   --------------------------------------------------------------------------
   Skinned title bars, close / minimise / maximise at the right, drag, resize
   from any edge, z-order, and a taskbar button per window.  Window "style 3"
   is the skinned resizable one, "style 4" skinned fixed-size, "style 0" a
   bare rectangle you draw yourself.  Applications that want none of this can
   have none of it, which is how the demos get a clean canvas.
   ========================================================================== */
let WINID = 1;
function Win(app, opts) {
  opts = opts || {};

  this.title = opts.title || app.title || app.id;
  this.w = opts.w || app.w || 400;
  this.h = opts.h || app.h || 300;
  this.x = opts.x !== undefined ? opts.x : 0;
  this.y = opts.y !== undefined ? opts.y : 0;
  this.style = opts.style !== undefined ? opts.style : (app.style !== undefined ? app.style : 3);
  this.resizable = this.style === 3;

  this.ctx = this.canvas.getContext("2d");
  this.ctx.imageSmoothingEnabled = false;

  this.keys = [];

}
Win.prototype = {
  layout() {

    const th = this.style === 3 || this.style === 4 ? skin.th + 1 : 0;
    this.bw = bw; this.th = th;
    this.cx = this.x + bw; this.cy = this.y + th;
    this.cw = Math.max(8, this.w - bw * 2);
    this.ch = Math.max(8, this.h - th - bw);
    if (this.canvas.width !== this.cw || this.canvas.height !== this.ch) {
      this.canvas.width = this.cw; this.canvas.height = this.ch;

    this.dirty = true;

  clientHit(mx, my) { return mx >= this.cx && my >= this.cy && mx < this.cx + this.cw && my < this.cy + this.ch; },
  repaint() {

    g.rect(0, 0, this.cw, this.ch, this.app.bg === false ? "#00000000" : (this.app.bg || SC().work));
    if (this.app.draw) {
      const ui = UI.begin(this, g);
      try { this.app.draw(g, this, ui); } catch (e) { paintCrash(g, this, e); }
      UI.end();
    }
    this.dirty = false;

  setTitle(t) { if (t !== this.title) { this.title = t; Taskbar.dirty = true; Screen.frameDirty = true; } },
  close() { WM.close(this); }

const WM = {
  wins: [], zc: 10, focus: null, drag: null,

  open(appId, opts) {

    if (!app) { Board.log("K : '" + appId + "' not found"); Notify.push("Not found", appId); return null; }
    if (app.single) {
      const ex = this.wins.find(w => w.app.id === appId);
      if (ex) { if (ex.min) this.restore(ex); this.focusWin(ex); return ex; }
    }
    opts = opts || {};
    const gm = State.geom[appId];
    if (gm && opts.x === undefined) {
      opts.x = gm.x; opts.y = gm.y;
      if (app.style !== 4 && app.style !== 0) { opts.w = gm.w; opts.h = gm.h; }
    }
    const w = new Win(app, opts);

    if (opts.x === undefined) {

    if (w.y < 0) w.y = 0;

    if (w.app.closing) { try { w.app.closing(w); } catch (e) {} }
    this.wins.splice(i, 1);

    Taskbar.dirty = true; Screen.frameDirty = true;

  },
  topmost() {
    let best = null;
    for (const w of this.wins) if (!w.min && (!best || w.z > best.z)) best = w;
    return best;
  },
  focusWin(w) {
    if (!w || w.min) return;
    if (this.focus === w && w.z === this.zc) return;
    this.focus = w; w.z = ++this.zc; w.dirty = true;
    Taskbar.dirty = true; Screen.frameDirty = true;
  },
  minimize(w) { w.min = true; if (this.focus === w) this.focus = this.topmost(); Taskbar.dirty = true; Screen.frameDirty = true; },
  restore(w) { w.min = false; this.focusWin(w); Screen.frameDirty = true; },
  toggleMax(w) {
    if (w.max) {

    } else {

      w.x = 0; w.y = 0; w.w = SW; w.h = SH - Taskbar.H; w.max = true;
    }

  },
  /* hit test, front to back: which window, and which part of it */
  hit(mx, my) {
    const sorted = this.wins.filter(w => !w.min).sort((a, b) => b.z - a.z);
    for (const w of sorted) {
      if (mx < w.x - 2 || my < w.y - 2 || mx >= w.x + w.w + 2 || my >= w.y + w.h + 2) continue;
      const inside = mx >= w.x && my >= w.y && mx < w.x + w.w && my < w.y + w.h;
      if (w.resizable && !w.max) {
        const R = 4;
        const l = mx < w.x + R, r = mx >= w.x + w.w - R;
        const t = my < w.y + R, b = my >= w.y + w.h - R;
        if (l || r || b || (t && (l || r))) {
          if (mx >= w.x - 2 && my >= w.y - 2 && mx < w.x + w.w + 2 && my < w.y + w.h + 2)
            return { win: w, part: "resize", edge: (l ? "l" : r ? "r" : "") + (t ? "t" : b ? "b" : "") };
        }
      }
      if (!inside) continue;
      if (w.th && my < w.y + w.th) {
        const rel = mx - w.x, th = skin.th, by = ((th - 13) / 2) | 0, ry = my - w.y;
        if (ry >= by && ry < by + 13) {
          if (rel >= w.w - 20 && rel < w.w - 5) return { win: w, part: "close" };
          if (rel >= w.w - 38 && rel < w.w - 23) return { win: w, part: "max" };
          if (rel >= w.w - 56 && rel < w.w - 41) return { win: w, part: "min" };
        }
        return { win: w, part: "title" };
      }
      if (w.clientHit(mx, my)) return { win: w, part: "client" };
      return { win: w, part: "frame" };
    }
    return null;
  },
  paintFrame(g, w) {
    const s = skin;
    if (w.style === 3 || w.style === 4) {
      g.c.save(); g.c.translate(w.x, w.y);
      drawTitleBar(g, w.w, w.h, w.title, WM.focus === w, true);
      g.c.restore();
      /* body frame: outer line, then the skin's inner shade */
      g.frame(w.x, w.y, w.w, w.h, s.frame);
      const bw = w.bw;
      for (let i = 1; i < bw; i++) {
        g.rect(w.x + i, w.y + w.h - bw + (i - 1), w.w - i * 2, 1, i === 1 ? s.iBot : s.aBot);
      }
      g.rect(w.x + 1, w.y + w.th, bw - 1, w.h - w.th - 1, s.aBot);
      g.rect(w.x + w.w - bw, w.y + w.th, bw - 1, w.h - w.th - 1, s.aBot);
      g.rect(w.x + 1, w.y + w.h - bw, w.w - 2, bw - 1, s.aBot);
      g.frame(w.x + bw - 1, w.y + w.th - 1, w.cw + 2, w.ch + 2, s.frame);
    } else {
      g.frame(w.x, w.y, w.w, w.h, s.frame);
    }
  }
};

   MODULE 6 — DESKTOP, TASKBAR, MENU, NOTIFICATIONS
   --------------------------------------------------------------------------
   @taskbar, @icon, @menu and @notify are ordinary processes in KolibriOS.
   They appear in the process list with their @ prefixes, they can be killed,

/* --- the hummingbird -----------------------------------------------------
   Kolibri is the Slavic word for hummingbird: chosen for smallness and for
   speed.  The project's own mark is a hummingbird; this is an original bird
   drawn for this exhibit in a comparable simple style, not a copy of theirs.
   ------------------------------------------------------------------------- */
const BIRD = [
  "..................",
  "..........wwww....",
  ".........wwwwww...",
  "........wwww......",
  ".kkkk...bbbb......",
  "kkkk...bbebbb.....",
  "......tbbbbbbb....",
  ".....tbbbbbbbbbb..",
  "......bbbbbbbbbbb.",
  ".......bbbbb.bbbbb",
  "........bbb....bbb",
  ".................."

const BIRD_PAL = { b: "#1c9e6d", w: "#6fdcaa", t: "#e8437e", k: "#1d2b26", e: "#ffffff" };
function drawBird(g, x, y, sc, pal) {
  sc = sc || 1; pal = pal || BIRD_PAL;
  for (let r = 0; r < BIRD.length; r++) {
    const row = BIRD[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch === ".") continue;
      g.rect(x + c * sc, y + r * sc, sc, sc, pal[ch] || pal.b);
    }
  }
}

/* --- wallpaper ----------------------------------------------------------- */
const WALLS = ["planet", "hummingbird", "tile", "stars", "plain"];
const Desktop = {
  wall: "planet", dirty: true, cache: null, icons: [], sel: -1, lastClick: 0,
  H() { return SH - Taskbar.H; },
  init() {
    /* icons.dat, more or less */
    const I = (n, app, ic, arg) => ({ n, app, ic, arg });
    this.icons = [
      I("Eolite", "eolite", "folder"),
      I("Board", "board", "board"),
      I("Tinypad", "tinypad", "text"),
      I("WebView", "webview", "globe"),
      I("SysMon", "sysmon", "monitor"),
      I("FASM", "fasm", "asm"),
      I("Games", "eolite", "folder", "/rd/1/GAMES"),
      I("LiveCD", "eolite", "folder", "/cd0/1/HEAVY"),
      I("readme", "tinypad", "text", "/rd/1/README.TXT"),
      I("Exhibit", "exhibit", "chart")
    ];
  },
  build() {
    const c = document.createElement("canvas");
    c.width = SW; c.height = SH;
    const g = new Gfx(c.getContext("2d"));
    const H = SH;
    if (this.wall === "plain") {
      g.rect(0, 0, SW, H, "#1a2634");
    } else if (this.wall === "tile") {
      /* PIC4-style tiled texture: a small pattern, repeated, like the real one */
      for (let y = 0; y < H; y += 16) for (let x = 0; x < SW; x += 16) {
        g.rect(x, y, 16, 16, "#25405c");
        g.rect(x, y, 15, 15, "#2c4c6c");
        g.rect(x + 2, y + 2, 11, 11, "#213a54");
        g.rect(x + 5, y + 5, 5, 5, "#38618a");
        g.rect(x + 6, y + 6, 2, 2, "#4f86b8");
      }
    } else {
      /* sky */
      const sky = g.c.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#070b1c"); sky.addColorStop(0.40, "#0f2444");
      sky.addColorStop(0.74, "#17456a"); sky.addColorStop(1, "#2b6e86");
      g.c.fillStyle = sky; g.c.fillRect(0, 0, SW, H);
      /* stars, deterministic so the desktop is the same desktop every boot */
      let s = 20040101;
      const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      for (let i = 0; i < 420; i++) {
        const x = (rnd() * SW) | 0, y = (rnd() * H * 0.62) | 0, b = rnd();
        const c1 = b > 0.9 ? "#ffffff" : b > 0.6 ? "#cfe0f0" : "#8fa8c4";
        g.rect(x, y, 1, 1, c1);
        if (b > 0.965) { g.rect(x - 1, y, 3, 1, c1); g.rect(x, y - 1, 1, 3, c1); }
      }
      if (this.wall === "stars") { this.cache = c; this.dirty = false; return c; }
      if (this.wall === "hummingbird") {
        drawBird(g, SW / 2 - 18 * 11, H / 2 - 6 * 11, 11,
                 { b: "#1c9e6d", w: "#6fdcaa", t: "#e8437e", k: "#0d1a16", e: "#ffffff" });
        g.ctext(SW / 2, H / 2 + 110, "kolibri  —  hummingbird", "#7fb0c8", 2);
        g.ctext(SW / 2, H / 2 + 142, "small, and therefore fast", "#4f7f97", 1);
        this.cache = c; this.dirty = false; return c;
      }
      /* --- the tiny planet: one house, two trees, a boat -----------------
         The real KolibriOS default wallpaper is a tiny planet carrying a
         single house, two trees and a boat.  It is perfect.  This is an
         original drawing in the same spirit, not a copy of theirs. */
      const px = 556, py = 552, pr = 116;
      /* atmosphere */
      for (let i = 10; i > 0; i--) {
        g.c.globalAlpha = 0.035;
        g.circle(px, py, pr + i * 3, "#8fd8ff", true);
      }
      g.c.globalAlpha = 1;
      g.circle(px, py, pr + 1, "#0c2a1e", true);
      g.circle(px, py, pr, "#2f6b4a", true);
      g.c.save();
      g.c.beginPath(); g.c.arc(px, py, pr - 1, 0, Math.PI * 2); g.c.clip();
      /* the sea, a lens on the left flank */
      g.c.beginPath(); g.c.arc(px - 96, py + 30, 96, 0, Math.PI * 2);
      g.c.fillStyle = "#1c5674"; g.c.fill();
      g.c.beginPath(); g.c.arc(px - 96, py + 36, 92, 0, Math.PI * 2);
      g.c.fillStyle = "#2a7398"; g.c.fill();
      /* a little relief, kept quiet */
      g.c.beginPath(); g.c.arc(px + 46, py + 40, 74, 0, Math.PI * 2);
      g.c.fillStyle = "#347150"; g.c.fill();
      g.c.beginPath(); g.c.arc(px + 20, py - 66, 30, 0, Math.PI * 2);
      g.c.fillStyle = "#3a8058"; g.c.fill();
      const shade = g.c.createLinearGradient(px - pr, py - pr, px + pr, py + pr);
      shade.addColorStop(0, "rgba(255,240,200,0.10)");
      shade.addColorStop(0.55, "rgba(0,0,0,0)");
      shade.addColorStop(1, "rgba(0,10,30,0.42)");
      g.c.fillStyle = shade; g.c.fillRect(px - pr, py - pr, pr * 2, pr * 2);
      g.c.restore();
      /* the house, on top of the world */
      const hx = px - 16, hy = py - pr - 2;
      g.rect(hx, hy, 30, 24, "#d8cdb8");
      g.rect(hx, hy, 30, 1, "#f2ead8");
      for (let i = 0; i < 15; i++) g.rect(hx - 3 + i, hy - ((15 - i) / 2 | 0) - 1, 36 - i * 2, 1, "#a0453a");
      g.rect(hx + 10, hy + 9, 9, 9, "#ffd98a");
      g.rect(hx + 14, hy + 9, 1, 9, "#c8a860");
      g.rect(hx + 10, hy + 13, 9, 1, "#c8a860");
      g.rect(hx + 23, hy - 11, 4, 10, "#8a5a48");
      g.rect(hx + 23, hy - 13, 5, 2, "#6a4438");
      /* two trees, on the shoulder of the planet */
      const tree = (ang, s2) => {
        const tx = px + Math.cos(ang) * (pr - 2) | 0, ty = py + Math.sin(ang) * (pr - 2) | 0;
        g.rect(tx, ty - 12 * s2, 3, 13 * s2, "#5a3f2a");
        g.circle(tx + 1, ty - 16 * s2, 10 * s2, "#1f5c39", true);
        g.circle(tx - 2, ty - 20 * s2, 6 * s2, "#2c7a4c", true);
        g.circle(tx + 5, ty - 14 * s2, 5 * s2, "#256b42", true);
      };
      tree(-Math.PI / 2 + 0.34, 1.15);
      tree(-Math.PI / 2 + 0.62, 0.85);
      /* a boat, on the sea */
      const ba = -Math.PI / 2 - 0.86;
      const bx = (px + Math.cos(ba) * (pr - 3)) | 0, by = (py + Math.sin(ba) * (pr - 3)) | 0;
      g.rect(bx - 13, by - 2, 26, 4, "#7a4a30");
      g.rect(bx - 11, by + 2, 22, 2, "#5c3722");
      g.vline(bx, by - 22, 21, "#c8b898");
      g.c.fillStyle = "#f2f0e4"; g.c.beginPath();
      g.c.moveTo(bx + 1, by - 21); g.c.lineTo(bx + 13, by - 3); g.c.lineTo(bx + 1, by - 3);
      g.c.fill();
      g.c.fillStyle = "#e2d2ba"; g.c.beginPath();
      g.c.moveTo(bx - 1, by - 18); g.c.lineTo(bx - 10, by - 3); g.c.lineTo(bx - 1, by - 3);
      g.c.fill();
      /* and two birds, doing what birds do */
      drawBird(g, px - 250, py - 190, 3);
      drawBird(g, px + 190, py - 250, 2);
    }
    this.cache = c; this.dirty = false;
    return c;
  },
  paint(g) {
    if (this.dirty || !this.cache) this.build();
    g.c.drawImage(this.cache, 0, 0);
    /* icons, laid out in a column down the left like the real icons.dat */
    for (let i = 0; i < this.icons.length; i++) {
      const it = this.icons[i];
      const x = 22 + ((i / 8) | 0) * 96, y = 18 + (i % 8) * 76;
      it._x = x; it._y = y;
      drawIcon(g, x, y, it.ic, 32);
      const lab = it.n, lw = tw(lab);
      const lx = x + 16 - lw / 2 | 0;
      if (this.sel === i) { g.rect(lx - 3, y + 38, lw + 6, 12, SC().sel); }
      g.text(lx + 1, y + 41, lab, this.sel === i ? SC().selText : "#000000");
      g.text(lx, y + 40, lab, this.sel === i ? SC().selText : "#f0f4f8");
    }
  },
  click(mx, my, dbl) {
    for (let i = 0; i < this.icons.length; i++) {
      const it = this.icons[i];
      if (mx >= it._x - 8 && mx < it._x + 44 && my >= it._y - 4 && my < it._y + 52) {
        this.sel = i; Screen.frameDirty = true;
        if (dbl) WM.open(it.app, { arg: it.arg });
        return true;
      }
    }
    if (this.sel !== -1) { this.sel = -1; Screen.frameDirty = true; }
    if (dbl) restartShell();
    return false;
  }
};

/* --- 32px procedural icons ---------------------------------------------- */
function drawIcon(g, x, y, kind, s) {
  s = s || 32;
  const k = v => Math.round(v * s / 32);
  switch (kind) {
    case "folder":
      g.rect(x + k(2), y + k(7), k(28), k(20), "#c8922e");
      g.rect(x + k(2), y + k(4), k(12), k(4), "#e0ad42");
      g.rect(x + k(3), y + k(9), k(26), k(17), "#f0c25a");
      g.rect(x + k(3), y + k(9), k(26), k(2), "#ffd98a");
      break;
    case "exe":
      g.rect(x + k(4), y + k(3), k(24), k(26), "#5b7fa8");
      g.rect(x + k(5), y + k(4), k(22), k(24), "#8fb4d8");
      g.rect(x + k(8), y + k(8), k(16), k(3), "#254060");
      g.rect(x + k(8), y + k(14), k(11), k(3), "#254060");
      g.rect(x + k(8), y + k(20), k(14), k(3), "#254060");
      break;
    case "text":
      g.rect(x + k(6), y + k(2), k(20), k(28), "#e8e8e0");
      g.frame(x + k(6), y + k(2), k(20), k(28), "#8a8a82");
      for (let i = 0; i < 6; i++) g.rect(x + k(9), y + k(7 + i * 4), k(14 - (i % 2) * 5), 1, "#5a6a7a");
      break;
    case "asm":
      g.rect(x + k(6), y + k(2), k(20), k(28), "#1c2430");
      g.frame(x + k(6), y + k(2), k(20), k(28), "#4f6f8f");
      g.text(x + k(8), y + k(6), "mov", "#6fdcaa");
      g.text(x + k(8), y + k(14), "int", "#e8c060");
      g.text(x + k(8), y + k(22), "40h", "#e8437e");
      break;
    case "board":
      g.rect(x + k(2), y + k(4), k(28), k(24), "#101820");
      g.frame(x + k(2), y + k(4), k(28), k(24), "#3f5f7f");
      for (let i = 0; i < 5; i++)
        g.rect(x + k(5), y + k(8 + i * 4), k(6 + ((i * 7) % 18)), 1, "#5ee8b0");
      break;
    case "globe":
      g.circle(x + k(16), y + k(16), k(13), "#2a6f9e", true);
      g.circle(x + k(16), y + k(16), k(13), "#8fd0f0", false);
      g.rect(x + k(3), y + k(15), k(26), 1, "#8fd0f0");
      for (let i = -2; i <= 2; i++) g.circle(x + k(16), y + k(16), k(13) - Math.abs(i * 4), "#4a90bf", false);
      break;
    case "monitor":
      g.rect(x + k(2), y + k(5), k(28), k(19), "#8a949e");
      g.rect(x + k(4), y + k(7), k(24), k(15), "#0d1a12");
      for (let i = 0; i < 7; i++) g.rect(x + k(6) + i * k(3), y + k(20) - k(2 + ((i * 5) % 11)), k(2), k(2 + ((i * 5) % 11)), "#3fe08f");
      g.rect(x + k(12), y + k(24), k(8), k(4), "#6a747e");
      g.rect(x + k(8), y + k(27), k(16), k(2), "#8a949e");
      break;
    case "chart":
      g.rect(x + k(3), y + k(3), k(26), k(26), "#f4f4ee");
      g.frame(x + k(3), y + k(3), k(26), k(26), "#7a7a72");
      g.rect(x + k(7), y + k(18), k(4), k(8), "#3f7fbf");
      g.rect(x + k(13), y + k(10), k(4), k(16), "#e8437e");
      g.rect(x + k(19), y + k(21), k(4), k(5), "#1c9e6d");
      break;
    case "cd":
      g.circle(x + k(16), y + k(16), k(14), "#c8ccd0", true);
      g.circle(x + k(16), y + k(16), k(13), "#a8b8c8", false);
      g.circle(x + k(16), y + k(16), k(4), "#f4f4f4", true);
      break;
    case "bird": drawBird(g, x + k(4), y + k(10), Math.max(1, k(1)) * (s >= 32 ? 1 : 1)); break;
    default:
      g.rect(x + k(4), y + k(4), k(24), k(24), "#9aa4ae");
      g.frame(x + k(4), y + k(4), k(24), k(24), "#5a646e");
  }
}

/* --- notifications (@notify) -------------------------------------------- */
const Notify = {
  toasts: [],
  push(title, body, ms) {
    this.toasts.push({ title, body: body || "", t: ms || 5200, a: 0 });
    if (this.toasts.length > 4) this.toasts.shift();
    Screen.frameDirty = true;
    Board.log("NOTIFY: " + title + (body ? " / " + body : ""));
  },
  tick(dt) {
    for (const t of this.toasts) { t.t -= dt; t.a = Math.min(1, t.a + dt / 160); }
    const n = this.toasts.length;
    this.toasts = this.toasts.filter(t => t.t > 0);
    if (this.toasts.length !== n) Screen.frameDirty = true;
    if (this.toasts.length) Screen.frameDirty = true;
  },
  paint(g) {
    let y = SH - Taskbar.H - 8;
    for (let i = this.toasts.length - 1; i >= 0; i--) {
      const t = this.toasts[i];
      const lines = U.wrap(t.body, 40).slice(0, 3);
      const h = 20 + lines.length * 11;
      const w = 250;
      const x = SW - w - 10;
      y -= h + 6;
      g.c.globalAlpha = Math.min(1, t.a) * (t.t < 500 ? t.t / 500 : 1);
      g.rect(x + 2, y + 2, w, h, "#00000060");
      g.rect(x, y, w, h, skin.aBot);
      g.frame(x, y, w, h, skin.frame);
      g.rect(x + 1, y + 1, w - 2, 1, skin.aTop);
      drawBird(g, x + 5, y + 4, 1);
      g.btext(x + 26, y + 5, t.title, skin.aTxt);
      for (let j = 0; j < lines.length; j++) g.text(x + 8, y + 18 + j * 11, lines[j], skin.aTxt);
      g.c.globalAlpha = 1;
    }
  },
  click(mx, my) {
    if (my > SH - Taskbar.H - 200 && mx > SW - 270 && this.toasts.length) {
      this.toasts.pop(); Screen.frameDirty = true; return true;
    }
    return false;
  }
};

/* --- taskbar (@taskbar) + menu (@menu) ---------------------------------- */
const Taskbar = {
  H: 28, _h: 28, dirty: true, menuOpen: false, sub: -1, hover: -1, subHover: -1,
  cache: null, tray: [],
  btnRects: [], menuRect: null,
  paint(g) {
    const H = this.H, y0 = SH - H;
    const s = skin;
    g.vgrad(0, y0, SW, H, s.aTop, s.aBot);
    g.hline(0, y0, SW, s.frame);
    g.hline(0, y0 + 1, SW, "#ffffff20");
    /* menu button */
    const mb = { x: 3, y: y0 + 3, w: 62, h: H - 6 };
    this.menuRect = mb;
    drawPanelBtn(g, mb.x, mb.y, mb.w, mb.h, this.menuOpen);
    drawBird(g, mb.x + 4, mb.y + 5, 1);
    g.text(mb.x + 25, mb.y + 7, T("menu"), s.aTxt);
    /* task buttons */
    this.btnRects = [];
    const wins = WM.wins;
    const avail = SW - 76 - 216;
    const bw = Math.max(58, Math.min(148, wins.length ? (avail / wins.length) | 0 : 148)) - 3;
    let x = 70;
    for (const w of wins) {
      const act = WM.focus === w && !w.min;
      drawPanelBtn(g, x, y0 + 3, bw, H - 6, act);
      const room = ((bw - 22) / FW) | 0;
      let t = w.title.length > room ? w.title.slice(0, Math.max(1, room - 1)) + "…" : w.title;
      drawIcon(g, x + 3, y0 + 6, w.app.ic || "exe", 15);
      g.text(x + 21, y0 + 10, t, w.min ? s.iTxt : s.aTxt);
      this.btnRects.push({ x, y: y0 + 3, w: bw, h: H - 6, win: w });
      x += bw + 3;
      if (x > SW - 222) break;
    }
    /* tray */
    const tx = SW - 212;
    this.tray = [];
    const trayBtn = (i, label, on) => {
      const bx = tx + i * 30;
      drawPanelBtn(g, bx, y0 + 3, 27, H - 6, false);
      g.text(bx + (27 - tw(label)) / 2 | 0, y0 + 10, label, on ? s.aTxt : s.iTxt);
      this.tray.push({ x: bx, y: y0 + 3, w: 27, h: H - 6, id: i });
    };
    trayBtn(0, lang === "en" ? "En" : lang === "ru" ? "Ру" : "Es", true);
    trayBtn(1, Snd.on ? "♪" : "×", Snd.on);
    trayBtn(2, Net.up ? "↑↓" : "··", Net.up);
    /* clock */
    const now = Clock.now();
    const t = U.pad(now.h, 2) + ":" + U.pad(now.m, 2) + ":" + U.pad(now.s, 2);
    drawPanelBtn(g, SW - 118, y0 + 3, 115, H - 6, false);
    g.text(SW - 114, y0 + 10, t, s.aTxt);
    g.text(SW - 114 + tw(t) + 6, y0 + 10, Clock.dstr(), s.iTxt);
    if (this.menuOpen) this.paintMenu(g);
  },
  paintMenu(g) {
    const y0 = SH - this.H;
    const rowH = 15, pad = 5;
    const items = MENU;
    const w = 148;
    const h = items.length * rowH + pad * 2 + 20;
    const x = 3, y = y0 - h;
    this.menuGeom = { x, y, w, h, rowH, pad };
    g.rect(x + 3, y + 3, w, h, "#00000050");
    g.rect(x, y, w, h, SC().work);
    g.frame(x, y, w, h, skin.frame);
    g.bevel(x + 1, y + 1, w - 2, h - 2, "#ffffff40", "#00000030");
    /* the strip down the left, like the real menu */
    g.vgrad(x + 1, y + 1, 5, h - 2, skin.aTop, skin.aBot);
    for (let i = 0; i < items.length; i++) {
      const iy = y + pad + i * rowH;
      const sel = this.hover === i;
      if (sel) g.rect(x + 7, iy - 2, w - 9, rowH, SC().sel);
      g.text(x + 12, iy, T(items[i][0]), sel ? SC().selText : SC().workText);
      g.text(x + w - 12, iy, "▸", sel ? SC().selText : SC().line);
    }
    const sy = y + pad + items.length * rowH + 3;
    g.hline(x + 7, sy, w - 14, SC().line);
    const dsel = this.hover === 99;
    if (dsel) g.rect(x + 7, sy + 4, w - 9, rowH, SC().sel);
    g.text(x + 12, sy + 6, T("down"), dsel ? SC().selText : SC().workText);
    /* submenu */
    if (this.sub >= 0 && items[this.sub]) {
      const list = items[this.sub][1];
      const sw2 = 152, sh2 = list.length * rowH + pad * 2;
      const sx = x + w - 2;
      const sy2 = Math.max(2, Math.min(y + pad + this.sub * rowH - pad, y0 - sh2 - 2));
      this.subGeom = { x: sx, y: sy2, w: sw2, h: sh2, rowH, pad };
      g.rect(sx + 3, sy2 + 3, sw2, sh2, "#00000050");
      g.rect(sx, sy2, sw2, sh2, SC().work);
      g.frame(sx, sy2, sw2, sh2, skin.frame);
      for (let j = 0; j < list.length; j++) {
        const iy = sy2 + pad + j * rowH;
        if (!list[j]) { g.hline(sx + 6, iy + 6, sw2 - 12, SC().line); continue; }
        const sel = this.subHover === j;
        if (sel) g.rect(sx + 3, iy - 2, sw2 - 6, rowH, SC().sel);
        g.text(sx + 8, iy, list[j][0], sel ? SC().selText : SC().workText);
      }
    } else this.subGeom = null;
  },
  hitMenu(mx, my) {
    if (!this.menuOpen) return null;
    const gm = this.menuGeom;
    if (this.subGeom) {
      const s = this.subGeom;
      if (mx >= s.x && mx < s.x + s.w && my >= s.y && my < s.y + s.h) {
        const j = ((my - s.y - s.pad + 2) / s.rowH) | 0;
        return { pane: "sub", i: U.clamp(j, 0, MENU[this.sub][1].length - 1) };
      }
    }
    if (gm && mx >= gm.x && mx < gm.x + gm.w && my >= gm.y && my < gm.y + gm.h) {
      const i = ((my - gm.y - gm.pad + 2) / gm.rowH) | 0;
      if (i >= 0 && i < MENU.length) return { pane: "cat", i };
      return { pane: "cat", i: 99 };
    }
    return { pane: "outside" };
  }
};
function drawPanelBtn(g, x, y, w, h, pressed) {
  const s = skin;
  if (pressed) { g.rect(x, y, w, h, "#00000040"); g.bevel(x, y, w, h, "#00000050", "#ffffff30"); }
  else { g.rect(x, y, w, h, "#ffffff18"); g.bevel(x, y, w, h, "#ffffff38", "#00000040"); }
}

/* --- system clock ------------------------------------------------------- */
const Clock = {
  now() { const d = new Date(); return { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds() }; },
  dstr() { const d = new Date(); return U.pad(d.getDate(), 2) + "/" + U.pad(d.getMonth() + 1, 2) + "/" + String(d.getFullYear()).slice(2); },
  bcd() { const n = this.now(); return (n.s % 10) | (((n.s / 10) | 0) << 4) | ((n.m % 10) << 8) | (((n.m / 10) | 0) << 12) | ((n.h % 10) << 16) | (((n.h / 10) | 0) << 20); }
};

/* ==========================================================================
   MODULE 7 — BOOT MANAGER
   --------------------------------------------------------------------------
   Three screens, all of them text mode, all of them over in about three
   seconds: the machine's own boot-device menu, then KolibriOS's blue loader
   with its lettered settings and its countdown, then the kernel talking to
   itself while it brings up every subsystem it has.  Then the desktop.
   The stopwatch runs from the moment the loader hands control to the kernel,
   which is the only interval that is actually KolibriOS's fault.
   ========================================================================== */
const TXW = 12, TXH = 22, TCOLS = 80, TROWS = 25;
const TX0 = ((SW - TCOLS * TXW) / 2) | 0, TY0 = ((SH - TROWS * TXH) / 2) | 0;
function tput(g, col, row, str, fg, bg) {
  const x = TX0 + col * TXW, y = TY0 + row * TXH;
  if (bg) g.rect(x, y, str.length * TXW, TXH, bg);
  g.text(x, y + 2, str, fg, 2);
}

const BOOTDEV = [
  { id: "fd", name: "Floppy (A:)  kolibri.img, 1.44 Mb",
    rd: "kolibri.img on floppy",
    extra: ["fdc: 1.44 Mb drive at irq 6, reading 2880 sectors"] },
  { id: "hd", name: "Hard disk (C:)  via the DOS/Windows loader",
    rd: "/hd0/1/kolibrios/kolibri.img",
    extra: ["kolibri.ldr: real mode stub handed off at 0x7c00",
            "fat32: reading kolibri.img from /hd0/1/kolibrios"] },
  { id: "usb", name: "USB flash drive  (BIOS as removable HDD)",
    rd: "/usbhd0/1/kolibri.img",
    extra: ["usb: ehci at 0xfebf0000, 1 device on port 3",
            "usbstor: SanDisk, 3.7 Gb, exFAT, read only for now"] },
  { id: "cd", name: "LiveCD  (ISO-9660, 99 Mb, the heavy programs)",
    rd: "/cd0/1/kolibri.img",
    extra: ["cdfs: ISO-9660 multi-session, 99 Mb, El Torito",
            "cd: the extra 98 Mb is Doom, Quake and NetSurf"] },
  { id: "efi", name: "UEFI  (uefi4kos, BETA)",
    rd: "hybrid image, ESP partition",
    extra: ["uefi4kos: BETA. GOP framebuffer 1024x768x32 at 0xC0000000",
            "uefi: no CSM, no BIOS calls, no int 0x13. It still works."] }
];

const RDFILES = (function count(n) {
  return n.k.reduce((a, c) => a + (c.d ? count(c) : 1), 0);
})(FS.get("/rd/1"));
const Boot = {
  phase: "bios",      /* bios | devmenu | loader | kernel | desktop */
  t: 0, dev: 0, sel: 0, count: 0, lines: [], shown: 0, lineT: 0,
  swStart: 0, swMs: 0, best: null, biosStep: 0, mem: 0,
  cfg: { vmode: 2, disks: 0, dbg: 1, launcher: 1, rd: 0, mtrr: 1, ask: 0 },
  VMODES: ["640x480x32", "800x600x32", "1024x768x32", "1280x1024x32", "1440x900x32"],
  RDSRC: ["use the ramdisk from the boot device", "no ramdisk (network boot)",
          "use the ramdisk from /hd0/1/kolibrios"],
  start(fromLoader) {
    this.phase = fromLoader ? "loader" : "bios";
    this.t = 0; this.count = fromLoader ? 2500 : 5000;
    this.biosStep = 0; this.mem = 0; this.shown = 0; this.lineT = 0;
    this.swMs = 0;
    Screen.frameDirty = true;
  },
  key(k) {
    if (this.phase === "off") { poweredOff = false; this.start(false); return; }
    if (this.phase === "bios") {
      if (k === "F12") { this.phase = "devmenu"; this.count = 12000; }
      else this.count = 0;
      return;
    }
    if (this.phase === "devmenu") {
      const n = parseInt(k, 10);
      if (n >= 1 && n <= BOOTDEV.length) { this.dev = n - 1; this.phase = "loader"; this.count = 3500; }
      else if (k === "Escape" || k === "Enter") { this.phase = "loader"; this.count = 3500; }
      return;
    }
    if (this.phase === "loader") {
      const c = this.cfg;
      const map = { a: () => c.vmode = (c.vmode + 1) % this.VMODES.length,
                    b: () => c.disks ^= 1, c: () => c.dbg ^= 1,
                    d: () => c.launcher ^= 1, e: () => c.rd = (c.rd + 1) % 3,
                    f: () => c.mtrr ^= 1, g: () => c.ask ^= 1 };
      const num = { "1": "a", "2": "b", "3": "c", "4": "d", "5": "e", "6": "f", "7": "g" };
      const kk = (num[k] || k).toLowerCase();
      if (map[kk]) { map[kk](); this.count = Math.max(this.count, 4000); Snd.blip(600, 0.02); }
      else if (k === "Enter" || k === " ") this.launch();
      else this.count = Math.max(this.count, 6000);
      return;
    }
    if (this.phase === "kernel") { this.shown = this.lines.length; }
  },
  launch() {
    WM.wins.slice().forEach(w => WM.close(w));
    Proc.boot();
    Taskbar.H = Taskbar._h; Taskbar.menuOpen = false;
    Desktop.init(); Desktop.dirty = true;
    Net.up = false; Net.ip = "0.0.0.0";
    poweredOff = false;
    this.phase = "kernel";
    this.swStart = U.now();
    this.lines = this.kernelLines();
    this.shown = 0; this.lineT = 0;
    Snd.blip(180, 0.05);
  },
  kernelLines() {
    const d = BOOTDEV[this.dev], c = this.cfg;
    const L = [
      "Kolibri OS  " + KVER + "   " + KDATE,
      "kernel: 193536 bytes at 0x00010000, written in FASM, all of it",
      "cpu: family 6 model 15 stepping 11, 2400 MHz, i586 is the floor",
      "mem: " + RAM_TOTAL_KB + " Kb total, " + (RAM_TOTAL_KB - KERNEL_KB) + " Kb free, first-fit allocator"
    ];
    if (c.mtrr) L.push("mtrr: write-combining on the framebuffer, +40% blit");
    L.push("pit: 100 Hz. apic: present, not needed.");
    L.push("vesa: mode 0x118 " + this.VMODES[c.vmode] + ", lfb at 0xe0000000");
    L.push("ps2: keyboard ok. mouse ok, 3 buttons and a wheel.");
    d.extra.forEach(s => L.push(s));
    L.push("ata0: master, 2048 Mb, UDMA5. ahci: 1 port, 1 device.");
    L.push("fat32: /hd0/1 mounted rw, 2094 Mb free");
    L.push("iso9660: /cd0/1 mounted ro. ext4: none found. xfs: ro driver idle.");
    if (c.disks) L.push("bios disks: added 2 extra units the BIOS could see");
    L.push("usb: uhci 0xc040, ehci 0xfebf0000. usbhid: kbd, mouse.");
    L.push("sound: intel hda, codec 0x10ec0888, 48000 Hz, 2 ch");
    L.push("net: rtl8139 at 0xc000 irq 11, mac 52:54:00:12:34:56");
    L.push("tcpip: stack up. 4 sockets. tcp, udp, icmp, arp, dns.");
    L.push("ramdisk: " + d.rd + " -> 1434 Kb resident, " + RDFILES + " files");
    L.push("sched: 256 slots, 10 ms quantum, preemptive, priority bands");
    L.push("gui: default.skn loaded, 11776 bytes, 6 system colours");
    if (c.dbg) L.push("board: debug output duplicated to screen");
    if (c.launcher) L.push("launcher: /rd/1/@taskbar /rd/1/@docky /rd/1/@icon");
    L.push("autorun: @VOLUME NETWORK/ZEROCONF SOUND.SYS");
    L.push("free: " + (((RAM_TOTAL_KB - KERNEL_KB) / 1024) | 0) + " Mb. There is nothing else to load.");
    return L;
  },
  tick(dt) {
    this.t += dt;
    if (this.phase === "bios") {
      this.mem = Math.min(RAM_TOTAL_KB, this.mem + dt * 90);
      this.count -= dt;
      if (this.count <= 0 || (this.mem >= RAM_TOTAL_KB && this.t > 620)) {
        this.phase = "loader"; this.count = 3400;
      }
      Screen.frameDirty = true; return;
    }
    if (this.phase === "devmenu") {
      this.count -= dt;
      if (this.count <= 0) { this.phase = "loader"; this.count = 3500; }
      Screen.frameDirty = true; return;
    }
    if (this.phase === "loader") {
      this.count -= dt;
      if (this.count <= 0) this.launch();
      Screen.frameDirty = true; return;
    }
    if (this.phase === "kernel") {
      this.lineT += dt;
      const per = 62;
      while (this.lineT > per && this.shown < this.lines.length) { this.lineT -= per; this.shown++; }
      if (this.shown >= this.lines.length && this.lineT > 240) this.finish();
      Screen.frameDirty = true; return;
    }
  },
  finish() {
    this.swMs = U.now() - this.swStart;
    this.phase = "desktop";
    if (this.best === null || this.swMs < this.best) { this.best = this.swMs; State.save(); }
    Snd.startup();
    Board.log("K : boot complete in " + this.swMs.toFixed(0) + " ms");
    Net.bootUp();
    Screen.frameDirty = true;
    Desktop.dirty = true;
  },
  paint(g) {
    const p = this.phase;
    if (p === "off") {
      g.rect(0, 0, SW, SH, "#000000");
      tput(g, 24, 10, "The computer has been switched off.", "#787878");
      tput(g, 24, 12, "fn 18.9 — one call, and it did not ask twice.", "#4a4a4a");
      const bw = 22 * TXW;
      g.rect(TX0 + 24 * TXW, TY0 + 15 * TXH, bw, TXH + 8, "#101820");
      g.frame(TX0 + 24 * TXW, TY0 + 15 * TXH, bw, TXH + 8, "#2c3f52");
      tput(g, 26, 15, "Press any key to boot", "#5ee8d0");
      return;
    }
    if (p === "bios") {
      g.rect(0, 0, SW, SH, "#000000");
      tput(g, 0, 1, " Award Modular BIOS v6.00PG, An Energy Star Ally", "#c8c8c8");
      tput(g, 0, 2, " Copyright (C) 1984-2001, Award Software, Inc.", "#787878");
      tput(g, 0, 4, " Main Processor  : Pentium III 2400 MHz", "#c8c8c8");
      tput(g, 0, 5, " Memory Testing  : " + (this.mem | 0) + "K OK", "#c8c8c8");
      if (this.mem >= RAM_TOTAL_KB) {
        tput(g, 0, 7, " Primary Master  : QEMU HARDDISK  UDMA 5", "#c8c8c8");
        tput(g, 0, 8, " Secondary Master: QEMU DVD-ROM", "#c8c8c8");
        tput(g, 0, 10, " Booting from " + BOOTDEV[this.dev].name.split("  ")[0] + " ...", "#ffffff");
      }
      tput(g, 0, TROWS - 2, " Press F12 for the boot device menu, any key to hurry up", "#8a8a8a");
      return;
    }
    if (p === "devmenu") {
      g.rect(0, 0, SW, SH, "#000000");
      g.rect(TX0 + 12 * TXW, TY0 + 5 * TXH, 56 * TXW, 12 * TXH, "#0000a8");
      g.frame(TX0 + 12 * TXW, TY0 + 5 * TXH, 56 * TXW, 12 * TXH, "#c8c8c8");
      tput(g, 26, 6, "Select the boot device", "#ffffff");
      for (let i = 0; i < BOOTDEV.length; i++)
        tput(g, 14, 8 + i, " " + (i + 1) + ". " + BOOTDEV[i].name, i === this.dev ? "#ffff54" : "#c8c8c8");
      tput(g, 14, 15, " KolibriOS boots from all five. That is the point.", "#54fcfc");
      return;
    }
    if (p === "loader") {
      const c = this.cfg, BG = "#0000a8";
      g.rect(0, 0, SW, SH, BG);
      tput(g, 0, 0, U.pad("", TCOLS, " "), "#000000", "#a8a8a8");
      tput(g, 1, 0, "KolibriOS  " + KVER, "#000000");
      tput(g, TCOLS - 22, 0, "loader — " + KDATE, "#000000");
      const rows = [
        ["a", "Videomode", this.VMODES[c.vmode] + "  (VESA)"],
        ["b", "Add disks visible in BIOS", c.disks ? "on" : "off"],
        ["c", "Duplicate debug output to", c.dbg ? "screen" : "nothing"],
        ["d", "Start the launcher after load", c.launcher ? "/rd/1/launcher" : "no"],
        ["e", "Ramdisk", this.RDSRC[c.rd]],
        ["f", "MTRR optimisation", c.mtrr ? "on" : "off"],
        ["g", "Ask for parameters on boot", c.ask ? "yes" : "no"]
      ];
      tput(g, 2, 3, "Current settings:", "#ffffff");
      for (let i = 0; i < rows.length; i++) {
        const [k, n, v] = rows[i];
        tput(g, 2, 5 + i, "[" + k + "]", "#ffff54");
        tput(g, 6, 5 + i, n + " ".repeat(Math.max(1, 31 - n.length)) + ": ", "#c8c8c8");
        tput(g, 40, 5 + i, v, "#54fcfc");
      }
      tput(g, 2, 14, "[Enter] start KolibriOS now   [a]-[g] change a setting", "#ffffff");
      tput(g, 2, 15, "(the numbers 1-7 work too, and so does clicking)", "#7878d8");
      const secs = Math.max(0, this.count / 1000);
      tput(g, 2, 17, "Booting in " + secs.toFixed(1) + " s ", "#ffff54");
      const barw = 40, fill = Math.round(barw * (1 - Math.min(1, this.count / 3400)));
      tput(g, 18, 17, "[" + "█".repeat(fill) + "░".repeat(barw - fill) + "]", "#54fc54");
      tput(g, 2, 20, "Booting from: " + BOOTDEV[this.dev].name, "#c8c8c8");
      tput(g, 2, 22, "It will not ask you to agree to anything.", "#7878d8");
      return;
    }
    if (p === "kernel") {
      g.rect(0, 0, SW, SH, "#000000");
      const first = Math.max(0, this.shown - TROWS + 2);
      for (let i = first; i < this.shown; i++) {
        const s = this.lines[i];
        const col = i === 0 ? "#ffffff" : s.startsWith("free") ? "#54fc54"
                  : /^(net|tcpip)/.test(s) ? "#54fcfc" : "#a8a8a8";
        tput(g, 0, i - first, " " + s, col);
      }
      if (this.shown < this.lines.length) {
        tput(g, 1, this.shown - first, "█", "#a8a8a8");
      }
      return;
    }
  }
};

/* ==========================================================================
   SCREEN, INPUT AND THE COMPOSITOR
   ========================================================================== */
const cv = document.getElementById("screen");
const cx2 = cv.getContext("2d", { alpha: false });
cx2.imageSmoothingEnabled = false;
const GG = new Gfx(cx2);

const Screen = {
  frameDirty: true, scale: 1, ox: 0, oy: 0,
  fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let s = Math.min(vw / SW, vh / SH);
    if (s >= 1) s = Math.max(1, Math.floor(s * 2) / 2);
    cv.style.width = Math.round(SW * s) + "px";
    cv.style.height = Math.round(SH * s) + "px";
    this.scale = s;
  },
  toLogical(e) {
    const r = cv.getBoundingClientRect();
    return { x: U.clamp(((e.clientX - r.left) / r.width * SW) | 0, 0, SW - 1),
             y: U.clamp(((e.clientY - r.top) / r.height * SH) | 0, 0, SH - 1) };
  }
};
window.addEventListener("resize", () => Screen.fit());
Screen.fit();

const Mouse = { x: SW / 2, y: SH / 2, down: false, rdown: false, mdown: false, ox: 0, oy: 0 };

/* the KolibriOS pointer: an original arrow, hard-edged, no shadow */
const CURSORS = {
  arrow: ["k.........", "kk........", "kwk.......", "kwwk......", "kwwwk.....",
          "kwwwwk....", "kwwwwwk...", "kwwwwwwk..", "kwwwwwwwk.", "kwwwwkkkk",
          "kwwkwk....", "kwk.kwk...", "kk...kwk..", "k.....kk.."],
  text: ["kkk.kkk", "..kwk..", "..kwk..", "..kwk..", "..kwk..", "..kwk..",
         "..kwk..", "..kwk..", "..kwk..", "kkk.kkk"],
  busy: ["kkkkkkkkk", "kwwwwwwwk", ".kwwwwwk.", "..kwwwk..", "...kwk...",
         "..kwwwk..", ".kwwwwwk.", "kwwwwwwwk", "kkkkkkkkk"],
  hres: ["...k...k...", "..kk...kk..", ".kwkkkkkwk.", "kwwwwwwwwwk",
         ".kwkkkkkwk.", "..kk...kk..", "...k...k..."],
  vres: ["....k....", "...kwk...", "..kwwwk..", ".kkkwkkk.", "...kwk...",
         "...kwk...", ".kkkwkkk.", "..kwwwk..", "...kwk...", "....k...."]
};
let cursorKind = "arrow";
function drawCursor(g, x, y) {
  const c = CURSORS[cursorKind] || CURSORS.arrow;
  const ox = cursorKind === "arrow" ? 0 : -((c[0].length / 2) | 0);
  const oy = cursorKind === "arrow" ? 0 : -((c.length / 2) | 0);
  for (let r = 0; r < c.length; r++) for (let i = 0; i < c[r].length; i++) {
    const ch = c[r][i];

  }

/* --- the exhibit's own furniture: the boot stopwatch --------------------- */
const HUD = { rects: [], show: true };
function paintHUD(g) {
  if (!HUD.show) return;
  const items = [];
  const ms = Boot.swMs;
  const label = "boot " + ms.toFixed(0) + " ms";
  const best = Boot.best !== null ? "best " + Boot.best.toFixed(0) : "best —";
  items.push({ t: label, w: tw(label) + 14, id: null, hot: true });
  items.push({ t: best, w: tw(best) + 12, id: null });
  items.push({ t: "boot again", w: tw("boot again") + 12, id: "reboot" });
  items.push({ t: T("Exhibit"), w: tw(T("Exhibit")) + 12, id: "exhibit" });
  let total = 0; items.forEach(i => total += i.w + 2);
  let x = SW - total - 6;
  const y = 4, h = 18;
  g.rect(x - 4, y - 2, total + 8, h + 4, "#0a0f14c0");
  g.frame(x - 4, y - 2, total + 8, h + 4, "#2c3f52");
  HUD.rects = [];
  for (const it of items) {
    if (it.id) { g.rect(x, y, it.w, h, "#1b2836"); g.frame(x, y, it.w, h, "#3f5f7f"); }
    g.text(x + 6, y + 5, it.t, it.hot ? "#5ee8d0" : it.id ? "#a8c4d8" : "#7f93a8");
    if (it.id) HUD.rects.push({ x, y, w: it.w, h, id: it.id });
    x += it.w + 2;
  }
}

/* --- event plumbing ----------------------------------------------------- */
let lastClickT = 0, lastClickX = -99, lastClickY = -99;
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("mousemove", e => {
  const p = Screen.toLogical(e);
  Mouse.x = p.x; Mouse.y = p.y;
  Screen.frameDirty = true;
  onMove();
});
cv.addEventListener("mousedown", e => {
  e.preventDefault(); cv.focus();
  const p = Screen.toLogical(e);
  Mouse.x = p.x; Mouse.y = p.y;
  Snd.resume();
  if (e.button === 0) Mouse.down = true;
  if (e.button === 2) Mouse.rdown = true;
  if (e.button === 1) Mouse.mdown = true;
  const now = U.now();

    this.scrollTo(rows, cols);
    g.rect(x, y, w, h, s.field);
    g.bevel(x, y, w, h, "#00000040", "#ffffff40");
    if (opt.nums) { g.rect(x + 1, y + 1, gutter - 3, h - 2, s.workBtn); g.vline(x + gutter - 2, y + 1, h - 2, s.line); }
    g.clip(x + gutter, y + 2, w - gutter - 14, h - 4);
    for (let i = 0; i < rows; i++) {
      const li = this.top + i;
      if (li >= this.lines.length) break;
      const ln = this.lines[li];
      const ty = y + 3 + i * 11;
      if (li === this.cy && opt.hl !== false) g.rect(x + gutter, ty - 2, w - gutter - 14, 11, opt.hlcol || "#00000018");
      if (opt.asm) paintAsmLine(g, x + gutter - this.left * FW, ty, ln);
      else g.text(x + gutter - this.left * FW, ty, ln, s.fieldText);
    }
    g.unclip();
    if (opt.nums) for (let i = 0; i < rows; i++) {
      const li = this.top + i;
      if (li >= this.lines.length) break;
      g.rtext(x + gutter - 6, y + 3 + i * 11, String(li + 1), li === this.cy ? s.workText : s.line);
    }
    if (opt.focus !== false && ((U.now() / 480) | 0) % 2) {
      const crow = this.cy - this.top;
      if (crow >= 0 && crow < rows)
        g.rect(x + gutter + (this.cx - this.left) * FW, y + 2 + crow * 11, 1, 10, s.workGraph);
    }
    const view = rows;
    if (this.lines.length > view) {
      const trk = h - 4, maxOff = this.lines.length - view;
      const th2 = Math.max(10, (trk * view / this.lines.length) | 0);
      g.rect(x + w - 13, y + 1, 12, h - 2, s.workBtn);
      g.rect(x + w - 12, y + 2 + ((trk - th2) * this.top / maxOff) | 0, 10, th2, skin.btn);
    }
    return { rows, cols, gutter };
  },
  clickTo(mx, my, x, y, gutter) {
    this.cy = U.clamp(this.top + (((my - y - 2) / 11) | 0), 0, this.lines.length - 1);
    this.cx = U.clamp(this.left + Math.round((mx - x - gutter) / FW), 0, this.line().length);
  }
};
/* FASM syntax colouring: registers, instructions, numbers, strings, comments */
const ASM_KW = new Set(("mov add sub cmp jmp je jne jz jnz jg jge jl jle ja jae jb jbe " +
  "call ret push pop int inc dec and or xor not neg test shl shr sar imul mul div idiv " +
  "lea movzx movsx nop stc clc rep movsb stosb lodsb loop mcall").split(" "));
const ASM_REG = new Set(("eax ebx ecx edx esi edi ebp esp ax bx cx dx si di al ah bl bh cl ch dl dh").split(" "));
const ASM_DIR = new Set(("db dw dd dq rb rw rd org use32 use16 format binary as include " +
  "macro endm struc if else end times label equ align section public extrn").split(" "));
function paintAsmLine(g, x, y, ln) {
  const s = SC();
  const cm = ln.indexOf(";");
  const code = cm >= 0 ? ln.slice(0, cm) : ln;
  let i = 0, px = x;
  const re = /([A-Za-z_@.$][A-Za-z0-9_@.$]*|0x[0-9a-fA-F]+|\d+|'[^']*'|"[^"]*"|\s+|.)/g;
  let m;
  while ((m = re.exec(code))) {
    const t = m[0];
    let col = s.fieldText;
    const low = t.toLowerCase();
    if (/^\s+$/.test(t)) col = null;
    else if (ASM_KW.has(low)) col = skin.id === "night.skn" || skin.id === "amber.skn" ? "#7fd0ff" : "#0040c0";
    else if (ASM_REG.has(low)) col = "#c04000";
    else if (ASM_DIR.has(low)) col = "#008060";
    else if (/^0x|^\d/.test(t)) col = "#a000a0";
    else if (t[0] === "'" || t[0] === '"') col = "#b06000";
    if (col) g.text(px, y, t, col);
    px += t.length * FW;
  }
  if (cm >= 0) g.text(x + cm * FW, y, ln.slice(cm), skin.id === "amber.skn" ? "#8a5f00" : skin.id === "night.skn" ? "#5f7f8f" : "#707070");
}

const APPS = {};
function defApp(id, spec) { spec.id = id; APPS[id] = spec; return spec; }

/* ==========================================================================
   MODULE 14 — SOUND MANAGER
   --------------------------------------------------------------------------
   Web Audio, synthesized, cheap, and off in one click.  KolibriOS itself
   drives Intel HDA and AC'97; here a handful of oscillators stand in.
   ========================================================================== */
const Snd = {
  on: true, ctx: null, master: null,
  init() {
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.on = false; return null; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.16;
    this.master.connect(this.ctx.destination);
    return this.ctx;
  },
  resume() { if (this.on && this.init() && this.ctx.state === "suspended") this.ctx.resume(); },
  toggle() { this.on = !this.on; if (this.on) this.resume(); Taskbar.dirty = true; State.save(); Board.log("AC97: output " + (this.on ? "unmuted" : "muted")); },
  tone(freq, dur, type, vol, when) {
    if (!this.on || !this.init()) return;
    const c = this.ctx, t = (when || 0) + c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol === undefined ? 0.5 : vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol) {
    if (!this.on || !this.init()) return;
    const c = this.ctx, n = (c.sampleRate * dur) | 0;
    const b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), g = c.createGain();
    s.buffer = b; g.gain.value = vol === undefined ? 0.3 : vol;
    s.connect(g); g.connect(this.master); s.start();
  },
  blip(f, d) { this.tone(f || 880, d || 0.04, "square", 0.35); },
  click() { this.tone(1500, 0.018, "square", 0.13); },
  zap() { this.tone(220, 0.09, "sawtooth", 0.3); this.tone(660, 0.06, "square", 0.2); },
  thud() { this.noise(0.12, 0.35); this.tone(90, 0.13, "triangle", 0.4); },
  coin() { this.tone(988, 0.05, "square", 0.3); this.tone(1319, 0.11, "square", 0.28, 0.05); },
  startup() {
    /* the soft two-note blip a machine makes when it is pleased with itself */
    this.tone(523, 0.09, "triangle", 0.30);
    this.tone(784, 0.16, "triangle", 0.26, 0.09);
    this.tone(1046, 0.22, "sine", 0.18, 0.2);
  }
};

/* ==========================================================================
   MODULE 15 — STATE MANAGER
   --------------------------------------------------------------------------
   LocalStorage.  Files you created, sources you wrote, the skin, the
   wallpaper, window geometry, the language, high scores, and the best boot
   time you managed.  "Re-flash the floppy image" throws all of it away.
   ========================================================================== */
const KEY = "kolibrios.exhibit.v1";
const State = {
  scores: {}, geom: {}, saveT: 0, loaded: false,
  save() { this.saveT = 1; },          /* debounced; flushed by the main loop */
  flush() {
    this.saveT = 0;
    try {
      const extra = {};
      /* only the files that differ from the shipped image */
      for (const k in DATA) if (DATA[k] !== SHIPPED[k]) extra[k] = DATA[k];
      const newFiles = [];
      const walk = (node, path) => {
        for (const c of node.k) {
          const p = path + "/" + c.n;
          if (!SHIPPED_PATHS.has(p.toUpperCase())) newFiles.push([p, c.d ? -1 : c.s]);
          if (c.d) walk(c, p);
        }
      };
      for (const dev in FS.root) walk(FS.root[dev], FS.root[dev].n);
      localStorage.setItem(KEY, JSON.stringify({
        skin: skin.id, wall: Desktop.wall, lang, snd: Snd.on,
        best: Boot.best, scores: this.scores, geom: this.geom,
        dev: Boot.dev, cfg: Boot.cfg, files: extra, newFiles,
        net: { mode: Net.mode, ip: Net.ip, mask: Net.mask, gw: Net.gw, dns: Net.dns }
      }));
    } catch (e) { /* private browsing, a full quota — either way, carry on */ }
  },
  load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { s = null; }
    if (!s) return;
    if (s.skin) { const k = SKINS.find(x => x.id === s.skin); if (k) skin = k; }
    if (s.wall && WALLS.includes(s.wall)) Desktop.wall = s.wall;
    if (s.lang && LANGS.includes(s.lang)) lang = s.lang;
    if (typeof s.snd === "boolean") Snd.on = s.snd;
    if (typeof s.best === "number") Boot.best = s.best;
    if (s.scores) this.scores = s.scores;
    if (s.geom) this.geom = s.geom;
    if (typeof s.dev === "number") Boot.dev = U.clamp(s.dev, 0, BOOTDEV.length - 1);
    if (s.cfg) Object.assign(Boot.cfg, s.cfg);
    if (s.net) Object.assign(Net, s.net);
    if (s.newFiles) for (const [p, sz] of s.newFiles) {
      if (sz === -1) FS.mkdir(p);
      else { const dir = FS.get(FS.parentOf(p)); if (dir && dir.d) dir.k.push(FS.mkfile(p.split("/").pop(), sz, "txt")); }
    }
    if (s.files) for (const k in s.files) DATA[k] = s.files[k];
    this.loaded = true;
  },
  reset() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  },
  score(game, v, higher) {
    const cur = this.scores[game];
    if (cur === undefined || (higher ? v > cur : v < cur)) { this.scores[game] = v; this.save(); return true; }
    return false;
  }
};
const SHIPPED = Object.assign({}, DATA);
const SHIPPED_PATHS = new Set();
(function () {
  const walk = (node, path) => {
    for (const c of node.k) {
      const p = (path + "/" + c.n).toUpperCase();
      SHIPPED_PATHS.add(p);
      if (c.d) walk(c, path + "/" + c.n);
    }
  };
  for (const dev in FS.root) walk(FS.root[dev], FS.root[dev].n);
})();

/* ==========================================================================
   THE MAIN LOOP
   ========================================================================== */
let lastT = 0, fps = 60, fpsAcc = 0, fpsN = 0;
function frame(t) {
  const dt = Math.min(80, t - lastT || 16);
  lastT = t;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 500) { fps = 1000 / (fpsAcc / fpsN); fpsAcc = 0; fpsN = 0; }

  if (Boot.phase !== "desktop") {
    Boot.tick(dt);
  } else {
    Proc.tick(dt);
    Board.tick(dt);
    Notify.tick(dt);
    Net.tick(dt);
    for (const w of WM.wins) {
      if (w.app.tick) { try { if (w.app.tick(w, dt) !== false) w.dirty = true; } catch (e) { w.st._err = e; } }
    }
    if (State.saveT) State.flush();
  }
  paint();
  requestAnimationFrame(frame);
}

function paint() {
  if (Boot.phase !== "desktop") {
    Boot.paint(GG);
    if (Boot.phase === "kernel") {
      const ms = (U.now() - Boot.swStart).toFixed(0);
      GG.rect(SW - 150, 6, 144, 20, "#0a0f14d0");
      GG.frame(SW - 150, 6, 144, 20, "#2c3f52");
      GG.text(SW - 142, 12, "boot " + ms + " ms", "#5ee8d0");
    }
    Screen.frameDirty = false;
    return;
  }
  Desktop.paint(GG);
  const order = WM.wins.filter(w => !w.min).sort((a, b) => a.z - b.z);
  for (const w of order) {
    WM.paintFrame(GG, w);
    if (w.dirty) w.repaint();
    cx2.drawImage(w.canvas, w.cx, w.cy);
  }
  Notify.paint(GG);
  Taskbar.paint(GG);
  paintHUD(GG);
  drawCursor(GG, Mouse.x, Mouse.y);
  Screen.frameDirty = false;
}

function start() {
  Proc.boot();
  Desktop.init();
  State.load();
  Boot.start(false);
  Board.log("K : kernel " + KVER);
  requestAnimationFrame(frame);
}

function restartShell() {
  let did = false;
  if (!Proc.list.some(p => p.name === "@TASKBAR")) {
    Proc.list.push({ pid: Proc.nextPid++, name: "@TASKBAR", mem: 30, cpu: 0, threads: 1, sys: true, win: null, t: 0 });
    Taskbar.H = Taskbar._h; did = true;
    Board.log("K : /rd/1/@taskbar started");
  }
  if (!Proc.list.some(p => p.name === "@ICON")) {
    Proc.list.push({ pid: Proc.nextPid++, name: "@ICON", mem: 12, cpu: 0, threads: 1, sys: true, win: null, t: 0 });
    Desktop.init(); did = true;
    Board.log("K : /rd/1/@icon started");
  }
  if (did) { Desktop.dirty = true; Screen.frameDirty = true; Notify.push("Launcher", "Started the missing system processes again."); }
  return did;
}
function killProc(p) {
  if (p.win) { WM.close(p.win); return; }
  if (p.name === "@TASKBAR") {
    Proc.kill(p); Taskbar.H = 0; Taskbar.menuOpen = false;
    Notify.push("@taskbar terminated", "The desktop is still here — the taskbar was only a process. Double-click the wallpaper to start it again.", 9000);
    Board.log("K : @TASKBAR slot freed. Desktop unaffected.");
    Desktop.dirty = true; return;
  }
  if (p.name === "@ICON") {
    Proc.kill(p); Desktop.icons = []; Desktop.dirty = true;
    Notify.push("@icon terminated", "Desktop icons are drawn by a process too. Restart it from SysMon? No — double-click the wallpaper.", 8000);
    return;
  }
  Proc.kill(p);
  Board.log("K : slot for " + p.name + " freed by request");
}

/* ==========================================================================
   MODULE 13 — RESOURCE EXHIBIT: MEASURING ITSELF
   --------------------------------------------------------------------------
   The one thing this exhibit can do that an emulator cannot: weigh itself,
   live, and put the number next to the operating system's.
   ========================================================================== */
const Exhibit = {
  _b: null, _method: "",
  bytes() {
    if (this._b !== null) return this._b;
    try {
      const nav = performance.getEntriesByType("navigation")[0];
      if (nav && nav.decodedBodySize > 4096) {
        this._method = "measured over the wire, decoded";
        return (this._b = nav.decodedBodySize);
      }
    } catch (e) { /* file:// has no navigation timing worth having */ }
    if (SELF_BYTES_BAKED > 4096) {
      this._method = "exact, as written to disk";
      return (this._b = SELF_BYTES_BAKED);
    }
    const s = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    this._method = "estimated from the live document";
    try { return (this._b = new Blob([s]).size); } catch (e) { return (this._b = s.length); }
  },
  how() { this.bytes(); return this._method; }
};

function curKid(st) { return st._kids && st._kids[st.fl ? st.fl.sel : 0]; }

}
function launchFile(path, node) {
  const t = node.t, nm = node.n.toUpperCase();
  const asApp = { EOLITE: "eolite", KFM: "kfm", KFAR: "kfar", BOARD: "board", CALC: "calc",

    KIV: "kiv", FB2READ: "fb2read", FPLAY: "fplay", AC97SND: "ac97snd", MIXER: "mixer",

    KMAZE: "kmaze", K3D: "k3d", SKYHAWK: "skyhawk", "15PUZZLE": "puzzle15", MINE: "mine",
    SNAKE: "snake", FBLOCKS: "fblocks", TANKS: "tanks", REVERSI: "reversi", CHESS: "chess",
    SUDOKU: "sudoku", DINO: "dino", FIRE: "fire", PLASMA: "plasma", CUBE3D: "cube3d",
    LIFE2: "life", TROLO: "trolo", ACLOCK: "aclock", ICONEDIT: "iconedit" }[nm];
  if (asApp) { WM.open(asApp); return; }
  if (t === "exe") { Notify.push("Not in this exhibit", node.n + " is a real KolibriOS program; this simulation does not include a stand-in for it.", 6000); return; }
  if (t === "asm" || t === "inc") { WM.open("fasm", { arg: path }); return; }
  if (t === "txt" || t === "ini" || t === "dat") { WM.open("tinypad", { arg: path }); return; }
  if (t === "htm") { WM.open("webview", { arg: "file://" + path.toLowerCase() }); return; }
  if (t === "fb2") { WM.open("fb2read"); return; }
  if (t === "png" || t === "img") { WM.open("kiv", { arg: path }); return; }
  if (t === "wav" || t === "mod") { WM.open("ac97snd"); return; }
  if (t === "vid") { WM.open("fplay"); return; }
  if (t === "krn") { WM.open("ksource"); return; }
  if (t === "skn") { WM.open("desktopcfg"); return; }
  Notify.push("@open", "No association for " + node.n + " (" + ftype(node) + ")");
