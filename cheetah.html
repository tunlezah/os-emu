<script>
/* ---------------------------------------------------------------------- Mail */
OS.Apps.register({
  id:'mail', name:'Mail', icon:'mail',
  about(){ OS.WS.alert({icon:'mail',head:'Mail 1.0',text:'The OS X original: pinstripes, oversized toolbar icons, and a mailbox DRAWER. Drawers are peak 2001.'}); },
  MSGS:{
    INBOX:[
      {from:'Apple Computer',subj:'Welcome to Mac OS X',date:'Mar 24, 2001',body:'Dear Mac user,\n\nWelcome to Mac OS X, the world’s most advanced operating system.\n\nMac OS X combines the power and stability of UNIX with the legendary simplicity of the Macintosh. Beneath the stunning new Aqua interface you will find protected memory, preemptive multitasking, and the Darwin core.\n\nOver the coming months we will deliver free updates adding CD burning, DVD playback, and more. iTunes and iMovie for Mac OS X will arrive with a major update later this year.\n\nThank you for being first.\n\n— The Mac OS X Team\n\nP.S. The Trash is in the Dock now. We moved it. It’s better. Trust us.',unread:true},
      {from:'Raj (IT)',subj:'RE: where did the apple menu go??',date:'Mar 26, 2001',body:'> the apple menu is GONE and there’s some kind of jelly menu\n> where my control panels used to be. also my window shade\n> doesn’t work. HELP\n\nOkay, deep breaths:\n\n1. The logo menu is back on the LEFT (it was centered in the beta, we don’t talk about that).\n2. Control Panels are now “System Preferences” — the gear-ish icon in the Dock.\n3. Windowshade is gone. Double-clicking the title bar now MINIMIZES the window into the Dock. Watch it do the genie thing. Honestly worth the upgrade alone.\n4. Your Quake framerate will recover eventually. It’s a 1.0.\n\n— Raj',unread:true},
      {from:'MacNN Newsletter',subj:'This week: 10.0 reviews are in',date:'Apr 2, 2001',body:'THE WEEK IN MAC — April 2, 2001\n\n• Reviews agree: Aqua is gorgeous, the Dock is controversial, and everyone is waiting for CD burning. “A stunning foundation with 1.0 rough edges,” says everyone, in unison.\n\n• Tip of the week: hold Option and click the green button — actually, no, that does nothing yet. Hold ⌘ and double-click a folder to open it in a new window like the old days.\n\n• Rumor mill: 10.0.1 within weeks. iTunes for X “this summer.” A faster Finder “eventually.”',unread:false},
      {from:'kodiak@beta.example',subj:'they moved my logo',date:'Apr 5, 2001',body:'i had one job in the public beta. sit in the middle of the menu bar. look decorative.\n\nsix months. that’s all i got.\n\nanyway if you miss me, i hear there’s a hidden setting. option-click around the General preferences. not that i’m telling you to.\n\n— k.',unread:true},
    ],
    Drafts:[
      {from:'(you)',subj:'Re: Switching my whole lab to OS X',date:'Apr 6, 2001',body:'Dear Professor —\n\nI have installed Mac OS X 10.0 on the G4 as requested. Notes so far:\n\n- The Terminal is REAL UNIX. tcsh! I ran ps aux and wept.\n- Printing is… let’s say “forthcoming.”\n- The genie effect has cost the lab approximately 4 person-hours this week.\n\nRecommendation: dual-boot with 9.1 until 10.0.1, then',unread:false}
    ],
    Sent:[
      {from:'(you) → Raj',subj:'where did the apple menu go??',date:'Mar 26, 2001',body:'the apple menu is GONE and there’s some kind of jelly menu where my control panels used to be. also my window shade doesn’t work. HELP',unread:false}
    ]
  },
  menus(){ const M=this; return [
    {title:'File',items:()=>[{l:'New Message',k:'⌘N',act:()=>M.compose()},{l:'Close',k:'⌘W',act:()=>{if(OS.WS.active)OS.WS.close(OS.WS.active);}},{sep:1},{l:'Save As Draft',k:'⌘S',dis:true}]},
    {title:'Edit',items:()=>[{l:'Copy',k:'⌘C',act:()=>document.execCommand('copy')},{l:'Select All',k:'⌘A',dis:true}]},
    {title:'Mailbox',items:()=>[
      {l:'Get New Mail in Account',k:'⌘⇧N',act:()=>{ toast('Checking mail… POP server “mail.example” has nothing new. It is 2001; check again after lunch.'); }},
      {sep:1},{l:'Show Drawer',act:()=>M.toggleDrawer(true)},{l:'Hide Drawer',act:()=>M.toggleDrawer(false)}]},
    {title:'Message',items:()=>[{l:'Reply',k:'⌘R',act:()=>M.compose(true)},{l:'Reply All',k:'⇧⌘R',dis:true},{l:'Forward',k:'⇧⌘F',dis:true},{sep:1},{l:'Delete',k:'⌫',act:()=>toast('Message moved to Deleted Messages. Metaphorically.')}]},
    {title:'Window',items:()=>[{l:'Minimize Window',k:'⌘M',act:()=>{if(OS.WS.active)OS.WS.minimize(OS.WS.active);}}]}
  ];},
  win:null, box:'INBOX', drawerOpen:true,
  launch(){
    const M=this;
    const w=OS.WS.create({title:'INBOX (4 messages)',x:150,y:60,w:560,h:420,app:'mail',minW:440,minH:300,remember:'mail'});
    M.win=w;
    w.el.style.overflow='visible';
    // the drawer — slides out the side
    const drawer=el('div','drawer');
    drawer.style.left='100%';
    drawer.innerHTML='<div class="dh">MAILBOXES</div>';
    ['INBOX','Drafts','Sent'].forEach(b=>{
      const r=el('div','mbrow'+(b===M.box?' sel':''),`${Icons.svg(b==='INBOX'?'mail':'folder',16)}<span>${b}</span>${b==='INBOX'?'<span style="margin-left:auto;color:inherit;font-size:10px">('+M.MSGS.INBOX.filter(m=>m.unread).length+')</span>':''}`);
      r.onclick=()=>{ M.box=b; $$('.mbrow',drawer).forEach(x=>x.classList.remove('sel')); r.classList.add('sel'); M.renderList(); };
      drawer.appendChild(r);
    });
    w.el.appendChild(drawer);
    M.drawer=drawer;
    // toolbar with oversized icons
    const tb=el('div','ftoolbar');
    const mkbtn=(label,svg,act)=>{
      const b=el('div','ftb',`<svg viewBox="0 0 64 64" width="30" height="30">${svg}</svg><span>${label}</span>`);
      b.onclick=act; tb.appendChild(b); return b;
    };
    mkbtn('Delete',Icons.shape('trash'),()=>toast('Deleted. (Not really — museum policy.)'));
    mkbtn('Reply','<circle cx="32" cy="32" r="24" fill="url(#gelsphere)"/><path d="M38 22 L24 32 L38 42 M24 32 h16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>',()=>M.compose(true));
    mkbtn('Compose',Icons.shape('textedit'),()=>M.compose());
    mkbtn('Get Mail',Icons.shape('mail'),()=>toast('Checking mail… nothing new on the simulated POP server.'));
    const spacer=el('div'); spacer.style.flex='1'; tb.appendChild(spacer);
    mkbtn('Mailbox','<rect x="10" y="18" width="44" height="30" rx="4" fill="url(#foldg)" stroke="#2a55a8"/><path d="M10 26 h44" stroke="#2a55a8"/>',()=>M.toggleDrawer());
    w.body.appendChild(tb);
    const list=el('div','scroll'); list.style.cssText='flex:0 0 45%;overflow-y:auto;border-bottom:2px solid #999;background:#fff;font-size:12px;';
    const view=el('div','scroll'); view.style.cssText='flex:1;overflow-y:auto;background:#fff;padding:12px 16px;font-size:12px;white-space:pre-wrap;';
    w.body.appendChild(list); w.body.appendChild(view);
    M.list=list; M.view=view;
    M.renderList();
    setTimeout(()=>M.toggleDrawer(true),400);
    w.opts.onClosed=()=>{ M.win=null; OS.Apps.quit('mail'); };
  },
  toggleDrawer(force){
    const M=this;
    M.drawerOpen = force!==undefined? force: !M.drawerOpen;
    if(!M.drawer) return;
    OS.Sound.whoosh(.25);
    M.drawer.style.transform=M.drawerOpen? 'translateX(0)':'translateX(-100%)';
    M.drawer.style.transition='transform .3s ease';
  },
  renderList(){
    const M=this;
    const msgs=M.MSGS[M.box];
    OS.WS.setTitle(M.win, M.box+' ('+msgs.length+' message'+(msgs.length===1?'':'s')+')');
    M.list.innerHTML=`<div class="lhead2"><div class="lc" style="flex:0 0 150px">From</div><div class="lc n">Subject</div><div class="lc" style="flex:0 0 90px">Date</div></div>`;
    msgs.forEach((m,i)=>{
      const r=el('div','lrow');
      r.innerHTML=`<div class="lc" style="flex:0 0 150px;${m.unread?'font-weight:bold':''}">${m.unread?'• ':''}${esc(m.from)}</div>
        <div class="lc n" style="${m.unread?'font-weight:bold':''}">${esc(m.subj)}</div><div class="lc" style="flex:0 0 90px">${esc(m.date)}</div>`;
      r.onclick=()=>{
        $$('.lrow',M.list).forEach(x=>x.classList.remove('sel')); r.classList.add('sel');
        m.unread=false;
        M.view.innerHTML=`<div style="border-bottom:1px solid #ddd;margin-bottom:10px;padding-bottom:8px;color:#444">
          <b>From:</b> ${esc(m.from)}<br><b>Subject:</b> ${esc(m.subj)}<br><b>Date:</b> ${esc(m.date)}, 2001</div>`+esc(m.body);
        r.innerHTML=r.innerHTML.replace('• ','').replace(/font-weight:bold/g,'');
        r.classList.add('sel');
      };
      M.list.appendChild(r);
    });
    M.view.innerHTML='<span style="color:#888">No message selected</span>';
  },
  compose(reply){
    const w=OS.WS.create({title:reply?'Re: (reply)':'New Message',x:220,y:120,w:440,h:320,app:'mail',minW:320,minH:200});
    w.body.innerHTML=`<div style="padding:8px 12px;border-bottom:1px solid #ccc;font-size:12px;background:repeating-linear-gradient(180deg,#f6f6f6 0 2px,#ececec 2px 4px)">
      <div style="margin:2px 0"><b>To:</b> <input class="tf" style="width:70%" value="${reply?'raj@example':''}"></div>
      <div style="margin:2px 0"><b>Subject:</b> <input class="tf" style="width:66%" value="${reply?'Re: where did the apple menu go??':''}"></div></div>`;
    const ta=el('textarea'); ta.style.cssText='flex:1;border:none;outline:none;resize:none;padding:10px 12px;font:12px \'Lucida Grande\',Verdana,sans-serif;';
    w.body.appendChild(ta);
    const row=el('div','btnrow');
    const send=el('div','abtn def','Send');
    send.onclick=()=>{ OS.Sound.whoosh(.3); OS.WS.destroy(w); toast('Message sent into the simulated void. It says hi.'); };
    row.appendChild(send); w.body.appendChild(row);
  }
});

/* ------------------------------------------------------------------- Sherlock */
OS.Apps.register({
  id:'sherlock', name:'Sherlock', icon:'sherlock',
  about(){ OS.WS.alert({icon:'sherlock',head:'Sherlock 2',text:'Find files. Search the internet. Buy things, apparently. Channels were the future once.'}); },
  menus(){ return [
    {title:'File',items:()=>[{l:'Close',k:'⌘W',act:()=>{if(OS.WS.active)OS.WS.close(OS.WS.active);}}]},
    {title:'Channels',items:()=>[{l:'Files',act(){}},{l:'Internet',act(){}},{l:'People',act(){}},{l:'Shopping',act(){}}]}
  ];},
  launch(){
    const S=this;
    const w=OS.WS.create({title:'Sherlock',x:160,y:80,w:540,h:400,app:'sherlock',minW:440,minH:300,pinstripe:true,remember:'sherlock'});
    let channel='files';
    const chanbar=el('div'); chanbar.style.cssText='flex:0 0 54px;display:flex;align-items:center;gap:10px;padding:4px 14px;border-bottom:1px solid #aaa;';
    const mkchan=(id,label,inner)=>{
      const c=el('div','',`<svg viewBox="0 0 64 64" width="34" height="34">${inner}</svg>`);
      c.title=label; c.style.cssText='padding:3px;border-radius:8px;'+(id===channel?'background:rgba(80,130,220,.3);':'');
      c.onclick=()=>{ channel=id; $$('div',chanbar).forEach(x=>x.style.background=''); c.style.background='rgba(80,130,220,.3)'; hint(); };
      chanbar.appendChild(c);
    };
    mkchan('files','Files',Icons.shape('hd'));
    mkchan('internet','Internet','<circle cx="32" cy="32" r="24" fill="url(#gelsphere)"/><path d="M8 32h48M32 8v48M14 18q18 10 36 0M14 46q18-10 36 0" stroke="#dceaff" fill="none" stroke-width="2"/>');
    mkchan('people','People',Icons.shape('user'));
    mkchan('shopping','Shopping','<path d="M14 20 h36 l-4 26 h-28 z" fill="url(#aquab)" stroke="#1c4590"/><path d="M22 20 q0 -10 10 -10 q10 0 10 10" fill="none" stroke="#1c4590" stroke-width="3"/>');
    w.body.appendChild(chanbar);
    const srow=el('div'); srow.style.cssText='display:flex;gap:8px;padding:10px 14px;align-items:center;';
    const inp=el('input','tf'); inp.style.flex='1'; inp.placeholder='Search words';
    const go=el('div','abtn def','Search');
    srow.appendChild(inp); srow.appendChild(go);
    w.body.appendChild(srow);
    const res=el('div','scroll'); res.style.cssText='flex:1;margin:0 14px 8px;border:1px solid #999;background:#fff;overflow-y:auto;font-size:12px;';
    w.body.appendChild(res);
    const status=el('div','fstatus','');
    w.body.appendChild(status);
    const hint=()=>{ res.innerHTML='<div style="padding:10px;color:#888">'+({files:'Search the simulated volumes for files.',internet:'Search the 2001 internet (results may be extremely 2001).',people:'Find people. Two are findable.',shopping:'Compare prices across the finest fake retailers.'}[channel])+'</div>'; };
    hint();
    const searchFiles=(q)=>{
      const out=[];
      const walk=(node,path)=>{
        OS.VFS.kids(node,true).forEach(k=>{
          const p=path+'/'+k.name;
          if(k.name.toLowerCase().includes(q)) out.push({name:k.name,path:p,node:k});
          if(k.children) walk(k,p);
        });
      };
      OS.VFS.volumes.forEach(v=>walk(v,v===OS.VFS.root?'':'/Volumes/'+v.name));
      return out;
    };
    go.onclick=()=>{
      const q=inp.value.trim().toLowerCase();
      if(!q) return;
      OS.WS.beach(600);
      res.innerHTML='<div style="padding:10px;color:#888">Searching…</div>';
      setTimeout(()=>{
        if(channel==='files'){
          const hits=searchFiles(q);
          res.innerHTML=hits.length? '':'<div style="padding:10px;color:#888">No files found.</div>';
          hits.slice(0,60).forEach(h=>{
            const r=el('div','lrow',`<div class="lc n">${Icons.svg(OS.VFS.iconOf(h.node),16)}${esc(h.name)}</div><div class="lc" style="flex:0 0 55%;color:#666">${esc(h.path)}</div>`);
            r.ondblclick=()=>OS.Finder.openNode(h.node);
            res.appendChild(r);
          });
          status.textContent=hits.length+' items found';
        } else if(channel==='internet'){
          const fake=[
            ['Mac OS X 10.0 review — “Aqua dreams, 1.0 reality”','www.macreview2001.example/osx',96],
            ['Petition: bring back the Apple menu (12,483 signatures)','www.petitionsonline.example/applemenu',91],
            ['HOWTO: dual-boot Mac OS 9.1 and Mac OS X','www.macgeekery.example/dualboot',88],
            ['GeoCities — my first Mac OS X page (under construction)','www.geocities.example/SiliconValley/4K78',74],
            ['Winamp for Mac? No, but here’s Audion','www.mp3software.example/audion',60],
            ['Your search: “'+esc(inp.value)+'” — 0.4 seconds','www.altavista.example',55]
          ];
          res.innerHTML='';
          fake.forEach(([t,u,rel])=>{
            const r=el('div','lrow',`<div class="lc n"><span style="color:#1a55c0;text-decoration:underline">${t}</span></div><div class="lc" style="flex:0 0 34%;color:#2a7a2a">${u}</div><div class="lc" style="flex:0 0 50px;text-align:right">${rel}%</div>`);
            r.ondblclick=()=>OS.Apps.launch('browser',{url:'search'});
            res.appendChild(r);
          });
          status.textContent='6 sites found on the 2001 internet';
        } else if(channel==='people'){
          res.innerHTML='';
          [['Demo User','demo@localhost','Cupertino-adjacent'],['Kodiak Beta','kodiak@beta.example','The menu bar, center']].forEach(([n,e,c])=>{
            res.appendChild(el('div','lrow',`<div class="lc n">${esc(n)}</div><div class="lc" style="flex:0 0 34%">${esc(e)}</div><div class="lc" style="flex:0 0 30%;color:#666">${esc(c)}</div>`));
          });
          status.textContent='2 people found';

    w.el.classList.add('qtwin');
    w.body.style.background='transparent';
    const cv=document.createElement('canvas'); cv.width=320; cv.height=220;
    cv.style.cssText='margin:8px auto 0;display:block;background:#000;border:1px solid #555;';
    w.body.appendChild(cv);
    const x=cv.getContext('2d');
    let playing=true,t0=performance.now(),raf;
    const draw=(now)=>{
      const t=(now-t0)/1000;
      x.fillStyle='#000'; x.fillRect(0,0,320,220);
      // a little generated film: bouncing aqua orb over gradient dunes
      const g=x.createLinearGradient(0,120,0,220); g.addColorStop(0,'#1c3a78'); g.addColorStop(1,'#0a1c40');
      x.fillStyle=g; x.fillRect(0,120,320,100);
      for(let i=0;i<3;i++){
        x.fillStyle=`rgba(90,140,220,${.25-i*.07})`;
        x.beginPath(); x.moveTo(0,150+i*22);
        for(let px=0;px<=320;px+=8) x.lineTo(px,150+i*22+Math.sin(px/40+t*(1+i*.3))*8);
        x.lineTo(320,220); x.lineTo(0,220); x.fill();
      }
      const bx=160+Math.sin(t*.9)*110, by=90+Math.abs(Math.sin(t*2.2))*-60+40;
      const bg=x.createRadialGradient(bx-8,by-10,2,bx,by,26);
      bg.addColorStop(0,'#e8f4ff'); bg.addColorStop(.5,'#77aaee'); bg.addColorStop(1,'#2a5cb8');
      x.fillStyle=bg; x.beginPath(); x.arc(bx,by,24,0,7); x.fill();
      x.fillStyle='rgba(255,255,255,.5)'; x.beginPath(); x.ellipse(bx-6,by-12,12,6,0,0,7); x.fill();
      x.fillStyle='#889'; x.font='9px Verdana';
      x.fillText('gel.mov — generated live on a canvas, like all good 2001 cinema',12,212);
      if(playing) raf=requestAnimationFrame(draw);
    };
    raf=requestAnimationFrame(draw);
    const ctl=el('div','qtctl');
    const knob=el('div','qtknob','▶');
    knob.onclick=()=>{ playing=!playing; knob.textContent=playing?'▶':'❚❚';
      if(playing){ t0=performance.now()-((t0-performance.now())); raf=requestAnimationFrame(draw);} else cancelAnimationFrame(raf); };
    knob.textContent='❚❚';
    const tl=el('div'); tl.style.cssText='flex:1;height:8px;border-radius:4px;background:linear-gradient(#666,#999);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);position:relative;';

    vol.onclick=()=>OS.Sound.alert();
    ctl.appendChild(knob); ctl.appendChild(tl); ctl.appendChild(vol);
    w.body.appendChild(ctl);
    w.opts.onClosed=()=>cancelAnimationFrame(raf);
  },

  ];},
  TAUNTS:['I have seen better openings at a supermarket.','Interesting. Bold. Doomed.','My evaluation function just sighed.','That pawn had a family.','I am but a humble simulation, and even I saw that coming.','Bobby Fischer would like a word. Several words.','Checkmate is a journey. Yours is a short one.'],
  launch(){
    const C=this;
    const w=OS.WS.create({title:'Chess',x:250,y:60,w:380,h:430,app:'chess',resizable:false,pinstripe:true,remember:'chess'});
    const wrap=el('div'); wrap.style.cssText='padding:20px 26px 10px;position:relative;';
    const board=el('div','chessboard');
    const START=['♜♞♝♛♚♝♞♜','♟♟♟♟♟♟♟♟','','','','','♙♙♙♙♙♙♙♙','♖♘♗♕♔♗♘♖'];
    const cells=[];
    let sel=null,moves=0;
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){
      const sq=el('div','csq '+((r+c)%2?'d':'l'));
      const pc=START[r][c]||'';
      if(pc) sq.innerHTML=`<span class="pc" style="color:${r<2?'#222':'#f8f8f8'}">${pc}</span>`;
      sq.onclick=()=>{
        if(sel===sq){ sq.classList.remove('sel'); sel=null; return; }
        if(sel&&$('.pc',sel)){
          sq.innerHTML=sel.innerHTML; sel.innerHTML=''; sel.classList.remove('sel'); sel=null;
          OS.Sound.click(); moves++;
          if(OS.State.get('chessTaunt',true)&&Math.random()<.55) setTimeout(()=>C.taunt(wrap),700);
          if(Math.random()<.6) setTimeout(()=>C.reply(cells),900);
        } else if($('.pc',sq)){ if(sel)sel.classList.remove('sel'); sel=sq; sq.classList.add('sel'); }
      };
      cells.push(sq); board.appendChild(sq);
    }
    wrap.appendChild(board);
    w.body.appendChild(wrap);
    w.body.appendChild(el('div','fstatus','White to move — drag rules: relaxed, museum edition'));
  },
  reply(cells){
    const blacks=cells.filter(s=>{const p=$('.pc',s); return p&&p.style.color.includes('34')===false&&'♜♞♝♛♚♟'.includes(p.textContent);});
    const empt=cells.filter(s=>!$('.pc',s));
    if(!blacks.length||!empt.length) return;
    const from=blacks[Math.floor(Math.random()*blacks.length)];
    const to=empt[Math.floor(Math.random()*empt.length)];
    to.innerHTML=from.innerHTML; from.innerHTML='';
    OS.Sound.click();
  },
  taunt(wrap){
    $$('.chessbubble',wrap).forEach(b=>b.remove());
    const b=el('div','chessbubble',esc(this.TAUNTS[Math.floor(Math.random()*this.TAUNTS.length)]));
    b.style.cssText+=`left:${20+Math.random()*160}px;top:${10+Math.random()*40}px;`;
    wrap.appendChild(b);
    setTimeout(()=>b.remove(),3800);
  }
});

/* ---------------------------------------------------------- Classic environment */
OS.Classic={
  running:false, starting:false,
  EXT_COLORS:['#e86868','#e0a03c','#78c058','#5a95e6','#9a6ae0','#e07ab8','#5ac8c8','#c8b858','#8a8a8a','#e8945a','#68b8e8','#a0d858'],
  launch(node){
    if(this.running){ this.openApp(node); return; }
    this.start(()=>this.openApp(node));
  },
  start(cb){
    if(this.running){ if(cb)cb(); return; }
    if(this.starting) return;
    this.starting=true;
    const w=OS.WS.create({title:'Classic Environment',x:innerWidth/2-210,y:130,w:420,h:300,app:OS.Apps.current,resizable:false,lights:{m:1,z:false,c:1},pinstripe:true});
    w.body.innerHTML=`
      <div style="padding:10px 16px 4px;font-size:12px">Classic is starting…</div>
      <div style="margin:6px 16px;border:1px solid #888;background:#7788bb;position:relative;height:190px;overflow:hidden" id="c9screen">
        <div style="position:absolute;inset:0;background:linear-gradient(135deg,#8899cc,#6677aa)"></div>
        <div style="position:absolute;left:50%;top:34px;transform:translateX(-50%);text-align:center">
          <div style="width:190px;padding:14px 12px;background:#e8e8e8;border:2px solid #555;border-radius:6px;box-shadow:2px 2px 0 #445">
            <div style="font-size:14px;font-weight:bold;color:#223;font-family:'Charcoal','Lucida Grande',sans-serif">Mac OS 9.1</div>
            <div style="font-size:9px;color:#556;margin:2px 0 8px">Welcome to Mac OS (inside Mac OS X)</div>
            <div class="c9prog"><div class="f" id="c9fill" style="width:0%"></div></div>
          </div>
        </div>
        <div class="extparade" style="position:absolute;left:6px;bottom:2px" id="extparade"></div>
      </div>`;
    const row=el('div','btnrow');
    const stopb=el('div','abtn','Stop');
    stopb.onclick=()=>{ this.starting=false; OS.WS.destroy(w); };
    row.appendChild(stopb);
    w.body.appendChild(row);
    let pct=0, exts=0;
    const tm=setInterval(()=>{
      if(!document.contains(w.el)){ clearInterval(tm); this.starting=false; return; }
      pct+=Math.random()*7;
      $('#c9fill',w.el).style.width=Math.min(100,pct)+'%';
      // the extensions parade, miniature
      if(exts<14&&Math.random()<.8){
        const e=el('div','ext'); e.style.background=this.EXT_COLORS[exts%this.EXT_COLORS.length];
        e.style.border='1px solid rgba(0,0,0,.4)'; e.style.borderRadius='4px';
        e.title=['QuickTime™','Appearance','Sound Manager','ATI Driver','AppleShare','ColorSync','Text Encoding','Internet Config','OpenGL','FontSync','Speech Manager','USB Support','Iomega Driver','That One INIT'][exts];
        $('#extparade',w.el).appendChild(e);
        exts++;
      }
      if(pct>=100){
        clearInterval(tm);
        this.running=true; this.starting=false;
        setTimeout(()=>{ OS.WS.destroy(w); toast('Classic is now running. Mac OS 9.1 hums along inside Mac OS X, dreaming of extensions.'); if(cb)cb(); },600);
      }
    },200);
  },
  stop(){
    this.running=false;
    OS.WS.wins.filter(w=>w.classicApp).forEach(w=>OS.WS.destroy(w));
    toast('Classic has shut down.');
  },
  openApp(node){
    // a Platinum-styled window inside Aqua — the era collision, on purpose
    const w=OS.WS.create({title:'',x:220,y:120,w:420,h:300,app:OS.Apps.current,lights:{c:false,m:false,z:false},minW:280,minH:160});
    w.classicApp=true;
    w.el.style.borderRadius='0';
    w.el.style.boxShadow='2px 2px 0 rgba(0,0,0,.35)';
    const tb=$('.tbar',w.el);
    tb.style.cssText='height:19px;flex:0 0 19px;border-radius:0;border-bottom:1px solid #333;background:repeating-linear-gradient(180deg,#ddd 0 1px,#fff 1px 2px,#ddd 2px 3px);display:flex;align-items:center;';
    $('.tls',w.el).style.display='none';
    $('.ttl',w.el).style.cssText='position:static;flex:1;text-align:center;font-size:12px;font-weight:normal;color:#000;background:#ddd;padding:0 8px;';
    OS.WS.setTitle(w,'SimpleText (Classic)');
    const cbox=el('div','',''); cbox.style.cssText='position:absolute;left:6px;top:3px;width:12px;height:12px;border:1px solid #333;background:#ddd;';
    cbox.onclick=()=>OS.WS.close(w);
    tb.appendChild(cbox);
    const ta=el('textarea');
    ta.style.cssText='flex:1;border:none;outline:none;resize:none;padding:8px;font:12px Geneva,Verdana,sans-serif;background:#fff;';
    ta.value='Greetings from 1999!\n\nThis document is open in a Classic application. Note the Platinum window frame: no gel buttons, no shadows, no pinstripes. A whole different operating system is (pretending to be) running underneath this window.\n\nWhen you click a Mac OS X window, the menu bar will turn back into Aqua. Try it. Time travel via mouse click.';
    w.body.appendChild(ta);
  }
};
OS.Apps.register({
  id:'classicapp', name:'SimpleText (Classic)', icon:'classic',
  menus(){ return []; },
  launch(){ OS.Classic.launch(null); OS.Apps.quit&&delete OS.Apps.running['classicapp']; OS.Dock.markRunning('classicapp',false); }
});

/* ---------------------------------------------------------------- Help viewer */
OS.Apps.register({
  id:'help', name:'Help Viewer', icon:'helpviewer',
  menus(){ return []; },
  TOPICS:{
    home:{title:'Mac Help',html:()=>`
      <h1>Mac Help</h1>
      <p><b>Welcome to Mac OS X.</b> Choose a topic:</p>
      <li><a data-t="whatsnew">What’s new in Mac OS X</a></li>
      <li><a data-t="dock">Using the Dock</a></li>
      <li><a data-t="finder">Finding your files with the Finder</a></li>
      <li><a data-t="trash">Where is the Trash?</a></li>
      <li><a data-t="classic">Using Classic applications</a></li>
      <li><a data-t="unix">For UNIX users</a></li>`},
    whatsnew:{title:'What’s new',html:()=>`
      <h1>What’s new in Mac OS X</h1>
      <p>Mac OS X is the world’s most advanced operating system — a super-modern foundation wearing the most beautiful interface ever drawn.</p>
      <h2>Aqua</h2>
      <p>Buttons you want to lick. Windows that cast true shadows. Menus you can see through. One default button on every dialog pulses gently, like the operating system has a heartbeat. It does.</p>
      <h2>The Dock</h2>
      <p>Your applications, documents, and minimized windows in one magnificent shelf. Watch a window pour itself into the Dock like a genie returning to its lamp — then bring it back, just because you can.</p>
      <h2>Industrial-strength foundations</h2>
      <p>Protected memory means one misbehaving application can no longer take the whole Mac down with it. Preemptive multitasking means the pointer keeps moving even when an application thinks hard. Underneath it all: Darwin, a genuine UNIX core.</p>
      <h2>And this is only the beginning</h2>
      <p>Free updates through the year will add CD burning, DVD playback, and more speed. Mac OS X only gets better from here — and it starts from “gorgeous.”</p>
      <p><a data-t="home">← Help home</a></p>`},
    dock:{title:'Dock',html:()=>`
      <h1>Using the Dock</h1>
      <p>The Dock keeps applications on the left of its divider and documents, minimized windows, and the Trash on the right.</p>
      <li>Click an icon to open it. Icons bounce while an application starts up.</li>
      <li>A small triangle marks running applications.</li>
      <li>Drag an icon off the Dock to remove it — it departs in a puff of smoke.</li>
      <li>Set size and magnification in Dock preferences (logo menu → Dock).</li>
      <p><a data-t="home">← Help home</a></p>`},
    finder:{title:'Finder',html:()=>`
      <h1>Finding your files</h1>
      <p>The new Finder window has a toolbar: Back, your view buttons, and shortcuts to Computer, Home, and Applications.</p>
      <li><b>Icon view</b> — big, glossy, familiar.</li>
      <li><b>List view</b> — sortable columns and disclosure triangles.</li>
      <li><b>Column view</b> — browse folders left to right; the last column previews the selected file. Inherited directly from NeXTSTEP, and the fastest way to get anywhere.</li>
      <p>Folders open <i>in place</i>. To open a folder in a new window the old-fashioned way, hold ⌘ while double-clicking.</p>
      <p><a data-t="home">← Help home</a></p>`},
    trash:{title:'Trash',html:()=>`
      <h1>Where is the Trash?</h1>
      <p>The Trash now lives at the right end of the Dock.</p>
      <p>It is no longer on the desktop. Yes, we know. Drag items to the Dock’s Trash, or select them and press ⌘⌫. Choose Empty Trash from the Finder menu when you are certain.</p>
      <p>To eject a disk, drag it to the Trash — it politely becomes an Eject symbol, honoring fifteen years of muscle memory.</p>
      <p><a data-t="home">← Help home</a></p>`},
    classic:{title:'Classic',html:()=>`
      <h1>Using Classic applications</h1>
      <p>Applications written for Mac OS 9 run in the Classic environment. When you open one, Mac OS 9.1 starts up inside Mac OS X — you will see its startup screen, complete with a miniature extensions parade.</p>
      <p>The first start takes a minute. Subsequent launches are quick, because Mac OS 9 simply keeps running in the background, blissfully unaware it has become a guest in its own house.</p>
      <p><a data-t="home">← Help home</a></p>`},
    unix:{title:'UNIX',html:()=>`
      <h1>For UNIX users</h1>
      <p>Beneath Aqua lies Darwin, based on BSD and the Mach microkernel. Open Terminal (in Applications → Utilities) and you will find tcsh, the standard shell of Mac OS X 10.0.</p>
      <p>The traditional file tree — /bin, /usr, /etc — is present but hidden from the Finder. Both worlds are the same disk: type <b>open .</b> in Terminal to fling a Finder window at your current directory.</p>
      <p><a data-t="home">← Help home</a></p>`}
  },
  launch(){
    const H=this;
    const w=OS.WS.create({title:'Mac Help',x:230,y:70,w:480,h:420,app:'help',minW:360,minH:260,pinstripe:true,remember:'help'});
    const tb=el('div'); tb.style.cssText='display:flex;gap:8px;padding:6px 12px;border-bottom:1px solid #aaa;align-items:center;';
    const back=el('div','abtn','◀'); back.style.minWidth='34px';
    const inp=el('input','tf'); inp.placeholder='Ask a question'; inp.style.flex='1';
    tb.appendChild(back); tb.appendChild(inp);
    w.body.appendChild(tb);
    const page=el('div','helpbody scroll');
    w.body.appendChild(page);
    let hist=[];
    const render=(id,noHist)=>{
      const t=H.TOPICS[id]||H.TOPICS.home;
      if(!noHist) hist.push(id);
      page.innerHTML=t.html();
      $$('a[data-t]',page).forEach(a=>a.onclick=()=>render(a.dataset.t));
    };
    back.onclick=()=>{ if(hist.length>1){ hist.pop(); render(hist[hist.length-1],true); } };
    inp.addEventListener('keydown',(e)=>{
      if(e.key!=='Enter') return;
      const q=inp.value.toLowerCase();
      const hit=Object.keys(H.TOPICS).find(k=>k!=='home'&&(H.TOPICS[k].title.toLowerCase().includes(q)||k.includes(q)))||
        (q.includes('trash')?'trash':q.includes('dock')?'dock':q.includes('unix')||q.includes('terminal')?'unix':q.includes('classic')?'classic':q.includes('new')?'whatsnew':'home');
      render(hit);
    });
    render('home');
  }
});

/* -------------------------------------------------------------- easter eggs etc */
// terminal 'kodiak' command + a couple of extras, patched into the parser
(function(){
  const origExec=OS.Term.exec.bind(OS.Term);
  OS.Term.exec=function(s,line){
    const cmd=line.trim().split(/\s+/)[0];
    if(cmd==='kodiak'){
      const on=document.body.classList.toggle('pubbeta');
      OS.State.set('pubbeta',on);
      this.print(s,on?'The logo drifts back to the center of the menu bar, decorative once more.\nIn memory of Kodiak (Public Beta, September 2000 - March 2001).\n':'March 2001 restored. The logo menu returns to the left, where it belongs.\n');
      return;
    }
    if(cmd==='crash'){ this.print(s,'Segmentation fault (simulated, and rather enjoyed)\n');
      setTimeout(()=>OS.unexpectedQuit('Terminal'),400); return; }
    if(cmd==='genie'){ this.print(s,'The Genie is busy minimizing windows. Leave a wish after the whoosh.\n'); return; }
    origExec(s,line);
  };
})();
// double-click a title bar minimizes (the 10.0 replacement for windowshade)
addEventListener('dblclick',(e)=>{
  const tb=e.target.closest('.tbar');
  if(tb&&!e.target.closest('.tl')&&!e.target.closest('.pill')){
    const w=OS.WS.wins.find(x=>x.el.contains(tb));
    if(w&&w.opts.lights.m!==false) OS.WS.minimize(w);
  }
});
// rare spontaneous beachballs + very rare unexpected quits: 10.0 honesty
setInterval(()=>{
  if(OS.Boot.phase!=='desktop') return;
  if(Math.random()<.045) OS.WS.beach(700+Math.random()*900);
  if(Math.random()<.004){
    const ids=Object.keys(OS.Apps.running).filter(x=>x!=='finder');
    if(ids.length){ const id=ids[Math.floor(Math.random()*ids.length)];
      const name=OS.Apps.get(id).name;
      OS.Apps.quit(id); OS.unexpectedQuit(name); }
  }
},30000);

/* -------------------------------------------------------------------- init --- */
addEventListener('DOMContentLoaded',()=>{
  // ambient defs for toolbar svgs that reference gradients
  const amb=el('div'); amb.style.cssText='position:absolute;width:0;height:0;overflow:hidden;';
  amb.innerHTML=Icons.base('',1);
  document.body.appendChild(amb);
  if(OS.State.get('appearance')==='Graphite') document.body.classList.add('graphite');
  if(OS.State.get('pubbeta')) document.body.classList.add('pubbeta');
  const hl=OS.State.get('hlcolor');
  if(hl){ const map={Blue:'#3068c8',Graphite:'#7c8da1',Gold:'#c8a030',Green:'#4a9a4a'}; if(map[hl]) document.body.style.setProperty('--hl',map[hl]); }
  OS.VFS.build();
  OS.Desktop.init();
  OS.MenuBar.init();
  OS.Dock.init();
  OS.Boot.start();
});
</script>
