<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan 9 from Bell Labs — Fourth Edition</title>
<style>
/* Plan 9 is flat. No gradients, no shadows, no radii, no icons. */
html, body {
  margin: 0; padding: 0; height: 100%; background: #262626; overflow: hidden;
  font-family: "Lucida Grande","Lucida Sans Unicode","Segoe UI",Verdana,sans-serif;
}
#stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#screen {
  position: relative; width: 1024px; height: 768px; background: #777777;
  overflow: hidden; transform-origin: center center; cursor: default;
  user-select: none; -webkit-user-select: none;
}
#screen.sweeping { cursor: crosshair; }
#screen * { user-select: none; -webkit-user-select: none; }
canvas { display: block; image-rendering: auto; }

/* boot console */
#boot {
  position: absolute; inset: 0; background: #ffffff; color: #000000; z-index: 500;
  font: 15px "Lucida Console","DejaVu Sans Mono",Menlo,Consolas,monospace;
  padding: 4px 6px; white-space: pre-wrap; overflow: hidden; box-sizing: border-box;
}
#boot .cur { background:#000; color:#fff; }

/* rio windows: a flat colour border, nothing else */
.p9win {
  position: absolute; background: #ffffff; box-sizing: border-box;
  border: 4px solid #9eeeee;
}
.p9win.focused { border-color: #55aaaa; }
.p9win .body { position: absolute; inset: 0; overflow: hidden; background: #ffffff; }

/* rio / text menus (button 3 / button 2) — flat, bordered, exact */
.p9menu {
  position: absolute; z-index: 900; background: #eaffea; border: 2px solid #448844;
  font: 14px "Lucida Grande","Lucida Sans Unicode","Segoe UI",Verdana,sans-serif;
  color: #000; min-width: 72px;
}
.p9menu .item { padding: 2px 10px 3px 10px; white-space: pre; }
.p9menu .item.hot { background: #88cc88; }
.p9menu .sep { border-top: 1px solid #448844; margin: 0; }

/* mouse chord indicator: a teaching device */
#mousehud {
  position: absolute; right: 8px; bottom: 8px; z-index: 950; display: flex; gap: 3px;
  align-items: flex-end; opacity: 0.92;
}
#mousehud .btn {
  width: 22px; height: 30px; background: #eeeeee; border: 2px solid #444;
  box-sizing: border-box; text-align: center; color: #666;
  font: 11px "Lucida Grande",Verdana,sans-serif; line-height: 26px;
}
#mousehud .btn.on { background: #55aaaa; color: #fff; border-color: #003030; }
#mousehud #chordtip {
  position: absolute; right: 0; bottom: 34px; white-space: nowrap; background: #eaffea;
  border: 1px solid #448844; padding: 1px 6px; font: 12px "Lucida Grande",Verdana,sans-serif;
  display: none;
}

/* ghost cursor for import(4) of another machine's mouse */
#ghostcursor {
  position: absolute; z-index: 940; width: 15px; height: 21px; display: none; pointer-events: none;
}

/* sweep rectangle */
#sweepbox { position: absolute; border: 2px solid #55aaaa; display: none; z-index: 930; pointer-events: none; }

/* small flat scrollbars are drawn on canvas; nothing here */
</style>
</head>

<div id="stage">
<div id="screen">
  <div id="boot"></div>
  <div id="sweepbox"></div>
  <svg id="ghostcursor" viewBox="0 0 15 21"><polygon points="0,0 0,17 5,13 8,20 11,19 8,12 14,12" fill="#ffffff" stroke="#000000" stroke-width="1"/></svg>
  <div id="mousehud">
    <div id="chordtip"></div>
    <div class="btn" id="mb1">1</div><div class="btn" id="mb2">2</div><div class="btn" id="mb3">3</div>
  </div>
</div>
</div>
<script>
"use strict";
/* ------------------------------------------------------------------
   Plan 9 from Bell Labs, Fourth Edition — a museum simulation.
   One file, no dependencies, no assets. Everything is a file;
   every window is a process; every process has its own namespace.
   ------------------------------------------------------------------ */

const SCREENW = 1024, SCREENH = 768;
const $id = (x) => document.getElementById(x);
const SCREEN = $id('screen');

/* ---------- colours (libdraw names) ---------- */
const COL = {
  riodesk: '#777777',
  focus: '#55aaaa', nofocus: '#9eeeee',           /* greygreen / palegreygreen */
  winbg: '#ffffff', wintext: '#000000',
  winsel: '#9eeeee',
  winscroll: '#999999',
  acmebody: '#ffffea', acmetag: '#eaffff',
  acmebodysel: '#eeee9e', acmetagsel: '#9eeeee',
  acmebodyscroll: '#99994c', acmetagscroll: '#8888cc',
  acmecolbord: '#8888cc',
  menu: '#eaffea', menuhi: '#88cc88', menubord: '#448844',
};
/* an optional 9front-flavoured theme (see /lib/theme) */
const THEME9FRONT = {
  riodesk: '#494f5e', focus: '#5297a5', nofocus: '#8e9aab',
  winbg: '#ded9d3', winsel: '#8e9aab', winscroll: '#a7a297',
};
let THEME = 'plan9';

/* ---------- fonts ---------- */
/* acme and rio use a proportional Lucida-derived font by default. */
const FONT_PROP = '14px "Lucida Grande","Lucida Sans Unicode","Segoe UI",Verdana,sans-serif';
const FONT_MONO = '13px "Lucida Console","DejaVu Sans Mono",Menlo,Consolas,monospace';
const LINEH = 17;

/* ---------- tiny helpers ---------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(s, n){ s = String(s); while (s.length < n) s = ' ' + s; return s; }
function padr(s, n){ s = String(s); while (s.length < n) s = s + ' '; return s; }
function now(){ return Date.now(); }

/* ---------- sound: Plan 9 is a quiet system. Off by default. ---------- */
const Sound = {
  on: false, ctx: null,
  beep(freq, dur, vol){
    if (!this.on) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.value = vol; o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + dur);
    } catch (e) {}
  },
  click(){ this.beep(2400, 0.008, 0.02); },
  error(){ this.beep(440, 0.12, 0.06); },
};

/* ---------- 9P trace bus ----------
   Every walk/open/read/write in the simulation is phrased as a 9P
   transaction and announced here; drawterm-style trace windows listen. */
const Trace = {
  seq: 0, fid: 100, listeners: [], quiet: false,
  newfid(){ return ++this.fid; },
  emit(line){
    if (this.quiet) return;
    const tag = (this.seq++ % 65535) + 1;
    for (const fn of this.listeners) fn(tag, line);
  },
  t(kind, rest){ this.emit('<- T' + kind + ' ' + rest); },
  r(kind, rest){ this.emit('-> R' + kind + ' ' + rest); },
};

/* ---------- snarf buffer (the clipboard is called snarf) ---------- */
const Snarf = {
  buf: '',
  get(){ return this.buf; },
  set(s){ this.buf = String(s); StateMgr.save(); },
};

<script>
/* ==================================================================
   NAMESPACE ENGINE
   A file tree of nodes, plus a per-process mount table. A namespace
   is nothing but the ordered list of bind/mount operations that
   built it — which is exactly what ns(1) prints.
   ================================================================== */

let QIDGEN = 1;
function mkdir(name){ return { qid: QIDGEN++, name, dir: true, children: {}, mtime: now(), uid: 'glenda' }; }
function mkfile(name, data){ return { qid: QIDGEN++, name, dir: false, data: (data===undefined?'':data), mtime: now(), uid: 'glenda' }; }
function mkbin(name, uid){ const f = mkfile(name, ''); f.bin = true; f.uid = uid || 'bootes'; return f; }
function mksyn(name, spec){ const f = mkfile(name, ''); f.syn = spec; return f; }       /* spec: {read(proc,fd), write(proc,fd,s), size?} */
function mksyndir(name, spec){ const d = mkdir(name); d.syn = spec; return d; }         /* spec: {list(proc), walk(proc,name)} */

const FS = {
  root: mkdir(''),

  /* --- path arithmetic --- */
  canon(path, cwd){
    if (!path) path = '.';
    if (path[0] === '#') return path;              /* kernel device names resolve absolutely */
    if (path[0] !== '/') path = (cwd || '/') + '/' + path;
    const out = [];
    for (const el of path.split('/')){
      if (el === '' || el === '.') continue;
      if (el === '..') { out.pop(); continue; }
      out.push(el);
    }
    return '/' + out.join('/');
  },

  /* kernel devices: '#c' cons, '#e' env, '#p' proc, '#m' mouse, ... */
  kernelDev(name){
    switch (name[1]) {
      case 'c': return DEV.consdir; case 'e': return DEV.envdir;
      case 'p': return DEV.procdir; case 'm': return DEV.mousedir;
      case 'I': return DEV.netdir;  case 's': return DEV.srvdir;
      case 'd': return DEV.fddir;   case '/': return FS.root;
      default: return null;
    }
  },

  /* Walk a path in proc's namespace.
     Returns {node, union, path, parentUnion} where union is the ordered
     list of directories mounted at this point (null if not a mount point). */
  walk(proc, path, opts){
    opts = opts || {};
    const ns = proc.ns;
    const cpath = this.canon(path, proc.cwd);
    if (cpath[0] === '#'){
      const d = this.kernelDev(cpath);
      if (!d) throw new Error(cpath + ' unknown device');
      return { node: d, union: [d], path: cpath };
    }
    const elems = cpath === '/' ? [] : cpath.slice(1).split('/');
    let cands = ns.tab.get('/') || [FS.root];
    let node = cands[0];
    let cur = '';
    if (!opts.quiet9p) Trace.t('walk', 'fid ' + Trace.newfid() + ' newfid ' + Trace.newfid() + ' ' + (elems.length ? elems.map(e=>'"'+e+'"').join(' ') : '(clone)'));
    for (let i = 0; i < elems.length; i++){
      const el = elems[i];
      cur += '/' + el;
      let found = null;
      for (const d of cands){
        const c = this.child(proc, d, el);
        if (c) { found = c; break; }               /* in a union, the first match wins */
      }
      if (!found){
        if (!opts.quiet9p) Trace.r('error', "'" + cur + "' does not exist");
        const e = new Error(cpath + (opts.errname?'':'') + ' does not exist');
        e.p9 = 'does not exist'; e.path = cpath; e.parent = cands; e.missing = elems.slice(i).join('/');
        e.lastExisting = { cands, cur: cur.slice(0, cur.length - el.length - 1) || '/' };
        throw e;
      }
      node = found;
      const mnt = ns.tab.get(cur);
      cands = (mnt && found.dir) ? mnt : [node];
      if (mnt && found.dir) node = mnt[0];
    }
    const mnt = ns.tab.get(cpath === '' ? '/' : cpath);
    if (!opts.quiet9p) Trace.r('walk', elems.length + ' qids, last (' + (node.qid.toString(16)) + ' 0 ' + (node.dir?'d':'') + ')');
    return { node, union: (node.dir ? (mnt || [node]) : null), path: (cpath || '/') };
  },

  child(proc, dir, name){
    if (!dir.dir) return null;
    if (dir.syn && dir.syn.walk){ const n = dir.syn.walk(proc, name); if (n) return n; }
    return dir.children ? (dir.children[name] || null) : null;
  },

  exists(proc, path){ try { this.walk(proc, path, {quiet9p:true}); return true; } catch(e){ return false; } },

  /* directory listing: unions concatenate, duplicates keep first */
  readdir(proc, path){
    const w = this.walk(proc, path);
    if (!w.node.dir) throw new Error(path + ' not a directory');
    Trace.t('read', 'fid ' + Trace.fid + ' offset 0 count 8192');
    const seen = new Set(), out = [];
    for (const d of w.union || [w.node]){
      let kids = [];
      if (d.syn && d.syn.list) kids = d.syn.list(proc);
      if (d.children) kids = kids.concat(Object.values(d.children));
      for (const k of kids){ if (!seen.has(k.name)){ seen.add(k.name); out.push(k); } }
    }
    out.sort((a,b)=> a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
    Trace.r('read', 'count ' + out.length * 61);
    return out;
  },

  stat(proc, path){
    const w = this.walk(proc, path, {quiet9p:true});
    Trace.t('stat', 'fid ' + Trace.fid);
    const n = w.node;
    const size = n.dir ? 0 : (n.syn ? 0 : (n.data ? n.data.length : 0));
    Trace.r('stat', "'" + n.name + "' '" + n.uid + "' q(" + n.qid.toString(16) + ') m ' + (n.dir?'20000000755':'0644'));
    return { name: n.name || '/', node: n, size, mtime: n.mtime, dir: n.dir, uid: n.uid };
  },

  /* open returns an Fd; synthetic files get proc-aware read/write */
  open(proc, path, mode){                          /* mode: 'r' | 'w' | 'a' */
    const w = this.walk(proc, path);
    const n = w.node;
    Trace.t('open', 'fid ' + Trace.fid + ' mode ' + (mode==='r'?0:1));
    Trace.r('open', 'qid (' + n.qid.toString(16) + ' 0 ' + (n.dir?'d':'') + ')');
    if (n.dir && mode !== 'r') throw new Error(path + ' is a directory');
    if ((mode === 'w') && !n.syn && !n.dir) { n.data = ''; n.mtime = now(); }
    const fd = {
      node: n, path: w.path, proc, offset: 0, mode, aux: {},
      async read(){
        if (proc.dead) throw new Error('interrupt');
        if (n.dir){
          if (this.offset) return null;
          this.offset = 1;
          return FS.readdir(proc, this.path).map(k=>k.name).join('\n') + '\n';
        }
        if (n.syn){
          Trace.t('read', 'fid ' + Trace.fid + ' offset ' + this.offset);
          const r = await n.syn.read(proc, this);
          if (proc.dead) throw new Error('interrupt');
          Trace.r('read', 'count ' + (r === null ? 0 : r.length));
          if (r !== null) this.offset += r.length;
          return r;
        }
        if (this.offset >= n.data.length) return null;
        Trace.t('read', 'fid ' + Trace.fid + ' offset ' + this.offset + ' count 8192');
        const chunk = n.data.slice(this.offset, this.offset + 8192);
        this.offset += chunk.length;
        Trace.r('read', 'count ' + chunk.length);
        return chunk;
      },
      async write(s){
        s = String(s);
        Trace.t('write', 'fid ' + Trace.fid + ' count ' + s.length);
        if (n.syn){ await n.syn.write(proc, this, s); Trace.r('write', 'count ' + s.length); return s.length; }
        if (n.frozen) { Trace.r('error', 'file is read-only (dump)'); throw new Error(this.path + ': mounted read-only'); }
        if (this.mode === 'a') n.data += s; else { n.data = n.data.slice(0, this.offset) + s; this.offset += s.length; }
        n.mtime = now();
        Trace.r('write', 'count ' + s.length);
        StateMgr.touch(this.path);
        return s.length;
      },
      close(){ Trace.t('clunk', 'fid ' + Trace.fid); Trace.r('clunk', ''); if (n.syn && n.syn.close) n.syn.close(proc, this); },
    };
    return fd;
  },

  async readAll(proc, path){
    const fd = this.open(proc, path, 'r');
    let out = '', c;
    while ((c = await fd.read()) !== null) { out += c; if (fd.node.syn && fd.node.syn.once) break; }
    fd.close();
    return out;
  },

  create(proc, path, isDir){
    const cpath = this.canon(path, proc.cwd);
    if (this.exists(proc, cpath)) {
      const w = this.walk(proc, cpath, {quiet9p:true});
      if (w.node.dir !== !!isDir) throw new Error(cpath + (isDir ? ' exists' : ' is a directory'));
      return w.node;
    }
    const i = cpath.lastIndexOf('/');
    const dirpath = cpath.slice(0, i) || '/', name = cpath.slice(i+1);
    if (!name) throw new Error('bad path');
    const w = this.walk(proc, dirpath);
    /* create in a union happens in the first replica marked for creation — we use the first writable */
    let target = null;
    for (const d of (w.union || [w.node])){ if (!d.syn && !d.frozen){ target = d; break; } }
    if (!target) throw new Error(dirpath + ': mounted read-only');
    Trace.t('create', "fid " + Trace.fid + " '" + name + "' perm " + (isDir?'d775':'644'));
    const n = isDir ? mkdir(name) : mkfile(name, '');
    n.uid = proc.user || 'glenda';
    target.children[name] = n;
    target.mtime = now();
    Trace.r('create', 'qid (' + n.qid.toString(16) + ' 0 ' + (isDir?'d':'') + ')');
    StateMgr.touch(cpath);
    return n;
  },

  remove(proc, path){
    const cpath = this.canon(path, proc.cwd);
    const i = cpath.lastIndexOf('/');
    const dirpath = cpath.slice(0, i) || '/', name = cpath.slice(i+1);
    const w = this.walk(proc, dirpath, {quiet9p:true});
    Trace.t('remove', 'fid ' + Trace.fid);
    for (const d of (w.union || [w.node])){
      if (d.children && d.children[name]){
        if (d.frozen || d.children[name].frozen) { Trace.r('error', 'read-only'); throw new Error(cpath + ': mounted read-only'); }
        if (d.children[name].dir && Object.keys(d.children[name].children).length) { Trace.r('error','not empty'); throw new Error(cpath + ' directory not empty'); }
        delete d.children[name];
        d.mtime = now();
        Trace.r('remove', '');
        StateMgr.touch(cpath);
        return;
      }
    }
    Trace.r('error', "'" + cpath + "' does not exist");
    throw new Error(cpath + ' does not exist');
  },

  /* plant a subtree at an absolute path in the REAL tree (setup only) */
  plant(path, node){
    const elems = path.split('/').filter(Boolean);
    let d = this.root;
    for (const el of elems){
      if (!d.children[el]) d.children[el] = mkdir(el);
      d = d.children[el];
    }
    if (node){ node.name = node.name || elems[elems.length-1]; }
    return d;
  },
  put(path, node){
    const i = path.lastIndexOf('/');
    const d = this.plant(path.slice(0, i) || '/');
    node.name = path.slice(i+1);
    d.children[node.name] = node;
    return node;
  },
};

/* ---------- the mount table ---------- */
class Namespace {
  constructor(){
    this.ops = [];                 /* the exact lines ns(1) will print */
    this.tab = new Map();          /* canonical path -> ordered [dir nodes] */
  }
  clone(){
    const n = new Namespace();
    n.ops = this.ops.slice();
    for (const [k,v] of this.tab) n.tab.set(k, v.slice());
    return n;
  }
  lookupOr(proc, dst){
    const cur = this.tab.get(dst);
    if (cur) return cur.slice();
    try { const w = FS.walk(proc, dst, {quiet9p:true}); return [w.node]; }
    catch(e){ return []; }
  }
  bind(proc, flag, src, dst){
    const csrc = FS.canon(src, proc.cwd), cdst = FS.canon(dst, proc.cwd);
    const ws = FS.walk(proc, csrc, {quiet9p:true});
    if (!ws.node.dir){
      /* binding a file over a file */
      const wd = FS.walk(proc, cdst, {quiet9p:true});
      if (wd.node.dir) throw new Error('bind: ' + cdst + ' is a directory');
      wd.node.shadow = ws.node;    /* light-weight: file binds are rare in the exhibit */
      this.ops.push('bind ' + (flag?flag+' ':'') + csrc + ' ' + cdst);
      return;
    }
    const srcDirs = ws.union ? ws.union.slice() : [ws.node];
    let list;
    if (flag === '-a')      list = this.lookupOr(proc, cdst).concat(srcDirs);
    else if (flag === '-b') list = srcDirs.concat(this.lookupOr(proc, cdst));
    else                    list = srcDirs;
    this.tab.set(cdst, list);
    this.ops.push('bind ' + (flag?flag+' ':'') + csrc + ' ' + cdst);
    Trace.t('attach', "uname '" + (proc.user||'glenda') + "' aname ''");
    Trace.r('attach', 'qid (' + ws.node.qid.toString(16) + ' 0 d)');
  }
  mount(proc, flag, srv, dst, spec){
    /* mounting a served tree: srv names a file server; we attach its root node */
    const cdst = FS.canon(dst, proc.cwd);
    const root = SRV.lookup(srv);
    if (!root) throw new Error('mount: ' + srv + ' unknown service');
    if (!FS.exists(proc, cdst)) FS.create(proc, cdst, true);
    let list;
    if (flag === '-a')      list = this.lookupOr(proc, cdst).concat([root]);
    else if (flag === '-b') list = [root].concat(this.lookupOr(proc, cdst));
    else                    list = [root];
    this.tab.set(cdst, list);
    this.ops.push('mount ' + (flag?flag+' ':'') + srv + ' ' + cdst + (spec ? ' ' + spec : ''));
  }
  unmount(proc, src, dst){
    const cdst = FS.canon(dst, proc.cwd);
    if (!this.tab.has(cdst)) throw new Error('unmount: ' + cdst + ' not mounted');
    if (!src){ this.tab.delete(cdst); }
    else {
      const ws = FS.walk(proc, src, {quiet9p:true});
      const list = this.tab.get(cdst).filter(d => d !== ws.node && !(ws.union||[]).includes(d));
      if (list.length) this.tab.set(cdst, list); else this.tab.delete(cdst);
    }
    this.ops.push('unmount ' + (src ? FS.canon(src,proc.cwd) + ' ' : '') + cdst);
  }
  print(proc){
    return this.ops.join('\n') + '\ncd ' + (proc ? proc.cwd : '/usr/glenda') + '\n';
  }
}

/* ---------- srv registry: named file servers for mount(1) ---------- */
const SRV = {
  tab: {},
  post(name, rootNode){ this.tab[name] = rootNode; },
  lookup(name){ return this.tab[name.replace(/^\/srv\//,'')] || null; },
};

/* ==================================================================
   PROCESSES
   Every window is a process group; every process carries a namespace,
   an environment and a working directory. /proc is made of these.
   ================================================================== */
let PIDGEN = 0;
const Procs = {
  list: [],
  alloc(opts){
    const p = {
      pid: ++PIDGEN,
      name: opts.name || 'rc',
      args: opts.args || [opts.name || 'rc'],
      user: 'glenda',
      ppid: opts.parent ? opts.parent.pid : 0,
      ns: opts.ns || (opts.parent ? opts.parent.ns : new Namespace()),
      env: opts.env || (opts.parent ? opts.parent.env : new Map()),
      cwd: opts.cwd || (opts.parent ? opts.parent.cwd : '/usr/glenda'),
      window: opts.window || (opts.parent ? opts.parent.window : null),
      state: 'Ready',
      stime: now(),
      dead: false,
      _intr: [],
      oncpu: opts.parent ? opts.parent.oncpu : false,
    };
    this.list.push(p);
    return p;
  },
  find(pid){ return this.list.find(p => p.pid === Number(pid) && !p.dead) || null; },
  reap(p){ p.dead = true; const i = this.list.indexOf(p); if (i >= 0) this.list.splice(i, 1); },
  /* rfork: what forks and what stays shared is the whole point */
  rfork(proc, flags){
    if (flags.includes('n')) proc.ns = proc.ns.clone();          /* fresh copy: private from now on */
    if (flags.includes('e')) proc.env = new Map(proc.env);
    if (flags.includes('N')) proc.ns = bootNamespace();          /* clean slate */
  },
  onIntr(proc, fn){ proc._intr.push(fn); },
  interrupt(proc){
    for (const fn of proc._intr.splice(0)) { try { fn(); } catch(e){} }
    if (proc.child) this.interrupt(proc.child);
  },
};

/* a promise that a process can be interrupted out of */
function intrWait(proc, armFn){
  return new Promise((res, rej) => {
    let done = false;
    const stop = () => { if (!done){ done = true; rej(new Error('interrupt')); } };
    Procs.onIntr(proc, stop);
    armFn((v) => { if (!done){ done = true; res(v); } });
  });
}
function sleepIntr(proc, ms){
  return intrWait(proc, (res) => setTimeout(res, ms));
}

  x: 512, y: 384, buttons: 0, t0: now(),

  fmt(x, y, b){ return 'm' + pad(x,12) + pad(y,12) + pad(b,12) + pad(now() - this.t0, 12); },
  update(x, y, b){
    this.x = x; this.y = y; this.buttons = b;
    const w = this.waiters.splice(0);
    for (const fn of w) fn();
  },
  /* one read = one event, like reading the real /dev/mouse */
  async read(proc){
    await intrWait(proc, res => this.waiters.push(res));
    if (this.ghost.on && (Math.random() < 0.4)) return this.fmt(this.ghost.x|0, this.ghost.y|0, 0) + '\n';
    return this.fmt(this.x, this.y, this.buttons) + '\n';

};

/* ghost cursor: import(4) of another machine's mouse */
function ghostMouse(on){
  Mouse.ghost.on = on;
  const el = $id('ghostcursor');
  el.style.display = on ? 'block' : 'none';
  if (on && !Mouse.ghost.timer){
    Mouse.ghost.timer = setInterval(() => {
      const g = Mouse.ghost;
      g.phase += 0.045;
      g.x = 512 + 380 * Math.sin(g.phase * 1.1) * Math.cos(g.phase * 0.37);
      g.y = 384 + 300 * Math.sin(g.phase * 0.83);
      el.style.left = g.x + 'px'; el.style.top = g.y + 'px';
      const w = Mouse.waiters.splice(0);

}

/* ==================================================================
   rc — THE PLAN 9 SHELL (Tom Duff)
   Lists, not strings. if/if not, for, while, switch, fn.
   `{command} substitution, $#var, $"var, >[2=1] redirection.
   There is no else and there is no quoting minefield.
   ================================================================== */

const Rc = {};

/* ---------- lexer ---------- */
const RC_OPS = ['&&','||','>>','>[','|','&',';','\n','(',')','{','}','^','<','>','=','`'];
function rcLex(src){
  const toks = [];
  let i = 0, sep = true;   /* sep: whitespace (or an op) came before the next part */
  const isWordChar = c => c && !' \t\n;&|()^$\'`<>{}='.includes(c);
  const part = (p) => { p.t = 'part'; p.sep = sep; sep = false; toks.push(p); };
  while (i < src.length){
    const c = src[i];
    if (c === ' ' || c === '\t'){ i++; sep = true; continue; }
    if (c === '#'){ while (i < src.length && src[i] !== '\n') i++; continue; }
    if (c === '\''){                                     /* rc quoting: '' is a literal quote */
      i++; let v = '';
      while (i < src.length){
        if (src[i] === '\'' && src[i+1] === '\''){ v += '\''; i += 2; continue; }
        if (src[i] === '\'') break;
        v += src[i++];
      }
      i++;
      part({k:'q', v});
      continue;
    }
    if (c === '$'){
      i++;
      let mod = '';
      if (src[i] === '#' || src[i] === '"'){ mod = src[i]; i++; }
      let name = '';
      if (src[i] === '*'){ name = '*'; i++; }
      else while (i < src.length && /[A-Za-z0-9_]/.test(src[i])) name += src[i++];
      part({k:'var', name, mod});
      continue;
    }
    if (c === '`'){                                       /* `{command} */
      i++;
      if (src[i] === '{'){
        let depth = 1, v = ''; i++;
        while (i < src.length && depth){ if (src[i]==='{')depth++; if (src[i]==='}')depth--; if (depth) v += src[i]; i++; }
        part({k:'bq', v});
        continue;
      }
      toks.push({t:'op', v:'`'}); sep = true;
      continue;
    }
    if (c === '>' && src[i+1] === '['){                   /* >[2] and >[2=1] */
      i += 2; let inner = '';
      while (i < src.length && src[i] !== ']') inner += src[i++];
      i++;
      toks.push({t:'op', v:'>[', inner}); sep = true;
      continue;
    }
    let op = null;
    for (const o of ['&&','||','>>']) if (src.startsWith(o, i)){ op = o; break; }
    if (!op && ';&|()^{}<>=\n'.includes(c)) op = c;
    if (op){ toks.push({t:'op', v:op}); i += op.length; sep = (op !== '^' && op !== '='); continue; }
    let v = '';
    while (i < src.length && isWordChar(src[i])) v += src[i++];
    part({k:'lit', v});
  }
  /* group parts into words: adjacency (no separator) and ^ both concatenate */
  const out = [];
  let j = 0;
  while (j < toks.length){
    if (toks[j].t === 'part'){
      const parts = [toks[j]]; j++;
      while (j < toks.length){
        if (toks[j].t === 'part' && !toks[j].sep){ parts.push(toks[j]); j++; continue; }
        if (toks[j].t === 'op' && toks[j].v === '^' && toks[j+1] && toks[j+1].t === 'part'){ j++; parts.push(toks[j]); j++; continue; }
        break;
      }
      out.push({t:'word', parts});
    } else { out.push(toks[j]); j++; }
  }
  return out;
}

/* ---------- parser ---------- */
function rcParse(src){
  const toks = rcLex(src);
  let p = 0;
  const peek = () => toks[p] || {t:'eof'};
  const at = (v) => peek().t === 'op' && peek().v === v;
  const eat = (v) => { if (!at(v)) throw new Error('rc: syntax error, expected ' + JSON.stringify(v)); p++; };
  const skipNl = () => { while (at('\n') || at(';')) p++; };
  const isWordStart = () => peek().t === 'word' || at('(');

  function parseWord(){
    if (at('(')){
      p++;
      const items = [];
      skipNl();
      while (!at(')')){ if (peek().t === 'eof') throw new Error('rc: unmatched ('); items.push(parseWord()); skipNl(); }
      p++;
      let word = {t:'list', items};
      while (at('^')){ p++; word = {t:'concat', l: word, r: parseWord()}; }
      return word;
    }
    if (peek().t !== 'word') throw new Error('rc: syntax error near ' + (peek().v || peek().t));
    let word = toks[p++];
    while (at('^')){ p++; word = {t:'concat', l: word, r: parseWord()}; }
    return word;
  }

  function parseSimple(){
    const node = {t:'simple', assigns: [], words: [], redirs: []};
    while (true){
      if (at('<') || at('>') || at('>>') || at('>[')){
        const op = toks[p++];
        if (op.v === '>[' && op.inner.includes('=')){
          const [a,b] = op.inner.split('=');
          node.redirs.push({op:'dup', fd: Number(a), fd2: Number(b)});
          continue;
        }
        const target = parseWord();
        node.redirs.push({op: op.v, fd: op.inner !== undefined ? Number(op.inner) : (op.v === '<' ? 0 : 1), target});
        continue;
      }
      if (isWordStart()){
        const w = parseWord();
        if (at('=') && node.words.length === 0 && w.t === 'word' && w.parts.length === 1 && w.parts[0].k === 'lit'){
          p++;
          const val = isWordStart() ? parseWord() : {t:'list', items:[]};
          node.assigns.push({name: w.parts[0].v, val});
          continue;
        }
        node.words.push(w);
        continue;
      }
      if (at('=') && node.words.length){
        /* a bare = past the first word is just a character: echo a=b */
        p++;
        const prev = node.words.pop();
        const eq = {t:'word', parts:[{t:'part', k:'q', v:'='}]};
        const next = isWordStart() ? parseWord() : {t:'word', parts:[{t:'part', k:'q', v:''}]};
        node.words.push({t:'concat', l: {t:'concat', l: prev, r: eq}, r: next});
        continue;
      }
      break;
    }
    return node;
  }

  function parseBlock(){
    eat('{');
    const body = parseSeq(['}']);
    eat('}');
    return body;
  }

  function parseParenCmd(){
    eat('(');
    const words = [];
    skipNl();
    while (!at(')')){ if (peek().t === 'eof') throw new Error('rc: unmatched ('); words.push(parseWord()); skipNl(); }
    p++;
    return words;
  }

  function parseCmd(){
    const t = peek();
    if (t.t === 'word' && t.parts.length === 1 && t.parts[0].k === 'lit'){
      const kw = t.parts[0].v;
      if (kw === 'if'){
        p++;
        if (peek().t === 'word' && peek().parts[0].k === 'lit' && peek().parts[0].v === 'not'){
          p++;
          return {t:'ifnot', body: parsePostKeyword()};
        }
        const cond = parseParenCmd();
        return {t:'if', cond, body: parsePostKeyword()};
      }
      if (kw === 'for'){
        p++;
        eat('(');
        const vw = parseWord();
        let list = null;
        if (peek().t === 'word' && peek().parts[0].k === 'lit' && peek().parts[0].v === 'in'){
          p++;
          list = [];
          while (!at(')')) list.push(parseWord());
        }
        eat(')');
        return {t:'for', varname: vw, list, body: parsePostKeyword()};
      }
      if (kw === 'while'){
        p++;
        const cond = parseParenCmd();
        return {t:'while', cond, body: parsePostKeyword()};
      }
      if (kw === 'switch'){
        p++;
        eat('(');
        const word = parseWord();
        eat(')');
        skipNl();
        eat('{');
        skipNl();
        const cases = [];
        while (!at('}')){
          if (peek().t === 'eof') throw new Error('rc: unmatched { in switch');
          const w = peek();
          if (w.t === 'word' && w.parts[0].k === 'lit' && w.parts[0].v === 'case'){
            p++;
            const pats = [];
            while (isWordStart() ) pats.push(parseWord());
            skipNl();
            cases.push({pats, body: {t:'seq', cmds: []}});
            continue;
          }
          const cmd = parseAndor();
          let bg = false;
          if (at('&')){ p++; bg = true; }
          if (cases.length) cases[cases.length-1].body.cmds.push({cmd, bg});
          skipNl();
        }
        p++;
        return {t:'switch', word, cases};
      }
      if (kw === 'fn'){
        p++;
        const name = parseWord();
        if (at('{')){
          const startTok = p;
          const body = parseBlock();
          return {t:'fn', name, body};
        }
        return {t:'fn', name, body: null};
      }
      if (kw === '!'){ p++; return {t:'bang', cmd: parseCmd()}; }
      if (kw === '~'){
        p++;
        const subj = parseWord();
        const pats = [];
        while (isWordStart()) pats.push(parseWord());
        return {t:'twiddle', subj, pats};
      }
    }
    if (at('{')) return {t:'block', body: parseBlock()};
    return parseSimple();
  }

  function parsePostKeyword(){
    skipNlOnlyBrace();
    if (at('{')) return {t:'block', body: parseBlock()};
    return parseCmd();
  }
  function skipNlOnlyBrace(){
    let q = p;
    while (toks[q] && toks[q].t === 'op' && toks[q].v === '\n') q++;
    if (toks[q] && toks[q].t === 'op' && toks[q].v === '{') p = q;
  }

  function parsePiped(){
    let cmd = parseCmd();
    while (at('|')){
      p++;
      skipNl();
      cmd = {t:'pipe', l: cmd, r: parseCmd()};
    }
    return cmd;
  }
  function parseAndor(){
    let cmd = parsePiped();
    while (at('&&') || at('||')){
      const op = peek().v; p++;
      skipNl();
      cmd = {t:'andor', op, l: cmd, r: parsePiped()};
    }
    return cmd;
  }
  function parseSeq(stops){
    const cmds = [];
    while (true){
      skipNl();
      if (peek().t === 'eof') break;
      if (stops && peek().t === 'op' && stops.includes(peek().v)) break;
      const cmd = parseAndor();
      let bg = false;
      if (at('&')){ p++; bg = true; }
      cmds.push({cmd, bg});
      if (at(';') || at('\n')) p++;
      else break;
    }
    return {t:'seq', cmds};
  }

  const ast = parseSeq(null);
  if (peek().t !== 'eof') throw new Error('rc: syntax error near ' + (peek().v === '\n' ? 'newline' : (peek().v || 'word')));
  return ast;
}

/* ---------- pattern matching (glob and switch/case share it) ---------- */
function rcPatToRe(pat){
  let re = '^';
  for (let i = 0; i < pat.length; i++){
    const c = pat[i];
    if (c === '*') re += '[^/]*';
    else if (c === '?') re += '[^/]';
    else if (c === '['){
      let j = i+1, cls = '';
      if (pat[j] === '~'){ cls += '^'; j++; }
      while (j < pat.length && pat[j] !== ']') cls += pat[j++];
      re += '[' + cls.replace(/\\/g,'\\\\') + ']';
      i = j;
    }
    else re += c.replace(/[.+^${}()|\\]/g, '\\$&');
  }
  return new RegExp(re + '$');
}
function rcMatch(pat, str){ try { return rcPatToRe(pat).test(str); } catch(e){ return pat === str; } }

/* glob expansion against the process's own namespace */
function rcGlob(proc, word){
  if (!/[*?[]/.test(word)) return [word];
  const abs = word[0] === '/';
  const parts = FS.canon(word, proc.cwd).slice(1).split('/');
  let cands = ['/'];
  for (const part of parts){
    const next = [];
    if (!/[*?[]/.test(part)){
      for (const d of cands){
        const path = (d === '/' ? '' : d) + '/' + part;
        if (FS.exists(proc, path)) next.push(path);
      }
    } else {
      const re = rcPatToRe(part);
      for (const d of cands){
        let kids = [];
        try { kids = FS.readdir(proc, d); } catch(e){ continue; }
        for (const k of kids) if (re.test(k.name) && k.name[0] !== '.') next.push((d === '/' ? '' : d) + '/' + k.name);
      }
    }
    cands = next;
    if (!cands.length) break;
  }
  if (!cands.length) return [word];
  if (!abs && word[0] !== '/'){
    const pre = FS.canon('.', proc.cwd);
    cands = cands.map(c => c.startsWith(pre + '/') ? c.slice(pre.length + 1) : c);
  }
  return cands.sort();
}

/* ---------- evaluation ---------- */
function getVar(proc, name){
  if (name === '*') return proc.env.get('*') || [];
  if (/^\d+$/.test(name)){ const star = proc.env.get('*') || []; return star[Number(name)-1] !== undefined ? [star[Number(name)-1]] : []; }
  if (name === 'pid') return [String(proc.pid)];
  const v = proc.env.get(name);
  if (v === undefined) return [];
  return Array.isArray(v) ? v : [String(v)];
}

Rc.run = async function(proc, src, io){
  let ast;
  try { ast = rcParse(src); }
  catch(e){ await io.err.write(e.message + '\n'); return 'syntax error'; }
  try { return await execSeq(proc, ast, io); }
  catch(e){
    if (e && e.message === 'interrupt') { return 'interrupt'; }
    if (e && e.rcExit !== undefined) return e.rcExit;
    await io.err.write('rc: ' + (e.message || e) + '\n');
    return 'error';
  }
};

async function evalWord(proc, w, io, noGlob){
  switch (w.t){
    case 'list': {
      let out = [];
      for (const it of w.items) out = out.concat(await evalWord(proc, it, io, noGlob));
      return out;
    }
    case 'concat': {
      const l = await evalWord(proc, w.l, io, true), r = await evalWord(proc, w.r, io, true);
      return concatLists(l, r);
    }
    case 'word': {
      let acc = null, quoted = false, hasGlobPart = false;
      for (const part of w.parts){
        let vals;
        if (part.k === 'lit'){ vals = [part.v]; if (/[*?[]/.test(part.v)) hasGlobPart = true; }
        else if (part.k === 'q'){ vals = [part.v]; quoted = true; }
        else if (part.k === 'var'){
          const v = getVar(proc, part.name);
          if (part.mod === '#') vals = [String(v.length)];
          else if (part.mod === '"') vals = [v.join(' ')];
          else vals = v;
          quoted = true;
        }
        else if (part.k === 'bq'){
          const txt = await captureCmd(proc, part.v, io);
          const ifs = (proc.env.get('ifs') || [' \t\n']).join('');
          vals = txt.split(new RegExp('[' + ifs.replace(/[\]\\^]/g,'\\$&').replace(/\n/g,'\\n').replace(/\t/g,'\\t') + ']+')).filter(s => s !== '');
        }
        acc = acc === null ? vals : concatLists(acc, vals);
      }
      if (acc === null) acc = [];
      if (!noGlob && !quoted && hasGlobPart && acc.length === 1) return rcGlob(proc, acc[0]);
      if (!noGlob && !quoted && hasGlobPart){ let out = []; for (const a of acc) out = out.concat(rcGlob(proc, a)); return out; }
      return acc;
    }
  }
  return [];
}
function concatLists(l, r){
  if (l.length === 0) return r.slice();
  if (r.length === 0) return l.slice();
  if (l.length === 1) return r.map(x => l[0] + x);
  if (r.length === 1) return l.map(x => x + r[0]);
  if (l.length === r.length) return l.map((x,i) => x + r[i]);
  throw new Error('rc: mismatched list lengths in concatenation');
}

async function captureCmd(proc, src, io){
  let out = '';
  const cap = { write: async (s) => { out += s; } };
  await Rc.run(proc, src, { in: io.in, out: cap, err: io.err });
  return out;
}

/* an async pipe */
class Chan {
  constructor(){ this.q = []; this.waiters = []; this.closed = false; }
  async write(s){
    if (this.closed) throw new Error('write on closed pipe');
    if (this.waiters.length) this.waiters.shift()(s);
    else this.q.push(s);
  }
  async read(){
    if (this.q.length) return this.q.shift();
    if (this.closed) return null;
    return new Promise(res => this.waiters.push(res));
  }
  close(){ this.closed = true; for (const w of this.waiters.splice(0)) w(null); }
}

async function execSeq(proc, seq, io){
  let status = proc.env.get('status') ? proc.env.get('status').join('|') : '';
  for (const {cmd, bg} of seq.cmds){
    if (proc.dead) throw new Error('interrupt');
    if (bg){
      const child = Procs.alloc({name: cmdName(cmd), parent: proc});
      child.state = 'Running';
      execCmd(child, cmd, io).catch(()=>{}).finally(() => { child.state = 'Moribund'; setTimeout(()=>Procs.reap(child), 30); });
      await io.err.write('');
      status = '';
    } else {
      status = await execCmd(proc, cmd, io);
    }
    proc.env.set('status', [status || '']);
  }
  return status;
}
function cmdName(cmd){
  if (cmd.t === 'simple' && cmd.words.length && cmd.words[0].t === 'word' && cmd.words[0].parts[0].k === 'lit') return cmd.words[0].parts[0].v;
  if (cmd.t === 'pipe') return cmdName(cmd.l);
  return 'rc';
}

async function execCmd(proc, cmd, io){
  if (proc.dead) throw new Error('interrupt');
  switch (cmd.t){
    case 'seq': return execSeq(proc, cmd, io);
    case 'block': return execSeq(proc, cmd.body, io);
    case 'andor': {
      const ls = await execCmd(proc, cmd.l, io);
      proc.env.set('status', [ls || '']);
      if (cmd.op === '&&' && ls === '') return execCmd(proc, cmd.r, io);
      if (cmd.op === '||' && ls !== '') return execCmd(proc, cmd.r, io);
      return ls;
    }
    case 'bang': {
      const s = await execCmd(proc, cmd.cmd, io);
      return s === '' ? 'false' : '';
    }
    case 'twiddle': {
      const subj = await evalWord(proc, cmd.subj, io, true);
      for (const pw of cmd.pats){
        const pats = await evalWord(proc, pw, io, true);
        for (const pat of pats) for (const s of subj) if (rcMatch(pat, s)) return '';
      }
      return 'no match';
    }
    case 'pipe': {
      const ch = new Chan();
      const lio = { in: io.in, out: { write: (s) => ch.write(s) }, err: io.err };
      const rio = { in: { read: () => ch.read() }, out: io.out, err: io.err };
      const lp = execCmd(proc, cmd.l, lio).catch(e => { if (e.message !== 'interrupt') io.err.write('rc: ' + e.message + '\n'); return 'error'; }).finally(() => ch.close());
      const rp = execCmd(proc, cmd.r, rio).catch(e => { if (e.message === 'interrupt') throw e; io.err.write('rc: ' + e.message + '\n'); return 'error'; });
      const [, rs] = await Promise.all([lp, rp]);
      return rs;
    }
    case 'if': {
      const cs = await execCmd(proc, {t:'simple', assigns:[], words: cmd.cond, redirs: []}, io);
      proc.lastIf = (cs === '');
      if (cs === '') return execCmd(proc, cmd.body, io);
      return cs;
    }
    case 'ifnot': {
      if (proc.lastIf === undefined) throw new Error("rc: 'if not' does not follow 'if(...)'");
      const doit = !proc.lastIf;
      proc.lastIf = undefined;
      if (doit) return execCmd(proc, cmd.body, io);
      return '';
    }
    case 'for': {
      const name = (await evalWord(proc, cmd.varname, io, true))[0];
      let items = [];
      if (cmd.list === null) items = getVar(proc, '*').slice();
      else for (const w of cmd.list) items = items.concat(await evalWord(proc, w, io));
      let st = '';
      for (const it of items){
        if (proc.dead) throw new Error('interrupt');
        proc.env.set(name, [it]);
        st = await execCmd(proc, cmd.body, io);
      }
      return st;
    }
    case 'while': {
      let st = '', guard = 0;
      while (true){
        if (proc.dead) throw new Error('interrupt');
        if (++guard > 100000) throw new Error('rc: while loop ran away');
        const cs = await execCmd(proc, {t:'simple', assigns:[], words: cmd.cond, redirs: []}, io);
        if (cs !== '') break;
        st = await execCmd(proc, cmd.body, io);
        await new Promise(r => setTimeout(r, 0));
      }
      return st;
    }
    case 'switch': {
      const subj = (await evalWord(proc, cmd.word, io, true)).join(' ');
      for (const c of cmd.cases){
        for (const pw of c.pats){
          const pats = await evalWord(proc, pw, io, true);
          for (const pat of pats){
            if (pat === '*' || rcMatch(pat, subj)) return execSeq(proc, c.body, io);
          }
        }
      }
      return '';
    }
    case 'fn': {
      const name = (await evalWord(proc, cmd.name, io, true))[0];
      if (cmd.body) proc.env.set('fn#' + name, cmd.body);
      else proc.env.delete('fn#' + name);
      return '';
    }
    case 'simple': return execSimple(proc, cmd, io);
  }
  return '';
}

async function execSimple(proc, cmd, io){
  /* assignments */
  for (const a of cmd.assigns){
    const val = await evalWord(proc, a.val, io);
    proc.env.set(a.name, val);
    StateMgr.save();
  }
  if (!cmd.words.length) return '';

  let argv = [];
  for (const w of cmd.words) argv = argv.concat(await evalWord(proc, w, io));
  if (!argv.length) return '';

  /* redirections */
  let rio = { in: io.in, out: io.out, err: io.err };
  const opened = [];
  try {
    for (const r of cmd.redirs){
      if (r.op === 'dup'){
        if (r.fd === 2 && r.fd2 === 1) rio.err = rio.out;
        else if (r.fd === 1 && r.fd2 === 2) rio.out = rio.err;
        continue;
      }
      const t = (await evalWord(proc, r.target, io))[0];
      if (r.op === '<'){
        const fd = FS.open(proc, t, 'r');
        opened.push(fd);
        rio.in = { read: () => fd.read() };
      } else {
        if (!FS.exists(proc, t)) FS.create(proc, t, false);
        const fd = FS.open(proc, t, r.op === '>>' ? 'a' : 'w');
        opened.push(fd);
        const sink = { write: (s) => fd.write(s) };
        if (r.fd === 2) rio.err = sink; else rio.out = sink;
      }
    }

    const name = argv[0];

    /* rc builtins */
    const fnBody = proc.env.get('fn#' + name);
    if (fnBody && typeof fnBody === 'object' && fnBody.t){
      const saved = proc.env.get('*');
      proc.env.set('*', argv.slice(1));
      const st = await execSeq(proc, fnBody, rio);
      if (saved !== undefined) proc.env.set('*', saved); else proc.env.delete('*');
      return st;
    }
    switch (name){
      case 'cd': {
        const dst = argv[1] || '/usr/glenda';
        const w = FS.walk(proc, dst, {quiet9p:true});
        if (!w.node.dir) return 'cd: ' + dst + ': not a directory';
        proc.cwd = w.path;
        return '';
      }
      case 'exit': { const e = new Error('exit'); e.rcExit = argv[1] || ''; throw e; }
      case 'eval': return Rc.run(proc, argv.slice(1).join(' '), rio);
      case '.': {
        const txt = await FS.readAll(proc, argv[1]);
        return Rc.run(proc, txt, rio);
      }
      case 'shift': { const st = proc.env.get('*') || []; st.shift(); proc.env.set('*', st); return ''; }
      case 'flag': return '';
      case 'wait': return '';
      case 'whatis': {
        for (const a of argv.slice(1)){
          if (proc.env.get('fn#' + a)) await rio.out.write('fn ' + a + ' {...}\n');
          else if (proc.env.has(a)) await rio.out.write(a + '=(' + getVar(proc, a).join(' ') + ')\n');
          else if (['cd','exit','eval','shift','whatis','rfork','.'].includes(a)) await rio.out.write('builtin ' + a + '\n');
          else {
            let found = null;
            for (const dir of getVar(proc, 'path')){
              const path = (dir === '.' ? proc.cwd : dir) + '/' + a;
              if (FS.exists(proc, path)) { found = path; break; }
            }
            if (found) await rio.out.write(found + '\n');
            else { await rio.err.write('whatis: ' + a + ' not found\n'); return 'not found'; }
          }
        }
        return '';
      }
      case 'rfork': {
        Procs.rfork(proc, argv[1] || 'ens');
        return '';
      }
      case 'builtin': argv.shift(); break;
    }

    return await runProgram(proc, argv, rio);
  } finally {
    for (const fd of opened) fd.close();
  }
}

/* resolve a command through the NAMESPACE — this is why bind /tmp /bin
   genuinely changes what you can run, in this window only. */
async function runProgram(proc, argv, io){
  const name = argv[0];
  let node = null, foundPath = null;
  if (name[0] === '/' || name.startsWith('./') || name.startsWith('../')){
    try { node = FS.walk(proc, name, {quiet9p:true}).node; foundPath = FS.canon(name, proc.cwd); } catch(e){}
  } else {
    for (const dir of getVar(proc, 'path')){
      const path = (dir === '.' ? (proc.cwd === '/' ? '' : proc.cwd) : dir) + '/' + name;
      try { node = FS.walk(proc, path, {quiet9p:true}).node; foundPath = path; break; } catch(e){}
    }
  }
  if (!node){
    await io.err.write(name + ": '" + (name.includes('/') ? FS.canon(name, proc.cwd) : name) + "' file does not exist\n");
    Sound.error();
    return "'" + name + "' file does not exist";
  }
  if (node.shadow) node = node.shadow;
  if (node.dir){ await io.err.write(name + ': is a directory\n'); return 'is a directory'; }

  const child = Procs.alloc({ name, args: argv, parent: proc });
  child.state = 'Running';
  proc.child = child;
  try {
    if (node.cmd && CMDS[node.cmd]){
      return (await CMDS[node.cmd](child, argv, io)) || '';
    }
    if (node.bin){
      await io.err.write(name + ': exec header invalid\n');
      return 'exec';
    }
    /* an rc script: run it with $* set */
    const saved = child.env.get('*');
    child.env.set('*', argv.slice(1));
    const st = await Rc.run(child, node.data.replace(/^#!\/bin\/rc\n/, ''), io);
    if (saved !== undefined) child.env.set('*', saved); else child.env.delete('*');
    return st;
  } catch (e) {
    if (e.message === 'interrupt' || (e && e.rcExit !== undefined)) throw e;
    await io.err.write(name + ': ' + e.message + '\n');
    return 'error';
  } finally {
    proc.child = null;
    child.state = 'Moribund';
    setTimeout(() => Procs.reap(child), 30);
  }
}

<script>
/* ==================================================================
   USERLAND
   The commands in /386/bin. Resolved through the namespace, so if
   you bind something over /bin these genuinely go away.
   ================================================================== */

async function readAllIn(proc, io){
  let out = '', c;
  while ((c = await io.in.read()) !== null){
    if (proc.dead) throw new Error('interrupt');
    out += c;
  }
  return out;
}
function lines(s){ const a = s.split('\n'); if (a.length && a[a.length-1] === '') a.pop(); return a; }
function flags(argv, spec){
  /* tiny arg parser: spec 'ab:c' — b takes a value */
  const f = {}, rest = [];
  let i = 1;
  for (; i < argv.length; i++){
    const a = argv[i];
    if (a === '--'){ i++; break; }
    if (a[0] !== '-' || a === '-') break;
    for (let j = 1; j < a.length; j++){
      const c = a[j];
      const k = spec.indexOf(c);
      if (k < 0){ f.bad = c; return [f, argv.slice(i)]; }
      if (spec[k+1] === ':'){ f[c] = a.slice(j+1) || argv[++i]; j = a.length; }
      else f[c] = true;
    }
  }
  return [f, rest.concat(argv.slice(i))];
}
function fmtdate(t, gmt){
  const d = new Date(t);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const tz = gmt ? 'GMT' : (new Date().toLocaleTimeString('en-US',{timeZoneName:'short'}).split(' ').pop() || 'GMT');
  const two = n => (n<10?'0':'')+n;
  return days[d.getDay()] + ' ' + mons[d.getMonth()] + ' ' + pad(d.getDate(),2) + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()) + ' ' + tz + ' ' + d.getFullYear();
}

const CMDS = {};

/* ---------- files ---------- */
CMDS.ls = async (p, argv, io) => {
  const [f, args] = flags(argv, 'lmnpqrtdsF');
  if (f.bad === 'R'){ await io.err.write('ls: bad flag -R\n'); return 'usage'; }   /* there is no -R. walk(1). */
  const targets = args.length ? args : ['.'];
  let st = '';
  for (const t of targets){
    try {
      const w = FS.walk(p, t, {quiet9p:true});
      const items = (w.node.dir && !f.d) ? FS.readdir(p, t).map(k => ({node: k, path: (FS.canon(t,p.cwd)==='/'?'':FS.canon(t,p.cwd)) + '/' + k.name}))
                                          : [{node: w.node, path: w.path}];
      if (f.t) items.sort((a,b)=>b.node.mtime-a.node.mtime);
      if (f.r) items.reverse();
      for (const it of items){
        const n = it.node;
        const nm = (targets.length > 1 || t !== '.') ? it.path : n.name;
        const shown = f.p ? n.name : nm;
        if (f.l){
          const mode = (n.dir?'d':(n.syn?'':(n.bin?'':'')))+(n.dir?'rwxrwxr-x':(n.bin?'rwxrwxr-x':'rw-rw-r--'));
          const dev = n.syn ? 'c 0' : 'M 8';
          const size = n.dir ? 0 : (n.data ? n.data.length : 0);
          const d = new Date(n.mtime);
          const mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const dt = mons[d.getMonth()] + ' ' + pad(d.getDate(),2) + ' ' + ((now()-n.mtime > 180*864e5) ? pad(d.getFullYear(),5) : pad((d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(),5));
          await io.out.write(mode + ' ' + dev + ' ' + padr(n.uid,8) + ' ' + padr(n.uid,8) + pad(size,9) + ' ' + dt + ' ' + shown + '\n');
        } else {
          await io.out.write(shown + (f.F && n.dir ? '/' : (f.F && n.bin ? '*' : '')) + '\n');
        }
      }
    } catch(e){ await io.err.write('ls: ' + t + ': ' + (e.p9 || e.message) + '\n'); st = 'error'; }
  }
  return st;
};
CMDS.lc = async (p, argv, io) => {
  /* ls in columns, as the mc-piped alias everyone actually uses */
  let out = '';
  const cap = { write: async s => { out += s; } };
  const st = await CMDS.ls(p, argv, { in: io.in, out: cap, err: io.err });
  const names = lines(out);
  if (!names.length) return st;
  const wmax = Math.max(...names.map(n => n.length)) + 2;
  const cols = Math.max(1, Math.floor(78 / wmax));
  const rows = Math.ceil(names.length / cols);
  for (let r = 0; r < rows; r++){
    let line = '';
    for (let c = 0; c < cols; c++){
      const i = c * rows + r;
      if (i < names.length) line += padr(names[i], wmax);
    }
    await io.out.write(line.replace(/\s+$/,'') + '\n');
  }
  return st;
};
CMDS.cat = async (p, argv, io) => {
  const args = argv.slice(1);
  if (!args.length){
    let c;
    while ((c = await io.in.read()) !== null){ if (p.dead) throw new Error('interrupt'); await io.out.write(c); }
    return '';
  }
  let st = '';
  for (const a of args){
    try {
      const fd = FS.open(p, a, 'r');
      p.state = 'Await';
      try {
        let c;
        while ((c = await fd.read()) !== null){
          if (p.dead) throw new Error('interrupt');
          if (fd.node.bin){ await io.out.write('cat: ' + a + ': is an executable, reading it would upset your terminal\n'); break; }
          await io.out.write(c);
        }
      } finally { fd.close(); p.state = 'Running'; }
    } catch(e){
      if (e.message === 'interrupt') throw e;
      await io.err.write('cat: can\'t open ' + a + ': ' + (e.p9 ? "'" + FS.canon(a,p.cwd) + "' " + e.p9 : e.message) + '\n');
      st = 'error';
    }
  }
  return st;
};
CMDS.cp = async (p, argv, io) => {
  const args = argv.slice(1);
  if (args.length < 2){ await io.err.write('usage: cp from to\n'); return 'usage'; }
  const dst = args.pop();
  const dstIsDir = FS.exists(p, dst) && FS.walk(p, dst, {quiet9p:true}).node.dir;
  if (args.length > 1 && !dstIsDir){ await io.err.write('cp: ' + dst + ' not a directory\n'); return 'error'; }
  for (const src of args){
    try {
      const data = await FS.readAll(p, src);
      const to = dstIsDir ? dst.replace(/\/$/,'') + '/' + src.split('/').pop() : dst;
      FS.create(p, to, false);
      const fd = FS.open(p, to, 'w');
      await fd.write(data);
      fd.close();
    } catch(e){ await io.err.write('cp: ' + e.message + '\n'); return 'error'; }
  }
  return '';
};
CMDS.mv = async (p, argv, io) => {
  const st = await CMDS.cp(p, argv, io);
  if (st) return st;
  for (const src of argv.slice(1, -1)){
    try { FS.remove(p, src); } catch(e){ await io.err.write('mv: ' + e.message + '\n'); return 'error'; }
  }
  return '';
};
CMDS.rm = async (p, argv, io) => {
  const [f, args] = flags(argv, 'rf');
  let st = '';
  const rmr = (path) => {
    const w = FS.walk(p, path, {quiet9p:true});
    if (w.node.dir) for (const k of FS.readdir(p, path)) rmr(path.replace(/\/$/,'') + '/' + k.name);
    FS.remove(p, path);
  };
  for (const a of args){
    try { if (f.r) rmr(a); else FS.remove(p, a); }
    catch(e){ if (!f.f){ await io.err.write('rm: ' + a + ': ' + (e.p9 || e.message) + '\n'); st = 'error'; } }
  }
  return st;
};
CMDS.mkdir = async (p, argv, io) => {
  const [f, args] = flags(argv, 'p');
  let st = '';
  for (const a of args){
    try {
      if (f.p){
        const cpath = FS.canon(a, p.cwd);
        let cur = '';
        for (const el of cpath.slice(1).split('/')){ cur += '/' + el; if (!FS.exists(p, cur)) FS.create(p, cur, true); }
      } else {
        if (FS.exists(p, a)){ await io.err.write("mkdir: can't create " + a + ": file already exists\n"); st = 'error'; continue; }
        FS.create(p, a, true);
      }
    } catch(e){ await io.err.write('mkdir: ' + e.message + '\n'); st = 'error'; }
  }
  return st;
};
CMDS.echo = async (p, argv, io) => {
  const [f, args] = flags(argv, 'n');
  await io.out.write(args.join(' ') + (f.n ? '' : '\n'));
  return '';
};
CMDS.pwd = async (p, argv, io) => { await io.out.write(p.cwd + '\n'); return ''; };
CMDS.touch = async (p, argv, io) => {
  for (const a of argv.slice(1)){
    if (FS.exists(p, a)) FS.walk(p, a, {quiet9p:true}).node.mtime = now();
    else FS.create(p, a, false);
  }
  return '';
};
CMDS.walk = async (p, argv, io) => {
  const [f, args] = flags(argv, 'fdn:');
  const targets = args.length ? args : ['.'];
  const emit = async (path, node) => {
    if (f.f && node.dir) return;
    if (f.d && !node.dir) return;
    await io.out.write(path + '\n');
  };
  const rec = async (path, node, depth) => {
    await emit(path, node);
    if (node.dir && (!f.n || depth < Number(f.n))){
      let kids = [];
      try { kids = FS.readdir(p, path); } catch(e){ return; }
      for (const k of kids) await rec((path === '/' ? '' : path) + '/' + k.name, k, depth + 1);
    }
  };
  for (const t of targets){
    try { const w = FS.walk(p, t, {quiet9p:true}); await rec(FS.canon(t, p.cwd), w.node, 0); }
    catch(e){ await io.err.write('walk: ' + t + ': ' + (e.p9 || e.message) + '\n'); }
  }
  return '';
};
CMDS.du = async (p, argv, io) => {
  const [f, args] = flags(argv, 'as');
  const targets = args.length ? args : ['.'];
  const rec = async (path, node) => {
    let total = 0;
    if (node.dir){
      let kids = [];
      try { kids = FS.readdir(p, path); } catch(e){}
      for (const k of kids){
        const kp = (path === '/' ? '' : path) + '/' + k.name;
        const sz = await rec(kp, k);
        total += sz;
        if (f.a && !k.dir) await io.out.write(pad(Math.ceil(sz/1024),1) + '\t' + kp + '\n');
      }
      if (!f.s) await io.out.write(pad(Math.ceil(total/1024),1) + '\t' + path + '\n');
    } else total = node.data ? node.data.length : 0;
    return total;
  };
  for (const t of targets){
    try {
      const w = FS.walk(p, t, {quiet9p:true});
      const total = await rec(FS.canon(t, p.cwd), w.node);
      if (f.s || !w.node.dir) await io.out.write(pad(Math.ceil(total/1024),1) + '\t' + FS.canon(t,p.cwd) + '\n');
    } catch(e){ await io.err.write('du: ' + t + ': ' + (e.p9 || e.message) + '\n'); }
  }
  return '';
};
CMDS.df = async (p, argv, io) => {
  const used = 2493440 + ((now()-BOOTTIME)/60000|0)*17;
  await io.out.write('filesystem            maxsize       used      avail  used%\n');
  await io.out.write('/dev/sdC0/fossil     10485760 ' + pad(used,10) + ' ' + pad(10485760-used,10) + '   ' + pad(Math.round(used*100/10485760),3) + '%\n');
  await io.out.write('/dev/sdC0/arenas     52428800 ' + pad(9414656,10) + ' ' + pad(52428800-9414656,10) + '   ' + pad(18,3) + '%\n');
  return '';
};
CMDS.file = async (p, argv, io) => {
  for (const a of argv.slice(1)){
    try {
      const w = FS.walk(p, a, {quiet9p:true});
      const n = w.node;
      let kind;
      if (n.dir) kind = 'directory';
      else if (n.syn) kind = 'special file';
      else if (n.bin) kind = 'amd64 plan 9 executable';
      else if ((n.data||'').startsWith('#!/bin/rc')) kind = 'rc executable file';
      else if (/[^\x09\x0a\x20-\x7e -￿]/.test(n.data||'')) kind = 'binary';
      else kind = (n.data||'').length ? 'Ascii text' : 'empty file';
      await io.out.write(a + ': ' + kind + '\n');
    } catch(e){ await io.err.write('file: ' + a + ': ' + (e.p9 || e.message) + '\n'); }
  }
  return '';
};
CMDS.cmp = async (p, argv, io) => {
  const [f, args] = flags(argv, 'sl');
  if (args.length < 2){ await io.err.write('usage: cmp file1 file2\n'); return 'usage'; }
  const a = await FS.readAll(p, args[0]), b = await FS.readAll(p, args[1]);
  if (a === b) return '';
  if (!f.s){
    let i = 0, line = 1;
    while (i < Math.min(a.length,b.length) && a[i] === b[i]){ if (a[i] === '\n') line++; i++; }
    await io.out.write(args[0] + ' ' + args[1] + ' differ: char ' + (i+1) + ' line ' + line + '\n');
  }
  return 'differ';
};
CMDS.diff = async (p, argv, io) => {
  const args = argv.slice(1).filter(a => a[0] !== '-');
  if (args.length < 2){ await io.err.write('usage: diff file1 file2\n'); return 'usage'; }
  const a = lines(await FS.readAll(p, args[0])), b = lines(await FS.readAll(p, args[1]));
  /* plain minimal diff: common prefix/suffix, one hunk */
  let s = 0;
  while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let ea = a.length, eb = b.length;
  while (ea > s && eb > s && a[ea-1] === b[eb-1]){ ea--; eb--; }
  if (s === ea && s === eb) return '';
  const op = (s === ea) ? 'a' : (s === eb) ? 'd' : 'c';
  await io.out.write((s === ea ? s : (s+1) + (ea-s>1 ? ','+ea : '')) + op + (s === eb ? s : (s+1) + (eb-s>1 ? ','+eb : '')) + '\n');
  for (let i = s; i < ea; i++) await io.out.write('< ' + a[i] + '\n');
  if (op === 'c') await io.out.write('---\n');
  for (let i = s; i < eb; i++) await io.out.write('> ' + b[i] + '\n');
  return 'differ';
};

/* ---------- text filters ---------- */
CMDS.grep = async (p, argv, io) => {
  const [f, args] = flags(argv, 'invcl');
  if (!args.length){ await io.err.write('usage: grep [-invcl] pattern [file ...]\n'); return 'usage'; }
  let re;
  try { re = new RegExp(args[0], f.i ? 'i' : ''); } catch(e){ await io.err.write('grep: bad regexp\n'); return 'error'; }
  const files = args.slice(1);
  let matched = false;
  const doText = async (text, label) => {
    let count = 0;
    for (let i = 0; i < text.length; i++){
      const hit = re.test(text[i]);
      if (hit !== !!f.v){
        matched = true; count++;
        if (f.l){ await io.out.write(label + '\n'); return; }
        if (!f.c) await io.out.write((label && files.length > 1 ? label + ':' : '') + (f.n ? (i+1) + ': ' : '') + text[i] + '\n');
      }
    }
    if (f.c) await io.out.write((label && files.length > 1 ? label + ':' : '') + count + '\n');
  };
  if (!files.length) await doText(lines(await readAllIn(p, io)), '');
  else for (const fl of files){
    try { await doText(lines(await FS.readAll(p, fl)), fl); }
    catch(e){ await io.err.write('grep: can\'t open ' + fl + '\n'); }
  }
  return matched ? '' : 'no matches';
};
CMDS.sed = async (p, argv, io) => {
  const [f, args] = flags(argv, 'ne:');
  const scripts = [];
  if (f.e) scripts.push(f.e);
  let files = args;
  if (!f.e && args.length){ scripts.push(args[0]); files = args.slice(1); }
  const prog = [];
  for (const s of scripts.join('\n').split(/[;\n]/)){
    const t = s.trim();
    if (!t) continue;
    let m;
    if ((m = t.match(/^(\d+)?(?:,(\d+|\$))?s(.)(.*)$/)) && 's' === t.replace(/^\d+(,(\d+|\$))?/,'')[0]){
      const rest = t.replace(/^\d+(,(\d+|\$))?/,'').slice(1);
      const delim = rest[0];
      const parts = rest.slice(1).split(delim);
      prog.push({op:'s', re: parts[0], rep: (parts[1]||'').replace(/\\([0-9])/g,'$$$1'), g: (parts[2]||'').includes('g'), pr: (parts[2]||'').includes('p')});
    }
    else if ((m = t.match(/^\/(.*)\/d$/))) prog.push({op:'d', re: m[1]});
    else if ((m = t.match(/^(\d+)d$/))) prog.push({op:'dn', n: Number(m[1])});
    else if ((m = t.match(/^(\d+)q$/))) prog.push({op:'q', n: Number(m[1])});
    else if ((m = t.match(/^\/(.*)\/p$/))) prog.push({op:'p', re: m[1]});
    else if (t === 'p') prog.push({op:'p', re: ''});
    else { await io.err.write('sed: unrecognized command: ' + t + '\n'); return 'error'; }
  }
  const text = files.length ? (await Promise.all(files.map(fl => FS.readAll(p, fl)))).join('') : await readAllIn(p, io);
  const ls = lines(text);
  let outCount = 0;
  for (let i = 0; i < ls.length; i++){
    let line = ls[i], deleted = false, printed = false, quit = false;
    for (const c of prog){
      if (c.op === 's'){ const re = new RegExp(c.re, c.g ? 'g' : ''); const nl = line.replace(re, c.rep); if (c.pr && nl !== line) printed = true; line = nl; }
      else if (c.op === 'd' && new RegExp(c.re).test(line)) deleted = true;
      else if (c.op === 'dn' && i+1 === c.n) deleted = true;
      else if (c.op === 'p' && (!c.re || new RegExp(c.re).test(line))) printed = true;
      else if (c.op === 'q' && i+1 >= c.n) quit = true;
    }
    if (!deleted && (!f.n || printed)) await io.out.write(line + '\n');
    else if (printed && f.n) await io.out.write(line + '\n');
    if (quit) break;
  }
  return '';
};
CMDS.sort = async (p, argv, io) => {
  const [f, args] = flags(argv, 'rnu');
  const text = args.length ? (await Promise.all(args.map(fl => FS.readAll(p, fl)))).join('') : await readAllIn(p, io);
  let ls = lines(text);
  ls.sort(f.n ? (a,b) => parseFloat(a)-parseFloat(b) : undefined);
  if (f.r) ls.reverse();
  if (f.u) ls = ls.filter((l,i) => i === 0 || l !== ls[i-1]);
  for (const l of ls) await io.out.write(l + '\n');
  return '';
};
CMDS.uniq = async (p, argv, io) => {
  const [f, args] = flags(argv, 'cdu');
  const text = args.length ? await FS.readAll(p, args[0]) : await readAllIn(p, io);
  const ls = lines(text);
  let i = 0;
  while (i < ls.length){
    let j = i;
    while (j < ls.length && ls[j] === ls[i]) j++;
    const n = j - i;
    if ((!f.d && !f.u) || (f.d && n > 1) || (f.u && n === 1))
      await io.out.write((f.c ? pad(n,4) + ' ' : '') + ls[i] + '\n');
    i = j;
  }
  return '';
};
CMDS.wc = async (p, argv, io) => {
  const [f, args] = flags(argv, 'lwc');
  const none = !f.l && !f.w && !f.c;
  const count = async (text, label) => {
    const l = lines(text).length, w = text.split(/\s+/).filter(Boolean).length, c = text.length;
    let out = '';
    if (none || f.l) out += pad(l, 7) + ' ';
    if (none || f.w) out += pad(w, 7) + ' ';
    if (none || f.c) out += pad(c, 7) + ' ';
    await io.out.write(out + (label || '') + '\n');
  };
  if (!args.length) await count(await readAllIn(p, io), '');
  else for (const a of args) await count(await FS.readAll(p, a), a);
  return '';
};

CMDS.ps = async (p, argv, io) => {
  /* ps is a script over /proc: it reads every status file it can walk to */
  const pids = FS.readdir(p, '/proc').map(k => k.name).filter(n => /^\d+$/.test(n));
  for (const pid of pids.sort((a,b)=>a-b)){
    try {
      const st = await FS.readAll(p, '/proc/' + pid + '/status');
      const fields = st.trim().split(/\s+/);
      const t = Number(fields[3]) || 0;
      const mm = (s) => Math.floor(s/60) + ':' + ((s%60)<10?'0':'') + (s%60);
      await io.out.write(padr(fields[1],8) + pad(pid,9) + pad(mm(0),7) + pad(mm(t),6) + pad(fields[9]+'K',7) + ' ' + padr(fields[2],8) + ' ' + fields[0] + '\n');
    } catch(e){}
  }
  return '';
};
CMDS.kill = async (p, argv, io) => {

  return '';
};

function manFormat(src, name, sec){

/* ---------- hoc: the higher order calculator ---------- */
function hocEval(expr, vars){
  /* precedence-climbing parser for hoc's expression grammar */
  let i = 0;
  const s = expr;
  const ws = () => { while (i < s.length && ' \t'.includes(s[i])) i++; };
  function primary(){
    ws();
    if (s[i] === '('){ i++; const v = assign(); ws(); if (s[i] !== ')') throw new Error('syntax error'); i++; return v; }
    if (s[i] === '-'){ i++; return -primary(); }
    if (s[i] === '+'){ i++; return primary(); }
    if (/[0-9.]/.test(s[i])){
      let n = '';
      while (i < s.length && /[0-9.eE]/.test(s[i])){ if ((s[i]==='e'||s[i]==='E') && !/[0-9+\-]/.test(s[i+1])) break; n += s[i++]; if (n.endsWith('e')||n.endsWith('E')){ if (s[i]==='+'||s[i]==='-') n += s[i++]; } }
      return parseFloat(n);
    }
    if (/[A-Za-z_]/.test(s[i])){
      let id = '';
      while (i < s.length && /[A-Za-z0-9_]/.test(s[i])) id += s[i++];
      ws();
      const fns = {sin:Math.sin, cos:Math.cos, atan:Math.atan, log:Math.log, log10:(x)=>Math.log10(x), exp:Math.exp, sqrt:Math.sqrt, int:Math.trunc, abs:Math.abs, acos:Math.acos, asin:Math.asin, tan:Math.tan};
      if (s[i] === '(' && fns[id]){ i++; const v = assign(); ws(); if (s[i] !== ')') throw new Error('syntax error'); i++; return fns[id](v); }
      if (id === 'PI') return Math.PI;
      if (id === 'E') return Math.E;
      if (id === 'PHI') return 1.61803398874989484820;
      if (id === 'DEG') return 57.29577951308232087680;
      if (s[i] === '=' && s[i+1] !== '='){ i++; const v = assign(); vars[id] = v; return v; }
      if (vars[id] === undefined) throw new Error(id + ' undefined variable');
      return vars[id];
    }
    throw new Error('syntax error');
  }
  function power(){ let l = primary(); ws(); if (s[i] === '^'){ i++; return Math.pow(l, power()); } return l; }
  function term(){
    let l = power();
    while (true){ ws();
      if (s[i] === '*'){ i++; l *= power(); }
      else if (s[i] === '/'){ i++; l /= power(); }
      else if (s[i] === '%'){ i++; l %= power(); }
      else return l;
    }
  }
  function addsub(){
    let l = term();
    while (true){ ws();
      if (s[i] === '+'){ i++; l += term(); }
      else if (s[i] === '-'){ i++; l -= term(); }
      else return l;
    }
  }
  function assign(){ return addsub(); }
  const v = assign();
  ws();
  if (i < s.length) throw new Error('syntax error');
  return v;
}
CMDS.hoc = async (p, argv, io) => {
  const [f, args] = flags(argv, 'e:');
  const vars = {};
  const evalLine = async (line) => {
    line = line.trim();
    if (!line) return;
    try {
      const v = hocEval(line, vars);
      if (!/^[A-Za-z_][A-Za-z0-9_]* *=[^=]/.test(line)) await io.out.write(fmtNum(v) + '\n');
    } catch(e){ await io.err.write('hoc: ' + e.message + ' on line: ' + line + '\n'); }
  };
  const fmtNum = (v) => (Number.isInteger(v) && Math.abs(v) < 1e15) ? String(v) : String(Number(v.toPrecision(12)));
  if (f.e){ await evalLine(f.e); return ''; }
  if (args.length){ for (const l of lines(await FS.readAll(p, args[0]))) await evalLine(l); return ''; }
  while (true){
    const line = await io.in.read();
    if (line === null || p.dead) break;

/* cpu: a shell on the CPU server, with YOUR namespace imported.
   Run ns before and after: your files followed you there. */
CMDS.cpu = async (p, argv, io) => {
  const [f, args] = flags(argv, 'h:c:');
  const host = f.h || 'cycles';
  if (!Net.hosts[host]){ await io.err.write('cpu: can\'t dial ' + host + ': unknown host\n'); return 'error'; }
  await io.out.write('cpu: dialing tcp!' + host + '!17010\n');
  await sleepIntr(p, 350);
  Trace.t('version', "msize 8216 version '9P2000'"); Trace.r('version', "msize 8216 version '9P2000'");
  Trace.t('attach', "uname 'glenda' aname ''"); Trace.r('attach', 'qid (1 0 d)');
  const cpuProc = Procs.alloc({ name: 'rc', args: ['rc','-i'], parent: p });
  cpuProc.oncpu = true;
  cpuProc.ns = p.ns.clone();
  /* exportfs carries the terminal's namespace across the wire */
  cpuProc.ns.ops.push('mount -a \'#s\'/exportfs /mnt/term');
  cpuProc.ns.ops.push('bind -b /mnt/term/dev /dev\t# your own mouse, cons and window, imported');
  cpuProc.env = new Map(p.env);
  cpuProc.env.set('sysname', [host]);
  cpuProc.env.set('cputype', ['amd64']);
  cpuProc.env.set('service', ['cpu']);
  if (f.c) return Rc.run(cpuProc, f.c, io);
  await io.out.write('connected to ' + host + ' (amd64, 16 cores) — your namespace came with you; try ns\n');
  while (true){
    await io.out.write(host + '% ');
    let line;
    try { line = await io.in.read(); } catch(e){ break; }
    if (line === null) break;
    line = line.replace(/\n$/,'');
    if (line.trim() === 'exit') break;
    try { await Rc.run(cpuProc, line, io); } catch(e){ if (e.rcExit !== undefined) break; }
  }
  Procs.reap(cpuProc);
  await io.out.write('cpu: connection to ' + host + ' closed\n');
  return '';
};

/* import: attach a REMOTE resource into the LOCAL namespace */
CMDS.import = async (p, argv, io) => {
  const [f, args] = flags(argv, 'ab');
  if (args.length < 1){ await io.err.write('usage: import [-a|-b] host remotepath [mountpoint]\n'); return 'usage'; }
  const host = args[0], rpath = args[1] || '/', mnt = args[2] || rpath;
  if (!Net.hosts[host]){ await io.err.write('import: can\'t dial ' + host + ': unknown host\n'); return 'error'; }
  await sleepIntr(p, 300);
  Trace.t('attach', "uname 'glenda' aname '" + rpath + "' (exportfs on " + host + ")");
  Trace.r('attach', 'qid (1 0 d)');
  p.ns.ops.push('import ' + (f.a?'-a ':'') + host + ' ' + rpath + (mnt !== rpath ? ' ' + mnt : ''));

  if (rpath.startsWith('/n/') || rpath === '/'){ await io.out.write('import: ' + host + '!' + rpath + ' mounted at ' + mnt + '\n'); return ''; }

  return '';
};

/* rfork is a builtin in rc, but a command exists for scripts */
CMDS.window = async (p, argv, io) => {
  const [f, args] = flags(argv, 'r:m');
  let rect = null;
  if (f.r){ const v = [f.r].concat(args.splice(0, 3)).map(Number); rect = {x:v[0], y:v[1], w:v[2]-v[0], h:v[3]-v[1]}; }
  WM.newWindow(rect, args.length ? args.join(' ') : null);
  return '';
};

/* mk: read the mkfile, do only what is out of date (we do it all) */
CMDS.mk = async (p, argv, io) => {
  let mkfile;
  try { mkfile = await FS.readAll(p, 'mkfile'); }
  catch(e){ await io.err.write("mk: can't open mkfile: file does not exist\n"); return 'error'; }
  /* expand mkfile variables so recipes read sensibly */
  const vars = { objtype: '386', O: '8', target: '' };
  for (const line of mkfile.split('\n')){
    const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
    if (m) vars[m[1]] = m[2].trim();
  }
  mkfile = mkfile.split('\n').filter(l => !l.startsWith('<') && !/^[A-Za-z_][A-Za-z0-9_]*=/.test(l)).join('\n');
  for (let round = 0; round < 3; round++)
    mkfile = mkfile.replace(/\$([A-Za-z_][A-Za-z0-9_]*)/g, (s, n) => vars[n] !== undefined ? vars[n] : s);
  const rules = {};
  let first = null, cur = null;
  for (const raw of mkfile.split('\n')){
    if (/^[ \t]/.test(raw) && cur){ rules[cur].recipe.push(raw.replace(/^\t| {4}/,'')); continue; }
    const m = raw.match(/^([^:#\s][^:]*):(?:V:)?\s*(.*)$/);
    if (m){ cur = m[1].trim(); rules[cur] = { deps: m[2].trim().split(/\s+/).filter(Boolean), recipe: [] }; if (!first) first = cur; }
    else cur = null;
  }
  const target = argv[1] || first;
  if (!target || !rules[target]){ await io.err.write("mk: don't know how to mk '" + (target||'') + "'\n"); return 'error'; }
  const done = new Set();
  const build = async (t) => {
    if (done.has(t) || !rules[t]) return;
    done.add(t);
    for (const d of rules[t].deps) await build(d);
    for (const r of rules[t].recipe){
      await io.out.write(r + '\n');
      await Rc.run(p, r, io);
    }
  };
  await build(target);
  return '';
};

/* acid: the debugger, in flavour */
CMDS.acid = async (p, argv, io) => {
  const pid = argv[1];
  const q = pid ? Procs.find(pid) : null;
  if (pid && !q){ await io.err.write('acid: setproc: no such process\n'); return 'error'; }
  await io.out.write((q ? q.name + ' ' + q.pid + ': ' : '') + '/lib/acid/port\n/lib/acid/amd64\nacid: ');
  while (true){
    let line = await io.in.read();
    if (line === null) return '';
    line = line.trim();
    if (line === 'q' || line === 'exit') return '';
    if (line === 'stk()' && q) await io.out.write('At pc:0x0000202f: sleep+0x1e /sys/src/libc/9syscall/sleep.s:5\n\tsleep()+0x1e /sys/src/libc/9syscall/sleep.s:5\n\tmain()+0x42 /usr/glenda/src/' + q.name + '.c:12\n');
    else if (line === 'help' || line === 'whatis') await io.out.write('this is only an exhibit: try stk(), q\n');
    else if (line) await io.out.write('<stdin>:1: (error) ' + line.split('(')[0] + ' used but not set\n');
    await io.out.write('acid: ');
  }
};

/* con: dial and talk — the network is those files under /net */
CMDS.con = async (p, argv, io) => {
  const target = argv[argv.length-1];
  const m = (target||'').match(/^(?:tcp!)?([^!]+)!(\w+)$/);
  if (!m){ await io.err.write('usage: con tcp!host!port\n'); return 'usage'; }
  await io.out.write('connected to tcp!' + m[1] + '!' + m[2] + ' on /net/tcp/' + Net.conns.length + '\n');
  const cfd = FS.open(p, '/net/tcp/clone', 'r');
  const id = (await cfd.read()).trim();
  await FS.open(p, '/net/tcp/' + id + '/ctl', 'w').write('connect ' + (Net.hosts[m[1]]||m[1]) + '!' + (m[2]==='http'?80:m[2]));
  const dfd = FS.open(p, '/net/tcp/' + id + '/data', 'w');
  const line = await io.in.read();
  if (line !== null){
    await dfd.write(line);
    const rfd = FS.open(p, '/net/tcp/' + id + '/data', 'r');
    let c;
    while ((c = await rfd.read()) !== null) await io.out.write(c);
  }
  cfd.close();
  return '';
};
