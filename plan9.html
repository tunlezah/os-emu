The people       Thompson and Pike (Unix, then this, then Go),

You have been living in Plan 9's world the whole time. You just
never saw the room it came from. The living continuation is 9front
(9front.org) — still developed, still weird, still right about

T.doc9 = `PLAN 9 FROM BELL LABS
Pike, Presotto, Dorward, Flandrena, Thompson, Trickey, Winterbottom
Computing Science Research Center, Bell Laboratories
(retold briefly for this exhibit; the original is public and short)

By the mid-1980s Unix, born as one shared machine in a hallway,
had scattered into thousands of little self-contained workstations,
each administered by hand. The people who had built Unix concluded
the fix was not another window system bolted on top, but a new
system built from the network down. Plan 9's answer rests on three
decisions:

1. Resources are named and accessed like files, in hierarchies.
   Not "almost everything", as in Unix: everything. Windows,
   processes, network connections, the mouse in your hand.

2. One protocol, 9P, carries every access to every resource,
   local or remote. A kernel device, a user program and a file
   server across the country answer the same nine-ish messages.

3. Each process assembles a PRIVATE VIEW of everything reachable
   — its namespace — from those hierarchies, with bind and mount.

Machines specialise: terminals (like this one) provide a screen
and a mouse; CPU servers provide cycles; file servers provide
permanence. Because of decisions 1-3, gluing them together needs
no new mechanism at all: cpu(1) is a mount.

The CPU is fast and the system calls are few. The window system
is 300 lines... fewer than this page deserves. Read the real
paper; it is one of the best-written systems papers in the field.
`;

T.docnames = `THE USE OF NAME SPACES IN PLAN 9
Rob Pike et al., Bell Laboratories (retold for this exhibit)

Unix processes share one filesystem; changing it needs root and
changes it for everyone. Plan 9 turns that inside out: the name
space — the mapping from names to resources — is PER PROCESS,
mutable by ordinary programs, and built from three operations:

	bind  old new     make old visible at new
	bind -a|-b ...    append/prepend: a UNION directory
	mount srv dir     attach a 9P file server
	unmount ...       undo any of the above

rfork(2) controls whether a child shares its parent's namespace
or gets a private copy. From these small parts fall out, for free:
/bin as a union instead of $PATH; per-window /dev/cons and
/dev/mouse (which is why rio can run inside rio); cpu(1) bringing
your files to the fast machine instead of the other way round;
and backup as an ordinary directory you cd into (/n/dump).

The paper's key sentence, paraphrased: it is the combination of
per-process mutable name spaces with universal file servers that
gives the system its power — neither idea works alone.

(Twenty years later, Linux namespaces + overlayfs + a REST API
re-derived most of this and the world called it containers.)
`;

T.docacme = `ACME: A USER INTERFACE FOR PROGRAMMERS
Rob Pike (retold for this exhibit)

Acme is what you get if you take seriously the idea that TEXT IS
INTERFACE. Every scrap of text on the screen — file bodies, the
blue tags above them, output of commands — is live: button 2
executes it, button 3 finds or opens it. There are no menus; a
"menu" is any text file you keep handy (see /usr/glenda/guide).
There is no configuration; you edit the tag. There are no modes,
no shortcuts, no highlighting. The austerity is the point: what
is left is one idea, applied everywhere.

The mouse language: sweep with 1; execute with 2; look with 3;
1-2 cuts, 1-3 pastes, 2-1 executes-with-argument. Commands that
begin | < > pipe the selection through a process. Win runs a
shell whose transcript is just more editable, executable text.

Programs can serve their state as files (acme itself is a 9P
server), so external tools extend the editor without plugins.
`;

/* ---------- manual pages, Bell Labs sections ---------- */
const MAN = { 1: {}, 2: {}, 4: {}, 5: {}, 6: {}, 8: {} };

MAN[1].intro = `NAME
     intro - introduction to Plan 9 commands

DESCRIPTION
     Plan 9 is organised as terminals, CPU servers and file
     servers, glued by one protocol, 9P.  This manual uses the
     Bell Labs sections: 1 commands, 2 system calls, 4 file
     servers, 5 the 9P protocol, 6 file formats, 8 maintenance.

     There is no super-user; machines have a hostowner.  There
     is no $PATH; /bin is a union directory (see bind(1)).
     There are no configuration GUIs; there are text files.
     The shell is rc(1).  The editor is acme(1), or sam(1).

SEE ALSO
     rc(1), acme(1), bind(1), ns(1), rio(1)
     /usr/glenda/readme, /lib/exhibit`;

MAN[1].rc = `NAME
     rc - shell (command interpreter)

SYNOPSIS
     rc [ -i ] [ file [ arg ... ]]

DESCRIPTION
     Rc, by Tom Duff, holds LISTS, not strings; there is no
     word-splitting minefield and no quoting hell.

     path=(. /bin)         a list of two elements
     echo $#path           its length: 2
     echo $"path           joined: . /bin
     x=\`{date}             command substitution, split on \$ifs

     Control flow:
          if(test -e file){ echo yes }
          if not { echo no }            # there is no else
          for(i in a b c) echo $i
          while(test -e lock) sleep 1
          switch($x){ case *.c ; echo C source ; case * ; echo ? }
          fn sayhi { echo hi $1 }

     Redirection: > file, >> file, < file, and >[2=1] to merge
     stderr into stdout.  Pipes as usual.

EXAMPLES
     kill(1) kills nothing; it prints commands.  You decide:
          kill acme | rc

SOURCE
     /n/sources/plan9/sys/src/cmd/rc

BUGS
     There is no else.  This is not one of the bugs.`;

MAN[1].ls = `NAME
     ls, lc - list contents of directory

SYNOPSIS
     ls [ -dlmnpqrstuF ] name ...
     lc [ ... ]

DESCRIPTION
     For each directory argument, ls lists its contents; lc
     lists in columns.  -l gives mode, device, owner, group,
     size and time.  -p prints only the final path element.

     There is no -R.  Recursion is a different program's job:
     see walk(1) and du(1).  Unix habits go in /dev/null.`;

MAN[1].cat = `NAME
     cat - catenate files

SYNOPSIS
     cat [ file ... ]

DESCRIPTION
     Cat writes each file to standard output.  There are no
     options; see "UNIX Style, or cat -v Considered Harmful"
     (Pike & Kernighan, 1983).  Everything here is a file, so:

          cat /dev/mouse    your mouse, as text (Del stops it)
          cat /dev/snarf    the snarf buffer (the clipboard)
          cat /proc/1/status
          cat /dev/time`;

MAN[1].bind = `NAME
     bind, mount, unmount - change name space

SYNOPSIS
     bind [ -abc ] new old
     mount [ -abc ] servename old [ spec ]
     unmount [ new ] old

DESCRIPTION
     Bind makes the file tree at new visible at old.  With -a
     or -b the result is a UNION directory: members are searched
     in order, first match wins.  Mount attaches a 9P file
     server.  The change affects ONLY the current process's
     namespace group — usually, this window.

EXAMPLES
     The exhibit's central demonstration:
          bind /tmp /bin
          ls /bin              # this window is ruined
     ...open another window:  ls /bin  is untouched.  Recover:
          unmount /bin

     Why there is no $PATH:
          ns | grep bin        # /bin is a union; that IS the path

SEE ALSO
     ns(1), rfork in rc(1), intro(5)`;

MAN[1].ns = `NAME
     ns - display name space

SYNOPSIS
     ns [ pid ]

DESCRIPTION
     Ns prints the bind and mount operations that would
     RECREATE the current process's namespace: the world you
     are in, as a script.  With pid, another process's world.

     No other system in this museum can print such a thing,
     because in no other system is it a first-class object.

EXAMPLES
     ns
     ns | grep bin        # why /bin needs no $PATH
     cat /proc/$pid/ns    # same thing, as a file, naturally`;

MAN[1].acme = `NAME
     acme - a user interface for programmers

SYNOPSIS
     acme [ file ... ]

DESCRIPTION
     Acme edits text in columns of windows.  Each window has a
     TAG (pale blue, editable text: filename then commands) and
     a BODY.  All text everywhere is live:

     button 2  execute the word or sweep (Put, Del, |sort, date)
     button 3  look: open the file, jump to file:line, or find
     chords    1+2 cut, 1+3 paste, 2+1 execute with argument

     Commands starting | < > pipe the selection.  Edit runs
     sam's structural expressions:  Edit ,x/teh/ c/the/
     Win runs a shell whose transcript is editable text.
     Dump/Load save and restore your whole layout.

     There are no modes, no shortcuts, no configuration files
     and no syntax highlighting.  These are features; two
     decades of imitators added all four and subtracted the idea.

SEE ALSO
     /usr/glenda/guide, sam(1), plumb(1), /sys/doc/acme`;

MAN[1].sam = `NAME
     sam - screen editor with structural regular expressions

SYNOPSIS
     sam [ file ]

DESCRIPTION
     Sam commands take an address, then an operation; x
     EXTRACTS every match of a pattern and runs a command on
     each, so the unit of editing is the structure you name,
     not the line you happen to be on.

          ,p                 print everything
          ,x/Plan 9/ p       every occurrence
          ,x/teh/ c/the/     fix every typo at once
          ,s/old/new/g       substitute in the addressed text
          1,5d               delete lines 1-5
          ,x/^/ i/> /        quote a mail

     A worked lesson: /usr/glenda/guide.sam

SEE ALSO
     acme(1) (whose Edit command is this language)`;

MAN[1].rio = `NAME
     rio - window system

SYNOPSIS
     rio

DESCRIPTION
     Rio serves each window a private /dev/cons, /dev/mouse,
     /dev/winname...  A window is a namespace; that is the whole
     trick, and why rio runs happily inside a rio window.

     Button 3 on the grey desktop: New, Resize, Move, Delete,
     Hide.  New: hold button 3 and SWEEP the rectangle you
     want.  No default size, no cascade, no snapping, no title
     bars, no icons.  Focus follows the mouse; the focused
     window has the blue-green border.

     Button 2 in a text window: cut, paste, snarf, plumb, look,
     send, scroll.  Scrollbars are on the left: button 1 up,
     button 3 down, button 2 jumps absolute.

EXAMPLES
     rio                  # yes, in here.  ns will explain.`;

MAN[1].plumb = `NAME

SYNOPSIS
     plumb [ -d dest ] data ...

DESCRIPTION
     The plumber routes messages between programs by RULE
     (/usr/glenda/lib/plumbing, a text file you may edit; it
     re-reads on save).  Button 3 in most contexts plumbs.
     file:line goes to the editor at the line; URLs go to

FILES

SEE ALSO

MAN[1].yesterday = `NAME
     yesterday, history - print file names from the dump

SYNOPSIS
     yesterday [ -n days ] [ -c ] [ -D ] file ...
     history file ...

DESCRIPTION
     The file server takes a snapshot of everything, daily,
     forever, browsable at /n/dump/YYYY/MMDD/...  The past is a
     path; no tools required:

          cat /n/dump/2002/0417/usr/glenda/lib/profile

     Yesterday prints the dump path for file as of days ago

     yesterday -n 7 lib/profile

MAN[1].cpu = `NAME

SYNOPSIS
     cpu [ -h host ] [ -c cmd ]
     import [ -abc ] host file [ mountpoint ]

DESCRIPTION
     Cpu gives a shell on a CPU server with the TERMINAL'S
     namespace imported at /mnt/term: your files, your window,
     your very /dev/mouse, present on the fast machine.  Run
     ns before and after; compare.  exit returns.

     Import attaches one remote resource locally.  Any
     resource.  Including:

          import cycles /dev/mouse

     which multiplexes another machine's mouse with yours.
     Absurd, trivial, and exactly the point: it is all just 9P.

SEE ALSO

MAN[1].hoc = `NAME

SYNOPSIS

DESCRIPTION

MAN[1].mk = `NAME

SYNOPSIS
     mk [ target ]

DESCRIPTION

MAN[1].ps = `NAME
     ps - process status

SYNOPSIS
     ps

DESCRIPTION
     Ps prints one line per process.  It has almost no options
     because it has almost no work to do: it merely reads
     /proc/*/status, which you can do yourself:

          cat /proc/*/status

     /proc began here and in eighth edition Unix research
     systems; Linux later adopted it (and top, htop and every
     debugger you have used read it daily).

SEE ALSO
     kill(1), proc(4)`;

MAN[1].kill = `NAME
     kill, slay - print commands to stop processes

SYNOPSIS
     kill name ...

DESCRIPTION
     Kill kills NOTHING.  It prints, for each named process,
     the command that would kill it, and you decide what to do
     with the output — usually pipe it back to the shell:

          kill acme | rc

     The philosophy in one idiom: programs emit text; text
     composes; the human stays in the loop exactly one pipe
     longer than in other systems.

     Try kill rio | rc if you must.  The exhibit will recover.`;

MAN[1].grep = `NAME

SYNOPSIS

DESCRIPTION

MAN[1].walk = `NAME

MAN[1].games = `NAME

SYNOPSIS

MAN[1].stats = `NAME

SYNOPSIS

DESCRIPTION

MAN[1].man = `NAME

DESCRIPTION

MAN[1].date = `NAME

MAN[1].echo = `NAME

SYNOPSIS
     echo [ -n ] [ arg ... ]

DESCRIPTION
     Echo prints its arguments separated by blanks.  In rc

MAN[1].rm = `NAME

MAN[1].mothra = `NAME

SYNOPSIS

DESCRIPTION
     Mothra renders text and links and refuses to apologise.

MAN[1].page = `NAME

SYNOPSIS
     page file

DESCRIPTION

MAN[1].fortune = `NAME

DESCRIPTION

MAN[2].rfork = `NAME
     rfork - process resource management

SYNOPSIS
     in rc: rfork [ flags ]

DESCRIPTION
     Rfork controls what a process SHARES: n gives a fresh
     copy of the namespace (changes become private), e copies
     the environment, N a clean slate.  This choose-your-
     sharing call is the ancestor of Linux clone(2), and thus
     the system call under every container you have deployed.

EXAMPLES
     rfork n; bind /tmp /bin   # ruin /bin privately, guilt-free`;

MAN[4].plumber = `NAME
     plumber - file server for interprocess messaging

DESCRIPTION
     The plumber serves /mnt/plumb.  Programs read ports like
     /mnt/plumb/edit; plumb(1) writes to /mnt/plumb/send; rules
     live in $home/lib/plumbing.  Message routing as a file

MAN[4].proc = `NAME

DESCRIPTION

MAN[5].intro = `NAME
     intro - introduction to the Plan 9 File Protocol, 9P

DESCRIPTION
     A client transmits requests (T-messages); a server
     returns replies (R-messages): version, auth, attach,
     walk, open, create, read, write, clunk, remove, stat.
     That is the complete vocabulary between any program and
     any resource in this room — window, mouse, process, disk,
     other machines.  Watch it live: 9ptrace.

     9P today ships in WSL2 (Linux under Windows), QEMU's
     virtio-9p, and assorted kubelets: the protocol outlived
     the system, like everything else here (see /lib/exhibit).`;

MAN[6].plumbing = `NAME

DESCRIPTION

MAN[8].fshalt = `NAME

SYNOPSIS

DESCRIPTION

MAN[8].boot = `NAME
     boot - startup

DESCRIPTION
     The kernel asks two questions (root? user?) with the
     answers already bracketed, mounts the file server, and
     runs termrc, then $home/lib/profile — which builds the
     namespace this manual keeps going on about.  Read them:
     /rc/bin/termrc, /usr/glenda/lib/profile.  ESC skipped
     the boot, if you were here for it.`;

/* ---------- assemble the tree ---------- */
function buildFS(){
  const cmdlist = ['rc','ls','lc','cat','cp','mv','rm','mkdir','echo','pwd','touch','walk','du','df','file','cmp','diff',
    'grep','sed','sort','uniq','wc','tail','tr','seq','read','mc','test','sleep','bind','mount','unmount','ns',
    'ps','kill','slay','date','cal','yesterday','history','man','lookman','hoc','fortune','news','freq','unicode',
    'ascii','time','cpu','import','9fs','srv','plumb','window','fshalt','reboot','mk','acid','con','stats','faces',
    'mothra','page','9ptrace','acme','sam','rio','win','label','theme','audio','resetexhibit','troff','lp'];
  for (const c of cmdlist){
    const n = mkbin(c); n.cmd = c;
    FS.put('/386/bin/' + c, n);
  }
  for (const g of GAMES){
    const n = mkbin(g); n.cmd = g === 'clock' ? 'clock' : g;
    FS.put('/386/bin/games/' + g, n);
  }
  /* mount points must exist before anything can be bound over them */
  for (const d of ['/dev','/proc','/env','/srv','/fd','/net','/bin','/mnt/plumb','/mnt/wsys','/root','/n']) FS.plant(d);

  /* rc scripts in /rc/bin */
  FS.put('/rc/bin/termrc', mkfile('termrc', T.termrc));
  FS.put('/rc/bin/plumber', Object.assign(mkbin('plumber'), { cmd: 'plumber' }));
  CMDS.plumber = async (p, argv, io) => {
    Plumber.loadRules(await FS.readAll(p, '/usr/glenda/lib/plumbing').catch(() => ''));
    SRV.post('plumb', DEV.plumbdir);
    return '';
  };

  /* home */
  FS.put('/usr/glenda/lib/profile', mkfile('profile', T.profile));
  FS.put('/usr/glenda/lib/plumbing', mkfile('plumbing', T.plumbing));
  FS.put('/usr/glenda/lib/utf8', mkfile('utf8', T.utf8));
  FS.put('/usr/glenda/readme', mkfile('readme', T.readme));
  FS.put('/usr/glenda/guide', mkfile('guide', T.guide));
  FS.put('/usr/glenda/guide.sam', mkfile('guide.sam', T.guidesam));
  FS.put('/usr/glenda/bin/rc/riostart', mkfile('riostart', T.riostart));
  FS.put('/usr/glenda/src/hello.c', mkfile('hello.c', T.hello));
  FS.put('/usr/glenda/src/mkfile', mkfile('mkfile', T.mkfile));
  FS.plant('/usr/glenda/tmp');
  FS.put('/usr/glenda/lib/glenda', mkfile('glenda', T.mascot));

  /* /lib */
  FS.put('/lib/exhibit', mkfile('exhibit', T.exhibit));
  FS.put('/lib/theme', mkfile('theme', T.theme));
  FS.put('/lib/news/exhibit', mkfile('exhibit', T.news));
  FS.put('/lib/ndb/local', mkfile('local', 'sys=gnot ip=135.104.9.6 ether=00c04f172a9e\n\tdom=gnot.research.bell-labs.com\nsys=cycles ip=135.104.9.42 proto=il\n\tdom=cycles.research.bell-labs.com cpu\nsys=emelie ip=204.178.31.9 fileserver\n'));
  FS.put('/lib/keyboard', mkfile('keyboard', 'there are no keyboard shortcuts.\nthe compose key writes unicode; this exhibit accepts what your browser sends.\n'));

  /* /sys */
  FS.put('/sys/doc/9', mkfile('9', T.doc9));
  FS.put('/sys/doc/names', mkfile('names', T.docnames));
  FS.put('/sys/doc/acme', mkfile('acme', T.docacme));
  FS.put('/sys/doc/utf', mkfile('utf', T.utf8));
  FS.put('/sys/games/lib/fortunes', mkfile('fortunes', T.fortunes));
  for (const sec of Object.keys(MAN)){
    for (const name of Object.keys(MAN[sec])){
      FS.put('/sys/man/' + sec + '/' + name, mkfile(name, MAN[sec][name] + '\n'));
    }
  }
  FS.put('/sys/src/9/pc/main.c', mkfile('main.c', '/* the kernel source lives on sources; 9fs sources */\n'));
  FS.put('/sys/lib/dist/mkfile', mkfile('mkfile', '# distribution build\n'));

  /* /adm */
  FS.put('/adm/users', mkfile('users', '-1:adm:adm:bootes,glenda\n0:none::\n1:tor:tor:\n2:glenda:glenda:\n3:bootes:bootes:\n'));
  FS.put('/adm/timezone/local', mkfile('local', 'EST -18000 EDT -14400\n'));

  /* /tmp and /mnt */
  FS.plant('/tmp');
  FS.plant('/mnt/term');
  FS.plant('/n');

  /* /dev as a real path too (namespace binds the kernel device here) */
  /* /n/sources: the public tree, mounted on demand with 9fs sources */
  const src = mkdir('sources');
  SRV.post('sources', src);
  const P = (p, txt) => {
    const parts = p.split('/');
    let d = src;
    for (const el of parts.slice(0, -1)){ if (!d.children[el]) d.children[el] = mkdir(el); d = d.children[el]; }
    d.children[parts[parts.length-1]] = mkfile(parts[parts.length-1], txt);
  };
  P('plan9/LICENSE', 'Lucent Public License 1.02 — later relicensed MIT (2021),\nnineteen years too late to matter and just in time to be loved.\n');
  P('plan9/sys/src/cmd/cat.c', '#include <u.h>\n#include <libc.h>\n\nvoid\ncat(int f, char *s)\n{\n\tchar buf[8192];\n\tlong n;\n\n\twhile((n=read(f, buf, (long)sizeof buf))>0)\n\t\tif(write(1, buf, n)!=n)\n\t\t\tsysfatal("write error copying %s: %r", s);\n\tif(n < 0)\n\t\tsysfatal("error reading %s: %r", s);\n}\n\nvoid\nmain(int argc, char *argv[])\n{\n\tint f, i;\n\n\targv0 = "cat";\n\tif(argc == 1)\n\t\tcat(0, "<stdin>");\n\telse for(i=1; i<argc; i++){\n\t\tf = open(argv[i], OREAD);\n\t\tif(f < 0)\n\t\t\tsysfatal("can\'t open %s: %r", argv[i]);\n\t\telse{\n\t\t\tcat(f, argv[i]);\n\t\t\tclose(f);\n\t\t}\n\t}\n\texits(0);\n}\n/* the whole program. no -v. */\n');
  P('plan9/sys/src/cmd/echo.c', '#include <u.h>\n#include <libc.h>\n\n/* echo.c: 27 lines in the real tree */\n');
  P('plan9/sys/src/9/port/devmouse.c', '/* the mouse driver: it serves a FILE. that is the entire idea. */\n');
  P('contrib/README', 'user contributions, mounted from sources.cs.bell-labs.com\n');

  SRV.post('boot', FS.root);
  SRV.post('slashn', FS.plant('/n'));
}

/* ---------- the dump: fossil's daily archives ---------- */
const Dump = {
  dates: [],
  dayName(d){
    const y = d.getFullYear();
    const md = (d.getMonth()+1 < 10 ? '0' : '') + (d.getMonth()+1) + (d.getDate() < 10 ? '0' : '') + d.getDate();
    return { y: String(y), md };
  },
  pathFor(daysAgo, cpath){
    const d = new Date(now() - daysAgo * 864e5);
    const dd = this.dayName(d);
    /* snap to nearest dump at or before the request */
    let best = null;
    for (const s of this.dates){
      if (s.y < dd.y || (s.y === dd.y && s.md <= dd.md)) best = best || s;
    }
    const use = this.dates.find(s => s.y === dd.y && s.md === dd.md) || best || this.dates[this.dates.length-1];
    if (!use) return null;
    return '/n/dump/' + use.y + '/' + use.md + cpath;
  },
  copyTree(node){
    if (node.syn) return null;
    if (node.dir){
      const d = mkdir(node.name);
      d.frozen = true;
      d.mtime = node.mtime;
      for (const k of Object.values(node.children)){
        const c = this.copyTree(k);
        if (c) d.children[c.name] = c;
      }
      return d;
    }
    if (node.bin){ const b = mkbin(node.name); b.frozen = true; return b; }
    const f = mkfile(node.name, node.data);
    f.frozen = true; f.mtime = node.mtime;
    return f;
  },
  build(){
    const dumpRoot = FS.plant('/n/dump');
    SRV.post('dump', dumpRoot);
    const days = [1, 7, 32];
    for (const ago of days){
      const d = new Date(now() - ago * 864e5);
      const dd = this.dayName(d);
      this.dates.push(dd);
      const yd = FS.plant('/n/dump/' + dd.y);
      const day = mkdir(dd.md); day.frozen = true;
      yd.children[dd.md] = day;
      /* snapshot /usr and /rc and /lib as they were "then" */
      for (const top of ['usr','rc','lib','sys','adm']){
        const c = this.copyTree(FS.root.children[top]);
        if (c) day.children[top] = c;
      }
      /* the past differs, so the lesson lands */
      const glenda = day.children['usr'] && day.children['usr'].children['glenda'];
      if (glenda){
        const stamp = ['Thu','Fri','Sat','Sun','Mon','Tue','Wed'][d.getDay()] + ' ' + d.toDateString().slice(4, 10);
        if (glenda.children['readme']){
          glenda.children['readme'].data = '(dump of ' + dd.y + '/' + dd.md + ' — this file as it was ' + ago + ' day' + (ago>1?'s':'') + ' ago)\n\n' + glenda.children['readme'].data;
        }
        if (ago >= 7 && glenda.children['lib'] && glenda.children['lib'].children['profile']){
          glenda.children['lib'].children['profile'].data = T.profile.replace('fn lc { ls -p $* | mc }\n', '') +
            '\n# (as of ' + stamp + ' — before glenda added the lc function)\n';
        }
        if (ago >= 32){
          delete glenda.children['guide.sam'];
          if (glenda.children['src']) delete glenda.children['src'].children['hello.c'];
        }
      }
    }
    this.dates.sort((a,b) => (b.y+b.md) < (a.y+a.md) ? -1 : 1);
  },
};
</script>
<script>
/* ==================================================================
   BOOT AND LOGIN — terse and question-shaped, then STATE, then GO.
   ================================================================== */

const StateMgr = {
  key: 'plan9exhibit.v1',
  ready: false, timer: null,
  serNode(n){
    if (n.syn || n.frozen) return null;
    if (n.bin) return null;
    if (n.dir){
      const kids = [];
      for (const k of Object.values(n.children)){
        const s = this.serNode(k);
        if (s) kids.push(s);
      }
      return { n: n.name, d: 1, k: kids };
    }
    return { n: n.name, data: n.data };
  },
  desNode(s){
    if (s.d){
      const d = mkdir(s.n);
      for (const k of s.k){ const c = this.desNode(k); d.children[c.name] = c; }
      return d;
    }
    return mkfile(s.n, s.data);
  },
  save(){
    if (!this.ready) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.doSave(), 500);
  },
  touch(path){ if (path && path.startsWith('/usr/glenda')) this.save(); },
  doSave(){
    if (!this.ready) return;
    try {
      const home = FS.root.children['usr'] && FS.root.children['usr'].children['glenda'];
      const winrects = WM.windows.filter(w => w.kind === 'term' && !w.deleted).map(w => ({ ...w.rect, hidden: w.hidden }));
      const data = {
        home: home ? this.serNode(home) : null,
        snarf: Snarf.buf,
        hist: HistoryLog.lines.slice(-200),
        theme: THEME,
        sound: Sound.on,
        wins: winrects,
      };
      localStorage.setItem(this.key, JSON.stringify(data));
    } catch(e){}
  },
  load(){
    try {
      const raw = localStorage.getItem(this.key);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (data.home){
        const usr = FS.root.children['usr'];
        const fresh = this.desNode(data.home);
        fresh.name = 'glenda';
        usr.children['glenda'] = fresh;
      }
      Snarf.buf = data.snarf || '';
      HistoryLog.lines = data.hist || [];
      THEME = data.theme || 'plan9';
      Sound.on = !!data.sound;
      return data;
    } catch(e){ return null; }
  },
  reset(){
    this.ready = false;
    try { localStorage.removeItem(this.key); } catch(e){}
    setTimeout(() => location.reload(), 600);
  },
};
window.addEventListener('beforeunload', () => { if (StateMgr.ready) StateMgr.doSave(); });

const Boot = {
  active: true, el: $id('boot'), buf: '', input: '', prompting: null, timers: [],
  saved: null,

  render(){
    this.el.innerHTML = esc(this.buf + this.input) + '<span class="cur">&nbsp;</span>' +
      (this.prompting || this.buf.length < 200 ? '<div style="position:absolute;right:10px;bottom:6px;color:#999">Esc skips the boot</div>' : '');
  },
  out(s){ this.buf += s; this.render(); },

  sequence(){
    const L = [
      [0,   'PBS2...\n'],
      [180, 'Plan 9 from Bell Labs\n'],
      [120, 'ELCR: 0E20\n'],
      [60,  'cpu0: 2394MHz GenuineIntel P6 (AX 000006E8 CX 0000E39D DX BFEBFBFF)\n'],
      [90,  '#l0: i82557: 100Mbps port 0x1080 irq 11: 00c04f172a9e\n'],
      [60,  '512M memory: 207M kernel data, 305M user, 950M swap\n'],
      [110, 'sdC0: LBA 41,929,650 sectors\nfound partition #S/sdC0/data 63 41,929,649\nfound partition #S/sdC0/fossil 128,000 39,000,000\n'],
      [140, 'venti...2026/0807 announce tcp!127.1!17034\nfossil(#S/sdC0/fossil)...version...time...\n\n'],
    ];
    let t = 0;
    for (const [dt, text] of L){
      t += dt;
      this.timers.push(setTimeout(() => this.out(text), t));
    }
    this.timers.push(setTimeout(() => this.ask('root is from (tcp, local)[local!#S/sdC0/fossil]: ', () => {
      this.ask('user[glenda]: ', (u) => {
        this.out('\n');
        setTimeout(() => this.startInit(u || 'glenda'), 120);
      });
    }), t + 260));
  },
  ask(prompt, cb){
    this.out(prompt);
    this.input = '';
    this.prompting = cb;
    this.render();
  },
  key(ev){
    if (ev.key === 'Escape'){ this.skip(); return; }
    if (!this.prompting) return;
    if (ev.key === 'Enter'){
      const cb = this.prompting, v = this.input;
      this.prompting = null;
      this.buf += this.input + '\n';
      this.input = '';
      cb(v.trim());
      return;
    }
    if (ev.key === 'Backspace'){ this.input = this.input.slice(0, -1); this.render(); return; }
    if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey){ this.input += ev.key; this.render(); }
  },
  skip(){
    for (const t of this.timers) clearTimeout(t);
    this.timers = [];
    if (this.started) return;
    this.out('\n(boot skipped)\n');
    this.startInit('glenda');
  },

  async startInit(user){
    if (this.started) return;
    this.started = true;
    this.prompting = null;
    this.out('time...\ninit: starting /bin/rc\n');

    /* the login environment */
    const env = new Map(Object.entries({
      user: [user], home: ['/usr/glenda'], sysname: ['gnot'], cputype: ['386'], objtype: ['386'],
      service: ['terminal'], terminal: ['generic pc'], path: [ '/386/bin', '/rc/bin', '.' ],
      prompt: ['term% ', '\t'], ifs: [' \t\n'], rootspec: ['main/active'], rootdir: ['/root'],
      'font': ['/lib/font/bit/lucidasans/euro.8.font'],
    }));

    /* the kernel's initial namespace: devices bound over the tree */
    const ns = new Namespace();
    const hostProc = Procs.alloc({ name: 'init', args: ['init','-tm'], ns, env, cwd: '/usr/glenda', window: null });
    hostProc.user = user;
    const kbind = (op, dev, dst) => { ns.tab.set(dst, [dev]); ns.ops.push(op); };
    ns.ops.push('bind  / /');
    ns.tab.set('/', [FS.root]);
    kbind("bind  '#c' /dev", DEV.consdir, '/dev');
    kbind("bind  '#d' /fd", DEV.fddir, '/fd');
    kbind("bind -c '#e' /env", DEV.envdir, '/env');
    kbind("bind  '#p' /proc", DEV.procdir, '/proc');
    kbind("bind -c '#s' /srv", DEV.srvdir, '/srv');
    ns.ops.push("mount -aC '#s'/boot /root main/active");
    ns.ops.push('bind -a /root /');
    WM.hostProc = hostProc;

    const bootIO = {
      in: { read: async () => null },
      out: { write: async (s) => { this.out(s); await new Promise(r => setTimeout(r, 10)); } },
      err: { write: async (s) => { this.out(s); await new Promise(r => setTimeout(r, 10)); } },
    };

    /* run the real startup scripts through the real rc */
    this.out('\n% . /rc/bin/termrc\n');
    try { await Rc.run(hostProc, await FS.readAll(hostProc, '/rc/bin/termrc'), bootIO); } catch(e){}
    this.out('% . ' + '/usr/glenda/lib/profile\n');
    try { await Rc.run(hostProc, await FS.readAll(hostProc, '/usr/glenda/lib/profile'), bootIO); } catch(e){}
    this.out('% rio -i riostart\n');

    /* rio itself is a process; kill rio | rc finds it */
    const rioProc = Procs.alloc({ name: 'rio', args: ['rio','-i','riostart'], parent: hostProc });
    rioProc.state = 'Await';
    RIO_PROC = rioProc;

    WM.loginNS = hostProc.ns;
    WM.loginEnv = hostProc.env;

    setTimeout(() => this.riostart(), 420);
  },

  async riostart(){
    this.active = false;
    this.el.style.display = 'none';
    WM.applyTheme();
    applyScale();
    if (this.saved && this.saved.wins && this.saved.wins.length){
      for (const r of this.saved.wins){
        const w = WM.newWindow({ x: r.x, y: r.y, w: r.w, h: r.h });
        if (r.hidden) w.hide();
      }
    } else {
      try { await Rc.run(WM.hostProc, await FS.readAll(WM.hostProc, '/usr/glenda/bin/rc/riostart'),
        { in: { read: async () => null }, out: { write: async()=>{} }, err: { write: async()=>{} } }); } catch(e){}
      /* greet the visitor in the first window */
      const w = WM.windows.find(x => x.kind === 'term');
      if (w && w.term) setTimeout(() => {
        w.term.output('Plan 9 from Bell Labs, Fourth Edition — an OS Museum exhibit.\nStart here:  cat readme      (or just:  cat /dev/mouse  and wiggle)\n');
      }, 300);
    }
    StateMgr.ready = true;
  },

  halt(){
    this.active = true;
    this.el.style.display = 'block';
    this.buf = 'halting fossil...\ndone halting\n\nit is safe to turn off the machine now.\n\n(click, or any key, to boot again)\n';
    this.prompting = null;
    this.render();
    const again = () => { location.reload(); };
    this.el.addEventListener('mousedown', again, { once: true });
    this.key = () => again();
  },
  reboot(reason){
    if (StateMgr.ready) StateMgr.doSave();
    this.active = true;
    this.el.style.display = 'block';
    this.buf = (reason ? reason + '\n' : '') + 'rio: exiting\ninit: rc exited, rebooting...\n';
    this.prompting = null;
    this.render();
    setTimeout(() => location.reload(), 1600);
  },
};
let RIO_PROC = null;

/* killing rio does exactly what it says */
const _killProc = killProc;
killProc = function(p){
  if (p === RIO_PROC || (p.name === 'rio' && !p.window)){
    Boot.reboot('rio: killed by note');
    return;
  }
  _killProc(p);
};

/* ---------- go ---------- */
buildFS();
Dump.build();
Boot.saved = StateMgr.load();
Plumber.loadRules(T.plumbing);
applyScale();
Boot.render();
Boot.sequence();
</script>
</body>
