<script>
/* ==================================================================
   TEXT ENGINE
   One frame implementation shared by rio windows, acme and sam:
   left-hand scrollbar with the three-button protocol, sweep
   selection, and mouse chording via the e.buttons bitmask.
   ================================================================== */

const SBARW = 12;
const TEXTPAD = 4;

const FontCache = {
  caches: {},
  ctx: null,
  width(font, ch){
    if (!this.ctx){ const c = document.createElement('canvas'); this.ctx = c.getContext('2d'); }
    let m = this.caches[font];
    if (!m) m = this.caches[font] = new Map();
    let w = m.get(ch);
    if (w === undefined){
      this.ctx.font = font;
      w = this.ctx.measureText(ch).width;
      m.set(ch, w);
    }
    return w;
  },
};

class TextView {
  constructor(opts){
    this.w = opts.w; this.h = opts.h;
    this.colors = opts.colors;           /* {bg, fg, sel, sbtrough, sbthumb, border} */
    this.font = opts.font || FONT_PROP;
    this.editable = opts.editable !== false;
    this.onExec = opts.onExec || null;   /* (text, q0, q1, chordArg) */
    this.onLook = opts.onLook || null;
    this.onChange = opts.onChange || null;
    this.onSnarfCut = opts.onSnarfCut || null;
    this.tagBox = !!opts.tagBox;         /* acme tags: a layout box instead of a scrollbar */
    this.dirty = false;
    this.noWrap = !!opts.noWrap;
    this.minEdit = 0;                    /* terminal: cannot edit before this */
    this.t = '';
    this.q0 = 0; this.q1 = 0;
    this.orgLine = 0;
    this._lines = null;
    this.el = document.createElement('canvas');
    this.el.style.width = '100%'; this.el.style.height = '100%';
    this.ctx = this.el.getContext('2d');
    this.ms = { b: 0, start: -1, chorded: false, execStart: -1 };
    this.resize(opts.w, opts.h);
  }

  resize(w, h){
    this.w = Math.max(w, 20); this.h = Math.max(h, LINEH);
    const dpr = (window.devicePixelRatio || 1) * (WM.scale || 1);
    this.el.width = Math.round(this.w * dpr);
    this.el.height = Math.round(this.h * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this._lines = null;
    this.render();
  }
  visLines(){ return Math.max(1, Math.floor(this.h / LINEH)); }
  chw(ch){ return FontCache.width(this.font, ch); }
  textW(){ return this.w - SBARW - TEXTPAD - 2; }

  layout(){
    if (this._lines) return this._lines;
    const L = [];
    const tw = this.textW();
    let s = 0, x = 0, i = 0;
    const t = this.t;
    for (i = 0; i < t.length; i++){
      const ch = t[i];
      if (ch === '\n'){ L.push({s, e: i}); s = i + 1; x = 0; continue; }
      const cw = ch === '\t' ? this.chw(' ') * 4 : this.chw(ch);
      if (!this.noWrap && x + cw > tw && i > s){ L.push({s, e: i, wrap: true}); s = i; x = 0; }
      x += cw;
    }
    L.push({s, e: t.length});
    this._lines = L;
    return L;
  }
  lineOfPos(pos){
    const L = this.layout();
    let lo = 0, hi = L.length - 1;
    while (lo < hi){
      const mid = (lo + hi + 1) >> 1;
      if (L[mid].s <= pos) lo = mid; else hi = mid - 1;
    }
    return lo;
  }
  posAt(mx, my){
    const L = this.layout();
    const li = clamp(this.orgLine + Math.floor(my / LINEH), 0, L.length - 1);
    const ln = L[li];
    let x = SBARW + TEXTPAD;
    for (let i = ln.s; i < ln.e; i++){
      const cw = this.t[i] === '\t' ? this.chw(' ') * 4 : this.chw(this.t[i]);
      if (mx < x + cw / 2) return i;
      x += cw;
    }
    return ln.e;
  }

  text(){ return this.t; }
  setText(s){ this.t = s; this._lines = null; this.q0 = this.q1 = clamp(this.q0, 0, s.length); this.orgLine = clamp(this.orgLine, 0, this.layout().length - 1); this.render(); if (this.onChange) this.onChange(); }
  insert(pos, s, silent){
    pos = clamp(pos, 0, this.t.length);
    this.t = this.t.slice(0, pos) + s + this.t.slice(pos);
    if (this.q0 >= pos) this.q0 += s.length;
    if (this.q1 >= pos) this.q1 += s.length;
    if (this.minEdit > pos) this.minEdit += s.length;
    this._lines = null;
    if (!silent){ this.render(); if (this.onChange) this.onChange(); }
  }
  del(a, b, silent){
    a = clamp(a, 0, this.t.length); b = clamp(b, a, this.t.length);
    if (a === b) return;
    this.t = this.t.slice(0, a) + this.t.slice(b);
    const adj = (q) => q <= a ? q : (q >= b ? q - (b - a) : a);
    this.q0 = adj(this.q0); this.q1 = adj(this.q1); this.minEdit = adj(this.minEdit);
    this._lines = null;
    if (!silent){ this.render(); if (this.onChange) this.onChange(); }
  }
  select(a, b){ this.q0 = clamp(a, 0, this.t.length); this.q1 = clamp(b, this.q0, this.t.length); this.render(); }

  show(pos){
    const li = this.lineOfPos(clamp(pos, 0, this.t.length));
    const vis = this.visLines();
    if (li < this.orgLine) this.orgLine = li;
    else if (li >= this.orgLine + vis) this.orgLine = li - vis + 1;
    this.render();
  }
  scrollTo(line){
    this.orgLine = clamp(line, 0, Math.max(0, this.layout().length - 1));
    this.render();
  }

  render(){
    const c = this.ctx;
    const L = this.layout();
    this.orgLine = clamp(this.orgLine, 0, Math.max(0, L.length - 1));
    c.fillStyle = this.colors.bg;
    c.fillRect(0, 0, this.w, this.h);
    const vis = this.visLines();
    if (this.tagBox){
      /* acme's layout box: dark blue when the window is dirty */
      c.fillStyle = this.colors.sbtrough;
      c.fillRect(0, 0, SBARW - 1, this.h);
      c.strokeStyle = '#8888cc';
      c.strokeRect(1.5, 1.5, SBARW - 4, Math.min(this.h, LINEH) - 3);
      if (this.dirty){ c.fillStyle = '#000099'; c.fillRect(3, 3, SBARW - 7, Math.min(this.h, LINEH) - 6); }
    } else {
      /* the scrollbar is on the LEFT: dark trough, light elevator */
      c.fillStyle = this.colors.sbtrough;
      c.fillRect(0, 0, SBARW - 1, this.h);
      c.fillStyle = this.colors.bg;
      c.fillRect(SBARW - 1, 0, 1, this.h);
      const total = Math.max(1, L.length);
      const y0 = this.h * (this.orgLine / total);
      const y1 = this.h * Math.min(1, (this.orgLine + vis) / total);
      c.fillStyle = this.colors.sbthumb;
      c.fillRect(0, y0, SBARW - 2, Math.max(3, y1 - y0));
    }
    /* text */
    c.font = this.font;
    c.textBaseline = 'alphabetic';
    const selA = Math.min(this.q0, this.q1), selB = Math.max(this.q0, this.q1);
    for (let row = 0; row < vis; row++){
      const li = this.orgLine + row;
      if (li >= L.length) break;
      const ln = L[li];
      const y = row * LINEH;
      /* selection background */
      if (selB > selA && selB > ln.s && selA <= ln.e){
        let x = SBARW + TEXTPAD, sx = -1, ex = -1;
        for (let i = ln.s; i <= ln.e; i++){
          if (i === selA) sx = x;
          if (i === selB) ex = x;
          if (i < ln.e) x += this.t[i] === '\t' ? this.chw(' ') * 4 : this.chw(this.t[i]);
        }
        if (sx < 0) sx = SBARW + TEXTPAD;
        if (ex < 0) ex = (selB > ln.e) ? this.w : x;
        if (selB > ln.e && this.t[ln.e] === '\n') ex = this.w;
        c.fillStyle = this.colors.sel;
        c.fillRect(sx, y, Math.max(ex - sx, selB > selA ? 2 : 0), LINEH);
      }
      /* the tick */
      if (this.q0 === this.q1 && this.q0 >= ln.s && this.q0 <= ln.e && this.focused){
        if (!(this.q0 === ln.e && li + 1 < L.length && L[li+1].s === ln.e && this.q0 !== this.t.length && L[li+1].wrap)){
          let x = SBARW + TEXTPAD;
          for (let i = ln.s; i < this.q0; i++) x += this.t[i] === '\t' ? this.chw(' ') * 4 : this.chw(this.t[i]);
          c.fillStyle = this.colors.fg;
          c.fillRect(x - 1, y + 1, 2, LINEH - 2);
          c.fillRect(x - 3, y + 1, 6, 2);
          c.fillRect(x - 3, y + LINEH - 3, 6, 2);
        }
      }
      /* glyphs */
      c.fillStyle = this.colors.fg;
      let x = SBARW + TEXTPAD;
      for (let i = ln.s; i < ln.e; i++){
        const ch = this.t[i];
        if (ch === '\t'){ x += this.chw(' ') * 4; continue; }
        c.fillText(ch, x, y + LINEH - 4);
        x += this.chw(ch);
      }
    }
  }

  /* word under position: for button 2 execute and button 3 look */
  wordAt(pos){
    const t = this.t;
    const isw = (ch) => ch && /[^\s]/.test(ch);
    let a = pos, b = pos;
    while (a > 0 && isw(t[a-1]) && t[a-1] !== '\n') a--;
    while (b < t.length && isw(t[b])) b++;
    return { a, b, w: t.slice(a, b) };
  }
  dblWordAt(pos){
    const t = this.t;
    /* double-click: brackets and quotes select their contents; else alnum runs */
    const pairs = {'{':'}','[':']','(':')','\'':'\'','"':'"','`':'`'};
    if (pairs[t[pos-1]]){
      const close = pairs[t[pos-1]];
      const e = t.indexOf(close, pos);
      if (e >= 0) return {a: pos, b: e};
    }
    if (t[pos] === '\n' || pos === t.length || (pos > 0 && t[pos-1] === '\n' && t[pos] === undefined)){
      const li = this.lineOfPos(pos), ln = this.layout()[li];
      return {a: ln.s, b: Math.min(ln.e + 1, t.length)};
    }
    const isw = (ch) => ch && /[A-Za-z0-9_.\-\/]/.test(ch);
    let a = pos, b = pos;
    while (a > 0 && isw(t[a-1])) a--;
    while (b < t.length && isw(t[b])) b++;
    if (a === b) return {a: pos, b: Math.min(pos+1, t.length)};
    return {a, b};
  }

  /* ---- mouse protocol ---- */
  mousedown(ev, mx, my, btn){
    const b = btn || (ev.button === 0 ? 1 : ev.button === 1 ? 2 : 3);
    if (mx < SBARW){ this.sbClick(b, my); this.ms.b = -1; return; }
    const pos = this.posAt(mx, my);
    if (this.ms.b > 0 && this.ms.b !== b){
      /* CHORD: a second button while the first is held */
      this.chord(this.ms.b, b, pos);
      this.ms.chorded = true;
      return;
    }
    this.ms.b = b; this.ms.chorded = false; this.ms.moved = false;
    if (b === 1){
      const nw = now();
      if (this.lastClick && nw - this.lastClick.t < 400 && Math.abs(this.lastClick.pos - pos) <= 1){
        const w = this.dblWordAt(pos);
        this.select(w.a, w.b);
        this.ms.start = -1;
        this.lastClick = null;
        return;
      }
      this.lastClick = { t: nw, pos };
      this.ms.start = pos;
      this.select(pos, pos);
    } else if (b === 2 || b === 3){
      this.ms.start = pos;
      this.ms.execStart = pos;
      const sa = Math.min(this.q0, this.q1), sb = Math.max(this.q0, this.q1);
      if (!(pos >= sa && pos < sb && sb > sa)){
        const w = this.wordAt(pos);
        this.hl = { a: w.a, b: w.b, b2: b };
      } else this.hl = { a: sa, b: sb, b2: b, wasSel: true };
      this.render();
      this.drawHl();
    }
  }
  drawHl(){
    if (!this.hl) return;
    const save = [this.q0, this.q1];
    const sel = this.colors.sel;
    this.colors.sel = this.hl.b2 === 2 ? '#aa0000' : '#006600';
    const saveFg = this.colors.fg;
    this.q0 = this.hl.a; this.q1 = this.hl.b;
    this.render();
    this.colors.sel = sel; this.colors.fg = saveFg;
    this.q0 = save[0]; this.q1 = save[1];
  }
  mousemove(ev, mx, my){
    if (this.ms.b === 1 && this.ms.start >= 0 && !this.ms.chorded){
      const pos = this.posAt(mx, my);
      if (pos !== this.q1){ this.ms.moved = true; this.q0 = this.ms.start; this.q1 = pos; if (this.q1 < this.q0){ this.q0 = pos; this.q1 = this.ms.start; } this.render(); }
    }
    if ((this.ms.b === 2 || this.ms.b === 3) && this.hl && !this.ms.chorded){
      const pos = this.posAt(mx, my);
      const w = this.wordAt(pos);
      if (!this.hl.wasSel && (w.a !== this.hl.a || w.b !== this.hl.b)){ this.hl.a = w.a; this.hl.b = w.b; this.render(); this.drawHl(); }
    }
  }
  mouseup(ev, mx, my, btn){
    const b = btn || (ev.button === 0 ? 1 : ev.button === 1 ? 2 : 3);
    if (b !== this.ms.b){ if (this.ms.b > 0) return; }
    const chorded = this.ms.chorded;
    const hl = this.hl;
    this.ms.b = 0; this.hl = null;
    if (chorded){ this.render(); return; }
    if (b === 2 && hl && this.onExec){
      const text = this.t.slice(hl.a, hl.b).trim();
      this.render();
      if (text) this.onExec(text, hl.a, hl.b, null);
      return;
    }
    if (b === 3 && hl && this.onLook){
      const text = this.t.slice(hl.a, hl.b).trim();
      this.render();
      if (text) this.onLook(text, hl.a, hl.b);
      return;
    }
    this.render();
  }
  chord(base, second, pos){
    if (base === 1){
      if (second === 2){                     /* 1-2: cut */
        this.snarfSel(true);
      } else if (second === 3){              /* 1-3: paste */
        this.pasteSel();
      }
    } else if (base === 2 && second === 1 && this.hl && this.onExec){
      /* 2-1: execute with current selection (or snarf) as argument */
      const cmdText = this.t.slice(this.hl.a, this.hl.b).trim();
      const arg = (this.q1 > this.q0 ? this.t.slice(this.q0, this.q1) : Snarf.get()).trim();
      const h = this.hl; this.hl = null; this.ms.b = 0;
      this.render();
      if (cmdText) this.onExec(cmdText, h.a, h.b, arg);
    }
  }
  snarfSel(cut){
    const a = Math.min(this.q0, this.q1), b = Math.max(this.q0, this.q1);
    if (b <= a) return;

  pasteSel(){

    this.select(a, a + s.length);
    this.show(a + s.length);
  }
  sbClick(b, my){
    const vis = this.visLines();
    const k = Math.max(1, Math.floor(my / LINEH));
    if (b === 1) this.scrollTo(this.orgLine - k);                      /* up, by the clicked proportion */
    else if (b === 3) this.scrollTo(this.orgLine + k);                 /* down */
    else if (b === 2) this.scrollTo(Math.floor((my / this.h) * this.layout().length)); /* absolute */
  }
  wheel(dy){ this.scrollTo(this.orgLine + (dy > 0 ? 3 : -3)); }

  /* ---- keyboard ---- */
  key(ev){

      if (a < t.minEdit){ a = b = t.t.length; }
      if (b > a) t.del(a, b, true);
      t.insert(a, s, true);
      t.q0 = t.q1 = a + s.length;
      t._lines = null; t.show(t.q0); t.render();
      if (t.onChange) t.onChange();
      Sound.click();

      if (b > a && a >= t.minEdit){ t.del(a, b); t.show(t.q0); }
      else if (a > t.minEdit){ t.del(a-1, a); t.show(t.q0); }
      return true;
    }
    if (ev.key === 'Enter'){ put('\n'); return true; }
    if (ev.key === 'Tab'){ put('\t'); return true; }
    if (ev.ctrlKey && ev.key === 'u'){ const li = t.lineOfPos(t.q0); const s = t.layout()[li].s; if (t.q0 > s && s >= t.minEdit) t.del(Math.max(s, t.minEdit), t.q0); return true; }
    if (ev.ctrlKey && ev.key === 'w'){ let i = t.q0; while (i > t.minEdit && /\s/.test(t.t[i-1])) i--; while (i > t.minEdit && /\S/.test(t.t[i-1])) i--; if (i < t.q0) t.del(i, t.q0); return true; }
    if (ev.ctrlKey && ev.key === 'a'){ const li = t.lineOfPos(t.q0); t.select(t.layout()[li].s, t.layout()[li].s); return true; }
    if (ev.ctrlKey && ev.key === 'e'){ const li = t.lineOfPos(t.q0); t.select(t.layout()[li].e, t.layout()[li].e); return true; }
    if (ev.key === 'ArrowLeft'){ t.select(Math.max(0, a-1), Math.max(0, a-1)); t.show(t.q0); return true; }
    if (ev.key === 'ArrowRight'){ t.select(Math.min(t.t.length, b+1), Math.min(t.t.length, b+1)); t.show(t.q0); return true; }
    if (ev.key === 'ArrowUp'){ t.scrollTo(t.orgLine - 1); return true; }
    if (ev.key === 'ArrowDown'){ t.scrollTo(t.orgLine + 1); return true; }
    if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey){ put(ev.key); return true; }
    return false;
  }
}

/* ==================================================================
   TERMINAL — a rio text window running rc.
   Cooked mode: the text after opoint is the editable input line.
   ================================================================== */
class Term {
  constructor(win, opts){
    this.win = win;
    opts = opts || {};
    this.tv = new TextView({
      w: 10, h: 10,
      colors: termColors(),
      font: FONT_PROP,
      editable: true,
      onExec: null, onLook: null,
    });
    this.tv.term = this;
    this.opoint = 0;
    this.tv.minEdit = 0;
    this.inputq = [];
    this.inputWaiters = [];
    this.rawmode = false;
    this.holding = false;
    this.scrollOn = true;
    this.tv.onLook = (text) => { Plumber.dispatch(this.proc || WM.hostProc, text); };
    this.tv.onExec = null;
  }
  colorsChanged(){ this.tv.colors = termColors(); this.tv.render(); }
  output(s){
    s = String(s).replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\x07/g, () => { Sound.error(); return ''; });
    /* backspace handling for raw-ish writers */
    while (s.startsWith('\b')){ if (this.opoint > 0){ this.tv.del(this.opoint-1, this.opoint, true); this.opoint--; } s = s.slice(1); }
    const atEnd = this.tv.q0 >= this.opoint;
    this.tv.insert(this.opoint, s, true);
    this.opoint += s.length;
    this.tv.minEdit = this.opoint;
    if (this.scrollOn) this.tv.show(this.opoint);
    else this.tv.render();
  }
  /* one read from /dev/cons = one line (cooked) */
  consRead(proc){
    if (this.inputq.length) return Promise.resolve(this.inputq.shift());
    return intrWait(proc, res => this.inputWaiters.push(res));
  }
  pushInput(line){
    if (this.inputWaiters.length) this.inputWaiters.shift()(line);
    else this.inputq.push(line);
  }
  key(ev){
    if (ev.key === 'Delete'){
      /* Del is the interrupt character */
      if (this.fg && !this.fg.dead) Procs.interrupt(this.fg);
      this.output('');
      return true;
    }
    if (ev.key === 'Enter'){
      /* take everything after opoint as the input line */
      this.tv.select(this.tv.t.length, this.tv.t.length);
      this.tv.insert(this.tv.t.length, '\n', true);
      const line = this.tv.t.slice(this.opoint);
      this.opoint = this.tv.t.length;
      this.tv.minEdit = this.opoint;
      this.tv.q0 = this.tv.q1 = this.opoint;
      this.tv.show(this.opoint);
      this.pushInput(line);
      Sound.click();
      return true;
    }
    return this.tv.key(ev);
  }
  async startShell(profileToo){
    const win = this.win;
    const proc = Procs.alloc({
      name: 'rc', args: ['rc','-i'],
      ns: WM.loginNS ? WM.loginNS.clone() : new Namespace(),
      env: new Map(WM.loginEnv || []),
      cwd: '/usr/glenda',
      window: win,
    });
    win.mainproc = proc;
    this.proc = proc;
    const io = {
      in: { read: () => this.consRead(proc) },
      out: { write: async (s) => { this.output(s); await new Promise(r => setTimeout(r, 0)); } },
      err: { write: async (s) => { this.output(s); await new Promise(r => setTimeout(r, 0)); } },
    };
    this.io = io;
    while (!proc.dead && !win.deleted){
      const prompt = (proc.env.get('prompt') || ['% '])[0];
      this.output(prompt);
      let line;
      try { line = await this.consRead(proc); } catch(e){ break; }
      if (line === null) break;
      line = line.replace(/\n$/, '');
      HistoryLog.push(line);
      this.fg = proc;
      proc.state = 'Running';
      try { await Rc.run(proc, line, io); }
      catch(e){ if (e && e.rcExit !== undefined){ break; } }
      proc.state = 'Await';
      this.fg = null;
    }
    if (!win.deleted) WM.deleteWindow(win);
  }
}
function termColors(){
  if (THEME === '9front') return { bg: THEME9FRONT.winbg, fg: '#000000', sel: THEME9FRONT.winsel, sbtrough: THEME9FRONT.winscroll, sbthumb: THEME9FRONT.winbg };
  return { bg: COL.winbg, fg: COL.wintext, sel: COL.winsel, sbtrough: COL.winscroll, sbthumb: COL.winbg };
}
const HistoryLog = {
  lines: [],
  push(l){ if (l && l.trim()){ this.lines.push(l); if (this.lines.length > 500) this.lines.shift(); StateMgr.save(); } },
};

<script>
/* ==================================================================

const Menu = {

  hover(x, y){

    const lx = (x - (parseFloat(this.el.style.left))), ly = (y - parseFloat(this.el.style.top));
    let hot = -1;
    [...this.el.children].forEach((d, i) => {
      const top = d.offsetTop, bot = top + d.offsetHeight;
      const inside = lx >= 0 && lx <= this.el.offsetWidth && ly >= top && ly < bot;
      d.classList.toggle('hot', inside);
      if (inside) hot = i;
    });
    this.hot = hot;
  },
  pick(){

    const hot = this.hot;

  hideNow(){ if (this.el){ this.el.remove(); this.el = null; } this.open = false; this.hot = -1; },

let WINID = 0;
class Window {
  constructor(wm, rect, label){

    this.el.className = 'p9win';
    this.body = document.createElement('div');
    this.body.className = 'body';
    this.el.appendChild(this.body);

  }
  applyRect(){
    const r = this.rect;

const WM = makeWM(SCREEN, null);
WM.loginNS = null;
WM.loginEnv = null;
WM.hostProc = null;

/* windows opened by commands get a sensible default rectangle */
let AUTOPOS = 0;
function autoRect(w, h){
  AUTOPOS = (AUTOPOS + 1) % 6;
  return { x: clamp(40 + AUTOPOS * 60, 0, SCREENW - w - 8), y: clamp(30 + AUTOPOS * 48, 0, SCREENH - h - 8), w, h };

WM.newWindow = function(rect, cmd, wm){

WM.appWindow = function(rect, label, mkApp, wm){

/* nested rio: the window's body becomes another grey desktop */
WM.nestedRio = function(proc){

/* ---------- theme & scale ---------- */

    }
    /* focus follows mouse */
    const wm = this.wmAt(x, y);
    const lp = this.toLocal(wm, x, y);
    const w = wm.winAt(lp.x, lp.y);
    if (w) wm.focus(w);
    else if (wm === WM && WM.focused && !ev.buttons) { /* pointing at grey desktop unfocuses */ WM.focus(null); }
    if (w) this.routeMouse(w, ev, 'hover', lp.x, lp.y, x, y);
  },

  up(ev){
    const { x, y } = evPos(ev);
    Mouse.update(x, y, this.buttonsOf(ev)); HUD.update();
    if (Boot.active) return;
    if (Menu.open){ Menu.hover(x, y); if (Menu.holding || Menu.hot >= 0) Menu.pick(); else Menu.holding = true; return; }
    if (this.sweep){
      const s = this.sweep;
      this.sweep = null;
      SCREEN.classList.remove('sweeping');
      $id('sweepbox').style.display = 'none';
      const rect = { x: Math.min(s.x0,s.x1), y: Math.min(s.y0,s.y1), w: Math.abs(s.x1-s.x0), h: Math.abs(s.y1-s.y0) };
      const wm = s.wm;
      const mode = wm.mode;
      wm.mode = null;
      if (rect.w < 60 || rect.h < 40){ Sound.error(); return; }
      if (mode === 'sweep') WM.newWindow(rect, null, wm);
      else if (mode === 'resize1' && wm.resizeTarget){ wm.resizeTarget.resizeTo(rect); wm.resizeTarget.raise(); wm.focus(wm.resizeTarget); wm.resizeTarget = null; }
      StateMgr.save();
      return;
    }
    if (this.moveGrab){ this.moveGrab.wm.mode = null; this.moveGrab = null; StateMgr.save(); return; }
    if (this.captive){
      const lp = this.toLocal(this.captive.wm, x, y);
      this.routeMouse(this.captive.win, ev, 'up', lp.x, lp.y, x, y);
      if (!(ev.buttons & 7)) this.captive = null;
      return;
    }
  },

  wheel(ev){
    if (Boot.active) return;
    const { x, y } = evPos(ev);
    const wm = this.wmAt(x, y);
    const lp = this.toLocal(wm, x, y);
    const w = wm.winAt(lp.x, lp.y);
    if (!w) return;
    ev.preventDefault();
    const tv = this.tvOf(w, lp.x - w.rect.x - 4, lp.y - w.rect.y - 4);
    if (tv) tv.wheel(ev.deltaY);
    else if (w.app && w.app.wheel) w.app.wheel(ev.deltaY, lp.x - w.rect.x - 4, lp.y - w.rect.y - 4);
  },

  /* find the WM whose desktop the point is over (nested rio) */
  wmAt(x, y){
    const w = WM.winAt(x, y);
    if (w && w.kind === 'nested'){
      return w.nestedWM;
    }
    return WM;
  },
  toLocal(wm, x, y){
    if (wm === WM) return { x, y };
    const off = wm.offsetOf();
    return { x: x - off.x, y: y - off.y };
  },

  tvOf(w, cx, cy){
    if (w.term) return w.term.tv;
    if (w.app && w.app.tvAt) return w.app.tvAt(cx, cy);
    return null;
  },

  routeMouse(w, ev, kind, lx, ly, gx, gy){
    const cx = lx - w.rect.x - 4, cy = ly - w.rect.y - 4;
    if (w.kind === 'nested'){
      if (kind !== 'down') return;
      /* clicks on the nested desktop */
      const sub = w.nestedWM;
      const sp = { x: cx, y: cy };
      const sw = sub.winAt(sp.x, sp.y);
      if (!sw && evButton(ev) === 2) this.rioMenu(sub, gx, gy);
      return;
    }
    if (w.term){
      const tv = w.term.tv;
      const b123 = evButton(ev) === 0 ? 1 : evButton(ev) === 1 ? 2 : 3;
      if (kind === 'down'){
        /* button 2 alone in the body: the rio text menu */
        if (b123 === 2 && cx >= SBARW && tv.ms.b === 0){ this.textMenu(w, gx, gy); return; }
        this.tvDown(tv, ev, cx, cy, b123);
      }
      else if (kind === 'move') tv.mousemove(ev, cx, cy);
      else if (kind === 'up') tv.mouseup(ev, cx, cy, b123);
      return;
    }
    if (w.app && w.app.mouse) w.app.mouse(kind, evButton(ev), cx, cy, ev);
  },
  tvDown(tv, ev, cx, cy, b123){
    WM.dragTv = tv;
    tv.mousedown(ev, cx, cy, b123);
  },

  rioMenu(wm, x, y){
    const items = [
      { label: 'New',    fn: () => { wm.mode = 'sweep'; SCREEN.classList.add('sweeping'); } },
      { label: 'Resize', fn: () => { this.armPick(wm, 'resize'); } },
      { label: 'Move',   fn: () => { wm.mode = 'move'; } },
      { label: 'Delete', fn: () => { wm.mode = 'delete'; SCREEN.classList.add('sweeping'); } },
      { label: 'Hide',   fn: () => { wm.mode = 'hide'; } },
    ];
    for (const w of wm.windows) if (w.hidden) items.push({ label: w.id + '. ' + w.label, fn: () => w.unhide() });
    Menu.show(x, y, items, 'rio' + (wm.nested ? 'n' : ''), true);
  },
  armPick(wm, what){
    /* Resize: click a window, then sweep its new rectangle */
    wm.mode = 'pick-resize';
    const handler = (ev) => {
      const { x, y } = evPos(ev);
      const lp = this.toLocal(wm, x, y);
      const w = wm.winAt(lp.x, lp.y);
      SCREEN.removeEventListener('mousedown', handler, true);
      ev.stopPropagation(); ev.preventDefault();
      if (w){ wm.resizeTarget = w; wm.mode = 'resize1'; this.sweep = { wm, x0: lp.x, y0: lp.y, x1: lp.x, y1: lp.y }; SCREEN.classList.add('sweeping'); }
      else wm.mode = null;
    };
    SCREEN.addEventListener('mousedown', handler, true);
  },

  textMenu(w, x, y){
    const tv = w.term.tv, term = w.term;
    Menu.show(x, y, [
      { label: 'cut',    fn: () => tv.snarfSel(true) },
      { label: 'paste',  fn: () => tv.pasteSel() },
      { label: 'snarf',  fn: () => tv.snarfSel(false) },
      { label: 'plumb',  fn: () => { const s = tv.t.slice(Math.min(tv.q0,tv.q1), Math.max(tv.q0,tv.q1)) || tv.wordAt(tv.q0).w; if (s) Plumber.dispatch(term.proc || WM.hostProc, s.trim()); } },
      { label: 'look',   fn: () => { const s = (tv.t.slice(Math.min(tv.q0,tv.q1), Math.max(tv.q0,tv.q1)) || tv.wordAt(tv.q0).w).trim(); if (s){ const i = tv.t.indexOf(s, Math.max(tv.q0,tv.q1)); if (i >= 0){ tv.select(i, i + s.length); tv.show(i); } } } },
      { label: 'send',   fn: () => {
          let s = tv.t.slice(Math.min(tv.q0,tv.q1), Math.max(tv.q0,tv.q1));
          if (!s) s = Snarf.get(); else Snarf.set(s);
          if (!s) return;
          if (!s.endsWith('\n')) s += '\n';
          tv.select(tv.t.length, tv.t.length);
          tv.insert(tv.t.length, s, true);
          const line = tv.t.slice(term.opoint);
          term.opoint = tv.t.length; tv.minEdit = term.opoint;
          tv.show(tv.t.length);
          for (const l of line.split('\n').slice(0,-1)) term.pushInput(l + '\n');
        } },
      { label: term.scrollOn ? 'noscroll' : 'scroll', fn: () => { term.scrollOn = !term.scrollOn; } },
    ], 'text', true);
  },

  drawSweep(){
    const s = this.sweep;
    const box = $id('sweepbox');
    const off = s.wm === WM ? {x:0,y:0} : s.wm.offsetOf();
    box.style.display = 'block';
    box.style.left = (off.x + Math.min(s.x0, s.x1)) + 'px';
    box.style.top = (off.y + Math.min(s.y0, s.y1)) + 'px';
    box.style.width = Math.abs(s.x1 - s.x0) + 'px';
    box.style.height = Math.abs(s.y1 - s.y0) + 'px';
  },
};

SCREEN.addEventListener('mousedown', (ev) => Router.down(ev));
window.addEventListener('mousemove', (ev) => Router.move(ev));
window.addEventListener('mouseup', (ev) => Router.up(ev));
SCREEN.addEventListener('wheel', (ev) => Router.wheel(ev), { passive: false });
window.addEventListener('contextmenu', (ev) => ev.preventDefault());

document.addEventListener('keydown', (ev) => {
  if (Boot.active){ Boot.key(ev); ev.preventDefault(); return; }
  /* chord fallback for trackpads: while sweeping with button 1, tap 2 or 3 */
  if (WM.dragTv && WM.dragTv.ms.b === 1 && (ev.key === '2' || ev.key === '3')){
    WM.dragTv.chord(1, Number(ev.key), WM.dragTv.q1);
    WM.dragTv.ms.chorded = true;
    ev.preventDefault();
    return;
  }
  let wm = WM;
  let w = WM.focused;
  if (w && w.kind === 'nested' && w.nestedWM.focused){ wm = w.nestedWM; w = wm.focused; }
  if (!w) return;
  if (['F5','F12','F11'].includes(ev.key)) return;
  if ((ev.ctrlKey || ev.metaKey) && ['c','v','x','r','l','-','=','+','0'].includes(ev.key)){
    /* browser habits, translated politely */
    if (ev.key === 'c' || ev.key === 'x'){ const tv = w.term ? w.term.tv : null; if (tv){ tv.snarfSel(ev.key === 'x'); ev.preventDefault(); } return; }
    if (ev.key === 'v'){ const tv = w.term ? w.term.tv : null; if (tv){ tv.pasteSel(); ev.preventDefault(); } return; }
    return;
  }
  let handled = false;
  if (w.term) handled = w.term.key(ev);
  else if (w.app && w.app.key) handled = w.app.key(ev);
  if (handled) ev.preventDefault();
});
</script>
<script>
/* ==================================================================
   acme — A USER INTERFACE FOR PROGRAMMERS (Rob Pike)
   Not an editor with mouse support: an environment where all text
   is potentially executable (button 2) or navigable (button 3).
   The tags are ordinary editable text. No modes, no shortcuts,
   no configuration, no syntax highlighting. That is the design.
   ================================================================== */

function acmeBodyColors(){ return { bg: COL.acmebody, fg: '#000000', sel: COL.acmebodysel, sbtrough: '#99994c', sbthumb: COL.acmebody }; }
function acmeTagColors(){ return { bg: COL.acmetag, fg: '#000000', sel: COL.acmetagsel, sbtrough: COL.acmetag, sbthumb: '#8888cc' }; }

let AcmeMain = null;   /* the plumber routes edit messages here */

class AWin {
  constructor(app, col, name, body){
    this.app = app; this.col = col;
    this.name = name || '';
    this.tag = new TextView({ w: 10, h: LINEH + 2, colors: acmeTagColors(), font: FONT_PROP, tagBox: true, noWrap: false });
    this.body = new TextView({ w: 10, h: 10, colors: acmeBodyColors(), font: FONT_PROP });
    this.tag.setText(this.name + ' Del Snarf Undo | Look Edit Put');
    if (body !== undefined) this.body.setText(body);
    this.undoStack = []; this.redoStack = [];
    this.cleanText = this.body.t;
    this.body.onChange = () => {
      const dirty = this.body.t !== this.cleanText;
      if (dirty !== this.tag.dirty){ this.tag.dirty = dirty; this.tag.render(); }
    };
    this.tag.onExec = (t, a, b, arg) => app.exec(this, t, arg, true);
    this.tag.onLook = (t) => app.look(this, t, true);
    this.body.onExec = (t, a, b, arg) => app.exec(this, t, arg, false);
    this.body.onLook = (t) => app.look(this, t, false);
    this.tagEl = document.createElement('div');
    this.bodyEl = document.createElement('div');
    this.tagEl.style.position = this.bodyEl.style.position = 'absolute';
    this.tagEl.appendChild(this.tag.el); this.bodyEl.appendChild(this.body.el);
    this.tagEl.style.borderBottom = '1px solid ' + COL.acmecolbord;
    app.el.appendChild(this.tagEl); app.el.appendChild(this.bodyEl);
  }
  checkpoint(){
    this.undoStack.push({ t: this.body.t, q0: this.body.q0, q1: this.body.q1 });
    if (this.undoStack.length > 64) this.undoStack.shift();
    this.redoStack = [];
  }
  setName(n){
    const rest = this.tag.t.includes(' ') ? this.tag.t.slice(this.tag.t.indexOf(' ')) : ' Del Snarf Undo | Look Edit Put';
    this.name = n;
    this.tag.setText(n + rest);
  }
  tagName(){ return this.tag.t.split(/[ \t]/)[0]; }
  dir(){
    const n = this.tagName();
    if (n.endsWith('/')) return n;
    const i = n.lastIndexOf('/');
    return i > 0 ? n.slice(0, i) : '/usr/glenda';
  }
  remove(){
    this.tagEl.remove(); this.bodyEl.remove();
    const i = this.col.wins.indexOf(this);
    if (i >= 0) this.col.wins.splice(i, 1);
  }
}

class ACol {
  constructor(app){
    this.app = app;
    this.wins = [];
    this.tag = new TextView({ w: 10, h: LINEH + 2, colors: acmeTagColors(), font: FONT_PROP, tagBox: true });
    this.tag.setText('New Cut Paste Snarf Sort Zerox Delcol |');
    this.tag.onExec = (t, a, b, arg) => app.exec(null, t, arg, true, this);
    this.tag.onLook = (t) => app.look(null, t, true);
    this.tagEl = document.createElement('div');
    this.tagEl.style.position = 'absolute';
    this.tagEl.style.borderBottom = '2px solid ' + COL.acmecolbord;
    this.tagEl.appendChild(this.tag.el);
    app.el.appendChild(this.tagEl);
  }
  remove(){
    for (const w of this.wins.slice()) w.remove();
    this.tagEl.remove();
    const i = this.app.cols.indexOf(this);
    if (i >= 0) this.app.cols.splice(i, 1);
  }
}

class AcmeApp {
  constructor(win, proc, args){
    this.win = win;
    this.el = win.body;
    this.el.style.background = COL.acmebody;
    this.proc = Procs.alloc({ name: 'acme', args: ['acme'].concat(args||[]), parent: proc, window: win });
    this.proc.ns = proc ? proc.ns.clone() : (WM.loginNS ? WM.loginNS.clone() : new Namespace());
    this.cols = [];
    this.roottag = new TextView({ w: 10, h: LINEH + 2, colors: acmeTagColors(), font: FONT_PROP, tagBox: true });
    this.roottag.setText('Newcol Kill Putall Dump Load Exit |');
    this.roottag.onExec = (t, a, b, arg) => this.exec(null, t, arg, true);
    this.roottag.onLook = (t) => this.look(null, t, true);
    this.rootEl = document.createElement('div');
    this.rootEl.style.position = 'absolute';
    this.rootEl.style.borderBottom = '2px solid ' + COL.acmecolbord;
    this.rootEl.appendChild(this.roottag.el);
    this.el.appendChild(this.rootEl);
    this.captive = null;
    this.focusedTv = null;
    if (!AcmeMain) AcmeMain = this;
  }

  /* ---------- geometry ---------- */
  layout(){
    const { w, h } = this.win.contentSize();
    const tagH = LINEH + 3;
    place(this.rootEl, 0, 0, w, tagH - 1);
    this.roottag.resize(w, tagH - 1);
    const cy = tagH, ch = h - tagH;
    const cw = Math.floor(w / Math.max(1, this.cols.length));
    this.cols.forEach((col, i) => {
      const cx = i * cw;
      place(col.tagEl, cx, cy, cw - (i < this.cols.length-1 ? 2 : 0), tagH - 1);
      col.tag.resize(cw - 2, tagH - 1);
      col.x = cx; col.w = cw;
      const wy = cy + tagH;
      const wh = ch - tagH;
      const per = Math.floor(wh / Math.max(1, col.wins.length));
      col.wins.forEach((aw, j) => {
        const yy = wy + j * per;
        const hh = (j === col.wins.length - 1) ? (cy + ch - yy) : per;
        place(aw.tagEl, cx, yy, cw - 2, tagH - 1);
        aw.tag.resize(cw - 2, tagH - 1);
        place(aw.bodyEl, cx, yy + tagH, cw - 2, hh - tagH);
        aw.body.resize(cw - 2, Math.max(hh - tagH, LINEH));
        aw.rect = { x: cx, y: yy, w: cw, h: hh, tagH };
      });
    });
  }

  tvAtPoint(cx, cy){
    if (cy < LINEH + 3) return { tv: this.roottag, win: null };
    for (const col of this.cols){
      if (cx < col.x || cx >= col.x + col.w) continue;
      if (cy < 2 * (LINEH + 3)) return { tv: col.tag, win: null, col };
      for (const aw of col.wins){
        if (!aw.rect) continue;
        if (cy >= aw.rect.y && cy < aw.rect.y + aw.rect.h){
          if (cy < aw.rect.y + aw.rect.tagH) return { tv: aw.tag, win: aw };
          return { tv: aw.body, win: aw };
        }
      }
      return { tv: col.tag, win: null, col };
    }
    return null;
  }
  tvAt(cx, cy){ const r = this.tvAtPoint(cx, cy); return r ? r.tv : null; }

  mouse(kind, b, cx, cy, ev){
    let target = this.captive;
    if (!target){
      const r = this.tvAtPoint(cx, cy);
      if (!r) return;
      target = r;
    }
    const tv = target.tv;
    const base = target.win ? (tv === target.win.tag ? target.win.tagEl : target.win.bodyEl)
               : (target.col ? target.col.tagEl : this.rootEl);
    const lx = cx - parseFloat(base.style.left), ly = cy - parseFloat(base.style.top);
    const b123 = b === 0 ? 1 : b === 1 ? 2 : 3;
    if (kind === 'down'){
      this.captive = target;
      this.focusedTv = tv;
      for (const c of this.cols) for (const w of c.wins){ w.body.focused = (w.body === tv); w.tag.focused = (w.tag === tv); }
      this.roottag.focused = (tv === this.roottag);
      if (target.win && tv === target.win.body && b123 === 1) target.win.lastB1 = now();
      WM.dragTv = tv;
      tv.mousedown(ev, lx, ly, b123);
      tv.render();
    }
    else if (kind === 'move' || kind === 'hover') tv.mousemove(ev, lx, ly);
    else if (kind === 'up'){
      tv.mouseup(ev, lx, ly, b123);
      if (!(ev.buttons & 7)) this.captive = null;
    }
  }
  key(ev){
    const tv = this.focusedTv;
    if (!tv) return false;
    const aw = this.winOfTv(tv);
    if (aw && aw.winShell && tv === aw.body && ev.key === 'Enter'){
      aw.winShell.enter();
      return true;
    }
    if (ev.key === 'Escape'){ return true; }
    return tv.key(ev);
  }
  focus(on){ if (this.focusedTv){ this.focusedTv.focused = on; this.focusedTv.render(); } }
  resize(){ this.layout(); }
  close(){ if (AcmeMain === this) AcmeMain = null; if (this.proc) killSilently(this.proc); }
  winOfTv(tv){
    for (const c of this.cols) for (const w of c.wins) if (w.body === tv || w.tag === tv) return w;
    return null;
  }

  /* ---------- windows ---------- */
  newCol(){
    const col = new ACol(this);
    this.cols.push(col);
    this.layout();
    return col;
  }
  newWin(col, name, body){
    if (!col){ for (const c of this.cols) if (!col || c.wins.length < col.wins.length) col = c; }
    col = col || this.newCol();
    const aw = new AWin(this, col, name, body);
    col.wins.push(aw);
    this.layout();
    return aw;
  }
  findWin(name){
    for (const c of this.cols) for (const w of c.wins) if (w.tagName() === name) return w;
    return null;
  }
  errWin(dir){
    const name = (dir && dir !== '/usr/glenda' ? dir + '/' : '') + '+Errors';
    let w = this.findWin(name);
    if (!w){ w = this.newWin(this.cols[this.cols.length-1], name, ''); w.tag.setText(name + ' Del Snarf | Look '); }
    return w;
  }
  errPrint(dir, s){
    const w = this.errWin(dir);
    w.body.insert(w.body.t.length, s);
    w.cleanText = w.body.t;
    w.tag.dirty = false; w.tag.render();
    w.body.show(w.body.t.length);
  }

  async openFile(path, line){
    let w = this.findWin(path);
    if (!w){
      let text = '', isdir = false;
      try {
        const wk = FS.walk(this.proc, path, {quiet9p:true});
        if (wk.node.dir){ isdir = true; text = FS.readdir(this.proc, path).map(k => k.name + (k.dir ? '/' : '')).join('\n') + '\n'; }
        else text = await FS.readAll(this.proc, path);
      } catch(e){ return null; }
      w = this.newWin(null, path + (isdir && !path.endsWith('/') ? '/' : ''), text);
      w.cleanText = w.body.t;
      if (isdir) w.tag.setText(w.tagName() + ' Del Snarf | Look ');
    }
    if (line){
      const ls = w.body.t.split('\n');
      let off = 0;
      for (let i = 0; i < Math.min(line - 1, ls.length); i++) off += ls[i].length + 1;
      const end = off + (ls[line-1] !== undefined ? ls[line-1].length : 0);
      w.body.select(off, Math.min(end + 1, w.body.t.length));
      w.body.scrollTo(w.body.lineOfPos(off) - 3);
    }
    this.layout();
    return w;
  }

  /* ---------- button 2: EXECUTE ---------- */
  async exec(aw, text, chordArg, fromTag, col){
    text = text.trim();
    if (!text) return;
    if (chordArg) text = text + ' ' + chordArg;
    const first = text.split(/\s+/)[0];
    const rest = text.slice(first.length).trim();
    const b = aw ? aw.body : null;
    const sel = b ? b.t.slice(Math.min(b.q0,b.q1), Math.max(b.q0,b.q1)) : '';
    switch (first){
      case 'Del': {
        const w = aw || (col && col.wins[0]);
        if (!w) return;
        if (w.tag.dirty && !w.delWarned){ w.delWarned = true; this.errPrint(null, w.tagName() + ' modified; Del again to discard\n'); return; }
        w.remove(); this.layout(); return;
      }
      case 'Delcol': { const c = col || (aw && aw.col); if (c) c.remove(); this.layout(); return; }
      case 'New': { const w = this.newWin(col || (aw && aw.col), '', ''); w.tag.setText(' Del Snarf Undo | Look Edit Put'); return; }
      case 'Newcol': this.newCol(); return;
      case 'Snarf': if (b) b.snarfSel(false); return;
      case 'Cut': if (b){ aw.checkpoint(); b.snarfSel(true); } return;
      case 'Paste': if (b){ aw.checkpoint(); b.pasteSel(); } return;
      case 'Undo': {
        if (!aw || !aw.undoStack.length) return;
        aw.redoStack.push({ t: aw.body.t, q0: aw.body.q0, q1: aw.body.q1 });
        const u = aw.undoStack.pop();
        aw.body.setText(u.t); aw.body.select(u.q0, u.q1); aw.body.show(u.q0);
        return;
      }
      case 'Redo': {
        if (!aw || !aw.redoStack.length) return;
        aw.undoStack.push({ t: aw.body.t, q0: aw.body.q0, q1: aw.body.q1 });
        const u = aw.redoStack.pop();
        aw.body.setText(u.t); aw.body.select(u.q0, u.q1);
        return;
      }
      case 'Put': {
        if (!aw) return;
        const name = rest || aw.tagName();
        if (!name){ this.errPrint(null, 'Put: no file name\n'); return; }
        try {
          FS.create(this.proc, name, false);
          const fd = FS.open(this.proc, name, 'w');
          await fd.write(aw.body.t);
          fd.close();
          aw.cleanText = aw.body.t;
          aw.tag.dirty = false; aw.tag.render();
          if (!aw.tagName()) aw.setName(name);
        } catch(e){ this.errPrint(null, 'Put: ' + name + ': ' + e.message + '\n'); }
        return;
      }
      case 'Putall': {
        for (const c of this.cols) for (const w of c.wins)
          if (w.tag.dirty && w.tagName() && !w.tagName().endsWith('+Errors')) await this.exec(w, 'Put', null, true);
        return;
      }
      case 'Get': {
        if (!aw) return;
        try {
          const t = await FS.readAll(this.proc, aw.tagName());
          aw.checkpoint();
          aw.body.setText(t); aw.cleanText = t; aw.tag.dirty = false; aw.tag.render();
        } catch(e){ this.errPrint(null, 'Get: ' + e.message + '\n'); }
        return;
      }
      case 'Look': {
        if (!aw) return;
        const target = sel || Snarf.get();
        if (target) this.look(aw, target, false);
        return;
      }
      case 'Sort': { const c = col || (aw && aw.col); if (c){ c.wins.sort((x,y)=> x.tagName() < y.tagName() ? -1 : 1); this.layout(); } return; }
      case 'Zerox': {
        const w = aw || null;
        if (!w) return;
        const z = this.newWin(w.col, w.tagName(), w.body.t);
        z.cleanText = w.cleanText;
        return;
      }
      case 'Font': { if (aw){ aw.body.font = aw.body.font === FONT_PROP ? FONT_MONO : FONT_PROP; aw.body._lines = null; aw.body.render(); } return; }
      case 'Exit': WM.deleteWindow(this.win); return;
      case 'Kill': { for (const p of Procs.list) if (p.acmeOwner === this && !p.dead) killSilently(p); return; }
      case 'Dump': await this.dump(rest || '/usr/glenda/acme.dump'); return;
      case 'Load': await this.load(rest || '/usr/glenda/acme.dump'); return;
      case 'Edit': {
        if (!aw) return;
        aw.checkpoint();
        const res = Sam.edit(aw.body, text.slice(4).trim());
        if (res) this.errPrint(null, res + '\n');
        return;
      }
      case 'Win': {
        this.startWin(col || (aw && aw.col));
        return;
      }
      case 'Send': {
        if (aw && aw.winShell){ aw.winShell.send(sel || Snarf.get()); }
        return;
      }
      case 'Tab': return;
    }
    /* |cmd, <cmd, >cmd operate on the selection */
    if (aw && (text[0] === '|' || text[0] === '<' || text[0] === '>')){
      const op = text[0], cmdline = text.slice(1).trim();
      aw.checkpoint();
      await this.pipeSel(aw, op, cmdline);
      return;
    }
    /* a Win window: middle-clicked text goes to the shell as input */
    if (aw && aw.winShell && !fromTag){
      aw.winShell.send(text);
      return;
    }
    /* anything else: an external command; output lands in +Errors */
    this.runExternal(aw, text);
  }

  async pipeSel(aw, op, cmdline){
    const b = aw.body;
    let a = Math.min(b.q0, b.q1), z = Math.max(b.q0, b.q1);
    if (a === z && op !== '<'){ a = 0; z = b.t.length; }
    const input = b.t.slice(a, z);
    const proc = Procs.alloc({ name: cmdline.split(/\s+/)[0], parent: this.proc });
    proc.acmeOwner = this;
    proc.cwd = aw.dir();
    let out = '';
    let fedIn = false;
    const io = {
      in: { read: async () => { if (fedIn || op === '>' && false) return null; if (op === '<'){ return null; } if (fedIn) return null; fedIn = true; return input; } },
      out: { write: async (s) => { out += s; } },
      err: { write: async (s) => { this.errPrint(aw.dir(), s); } },
    };
    await Rc.run(proc, cmdline, io);
    killSilently(proc);
    if (op === '|'){ b.del(a, z, true); b.insert(a, out, true); b.select(a, a + out.length); b.render(); if (b.onChange) b.onChange(); }
    else if (op === '<'){ b.del(a, z, true); b.insert(a, out, true); b.select(a, a + out.length); b.render(); if (b.onChange) b.onChange(); }
    else if (op === '>'){ this.errPrint(aw.dir(), out); }
  }

  runExternal(aw, text){
    const dir = aw ? aw.dir() : '/usr/glenda';
    const proc = Procs.alloc({ name: text.split(/\s+/)[0], parent: this.proc, window: this.win });
    proc.acmeOwner = this;
    proc.cwd = dir;
    const io = {
      in: { read: async () => null },
      out: { write: async (s) => { this.errPrint(dir, s); await new Promise(r=>setTimeout(r,0)); } },
      err: { write: async (s) => { this.errPrint(dir, s); await new Promise(r=>setTimeout(r,0)); } },
    };
    Rc.run(proc, text, io).finally(() => killSilently(proc));
  }

  /* ---------- button 3: LOOK ---------- */
  async look(aw, text, fromTag){
    text = text.trim();
    if (!text) return;
    /* file:line */
    let m = text.match(/^([\w.\/+\-]*[\w.\/+\-]):(\d+)$/);
    if (m){
      const path = FS.canon(m[1], aw ? aw.dir() : '/usr/glenda');
      if (FS.exists(this.proc, path)){ await this.openFile(path, Number(m[2])); return; }
    }
    /* :addr in this window */
    m = text.match(/^:(\d+)$/);
    if (m && aw){ await this.openFile(aw.tagName(), Number(m[1])); return; }
    /* URL → the plumber knows what to do */
    if (/^https?:\/\//.test(text)){ Plumber.dispatch(this.proc, text); return; }
    /* a file? */
    const candidates = [FS.canon(text, aw ? aw.dir() : '/usr/glenda')];
    if (!text.startsWith('/')) candidates.push('/usr/glenda/' + text);
    for (const path of candidates){
      if (FS.exists(this.proc, path)){ await this.openFile(path); return; }
    }
    /* otherwise: search forward for the next occurrence */
    if (aw && !fromTag){
      const b = aw.body;
      let from = Math.max(b.q0, b.q1);
      let i = b.t.indexOf(text, from);
      if (i < 0) i = b.t.indexOf(text);
      if (i >= 0){ b.select(i, i + text.length); b.show(i); }
    }
  }

  /* ---------- Win: a shell in a window ---------- */
  startWin(col){
    const aw = this.newWin(col, '/usr/glenda/-rc', '');
    aw.tag.setText('/usr/glenda/-rc Del Snarf Send | Look ');
    const app = this;
    const proc = Procs.alloc({ name: 'rc', args: ['rc','-i'], parent: this.proc, window: this.win });
    proc.acmeOwner = this;
    proc.ns = this.proc.ns;         /* Win shares acme's namespace group */
    aw.winShell = {
      aw, proc, opoint: 0, q: [], waiters: [],
      output(s){
        const b = aw.body;
        b.insert(this.opoint, s, true);
        this.opoint += s.length;
        b.show(this.opoint); b.render();
        aw.cleanText = b.t; aw.tag.dirty = false; aw.tag.render();
      },
      enter(){
        const b = aw.body;
        b.select(b.t.length, b.t.length);
        b.insert(b.t.length, '\n', true);
        const line = b.t.slice(this.opoint);
        this.opoint = b.t.length;
        b.show(b.t.length); b.render();
        this.push(line);
      },
      send(text){
        const b = aw.body;
        if (!text.endsWith('\n')) text += '\n';
        b.insert(b.t.length, text, true);
        const line = b.t.slice(this.opoint);
        this.opoint = b.t.length;
        b.show(b.t.length); b.render();
        for (const l of line.split('\n').slice(0, -1)) this.push(l + '\n');
      },
      push(line){ if (this.waiters.length) this.waiters.shift()(line); else this.q.push(line); },
      read(){ return this.q.length ? Promise.resolve(this.q.shift()) : intrWait(proc, res => this.waiters.push(res)); },
    };
    const sh = aw.winShell;
    const io = {
      in: { read: () => sh.read() },
      out: { write: async (s) => { sh.output(s); await new Promise(r=>setTimeout(r,0)); } },
      err: { write: async (s) => { sh.output(s); await new Promise(r=>setTimeout(r,0)); } },
    };
    (async () => {
      while (!proc.dead && !this.win.deleted && aw.col){
        sh.output((proc.env.get('prompt') || ['% '])[0]);
        let line;
        try { line = await sh.read(); } catch(e){ break; }
        if (line === null) break;
        try { await Rc.run(proc, line.replace(/\n$/,''), io); } catch(e){ if (e.rcExit !== undefined) break; }
      }
    })();
    return aw;
  }

  /* ---------- Dump and Load: how acme users actually work ---------- */
  async dump(path){
    const lines = ['# acme dump — Load ' + path + ' restores this layout'];
    this.cols.forEach((c, i) => {
      lines.push('col ' + i);
      for (const w of c.wins){
        if (w.winShell) lines.push('  win');
        else if (w.tagName()) lines.push('  open ' + w.tagName());
      }
    });
    try {
      FS.create(this.proc, path, false);
      const fd = FS.open(this.proc, path, 'w');
      await fd.write(lines.join('\n') + '\n');
      fd.close();
      this.errPrint(null, 'Dumped to ' + path + '\n');
    } catch(e){ this.errPrint(null, 'Dump: ' + e.message + '\n'); }
  }
  async load(path){
    let text;
    try { text = await FS.readAll(this.proc, path); }
    catch(e){ this.errPrint(null, 'Load: ' + path + ': file does not exist\n'); return; }
    for (const c of this.cols.slice()) c.remove();
    this.cols = [];
    let col = null;
    for (const line of text.split('\n')){
      if (line.startsWith('col')) col = this.newCol();
      else if (line.trim().startsWith('open ')){
        if (!col) col = this.newCol();
        const f = line.trim().slice(5);
        await this.openFile(f);
      }
      else if (line.trim() === 'win'){ if (!col) col = this.newCol(); this.startWin(col); }
    }
    if (!this.cols.length) this.defaultLayout();
    this.layout();
  }

  defaultLayout(){
    this.newCol();
    this.newCol();
    return this;
  }
}

function place(el, x, y, w, h){
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.width = w + 'px'; el.style.height = h + 'px';
}
function killSilently(p){ if (!p.dead){ p.dead = true; Procs.reap(p); } }

const Acme = {
  launch(proc, args){
    const rect = autoRect(760, 560);
    const win = WM.appWindow(rect, 'acme', (w) => {
      const app = new AcmeApp(w, proc, args);
      w.acme = app;
      setTimeout(async () => {
        app.defaultLayout();
        if (args && args.length){ for (const a of args) await app.openFile(FS.canon(a, proc ? proc.cwd : '/usr/glenda')); }
        else {
          await app.openFile('/usr/glenda/guide');
          await app.openFile('/usr/glenda/readme');
        }
        app.layout();
      }, 0);
      return app;
    });
    return win;
  },
  openInAcme(path, line){
    if (!AcmeMain || !AcmeMain.win || AcmeMain.win.deleted){ AcmeMain = null; Acme.launch(WM.hostProc, [path]); return; }
    AcmeMain.openFile(path, line);
    AcmeMain.win.raise();
  },
};

<script>
/* ==================================================================
   sam — STRUCTURAL REGULAR EXPRESSIONS (Rob Pike)
   ,x/pattern/ c/replacement/ operates on every match at once.
   The engine below also powers acme's Edit command.
   ================================================================== */

const Sam = {
  /* run a sam command against a TextView; returns error string or '' */
  edit(tv, src){
    try {
      const t = { text: tv.t, dot: [Math.min(tv.q0,tv.q1), Math.max(tv.q0,tv.q1)], out: '' };
      this.run(t, src);
      if (t.text !== tv.t){
        tv.setText(t.text);
      }
      tv.select(t.dot[0], Math.min(t.dot[1], tv.t.length));
      tv.show(t.dot[0]);
      return t.out ? t.out.replace(/\n$/,'') : '';
    } catch(e){
      return '?' + (e.message || 'error');
    }
  },

  run(t, src){
    let i = 0;
    const s = src;
    const ws = () => { while (i < s.length && ' \t'.includes(s[i])) i++; };

    const parseRe = (delim) => {
      let re = '';
      while (i < s.length && s[i] !== delim){
        if (s[i] === '\\' && s[i+1] === delim){ re += delim; i += 2; continue; }
        re += s[i++];
      }
      if (s[i] === delim) i++;
      return re;
    };

    const lineRange = (n) => {
      /* line n as [start,end] in char offsets, 1-based; line 0 is [0,0] */
      if (n <= 0) return [0, 0];
      const ls = t.text.split('\n');
      let off = 0;
      for (let k = 0; k < n - 1 && k < ls.length; k++) off += ls[k].length + 1;
      if (n - 1 >= ls.length) throw new Error('address out of range');
      return [off, Math.min(off + ls[n-1].length + 1, t.text.length)];
    };

    const parseSimpleAddr = () => {
      ws();
      if (/[0-9]/.test(s[i])){
        let n = '';
        while (/[0-9]/.test(s[i])) n += s[i++];
        return lineRange(Number(n));
      }
      if (s[i] === '$'){ i++; return [t.text.length, t.text.length]; }
      if (s[i] === '.'){ i++; return t.dot.slice(); }
      if (s[i] === '/'){
        i++;
        const re = new RegExp(parseRe('/'), 'm');
        const from = t.dot[1];
        let m = re.exec(t.text.slice(from));
        let base = from;
        if (!m){ m = re.exec(t.text); base = 0; }
        if (!m) throw new Error('search');
        return [base + m.index, base + m.index + m[0].length];
      }
      return null;
    };
    const parseAddr = () => {
      ws();
      let a = parseSimpleAddr();
      ws();
      while (s[i] === '+' || s[i] === '-'){
        const op = s[i++]; ws();
        let n = '';
        while (/[0-9]/.test(s[i])) n += s[i++];
        const k = n === '' ? 1 : Number(n);
        if (!a) a = t.dot.slice();
        const ln = this.lineOf(t.text, op === '+' ? a[1] : a[0]);
        a = lineRange(Math.max(0, ln + (op === '+' ? k : -k)));
        ws();
      }
      if (s[i] === ','){
        i++;
        const b = parseAddr() || [t.text.length, t.text.length];
        return [(a || [0,0])[0], b[1]];
      }
      return a;
    };

    ws();
    let addr = null;
    if (s[i] === ','){ i++; ws(); const b = parseAddr(); addr = [0, b ? b[1] : t.text.length]; }
    else addr = parseAddr();
    if (addr) t.dot = addr;
    ws();

    const cmd = s[i]; i++;
    const applyRepl = (m, rep) => rep.replace(/\\([0-9])/g, (_, d) => m[Number(d)] || '').replace(/&/g, () => m[0]);

    switch (cmd){
      case undefined: return;
      case 'p': t.out += t.text.slice(t.dot[0], t.dot[1]) + '\n'; return;
      case '=': {
        const l0 = this.lineOf(t.text, t.dot[0]), l1 = this.lineOf(t.text, Math.max(t.dot[0], t.dot[1]-1));
        t.out += (l0 === l1 ? l0 : l0 + ',' + l1) + '; #' + t.dot[0] + ',#' + t.dot[1] + '\n';
        return;
      }
      case 'd': t.text = t.text.slice(0, t.dot[0]) + t.text.slice(t.dot[1]); t.dot = [t.dot[0], t.dot[0]]; return;
      case 'a': case 'c': case 'i': {
        const delim = s[i]; i++;
        const txt = parseRe(delim).replace(/\\n/g, '\n').replace(/\\t/g, '\t');
        if (cmd === 'a'){ t.text = t.text.slice(0, t.dot[1]) + txt + t.text.slice(t.dot[1]); t.dot = [t.dot[1], t.dot[1] + txt.length]; }
        if (cmd === 'i'){ t.text = t.text.slice(0, t.dot[0]) + txt + t.text.slice(t.dot[0]); t.dot = [t.dot[0], t.dot[0] + txt.length]; }
        if (cmd === 'c'){ t.text = t.text.slice(0, t.dot[0]) + txt + t.text.slice(t.dot[1]); t.dot = [t.dot[0], t.dot[0] + txt.length]; }
        return;
      }
      case 's': {
        const delim = s[i]; i++;
        const re = parseRe(delim);
        const rep = parseRe(delim).replace(/\\n/g,'\n').replace(/\\t/g,'\t');
        const g = s[i] === 'g'; if (g) i++;
        const seg = t.text.slice(t.dot[0], t.dot[1]);
        const rx = new RegExp(re, g ? 'gm' : 'm');
        let count = 0;
        const ns = seg.replace(rx, (...args) => { count++; const m = args.slice(0, -2); return applyRepl(m, rep); });
        if (!count) throw new Error('substitute');
        t.text = t.text.slice(0, t.dot[0]) + ns + t.text.slice(t.dot[1]);
        t.dot = [t.dot[0], t.dot[0] + ns.length];
        return;
      }
      case 'x': case 'y': {
        const delim = s[i]; i++;
        const re = new RegExp(parseRe(delim), 'gm');
        const sub = s.slice(i);
        const seg = t.text.slice(t.dot[0], t.dot[1] || t.text.length);
        const base = t.dot[0];
        const pieces = [];
        let m, last = 0;
        while ((m = re.exec(seg)) !== null){
          if (cmd === 'x') pieces.push([base + m.index, base + m.index + m[0].length]);
          else pieces.push([base + last, base + m.index]);
          last = m.index + m[0].length;
          if (m[0] === '') re.lastIndex++;
        }
        if (cmd === 'y') pieces.push([base + last, base + seg.length]);
        /* apply the subcommand to each piece, tracking text drift */
        let drift = 0;
        for (const pc of pieces){
          const sub_t = { text: t.text, dot: [pc[0] + drift, pc[1] + drift], out: t.out };
          this.run(sub_t, sub);
          drift += sub_t.text.length - t.text.length;
          t.text = sub_t.text; t.out = sub_t.out;
        }
        t.dot = [t.dot[0], Math.min(t.dot[1] + drift, t.text.length)];
        i = s.length;
        return;
      }
      case 'g': case 'v': {
        const delim = s[i]; i++;
        const re = new RegExp(parseRe(delim), 'm');
        const sub = s.slice(i);
        const seg = t.text.slice(t.dot[0], t.dot[1]);
        const hit = re.test(seg);
        if ((cmd === 'g') === hit) this.run(t, sub);
        i = s.length;
        return;
      }
      case 'w': {
        t.out += (t.text.length) + ' characters (this sam writes through the host; use Put in acme)\n';
        return;
      }
      case 'u': throw new Error('undo: use acme Undo');
      default: throw new Error("unknown command '" + cmd + "'");
    }
  },
  lineOf(text, off){
    let n = 1;
    for (let i = 0; i < off && i < text.length; i++) if (text[i] === '\n') n++;
    return n;
  },
};

/* the sam window: a command pane above the file pane, exactly as shipped */
Sam.launch = function(proc, args){
  const rect = autoRect(640, 460);
  WM.appWindow(rect, 'sam', (win) => {
    const cmdTv = new TextView({ w: 10, h: 10, colors: { bg: '#ffffff', fg: '#000', sel: COL.winsel, sbtrough: COL.winscroll, sbthumb: '#ffffff' }, font: FONT_PROP });
    const fileTv = new TextView({ w: 10, h: 10, colors: { bg: '#ffffff', fg: '#000', sel: '#eeee9e', sbtrough: COL.winscroll, sbthumb: '#ffffff' }, font: FONT_PROP });
    const cmdEl = document.createElement('div'), fileEl = document.createElement('div'), split = document.createElement('div');
    for (const el of [cmdEl, fileEl, split]) el.style.position = 'absolute';
    split.style.background = '#000';
    cmdEl.appendChild(cmdTv.el); fileEl.appendChild(fileTv.el);
    win.body.appendChild(cmdEl); win.body.appendChild(split); win.body.appendChild(fileEl);
    const sproc = Procs.alloc({ name: 'sam', args: ['sam'].concat(args || []), parent: proc, window: win });
    const fname = args && args[0] ? FS.canon(args[0], sproc.cwd) : null;
    let opoint = 0;
    const banner = (s) => { cmdTv.insert(opoint, s, true); opoint += s.length; cmdTv.minEdit = opoint; cmdTv.select(cmdTv.t.length, cmdTv.t.length); cmdTv.show(cmdTv.t.length); };
    if (fname){
      FS.readAll(sproc, fname).then(txt => { fileTv.setText(txt); banner('-. ' + fname + '\n'); }).catch(() => banner('?' + fname + ' unreadable\n'));
    } else banner('-- sam: type commands here; the file pane is below.\n-- try: ,p    then    ,x/the/ c/THE/    then    ,p\n');
    const app = {
      cmdTv, fileTv,
      resize(w, h){
        const ch = Math.max(LINEH * 5, Math.floor(h * 0.25));
        place(cmdEl, 0, 0, w, ch); cmdTv.resize(w, ch);
        place(split, 0, ch, w, 2);
        place(fileEl, 0, ch + 2, w, h - ch - 2); fileTv.resize(w, h - ch - 2);
      },
      tvAt(cx, cy){ return cy < parseFloat(fileEl.style.top) ? cmdTv : fileTv; },
      cur: cmdTv,
      mouse(kind, b, cx, cy, ev){
        const tv = this.captive || this.tvAt(cx, cy);
        const local = tv === cmdTv ? cy : cy - parseFloat(fileEl.style.top);
        const b123 = b === 0 ? 1 : b === 1 ? 2 : 3;
        if (kind === 'down'){ this.captive = tv; this.cur = tv; cmdTv.focused = tv === cmdTv; fileTv.focused = tv === fileTv; WM.dragTv = tv; tv.mousedown(ev, cx, local, b123); }
        else if (kind === 'move' || kind === 'hover') tv.mousemove(ev, cx, local);
        else if (kind === 'up'){ tv.mouseup(ev, cx, local, b123); if (!(ev.buttons & 7)) this.captive = null; }
      },
      key(ev){
        if (this.cur === cmdTv && ev.key === 'Enter'){
          cmdTv.select(cmdTv.t.length, cmdTv.t.length);
          cmdTv.insert(cmdTv.t.length, '\n', true);
          const line = cmdTv.t.slice(opoint).replace(/\n$/,'');
          opoint = cmdTv.t.length;
          cmdTv.minEdit = opoint;
          if (line.trim() === 'q'){ WM.deleteWindow(win); return true; }
          if (line.trim().startsWith('w')){
            if (fname){ FS.create(sproc, fname, false); const fd = FS.open(sproc, fname, 'w'); fd.write(fileTv.t).then(()=>fd.close()); banner(fname + ': #' + fileTv.t.length + '\n'); }
            else banner('?no file name\n');
            return true;
          }
          const res = Sam.edit(fileTv, line);
          if (res) banner(res + '\n');
          cmdTv.show(cmdTv.t.length);
          return true;
        }
        return this.cur.key(ev);
      },
      close(){ killSilently(sproc); },
    };
    const c = win.contentSize();
    app.resize(c.w, c.h);
    return app;
  });
};

/* ==================================================================
   THE PLUMBER — inter-application messaging by rule.
   What every modern IDE reinvented badly, as an editable text file.
   ================================================================== */
const Plumber = {
  rulesText: '',
  ports: Object.fromEntries(PlumbPorts.map(p => [p, { q: [], waiters: [] }])),
  loadRules(text){ this.rulesText = text; },
  parse(){
    const blocks = [];
    let cur = [];
    for (const line of this.rulesText.split('\n')){
      const l = line.trim();
      if (!l || l.startsWith('#')){ if (cur.length){ blocks.push(cur); cur = []; } continue; }
      cur.push(l);
    }
    if (cur.length) blocks.push(cur);
    return blocks;
  },
  post(port, msg){
    const p = this.ports[port];
    if (!p) return;
    if (p.waiters.length) p.waiters.shift()(msg);
    else { p.q.push(msg); if (p.q.length > 32) p.q.shift(); }
  },
  portRead(proc, port){
    const p = this.ports[port];
    if (!p) return Promise.resolve(null);
    if (p.q.length) return Promise.resolve(p.q.shift());
    return intrWait(proc, res => p.waiters.push(res));
  },
  msgFmt(src, port, data){
    return 'plumb\t' + src + '\ttext\t' + (WM.hostProc ? WM.hostProc.cwd : '/usr/glenda') + '\t\t' + port + '\t' + data + '\n';
  },
  dispatch(proc, data, destHint){
    proc = proc || WM.hostProc;
    data = String(data).trim();
    if (!data) return false;
    /* the rules file is live: edits take effect on the next message */
    try {
      const w = FS.walk(proc, '/usr/glenda/lib/plumbing', {quiet9p:true});
      if (!w.node.dir && !w.node.syn && w.node.data) this.rulesText = w.node.data;
    } catch(e){}
    for (const block of this.parse()){
      let m = null, port = null, starts = [], fileArg = null, ok = true, isFileRule = false;
      for (const line of block){
        let mm;
        if ((mm = line.match(/^data matches '(.+)'$/))){
          try { m = new RegExp('^(?:' + mm[1] + ')$').exec(data); } catch(e){ m = null; }
          if (!m) ok = false;
        }
        else if ((mm = line.match(/^arg isfile (.+)$/)) && m){
          isFileRule = true;
          const t = mm[1].replace(/\$(\d)/g, (_, d) => m[Number(d)] || '');
          const cands = [FS.canon(t, proc.cwd)];
          if (!t.startsWith('/')) cands.push('/usr/glenda/' + t, '/sys/man/' + t);
          fileArg = cands.find(c => FS.exists(proc, c)) || null;
          if (!fileArg) ok = false;
        }
        else if ((mm = line.match(/^plumb to (\w+)$/))) port = mm[1];
        else if ((mm = line.match(/^plumb (?:start|client) (.+)$/))) starts.push(mm[1]);
        else if (/^type is text$/.test(line)) {}
        if (!ok) break;
      }
      if (!ok || !m) continue;
      if (destHint && port !== destHint) continue;
      const expand = (s) => s.replace(/\$(\d)/g, (_, d) => m[Number(d)] || '').replace(/\$file/g, fileArg || '').replace(/\$0/g, m[0]);
      this.post(port || 'none', this.msgFmt(proc.name, port || 'none', data));
      Trace.t('write', "fid plumb.send count " + data.length); Trace.r('write', 'count ' + data.length);
      /* built-in port behaviours */
      if (port === 'edit'){
        const lm = data.match(/^(.*?):(\d+)$/);
        const path = fileArg || (lm ? FS.canon(lm[1], proc.cwd) : FS.canon(data, proc.cwd));
        Acme.openInAcme(path, lm ? Number(lm[2]) : undefined);
        return true;
      }
      if (port === 'web'){ Apps.mothra(m[0]); return true; }
      if (port === 'image' || port === 'showmail'){ if (fileArg) FS.readAll(proc, fileArg).then(t => Apps.page(proc, fileArg, t)); return true; }
      for (const st of starts){
        const cmdline = expand(st);
        const io = { in: { read: async () => null }, out: { write: async()=>{} }, err: { write: async()=>{} } };
        Rc.run(proc, cmdline, io);
        return true;
      }
      if (port) return true;
    }
    return false;
  },
};
</script>
<script>
/* ==================================================================
   APPLICATIONS — stats, faces, mothra, the games, and a 9P trace
   window that shows the protocol running underneath everything.
   ================================================================== */
const Apps = {};

function canvasApp(rect, label, setup){
  return WM.appWindow(rect, label, (win) => {
    const cv = document.createElement('canvas');
    cv.style.width = '100%'; cv.style.height = '100%';
    win.body.appendChild(cv);
    const ctx = cv.getContext('2d');
    const app = { cv, ctx, win, timers: [] };
    app.fit = () => {
      const c = win.contentSize();
      const dpr = (window.devicePixelRatio || 1) * (WM.scale || 1);
      cv.width = Math.round(c.w * dpr); cv.height = Math.round(c.h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      app.w = c.w; app.h = c.h;
      if (app.draw) app.draw();
    };
    app.resize = () => app.fit();
    app.every = (ms, fn) => { const t = setInterval(fn, ms); app.timers.push(t); return t; };
    app.close = () => { for (const t of app.timers) clearInterval(t); if (app.onclose) app.onclose(); };
    setup(app);
    app.fit();
    return app;
  });
}

      let seed = 0; for (const ch of who) seed = (seed * 31 + ch.charCodeAt(0)) & 0xffff;
      const r = (n) => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed % n); };

      ctx.strokeRect(x + .5, y + .5, s, s);

      const ey = cy - 4 - r(3);
      ctx.beginPath(); ctx.arc(cx - 6, ey, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 6, ey, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      if (r(3) === 0){ ctx.moveTo(cx - 5, cy + 10); ctx.quadraticCurveTo(cx, cy + 13 + r(3), cx + 5, cy + 10); }
      else { ctx.moveTo(cx - 5, cy + 11); ctx.lineTo(cx + 5, cy + 11); }

      if (r(2)) { ctx.beginPath(); ctx.moveTo(cx - 9, ey - 6); ctx.quadraticCurveTo(cx, ey - 10 - r(4), cx + 9, ey - 6); ctx.stroke(); }

/* ---------- the 9P trace: watch the protocol under everything ---------- */
Apps.trace9p = function(proc){
  WM.appWindow(autoRect(480, 300), '9P trace', (win) => {
    const tv = new TextView({ w: 10, h: 10, colors: { bg: '#ffffff', fg: '#000', sel: COL.winsel, sbtrough: COL.winscroll, sbthumb: '#fff' }, font: FONT_MONO, editable: false });
    tv.setText('# 9P message trace — every file operation in the system is one protocol\n# T-messages go to the server, R-messages come back\n');
    win.body.appendChild(tv.el);
    let paused = false, n = 0;
    const listener = (tag, line) => {
      if (paused || win.deleted) return;
      if (++n % 1 === 0){
        let t = tv.t + 'tag ' + pad(tag, 5) + ' ' + line + '\n';
        if (t.length > 30000) t = t.slice(t.length - 24000);
        tv.t = t; tv._lines = null;
        tv.scrollTo(tv.layout().length);
      }
    };
    Trace.listeners.push(listener);
    const app = {
      tv,
      resize(w, h){ tv.resize(w, h); },
      tvAt(){ return tv; },
      mouse(kind, b, cx, cy, ev){
        const b123 = b === 0 ? 1 : b === 1 ? 2 : 3;
        if (kind === 'down'){ if (b123 === 2){ paused = !paused; win.setLabel(paused ? '9P trace (held)' : '9P trace'); return; } WM.dragTv = tv; tv.mousedown(ev, cx, cy, b123); }
        else if (kind === 'move' || kind === 'hover') tv.mousemove(ev, cx, cy);
        else if (kind === 'up') tv.mouseup(ev, cx, cy, b123);
      },
      key(){ return false; },
      close(){ const i = Trace.listeners.indexOf(listener); if (i >= 0) Trace.listeners.splice(i, 1); },
    };
    const c = win.contentSize(); tv.resize(c.w, c.h);
    return app;
  });
};

/* ---------- catclock: the Kit-Cat wall clock, beloved ---------- */
Apps.catclock = function(proc){
  canvasApp(autoRect(180, 300), 'catclock', (app) => {
    let t0 = now();
    app.draw = () => {
      const { ctx, w, h } = app;
      const t = (now() - t0) / 1000;
      const swing = Math.sin(t * Math.PI) * 0.55;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      const cx = w / 2, scale = Math.min(w / 160, h / 280);
      ctx.save();
      ctx.translate(cx, 0); ctx.scale(scale, scale);
      ctx.fillStyle = '#000000';
      /* head */
      ctx.beginPath(); ctx.ellipse(0, 46, 34, 30, 0, 0, Math.PI * 2); ctx.fill();
      /* ears */
      ctx.beginPath(); ctx.moveTo(-30, 30); ctx.lineTo(-22, 2); ctx.lineTo(-8, 22); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(30, 30); ctx.lineTo(22, 2); ctx.lineTo(8, 22); ctx.closePath(); ctx.fill();
      /* eyes: they move with the tail */
      const look = swing * 6;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(-13, 42, 10, 12, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(13, 42, 10, 12, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath(); ctx.ellipse(-13 + look, 44, 4, 6, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(13 + look, 44, 4, 6, 0, 0, Math.PI*2); ctx.fill();
      /* nose + whiskers */
      ctx.beginPath(); ctx.moveTo(-3, 56); ctx.lineTo(3, 56); ctx.lineTo(0, 61); ctx.closePath();
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      for (const side of [-1, 1]) for (const dy of [-2, 2, 6]){
        ctx.beginPath(); ctx.moveTo(side * 8, 58); ctx.lineTo(side * 34, 58 + dy); ctx.stroke();
      }
      /* body with the clock belly */
      ctx.fillStyle = '#000000';
      ctx.beginPath(); ctx.ellipse(0, 145, 40, 72, 0, 0, Math.PI * 2); ctx.fill();
      const d = new Date();
      const face = 32;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 145, face, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#000000'; ctx.lineWidth = 2;
      for (let k = 0; k < 12; k++){
        const a = k * Math.PI / 6;
        ctx.beginPath();
        ctx.moveTo(Math.sin(a) * (face-4), 145 - Math.cos(a) * (face-4));
        ctx.lineTo(Math.sin(a) * (face-1), 145 - Math.cos(a) * (face-1));
        ctx.stroke();
      }
      const ha = ((d.getHours() % 12) + d.getMinutes()/60) * Math.PI/6;
      const ma = d.getMinutes() * Math.PI/30;
      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0,145); ctx.lineTo(Math.sin(ha)*16, 145 - Math.cos(ha)*16); ctx.stroke();
      ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,145); ctx.lineTo(Math.sin(ma)*24, 145 - Math.cos(ma)*24); ctx.stroke();
      /* feet */
      ctx.fillStyle = '#000000';
      ctx.beginPath(); ctx.ellipse(-18, 218, 13, 8, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(18, 218, 13, 8, 0, 0, Math.PI*2); ctx.fill();
      /* the tail: a pendulum */
      ctx.save();
      ctx.translate(0, 214);
      ctx.rotate(swing);
      ctx.lineWidth = 7; ctx.strokeStyle = '#000000'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(4, 26, 0, 44); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 48, 8, 0, Math.PI*2); ctx.fillStyle = '#000'; ctx.fill();
      ctx.restore();
      ctx.restore();
    };
    app.every(50, app.draw);
  });
};

      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(ma)*r*0.78, cy - Math.cos(ma)*r*0.78); ctx.stroke();
    };
    app.every(1000, app.draw);
  });
};

/* ---------- sokoban ---------- */
Apps.sokoban = function(proc){
  const LEVEL = [
    '  #####  ',
    '###   ## ',
    '#.a  b.# ',
    '# ###  ##',
    '# @  b .#',
    '#   b   #',
    '#  ###.##',
    '####  ## ',
    '   ####  ',
  ];
  canvasApp(autoRect(300, 330), 'sokoban', (app) => {
    let grid, px, py, moves;
    const reset = () => {
      grid = LEVEL.map(r => r.split(''));
      moves = 0;
      grid.forEach((row, y) => row.forEach((c, x) => { if (c === '@'){ px = x; py = y; row[x] = ' '; } }));
    };
    reset();
    const cell = 30;
    app.draw = () => {
      const { ctx, w, h } = app;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      let goalsLeft = 0;
      grid.forEach((row, y) => row.forEach((ch, x) => {
        const gx = 10 + x * cell, gy = 10 + y * cell;
        if (ch === '#'){ ctx.fillStyle = '#448844'; ctx.fillRect(gx, gy, cell-2, cell-2); }
        if (ch === '.' || ch === 'B'){ ctx.strokeStyle = '#aa0000'; ctx.strokeRect(gx+8, gy+8, cell-18, cell-18); if (ch === '.') goalsLeft++; }
        if (ch === 'b' || ch === 'B'){ ctx.fillStyle = ch === 'B' ? '#aa5500' : '#eeee9e'; ctx.fillRect(gx+4, gy+4, cell-10, cell-10); ctx.strokeStyle = '#000'; ctx.strokeRect(gx+4.5, gy+4.5, cell-10, cell-10); }
        if (ch === 'a'){ goalsLeft++; ctx.strokeStyle = '#aa0000'; ctx.strokeRect(gx+8, gy+8, cell-18, cell-18); }
      }));
      ctx.fillStyle = '#000099';
      ctx.beginPath(); ctx.arc(10 + px*cell + cell/2 - 1, 10 + py*cell + cell/2 - 1, 9, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = '12px ' + FONT_PROP.split('px ')[1];
      ctx.fillText(goalsLeft === 0 ? 'solved in ' + moves + ' — click to reset' : 'arrows move · ' + moves + ' moves · click resets', 10, app.h - 8);
    };
    app.key = (ev) => {
      const d = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0] }[ev.key];
      if (!d) return false;
      const [dx, dy] = d;
      const at = (x,y) => (grid[y] && grid[y][x]) || '#';
      const set = (x,y,ch) => { grid[y][x] = ch; };
      const nx = px+dx, ny = py+dy;
      const c1 = at(nx, ny);
      if (c1 === '#') return true;
      if (c1 === 'b' || c1 === 'B'){
        const c2 = at(nx+dx, ny+dy);
        if (c2 === '#' || c2 === 'b' || c2 === 'B') return true;
        set(nx+dx, ny+dy, (c2 === '.' || c2 === 'a') ? 'B' : 'b');
        set(nx, ny, c1 === 'B' ? '.' : ' ');
      }
      px = nx; py = ny; moves++;
      app.draw();
      return true;
    };
    app.mouse = (kind) => { if (kind === 'down'){ reset(); app.draw(); } };
  });
};

/* ---------- sudoku ---------- */
Apps.sudoku = function(proc){
  const PUZZLE = '53__7____6__195____98____6_8___6___34__8_3__17___2___6_6____28____419__5____8__79';
  canvasApp(autoRect(300, 320), 'sudoku', (app) => {
    const given = PUZZLE.split('').map(c => c === '_' ? 0 : Number(c));
    const board = given.slice();
    let sel = -1;
    const cs = 30;
    app.draw = () => {
      const { ctx } = app;
      ctx.fillStyle = '#ffffea'; ctx.fillRect(0, 0, app.w, app.h);
      ctx.font = '16px ' + FONT_PROP.split('px ')[1];
      for (let i = 0; i < 81; i++){
        const x = 10 + (i%9)*cs, y = 10 + Math.floor(i/9)*cs;
        if (i === sel){ ctx.fillStyle = '#eeee9e'; ctx.fillRect(x, y, cs, cs); }
        if (board[i]){ ctx.fillStyle = given[i] ? '#000' : '#000099'; ctx.fillText(board[i], x + 10, y + 21); }
      }
      ctx.strokeStyle = '#99994c';
      for (let k = 0; k <= 9; k++){
        ctx.lineWidth = (k % 3 === 0) ? 2 : 0.6;
        ctx.beginPath(); ctx.moveTo(10 + k*cs, 10); ctx.lineTo(10 + k*cs, 10 + 9*cs); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, 10 + k*cs); ctx.lineTo(10 + 9*cs, 10 + k*cs); ctx.stroke();
      }
      ctx.fillStyle = '#000'; ctx.font = '11px ' + FONT_PROP.split('px ')[1];
      const done = board.every(v => v) ;
      ctx.fillText(done ? 'full — check it yourself; the machine will not nag' : 'click a cell, type 1-9 (0 clears)', 10, app.h - 6);
    };
    app.mouse = (kind, b, cx, cy) => {
      if (kind !== 'down') return;
      const gx = Math.floor((cx - 10)/cs), gy = Math.floor((cy - 10)/cs);
      if (gx >= 0 && gx < 9 && gy >= 0 && gy < 9){ sel = gy*9 + gx; app.draw(); }
    };
    app.key = (ev) => {
      if (sel >= 0 && /^[0-9]$/.test(ev.key) && !given[sel]){ board[sel] = Number(ev.key); app.draw(); return true; }
      return false;
    };
  });
};

      ctx.fillText('(games are in /bin/games — lc /bin/games)', 10, 68);

  });
};

T.utf8 = `HOW THIS TEXT IS ENCODED (read this in the year 2026, or any year)

In September 1992, X/Open needed a byte encoding of Unicode that
would not break Unix. Ken Thompson sketched one on a placemat at a
New Jersey diner, with Rob Pike, reportedly over dinner: self-
synchronising, sorts correctly, ASCII transparent. They had it
running in Plan 9 — the whole system, kernel to applications —
within the week. Plan 9 was the first operating system to run
Unicode natively, and its encoding was called UTF-8.

Today UTF-8 encodes more than 97% of the web. Every character you
have typed into this exhibit, every page you opened on the way
here, every emoji you regret: all of it moves through the world in
the format two people designed in an evening, for this system.

Almost nobody ran Plan 9. Everybody runs UTF-8.

Try it here — these are real:
	echo αβγ → /tmp/greek; cat /tmp/greek
	echo hello | freq
	unicode 2603
`;

T.exhibit = `WHAT ESCAPED THIS ROOM                            /lib/exhibit

Plan 9 lost. Commercially, completely: Bell Labs' owners had no
appetite for a second Unix, the licence was wrong for a decade,
and by the time it opened up the world had standardised on the
first Unix — the one these same people built, and were trying to
apologise for. Almost nobody ever ran this system.

Then its ideas escaped, one by one, without the name attached:

UTF-8            Designed for Plan 9 in one evening, 1992
                 (see /usr/glenda/lib/utf8). Now encodes the web.

/proc            Processes as readable files. Copied into Linux,
                 BSD, Solaris; every top(1) reads it daily.

Namespaces       Per-process views of the filesystem — what you
                 just did with bind(1). Linux grew them in 2002-13;
                 the industry calls the result containers, and
                 ships them in the billions.

Union mounts     /bin as several directories at once. Docker
                 images are stacked the same way (overlayfs).

9P               One protocol for every resource. It ships today
                 inside WSL2, QEMU/virtio, and kubelets.

rfork            Plan 9's fork-what-you-choose. Linux clone(2)
                 is its portrait.

Go               Designed at Google by Ken Thompson, Rob Pike and
                 Robert Griesemer; toolchain and taste straight
                 from this room. Goroutines are Alef/Newsqueak
