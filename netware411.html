<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Single-file standalone build of NetWare 4.11 / IntranetWare simulation.
       Contains all CSS and JS inline. No external requirements - open directly
       from disk (file://), no web server needed. -->
  <title>Novell NetWare 4.11 — IntranetWare (Simulation)</title>
  <meta name="description" content="An interactive front-end simulation of a Novell NetWare 4.11 / IntranetWare server console. No real networking — a museum exhibit in the browser.">
  <style>
/* ==========================================================================
   netware.css  —  The whole look: VGA palette, C-Worthy TUI panels, GUI
   "silver" window chrome, green console, blue login. No rounded corners,
   no shadows; the only motion is blinking cursors, graph updates and the
   requested network-map traffic.
   ========================================================================== */

/* ---- reset ---- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
img, canvas { display: block; }

:root {
  /* VGA 16-color palette */
  --c-black:#000000; --c-blue:#0000aa; --c-green:#00aa00; --c-cyan:#00aaaa;
  --c-red:#aa0000; --c-magenta:#aa00aa; --c-brown:#aa5500; --c-lgray:#aaaaaa;
  --c-dgray:#555555; --c-bblue:#5555ff; --c-bgreen:#55ff55; --c-bcyan:#55ffff;
  --c-bred:#ff5555; --c-bmagenta:#ff55ff; --c-yellow:#ffff55; --c-white:#ffffff;
  /* GUI silver chrome */
  --silver:#c0c0c0; --silver-lt:#ffffff; --silver-dk:#808080; --silver-dkr:#404040;
  --panel:#0000aa;
  --font: "Px437 IBM VGA", "IBM VGA", "Consolas", "Lucida Console",
          "DejaVu Sans Mono", "Courier New", monospace;
}

html, body { background: #0b0b12; font-family: var(--font); color: var(--c-white);
  overflow: hidden; -webkit-font-smoothing: none; font-smooth: never; }

/* ---- CRT bezel + logical screen ---- */
#crt { position: fixed; inset: 0; display: block;
  background: radial-gradient(ellipse at center, #16161f 0%, #060608 70%, #000 100%); }
#screen { position: absolute; left: 50%; top: 50%; width: 800px; height: 600px;
  transform: translate(-50%, -50%) scale(1); transform-origin: center center;
  background: #000; overflow: hidden; font-size: 15px; line-height: 1.18;
  border: 1px solid #000; outline: 2px solid #23232c; }

/* CRT + scanline overlays (toggleable) */
#screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 9999;
  opacity: 0; transition: opacity .2s; }
.fx-scanlines #screen::after { opacity: 1;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px); }
.fx-crt #screen { box-shadow: none; }
.fx-crt #screen::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 9998;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }

/* ==========================================================================
   BOOT
   ========================================================================== */
#boot { position: absolute; inset: 0; background: #000; }
.boot-active { z-index: 5000; }
.boot-screen { position: absolute; inset: 0; padding: 10px 14px; overflow: hidden;
  color: #c7c7c7; font-size: 14px; line-height: 1.28; white-space: pre; }
.boot-line { white-space: pre; }
.boot-line.dim { color: #7d7d7d; }
.boot-line.prompt { color: #e6e6e6; }
.boot-line.banner { color: var(--c-yellow); font-weight: bold; }
.boot-ok { color: var(--c-bgreen); }
.boot-ok2 { color: var(--c-bgreen); }
.boot-press { color: var(--c-bcyan); margin-top: 6px; }
.boot-skip { position: absolute; right: 10px; bottom: 8px; color: #555; font-size: 12px; }

/* ==========================================================================
   LOGIN
   ========================================================================== */
.login-root { position: absolute; inset: 0; background: var(--c-blue);
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 2px, transparent 2px 8px);
  display: flex; align-items: center; justify-content: center; z-index: 4000; }
.login-center { width: 460px; }
.login-bar { background: var(--silver); color: #000; text-align: center; padding: 3px;
  border: 2px solid; border-color: var(--silver-lt) var(--silver-dk) var(--silver-dk) var(--silver-lt);
  font-weight: bold; }
.login-panel { background: var(--silver); color: #000; padding: 14px 18px 12px;
  border: 2px solid; border-color: var(--silver-lt) var(--silver-dkr) var(--silver-dkr) var(--silver-lt); }
.login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.login-logo-tile { width: 46px; height: 46px; background: var(--c-red); color: #fff;
  font-weight: bold; font-size: 34px; text-align: center; line-height: 46px;
  border: 2px solid #7a0000; }
.login-logo-1 { color: var(--c-red); font-size: 22px; font-weight: bold; letter-spacing: 1px; }
.login-logo-2 { color: #000; font-size: 13px; letter-spacing: 3px; }
.login-title { color: #000; margin-bottom: 8px; }
.login-panel .nw-form { color: #000; }
.login-panel .nw-field-label { color: #000; width: 12ch; }
.login-panel .nw-input { background: #fff; color: #000; border: 2px solid;
  border-color: var(--silver-dk) var(--silver-lt) var(--silver-lt) var(--silver-dk); }
.login-btnrow { justify-content: flex-start; margin-top: 6px; }
.login-error { color: #a00000; background: #ffe0e0; border: 1px solid #a00; padding: 3px 6px; margin: 8px 0; font-size: 13px; }
.login-hint { color: #333; font-size: 12px; margin-top: 10px; border-top: 1px solid var(--silver-dk); padding-top: 6px; }

/* ==========================================================================
   MENU BAR (top, silver)
   ========================================================================== */
.nw-menubar { position: absolute; top: 0; left: 0; right: 0; height: 26px; z-index: 300;
  background: var(--silver); color: #000; display: flex; align-items: stretch;
  border-bottom: 2px solid var(--silver-dk); }
.menu-title { padding: 4px 12px; cursor: pointer; user-select: none; line-height: 18px; }
.menu-title u { text-decoration: underline; }
.menu-title:hover, .menu-title.open { background: var(--c-blue); color: #fff; }
.menu-clock { margin-left: auto; padding: 4px 12px; color: #000; }
.menu-dropdown { position: absolute; top: 26px; z-index: 350; min-width: 220px;
  background: var(--silver); color: #000; border: 2px solid;
  border-color: var(--silver-lt) var(--silver-dkr) var(--silver-dkr) var(--silver-lt); }
.menu-dropdown .nw-menu { max-height: 460px; overflow-y: auto; background: var(--silver); color: #000; padding: 2px; }
.menu-dropdown .nw-menu-item { color: #000; padding: 2px 12px; }
.menu-dropdown .nw-menu-item.selected { background: var(--c-blue); color: #fff; }
.menu-dropdown .nw-menu-hint { color: #555; }
.menu-dropdown .nw-menu-item.selected .nw-menu-hint { color: #cdd; }
.menu-dropdown .nw-menu-sep { border-top: 1px solid var(--silver-dk); margin: 2px 4px; height: 0; }

/* ==========================================================================
   DESKTOP + CONSOLE
   ========================================================================== */
#desktop { position: absolute; top: 26px; bottom: 28px; left: 0; right: 0;
  background: #04043a; overflow: hidden; }
.nw-console { position: absolute; inset: 0; background: #000; color: var(--c-bgreen);
  display: flex; flex-direction: column; padding: 6px 10px; cursor: text; }
.con-output { flex: 1 1 auto; min-height: 0; overflow-y: auto; white-space: pre-wrap;
  word-break: break-word; }
.con-line { white-space: pre-wrap; }
.con-echo { color: var(--c-white); }
.con-hi { color: var(--c-bcyan); }
.con-dim { color: #2f9e2f; }
.con-ok { color: var(--c-bgreen); }
.con-err { color: var(--c-bred); }
.con-mod { color: var(--c-yellow); }
.con-inputline { position: relative; display: block; white-space: pre; color: var(--c-bgreen); }
.con-prompt { color: var(--c-bgreen); }
.con-render { white-space: pre; }
.con-cursor { background: var(--c-bgreen); color: #000; animation: blink 1.05s step-end infinite; }
.con-real { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: transparent; border: 0; outline: none; color: transparent; caret-color: transparent;
  font: inherit; padding: 0; }
@keyframes blink { 0%, 50% { background: var(--c-bgreen); color: #000; } 50.01%, 100% { background: transparent; color: var(--c-bgreen); } }

/* broadcast banner */
.broadcast-bar { position: absolute; left: 0; right: 0; top: 0; z-index: 500;
  background: var(--c-yellow); color: #000; padding: 4px 10px; border-bottom: 2px solid #888; white-space: pre-wrap; }

/* ==========================================================================
   STATUS BAR (bottom)
   ========================================================================== */
.nw-statusbar { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; z-index: 300;
  background: var(--silver); color: #000; display: flex; align-items: center; gap: 2px;
  border-top: 2px solid var(--silver-lt); padding: 0 6px; font-size: 13px; overflow: hidden; }
.sb-server { font-weight: bold; padding: 0 8px; background: var(--c-blue); color: #fff; height: 100%; display: flex; align-items: center; }
.sb-seg { padding: 0 8px; border-right: 1px solid var(--silver-dk); white-space: nowrap; }
.sb-label { color: #333; }
.sb-val { color: #000; font-weight: bold; }
.sb-val.warm { color: #a05000; }
.sb-val.hot { color: #a00000; }
.sb-clock { margin-left: auto; padding: 0 8px; white-space: nowrap; }

/* ==========================================================================
   WINDOWS (GUI silver chrome hosting TUI content)
   ========================================================================== */
.nw-window { position: absolute; z-index: 100; display: flex; flex-direction: column;
  background: var(--panel); color: var(--c-white);
  border: 2px solid; border-color: var(--silver-lt) var(--silver-dkr) var(--silver-dkr) var(--silver-lt);
  min-width: 260px; max-width: 96%; }
.nw-window.focused { outline: 1px solid var(--c-bcyan); }
.nw-titlebar { flex: 0 0 auto; height: 22px; background: var(--silver); color: #000;
  display: flex; align-items: center; cursor: move; user-select: none;
  border-bottom: 1px solid var(--silver-dk); }
.nw-window.focused .nw-titlebar { background: var(--c-blue); color: #fff; }
.nw-title-text { font-weight: bold; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nw-title-fill { flex: 1 1 auto; }
.nw-close { flex: 0 0 auto; width: 22px; text-align: center; cursor: pointer; color: #000;
  border-left: 1px solid var(--silver-dk); background: var(--silver); height: 100%; line-height: 21px; }
.nw-close:hover { background: var(--c-bred); color: #fff; }
.nw-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--panel); }
.nw-body > div, .nw-body > form, .nw-body > pre { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  overflow: auto; padding: 6px; }
.nw-footer { flex: 0 0 auto; background: var(--silver); color: #000; padding: 2px 8px;
  border-top: 1px solid var(--silver-dk); font-size: 12px; white-space: nowrap; overflow: hidden; }

/* dialogs */
.nw-dialog { z-index: 600; }
.nw-dialog .nw-body { background: var(--silver); color: #000; }
.nw-dialog .nw-body > div { display: block; overflow: auto; max-height: 70vh; }
.nw-dialog-msg { padding: 6px 4px 10px; white-space: pre-wrap; }
.nw-dialog.tone-alert .nw-titlebar, .nw-dialog.tone-error .nw-titlebar { background: var(--c-red); color: #fff; }
.nw-dialog.tone-warn .nw-titlebar { background: var(--c-brown); color: #fff; }
.nw-dialog .nw-menu { background: var(--silver); color: #000; max-height: 320px; overflow: auto; }
.nw-dialog .nw-menu-item { color: #000; }
.nw-dialog .nw-menu-item.selected { background: var(--c-blue); color: #fff; }
.nw-dialog .nw-field-label { color: #000; }
.nw-dialog .nw-input { background: #fff; color: #000; border: 2px solid; border-color: var(--silver-dk) var(--silver-lt) var(--silver-lt) var(--silver-dk); }
.nw-dialog .nw-grid-label { color: #202020; }
.nw-dialog .nw-grid-value { color: #000; }
.nw-dialog .file-view { background: #fff; color: #000; border-color: #888; }

/* ==========================================================================
   TUI WIDGETS
   ========================================================================== */
.nw-header { flex: 0 0 auto; background: #000070; color: var(--c-yellow);
  display: flex; justify-content: space-between; align-items: center;
  padding: 3px 8px; border-bottom: 2px solid var(--c-bcyan); font-weight: bold; }
.nw-header-title { color: var(--c-yellow); }
.nw-header-right { color: var(--c-bcyan); font-weight: normal; }
.nw-subhead { flex: 0 0 auto; color: var(--c-bcyan); padding: 2px 8px; }

.nw-box { border: 3px double var(--c-bcyan); margin: 4px; position: relative; padding: 4px 6px 6px; }
.nw-box-title { position: absolute; top: -0.75em; left: 10px; background: var(--panel);
  color: var(--c-yellow); padding: 0 6px; }
.nw-box-inner { padding-top: 4px; }

.nw-grid { display: block; padding: 2px 4px; }
.mon-cols { display: flex; gap: 14px; }
.mon-cols > .nw-grid { flex: 1 1 50%; min-width: 0; padding: 0; }
.mon-cols .nw-grid-label { overflow: hidden; text-overflow: ellipsis; }
.mon-cols .nw-grid-value { padding-left: 6px; }
.nw-grid-row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0;
  break-inside: avoid; }
.nw-grid-label { color: var(--c-lgray); white-space: nowrap; }
.nw-grid-value { color: var(--c-white); font-weight: bold; text-align: right; white-space: nowrap; }
.nw-grid-value.accent, .accent { color: var(--c-bcyan); }

.nw-gauge { color: var(--c-bgreen); letter-spacing: -1px; white-space: nowrap; }
.nw-gauge.warm { color: var(--c-yellow); }
.nw-gauge.hot { color: var(--c-bred); }

/* menu */
.nw-menu { outline: none; padding: 2px; }
.nw-menu-item { display: flex; justify-content: space-between; gap: 16px; padding: 1px 10px;
  cursor: pointer; color: var(--c-white); }
.nw-menu-item.selected { background: var(--c-cyan); color: #000; font-weight: bold; }
.nw-menu-item.disabled { color: var(--c-dgray); cursor: default; }
.nw-menu-hint { color: var(--c-lgray); }
.nw-menu-item.selected .nw-menu-hint { color: #003; }
.nw-menu-sep { border-top: 1px solid var(--c-bblue); margin: 2px 6px; }

/* list / table */
.nw-list { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; margin: 4px;
  border: 3px double var(--c-bblue); }
.nw-list-head { flex: 0 0 auto; display: flex; background: #000070; color: var(--c-yellow);
  padding: 2px 6px; border-bottom: 1px solid var(--c-bblue); font-weight: bold; }
.nw-list-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; outline: none; padding: 1px 0; }
.nw-list-row { display: flex; padding: 0 6px; cursor: pointer; }
.nw-list-row.selected { background: var(--c-cyan); color: #000; font-weight: bold; }
.nw-list-cell { padding: 0 6px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nw-list-cell.r { text-align: right; }
.nw-list-cell.c { text-align: center; }
.nw-list-cell.nw-dim { color: var(--c-lgray); }
.nw-list-row.selected .nw-list-cell { color: #000; }
.nw-list-cell.accent { color: var(--c-bcyan); }
.nw-list-row.selected .nw-list-cell.accent { color: #002; }

/* forms */
.nw-form { padding: 4px; }
.nw-field { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.nw-field-label { color: var(--c-lgray); white-space: pre; flex: 0 0 auto; }
.nw-input { flex: 1 1 auto; background: #000030; color: var(--c-white);
  border: 2px solid; border-color: #202070 #4040a0 #4040a0 #202070; padding: 2px 6px; min-width: 0; }
.nw-input:focus { outline: 1px solid var(--c-bcyan); }
.nw-textarea { width: 100%; resize: vertical; white-space: pre; }
.nw-check { width: 14px; height: 14px; accent-color: var(--c-blue); }

.nw-btnrow { display: flex; gap: 10px; padding: 8px 4px 4px; justify-content: center; }
.nw-btn { background: var(--silver); color: #000; padding: 2px 10px; cursor: pointer;
  border: 2px solid; border-color: var(--silver-lt) var(--silver-dkr) var(--silver-dkr) var(--silver-lt); }
.nw-btn:hover, .nw-btn.selected { background: #d4d4d4; outline: 1px dotted #000; }
.nw-btn:active { border-color: var(--silver-dkr) var(--silver-lt) var(--silver-lt) var(--silver-dkr); }

.nw-footer-keys .nw-key { margin-right: 8px; }
.nw-footer-keys b { color: var(--c-bcyan); }
.nw-dim { color: var(--c-lgray); }
.nw-hi { color: var(--c-bcyan); }

/* file / process views */
.file-view { background: #000030; color: var(--c-bgreen); border: 2px solid #3030a0;
  padding: 6px 8px; margin: 4px; white-space: pre; overflow: auto; max-height: 60vh; }
.file-view.hex { color: var(--c-bcyan); }
.proc-out { background: #000; color: #cfcfcf; border: 2px solid #3030a0; margin: 4px;
  padding: 4px 8px; min-height: 90px; max-height: 220px; overflow-y: auto; white-space: pre; }
.proc-line.ok { color: var(--c-bgreen); }
.proc-line.hi { color: var(--c-yellow); }

/* rights checkboxes */
.rights-row { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 2px; }
.rights-check { display: inline-flex; align-items: center; gap: 3px; color: #000; white-space: nowrap; }
.nw-dialog .rights-check { color: #000; }
.rights-eff { padding: 4px 2px; color: var(--c-blue); font-weight: bold; }
.nw-dialog .rights-eff { color: var(--c-blue); }

/* ==========================================================================
   APP-SPECIFIC
   ========================================================================== */
.monitor-bigutil { font-size: 20px; letter-spacing: -2px; color: var(--c-bgreen); padding: 8px; text-align: center; }
.monitor-bigutil.warm { color: var(--c-yellow); }
.monitor-bigutil.hot { color: var(--c-bred); }

.netmap-canvas { margin: 4px; border: 2px solid #3030a0; background: #0a0a3a; width: calc(100% - 8px); }

.graphs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; overflow-y: auto; }
.graph-card { border: 2px solid #3030a0; background: #05052a; padding: 4px; }
.graph-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 2px; }
.graph-title { color: var(--c-lgray); font-size: 12px; }
.graph-val { font-weight: bold; font-size: 14px; }
.graph-canvas { width: 100%; height: 56px; display: block; }

.log-root { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.log-filterbar { flex: 0 0 auto; display: flex; gap: 6px; padding: 4px 6px; flex-wrap: wrap; }
.log-chip { background: #000050; color: var(--c-lgray); border: 1px solid #3030a0; padding: 1px 8px; cursor: pointer; }
.log-chip.active { background: var(--c-cyan); color: #000; font-weight: bold; }
.log-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; background: #000; color: #cfcfcf;
  border: 2px solid #3030a0; margin: 0 4px 4px; padding: 3px 6px; white-space: pre-wrap; outline: none; }
.log-line { white-space: pre-wrap; }
.log-line.sev-info { color: #8fce8f; }
.log-line.sev-warn { color: var(--c-yellow); }
.log-line.sev-error { color: var(--c-bred); }

.help-root { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.help-searchbar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 4px 6px; color: var(--c-bcyan); }
.help-search { flex: 1 1 auto; }
.help-panes { flex: 1 1 auto; min-height: 0; display: flex; gap: 4px; padding: 0 4px 4px; }
.help-list { flex: 0 0 200px; overflow-y: auto; border: 2px solid #3030a0; background: #000030; outline: none; }
.help-cat { color: var(--c-yellow); padding: 2px 6px; border-top: 1px solid #3030a0; }
.help-item { padding: 1px 6px; cursor: pointer; color: var(--c-white); }
.help-item.selected { background: var(--c-cyan); color: #000; font-weight: bold; }
.help-content-wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border: 2px solid #3030a0; background: #000030; }
.help-topic-title { flex: 0 0 auto; background: #000070; color: var(--c-yellow); padding: 2px 8px; font-weight: bold; }
.help-content { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0; padding: 6px 10px; white-space: pre-wrap; color: #dcdcdc; }

.about-root { flex: 1 1 auto; overflow-y: auto; padding: 10px 14px; }
.about-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.about-tile { width: 42px; height: 42px; background: var(--c-red); color: #fff; font-weight: bold;
  font-size: 30px; text-align: center; line-height: 42px; border: 2px solid #7a0000; cursor: pointer; }
.about-word1 { color: var(--c-bred); font-size: 20px; font-weight: bold; letter-spacing: 1px; }
.about-word2 { color: var(--c-bcyan); font-size: 12px; letter-spacing: 3px; }
.about-banner { color: var(--c-yellow); font-size: 18px; font-weight: bold; }
.about-sub { color: var(--c-bcyan); margin-bottom: 8px; }
.about-copy { color: #cfcfcf; background: #000040; border: 2px solid #3030a0; padding: 6px 10px; white-space: pre; }
.about-note { color: var(--c-lgray); font-size: 12px; margin-top: 10px; line-height: 1.4; }
.about-hint { color: var(--c-bgreen); margin-top: 10px; font-size: 12px; }

.set-row { display: block; padding: 2px 4px; color: var(--c-white); cursor: pointer; }
.set-btns { display: flex; gap: 10px; padding: 6px 2px; flex-wrap: wrap; }

.pcon-jobs { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  </style>
</head>

  <div id="crt">
    <div id="screen"></div>
  </div>

  <noscript>
    <p style="color:#0f0;font-family:monospace;padding:20px">
      This NetWare 4.11 simulation requires JavaScript.
    </p>
  </noscript>

  <!-- ===== core layer ===== -->
  <script>
/* ===== js/core/namespace.js ===== */
/* ==========================================================================
   namespace.js  —  Global NW namespace, tiny utilities, and an event bus.
   Loaded first. Everything hangs off window.NW.
   ========================================================================== */
(function () {

(function (NW) {

  var RIGHTS = ['S', 'R', 'W', 'C', 'E', 'M', 'F', 'A']; // Supervisor,Read,Write,Create,Erase,Modify,FileScan,AccessControl

    title: 'System Administrator', department: 'Information Systems', admin: true,
    groups: ['EVERYONE'], homeDir: 'USERS:ADMIN',
    trustees: [{ path: '[Root]', rights: 'S' }, { path: 'SYS:', rights: 'RWCEMFA' }],
    script: 'MAP *1:=SYS:\nMAP F:=SYS:SYSTEM\nWRITE "Supervisor equivalent - handle with care."' }));

  var ouGroups = add(acme, node('Organizational Unit', 'Groups', { desc: 'Security Groups' }));
  var ouServers = add(acme, node('Organizational Unit', 'Servers', { desc: 'File & Print Servers' }));
  var ouPrint = add(acme, node('Organizational Unit', 'Printers', { desc: 'Printing Resources' }));

    department: 'Sales', groups: ['EVERYONE', 'SALES'], password: 'carrot' }));
  add(ouUsers, user('DDUCK', { fullName: 'Daffy Duck', title: 'Sales Associate',
    department: 'Sales', groups: ['EVERYONE', 'SALES'], password: 'wabbit' }));
  add(ouUsers, user('WCOYOTE', { fullName: 'Wile E. Coyote', title: 'Design Engineer',
    department: 'Engineering', groups: ['EVERYONE', 'ENGINEERING'], password: 'genius' }));
  add(ouUsers, user('RRUNNER', { fullName: 'Road Runner', title: 'QA Analyst',
    department: 'Engineering', groups: ['EVERYONE', 'ENGINEERING'], password: 'beepbeep' }));
  add(ouUsers, user('PLETUARD', { fullName: 'Pepe Le Pew', title: 'Accountant',

  add(ouGroups, group('SALES', 'Sales Department', ['BBUNNY', 'DDUCK']));

  function dnOf(n) {

    RIGHTS: RIGHTS,
    root: root,
    org: acme,
    containers: { users: ouUsers, groups: ouGroups, servers: ouServers, printers: ouPrint },
    dnOf: dnOf,
    contextOf: contextOf,
    isContainer: function (n) {
      return ['Tree Root', 'Organization', 'Organizational Unit', 'Country', 'Locality'].indexOf(n.cls) >= 0;

    },

    },
    findByName: function (name) {

      st.createdUsers.push({ name: name, container: container.name, opts: opts || {} });

    },
    deleteObject: function (n) {
      if (n.cls === 'User' && n.props.admin) return { ok: false, reason: 'admin' };

      else st.createdUsers = st.createdUsers.filter(function (c) { return c.name !== n.name; });

      NW.bus.emit('nds:changed');
      return { ok: true };

    setPassword: function (n, pw) {
      n.props.password = pw;
      NW.State.get().passwords[n.name] = pw; NW.State.save();
      NW.bus.emit('nds:changed');
    },
    /* effective rights = union of user + group trustee grants for a path */
    effectiveRights: function (userNode, path) {
      var granted = {};
      function apply(list) {
        (list || []).forEach(function (t) {
          if (path.toUpperCase().indexOf(t.path.toUpperCase()) === 0 || t.path === '[Root]') {
            t.rights.split('').forEach(function (r) { if (RIGHTS.indexOf(r) >= 0) granted[r] = true; });

    },
    /* apply persisted runtime changes on boot */
    hydrate: function () {
      var st = NW.State.get();
      (st.deletedUsers || []).forEach(function (nm) {
        var u = NDS.findUser(nm); if (u && !u.props.admin) { u.parent.children = u.parent.children.filter(function (c) { return c !== u; }); }
      });
      (st.createdUsers || []).forEach(function (c) {
        if (NDS.findUser(c.name)) return;
        var cont = NDS.findByName(c.container) || ouUsers;
        var u = user(c.name, c.opts || {}); u.seeded = false; add(cont, u);
      });
      Object.keys(st.passwords || {}).forEach(function (nm) {
        var u = NDS.findUser(nm); if (u) u.props.password = st.passwords[nm];
      });
    },
  };

  NW.data = NW.data || {};
  NW.data.nds = NDS;
})(window.NW);

      ['DS', 'Directory Services: synchronization delayed on partition ACME.'],
      ['TIMESYNC', 'Polling interval exceeded; time source unreachable.'],
      ['CONN', 'Connection %N exceeded the maximum record lock count.'],
      ['CACHE', 'Cache buffers have dropped below the minimum threshold (20%).'],
      ['LAN', 'Excessive collisions detected on board NE2000_1_E82.'],
    ],
    error: [
      ['DISK', 'Device #1: I/O error reading redirection area block 4096.'],
      ['DS', '-625 transport failure communicating with ACME_FS2.'],
      ['SERVER', 'Abend recovery: the previous shutdown was not clean.'],
      ['TTS', 'Transaction Tracking disabled: insufficient disk space.'],
      ['LAN', 'Board NE2000_1_EII failed to initialize frame ETHERNET_II.'],

  function fill(msg) {
    return msg
      .replace('%U', U.choice(['BBUNNY', 'DDUCK', 'WCOYOTE', 'RRUNNER', 'PLETUARD', 'ADMIN', 'GUEST']))
      .replace('%N', U.rint(2, 24))

  }

  var entries = [];
  var idc = 0;
  function push(sev, src, msg, when) {

  var Logs = {
    all: function () { return entries; },
    filtered: function (sev) { return sev ? entries.filter(function (e) { return e.sev === sev; }) : entries; },
    fmt: function (e) {

        '  ' + U.padEnd('[' + e.src + ']', 11) + ' ' + e.msg;
    },
    seed: function () {
      // build ~40 historical entries with ascending timestamps
      var t = Date.now() - 6 * 3600 * 1000;
      var script = [
        ['info', 'SERVER', 'ACME_FS1 IntranetWare v4.11 - server started.'],
        ['info', 'NLM', 'Module DS.NLM loaded successfully.'],
        ['info', 'DS', 'Local database is open.'],
        ['info', 'TIMESYNC', 'This server is a SINGLE reference time source.'],
        ['info', 'DS', 'All processed = Yes. Directory Services is active.'],
      ];
      script.forEach(function (s) { push(s[0], s[1], s[2], new Date(t)); t += U.rint(2000, 40000); });

        var tpl = U.choice(templates[sev]);
        push(sev, tpl[0], fill(tpl[1]), new Date(t));
        t += U.rint(20000, 400000);
      }
    },
    random: function () {
      var sev = U.chance(0.7) ? 'info' : U.chance(0.7) ? 'warn' : 'error';
      var tpl = U.choice(templates[sev]);
      push(sev, tpl[0], fill(tpl[1]));
      NW.bus.emit('logs:changed');
    },
    add: function (o) { push(o.sev || 'info', o.src || 'SERVER', o.msg, o.time); NW.bus.emit('logs:changed'); },
    start: function () {
      NW.bus.on('log:add', function (o) { Logs.add(o); });

(function (NW) {

    { cat: 'NetWare Commands', title: 'LOAD',

    { cat: 'NetWare Commands', title: 'UNLOAD',

    { cat: 'NetWare Commands', title: 'MOUNT / DISMOUNT',
      body: 'MOUNT makes a volume available to network users. DISMOUNT takes\na volume offline so it can be repaired with VREPAIR or expanded.\n\nSyntax:   MOUNT volumename | ALL\n          DISMOUNT volumename' },
    { cat: 'NetWare Commands', title: 'DOWN / RESTART SERVER',
      body: 'DOWN cleanly shuts the server down, closing files and flushing\ncache to disk. RESTART SERVER downs the server and brings it back\nup by re-reading STARTUP.NCF and AUTOEXEC.NCF.\n\nAlways DOWN the server before switching it off.' },
    { cat: 'NetWare Commands', title: 'SEND / BROADCAST',
      body: 'Sends a message to one or more logged-in connections.\n\nSyntax:   SEND "message" TO connection | username\nExample:  SEND "Server going down in 5 minutes" TO ALL' },
    { cat: 'NLMs', title: 'MONITOR.NLM',
      body: 'The server monitor. Displays processor utilization, cache buffer\nstatistics, connection information, disk and LAN activity, loaded\nmodules and memory usage. MONITOR is also used to lock the server\nconsole with a password.' },
    { cat: 'NLMs', title: 'DSREPAIR.NLM',
      body: 'Repairs the NetWare Directory Services (NDS) database. It can run\nan unattended full repair, check replica synchronization, repair\nthe local database, and view the repair log. Always have a good\nbackup before running a full repair.' },
    { cat: 'NLMs', title: 'VREPAIR.NLM',
      body: 'Repairs minor problems on a NetWare volume without restoring from\nbackup. The volume must be DISMOUNTED before VREPAIR can run. It\ncorrects File Allocation Table and Directory Entry Table errors.' },
    { cat: 'Volumes', title: 'Volume Basics',
      body: 'A NetWare volume is the highest level of the file system. SYS: is\ncreated during installation and holds the operating system files\n(SYSTEM, PUBLIC, LOGIN, MAIL, ETC). Additional volumes such as\nDATA: or APPS: hold user and application data. Volumes may span\nmultiple disk segments.' },
    { cat: 'NDS', title: 'NDS Tree Structure',
      body: 'NetWare Directory Services organizes all network resources into a\nhierarchical tree. [Root] is at the top, followed by Organization\n(O) and Organizational Unit (OU) container objects. Leaf objects\n(Users, Groups, Servers, Volumes, Printers) live inside containers.\nAn object\'s "context" is its location in the tree.' },
    { cat: 'NDS', title: 'Contexts and Names',
      body: 'A distinguished name lists an object and every container above it,\ne.g. CN=BBUNNY.OU=Users.O=ACME. Set your current context with CX\nso you can refer to objects by their common name alone.' },
    { cat: 'Printing', title: 'Print Services',
      body: 'NetWare queue-based printing uses three objects: a Print Queue\n(where jobs wait), a Printer (the physical device), and a Print\nServer (PSERVER.NLM, which moves jobs from the queue to the\nprinter). Manage them with PCONSOLE or NetWare Administrator.' },
    { cat: 'Licensing', title: 'Connection Licensing',
      body: 'IntranetWare is licensed by the number of concurrent user\nconnections. When all licensed connections are in use, additional\nlogins are refused until a connection is freed. Install additional\nlicenses with the License Manager.' },
    { cat: 'Rights', title: 'Trustee Rights',
      body: 'Eight file-system rights control access: Supervisor (S), Read (R),\nWrite (W), Create (C), Erase (E), Modify (M), File Scan (F) and\nAccess Control (A). Effective rights are the rights that actually\napply after inherited rights and the Inherited Rights Filter are\ntaken into account.' },
    { cat: 'Troubleshooting', title: 'Server Will Not Mount SYS',
      body: '1. Check that STARTUP.NCF loads the correct disk driver.\n2. DISMOUNT SYS and run VREPAIR.\n3. Verify the disk hardware with the adapter\'s setup utility.\n4. As a last resort, restore SYS from a recent SMS backup.' },
    { cat: 'Troubleshooting', title: 'Common Abend Causes',
      body: 'An "abend" (abnormal end) halts the server. Frequent causes are a\nfaulty or out-of-date LAN/disk driver, a third-party NLM writing\noutside its memory, or failing hardware. Note the abend message,\nunload the suspect NLM, and check with the vendor for updates.' },
    { cat: 'Networking', title: 'IPX and TCP/IP',

  var Help = {

    all: function () { return topics; },
    search: function (q) {

  <script>
/* ===== js/system/monitor-engine.js ===== */
/* ==========================================================================
   monitor-engine.js  —  MonitoringEngine. Generates continuously-updating,
   plausible server statistics via smoothed random walks. Everything that
   shows a number or graph (MONITOR, the graphs dashboard, the status bar)
   reads from here. Emits 'monitor:tick' about once per second.
   ========================================================================== */
(function (NW) {
  'use strict';

  var srv = NW.data.server;
  var HIST = 120;

  function ring() { var a = []; for (var i = 0; i < HIST; i++) a.push(0); return a; }

  var m = {
    utilization: 3,
    totalCacheBuffers: Math.round(srv.installedMemory * 0.62),
    originalCacheBuffers: Math.round(srv.installedMemory * 0.68),
    dirtyCacheBuffers: 12,
    longTermCacheHits: 98,
    diskReads: 0, diskWrites: 0,
    packetsIn: 0, packetsOut: 0,
    ipx: 0, spx: 0,
    dirCacheBuffers: 4012,
    serviceProcesses: 6, maxServiceProcesses: 60,
    packetReceiveBuffers: 220,
    kbytesRead: 184203, kbytesWritten: 90114,
    memUsed: Math.round(srv.installedMemory * 0.44),
  };

  var hist = {
    utilization: ring(), cache: ring(), diskReads: ring(), diskWrites: ring(),
    packetsIn: ring(), packetsOut: ring(), ipx: ring(), spx: ring(),
    memory: ring(), dirCache: ring(),
  };

  function walk(v, lo, hi, step) {
    v += NW.util.rfloat(-step, step);
    if (v < lo) v = lo + Math.abs(v - lo) * 0.5;
    if (v > hi) v = hi - Math.abs(v - hi) * 0.5;
    return v;
  }
  function pushHist(name, val) { var a = hist[name]; a.push(val); if (a.length > HIST) a.shift(); }

  var burst = 0;
  function tick() {
    // occasional activity bursts to make graphs lively
    if (NW.util.chance(0.06)) burst = NW.util.rint(8, 26);
    if (burst > 0) burst--;
    var load = burst > 0 ? NW.util.rint(20, 70) : 0;

    m.utilization = Math.round(NW.util.clamp(walk(m.utilization, 1, 96, 6) + load * 0.3, 1, 99));
    m.dirtyCacheBuffers = Math.round(walk(m.dirtyCacheBuffers, 0, 900, 40));
    m.longTermCacheHits = Math.round(NW.util.clamp(walk(m.longTermCacheHits, 88, 99, 0.6), 0, 100));
    m.diskReads = Math.round(NW.util.clamp(walk(m.diskReads, 0, 320, 40) + load, 0, 400));
    m.diskWrites = Math.round(NW.util.clamp(walk(m.diskWrites, 0, 180, 30) + load * 0.4, 0, 260));
    m.packetsIn = Math.round(NW.util.clamp(walk(m.packetsIn, 4, 1400, 160) + load * 6, 0, 2000));
    m.packetsOut = Math.round(NW.util.clamp(walk(m.packetsOut, 4, 1300, 150) + load * 5, 0, 2000));
    m.ipx = Math.round(m.packetsIn * NW.util.rfloat(0.55, 0.8));
    m.spx = Math.round(m.packetsIn * NW.util.rfloat(0.05, 0.2));
    m.dirCacheBuffers = Math.round(walk(m.dirCacheBuffers, 3600, 4400, 30));
    m.memUsed = Math.round(walk(m.memUsed, srv.installedMemory * 0.4, srv.installedMemory * 0.6, 400));
    m.serviceProcesses = NW.util.clamp(Math.round(walk(m.serviceProcesses, 4, 40, 2)), 4, m.maxServiceProcesses);
    m.kbytesRead += m.diskReads * 4;
    m.kbytesWritten += m.diskWrites * 4;

    pushHist('utilization', m.utilization);
    pushHist('cache', m.totalCacheBuffers - m.dirtyCacheBuffers);
    pushHist('diskReads', m.diskReads);
    pushHist('diskWrites', m.diskWrites);
    pushHist('packetsIn', m.packetsIn);
    pushHist('packetsOut', m.packetsOut);
    pushHist('ipx', m.ipx);
    pushHist('spx', m.spx);
    pushHist('memory', Math.round(m.memUsed / srv.installedMemory * 100));
    pushHist('dirCache', m.dirCacheBuffers);

    NW.bus.emit('monitor:tick', m);
  }

  var timer = null;
  var Monitor = {
    HIST: HIST,
    values: m,
    hist: hist,
    connections: function () { return NW.data.connections.count(); },
    start: function () { if (!timer) { tick(); timer = setInterval(tick, 1000); } },
    stop: function () { clearInterval(timer); timer = null; },
  };

  NW.Monitor = Monitor;
})(window.NW);

  </script>
  <script>
/* ===== js/system/wm.js ===== */
/* ==========================================================================
   wm.js  —  WindowManager. Movable, focusable "C-Worthy" windows that host
   the simulated utilities. Scale-aware dragging, z-ordering, Esc-to-close,
   and position persistence via StateManager.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el;
  var wins = [];
  var zTop = 100;
  var deskEl = null;

  function desktop() { return deskEl || (deskEl = document.getElementById('desktop')); }
  function deskSize() { var d = desktop(); return { w: d.clientWidth, h: d.clientHeight }; }

  function bringToFront(win) {
    zTop += 1;
    win.root.style.zIndex = zTop;
    wins.forEach(function (w) { w.root.classList.toggle('focused', w === win); });
    NW.WM.active = win;
  }

  function clampPos(win) {
    var ds = deskSize();
    win.x = NW.util.clamp(win.x, 8 - win.w + 60, ds.w - 40);
    win.y = NW.util.clamp(win.y, 0, ds.h - 24);
    win.root.style.left = win.x + 'px';
    win.root.style.top = win.y + 'px';
  }

  function makeDraggable(win, handle) {
    var startX, startY, ox, oy, dragging = false;
    handle.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.nw-close, .nw-btn')) return;
      dragging = true;
      startX = e.clientX; startY = e.clientY; ox = win.x; oy = win.y;
      bringToFront(win);
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var s = NW.screenScale || 1;
      win.x = ox + (e.clientX - startX) / s;
      win.y = oy + (e.clientY - startY) / s;
      clampPos(win);
    });
    function end() {
      if (!dragging) return;
      dragging = false;
      if (win.key) NW.State.set('windows.' + win.key, { x: win.x, y: win.y, w: win.w, h: win.h });
    }
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }

  var WM = {
    windows: wins,
    active: null,
    exists: function (key) { return wins.some(function (w) { return w.key === key; }); },
    focusByKey: function (key) {
      var w = wins.find(function (x) { return x.key === key; });
      if (w) { bringToFront(w); w.body.focus(); return true; }
      return false;
    },
    open: function (opts) {
      opts = opts || {};
      // single-instance windows: focus existing
      if (opts.key && WM.focusByKey(opts.key)) return wins.find(function (w) { return w.key === opts.key; });

      var w = opts.w || 560, h = opts.h || 400;
      var ds = deskSize();
      var saved = opts.key ? (NW.State.get().windows[opts.key]) : null;
      var x = saved ? saved.x : Math.round((ds.w - w) / 2 + NW.util.rint(-20, 20));
      var y = saved ? saved.y : Math.round((ds.h - h) / 2 - 10 + NW.util.rint(-16, 16));

      var titleText = el('span', { class: 'nw-title-text', text: ' ' + (opts.title || 'Window') + ' ' });
      var closeBox = el('span', { class: 'nw-close', title: 'Close (Esc)', text: '≡' });
      var titlebar = el('div', { class: 'nw-titlebar' }, [
        el('span', { class: 'nw-title-fill' }),
        titleText,
        el('span', { class: 'nw-title-fill' }),
        closeBox,
      ]);
      var body = el('div', { class: 'nw-body', tabindex: '0' });
      var footer = opts.footer !== false ? el('div', { class: 'nw-footer', text: opts.footer || '' }) : null;

      var root = el('div', { class: 'nw-window' + (opts.className ? ' ' + opts.className : '') },
        [titlebar, body, footer].filter(Boolean));
      root.style.width = w + 'px';
      if (opts.h) root.style.height = h + 'px';

      var win = {
        root: root, body: body, titlebar: titlebar, footerEl: footer,
        x: x, y: y, w: w, h: h, key: opts.key || null, opts: opts,
        escCloses: opts.escCloses !== false,
        setTitle: function (t) { titleText.textContent = ' ' + t + ' '; },
        setFooter: function (t) { if (footer) footer.textContent = t; },
        close: function () { WM.close(win); },
        focus: function () { bringToFront(win); body.focus(); },
      };

      desktop().appendChild(root);
      clampPos(win);
      wins.push(win);
      makeDraggable(win, titlebar);
      closeBox.addEventListener('click', function () { NW.Audio.click(); win.close(); });
      root.addEventListener('pointerdown', function () { bringToFront(win); }, true);
      bringToFront(win);

      if (typeof opts.render === 'function') opts.render(body, win);
      setTimeout(function () { body.focus(); }, 0);
      NW.Audio.click();
      NW.bus.emit('wm:open', win);
      return win;
    },
    close: function (win) {
      var i = wins.indexOf(win);
      if (i < 0) return;
      wins.splice(i, 1);
      if (win.opts && typeof win.opts.onClose === 'function') { try { win.opts.onClose(); } catch (e) {} }
      if (win.root.parentNode) win.root.parentNode.removeChild(win.root);
      var top = wins[wins.length - 1];
      if (top) bringToFront(top);
      NW.bus.emit('wm:close', win);
    },
    closeActive: function () {
      var w = WM.active;
      if (w && w.escCloses) { w.close(); return true; }
      return false;
    },
    list: function () { return wins.map(function (w) { return { key: w.key, title: w.titlebar.textContent.trim() }; }); },
  };

  // global Esc handling: close the top window if it allows it
  document.addEventListener('keydown', function (e) {

      var top = WM.active || wins[wins.length - 1];

    }
  });

  NW.WM = WM;
})(window.NW);

/* ===== js/system/tui.js ===== */
/* ==========================================================================
   tui.js  —  Application framework. The "C-Worthy" widget toolkit used by the
   simulated utilities (headers, boxed panels, info grids, keyboard-navigable
   menus and tables, forms, gauges) plus dialog helpers, an app registry, and
   the launcher that opens an app inside a WindowManager window.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el;

  /* ---- static building blocks ---------------------------------------- */
  function header(title, right) {
    return el('div', { class: 'nw-header' }, [
      el('span', { class: 'nw-header-title', text: title }),
      el('span', { class: 'nw-header-right', text: right || ('NetWare ' + NW.VERSION) }),
    ]);
  }

  function subhead(text) { return el('div', { class: 'nw-subhead', text: text }); }

  function box(title, content) {

    var inner = el('div', { class: 'nw-box-inner' });

    });

        el('span', { class: 'nw-grid-label', text: p[0] }),

  /* a horizontal block gauge, e.g. utilization  [████████░░░░]  57% */

    function enabled(i) { return items[i] && !items[i].disabled && !items[i].separator; }

    function paint() {

      });

    }

    items.forEach(function (it, i) {
      if (it.separator) { rows.push(el('div', { class: 'nw-menu-sep', text: '' })); container.appendChild(rows[i]); return; }
      var row = el('div', { class: 'nw-menu-item' + (it.disabled ? ' disabled' : '') }, [

        it.hint ? el('span', { class: 'nw-menu-hint', text: it.hint }) : null,
      ]);
      row.addEventListener('mouseenter', function () { if (enabled(i)) { idx = i; paint(); } });
      row.addEventListener('click', function () { activate(i); });
      rows.push(row);
      container.appendChild(row);
    });

    idx = firstEnabled(); paint();

    container.addEventListener('keydown', function (e) {
      switch (e.key) {
        case 'ArrowDown': move(1); e.preventDefault(); break;
        case 'ArrowUp': move(-1); e.preventDefault(); break;
        case 'Home': idx = firstEnabled(); paint(); e.preventDefault(); break;
        case 'End': for (var j = items.length - 1; j >= 0; j--) { if (enabled(j)) { idx = j; break; } } paint(); e.preventDefault(); break;
        case 'Enter': case ' ': activate(idx); e.preventDefault(); break;
        default:
          if (e.key.length === 1 && /\S/.test(e.key)) {
            var ch = e.key.toUpperCase();
            for (var k = 1; k <= items.length; k++) {
              var t = (idx + k) % items.length;
              if (enabled(t) && items[t].label.trim().toUpperCase().charAt(0) === ch) { idx = t; paint(); break; }
            }
          }
      }
    });

    return {
      el: container,
      focus: function () { container.focus(); },
      index: function () { return idx; },
      select: function (i) { idx = i; paint(); },
    };
  }

  /* ---- keyboard-navigable table/list --------------------------------- */
  function table(columns, rows, opts) {
    opts = opts || {};
    var wrap = el('div', { class: 'nw-list' });
    var head = el('div', { class: 'nw-list-head' });
    columns.forEach(function (c) {
      head.appendChild(el('span', { class: 'nw-list-cell ' + (c.align || 'l'), style: { width: (c.width || 10) + 'ch' }, text: c.title }));
    });
    wrap.appendChild(head);
    var scroll = el('div', { class: 'nw-list-scroll', tabindex: '0' });
    var rowEls = [];
    var idx = 0;

    function paint() {
      rowEls.forEach(function (r, i) { r.classList.toggle('selected', i === idx); });
      if (rowEls[idx]) rowEls[idx].scrollIntoView({ block: 'nearest' });
      if (opts.onMove && rows[idx]) opts.onMove(rows[idx], idx);
    }
    function activate(i) {
      if (!rows[i]) return;
      NW.Audio.click();
      if (opts.onSelect) opts.onSelect(rows[i], i);
    }

    function buildRow(r, i) {
      var row = el('div', { class: 'nw-list-row' });
      columns.forEach(function (c, ci) {
        var v = r.cells[ci];
        row.appendChild(el('span', { class: 'nw-list-cell ' + (c.align || 'l') + (r.cellClass && r.cellClass[ci] ? ' ' + r.cellClass[ci] : ''), style: { width: (c.width || 10) + 'ch' }, text: v == null ? '' : String(v) }));
      });
      row.addEventListener('mouseenter', function () { idx = i; paint(); });
      row.addEventListener('click', function () { idx = i; paint(); });
      row.addEventListener('dblclick', function () { idx = i; paint(); activate(i); });
      return row;
    }

    rows.forEach(function (r, i) { var e = buildRow(r, i); rowEls.push(e); scroll.appendChild(e); });
    wrap.appendChild(scroll);
    if (rows.length) paint();

    scroll.addEventListener('keydown', function (e) {
      switch (e.key) {
        case 'ArrowDown': idx = Math.min(rows.length - 1, idx + 1); paint(); e.preventDefault(); break;
        case 'ArrowUp': idx = Math.max(0, idx - 1); paint(); e.preventDefault(); break;
        case 'PageDown': idx = Math.min(rows.length - 1, idx + 10); paint(); e.preventDefault(); break;
        case 'PageUp': idx = Math.max(0, idx - 10); paint(); e.preventDefault(); break;
        case 'Home': idx = 0; paint(); e.preventDefault(); break;
        case 'End': idx = rows.length - 1; paint(); e.preventDefault(); break;
        case 'Enter': activate(idx); e.preventDefault(); break;
        case 'Insert': if (opts.onInsert) { opts.onInsert(); e.preventDefault(); } break;
        case 'Delete': if (opts.onDelete && rows[idx]) { opts.onDelete(rows[idx], idx); e.preventDefault(); } break;
        default:
          if (e.key === 'F3' && opts.onModify && rows[idx]) { opts.onModify(rows[idx], idx); e.preventDefault(); }
      }
    });

    return {
      el: wrap, scroll: scroll,
      focus: function () { scroll.focus(); },
      index: function () { return idx; },
      current: function () { return rows[idx]; },
    };
  }

  /* ---- simple label:field form --------------------------------------- */
  function form(fields, opts) {
    opts = opts || {};
    var f = el('form', { class: 'nw-form' });
    var refs = {};
    fields.forEach(function (fld) {
      var input;
      if (fld.type === 'select') {
        input = el('select', { class: 'nw-input' });
        (fld.options || []).forEach(function (o) {
          input.appendChild(el('option', { value: o.value != null ? o.value : o, text: o.label != null ? o.label : o }));
        });
        if (fld.value != null) input.value = fld.value;
      } else if (fld.type === 'checkbox') {
        input = el('input', { type: 'checkbox', class: 'nw-check' });
        input.checked = !!fld.value;
      } else if (fld.type === 'textarea') {
        input = el('textarea', { class: 'nw-input nw-textarea', rows: fld.rows || 6, text: fld.value || '' });
      } else {
        input = el('input', { type: fld.type || 'text', class: 'nw-input', value: fld.value || '' });
        if (fld.maxlength) input.maxLength = fld.maxlength;
      }
      refs[fld.name] = input;
      f.appendChild(el('div', { class: 'nw-field' }, [
        el('label', { class: 'nw-field-label', text: fld.label + ':' }),
        input,
      ]));
    });
    f.addEventListener('submit', function (e) { e.preventDefault(); if (opts.onSubmit) opts.onSubmit(refs); });
    return {
      el: f, refs: refs,
      value: function (n) { var i = refs[n]; return i.type === 'checkbox' ? i.checked : i.value; },
      focus: function () { var first = f.querySelector('.nw-input'); if (first) first.focus(); },
    };
  }

  /* ---- dialogs ------------------------------------------------------- */
  function dialog(opts) {
    return NW.WM.open({
      title: opts.title || 'Message',
      w: opts.w || 380, className: 'nw-dialog', footer: false,
      render: function (body, win) {
        if (opts.tone) body.classList.add('tone-' + opts.tone);
        body.appendChild(el('div', { class: 'nw-dialog-msg', html: opts.messageHtml || NW.util.escapeHtml(opts.message || '').replace(/\n/g, '<br>') }));
        if (opts.extra) body.appendChild(opts.extra);
        var btnrow = el('div', { class: 'nw-btnrow' });
        var buttons = opts.buttons || [{ label: 'OK', value: true, def: true }];
        var bi = 0, btnEls = [];
        function paint() { btnEls.forEach(function (b, i) { b.classList.toggle('selected', i === bi); }); }
        buttons.forEach(function (b, i) {
          var be = el('button', { class: 'nw-btn', type: 'button', text: b.label });
          be.addEventListener('click', function () { NW.Audio.click(); win.close(); if (opts.onResult) opts.onResult(b.value); });
          be.addEventListener('mouseenter', function () { bi = i; paint(); });
          btnEls.push(be); btnrow.appendChild(be);
          if (b.def) bi = i;
        });
        body.appendChild(btnrow);
        paint();
        body.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight' || e.key === 'Tab') { bi = (bi + 1) % buttons.length; paint(); e.preventDefault(); }
          else if (e.key === 'ArrowLeft') { bi = (bi - 1 + buttons.length) % buttons.length; paint(); e.preventDefault(); }
          else if (e.key === 'Enter') { btnEls[bi].click(); e.preventDefault(); }
        });
        if (opts.tone === 'alert' || opts.tone === 'error') NW.Audio.alert();
        else NW.Audio.beep();
      },
    });
  }

  function alert(message, title, tone) {
    return dialog({ title: title || 'NetWare', message: message, tone: tone || 'alert',
      buttons: [{ label: '  OK  ', value: true, def: true }] });
  }
  function confirm(message, onYes, title) {
    return dialog({ title: title || 'Confirm', message: message, tone: 'warn',
      buttons: [{ label: '  Yes  ', value: true }, { label: '  No  ', value: false, def: true }],
      onResult: function (v) { if (v && onYes) onYes(); } });
  }
  function promptText(opts) {
    var input = el('input', { class: 'nw-input', type: opts.password ? 'password' : 'text', value: opts.value || '' });
    var wrap = el('div', { class: 'nw-field' }, [el('label', { class: 'nw-field-label', text: (opts.label || 'Value') + ':' }), input]);
    var d = dialog({
      title: opts.title || 'Enter Value', w: opts.w || 420, extra: wrap,
      message: opts.message || '',
      buttons: [{ label: ' OK ', value: true }, { label: ' Cancel ', value: false, def: false }],
      onResult: function (v) { if (v && opts.onOk) opts.onOk(input.value); },
    });
    setTimeout(function () { input.focus(); input.select && input.select(); }, 20);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); d.close(); if (opts.onOk) opts.onOk(input.value); }
    });
    return d;
  }

  /* ---- app registry + launcher --------------------------------------- */
  var registry = {};
  var apps = {
    register: function (def) { registry[def.id] = def; return def; },
    get: function (id) { return registry[id]; },
    all: function () { return Object.keys(registry).map(function (k) { return registry[k]; }); },
    byCategory: function (cat) { return apps.all().filter(function (a) { return a.category === cat; }); },
  };

  /* ---- per-window screen stack (menu -> sub-screen -> Esc back) ------- */
  function screens(win) {
    var stack = [];
    win.escCloses = false;
    var host = win.body;
    function paint() {
      var top = stack[stack.length - 1];
      host.innerHTML = '';
      host.appendChild(top.el);
      if (top.title != null) win.setTitle(top.title);
      if (top.footer != null) win.setFooter(top.footer);
      if (top.focus) setTimeout(top.focus, 0);
    }
    host.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        e.preventDefault(); e.stopPropagation();
        if (stack.length > 1) { stack.pop(); NW.Audio.click(); paint(); }
        else win.close();
      }
    });
    return {
      push: function (v) { stack.push(v); paint(); },
      replaceRoot: function (v) { stack = [v]; paint(); },
      back: function () { if (stack.length > 1) { stack.pop(); paint(); } else win.close(); },
      depth: function () { return stack.length; },
    };
  }

  function launch(id, params) {
    var def = registry[id];
    if (!def) { alert('Module ' + id + ' could not be found.\nLOADER cannot find the file.', 'LOAD', 'error'); return null; }
    return NW.WM.open({
      key: def.singleton === false ? null : id,
      title: def.title,
      w: def.w || 620, h: def.h || 440,
      footer: (def.footer != null ? def.footer : false),
      className: def.className || '',
      escCloses: def.escCloses !== false,
      onClose: def.onClose,
      render: function (body, win) {
        win._appId = id;
        def.render(body, win, params || {});
      },
    });
  }

  NW.TUI = {
    header: header, subhead: subhead, box: box, infoGrid: infoGrid, gauge: gauge,
    footerKeys: footerKeys, menu: menu, table: table, form: form,
    dialog: dialog, alert: alert, confirm: confirm, promptText: promptText,
    screens: screens, el: el,
  };
  NW.apps = apps;
  NW.launch = launch;
})(window.NW);

  </script>
  <script>
/* ===== js/system/boot.js ===== */
/* ==========================================================================
   boot.js  —  BootManager. Renders a period-accurate power-on sequence:
   BIOS POST, memory count, DOS, SERVER.EXE, disk/LAN drivers, NLMs, volume
   mounts, NDS/Bindery, LOGIN/MONITOR/PSERVER/GroupWise/TCP-IP, server ready.
   ESC skips straight to the end.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el;
  var MEM = NW.data.server.installedMemory; // 65536

  var Boot = {
    run: function (container) {
      return new Promise(function (resolve) {
        container.innerHTML = '';
        container.classList.add('boot-active');
        var scr = el('div', { class: 'boot-screen' });
        container.appendChild(scr);

        var skipped = false, finished = false;
        var hint = el('div', { class: 'boot-skip', text: 'Press ESC to skip' });
        container.appendChild(hint);

        function line(text, cls) {
          var d = el('div', { class: 'boot-line ' + (cls || ''), text: text });
          scr.appendChild(d);
          scr.scrollTop = scr.scrollHeight;
          return d;
        }
        function ok(d) { var s = el('span', { class: 'boot-ok', text: '  OK' }); d.appendChild(s); }
        function wait(ms) { return NW.util.sleep(skipped ? 0 : ms); }

        function done() {
          if (finished) return;
          finished = true;
          document.removeEventListener('keydown', onKey);
          container.classList.remove('boot-active');
          resolve();
        }
        function onKey(e) {
          if (e.key === 'Escape' && !skipped) { skipped = true; hint.textContent = ''; }
          else if (Boot._ready) { done(); }
        }
        document.addEventListener('keydown', onKey);

        /* ---- the sequence ---- */
        (async function () {
          NW.Audio.bootBeep();

          line('OmniCore Modular BIOS  v4.51PG', 'dim');
          line('Copyright (C) 1984-1996 OmniCore Software, Inc.', 'dim');
          await wait(240);
          line('Main Processor  : Intel Pentium(R) 166 MHz');
          line('Coprocessor     : Installed');
          await wait(150);

          // memory count
          var memLine = line('Memory Test     :          0K');
          if (!skipped) {
            for (var kb = 0; kb <= MEM; kb += 2048) {
              memLine.textContent = 'Memory Test     : ' + NW.util.padStart(kb + 'K', 10);
              if (kb % 8192 === 0) NW.Audio.disk();
              await NW.util.sleep(9);
              if (skipped) break;
            }
          }
          memLine.textContent = 'Memory Test     : ' + NW.util.padStart(MEM + 'K', 10) + '  OK';
          await wait(200);

          line('');
          line('Adaptec AHA-2940 Ultra SCSI BIOS v1.23', 'dim');
          line('(C) 1996 Adaptec, Inc.  All Rights Reserved.', 'dim');
          line('  Scanning SCSI bus...');
          var d0 = line('    ID 0  IBM DCAS-34330       4340MB'); await wait(120); ok(d0);
          var d1 = line('    ID 1  IBM DCAS-34330       4340MB'); await wait(120); ok(d1);
          await wait(200);

          line('');
          line('Starting DOS...', 'dim');
          await wait(300);
          line('C:\\NWSERVER>SERVER', 'prompt');
          await wait(280);

          line('');
          line('Novell NetWare 4.11', 'banner');
          line('IntranetWare', 'banner');
          line('(C) Copyright 1983-1996 Novell, Inc.  All rights reserved.', 'dim');
          line('Patent pending.  Processor speed rating: 8590', 'dim');
          await wait(300);

          line('');
          line('Loading STARTUP.NCF ...');
          var s1 = line('  Loading module NWPA.NLM'); await wait(90); ok(s1);
          var s2 = line('  Loading module AHA2940.HAM'); await wait(90); ok(s2);
          var s3 = line('  Loading module SCSIHD.CDM'); await wait(90); ok(s3);
          await wait(160);

          var sysL = line('Activating and mounting volume "SYS" ...'); await wait(320); ok(sysL);
          line('Loading AUTOEXEC.NCF ...');

          // LAN drivers
          line('  Loading LAN driver NE2000.LAN');
          var l1 = line('    Frame ETHERNET_802.2  board NE2000_1_E82'); await wait(120); ok(l1);
          var l2 = line('    Frame ETHERNET_II     board NE2000_1_EII'); await wait(120); ok(l2);
          line('  Binding IPX to NE2000_1_E82 (net 0BADF00D) ...');
          await wait(150);

          // core NLMs
          var nlms = ['CLIB.NLM', 'STREAMS.NLM', 'TCPIP.NLM', 'IPXRTR.NLM', 'CONLOG.NLM',
            'REMOTE.NLM', 'RSPX.NLM', 'NLSLSP.NLM'];
          for (var i = 0; i < nlms.length; i++) { var nl = line('  Loading module ' + nlms[i]); await wait(70); ok(nl); if (skipped) break; }
          await wait(120);

          // NSS (optional)
          line('  Loading NSS storage modules ... (optional, not configured)', 'dim');
          await wait(120);

          // mount remaining volumes
          var vols = ['DATA', 'PUBLIC', 'MAIL', 'USERS', 'APPS'];
          for (var v = 0; v < vols.length; v++) {
            var vl = line('Activating and mounting volume "' + vols[v] + '" ...'); await wait(140); ok(vl); if (skipped) break;
          }
          await wait(140);

          // Bindery + NDS
          line('');
          line('Establishing Bindery services for OU=Servers.O=ACME ...');
          await wait(180);
          var ds = line('Loading module DS.NLM  (NetWare Directory Services)'); await wait(220); ok(ds);
          line('  Opening local Directory Services database ...');
          var syn = line('  Synchronizing replica of partition [Root] ...'); await wait(260); ok(syn);
          line('  All processed = Yes.', 'boot-ok2');
          await wait(160);

          // services
          line('');
          var svc = [
            ['Loading module TIMESYNC.NLM  (Time Synchronization)', 160],
            ['Loading LOGIN service ...', 120],
            ['Loading module MONITOR.NLM  (Server Monitor)', 120],
            ['Loading module PSERVER.NLM  (Print Server ACME_PS1)', 150],
            ['Loading GroupWise agents  GWMTA / GWPOA ...', 200],
            ['Loading module HTTPSTK.NLM  (Web Server) ...', 150],
            ['Initializing TCP/IP stack  192.168.10.1 ...', 180],
          ];
          for (var k = 0; k < svc.length; k++) { var e2 = line(svc[k][0]); await wait(svc[k][1]); ok(e2); if (skipped) break; }

          await wait(220);
          line('');
          line('*** NetWare 4.11 server ACME_FS1 is operational. ***', 'banner');
          line('Total server memory: ' + NW.util.commas(MEM) + 'K   Connections licensed: 250', 'dim');
          NW.data.server.markBoot();
          NW.Audio.fanfare();

          Boot._ready = true;
          var press = line('', 'boot-press');
          var on = true;
          var blink = setInterval(function () { press.textContent = (on = !on) ? 'Press any key to log in to the network...' : ''; }, 500);

          // auto-advance after a moment even without keypress
          await NW.util.sleep(skipped ? 600 : 1600);
          clearInterval(blink);
          done();
        })();
      });
    },
  };

  NW.Boot = Boot;
})(window.NW);

  </script>
  <script>
/* ===== js/system/login.js ===== */
/* ==========================================================================
   login.js  —  LOGIN utility. Classic blue NetWare login screen with Name,
   Password, Tree and Context fields. Fake authentication against the NDS
   User objects. Resolves with the authenticated user node.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el;

  function novellMark() {
    // a generic red "N" tile homage — not the trademarked logo artwork
    return el('div', { class: 'login-logo' }, [
      el('div', { class: 'login-logo-tile', text: 'N' }),
      el('div', { class: 'login-logo-word' }, [
        el('div', { class: 'login-logo-1', text: 'Novell' }),
        el('div', { class: 'login-logo-2', text: 'IntranetWare' }),
      ]),
    ]);
  }

  var Login = {
    show: function (container) {
      return new Promise(function (resolve) {
        container.innerHTML = '';
        container.className = 'login-root';

        var errBox = el('div', { class: 'login-error', style: { display: 'none' } });

        var f = NW.TUI.form([
          { name: 'name', label: 'Name       ', value: '' },
          { name: 'pass', label: 'Password   ', type: 'password', value: '' },
          { name: 'tree', label: 'Tree       ', value: NW.data.server.tree },
          { name: 'ctx', label: 'Context    ', value: 'OU=Users.O=ACME' },
        ], { onSubmit: submit });

        var okBtn = el('button', { class: 'nw-btn', type: 'button', text: '  OK  ' });
        var cancelBtn = el('button', { class: 'nw-btn', type: 'button', text: ' Cancel ' });
        var btnrow = el('div', { class: 'nw-btnrow login-btnrow' }, [okBtn, cancelBtn]);

        var panel = el('div', { class: 'login-panel' }, [
          novellMark(),
          el('div', { class: 'login-title', text: 'Enter your login name and password.' }),
          f.el,
          errBox,
          btnrow,
          el('div', { class: 'login-hint', html:
            'Demo accounts &nbsp;&mdash;&nbsp; ' + NW.util.escapeHtml(NW.data.login.demoHint) }),
        ]);

        var wrap = el('div', { class: 'login-center' }, [
          el('div', { class: 'login-bar', text: 'NetWare 4.11 Login for ' + NW.data.server.serverName }),
          panel,
        ]);
        container.appendChild(wrap);

        function fail(msg) {
          errBox.style.display = 'block';
          errBox.textContent = 'LOGIN-4.11-430:  ' + msg;
          NW.Audio.error();
          f.refs.pass.value = '';
          f.refs.pass.focus();
        }

        function submit() {
          var name = f.value('name').trim();
          if (!name) { fail('You must supply a login name.'); return; }
          var res = NW.data.login.authenticate(name, f.value('pass'), f.value('ctx'), f.value('tree'));
          if (!res.ok) { fail(res.msg); return; }
          NW.Audio.fanfare();
          NW.State.set('lastLogin', { user: res.user.name, context: f.value('ctx'), tree: f.value('tree'), when: new Date().toISOString() });
          NW.data.connections.addSelf(res.user, f.value('tree'));
          container.className = '';
          container.innerHTML = '';
          resolve(res.user);
        }

        okBtn.addEventListener('click', submit);
        cancelBtn.addEventListener('click', function () {
          f.refs.name.value = ''; f.refs.pass.value = '';
          errBox.style.display = 'block';
          errBox.textContent = 'You must log in to access network resources.';
          f.refs.name.focus();
        });
        // Enter anywhere submits
        panel.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });

        setTimeout(function () { f.refs.name.focus(); }, 30);
      });
    },
  };

  NW.Login = Login;
})(window.NW);

  <script>
/* ===== js/system/console.js ===== */
/* ==========================================================================
   console.js  —  ConsoleEmulator. The green-on-black SERVER.EXE console:
   scrolling output plus a "ACME_FS1:" command prompt with input history and
   a blinking block cursor. Delegates command execution to CommandParser.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el;

  var outEl, renderEl, realInput, promptEl, rootEl, scrollEl;
  var history = [];
  var histIdx = 0;

  function promptStr() { return NW.data.server.serverName + ':'; }

  function renderInput() {
    var val = realInput.value;
    var pos = realInput.selectionStart != null ? realInput.selectionStart : val.length;
    renderEl.innerHTML = '';
    renderEl.appendChild(document.createTextNode(val.slice(0, pos)));
    renderEl.appendChild(el('span', { class: 'con-cursor', text: val.charAt(pos) || ' ' }));
    renderEl.appendChild(document.createTextNode(val.slice(pos + 1)));
  }

  var Console = {
    init: function (mount) {
      rootEl = el('div', { class: 'nw-console' });
      outEl = el('div', { class: 'con-output' });
      scrollEl = outEl;
      promptEl = el('span', { class: 'con-prompt', text: promptStr() + ' ' });
      renderEl = el('span', { class: 'con-render' });
      realInput = el('input', { class: 'con-real', type: 'text', spellcheck: 'false',
        autocomplete: 'off', autocapitalize: 'off' });
      var lineEl = el('div', { class: 'con-inputline' }, [promptEl, renderEl, realInput]);

      rootEl.appendChild(outEl);
      rootEl.appendChild(lineEl);
      mount.appendChild(rootEl);

      // clicking anywhere in the console focuses the input (unless a window is above)
      rootEl.addEventListener('mousedown', function (e) {
        if (e.target === realInput) return;
        setTimeout(function () { realInput.focus(); }, 0);
      });

      ['input', 'keyup', 'click', 'select'].forEach(function (ev) {
        realInput.addEventListener(ev, renderInput);
      });
      realInput.addEventListener('keydown', onKey);
      realInput.addEventListener('keypress', function () { NW.Audio.key(); });

      renderInput();
      Console.banner();
      return Console;
    },

    banner: function () {
      Console.print('NetWare 4.11  IntranetWare', 'con-hi');
      Console.print('Server ' + NW.data.server.serverName + ' - connection to tree ' + NW.data.server.tree, 'con-dim');
      Console.print('');
      Console.print('Type  HELP  for a list of console commands.  ALT+letter opens a menu.', 'con-dim');
      Console.print('');
    },

    print: function (text, cls) {
      if (text == null) text = '';
      String(text).split('\n').forEach(function (ln) {
        outEl.appendChild(el('div', { class: 'con-line ' + (cls || ''), text: ln }));
      });
      scrollEl.scrollTop = scrollEl.scrollHeight;
    },
    printHtml: function (html, cls) {
      outEl.appendChild(el('div', { class: 'con-line ' + (cls || ''), html: html }));
      scrollEl.scrollTop = scrollEl.scrollHeight;
    },
    echo: function (cmd) { Console.print(promptStr() + ' ' + cmd, 'con-echo'); },
    clear: function () { outEl.innerHTML = ''; },
    focus: function () { if (realInput) realInput.focus(); },
    refreshPrompt: function () { promptEl.textContent = promptStr() + ' '; },

    run: function (line) {
      Console.echo(line);
      if (line.trim()) { history.push(line); histIdx = history.length; NW.State.pushRecent(line); }
      NW.Commands.exec(line, Console);
    },
  };

  function onKey(e) {
    if (e.key === 'Enter') {
      var line = realInput.value;
      realInput.value = '';
      renderInput();
      Console.run(line);
      e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      if (histIdx > 0) { histIdx--; realInput.value = history[histIdx] || ''; setTimeout(renderInput, 0); }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (histIdx < history.length) { histIdx++; realInput.value = history[histIdx] || ''; setTimeout(renderInput, 0); }
      e.preventDefault();
    } else if (e.key === 'Tab') {
      // crude command completion
      var v = realInput.value.toUpperCase();
      var match = NW.Commands.complete(v);
      if (match) { realInput.value = match; setTimeout(renderInput, 0); }
      e.preventDefault();
    }
  }

  NW.Console = Console;
})(window.NW);
