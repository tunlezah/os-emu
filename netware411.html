  <script>
/* ===== js/system/commands.js ===== */
/* ==========================================================================
   commands.js  —  CommandParser. Implements the server console command set
   with period-accurate output. Commands that map to a utility open the
   corresponding window (LOAD MONITOR, LOAD INSTALL, ...).
   ========================================================================== */
(function (NW) {
  'use strict';

  var U = NW.util;
  var mounted = {}; NW.data.volumes.names().forEach(function (v) { mounted[v] = true; });
  var loginEnabled = true;
  var secure = false;

  function pad(s, n) { return U.padEnd(s, n); }
  function rpad(s, n) { return U.padStart(s, n); }
  function who() { return (NW.session && NW.session.user) || NW.data.nds.findUser('ADMIN'); }

  var cmds = {};
  function def(name, help, fn) { cmds[name] = { name: name, help: help, fn: fn }; }

  /* -------------------------------------------------------- MODULES ----- */
  def('MODULES', 'List loaded NetWare Loadable Modules', function (a, c) {
    var list = NW.data.modules.all();
    list.forEach(function (m) {
      c.printHtml('<span class="con-mod">' + U.escapeHtml(pad(m.name, 15)) + '</span>' +
        U.escapeHtml(m.desc), 'con-line');
      c.print('   Version ' + m.version + '   Code and data size: ' +
        U.commas((m.dataKB + m.allocKB) * 1024) + ' bytes', 'con-dim');
    });
    c.print(list.length + ' modules loaded.', 'con-hi');
  });

  /* -------------------------------------------------------- LOAD -------- */
  var appForModule = {
    MONITOR: 'monitor', INSTALL: 'install', NWCONFIG: 'nwconfig', SERVMAN: 'servman',
    DSREPAIR: 'dsrepair', VREPAIR: 'vrepair', REMOTE: 'rconsole',
  };
  def('LOAD', 'Load an NLM into server memory', function (a, c) {
    if (!a) { c.print('Load what module? Syntax: LOAD [path]module [parameters]', 'con-err'); return; }
    var name = a.split(/\s+/)[0].toUpperCase();
    var base = name.replace(/\.(NLM|LAN|HAM|CDM|NAM|DSK)$/i, '');
    c.print('Loading module ' + (name.indexOf('.') < 0 ? name : name) + ' ...', 'con-dim');
    var m = NW.data.modules.load(name);
    NW.Audio.disk();
    setTimeout(function () {
      c.print('  ' + pad(m.name, 14) + m.desc, 'con-ok');
      c.print('  Version ' + m.version + '   ' + m.vendor, 'con-dim');
      if (appForModule[base]) NW.launch(appForModule[base]);
    }, 250);
  });

  /* -------------------------------------------------------- UNLOAD ------ */
  def('UNLOAD', 'Unload an NLM from server memory', function (a, c) {
    if (!a) { c.print('Unload what module?', 'con-err'); return; }
    var r = NW.data.modules.unload(a.split(/\s+/)[0]);
    if (!r.ok && r.reason === 'notfound') c.print("Module " + a + " is not loaded.", 'con-err');
    else if (!r.ok && r.reason === 'resident') c.print('Module ' + r.mod.name + ' is required by the operating system and cannot be unloaded.', 'con-err');
    else c.print(r.mod.name + ' has been unloaded.  Resources returned to the system.', 'con-ok');
  });

  /* -------------------------------------------------------- VERSION ----- */
  def('VERSION', 'Display the server version', function (a, c) {
    var s = NW.data.server;
    c.print('Novell NetWare 4.11[DS]', 'con-hi');
    c.print('NetWare 4.11   ' + s.kernel);
    c.print('(C) Copyright 1983-1996 Novell, Inc.  All rights reserved.', 'con-dim');
    c.print('Novell Directory Services   Version 5.99');
    c.print('Server Serial Number: ' + s.serial + '   Application number: ' + s.appNumber, 'con-dim');
  });

  /* -------------------------------------------------------- VOLUMES ----- */
  def('VOLUMES', 'List mounted volumes', function (a, c) {
    c.print('Mounted Volumes            Name Spaces               Flags', 'con-hi');
    var n = 0;
    NW.data.volumes.names().forEach(function (v) {
      if (!mounted[v]) return; n++;
      var def = NW.data.volumes.get(v);
      c.print(' ' + pad(v, 26) + pad(def.ns, 26) + 'Cp Sa');
    });
    c.print(n + ' volume' + (n === 1 ? '' : 's') + ' mounted.', 'con-dim');
  });

  def('MOUNT', 'Mount a volume', function (a, c) {
    var v = (a || '').toUpperCase().replace(/:$/, '');
    if (v === 'ALL') { NW.data.volumes.names().forEach(function (x) { mounted[x] = true; }); c.print('All volumes mounted.', 'con-ok'); return; }
    if (!NW.data.volumes.get(v)) { c.print('Volume ' + a + ' does not exist.', 'con-err'); return; }
    mounted[v] = true;
    c.print('Volume ' + v + ' mounted successfully.', 'con-ok');
    NW.bus.emit('volumes:changed');
  });
  def('DISMOUNT', 'Dismount a volume', function (a, c) {
    var v = (a || '').toUpperCase().replace(/:$/, '');
    if (v === 'SYS') { c.print('Volume SYS cannot be dismounted while the server is running.', 'con-err'); return; }
    if (!NW.data.volumes.get(v)) { c.print('Volume ' + a + ' does not exist.', 'con-err'); return; }
    mounted[v] = false;
    c.print('Volume ' + v + ' dismounted.', 'con-ok');
    NW.bus.emit('volumes:changed');
  });

  /* -------------------------------------------------------- CONFIG ------ */
  def('CONFIG', 'Display server configuration', function (a, c) {
    var s = NW.data.server;
    c.print('File server name: ' + s.serverName);
    c.print('IPX internal network number: ' + s.ipx.internalNet);
    c.print('Node address: ' + s.lan[0].node + '     Server Up Time: ' + s.uptimeStr().replace(/\s+/g, ' '), 'con-dim');
    c.print('Bindery context(s): ' + s.context);
    c.print('');
    s.lan.forEach(function (b) {
      c.print(b.driver);
      c.print('    Version 3.68   April 3, 1996', 'con-dim');
      c.print('    Hardware setting: I/O ports ' + b.port + 'h, Interrupt ' + b.irq + 'h');
      c.print('    Node address: ' + b.node);
      c.print('    Frame type: ' + b.frame);
      c.print('    Board name: ' + b.name);
      c.print('    LAN protocol: ' + (b.frame.indexOf('802.2') >= 0 ? 'IPX network ' + s.ipx.externalNet : 'ARP  IP address ' + s.ip.addr));
      c.print('');
    });
    c.print('TCP/IP:  Address ' + s.ip.addr + '  Mask ' + s.ip.mask + '  Gateway ' + s.ip.gw, 'con-dim');
  });

  /* -------------------------------------------------------- MONITOR ----- */
  def('MONITOR', 'Load the server monitor', function (a, c) { NW.data.modules.load('MONITOR.NLM'); NW.launch('monitor'); });

  /* -------------------------------------------------------- TIME -------- */
  def('TIME', 'Display date, time and synchronization', function (a, c) {
    var d = new Date();
    var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    c.print(NW.data.server.serverName + '  System Time:  ' + days[d.getDay()] + ', ' + U.longDate(d) + '  ' + U.clock(d), 'con-hi');
    c.print('Time zone string: "MST7MDT"');
    c.print('DST status: ON');
    c.print('Time synchronization is active.');
    c.print('Time is synchronized to the network.');
    c.print('This server is a Single Reference time source.', 'con-dim');
  });

  /* -------------------------------------------------------- MEMORY ------ */
  def('MEMORY', 'Display total server memory', function (a, c) {
    var s = NW.data.server, m = NW.Monitor.values;
    c.print('Total server memory:  ' + U.commas(s.installedMemory) + ' KB', 'con-hi');
    c.print('  Cache buffers:            ' + U.commas(m.totalCacheBuffers) + ' KB  (' + Math.round(m.totalCacheBuffers / s.installedMemory * 100) + '%)');
    c.print('  Alloc memory pool:       ' + U.commas(Math.round(s.installedMemory * 0.12)) + ' KB');
    c.print('  Cache movable memory:    ' + U.commas(Math.round(s.installedMemory * 0.09)) + ' KB');
    c.print('  Cache non-movable:       ' + U.commas(Math.round(s.installedMemory * 0.07)) + ' KB');
    c.print('  Code and data:           ' + U.commas(Math.round(s.installedMemory * 0.10)) + ' KB');
  });

  /* -------------------------------------------------------- WHOAMI ------ */
  def('WHOAMI', 'Display current connection information', function (a, c) {
    var u = who();
    c.print('You are user ' + u.name + ' attached to server ' + NW.data.server.serverName + ', connection 1.', 'con-hi');
    c.print('Server ' + NW.data.server.serverName + ' is running NetWare 4.11.');
    c.print('Login time:  ' + U.longDate(new Date()) + '  ' + U.clock(new Date()));
    c.print('You are attached to tree ' + NW.data.server.tree + '.');
    c.print('Your current context is ' + NW.data.nds.contextOf(u) + '.');
  });

  /* -------------------------------------------------------- SEND -------- */
  function broadcast(a, c) {
    var m = a.match(/"([^"]*)"/);
    var msg = m ? m[1] : a.replace(/\s+TO\s+.*/i, '').trim();
    var toM = a.match(/TO\s+(.+)$/i);
    var to = toM ? toM[1].trim() : 'ALL';
    if (!msg) { c.print('Syntax: SEND "message" [TO name|connection|ALL]', 'con-err'); return; }
    c.print('Message sent to ' + to + '.', 'con-ok');
    NW.bus.emit('broadcast', { from: NW.data.server.serverName, msg: msg, to: to });
  }
  def('SEND', 'Send a message to connections', broadcast);
  def('BROADCAST', 'Broadcast a message to all connections', broadcast);

  /* -------------------------------------------------------- misc -------- */
  def('CLS', 'Clear the console screen', function (a, c) { c.clear(); });
  def('CLEAR', 'Clear the console screen', function (a, c) { c.clear(); });
  def('OFF', 'Clear the console screen', function (a, c) { c.clear(); });

  def('HELP', 'List console commands', function (a, c) {
    if (a) { NW.launch('help', { query: a }); return; }
    c.print('Console commands:', 'con-hi');
    var names = Object.keys(cmds).sort();
    var line = '';
    names.forEach(function (n) {
      line += pad(n, 18);
      if (line.length >= 72) { c.print('  ' + line); line = ''; }
    });
    if (line) c.print('  ' + line);
    c.print('', '');
    c.print('Type HELP <command> to open the help browser on a topic.', 'con-dim');
  });

  def('DISPLAY', 'DISPLAY SERVERS | NETWORKS', function (a, c) {
    a = (a || '').toUpperCase();
    if (a.indexOf('SERVER') === 0) {
      c.print('Known NetWare servers (SAP):', 'con-hi');
      ['ACME_FS1', 'ACME_FS2', 'ACME_PS1', 'GW_MTA_ACME'].forEach(function (s, i) {
        c.print('  ' + pad(s, 20) + rpad(i, 2) + ' hops');
      });
      c.print('4 known servers.', 'con-dim');
    } else if (a.indexOf('NETWORK') === 0) {
      c.print('Known IPX networks (RIP):', 'con-hi');
      c.print('  0BADF00D    1/2   NE2000_1_E82');
      c.print('  0000C0DE    0/1   internal');
      c.print('2 known networks.', 'con-dim');
    } else c.print('Syntax: DISPLAY SERVERS | DISPLAY NETWORKS', 'con-err');
  });

  def('NLIST', 'List NDS objects', function (a, c) {
    var users = NW.data.nds.allUsers();
    c.print('Object Class: User', 'con-hi');
    c.print('  ' + pad('Login name', 14) + 'Full name', 'con-dim');
    users.forEach(function (u) { c.print('  ' + pad(u.name, 14) + u.props.fullName); });
    c.print(users.length + ' User objects found.', 'con-dim');
  });

  def('CX', 'Change / show current context', function (a, c) {
    if (!a) { c.print(NW.data.nds.contextOf(who())); return; }
    c.print('Context changed to: ' + a.toUpperCase().replace(/^\./, ''), 'con-ok');
  });

  def('SET', 'View or set a server parameter', function (a, c) {
    if (!a) { NW.launch('servman'); return; }
    var m = a.match(/(.+?)\s*=\s*(.+)/);
    if (m) c.print('SET ' + m[1].trim() + ' = ' + m[2].trim(), 'con-ok');
    else c.print('SET ' + a + ' :  (use SERVMAN to browse parameter categories)', 'con-dim');
  });

  def('SECURE', 'SECURE CONSOLE - restrict console access', function (a, c) {
    if ((a || '').toUpperCase().indexOf('CONSOLE') === 0) {
      secure = true;
      c.print('The console is now secured. NLMs can only load from SYS:SYSTEM.', 'con-ok');
      c.print('The keyboard is locked to the debugger and DOS access is removed.', 'con-dim');
    } else c.print('Syntax: SECURE CONSOLE', 'con-err');
  });

  def('DISABLE', 'DISABLE LOGIN', function (a, c) {
    if ((a || '').toUpperCase().indexOf('LOGIN') === 0) { loginEnabled = false; c.print('Login has been disabled. New users cannot log in.', 'con-ok'); }
    else c.print('Syntax: DISABLE LOGIN', 'con-err');
  });
  def('ENABLE', 'ENABLE LOGIN', function (a, c) {
    if ((a || '').toUpperCase().indexOf('LOGIN') === 0) { loginEnabled = true; c.print('Login has been enabled.', 'con-ok'); }
    else c.print('Syntax: ENABLE LOGIN', 'con-err');
  });

  def('CLEAR', 'CLEAR STATION n', function (a, c) {
    if ((a || '').toUpperCase().indexOf('STATION') === 0) {
      var n = parseInt(a.replace(/\D+/g, ''), 10);
      if (NW.data.connections.disconnect(n)) c.print('Station ' + n + ' cleared.', 'con-ok');
      else c.print('Station ' + (n || '?') + ' is not in use.', 'con-err');
    } else c.clear();
  });

  def('LIST', 'LIST DEVICES', function (a, c) {
    c.print('Device list:', 'con-hi');
    NW.data.server.disk.drives.forEach(function (d, i) {
      c.print('  0x000' + i + '  [V503-A' + i + '-D' + i + ':0]  ' + d.model + '  ' + d.size + 'MB');
    });
  });
  def('SCAN', 'SCAN FOR NEW DEVICES', function (a, c) { c.print('Scanning for new storage devices... none found.', 'con-dim'); });

  def('TRACK', 'TRACK ON/OFF - router tracking', function (a, c) {
    c.print('Router Tracking Screen ' + ((a || '').toUpperCase().indexOf('OFF') >= 0 ? 'disabled.' : 'enabled.'), 'con-ok');
  });

  def('DOWN', 'Shut the server down', function (a, c) {
    NW.TUI.confirm('Down the file server ACME_FS1?\n\nAll connections will be cleared and volumes dismounted.',
      function () {
        c.print('Downing file server...', 'con-err');
        c.print('  Notifying ' + NW.data.connections.count() + ' active connections...', 'con-dim');
        c.print('  Dismounting volumes... flushing cache to disk...', 'con-dim');
        NW.Audio.down();
        setTimeout(function () { NW.bus.emit('server:down'); }, 700);
      });
  });
  def('RESTART', 'RESTART SERVER', function (a, c) {
    NW.TUI.confirm('Restart file server ACME_FS1?', function () {
      c.print('Restarting server...', 'con-err');
      NW.Audio.down();
      setTimeout(function () { NW.bus.emit('server:restart'); }, 500);
    });
  });

  def('ABOUT', 'About this simulation', function (a, c) { NW.launch('about'); });

  /* ---- multi-word command index (longest match wins) ------------------ */
  var multi = ['RESTART SERVER', 'DISPLAY SERVERS', 'DISPLAY NETWORKS', 'SECURE CONSOLE',
    'CLEAR STATION', 'DISABLE LOGIN', 'ENABLE LOGIN', 'SCAN FOR NEW DEVICES',
    'LIST DEVICES', 'TRACK ON', 'TRACK OFF'];

  var Commands = {
    exec: function (line, con) {
      var trimmed = (line || '').trim();
      if (!trimmed) return;
      var up = trimmed.toUpperCase();

      // longest multi-word match first
      var matched = null, rest = '';
      multi.sort(function (a, b) { return b.length - a.length; }).some(function (mw) {
        if (up === mw || up.indexOf(mw + ' ') === 0) {
          matched = mw.split(' ')[0]; rest = trimmed.slice(mw.split(' ')[0].length).trim(); return true;
        }
        return false;
      });

      var token, args;
      if (matched) { token = matched; args = trimmed.slice(token.length).trim(); }
      else {
        var sp = trimmed.indexOf(' ');
        token = (sp < 0 ? trimmed : trimmed.slice(0, sp)).toUpperCase();
        args = sp < 0 ? '' : trimmed.slice(sp + 1).trim();
      }

      var cmd = cmds[token];
      if (cmd) { try { cmd.fn(args, con); } catch (e) { con.print('Command error: ' + e.message, 'con-err'); } }
      else con.print('Unknown command "' + token + '".  Type HELP for a list of commands.', 'con-err');
    },
    complete: function (partial) {
      partial = (partial || '').trim().toUpperCase();
      if (!partial) return null;
      var hit = Object.keys(cmds).sort().find(function (n) { return n.indexOf(partial) === 0; });
      return hit || null;
    },
    names: function () { return Object.keys(cmds).sort(); },
    isMounted: function (v) { return !!mounted[String(v).toUpperCase().replace(/:$/, '')]; },
    loginEnabled: function () { return loginEnabled; },
    isSecure: function () { return secure; },
  };

  NW.Commands = Commands;
})(window.NW);

  <script>
/* ===== js/system/menubar.js ===== */
/* ==========================================================================
   menubar.js  —  The white top menu bar (File, Server, Volumes, Connections,
   Print, Directory, Utilities, Help) with Alt+letter accelerators, arrow-key
   navigation, and global function-key shortcuts.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el;
  var barEl, openIdx = -1, dropdown = null, clockTimer = null;

  function launch(id) { return function () { NW.launch(id); }; }
  function runCmd(line) { return function () { NW.Console.run(line); NW.Console.focus(); }; }
  var SEP = { sep: true };

  var menus = [
    { title: 'File', accel: 'F', items: function () { return [
      { label: 'About IntranetWare...', action: launch('about') },
      { label: 'Server Console', hint: '', action: function () { NW.Console.focus(); } },
      { label: 'Settings...', action: launch('settings') },
      SEP,
      { label: 'Log Out', action: function () { NW.bus.emit('session:logout'); } },
      { label: 'Down Server', action: runCmd('DOWN') },
      { label: 'Restart Server', action: runCmd('RESTART SERVER') },

    { title: 'Server', accel: 'S', items: function () { return [
      { label: 'MONITOR', hint: 'MONITOR.NLM', action: launch('monitor') },

      { label: 'Configuration', hint: 'NWCONFIG', action: launch('nwconfig') },
      { label: 'Time Synchronization', action: launch('timesync') },
      { label: 'Server Statistics', action: launch('stats') },
      SEP,
      { label: 'Error Log (SYS$LOG)', action: launch('logs') },
      { label: 'System Messages', action: launch('sysmsg') },
      { label: 'Remote Console', hint: 'RCONSOLE', action: launch('rconsole') },

    { title: 'Volumes', accel: 'V', items: function () { return [
      { label: 'Volume Explorer', hint: 'FILER', action: launch('filer') },

      { label: 'Disk Manager', action: launch('diskmgr') },
      SEP,
      { label: 'Repair Volume', hint: 'VREPAIR', action: launch('vrepair') },
      { label: 'List Volumes', action: runCmd('VOLUMES') },
    ]; } },
    { title: 'Connections', accel: 'C', items: function () { return [
      { label: 'Connection Manager', action: launch('connections') },
      { label: 'Send Message...', action: function () {
        NW.TUI.promptText({ title: 'Send Message', label: 'Message', message: 'Broadcast to all connections:',
          onOk: function (v) { if (v) NW.Console.run('SEND "' + v + '" TO ALL'); } });
      } },
      { label: 'Who Am I', action: runCmd('WHOAMI') },
      SEP,
      { label: 'Network Map', action: launch('netmap') },
    ]; } },
    { title: 'Print', accel: 'P', items: function () { return [
      { label: 'Print Services', hint: 'PCONSOLE', action: launch('pconsole') },
      { label: 'Print Job Configuration', hint: 'PRINTCON', action: launch('printcon') },
      { label: 'Print Server (PSERVER)', action: launch('pconsole') },
    ]; } },
    { title: 'Directory', accel: 'D', items: function () { return [
      { label: 'NetWare Administrator', hint: 'NETADMIN', action: launch('netadmin') },
      { label: 'SYSCON', action: launch('syscon') },
      { label: 'NDS Manager', action: launch('ndsmgr') },
      { label: 'Repair Directory', hint: 'DSREPAIR', action: launch('dsrepair') },
      SEP,
      { label: 'Audit Manager', action: launch('audit') },
    ]; } },
    { title: 'Utilities', accel: 'U', items: function () {
      // every registered application, sorted, so nothing is unreachable
      return NW.apps.all().sort(function (a, b) { return a.title < b.title ? -1 : 1; }).map(function (app) {
        return { label: app.title, hint: app.name || '', action: launch(app.id) };
      });
    } },
    { title: 'Help', accel: 'H', items: function () { return [
      { label: 'Help Topics', hint: 'F1', action: launch('help') },
      { label: 'Console Commands', action: function () { NW.launch('help', { category: 'NetWare Commands' }); } },
      { label: 'Keyboard Shortcuts', action: showKeys },
      SEP,
      { label: 'About IntranetWare...', action: launch('about') },
    ]; } },
  ];

  function showKeys() {
    var html = [
      '<b>Alt + letter</b>&nbsp;&nbsp;Open a menu (File, Server, ...)',
      '<b>Enter</b>&nbsp;&nbsp;Select&nbsp;&nbsp;&nbsp;<b>Esc</b>&nbsp;&nbsp;Close / back',
      '<b>Arrows</b>&nbsp;&nbsp;Navigate lists and menus',
      '<b>Insert</b>&nbsp;&nbsp;Create&nbsp;&nbsp;&nbsp;<b>Delete</b>&nbsp;&nbsp;Remove&nbsp;&nbsp;&nbsp;<b>F3</b>&nbsp;&nbsp;Modify / Refresh',
      '<b>Alt + F10</b>&nbsp;&nbsp;Exit the active utility',
      '<b>Ctrl + Esc</b>&nbsp;&nbsp;Open window list',
      '<b>F1</b>&nbsp;&nbsp;Help&nbsp;&nbsp;&nbsp;<b>Tab</b>&nbsp;&nbsp;Complete console command',
      '<b>Up / Down</b>&nbsp;&nbsp;Recall previous console commands',
    ].join('<br>');
    NW.TUI.dialog({ title: 'Keyboard Shortcuts', w: 440, messageHtml: html });
  }

  function closeMenu() {
    if (dropdown && dropdown.parentNode) dropdown.parentNode.removeChild(dropdown);
    dropdown = null;
    if (openIdx >= 0 && barEl.children[openIdx]) barEl.children[openIdx].classList.remove('open');
    openIdx = -1;
  }

  function openMenu(i) {
    if (i === openIdx) { closeMenu(); return; }
    closeMenu();
    openIdx = i;
    var titleEl = barEl.children[i];
    titleEl.classList.add('open');
    var items = menus[i].items();
    var m = NW.TUI.menu(items.map(function (it) {
      return it.sep ? { separator: true } : { label: it.label, hint: it.hint, action: function () { closeMenu(); NW.Audio.click(); it.action(); } };
    }), {});
    dropdown = el('div', { class: 'menu-dropdown' }, [m.el]);
    titleEl.parentNode.appendChild(dropdown);
    // keep the dropdown fully on-screen: right-most menus align to the right edge
    var maxLeft = barEl.clientWidth - dropdown.offsetWidth;
    dropdown.style.left = Math.max(0, Math.min(titleEl.offsetLeft, maxLeft)) + 'px';
    setTimeout(function () { m.focus(); }, 0);

    m.el.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { openMenu((i - 1 + menus.length) % menus.length); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { openMenu((i + 1) % menus.length); e.preventDefault(); }
      else if (e.key === 'Escape') { closeMenu(); NW.Console.focus(); e.preventDefault(); e.stopPropagation(); }
    });
  }

  function showWindowList() {
    var list = NW.WM.windows;
    if (!list.length) { NW.TUI.alert('No utility windows are open.', 'Window List'); return; }
    NW.TUI.dialog({
      title: 'Open Windows  (Ctrl+Esc)', w: 380,
      extra: (function () {
        var items = list.map(function (w) {
          return { label: w.titlebar.textContent.trim(), action: function () { w.focus(); } };
        });
        var m = NW.TUI.menu(items, {});
        setTimeout(function () { m.focus(); }, 10);
        return m.el;
      })(),
      buttons: [{ label: ' Close ', value: true, def: true }],
    });
  }

  var MenuBar = {
    init: function (mount) {
      barEl = el('div', { class: 'nw-menubar' });
      menus.forEach(function (mn, i) {
        var idx = mn.title.toUpperCase().indexOf(mn.accel);
        var pre = mn.title.slice(0, idx), acc = mn.title.charAt(idx), post = mn.title.slice(idx + 1);
        var t = el('span', { class: 'menu-title' }, [
          document.createTextNode(pre),
          el('u', { text: acc }),
          document.createTextNode(post),
        ]);
        t.addEventListener('click', function (e) { e.stopPropagation(); NW.Audio.click(); openMenu(i); });
        barEl.appendChild(t);
      });
      // right-aligned clock chip in the menubar
      var clock = el('span', { class: 'menu-clock' });
      barEl.appendChild(clock);
      if (clockTimer) clearInterval(clockTimer);
      clockTimer = setInterval(function () { clock.textContent = NW.util.clock(); }, 1000);
      clock.textContent = NW.util.clock();

      mount.appendChild(barEl);
      if (!MenuBar._bound) {
        document.addEventListener('click', function () { if (openIdx >= 0) closeMenu(); });
        document.addEventListener('keydown', MenuBar.onGlobalKey, true);
        MenuBar._bound = true;
      }
    },

    onGlobalKey: function (e) {
      // Alt+letter opens a menu
      if (e.altKey && !e.ctrlKey && e.key && e.key.length === 1) {
        var ch = e.key.toUpperCase();
        var mi = menus.findIndex(function (m) { return m.accel === ch; });
        if (mi >= 0) { e.preventDefault(); openMenu(mi); return; }
      }
      if (e.altKey && e.key === 'F10') { e.preventDefault(); if (!NW.WM.closeActive()) NW.launch('about'); return; }
      if (e.ctrlKey && e.key === 'Escape') { e.preventDefault(); showWindowList(); return; }
      if (e.key === 'F1' && !e.altKey) { e.preventDefault(); NW.launch('help'); return; }
      if (e.key === 'F3') {
        var w = NW.WM.active;
        if (w && w._refresh) { e.preventDefault(); w._refresh(); }
        return;
      }
    },
    open: openMenu,
    windowList: showWindowList,
  };

  NW.MenuBar = MenuBar;
})(window.NW);

  </script>
  <script>
/* ===== js/system/statusbar.js ===== */
/* ==========================================================================
   statusbar.js  —  The bottom status line: server name, utilization, cache,
   connection count, loaded NLM count, uptime and the live clock. Refreshes
   from the monitoring engine each tick.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el;
  var timer = null, busOff = null;

  function seg(label, id) {
    return el('span', { class: 'sb-seg' }, [
      el('span', { class: 'sb-label', text: label }),
      el('span', { class: 'sb-val', id: id }),
    ]);
  }

  var StatusBar = {
    init: function (mount) {
      var s = NW.data.server;
      var bar = el('div', { class: 'nw-statusbar' }, [
        el('span', { class: 'sb-server', text: s.serverName }),
        seg('Util ', 'sb-util'),
        seg('Cache ', 'sb-cache'),
        seg('Conn ', 'sb-conn'),
        seg('NLM ', 'sb-nlm'),
        seg('Up ', 'sb-up'),
        el('span', { class: 'sb-clock', id: 'sb-clock' }),
      ]);
      mount.appendChild(bar);

      function upShort() {
        var ms = Date.now() - s.bootTime.getTime();
        var d = Math.floor(ms / 86400000); ms -= d * 86400000;
        var h = Math.floor(ms / 3600000); ms -= h * 3600000;
        var m = Math.floor(ms / 60000);
        return d + 'd ' + NW.util.padStart(h, 2, '0') + ':' + NW.util.padStart(m, 2, '0');
      }
      function set(id, v, cls) { var e = document.getElementById(id); if (e) { e.textContent = v; if (cls) e.className = 'sb-val ' + cls; } }

      function refresh() {
        var m = NW.Monitor.values;
        set('sb-util', m.utilization + '%', m.utilization > 85 ? 'hot' : m.utilization > 60 ? 'warm' : '');
        set('sb-cache', Math.round(m.totalCacheBuffers / s.installedMemory * 100) + '%');
        set('sb-conn', NW.data.connections.count() + '/' + NW.data.connections.licensed);
        set('sb-nlm', NW.data.modules.count());
        set('sb-up', upShort());
        var d = new Date();
        var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        var mo = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        document.getElementById('sb-clock').textContent =
          days[d.getDay()] + ' ' + mo[d.getMonth()] + ' ' + d.getDate() + '  ' + NW.util.clock(d);
      }
      if (busOff) busOff();
      busOff = NW.bus.on('monitor:tick', refresh);
      if (timer) clearInterval(timer);
      timer = setInterval(refresh, 1000);
      refresh();
    },
  };

  NW.StatusBar = StatusBar;
})(window.NW);

  </script>

  <script>
/* ===== js/apps/monitor.js ===== */
/* ==========================================================================
   apps/monitor.js  —  MONITOR.NLM. The classic server monitor: a live
   "General Information" panel plus an "Available Options" menu leading to
   Connections, Disk, LAN/WAN, System modules, Memory and Processor screens.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el, U = NW.util, T = NW.TUI;

  /* live self-cleaning tick subscription tied to a DOM node's lifetime */
  function liveTick(node, fn) {
    var off = NW.bus.on('monitor:tick', function (m) {
      if (!node.isConnected) { off(); return; }
      fn(m);
    });
    fn(NW.Monitor.values);
  }

  function kv(label) {
    var val = el('span', { class: 'nw-grid-value' });
    var row = el('div', { class: 'nw-grid-row' }, [el('span', { class: 'nw-grid-label', text: label }), val]);
    return { row: row, val: val };
  }

  function rootView(win, S) {
    var m = NW.Monitor.values, s = NW.data.server;
    var gaugeSpan = el('span', { class: 'nw-gauge' });
    var rows = {
      up: kv('Server up time'), proc: kv('Online processors'),
      orig: kv('Original cache buffers'), total: kv('Total cache buffers'),
      dirty: kv('Dirty cache buffers'), hits: kv('Long term cache hits'),
      disk: kv('Current disk requests'), prb: kv('Packet receive buffers'),
      dc: kv('Directory cache buffers'), sp: kv('Service processes'),
      conn: kv('Current connections'), open: kv('Open files'),
    };
    var gaugeRow = el('div', { class: 'nw-grid-row' }, [
      el('span', { class: 'nw-grid-label', text: 'Utilization' }), gaugeSpan]);
    var leftGrid = el('div', { class: 'nw-grid' });
    var rightGrid = el('div', { class: 'nw-grid' });
    ['proc', 'orig', 'total', 'dirty', 'hits'].forEach(function (k) { leftGrid.appendChild(rows[k].row); });
    ['disk', 'prb', 'dc', 'sp', 'conn', 'open'].forEach(function (k) { rightGrid.appendChild(rows[k].row); });
    // Utilization and the long "up time" string get their own full-width rows
    var grid = el('div', { class: 'nw-grid' }, [gaugeRow, rows.up.row,
      el('div', { class: 'mon-cols' }, [leftGrid, rightGrid])]);

    liveTick(grid, function (m) {
      var pct = m.utilization;
      var w = 20, filled = Math.round(pct / 100 * w), bar = '';
      for (var i = 0; i < w; i++) bar += i < filled ? '█' : '░';
      gaugeSpan.textContent = bar + ' ' + U.padStart(pct, 3) + '%';
      gaugeSpan.className = 'nw-gauge ' + (pct > 85 ? 'hot' : pct > 60 ? 'warm' : '');
      rows.up.val.textContent = s.uptimeStr().replace(/\s+/g, ' ');
      rows.proc.val.textContent = '1';
      rows.orig.val.textContent = U.commas(m.originalCacheBuffers);
      rows.total.val.textContent = U.commas(m.totalCacheBuffers);
      rows.dirty.val.textContent = U.commas(m.dirtyCacheBuffers);
      rows.hits.val.textContent = m.longTermCacheHits + '%';
      rows.disk.val.textContent = m.diskReads + m.diskWrites;
      rows.prb.val.textContent = U.commas(m.packetReceiveBuffers);
      rows.dc.val.textContent = U.commas(m.dirCacheBuffers);
      rows.sp.val.textContent = m.serviceProcesses + ' / ' + m.maxServiceProcesses;
      rows.conn.val.textContent = NW.data.connections.count();
      rows.open.val.textContent = NW.data.connections.all().reduce(function (a, c) { return a + c.openFiles.length; }, 0);
    });

    var options = [
      { label: 'Connections', action: function () { S.push(connectionsView(win, S)); } },
      { label: 'Disk information', action: function () { S.push(diskView(win)); } },
      { label: 'LAN/WAN information', action: function () { S.push(lanView(win)); } },
      { label: 'System module information', action: function () { S.push(modulesView(win)); } },
      { label: 'Memory utilization', action: function () { S.push(memoryView(win)); } },
      { label: 'Processor utilization', action: function () { S.push(processorView(win)); } },
      { label: 'Resource utilization', action: function () { S.push(resourceView(win)); } },
      { label: 'Scheduling information', action: function () { S.push(schedView(win)); } },
      { label: 'Lock activity', action: function () { S.push(lockView(win)); } },
    ];
    var menu = T.menu(options, {});

    var elc = el('div', {}, [
      T.header('NetWare 4.11', 'MONITOR.NLM'),
      T.box('General Information', grid),
      T.box('Available Options', menu.el),
    ]);
    return { title: 'MONITOR  -  ' + NW.data.server.serverName, el: elc,
      footer: 'Enter=Select   Esc=Exit   Alt+F10=Exit', focus: function () { menu.focus(); } };
  }

  function connectionsView(win, S) {
    var rows = NW.data.connections.active().map(function (c) {
      return { cells: [c.number, c.user, c.type, NW.data.connections.loginTimeStr(c)], data: c };
    });
    var tbl = T.table([
      { title: 'Conn', width: 5, align: 'r' }, { title: 'Name', width: 14 },
      { title: 'Type', width: 6 }, { title: 'Login Time', width: 26 },
    ], rows, { onSelect: function (r) {
      var c = r.data;
      T.dialog({ title: 'Connection ' + c.number, w: 420, messageHtml:
        '<b>' + c.user + '</b><br>Type: ' + c.type + '<br>Address: ' + c.address +
        '<br>Requests: ' + U.commas(c.requests) + '<br>Open files: ' + c.openFiles.length +
        (c.openFiles.length ? '<br>&nbsp;&nbsp;' + c.openFiles.map(U.escapeHtml).join('<br>&nbsp;&nbsp;') : '') });
    } });
    return { title: 'MONITOR  -  Active Connections', el: el('div', {}, [T.header('Active Connections', 'MONITOR.NLM'), tbl.el]),
      footer: 'Enter=Details   Esc=Back', focus: function () { tbl.focus(); } };
  }

  function diskView(win) {
    var s = NW.data.server;
    var box = el('div', {});
    box.appendChild(T.box('Storage Adapter', T.infoGrid([
      ['Driver', 'AHA2940.HAM'], ['Adapter', s.disk.adapter], ['Controller', s.disk.controller],
    ])));
    s.disk.drives.forEach(function (d, i) {
      box.appendChild(T.box('Disk Device #' + i, T.infoGrid([
        ['Model', d.model], ['Capacity', U.commas(d.size) + ' MB'],
        ['Type', 'SCSI (Read after write verify: ON)'], ['Partition', 'NetWare 4.x  Hot Fix'],
        ['Mirror status', i === 0 ? 'Mirrored -> device #1' : 'Mirrored -> device #0'],
      ])));
    });
    return { title: 'MONITOR  -  Disk Information', el: el('div', {}, [T.header('Disk Information', 'MONITOR.NLM'), box]),
      footer: 'Esc=Back', focus: null };
  }

  function lanView(win) {
    var host = el('div', {});
    var boards = NW.data.server.lan.map(function (b) {
      var g = T.infoGrid([['Board name', b.name], ['Frame type', b.frame], ['Node', b.node],
        ['Port', b.port], ['Interrupt', b.irq], ['Packets sent', '0'], ['Packets received', '0'], ['Send failures', '0']]);
      var sent = g.querySelectorAll('.nw-grid-value')[5];
      var recv = g.querySelectorAll('.nw-grid-value')[6];
      liveTick(g, function (m) { sent.textContent = U.commas(m.packetsOut * 37 + 120400); recv.textContent = U.commas(m.packetsIn * 41 + 208114); });
      return T.box(b.driver + '  (' + b.name + ')', g);
    });
    boards.forEach(function (b) { host.appendChild(b); });
    return { title: 'MONITOR  -  LAN/WAN Information', el: el('div', {}, [T.header('LAN/WAN Information', 'MONITOR.NLM'), host]),
      footer: 'Esc=Back', focus: null };
  }

  function modulesView(win) {
    var rows = NW.data.modules.all().map(function (m) {
      return { cells: [m.name, m.version, U.commas((m.dataKB + m.allocKB) * 1024), m.desc], data: m };
    });
    var tbl = T.table([
      { title: 'Module', width: 15 }, { title: 'Ver', width: 6 },
      { title: 'Size (bytes)', width: 13, align: 'r' }, { title: 'Description', width: 30 },
    ], rows, {});
    return { title: 'MONITOR  -  System Modules', el: el('div', {}, [T.header('System Module Information', 'MONITOR.NLM'), tbl.el]),
      footer: 'Esc=Back   (' + rows.length + ' modules)', focus: function () { tbl.focus(); } };
  }

  function memoryView(win) {
    var s = NW.data.server;
    function barRow(label, pct) {
      return el('div', { class: 'nw-grid-row' }, [
        el('span', { class: 'nw-grid-label', text: label }), T.gauge(pct, 22)]);
    }
    var host = el('div', {});
    var g = el('div', { class: 'nw-grid' });
    var cacheRow = barRow('File cache buffers', 62);
    g.appendChild(cacheRow);
    g.appendChild(barRow('Alloc memory pool', 12));
    g.appendChild(barRow('Cache movable', 9));
    g.appendChild(barRow('Cache non-movable', 7));
    g.appendChild(barRow('Code and data', 10));
    host.appendChild(T.box('Memory Utilization  (Total ' + U.commas(s.installedMemory) + ' K)', g));
    return { title: 'MONITOR  -  Memory Utilization', el: el('div', {}, [T.header('Memory Utilization', 'MONITOR.NLM'), host]),
      footer: 'Esc=Back', focus: null };
  }

  function processorView(win) {
    var big = el('div', { class: 'monitor-bigutil' });
    liveTick(big, function (m) {
      var w = 40, filled = Math.round(m.utilization / 100 * w), bar = '';
      for (var i = 0; i < w; i++) bar += i < filled ? '█' : '░';
      big.textContent = bar + '  ' + U.padStart(m.utilization, 3) + '%';
      big.className = 'monitor-bigutil ' + (m.utilization > 85 ? 'hot' : m.utilization > 60 ? 'warm' : '');
    });
    var host = el('div', {}, [
      T.header('Processor Utilization', 'MONITOR.NLM'),
      T.box('Processor 0  -  Intel Pentium 166MHz', big),
      T.box('Threads', T.infoGrid([['Scheduling threads', '2'], ['Delayed threads', '0'], ['Interrupt time', '3%']])),
    ]);
    return { title: 'MONITOR  -  Processor', el: host, footer: 'Esc=Back', focus: null };
  }

  function resourceView(win) {
    var tags = [['Cache buffers', '40,610'], ['Alloc memory', '7,880 KB'], ['Screen memory', '128 KB'],
      ['Semaphores', '312'], ['Timers', '96'], ['File locks', '48'], ['TCP resources', '210'],
      ['Directory cache', '4,012'], ['Kernel processes', '18']];
    var rows = tags.map(function (t) { return { cells: [t[0], t[1]], data: t }; });
    var tbl = T.table([{ title: 'Resource Tag', width: 24 }, { title: 'In Use', width: 14, align: 'r' }], rows, {});
    return { title: 'MONITOR  -  Resource Utilization', el: el('div', {}, [T.header('Tracked Resources', 'MONITOR.NLM'), tbl.el]),
      footer: 'Esc=Back', focus: function () { tbl.focus(); } };
  }
  function schedView(win) {
    return { title: 'MONITOR  -  Scheduling', el: el('div', {}, [T.header('Scheduling Information', 'MONITOR.NLM'),
      T.box('Scheduling', T.infoGrid([['Load', 'Balanced'], ['Reschedule count', '2,004,118'],
        ['Threads scheduled', '48,220'], ['Idle loops', '990,004'], ['CPU busy %', String(NW.Monitor.values.utilization)]]))]),
      footer: 'Esc=Back', focus: null };
  }
  function lockView(win) {
    return { title: 'MONITOR  -  Lock Activity', el: el('div', {}, [T.header('Lock File Activity', 'MONITOR.NLM'),
      T.box('File / Record Locks', T.infoGrid([['Records locked', '12'], ['File locks', '48'],
        ['Logical locks', '6'], ['Lock conflicts', '0'], ['TTS transactions', '3']]))]),
      footer: 'Esc=Back', focus: null };
  }

  NW.apps.register({
    id: 'monitor', title: 'MONITOR', name: 'MONITOR.NLM', category: 'Server',
    w: 680, h: 470, footer: ' ',
    render: function (body, win) {
      var S = T.screens(win);
      S.replaceRoot(rootView(win, S));
      win._refresh = function () { NW.Audio.key(); };
    },
  });
})(window.NW);

  <script>
/* ===== js/apps/netadmin.js ===== */
/* ==========================================================================
   apps/netadmin.js  —  NETADMIN. Browse and manage the NDS tree: create,
   delete, rename and move objects; reset passwords; view/edit login scripts;
   and assign trustee rights with an effective-rights display.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el, U = NW.util, T = NW.TUI, NDS = NW.data.nds;

  var GLYPH = {
    'Tree Root': '[R]', 'Organization': '[O]', 'Organizational Unit': '[+]',
    'User': ' U ', 'Group': ' G ', 'NCP Server': ' S ', 'Volume': ' V ',
    'Printer': ' P ', 'Print Queue': ' Q ', 'Print Server': ' PS',
  };

  function render(win) {
    var current = NDS.root;

    function build(container) {
      current = container;
      win.body.innerHTML = '';
      win.setTitle('NETADMIN  -  ' + (container.cls === 'Tree Root' ? '[Root]' : NDS.dnOf(container).replace(/^\./, '')));

      var header = T.header('NetWare Administrator', 'NETADMIN');
      var ctx = el('div', { class: 'nw-subhead', text: 'Object    Class' });

      var kids = container.children.slice().sort(function (a, b) {
        var ca = NDS.isContainer(a) ? 0 : 1, cb = NDS.isContainer(b) ? 0 : 1;
        if (ca !== cb) return ca - cb;
        return a.name < b.name ? -1 : 1;
      });
      var rows = [];
      if (container.parent) rows.push({ cells: ['..', '(parent)'], data: { up: true } });
      kids.forEach(function (n) {
        rows.push({ cells: [GLYPH[n.cls] + ' ' + n.name, n.cls], data: { node: n },
          cellClass: [NDS.isContainer(n) ? 'accent' : ''] });
      });

      var tbl = T.table([{ title: 'Object', width: 26 }, { title: 'Class', width: 22 }], rows, {
        onSelect: function (r) {
          if (r.data.up) { build(container.parent); return; }
          var n = r.data.node;
          if (NDS.isContainer(n)) build(n);
          else objectActions(n);
        },
        onInsert: function () { createDialog(container, build); },
        onDelete: function (r) { if (r.data.node) deleteObject(r.data.node, build); },
        onModify: function (r) { if (r.data.node && r.data.node.cls === 'User') propsDialog(r.data.node); },
      });

      win.body.appendChild(el('div', {}, [header, ctx, tbl.el]));
      win.setFooter('Enter=Open/Actions  Ins=Create  Del=Delete  F3=Properties  Esc=Up');
      setTimeout(function () { tbl.focus(); }, 0);
    }

    function objectActions(n) {
      var items = [];
      if (n.cls === 'User') {
        items.push({ label: 'View / Modify properties', action: function () { propsDialog(n); } });
        items.push({ label: 'Reset password', action: function () { resetPassword(n); } });
        items.push({ label: 'View login script', action: function () { loginScript(n); } });
        items.push({ label: 'Assign trustee rights', action: function () { rightsDialog(n); } });
        items.push({ label: 'View group memberships', action: function () { groupsDialog(n); } });
      } else if (n.cls === 'Group') {
        items.push({ label: 'View members', action: function () {
          T.dialog({ title: 'Members of ' + n.name, w: 360, message: (n.props.members || []).join('\n') || '(none)' }); } });
      } else {
        items.push({ label: 'View properties', action: function () {
          T.dialog({ title: n.name, w: 400, messageHtml: Object.keys(n.props).map(function (k) {
            return '<b>' + U.escapeHtml(k) + ':</b> ' + U.escapeHtml(String(n.props[k])); }).join('<br>') }); } });
      }
      items.push({ label: 'Rename object', action: function () { renameObject(n); } });
      items.push({ label: 'Move object', action: function () { moveObject(n); } });
      if (!(n.cls === 'User' && n.props.admin))
        items.push({ label: 'Delete object', action: function () { deleteObject(n, build); } });

      var m = T.menu(items, {});
      T.dialog({ title: n.name + '  (' + n.cls + ')', w: 380, extra: m.el,
        buttons: [{ label: ' Cancel ', value: false, def: true }] });
      setTimeout(function () { m.focus(); }, 10);
    }

    function createDialog(container, cb) {
      var f = T.form([
        { name: 'login', label: 'Login name  ' },
        { name: 'full', label: 'Full name   ' },
        { name: 'pass', label: 'Password    ', type: 'password' },
      ], {});
      T.dialog({
        title: 'Create User in ' + (container.name === '[Root]' ? '[Root]' : container.name),
        w: 420, extra: f.el,
        buttons: [{ label: ' Create ', value: true }, { label: ' Cancel ', value: false, def: false }],
        onResult: function (ok) {
          if (!ok) return;
          var login = (f.value('login') || '').trim();
          if (!login) { T.alert('A login name is required.', 'Create User', 'error'); return; }
          var res = NDS.createUser(container, login, { fullName: f.value('full') || login, password: f.value('pass') || '' });
          if (!res.ok) { T.alert('A user named ' + login.toUpperCase() + ' already exists.', 'Create User', 'error'); return; }
          NW.bus.emit('log:add', { sev: 'info', src: 'DS', msg: 'User ' + login.toUpperCase() + ' created.' });
          NW.data.volumes.mkdir(NW.data.volumes.resolve('USERS', []) , login.toUpperCase());
          cb(container);
        },
      });
      setTimeout(function () { f.focus(); }, 10);
    }

    function deleteObject(n, cb) {
      if (n.cls === 'User' && n.props.admin) { T.alert('The ADMIN object is supervisor of the tree and cannot be deleted here.', 'Delete', 'error'); return; }
      T.confirm('Delete NDS object "' + n.name + '" (' + n.cls + ')?\nThis cannot be undone.', function () {
        var r = NDS.deleteObject(n);
        if (r.ok) { NW.bus.emit('log:add', { sev: 'warn', src: 'DS', msg: 'Object ' + n.name + ' deleted.' }); cb(current); }
        else T.alert('That object could not be deleted.', 'Delete', 'error');
      });
    }

    function propsDialog(n) {
      var p = n.props;
      var f = T.form([
        { name: 'full', label: 'Full name    ', value: p.fullName },
        { name: 'title', label: 'Title        ', value: p.title },
        { name: 'dept', label: 'Department   ', value: p.department },
        { name: 'phone', label: 'Telephone    ', value: p.telephone },
        { name: 'home', label: 'Home directory', value: p.homeDir },
        { name: 'disabled', label: 'Login disabled', type: 'checkbox', value: p.loginDisabled },
      ], {});
      var info = el('div', { class: 'nw-dim', text: 'Last login: ' + p.lastLogin });
      T.dialog({ title: 'User : ' + n.name, w: 460, extra: el('div', {}, [f.el, info]),
        buttons: [{ label: ' Save ', value: true }, { label: ' Cancel ', value: false }],
        onResult: function (ok) {
          if (!ok) return;
          p.fullName = f.value('full'); p.title = f.value('title'); p.department = f.value('dept');
          p.telephone = f.value('phone'); p.homeDir = f.value('home'); p.loginDisabled = f.value('disabled');
          NW.bus.emit('nds:changed');
        } });
      setTimeout(function () { f.focus(); }, 10);
    }

    function resetPassword(n) {
      T.promptText({ title: 'Reset Password : ' + n.name, label: 'New password', password: true,
        onOk: function (v) { NDS.setPassword(n, v); T.alert('Password for ' + n.name + ' has been changed.', 'Security'); } });
    }

    function loginScript(n) {
      var ta = el('textarea', { class: 'nw-input nw-textarea', rows: 12, text: n.props.loginScript || '' });
      T.dialog({ title: 'Login Script : ' + n.name, w: 520, extra: ta,
        buttons: [{ label: ' Save ', value: true }, { label: ' Cancel ', value: false }],
        onResult: function (ok) { if (ok) { n.props.loginScript = ta.value; T.alert('Login script saved.', 'NETADMIN'); } } });
      setTimeout(function () { ta.focus(); }, 10);
    }

    function rightsDialog(n) {
      var vols = NW.data.volumes.names();
      var sel = el('select', { class: 'nw-input' });
      vols.forEach(function (v) { sel.appendChild(el('option', { value: v + ':', text: v + ':' })); });
      sel.value = (n.props.homeDir || 'SYS:').split(/[\\\/]/)[0].replace(/:?$/, ':');

      var checks = {};
      var checkRow = el('div', { class: 'rights-row' });
      var LABELS = { S: 'Supervisor', R: 'Read', W: 'Write', C: 'Create', E: 'Erase', M: 'Modify', F: 'File Scan', A: 'Access Ctrl' };
      NDS.RIGHTS.forEach(function (r) {
        var cb = el('input', { type: 'checkbox', class: 'nw-check' });
        checks[r] = cb;
        checkRow.appendChild(el('label', { class: 'rights-check' }, [cb, document.createTextNode(' ' + r + ' ' + LABELS[r])]));
      });
      var effLine = el('div', { class: 'nw-hi rights-eff' });

      function loadFor(path) {
        var t = (n.props.trustees || []).find(function (x) { return x.path.toUpperCase() === path.toUpperCase(); });
        var granted = t ? t.rights : '';
        NDS.RIGHTS.forEach(function (r) { checks[r].checked = granted.indexOf(r) >= 0; });
        showEff(path);
      }
      function showEff(path) {
        var eff = NDS.effectiveRights(n, path);
        effLine.textContent = 'Effective rights: [ ' + (eff.join(' ') || '(none)') + ' ]';
      }
      sel.addEventListener('change', function () { loadFor(sel.value); });
      loadFor(sel.value);

      T.dialog({
        title: 'Trustee Rights : ' + n.name, w: 520,
        extra: el('div', {}, [
          el('div', { class: 'nw-field' }, [el('label', { class: 'nw-field-label', text: 'Directory:' }), sel]),
          checkRow, effLine,
          el('div', { class: 'nw-dim', text: 'Trustee assignments combine with group rights to form effective rights.' }),
        ]),
        buttons: [{ label: ' Save ', value: true }, { label: ' Cancel ', value: false }],
        onResult: function (ok) {
          if (!ok) return;
          var granted = NDS.RIGHTS.filter(function (r) { return checks[r].checked; }).join('');
          n.props.trustees = (n.props.trustees || []).filter(function (x) { return x.path.toUpperCase() !== sel.value.toUpperCase(); });
          if (granted) n.props.trustees.push({ path: sel.value, rights: granted });
          NW.bus.emit('nds:changed');
          T.alert('Trustee assignment updated for ' + sel.value, 'Rights');
        },
      });
      checkRow.addEventListener('change', function () { /* live preview uses saved data; recompute tentative */
        var tmp = { props: { trustees: [{ path: sel.value, rights: NDS.RIGHTS.filter(function (r) { return checks[r].checked; }).join('') }], groups: n.props.groups } };
        var eff = NDS.effectiveRights(tmp, sel.value);
        effLine.textContent = 'Effective rights: [ ' + (eff.join(' ') || '(none)') + ' ]';
      });
    }

    function groupsDialog(n) {
      T.dialog({ title: 'Group Membership : ' + n.name, w: 360,
        message: (n.props.groups || []).join('\n') || '(no memberships)' });
    }

    function renameObject(n) {
      T.promptText({ title: 'Rename : ' + n.name, label: 'New name', value: n.name,
        onOk: function (v) { if (v) { n.name = v.toUpperCase(); NW.bus.emit('nds:changed'); build(current); } } });
    }

    function moveObject(n) {
      var containers = [];
      (function collect(c) { if (NDS.isContainer(c)) { containers.push(c); (c.children || []).forEach(collect); } })(NDS.root);
      var items = containers.filter(function (c) { return c !== n.parent && c !== n; }).map(function (c) {
        return { label: (c.cls === 'Tree Root' ? '[Root]' : NDS.dnOf(c).replace(/^\./, '')), action: function () {
          n.parent.children = n.parent.children.filter(function (x) { return x !== n; });
          c.children.push(n); n.parent = c; NW.bus.emit('nds:changed'); build(current);
          T.alert(n.name + ' moved to ' + c.name, 'Move');
        } };
      });
      var m = T.menu(items, {});
      T.dialog({ title: 'Move ' + n.name + ' to...', w: 420, extra: m.el, buttons: [{ label: ' Cancel ', value: false, def: true }] });
      setTimeout(function () { m.focus(); }, 10);
    }

    // Esc navigates up a container, closes at the root
    win.escCloses = false;
    win.body.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        e.preventDefault(); e.stopPropagation();
        if (current.parent) { NW.Audio.click(); build(current.parent); } else win.close();
      }
    });

    build(NDS.root);
  }

  NW.apps.register({
    id: 'netadmin', title: 'NetWare Administrator', name: 'NETADMIN', category: 'Directory',
    w: 600, h: 460, footer: ' ',
    render: function (body, win) { render(win); },
  });
})(window.NW);

  </script>

(function (NW) {

            ['Login disabled', u.props.loginDisabled ? 'Yes' : 'No'], ['Last login', u.props.lastLogin],
            ['Account balance', 'Unlimited'], ['Home directory', u.props.homeDir]]) });

      return { title: 'SYSCON  -  User Information', footer: 'Enter=Details   Esc=Back',

    }

    function groupInfo() {

      var rows = groups.map(function (g) { return { cells: [g.name, (g.props.members || []).length + ' members', g.props.desc], data: g }; });
      var tbl = T.table([{ title: 'Group', width: 14 }, { title: 'Members', width: 12 }, { title: 'Description', width: 24 }], rows,
        { onSelect: function (r) { T.dialog({ title: 'Group: ' + r.data.name, w: 380, message: 'Members:\n' + (r.data.props.members || []).join('\n') }); } });
      return { title: 'SYSCON  -  Group Information', footer: 'Enter=Members   Esc=Back',
        el: el('div', {}, [T.header('Group Information', 'SYSCON'), tbl.el]), focus: function () { tbl.focus(); } };
    }

    function supervisor() {
      var menu = T.menu([
        { label: 'Default Account Balance/Restrictions', action: function () { T.alert('Account balance: Unlimited\nLow balance limit: 0\nConcurrent connections: Unlimited', 'Supervisor Options'); } },
        { label: 'File Server Console Operators', action: function () { T.alert('Console operators:\n\n  ADMIN\n  (Group) ADMINS', 'Supervisor Options'); } },
        { label: 'Intruder Detection/Lockout', action: function () { T.alert('Detect intruders: On\nIncorrect login attempts: 7\nLockout time: 15 minutes', 'Supervisor Options'); } },
        { label: 'System Login Script', action: function () { T.dialog({ title: 'System Login Script', w: 520, extra: el('pre', { class: 'file-view', text: 'MAP *1:=SYS:\nMAP INS S1:=SYS:PUBLIC\nMAP INS S2:=SYS:PUBLIC\\%MACHINE\\%OS\\%OS_VERSION\nCOMSPEC=S2:COMMAND.COM\nWRITE "Good %GREETING_TIME, %FULL_NAME"' }) }); } },
        { label: 'View File Server Error Log', action: function () { NW.launch('logs'); } },
      ], {});
      return { title: 'SYSCON  -  Supervisor Options', footer: 'Enter=Select   Esc=Back',
        el: el('div', {}, [T.header('Supervisor Options', 'SYSCON'), T.box('Options', menu.el)]), focus: function () { menu.focus(); } };
    }

    function accounting() {
      return { title: 'SYSCON  -  Accounting', footer: 'Esc=Back',
        el: el('div', {}, [T.header('Accounting', 'SYSCON'), T.box('Accounting Servers', T.infoGrid([
          ['Accounting installed', 'Yes'], ['Blocks read charge rate', '0'], ['Blocks written charge rate', '0'],
          ['Connect time charge rate', '0'], ['Disk storage charge rate', '0'], ['Service requests', '0']]))]),
        focus: null };

    S.replaceRoot(root());
  }

  NW.apps.register({
    id: 'syscon', title: 'SYSCON', name: 'SYSCON', category: 'Directory',

  <script>
/* ===== js/apps/filer.js ===== */
/* ==========================================================================
   apps/filer.js  —  FILER / Volume Explorer. Browse volumes and directory
   trees, open file viewers, inspect metadata (owner, attributes, dates) and
   the current user's effective rights.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el, U = NW.util, T = NW.TUI, Vol = NW.data.volumes;

  function fdate(d) {
    var mo = d.getMonth() + 1, da = d.getDate(), yr = ('' + d.getFullYear()).slice(2);
    var h = d.getHours(), m = d.getMinutes(), ap = h < 12 ? 'a' : 'p', h12 = h % 12 || 12;
    return U.padStart(mo, 2) + '-' + U.padStart(da, 2, '0') + '-' + yr + ' ' + U.padStart(h12, 2) + ':' + U.padStart(m, 2, '0') + ap;
  }
  function curUser() { return (NW.session && NW.session.user) || NW.data.nds.findUser('ADMIN'); }

  function render(win) {
    var mode = 'vols', vol = null, path = [];

    function buildVols() {
      mode = 'vols'; vol = null; path = [];
      win.setTitle('FILER  -  Volumes');
      var rows = Vol.names().map(function (v) {
        var d = Vol.get(v);
        return { cells: [v + ':', U.commas(d.totalKB) + ' K', U.commas(d.freeKB) + ' K', d.ns], data: { vol: v } };
      });
      var tbl = T.table([
        { title: 'Volume', width: 10 }, { title: 'Total', width: 14, align: 'r' },
        { title: 'Free', width: 14, align: 'r' }, { title: 'Name Spaces', width: 20 },
      ], rows, { onSelect: function (r) { vol = r.data.vol; path = []; buildDir(); } });
      paint([T.header('Available Volumes', 'FILER'), tbl.el], tbl,
        'Enter=Open Volume   Esc=Exit');
    }

    function buildDir() {
      mode = 'dir';
      var node = Vol.resolve(vol, path);
      if (!node) { buildVols(); return; }
      var full = vol + ':' + path.join('\\');
      win.setTitle('FILER  -  ' + full);

      var kids = node.children.slice().sort(function (a, b) {
        if ((a.type === 'dir') !== (b.type === 'dir')) return a.type === 'dir' ? -1 : 1;
        return a.name < b.name ? -1 : 1;
      });
      var rows = [];
      rows.push({ cells: ['..', '<DIR>', '', ''], data: { up: true } });
      kids.forEach(function (n) {
        rows.push({
          cells: [(n.type === 'dir' ? '[' + n.name + ']' : n.name),
            n.type === 'dir' ? '<DIR>' : U.commas(n.size), fdate(n.date), n.attrs],
          data: { node: n }, cellClass: [n.type === 'dir' ? 'accent' : ''],
        });
      });
      var tbl = T.table([
        { title: 'Name', width: 22 }, { title: 'Size', width: 11, align: 'r' },
        { title: 'Last Modified', width: 15 }, { title: 'Attr', width: 8 },
      ], rows, {
        onSelect: function (r) {
          if (r.data.up) { goUp(); return; }
          var n = r.data.node;
          if (n.type === 'dir') { path.push(n.name); buildDir(); }
          else openFile(n, full);
        },
        onModify: function (r) { if (r.data.node) infoDialog(r.data.node, full); },
        onInsert: function () { createDialog(node); },
        onDelete: function (r) { if (r.data.node) { Vol.remove(node, r.data.node); buildDir(); } },
      });
      paint([T.header(full, 'FILER'), tbl.el], tbl,
        'Enter=Open  Ins=New  Del=Delete  F3=Info  Esc=Up');
    }

    function goUp() {
      if (path.length) { path.pop(); buildDir(); }
      else buildVols();
    }

    function openFile(n, dirPath) {
      if (n.content != null) {
        NW.WM.open({
          title: 'VIEW  -  ' + dirPath + '\\' + n.name, w: 560, h: 400, footer: 'Esc=Close',
          render: function (b) {
            b.appendChild(el('pre', { class: 'file-view', text: n.content }));
          },
        });
      } else {
        // binary file: show a fake hex snippet + metadata
        var hex = '';
        for (var r = 0; r < 8; r++) {
          var off = U.padStart((r * 16).toString(16), 8, '0').toUpperCase();
          var bytes = '', ascii = '';
          for (var i = 0; i < 16; i++) {
            var v = U.rint(0, 255);
            bytes += U.padStart(v.toString(16), 2, '0').toUpperCase() + ' ';
            ascii += (v >= 32 && v < 127) ? String.fromCharCode(v) : '.';
          }
          hex += off + '  ' + bytes + ' ' + ascii + '\n';
        }
        T.dialog({
          title: 'VIEW  -  ' + n.name, w: 560,
          extra: el('div', {}, [
            T.infoGrid([['File', n.name], ['Size', U.commas(n.size) + ' bytes'],
              ['Owner', n.owner], ['Modified', fdate(n.date)], ['Attributes', n.attrs]]),
            el('div', { class: 'nw-dim', text: 'Binary file - hex preview:' }),
            el('pre', { class: 'file-view hex', text: hex }),
          ]),
        });
      }
    }

    function infoDialog(n, dirPath) {
      var fullPath = dirPath + (n.type === 'dir' ? '\\' + n.name : '');
      var eff = NW.data.nds.effectiveRights(curUser(), vol + ':');
      T.dialog({
        title: 'Information : ' + n.name, w: 460,
        extra: T.infoGrid([
          ['Name', n.name], ['Type', n.type === 'dir' ? 'Directory' : 'File'],
          ['Size', n.type === 'dir' ? '-' : U.commas(n.size) + ' bytes'],
          ['Owner', n.owner || 'ADMIN'], ['Last modified', fdate(n.date)],
          ['Attributes', n.attrs],
          ['Your effective rights', '[ ' + eff.join(' ') + ' ]'],
        ]),
      });
    }

    function createDialog(node) {
      var f = T.form([
        { name: 'name', label: 'Name  ' },
        { name: 'type', label: 'Type  ', type: 'select', options: [{ value: 'file', label: 'File' }, { value: 'dir', label: 'Directory' }] },
      ], {});
      T.dialog({ title: 'Create in ' + vol + ':' + path.join('\\'), w: 400, extra: f.el,
        buttons: [{ label: ' Create ', value: true }, { label: ' Cancel ', value: false }],
        onResult: function (ok) {
          if (!ok) return;
          var name = (f.value('name') || '').trim();
          if (!name) return;
          if (f.value('type') === 'dir') Vol.mkdir(node, name);
          else Vol.touch(node, name.toUpperCase());
          buildDir();
        } });
      setTimeout(function () { f.focus(); }, 10);
    }

    function paint(children, widget, footer) {
      win.body.innerHTML = '';
      win.body.appendChild(el('div', {}, children));
      win.setFooter(footer);
      if (widget) setTimeout(function () { widget.focus(); }, 0);
    }

    win.escCloses = false;
    win.body.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        e.preventDefault(); e.stopPropagation();
        if (mode === 'dir') { NW.Audio.click(); goUp(); }
        else win.close();
      }
    });

    buildVols();
  }

  NW.apps.register({
    id: 'filer', title: 'Volume Explorer', name: 'FILER', category: 'Volumes',
    w: 600, h: 460, footer: ' ',
    render: function (body, win) { render(win); },
  });
})(window.NW);

  </script>
  <script>
/* ===== js/apps/connections.js ===== */
/* ==========================================================================
   apps/connections.js  —  Connection Manager. Lists every connection slot
   with live idle timers and per-connection actions: Send Message, View Files,
   and Clear / Disconnect.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el, U = NW.util, T = NW.TUI, Conn = NW.data.connections;

  function render(win) {
    function build() {
      win.body.innerHTML = '';
      var rows = Conn.all().map(function (c) {
        return {
          cells: [c.number, c.user || '(not logged in)', c.station, Conn.loginTimeStr(c),
            Conn.idleStr(c), c.openFiles.length, c.type],
          data: c, cellClass: [null, c.user ? '' : 'nw-dim'],
        };
      });
      var tbl = T.table([
        { title: 'Conn', width: 5, align: 'r' }, { title: 'User', width: 16 },
        { title: 'Station (node)', width: 14 }, { title: 'Login Time', width: 22 },
        { title: 'Idle', width: 6, align: 'r' }, { title: 'Files', width: 6, align: 'r' },
        { title: 'Type', width: 6 },
      ], rows, { onSelect: function (r) { if (r.data.user) actions(r.data); else T.alert('Connection ' + r.data.number + ' is not in use.', 'Connection'); } });

      win.body.appendChild(el('div', {}, [
        T.header('Connection Information', 'MONITOR'),
        el('div', { class: 'nw-subhead', text: Conn.count() + ' of ' + Conn.licensed + ' licensed connections in use   (peak ' + Conn.peak + ')' }),
        tbl.el,
      ]));
      win.setFooter('Enter=Actions  (Send / View Files / Clear)   F3=Refresh   Esc=Exit');
      setTimeout(function () { tbl.focus(); }, 0);

      // live idle timers (self-cleaning)
      var rowEls = U.qsa('.nw-list-row', tbl.scroll);
      var off = NW.bus.on('monitor:tick', function () {
        if (!tbl.scroll.isConnected) { off(); return; }
        Conn.all().forEach(function (c, i) {
          var re = rowEls[i]; if (!re) return;
          var cells = re.children;
          if (cells[4]) cells[4].textContent = Conn.idleStr(c);
        });
      });
    }

    function actions(c) {
      var items = [
        { label: 'Send message to this connection', action: function () {
          T.promptText({ title: 'Send Message to ' + c.user, label: 'Message',
            onOk: function (v) { if (v) { NW.bus.emit('broadcast', { from: NW.data.server.serverName, msg: v, to: c.user }); T.alert('Message sent to connection ' + c.number + '.', 'SEND'); } } });
        } },
        { label: 'View open files (' + c.openFiles.length + ')', action: function () {
          T.dialog({ title: 'Open files - connection ' + c.number, w: 460,
            message: c.openFiles.length ? c.openFiles.join('\n') : 'No files open.' });
        } },
        { label: 'View connection details', action: function () {
          T.dialog({ title: 'Connection ' + c.number + ' - ' + c.user, w: 440,
            extra: T.infoGrid([['User', c.user], ['Connection type', c.type], ['Network address', c.address],
              ['Login time', Conn.loginTimeStr(c)], ['Requests', U.commas(c.requests)],
              ['Open files', c.openFiles.length], ['Status', c.status]]) });

(function (NW) {

  var el = NW.util.el, U = NW.util, T = NW.TUI;

  var queues = {
    ACME_Q1: { operatorFlags: 'Allow users to submit', jobs: [
      { user: 'BBUNNY', desc: 'Q3 Sales Report.doc', size: 40118, form: 0, status: 'Printing' },

  function renumber(q) { q.jobs.forEach(function (j, i) { j.seq = i + 1; }); }

    function root() {

    function jobList(name) {
      var q = queues[name];
      function view() {
        var rows = q.jobs.map(function (j) {
          return { cells: [j.seq, j.user, j.desc, U.commas(j.size), 'Form ' + j.form, j.status], data: j,

          onInsert: function () { addJob(q); refresh(); },
          onDelete: function (r) { q.jobs = q.jobs.filter(function (x) { return x !== r.data; }); renumber(q); refresh(); },
        });

      }
      var tblRef = { t: null };
      function refresh() { var v = view(); tblRef.t = v; host.innerHTML = ''; host.appendChild(v.el); setTimeout(function () { v.focus(); }, 0); win.setFooter('Enter=Actions  Ins=Add Job  Del=Delete  Esc=Back'); }

        { label: 'Delete job', action: function () { q.jobs = q.jobs.filter(function (x) { return x !== job; }); renumber(q); refreshHost(); } },

            ['Serviced printers', 'HP_LASERJET_4, OKIDATA_ML'], ['Queue service mode', 'Change forms as needed'],
            ['Advertising name', 'ACME_PS1']]))]),

/* ==========================================================================
   apps/netmap.js  —  Interactive network topology viewer. Canvas-drawn nodes

   traffic. Click a node for details.

(function (NW) {
  'use strict';

  var el = NW.util.el, T = NW.TUI;

  var COL = { bg: '#0a0a3a', link: '#3fae3f', linkHot: '#7dff7d', text: '#e8e8e8',

  function render(win) {
    var W = 540, H = 344;
    var canvas = el('canvas', { class: 'netmap-canvas', width: W, height: H });
    win.body.appendChild(el('div', {}, [T.header('Network Topology  -  ' + NW.data.server.tree, 'NETMAP'), canvas]));
    win.setFooter('Click a node for details   Esc=Exit');
    var ctx = canvas.getContext('2d');

    var nodes = {
      router: { x: 270, y: 26, w: 96, h: 26, label: 'ROUTER / WAN', type: 'router', info: ['Cisco 2501 gateway', 'IP 192.168.10.254', 'Serial link to Internet'] },
      sw: { x: 270, y: 104, w: 110, h: 26, label: 'ACME_SW1', type: 'node', info: ['24-port Ethernet switch', '10BaseT', 'Uplink to router'] },
      fs1: { x: 168, y: 190, w: 96, h: 30, label: 'ACME_FS1', type: 'server', info: ['IntranetWare 4.11', 'File & Print Server', 'IPX 0000C0DE / IP 192.168.10.1'] },
      fs2: { x: 372, y: 190, w: 96, h: 30, label: 'ACME_FS2', type: 'server', info: ['NetWare 4.11', 'Replica server', 'IPX 0000C0DF'] },
      pr1: { x: 60, y: 120, w: 84, h: 26, label: 'HP_LJ4', type: 'printer', info: ['HP LaserJet 4', 'Queue ACME_Q1'] },
      pr2: { x: 448, y: 120, w: 84, h: 26, label: 'OKI_ML', type: 'printer', info: ['Okidata Microline', 'Queue FINANCE_Q'] },
      hub: { x: 270, y: 250, w: 90, h: 24, label: 'HUB-2', type: 'node', info: ['8-port 10BaseT hub', 'Workstation segment'] },
      c1: { x: 54, y: 314, w: 74, h: 24, label: 'WS-SALES1', type: 'client', info: ['Client 32', 'BBUNNY', 'DOS/Windows 3.11'] },
      c2: { x: 152, y: 320, w: 74, h: 24, label: 'WS-SALES2', type: 'client', info: ['Client 33', 'DDUCK', 'Windows 95'] },
      c3: { x: 250, y: 320, w: 74, h: 24, label: 'WS-ENG1', type: 'client', info: ['Client 34', 'WCOYOTE', 'Windows NT 4.0'] },
      c4: { x: 348, y: 320, w: 74, h: 24, label: 'WS-ENG2', type: 'client', info: ['Client 35', 'RRUNNER', 'Windows 95'] },
      c5: { x: 452, y: 314, w: 74, h: 24, label: 'WS-FIN1', type: 'client', info: ['Client 36', 'PLETUARD', 'Windows 3.11'] },
    };
    var links = [['router', 'sw'], ['sw', 'fs1'], ['sw', 'fs2'], ['sw', 'pr1'], ['sw', 'pr2'],
      ['sw', 'hub'], ['fs1', 'fs2'], ['hub', 'c1'], ['hub', 'c2'], ['hub', 'c3'], ['hub', 'c4'], ['hub', 'c5']];
    var packets = links.map(function () { return { p: Math.random(), speed: 0.004 + Math.random() * 0.01, active: Math.random() < 0.6 }; });

    function center(n) { return { x: n.x + n.w / 2, y: n.y + n.h / 2 }; }

    function draw() {
      ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
      // links
      links.forEach(function (lk, i) {
        var a = center(nodes[lk[0]]), b = center(nodes[lk[1]]);
        ctx.strokeStyle = COL.link; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

        if (pk.active) {
          pk.p += pk.speed; if (pk.p > 1) { pk.p = 0; pk.active = Math.random() < 0.7; }
          var px = a.x + (b.x - a.x) * pk.p, py = a.y + (b.y - a.y) * pk.p;
          ctx.fillStyle = COL.linkHot; ctx.fillRect(px - 2, py - 2, 4, 4);

      });
      // nodes
      Object.keys(nodes).forEach(function (k) {
        var n = nodes[k];
        var color = n.type === 'server' ? COL.server : n.type === 'printer' ? COL.printer : n.type === 'router' ? COL.router : COL.node;
        ctx.fillStyle = COL.box; ctx.fillRect(n.x, n.y, n.w, n.h);

        ctx.fillStyle = color; ctx.font = '11px "Courier New", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(n.label, n.x + n.w / 2, n.y + n.h / 2);

    var timer = setInterval(function () { if (!canvas.isConnected) { clearInterval(timer); return; } draw(); }, 40);

    canvas.addEventListener('click', function (e) {
      var x = e.offsetX, y = e.offsetY;
      Object.keys(nodes).forEach(function (k) {
        var n = nodes[k];
        if (x >= n.x && x <= n.x + n.w && y >= n.y && y <= n.y + n.h) {
          NW.Audio.click();
          T.dialog({ title: n.label + '  (' + n.type + ')', w: 380, message: n.info.join('\n') });
        }
      });
    });
  }

  NW.apps.register({
    id: 'netmap', title: 'Network Map', name: 'NETMAP', category: 'Connections',
    w: 570, h: 430, footer: ' ',
    render: function (body, win) { render(win); },

/* ===== js/apps/graphs.js ===== */
/* ==========================================================================
   apps/graphs.js  —  Live statistics dashboard. A grid of continuously
   updating line graphs fed by the monitoring engine: processor, cache, disk
   reads/writes, network in/out, IPX, SPX, memory and directory cache.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el, U = NW.util, T = NW.TUI;

  var CARDS = [
    { key: 'utilization', title: 'Processor Utilization', unit: '%', color: '#ffff55', max: 100 },
    { key: 'memory', title: 'Memory In Use', unit: '%', color: '#55ff55', max: 100 },
    { key: 'cache', title: 'Cache Buffers', unit: '', color: '#55ffff', max: 0 },
    { key: 'dirCache', title: 'Directory Cache', unit: '', color: '#55ffaa', max: 0 },
    { key: 'diskReads', title: 'Disk Reads', unit: '/s', color: '#ff9955', max: 0 },
    { key: 'diskWrites', title: 'Disk Writes', unit: '/s', color: '#ffaa55', max: 0 },
    { key: 'packetsIn', title: 'Network Receive', unit: ' pkt/s', color: '#55aaff', max: 0 },
    { key: 'packetsOut', title: 'Network Send', unit: ' pkt/s', color: '#5599ff', max: 0 },
    { key: 'ipx', title: 'IPX Packets', unit: '/s', color: '#ff55ff', max: 0 },
    { key: 'spx', title: 'SPX Packets', unit: '/s', color: '#ff77cc', max: 0 },
  ];

  function drawGraph(ctx, data, w, h, color, maxOverride) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#050530'; ctx.fillRect(0, 0, w, h);
    // grid lines
    ctx.strokeStyle = 'rgba(80,120,200,0.25)'; ctx.lineWidth = 1;
    for (var gy = 1; gy < 4; gy++) { var y = h * gy / 4; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    var max = maxOverride || Math.max.apply(null, data.concat([1]));
    max = max * 1.15 || 1;
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
    var n = data.length;
    for (var i = 0; i < n; i++) {
      var x = i / (n - 1) * w;
      var yv = h - (data[i] / max) * h;
      if (i === 0) ctx.moveTo(x, yv); else ctx.lineTo(x, yv);
    }
    ctx.stroke();
    // fill under curve
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    ctx.fillStyle = color.replace(')', ',0.15)').replace('rgb', 'rgba');
    if (color[0] === '#') { ctx.globalAlpha = 0.14; ctx.fillStyle = color; ctx.fill(); ctx.globalAlpha = 1; }
  }

  function render(win) {
    var grid = el('div', { class: 'graphs-grid' });
    var cards = CARDS.map(function (c) {
      var val = el('span', { class: 'graph-val', style: { color: c.color } });
      var canvas = el('canvas', { class: 'graph-canvas', width: 236, height: 56 });
      var card = el('div', { class: 'graph-card' }, [
        el('div', { class: 'graph-head' }, [el('span', { class: 'graph-title', text: c.title }), val]),
        canvas,
      ]);
      grid.appendChild(card);
      return { def: c, val: val, ctx: canvas.getContext('2d'), canvas: canvas };
    });
    win.body.appendChild(el('div', {}, [T.header('Server Statistics', 'STAT.NLM'), grid]));
    win.setFooter('Statistics update continuously   Esc=Exit');

    function update() {
      cards.forEach(function (c) {
        var series = NW.Monitor.hist[c.def.key];
        var cur = series[series.length - 1];
        c.val.textContent = U.commas(cur) + c.def.unit;
        drawGraph(c.ctx, series, 236, 56, c.def.color, c.def.max);
      });
    }
    var off = NW.bus.on('monitor:tick', function () { if (!grid.isConnected) { off(); return; } update(); });
    update();
  }

  NW.apps.register({
    id: 'graphs', title: 'Statistics (Graphs)', name: 'MONITOR', category: 'Server',
    w: 540, h: 460, footer: ' ',
    render: function (body, win) { render(win); },
  });
})(window.NW);

/* ==========================================================================
   apps/logs.js  —  Error Log Viewer (SYS$LOG.ERR). Shows generated server

   Warning / Error.

      var c = el('span', { class: 'log-chip' + (filter === key ? ' active' : ''), text: label });

      c.dataset.key = key;

      NW.util.qsa('.log-chip', chipbar).forEach(function (c) { c.classList.toggle('active', c.dataset.key === filter); });
    }

    function paint() {
      var atBottom = scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 20;
      scroll.innerHTML = '';
      var list = Logs.filtered(filter === 'all' ? null : filter);

    scroll.addEventListener('keydown', function (e) {

    var off = NW.bus.on('logs:changed', function () { if (!scroll.isConnected) { off(); return; } paint(); });

/* ===== js/apps/help.js ===== */
/* ==========================================================================
   apps/help.js  —  Searchable help browser. Topics grouped by category with
   a search box; selecting a topic shows its content.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el, T = NW.TUI, Help = NW.data.help;

  function render(win, params) {
    var listHost = el('div', { class: 'help-list', tabindex: '0' });
    var content = el('pre', { class: 'help-content' });
    var titleEl = el('div', { class: 'help-topic-title' });
    var search = el('input', { class: 'nw-input help-search', type: 'text', placeholder: 'Search help...' });

    var topics = Help.all();
    var current = 0;
    var itemEls = [];

    function show(t) {
      titleEl.textContent = t.title + '   (' + t.cat + ')';
      content.textContent = t.body;
    }
    function buildList(list) {
      listHost.innerHTML = ''; itemEls = [];
      var lastCat = null;
      list.forEach(function (t, i) {
        if (t.cat !== lastCat) { lastCat = t.cat; listHost.appendChild(el('div', { class: 'help-cat', text: t.cat })); }
        var item = el('div', { class: 'help-item', text: '  ' + t.title });
        item.addEventListener('click', function () { current = i; paint(); show(t); NW.Audio.key(); });
        itemEls.push(item); listHost.appendChild(item);
      });
      topics = list;
      current = 0;
      paint();
      if (list.length) show(list[0]); else content.textContent = '(no matching topics)';
    }
    function paint() { itemEls.forEach(function (e, i) { e.classList.toggle('selected', i === current); }); if (itemEls[current]) itemEls[current].scrollIntoView({ block: 'nearest' }); }

    search.addEventListener('input', function () {
      var q = search.value.trim();
      buildList(q ? Help.search(q) : Help.all());
    });
    listHost.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { current = Math.min(topics.length - 1, current + 1); paint(); show(topics[current]); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { current = Math.max(0, current - 1); paint(); show(topics[current]); e.preventDefault(); }
    });

    win.body.appendChild(el('div', { class: 'help-root' }, [
      T.header('NetWare Help', 'HELP'),
      el('div', { class: 'help-searchbar' }, [el('span', { text: 'Find: ' }), search]),
      el('div', { class: 'help-panes' }, [listHost, el('div', { class: 'help-content-wrap' }, [titleEl, content])]),
    ]));
    win.setFooter('Type to search   Up/Down=Topic   Esc=Exit');

    if (params && params.query) { search.value = params.query; buildList(Help.search(params.query)); }
    else if (params && params.category) buildList(Help.byCategory(params.category));
    else buildList(Help.all());

    setTimeout(function () { search.focus(); }, 0);
  }

  NW.apps.register({
    id: 'help', title: 'Help Topics', name: 'HELP', category: 'Help',
    w: 620, h: 440, footer: ' ',
    render: function (body, win, params) { render(win, params); },
  });
})(window.NW);

    outEl.innerHTML = '';

        if (doneMsg) outEl.appendChild(el('div', { class: 'proc-line ok', text: doneMsg }));
        outEl.scrollTop = outEl.scrollHeight;
        NW.Audio.beep();
        return;

      var ln = lines[i++];

      outEl.scrollTop = outEl.scrollHeight;
      if (ln.cls === 'ok') NW.Audio.disk();
