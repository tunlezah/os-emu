  <!-- ===== bootstrap ===== -->
  <script>
/* ===== js/main.js ===== */
/* ==========================================================================
   main.js  —  Bootstrap. Wires the modules together and drives the overall
   flow: boot -> LOGIN -> desktop environment. Handles broadcasts, logout,
   server down/restart and random server messages.
   ========================================================================== */
(function (NW) {
  'use strict';

  var el = NW.util.el;

  function screen() { return document.getElementById('screen'); }
  function clearScreen() { var s = screen(); while (s.firstChild) s.removeChild(s.firstChild); }

  /* ---- phase: boot ---- */
  function phaseBoot() {
    clearScreen();
    if (NW.Settings.get('skipBootDefault')) { phaseLogin(); return; }
    var boot = el('div', { id: 'boot' });
    screen().appendChild(boot);
    NW.Boot.run(boot).then(phaseLogin);
  }

  /* ---- phase: login ---- */
  function phaseLogin() {
    clearScreen();
    var login = el('div', { id: 'login' });
    screen().appendChild(login);
    NW.data.server.markBoot();
    NW.Login.show(login).then(phaseDesktop);
  }

  /* ---- phase: desktop environment ---- */
  var randTimer = null;
  function phaseDesktop(user) {
    clearScreen();
    NW.loggedIn = true;
    NW.session = { user: user, tree: NW.data.server.tree, context: NW.data.nds.contextOf(user) };

    NW.MenuBar.init(screen());
    var desktop = el('div', { id: 'desktop' });
    screen().appendChild(desktop);
    NW.Console.init(desktop);
    NW.Console.refreshPrompt();
    NW.StatusBar.init(screen());

    // welcome banner in the console
    NW.Console.print('User ' + user.name + ' logged in to tree ' + NW.session.tree + '.', 'con-hi');
    NW.Console.print('Context: ' + NW.session.context, 'con-dim');
    NW.Console.print('');
    NW.Console.print('Good ' + greeting() + ', ' + (user.props.fullName || user.name) + '. The server console is ready.', 'con-ok');
    NW.Console.print('');
    NW.Console.focus();

    NW.bus.emit('log:add', { sev: 'info', src: 'SERVER', msg: 'Console session opened by ' + user.name + '.' });

    // random server messages easter egg
    if (randTimer) clearInterval(randTimer);
    randTimer = setInterval(function () {
      if (!NW.loggedIn) return;
      if (NW.util.chance(0.25)) {
        NW.bus.emit('broadcast', { from: NW.data.server.serverName,
          msg: NW.util.choice([
            'DS.NLM: replica synchronization completed.',
            'Volume DATA is now 82% full.',
            'Time is synchronized to the network.',
            'A new connection has been established.',
            'Backup session "Full" completed successfully.',
          ]), to: 'ALL', quiet: true });
      }
    }, 75000);
  }

  function greeting() { var h = new Date().getHours(); return h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'; }

  /* ---- broadcast banner ---- */
  var bcastTimer = null;
  NW.bus.on('broadcast', function (b) {
    var desktop = document.getElementById('desktop');
    if (!desktop) return;
    var old = document.querySelector('.broadcast-bar');
    if (old) old.remove();
    var bar = el('div', { class: 'broadcast-bar', text:
      'From ' + b.from + ' (station 1): ' + b.msg + '    (CTRL-ENTER to clear)' });
    desktop.appendChild(bar);
    if (!b.quiet) NW.Audio.alert();
    if (bcastTimer) clearTimeout(bcastTimer);
    bcastTimer = setTimeout(function () { if (bar.parentNode) bar.remove(); }, 7000);
    bar.addEventListener('click', function () { bar.remove(); });
  });

  /* ---- session / server lifecycle ---- */
  NW.bus.on('session:logout', function () {
    NW.loggedIn = false;
    if (randTimer) clearInterval(randTimer);
    phaseLogin();
  });
  NW.bus.on('server:restart', function () {
    NW.loggedIn = false;
    setTimeout(function () { location.reload(); }, 300);
  });
  NW.bus.on('server:down', function () {
    NW.loggedIn = false;
    if (randTimer) clearInterval(randTimer);
    clearScreen();
    var halt = el('div', { class: 'boot-screen' }, [
      el('div', { class: 'boot-line banner', text: 'The file server ACME_FS1 has been shut down.' }),
      el('div', { class: 'boot-line dim', text: 'All volumes have been dismounted and the cache flushed to disk.' }),
      el('div', { class: 'boot-line' }, []),
      el('div', { class: 'boot-line', text: 'It is now safe to turn off the server.' }),
      el('div', { class: 'boot-line' }, []),
      el('div', { class: 'boot-line boot-press', text: 'Press any key to restart the server...' }),
    ]);
    screen().appendChild(halt);
    function restart() { document.removeEventListener('keydown', restart); document.removeEventListener('click', restart); location.reload(); }
    setTimeout(function () { document.addEventListener('keydown', restart); document.addEventListener('click', restart); }, 400);
  });

  /* ---- go ---- */
  function init() {
    NW.State.load();
    NW.Settings.apply();
    NW.data.nds.hydrate();
    NW.data.logs.seed();
    NW.data.logs.start();
    NW.Monitor.start();
    NW.Theme.init();

    // unlock audio on first user gesture
    var unlock = function () { NW.Audio.unlock(); document.removeEventListener('pointerdown', unlock); document.removeEventListener('keydown', unlock); };
    document.addEventListener('pointerdown', unlock);
    document.addEventListener('keydown', unlock);

    phaseBoot();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(window.NW);

  </script>
