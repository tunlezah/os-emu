<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 8 (RTM, build 9200) — an interactive exhibit</title>
<meta name="description" content="A single-file, in-browser simulation of Windows 8 as it shipped in October 2012: Start screen, live tiles, charms, semantic zoom, Snap, and the desktop with the conspicuously empty corner.">
<style>
/* ==========================================================================
   WINDOWS 8 RTM (build 9200) — THE OS MUSEUM
   One file. No network. Flat. Completely flat.
   Anything that looks three-dimensional is a bug.
   ========================================================================== */
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; background:#000; overflow:hidden; }
body {
  font-family:"Segoe UI","Segoe UI Symbol","Helvetica Neue",Helvetica,Arial,sans-serif;
  color:#fff; -webkit-font-smoothing:antialiased;
  user-select:none; cursor:default;
}
button { font-family:inherit; }
input,textarea,select { font-family:inherit; }
.hidden { display:none !important; }

/* thin flat Metro scrollbars */
::-webkit-scrollbar { width:12px; height:12px; }
::-webkit-scrollbar-track { background:rgba(255,255,255,.06); }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.28); }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.45); }
.lightscroll ::-webkit-scrollbar-track, .lightscroll::-webkit-scrollbar-track { background:#f0f0f0; }
.lightscroll ::-webkit-scrollbar-thumb, .lightscroll::-webkit-scrollbar-thumb { background:#cdcdcd; }
.lightscroll ::-webkit-scrollbar-thumb:hover { background:#a6a6a6; }

/* ---------- stage & machine (1366x768 logical, scaled to fit) ---------- */
#stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
#machine {
  position:relative; width:1366px; height:768px; overflow:hidden; background:#000;
  transform-origin:center center;
}
#machine.res1024 { width:1024px; }

/* ==========================================================================
   BOOT / SHUTDOWN
   ========================================================================== */
#boot { position:absolute; inset:0; background:#000; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:60px; }
#boot .oem { font-size:44px; font-weight:200; letter-spacing:.06em; color:#e8e8e8; }
#boot .oem b { font-weight:600; }
#boot .oem small { display:block; text-align:center; font-size:13px; color:#666; letter-spacing:.35em; margin-top:8px; text-transform:uppercase; }
.ring { position:relative; width:56px; height:56px; }
.ring i { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:#fff;
  animation:orbit 2.1s cubic-bezier(.45,.05,.55,.95) infinite; }
@keyframes orbit { 0%{transform:rotate(0deg) translateY(-24px);} 100%{transform:rotate(360deg) translateY(-24px);} }
#off { position:absolute; inset:0; background:#000; z-index:210; display:none; align-items:center; justify-content:center; color:#333; font-weight:300; font-size:15px; cursor:pointer; }
#off.on { display:flex; }

/* ==========================================================================
   LOCK SCREEN
   ========================================================================== */
#lock { position:absolute; inset:0; z-index:190; overflow:hidden; cursor:pointer;
  transition:transform .38s cubic-bezier(.2,.7,.3,1); }
#lock.lift { transform:translateY(-100%); }
#lock .art { position:absolute; inset:0; }
#lock .lktime { position:absolute; left:64px; bottom:118px; font-size:110px; font-weight:200; line-height:1; text-shadow:none; }
#lock .lkdate { position:absolute; left:66px; bottom:70px; font-size:30px; font-weight:200; }
#lock .lkbadges { position:absolute; left:66px; bottom:24px; display:flex; gap:26px; align-items:center; font-size:15px; font-weight:400; opacity:.95; }
#lock .lkbadges .b { display:flex; gap:8px; align-items:center; }
#lock .lkbadges svg { display:block; }

/* ==========================================================================
   SIGN-IN
   ========================================================================== */
#signin { position:absolute; inset:0; z-index:185; display:none; flex-direction:column; align-items:center; justify-content:center; }
#signin.on { display:flex; }
#signin .who { display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:26px; }
#signin .avatar { width:128px; height:128px; }
#signin .uname { font-size:34px; font-weight:200; }
#signin .credrow { display:flex; align-items:center; gap:0; }
#signin input.pw {
  width:260px; padding:9px 12px; font-size:16px; border:2px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.12); color:#fff; outline:none;
}
#signin input.pw::placeholder { color:rgba(255,255,255,.6); font-style:italic; }
#signin input.pw:focus { background:#fff; color:#000; border-color:#fff; }
#signin .go { width:40px; height:42px; border:2px solid rgba(255,255,255,.55); border-left:none; background:rgba(255,255,255,.12);
  color:#fff; font-size:18px; cursor:pointer; }
#signin .go:hover { background:rgba(255,255,255,.3); }
#signin .siopts { margin-top:22px; font-size:14px; font-weight:300; }
#signin .siopts a { color:#fff; opacity:.75; cursor:pointer; text-decoration:none; margin:0 12px; }
#signin .siopts a:hover { opacity:1; text-decoration:underline; }
#signin .simsg { margin-top:18px; font-size:15px; font-weight:300; min-height:22px; }
#signin .hintline { position:absolute; bottom:22px; width:100%; text-align:center; font-size:12.5px; color:rgba(255,255,255,.45); }
/* picture password */
#ppwrap { position:relative; margin-top:4px; }
#ppwrap canvas { display:block; cursor:crosshair; }
#pinrow input { width:150px; text-align:center; letter-spacing:.5em; }

/* ==========================================================================
   OOBE (first run) + TUTORIAL
   ========================================================================== */
#oobe { position:absolute; inset:0; z-index:195; display:none; flex-direction:column; padding:70px 120px; }
#oobe.on { display:flex; }
#oobe h1 { font-size:44px; font-weight:200; margin-bottom:10px; }
#oobe .sub { font-size:16px; font-weight:300; opacity:.85; margin-bottom:36px; }
#oobe .swatches { display:flex; flex-wrap:wrap; gap:10px; max-width:640px; margin-bottom:34px; }
#oobe .swatches i { width:44px; height:44px; cursor:pointer; border:3px solid transparent; }
#oobe .swatches i.sel { border-color:#fff; }
#oobe label { display:block; font-size:14px; font-weight:300; margin-bottom:8px; }
#oobe input[type=text] { width:420px; padding:10px 12px; font-size:18px; border:2px solid rgba(255,255,255,.6); background:rgba(255,255,255,.14); color:#fff; outline:none; }
#oobe input[type=text]:focus { background:#fff; color:#000; }
#oobe .obtns { position:absolute; right:110px; bottom:64px; display:flex; gap:14px; }
.obtn { padding:10px 34px; font-size:15px; border:2px solid rgba(255,255,255,.7); background:transparent; color:#fff; cursor:pointer; }
.obtn:hover { background:rgba(255,255,255,.18); }
.obtn.primary { background:rgba(0,0,0,.25); }
#tutorial { position:absolute; inset:0; z-index:194; display:none; align-items:center; justify-content:center; flex-direction:column; }
#tutorial.on { display:flex; }
#tutorial .tuttext { font-size:42px; font-weight:200; margin-bottom:16px; }
#tutorial .tutsub { font-size:17px; font-weight:300; opacity:.8; margin-bottom:60px; }
#tutorial .demo { position:relative; width:520px; height:300px; border:2px solid rgba(255,255,255,.5); }
#tutorial .demo .dcorner { position:absolute; width:70px; height:70px; background:rgba(255,255,255,.22); opacity:0; }
#tutorial .demo .dcursor { position:absolute; left:46%; top:46%; animation:tutmove 4.5s ease-in-out infinite; }
@keyframes tutmove {
  0%,10% { left:46%; top:46%; } 30%,45% { left:2%; top:88%; }
  60%,70% { left:46%; top:46%; } 85%,100% { left:92%; top:2%; }
}
#tutorial .skipnote { position:absolute; bottom:30px; font-size:13px; opacity:.55; }

/* ==========================================================================
   START SCREEN
   ========================================================================== */
#start { position:absolute; inset:0; z-index:60; display:none; overflow:hidden; }
#start.on { display:block; }
#start .bgart { position:absolute; inset:0; }
#starthead { position:absolute; left:0; right:0; top:0; height:132px; z-index:5; display:flex; align-items:center; }
#starthead h1 { font-size:42px; font-weight:200; margin-left:116px; letter-spacing:.01em; }
#userchip { position:absolute; right:52px; top:44px; display:flex; align-items:center; gap:14px; cursor:pointer; z-index:6; }
#userchip .cname { text-align:right; font-weight:300; font-size:17px; line-height:1.25; }
#userchip .cname small { display:block; font-size:12px; opacity:.75; }
#userchip .avatar { width:48px; height:48px; }
#usermenu { position:absolute; right:52px; top:100px; background:#fff; color:#000; min-width:230px; z-index:80; display:none;
  border:1px solid #999; padding:4px 0; }
#usermenu.on { display:block; }
#usermenu div { padding:9px 18px; font-size:14px; cursor:pointer; }
#usermenu div:hover { background:var(--hi); color:#fff; }

#tilescroll { position:absolute; left:0; right:0; top:132px; bottom:12px; overflow-x:auto; overflow-y:hidden; z-index:4; }
#tilezone { position:relative; height:100%; display:flex; align-items:flex-start; padding:6px 116px 0 116px; gap:56px;
  transform-origin:0 40%; transition:transform .28s cubic-bezier(.2,.7,.3,1), opacity .28s; width:max-content; }
.tgroup { display:flex; flex-direction:column; }
.tgrouplabel { height:34px; font-size:15px; font-weight:300; opacity:.9; padding-left:2px; display:flex; align-items:flex-end; padding-bottom:8px; white-space:nowrap; }
.tgrid { position:relative; }
.tile {
  position:absolute; overflow:hidden; cursor:pointer; color:#fff;
  transition:transform .12s ease; outline:none;
}
.tile:active { transform:scale(.965); }
.tile.selmark { outline:3px solid #fff; outline-offset:-3px; }
.tile .selcheck { position:absolute; right:0; top:0; width:0; height:0; border-style:solid; border-width:0 34px 34px 0; border-color:transparent #fff transparent transparent; display:none; }
.tile .selcheck::after { content:"✓"; position:absolute; right:-31px; top:0px; color:#000; font-size:14px; font-weight:700; }
.tile.selmark .selcheck { display:block; }
.tileface { position:absolute; inset:0; padding:10px 12px; display:flex; flex-direction:column; }
.tileface .glyphbox { flex:1; display:flex; align-items:center; justify-content:center; }
.tileface .tname { font-size:12.5px; font-weight:400; }
.tile .face2 { transform:translateY(100%); }
.tile.flipping .face1 { animation:tslideout .45s cubic-bezier(.4,0,.6,1) forwards; }
.tile.flipping .face2 { animation:tslidein .45s cubic-bezier(.4,0,.6,1) forwards; }
@keyframes tslideout { to { transform:translateY(-100%); } }
@keyframes tslidein { from { transform:translateY(100%); } to { transform:translateY(0); } }
.tile .livebody { flex:1; display:flex; flex-direction:column; justify-content:flex-start; overflow:hidden; }
.tile .livebody.center { justify-content:center; align-items:center; }
/* entrance animation */
#tilezone.enter .tile { animation:tilein .5s cubic-bezier(.16,.84,.36,1) backwards; }
@keyframes tilein { from { opacity:0; transform:translateX(320px); } to { opacity:1; transform:translateX(0); } }

/* semantic zoom */
#start.zoomed #tilezone { cursor:pointer; }
#zoombtn { position:absolute; right:8px; bottom:8px; width:26px; height:26px; z-index:7; background:rgba(128,128,128,.35);
  border:1px solid rgba(255,255,255,.35); color:#fff; font-size:14px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
#zoombtn:hover { background:rgba(128,128,128,.6); }
.zoomlabel { display:none; }
#start.zoomed .tgrouplabel { font-size:26px; font-weight:200; }

/* start app bar */
.appbar { position:absolute; left:0; right:0; z-index:85; background:#1d1d1d; display:none; padding:12px 26px;
  align-items:center; gap:8px; }
.appbar.on { display:flex; }
.appbar.bottom { bottom:0; min-height:88px; }
.appbar.top { top:0; min-height:88px; }
.abbtn { background:none; border:none; color:#fff; display:flex; flex-direction:column; align-items:center; gap:7px;
  font-size:12px; cursor:pointer; padding:4px 12px; min-width:76px; }
.abbtn .cir { width:44px; height:44px; border:2.5px solid #fff; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.abbtn:hover .cir { background:rgba(255,255,255,.18); }
.abbtn:active .cir { background:#fff; color:#1d1d1d; }
.abbtn[disabled] { opacity:.4; cursor:default; }
.absep { width:1px; height:56px; background:rgba(255,255,255,.25); margin:0 10px; }
.abspring { flex:1; }

/* ==========================================================================
   ALL APPS + SEARCH
   ========================================================================== */
#allapps, #searchview { position:absolute; inset:0; z-index:62; display:none; overflow:hidden; }
#allapps.on, #searchview.on { display:block; }
#allapps h1, #searchview h1 { position:absolute; top:44px; left:116px; font-size:38px; font-weight:200; z-index:2; }
#allappsscroll { position:absolute; left:0; right:0; top:130px; bottom:10px; overflow-x:auto; overflow-y:hidden; }
#allappsrow { display:flex; gap:64px; padding:10px 116px; height:100%; width:max-content; }
.aacol { display:flex; flex-direction:column; gap:4px; }
.aacolhead { font-size:17px; font-weight:300; margin-bottom:10px; }
.aaitem { display:flex; align-items:center; gap:10px; width:246px; padding:7px 8px; cursor:pointer; }
.aaitem:hover { background:rgba(255,255,255,.12); }
.aaitem.selmark { outline:2.5px solid #fff; }
.aaitem .mini { width:38px; height:38px; flex:none; display:flex; align-items:center; justify-content:center; }
.aaitem span { font-size:13.5px; font-weight:400; }
.aawrap { display:flex; flex-direction:column; flex-wrap:wrap; height:100%; gap:0 12px; align-content:flex-start; }

#searchview { background:#1d1d1d; }
#searchresults { position:absolute; left:0; right:346px; top:130px; bottom:0; overflow:auto; padding:10px 40px 20px 116px; }
#searchpane { position:absolute; right:0; top:0; bottom:0; width:346px; background:#252525; padding:34px 30px; }
#searchpane input { width:100%; padding:9px 10px; font-size:16px; border:2px solid #888; background:#fff; color:#000; outline:none; }
#searchpane .scopes { margin-top:30px; }
#searchpane .scope { padding:9px 6px; font-size:16px; font-weight:300; cursor:pointer; color:#bbb; display:flex; justify-content:space-between; }
#searchpane .scope:hover { color:#fff; }
#searchpane .scope.sel { color:#fff; font-weight:600; }
#searchpane .scopeapps { margin-top:24px; border-top:1px solid #3a3a3a; padding-top:16px; max-height:340px; overflow:auto; }
#searchpane .scopeapp { display:flex; gap:10px; align-items:center; padding:7px 6px; font-size:13.5px; color:#bbb; cursor:pointer; }
#searchpane .scopeapp:hover { color:#fff; background:rgba(255,255,255,.07); }
.sresult { display:flex; gap:12px; align-items:center; width:300px; padding:9px 10px; cursor:pointer; float:left; margin:0 14px 10px 0; }
.sresult:hover { background:rgba(255,255,255,.1); }
.sresult .mini { width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center; }
.sresult .t { font-size:14px; }
.sresult .t small { display:block; font-size:11.5px; opacity:.6; }
.snone { font-size:15px; font-weight:300; opacity:.7; padding-top:8px; }

/* ==========================================================================
   CHARMS
   ========================================================================== */
#charmghost { position:absolute; right:0; top:0; bottom:0; width:86px; z-index:118; display:none; flex-direction:column; justify-content:center; gap:34px; align-items:center; }
#charmghost.on { display:flex; }
#charmghost .cg { opacity:.55; }
#charms { position:absolute; right:0; top:0; bottom:0; width:86px; background:#111; z-index:120; display:none;
  flex-direction:column; justify-content:center; gap:6px; align-items:center; }
#charms.on { display:flex; }
.charm { width:86px; padding:12px 0 10px; display:flex; flex-direction:column; align-items:center; gap:6px; color:#fff;
  font-size:11.5px; cursor:pointer; background:none; border:none; }
.charm:hover { background:#2a2a2a; }
.charm:active { background:var(--hi); }
.charm.startcharm svg { fill:var(--hi); }
.charm.startcharm:hover svg { fill:#fff; }
#charmclock { position:absolute; left:36px; bottom:36px; z-index:120; display:none; background:#000; padding:18px 28px 16px 22px; }
#charmclock.on { display:block; }
#charmclock .cctime { font-size:64px; font-weight:200; line-height:1; }
#charmclock .ccdate { font-size:19px; font-weight:300; margin-top:6px; opacity:.9; display:flex; align-items:center; gap:18px; }
#charmclock .ccbadges { display:flex; gap:14px; margin-top:10px; }

/* charm flyouts (settings/devices/share/search-in-app) */
.flyout { position:absolute; right:0; top:0; bottom:0; width:346px; background:#f2f2f2; color:#111; z-index:130; display:none;
  padding:0; }
.flyout.dark { background:#1f1f1f; color:#fff; }
.flyout.on { display:block; }
.flyhead { display:flex; align-items:center; gap:12px; padding:28px 30px 18px; }
.flyhead .back { font-size:20px; cursor:pointer; border:2px solid transparent; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; }
.flyhead .back:hover { background:rgba(0,0,0,.08); }
.flyout.dark .flyhead .back:hover { background:rgba(255,255,255,.14); }
.flyhead h2 { font-size:26px; font-weight:200; flex:1; }
.flyhead small { font-size:12px; opacity:.6; }
.flybody { padding:0 30px 20px; overflow:auto; position:absolute; top:78px; bottom:0; left:0; right:0; }
.flylink { padding:8px 0; font-size:14.5px; color:#2a5db0; cursor:pointer; }
.flyout.dark .flylink { color:#9ecbff; }
.flylink:hover { text-decoration:underline; }
.flysec { font-size:13px; font-weight:600; margin:18px 0 6px; opacity:.75; }
.sysrow { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px 8px; position:absolute; bottom:86px; left:30px; right:30px; }
.sysitem { display:flex; flex-direction:column; align-items:flex-start; gap:8px; font-size:12.5px; cursor:pointer; padding:6px; }
.sysitem:hover { background:rgba(255,255,255,.09); }
.flyout:not(.dark) .sysitem:hover { background:rgba(0,0,0,.06); }
.pclink { position:absolute; bottom:30px; left:30px; font-size:14.5px; cursor:pointer; }
.pclink:hover { text-decoration:underline; }
.powermenu { position:absolute; background:#fff; color:#000; border:1px solid #888; min-width:150px; z-index:140; }
.powermenu div { padding:8px 16px; font-size:14px; cursor:pointer; }
.powermenu div:hover { background:var(--hi); color:#fff; }
/* volume/brightness slider flyout bits */
.vslider { width:100%; margin:10px 0 4px; }
.togglerow { display:flex; justify-content:space-between; align-items:center; padding:10px 0; font-size:14px; }
.mtoggle { width:74px; height:24px; position:relative; cursor:pointer; flex:none; }
.mtoggle .rail { position:absolute; inset:0; border:2px solid #999; }
.mtoggle .fillz { position:absolute; left:2px; top:2px; bottom:2px; width:0; background:var(--hi); }
.mtoggle.onn .fillz { width:calc(100% - 4px); }
.mtoggle .knob { position:absolute; top:-3px; bottom:-3px; width:22px; left:-2px; background:#000; border:1px solid #fff; }
.mtoggle.onn .knob { left:calc(100% - 20px); }
.flyout.dark .mtoggle .knob { background:#fff; border-color:#000; }
.mtoggle .lab { position:absolute; top:30px; font-size:12px; }

/* ==========================================================================
   HOT CORNERS, START PREVIEW, SWITCHER, WIN+X
   ========================================================================== */
.hotzone { position:absolute; z-index:150; }
#hz-br { right:0; bottom:0; width:14px; height:14px; }
#hz-tr { right:0; top:0; width:14px; height:14px; }
#hz-bl { left:0; bottom:0; width:14px; height:14px; }
#hz-tl { left:0; top:0; width:14px; height:14px; }
#hz-redge { right:0; top:120px; bottom:120px; width:3px; }
#hz-ledge { left:0; top:120px; bottom:120px; width:3px; }
#startpreview { position:absolute; left:0; bottom:0; width:200px; height:120px; z-index:119; display:none; cursor:pointer;
  border:2px solid rgba(255,255,255,.6); overflow:hidden; background:#000; }
#startpreview.on { display:block; }
#startpreview .spbg { position:absolute; inset:0; }
#startpreview .splabel { position:absolute; left:8px; bottom:6px; font-size:13px; font-weight:600; z-index:2; }
#startpreview .spminitiles { position:absolute; left:10px; top:10px; display:grid; grid-template-columns:repeat(4,26px); gap:3px; }
#startpreview .spminitiles i { height:26px; }
#prevpeek { position:absolute; left:0; top:0; width:200px; height:120px; z-index:119; display:none; cursor:pointer;
  border:2px solid rgba(255,255,255,.6); background:#161616; overflow:hidden; }
#prevpeek.on { display:block; }
.thumbcard { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.thumbcard .tlabel { font-size:12.5px; opacity:.9; }
#switcher { position:absolute; left:0; top:0; bottom:0; width:118px; background:#111; z-index:125; display:none;
  flex-direction:column; padding:10px 10px; gap:10px; }
#switcher.on { display:flex; }
#switcher .sthumb { width:98px; height:74px; position:relative; cursor:pointer; border:1px solid #333; overflow:hidden; flex:none; }
#switcher .sthumb:hover { border-color:#888; }
#switcher .spring { flex:1; }
#winx { position:absolute; left:0; bottom:0; background:#f0f0f0; color:#000; z-index:160; display:none; border:1px solid #999;
  min-width:250px; font-size:13px; padding:3px 0; }
#winx.on { display:block; }
#winx div { padding:6px 22px; cursor:pointer; }
#winx div:hover { background:var(--hi); color:#fff; }
#winx hr { border:none; border-top:1px solid #ccc; margin:3px 0; }

/* alt-tab */
#alttab { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#1d1d1d; border:1px solid #444;
  z-index:170; display:none; padding:18px; max-width:900px; }
#alttab.on { display:flex; flex-wrap:wrap; gap:10px; }

/* Background "tattoo" patterns — original geometric designs in the era's style. */
function startBgSVG(patIdx, scheme) {
  const { bg, hi } = scheme;
  const soft = "rgba(255,255,255,0.055)", soft2 = "rgba(255,255,255,0.09)";
  let art = "";
  switch (patIdx) {
    case 1: // curling fronds along the right edge
      art = '<g fill="none" stroke="'+soft2+'" stroke-width="10">'
          + '<path d="M1290 768 C 1240 560, 1330 430, 1200 300 S 1080 120, 1160 0"/>'
          + '<path d="M1366 620 C 1250 600, 1210 480, 1260 380 S 1350 260, 1300 160"/>'
          + '<circle cx="1235" cy="330" r="42"/><circle cx="1235" cy="330" r="18"/>'
          + '<circle cx="1290" cy="560" r="26"/></g>';
      break;
    case 2: // scattered triangles, lower-left
      art = '<g fill="'+soft+'">' + [ [60,700,120],[220,740,80],[150,600,60],[330,690,100],[40,560,44],[430,740,60] ]
          .map(t => '<path d="M'+t[0]+' '+t[1]+' l'+t[2]+' 0 l-'+(t[2]/2)+' -'+(t[2]*0.87)+' z"/>').join("") + '</g>';
      break;
    case 3: // concentric quarter circles, bottom-right
      art = '<g fill="none" stroke="'+soft+'" stroke-width="26">'
          + [140,240,340,440,540].map(r => '<circle cx="1366" cy="768" r="'+r+'"/>').join("") + '</g>';
      break;
    case 4: // diagonal ribbons
      art = '<g fill="'+soft+'" transform="rotate(-18 683 384)">'
          + '<rect x="-100" y="120" width="1600" height="34"/><rect x="-100" y="200" width="1600" height="12"/>'
          + '<rect x="-100" y="560" width="1600" height="50"/><rect x="-100" y="640" width="1600" height="16"/></g>';
      break;
    case 5: // dot field, upper-right
      { let dots = "";
        for (let i = 0; i < 60; i++) {
          const x = 900 + ((i*173)%460), y = ((i*97)%300) + 20, r = 3 + (i%4)*2.2;
          dots += '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+soft2+'"/>';
        }
        art = dots; }
      break;
    case 6: // big translucent bloom, right
      art = '<g fill="none" stroke="'+soft2+'" stroke-width="8">'
          + '<path d="M1180 768 q -40 -180 90 -260 q 130 -80 96 -240"/>'
          + [[1270,508,60],[1270,508,95],[1366,268,70]].map(c=>'<ellipse cx="'+c[0]+'" cy="'+c[1]+'" rx="'+c[2]+'" ry="'+(c[2]*0.55)+'" transform="rotate(-30 '+c[0]+' '+c[1]+')"/>').join("")
          + '</g>';
      break;
    default: art = ""; // plain
  }
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768">'
    + '<rect width="1366" height="768" fill="'+bg+'"/>' + art + '</svg>';
  return "url('data:image/svg+xml;utf8," + encodeURIComponent(svg) + "')";
}

/* Simulated photo library — every picture generated. */
function photoSVG(seed, w, h) {
  w = w || 300; h = h || 200;
  const rnd = (function(s){ return function(){ s=(s*9301+49297)%233280; return s/233280; }; })(seed*7919+13);
  const skies = ["#7ec8e8","#f5c87a","#c8d8e8","#e89a7a","#a8c8f0","#d8c8f0"];
  const grounds = ["#7fb069","#c8a05a","#5a8a5a","#8a7a5a","#6a9a8a","#b0906a"];
  const sky = skies[Math.floor(rnd()*skies.length)], gr = grounds[Math.floor(rnd()*grounds.length)];
  let s = '<rect width="'+w+'" height="'+h+'" fill="'+sky+'"/>';
  s += '<circle cx="'+(rnd()*w)+'" cy="'+(rnd()*h*0.3)+'" r="'+(12+rnd()*18)+'" fill="#fff8e0" opacity=".9"/>';
  for (let i=0;i<3;i++) s += '<ellipse cx="'+(rnd()*w)+'" cy="'+(rnd()*h*0.35)+'" rx="'+(20+rnd()*40)+'" ry="'+(8+rnd()*10)+'" fill="#fff" opacity=".7"/>';
  const horizon = h*0.55 + rnd()*h*0.2;
  if (rnd() < 0.5) { // mountains
    for (let i=0;i<3;i++){ const px=rnd()*w, pw=60+rnd()*120;
      s += '<path d="M'+(px-pw)+' '+horizon+' L'+px+' '+(horizon-40-rnd()*70)+' L'+(px+pw)+' '+horizon+' z" fill="#5a6a7a" opacity=".85"/>'; }
  }
  s += '<rect y="'+horizon+'" width="'+w+'" height="'+(h-horizon)+'" fill="'+gr+'"/>';
  for (let i=0;i<4;i++){ const tx=rnd()*w, ty=horizon+rnd()*(h-horizon)*0.6;
    s += '<line x1="'+tx+'" y1="'+(ty+18)+'" x2="'+tx+'" y2="'+ty+'" stroke="#5a4a3a" stroke-width="3"/><circle cx="'+tx+'" cy="'+(ty-6)+'" r="'+(8+rnd()*8)+'" fill="#3a6428"/>'; }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+s+'</svg>';
}
function photoURI(seed, w, h) { return "url('data:image/svg+xml;utf8," + encodeURIComponent(photoSVG(seed,w,h)) + "')"; }

/* ==========================================================================
   SOUND MANAGER — synthesized, in the era's spirit, toggleable
   ========================================================================== */
const Snd = {
  ctx: null,
  ac() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  tone(freq, t0, dur, type, gain, ctx) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain || 0.12, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  play(name) {
    if (!S.soundOn) return;
    const ctx = this.ac(); if (!ctx) return;
    const t = ctx.currentTime;
    switch (name) {
      case "startup": // a rising four-note flourish
        [[392,0,.5],[523.25,.13,.5],[659.25,.26,.55],[783.99,.4,.9]].forEach(n => this.tone(n[0], t+n[1], n[2], "sine", .1, ctx));
        break;
      case "chime": this.tone(880, t, .18, "sine", .09, ctx); this.tone(1318.5, t+.09, .3, "sine", .08, ctx); break;
      case "error": this.tone(311, t, .22, "square", .05, ctx); this.tone(233, t+.12, .3, "square", .05, ctx); break;
      case "warn": this.tone(587, t, .18, "triangle", .08, ctx); this.tone(587, t+.2, .18, "triangle", .08, ctx); break;
      case "whoosh": { const o=ctx.createOscillator(),g=ctx.createGain();
        o.type="sawtooth"; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(900,t+.16);
        g.gain.setValueAtTime(.03,t); g.gain.exponentialRampToValueAtTime(.0001,t+.2);
        o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+.25); break; }
      case "launch": this.tone(523.25, t, .12, "sine", .07, ctx); this.tone(783.99, t+.06, .18, "sine", .06, ctx); break;
      case "lock": this.tone(659.25, t, .15, "sine", .08, ctx); this.tone(440, t+.1, .25, "sine", .07, ctx); break;
      case "note": this.tone(1046.5, t, .1, "sine", .06, ctx); break;
    }
  }
};

/* ==========================================================================
   ERROR MANAGER — the sad face, and what comes after
   ========================================================================== */
const Err = {
  stopCodes: ["HAL_INITIALIZATION_FAILED","CRITICAL_PROCESS_DIED","KERNEL_SECURITY_CHECK_FAILURE",
    "SYSTEM_THREAD_EXCEPTION_NOT_HANDLED","EXHIBIT_VISITOR_INDUCED_FAULT","PAGE_FAULT_IN_NONPAGED_AREA"],
  bsod(code) {
    const b = $("#bsod");
    b.innerHTML = '<div class="sad">:(</div>'
      + '<div class="msg">Your PC ran into a problem and needs to restart. We’re just collecting some error info, and then we’ll restart for you.</div>'
      + '<div class="pct">(<span id="bsodpct">0</span>% complete)</div>'
      + '<div class="stop">If you’d like to know more, you can search online later for this error: '
      + (code || pick(this.stopCodes)) + '</div>';
    b.classList.add("on");
    Snd.play("error");
    S.crashed = true; State.save();
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random() < 0.3 ? 0 : Math.ceil(rand(2, 14));
      if (p >= 100) { p = 100; clearInterval(iv);
        setTimeout(() => { b.classList.remove("on"); Boot.powerOn(); }, 900); }
      const n = $("#bsodpct"); if (n) n.textContent = p;
    }, 550);
  },
  maybeRandom() { // vanishingly rare, as promised
    if (Math.random() < 0.0005) { setTimeout(() => this.bsod(), rand(400, 1500)); return true; }
    return false;
  },
  repair(cb) {
    const r = $("#repair");
    r.innerHTML = '<div class="ring">' + '<i style="animation-delay:0s"></i>'.repeat(1) + '</div>';
    r.innerHTML = '<h1>Automatic Repair</h1>'
      + '<div style="font-size:15px;font-weight:300;opacity:.85;max-width:520px;text-align:center">Automatic Repair couldn’t repair your PC — because, happily, there is nothing wrong with it. Press Continue to keep visiting the exhibit, or choose an advanced option.</div>'
      + '<div class="rbox">'
      + '<button class="rbtn" id="rcont"><b>Continue</b><small>Exit and continue to Windows 8</small></button>'
      + '<button class="rbtn" id="rrefresh"><b>Refresh your PC</b><small>Your files and personalization settings won’t change</small></button>'
      + '<button class="rbtn" id="rreset"><b>Reset your PC</b><small>All of your personal files and apps will be removed</small></button>'
      + '</div>';
    r.classList.add("on");
    $("#rcont").onclick = () => { r.classList.remove("on"); cb(); };

      r.innerHTML = '<h1>Refreshing your PC</h1><div class="ring"><i></i></div>';
      setTimeout(() => { r.classList.remove("on"); Toast.show("Refresh complete", "Your PC has been refreshed. Nothing was actually wrong with it.", {icon:"refresh"}); cb(); }, 2200);
    };
    $("#rreset").onclick = () => Boot.confirmReset(() => { r.classList.remove("on"); cb(); });

};

/* ==========================================================================
   BOOT / LOCK / SIGN-IN MANAGER

const Boot = {
  powered: true,
  powerOn() {
    S.counters.boots++; if (!S.counters.sessionStart) S.counters.sessionStart = Date.now();
    State.save();
    $("#off").classList.remove("on");
    const b = $("#boot");
    b.classList.remove("hidden");

    b.innerHTML = '<div class="oem"><b>MERIDIAN</b> Systems<small>ultrabook series</small></div>'
      + '<div class="ring">' + Array.from({length:6}, (_,i) =>
        '<i style="animation-delay:' + (i * 0.16) + 's"></i>').join("") + '</div>';
    const proceed = () => {
      b.style.display = "none";
      if (S.crashed) { S.crashed = false; State.save(); Err.repair(() => Lock.show()); }
      else Lock.show();
    };
    setTimeout(proceed, 2400); // fast boot was the point
  },
  shutdown(restart) {
    Snd.play("lock");
    Shell.hideAll();
    const b = $("#boot");
    b.style.display = "flex";
    b.innerHTML = '<div style="font-size:20px;font-weight:200">' + (restart ? "Restarting" : "Shutting down") + '</div>'
      + '<div class="ring">' + Array.from({length:6},(_,i)=>'<i style="animation-delay:'+(i*0.16)+'s"></i>').join("") + '</div>';
    setTimeout(() => {
      b.style.display = "none";
      if (restart) this.powerOn();
      else {
        const off = $("#off");
        let msg = "The PC is off  ·  click anywhere to press the power button";

          msg += "<br><br><span style='font-size:12.5px;color:#555'>For the record: it took you <b>" + S.counters.clicksAtShutdownFound
              + " clicks</b> to find the shutdown command. It lives behind Settings, under Power, inside a bar summoned from an invisible edge. This is not your fault.</span>";
          S.counters.shutdownStory = true; State.save();
        }
        off.innerHTML = "<span style='text-align:center;line-height:1.7'>" + msg + "</span>";
        off.classList.add("on");
        off.onclick = () => this.powerOn();

  },
  confirmReset(cancelCb) {
    // Styled as "Reset your PC", with the authentic warning.
    const r = $("#repair");
    r.classList.add("on");
    r.innerHTML = '<h1>Reset your PC</h1>'
      + '<div style="font-size:15px;font-weight:300;max-width:520px;text-align:center;line-height:1.6">Here’s what will happen:<br>• All your personal files and apps will be removed.<br>• Your PC settings will be changed back to their defaults.<br><br>(In museum terms: the exhibit’s saved state — tiles, colours, files, counters — is erased and the first-run experience begins again.)</div>'
      + '<div class="rbox"><button class="rbtn" id="rgo"><b>Reset</b></button>'
      + '<button class="rbtn" id="rcancel"><b>Cancel</b></button></div>';
    $("#rgo").onclick = () => {
      r.innerHTML = '<h1>Resetting your PC</h1><div class="ring"><i></i><i style="animation-delay:.16s"></i><i style="animation-delay:.32s"></i></div>';
      setTimeout(() => State.reset(), 1800);

const Lock = {
  timer: null,
  show() {
    const L = $("#lock");
    L.classList.remove("hidden", "lift");
    L.style.display = "block";
    L.innerHTML = '<div class="art"></div>'
      + '<div class="lktime" id="lktime"></div><div class="lkdate" id="lkdate"></div>'
      + '<div class="lkbadges">'
      + '<span class="b">' + Icons.svg("net", 22) + '</span>'
      + '<span class="b">' + Icons.svg("battery", 24) + ' <span style="font-size:13px">86%</span></span>'
      + '<span class="b">' + Icons.svg("mail", 22) + ' 4</span>'
      + '<span class="b">' + Icons.svg("msg", 20) + ' 2</span>'
      + '</div>';
    L.querySelector(".art").style.background = lockArtSVG(S.lockArt) + " center/cover";
    const tick = () => { const d = now();
      const t = $("#lktime"), dt = $("#lkdate");
      if (t) t.textContent = fmtTime(d).replace(/ [AP]M/, "");
      if (dt) dt.textContent = fmtDate(d);
    };
    tick(); clearInterval(this.timer); this.timer = setInterval(tick, 1000);
    // dismiss: click, drag up, or any key
    let dragY = null;
    L.onpointerdown = e => { dragY = e.clientY; };
    L.onpointermove = e => {
      if (dragY !== null && dragY - e.clientY > 8) {
        L.style.transition = "none";
        L.style.transform = "translateY(" + Math.min(0, (e.clientY - dragY) / Machine.scale) + "px)";
      }
    };
    L.onpointerup = e => {
      if (dragY === null) return;
      const moved = dragY - e.clientY;
      L.style.transition = "";
      if (moved > 60 / Machine.scale || moved < 8) this.dismiss(); // big drag, or a plain click
      else L.style.transform = "";
      dragY = null;
    };
    this.keyHandler = e => { if (!e.metaKey && !e.ctrlKey && !e.altKey) this.dismiss(); };
    addEventListener("keydown", this.keyHandler, { once: false });
    this.active = true;
  },
  dismiss() {
    if (!this.active) return;
    this.active = false;
    removeEventListener("keydown", this.keyHandler);
    const L = $("#lock");
    L.style.transform = ""; L.classList.add("lift");
    Snd.play("whoosh");
    setTimeout(() => { L.style.display = "none"; clearInterval(this.timer);
      if (S.firstRun) OOBE.start(); else SignIn.show();
    }, 400);
  },
  lockNow() {
    Shell.hideAll();
    this.show();
  }
};

/* ==========================================================================
   PICTURE PASSWORD — taps, lines and circles over a photo. The novel one.
   ========================================================================== */
class PPCanvas {
  constructor(host, w, h, artIdx) {
    this.w = w; this.h = h;
    this.cv = el("canvas"); this.cv.width = w; this.cv.height = h;
    host.appendChild(this.cv);
    this.ctx = this.cv.getContext("2d");
    this.artIdx = artIdx;
    this.img = new Image();
    this.img.onload = () => this.redraw();
    this.img.src = "data:image/svg+xml;utf8," + encodeURIComponent(
      lockArtSVG(artIdx).slice(27, -2).replace(/^url\('/, "")); // reuse lock art
    // simpler: draw fresh
    const svg = lockArtSVG(artIdx).match(/url\('(.*)'\)/)[1];
    this.img.src = svg;
    this.strokes = [];
    this.onGesture = null;
    let path = null;
    this.cv.onpointerdown = e => { const p = this.pt(e); path = [p]; this.cv.setPointerCapture(e.pointerId); };
    this.cv.onpointermove = e => { if (path) { path.push(this.pt(e)); this.redraw(path); } };
    this.cv.onpointerup = e => {
      if (!path) return;
      const g = this.classify(path); path = null;
      if (g && this.onGesture) this.onGesture(g);
    };
  }
  pt(e) { const r = this.cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (this.w / r.width), y: (e.clientY - r.top) * (this.h / r.height) }; }
  classify(path) {
    const a = path[0], b = path[path.length - 1];
    let len = 0;
    for (let i = 1; i < path.length; i++) len += Math.hypot(path[i].x - path[i-1].x, path[i].y - path[i-1].y);
    const direct = Math.hypot(b.x - a.x, b.y - a.y);
    if (len < 14) return { t: "tap", x: a.x, y: a.y };
    if (direct < 46 && len > 90) { // returned near start after travelling: a circle
      let cx = 0, cy = 0; path.forEach(p => { cx += p.x; cy += p.y; });
      return { t: "circle", x: cx / path.length, y: cy / path.length, r: len / (2 * Math.PI) };
    }
    return { t: "line", x: a.x, y: a.y, x2: b.x, y2: b.y };
  }
  redraw(activePath) {
    const c = this.ctx;
    c.clearRect(0, 0, this.w, this.h);
    if (this.img.complete) c.drawImage(this.img, 0, 0, this.w, this.h);
    c.strokeStyle = "rgba(255,255,255,.9)"; c.fillStyle = "rgba(255,255,255,.9)"; c.lineWidth = 4;
    this.strokes.forEach(g => this.drawGesture(g));
    if (activePath && activePath.length > 1) {
      c.beginPath(); c.moveTo(activePath[0].x, activePath[0].y);
      activePath.forEach(p => c.lineTo(p.x, p.y)); c.stroke();
    }
  }
  drawGesture(g) {
    const c = this.ctx;
    if (g.t === "tap") { c.beginPath(); c.arc(g.x, g.y, 9, 0, 7); c.fill(); }
    else if (g.t === "circle") { c.beginPath(); c.arc(g.x, g.y, g.r || 40, 0, 7); c.stroke(); }
    else { c.beginPath(); c.moveTo(g.x, g.y); c.lineTo(g.x2, g.y2); c.stroke();
      const ang = Math.atan2(g.y2 - g.y, g.x2 - g.x);
      c.beginPath(); c.moveTo(g.x2, g.y2);
      c.lineTo(g.x2 - 14 * Math.cos(ang - 0.45), g.y2 - 14 * Math.sin(ang - 0.45));
      c.lineTo(g.x2 - 14 * Math.cos(ang + 0.45), g.y2 - 14 * Math.sin(ang + 0.45));
      c.fill(); }
  }
}
function gesturesMatch(stored, tried) {
  if (!stored || stored.length !== tried.length) return false;
  const TOL = 70;
  return stored.every((g, i) => {
    const t = tried[i];
    if (g.t !== t.t) return false;
    if (Math.hypot(g.x - t.x, g.y - t.y) > TOL) return false;
    if (g.t === "line" && Math.hypot(g.x2 - t.x2, g.y2 - t.y2) > TOL) return false;
    return true;
  });
}

const SignIn = {

      + '</div>' + cred

      + '<div class="siopts hidden" id="siOptRow">' + opts.join("") + '</div>'

      const tried = [];
      pp.onGesture = g => {
        tried.push(g); pp.strokes.push(g); pp.redraw();
        if (tried.length === 3) {
          if (gesturesMatch(S.picpw.gestures, tried)) this.success();

        }
      };
    } else {
      const pw = $("#siPw");
      pw.focus();
      const attempt = () => {
        const v = pw.value;

        else this.fail(this.mode === "password" ? "The password is incorrect. Try again." : "The PIN is incorrect. Try again.",

      setTimeout(() => this.render(), 1600);
      return;
    }

  },
  success() {
    this.fails = 0;
    $("#signin").classList.remove("on");
    Snd.play("startup");
    Shell.enterStart(true);
  }
};

/* ==========================================================================
   MODERN APP REGISTRY — metadata; each app's render() lives further down.
   Two frameworks in this file, on purpose. This is the Modern one.
   ========================================================================== */
const MApps = {}; // id -> def
function defineApp(def) { MApps[def.id] = def; }

/* ==========================================================================
   SHELL — coordinates the three worlds: Start, Modern apps, and the Desktop.
   ========================================================================== */
const Shell = {
  view: null, // 'start' | 'app' | 'desktop'
  enterStart(animate) {
    Charms.close(); WinX.close(); SearchUI.close(); AllApps.close();
    $("#desktop").classList.remove("on");
    $("#mhost").classList.toggle("on", !!Modern.snap); // keep a snapped app visible beside Start
    Modern.hideAllApps(true);
    const st = $("#start");
    st.classList.add("on");
    Start.applyTheme();
    Start.layoutForSnap();
    if (animate) {
      $("#tilezone").classList.add("enter");
      setTimeout(() => $("#tilezone").classList.remove("enter"), 900);
    }
    this.view = "start";
    Start.clearSelection();
  },
  showDesktop() {
    Charms.close(); WinX.close(); SearchUI.close(); AllApps.close();
    $("#start").classList.remove("on");
    Modern.hideAllApps(true);
    $("#mhost").classList.toggle("on", !!Modern.snap);
    const d = $("#desktop");
    d.classList.add("on");
    Modern.touch("desktop");
    Desktop.layoutForSnap();
    this.view = "desktop";
  },
  showApp(inst) {
    Charms.close(); WinX.close(); SearchUI.close(); AllApps.close();
    $("#start").classList.remove("on");
    if (Modern.snap && (Modern.snap.app === inst || inst === Modern.mainApp)) { /* fine */ }
    $("#desktop").classList.remove("on");
    $("#mhost").classList.add("on");
    Modern.foreground(inst);
    this.view = "app";
  },
  toggleStart() {
    if (this.view === "start") {
      // Start toggles back to what you were doing
      const prev = Modern.stack.find(x => x !== "start");
      if (prev === "desktop") this.showDesktop();
      else if (prev) this.showApp(prev);
      else this.showDesktop();
    } else this.enterStart();
    Snd.play("whoosh");
  },
  hideAll() {
    ["#start","#desktop","#mhost","#allapps","#searchview"].forEach(s => $(s).classList.remove("on"));
    Charms.close(); WinX.close();
    Modern.reset();
  },
  contextName() {
    if (this.view === "desktop") return "Desktop";
    if (this.view === "app" && Modern.current) return Modern.current.def.name;
    return "Start";
  }
};

/* ==========================================================================
   MODERN — app lifecycle, suspension, the MRU stack, and Snap
   ========================================================================== */
const Modern = {
  instances: new Map(), // id -> instance
  stack: [],            // MRU of instance objects + the string 'desktop'
  current: null,
  snap: null,           // { app: instance|'desktop', side: 'left'|'right' }
  mainApp: null,        // what fills the rest while snapped

  reset() { this.instances.forEach(i => i.el.remove()); this.instances.clear(); this.stack = []; this.current = null; this.snap = null; this.mainApp = null; $("#snapdiv").classList.remove("on"); },

  touch(x) {
    this.stack = this.stack.filter(s => s !== x);
    this.stack.unshift(x);
  },

  launch(id, opts) {
    const def = MApps[id];
    if (!def) return;
    if (def.id === "desktop") { Shell.showDesktop(); return; }
    S.counters.appLaunches++; State.save();
    Err.maybeRandom();
    let inst = this.instances.get(id);
    if (!inst) {
      const host = el("div", "mapp");
      host.style.background = def.bgColor || "#1d1d1d";
      $("#mhost").appendChild(host);
      inst = { id, def, el: host, status: "running", cpu: rand(0.5, 4), mem: rand(28, 140), started: Date.now() };
      this.instances.set(id, inst);
      try { def.render(host, inst); } catch (e) { host.innerHTML = '<div style="padding:120px"><h1 style="font-weight:200;font-size:40px">' + esc(def.name) + '</h1><p style="opacity:.6;margin-top:16px">This app hit a problem: ' + esc(e.message) + '</p></div>'; }
      this.buildAppBars(inst);
      S.history[id] = (S.history[id] || 0) + 1; State.save();
    }
    inst.status = "running";
    Snd.play("launch");
    inst.el.classList.add("slidein");
    setTimeout(() => inst.el.classList.remove("slidein"), 400);
    Shell.showApp(inst);
  },

  foreground(inst) {
    this.touch(inst);
    inst.status = "running";
    if (this.snap) {
      if (inst !== this.snap.app) this.mainApp = inst;
    }
    this.current = inst;
    this.layout();
  },

  hideAllApps(suspend) {
    this.instances.forEach(i => {
      const snapped = this.snap && this.snap.app === i;
      if (!snapped) {
        i.el.classList.remove("vis");
        if (suspend && i.status === "running") { i.status = "suspended"; i.cpu = 0; }
      }
    });
    if (!this.snap) this.current = null;
  },

  close(inst, skipAnim) {
    if (!inst || inst === "desktop") return;
    const done = () => {
      inst.el.remove();
      this.instances.delete(inst.id);
      this.stack = this.stack.filter(s => s !== inst);
      if (this.snap && this.snap.app === inst) this.unsnap();
      if (this.mainApp === inst) this.mainApp = null;
      if (this.current === inst) {
        this.current = null;
        const next = this.stack[0];
        if (next === "desktop") Shell.showDesktop();
        else if (next) Shell.showApp(next);
        else Shell.enterStart();
      }
    };
    if (skipAnim) done();
    else {
      inst.el.style.transition = "transform .3s ease-in, opacity .3s";
      inst.el.style.transform = "translateY(780px) scale(.5)";
      inst.el.style.opacity = "0";
      Snd.play("whoosh");
      setTimeout(done, 300);
    }
  },

  /* ----- Snap: exactly two apps, one 320px column, a divider that flips ----- */
  trySnap(inst, side) {
    if (Machine.W() < 1366) {
      Toast.show("This app can’t snap", "Your screen resolution is too low to snap apps. Snap needs 1366×768.", { icon:"warn", color:"#444" });
      Snd.play("warn");
      return false;
    }
    if (inst === "desktop") { /* desktop may be snapped */ }
    this.snap = { app: inst, side };
    if (inst !== "desktop" && inst.status) inst.status = "running";
    // whoever else is foreground fills the rest
    const other = this.stack.find(x => x !== inst) || null;
    this.mainApp = other;
    $("#mhost").classList.add("on");
    if (other === "desktop" || (Shell.view === "desktop" && inst !== "desktop")) {
      $("#desktop").classList.add("on");
    } else if (other) { other.el && other.el.classList.add("vis"); this.current = other; }
    else Shell.enterStart();
    this.layout();
    return true;
  },
  unsnap() {
    this.snap = null;
    $("#snapdiv").classList.remove("on");
    this.layout();
    Desktop.layoutForSnap();
    Start.layoutForSnap();
  },
  cycleSnap(inst) { // Win+.
    if (!inst || inst === "desktop") inst = this.current;
    if (!inst) return;
    if (!this.snap || this.snap.app !== inst) this.trySnap(inst, "left");
    else if (this.snap.side === "left") { this.snap.side = "right"; this.layout(); }
    else { this.unsnap(); Shell.showApp(inst); }
  },

  layout() {
    const W = Machine.W(), SNAPW = 320, DIV = 22;
    const div = $("#snapdiv");
    // hide all, then show the ones that matter
    this.instances.forEach(i => { if (i !== this.current && (!this.snap || this.snap.app !== i)) i.el.classList.remove("vis"); });
    if (!this.snap) {
      div.classList.remove("on");
      if (this.current) {
        const e = this.current.el;
        e.classList.add("vis"); e.classList.remove("narrow");
        e.style.left = "0"; e.style.right = "0"; e.style.width = "";
      }
      Desktop.layoutForSnap(); Start.layoutForSnap();
      return;
    }
    const sApp = this.snap.app, left = this.snap.side === "left";
    div.classList.add("on");
    div.style.left = left ? SNAPW + "px" : "";
    div.style.right = left ? "" : SNAPW + "px";
    if (left) div.style.right = "auto"; else div.style.left = "auto";
    if (sApp !== "desktop") {
      const e = sApp.el;
      e.classList.add("vis", "narrow");
      e.style.left = left ? "0" : "auto";
      e.style.right = left ? "auto" : "0";
      e.style.width = SNAPW + "px";
    }
    // the fill region
    const fillLeft = left ? SNAPW + DIV : 0, fillRight = left ? 0 : SNAPW + DIV;
    if (this.current && this.current !== sApp && this.current.el) {
      const e = this.current.el;
      e.classList.add("vis"); e.classList.remove("narrow");
      e.style.left = fillLeft + "px"; e.style.right = fillRight + "px"; e.style.width = "";
    }
    Desktop.layoutForSnap(fillLeft, fillRight);
    Start.layoutForSnap(fillLeft, fillRight);
    if (sApp === "desktop") {
      // the desktop itself in the narrow column: show it scaled
      const d = $("#desktop");
      d.classList.add("on");
      d.style.left = left ? "0" : "auto"; d.style.right = left ? "auto" : "0";
      d.style.width = SNAPW + "px";
      d.classList.add("snapmini");
    } else {
      $("#desktop").classList.remove("snapmini");
    }
  },

  /* ----- app bars: hidden until summoned. The point. ----- */
  buildAppBars(inst) {
    const def = inst.def;
    if (def.commands) {
      const bar = el("div", "appbar bottom");
      inst.el.appendChild(bar);
      inst.bottomBar = bar;
      this.fillBar(bar, def.commands(inst), inst);
    }
    if (def.navbar) {
      const bar = el("div", "appbar top");
      inst.el.appendChild(bar);
      inst.topBar = bar;
      this.fillBar(bar, def.navbar(inst), inst);
    }
    if (def.commands || def.navbar) inst.el.addEventListener("contextmenu", e => {
      if (e.target.closest(".appbar")) return;
      e.preventDefault();
      this.toggleBars(inst);
    });
  },
  fillBar(bar, items, inst) {
    bar.innerHTML = "";
    items.forEach(it => {
      if (it === "|") { bar.appendChild(el("div", "absep")); return; }
      if (it === ">") { bar.appendChild(el("div", "abspring")); return; }
      const b = el("button", "abbtn");
      b.innerHTML = '<span class="cir">' + Icons.svg(it.icon, 22) + '</span><span>' + esc(it.label) + '</span>';
      if (it.disabled) b.disabled = true;
      b.onclick = () => { this.toggleBars(inst, false); it.run && it.run(inst); };
      bar.appendChild(b);
    });
  },
  toggleBars(inst, force) {
    inst = inst || this.current;
    if (!inst || !inst.el) return;
    const on = force !== undefined ? force : !(inst.bottomBar && inst.bottomBar.classList.contains("on"));
    if (inst.bottomBar) inst.bottomBar.classList.toggle("on", on);
    if (inst.topBar) inst.topBar.classList.toggle("on", on);
    if (inst.def.onBars) inst.def.onBars(inst, on);
  }
};

/* ----- dragging an app from the top edge: move, snap, or throw it away ----- */
const AppDrag = {
  active: null,
  init() {
    $("#machine").addEventListener("pointerdown", e => {
      const p = Machine.pt(e);
      if (p.y > 5) return;
      if (Shell.view !== "app" || !Modern.current) return;
      if (Charms.isOpen() || $("#switcher").classList.contains("on")) return;
      e.preventDefault();
      this.begin(Modern.current, p);
    });
    addEventListener("pointermove", e => { if (this.active) this.move(Machine.pt(e)); });
    addEventListener("pointerup", e => { if (this.active) this.end(Machine.pt(e)); });
  },
  begin(inst, p) {
    this.active = inst; this.moved = false;
    const th = $("#dragthumb");
    th.style.background = inst.def.bgColor || "#222";
    th.innerHTML = '<div class="thumbcard">' + Icons.svg(inst.def.icon, 60) + '<div class="tlabel">' + esc(inst.def.name) + '</div></div>';
    th.style.background = inst.def.color;
  },
  move(p) {
    if (!this.moved && p.y < 24) return;
    this.moved = true;
    const th = $("#dragthumb");
    th.classList.add("on");
    this.active.el.classList.remove("vis");
    th.style.left = clamp(p.x - 210, -100, Machine.W() - 320) + "px";
    th.style.top = clamp(p.y - 40, 0, 720) + "px";
  },
  end(p) {
    const inst = this.active; this.active = null;
    $("#dragthumb").classList.remove("on");
    if (!this.moved) return;
    if (p.y > 640) { inst.el.classList.add("vis"); Modern.close(inst); return; }
    if (p.x < 120) { inst.el.classList.add("vis"); Modern.trySnap(inst, "left") || Shell.showApp(inst); return; }
    if (p.x > Machine.W() - 120) { inst.el.classList.add("vis"); Modern.trySnap(inst, "right") || Shell.showApp(inst); return; }
    inst.el.classList.add("vis");
    Shell.showApp(inst);
  }
};

/* ----- the snap divider: drag it to flip the arrangement or dismiss it ----- */
const SnapDivider = {
  init() {
    const div = $("#snapdiv");
    let dragging = false;
    div.addEventListener("pointerdown", e => { dragging = true; div.setPointerCapture(e.pointerId); });
    div.addEventListener("pointermove", e => {
      if (!dragging) return;
      const p = Machine.pt(e);
      div.style.left = clamp(p.x - 11, 0, Machine.W() - 22) + "px";
      div.style.right = "auto";
    });
    div.addEventListener("pointerup", e => {
      if (!dragging) return; dragging = false;
      const p = Machine.pt(e), W = Machine.W();
      if (!Modern.snap) return;
      const sApp = Modern.snap.app;
      if (p.x < 160) {
        // pushed to the left edge
        if (Modern.snap.side === "left") { Modern.unsnap(); this.promoteFill(); }
        else { this.promoteSnapped(); }
      } else if (p.x > W - 160) {
        if (Modern.snap.side === "right") { Modern.unsnap(); this.promoteFill(); }
        else { this.promoteSnapped(); }
      } else if (p.x < W / 2) {
        Modern.snap.side = "left"; Modern.layout();
      } else {
        Modern.snap.side = "right"; Modern.layout();
      }
    });
  },
  promoteFill() { // snapped app dismissed to the stack; fill app goes full screen
    const fill = Modern.mainApp;
    if (fill === "desktop" || (!fill && Shell.view === "desktop")) Shell.showDesktop();
    else if (fill) Shell.showApp(fill);
    else Shell.enterStart();
  },
  promoteSnapped() { // snapped app takes the whole screen
    const sApp = Modern.snap.app;
    Modern.unsnap();
    if (sApp === "desktop") Shell.showDesktop();
    else Shell.showApp(sApp);
  }
};

/* ==========================================================================
   MODERN APP FRAMEWORK — shared chrome for the typography-led panoramas
   ========================================================================== */
function mPage(host, title, opts) {
  opts = opts || {};
  const page = el("div", "mpage");
  const head = el("div", "mhead");
  if (opts.back) {
    const b = el("div", "backb", "←"); // circled back, as the design language demands
    b.onclick = opts.back;
    head.appendChild(b);
    head.style.paddingLeft = "178px";
  }
  head.appendChild(el("h1", "", esc(title)));
  const body = el("div", "mbody" + (opts.vertical ? " vert" : ""));
  page.append(head, body);
  host.appendChild(page);
  if (!opts.vertical) {
    body.addEventListener("wheel", e => {
      if (!e.ctrlKey && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { body.scrollLeft += e.deltaY; e.preventDefault(); }
    }, { passive: false });
  }
  return { page, head, body };
}
function mSection(body, title, width) {
  const sec = el("div", "msec");
  if (title) sec.appendChild(el("h2", "", esc(title)));
  if (width) sec.style.width = width + "px";
  body.appendChild(sec);
  return sec;
}
/* A "vast margins, small usable area" layout for the communications apps.
   The complaint was real; the exhibit represents it honestly. */
function mSplit(host, cols) {
  const wrap = el("div", "", "");
  wrap.style.cssText = "position:absolute;inset:0;display:flex;";
  cols.forEach(c => {
    const d = el("div");
    d.style.cssText = "height:100%;overflow-y:auto;overflow-x:hidden;" +
      (c.flex ? "flex:1;" : "width:" + c.w + "px;flex:none;") +
      (c.bg ? "background:" + c.bg + ";" : "");
    if (c.pad) d.style.padding = c.pad;
    wrap.appendChild(d);
    c.el = d;
  });
  host.appendChild(wrap);
  return cols.map(c => c.el);
}

const DEFAULT_TILES = [

if (!S.tiles) S.tiles = JSON.parse(JSON.stringify(DEFAULT_TILES));

/* Resolve a tile's app id to a definition — Modern apps directly, desktop
   apps (pinned from All apps as "d:<id>") through a small adapter. */
function tileDef(appId) {
  if (MApps[appId]) return MApps[appId];
  if (appId && appId.startsWith("d:")) {
    const da = DApps[appId.slice(2)];
    if (da) return { id: appId, name: da.name, color: "#2d3a48", icon: da.icon, desktopApp: da.id };
  }
  return null;
}

const Start = {
  zoomed: false, selected: null, ROWS: 3, UNIT: 140, GAP: 8,

  applyTheme() {
    const sc = SCHEMES[S.scheme];
    document.documentElement.style.setProperty("--hi", sc.hi);
    document.documentElement.style.setProperty("--wborder", "#7a7a7a");
    document.documentElement.style.setProperty("--wtitle", sc.hi);
    document.documentElement.style.setProperty("--wtitletext", "#fff");
    $("#start .bgart").style.background = startBgSVG(S.pattern, sc);
    $("#start .bgart").style.backgroundSize = "cover";
    $("#allapps").style.background = sc.bg;
    $("#signin") && ($("#signin").style.background = sc.bg);
    this.renderUserChip();
  },

  renderUserChip() {
    $("#userchip").innerHTML = '<div class="cname">' + esc(S.userName)
      + (S.msAccount ? "<small>" + esc(S.msAccount) + "</small>" : "<small>Local account</small>")
      + '</div><div class="avatar">' + avatarSVG(48) + '</div>';
  },

  build() {
    const tz = $("#tilezone");
    tz.innerHTML = "";
    const groups = S.groups.map((name, gi) => ({ name, gi, tiles: S.tiles.filter(t => t.group === gi) }))
      .filter(g => g.tiles.length || g.name);
    groups.forEach(g => {
      const gEl = el("div", "tgroup");
      gEl.dataset.gi = g.gi;
      const label = el("div", "tgrouplabel", esc(g.name || " "));
      const grid = el("div", "tgrid");
      gEl.append(label, grid);
      // column-major packing, 3 rows, wide tiles take 2 columns
      const occ = [];
      const free = (c, r) => !(occ[c] && occ[c][r]);
      const take = (c, r) => { (occ[c] = occ[c] || [])[r] = true; };
      let maxCol = 0;
      g.tiles.forEach(t => {
        const wCells = t.size === "w" ? 2 : 1;
        let placed = false;
        for (let c = 0; !placed; c++) {
          for (let r = 0; r < this.ROWS; r++) {
            let ok = true;
            for (let k = 0; k < wCells; k++) if (!free(c + k, r)) ok = false;
            if (ok) {
              for (let k = 0; k < wCells; k++) take(c + k, r);
              t._c = c; t._r = r; placed = true;
              maxCol = Math.max(maxCol, c + wCells - 1);
              break;
            }
          }
        }
      });
      grid.style.width = ((maxCol + 1) * (this.UNIT + this.GAP) - this.GAP) + "px";
      grid.style.height = (this.ROWS * (this.UNIT + this.GAP) - this.GAP) + "px";
      g.tiles.forEach(t => grid.appendChild(this.makeTile(t)));
      tz.appendChild(gEl);
    });
    // label double-click renames even outside zoom (kindness, not accuracy)
    Live.attach();
  },

  makeTile(t) {
    const def = tileDef(t.app);
    if (!def) return el("div");
    const d = el("div", "tile");
    d.dataset.app = t.app;
    d.style.left = (t._c * (this.UNIT + this.GAP)) + "px";
    d.style.top = (t._r * (this.UNIT + this.GAP)) + "px";
    d.style.width = (t.size === "w" ? this.UNIT * 2 + this.GAP : this.UNIT) + "px";
    d.style.height = this.UNIT + "px";
    d.style.background = def.color;
    const faceHTML = '<div class="glyphbox">' + Icons.svg(def.icon, t.size === "w" ? 56 : 64) + '</div>'
      + '<div class="tname">' + esc(def.name) + '</div>';
    d.innerHTML = '<div class="tileface face1">' + faceHTML + '</div>'
      + '<div class="tileface face2"></div><div class="selcheck"></div>';
    if (t.app === "desktop") {
      // an operating system, reduced to an app; presented without comment
      d.style.backgroundImage = wallpaperSVG(S.wallpaper);
      d.style.backgroundSize = "cover";
      d.querySelector(".face1").innerHTML = '<div class="tname" style="position:absolute;left:12px;bottom:8px;text-shadow:1px 1px 2px rgba(0,0,0,.8)">Desktop</div>';
    }
    // interactions
    d.addEventListener("click", e => {
      if (this.zoomed) return;
      if (this.selected) { this.clearSelection(); return; }
      if (def.desktopApp) Desktop.launch(def.desktopApp);
      else Modern.launch(t.app);
    });
    d.addEventListener("contextmenu", e => {
      e.preventDefault(); e.stopPropagation();
      if (this.zoomed) return;
      this.select(t, d);
    });
    this.makeDraggable(d, t);
    return d;
  },

  select(t, dEl) {
    this.clearSelection(false);
    this.selected = t;
    dEl.classList.add("selmark");
    const bar = $("#startappbar");
    const def = tileDef(t.app) || {};
    const items = [
      { icon: "unpin", label: "Unpin from Start", run: () => { S.tiles = S.tiles.filter(x => x !== t); State.save(); this.build(); this.clearSelection(); } },
    ];
    if (def.uninstallable) items.push({ icon: "trash", label: "Uninstall", run: () => {
      S.tiles = S.tiles.filter(x => x !== t);
      S.installed = S.installed.filter(x => x !== t.app);
      S.uninstalled.push(t.app); State.save(); this.build(); this.clearSelection();
      Toast.show(def.name, "This app was uninstalled.", { icon: "trash" });
    }});
    items.push({ icon: "resize", label: t.size === "w" ? "Smaller" : "Larger", run: () => { t.size = t.size === "w" ? "m" : "w"; State.save(); this.build(); this.clearSelection(); } });
    if (def.live) items.push({ icon: "livetile", label: S.liveOff[t.app] ? "Turn live tile on" : "Turn live tile off",
      run: () => { S.liveOff[t.app] = !S.liveOff[t.app]; State.save(); this.build(); this.clearSelection(); } });
    items.push(">");
    items.push({ icon: "allapps", label: "All apps", run: () => AllApps.open() });
    Modern.fillBar(bar, items, null);

  clearSelection(hideBar) {
    this.selected = null;
    $$("#tilezone .tile.selmark").forEach(x => x.classList.remove("selmark"));
    if (hideBar !== false) $("#startappbar").classList.remove("on");
  },

  /* ----- drag to rearrange ----- */
  makeDraggable(dEl, t) {
    let start = null, dragging = false, ghost = null;
    dEl.addEventListener("pointerdown", e => {
      if (this.zoomed || e.button !== 0) return;
      start = Machine.pt(e);
      const move = ev => {
        const p = Machine.pt(ev);
        if (!dragging && Math.hypot(p.x - start.x, p.y - start.y) > 14) {
          dragging = true;
          ghost = dEl.cloneNode(true);
          ghost.style.cssText += ";position:absolute;z-index:99;opacity:.75;pointer-events:none;transform:scale(1.05)";
          ghost.style.width = dEl.offsetWidth + "px"; ghost.style.height = dEl.offsetHeight + "px";
          $("#start").appendChild(ghost);
          dEl.style.opacity = ".25";
        }
        if (dragging) {
          ghost.style.left = (p.x - dEl.offsetWidth / 2) + "px";
          ghost.style.top = (p.y - 70) + "px";
        }
      };
      const up = ev => {
        removeEventListener("pointermove", move); removeEventListener("pointerup", up);
        if (!dragging) return;
        dragging = false; ghost.remove(); dEl.style.opacity = "";
        const p = Machine.pt(ev);
        this.dropTile(t, p);
      };
      addEventListener("pointermove", move); addEventListener("pointerup", up);
    });
  },
  dropTile(t, p) {
    // find target group + index by geometry
    const tz = $("#tilezone");
    const scroll = $("#tilescroll").scrollLeft;
    let target = null;
    $$("#tilezone .tgroup").forEach(gEl => {
      const r = gEl.getBoundingClientRect(), m = $("#machine").getBoundingClientRect();
      const x1 = (r.left - m.left) / Machine.scale, x2 = (r.right - m.left) / Machine.scale;
      if (p.x >= x1 - 28 && p.x <= x2 + 28) target = gEl;
    });
    const list = S.tiles.filter(x => x !== t);
    if (!target) {
      // dropped in empty space beyond: new group at the end
      t.group = S.groups.length; S.groups.push("");
      S.tiles = list.concat([t]);
    } else {
      const gi = +target.dataset.gi;
      t.group = gi;
      // insertion index: order tiles in that group by column then row, find slot by x
      const gTiles = list.filter(x => x.group === gi);
      const m = $("#machine").getBoundingClientRect();
      const gr = target.querySelector(".tgrid").getBoundingClientRect();
      const relX = p.x - (gr.left - m.left) / Machine.scale;
      const relY = p.y - (gr.top - m.top) / Machine.scale;
      const col = Math.max(0, Math.floor(relX / (this.UNIT + this.GAP)));
      const row = clamp(Math.floor(relY / (this.UNIT + this.GAP)), 0, this.ROWS - 1);
      const ordinal = col * this.ROWS + row;
      let idx = 0, count = 0;
      for (; idx < gTiles.length; idx++) {
        const cellOrd = gTiles[idx]._c * this.ROWS + gTiles[idx]._r;
        if (cellOrd >= ordinal) break;
      }
      const globalIdx = gTiles[idx] ? list.indexOf(gTiles[idx]) : list.length;
      list.splice(globalIdx, 0, t);
      S.tiles = list;
    }
    // drop empty trailing groups
    State.save(); this.build();
  },

  /* ----- semantic zoom: the showpiece ----- */
  setZoom(on) {
    if (on === this.zoomed) return;
    this.zoomed = on;
    Snd.play("whoosh");
    const st = $("#start"), tz = $("#tilezone");
    st.classList.toggle("zoomed", on);
    if (on) {
      this.clearSelection();
      tz.style.transform = "scale(0.26)";
      tz.style.opacity = "0.96";
      $("#tilescroll").scrollLeft = 0;
    } else {
      tz.style.transform = "";
      tz.style.opacity = "";
    }
  },
  zoomClick(e) {
    // click a group while zoomed: zoom back in, scrolled to it; right-click: rename
    const p = Machine.pt(e);
    const gEl = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList && x.classList.contains("tgroup"));
    this.setZoom(false);
    if (gEl) {
      setTimeout(() => { $("#tilescroll").scrollLeft = Math.max(0, gEl.offsetLeft - 130); }, 60);
    }
  },
  renameGroup(gi) {
    const gEl = $$("#tilezone .tgroup").find(g => +g.dataset.gi === gi);
    if (!gEl) return;
    const label = gEl.querySelector(".tgrouplabel");
    const inp = el("input");
    inp.value = S.groups[gi] || "";
    inp.placeholder = "Name group";
    inp.style.cssText = "background:#fff;color:#000;border:2px solid var(--hi);font:15px 'Segoe UI';padding:3px 8px;width:220px";
    label.innerHTML = ""; label.appendChild(inp); inp.focus();
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") inp.blur(); };
    inp.onblur = () => { S.groups[gi] = inp.value.trim(); State.save(); this.build(); };
  },

  layoutForSnap() {
    const st = $("#start"), aa = $("#allapps");
    if (Modern.snap) {
      const left = Modern.snap.side === "left";
      st.style.left = left ? "342px" : "0"; st.style.right = left ? "0" : "342px";
      aa.style.left = st.style.left; aa.style.right = st.style.right;
    } else { st.style.left = st.style.right = aa.style.left = aa.style.right = "0"; }
  },

  init() {
    this.applyTheme();
    this.build();
    $("#zoombtn").onclick = () => this.setZoom(!this.zoomed);
    $("#tilescroll").addEventListener("wheel", e => {
      if (e.ctrlKey) { e.preventDefault(); this.setZoom(e.deltaY > 0); }
      else { $("#tilescroll").scrollLeft += e.deltaY; e.preventDefault(); }
    }, { passive: false });
    $("#tilescroll").addEventListener("click", e => {
      if (this.zoomed) { this.zoomClick(e); return; }
      if (e.target === $("#tilescroll") || e.target === $("#tilezone")) this.clearSelection();
    });
    $("#tilescroll").addEventListener("contextmenu", e => {
      e.preventDefault();
      if (this.zoomed) {
        const gEl = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList && x.classList.contains("tgroup"));
        if (gEl) {
          const gi = +gEl.dataset.gi;

          Modern.fillBar(bar, [
            { icon: "notepad", label: "Name group", run: () => { this.setZoom(false); setTimeout(() => this.renameGroup(gi), 340); } },
            { icon: "left", label: "Move left", run: () => this.moveGroup(gi, -1) },
            { icon: "right", label: "Move right", run: () => this.moveGroup(gi, +1) }
          ], null);
          bar.classList.add("on");
        }
        return;
      }
      // right-click on empty start surface
      const bar = $("#startappbar");
      Modern.fillBar(bar, [">", { icon: "allapps", label: "All apps", run: () => AllApps.open() }], null);
      bar.classList.add("on");

    // user chip menu
    $("#userchip").onclick = e => { e.stopPropagation(); $("#usermenu").classList.toggle("on"); };
    $("#usermenu").innerHTML = "";
    [["Change account picture", () => { Modern.launch("pcsettings"); setTimeout(() => PCSettings.goto("Personalize", "acct"), 150); }],
     ["Lock", () => Lock.lockNow()],
     ["Sign out", () => { Shell.hideAll(); SignIn.show(); }]].forEach(([label, run]) => {
      const d = el("div", "", esc(label));
      d.onclick = () => { $("#usermenu").classList.remove("on"); run(); };
      $("#usermenu").appendChild(d);
    });
    addEventListener("click", () => $("#usermenu").classList.remove("on"));
  },
  moveGroup(gi, dir) {
    const gj = gi + dir;
    if (gj < 0 || gj >= S.groups.length) return;
    [S.groups[gi], S.groups[gj]] = [S.groups[gj], S.groups[gi]];
    S.tiles.forEach(t => { if (t.group === gi) t.group = -1; else if (t.group === gj) t.group = gi; });
    S.tiles.forEach(t => { if (t.group === -1) t.group = gj; });
    State.save(); this.build();
    $("#startappbar").classList.remove("on");
  }
};

/* ==========================================================================
   LIVE TILE ENGINE — the screen should breathe
   ========================================================================== */
const Live = {
  timers: [],
  attach() {
    this.timers.forEach(clearInterval); this.timers = [];
    $$("#tilezone .tile").forEach((dEl, i) => {
      const id = dEl.dataset.app, def = MApps[id];
      if (!def || !def.live || S.liveOff[id]) return;
      const period = rand(5200, 9800);
      const t = setInterval(() => {
        if (!$("#start").classList.contains("on") || Start.zoomed) return;
        this.flip(dEl, def);
      }, period);
      this.timers.push(t);
      setTimeout(() => { if ($("#start").classList.contains("on")) this.flip(dEl, def); }, 900 + i * 260); // staggered first breath
    });
  },
  flip(dEl, def) {
    const tile = S.tiles.find(x => x.app === def.id);
    const html = def.live(tile ? tile.size : "m");
    if (!html) return;
    const f2 = dEl.querySelector(".face2");
    if (!f2) return;
    f2.innerHTML = html;
    dEl.classList.add("flipping");
    setTimeout(() => {
      const f1 = dEl.querySelector(".face1");
      if (f1) f1.innerHTML = html;
      dEl.classList.remove("flipping");
    }, 470);
  }
};

   ALL APPS — the full inventory

const AllApps = {

      list.forEach(a => wrap.appendChild(this.item(a)));

    }
    const groups = {};
    Object.values(DApps).forEach(a => { (groups[a.group || "Windows Accessories"] = groups[a.group || "Windows Accessories"] || []).push(a); });
    Object.keys(groups).sort().forEach(gname => {
      const c = el("div", "aacol");
      c.appendChild(el("div", "aacolhead", esc(gname)));

  item(a, isDesktop) {

      const items = [];

      if (S.tiles.some(t => t.app === tileId)) {

      } else {
        items.push({ icon: "pin", label: "Pin to Start", run: () => {
          S.tiles.push({ app: tileId, size: "m", group: S.groups.length - 1 });
          State.save(); Start.build(); bar.classList.remove("on"); Toast.show(a.name, "Pinned to Start", { icon: "pin" });
        }});
      }
      if (isDesktop) items.push({ icon: "desktopt", label: S.taskbarPins.includes(a.id) ? "Unpin from taskbar" : "Pin to taskbar", run: () => {
        if (S.taskbarPins.includes(a.id)) S.taskbarPins = S.taskbarPins.filter(x => x !== a.id);

/* ==========================================================================
   HOT CORNERS — precisely the pixels where the Start button used to be
   ========================================================================== */
const Corners = {
  init() {
    // right corners: charms ghost, then solid on approach along the edge
    ["#hz-tr", "#hz-br"].forEach(s => {
      $(s).addEventListener("mouseenter", () => { if (this.uiActive()) Charms.ghost(); });
    });
    $("#hz-redge").addEventListener("mouseenter", () => { if (Charms.ghostState) Charms.open(true); });
    $("#charmghost").addEventListener("mouseenter", () => Charms.open(true));
    // an honest but kind rate of accidental invocation is achieved by the corner size alone
    // bottom-left: the Start corner
    $("#hz-bl").addEventListener("mouseenter", () => { if (this.uiActive()) this.showStartPreview(); });
    $("#hz-bl").addEventListener("contextmenu", e => { e.preventDefault(); WinX.open(); });
    // top-left: previous app; slide down for the switcher
    $("#hz-tl").addEventListener("mouseenter", () => { if (this.uiActive()) this.showPrevPeek(); });
    $("#hz-ledge").addEventListener("mouseenter", () => {
      if ($("#prevpeek").classList.contains("on")) { this.hidePeeks(); Switcher.open(); }
    });
    addEventListener("mousemove", e => {
      const p = Machine.pt(e);
      // sliding along the right edge after touching a corner solidifies the charms
      if (Charms.ghostState && p.x > Machine.W() - 90 && p.y > 100 && p.y < 668) Charms.open(true);
      if (Charms.openState && p.x < Machine.W() - 360 && !$$(".flyout.on").length && !$(".powermenu")) Charms.close();
      if ($("#startpreview").classList.contains("on") && (p.x > 220 || p.y < 620)) this.hidePeeks();
      if ($("#prevpeek").classList.contains("on") && (p.x > 220 || p.y > 150)) this.hidePeeks();
    });
  },
  uiActive() { return !Lock.active && !$("#boot").style.display.includes("flex") && !$("#bsod").classList.contains("on"); },
  showStartPreview() {
    if (Shell.view === "start") {
      // when already at Start, the corner previews the last app instead
      this.showPrevPeek(true); return;
    }
    const sp = $("#startpreview");
    sp.classList.add("on");
    const sc = SCHEMES[S.scheme];
    sp.innerHTML = '<div class="spbg" style="background:' + sc.bg + '"></div>'
      + '<div class="spminitiles">' + S.tiles.slice(0, 8).map(t =>
        '<i style="background:' + (MApps[t.app] ? MApps[t.app].color : "#444") + ';grid-column:span ' + (t.size === "w" ? 2 : 1) + '"></i>').join("") + '</div>'
      + '<div class="splabel">Start</div>';
    sp.onclick = () => { this.hidePeeks(); Shell.enterStart(); Snd.play("whoosh"); };
    sp.oncontextmenu = e => { e.preventDefault(); WinX.open(); };
  },
  showPrevPeek(fromStart) {
    const prev = Modern.stack.find(x => (Shell.view === "start") ? true : (x !== (Shell.view === "desktop" ? "desktop" : Modern.current)));
    if (!prev) return;
    const pp = $("#prevpeek");
    pp.classList.add("on");
    if (fromStart) { pp.style.top = "auto"; pp.style.bottom = "0"; } else { pp.style.top = "0"; pp.style.bottom = "auto"; }
    pp.innerHTML = "";
    pp.appendChild(thumbFor(prev));
    pp.onclick = () => { this.hidePeeks(); activate(prev); };
  },
  hidePeeks() { $("#startpreview").classList.remove("on"); $("#prevpeek").classList.remove("on"); }
};
function thumbFor(x) {

  if (x === "desktop") {
    t.style.background = "#1e4a6e";
    t.style.backgroundImage = wallpaperSVG(S.wallpaper); t.style.backgroundSize = "cover";
    t.innerHTML = '<div class="tlabel" style="position:absolute;left:8px;bottom:6px">Desktop</div>';
  } else if (x === "start") {
    t.style.background = SCHEMES[S.scheme].bg;
    t.innerHTML = Icons.svg("startw", 34) + '<div class="tlabel">Start</div>';
  } else {
    t.style.background = x.def.color;

/* ---------- the left-edge switcher of suspended Modern apps ---------- */
const Switcher = {
  open() {
    const sw = $("#switcher");
    const items = Modern.stack.filter(x => x !== Modern.current || Shell.view !== "app");
    sw.innerHTML = "";
    items.forEach(x => {
      const d = el("div", "sthumb");
      d.appendChild(thumbFor(x));
      d.onclick = () => { this.close(); activate(x); };
      d.oncontextmenu = e => {
        e.preventDefault();
        if (x !== "desktop" && x !== "start") {
          const m = el("div", "ctxmenu");
          m.innerHTML = "";
          [["Snap left", () => Modern.trySnap(x, "left")], ["Snap right", () => Modern.trySnap(x, "right")], ["Close", () => Modern.close(x, true)]].forEach(([l, r]) => {
            const it = el("div", "", l); it.onclick = () => { m.remove(); this.close(); r(); }; m.appendChild(it);
          });
          m.style.left = "120px"; m.style.top = (d.offsetTop + 10) + "px";
          $("#machine").appendChild(m);
          setTimeout(() => addEventListener("click", function h() { m.remove(); removeEventListener("click", h); }), 10);
        }
      };
      sw.appendChild(d);
    });
    sw.appendChild(el("div", "spring"));
    const st = el("div", "sthumb");
    st.appendChild(thumbFor("start"));
    st.onclick = () => { this.close(); Shell.enterStart(); };
    sw.appendChild(st);
    sw.classList.add("on");
    const closer = e => { const p = Machine.pt(e); if (p.x > 140) { this.close(); removeEventListener("mousemove", closer); } };
    addEventListener("mousemove", closer);
  },
  close() { $("#switcher").classList.remove("on"); },
  cycle() { // Win+Tab
    const items = Modern.stack.slice();
    if (!items.length) { Shell.enterStart(); return; }
    this.open();
    const next = items.find(x => x !== (Shell.view === "desktop" ? "desktop" : Modern.current)) || items[0];
    activate(next);
    setTimeout(() => this.close(), 1400);
  }
};
