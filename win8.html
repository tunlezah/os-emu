/* ---------- Alt+Tab: everything ---------- */
const AltTab = {
  idx: 0, items: [],
  openOrCycle() {
    const at = $("#alttab");
    if (!at.classList.contains("on")) {
      this.items = [];
      WM.wins.forEach(w => this.items.push({ label: w.title, kind: "win", w }));
      Modern.stack.forEach(x => { if (x !== "desktop") this.items.push({ label: x.def.name, kind: "app", x }); });
      this.items.push({ label: "Desktop", kind: "desktop" });
      if (this.items.length < 2) return;
      this.idx = 1;
      this.render();
      at.classList.add("on");
    } else {
      this.idx = (this.idx + 1) % this.items.length;
      this.render();
    }
  },
  render() {
    const at = $("#alttab");
    at.innerHTML = "";
    this.items.forEach((it, i) => {
      const d = el("div", "atitem" + (i === this.idx ? " sel" : ""));
      const th = el("div", "atthumb");
      th.appendChild(it.kind === "app" ? thumbFor(it.x) : it.kind === "desktop" ? thumbFor("desktop")
        : (() => { const c = el("div", "thumbcard"); c.style.background = "#2a3440"; c.innerHTML = Icons.svg(it.w.icon || "filedoc", 30) + '<div class="tlabel">' + esc(it.label) + '</div>'; return c; })());
      d.appendChild(th);
      d.appendChild(el("div", "lbl", esc(it.label)));
      d.onclick = () => { this.idx = i; this.commit(); };
      at.appendChild(d);
    });
  },
  commit() {
    $("#alttab").classList.remove("on");
    const it = this.items[this.idx];
    if (!it) return;
    if (it.kind === "desktop") Shell.showDesktop();
    else if (it.kind === "app") Shell.showApp(it.x);
    else { Shell.showDesktop(); WM.focus(it.w); }
  }
};

/* ==========================================================================
   KEYBOARD — the full vocabulary
   ========================================================================== */
const KB = {
  metaUsed: false,
  init() {
    addEventListener("keydown", e => {
      if (Lock.active || $("#oobe").classList.contains("on") || $("#bsod").classList.contains("on")) return;
      const k = e.key.toLowerCase();
      if (e.key === "Meta" || e.key === "OS") { this.metaUsed = false; return; }
      const win = e.metaKey;
      if (win) {
        this.metaUsed = true;
        const map = {
          "c": () => Charms.open(true),
          "i": () => Flyouts.settings(),
          "d": () => Shell.showDesktop(),
          "x": () => WinX.open(),
          "z": () => Modern.toggleBars(),
          "q": () => SearchUI.open("Apps"),
          "w": () => SearchUI.open("Settings"),
          "f": () => SearchUI.open("Files"),
          "e": () => Desktop.launch("explorer"),
          "r": () => Desktop.runDialog(),
          "l": () => Lock.lockNow(),
          ".": () => Modern.cycleSnap(),
          "tab": () => Switcher.cycle()
        };
        if (map[k]) { e.preventDefault(); map[k](); return; }
        return;
      }
      if (e.altKey && k === "tab") { e.preventDefault(); AltTab.openOrCycle(); return; }
      if (e.altKey && k === "f4") {
        e.preventDefault();
        if (Shell.view === "app" && Modern.current) Modern.close(Modern.current);
        else if (Shell.view === "desktop") {
          if (WM.focused) WM.close(WM.focused);
          else Desktop.shutdownDialog();
        } else if (Shell.view === "start") Desktop.shutdownDialog();
        return;
      }
      if (e.ctrlKey && e.key === "Escape") { e.preventDefault(); Shell.toggleStart(); return; }
      if (e.key === "Escape") {
        if (Start.zoomed) { Start.setZoom(false); return; }
        if (Charms.isOpen()) { Charms.close(); return; }
        if ($("#searchview").classList.contains("on")) { SearchUI.close(); return; }
        if ($("#allapps").classList.contains("on")) { AllApps.close(); return; }
        if ($("#alttab").classList.contains("on")) { $("#alttab").classList.remove("on"); return; }
        Start.clearSelection();
        return;
      }
      // type from Start: search just begins
      if (Shell.view === "start" && $("#start").classList.contains("on") && !e.ctrlKey && !e.altKey
          && e.key.length === 1 && /[a-z0-9]/i.test(e.key) && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
        SearchUI.open("Apps", e.key);
        e.preventDefault();
      }
    });
    addEventListener("keyup", e => {
      if (e.key === "Meta" || e.key === "OS") {
        if (!this.metaUsed && !Lock.active && !$("#bsod").classList.contains("on")
            && !$("#oobe").classList.contains("on") && Shell.view) Shell.toggleStart();
        this.metaUsed = false;
      }
      if (e.key === "Alt" && $("#alttab").classList.contains("on")) AltTab.commit();
    });
  }
};

const MusicPlayer = {
  timer: null, seq: 0, playing: null,
  play(album) {
    this.stop();
    this.playing = album;
    if (!S.soundOn) { Toast.show("Music", "Sound is off — enable it in Settings → Volume.", { icon: "music", silent: true }); }
    const scale = [0, 3, 5, 7, 10, 12, 15];
    const base = 220 * Math.pow(2, (album.hue % 12) / 12);
    this.timer = setInterval(() => {
      if (!S.soundOn) return;
      const ctx = Snd.ac(); if (!ctx) return;
      const n = scale[this.seq % scale.length + (this.seq % 3 === 0 ? 0 : 0)];
      const f = base * Math.pow(2, scale[Math.floor(rand(0, scale.length))] / 12);
      Snd.tone(f, ctx.currentTime, .22, "triangle", .05, ctx);
      if (this.seq % 4 === 0) Snd.tone(base / 2, ctx.currentTime, .3, "sine", .06, ctx);
      this.seq++;
    }, 240);
  },
  stop() { clearInterval(this.timer); this.timer = null; this.playing = null; }
};

defineApp({
  id: "maps", name: "Maps", color: TILECOLORS.blue, bgColor: "#0e1620", icon: "maps",
  searchable: true,
  commands(inst) {
    return [
      { icon: "maps", label: "My location", run: i => { i._mx = 0; i._my = 0; this.draw(i); Toast.show("Maps", "You are here: The OS Museum, Hall 8 (Modern wing).", { icon: "maps", silent: true }); } },
      { icon: "globe", label: "Map style", run: i => { i._aerial = !i._aerial; this.draw(i); } },
      ">",
      { icon: "search", label: "Directions", run: () => Toast.show("Directions", "From: 1995. To: 2012. Route: bumpy but fast.", { icon: "maps", silent: true }) }
    ];
  },
  render(host, inst) {
    const cv = el("canvas");
    cv.width = 1366; cv.height = 768;
    cv.style.cssText = "position:absolute;inset:0;width:100%;height:100%;cursor:grab";
    host.appendChild(cv);
    inst._cv = cv; inst._mx = 0; inst._my = 0; inst._zoom = 1;
    const zc = el("div", "", '<button class="pcsbtn" id="mzin" style="width:44px">+</button><button class="pcsbtn" id="mzout" style="width:44px">−</button>');
    zc.style.cssText = "position:absolute;right:20px;top:90px;display:flex;flex-direction:column;gap:6px;z-index:5";
    host.appendChild(zc);
    zc.querySelector("#mzin").onclick = () => { inst._zoom = Math.min(2.6, inst._zoom * 1.3); this.draw(inst); };
    zc.querySelector("#mzout").onclick = () => { inst._zoom = Math.max(.5, inst._zoom / 1.3); this.draw(inst); };
    let drag = null;
    cv.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, mx: inst._mx, my: inst._my }; cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = e => { if (drag) { inst._mx = drag.mx + (e.clientX - drag.x) / Machine.scale; inst._my = drag.my + (e.clientY - drag.y) / Machine.scale; this.draw(inst); } };
    cv.onpointerup = () => drag = null;
    this.draw(inst);
  },
  draw(inst) {
    const c = inst._cv.getContext("2d"), z = inst._zoom, ox = inst._mx, oy = inst._my;

const FS = {
  root: null,
  init() { this.root = S.files || defaultFS(); S.files = this.root; },
  save() { State.save(); },
  resolve(path) { // "C:\Users\Visitor\Desktop" -> node
    const parts = path.split("\\").filter(Boolean);
    let node = this.root;
    if (parts[0] !== "C:") return null;
    for (let i = 1; i < parts.length; i++) {
      if (!node.children) return null;
      node = node.children.find(c => c.name.toLowerCase() === parts[i].toLowerCase());
      if (!node) return null;
    }
    return node;
  },
  pathOf(target) {
    let found = null;
    const walk = (node, path) => {
      if (node === target) { found = path; return; }
      (node.children || []).forEach(c => walk(c, path + "\\" + c.name));
    };
    walk(this.root, "C:");
    return found;
  },
  search(q) {
    if (!q) return [];
    q = q.toLowerCase();
    const out = [];
    const walk = (node, path) => {
      (node.children || []).forEach(c => {
        const p = path + "\\" + c.name;
        if (c.name.toLowerCase().includes(q)) out.push({ name: c.name, path: p, parent: path, type: c.type });
        walk(c, p);
      });
    };
    walk(this.root, "C:");
    return out.slice(0, 30);
  },
  uniqueName(folder, base) {
    let name = base, n = 2;
    while (folder.children.some(c => c.name.toLowerCase() === name.toLowerCase())) {
      name = base.replace(/(\.[^.]*)?$/, m => " (" + n + ")" + (m || "")); n++;
    }
    return name;
  }
};

    w.el.querySelector(".cl").onclick = e => { e.stopPropagation(); this.close(w); };
    w.el.addEventListener("pointerdown", () => this.focus(w));
    // dragging
    const tbar = w.el.querySelector(".tbar");
    tbar.addEventListener("pointerdown", e => {
      if (e.target.tagName === "BUTTON") return;
      const start = Machine.pt(e), ox = w.el.offsetLeft, oy = w.el.offsetTop;
      const move = ev => {
        if (w.maxed) return;
        const p = Machine.pt(ev);
        w.el.style.left = clamp(ox + p.x - start.x, -width + 120, Machine.W() - 60) + "px";
        w.el.style.top = clamp(oy + p.y - start.y, 0, 730) + "px";
      };
      const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
      addEventListener("pointermove", move); addEventListener("pointerup", up);
    });
    tbar.addEventListener("dblclick", e => { if (e.target.tagName !== "BUTTON") this.toggleMax(w); });
    // resizing
    [["e", "x"], ["s", "y"], ["se", "xy"]].forEach(([cls, axis]) => {
      w.el.querySelector(".rz." + cls).addEventListener("pointerdown", e => {
        e.stopPropagation();
        const start = Machine.pt(e), ow = w.el.offsetWidth, oh = w.el.offsetHeight;
        const move = ev => {
          const p = Machine.pt(ev);
          if (axis.includes("x")) w.el.style.width = Math.max(300, ow + p.x - start.x) + "px";
          if (axis.includes("y")) w.el.style.height = Math.max(180, oh + p.y - start.y) + "px";
          if (w.onResize) w.onResize(w);
        };
        const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
        addEventListener("pointermove", move); addEventListener("pointerup", up);
      });
    });

  },
  focus(w) {

  toggleMax(w) {

      w.el.classList.add("maxed");

      w.el.style.width = "100%"; w.el.style.height = "calc(100% - 46px)";
      w.maxed = true;
    } else {
      w.el.classList.remove("maxed");
      w.el.style.left = w.prevRect.l + "px"; w.el.style.top = w.prevRect.t + "px";
      w.el.style.width = w.prevRect.w + "px"; w.el.style.height = w.prevRect.h + "px";
      w.maxed = false;
    }
    if (w.onResize) w.onResize(w);
  },
  close(w) {
    if (w.onClose) w.onClose(w);
    w.el.remove();
    this.wins = this.wins.filter(x => x !== w);
    if (this.focused === w) this.focused = this.wins[this.wins.length - 1] || null;

  },
  byApp(app) { return this.wins.filter(w => w.app === app); }
};

/* ---------- THE SHELL BRIDGE — the explicit seam between the two worlds.
   Every bounce from PC settings into Control Panel passes through here.
   It is a real, deliberate module, because it was a real, deliberate product. */
const Bridge = {
  bounces: 0,
  toControlPanel(page, from) {
    this.bounces++;
    Charms.close(); Flyouts.close();
    Desktop.launch("cpanel", { page });
    if (from === "pcsettings") {
      Toast.show("You’ve been taken to the desktop", "PC settings couldn’t finish that task. The classic Control Panel can. This bounce is authentic.", { icon: "desktopt", silent: this.bounces > 1 });
      if (this.bounces === 3) setTimeout(() => Toast.show("Third bounce", "That’s three trips from the new settings to the old ones. The seam you keep crossing IS the product.", { icon: "warn" }), 2500);
    }
  },
  toPCSettings(section, sub) {
    Modern.launch("pcsettings");
    setTimeout(() => PCSettings.goto(section, sub), 150);
    Toast.show("You’ve been taken to the Modern world", "Some settings only exist in PC settings. The seam runs both ways.", { icon: "settings", silent: true });
  }
};

/* ---------- the new copy dialog: throughput graph, pause, honesty ---------- */
const CopyDlg = {
  run(name, dest, done) {
    const total = rand(35, 160); // MB
    let copied = 0, speed = rand(28, 65), paused = false, hist = [];
    const d = el("div", "dlg");
    d.style.cssText += "left:380px;top:200px;width:520px;z-index:" + (++WM.zTop);
    d.innerHTML = '<div class="tbar" style="height:31px;background:var(--wtitle);color:#fff;display:flex;align-items:center"><div style="padding-left:10px;font-size:12.5px;flex:1" id="cptitle"></div></div>'
      + '<div style="padding:14px 16px;background:#fff;color:#000;font-size:12.5px">'
      + '<div id="cpline" style="margin-bottom:8px"></div>'
      + '<canvas id="cpgraph" width="480" height="90" style="border:1px solid #cde3a0;background:#f6fbef;width:100%"></canvas>'
      + '<div id="cpstats" style="display:flex;justify-content:space-between;color:#666;font-size:11.5px;margin-top:6px"></div>'
      + '</div><div class="dlgbtns"><button class="wbtn" id="cppause">Pause</button><button class="wbtn" id="cpcancel">Cancel</button></div>';
    $("#desktop").appendChild(d);
    const cv = d.querySelector("#cpgraph").getContext("2d");
    const iv = setInterval(() => {
      if (!paused) {
        speed = clamp(speed + rand(-9, 9), 6, 88);
        copied = Math.min(total, copied + speed / 10);
      }
      hist.push(paused ? 0 : speed);
      if (hist.length > 96) hist.shift();
      d.querySelector("#cptitle").textContent = Math.round(copied / total * 100) + "% complete";
      d.querySelector("#cpline").innerHTML = "Copying <b>" + esc(name) + "</b> to <b>" + esc(dest) + "</b>";
      d.querySelector("#cpstats").innerHTML = "<span>Speed: " + (paused ? "0" : speed.toFixed(1)) + " MB/s</span><span>" + copied.toFixed(0) + " MB of " + total.toFixed(0) + " MB</span><span>Time remaining: about " + Math.max(1, Math.ceil((total - copied) / (speed / 10) / 10)) + " seconds</span>";
      cv.fillStyle = "#f6fbef"; cv.fillRect(0, 0, 480, 90);
      cv.strokeStyle = "#5aa02c"; cv.fillStyle = "rgba(120,180,60,.25)";
      cv.beginPath(); cv.moveTo(0, 90);
      hist.forEach((h, i) => cv.lineTo(i * 5, 90 - h));
      cv.lineTo((hist.length - 1) * 5, 90); cv.closePath(); cv.fill();
      cv.beginPath();
      hist.forEach((h, i) => i ? cv.lineTo(i * 5, 90 - h) : cv.moveTo(0, 90 - h));
      cv.stroke();
      if (copied >= total) {
        clearInterval(iv);
        setTimeout(() => { d.remove(); done && done(); }, 500);
      }
    }, 100);
    d.querySelector("#cppause").onclick = e => { paused = !paused; e.target.textContent = paused ? "Resume" : "Pause"; };
    d.querySelector("#cpcancel").onclick = () => { clearInterval(iv); d.remove(); };
  }
};

/* ==========================================================================
   EASTER EGGS & LORE
   ========================================================================== */
const Eggs = {
  charmsAccident() {
    S.counters.charmsAccidents++;
    State.save();
    const n = S.counters.charmsAccidents;
    if (n > 0 && n % 25 === 0 && n !== S.counters.charmsToldAt) {
      S.counters.charmsToldAt = n; State.save();
      Toast.show("A suspiciously round number", "You have now summoned the charms bar by accident " + n + " times. The bar holds no grudge. It will be there again shortly, whether or not you want it.", { icon: "share", color: "#4a4a4a" });
    }
  },
  aboutPanel() {
    const f = Flyouts.make("About this exhibit", true);
    f.body.innerHTML =
      '<div style="font-size:13.5px;font-weight:300;line-height:1.75;opacity:.92">'
      + '<p style="margin-bottom:12px"><b>Windows 8, RTM (build 9200)</b> — released to manufacturing August 1, 2012; on shelves October 26, 2012. This exhibit simulates it as it shipped, before 8.1 walked any of it back.</p>'
      + '<p style="margin-bottom:12px"><b>On the name “Metro”:</b> the design language was known internally as Metro — inspired by transit signage — until a trademark dispute shortly before release. Microsoft dropped the name and was left awkwardly saying “Modern UI” and “Windows Store apps” instead. Everyone kept saying Metro anyway. This panel is legally advised to say both.</p>'
      + '<p style="margin-bottom:12px"><b>Keyboard:</b> Win toggles Start · Win+C charms · Win+I settings · Win+D desktop · Win+X power menu · Win+Z app bars · Win+Q/W/F search · Win+Tab switcher · Win+. snap · Alt+Tab everything · Alt+F4 close. If your host system eats the Windows key, Ctrl+Esc toggles Start, and every path also exists for the mouse — that was rather the problem.</p>'
      + '<p style="margin-bottom:12px"><b>Semantic zoom:</b> Ctrl+scroll on the Start screen, or the − button in its corner. Do not leave without trying it.</p>'
      + '</div>';
    const replay = el("div", "flylink", "Replay the famous tutorial");
    replay.onclick = () => { Flyouts.close(); OOBE.tutorial(true); };
    f.body.appendChild(replay);
    const stats = el("div", "flylink", "Visitor statistics");
    stats.onclick = () => Toast.show("Your visit so far",
      S.counters.clicks + " clicks · " + S.counters.appLaunches + " app launches · " + S.counters.charmsAccidents + " accidental charms · shutdown " + (S.counters.foundShutdown ? "FOUND" : "not yet found"), { icon: "finance", ms: 9000 });
    f.body.appendChild(stats);
    const reset = el("div", "flylink", "Reset your PC (erase this exhibit's saved state)");
    reset.onclick = () => { Flyouts.close(); Boot.confirmReset(() => {}); };
    f.body.appendChild(reset);
  },
  offer81(force) {
    if (S.counters.told81 && !force) return;
    S.counters.told81 = true; State.save();
    Toast.show("Windows 8.1 is available", "Free from the Windows Store. It can restore something you may recently have missed. Tap here to preview.", {
      icon: "update", ms: 14000, force: true,
      onclick: () => this.preview81()
    });
  },
  preview81() {
    // it offers to restore something that was recently missed
    Shell.showDesktop();
    const btn = el("div");
    btn.style.cssText = "position:absolute;left:0;bottom:0;width:52px;height:46px;background:#101418;z-index:37;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:2px solid var(--hi);outline-offset:-2px";
    btn.innerHTML = Icons.svg("startw", 24, "#fff");
    $("#desktop").appendChild(btn);
    Toast.show("A preview of October 2013", "There it is. A button. In the corner. It only opens the same Start screen — but it is THERE. This preview expires in 15 seconds; the exhibit ends in 2012.", { icon: "startw", ms: 15000, force: true });
    btn.onclick = () => Shell.toggleStart();
    setTimeout(() => {
      btn.style.transition = "opacity 1.2s"; btn.style.opacity = "0";
      setTimeout(() => { btn.remove(); Toast.show("2012 restored", "The corner is bare again, as history requires.", { icon: "desktopt", silent: true }); }, 1300);
    }, 15000);
  }
};

/* ---------- master volume respects the Settings-charm slider ---------- */
(function () {
  const _tone = Snd.tone.bind(Snd);
  Snd.tone = function (f, t, d, type, g, ctx) {
    const vol = (S.volume === undefined ? 80 : S.volume) / 80;
    _tone(f, t, d, type, (g || 0.1) * vol, ctx);
  };
})();

/* ---------- touch gestures, mapped to drag equivalents ---------- */
const EdgeSwipes = {
  init() {
    // drag in from the right edge: charms. from the left edge: previous app.
    $("#hz-redge").addEventListener("pointerdown", e => {
      e.preventDefault();
      const up = ev => {
        removeEventListener("pointerup", up);
        const p = Machine.pt(ev);
        if (p.x < Machine.W() - 40) Charms.open(true);
      };
      addEventListener("pointerup", up);
    });
    $("#hz-ledge").addEventListener("pointerdown", e => {
      e.preventDefault();
      const up = ev => {
        removeEventListener("pointerup", up);
        const p = Machine.pt(ev);
        if (p.x > 40) {
          const prev = Modern.stack.find(x => x !== (Shell.view === "desktop" ? "desktop" : Modern.current));
          if (prev) activate(prev);
        }
      };
      addEventListener("pointerup", up);
    });
  }
};

/* ==========================================================================
   INIT — power on
   ========================================================================== */
function init() {
  FS.init();
  document.documentElement.style.setProperty("--hi", SCHEMES[S.scheme].hi);
  document.documentElement.style.setProperty("--wborder", "#7a7a7a");
  document.documentElement.style.setProperty("--wtitle", SCHEMES[S.scheme].hi);
  document.documentElement.style.setProperty("--wtitletext", "#fff");
  if (S.res === 1024) $("#machine").classList.add("res1024");
  if (S.brightness !== undefined) $("#machine").style.filter = "brightness(" + (S.brightness / 100) + ")";
  if (S.highContrast) document.body.style.filter = "contrast(1.35) saturate(.7)";
  Machine.fit();
  Start.init();
  Charms.build();
  Corners.init();
  KB.init();
  AppDrag.init();
  SnapDivider.init();
  EdgeSwipes.init();
  Desktop.init();
  // the quiet counters
  addEventListener("click", () => { S.counters.clicks++; if (S.counters.clicks % 5 === 0) State.save(); }, true);
  // late in a long session, history knocks
  S.counters.sessionStart = Date.now();
  State.save();
  setInterval(() => {
    if (!S.counters.told81 && Date.now() - S.counters.sessionStart > 12 * 60 * 1000
        && !Lock.active && (Shell.view === "start" || Shell.view === "desktop")) Eggs.offer81();
  }, 30000);
  // vanishing rarity, ambient edition: one crash lottery ticket per minute of uptime
  setInterval(() => { if (!Lock.active && Shell.view) Err.maybeRandom(); }, 60000);
  Boot.powerOn();
}
init();
