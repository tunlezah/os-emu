/* ==================================================================
   23. 文字検索 — the character search 小物
   ------------------------------------------------------------------
   The feature reviewers raved about, and the reason a great many
   people bought this operating system. Four ways in — 読み, 画数,
   部首, コード — plus the one that mattered most in practice:
   異体字 / 異形字ゆらぎ.
   ================================================================== */
const CharSearch = {
  open(w){
    const arg = w.arg || {};
    const wrap = el('div','csw');
    const tabs = el('div','cstabs');
    const form = el('div','csform');
    const res  = el('div','csresult');
    const info = el('div','csinfo');
    wrap.append(tabs, form, res, info);
    w.view.appendChild(wrap);
    let tab = 'yomi', picked = null, hits = [], blk = 'jis12', blkAt = 0;
    const TABS = [['yomi','読み'],['stroke','画数'],['radical','部首'],
                  ['code','コード'],['variant','異体字'],['other','文字集合']];
    const api = {
      render(){
        tabs.innerHTML = '';
        TABS.forEach(([id,nm])=>{
          const t = el('div','cstab'+(tab===id?' on':''), nm);
          t.setAttribute('data-gloss','cs-'+id);
          t.addEventListener('click', ()=>{ tab=id; hits=[]; api.render(); });
          tabs.appendChild(t);
        });
        form.innerHTML = '';
        res.innerHTML = '';
        this['form_'+tab]();
        this.paintHits();
        this.paintInfo();
        WM.sync(w);
      },
      /* --- 読み --- */
      form_yomi(){
        const q = mk('input',{class:'bfield',style:'width:112px',
          value: State.data.csHistory[0] || ''});
        const go = ()=>{
          const s = q.value.trim();
          if(!s) return;
          hits = CharDB.searchYomi(s);
          api.surname = CharDB.surnameHits(s);
          if(s && State.data.csHistory[0]!==s){
            State.data.csHistory.unshift(s);
            if(State.data.csHistory.length>12) State.data.csHistory.length=12;
            touch();
          }
          api.paintHits(); api.paintInfo();
        };
        q.addEventListener('keydown', e=>{ e.stopPropagation();
          if(e.key==='Enter') go(); });
        const row = el('div','bprow');
        row.append(mk('span',{class:'bplabel',text:'読み'}), q,
          swb('探す', go),
          swb('履歴', ()=>Menu.show(
            (State.data.csHistory.length?State.data.csHistory:['（履歴なし）'])
              .map(h=>({l:h, act:()=>{ q.value=h; go(); }})), 200, 80)));
        form.appendChild(row);
        form.appendChild(mk('div',{class:'bplabel',style:'font-size:10px',
          text:'ひらがな・カタカナどちらでも。姓の読みを入れると、その姓の異体字が並ぶ。'}));
      },
      /* --- 画数 --- */
      form_stroke(){
        const g = el('div','radgrid');
        for(let n=1;n<=23;n++){
          const b = el('div','strokebtn'+(api.stroke===n?' on':''), n+'画');
          b.addEventListener('click', ()=>{ api.stroke=n; hits=CharDB.searchStroke(n);
            api.paintHits(); api.render(); });
          g.appendChild(b);
        }
        form.appendChild(g);
        form.appendChild(mk('div',{class:'bplabel',style:'font-size:10px',
          text:'この展示に入っている '+CharDB.count()+' 字ぶんの画数索引。'+
            '本物は約18万字ぶん持っている。'}));
      },
      /* --- 部首 --- */
      form_radical(){
        const g = el('div','radgrid');
        g.style.maxHeight = '62px'; g.style.overflow = 'auto';
        CharDB.radicals.forEach(r=>{
          const b = el('div','radbtn'+(api.rad===r?' on':''), r);
          b.addEventListener('click', ()=>{ api.rad=r; hits=CharDB.searchRad(r);
            api.paintHits(); api.render(); });
          g.appendChild(b);
        });
        form.appendChild(g);
      },
      /* --- コード / 区点 --- */
      form_code(){
        const sel = mk('select',{class:'bfield'});
        BLOCKS.filter(b=>!b.nocode).forEach(b=>sel.appendChild(
          mk('option',{value:b.id, text:b.nm, selected: b.id===blk?'selected':null})));
        sel.addEventListener('change', ()=>{ blk = sel.value; blkAt = 0;
          api.loadBlock(); api.render(); });
        const cp = mk('input',{class:'bfield',style:'width:74px',placeholder:'U+ / 区点'});
        cp.addEventListener('keydown', e=>{ e.stopPropagation();
          if(e.key!=='Enter') return;
          const s = cp.value.trim().replace(/^U\+/i,'');
          let n = /^\d+-\d+$/.test(s) ? kutenToCp(s) : parseInt(s,16);
          if(!isFinite(n) || n<32){ Msg.flash('読み取れないコード'); return; }
          picked = String.fromCodePoint(n);
          hits = [picked]; api.paintHits(); api.paintInfo();
        });
        form.append(mk('div',{class:'bprow'},[sel]),
          mk('div',{class:'bprow'},[mk('span',{class:'bplabel',text:'コード'}), cp,
            swb('◀', ()=>{ blkAt=Math.max(0,blkAt-192); api.loadBlock(); }),
            swb('▶', ()=>{ blkAt+=192; api.loadBlock(); })]));
        const b = BLOCKS.find(x=>x.id===blk);
        if(b && b.note) form.appendChild(mk('div',{class:'bplabel',
          style:'font-size:10px',text:b.note}));
        if(!hits.length) api.loadBlock(true);
      },
      loadBlock(quiet){
        const b = BLOCKS.find(x=>x.id===blk); if(!b) return;
        const a = b.a + blkAt;
        hits = [];
        for(let n=a; n<=Math.min(b.b, a+191); n++) hits.push(String.fromCodePoint(n));
        if(!quiet){ api.paintHits(); api.paintInfo(); }
      },
      /* --- 異体字 / 異形字ゆらぎ : the demonstration --- */
      form_variant(){
        const q = mk('input',{class:'bfield',style:'width:108px',placeholder:'姓や字'});
        const go = ()=>{
          const s = q.value.trim();
          api.vgroups = s
            ? VARIANTS.filter(g=> g.key.indexOf(s)>=0 || g.name.indexOf(s)>=0 ||
                (g.kana||'').indexOf(s)>=0 || (g.kana||'').indexOf(kataToHira(s))>=0 ||
                g.forms.some(f=>f.c===s))
            : VARIANTS.slice();
          api.paintHits();
        };
        q.addEventListener('keydown', e=>{ e.stopPropagation();
          if(e.key==='Enter') go(); });
        form.append(mk('div',{class:'bprow'},[
          mk('span',{class:'bplabel',text:'異体字'}), q, swb('探す', go),
          swb('全部', ()=>{ q.value=''; go(); })]));
        form.appendChild(mk('div',{class:'bplabel',style:'font-size:10px',
          text:'渡辺・斉藤・山崎・高橋・吉田…… 姓を入れて、家の字を探す。'}));
        if(!api.vgroups) go();
      },
      /* --- 文字集合 : what this system can write and Unicode cannot -- */
      form_other(){
        form.appendChild(mk('div',{class:'bplabel',style:'font-size:10px',
          text:'超漢字が書けて、Unicodeが符号化していない文字たち。'+
            'ここで見えている空の枠が、このOSが作られた理由である。'}));
      },
      paintHits(){
        res.innerHTML = '';
        if(tab==='variant'){
          (api.vgroups||[]).forEach(g=>{
            const row = el('div','varrow');
            const lab = el('div','vl');
            lab.innerHTML = '<b>'+esc(g.name)+'</b><br>'+esc(g.kana||'');
            row.appendChild(lab);
            const box = el('div','csgrid');
            g.forms.forEach(f=>box.appendChild(CharSearch.glyph(f, api, true)));
            row.appendChild(box);
            res.appendChild(row);
            if(g.note) res.appendChild(mk('div',{class:'csnote',text:g.note}));
          });
          if(!(api.vgroups||[]).length)
            res.appendChild(mk('div',{class:'bpnote',text:'その字の異体字グループは入っていない。'}));
          return;
        }
        if(tab==='other'){
          NOCODE.forEach(nc=>{
            const row = el('div','varrow');
            const lab = el('div','vl');
            lab.innerHTML = '<b>'+esc(nc.nm)+'</b><br>'+esc(nc.n);
            row.appendChild(lab);
            const box = el('div','csgrid');
            for(let i=0;i<4;i++) box.appendChild(CharSearch.glyph({noUni:1,
              l:nc.nm, src:nc.en}, api, true));
            row.appendChild(box);
            res.appendChild(row);
            res.appendChild(mk('div',{class:'csnote',text:nc.note}));
          });
          res.appendChild(mk('div',{class:'bpnote',style:'padding:6px 7px;margin-top:4px',
            text:'いま見ている赤い枠には、中身が無い。Unicodeにその文字の番号が'+
              '存在しないので、どんな書体を入れても描けない。超漢字はTRONコードで'+
              '独自に番号を与えていたので、描けた。'}));
          return;
        }
        if(api.surname && api.surname.length && tab==='yomi'){
          api.surname.forEach(s=>{
            const row = el('div','varrow');

function swb(label, fn){
  const s = el('div','sw', label);
  s.style.minWidth='0'; s.style.padding='1px 7px'; s.style.fontSize='11px';
  s.addEventListener('click', fn);
  return s;
}
function kutenToCp(s){
  const m = s.match(/^(\d+)-(\d+)$/); if(!m) return NaN;
  const ku = +m[1], ten = +m[2];
  if(ku<16) return NaN;
  return 0x4E00 + (ku-16)*94 + (ten-1);
}

/* ==================================================================
   25. 仮身ネットワーク — the link map
   ------------------------------------------------------------------
   Nothing else in this museum can draw this picture. Every other
   filesystem here is a tree, and a tree drawn as a diagram tells you
   nothing you did not already know. This one is a graph: objects with
   several parents, objects that point back at their own ancestors,
   objects reachable by more than one route. Look for the orange
   outlines — those are 実身 with more than one 仮身 pointing at them —
   and the red dashed edges, which are cycles.
   ================================================================== */
const NetView = {
  open(w){
    const root = w.arg || SYS.home;
    const wrap = el('div','nwwrap');
    w.view.appendChild(wrap);
    let depth = 2, rootId = root;
    const api = {
      render(){
        wrap.innerHTML = '';
        const nw = Graph.network(rootId, depth);
        const ids = nw.order;
        /* layer by depth; wrap each layer into as many sub-rows as the
           window is wide enough for, so nothing ever needs sideways
           scrolling on an 800x600 screen */
        const layers = {};
        ids.forEach(id=>{
          const d = nw.nodes[id].depth;
          (layers[d] = layers[d] || []).push(id);
        });
        const NW = 96, NH = 20, PITCH = NW + 8, ROWH = 30, LAYERGAP = 22;
        const W = Math.max(220, w.view.clientWidth - 6);
        const perRow = Math.max(1, Math.floor((W - 12) / PITCH));
        const pos = {}, bands = [];
        let y = 18;
        Object.keys(layers).map(Number).sort((a,b)=>a-b).forEach(d=>{
          const row = layers[d];
          const sub = Math.ceil(row.length / perRow);
          bands.push({d, y, sub});
          row.forEach((id,i)=>{
            const r = Math.floor(i / perRow), k = i % perRow;
            const n = Math.min(perRow, row.length - r*perRow);
            const span = W / (n + 1);
            pos[id] = {x: span*(k+1), y: y + r*ROWH};
          });
          y += sub*ROWH + LAYERGAP;
        });
        const H = Math.max(w.view.clientHeight - 6, y + 46);
        const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
        s.setAttribute('class','nwsvg');
        s.setAttribute('width', W); s.setAttribute('height', H);
        s.setAttribute('viewBox','0 0 '+W+' '+H);
        s.style.position='absolute';
        let g = '';
        nw.edges.forEach(e=>{
          const a = pos[e.from], b = pos[e.to];
          if(!a || !b) return;
          const mid = (a.y + b.y)/2;
          const bend = e.back ? 26 : 0;
          g += '<path class="nwedge'+(e.back?' back':'')+'" d="M'+a.x+' '+(a.y+NH/2)+
            'C'+(a.x+bend)+' '+mid+' '+(b.x-bend)+' '+mid+' '+b.x+' '+(b.y-NH/2)+'"/>';
          if(e.tsu) g += '<text x="'+((a.x+b.x)/2+4)+'" y="'+(mid-1)+
            '" font-size="8" fill="#666">'+esc(e.tsu)+'</text>';
        });
        s.innerHTML = g;
        wrap.appendChild(s);
        ids.forEach(id=>{
          const n = nw.nodes[id], p = pos[id];
          if(!p) return;
          const box = el('div');
          const multi = n.refs > 1;
          box.style.cssText = 'position:absolute;left:'+(p.x-NW/2)+'px;top:'+(p.y-NH/2)+
            'px;width:'+NW+'px;height:'+NH+'px;background:var(--kam);'+
            'border:'+(id===rootId?'2px solid var(--acc)':
              n.cyc?'2px dashed var(--warn)':
              multi?'2px solid #a05000':'1px solid var(--kamedge)')+
            ';display:flex;align-items:center;gap:3px;padding:0 3px;'+
            'font:9.5px var(--gothic);overflow:hidden;white-space:nowrap;'+
            (id===rootId?'background:#fff6d8;':'');
          box.appendChild(pictSVG(n.type, 11, '#203040'));
          box.appendChild(mk('span',{text:n.name,
            style:'overflow:hidden;text-overflow:ellipsis;flex:1'}));
          if(multi) box.appendChild(mk('span',{text:'×'+n.refs,
            style:'font:9px var(--mono);color:#a05000'}));
          box.title = n.name + '／この実身を指す仮身 '+n.refs+'個'+
            (n.cyc?'／循環している':'');
          box.addEventListener('dblclick', ()=>WM.open(id));
          box.addEventListener('mousedown', e=>{
            if(e.button===2){
              e.preventDefault(); e.stopPropagation();
              Menu.show([
                {l:'開く', act:()=>WM.open(id)},
                {l:'ここを中心にする', act:()=>{ rootId=id; api.render(); }},
                {l:'実身の情報', act:()=>Shell.infoPanel(id)},
                {l:'仮身参照', act:()=>Shell.refsPanel(id)}
              ], Scale.pt(e).x, Scale.pt(e).y);
            }
          });
          wrap.appendChild(box);
        });
        bands.forEach(bd=>{
          wrap.appendChild(mk('div',{style:'position:absolute;left:2px;top:'+
            (bd.y-13)+'px;font:8px var(--mono);color:var(--lo)',
            text:'depth '+bd.d}));
        });
        const multiN = ids.filter(id=>nw.nodes[id].refs>1).length;
        const cycN = nw.edges.filter(e=>e.back).length;
        wrap.appendChild(mk('div',{class:'nwlegend',html:
          '中心：<b>'+esc(Graph.name(rootId))+'</b>　深さ '+depth+'<br>'+
          '実身 '+ids.length+'／仮身 '+nw.edges.length+
          '／複数参照 '+multiN+'／循環 '+cycN+'<br>'+
          '<span style="color:#a05000">橙の枠</span>＝二つ以上の仮身から指されている実身　'+
          '<span style="color:var(--warn)">赤の破線</span>＝循環'}));
        WM.sync(w);
      },
      resize(){ api.render(); },
      menu(){
        return [
          {l:'深さ', sub:[1,2,3,4,5,6].map(d=>({l:d+'段', chk:depth===d,
            act:()=>{ depth=d; api.render(); }}))},
          {l:'中心にする実身', sub:()=>{
            const ids = Object.keys(Graph.js).slice(0,40);
            return ids.map(id=>({l:Graph.name(id), chk:rootId===id,
              act:()=>{ rootId=id; api.render(); }}));
          }},
          '-',
          {l:'この図について', act:()=>Panel.open({title:'仮身ネットワーク', body:
            '<div class="bpnote" style="max-width:310px">'+
            'ディレクトリの木ではない。実身が節、仮身が辺の有向グラフである。'+
            '一つの実身に複数の親がありうるし、子が親を指し返してもよい。'+
            '木構造を前提にした道具——パス名、フォルダの入れ子、'+
            '「一つのファイルは一か所にある」という思い込み——が'+
            'ここでは全部ほどけてしまう。<br><br>'+
            'これを1985年に仕様として決め、1991年に製品として出した。</div>'})}
        ];
      }
    };
    return api;
  }
};

/* --- 電卓 --------------------------------------------------------- */
const Calc = {
  open(w){
    const wrap = el('div','calcwrap');
    const disp = el('div','calcdisp','0');
    const pad = el('div','calcpad');
    wrap.append(disp, pad);
    w.view.appendChild(wrap);
    let acc = 0, cur = '0', op = null, fresh = true;
    const show = ()=>{ disp.textContent = cur; };
    const num = v =>{
      if(fresh){ cur = v==='.'?'0.':v; fresh=false; }
      else if(v==='.'){ if(cur.indexOf('.')<0) cur += '.'; }
      else cur = (cur==='0') ? v : cur+v;
      show();
    };
    const apply = ()=>{
      const x = parseFloat(cur)||0;
      if(op==='+') acc += x; else if(op==='-') acc -= x;
      else if(op==='*') acc *= x; else if(op==='/') acc = x===0?NaN:acc/x;
      else acc = x;
      cur = String(Math.round(acc*1e10)/1e10);
      if(!isFinite(acc)) cur='エラー';
      show();
    };
    const KEYS = [['C','±','√','÷'],['7','8','9','×'],['4','5','6','−'],
                  ['1','2','3','＋'],['0','.','％','＝']];
    KEYS.forEach(row=>row.forEach(k=>{
      const b = el('div','sw', k);
      b.addEventListener('click', ()=>{
        Snd.key();
        if(/[0-9.]/.test(k)) return num(k);
        if(k==='C'){ acc=0; cur='0'; op=null; fresh=true; return show(); }
        if(k==='±'){ cur = String(-(parseFloat(cur)||0)); return show(); }
        if(k==='√'){ cur = String(Math.sqrt(parseFloat(cur)||0)); fresh=true; return show(); }
        if(k==='％'){ cur = String((parseFloat(cur)||0)/100); fresh=true; return show(); }
        if(k==='＝'){ apply(); op=null; fresh=true; return; }
        apply();
        op = {'÷':'/','×':'*','−':'-','＋':'+'}[k];
        fresh = true;
      });
      pad.appendChild(b);
    }));
    return {
      render(){},
      onKey(e){
        if(/^[0-9.]$/.test(e.key)){ num(e.key); return true; }
        if('+-*/'.indexOf(e.key)>=0){ apply(); op=e.key; fresh=true; return true; }
        if(e.key==='Enter' || e.key==='='){ apply(); op=null; fresh=true; return true; }
        if(e.key==='Escape'){ acc=0;cur='0';op=null;fresh=true;show(); return true; }
        if(e.key==='Backspace'){ cur = cur.length>1?cur.slice(0,-1):'0'; show(); return true; }
        return false;
      },
      copyToTray(){ Tray.pushText(cur); },
      menu(){ return [{l:'計算結果をトレーへ', act:()=>Tray.pushText(cur)}]; }
    };
  }
};
/* --- 時計 --------------------------------------------------------- */
const Clock = {
  open(w){
    const wrap = el('div','clockface');
    w.view.appendChild(wrap);
    let mode = 'analog';
    const draw = ()=>{
      const d = new Date();
      const R = Math.min(w.view.clientWidth, w.view.clientHeight)/2 - 3;
      const cx = w.view.clientWidth/2, cy = w.view.clientHeight/2;
      if(mode==='digital'){
        wrap.innerHTML = '';
        wrap.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;'+
          'background:var(--face)';
        wrap.appendChild(mk('div',{style:'text-align:center;font:22px var(--mono)',
          html: pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+
            '<div style="font:11px var(--gothic);margin-top:4px">'+
            d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+
            WDAY[d.getDay()]+'）</div>'}));
        return;
      }
      wrap.style.cssText = 'position:absolute;inset:0;background:var(--face)';
      let g = '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="var(--paper)" '+
        'stroke="var(--edge)"/>';
      for(let i=0;i<12;i++){
        const a = i*Math.PI/6 - Math.PI/2;
        const r1 = R-3, r2 = R-(i%3===0?9:5);
        g += '<line x1="'+(cx+r1*Math.cos(a))+'" y1="'+(cy+r1*Math.sin(a))+
          '" x2="'+(cx+r2*Math.cos(a))+'" y2="'+(cy+r2*Math.sin(a))+
          '" stroke="var(--edge)" stroke-width="'+(i%3===0?2:1)+'"/>';
      }
      const hand = (frac, len, wd)=>{
        const a = frac*Math.PI*2 - Math.PI/2;
        return '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+len*Math.cos(a))+
          '" y2="'+(cy+len*Math.sin(a))+'" stroke="var(--edge)" stroke-width="'+wd+
          '" stroke-linecap="round"/>';
      };
      g += hand((d.getHours()%12 + d.getMinutes()/60)/12, R*0.5, 3);
      g += hand((d.getMinutes() + d.getSeconds()/60)/60, R*0.75, 2);
      g += hand(d.getSeconds()/60, R*0.82, 1);
      g += '<circle cx="'+cx+'" cy="'+cy+'" r="2" fill="var(--edge)"/>';
      wrap.innerHTML = '';
      wrap.appendChild(svg(w.view.clientWidth, w.view.clientHeight, null, g));
    };
    const t = setInterval(draw, 1000);
    return {
      render:draw, resize:draw,
      destroy(){ clearInterval(t); },
      menu(){ return [

/* --- ねこ : a real 超漢字 accessory, and it does nothing useful --- */
const Neko = {
  open(w){
    const wrap = el('div','nekowrap');
    w.view.appendChild(wrap);
    let x = 40, y = 40, tx = 40, ty = 40, tick = 0, sleeping = 0;
    const draw = ()=>{
      const W = w.view.clientWidth, H = w.view.clientHeight;
      tick++;
      if(tick % 40 === 0 && !sleeping){ tx = 12+Math.random()*(W-40); ty = 12+Math.random()*(H-40); }
      const dx = tx-x, dy = ty-y, d = Math.hypot(dx,dy);
      if(d > 1.5){ x += dx/d*1.6; y += dy/d*1.6; sleeping = 0; }
      else sleeping++;
      const asleep = sleeping > 60;
      const leg = Math.sin(tick/3)*2;
      wrap.innerHTML = '';
      const g =
        '<ellipse cx="'+(x+14)+'" cy="'+(y+18)+'" rx="13" ry="9" fill="#f7f2e6" stroke="#3a332a"/>'+
        '<circle cx="'+(x+26)+'" cy="'+(y+11)+'" r="8.5" fill="#f7f2e6" stroke="#3a332a"/>'+
        '<path d="M'+(x+20)+' '+(y+5)+'l2-6 4 4zM'+(x+30)+' '+(y+4)+'l4-5 1 6z" '+
          'fill="#f7f2e6" stroke="#3a332a"/>'+
        (asleep
          ? '<path d="M'+(x+23)+' '+(y+11)+'h3M'+(x+28)+' '+(y+11)+'h3" stroke="#3a332a"/>'
          : '<circle cx="'+(x+24)+'" cy="'+(y+10)+'" r="1.3" fill="#222"/>'+
            '<circle cx="'+(x+30)+'" cy="'+(y+10)+'" r="1.3" fill="#222"/>')+
        '<path d="M'+(x+26)+' '+(y+14)+'l-1.5 1.5M'+(x+26)+' '+(y+14)+'l1.5 1.5" stroke="#3a332a"/>'+
        '<path d="M'+(x+2)+' '+(y+16)+'c-6-2-7-8-2-10" fill="none" stroke="#3a332a"/>'+
        '<path d="M'+(x+8)+' '+(y+26)+'v'+(4+leg)+'M'+(x+16)+' '+(y+26)+'v'+(4-leg)+
          'M'+(x+22)+' '+(y+25)+'v'+(4+leg)+'" stroke="#3a332a"/>'+
        (asleep ? '<text x="'+(x+34)+'" y="'+(y+4)+'" font-size="9" fill="#666">z z</text>' : '');
      wrap.appendChild(svg(W, H, null, g));
    };
    const t = setInterval(draw, 60);
    wrap.addEventListener('mousemove', e=>{
      const r = wrap.getBoundingClientRect();
      tx = (e.clientX-r.left)/Scale.f - 14; ty = (e.clientY-r.top)/Scale.f - 14;
      sleeping = 0;
    });
    return {
      render:draw, resize:draw, destroy(){ clearInterval(t); },
      menu(){ return [{l:'ねこについて', act:()=>Panel.open({title:'ねこ', body:
        '<div class="bpnote" style="max-width:270px">超漢字のアクセサリの一つ。'+
        '何の役にも立たない。ポインタを追いかけ、追いつくと寝る。'+
        '25年間、削られずに入っていた。</div>'})}]; }
    };
  }
};

const Lang = {
  obs: null,
  apply(){
    const eo = State.data.lang === 'eo';
    if(this.obs){ this.obs.disconnect(); this.obs = null; }
    if(!eo) return;
    const root = $('#ck');
    this.sweep(root);
    this.obs = new MutationObserver(muts=>{
      for(const m of muts){
        if(m.type === 'childList') m.addedNodes.forEach(n=>this.sweep(n));
        else if(m.type === 'characterData') this.node(m.target);
      }
    });
    this.obs.observe(root, {childList:true, subtree:true, characterData:true});
  },
  sweep(n){
    if(!n) return;
    if(n.nodeType === 3){ this.node(n); return; }
    if(n.nodeType !== 1) return;
    /* the character 小物 and the input panel stay in Japanese, as in
       the real kit */
    if(n.classList && (n.classList.contains('csw') || n.id === 'imepanel')) return;
    const walk = document.createTreeWalker(n, NodeFilter.SHOW_TEXT);
    const list = [];
    while(walk.nextNode()) list.push(walk.currentNode);
    list.forEach(t=>this.node(t));
  },
  node(t){
    if(!t || !t.nodeValue) return;
    const s = t.nodeValue.trim();
    if(!s) return;
    const eo = EO[s];
    if(eo && eo !== s) t.nodeValue = t.nodeValue.replace(s, eo);
  }
};

const MicroScript = {
  open(w){
    const jid = w.arg || w.jid;
    const wrap = el('div');
    wrap.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column';
    const ta = mk('textarea',{class:'bfield',style:'flex:1;border:0;border-bottom:1px '+
      'solid var(--lo);font:11px/1.5 var(--mono);resize:none;padding:5px 6px'});
    const out = el('div');
    out.style.cssText='flex:0 0 74px;overflow:auto;background:#101418;color:#c8e6d0;'+
      'font:10px/1.45 var(--mono);padding:4px 6px;white-space:pre-wrap';
    const bar = el('div');
    bar.style.cssText='flex:0 0 20px;display:flex;align-items:center;gap:4px;'+
      'background:var(--face);border-top:1px solid var(--lo);padding:0 4px';
    wrap.append(ta, out, bar);
    w.view.appendChild(wrap);
    ta.addEventListener('keydown', e=>e.stopPropagation());
    ta.value = (jid && Graph.get(jid) && Graph.get(jid).content.src) || [
      '# マイクロスクリプト — 台本を書くと、役者（図形）が動く',
      '#   使える命令： 表示 / 待つ / 実身をつくる / 仮身をおく / 数える / 終わり',
      '表示 "実身と仮身の数をかぞえる"',
      '数える',
      '実身をつくる "スクリプトが作った文書"',
      '仮身をおく',
      '表示 "できた。初期ウィンドウを見よ。"',
      '終わり'
    ].join('\n');
    const api = {
      render(){
        bar.innerHTML = '';
        bar.append(swb('実行', ()=>api.run()), swb('消す', ()=>{ out.textContent=''; }),
          mk('span',{class:'bplabel',style:'font-size:10px',
            text:'図形編集で舞台と役者を作り、ここに台本を書く——それが本物の作りである。'}));
        if(jid && Graph.get(jid)) Graph.get(jid).content.src = ta.value;
        WM.sync(w);
      },
      run(){
        out.textContent = '';
        const log = s => { out.textContent += s+'\n'; out.scrollTop = out.scrollHeight; };
        const lines = ta.value.split('\n');
        let made = null, step = 0;
        const tick = ()=>{
          if(step >= lines.length){ log('— 台本の終わり —'); return; }
          const ln = lines[step++].trim();
          if(!ln || ln.charAt(0)==='#') return tick();
          const m = ln.match(/^(\S+)\s*(.*)$/);
          const cmd = m ? m[1] : ln;
          const arg = m ? m[2].replace(/^"|"$/g,'') : '';
          switch(cmd){
            case '表示': log('▸ '+arg); break;
            case '数える':
              log('  実身 '+Object.keys(Graph.js).length+' 個');
              log('  仮身 '+Object.keys(Graph.js).reduce((n,id)=>
                n+Graph.kamsIn(id).length,0)+' 個');
              log('  くず実身 '+Graph.orphans().length+' 個');
              break;
            case '実身をつくる':
              made = Graph.make({name:arg||'スクリプトの文書', type:'bunsho',
                content:TAD.doc([TAD.txt('マイクロスクリプトが作った実身。')])});
              log('  実身「'+made.name+'」をつくった ('+made.id+')');
              break;
            case '仮身をおく':
              if(!made){ log('  ! まず実身をつくる'); break; }
              Graph.place(SYS.home, Graph.newKam(made.id, {mode:'icon'}));
              Deck.arrange(SYS.home); WM.refreshJid(SYS.home);
              log('  初期ウィンドウに仮身をおいた');
              break;
            case '待つ': setTimeout(tick, Math.min(2000, (parseInt(arg)||500))); return;
            case '終わり': log('— 終わり —'); return;
            default: log('  ? 知らない命令: '+cmd);
          }
          setTimeout(tick, 60);
        };
        tick();
      },
      save(){ if(jid && Graph.get(jid)){ Graph.get(jid).content.src = ta.value;
        Graph.bump(jid); } w.dirty=false; touch(); },
      resize(){ WM.sync(w); },
      menu(){ return [{l:'実行', act:()=>api.run()},
        {l:'プログラミング言語Tについて', act:()=>Panel.open({title:'言語T', body:
          '<div class="bpnote" style="max-width:290px">'+
          'マイクロスクリプトの下には「プログラミング言語T」があり、'+
          '超漢字はその開発環境まで同梱していた。'+
          '2006年の家庭向けOSに、処理系が二つ入っていた。</div>'})}]; }
    };
    return api;
  }
};

/* ==================================================================
   29. THE WORLD — the seed 実身/仮身 graph
   ------------------------------------------------------------------
   The exhibit's own documents are 実身, of course, and the history
   panel is a 実身 full of 仮身 pointing at its sub-topics — which
   lets the history demonstrate the filesystem while it explains it.
   ================================================================== */
function T(s, f){ return TAD.txt(s, f); }
function H(s){ return TAD.txt(s, {fnt:'gothic', b:true, siz:16}); }
function H2(s){ return TAD.txt(s, {fnt:'gothic', b:true, siz:14, col:'#0d3b8f'}); }
const NL = ()=>TAD.nl(), PP = ()=>TAD.pp();
/* build a document from a compact spec: '#' heading, '##' subheading,
   '' blank line, otherwise a paragraph */
function doc(lines, opts){
  const segs = [];
  lines.forEach(l=>{
    if(l === ''){ segs.push(PP()); return; }
    if(l.slice(0,2) === '##'){ segs.push(H2(l.slice(2).trim())); segs.push(NL()); return; }
    if(l.charAt(0) === '#'){ segs.push(H(l.slice(1).trim())); segs.push(NL()); return; }
    segs.push(T(l)); segs.push(NL());
  });
  return TAD.doc(segs, opts);
}

/* ==================================================================
   32. THE WINDOWS HOST — the outer doll
   ------------------------------------------------------------------
   超漢字V R4.560 does not run on bare metal. It runs as a VMware
   Player guest inside Windows, which is how anyone who uses it today
   uses it. So the integration features — 共有フォルダ参照, トレー ⇄
   clipboard, printing through the host driver, switching between
   guest and host — are part of the artefact, and here they work
   against the simulated shell rather than being described.
   ================================================================== */
/* variant forms that live outside JIS X 0208, so Shift-JIS cannot
   carry them. Not exhaustive — enough to make the loss visible. */
const NOTJIS208 = [0x9AD9,  /* 髙 はしごだか */
                   0x9751,  /* 靑 */
                   0x5FB7,  /* 德 */
                   0x60E0,  /* 惠 */
                   0x5D8C,  /* 嶌 */
                   0x6FF5,  /* 濵 */
                   0x9F92,  /* 龒 */
                   0x8EB0,  /* 躰 */
                   0x9089,  /* 邉 */
                   0x7028   /* 瀨 */
                  ].map(n=>String.fromCodePoint(n)).join('');

const Host = {
  wins: {}, z: 10, act: null,
  init(){
    this.fitVM();

    this.wall();

  /* letterboxing is authentic, but there is no reason to waste the
     visitor's screen on it: size the Player window to the guest's 4:3 */
  fitVM(){
    const vm = $('#vmwin');
    if(!vm || vm.classList.contains('full')) return;
    const CHROME = 28 + 22 + 26 + 22 + 2;
    const availW = innerWidth - 44, availH = innerHeight - 34 - 24;
    let s = Math.min((availW - 2) / 800, (availH - CHROME) / 600);
    s = Math.max(0.62, Math.min(s, 1.9));
    const w = Math.round(800 * s) + 2, h = Math.round(600 * s) + CHROME;
    vm.style.width = w + 'px'; vm.style.height = h + 'px';
    vm.style.left = Math.max(112, Math.round((innerWidth - w) / 2)) + 'px';
    vm.style.top = Math.max(6, Math.round((innerHeight - 34 - h) / 2)) + 'px';
    if(typeof Scale !== 'undefined') setTimeout(()=>Scale.fit(), 0);
  },
  wall(){

        'stroke-width="'+(i%3===0?1.6:0.7)+'" stroke-dasharray="'+
        (i%2? '3 9':'260 40')+'"/>');

    for(let i=0;i<15;i++){
      const a = i*Math.PI/7.5;
      g.push('<line x1="330" y1="470" x2="'+(330+960*Math.cos(a))+'" y2="'+
        (470+960*Math.sin(a))+'" stroke="#7fc4f0" stroke-width="0.5"/>');
    }
    g.push('<g opacity="0.5">');
    for(let i=0;i<7;i++)
      g.push('<rect x="'+(1080+i*14)+'" y="'+(140+i*14)+'" width="240" height="150" '+
        'fill="none" stroke="#a8dcff" stroke-width="1"/>');

    tb('Network','<path d="M8 2v5M3 13h10M4 13V9h8v4" fill="none" stroke="#555"/>',

  vmFull(on){

  /* ---- host windows ---- */
  win(id, title, w, h, build, o){
    if(this.wins[id]){ this.focus(id); return this.wins[id]; }
    o = o || {};
    const n = el('div','hwin');
    n.style.left = (o.x!=null?o.x:200+Object.keys(this.wins).length*26)+'px';
    n.style.top  = (o.y!=null?o.y:120+Object.keys(this.wins).length*22)+'px';
    n.style.width = w+'px'; n.style.height = h+'px';
    const t = el('div','hwtitle');
    t.appendChild(mk('span',{class:'t',text:title}));
    const bmin = el('div','hwbtn','—'), bmax = el('div','hwbtn','▢'),
          bx = el('div','hwbtn x','✕');
    t.append(bmin,bmax,bx);
    const body = el('div','hwbody');
    n.append(t, body);
    $('#hostwins').appendChild(n);
    const rec = {id, node:n, body, title};
    this.wins[id] = rec;
    build(rec);
    t.addEventListener('mousedown', e=>{
      if(e.button!==0 || e.target!==t && !e.target.classList.contains('t')) return;
      this.focus(id);
      const x0 = parseInt(n.style.left), y0 = parseInt(n.style.top);
      const sx = e.clientX, sy = e.clientY;
      const mv = ev=>{ n.style.left = (x0+ev.clientX-sx)+'px';
                       n.style.top = Math.max(0,(y0+ev.clientY-sy))+'px'; };
      const up = ()=>{ document.removeEventListener('mousemove',mv);
                       document.removeEventListener('mouseup',up); };
      document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
    });
    n.addEventListener('mousedown', ()=>this.focus(id));
    bx.addEventListener('click', ()=>this.close(id));
    bmin.addEventListener('click', ()=>{ n.style.display='none'; this.tasks(); });
    bmax.addEventListener('click', ()=>{
      if(rec.maxed){ Object.assign(n.style, rec.maxed); rec.maxed=null; }
      else {
        rec.maxed = {left:n.style.left, top:n.style.top, width:n.style.width,
          height:n.style.height};
        Object.assign(n.style, {left:'0px', top:'0px', width:'100%',
          height:'calc(100% - 34px)'});
      }
    });
    this.focus(id);
    this.tasks();
    return rec;
  },
  focus(id){
    $('#vmwin').classList.toggle('act', id==null);
    for(const k in this.wins){
      this.wins[k].node.classList.toggle('act', k===id);
      if(k===id){ this.wins[k].node.style.zIndex = ++this.z;
                  this.wins[k].node.style.display=''; }
    }
    if(id!=null) $('#vmwin').style.zIndex = 20;
    else $('#vmwin').style.zIndex = ++this.z;
    this.act = id;
    this.tasks();
  },
  close(id){
    const r = this.wins[id]; if(!r) return;
    r.node.remove(); delete this.wins[id];
    this.tasks();
  },
  tasks(){
    const bar = $('#hosttasks');
    bar.innerHTML = '';
    const add = (label, act, fn)=>{
      const b = el('div','htask'+(act?' act':''), label);
      b.addEventListener('click', fn);
      bar.appendChild(b);
    };
    add('超漢字V — VMware Player', this.act==null, ()=>this.focus(null));
    for(const k in this.wins)
      add(this.wins[k].title, this.act===k, ()=>{
        const n = this.wins[k].node;
        if(n.style.display==='none' || this.act!==k) this.focus(k);
        else { n.style.display='none'; this.act=null; this.tasks(); }
      });

  hostMenu(x, y, items){
    $$('.hostmenu').forEach(n=>n.remove());
    const m = el('div','hostmenu');
    m.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;z-index:999;'+
      'background:#fff;border:1px solid #b0b0b0;box-shadow:0 6px 20px rgba(0,0,0,.3);'+
      'font:12px system-ui,sans-serif;min-width:250px;padding:3px 0';
    items.forEach(([l,fn])=>{
      const r = el('div',null,l);
      r.style.cssText='padding:5px 12px';
      r.addEventListener('mouseenter', ()=>r.style.background='#cfe4f7');
      r.addEventListener('mouseleave', ()=>r.style.background='');
      r.addEventListener('click', ()=>{ m.remove(); fn(); });
      m.appendChild(r);
    });
    document.body.appendChild(m);
  },
  /* ---- 共有フォルダ ---- */
  sharedFiles(){ return State.data.shared || []; },
  writeShared(name, text, kind){
    const f = this.sharedFiles();
    const i = f.findIndex(x=>x.name===name);
    /* シフトJIS conversion: the characters that will not fit */
    if(kind === 'txt'){
      text = Array.from(text).map(ch=>{
        const cp = ch.codePointAt(0);
        const inRange = cp < 0x80 || (cp>=0x3000 && cp<=0x30FF) ||
                        (cp>=0x4E00 && cp<=0x9FA0) || (cp>=0xFF00 && cp<=0xFFEF);
        /* the compatibility block, everything above the BMP, and the
           JIS level-3 forms below are not in JIS X 0208 — which is all
           Shift-JIS can carry */
        const lost = !inRange || (cp>=0xF900 && cp<=0xFAFF) || cp > 0xFFFF ||
                     NOTJIS208.indexOf(ch) >= 0;
        return lost ? '〓' : ch;
      }).join('');
    }
    const rec = {name, text, kind};
    if(i>=0) f[i] = rec; else f.push(rec);
    touch();
    if(this.wins.explorer) this.explorerFill(this.wins.explorer);
    WM.refreshAll();
    if(kind === 'txt' && text.indexOf('〓') >= 0)
      Panel.alert('文字が落ちた',
        'シフトJISに変換できなかった文字を「〓」に置き換えた。\n\n'+
        '18万字の世界から7千字の世界へ書き出すと、こうなる。\n'+
        '外へ出すたびに、どの字を捨てるかを決めなければならない。');
  },
  deleteShared(name){
    State.data.shared = this.sharedFiles().filter(f=>f.name!==name);
    touch();
    if(this.wins.explorer) this.explorerFill(this.wins.explorer);
    WM.refreshAll();
  },
  openExplorer(){
    this.win('explorer', '共有 — エクスプローラー', 430, 260, r=>{
      const menu = el('div','hwmenu');
      ['ファイル','編集','表示','ツール','ヘルプ'].forEach(m=>
        menu.appendChild(mk('span',{text:m})));
      const path = el('div','exppath');
      path.append(
        svg(13,13,'0 0 13 13','<path d="M1 3h5l1.2 1.6H12v7H1z" fill="#f0c66a" stroke="#8a6a20"/>'),
        mk('span',{class:'crumb',text:'PC'}), mk('span',{text:'›'}),
        mk('span',{class:'crumb',text:'C:'}), mk('span',{text:'›'}),
        mk('span',{class:'crumb',text:'超漢字V'}), mk('span',{text:'›'}),
        mk('span',{class:'crumb',text:'共有'}));
      const grid = el('div','expgrid');
      const stat = el('div','hwstatus');
      r.node.insertBefore(menu, r.body);
      r.node.insertBefore(path, r.body);
      r.body.appendChild(grid);
      r.node.appendChild(stat);
      r.grid = grid; r.stat = stat;
      this.explorerFill(r);
    }, {x:520, y:300});
  },
  explorerFill(r){
    if(!r.grid) return;
    r.grid.innerHTML = '';
    const files = this.sharedFiles();
    files.forEach(f=>{
      const n = el('div','expitem');
      n.appendChild(svg(30,30,'0 0 30 30',
        '<rect x="6" y="2" width="18" height="25" fill="#fff" stroke="#8898a8"/>'+
        '<path d="M10 8h10M10 12h10M10 16h10M10 20h6" stroke="#a8b8c8"/>'));
      n.appendChild(mk('div',{text:f.name}));
      n.addEventListener('click', ()=>{
        $$('.expitem.sel', r.grid).forEach(x=>x.classList.remove('sel'));
        n.classList.add('sel');
        r.stat.textContent = f.name + ' — ' + (f.text||'').length + ' バイト';
      });
      n.addEventListener('dblclick', ()=>this.openNotepad(f.name));
      r.grid.appendChild(n);
    });
    if(!files.length) r.grid.appendChild(mk('div',{style:'padding:14px;color:#888',
      text:'このフォルダーは空です。'}));
    r.stat.textContent = files.length + ' 個の項目　—　'+
      '超漢字Vの［共有フォルダ参照］から同じものが見えます';
  },
  openNotepad(name){
    const id = 'notepad';
    const f = name ? this.sharedFiles().find(x=>x.name===name) : null;
    if(this.wins[id]) this.close(id);
    this.win(id, (f?f.name:'無題')+' — メモ帳', 380, 250, r=>{
      const menu = el('div','hwmenu');
      ['ファイル','編集','書式','表示','ヘルプ'].forEach(m=>
        menu.appendChild(mk('span',{text:m})));
      r.node.insertBefore(menu, r.body);
      const ta = mk('textarea',{id:'notepadta'});
      ta.value = f ? f.text : (State.data.clip || '');
      r.body.appendChild(ta);
      const stat = el('div','hwstatus');
      stat.append(mk('span',{text:'貼り付け： Ctrl+V（超漢字Vのトレーから渡したものが入る）'}));
      r.node.appendChild(stat);
      r.ta = ta;
      ta.addEventListener('input', ()=>{
        if(f){ f.text = ta.value; touch();
          if(this.wins.explorer) this.explorerFill(this.wins.explorer); }
      });
      ta.addEventListener('keydown', e=>{
        if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='v'){
          e.preventDefault();
          const s = State.data.clip || '';
          const a = ta.selectionStart, b = ta.selectionEnd;
          ta.value = ta.value.slice(0,a) + s + ta.value.slice(b);
          ta.selectionStart = ta.selectionEnd = a + s.length;
          if(f){ f.text = ta.value; touch(); }
        }
        if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c'){

const Annot = {
  init(){
    const g = $('#gloss');
    document.addEventListener('mouseover', e=>{
      if(!document.body.classList.contains('annot')) return;
      const t = e.target.closest && e.target.closest('[data-gloss]');
      if(!t){ g.classList.remove('on'); return; }
      const key = t.dataset.gloss;
      const d = GLOSS[key];
      if(!d){ g.classList.remove('on'); return; }
      g.innerHTML = '<span class="jp">'+esc(d[0])+'</span>'+
        '<span class="ro">'+esc(d[1])+'</span>'+
        '<span class="en">'+esc(d[2])+'</span>';
      g.classList.add('on');
      const r = t.getBoundingClientRect();
      const gw = g.offsetWidth, gh = g.offsetHeight;
      let x = r.left, y = r.bottom + 7;
      if(x + gw > innerWidth - 8) x = innerWidth - gw - 8;
      if(y + gh > innerHeight - 8) y = r.top - gh - 7;
      g.style.left = Math.max(6,x)+'px';
      g.style.top  = Math.max(6,y)+'px';
    });
    document.addEventListener('mouseout', e=>{
      if(e.target.closest && e.target.closest('[data-gloss]')) $('#gloss').classList.remove('on');
    });
    $('#btn-annot').addEventListener('click', ()=>{
      const on = !document.body.classList.contains('annot');
      document.body.classList.toggle('annot', on);
      $('#btn-annot').classList.toggle('on', on);
      State.data.annot = on; touch();
    });
  }
};

<tr><td>くず実身<br><i>kuzu-jitsumi</i></td><td>An object nothing points at any more. Normally
reclaimed the instant the last 仮身 goes; 削除不可 objects survive as garbage until
ディスク管理 tidies them. Reference counting, visible to the user.</td></tr>
</table>
<h3>Consequences, all of them implemented</h3>
<ul>
<li><b>There is no folder.</b> What looks like one is a 実身 whose content happens to be a
collection of 仮身 — and it opens in the <i>text editor</i>, showing them as icons. Switch that
same window to <b class="jp">文章として表示</b> and you are editing prose in the "folder".</li>
<li><b>One object, many references.</b> Delete one and the object survives; the object goes
when nothing points at it. The 削除 panel spells the difference out every time.</li>
<li><b>Three display modes for a reference:</b> a closed strip inline in running text, an icon,
or <i>opened in place</i> so the referenced content is embedded in the container.</li>
<li><b>Arbitrary graphs, including cycles.</b> A document can hold a 仮身 to itself. Open it in
place and it nests, then reports the cycle and stops.</li>
<li><b>Reverse links.</b> <span class="jp">仮身参照</span> asks "who points here?" — a question
a tree cannot answer.</li>
</ul>
<div class="gnote"><b>The payoff, in order:</b> open <span class="jp">実身と仮身のしくみ</span>;
right-click its trailing 仮身 → <span class="jp">この場で開く</span> (it nests, then stops at
the cycle); <span class="jp">実身操作</span> → <span class="jp">仮身作成</span> from a different
document to make a second reference; edit through one and watch the other's caption follow;
delete one reference and read what the panel tells you about the other.</div>
<h3>The operation worth trying</h3>
<p>In a text window, select a sentence, then <span class="jp">検索</span> →
<span class="jp">文章の一部分を別の実身にする</span>. The selection becomes an object of its own
and a 仮身 stays behind in its place. That single command is the whole filesystem in miniature —
and <span class="jp">仮身の中身を展開して取り込む</span> runs it backwards.</p>`},
    {id:'chars', t:'180,000 characters', html:`
<h2>多漢字 — and the honest gap</h2>
<p>超漢字V advertises about <b>180,000 characters</b>: JIS levels 1–4, simplified and
traditional Chinese, Korean hanja and hangul, 人名用異体字 (name variants), 住基ネット統一文字
(resident-register characters), 変体仮名 (hentaigana), 甲骨文字 (oracle bone script), 梵字
(Siddham), 点字 (braille), Dongba pictographs, European and Arabic scripts — mixed freely in one
paragraph, with no encoding negotiation. That last part was extraordinary in 1999 and is the
whole design point of TRON Code.</p>
<div class="gnote"><b>You cannot ship 180,000 glyphs in one HTML file</b>, and pretending
otherwise would betray this exhibit's subject. So: text renders in <b>your</b> system CJK fonts;
the searches run over a curated dataset embedded in the file (about 1,700 characters indexed by
radical, stroke count and reading, plus 30 variant families); the code browser walks the Unicode
blocks your fonts can draw. And where 超漢字 can write something Unicode cannot encode at all,
the exhibit draws an <b>empty red box on purpose</b>.</div>
<h3>Two different failures, kept apart</h3>
<table class="tbl"><tr><th>What you see</th><th>What it means</th></tr>
<tr><td>Empty red box,<br>marked 符号なし</td><td>Unicode has <b>no codepoint</b> for this
character. No font can draw it. 超漢字 numbered it in TRON Code, so 超漢字 could.</td></tr>
<tr><td>A tofu box □<br>marked 稀</td><td>Unicode <b>does</b> have a codepoint — it is simply
outside your fonts. Install the right font and it appears. A different problem, often confused
with the first.</td></tr>
</table>
<h3>Why local government kept buying a "dead" OS</h3>
<p>Open <span class="jp">小物</span> → <span class="jp">文字検索</span> →
<span class="jp">異体字</span> and search <span class="jp">わたなべ</span>. You get 渡辺, 渡邊,
渡邉 — and then boxes with no codepoints at all, because the 辺 in that surname has dozens of
historical forms and the resident-register character set encodes many that Unicode does not.</p>
<p>齋・齊・斎・斉 in 齋藤 are <i>four different surnames</i>: 齋 and 齊 were never the same
character. 﨑 in 山﨑 is not 崎. 髙 in 髙橋 is not 高. A registrar has to write what the register
says. A librarian has to catalogue what the colophon says. Ordinary systems make a person accept
a wrong version of their own name; this one did not.</p>
<p>Then it went further, in the other direction: <b>異形字ゆらぎ同一視</b> — variant-form fuzzy
matching. Open <span class="jp">名簿（異体字入り）</span>,
<span class="jp">カード操作</span> → <span class="jp">検索</span>, type 渡辺 with the
同一視 box ticked, and all three spellings come back as one person. Register the name as the
document spells it; find it however anyone asks. That is why registries, libraries and family
historians bought this for twenty years, and it is not a hobbyist's feature — it is the job.</p>`},
    {id:'history', t:'History', html:`
<h2>The TRON family, and 1989</h2>
<p>TRON was proposed in 1984 by <b>Ken Sakamura (坂村健)</b> at the University of Tokyo: not one
operating system but a whole re-design of computing, split into <b>ITRON</b> (embedded),
<b>BTRON</b> (the desktop), <b>CTRON</b> (telecoms) and <b>MTRON</b> (linking things together).
Strictly, the OS here is <b>B-right/V</b>, developed and sold by <b>Personal Media Corporation</b>
(パーソナルメディア株式会社); <b class="jp">超漢字</b> is that OS plus its fonts, word processor,
spreadsheet and the rest.</p>
<table class="tbl"><tr><th>Year</th><th></th></tr>
<tr><td>1984</td><td>TRON proposed</td></tr>
<tr><td>1989</td><td>April: USTR names BTRON under Super 301 · May: inspection visit, then
removal from the list · June: Japan accepts the request not to standardise it in schools</td></tr>
<tr><td>1991</td><td>1B/note</td></tr>
<tr><td>1998</td><td>B-right/V (BTRON3)</td></tr>
<tr><td>1999</td><td>超漢字 (about 50,000 characters at first), then 超漢字2 · 3 · 4</td></tr>
<tr><td>2006</td><td>超漢字V, 27 October, ¥18,900 — as a VMware guest</td></tr>
<tr><td>2025</td><td>R4.560, 12 February</td></tr>
</table>
<h3>The contested part, handled carefully</h3>
<p><b>What is documented:</b> in April 1989 the United States Trade Representative named Japan's
plan to use BTRON for school computers as a potential trade barrier under the Super 301
provisions of the Omnibus Trade Act. A USTR team visited the TRON Association in May; BTRON was
then removed from the list and the initial criticism withdrawn. In June the Japanese government
expressed regret at the intervention but accepted the request not to make it a school standard.
The standardisation never happened, and manufacturers who had built BTRON machines retreated.</p>
<p><b>What is genuinely debated:</b> how decisive that was. One reading holds that being listed
at all was enough — companies feared consequences in the US market, and momentum once lost did
not return. Another holds that commercial factors weighed more: BTRON machines were expensive,
application software was scarce, and PC/AT clones with MS-DOS were collapsing in price at exactly
that moment. School procurement follows price and track record.</p>
<p>Both were in play; this exhibit does not rank them, and the in-system document says so too.
What it will not do is repeat the conspiratorial version that circulates about this episode —
there is no support for it. The record is a listing, an inspection, a removal, and a plan that
quietly died.</p>
<h3>The closing irony</h3>
<p>The desktop TRON failed. <b>ITRON</b>, its embedded sibling, became one of the most widely
deployed operating-system families on Earth — cars, cameras, appliances, by the billion. Nobody
knows the exact figure, because the spec was open and the implementations were everyone's. The
family won everywhere except the desk.</p>
<p>And Personal Media kept going. About <b>70,000 copies</b> cumulative — a very small number for
an operating system, and a very large one for a labour of love. The annual TRON Symposium still
runs. 超漢字V is still sold. R4.560 exists because a new VMware version started showing one
warning panel, and somebody fixed it.</p>`},
    {id:'vocab', t:'Vocabulary', html:`
<h2>The system's own words</h2>
<p>These are not translations to be replaced with familiar Western terms. Each one marks a place
where BTRON decided something different.</p>
<table class="tbl">
<tr><th>Word</th><th>Not</th><th>Why it matters</th></tr>
<tr><td>実身 / 仮身</td><td>"file" / "shortcut"</td><td>A 仮身 is data inside another object's
content, not a file in a folder. There is no folder.</td></tr>
<tr><td>基本ブラウザ</td><td>"file manager"</td><td>A trap for English readers: this is the
<i>web</i> browser. The object browser is 基本文章編集 showing a 仮身一覧 — the text editor,
because a folder is a document.</td></tr>
<tr><td>小物</td><td>"utilities"</td><td>A program that operates on 実身 data is an
アプリケーション. Everything else is a 小物, a "small thing". Two registries.</td></tr>
<tr><td>トレー</td><td>"clipboard"</td><td>A stack, not a slot; typed, not textual; visible in a
小物 of its own; and the bridge to Windows.</td></tr>
<tr><td>原紙</td><td>"template"</td><td>Stationery you take a sheet from. A close cousin of the
Apple Lisa's stationery pads — if this museum holds a Lisa exhibit, read the two side by side.</td></tr>
<tr><td>続柄</td><td>—</td><td>The relationship, written on the reference. There is no Western
term because no Western filesystem has the place to put it.</td></tr>
<tr><td>スイッチ / パネル</td><td>"button" / "dialog"</td><td>Its own vocabulary, all the way
down.</td></tr>
<tr><td>指定付せん</td><td>"formatting mark"</td><td>A "specification sticker" in the TAD
stream.</td></tr>
<tr><td>くず実身</td><td>"trash"</td><td>Not a wastebasket — objects nothing points at. The
difference is reference counting, and the interface shows it.</td></tr>
<tr><td>TAD</td><td>—</td><td>TRON Application Databus: text, figures and 仮身 in one stream, so
a spreadsheet cell can hold a document. <span class="jp">表示</span> →
<span class="jp">TAD構造表示</span> shows you the stream.</td></tr>
</table>
<h3>What is deliberately absent</h3>
<p>No directory tree. No path syntax. No filename extensions — they get invented at the border,
in ファイル変換, when something leaves for Windows. Try writing a document out as Shift-JIS and
watch what happens to the characters that will not fit.</p>`},
    {id:'about', t:'About / keys', html:`
<h2>Using the exhibit</h2>
<table class="tbl"><tr><th>Do this</th><th>To get</th></tr>
<tr><td>Right button, anywhere</td><td>The menu. There is no menu bar. Press-drag-release works,
so does click-then-click. The <b>メ</b> gadget in the window frame is a courtesy.</td></tr>
<tr><td>Double-click a 仮身</td><td>Open the object it points at, in its own window.</td></tr>
<tr><td>Double-click a window's pictogram</td><td>Quit that window — the manual's own
shortcut.</td></tr>
<tr><td>Ctrl+C / X / V</td><td>トレーへ複写 / 移動 / トレーから複写.</td></tr>
<tr><td>Space, while typing kana</td><td>かな漢字変換. Enter confirms. Try
<span class="jp">わたなべ</span> or <span class="jp">さいとう</span>.</td></tr>
<tr><td>A</td><td>Toggle the English annotations.</td></tr>
<tr><td>?</td><td>This guide.</td></tr>
</table>
<h3>Things worth finding</h3>
<ul>
<li>The <b>Esperanto</b> localisation, in <span class="jp">小物</span> →
<span class="jp">言語切替</span>. Personal Media genuinely shipped a kit that converted the menus
and panels into Esperanto; it needed R4.540 or later and restarted the system. Nobody believes
this. It is true. (The Esperanto wording here is this exhibit's own.)</li>
<li>The <b>Dongba script</b> sample in <span class="jp">多漢字の世界</span> — a Naxi pictograph
font really was published for this system, and Unicode still has no codepoints for it.</li>
<li>The <b>R4.560 release notes</b>, findable in the 初期ウィンドウ, explaining that the patch
exists because a new VMware version showed a warning panel.</li>
<li>A <b>仮身 pointing at the history document, from inside the history document.</b></li>
<li>A <b>surname search that finds a form this exhibit cannot render</b>, drawn as an empty box.</li>
<li>The <b>μTRON keyboard price list</b> — ¥50,000 before tax, ¥54,000 with; 76 keys, Topre
capacitive, split; ordinary sales ended February 2017.</li>
<li>A card database of the <b>70,000-odd cumulative units shipped</b>.</li>
<li><span class="jp">小物</span> → <span class="jp">ねこ</span>. A cat. It does nothing. It was
never removed.</li>
</ul>
<h3>What this is and is not</h3>
<p>A front-end simulation: one HTML file, no server, no build step, no external resources, all
artwork generated in code, everything persisted in your browser's localStorage. No logo, icon or
glyph data from Personal Media or the TRON Project is reproduced — the marks here are original,
and the chrome is a re-creation of the style rather than a copy of it.</p>
<p>The real 超漢字V is still sold. This is not a substitute for it, and the affection is
sincere: this is a small company's twenty-five-year act of stubbornness on behalf of people whose
computers could not spell their names.</p>`}
  ],
  open(id){
    const box = $('#guidebox');
    box.innerHTML = '';
    const hdr = el('header');
    hdr.appendChild(mk('div',{class:'kick',text:'The OS Museum — exhibit guide'}));
    hdr.appendChild(mk('h1',{html:'<span>超漢字V</span> — BTRON, still patched in 2025'}));
    box.appendChild(hdr);
    const tabs = el('div','gtabs');
    const content = el('div','gcontent');
    this.PAGES.forEach(p=>{
      const t = el('div','gtab'+(p.id===id?' on':''), p.t);
      t.addEventListener('click', ()=>{
        $$('.gtab', tabs).forEach(x=>x.classList.remove('on'));
        t.classList.add('on');
        $$('.gpage', content).forEach(x=>x.classList.remove('on'));
        $('#gp-'+p.id, content).classList.add('on');
        $('#guide').scrollTop = 0;
      });
      tabs.appendChild(t);
      const pg = el('div','gpage'+(p.id===id?' on':''));
      pg.id = 'gp-'+p.id;
      pg.innerHTML = p.html;
      content.appendChild(pg);
    });
    box.append(tabs, content);
    $('#guide').classList.add('on');
  },
  close(){ $('#guide').classList.remove('on'); }
};

/* ==================================================================
   36. GLOBAL WIRING AND START-UP
   ================================================================== */
/* SYS holds the ids of the objects the system itself needs to find
   again after a reload, so it is persisted alongside the graph */
(function(){
  const inner = State.save.bind(State);
  State.save = function(){
    this.data.sys = Object.assign({}, SYS);
    inner();
  };
})();

function typingInField(e){
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' ||
               t.tagName === 'SELECT' || t.isContentEditable);
}

function initKeys(){
  document.addEventListener('keydown', e=>{
    /* the guide first */
    if($('#guide').classList.contains('on')){
      if(e.key === 'Escape' || e.key === '?'){ e.preventDefault(); Guide.close(); }
      return;
    }
    if(typingInField(e)) return;
    if(e.key === 'Escape'){
      if(Menu.stack.length){ Menu.clear(); e.preventDefault(); return; }
      if(IME.mode !== 'off'){ IME.cancel(); WM.refreshAll(); e.preventDefault(); return; }
      const p = $$('#cklayer .bpanel').pop();
      if(p && p._close){ p._close(); e.preventDefault(); return; }
    }
    if(e.key === 'F1'){ e.preventDefault(); Guide.open('start'); return; }
    if(e.key === 'F2'){ e.preventDefault(); $('#btn-annot').click(); return; }
    /* hand the key to the active window */
    const w = WM.wins[WM.act];
    if(w && w.api && w.api.onKey){
      let used = false;
      try { used = w.api.onKey(e); } catch(err){ used = false; }
      if(used){ if(e.key.length===1) Snd.key(); return; }
    }
    /* museum shortcuts, only if nothing in the guest wanted the key */
    if(!e.ctrlKey && !e.metaKey && !e.altKey){
      if(e.key === 'a' || e.key === 'A'){ e.preventDefault(); $('#btn-annot').click(); return; }
      if(e.key === '?' || e.key === '/'){ e.preventDefault(); Guide.open('start'); return; }
    }
  });
}

function initDesk(){
  const ck = $('#ck');
  ck.addEventListener('contextmenu', e=>e.preventDefault());
  /* the background: right button gives the system menu */
  const bgHit = e => e.target === ck || e.target === $('#ckbg') || e.target === $('#ckwins');
  ck.addEventListener('mousedown', e=>{
    if(!bgHit(e)) return;
    if(e.button === 2){ e.preventDefault(); Menu.openDesk(e.clientX, e.clientY); return; }
    if(e.button === 0){ Deck.select(null, null); Menu.clear(); }
  });
  /* the whole guest scales to fit its viewport */
  addEventListener('resize', ()=>{ Scale.fit(); WM.list().forEach(w=>WM.sync(w)); });
  /* keep the scroll bars honest when the wheel is used */
  document.addEventListener('wheel', ()=>{
    const w = WM.wins[WM.act]; if(w) WM.sync(w);
  }, {passive:true});
  /* the museum toolbar */
  $('#btn-guide').addEventListener('click', ()=>Guide.open('start'));
  $('#guideclose').addEventListener('click', ()=>Guide.close());
  $('#guide').addEventListener('mousedown', e=>{
    if(e.target === $('#guide')) Guide.close();
  });
}

function init(){
  const had = State.load();
  document.body.dataset.scheme = State.data.scheme || 'std';
  document.body.dataset.bgpat = State.data.bgpat || 'dither';
  document.body.classList.toggle('annot', State.data.annot !== false);
  $('#btn-annot').classList.toggle('on', State.data.annot !== false);

  CharDB.build();

  let seeded = false;
  if(had && State.data.graph && State.data.sys && State.data.sys.home){
    try {
      Graph.restore(State.data.graph);
      Object.assign(SYS, State.data.sys);
      if(!Graph.get(SYS.home)) throw new Error('初期ウィンドウが無い');
      Graph.scrub();
    } catch(err){
      Graph.js = {}; Graph.seq = 0;
      for(const k in SYS) delete SYS[k];
      State.data = State.defaults();
      seeded = true;
    }
  } else {
    State.data.graph = null;
    seeded = true;
  }
  if(seeded) seedWorld();

  Host.init();
  Annot.init();
  initKeys();
  initDesk();
  Scale.fit();
  Host.tasks();
  State.save();
  Boot.run(seeded || State.data.firstRun);

  /* a light autosave: the graph is small and the visitor's work is
     worth keeping */
  setInterval(()=>State.save(), 20000);
  addEventListener('beforeunload', ()=>State.save());
}

if(document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
