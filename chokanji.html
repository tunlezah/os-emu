<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超漢字V — BTRON / B-right/V R4.560</title>
<meta name="description" content="An interactive simulation of 超漢字V (Chokanji V), the last living BTRON desktop: a filesystem that is a web instead of a tree, and 180,000 characters.">
<style>
/* ==================================================================
   超漢字V (Chokanji V) — BTRON3 / B-right/V R4.560
   A single-file, no-dependency simulation for The OS Museum.

   Everything here is drawn in code. No images, no fonts, no network.
   Palette and chrome are a re-creation of the 超漢字V look — a light
   grey bevelled frame, a name strip carrying the 実身名, gadget boxes
   at the right, square-arrow scroll bars, and a hand-shaped pointer.
   ================================================================== */

/* ---------- host (Windows) palette ---------- */
:root{
  --hostwall1:#0a3d62; --hostwall2:#123f5e; --hostwall3:#06283d;
  --hostface:#f0f0f0; --hostface2:#e4e4e4; --hostedge:#a0a0a0;
  --hosttext:#1d1d1d; --hostblue:#0078d7; --hosttitle:#ffffff;
  --hostbar:#1f1f24;
  /* ---------- 超漢字 (BTRON) palette : 配色「標準」 ---------- */
  --face:#c6c6c6;  --face2:#d8d8d8; --hi:#f2f2f2; --lo:#7b7b7b; --lo2:#4a4a4a;
  --edge:#000000;  --text:#000000;  --paper:#ffffff; --desk:#5b8296;
  --desk2:#4a6c7e; --sel:#000080;   --selfg:#ffffff;
  --kam:#fffdf0;   --kamedge:#404040; --kamtag:#e8e4d0;
  --menu:#d4d4d4;  --menuhi:#000080; --menuhifg:#ffffff;
  --acc:#1f4f8f;   --warn:#a01010;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",
           "Noto Sans JP","Noto Sans CJK JP","MS PGothic","Meiryo",
           "Malgun Gothic","Microsoft YaHei",sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",
           "Noto Serif CJK JP","MS PMincho","SimSun","Batang",serif;
  --mono:"DejaVu Sans Mono",Menlo,Consolas,"Courier New",monospace;
}
/* 配色「白黒」 — the real system can recolour the whole screen */
body[data-scheme="mono"]{
  --face:#d0d0d0; --face2:#e0e0e0; --hi:#ffffff; --lo:#808080; --lo2:#404040;
  --desk:#909090; --desk2:#808080; --sel:#000000; --menuhi:#000000;
  --kam:#ffffff; --acc:#000000;
}
/* 配色「濃色」 */
body[data-scheme="dark"]{
  --face:#5a5f66; --face2:#6a7079; --hi:#8b929b; --lo:#33373c; --lo2:#1c1f22;
  --text:#f0f0f0; --edge:#101214; --paper:#e8e6de; --desk:#232a31; --desk2:#1a2027;
  --menu:#5a5f66; --kam:#e8e6de; --kamedge:#101214; --kamtag:#c9c6ba;
  --acc:#9fc4ea;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05131f}
body{font-family:var(--gothic);-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none}

/* ==================================================================
   THE HAND POINTER — BTRON's signature. Original artwork, inline SVG.
   ================================================================== */
:root{
  --hand:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="28" viewBox="0 0 24 28"><path d="M6 1.5c1.1 0 2 .9 2 2v9.2l1.1-1.2c.6-.7 1.7-.7 2.3 0l.3.4c.5-.4 1.3-.4 1.8.1l.4.5c.5-.3 1.3-.3 1.8.2l3.1 3.4c.6.6.9 1.5.9 2.4v3.9c0 1-.3 2-.9 2.8l-1.1 1.4c-.4.5-1 .8-1.7.8H8.6c-.7 0-1.3-.3-1.8-.9l-4.2-5.4c-.6-.8-.5-2 .3-2.6.7-.6 1.7-.5 2.4.1l.7.7V3.5c0-1.1.9-2 2-2z" fill="%23ffffff" stroke="%23000000" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 13.5V6M11.5 15v-2.2M14.5 15.4v-1.8M17.4 16.6v-1" stroke="%23000000" stroke-width="1" fill="none" stroke-linecap="round"/></svg>') 5 1, pointer;
  --handpress:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="28" viewBox="0 0 24 28"><path d="M6 1.5c1.1 0 2 .9 2 2v9.2l1.1-1.2c.6-.7 1.7-.7 2.3 0l.3.4c.5-.4 1.3-.4 1.8.1l.4.5c.5-.3 1.3-.3 1.8.2l3.1 3.4c.6.6.9 1.5.9 2.4v3.9c0 1-.3 2-.9 2.8l-1.1 1.4c-.4.5-1 .8-1.7.8H8.6c-.7 0-1.3-.3-1.8-.9l-4.2-5.4c-.6-.8-.5-2 .3-2.6.7-.6 1.7-.5 2.4.1l.7.7V3.5c0-1.1.9-2 2-2z" fill="%23ffe08a" stroke="%23000000" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 13.5V6M11.5 15v-2.2M14.5 15.4v-1.8M17.4 16.6v-1" stroke="%23000000" stroke-width="1" fill="none" stroke-linecap="round"/></svg>') 5 1, pointer;
  --handwait:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="9" fill="%23ffffff" stroke="%23000" stroke-width="1.6"/><path d="M13 5v4M13 17v4M5 13h4M17 13h4" stroke="%23000" stroke-width="1.6"/></svg>') 13 13, wait;
}
#ck,#ck *{cursor:var(--hand)}
#ck.pressing,#ck.pressing *{cursor:var(--handpress)}
#ck.busy,#ck.busy *{cursor:var(--handwait)}
#ck .caretzone,#ck .caretzone *{cursor:text}

/* ==================================================================
   HOST DESKTOP (the Russian doll: Windows around VMware around BTRON)
   ================================================================== */
#hostdesk{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(120% 90% at 22% 8%, #1b5c86 0%, transparent 60%),
    radial-gradient(90% 70% at 85% 90%, #0d2f4a 0%, transparent 65%),
    linear-gradient(160deg,var(--hostwall1),var(--hostwall2) 45%,var(--hostwall3));
  color:var(--hosttext);font-size:12px}
/* faint code-drawn wallpaper motif: concentric TRON-ish arcs */
#hostwall{position:absolute;inset:0;opacity:.16;pointer-events:none}
#hostdesk.hidewall #hostwall{display:none}

#hosticons{position:absolute;top:10px;left:10px;width:96px;z-index:2}
.hicon{width:88px;padding:6px 2px 4px;text-align:center;color:#fff;
  font-size:11px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.8);
  border:1px dotted transparent;border-radius:3px;margin-bottom:6px;cursor:default}
.hicon:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
.hicon.sel{background:rgba(0,120,215,.45);border-color:rgba(255,255,255,.6)}
.hicon svg{display:block;margin:0 auto 3px}

/* host taskbar */
#hosttaskbar{position:absolute;left:0;right:0;bottom:0;height:34px;z-index:60;
  background:linear-gradient(#2b2b33,#1b1b21);border-top:1px solid #000;
  display:flex;align-items:center;gap:4px;padding:0 6px;color:#e8e8e8}
#hoststart{width:38px;height:28px;display:grid;place-items:center;border-radius:3px}
#hoststart:hover{background:rgba(255,255,255,.14)}
#hosttasks{display:flex;gap:4px;flex:1;min-width:0}
.htask{max-width:190px;height:26px;display:flex;align-items:center;gap:5px;
  padding:0 9px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);
  border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.htask.act{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.4)}
.htask:hover{background:rgba(255,255,255,.3)}
#hosttray{display:flex;align-items:center;gap:8px;font-size:11px;padding-right:4px}
#hosttray .tico{display:grid;place-items:center;width:20px;height:20px}
#hostclock{text-align:center;line-height:1.15;font-size:11px;min-width:58px}

/* host start menu */
#hoststartmenu{position:absolute;left:4px;bottom:36px;width:250px;z-index:61;
  background:#26262c;border:1px solid #3a3a44;box-shadow:0 8px 24px rgba(0,0,0,.6);
  color:#eee;display:none;padding:6px 0}
#hoststartmenu.on{display:block}
#hoststartmenu .hsm{padding:7px 12px;font-size:12px;display:flex;gap:9px;align-items:center}
#hoststartmenu .hsm:hover{background:var(--hostblue)}
#hoststartmenu .hsmsep{height:1px;background:#3a3a44;margin:5px 0}

/* generic host window (Explorer / Notepad / print preview) */
.hwin{position:absolute;background:var(--hostface);border:1px solid #6b6b6b;
  box-shadow:0 10px 34px rgba(0,0,0,.5);display:flex;flex-direction:column;
  min-width:240px;min-height:140px;z-index:10;font-size:12px}
.hwin.act{border-color:#3b6ea5;box-shadow:0 14px 40px rgba(0,0,0,.62)}
.hwtitle{height:28px;flex:0 0 28px;background:linear-gradient(#fbfbfb,#eaeaea);
  border-bottom:1px solid #d0d0d0;display:flex;align-items:center;gap:6px;
  padding:0 2px 0 8px;font-size:12px;color:#222}
.hwin.act .hwtitle{background:linear-gradient(#ffffff,#e6eef7)}
.hwtitle .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hwbtn{width:34px;height:26px;display:grid;place-items:center;font:12px var(--mono);color:#333}
.hwbtn:hover{background:#dfdfdf}
.hwbtn.x:hover{background:#e81123;color:#fff}
.hwbody{flex:1;overflow:auto;background:#fff}
.hwmenu{height:22px;flex:0 0 22px;display:flex;align-items:center;gap:0;
  background:var(--hostface);border-bottom:1px solid #dcdcdc;font-size:11px;padding:0 4px}
.hwmenu span{padding:3px 8px}
.hwmenu span:hover{background:#cfe4f7}
.hwstatus{height:22px;flex:0 0 22px;background:var(--hostface2);
  border-top:1px solid #d4d4d4;display:flex;align-items:center;padding:0 8px;
  font-size:11px;color:#444;gap:12px}

/* explorer-ish shared folder */
.expgrid{display:flex;flex-wrap:wrap;gap:2px;padding:8px;align-content:flex-start}
.expitem{width:96px;padding:6px 3px;text-align:center;font-size:11px;line-height:1.25;
  border:1px solid transparent;border-radius:2px;word-break:break-all}
.expitem:hover{background:#eaf3fd;border-color:#cbe1f7}
.expitem.sel{background:#cde8ff;border-color:#7cb7e8}
.expitem svg{display:block;margin:0 auto 3px}
.exppath{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;
  background:#fff;border-bottom:1px solid #e2e2e2;font-size:11px;color:#333}
.exppath .crumb{padding:2px 6px;border:1px solid transparent}
.exppath .crumb:hover{background:#eaf3fd;border-color:#cbe1f7}
#notepadta{width:100%;height:100%;border:0;outline:0;resize:none;padding:6px 8px;
  font:12px/1.5 var(--mono);white-space:pre-wrap}

/* ==================================================================
   VMWARE PLAYER FRAME
   ================================================================== */
#vmwin{position:absolute;z-index:20;display:flex;flex-direction:column;
  background:#dcdcdc;border:1px solid #5c5c5c;box-shadow:0 18px 60px rgba(0,0,0,.65)}
#vmwin.act{border-color:#3b6ea5}
#vmtitle{height:28px;flex:0 0 28px;display:flex;align-items:center;gap:7px;
  padding:0 2px 0 8px;background:linear-gradient(#f7f7f7,#e2e2e2);
  border-bottom:1px solid #bfbfbf;font-size:12px;color:#222}
#vmwin.act #vmtitle{background:linear-gradient(#ffffff,#dfe9f4)}
#vmtitle .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vmmenu{height:22px;flex:0 0 22px;display:flex;align-items:center;
  background:#efefef;border-bottom:1px solid #d2d2d2;font-size:11px;padding:0 3px}
#vmmenu span{padding:3px 9px}
#vmmenu span:hover{background:#cfe4f7}
#vmtool{height:26px;flex:0 0 26px;display:flex;align-items:center;gap:3px;
  background:linear-gradient(#f4f4f4,#e6e6e6);border-bottom:1px solid #cfcfcf;padding:0 6px}
.vmtb{width:24px;height:20px;display:grid;place-items:center;border:1px solid transparent;
  border-radius:2px}
.vmtb:hover{background:#d9e9f8;border-color:#9dc3e6}
.vmtb.on{background:#cbe2f7;border-color:#7fadd8}
#vmtool .sep{width:1px;height:16px;background:#c4c4c4;margin:0 3px}
#vmtool .vmnote{margin-left:auto;font-size:10px;color:#666}
#vmport{flex:1;position:relative;background:#000;overflow:hidden;display:grid;
  place-items:center}
#vmstatus{height:22px;flex:0 0 22px;background:#e8e8e8;border-top:1px solid #cdcdcd;
  display:flex;align-items:center;gap:10px;padding:0 8px;font-size:10px;color:#555}
#vmstatus .grow{flex:1}
#vmstatus .dev{display:flex;align-items:center;gap:3px}
#vmwin.full{left:0!important;top:0!important;width:100%!important;height:100%!important;
  border:0;z-index:70}
#vmwin.full #vmtitle,#vmwin.full #vmmenu,#vmwin.full #vmtool,#vmwin.full #vmstatus{display:none}
#vmbar{position:absolute;top:0;left:50%;transform:translate(-50%,-100%);z-index:80;
  height:26px;display:none;align-items:center;gap:6px;padding:0 10px;font-size:11px;
  background:linear-gradient(#f4f4f4,#dedede);border:1px solid #999;border-top:0;
  border-radius:0 0 5px 5px;color:#222;transition:transform .18s}
#vmwin.full #vmbar{display:flex}
#vmwin.full:hover #vmbar,#vmbar.peek{transform:translate(-50%,0)}
#vmgrab{position:absolute;inset:auto 0 0 0;height:0}

/* ==================================================================
   超漢字V SCREEN — 800x600, the resolution the product specifies
   ================================================================== */
#ckscale{position:relative;width:800px;height:600px;transform-origin:center center}
#ck{position:absolute;inset:0;width:800px;height:600px;overflow:hidden;
  background:var(--desk);color:var(--text);font:13px/1.5 var(--gothic);
  isolation:isolate}
/* the background: a coarse dither, which is what a 16-colour BTRON desk did */
#ckbg{position:absolute;inset:0;
  background-image:
    linear-gradient(45deg,var(--desk2) 25%,transparent 25%,transparent 75%,var(--desk2) 75%),
    linear-gradient(45deg,var(--desk2) 25%,transparent 25%,transparent 75%,var(--desk2) 75%);
  background-size:4px 4px;background-position:0 0,2px 2px;opacity:.55}
body[data-bgpat="plain"] #ckbg{background-image:none}
body[data-bgpat="grid"] #ckbg{background-image:
  linear-gradient(var(--desk2) 1px,transparent 1px),
  linear-gradient(90deg,var(--desk2) 1px,transparent 1px);
  background-size:16px 16px;background-position:0 0;opacity:.4}
#ckwins{position:absolute;inset:0}
#cklayer{position:absolute;inset:0;pointer-events:none;z-index:9000}
#cklayer>*{pointer-events:auto}

/* ---------- BTRON window chrome ---------- */
.bw{position:absolute;background:var(--face);
  border:1px solid var(--edge);
  box-shadow:1px 1px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;
  min-width:150px;min-height:64px}
.bw::before{content:"";position:absolute;inset:0;pointer-events:none;
  border-top:1px solid var(--hi);border-left:1px solid var(--hi);
  border-right:1px solid var(--lo);border-bottom:1px solid var(--lo)}
.bw.act{box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.bwtop{flex:0 0 18px;height:18px;display:flex;align-items:stretch;
  background:var(--face);border-bottom:1px solid var(--lo);position:relative;z-index:2}
.bw.act .bwtop{background:var(--face2)}
.bwpict{flex:0 0 18px;width:18px;display:grid;place-items:center;
  border-right:1px solid var(--lo);background:var(--face)}
.bwpict:active{background:var(--lo)}
.bwname{flex:1;min-width:0;display:flex;align-items:center;gap:4px;padding:0 5px;
  font:12px/1 var(--gothic);white-space:nowrap;overflow:hidden}
.bwname .nm{overflow:hidden;text-overflow:ellipsis}
.bwname .tsu{color:var(--lo2);font-size:11px;flex:0 0 auto}
.bw.act .bwname{font-weight:600}
/* the active window's name strip carries fine rules — BTRON's "busy" look */
.bw.act .bwname::after{content:"";flex:1;height:7px;min-width:8px;
  background:repeating-linear-gradient(var(--lo) 0 1px,transparent 1px 3px)}
.bwgad{flex:0 0 auto;display:flex;align-items:stretch}
.bwg{width:18px;display:grid;place-items:center;border-left:1px solid var(--lo);
  background:var(--face)}
.bwg:hover{background:var(--hi)}
.bwg:active,.bwg.on{background:var(--lo);color:var(--hi)}
.bwmain{flex:1;display:flex;min-height:0}
.bwcol{flex:1;display:flex;flex-direction:column;min-width:0}
.bwview{flex:1;position:relative;overflow:hidden;background:var(--paper);
  border:1px solid var(--lo);border-right:0;border-bottom:0;margin:1px 0 0 1px}
.bwscroll{overflow:auto;position:absolute;inset:0}
.bwscroll::-webkit-scrollbar{width:0;height:0}
/* BTRON scroll bars: square arrow boxes at both ends, a plain thumb between */
.bwvs{flex:0 0 14px;width:14px;display:flex;flex-direction:column;
  border-left:1px solid var(--lo);background:var(--face)}
.bwhs{flex:0 0 14px;height:14px;display:flex;
  border-top:1px solid var(--lo);background:var(--face)}
.sbtn{flex:0 0 14px;display:grid;place-items:center;background:var(--face);
  border:1px solid var(--lo);margin:0}
.sbtn:active{background:var(--lo);color:var(--hi)}
.strough{flex:1;position:relative;background:
  repeating-linear-gradient(45deg,var(--face) 0 2px,var(--face2) 2px 4px);
  border:1px solid var(--lo)}
.sthumb{position:absolute;left:0;right:0;background:var(--face);
  border:1px solid var(--edge);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.bwhs .sthumb{top:0;bottom:0;left:auto;right:auto}
.bwsize{flex:0 0 14px;width:14px;height:14px;background:var(--face);
  border-left:1px solid var(--lo);border-top:1px solid var(--lo);
  display:grid;place-items:center;cursor:nwse-resize}
.bwfoot{flex:0 0 14px;display:flex}
.bw.full{left:0!important;top:0!important;width:800px!important;height:600px!important}

/* ---------- panels (パネル) and switches (スイッチ) ---------- */
.bpanel{position:absolute;background:var(--face);border:1px solid var(--edge);
  box-shadow:3px 3px 0 rgba(0,0,0,.4);min-width:180px;font:12px/1.5 var(--gothic);
  z-index:9500}
.bpanel::before{content:"";position:absolute;inset:0;pointer-events:none;
  border-top:1px solid var(--hi);border-left:1px solid var(--hi);
  border-right:1px solid var(--lo);border-bottom:1px solid var(--lo)}
.bptitle{height:17px;display:flex;align-items:center;padding:0 4px;font-size:11px;
  background:var(--face2);border-bottom:1px solid var(--lo);gap:5px}
.bptitle .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bpbody{padding:9px 11px;max-height:430px;overflow:auto}
.bpbody::-webkit-scrollbar{width:10px}
.bpbody::-webkit-scrollbar-thumb{background:var(--lo);border:1px solid var(--edge)}
.bprow{display:flex;align-items:center;gap:7px;margin:4px 0;flex-wrap:wrap}
.bpfoot{display:flex;gap:7px;justify-content:flex-end;padding:7px 11px 10px;
  border-top:1px solid var(--lo)}
.sw{min-width:56px;padding:2px 12px;text-align:center;background:var(--face);
  border:1px solid var(--edge);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);
  font:12px var(--gothic);white-space:nowrap}
.sw:hover{background:var(--face2)}
.sw:active,.sw.on{background:var(--lo);color:var(--hi);
  box-shadow:inset 1px 1px 0 var(--lo2)}
.sw.def{font-weight:700}
.sw[disabled],.sw.dis{color:var(--lo);pointer-events:none;
  text-shadow:1px 1px 0 var(--hi)}
.bfield{background:var(--paper);border:1px solid var(--edge);
  box-shadow:inset 1px 1px 0 var(--lo);padding:2px 4px;font:12px var(--gothic);
  color:var(--text);min-width:60px;outline:none}
.bfield:focus{box-shadow:inset 1px 1px 0 var(--lo),0 0 0 1px var(--acc)}
input.bfield,textarea.bfield,select.bfield{font-family:var(--gothic)}
.bchk{display:inline-flex;align-items:center;gap:5px}
.bchk i{width:11px;height:11px;flex:0 0 11px;background:var(--paper);
  border:1px solid var(--edge);box-shadow:inset 1px 1px 0 var(--lo);
  display:grid;place-items:center;font-style:normal;font-size:9px;line-height:1}
.bchk.on i::after{content:"✓";color:var(--text)}
.brad i{border-radius:50%}
.brad.on i::after{content:"";width:5px;height:5px;background:var(--text);border-radius:50%}
.bplabel{font-size:11px;color:var(--lo2)}
.bpnote{font-size:11px;line-height:1.6;color:var(--lo2);margin:6px 0}
.bphr{height:1px;background:var(--lo);margin:8px 0;border-bottom:1px solid var(--hi)}

/* ---------- BTRON menus: press the right button, drag, release ---------- */
#ckmenus{position:absolute;inset:0;z-index:9800;pointer-events:none}
.bmenu{position:absolute;background:var(--menu);border:1px solid var(--edge);
  box-shadow:3px 3px 0 rgba(0,0,0,.4);min-width:104px;padding:1px;
  font:12px/1.35 var(--gothic);pointer-events:auto}
.bmenu::before{content:"";position:absolute;inset:0;pointer-events:none;
  border-top:1px solid var(--hi);border-left:1px solid var(--hi)}
.bmi{display:flex;align-items:center;gap:8px;padding:2px 8px 2px 7px;white-space:nowrap;
  position:relative}
.bmi .lbl{flex:1}
.bmi .key{font:10px var(--mono);color:var(--lo2)}
.bmi .arw{font-size:9px}
.bmi.hot{background:var(--menuhi);color:var(--menuhifg)}
.bmi.hot .key{color:var(--menuhifg);opacity:.8}
.bmi.dis{color:var(--lo);text-shadow:1px 1px 0 var(--hi)}
.bmi.dis.hot{background:transparent;color:var(--lo)}
.bmi.chk .lbl::before{content:"● ";font-size:9px}
.bmsep{height:1px;background:var(--lo);border-bottom:1px solid var(--hi);margin:2px 0}
.bmtitle{padding:2px 7px;font-size:10px;color:var(--lo2);background:var(--face2);
  border-bottom:1px solid var(--lo);margin:-1px -1px 1px}

/* ==================================================================
   仮身 (kamon / virtual body) — the whole filesystem is made of these.
   Four states, per the manual: 閉じた仮身 / 開いた仮身 / 選択状態 /
   実行状態 (open in a window → drawn over with a mesh).
   ================================================================== */
.kam{position:relative;display:inline-flex;vertical-align:top;
  background:var(--kam);border:1px solid var(--kamedge);
  align-items:stretch;font:12px/1.3 var(--gothic);color:var(--text);
  min-height:17px;max-width:100%}
.kam.nofrm{border-color:transparent;background:transparent}
.kam .kpict{flex:0 0 16px;width:16px;display:grid;place-items:center;
  background:var(--kamtag);border-right:1px solid var(--kamedge)}
.kam.nopict .kpict{display:none}
.kam.nofrm .kpict{background:transparent;border-right:0}
.kam .klab{flex:1;min-width:0;padding:1px 5px 1px 4px;display:flex;
  align-items:baseline;gap:4px;overflow:hidden}
.kam .knm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kam .ktsu{font-size:10px;color:var(--lo2);flex:0 0 auto}
.kam .kdt{font-size:10px;color:var(--lo2);flex:0 0 auto;opacity:.85}
.kam.sel{outline:2px dashed var(--acc);outline-offset:1px;animation:chira .7s steps(2) infinite}
/* チラツキ枠 — the flickering selection frame */
@keyframes chira{50%{outline-color:transparent}}
.kam.run::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.30) 0 1px,transparent 1px 3px)}
.kam.prot .klab::before{content:"錠";font-size:9px;color:var(--warn);margin-right:2px}
.kam.fixed{border-style:double;border-width:3px}
.kam.icon{flex-direction:column;width:78px;padding:2px 0 3px;text-align:center;
  align-items:center;min-height:58px}
.kam.icon .kpict{width:100%;flex:0 0 30px;height:30px;border-right:0;
  border-bottom:1px solid var(--kamedge);background:transparent}
.kam.icon .klab{flex:0 0 auto;display:block;padding:2px 3px 0;text-align:center;
  white-space:normal;word-break:break-all;line-height:1.25}
.kam.icon .knm{white-space:normal;overflow:visible;font-size:11px}
.kam.icon .ktsu,.kam.icon .kdt{display:none}
/* 開いた仮身 — the referenced 実身's content, embedded in place */
.kam.open{display:block;width:auto;background:var(--paper);padding:0}
.kam.open>.kohdr{display:flex;align-items:center;gap:4px;height:16px;padding:0 4px;
  background:var(--kamtag);border-bottom:1px solid var(--kamedge);font-size:11px}
.kam.open>.kohdr .knm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kam.open>.kobody{position:relative;overflow:hidden;background:var(--paper)}
.kam.open>.kobody>.koinner{transform-origin:0 0}
.kam.open.deep>.kobody{background:repeating-linear-gradient(45deg,
  var(--face) 0 4px,var(--face2) 4px 8px)}
.kocycle{padding:7px 9px;font-size:11px;line-height:1.6;color:var(--lo2);
  background:var(--face2);border:1px dashed var(--lo)}
.kobtn{font-size:10px;padding:0 4px;border:1px solid var(--kamedge);
  background:var(--face);line-height:13px}
.kobtn:hover{background:var(--hi)}
.karrange{position:absolute}

/* ==================================================================
   基本文章編集 — the text editor
   ================================================================== */
.edwrap{position:absolute;inset:0;overflow:auto;background:var(--paper)}
.edwrap::-webkit-scrollbar{width:0;height:0}
.edpage{position:relative;padding:10px 12px;min-height:100%;
  font:14px/1.85 var(--mincho);color:var(--text);outline:none;white-space:pre-wrap;
  word-break:break-word}
.edpage.gothic{font-family:var(--gothic)}
.edpage.mode-genko{font-family:var(--mono),var(--gothic);line-height:1.7;
  font-size:13px;white-space:pre-wrap}
.edpage.mode-genko .fig,.edpage.mode-genko .zu{background:
  repeating-linear-gradient(45deg,transparent 0 3px,var(--lo) 3px 4px)!important}
.edpage.mode-seisho{padding:26px 30px;background:var(--paper);
  box-shadow:inset 0 0 0 1px var(--lo)}
.edpage.mode-seisho .fusen{display:none}
.edpage.tate{writing-mode:vertical-rl;text-orientation:mixed;height:100%;
  padding:14px 16px;line-height:2.1}
.edpage.tate .kam{writing-mode:horizontal-tb}
.edcaret{display:inline-block;width:0;border-left:2px solid var(--text);
  height:1.1em;vertical-align:-0.15em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.edpage .fusen{display:inline-block;font-size:9px;line-height:11px;padding:0 2px;
  border:1px solid var(--acc);color:var(--acc);background:var(--face2);
  vertical-align:.25em;margin:0 1px;user-select:none}
.edpage .ruby{display:inline-flex;flex-direction:column;align-items:center;
  vertical-align:baseline;line-height:1.05}
.edpage .ruby .rt{font-size:.5em;line-height:1;color:var(--lo2)}
.edpage .selrun{background:var(--sel);color:var(--selfg)}
.edpage .zu{display:inline-block;vertical-align:top;border:1px solid var(--lo);
  background:var(--paper)}
.edpage .tatechu{display:inline-block;writing-mode:horizontal-tb;font-size:.85em}
.edrule{position:sticky;top:0;height:15px;background:var(--face2);
  border-bottom:1px solid var(--lo);font:9px var(--mono);color:var(--lo2);
  display:flex;align-items:center;z-index:3}
.edstat{flex:0 0 15px;height:15px;background:var(--face2);border-top:1px solid var(--lo);
  display:flex;align-items:center;gap:9px;padding:0 5px;font-size:10px;color:var(--lo2)}
.edstat b{font-weight:600;color:var(--text)}
.kamlist{padding:6px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;
  position:relative;min-height:100%}
.kamlist.free{display:block}
.kamlist.rows{display:block;padding:2px 0}
.kamlist.rows .kam{display:flex;width:calc(100% - 4px);margin:0 2px 1px;
  border-left:0;border-right:0;border-top:0;background:transparent}
.kamlist.rows .kam:hover{background:var(--face2)}
.kamlist.rows .kam .klab{justify-content:flex-start}
.kamlist.rows .kam .kdt{margin-left:auto}
.klhdr{display:flex;font-size:10px;color:var(--lo2);background:var(--face2);
  border-bottom:1px solid var(--lo);padding:1px 4px;position:sticky;top:0;z-index:2}
.klhdr span:first-child{flex:1}

/* ==================================================================
   基本図形編集 — the drawing editor
   ================================================================== */
.dzwrap{position:absolute;inset:0;background:var(--face2);overflow:auto}
.dzpaper{position:relative;background:#fff;box-shadow:1px 1px 0 var(--lo2);margin:6px}
.dzgrid{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(var(--lo) .5px,transparent .5px);
  background-size:8px 8px;opacity:.55}
.dztool{position:absolute;background:var(--face);border:1px solid var(--edge);
  box-shadow:2px 2px 0 rgba(0,0,0,.35);z-index:40;width:82px}
.dztool .tt{font-size:10px;padding:1px 4px;background:var(--face2);
  border-bottom:1px solid var(--lo)}
.dztool .tg{display:flex;flex-wrap:wrap;padding:2px;gap:1px}
.dtb{width:24px;height:24px;display:grid;place-items:center;background:var(--face);
  border:1px solid var(--lo)}
.dtb:hover{background:var(--hi)}
.dtb.on{background:var(--sel);color:var(--selfg);border-color:var(--edge)}
.dzhandle{position:absolute;width:6px;height:6px;background:var(--paper);
  border:1px solid var(--edge);margin:-3px 0 0 -3px}
.dzsel{position:absolute;border:1px dashed var(--acc);pointer-events:none;
  animation:chira .7s steps(2) infinite}
.swatches{display:flex;flex-wrap:wrap;gap:2px;padding:2px}
.swatch{width:12px;height:12px;border:1px solid var(--edge)}
.swatch.on{outline:2px solid var(--acc);outline-offset:1px}

/* ==================================================================
   基本表計算 — the spreadsheet
   ================================================================== */
.sswrap{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.sscons{flex:0 0 18px;display:flex;align-items:center;gap:4px;background:var(--face);
  border-bottom:1px solid var(--lo);padding:0 3px;font-size:11px}
.sscons .mk{width:15px;height:14px;display:grid;place-items:center;background:var(--face2);
  border:1px solid var(--lo);font:10px var(--mono)}
.sscons .adr{width:56px;text-align:center;background:var(--paper);
  border:1px solid var(--lo);font:10px var(--mono)}
.sscons input{flex:1;min-width:0}
.ssgrid{flex:1;overflow:auto;position:relative}
.ssgrid::-webkit-scrollbar{width:0;height:0}
.ssgrid table{border-collapse:separate;border-spacing:0;font:11px var(--gothic);
  table-layout:fixed}
.ssgrid th{background:var(--face);border-right:1px solid var(--lo);
  border-bottom:1px solid var(--lo);font-weight:400;font-size:10px;color:var(--lo2);
  text-align:center;position:sticky;height:14px;padding:0}
.ssgrid thead th{top:0;z-index:3}
.ssgrid tbody th{left:0;z-index:2;width:30px;min-width:30px}
.ssgrid thead th:first-child{left:0;z-index:4}
.ssgrid td{border-right:1px solid #d8d8d8;border-bottom:1px solid #d8d8d8;
  padding:0 3px;height:16px;overflow:hidden;white-space:nowrap;background:var(--paper);
  vertical-align:middle}
.ssgrid td.num{text-align:right;font-variant-numeric:tabular-nums}
.ssgrid td.cur{outline:2px solid var(--acc);outline-offset:-2px}
.ssgrid td.inrange{background:#dfe6f2}
.ssgrid td.err{color:var(--warn)}
.ssgrid td.bold{font-weight:700}
.ssgrid td.kei{border-right:1px solid var(--edge);border-bottom:1px solid var(--edge)}

/* ==================================================================
   マイクロカード — the card database
   ================================================================== */
.mcwrap{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--face2)}
.mccard{margin:8px;background:var(--paper);border:1px solid var(--edge);
  box-shadow:2px 2px 0 var(--lo);padding:9px 11px;position:relative;flex:1;overflow:auto}
.mccard .fld{display:flex;gap:7px;margin:3px 0;align-items:baseline;font-size:12px}
.mccard .fld .fn{flex:0 0 84px;color:var(--lo2);font-size:11px;text-align:right}
.mccard .fld .fv{flex:1;border-bottom:1px dotted var(--lo);min-height:17px;padding:0 2px}
.mcbar{flex:0 0 19px;display:flex;align-items:center;gap:5px;background:var(--face);
  border-bottom:1px solid var(--lo);padding:0 4px;font-size:11px}
.mcbar .grow{flex:1}
.mcmark{position:absolute;right:6px;top:6px;width:13px;height:13px;
  border:1px solid var(--edge);background:var(--paper);display:grid;place-items:center;
  font-size:10px;line-height:1}
.mcmark.on{background:var(--warn);color:#fff}
.mclist{flex:1;overflow:auto}
.mclist table{border-collapse:collapse;width:100%;font-size:11px}
.mclist th{background:var(--face);border:1px solid var(--lo);padding:1px 4px;
  font-weight:400;font-size:10px;color:var(--lo2);position:sticky;top:0}
.mclist td{border:1px solid #dcdcdc;padding:1px 4px;background:var(--paper);
  white-space:nowrap;overflow:hidden;max-width:190px;text-overflow:ellipsis}
.mclist tr.cur td{background:var(--sel);color:var(--selfg)}
.mclist tr.marked td:first-child::before{content:"◆ ";color:var(--warn)}

/* ==================================================================
   基本ブラウザ / 超漢字メール
   ================================================================== */
.brwrap{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.brpanel{flex:0 0 20px;display:flex;align-items:center;gap:3px;background:var(--face);
  border-bottom:1px solid var(--lo);padding:0 3px;font-size:11px}
.brpanel .url{flex:1;min-width:0}
.brdoc{flex:1;overflow:auto;padding:11px 15px;font:13px/1.75 var(--mincho);
  background:var(--paper)}
.brdoc::-webkit-scrollbar{width:11px}
.brdoc::-webkit-scrollbar-thumb{background:var(--face);border:1px solid var(--edge)}
.brdoc h1{font-size:17px;margin:0 0 8px;border-bottom:2px solid var(--acc);
  padding-bottom:3px}
.brdoc h2{font-size:14px;margin:14px 0 5px;color:var(--acc)}
.brdoc p{margin:7px 0}
.brdoc a{color:#0000c0;text-decoration:underline}
.brdoc a:visited{color:#600060}
.brdoc hr{border:0;border-top:1px solid var(--lo);margin:11px 0}
.brdoc ul{margin:6px 0 6px 20px;padding:0}
.brdoc table{border-collapse:collapse;font-size:12px;margin:8px 0}
.brdoc th,.brdoc td{border:1px solid var(--lo2);padding:2px 6px}
.brdoc th{background:var(--face2)}
.brdoc .banner{background:linear-gradient(#dfe8f4,#c7d6ea);border:1px solid var(--acc);
  padding:7px 10px;font-family:var(--gothic);font-size:12px;margin:9px 0}
.brdoc code{font-family:var(--mono);font-size:11px;background:var(--face2);padding:0 2px}
.brstat{flex:0 0 15px;background:var(--face);border-top:1px solid var(--lo);
  font-size:10px;color:var(--lo2);display:flex;align-items:center;padding:0 5px;gap:8px}
.mlwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.mllist{flex:0 0 42%;overflow:auto;background:var(--paper);border-bottom:1px solid var(--lo)}
.mllist table{width:100%;border-collapse:collapse;font-size:11px}
.mllist th{position:sticky;top:0;background:var(--face);border-bottom:1px solid var(--lo);
  font-weight:400;font-size:10px;color:var(--lo2);padding:1px 4px;text-align:left}
.mllist td{padding:1px 4px;border-bottom:1px solid #e4e4e4;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:170px}
.mllist tr.cur td{background:var(--sel);color:var(--selfg)}
.mllist tr.unread td{font-weight:700}
.mlbody{flex:1;overflow:auto;padding:8px 11px;font:12px/1.7 var(--mincho);
  background:var(--paper)}
.mlhdr{font-family:var(--gothic);font-size:11px;background:var(--face2);
  border:1px solid var(--lo);padding:4px 7px;margin-bottom:8px;line-height:1.7}

/* ==================================================================
   文字検索 — the character search 小物, and the tofu lesson
   ================================================================== */
.csw{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--face)}
.cstabs{flex:0 0 18px;display:flex;gap:1px;padding:1px 2px 0;background:var(--face)}
.cstab{padding:1px 9px;font-size:11px;background:var(--face);border:1px solid var(--lo);
  border-bottom:0}
.cstab.on{background:var(--paper);font-weight:600;position:relative;top:1px}
.csform{flex:0 0 auto;padding:4px 5px;background:var(--face);
  border-top:1px solid var(--lo);border-bottom:1px solid var(--lo)}
.csresult{flex:1;overflow:auto;background:var(--paper);padding:3px}
.csresult::-webkit-scrollbar{width:11px}
.csresult::-webkit-scrollbar-thumb{background:var(--face);border:1px solid var(--edge)}
.csgrid{display:flex;flex-wrap:wrap;gap:2px}
.glyph{width:34px;height:38px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--paper);border:1px solid var(--lo);
  font:24px/1 var(--mincho);position:relative}
.glyph .sub{font:8px var(--gothic);color:var(--lo2);line-height:1;margin-top:2px}
.glyph:hover{background:#e8eef8;border-color:var(--acc)}
.glyph.on{background:var(--sel);color:var(--selfg)}
.glyph.tofu{font-family:var(--mono)}
/* a codepoint that exists but has no glyph here: show the empty cell,
   do not fake a character into it */
.glyph.rare{border-style:dashed;border-color:var(--lo2)}
.glyph.rare .sub{color:var(--warn)}
.glyph.tofu .box{width:19px;height:21px;border:1.5px solid var(--warn);
  display:block;background:repeating-linear-gradient(45deg,transparent 0 2px,
  rgba(160,16,16,.13) 2px 4px)}
.glyph.big{width:44px;height:50px;font-size:32px}
.csinfo{flex:0 0 auto;background:var(--face2);border-top:1px solid var(--lo);
  padding:3px 6px;font-size:10px;line-height:1.55;color:var(--lo2);max-height:76px;
  overflow:auto}
.csinfo b{color:var(--text);font-weight:600}
.varrow{display:flex;align-items:center;gap:4px;padding:3px 4px;
  border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
.varrow .vl{font-size:10px;color:var(--lo2);flex:0 0 88px;text-align:left;
  line-height:1.35}
.csnote{font-size:10px;line-height:1.55;color:var(--lo2);text-align:left;
  padding:1px 6px 6px 94px}
.radgrid{display:flex;flex-wrap:wrap;gap:1px}
.radbtn{min-width:23px;padding:1px 3px;text-align:center;font:15px var(--mincho);
  background:var(--face);border:1px solid var(--lo)}
.radbtn:hover{background:var(--hi)}
.radbtn.on{background:var(--sel);color:var(--selfg)}
.strokebtn{min-width:22px;padding:1px 2px;text-align:center;font:10px var(--mono);
  background:var(--face);border:1px solid var(--lo)}
.strokebtn.on{background:var(--sel);color:var(--selfg)}

/* ==================================================================
   仮身ネットワーク — the link map. Nothing else in the museum
   can draw this picture: a filesystem that is a graph.
   ================================================================== */
.nwwrap{position:absolute;inset:0;background:var(--paper);overflow:hidden}
.nwsvg{position:absolute;inset:0}
.nwnode{cursor:var(--hand)}
.nwnode rect{fill:var(--kam);stroke:var(--kamedge);stroke-width:1}
.nwnode.root rect{fill:#fff6d8;stroke:var(--acc);stroke-width:2}
.nwnode.multi rect{stroke:#a05000;stroke-width:2}
.nwnode.cyc rect{stroke:var(--warn);stroke-dasharray:3 2;stroke-width:2}
.nwnode text{font:10px var(--gothic);fill:var(--text);pointer-events:none}
.nwedge{stroke:var(--lo2);stroke-width:1;fill:none}
.nwedge.back{stroke:var(--warn);stroke-dasharray:3 2}
.nwedge.hi{stroke:var(--acc);stroke-width:2}
.nwlegend{position:absolute;right:4px;bottom:4px;background:var(--face);
  border:1px solid var(--edge);padding:3px 6px;font-size:10px;line-height:1.5;
  color:var(--lo2)}

/* ---------- generic small bits ---------- */
.tadview{position:absolute;inset:0;overflow:auto;background:#101418;color:#c8e6d0;
  font:11px/1.55 var(--mono);padding:6px 8px;white-space:pre}
.tadview .sg{color:#ffd479}
.tadview .fs{color:#8fb8ff}
.tadview .km{color:#ff9ec4}
.tadview .cm{color:#6f8a7a}
.clockface{position:absolute;inset:0}
.calcwrap{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--face)}
.calcdisp{margin:4px;padding:3px 6px;background:#dfe8d8;border:1px solid var(--edge);
  box-shadow:inset 1px 1px 0 var(--lo);text-align:right;font:16px var(--mono);
  min-height:24px;letter-spacing:1px}
.calcpad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:0 4px 4px}
.calcpad .sw{min-width:0;padding:0;display:grid;place-items:center;font-size:13px}
.nekowrap{position:absolute;inset:0;background:#f4f0e4;overflow:hidden}

/* ==================================================================
   THE ANNOTATION LAYER — English exhibit guide. Separable by design:
   it lives outside #ck and never translates the interface, only
   annotates it.
   ================================================================== */
#gloss{position:fixed;z-index:12000;max-width:330px;background:#fffdf3;
  color:#1a1a1a;border:1px solid #8a8158;box-shadow:0 6px 22px rgba(0,0,0,.45);
  padding:7px 10px;font:12px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:none;pointer-events:none;border-left:4px solid #b8973a}
#gloss.on{display:block}
#gloss .jp{font-family:var(--gothic);font-weight:700;font-size:13px;display:block;
  margin-bottom:2px}
#gloss .ro{font-style:italic;color:#6a6244;font-size:11px}
#gloss .en{display:block;margin-top:3px}
body:not(.annot) #gloss{display:none!important}
/* the marker is painted, not positioned: giving glossed elements a
   stacking context would quietly break any absolutely-placed panel
   that happens to carry a gloss */
.annot #ck [data-gloss]:not(.bmi):not(.cstab){
  background-image:linear-gradient(225deg,#b8973a 0 4px,transparent 4px);
  background-repeat:no-repeat;background-position:right top;background-size:5px 5px}

#guide{position:fixed;inset:0;z-index:13000;background:rgba(6,14,22,.86);
  display:none;overflow:auto;padding:26px 18px 40px;
  font:14px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8eef6}
#guide.on{display:block}

<script>
"use strict";
/* ==================================================================
   0. SMALL CHANGE
   ================================================================== */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
function el(tag, cls, txt){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt!=null) n.textContent = txt;
  return n;
}
function mk(tag, props, kids){
  const n = document.createElement(tag);
  if(props) for(const k in props){
    if(k==='class') n.className = props[k];
    else if(k==='text') n.textContent = props[k];
    else if(k==='html') n.innerHTML = props[k];
    else if(k==='style') n.setAttribute('style', props[k]);
    else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2), props[k]);
    else if(props[k]!=null) n.setAttribute(k, props[k]);
  }
  if(kids) for(const c of [].concat(kids)) if(c!=null)
    n.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  return n;
}
function svg(w,h,vb,inner,cls){
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width',w); s.setAttribute('height',h);
  s.setAttribute('viewBox', vb || ('0 0 '+w+' '+h));
  s.setAttribute('aria-hidden','true');
  if(cls) s.setAttribute('class',cls);
  s.innerHTML = inner || '';
  return s;
}
const clamp = (v,a,b)=> v<a?a:v>b?b:v;
let _uid = 1000;
const uid = p => (p||'x') + (++_uid).toString(36);
function pad(n,w){ n=String(n); while(n.length<(w||2)) n='0'+n; return n; }
function stamp(d){
  d = d instanceof Date ? d : new Date(d);
  return pad(d.getFullYear(),4)+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '
       + pad(d.getHours())+':'+pad(d.getMinutes());
}
function stampShort(d){
  d = d instanceof Date ? d : new Date(d);
  return pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
/* Japanese-era-ish and plain clock helpers used by 時計 / date fields */
const WDAY = ['日','月','火','水','木','金','土'];

/* ==================================================================
   1. STATE MANAGER — everything the visitor does survives a reload.
      LocalStorage only; no server, no fetch, ever.
   ================================================================== */
const SKEY = 'osmuseum.chokanjiv.v1';
const State = {
  data: null,
  defaults(){
    return {
      ver: 1,
      firstRun: true,
      lang: 'ja',                 /* ja | esperanto */
      annot: true,
      scheme: 'std', bgpat:'dither',
      sound: false,
      userName: '超漢字',
      inputMode: 'romaji',        /* romaji | kana */
      convStyle: 'btron',         /* btron | windows */
      dblclickMs: 400,
      graph: null,                /* {js:{}, seq:n} — filled by Graph.seed() */
      wins: {},                   /* saved window geometry by 実身 id */
      tray: [],                   /* トレー contents */
      csHistory: [], csFav: [],
      shared: null,               /* 共有フォルダ files */
      clip: '',                   /* Windows clipboard */
      visited: {},                /* browser history flags */
      guideSeen: false,
      kuzu: [],                   /* くず実身 ids awaiting ディスク整理 */
      stats: { opened:0, made:0, kamMade:0 }
    };
  },
  load(){
    let raw = null;
    try { raw = localStorage.getItem(SKEY); } catch(e){}
    if(raw){
      try {
        const d = JSON.parse(raw);
        if(d && d.ver === 1){ this.data = d; return true; }
      } catch(e){}
    }
    this.data = this.defaults();
    return false;
  },
  save(){
    if(!this.data) return;
    this.data.graph = Graph.serialize();
    try { localStorage.setItem(SKEY, JSON.stringify(this.data)); } catch(e){}
  },
  reset(){
    try { localStorage.removeItem(SKEY); } catch(e){}
    location.reload();
  }
};
let saveTimer = null;
function touch(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>State.save(), 550); }

/* ==================================================================
   2. SOUND — optional, minimal, synthesized. Default off.
   ================================================================== */
const Snd = {
  ctx:null,
  on(){ return !!(State.data && State.data.sound); },
  ac(){
    if(!this.ctx){
      try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ this.ctx = null; }
    }
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  blip(freq, dur, type, vol){
    if(!this.on()) return;
    const c = this.ac(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type||'square'; o.frequency.value = freq;
    g.gain.value = 0;
    o.connect(g); g.connect(c.destination);
    const t = c.currentTime;
    g.gain.linearRampToValueAtTime(vol==null?0.055:vol, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.06));
    o.start(t); o.stop(t+(dur||0.06)+0.02);
  },
  key(){ this.blip(1750, 0.022, 'square', 0.022); },
  alert(){ this.blip(420,0.10,'square',0.06); setTimeout(()=>this.blip(300,0.16,'square',0.06),110); },
  ok(){ this.blip(980,0.05,'triangle',0.05); },
  start(){
    if(!this.on()) return;
    const c = this.ac(); if(!c) return;
    /* a soft rising fourth: the startup tone */
    [[392,0],[523.25,0.16],[659.25,0.32]].forEach(([f,d])=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type='triangle'; o.frequency.value=f;
      o.connect(g); g.connect(c.destination);
      const t=c.currentTime+d;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.05,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
      o.start(t); o.stop(t+0.6);
    });
  }
};

/* ==================================================================
   3. 実身/仮身 GRAPH ENGINE
   ------------------------------------------------------------------
   The deepest idea in BTRON, and the foundation everything else sits
   on. There is no directory tree here and no path syntax — not
   because they were forgotten, but because this model replaces them.

     実身 (jitsumi, "real body")  an object that holds content
     仮身 (kamon,  "virtual body") a reference to a 実身, living
                                   inside another 実身's content

   What looks like a folder is simply a 実身 whose content happens to
   be a collection of 仮身. One 実身 may be referenced by many 仮身 in
   many places; the object survives while anything points at it, and
   when the last reference goes it becomes a くず実身 and the disk
   reclaims it. Documents may reference each other in cycles, so every
   traversal here is cycle-safe.
   ================================================================== */
const Graph = {
  js: {},        /* id -> 実身 */
  seq: 0,

  /* ---- 実身 ---- */
  make(o){
    const id = o.id || ('j' + (++this.seq));
    const now = o.mtime || Date.now();
    this.js[id] = {
      id, name: o.name || '無名',
      type: o.type || 'bunsho',
      app:  o.app  || APPFOR[o.type||'bunsho'] || '基本文章編集',
      ctime: o.ctime || now, mtime: now,
      content: o.content || TAD.empty(),
      attrs: Object.assign({protect:false, nodelete:false, genshi:false}, o.attrs||{}),
      meta: o.meta || {}
    };
    if(o.id && /^j(\d+)$/.test(o.id)) this.seq = Math.max(this.seq, +RegExp.$1);
    return this.js[id];
  },
  get(id){ return this.js[id] || null; },
  name(id){ const j=this.js[id]; return j?j.name:'(消えた実身)'; },
  rename(id, nm){
    const j = this.js[id]; if(!j) return;
    j.name = nm || '無名'; j.mtime = Date.now(); touch();
  },
  bump(id){ const j=this.js[id]; if(j){ j.mtime = Date.now(); touch(); } },

  /* ---- every 仮身 inside a 実身's content, whatever the content is ---- */
  kamsIn(id){
    const j = this.js[id]; if(!j) return [];
    return TAD.kams(j.content);
  },
  /* ---- reference counting: who points at this 実身? ---- */
  refsTo(id){
    const out = [];
    for(const k in this.js){
      for(const km of this.kamsIn(k)) if(km.to === id) out.push({from:k, kam:km});
    }
    return out;
  },
  refCount(id){ return this.refsTo(id).length; },

  /* ---- 仮身作成 : a new reference to an existing 実身 ---- */
  newKam(toId, o){
    o = o || {};
    return Object.assign({
      kid: uid('k'), to: toId,
      tsu: o.tsu || '', dtype: o.dtype || '',
      mode: o.mode || 'closed',
      w: o.w || 0, h: o.h || 0,
      x: o.x==null?null:o.x, y: o.y==null?null:o.y,
      col: o.col==null?0:o.col, fsz: o.fsz||12,
      nofrm: !!o.nofrm, nopict: !!o.nopict,
      prot: !!o.prot, fixed: !!o.fixed, bg: !!o.bg
    }, o.extra||{});
  },
  /* place a 仮身 into a container 実身's content */
  place(containerId, kam, at){
    const j = this.js[containerId]; if(!j) return null;
    TAD.insertKam(j.content, kam, at);
    j.mtime = Date.now();
    State.data.stats.kamMade++;
    touch();
    return kam;
  },
  /* remove one 仮身 (a reference) from a container. The 実身 itself
     survives if anything else still points at it. */
  removeKam(containerId, kid){
    const j = this.js[containerId]; if(!j) return;
    const km = TAD.kams(j.content).find(k=>k.kid===kid);
    TAD.removeKam(j.content, kid);
    j.mtime = Date.now();
    if(km) this.collect(km.to);
    touch();
  },
  /* the last reference went: normally the 実身 is reclaimed at once,
     but a 削除不可 object survives as a くず実身 for ディスク管理 */
  collect(id){
    const j = this.js[id]; if(!j) return;
    if(this.refCount(id) > 0) return;
    if(j.attrs.nodelete || j.type==='system'){
      if(State.data.kuzu.indexOf(id) < 0) State.data.kuzu.push(id);
      return;
    }
    /* deleting an object releases its own outbound references, which
       may cascade — walk it iteratively so a cycle cannot trap us */
    const targets = this.kamsIn(id).map(k=>k.to);
    delete this.js[id];
    const ki = State.data.kuzu.indexOf(id);
    if(ki>=0) State.data.kuzu.splice(ki,1);
    for(const t of targets) this.collect(t);
  },
  /* 実身複製 : a real copy — new object, same content, deep-copied.
     Contained 仮身 are copied as references, not as objects: the
     duplicate points at the same children. */
  duplicate(id, newName){
    const j = this.js[id]; if(!j) return null;
    const c = this.make({
      name: newName || (j.name + 'のコピー'),
      type: j.type, app: j.app,
      content: TAD.clone(j.content, true),
      attrs: Object.assign({}, j.attrs)
    });
    c.meta = JSON.parse(JSON.stringify(j.meta||{}));
    return c;
  },
  /* ---- くず実身 : nothing points here any more ---- */
  orphans(rootIds){
    const reach = this.reachable(rootIds||ROOTS());
    const out = [];
    for(const id in this.js){
      if(reach[id]) continue;
      out.push(id);
    }
    return out;
  },
  /* cycle-safe reachability from a set of roots */
  reachable(rootIds){
    const seen = {}, stack = [].concat(rootIds);
    while(stack.length){
      const id = stack.pop();
      if(!id || seen[id] || !this.js[id]) continue;
      seen[id] = true;
      for(const k of this.kamsIn(id)) if(!seen[k.to]) stack.push(k.to);
    }
    return seen;
  },
  /* ---- cycle-safe traversal. `path` is the current chain, so a
     document that contains a 仮身 to itself is reported, not looped. */
  walk(rootId, visit, maxDepth){
    const md = maxDepth==null ? 24 : maxDepth;
    const rec = (id, depth, path)=>{
      const j = this.js[id]; if(!j) return;
      const cyc = path.indexOf(id) >= 0;
      if(visit(j, depth, path, cyc) === false) return;
      if(cyc || depth >= md) return;
      const np = path.concat([id]);
      for(const k of this.kamsIn(id)) rec(k.to, depth+1, np);
    };
    rec(rootId, 0, []);
  },
  /* ---- the network view's data: nodes, edges, back-edges ---- */
  network(rootId, depth){
    const nodes = {}, edges = [];
    const md = depth==null?4:depth;
    const q = [{id:rootId, d:0, path:[]}];
    const order = [];
    while(q.length){
      const {id,d,path} = q.shift();
      const j = this.js[id]; if(!j) continue;
      const back = path.indexOf(id) >= 0;
      if(!nodes[id]){
        nodes[id] = {id, name:j.name, type:j.type, depth:d,
                     refs:this.refCount(id), cyc:false};
        order.push(id);
      } else nodes[id].depth = Math.min(nodes[id].depth, d);
      if(back){ nodes[id].cyc = true; continue; }
      if(d >= md) continue;
      const np = path.concat([id]);
      for(const k of this.kamsIn(id)){
        if(!this.js[k.to]) continue;
        edges.push({from:id, to:k.to, kid:k.kid, tsu:k.tsu,
                    back: np.indexOf(k.to)>=0});
        q.push({id:k.to, d:d+1, path:np});
      }
    }
    return {nodes, edges, order};
  },
  /* ---- persistence ---- */
  serialize(){
    const js = {};
    for(const id in this.js){
      const j = this.js[id];
      js[id] = {id:j.id, name:j.name, type:j.type, app:j.app,
        ctime:j.ctime, mtime:j.mtime, attrs:j.attrs, meta:j.meta,
        content: TAD.pack(j.content)};
    }
    return {js, seq:this.seq};
  },
  restore(g){
    this.js = {}; this.seq = g.seq||0;
    for(const id in g.js){
      const s = g.js[id];
      this.js[id] = {id:s.id, name:s.name, type:s.type, app:s.app,
        ctime:s.ctime, mtime:s.mtime, attrs:s.attrs||{}, meta:s.meta||{},
        content: TAD.unpack(s.content)};
    }
  },
  /* ---- integrity: drop 仮身 whose 実身 vanished (never should) ---- */
  scrub(){
    for(const id in this.js){
      const j = this.js[id];
      for(const k of TAD.kams(j.content)) if(!this.js[k.to]) TAD.removeKam(j.content, k.kid);
    }
  }
};

/* ==================================================================
   5. TAD — TRON Application Databus
   ------------------------------------------------------------------
   The single document format underneath everything: text, figures and
   仮身 coexist in one stream, and every application reads and writes
   the same thing. That is why a spreadsheet cell can hold a 仮身 and
   why a drawing can be pasted into running text with no conversion.
   A 「TAD構造表示」 view further down lets the curious read the stream.
   ================================================================== */
const TAD = {
  DEFF(){ return {fnt:'mincho', siz:14, b:false, i:false, u:false, s:false,
                  col:'#000000', scr:'ja', bg:null}; },
  empty(){ return {k:'tad', segs:[{t:'t', s:'', f:this.DEFF()}],
                   tate:false, mode:'shosai', view:null, paper:{w:'B5', mm:[182,257]}}; },
  doc(segs, o){
    return Object.assign({k:'tad', segs:segs&&segs.length?segs:[{t:'t',s:'',f:this.DEFF()}],
      tate:false, mode:'shosai', view:null, paper:{w:'B5', mm:[182,257]}}, o||{});
  },
  /* text convenience: build a stream from a compact spec */
  txt(s, f){ return {t:'t', s:s, f:Object.assign(this.DEFF(), f||{})}; },
  nl(){ return {t:'nl'}; },
  pp(){ return {t:'pp'}; },
  kamseg(kam){ return {t:'k', k:kam}; },

  /* ---- enumerate every 仮身 inside any content, whatever its kind --- */
  kams(c){
    if(!c) return [];
    const out = [];
    switch(c.k){
      case 'tad':
        for(const s of c.segs) if(s.t==='k' && s.k) out.push(s.k);
        break;
      case 'hyo':
        for(const key in c.cells){ const cell=c.cells[key]; if(cell && cell.kam) out.push(cell.kam); }
        break;
      case 'zu':
        for(const p of c.parts) if(p.type==='kam' && p.kam) out.push(p.kam);
        break;
      case 'card':
        for(const r of c.recs) for(const fk in r){
          const v = r[fk];
          if(v && typeof v==='object' && v.kid) out.push(v);
        }
        break;
      case 'mailbox':
        for(const m of c.msgs) if(m.attach) for(const a of m.attach) if(a.kid) out.push(a);
        break;
      case 'html': case 'script': case 'dev': default: break;
    }
    return out;
  },
  insertKam(c, kam, at){
    if(!c) return;
    if(c.k==='tad'){
      const segs = c.segs;
      let i = at==null ? segs.length : at.i;
      if(at && at.o!=null && segs[i] && segs[i].t==='t'){
        const s = segs[i], head = s.s.slice(0,at.o), tail = s.s.slice(at.o);
        const f = s.f;
        segs.splice(i, 1, {t:'t',s:head,f:Object.assign({},f)},
                          {t:'k',k:kam},
                          {t:'t',s:tail,f:Object.assign({},f)});
      } else {
        segs.splice(clamp(i,0,segs.length), 0, {t:'k',k:kam});
      }
    } else if(c.k==='hyo'){
      const key = (at && at.key) || '0,0';
      c.cells[key] = Object.assign(c.cells[key]||{}, {kam:kam, v:null});
    } else if(c.k==='zu'){
      c.parts.push({type:'kam', kam:kam, x:(at&&at.x)||20, y:(at&&at.y)||20, w:150, h:20});
    }
  },
  removeKam(c, kid){
    if(!c) return;
    if(c.k==='tad'){
      for(let i=c.segs.length-1;i>=0;i--)
        if(c.segs[i].t==='k' && c.segs[i].k.kid===kid) c.segs.splice(i,1);
      if(!c.segs.length) c.segs.push(this.txt(''));
    } else if(c.k==='hyo'){
      for(const key in c.cells) if(c.cells[key].kam && c.cells[key].kam.kid===kid){
        delete c.cells[key].kam;
        if(c.cells[key].v==null) delete c.cells[key];
      }
    } else if(c.k==='zu'){
      for(let i=c.parts.length-1;i>=0;i--)
        if(c.parts[i].type==='kam' && c.parts[i].kam.kid===kid) c.parts.splice(i,1);
    } else if(c.k==='card'){
      for(const r of c.recs) for(const fk in r)
        if(r[fk] && r[fk].kid===kid) r[fk] = '';
    }
  },
  findKam(c, kid){ return this.kams(c).find(k=>k.kid===kid) || null; },

  /* deep clone. `fresh` gives every contained 仮身 a new kid, which is
     what 実身複製 needs: a new object with its own references to the
     same children. */
  clone(c, fresh){
    const d = JSON.parse(JSON.stringify(c));
    if(fresh) for(const k of this.kams(d)) k.kid = uid('k');
    return d;
  },
  pack(c){ return c; },       /* the stream is already plain data */
  unpack(c){
    if(!c) return this.empty();
    if(c.k==='tad' && (!c.segs || !c.segs.length)) c.segs=[this.txt('')];
    return c;
  },

  /* ---- plain text of a stream, for search and for the トレー ---- */
  plain(c){
    if(!c) return '';
    if(c.k!=='tad') {
      if(c.k==='hyo'){
        const rows = [];
        for(const key in c.cells){ const cc=c.cells[key];
          rows.push(key+'\t'+(cc.v==null?'':cc.v)); }
        return rows.join('\n');
      }
      if(c.k==='card') return c.recs.map(r=>c.fields.map(f=>{
        const v=r[f.name]; return (v&&v.kid)?('〔'+Graph.name(v.to)+'〕'):(v==null?'':v);
      }).join('\t')).join('\n');
      return '';
    }
    let out = '';
    for(const s of c.segs){
      if(s.t==='t') out += s.s;
      else if(s.t==='ruby') out += s.s;
      else if(s.t==='tcy') out += s.s;
      else if(s.t==='nl') out += '\n';
      else if(s.t==='pp') out += '\n';
      else if(s.t==='pg') out += '\n';
      else if(s.t==='k') out += '〔'+Graph.name(s.k.to)+'〕';
      else if(s.t==='zu') out += '［図形］';
    }
    return out;
  },
  /* character count, which the editor's status strip reports */
  count(c){
    if(!c || c.k!=='tad') return 0;
    let n=0; for(const s of c.segs){
      if(s.t==='t') n += Array.from(s.s).length;
      else if(s.t==='ruby'||s.t==='tcy') n += Array.from(s.s).length;
      else if(s.t==='k'||s.t==='zu') n += 1;
    }
    return n;
  },
  /* ---- the debug view: read the stream as the system stores it ---- */
  dump(c){
    const L = [];
    L.push('<span class="cm">/* TAD stream — '+ (c.k) +' */</span>');
    if(c.k==='tad'){
      L.push('<span class="cm">/* '+(c.tate?'書記方向: 縦書き':'書記方向: 横書き')+
             ' / 表示モード: '+({genko:'原稿',shosai:'詳細',seisho:'清書'}[c.mode]||c.mode)+' */</span>');
      c.segs.forEach((s,i)=>{
        const n = pad(i,3);
        if(s.t==='t'){
          const f=s.f||{};
          L.push(n+'  <span class="sg">TS_TEXT   </span>'+
            '<span class="fs">［書体:'+(f.fnt==='gothic'?'中ゴシック体':'細明朝体')+
            ' 大きさ:'+f.siz+(f.b?' 太':'')+(f.u?' 下線':'')+(f.col!=='#000000'?' 色:'+f.col:'')+
            (f.scr&&f.scr!=='ja'?' 言語:'+f.scr:'')+'］</span> '+
            esc(s.s.length>44?s.s.slice(0,44)+'…':s.s));
        }
        else if(s.t==='k') L.push(n+'  <span class="km">TS_VOBJ   </span>仮身→実身 '+
          s.k.to+' 〔'+esc(Graph.name(s.k.to))+'〕'+(s.k.tsu?' 続柄:'+esc(s.k.tsu):'')+
          ' 表示:'+s.k.mode);
        else if(s.t==='zu') L.push(n+'  <span class="sg">TS_FIG    </span>埋め込み図形 部品'+
          (s.fig&&s.fig.parts?s.fig.parts.length:0)+'個');
        else if(s.t==='ruby') L.push(n+'  <span class="sg">TS_RUBY   </span>'+esc(s.s)+
          ' <span class="fs">［ルビ:'+esc(s.rt)+'］</span>');
        else if(s.t==='tcy') L.push(n+'  <span class="sg">TS_TATECHU</span>'+esc(s.s));
        else if(s.t==='nl') L.push(n+'  <span class="sg">TS_NL     </span><span class="cm">行</span>');
        else if(s.t==='pp') L.push(n+'  <span class="sg">TS_PARA   </span><span class="cm">段落</span>');
        else if(s.t==='pg') L.push(n+'  <span class="sg">TS_PAGE   </span><span class="cm">改頁</span>');
        else if(s.t==='fs') L.push(n+'  <span class="fs">TS_FUSEN  </span>指定付せん '+esc(s.kind));
      });
    } else if(c.k==='hyo'){
      const keys = Object.keys(c.cells).sort();
      L.push('<span class="cm">/* セル '+keys.length+'個 */</span>');
      keys.forEach(k=>{
        const cc=c.cells[k];
        L.push('  <span class="sg">CELL['+k+']</span> '+
          (cc.kam?('<span class="km">仮身→'+cc.kam.to+'</span> 〔'+esc(Graph.name(cc.kam.to))+'〕')
                 :(cc.f?('<span class="fs">式</span> '+esc(cc.f)) : esc(String(cc.v)))));
      });
    } else if(c.k==='zu'){
      L.push('<span class="cm">/* 部品 '+c.parts.length+'個, 用紙 '+c.paper.w+'×'+c.paper.h+' */</span>');
      c.parts.forEach((p,i)=>L.push(pad(i,3)+'  <span class="sg">'+
        pad(p.type.toUpperCase(),9)+'</span>'+
        (p.type==='kam'?('<span class="km">→'+p.kam.to+'</span> 〔'+esc(Graph.name(p.kam.to))+'〕')
         : p.type==='text'?esc(String(p.text||'').slice(0,30))
         : 'x:'+Math.round(p.x)+' y:'+Math.round(p.y)+
           (p.w!=null?' w:'+Math.round(p.w)+' h:'+Math.round(p.h):''))));
    } else if(c.k==='card'){
      L.push('<span class="cm">/* 項目 '+c.fields.length+' / カード '+c.recs.length+'枚 */</span>');
      c.fields.forEach(f=>L.push('  <span class="fs">FIELD</span> '+esc(f.name)+' : '+f.type));
    } else if(c.k==='html'){
      L.push('<span class="cm">/* TAD-HTML : '+esc(c.url)+' */</span>');
      (c.body||[]).forEach((b,i)=>L.push(pad(i,3)+'  <span class="sg">'+pad(b.t.toUpperCase(),7)+
        '</span>'+esc(String(b.s||'').slice(0,52))));
    } else {
      L.push(esc(JSON.stringify(c).slice(0,900)));
    }
    return L.join('\n');
  }
};
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ==================================================================
   6. CHARACTER ENGINE — 多漢字
   ------------------------------------------------------------------
   超漢字V advertises 約18万字. You cannot ship 180,000 glyphs in one
   HTML file, and pretending otherwise would betray the whole subject.
   So: text renders in the visitor's own system CJK fonts, which cover
   tens of thousands of Unicode ideographs; the searches below run over
   a curated dataset embedded in this file (radical, stroke count and
   reading indexes, plus variant groupings); and where 超漢字 can write
   a character Unicode cannot encode at all, the exhibit draws an empty
   box on purpose and says so. The box is the lesson.

   The data is entered index-first — by stroke count, by radical, by
   reading — so a character's stroke count is right by construction
   rather than by transcription.
   ================================================================== */
