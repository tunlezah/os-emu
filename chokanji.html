/* ==================================================================
   6b. CHARACTER DATABASE — indexes assembled at start-up
   ================================================================== */
const CharDB = {
  chars:{},
  byStroke:{}, byRad:{}, byYomi:{}, radicals:[], vgOf:{}, surnames:{},
  build(){
    const put = ch => (this.chars[ch] = this.chars[ch] ||
      {c:ch, st:0, rad:'', on:[], kun:[], vg:null});
    const strokeSrc = {};
    for(const n in STROKES) strokeSrc[n] = STROKES[n];
    for(const n in STROKES_EXTRA)
      strokeSrc[n] = (strokeSrc[n]||'') + STROKES_EXTRA[n];
    for(const n in strokeSrc){
      const list = [], seen = {};
      for(const ch of Array.from(strokeSrc[n])) if(!seen[ch]){ seen[ch]=1; list.push(ch); }
      this.byStroke[n] = list;
      for(const ch of list) put(ch).st = +n;
    }
    for(const e of RADIX){
      const i = e.indexOf(':'), r = e.slice(0,i);
      const list = Array.from(e.slice(i+1));
      this.byRad[r] = list; this.radicals.push(r);
      for(const ch of list){ const o = put(ch); if(!o.rad) o.rad = r; }
    }
    for(const e of YOMI){
      const i = e.indexOf(':'), y = e.slice(0,i);
      const body = e.slice(i+1);
      const kata = /^[ァ-ヴー]+$/.test(y);
      /* a reading of two-plus kana whose value splits into words of the
         same length is a surname list (わたなべ:渡辺渡邊…) */
      const isSurname = y.length>=2 && !kata && body.length>=4 && body.length%2===0 &&
        SURNAME_YOMI.indexOf(y)>=0;
      if(isSurname){
        const words = [];
        for(let k=0;k<body.length;k+=2) words.push(body.slice(k,k+2));
        this.surnames[y] = words;
        for(const ch of Array.from(body)) put(ch);
        continue;
      }
      const list = Array.from(body);
      this.byYomi[y] = (this.byYomi[y]||[]).concat(list);
      for(const ch of list){
        const o = put(ch);
        (kata ? o.on : o.kun).push(y);
      }
    }
    for(const g of VARIANTS){
      for(const f of g.forms) if(f.c){
        this.vgOf[f.c] = this.vgOf[f.c] || [];
        if(this.vgOf[f.c].indexOf(g.key)<0) this.vgOf[f.c].push(g.key);
        const o = put(f.c); if(!o.vg) o.vg = g.key;
      }
    }
    this.radicals.sort((a,b)=>a.codePointAt(0)-b.codePointAt(0));
  },
  count(){ return Object.keys(this.chars).length; },
  group(key){ return VARIANTS.find(v=>v.key===key) || null; },
  /* 異形字ゆらぎ同一視 — every form in a group counts as the same
     character when matching. This is what let a library catalogue find
     a name however the cataloguer had spelled it. */
  fold(s){
    let out = '';
    for(const ch of Array.from(String(s))){
      const gk = this.vgOf[ch];
      out += gk ? gk[0] : ch;
    }
    return out;
  },
  yuragiMatch(hay, needle){
    if(!needle) return true;
    return this.fold(hay).indexOf(this.fold(needle)) >= 0;
  },
  searchYomi(q){
    if(!q) return [];
    const hits = [], seen = {};
    const qq = String(q).trim();
    const kata = hiraToKata(qq), hira = kataToHira(qq);
    const want = [qq, kata, hira];
    for(const y in this.byYomi){
      let ok = false;
      for(const w of want) if(w && y.indexOf(w)===0){ ok = true; break; }
      if(!ok) continue;
      for(const ch of this.byYomi[y]) if(!seen[ch]){ seen[ch]=1; hits.push(ch); }
    }
    /* a surname reading answers with the whole family of spellings */
    for(const y in this.surnames){
      for(const w of want) if(w && y.indexOf(w)===0){
        for(const word of this.surnames[y])
          for(const ch of Array.from(word)) if(!seen[ch]){ seen[ch]=1; hits.push(ch); }
        break;
      }
    }
    return hits;
  },
  surnameHits(q){
    const qq = String(q||'').trim();
    if(!qq) return [];
    const kata = hiraToKata(qq), hira = kataToHira(qq), out = [];
    for(const y in this.surnames)
      if(y.indexOf(qq)===0 || y.indexOf(hira)===0 || y.indexOf(kata)===0)
        out.push({yomi:y, forms:this.surnames[y]});
    return out;
  },
  searchStroke(n){ return (this.byStroke[n]||[]).slice(); },
  searchRad(r){ return (this.byRad[r]||[]).slice(); },
  info(ch){
    const o = this.chars[ch], cp = ch.codePointAt(0), bits = [];
    bits.push('U+' + cp.toString(16).toUpperCase().padStart(4,'0'));
    if(o){
      if(o.st) bits.push('画数 ' + o.st);
      if(o.rad) bits.push('部首 ' + o.rad);
      if(o.on.length) bits.push('音 ' + o.on.slice(0,5).join('・'));
      if(o.kun.length) bits.push('訓 ' + o.kun.slice(0,5).join('・'));
    }
    const ku = kuten(ch);
    if(ku) bits.push('区点 ' + ku);
    const vg = this.vgOf[ch];
    if(vg) bits.push('異体字グループ ' + vg.join('・'));
    return bits.join(' / ');
  }
};
/* the readings above whose values are surname spellings, not single
   characters — listed explicitly so the index builder never has to
   guess */
const SURNAME_YOMI = ['わたなべ','さいとう','やまざき','たかはし','しまだ'];

/* a 区点 for characters in the JIS ranges. The real product accepts
   区点コード input, and this keeps that field meaningful. */
function kuten(ch){
  const cp = ch.codePointAt(0);
  if(cp < 0x4E00 || cp > 0x9FA5) return '';
  const n = cp - 0x4E00;
  return pad(16 + Math.floor(n/94), 2) + '-' + pad(1 + (n%94), 2);
}
function hiraToKata(s){
  return String(s).replace(/[ぁ-ゖ]/g, c=>String.fromCharCode(c.charCodeAt(0)+0x60));
}
function kataToHira(s){
  return String(s).replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}

/* ==================================================================
   7. WINDOW MANAGER — BTRON chrome
   ------------------------------------------------------------------
   A 超漢字 window carries its 実身名 in a thin strip at the top with
   the object's ピクトグラム at the left; the gadget boxes sit at the
   right; scroll bars are square-arrow boxes at both ends of a hatched
   trough. There is no menu bar: you press the right button and the
   menu appears under the pointer, which is why the gadget marked メ
   exists only as a courtesy to visitors with one-button mice.
   ================================================================== */
const WM = {
  wins: {}, order: [], zTop: 100, act: null,
  /* the 実身 currently open in a window — used to draw 実行状態 on 仮身 */
  openJids(){
    const s = {};
    for(const id in this.wins) s[this.wins[id].jid] = true;
    return s;
  },
  find(jid){
    for(const id in this.wins) if(this.wins[id].jid === jid) return this.wins[id];
    return null;
  },
  /* --- open a 実身. If it is already open, bring that window up. --- */
  open(jid, o){
    o = o || {};
    const j = Graph.get(jid);
    if(!j){ Panel.alert('実身がありません', 'この仮身が参照していた実身は、もう存在しません。'); return null; }
    const ex = this.find(jid);
    if(ex){ this.focus(ex.wid); return ex; }
    let appName = o.app || j.app || APPFOR[j.type] || '基本文章編集';
    if(!APPS[appName] && KOMONO[appName]) return this.openKomono(appName, {arg:jid});
    if(!APPS[appName]) appName = '基本文章編集';
    const app = APPS[appName];
    const saved = State.data.wins[jid] || {};
    const w = {
      wid: uid('w'), jid, app: appName, api: null,
      x: o.x != null ? o.x : (saved.x != null ? saved.x : 40 + (this.order.length*17)%150),
      y: o.y != null ? o.y : (saved.y != null ? saved.y : 30 + (this.order.length*15)%120),
      w: o.w || saved.w || app.size[0], h: o.h || saved.h || app.size[1],
      full: !!saved.full, dirty: false, komono: !!app.komono,
      hist: [], histAt: -1
    };
    this.wins[w.wid] = w; this.order.push(w.wid);
    this.build(w);
    w.api = app.open(w);
    if(w.api && w.api.render) w.api.render();
    this.focus(w.wid);
    State.data.stats.opened++;
    Deck.refreshAll();
    touch();
    return w;
  },
  /* 小物 open with no 実身 behind them */
  openKomono(name, o){
    const app = KOMONO[name];
    if(!app) return null;
    if(!app.multi){
      for(const id in this.wins) if(this.wins[id].komonoName === name){ this.focus(id); return this.wins[id]; }
    }
    o = o || {};
    const w = {
      wid: uid('w'), jid: null, app: name, komono: true, komonoName: name, api: null,
      x: o.x != null ? o.x : 90 + (this.order.length*19)%140,
      y: o.y != null ? o.y : 60 + (this.order.length*13)%100,
      w: o.w || app.size[0], h: o.h || app.size[1], full: false, dirty: false,
      arg: o.arg
    };
    this.wins[w.wid] = w; this.order.push(w.wid);
    this.build(w);
    w.api = app.open(w);
    if(w.api && w.api.render) w.api.render();
    this.focus(w.wid);
    touch();
    return w;
  },
  build(w){
    const j = w.jid ? Graph.get(w.jid) : null;
    const n = el('div', 'bw');
    n.dataset.wid = w.wid;
    n.style.left = w.x+'px'; n.style.top = w.y+'px';
    n.style.width = w.w+'px'; n.style.height = w.h+'px';
    if(w.full) n.classList.add('full');

    const top = el('div','bwtop');
    const pict = el('div','bwpict');
    pict.setAttribute('data-gloss', 'pict');
    pict.appendChild(pictSVG(j ? j.type : 'komono', 13, 'currentColor'));
    const nm = el('div','bwname');
    const nmt = el('span','nm', j ? j.name : w.app);
    nm.appendChild(nmt);
    if(w.tsu){ nm.appendChild(el('span','tsu',':'+w.tsu)); }
    const gad = el('div','bwgad');
    const gM = el('div','bwg'); gM.appendChild(svg(11,11,'0 0 11 11',
      '<path d="M1.5 2.5h8M1.5 5.5h8M1.5 8.5h8" stroke="currentColor" fill="none"/>'));
    gM.setAttribute('data-gloss','menugadget');
    const gF = el('div','bwg'); gF.appendChild(svg(11,11,'0 0 11 11',
      '<rect x="1.5" y="1.5" width="8" height="8" fill="none" stroke="currentColor"/>'));
    gF.setAttribute('data-gloss','fullgadget');
    const gX = el('div','bwg'); gX.appendChild(svg(11,11,'0 0 11 11',
      '<path d="M2 2l7 7M9 2l-7 7" stroke="currentColor" fill="none"/>'));
    gX.setAttribute('data-gloss','closegadget');
    gad.append(gM, gF, gX);
    top.append(pict, nm, gad);

    const main = el('div','bwmain');
    const col  = el('div','bwcol');
    const view = el('div','bwview');
    const foot = el('div','bwfoot');
    const hs   = this.scrollbar('h', w);
    const sz   = el('div','bwsize');
    sz.appendChild(svg(11,11,'0 0 11 11',
      '<path d="M10 2v8H2M10 6H6v4" stroke="currentColor" fill="none"/>'));
    foot.append(hs, sz);
    col.append(view, foot);
    const vs = this.scrollbar('v', w);
    main.append(col, vs);
    n.append(top, main);
    $('#ckwins').appendChild(n);

    w.node = n; w.view = view; w.nameEl = nmt; w.vs = vs; w.hs = hs;

    /* drag by the name strip */
    nm.addEventListener('mousedown', e=>{
      if(e.button!==0) return;
      this.focus(w.wid);
      if(w.full) return;
      Drag.start(e, (dx,dy)=>{
        w.x = clamp(w.x0+dx, -w.w+50, 800-40); w.y = clamp(w.y0+dy, 0, 600-20);
        n.style.left = w.x+'px'; n.style.top = w.y+'px';
      }, ()=>{ w.x0=w.x; w.y0=w.y; this.remember(w); }, ()=>{ w.x0=w.x; w.y0=w.y; });
    });
    /* resize */
    sz.addEventListener('mousedown', e=>{
      if(e.button!==0) return;
      this.focus(w.wid);
      Drag.start(e, (dx,dy)=>{
        w.w = clamp(w.w0+dx, 150, 800); w.h = clamp(w.h0+dy, 64, 600);
        n.style.width = w.w+'px'; n.style.height = w.h+'px';
        if(w.api && w.api.resize) w.api.resize();
        this.sync(w);
      }, ()=>{ this.remember(w); }, ()=>{ w.w0=w.w; w.h0=w.h; });
    });
    /* gadgets */
    gM.addEventListener('mousedown', e=>{ e.preventDefault(); e.stopPropagation();
      this.focus(w.wid); Menu.openFor(w, w.x+w.w-60, w.y+18); });
    gF.addEventListener('click', ()=>{ this.focus(w.wid); this.toggleFull(w); });
    gX.addEventListener('click', ()=>{ this.close(w.wid); });
    /* double-clicking the pictogram quits, exactly as the manual says */
    pict.addEventListener('dblclick', ()=>{ this.close(w.wid); });
    pict.addEventListener('mousedown', e=>{ e.stopPropagation(); this.focus(w.wid); });

    n.addEventListener('mousedown', e=>{
      if(e.button===0) this.focus(w.wid);
    }, true);
    n.addEventListener('contextmenu', e=>e.preventDefault());
    n.addEventListener('mousedown', e=>{
      if(e.button!==2) return;
      e.preventDefault(); e.stopPropagation();
      this.focus(w.wid);
      Menu.openFor(w, e.clientX, e.clientY, true);
    });
    w.x0=w.x; w.y0=w.y; w.w0=w.w; w.h0=w.h;
    return w;
  },
  scrollbar(dir, w){
    const n = el('div', dir==='v' ? 'bwvs' : 'bwhs');
    const a = el('div','sbtn'), t = el('div','strough'), b = el('div','sbtn');
    a.appendChild(svg(9,9,'0 0 9 9', dir==='v'
      ? '<path d="M4.5 2l3 5h-6z" fill="currentColor"/>'
      : '<path d="M2 4.5l5-3v6z" fill="currentColor"/>'));
    b.appendChild(svg(9,9,'0 0 9 9', dir==='v'
      ? '<path d="M4.5 7l-3-5h6z" fill="currentColor"/>'
      : '<path d="M7 4.5l-5 3v-6z" fill="currentColor"/>'));
    const th = el('div','sthumb');
    t.appendChild(th);
    n.append(a,t,b);
    n._thumb = th; n._trough = t;
    const step = (mult)=>{
      const sc = this.scroller(w); if(!sc) return;
      if(dir==='v') sc.scrollTop += 26*mult; else sc.scrollLeft += 26*mult;
      this.sync(w);
    };
    a.addEventListener('mousedown', e=>{ e.stopPropagation(); step(-1); });
    b.addEventListener('mousedown', e=>{ e.stopPropagation(); step(1); });
    t.addEventListener('mousedown', e=>{
      e.stopPropagation();
      if(e.target===th){
        const sc = this.scroller(w); if(!sc) return;
        const st0 = dir==='v' ? sc.scrollTop : sc.scrollLeft;
        const range = dir==='v' ? (sc.scrollHeight - sc.clientHeight) : (sc.scrollWidth - sc.clientWidth);
        const px = dir==='v' ? t.clientHeight : t.clientWidth;
        Drag.start(e, (dx,dy)=>{
          const d = dir==='v' ? dy : dx;
          const v = st0 + (d/Math.max(1,px)) * range * 1.0;
          if(dir==='v') sc.scrollTop = v; else sc.scrollLeft = v;
          this.sync(w);
        });
      } else {
        const r = t.getBoundingClientRect();
        const before = dir==='v' ? (e.clientY < th.getBoundingClientRect().top)
                                 : (e.clientX < th.getBoundingClientRect().left);
        step(before ? -5 : 5);
      }
    });
    return n;
  },
  scroller(w){
    return w.view ? (w.view.querySelector('.bwscroll,.edwrap,.dzwrap,.ssgrid,.csresult,.brdoc,.mclist,.tadview,.nwwrap,.mlbody') || null) : null;
  },
  sync(w){
    const sc = this.scroller(w);
    const set = (bar, len, client, pos)=>{
      const th = bar._thumb, tr = bar._trough;
      const span = (bar===w.vs) ? tr.clientHeight : tr.clientWidth;
      const frac = len>0 ? clamp(client/len,0.08,1) : 1;
      const size = Math.max(9, Math.round(span*frac));
      const room = Math.max(0, span - size);
      const off  = len>client ? Math.round(room * clamp(pos/(len-client),0,1)) : 0;
      if(bar===w.vs){ th.style.height = size+'px'; th.style.top = off+'px'; }
      else { th.style.width = size+'px'; th.style.left = off+'px'; }
      th.style.opacity = (len>client+1) ? '1' : '0.35';
    };
    if(!sc){ set(w.vs,1,1,0); set(w.hs,1,1,0); return; }
    set(w.vs, sc.scrollHeight, sc.clientHeight, sc.scrollTop);
    set(w.hs, sc.scrollWidth,  sc.clientWidth,  sc.scrollLeft);
  },
  focus(wid){
    const w = this.wins[wid]; if(!w) return;
    if(this.act === wid){ return; }
    this.act = wid;
    const i = this.order.indexOf(wid);
    if(i>=0){ this.order.splice(i,1); this.order.push(wid); }
    this.order.forEach((id,k)=>{
      const ww = this.wins[id]; if(!ww || !ww.node) return;
      ww.node.style.zIndex = 100 + k;
      ww.node.classList.toggle('act', id===wid);
    });
    if(w.api && w.api.focus) w.api.focus();
    this.sync(w);
  },
  toggleFull(w){
    w.full = !w.full;
    w.node.classList.toggle('full', w.full);
    if(!w.full){
      w.node.style.left = w.x+'px'; w.node.style.top = w.y+'px';
      w.node.style.width = w.w+'px'; w.node.style.height = w.h+'px';
    }
    if(w.api && w.api.resize) w.api.resize();
    this.sync(w); this.remember(w);
  },
  remember(w){
    if(!w.jid) return;
    State.data.wins[w.jid] = {x:w.x, y:w.y, w:w.w, h:w.h, full:w.full};
    touch();
  },
  rename(w){
    if(!w.jid) return;
    const j = Graph.get(w.jid); if(!j) return;
    if(w.nameEl) w.nameEl.textContent = j.name;
  },
  /* --- 終了 : the manual's flow. If the content changed, a panel asks
     保存 / 保存しない before the window goes. --- */
  close(wid, force){
    const w = this.wins[wid]; if(!w) return;
    if(w.jid === SYS.home && !force){ Shell.quitSystem(); return; }
    const finish = ()=>{
      if(w.api && w.api.destroy) w.api.destroy();
      if(w.node && w.node.parentNode) w.node.parentNode.removeChild(w.node);
      delete this.wins[wid];
      const i = this.order.indexOf(wid); if(i>=0) this.order.splice(i,1);
      if(this.act===wid){
        this.act = null;
        const last = this.order[this.order.length-1];
        if(last) this.focus(last);
      }
      Deck.refreshAll();
      touch();
    };
    if(w.dirty && !force){
      Panel.ask('保存', Graph.name(w.jid)+'の内容が変更されています。',
        [{l:'保存', def:true, act:()=>{ if(w.api&&w.api.save) w.api.save(); finish(); }},
         {l:'保存しない', act:finish},
         {l:'取消'}]);
      return;
    }
    if(w.api && w.api.save && w.jid) w.api.save();
    finish();
  },
  closeAllButHome(){
    for(const id of this.order.slice()) if(this.wins[id] && this.wins[id].jid !== SYS.home)
      this.close(id, true);
  },
  dirty(w){ w.dirty = true; if(w.jid) Graph.bump(w.jid); },
  /* refresh every window that shows this 実身 */
  refreshJid(jid){
    for(const id in this.wins){
      const w = this.wins[id];
      if(w.api && w.api.render && (w.jid===jid || (w.api.shows && w.api.shows(jid)))) w.api.render();
    }
  },
  refreshAll(){
    for(const id in this.wins){ const w = this.wins[id];
      if(w.api && w.api.render) w.api.render(); }
  },
  list(){ return this.order.map(id=>this.wins[id]).filter(Boolean); }
};

/* ---- a tiny drag helper used by every draggable thing ------------ */
const Drag = {
  start(e, move, up, init){
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    const sc = Scale.f || 1;
    if(init) init();
    $('#ck').classList.add('pressing');
    const mv = ev=>{ move((ev.clientX-sx)/sc, (ev.clientY-sy)/sc, ev); };
    const fin = ev=>{
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', fin);
      $('#ck').classList.remove('pressing');
      if(up) up((ev.clientX-sx)/sc, (ev.clientY-sy)/sc, ev);
    };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', fin);
  }
};

/* ---- the screen is 800x600 and gets scaled to fit its viewport --- */
const Scale = {
  f: 1,
  fit(){
    const port = $('#vmport');
    if(!port) return;
    const r = port.getBoundingClientRect();
    const f = Math.max(0.3, Math.min(r.width/800, r.height/600));
    this.f = f;
    $('#ckscale').style.transform = 'scale('+f+')';
  },
  /* screen coordinates from a page event */
  pt(e){
    const r = $('#ck').getBoundingClientRect();
    return {x:(e.clientX-r.left)/this.f, y:(e.clientY-r.top)/this.f};
  }
};

/* ==================================================================
   8. MENUS — press the right button and the menu appears under the
      pointer. Drag to an item and release, or click twice; both work,
      because a museum visitor should not have to be told.
   ================================================================== */
const Menu = {
  stack: [], armed:false, downAt:0,
  clear(){
    this.stack.forEach(n=>n.parentNode && n.parentNode.removeChild(n));
    this.stack = [];
    $('#ckmenus').style.pointerEvents = 'none';
    document.removeEventListener('mouseup', this._up, true);
    document.removeEventListener('mousemove', this._mv, true);
  },
  openFor(w, cx, cy, fromEvent){
    const items = MenuTree.forWin(w);
    const p = fromEvent ? Scale.pt({clientX:cx, clientY:cy}) : {x:cx, y:cy};
    this.show(items, p.x, p.y);
  },
  openDesk(cx, cy){
    const p = Scale.pt({clientX:cx, clientY:cy});
    this.show(MenuTree.desk(), p.x, p.y);
  },
  show(items, x, y, parent, title){
    if(!parent) this.clear();
    const n = el('div','bmenu');
    if(title) n.appendChild(el('div','bmtitle', title));
    let hot = null;
    items.forEach(it=>{
      if(it === '-' || it.sep){ n.appendChild(el('div','bmsep')); return; }
      const r = el('div','bmi' + (it.dis?' dis':'') + (it.chk?' chk':''));
      r.appendChild(el('span','lbl', it.l));
      if(it.k) r.appendChild(el('span','key', it.k));
      if(it.sub) r.appendChild(el('span','arw','▶'));
      if(it.gloss) r.setAttribute('data-gloss', it.gloss);
      r.addEventListener('mouseenter', ()=>{
        Array.from(n.children).forEach(c=>c.classList.remove('hot'));
        r.classList.add('hot');
        /* close deeper menus, then open this one's submenu */
        while(this.stack.length > this.stack.indexOf(n)+1){
          const d = this.stack.pop(); if(d.parentNode) d.parentNode.removeChild(d);
        }
        if(it.sub && !it.dis){
          const rb = r.getBoundingClientRect(), sb = $('#ck').getBoundingClientRect();
          const sub = typeof it.sub === 'function' ? it.sub() : it.sub;
          this.show(sub, (rb.right-sb.left)/Scale.f - 3, (rb.top-sb.top)/Scale.f - 2, n, it.subtitle);
        }
      });
      r.addEventListener('mouseup', ev=>{
        ev.stopPropagation();
        if(it.dis || it.sub) return;
        if(Date.now() - this.downAt < 180 && !this.armed){ this.armed = true; return; }
        this.pick(it);
      });
      r.addEventListener('click', ev=>{
        ev.stopPropagation();
        if(it.dis || it.sub) return;
        this.pick(it);
      });
      n.appendChild(r);
    });
    $('#ckmenus').appendChild(n);
    $('#ckmenus').style.pointerEvents = 'auto';
    /* keep the menu on screen */
    const bw = n.offsetWidth, bh = n.offsetHeight;
    n.style.left = clamp(x, 0, 800-bw-2)+'px';
    n.style.top  = clamp(y, 0, 600-bh-2)+'px';
    this.stack.push(n);
    if(!parent){
      this.downAt = Date.now(); this.armed = false;
      this._up = ev=>{
        if(Date.now()-this.downAt < 180){ this.armed = true; return; }
        if(!ev.target.closest || !ev.target.closest('.bmenu')) this.clear();
      };
      this._mv = ()=>{};
      setTimeout(()=>{
        document.addEventListener('mouseup', this._up, true);
        document.addEventListener('mousedown', e=>{
          if(!e.target.closest || !e.target.closest('.bmenu')) this.clear();
        }, {once:true, capture:true});
      }, 0);
    }
    return n;
  },
  pick(it){
    this.clear();
    Snd.ok();
    try { if(it.act) it.act(); }
    catch(err){ Panel.alert('エラー', String(err && err.message || err)); }
  }
};

/* ==================================================================
   9. PANELS (パネル) and SWITCHES (スイッチ) — BTRON's words for
      dialogs and buttons, kept because they are the system's own.
   ================================================================== */
const Panel = {
  open(o){
    const n = el('div','bpanel' + (o.cls?' '+o.cls:''));
    const t = el('div','bptitle');
    t.appendChild(el('span','t', o.title||'パネル'));
    const x = el('div','bwg'); x.style.borderLeft='1px solid var(--lo)';
    x.appendChild(svg(9,9,'0 0 9 9','<path d="M1.5 1.5l6 6M7.5 1.5l-6 6" stroke="currentColor" fill="none"/>'));
    x.addEventListener('click', ()=>close());
    t.appendChild(x);
    const b = el('div','bpbody');
    if(typeof o.body === 'string') b.innerHTML = o.body;
    else if(o.body) [].concat(o.body).forEach(c=>c && b.appendChild(c));
    const f = el('div','bpfoot');
    const close = ()=>{ if(n.parentNode) n.parentNode.removeChild(n); if(o.onclose) o.onclose(); };
    (o.switches||[{l:'了解', def:true}]).forEach(s=>{
      const sw = el('div','sw' + (s.def?' def':'') + (s.dis?' dis':''), s.l);
      sw.addEventListener('click', ()=>{
        if(s.dis) return;
        let keep = false;
        if(s.act) keep = s.act(n) === true;
        if(!keep && !s.keep) close();
      });
      f.appendChild(sw);
    });
    n.append(t,b,f);
    $('#cklayer').appendChild(n);
    const bw = n.offsetWidth, bh = n.offsetHeight;
    n.style.left = clamp(o.x!=null?o.x:Math.round((800-bw)/2), 2, 800-bw-2)+'px';
    n.style.top  = clamp(o.y!=null?o.y:Math.round((600-bh)/2.4), 2, 600-bh-2)+'px';
    t.addEventListener('mousedown', e=>{
      if(e.button!==0 || e.target===x) return;
      const x0 = parseInt(n.style.left), y0 = parseInt(n.style.top);
      Drag.start(e, (dx,dy)=>{
        n.style.left = clamp(x0+dx, -bw+40, 800-40)+'px';
        n.style.top  = clamp(y0+dy, 0, 600-18)+'px';
      });
    });
    n._close = close;
    if(o.focus) setTimeout(()=>{ const f2 = n.querySelector(o.focus); if(f2) f2.focus(); }, 20);
    return n;
  },
  alert(title, msg, sw){
    Snd.alert();
    return this.open({title:title, body:'<div class="bpnote" style="max-width:280px">'+
      esc(msg).replace(/\n/g,'<br>')+'</div>', switches: sw||[{l:'了解', def:true}]});
  },
  ask(title, msg, sws){
    return this.open({title:title, body:'<div class="bpnote" style="max-width:290px">'+
      esc(msg).replace(/\n/g,'<br>')+'</div>',
      switches: sws.map(s=>({l:s.l, def:s.def, act:s.act}))});
  },
  /* the 実身名 panel: BTRON asks for a name when an object is made */
  prompt(title, label, value, cb, note){
    const inp = mk('input',{class:'bfield', value:value==null?'':value, style:'width:210px'});
    const body = [ mk('div',{class:'bprow'},[ mk('span',{class:'bplabel',text:label}) ]),
                   mk('div',{class:'bprow'},[inp]) ];
    if(note) body.push(mk('div',{class:'bpnote',text:note,style:'max-width:250px'}));
    const p = this.open({title:title, body:body, focus:'input',
      switches:[{l:'設定', def:true, act:()=>{ cb(inp.value.trim()); }}, {l:'取消'}]});
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); cb(inp.value.trim()); p._close(); }
      if(e.key==='Escape'){ p._close(); }
      e.stopPropagation();
    });
    return p;
  }
};

/* ==================================================================
   10. THE 仮身 RENDERER
   ------------------------------------------------------------------
   A 仮身 has three ways to appear, and all three must work:
     ・閉じた仮身  a short strip inline in running text
     ・アイコン    the same reference drawn as a picture with a caption
     ・開いた仮身  the referenced 実身's content, embedded in place
   Because documents hold live references to other documents, opening
   in place can recurse — including into a cycle. Cycles are detected
   against the path we arrived by and reported rather than followed.
   ================================================================== */
const Deck = {
  sel: null,       /* {jid, kid} — the selected 仮身 */
  MAXDEPTH: 4,

  /* build one 仮身 element. `host` is the 実身 that contains it. */
  build(kam, hostJid, opts){
    opts = opts || {};
    const path = opts.path || [hostJid];
    const depth = opts.depth || 0;
    const j = Graph.get(kam.to);
    const n = el('div','kam');
    n.dataset.kid = kam.kid;
    n.dataset.host = hostJid;
    n.setAttribute('data-gloss','kamon');
    if(!j){
      n.classList.add('nofrm');
      n.appendChild(el('div','klab','〔失われた実身〕'));
      return n;
    }
    const openInWin = !!WM.find(kam.to);
    const mode = kam.mode;
    if(kam.nofrm) n.classList.add('nofrm');
    if(kam.nopict) n.classList.add('nopict');
    if(kam.prot) n.classList.add('prot');
    if(kam.fixed) n.classList.add('fixed');
    if(openInWin) n.classList.add('run');
    if(this.sel && this.sel.kid===kam.kid) n.classList.add('sel');
    const col = KAMCOL[kam.col||0];
    n.style.color = col;
    if(kam.fsz && kam.fsz!==12) n.style.fontSize = kam.fsz+'px';

    if(mode === 'open'){
      n.classList.add('open');
      const hdr = el('div','kohdr');
      hdr.appendChild(pictSVG(j.type, 11, 'currentColor'));
      hdr.appendChild(el('span','knm', j.name + (kam.tsu?':'+kam.tsu:'')));
      const shut = el('span','kobtn','閉');
      shut.addEventListener('click', e=>{ e.stopPropagation();
        kam.mode='closed'; Graph.bump(hostJid); WM.refreshAll(); });
      hdr.appendChild(shut);
      const body = el('div','kobody');
      body.style.width  = (kam.w || 260)+'px';
      body.style.height = (kam.h || 120)+'px';
      n.append(hdr, body);
      /* a document may hold a 仮身 to itself: expand it once, so the
         visitor SEES the nesting, then report the cycle on the way in
         a second time */
      let seenTimes = 0;
      for(const q of path) if(q === kam.to) seenTimes++;
      const cyc = seenTimes >= 2;
      if(cyc){
        n.classList.add('deep');
        body.appendChild(mk('div',{class:'kocycle'},[
          '循環参照：この仮身は、たどってきた実身「'+Graph.name(kam.to)+
          '」自身を指しています。実身/仮身は木ではなく網なので、輪ができる。'+
          'システムはここで展開を止める。']));
      } else if(depth >= this.MAXDEPTH){
        n.classList.add('deep');
        body.appendChild(mk('div',{class:'kocycle'},[
          '入れ子が深すぎるため、ここで展開を止めた（'+this.MAXDEPTH+'段）。'+
          'この仮身を開けば続きが見られる。']));
      } else {
        const inner = el('div','koinner');
        body.appendChild(inner);
        Render.inline(j, inner, {path: path.concat([kam.to]), depth: depth+1,
                                 w: kam.w||260, h: kam.h||120});
      }
      /* a resize corner for the opened 仮身 */
      const grip = el('div','kobtn');
      grip.textContent = '⤡';
      grip.style.cssText = 'position:absolute;right:0;bottom:0;line-height:11px;font-size:9px';
      grip.addEventListener('mousedown', e=>{ e.stopPropagation();
        const w0 = kam.w||260, h0 = kam.h||120;
        Drag.start(e, (dx,dy)=>{
          kam.w = clamp(Math.round(w0+dx), 90, 760);
          kam.h = clamp(Math.round(h0+dy), 40, 540);
          body.style.width = kam.w+'px'; body.style.height = kam.h+'px';
        }, ()=>{ Graph.bump(hostJid); WM.refreshAll(); });
      });
      n.appendChild(grip);
    } else if(mode === 'icon'){
      n.classList.add('icon');
      const p = el('div','kpict');
      p.appendChild(pictSVG(j.type, 26, col));
      const lab = el('div','klab');
      lab.appendChild(el('span','knm', j.name));
      if(kam.tsu) lab.appendChild(el('span','ktsu',':'+kam.tsu));
      n.append(p, lab);
    } else {
      const p = el('div','kpict');
      p.appendChild(pictSVG(j.type, 12, col));
      const lab = el('div','klab');
      lab.appendChild(el('span','knm', j.name));
      if(kam.tsu) lab.appendChild(el('span','ktsu',':'+kam.tsu));
      if(opts.dates!==false){
        lab.appendChild(el('span','kdt', stampShort(j.mtime)));
        if(opts.dtype!==false && kam.dtype)
          lab.appendChild(el('span','kdt','['+kam.dtype+']'));
      }
      n.append(p, lab);
      if(kam.w) n.style.width = kam.w+'px';
    }

    /* --- interaction ------------------------------------------- */
    n.addEventListener('mousedown', e=>{
      if(e.button===2){
        e.preventDefault(); e.stopPropagation();
        this.select(hostJid, kam);
        Menu.show(MenuTree.kamon(hostJid, kam), Scale.pt(e).x, Scale.pt(e).y);
        return;
      }
      if(e.button!==0) return;
      e.stopPropagation();
      this.select(hostJid, kam);
      /* free placement: drag the 仮身 about inside its container */
      if(opts.free && !kam.fixed){
        const x0 = kam.x||0, y0 = kam.y||0;
        let moved = false;
        Drag.start(e, (dx,dy)=>{
          if(Math.abs(dx)+Math.abs(dy) > 2) moved = true;
          kam.x = Math.max(0, Math.round(x0+dx));
          kam.y = Math.max(0, Math.round(y0+dy));
          n.style.left = kam.x+'px'; n.style.top = kam.y+'px';
        }, ()=>{ if(moved){ Graph.bump(hostJid); touch(); } });
      }
    });
    n.addEventListener('dblclick', e=>{
      e.preventDefault(); e.stopPropagation();
      WM.open(kam.to, {app: kam.dtype || null});
    });
    if(opts.free){
      n.classList.add('karrange');
      n.style.left = (kam.x||0)+'px';
      n.style.top  = (kam.y||0)+'px';
    }
    return n;
  },
  select(hostJid, kam){
    this.sel = kam ? {jid:hostJid, kid:kam.kid, to:kam.to} : null;
    $$('#ckwins .kam.sel').forEach(n=>n.classList.remove('sel'));
    if(kam){
      const n = $('#ckwins .kam[data-kid="'+kam.kid+'"]');
      if(n) n.classList.add('sel');
    }
  },
  selKam(){
    if(!this.sel) return null;
    const j = Graph.get(this.sel.jid); if(!j) return null;
    return TAD.findKam(j.content, this.sel.kid);
  },
  refreshAll(){
    const open = WM.openJids();
    $$('#ckwins .kam').forEach(n=>{
      const host = Graph.get(n.dataset.host);
      if(!host) return;
      const kam = TAD.findKam(host.content, n.dataset.kid);
      if(!kam) return;
      n.classList.toggle('run', !!open[kam.to]);
      const nm = n.querySelector('.knm');
      if(nm && Graph.get(kam.to)) nm.textContent = Graph.name(kam.to);
    });
  },
  /* 仮身を整頓する — tidy the free-placed 仮身 into a grid */
  arrange(jid){
    const j = Graph.get(jid); if(!j) return;
    const w = WM.find(jid);
    const wide = w && w.view ? Math.max(120, w.view.clientWidth - 90) : 320;
    let x = 6, y = 6;
    for(const k of Graph.kamsIn(jid)){
      if(k.fixed) continue;
      k.x = x; k.y = y;
      x += 84;
      if(x > wide){ x = 6; y += 62; }
    }
    Graph.bump(jid); WM.refreshJid(jid);
  }
};

/* ==================================================================
   11. INLINE RENDERERS — read-only views of each kind of content, used
       by 開いた仮身 so that a spreadsheet really does appear inside a
       document, and a drawing inside a spreadsheet cell.
   ================================================================== */
const Render = {
  inline(j, host, o){
    o = o || {};
    const c = j.content;
    host.innerHTML = '';
    switch(c.k){
      case 'tad':  return this.tad(c, j, host, o);
      case 'hyo':  return this.hyo(c, j, host, o);
      case 'zu':   return this.zu(c, j, host, o);
      case 'card': return this.card(c, j, host, o);
      case 'mailbox': return this.mailbox(c, j, host, o);
      case 'html': return this.html(c, j, host, o);
      case 'script': return this.script(c, j, host, o);
      case 'dev':  return this.dev(c, j, host, o);
      default:
        host.appendChild(mk('div',{class:'bpnote',style:'padding:5px 7px',
          text:'この実身の内容は、この場では表示できない。'}));
    }
  },
  /* --- a 文書 or a 実身 full of 仮身 ------------------------------ */
  tad(c, j, host, o){
    const kams = TAD.kams(c);
    const looksLikeCabinet = (j.type==='cabinet' || j.type==='genshibox' ||
      (kams.length>0 && TAD.plain(c).replace(/〔[^〕]*〕/g,'').trim()===''));
    if(looksLikeCabinet && (c.view||'icon')!=='text'){
      const wrap = el('div','kamlist' + ((c.view==='free')?' free':(c.view==='rows'?' rows':'')));
      wrap.style.minHeight = 'auto';
      for(const k of kams)
        wrap.appendChild(Deck.build(k, j.id,
          {path:o.path, depth:o.depth, free:(c.view==='free'), dates:(c.view==='rows')}));
      host.appendChild(wrap);
      return;
    }
    const page = el('div','edpage' + (c.tate?' tate':'') +
      (c.mode==='genko'?' mode-genko':c.mode==='seisho'?' mode-seisho':''));
    page.style.fontSize = '12px';
    page.style.padding = '5px 7px';
    Editor.paint(page, c, j, {ro:true, path:o.path, depth:o.depth});
    host.appendChild(page);
  },
  /* --- a spreadsheet, shown as a grid ---------------------------- */
  hyo(c, j, host, o){
    const nR = Math.min(c.rowsShown||12, 40), nC = Math.min(c.colsShown||6, 12);
    const wrap = el('div'); wrap.style.cssText='font:11px var(--gothic);overflow:auto;height:100%';
    const t = el('table');
    t.style.cssText = 'border-collapse:collapse;table-layout:fixed;width:'+(26+nC*58)+'px';
    const cg = el('colgroup');
    cg.appendChild(mk('col',{style:'width:26px'}));
    for(let cc=1;cc<=nC;cc++) cg.appendChild(mk('col',{style:'width:58px'}));
    t.appendChild(cg);
    const hr = el('tr'); hr.appendChild(mk('th',{style:CSSCELLH}));
    for(let cc=1;cc<=nC;cc++) hr.appendChild(mk('th',{style:CSSCELLH,text:String(cc)}));
    t.appendChild(hr);
    for(let r=1;r<=nR;r++){
      const tr = el('tr');
      tr.appendChild(mk('th',{style:CSSCELLH,text:String(r)}));
      for(let cc=1;cc<=nC;cc++){
        const cell = c.cells[r+','+cc];
        const td = mk('td',{style:CSSCELL});
        if(cell && cell.kam){
          const kj = Graph.get(cell.kam.to);
          td.appendChild(Deck.build(cell.kam, j.id, {path:o.path, depth:o.depth, dates:false}));
        } else if(cell){
          const v = Sheet.value(c, r, cc);
          td.textContent = Sheet.fmt(v, cell);
          if(typeof v === 'number') td.style.textAlign='right';
          if(cell.b) td.style.fontWeight='700';
        }
        tr.appendChild(td);
      }
      t.appendChild(tr);
    }
    wrap.appendChild(t); host.appendChild(wrap);
  },
  /* --- a structured drawing -------------------------------------- */
  zu(c, j, host, o){
    const w = o.w||260, h = o.h||120;
    const sx = Math.min(1, (w-4)/(c.paper.w||300)), sy = Math.min(1, (h-4)/(c.paper.h||200));
    const s = Math.min(sx, sy);
    const box = el('div');
    box.style.cssText = 'transform-origin:0 0;transform:scale('+s+')';
    box.appendChild(Zukei.paint(c, j, {ro:true, path:o.path, depth:o.depth}));
    host.appendChild(box);
  },
  /* --- a card database, shown as its 一覧 ------------------------ */
  card(c, j, host, o){
    const wrap = el('div'); wrap.style.cssText = 'overflow:auto;height:100%';
    const t = el('table'); t.style.cssText='border-collapse:collapse;font:11px var(--gothic);width:100%';
    const hr = el('tr');
    c.fields.slice(0,5).forEach(f=>hr.appendChild(mk('th',{style:CSSCELLH,text:f.name})));
    t.appendChild(hr);
    c.recs.slice(0,60).forEach(r=>{
      const tr = el('tr');
      c.fields.slice(0,5).forEach(f=>{
        const v = r[f.name];
        const td = mk('td',{style:CSSCELL});
        if(v && v.kid) td.appendChild(Deck.build(v, j.id, {path:o.path, depth:o.depth, dates:false}));
        else td.textContent = v==null?'':String(v);
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    wrap.appendChild(t); host.appendChild(wrap);
  },
  mailbox(c, j, host, o){
    const wrap = el('div'); wrap.style.cssText='overflow:auto;height:100%;font:11px var(--gothic)';
    c.msgs.forEach(m=>{
      wrap.appendChild(mk('div',{style:'border-bottom:1px solid #e0e0e0;padding:2px 5px'+
        (m.unread?';font-weight:700':'')}, [ (m.subj||'(件名なし)') + ' — ' + (m.from||'') ]));
    });
    host.appendChild(wrap);
  },
  html(c, j, host, o){
    const d = el('div');
    d.style.cssText='overflow:auto;height:100%;padding:5px 7px;font:11px/1.6 var(--mincho)';
    Browser.paint(c, d, {ro:true});
    host.appendChild(d);
  },
  script(c, j, host, o){
    host.appendChild(mk('pre',{style:'margin:0;padding:5px 7px;font:10px/1.45 var(--mono);'+
      'white-space:pre-wrap;overflow:auto;height:100%',text:c.src||''}));
  },
  dev(c, j, host, o){
    host.appendChild(mk('div',{class:'bpnote',style:'padding:6px 8px',
      html:'デバイス仮身：'+esc(c.label||'')+'<br>'+esc(c.note||'')}));
  }
};
const CSSCELL  = 'border:1px solid #d8d8d8;padding:0 3px;height:15px;overflow:hidden;'+
                 'white-space:nowrap;max-width:120px';
const CSSCELLH = 'border:1px solid var(--lo);background:var(--face);padding:0 3px;'+
                 'font:10px var(--gothic);font-weight:400;color:var(--lo2);height:14px';

/* ==================================================================
   12. THE MENU TREE — the system's own words, in the system's own
       order. 終了 first, because in BTRON quitting a window is how you
       save it, and 実身操作 is a top-level concern because the
       filesystem is the document.
   ================================================================== */
const MenuTree = {
  forWin(w){
    if(w.komono){
      const extra = (w.api && w.api.menu) ? w.api.menu() : [];
      return [].concat(
        [{l:'終了', k:'^Q', gloss:'m-owari', act:()=>WM.close(w.wid)}],
        extra.length ? ['-'].concat(extra) : [],
        ['-', {l:'小物', sub:()=>this.komono(), gloss:'m-komono'}]
      );
    }
    const j = Graph.get(w.jid);
    const appExtra = (w.api && w.api.menu) ? w.api.menu() : [];
    const isHome = w.jid === SYS.home;
    return [].concat(
      [{l:'終了', sub:this.owari(w, isHome), gloss:'m-owari'}],
      [{l:'編集', sub:()=>this.henshu(w), gloss:'m-henshu'}],
      [{l:'表示', sub:()=>this.hyoji(w), gloss:'m-hyoji'}],
      [{l:'実身操作', sub:()=>this.jitsumi(w), gloss:'m-jitsumi'}],
      appExtra,
      [{l:'小物', sub:()=>this.komono(), gloss:'m-komono'}]
    );
  },
  owari(w, isHome){
    const out = [
      {l:'元の実身を更新', k:'', gloss:'m-update', act:()=>{
        if(w.api && w.api.save) w.api.save();
        w.dirty = false;
        Msg.flash('「'+Graph.name(w.jid)+'」を更新した');
      }},
      {l:'新しい実身に保存', gloss:'m-saveas', act:()=>Shell.saveAsNew(w)},
      '-',
      {l:'終了', k:'^Q', act:()=>WM.close(w.wid)},
      {l:'保存せずに終了', act:()=>WM.close(w.wid, true)}
    ];
    if(isHome){ out.push('-'); out.push({l:'超漢字Vの終了', gloss:'m-shutdown',
      act:()=>Shell.quitSystem()}); }
    return out;
  },
  henshu(w){
    const k = Deck.selKam();
    const hasTray = State.data.tray.length > 0;
    const api = w.api || {};
    return [
      {l:'トレーへ複写', k:'^C', gloss:'m-traycopy', dis:!api.copyToTray,
        act:()=>api.copyToTray && api.copyToTray(false)},
      {l:'トレーへ移動', k:'^X', gloss:'m-traymove', dis:!api.copyToTray,
        act:()=>api.copyToTray && api.copyToTray(true)},
      {l:'トレーから複写', k:'^V', gloss:'m-traypaste', dis:!hasTray || !api.pasteFromTray,
        act:()=>api.pasteFromTray && api.pasteFromTray(false)},
      {l:'トレーから移動', dis:!hasTray || !api.pasteFromTray,
        act:()=>api.pasteFromTray && api.pasteFromTray(true)},
      '-',
      {l:'すべて選択', dis:!api.selectAll, act:()=>api.selectAll && api.selectAll()},
      {l:'取り消し', k:'^Z', dis:!api.undo, act:()=>api.undo && api.undo()},
      '-',
      {l:'仮身を整頓', gloss:'m-arrange', dis:!w.jid,
        act:()=>Deck.arrange(w.jid)},
      {l:'自動配置', dis:!w.jid, act:()=>{
        const j = Graph.get(w.jid); if(!j) return;
        if(j.content.k==='tad'){ j.content.view = 'icon'; }
        Deck.arrange(w.jid); WM.refreshJid(w.jid);
      }}
    ];
  },
  hyoji(w){
    const j = w.jid ? Graph.get(w.jid) : null;
    const c = j ? j.content : null;
    const out = [];
    if(c && c.k === 'tad'){
      const setMode = m => { c.mode = m; Graph.bump(j.id); WM.refreshJid(j.id); };
      out.push({l:'原稿モード', chk:c.mode==='genko', gloss:'m-genko', act:()=>setMode('genko')});
      out.push({l:'詳細モード', chk:c.mode==='shosai', gloss:'m-shosai', act:()=>setMode('shosai')});
      out.push({l:'清書モード', chk:c.mode==='seisho', gloss:'m-seisho', act:()=>setMode('seisho')});
      out.push('-');
      const setView = v => { c.view = v; Graph.bump(j.id); WM.refreshJid(j.id); };
      out.push({l:'仮身一覧：アイコン', chk:(c.view||'icon')==='icon', gloss:'m-kamlist',
        act:()=>setView('icon')});
      out.push({l:'仮身一覧：名前と日付', chk:c.view==='rows', act:()=>setView('rows')});
      out.push({l:'仮身一覧：自由配置', chk:c.view==='free', act:()=>setView('free')});
      out.push({l:'文章として表示', chk:c.view==='text', act:()=>setView('text')});
      out.push('-');
      out.push({l:'縦書き', chk:!!c.tate, gloss:'m-tate', act:()=>{
        c.tate = !c.tate; Graph.bump(j.id); WM.refreshJid(j.id); }});
      out.push({l:'縦書きビューアで読む', gloss:'m-tateview', act:()=>Shell.tateViewer(j.id)});
      out.push('-');
    }
    out.push({l:'TAD構造表示', gloss:'m-tad', dis:!j,
      act:()=>WM.openKomono('TAD構造表示', {arg:j.id})});

const ROMA = {

 'かぞく':['家族'],'れきし':['歴史'],'てんじかい':['展示会'],
 'ぱーそなるめでぃあ':['パーソナルメディア']
};
const IME = {
  on: true, buf: '', kana: '', cands: [], at: 0, mode: 'off',
  target: null,      /* the editor that owns the pre-edit string */
  reset(){ this.buf=''; this.kana=''; this.cands=[]; this.at=0; this.mode='off';
           this.paint(); },
  /* feed one printable character. Returns true if the IME consumed it. */
  feed(ch, ed){
    if(!this.on) return false;
    this.target = ed;
    if(State.data.inputMode === 'kana'){
      /* かな入力: the key's kana is produced directly */
      const k = KANAKEY[ch];
      if(!k) return false;
      this.kana += k; this.mode='pre'; this.paint(); return true;
    }
    if(!/^[a-z\-.,!?[\]/:;~]$/i.test(ch)) return false;
    this.buf += ch.toLowerCase();
    /* longest-match the romaji table */
    let guard = 0;
    while(this.buf.length && guard++ < 8){
      let hit = null;
      for(let n=Math.min(3,this.buf.length); n>=1; n--){
        const t = this.buf.slice(0,n);
        if(ROMA[t]){ hit = {t, k:ROMA[t]}; break; }
      }
      /* small tsu: a doubled consonant */
      if(!hit && this.buf.length>=2 && this.buf[0]===this.buf[1] &&
         'bcdfghjkmprstvwz'.indexOf(this.buf[0])>=0){
        this.kana += 'っ'; this.buf = this.buf.slice(1); continue;
      }
      if(!hit) break;
      this.kana += hit.k;
      this.buf = this.buf.slice(hit.t.length);
    }
    /* an "n" that cannot start anything else becomes ん */
    if(this.buf === 'n' ) { /* wait for the next key */ }
    this.mode = (this.kana || this.buf) ? 'pre' : 'off';
    this.paint();
    return true;
  },
  flushN(){
    if(this.buf === 'n'){ this.kana += 'ん'; this.buf=''; }
  },
  /* the space bar: start or walk the candidate list */
  convert(){
    this.flushN();
    if(!this.kana) return false;
    if(this.mode !== 'conv'){
      const key = this.kana;
      const list = (DICT[key] || []).slice();
      /* katakana and the reading itself are always offered */
      list.push(hiraToKata(key));
      list.push(key);
      this.cands = list.filter((v,i,a)=>a.indexOf(v)===i);
      this.at = 0; this.mode = 'conv';
    } else {
      this.at = (this.at + 1) % Math.max(1,this.cands.length);
    }
    this.paint();
    return true;
  },
  prev(){
    if(this.mode!=='conv') return false;
    this.at = (this.at - 1 + this.cands.length) % this.cands.length;
    this.paint(); return true;
  },
  /* the text that would be committed right now */
  text(){
    if(this.mode === 'conv') return this.cands[this.at] || this.kana;
    return this.kana + this.buf;
  },
  commit(){
    this.flushN();
    const t = this.text();
    this.reset();
    return t;
  },
  cancel(){ const had = this.mode!=='off'; this.reset(); return had; },
  back(){
    if(this.mode === 'conv'){ this.mode='pre'; this.cands=[]; this.paint(); return true; }
    if(this.buf){ this.buf = this.buf.slice(0,-1); this.paint(); return true; }
    if(this.kana){ this.kana = Array.from(this.kana).slice(0,-1).join(''); this.paint(); return true; }
    return false;
  },
  paint(){
    let n = $('#imepanel');
    if(this.mode === 'off'){ if(n) n.style.display='none'; return; }
    if(!n){
      n = el('div'); n.id='imepanel';
      n.style.cssText='position:absolute;z-index:9600;background:var(--face);'+
        'border:1px solid var(--edge);box-shadow:2px 2px 0 rgba(0,0,0,.35);'+
        'font:12px var(--gothic);min-width:110px;max-width:280px';
      $('#cklayer').appendChild(n);
    }
    n.innerHTML = '';
    n.style.display = 'block';
    const pre = el('div');
    pre.style.cssText='padding:1px 5px;background:var(--paper);border-bottom:1px solid var(--lo);'+
      'text-decoration:underline';
    pre.textContent = this.text() + (this.buf?'('+this.buf+')':'');
    n.appendChild(pre);
    if(this.mode === 'conv' && this.cands.length > 1){
      this.cands.forEach((c,i)=>{
        const r = el('div');
        r.style.cssText='padding:1px 5px 1px 4px;display:flex;gap:7px'+
          (i===this.at?';background:var(--menuhi);color:var(--menuhifg)':'');
        r.appendChild(mk('span',{style:'font:10px var(--mono);opacity:.7',text:String(i+1)}));
        r.appendChild(mk('span',{text:c}));
        r.addEventListener('mousedown', e=>{ e.preventDefault();
          this.at=i;
          if(this.target && this.target.commitIME) this.target.commitIME();
        });
        n.appendChild(r);
      });
      const hint = el('div');
      hint.style.cssText='padding:1px 5px;font:9px var(--gothic);color:var(--lo2);'+
        'border-top:1px solid var(--lo)';
      hint.textContent = State.data.convStyle==='btron'
        ? '空白=次候補  改行=確定  [BTRON標準]'
        : '↓=次候補  改行=確定  [Windows標準]';
      n.appendChild(hint);
    }
    /* place it under the caret */
    const c = $('#ckwins .edcaret');
    const sb = $('#ck').getBoundingClientRect();
    if(c){
      const r = c.getBoundingClientRect();
      n.style.left = clamp((r.left-sb.left)/Scale.f, 2, 800-n.offsetWidth-2)+'px';
      n.style.top  = clamp((r.bottom-sb.top)/Scale.f+1, 2, 600-n.offsetHeight-2)+'px';
    } else {
      n.style.left = '20px'; n.style.top = '540px';
    }
  }
};
/* かな入力 : the JIS kana layout, enough of it to be usable */
const KANAKEY = {
 '1':'ぬ','2':'ふ','3':'あ','4':'う','5':'え','6':'お','7':'や','8':'ゆ','9':'よ','0':'わ',
 q:'た',w:'て',e:'い',r:'す',t:'か',y:'ん',u:'な',i:'に',o:'ら',p:'せ',
 a:'ち',s:'と',d:'し',f:'は',g:'き',h:'く',j:'ま',k:'の',l:'り',
 z:'つ',x:'さ',c:'そ',v:'ひ',b:'こ',n:'み',m:'も',
 '-':'ほ','^':'へ','@':'゛','[':'゜',';':'れ',':':'け',']':'む',
 ',':'ね','.':'る','/':'め'

/* ==================================================================
   14. トレー — BTRON's name for the clipboard, and worth keeping.
       It is a stack of typed data, not a single slot, it survives
       between applications, and it can hold 仮身 as well as text.
   ================================================================== */
const Tray = {
  items(){ return State.data.tray; },
  push(item){
    State.data.tray.unshift(item);
    if(State.data.tray.length > 12) State.data.tray.length = 12;
    touch();
    WM.refreshAll();
    Msg.flash('トレーへ：'+(item.label||item.kind));
  },
  pushText(s, cut){
    if(!s) return;
    this.push({kind:'text', text:s, label:'文字列 '+Array.from(s).length+'字',
      at:Date.now()});
    Host.toClipboard(s);
  },
  pushKam(kam, move, hostJid){
    this.push({kind:'kam', to:kam.to, tsu:kam.tsu, mode:kam.mode,
      label:'仮身〔'+Graph.name(kam.to)+'〕', at:Date.now()});
    if(move && hostJid){ Graph.removeKam(hostJid, kam.kid); WM.refreshJid(hostJid); }
  },
  top(){ return State.data.tray[0] || null; },
  take(i, move){
    const it = State.data.tray[i==null?0:i];
    if(!it) return null;
    if(move){ State.data.tray.splice(i==null?0:i,1); touch(); WM.refreshAll(); }
    return it;
  },
  remove(i){ State.data.tray.splice(i,1); touch(); WM.refreshAll(); },
  swap(i,j){
    const t = State.data.tray;
    if(i<0||j<0||i>=t.length||j>=t.length) return;
    const a = t[i]; t[i]=t[j]; t[j]=a; touch(); WM.refreshAll();
  }
};

/* ==================================================================
   15. SHELL — the operations the 実身操作 menu performs. These are the
       ones whose difference the interface must make legible: deleting
       a reference is not deleting an object.
   ================================================================== */
const Shell = {
  duplicate(jid, w){
    const j = Graph.get(jid); if(!j) return;
    Panel.prompt('実身複製', '新しい実身名', j.name+'のコピー', nm=>{
      const c = Graph.duplicate(jid, nm || (j.name+'のコピー'));
      const host = (w && w.jid) ? w.jid : SYS.home;
      Graph.place(host, Graph.newKam(c.id, {mode: hostView(host)==='icon'?'icon':'closed',
        x: 6, y: 6}));
      Deck.arrange(host);
      WM.refreshJid(host);
      Msg.flash('実身「'+c.name+'」を作った。中の仮身は同じ実身を指している。');
      State.data.stats.made++;
    }, '実身複製は実物をもう一つ作る。中に入っていた仮身は複写されるが、'+
       'その仮身が指す実身は複製されない——同じ実身を二つの文書が指すことになる。');
  },
  makeKamonOf(jid, w){
    const host = (w && w.jid) ? w.jid : SYS.home;
    if(host === jid){
      /* a 仮身 to the containing document, inside itself: legal, and
         the fastest way to see that this is a graph */
      Graph.place(host, Graph.newKam(jid, {mode:'closed', tsu:'自分自身'}));
      WM.refreshJid(host);
