}

/* ==================================================================
   16. 基本文章編集 — the text editor
   ------------------------------------------------------------------
   Text, 指定付せん, embedded figures and 仮身 in one TAD stream; three
   display modes; horizontal and vertical writing; and — because a
   "folder" here is only a 実身 whose content happens to be a
   collection of 仮身 — the same editor is also the object browser.
   ================================================================== */
const Editor = {
  /* ---- flat caret arithmetic over the segment stream ------------- */
  segUnits(s){ return s.t==='t' ? Array.from(s.s).length : 1; },
  total(c){ let n=0; for(const s of c.segs) n += this.segUnits(s); return n; },
  flatToPos(c, n){
    let acc = 0;
    for(let i=0;i<c.segs.length;i++){
      const len = this.segUnits(c.segs[i]);
      if(n <= acc + len - (c.segs[i].t==='t'?0:1)){
        if(c.segs[i].t==='t') return {i, o:n-acc};
        if(n === acc) return {i, o:0};
      }
      if(c.segs[i].t==='t' && n <= acc+len) return {i, o:n-acc};
      acc += len;
    }
    const last = c.segs.length-1;
    return {i:last, o:this.segUnits(c.segs[last])};
  },
  /* insert a string at flat position n; returns the new caret */
  insert(c, n, str, f){
    const p = this.flatToPos(c, n);
    const s = c.segs[p.i];
    if(s && s.t==='t'){
      const a = Array.from(s.s);
      s.s = a.slice(0,p.o).join('') + str + a.slice(p.o).join('');
      if(f) s.f = Object.assign({}, s.f, f);
      return n + Array.from(str).length;
    }
    const seg = TAD.txt(str, f || (s && s.f) || null);
    c.segs.splice(p.o ? p.i+1 : p.i, 0, seg);
    return n + Array.from(str).length;
  },
  insertSeg(c, n, seg){
    const p = this.flatToPos(c, n);
    const s = c.segs[p.i];
    if(s && s.t==='t' && p.o>0 && p.o<Array.from(s.s).length){
      const a = Array.from(s.s);
      const tail = TAD.txt(a.slice(p.o).join(''), s.f);
      s.s = a.slice(0,p.o).join('');
      c.segs.splice(p.i+1, 0, seg, tail);
    } else if(s && s.t==='t' && p.o===0){
      c.segs.splice(p.i, 0, seg);
    } else {
      c.segs.splice(p.o ? p.i+1 : p.i, 0, seg);
    }
    return n + 1;
  },
  /* delete the unit before flat position n */
  deleteBack(c, n, hostJid){
    if(n <= 0) return 0;
    const p = this.flatToPos(c, n);
    const s = c.segs[p.i];
    if(s && s.t==='t' && p.o > 0){
      const a = Array.from(s.s);
      s.s = a.slice(0,p.o-1).join('') + a.slice(p.o).join('');
      return n-1;
    }
    /* the unit before us is the previous segment (or the end of it) */
    let i = p.i, o = p.o;
    if(s && s.t==='t' && p.o===0) i = p.i-1;
    else if(s && s.t!=='t' && p.o===1) i = p.i;
    else i = p.i-1;
    if(i < 0) return 0;
    const t = c.segs[i];
    if(!t) return n;
    if(t.t==='t'){
      const a = Array.from(t.s);
      if(!a.length){ c.segs.splice(i,1); return n; }
      t.s = a.slice(0,-1).join('');
      return n-1;
    }
    if(t.t==='k' && hostJid) Graph.removeKam(hostJid, t.k.kid);
    else c.segs.splice(i,1);
    if(!c.segs.length) c.segs.push(TAD.txt(''));
    return n-1;
  },
  deleteRange(c, from, to, hostJid){
    if(to <= from) return from;
    for(let n = to; n > from; n--) this.deleteBack(c, n, hostJid);
    return from;
  },
  slice(c, from, to){
    /* the segments between two flat positions, as a fresh stream */
    const out = [];
    let acc = 0;
    for(const s of c.segs){
      const len = this.segUnits(s);
      const a = Math.max(from, acc), b = Math.min(to, acc+len);
      if(b > a){
        if(s.t==='t'){
          const arr = Array.from(s.s);
          out.push(TAD.txt(arr.slice(a-acc, b-acc).join(''), s.f));
        } else {
          out.push(JSON.parse(JSON.stringify(s)));
        }
      }
      acc += len;
    }
    return out.length ? out : [TAD.txt('')];
  },
  applyF(c, from, to, patch){
    if(to <= from) return;
    let acc = 0;
    const next = [];
    for(const s of c.segs){
      const len = this.segUnits(s);
      if(s.t!=='t' || to<=acc || from>=acc+len){ next.push(s); acc += len; continue; }
      const arr = Array.from(s.s);
      const a = Math.max(0, from-acc), b = Math.min(len, to-acc);
      if(a > 0) next.push(TAD.txt(arr.slice(0,a).join(''), s.f));
      next.push(TAD.txt(arr.slice(a,b).join(''), Object.assign({}, s.f, patch)));
      if(b < len) next.push(TAD.txt(arr.slice(b).join(''), s.f));
      acc += len;
    }
    c.segs = next.filter((s,i)=> !(s.t==='t' && s.s==='' && next.length>1));
    if(!c.segs.length) c.segs.push(TAD.txt(''));
  },

  /* ---- painting -------------------------------------------------- */
  paint(page, c, j, o){
    o = o || {};
    page.innerHTML = '';
    const ed = o.ed;
    const car = ed ? ed.car : -1;
    const selA = ed && ed.sel ? Math.min(ed.sel.a, ed.sel.b) : -1;
    const selB = ed && ed.sel ? Math.max(ed.sel.a, ed.sel.b) : -1;
    let n = 0;
    const mkCaret = ()=>{ const k = el('span','edcaret'); return k; };
    for(let i=0;i<c.segs.length;i++){
      const s = c.segs[i];
      if(s.t==='t'){
        const arr = Array.from(s.s);
        for(let q=0;q<=arr.length;q++){
          if(!o.ro && car === n+q && !(q===arr.length && i<c.segs.length-1 &&
              c.segs[i+1] && c.segs[i+1].t==='t')) page.appendChild(mkCaret());
          if(q===arr.length) break;
          const ch = arr[q];
          const flat = n+q;
          const sp = el('span', (flat>=selA && flat<selB) ? 'selrun' : null, ch);
          this.style(sp, s.f);
          if(!o.ro){
            sp.dataset.n = flat;
            sp.addEventListener('mousedown', e=>{
              if(e.button!==0) return;
              e.stopPropagation();
              const r = sp.getBoundingClientRect();
              const vert = page.classList.contains('tate');
              const half = vert ? (e.clientY > r.top + r.height/2)
                                : (e.clientX > r.left + r.width/2);
              const at = flat + (half?1:0);
              if(e.shiftKey && ed){ ed.sel = {a: ed.sel?ed.sel.a:ed.car, b:at}; ed.car = at; }
              else if(ed){ ed.car = at; ed.sel = null; ed.dragFrom = at; }
              if(ed) ed.render();
              if(ed) ed.beginDrag(e);
            });
          }
          page.appendChild(sp);
        }
        n += arr.length;
        continue;
      }
      if(!o.ro && car === n) page.appendChild(mkCaret());
      if(s.t==='k'){
        if(!s.k){ n += 1; continue; }
        const kn = Deck.build(s.k, j.id, {path:o.path, depth:o.depth,
          dates:(c.view==='rows')});
        kn.style.margin = '0 1px';
        page.appendChild(kn);
      } else if(s.t==='nl'){
        page.appendChild(el('br'));
      } else if(s.t==='pp'){
        page.appendChild(el('br'));
        const gap = el('span'); gap.style.cssText='display:block;height:.5em';
        page.appendChild(gap);
      } else if(s.t==='pg'){
        const r = el('div');
        r.style.cssText='border-top:1px dashed var(--lo);margin:6px 0;'+
          'font:9px var(--gothic);color:var(--lo2);text-align:right';
        r.textContent = '改頁';
        page.appendChild(r);
      } else if(s.t==='ruby'){
        const rb = el('span','ruby');
        rb.appendChild(el('span','rt', s.rt));
        const base = el('span',null,s.s);
        this.style(base, s.f);
        rb.appendChild(base);
        page.appendChild(rb);
      } else if(s.t==='tcy'){
        const t = el('span','tatechu', s.s);
        page.appendChild(t);
      } else if(s.t==='zu'){
        const box = el('span','zu');
        const cv = Zukei.paint({k:'zu', parts:s.fig.parts, paper:s.fig.paper||{w:120,h:80}},
          j, {ro:true, scale:s.fig.scale||1});
        box.appendChild(cv);
        page.appendChild(box);
      } else if(s.t==='fs'){
        const f = el('span','fusen', s.label || s.kind);
        f.setAttribute('data-gloss','fusen');
        page.appendChild(f);
      }
      n += 1;
    }
    if(!o.ro && car === n) page.appendChild(mkCaret());
    return page;
  },
  style(sp, f){
    if(!f) return;
    if(f.fnt==='gothic') sp.style.fontFamily = 'var(--gothic)';
    else if(f.fnt==='mono') sp.style.fontFamily = 'var(--mono)';
    if(f.siz && f.siz!==14) sp.style.fontSize = f.siz+'px';
    if(f.b) sp.style.fontWeight = '700';
    if(f.i) sp.style.fontStyle = 'italic';
    if(f.u) sp.style.textDecoration = 'underline';
    if(f.s) sp.style.textShadow = '1px 1px 0 rgba(0,0,0,.35)';
    if(f.col && f.col!=='#000000') sp.style.color = f.col;
    if(f.bg) sp.style.background = f.bg;
  },

  /* ---- the application ------------------------------------------ */
  open(w){
    const j = Graph.get(w.jid);
    if(!j.content || j.content.k !== 'tad'){
      /* the データタイプ and the content disagree — say so instead of
         painting a stream that is not there */
      const box = el('div');
      box.className = 'bwscroll';
      box.style.cssText = 'position:absolute;inset:0;overflow:auto;background:var(--paper)';
      box.appendChild(mk('div',{class:'bpnote',style:'padding:9px 11px',
        html:'この実身の中身は文章（TADストリーム）ではないので、'+
          '基本文章編集では開けない。<br>種類：'+esc(j.content?j.content.k:'不明')+
          '<br><br>［表示］→［TAD構造表示］で中身の形は見られる。'}));
      w.view.appendChild(box);
      return {render(){ WM.sync(w); }, resize(){ WM.sync(w); },
              save(){ w.dirty = false; }};
    }
    const c = j.content;
    const wrap = el('div','edwrap');
    const stat = el('div','edstat');
    w.view.appendChild(wrap);
    w.view.parentNode.insertBefore(stat, w.view.nextSibling);
    const api = {
      car: 0, sel: null, undoStack: [], dragFrom: null, page: null,
      shows(jid){
        if(jid === w.jid) return true;
        for(const k of Graph.kamsIn(w.jid)) if(k.to===jid) return true;
        return false;
      },
      snap(){
        api.undoStack.push(JSON.stringify(c.segs));
        if(api.undoStack.length>40) api.undoStack.shift();
      },
      undo(){
        const s = api.undoStack.pop(); if(!s) return;
        c.segs = JSON.parse(s);
        api.car = Math.min(api.car, Editor.total(c));
        api.sel = null; api.render();
      },
      render(){
        const view = c.view || (j.type==='cabinet'||j.type==='genshibox' ? 'icon' : 'text');
        wrap.innerHTML = '';
        const kams = Graph.kamsIn(w.jid);
        if(view !== 'text'){
          /* 仮身一覧表示 — the object-browser face of the same editor */
          if(view === 'rows'){
            const hdr = el('klhdr'); hdr.className = 'klhdr';
            hdr.append(el('span',null,'実身名'), el('span',null,'種類'), el('span',null,'更新日時'));
            wrap.appendChild(hdr);
          }
          const list = el('div','kamlist' + (view==='free'?' free':view==='rows'?' rows':''));
          if(!kams.length){
            list.appendChild(mk('div',{class:'bpnote',style:'padding:9px 12px',
              text:'この実身は空。仮身を一つも含んでいない。'}));
          }
          for(const k of kams){
            if(view==='free' && (k.x==null || k.y==null)){ k.x = 6; k.y = 6; }
            list.appendChild(Deck.build(k, w.jid,
              {free:(view==='free'), dates:(view==='rows'), depth:0, path:[w.jid]}));
          }
          if(view==='free'){
            let mx = 0, my = 0;
            for(const k of kams){ mx = Math.max(mx, (k.x||0)+90); my = Math.max(my, (k.y||0)+70); }
            list.style.width = mx+'px'; list.style.height = my+'px';
          }
          wrap.appendChild(list);
          api.page = null;
        } else {
          const page = el('div','edpage' + (c.tate?' tate':'') +
            (c.mode==='genko'?' mode-genko':c.mode==='seisho'?' mode-seisho':''));
          page.className += ' caretzone';
          Editor.paint(page, c, j, {ed:(c.mode==='seisho'?null:api), depth:0, path:[w.jid],
            ro:(c.mode==='seisho')});
          wrap.appendChild(page);
          api.page = page;
          if(c.tate) page.style.height = (w.view.clientHeight-4)+'px';
        }
        /* the status strip: BTRON reports characters, lines and mode */
        stat.innerHTML = '';
        const modeName = {genko:'原稿', shosai:'詳細', seisho:'清書'}[c.mode] || c.mode;
        stat.append(
          mk('span',{html:'<b>'+TAD.count(c)+'</b>字'}),
          mk('span',{html:'仮身 <b>'+kams.length+'</b>'}),
          mk('span',{text: c.view && c.view!=='text' ? '仮身一覧' : modeName+'モード'}),
          mk('span',{text: c.tate?'縦書き':'横書き'}),
          mk('span',{class:'grow'}),
          mk('span',{text: State.data.inputMode==='kana'?'かな入力':'ローマ字入力',
            'data-gloss':'inputmode'})
        );
        WM.sync(w);
        Deck.refreshAll();
      },
      resize(){ if(c.tate && api.page) api.page.style.height = (w.view.clientHeight-4)+'px'; },
      beginDrag(e){
        const from = api.dragFrom;
        if(from==null) return;
        let moved = false;
        const mv = ev=>{
          const t = document.elementFromPoint(ev.clientX, ev.clientY);
          if(t && t.dataset && t.dataset.n!=null){
            const at = +t.dataset.n;
            if(at !== from){ moved = true; api.sel = {a:from, b:at}; api.car = at; api.render(); }
          }
        };
        const up = ()=>{
          document.removeEventListener('mousemove', mv);
          document.removeEventListener('mouseup', up);
          api.dragFrom = null;
        };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
      },
      selRange(){
        if(!api.sel) return null;
        const a = Math.min(api.sel.a, api.sel.b), b = Math.max(api.sel.a, api.sel.b);
        return a===b ? null : {a,b};
      },
      selectAll(){ api.sel = {a:0, b:Editor.total(c)}; api.car = Editor.total(c); api.render(); },
      commitIME(){
        const t = IME.commit();
        if(t){ api.snap(); api.car = Editor.insert(c, api.car, t); WM.dirty(w); api.render(); }
      },
      onKey(e){
        const view = c.view || (j.type==='cabinet'||j.type==='genshibox' ? 'icon' : 'text');
        if(view !== 'text' || c.mode==='seisho'){
          /* in 仮身一覧 the keys walk the references */
          if(e.key==='Enter' && Deck.sel){ WM.open(Deck.sel.to); return true; }
          return false;
        }
        const key = e.key;
        const total = ()=>Editor.total(c);
        /* --- IME first --- */
        if(IME.mode !== 'off'){
          const btron = State.data.convStyle === 'btron';
          if(key===' '){ e.preventDefault(); IME.convert(); return true; }
          if(key==='Enter'){ e.preventDefault(); api.commitIME(); return true; }
          if(key==='Escape'){ e.preventDefault(); IME.cancel(); api.render(); return true; }
          if(key==='Backspace'){ e.preventDefault(); IME.back(); return true; }
          if(!btron && (key==='ArrowDown')){ e.preventDefault(); IME.convert(); return true; }
          if(!btron && (key==='ArrowUp')){ e.preventDefault(); IME.prev(); return true; }
          if(key.length===1){ e.preventDefault(); IME.feed(key, api); return true; }
        }
        if(e.ctrlKey || e.metaKey){
          const k = key.toLowerCase();
          if(k==='c'){ e.preventDefault(); api.copyToTray(false); return true; }
          if(k==='x'){ e.preventDefault(); api.copyToTray(true);  return true; }
          if(k==='v'){ e.preventDefault(); api.pasteFromTray(false); return true; }
          if(k==='z'){ e.preventDefault(); api.undo(); return true; }
          if(k==='a'){ e.preventDefault(); api.selectAll(); return true; }
          if(k==='q'){ e.preventDefault(); WM.close(w.wid); return true; }
          if(key==='Enter'){ e.preventDefault(); api.snap();
            api.car = Editor.insertSeg(c, api.car, TAD.pp()); WM.dirty(w); api.render(); return true; }
          return false;
        }
        if(key==='ArrowLeft'){ e.preventDefault();
          api.car = Math.max(0, api.car-1); if(!e.shiftKey) api.sel=null; api.render(); return true; }
        if(key==='ArrowRight'){ e.preventDefault();
          api.car = Math.min(total(), api.car+1); if(!e.shiftKey) api.sel=null; api.render(); return true; }
        if(key==='ArrowUp' || key==='ArrowDown'){
          e.preventDefault();
          const d = key==='ArrowUp' ? -1 : 1;
          api.car = clamp(api.car + d*18, 0, total());
          if(!e.shiftKey) api.sel=null; api.render(); return true;
        }
        if(key==='Home'){ e.preventDefault(); api.car=0; api.sel=null; api.render(); return true; }
        if(key==='End'){ e.preventDefault(); api.car=total(); api.sel=null; api.render(); return true; }
        if(key==='Backspace'){
          e.preventDefault(); api.snap();
          const r = api.selRange();
          if(r){ api.car = Editor.deleteRange(c, r.a, r.b, w.jid); api.sel=null; }
          else api.car = Editor.deleteBack(c, api.car, w.jid);
          WM.dirty(w); api.render(); return true;
        }
        if(key==='Delete'){
          e.preventDefault(); api.snap();
          const r = api.selRange();
          if(r){ api.car = Editor.deleteRange(c, r.a, r.b, w.jid); api.sel=null; }
          else if(api.car < total()) api.car = Editor.deleteBack(c, api.car+1, w.jid);
          WM.dirty(w); api.render(); return true;
        }
        if(key==='Enter'){
          e.preventDefault(); api.snap();
          api.car = Editor.insertSeg(c, api.car, TAD.nl());
          WM.dirty(w); api.render(); return true;
        }
        if(key==='Tab'){
          e.preventDefault(); api.snap();
          api.car = Editor.insertSeg(c, api.car,
            {t:'fs', kind:'tab', label:'タブ'});
          WM.dirty(w); api.render(); return true;
        }
        if(key.length===1 && !e.altKey){
          e.preventDefault();
          const r = api.selRange();
          if(r){ api.snap(); api.car = Editor.deleteRange(c, r.a, r.b, w.jid); api.sel=null; }
          if(IME.on && State.data.inputMode!=='off' && IME.feed(key, api)) return true;
          api.snap();
          api.car = Editor.insert(c, api.car, key);
          WM.dirty(w); api.render();
          return true;
        }
        return false;
      },
      /* --- トレー --- */
      copyToTray(move){
        const r = api.selRange();
        if(r){
          const segs = Editor.slice(c, r.a, r.b);
          const txt = TAD.plain({k:'tad', segs:segs});
          Tray.push({kind:'tad', segs:segs, text:txt,
            label:'文章 '+Array.from(txt).length+'字', at:Date.now()});
          Host.toClipboard(txt);
          if(move){ api.snap(); api.car = Editor.deleteRange(c, r.a, r.b, w.jid);
            api.sel=null; WM.dirty(w); api.render(); }
          return;
        }
        const k = Deck.selKam();
        if(k && Deck.sel.jid === w.jid){ Tray.pushKam(k, move, w.jid); api.render(); return; }
        Msg.flash('トレーへ入れるものを選んでいない');
      },
      pasteFromTray(move){
        const it = Tray.take(0, move);
        if(!it) return;
        api.snap();
        if(it.kind==='text'){ api.car = Editor.insert(c, api.car, it.text); }
        else if(it.kind==='tad'){
          for(const s of JSON.parse(JSON.stringify(it.segs))){
            if(s.t==='t') api.car = Editor.insert(c, api.car, s.s, s.f);
            else api.car = Editor.insertSeg(c, api.car, s);
          }
        }
        else if(it.kind==='kam'){
          const kam = Graph.newKam(it.to, {mode:it.mode||'closed', tsu:it.tsu});
          api.car = Editor.insertSeg(c, api.car, TAD.kamseg(kam));
          State.data.stats.kamMade++;
        }
        WM.dirty(w); api.render();
      },
      save(){
        Graph.bump(w.jid);
        w.dirty = false;
        touch();
      },
      focus(){ IME.target = api; },
      destroy(){ if(stat.parentNode) stat.parentNode.removeChild(stat); },
      /* --- the app's own menus --- */
      menu(){
        const r = api.selRange();
        const patch = p =>{
          if(!r){ Msg.flash('文字を選んでから'); return; }
          api.snap(); Editor.applyF(c, r.a, r.b, p); WM.dirty(w); api.render();
        };
        return [
          {l:'文字', gloss:'m-moji', sub:()=>[
            {l:'書体', gloss:'m-shotai', sub:[
              {l:'細明朝体', act:()=>patch({fnt:'mincho', b:false})},
              {l:'太明朝体', act:()=>patch({fnt:'mincho', b:true})},
              {l:'中ゴシック体', act:()=>patch({fnt:'gothic', b:false})},
              {l:'太ゴシック体', act:()=>patch({fnt:'gothic', b:true})},
              {l:'等幅', act:()=>patch({fnt:'mono'})}
            ]},
            {l:'大きさ', sub:[10,12,14,16,20,24,32].map(s=>({l:s+'ポイント',
              act:()=>patch({siz:s})}))},
            {l:'飾り', sub:[
              {l:'太字', act:()=>patch({b:true})},
              {l:'斜体', act:()=>patch({i:true})},
              {l:'下線', act:()=>patch({u:true})},
              {l:'影付き', act:()=>patch({s:true})},
              '-',
              {l:'飾りを取る', act:()=>patch({b:false,i:false,u:false,s:false})}
            ]},
            {l:'色', sub:[['黒','#000000'],['赤','#a01010'],['青','#0d3b8f'],
              ['緑','#1b5e20'],['茶','#7a4a00'],['灰','#606060']].map(([l,v])=>
              ({l:l, act:()=>patch({col:v})}))},
            '-',
            {l:'ルビをふる', gloss:'m-ruby', act:()=>{
              if(!r){ Msg.flash('ルビをふる文字を選んでから'); return; }
              const base = TAD.plain({k:'tad', segs:Editor.slice(c, r.a, r.b)});
              Panel.prompt('ルビ', '「'+base+'」のルビ', '', rt=>{
                if(!rt) return;
                api.snap();
                api.car = Editor.deleteRange(c, r.a, r.b, w.jid);
                api.car = Editor.insertSeg(c, api.car, {t:'ruby', s:base, rt:rt, f:TAD.DEFF()});
                api.sel=null; WM.dirty(w); api.render();
              });
            }},
            {l:'縦中横', gloss:'m-tatechu', dis:!c.tate, act:()=>{
              if(!r) return;
              const base = TAD.plain({k:'tad', segs:Editor.slice(c, r.a, r.b)});
              api.snap();
              api.car = Editor.deleteRange(c, r.a, r.b, w.jid);
              api.car = Editor.insertSeg(c, api.car, {t:'tcy', s:base});
              api.sel=null; WM.dirty(w); api.render();
            }},
            '-',
            {l:'文字検索…', gloss:'m-mojikensaku', act:()=>{
              WM.openKomono('文字検索', {arg:{insert:(ch)=>{
                api.snap(); api.car = Editor.insert(c, api.car, ch);
                WM.dirty(w); api.render();
              }}});
            }},
            {l:'世界文字入力…', act:()=>WM.openKomono('世界文字入力',{arg:{insert:(ch)=>{
              api.snap(); api.car = Editor.insert(c, api.car, ch);
              WM.dirty(w); api.render();
            }}})}
          ]},
          {l:'検索', sub:()=>[
            {l:'語句を探す', act:()=>Editor.findPanel(c, api, w)},
            {l:'別の語句に置き換える', act:()=>Editor.replacePanel(c, api, w)},
            '-',
            {l:'文章の一部分を別の実身にする', gloss:'m-extract', dis:!r,
              act:()=>Editor.extract(c, api, w, r)},
            {l:'仮身の中身を展開して取り込む', gloss:'m-expand',
              dis:!(Deck.sel && Deck.sel.jid===w.jid),
              act:()=>Editor.expandKam(c, api, w)},
            '-',
            {l:'図形を埋め込む', act:()=>Editor.embedFig(c, api, w)}
          ]}
        ];
      }
    };
    /* clicking empty page area puts the caret at the end */
    wrap.addEventListener('mousedown', e=>{
      if(e.button!==0) return;
      if(e.target === wrap || e.target === api.page){
        api.car = Editor.total(c); api.sel = null; api.render();
      }
      if(e.target === wrap || (e.target.classList && e.target.classList.contains('kamlist')))
        Deck.select(null, null);
    });
    wrap.addEventListener('scroll', ()=>WM.sync(w));
    return api;
  },

  /* ---- 検索 / 置換 ---------------------------------------------- */
  findPanel(c, api, w){
    const inp = mk('input',{class:'bfield', style:'width:170px'});
    const yur = mk('label',{class:'bchk on'},[el('i'), '異形字ゆらぎ同一視']);
    let on = true;
    yur.addEventListener('click', ()=>{ on=!on; yur.classList.toggle('on',on); });
    Panel.open({title:'語句を探す', focus:'input', body:[
      mk('div',{class:'bprow'},[mk('span',{class:'bplabel',text:'探す語句'}), inp]),
      mk('div',{class:'bprow'},[yur]),
      mk('div',{class:'bpnote',style:'max-width:270px',
        text:'ゆらぎ同一視を入れると、渡辺で渡邊も渡邉も見つかる。名簿を扱う仕事では、これが無いと話にならない。'})
    ], switches:[{l:'探す', def:true, keep:true, act:()=>{
      const q = inp.value.trim(); if(!q) return true;
      const plain = TAD.plain(c);
      const hay = on ? CharDB.fold(plain) : plain;
      const needle = on ? CharDB.fold(q) : q;
      const at = hay.indexOf(needle);
      if(at < 0){ Msg.flash('「'+q+'」は見つからなかった'); return true; }
      api.car = clamp(at + Array.from(needle).length, 0, Editor.total(c));
      api.sel = {a:at, b:at+Array.from(needle).length};
      api.render();
      Msg.flash('「'+q+'」を'+(on?'ゆらぎ同一視で':'')+'見つけた');
      return true;
    }}, {l:'閉じる'}]});
  },
  replacePanel(c, api, w){
    const a = mk('input',{class:'bfield',style:'width:130px'});
    const b = mk('input',{class:'bfield',style:'width:130px'});
    Panel.open({title:'別の語句に置き換える', focus:'input', body:[
      mk('div',{class:'bprow'},[mk('span',{class:'bplabel',style:'width:64px',text:'探す語句'}),a]),
      mk('div',{class:'bprow'},[mk('span',{class:'bplabel',style:'width:64px',text:'置換語句'}),b])
    ], switches:[{l:'すべて置換', def:true, act:()=>{
      const from = a.value, to = b.value;
      if(!from) return;
      api.snap();
      let n = 0;
      for(const s of c.segs) if(s.t==='t' && s.s.indexOf(from)>=0){
        n += s.s.split(from).length-1;
        s.s = s.s.split(from).join(to);
      }
      WM.dirty(w); api.render();
      Msg.flash(n+'か所を置き換えた');
    }}, {l:'取消'}]});
  },
  /* 文章の一部分を別の実身にする — the selection becomes an object of
     its own, and a 仮身 to it stays behind in the text. This one
     operation is the whole filesystem in miniature. */
  extract(c, api, w, r){
    const segs = Editor.slice(c, r.a, r.b);
    const guess = TAD.plain({k:'tad', segs:segs}).replace(/\s+/g,'').slice(0,12) || '抜き書き';
    Panel.prompt('文章の一部分を別の実身にする', '新しい実身名', guess, nm=>{
      const nj = Graph.make({name: nm || guess, type:'bunsho',
        content: TAD.doc(JSON.parse(JSON.stringify(segs)))});
      api.snap();
      api.car = Editor.deleteRange(c, r.a, r.b, w.jid);
      const kam = Graph.newKam(nj.id, {mode:'closed', tsu:'抜き書き'});
      api.car = Editor.insertSeg(c, api.car, TAD.kamseg(kam));
      api.sel = null;
      WM.dirty(w); api.render();
      State.data.stats.made++;
      Msg.flash('選んだ部分を実身「'+nj.name+'」にし、あとに仮身を残した。');
    }, '選んだ部分が新しい実身になり、元の場所には仮身が残る。'+
       '文章はこうして網の目に分かれていく。');
  },
  expandKam(c, api, w){
    const k = Deck.selKam(); if(!k) return;
    const t = Graph.get(k.to); if(!t) return;
    if(t.content.k !== 'tad'){ Panel.alert('取り込めない',
      'この実身は文章ではないので、文章の中に展開できない。'); return; }
    api.snap();
    /* find the 仮身's flat position, drop it, splice the content in */
    let n = 0, at = -1;
    for(const s of c.segs){
      if(s.t==='k' && s.k.kid===k.kid){ at = n; break; }
      n += Editor.segUnits(s);
    }
    if(at < 0) return;
    Graph.removeKam(w.jid, k.kid);
    api.car = at;
    for(const s of JSON.parse(JSON.stringify(t.content.segs))){
      if(s.t==='t') api.car = Editor.insert(c, api.car, s.s, s.f);
      else if(s.t==='k'){
        const kam = Graph.newKam(s.k.to, {mode:s.k.mode, tsu:s.k.tsu});
        api.car = Editor.insertSeg(c, api.car, TAD.kamseg(kam));
      }
      else api.car = Editor.insertSeg(c, api.car, s);
    }
    Deck.select(null,null);
    WM.dirty(w); api.render();
    Msg.flash('仮身の中身を展開して取り込んだ。参照が実体になった。');
  },
  embedFig(c, api, w){
    const parts = [
      {type:'rect', x:6,y:6,w:96,h:56, line:'#203040', fill:'#e8eef8', lw:1},
      {type:'ellipse', x:18,y:18,w:32,h:32, line:'#a01010', fill:'#ffffff', lw:1},
      {type:'line', x:56,y:20,x2:96,y2:52, line:'#1b5e20', lw:2},
      {type:'text', x:12,y:56, text:'図形', size:11, line:'#203040'}
    ];
    api.snap();
    api.car = Editor.insertSeg(c, api.car,
      {t:'zu', fig:{parts:parts, paper:{w:108,h:68}}});
    WM.dirty(w); api.render();
    Msg.flash('図形を埋め込んだ。TADでは文字と図形が同じ流れに並ぶ。');
  }
};

/* ==================================================================
   17. 基本図形編集 — the drawing editor
   ------------------------------------------------------------------
   Structured, not painted: every shape stays an object you can select
   and change afterwards. The manual calls them 3種類の部品 — 一般図形,
   ピクセルマップ and 文字枠 — and a 仮身 can be one of the parts too,
   which is why a drawing can point at a document.
   ================================================================== */
const Zukei = {
  paint(c, j, o){
    o = o || {};
    const W = c.paper.w || 300, H = c.paper.h || 200;
    const wrap = el('div','dzpaper');
    wrap.style.width = W+'px'; wrap.style.height = H+'px';
    if(o.grid) wrap.appendChild(el('div','dzgrid'));
    const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('width', W); s.setAttribute('height', H);
    s.setAttribute('viewBox','0 0 '+W+' '+H);
    s.style.cssText = 'position:absolute;inset:0';
    let body = '';
    const kamParts = [];
    c.parts.forEach((p,i)=>{
      const st = 'stroke="'+(p.line||'#000')+'" stroke-width="'+(p.lw==null?1:p.lw)+'"'+
        (p.dash?' stroke-dasharray="'+p.dash+'"':'');
      const fl = 'fill="'+(p.fill||'none')+'"';
      switch(p.type){
        case 'rect': body += '<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+
          '" rx="'+(p.r||0)+'" '+fl+' '+st+'/>'; break;
        case 'ellipse': body += '<ellipse cx="'+(p.x+p.w/2)+'" cy="'+(p.y+p.h/2)+
          '" rx="'+Math.abs(p.w/2)+'" ry="'+Math.abs(p.h/2)+'" '+fl+' '+st+'/>'; break;
        case 'line': body += '<line x1="'+p.x+'" y1="'+p.y+'" x2="'+p.x2+'" y2="'+p.y2+
          '" '+st+' fill="none"/>'; break;
        case 'poly': body += '<polygon points="'+(p.pts||[]).map(q=>q[0]+','+q[1]).join(' ')+
          '" '+fl+' '+st+'/>'; break;
        case 'free': body += '<polyline points="'+(p.pts||[]).map(q=>q[0]+','+q[1]).join(' ')+
          '" fill="none" '+st+' stroke-linejoin="round" stroke-linecap="round"/>'; break;
        case 'fan': {
          const cx=p.x+p.w/2, cy=p.y+p.h/2, rx=p.w/2, ry=p.h/2;
          const a1=(p.a1||0)*Math.PI/180, a2=(p.a2||90)*Math.PI/180;
          body += '<path d="M'+cx+' '+cy+'L'+(cx+rx*Math.cos(a1))+' '+(cy+ry*Math.sin(a1))+
            'A'+rx+' '+ry+' 0 0 1 '+(cx+rx*Math.cos(a2))+' '+(cy+ry*Math.sin(a2))+'Z" '+
            fl+' '+st+'/>'; break;
        }
        case 'text': body += '<text x="'+p.x+'" y="'+p.y+'" font-size="'+(p.size||12)+
          '" font-family="'+(p.fnt==='gothic'?'var(--gothic)':'var(--mincho)')+
          '" fill="'+(p.line||'#000')+'"'+(p.tate?' writing-mode="vertical-rl"':'')+'>'+
          esc(p.text||'')+'</text>'; break;
        case 'pixel': {
          /* a pixel map: a grid of cells, drawn as rects. Structured
             drawing and painted drawing living side by side. */
          const px = p.px || 4;
          body += '<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+
            '" fill="#ffffff" stroke="'+(p.line||'#888')+'" stroke-dasharray="2 2"/>';
          (p.dots||[]).forEach(d=>{
            body += '<rect x="'+(p.x+d[0]*px)+'" y="'+(p.y+d[1]*px)+'" width="'+px+
              '" height="'+px+'" fill="'+(d[2]||'#000')+'"/>';
          });
          break;
        }
        case 'kam': kamParts.push({p, i}); break;
      }
    });
    s.innerHTML = body;
    wrap.appendChild(s);
    /* 仮身 parts are real DOM so they behave like every other 仮身 */
    kamParts.forEach(({p})=>{
      const holder = el('div');
      holder.style.cssText = 'position:absolute;left:'+p.x+'px;top:'+p.y+'px';
      holder.appendChild(Deck.build(p.kam, j.id, {path:o.path, depth:o.depth, dates:false}));
      wrap.appendChild(holder);
    });
    return wrap;
  },
  TOOLS: [
    {id:'sel',  t:'選択',   ic:'<path d="M4 3l9 8h-4l2 5-2 1-2-5-3 3z" fill="currentColor"/>'},
    {id:'free', t:'自由曲線', ic:'<path d="M2 12c3-8 5 3 7-2s3 4 5 1" fill="none" stroke="currentColor"/>'},
    {id:'line', t:'直線',   ic:'<path d="M2 14L14 3" stroke="currentColor" fill="none"/>'},
    {id:'rect', t:'長方形', ic:'<rect x="2.5" y="4.5" width="11" height="8" fill="none" stroke="currentColor"/>'},
    {id:'ellipse',t:'楕円', ic:'<ellipse cx="8" cy="8" rx="6" ry="4.5" fill="none" stroke="currentColor"/>'},
    {id:'poly', t:'多角形', ic:'<path d="M8 2l6 5-2 7H4L2 7z" fill="none" stroke="currentColor"/>'},
    {id:'fan',  t:'扇形',   ic:'<path d="M8 8V2a6 6 0 016 6z" fill="none" stroke="currentColor"/>'},
    {id:'text', t:'文字枠', ic:'<path d="M3 4h10M8 4v9" stroke="currentColor" fill="none"/>'},
    {id:'pixel',t:'ピクセルマップ', ic:'<path d="M3 3h4v4H3zM9 3h4v4H9zM3 9h4v4H3z" fill="currentColor"/>'}
  ],
  PALETTE: ['#000000','#ffffff','#a01010','#d06000','#b8a000','#1b5e20','#0d3b8f',
            '#5b1f7a','#006064','#606060','#c0c0c0','#e8dcc0'],
  open(w){
    const j = Graph.get(w.jid), c = j.content;
    const wrap = el('div','dzwrap');
    w.view.appendChild(wrap);
    let tool = 'sel', line = '#000000', fill = 'none', lw = 1, selIdx = -1;
    let grid = true, tmp = null, polyPts = null;
    const api = {
      render(){
        wrap.innerHTML = '';
        const paper = Zukei.paint(c, j, {grid:grid, path:[w.jid], depth:0});
        wrap.appendChild(paper);
        api.paper = paper;
        if(selIdx >= 0 && c.parts[selIdx]){

          m.style.cssText = 'position:absolute;left:'+(b.x-2)+'px;top:'+(b.y-2)+

        WM.sync(w);
      },
      tools(){
        let tp = w.node.querySelector('.dztool');
        if(!tp){
          tp = el('div','dztool');

        tp.appendChild(s1);
        tp.appendChild(el('div','tt','内部'));
        const s2 = el('div','swatches');
        ['none'].concat(Zukei.PALETTE).forEach(col=>{

            ? 'repeating-linear-gradient(45deg,#fff 0 3px,#bbb 3px 6px)' : col;
          sw.addEventListener('click', ()=>{ fill=col;
            if(selIdx>=0){ c.parts[selIdx].fill=col; WM.dirty(w); }

        tp.appendChild(s2);
      },
      resize(){
        const tp = w.node.querySelector('.dztool');
        if(tp) tp.style.left = Math.max(4, w.w - 92)+'px';

      },
      onKey(e){
        if(e.key==='Backspace' || e.key==='Delete'){
          if(selIdx>=0){
            e.preventDefault();
            const p = c.parts[selIdx];
            if(p.type==='kam') Graph.removeKam(w.jid, p.kam.kid);
            else c.parts.splice(selIdx,1);
            selIdx=-1; WM.dirty(w); api.render(); return true;
          }

      },
      copyToTray(move){
        if(selIdx<0){ Msg.flash('部品を選んでから'); return; }
        const p = c.parts[selIdx];
        Tray.push({kind:'part', part:JSON.parse(JSON.stringify(p)),
          label:'図形部品（'+p.type+'）', at:Date.now()});
        if(move){ c.parts.splice(selIdx,1); selIdx=-1; WM.dirty(w); api.render(); }
      },
      pasteFromTray(move){
        const it = Tray.take(0, move); if(!it) return;
        if(it.kind==='part'){
          const p = JSON.parse(JSON.stringify(it.part));
          p.x = (p.x||0)+10; p.y = (p.y||0)+10;

          c.parts.push(p);
        } else if(it.kind==='kam'){
          const kam = Graph.newKam(it.to, {mode:'closed', tsu:it.tsu});
          c.parts.push({type:'kam', kam:kam, x:20, y:20});
        } else if(it.kind==='text' || it.kind==='tad'){
          c.parts.push({type:'text', x:20, y:30, text:(it.text||'').slice(0,40),
            size:12, line:line});
        }
        WM.dirty(w); api.render();
      },
      save(){ Graph.bump(w.jid); w.dirty=false; touch(); },
      destroy(){ const tp = w.node.querySelector('.dztool'); if(tp) tp.remove(); },
      menu(){
        const p = selIdx>=0 ? c.parts[selIdx] : null;
        return [{l:'図形操作', sub:()=>[
          {l:'格子点を表示', chk:grid, act:()=>{ grid=!grid; api.render(); }},
          {l:'用紙の大きさ', sub:[[300,200,'はがき大'],[420,300,'A6'],[560,400,'A5']].map(
            ([ww,hh,nm])=>({l:nm+' '+ww+'×'+hh, act:()=>{
              c.paper={w:ww,h:hh}; WM.dirty(w); api.render(); }}))},
          '-',
          {l:'重なり順を最前へ', dis:!p, act:()=>{
            const q=c.parts.splice(selIdx,1)[0]; c.parts.push(q);
            selIdx=c.parts.length-1; WM.dirty(w); api.render(); }},
          {l:'重なり順を最背へ', dis:!p, act:()=>{
            const q=c.parts.splice(selIdx,1)[0]; c.parts.unshift(q);
            selIdx=0; WM.dirty(w); api.render(); }},
          '-',
          {l:'左右に反転', dis:!p, act:()=>{ Zukei.flip(c.parts[selIdx], c, 'h');
            WM.dirty(w); api.render(); }},
          {l:'上下に反転', dis:!p, act:()=>{ Zukei.flip(c.parts[selIdx], c, 'v');
            WM.dirty(w); api.render(); }},
          '-',
          {l:'固定化する', dis:!p, chk:!!(p&&p.fixed),
            act:()=>{ p.fixed=!p.fixed; WM.dirty(w); api.render(); }},
          {l:'部品を削除', dis:!p, act:()=>{
            if(p.type==='kam') Graph.removeKam(w.jid, p.kam.kid);
            else c.parts.splice(selIdx,1);
            selIdx=-1; WM.dirty(w); api.render(); }},
          '-',
          {l:'仮身を置く', act:()=>{
            const it = Tray.top();
            if(it && it.kind==='kam'){
              c.parts.push({type:'kam', kam:Graph.newKam(it.to,{mode:'closed'}), x:24, y:24});
              WM.dirty(w); api.render();
            } else Msg.flash('先に仮身をトレーへ入れておく');

        ]}];
      }
    };
    /* --- drawing on the paper ------------------------------------- */
    wrap.addEventListener('mousedown', e=>{
      if(e.button!==0) return;
      if(e.target.closest('.kam')) return;
      const paper = api.paper; if(!paper) return;
      const pr = paper.getBoundingClientRect();
      const px = (e.clientX-pr.left)/Scale.f, py = (e.clientY-pr.top)/Scale.f;
      if(px<0||py<0||px>paper.offsetWidth||py>paper.offsetHeight){
        if(tool==='sel'){ selIdx=-1; api.render(); }
        return;
      }
      if(tool==='sel'){
        selIdx = Zukei.hit(c.parts, px, py);
        api.render();
        if(selIdx>=0 && !c.parts[selIdx].fixed){
          const p = c.parts[selIdx];
          const o0 = JSON.parse(JSON.stringify(p));
          Drag.start(e, (dx,dy)=>{ Zukei.move(p, o0, dx, dy); api.render(); },
            ()=>{ WM.dirty(w); });
        }
        return;
      }
      if(tool==='poly'){
        if(!polyPts) polyPts = [[px,py]];
        else polyPts.push([px,py]);
        if(polyPts.length>=3 && e.detail>1){
          c.parts.push({type:'poly', pts:polyPts, line:line, fill:fill, lw:lw});
          polyPts=null; WM.dirty(w); api.render();
        }
        return;
      }
      if(tool==='text'){
        Panel.prompt('文字枠','文字','', v=>{
          if(!v) return;
          c.parts.push({type:'text', x:px, y:py+11, text:v, size:12, line:line,
            fnt:'mincho'});
          WM.dirty(w); api.render();
        });
        return;
      }
      if(tool==='free'){
        const pts = [[px,py]];
        Drag.start(e, (dx,dy)=>{
          pts.push([px+dx, py+dy]);
          if(tmp) c.parts.pop();
          c.parts.push(tmp = {type:'free', pts:pts.slice(), line:line, lw:lw});
          api.render();
        }, ()=>{ tmp=null; WM.dirty(w); api.render(); });
        return;
      }
      if(tool==='pixel'){
        const p = {type:'pixel', x:Math.round(px), y:Math.round(py), w:80, h:56,
          px:4, dots:[], line:'#888'};
        c.parts.push(p);
        WM.dirty(w); api.render();
        Msg.flash('ピクセルマップ枠を作った。枠の中を引きずると鉛筆で描ける。');
        return;
      }
      /* rect / ellipse / line / fan: drag out the shape */
      let made = null;
      Drag.start(e, (dx,dy)=>{
        if(made) c.parts.pop();
        const x = Math.min(px, px+dx), y = Math.min(py, py+dy);
        const ww = Math.abs(dx), hh = Math.abs(dy);
        if(tool==='line') made = {type:'line', x:px, y:py, x2:px+dx, y2:py+dy,
          line:line, lw:lw};
        else if(tool==='fan') made = {type:'fan', x:x, y:y, w:ww, h:hh, a1:-90, a2:30,
          line:line, fill:fill, lw:lw};
        else made = {type:tool, x:x, y:y, w:ww, h:hh, line:line, fill:fill, lw:lw};
        c.parts.push(made);
        api.render();
      }, ()=>{ made=null; WM.dirty(w); api.render(); });
    });
    /* the pencil inside a pixel map */
    wrap.addEventListener('mousemove', e=>{
      if(!(e.buttons&1) || tool!=='pixel') return;
      const paper = api.paper; if(!paper) return;
      const pr = paper.getBoundingClientRect();
      const px = (e.clientX-pr.left)/Scale.f, py = (e.clientY-pr.top)/Scale.f;
      for(const p of c.parts) if(p.type==='pixel'){
        if(px>=p.x && py>=p.y && px<p.x+p.w && py<p.y+p.h){
          const dx = Math.floor((px-p.x)/p.px), dy = Math.floor((py-p.y)/p.px);
          if(!p.dots.some(d=>d[0]===dx && d[1]===dy)){
            p.dots.push([dx,dy,line==='none'?'#000':line]);
            WM.dirty(w); api.render();
          }
        }
      }
    });
    wrap.addEventListener('scroll', ()=>WM.sync(w));
    return api;
  },
  bbox(p){
    switch(p.type){
      case 'line': return {x:Math.min(p.x,p.x2), y:Math.min(p.y,p.y2),
        w:Math.abs(p.x2-p.x), h:Math.abs(p.y2-p.y)};
      case 'poly': case 'free': {
        const xs=(p.pts||[]).map(q=>q[0]), ys=(p.pts||[]).map(q=>q[1]);
        if(!xs.length) return {x:0,y:0,w:0,h:0};
        return {x:Math.min.apply(null,xs), y:Math.min.apply(null,ys),
          w:Math.max.apply(null,xs)-Math.min.apply(null,xs),
          h:Math.max.apply(null,ys)-Math.min.apply(null,ys)};
      }
      case 'text': return {x:p.x, y:p.y-(p.size||12), w:(p.text||'').length*(p.size||12)*.95,
        h:(p.size||12)*1.25};
      case 'kam': return {x:p.x, y:p.y, w:p.w||150, h:p.h||18};
      default: return {x:p.x, y:p.y, w:p.w, h:p.h};
    }
  },
  hit(parts, x, y){
    for(let i=parts.length-1;i>=0;i--){
      const b = this.bbox(parts[i]);
      if(x>=b.x-3 && y>=b.y-3 && x<=b.x+b.w+3 && y<=b.y+b.h+3) return i;
    }
    return -1;
  },
  move(p, o0, dx, dy){
    if(p.type==='line'){ p.x=o0.x+dx; p.y=o0.y+dy; p.x2=o0.x2+dx; p.y2=o0.y2+dy; return; }
    if(p.type==='poly'||p.type==='free'){
      p.pts = o0.pts.map(q=>[q[0]+dx, q[1]+dy]); return;
    }
    p.x = o0.x+dx; p.y = o0.y+dy;
  },
  flip(p, c, dir){
    const W = c.paper.w, H = c.paper.h, b = this.bbox(p);
    const fx = v => 2*(b.x+b.w/2) - v, fy = v => 2*(b.y+b.h/2) - v;
    if(p.type==='line'){
      if(dir==='h'){ const a=p.x; p.x=fx(p.x2); p.x2=fx(a); }
      else { const a=p.y; p.y=fy(p.y2); p.y2=fy(a); }
      return;
    }
    if(p.pts){ p.pts = p.pts.map(q=> dir==='h' ? [fx(q[0]), q[1]] : [q[0], fy(q[1])]); return; }
    if(dir==='h') p.x = fx(p.x + (p.w||0));
    else p.y = fy(p.y + (p.h||0));
  }
};

/* ==================================================================
   18. 基本表計算 — the spreadsheet
   ------------------------------------------------------------------
   Rows and columns are numbered, not lettered, as the manual has them
   (縦8192×横256), and a cell may hold a 仮身 as easily as a number —
   which is the point: the sheet is TAD too.
   ================================================================== */
const Sheet = {
  ref(r,c){ return r+','+c; },
  get(content, r, c){ return content.cells[this.ref(r,c)] || null; },
  set(content, r, c, cell){
    if(cell==null) delete content.cells[this.ref(r,c)];
    else content.cells[this.ref(r,c)] = cell;
  },
  /* evaluate a cell, cycle-safe */
  value(content, r, c, seen){
    const cell = this.get(content, r, c);
    if(!cell) return '';
    if(cell.kam) return '〔'+Graph.name(cell.kam.to)+'〕';
    if(cell.f == null) return cell.v==null ? '' : cell.v;
    seen = seen || {};
    const key = this.ref(r,c);
    if(seen[key]) return '#循環';
    seen[key] = true;
    try { return this.evalF(content, cell.f, seen); }
    catch(err){ return '#式'; }
  },
  evalF(content, src, seen){
    let s = String(src).replace(/^=/,'');
    /* ranges first: [r1,c1]:[r2,c2] */
    s = s.replace(/\[(\d+),(\d+)\]\s*:\s*\[(\d+),(\d+)\]/g, (m,a,b,cc,d)=>{
      const r1=Math.min(+a,+cc), r2=Math.max(+a,+cc);
      const c1=Math.min(+b,+d),  c2=Math.max(+b,+d);
      const vals=[];
      for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
        const v = this.value(content, r, c, Object.assign({},seen));
        vals.push(typeof v==='number' ? v : (v===''?0:(parseFloat(v)||0)));
      }
      return '['+vals.join(',')+']';
    });
    s = s.replace(/\[(\d+),(\d+)\]/g, (m,a,b)=>{
      const v = this.value(content, +a, +b, Object.assign({},seen));
      return typeof v==='number' ? String(v) : String(parseFloat(v)||0);
    });
    /* functions, with the Japanese names the manual's 関数一覧 uses
       alongside the familiar ones */
    const F = {
      SUM:a=>a.reduce((x,y)=>x+y,0), 合計:a=>a.reduce((x,y)=>x+y,0),
      AVERAGE:a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,
      平均:a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,
      MAX:a=>Math.max.apply(null,a), 最大:a=>Math.max.apply(null,a),
      MIN:a=>Math.min.apply(null,a), 最小:a=>Math.min.apply(null,a),
      COUNT:a=>a.length, 個数:a=>a.length
    };
    s = s.replace(/([A-Z]+|合計|平均|最大|最小|個数)\s*\(\s*\[([^\]]*)\]\s*\)/g,
      (m,fn,list)=>{
        const f = F[fn]; if(!f) return 'NaN';
        const arr = list.split(',').filter(x=>x!=='').map(Number);
        return String(f(arr));
      });
    s = s.replace(/\[([^\]]*)\]/g, (m,list)=>{
      const arr = list.split(',').filter(x=>x!=='').map(Number);
      return String(arr.reduce((x,y)=>x+y,0));
    });
    if(!/^[-+*/()0-9.,eE\s]*$/.test(s)) return '#式';
    if(!s.trim()) return '';
    const out = Function('"use strict";return ('+s+')')();
    return (typeof out==='number' && isFinite(out)) ? Math.round(out*1e10)/1e10 : '#値';
  },
  fmt(v, cell){
    if(v==='' || v==null) return '';
    if(typeof v!=='number') return String(v);
    if(cell && cell.fmt==='yen') return '¥'+v.toLocaleString('ja-JP');
    if(cell && cell.fmt==='pct') return (v*100).toFixed(1)+'%';
    if(cell && cell.fmt==='int') return Math.round(v).toLocaleString('ja-JP');
    return String(Math.round(v*1e6)/1e6);
  },
  open(w){
    const j = Graph.get(w.jid), c = j.content;
    c.cells = c.cells || {};
    const wrap = el('div','sswrap');
    const cons = el('div','sscons');
    const grid = el('div','ssgrid');
    wrap.append(cons, grid);
    w.view.appendChild(wrap);
    let cur = {r:1, c:1}, range = null;
    const mark = el('div','mk','');
    const adr  = el('div','adr','1,1');
    const inp  = mk('input',{class:'bfield', style:'flex:1;min-width:0'});
    cons.append(mark, adr, inp);
    cons.setAttribute('data-gloss','console');
    const api = {
      shows(jid){ for(const k of Graph.kamsIn(w.jid)) if(k.to===jid) return true;
                  return jid===w.jid; },
      render(){
        const nR = c.rowsShown || 26, nC = c.colsShown || 8;
        grid.innerHTML = '';
        const t = el('table');
        const cw = cc => (c.colw && c.colw[cc]) || 62;
        let total = 30;
        for(let cc=1;cc<=nC;cc++) total += cw(cc);
        t.style.width = total+'px';
        const cg = el('colgroup');
        cg.appendChild(mk('col',{style:'width:30px'}));
        for(let cc=1;cc<=nC;cc++) cg.appendChild(mk('col',{style:'width:'+cw(cc)+'px'}));
        t.appendChild(cg);
        const thead = el('thead'), hr = el('tr');
        hr.appendChild(mk('th',{style:'width:30px;min-width:30px'}));
        for(let cc=1;cc<=nC;cc++) hr.appendChild(mk('th',{text:String(cc)}));
        thead.appendChild(hr); t.appendChild(thead);
        const tb = el('tbody');
        for(let r=1;r<=nR;r++){
          const tr = el('tr');
          tr.appendChild(mk('th',{text:String(r)}));
          for(let cc=1;cc<=nC;cc++){
            const cell = Sheet.get(c, r, cc);
            const td = el('td');
            if(cell && cell.b) td.classList.add('bold');
            if(cell && cell.kei) td.classList.add('kei');
            if(cell && cell.kam){
              td.appendChild(Deck.build(cell.kam, w.jid, {dates:false, path:[w.jid], depth:0}));
            } else {
              const v = Sheet.value(c, r, cc);
              td.textContent = Sheet.fmt(v, cell);
              if(typeof v==='number') td.classList.add('num');
              if(typeof v==='string' && v.charAt(0)==='#') td.classList.add('err');
            }
            if(r===cur.r && cc===cur.c) td.classList.add('cur');
            if(range && r>=Math.min(range.r1,range.r2) && r<=Math.max(range.r1,range.r2) &&
               cc>=Math.min(range.c1,range.c2) && cc<=Math.max(range.c1,range.c2) &&
               !(r===cur.r && cc===cur.c)) td.classList.add('inrange');
            td.addEventListener('mousedown', e=>{
              if(e.button!==0) return;
              if(e.target.closest('.kam')) return;
              cur = {r:r, c:cc}; range = null;
              api.sync(); api.render();
              Drag.start(e, ()=>{}, ()=>{}, ()=>{});
            });
            td.addEventListener('mouseenter', e=>{
              if(e.buttons&1){ range = {r1:cur.r, c1:cur.c, r2:r, c2:cc}; api.render(); }
            });
            tr.appendChild(td);
          }
          tb.appendChild(tr);
        }
        t.appendChild(tb);
        grid.appendChild(t);
        api.sync();
        WM.sync(w);
      },
      sync(){
        adr.textContent = cur.r+','+cur.c;
        const cell = Sheet.get(c, cur.r, cur.c);
        inp.value = cell ? (cell.f!=null ? cell.f : (cell.kam ? '〔仮身〕' :
          (cell.v==null?'':String(cell.v)))) : '';
        mark.textContent = cell && cell.f!=null ? '=' : (cell && cell.kam ? '仮' : '');
      },
      commit(){
        const s = inp.value;
        const cell = Sheet.get(c, cur.r, cur.c) || {};
        if(s === ''){ Sheet.set(c, cur.r, cur.c, null); }
        else if(s.charAt(0)==='='){ cell.f = s; delete cell.v;
          Sheet.set(c, cur.r, cur.c, cell); }
        else {
          delete cell.f;
          const n = Number(s);
          cell.v = (s.trim()!=='' && isFinite(n)) ? n : s;
          Sheet.set(c, cur.r, cur.c, cell);
        }
        WM.dirty(w); api.render();
      },
      onKey(e){
        if(document.activeElement === inp) return false;
        const nR = c.rowsShown||26, nC = c.colsShown||8;
        const mv = (dr,dc)=>{ cur.r = clamp(cur.r+dr,1,nR); cur.c = clamp(cur.c+dc,1,nC);
          range=null; api.render(); };
        if(e.key==='ArrowUp'){ e.preventDefault(); mv(-1,0); return true; }
        if(e.key==='ArrowDown'){ e.preventDefault(); mv(1,0); return true; }
        if(e.key==='ArrowLeft'){ e.preventDefault(); mv(0,-1); return true; }
        if(e.key==='ArrowRight'){ e.preventDefault(); mv(0,1); return true; }
        if(e.key==='Enter'){ e.preventDefault(); inp.focus(); inp.select(); return true; }
        if(e.key==='Backspace' || e.key==='Delete'){
          e.preventDefault();
          const cell = Sheet.get(c, cur.r, cur.c);
          if(cell && cell.kam) Graph.removeKam(w.jid, cell.kam.kid);
          Sheet.set(c, cur.r, cur.c, null);
          WM.dirty(w); api.render(); return true;
        }
        if(e.key.length===1 && !e.ctrlKey && !e.metaKey){
          inp.value = ''; inp.focus();
          return false;
        }
        return false;
      },
      copyToTray(move){
        const v = Sheet.value(c, cur.r, cur.c);
        const cell = Sheet.get(c, cur.r, cur.c);
        if(cell && cell.kam){ Tray.pushKam(cell.kam, move, w.jid); api.render(); return; }
        Tray.pushText(Sheet.fmt(v, cell));
        if(move){ Sheet.set(c, cur.r, cur.c, null); WM.dirty(w); api.render(); }
      },
      pasteFromTray(move){
        const it = Tray.take(0, move); if(!it) return;
        if(it.kind==='kam'){
          const kam = Graph.newKam(it.to, {mode:'closed', tsu:it.tsu});
          Sheet.set(c, cur.r, cur.c, {kam:kam});
        } else {
          const s = it.text || '';
          const n = Number(s);
          Sheet.set(c, cur.r, cur.c, {v:(s.trim()!=='' && isFinite(n))?n:s});
        }
        WM.dirty(w); api.render();
      },
      save(){ Graph.bump(w.jid); w.dirty=false; touch(); },
      resize(){ WM.sync(w); },
      menu(){
        const cell = Sheet.get(c, cur.r, cur.c) || {};
        const setF = f =>{ const cc = Sheet.get(c,cur.r,cur.c)||{}; cc.fmt=f;
          Sheet.set(c,cur.r,cur.c,cc); WM.dirty(w); api.render(); };
        return [{l:'表計算', sub:()=>[
          {l:'書式', sub:[
            {l:'標準', chk:!cell.fmt, act:()=>setF(null)},
            {l:'整数（桁区切り）', chk:cell.fmt==='int', act:()=>setF('int')},
            {l:'円', chk:cell.fmt==='yen', act:()=>setF('yen')},
            {l:'百分率', chk:cell.fmt==='pct', act:()=>setF('pct')}
          ]},
          {l:'太字', chk:!!cell.b, act:()=>{
            const cc=Sheet.get(c,cur.r,cur.c)||{}; cc.b=!cc.b;
            Sheet.set(c,cur.r,cur.c,cc); WM.dirty(w); api.render(); }},
          {l:'罫線を引く', chk:!!cell.kei, act:()=>{
            const r = range || {r1:cur.r,c1:cur.c,r2:cur.r,c2:cur.c};
            for(let rr=Math.min(r.r1,r.r2);rr<=Math.max(r.r1,r.r2);rr++)
              for(let cc2=Math.min(r.c1,r.c2);cc2<=Math.max(r.c1,r.c2);cc2++){
                const cc3 = Sheet.get(c,rr,cc2)||{}; cc3.kei = !cc3.kei;
                Sheet.set(c,rr,cc2,cc3);
              }
            WM.dirty(w); api.render(); }},
          '-',
          {l:'合計を入れる', act:()=>{
            if(!range){ Msg.flash('先に範囲を引きずって選ぶ'); return; }
            const r1=Math.min(range.r1,range.r2), r2=Math.max(range.r1,range.r2);
            const c1=Math.min(range.c1,range.c2), c2=Math.max(range.c1,range.c2);
            Sheet.set(c, r2+1, c2, {f:'=合計([' + r1+','+c1 + ']:[' + r2+','+c2 + '])'});
            WM.dirty(w); api.render();
            Msg.flash('=合計([行,列]:[行,列]) を入れた');
          }},
          {l:'仮身を置く', act:()=>{
            const it = Tray.top();
            if(it && it.kind==='kam'){
              Sheet.set(c, cur.r, cur.c, {kam:Graph.newKam(it.to,{mode:'closed'})});
              WM.dirty(w); api.render();
            } else Msg.flash('先に仮身をトレーへ入れておく');
          }},
          '-',
          {l:'関数一覧', act:()=>Panel.open({title:'関数一覧', body:
            '<div class="bpnote" style="max-width:300px">'+
            '合計/SUM・平均/AVERAGE・最大/MAX・最小/MIN・個数/COUNT<br><br>'+
            'セルの参照は <code>[行,列]</code>、範囲は <code>[1,1]:[5,3]</code>。<br>'+
            '本物の基本表計算は縦8192×横256セル、算術・三角・論理・情報・検索・'+
            '財務・日付・統計・文字列の各関数群を持つ。ここではその一部だけを'+
            '動かしている。</div>'})}
        ]}];
      }
    };
    inp.addEventListener('keydown', e=>{
      e.stopPropagation();
      if(e.key==='Enter'){ api.commit(); cur.r = Math.min((c.rowsShown||26), cur.r+1);
        api.render(); inp.blur(); }
      if(e.key==='Escape'){ api.sync(); inp.blur(); }
    });
    inp.addEventListener('blur', ()=>api.sync());
    grid.addEventListener('scroll', ()=>WM.sync(w));
    return api;
  }
};

/* ==================================================================
   19. マイクロカード — the card database
   ------------------------------------------------------------------
   Used in practice for 名簿 and library catalogues, which is exactly
   where 異形字ゆらぎ同一視 earns its keep: a catalogue has to find a
   name however the cataloguer spelled it.
   ================================================================== */
const Card = {
  open(w){
    const j = Graph.get(w.jid), c = j.content;
    c.marks = c.marks || [];
    const wrap = el('div','mcwrap');
    const bar  = el('div','mcbar');
    const body = el('div');
    body.style.cssText = 'flex:1;display:flex;flex-direction:column;min-height:0';
    wrap.append(bar, body);
    w.view.appendChild(wrap);
    let at = 0, mode = 'card', found = null;   /* found = 検索状態 */
    const recs = ()=> found || c.recs;
    const api = {
      render(){
        const R = recs();
        at = clamp(at, 0, Math.max(0, R.length-1));
        bar.innerHTML = '';
        const nav = (t, fn, dis)=>{
          const b = el('div','sw' + (dis?' dis':''), t);
          b.style.minWidth='24px'; b.style.padding='0 6px';
          b.addEventListener('click', ()=>{ if(!dis){ fn(); } });
          return b;
        };
        bar.append(
          nav('|◀', ()=>{ at=0; api.render(); }, at===0),
          nav('◀',  ()=>{ at--; api.render(); }, at<=0),
          mk('span',{text:(R.length?at+1:0)+' / '+R.length+
            (found?'（検索状態）':'')+'枚', style:'font-size:11px'}),
          nav('▶',  ()=>{ at++; api.render(); }, at>=R.length-1),
          nav('▶|', ()=>{ at=R.length-1; api.render(); }, at>=R.length-1),
          mk('span',{class:'grow'}),
          nav(mode==='card'?'一覧':'カード', ()=>{ mode = mode==='card'?'list':'card';
            api.render(); })
        );
        bar.querySelector('span').setAttribute('data-gloss','cardnav');
        body.innerHTML = '';
        if(mode === 'list'){
          const box = el('div','mclist');
          const t = el('table');
          const hr = el('tr');
          c.fields.forEach(f=>hr.appendChild(mk('th',{text:f.name})));
          t.appendChild(hr);
          R.forEach((r,i)=>{
            const tr = el('tr');
            if(i===at) tr.className = 'cur';
            if(c.marks.indexOf(c.recs.indexOf(r))>=0) tr.className += ' marked';
            c.fields.forEach(f=>{
              const v = r[f.name];
              const td = el('td');
              if(v && v.kid) td.appendChild(Deck.build(v, w.jid, {dates:false}));
              else td.textContent = v==null?'':String(v);
              tr.appendChild(td);
            });
            tr.addEventListener('mousedown', ()=>{ at=i; api.render(); });
            tr.addEventListener('dblclick', ()=>{ at=i; mode='card'; api.render(); });
            t.appendChild(tr);
          });
          box.appendChild(t);
          body.appendChild(box);
        } else {
          const card = el('div','mccard');
          if(!R.length){
            card.appendChild(mk('div',{class:'bpnote',text:'カードがない。'}));
          } else {
            const r = R[at];
            const gi = c.recs.indexOf(r);
            const mrk = el('div','mcmark' + (c.marks.indexOf(gi)>=0?' on':''), '◆');
            mrk.setAttribute('data-gloss','cardmark');
            mrk.addEventListener('click', ()=>{
              const k = c.marks.indexOf(gi);
              if(k>=0) c.marks.splice(k,1); else c.marks.push(gi);
              WM.dirty(w); api.render();
            });
            card.appendChild(mrk);
            if(c.title) card.appendChild(mk('div',{style:'font:13px var(--gothic);'+
              'font-weight:600;margin-bottom:6px;border-bottom:1px solid var(--lo);'+
              'padding-bottom:3px', text:c.title}));
            c.fields.forEach(f=>{
              const row = el('div','fld');
              row.appendChild(el('span','fn', f.name));
              const v = el('span','fv');
              const val = r[f.name];
              if(val && val.kid) v.appendChild(Deck.build(val, w.jid, {dates:false}));
              else {
                v.textContent = val==null?'':String(val);
                v.addEventListener('dblclick', ()=>{
                  Panel.prompt('カードの修正', f.name, val==null?'':String(val), nv=>{
                    r[f.name] = (f.type==='num' && nv!=='' && isFinite(Number(nv)))
                      ? Number(nv) : nv;
                    WM.dirty(w); api.render();
                  });
                });
              }
              row.appendChild(v);
              card.appendChild(row);
            });
            if(c.note) card.appendChild(mk('div',{class:'bpnote',
              style:'margin-top:9px;border-top:1px solid var(--lo);padding-top:6px',
              text:c.note}));
          }
          body.appendChild(card);
        }
        WM.sync(w);
      },
      onKey(e){
        const R = recs();
        if(e.key==='ArrowRight' || e.key==='PageDown'){ e.preventDefault();
          at=Math.min(R.length-1,at+1); api.render(); return true; }
        if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault();
          at=Math.max(0,at-1); api.render(); return true; }
        return false;
      },
      copyToTray(move){
        const R = recs(); if(!R.length) return;
        const r = R[at];
        const s = c.fields.map(f=>{
          const v=r[f.name]; return f.name+': '+((v&&v.kid)?Graph.name(v.to):(v==null?'':v));
        }).join('\n');
        Tray.pushText(s);
      },
      pasteFromTray(){
        const it = Tray.take(0,false); if(!it) return;
        if(it.kind==='kam'){
          const R = recs(); if(!R.length) return;
          const f = c.fields.find(x=>x.type==='kam') || c.fields[c.fields.length-1];
          R[at][f.name] = Graph.newKam(it.to, {mode:'closed'});
          WM.dirty(w); api.render();
        }
      },
      save(){ Graph.bump(w.jid); w.dirty=false; touch(); },
      resize(){ WM.sync(w); },
      menu(){
        return [{l:'カード操作', sub:()=>[
          {l:'カードを追加', act:()=>{
            const r = {}; c.fields.forEach(f=>r[f.name]='');
            c.recs.push(r); found=null; at=c.recs.length-1; mode='card';
            WM.dirty(w); api.render();
          }},
          {l:'カードを削除', act:()=>{
            const R = recs(); if(!R.length) return;
            const r = R[at];
            Panel.ask('カードを削除','このカードを削除する。',[
              {l:'削除', def:true, act:()=>{
                const gi = c.recs.indexOf(r);
                for(const fk in r) if(r[fk] && r[fk].kid) Graph.removeKam(w.jid, r[fk].kid);
                c.recs.splice(gi,1);
                c.marks = c.marks.filter(m=>m!==gi).map(m=>m>gi?m-1:m);
                if(found) found = found.filter(x=>x!==r);
                WM.dirty(w); api.render();
              }},{l:'取消'}]);
          }},
          '-',
          {l:'検索', gloss:'m-cardsearch', act:()=>Card.searchPanel(c, api, w, v=>{
            found = v; at = 0; api.render(); })},
          {l:'検索状態を解く', dis:!found, act:()=>{ found=null; at=0; api.render(); }},
          '-',
          {l:'並べ替える', sub:()=>c.fields.map(f=>({l:f.name+'で並べ替え', act:()=>{
            const key = f.name;
            const arr = found || c.recs;
            arr.sort((a,b)=>{
              const x = a[key], y = b[key];
              const xs = (x&&x.kid)?Graph.name(x.to):String(x==null?'':x);
              const ys = (y&&y.kid)?Graph.name(y.to):String(y==null?'':y);
              if(typeof x==='number' && typeof y==='number') return x-y;
              return xs.localeCompare(ys,'ja');
            });
            WM.dirty(w); api.render();
          }}))},
          {l:'重複をチェックする', act:()=>Card.dupCheck(c, w)},
          '-',
          {l:'マークを全部消す', act:()=>{ c.marks=[]; WM.dirty(w); api.render(); }},
          {l:'マーク付きだけを検索状態に', dis:!c.marks.length, act:()=>{
            found = c.marks.map(i=>c.recs[i]).filter(Boolean); at=0; api.render(); }}
        ]}];
      }
    };
    return api;
  },
  searchPanel(c, api, w, cb){
    const fld = mk('select',{class:'bfield'});
    fld.appendChild(mk('option',{value:'*',text:'すべての項目'}));
    c.fields.forEach(f=>fld.appendChild(mk('option',{value:f.name,text:f.name})));
    const q = mk('input',{class:'bfield',style:'width:150px'});
    let yur = true, re = false;
    const cy = mk('label',{class:'bchk on'},[el('i'),'異形字ゆらぎ同一視']);
    cy.addEventListener('click',()=>{ yur=!yur; cy.classList.toggle('on',yur); });
    const cr = mk('label',{class:'bchk'},[el('i'),'簡易正規表現']);
    cr.addEventListener('click',()=>{ re=!re; cr.classList.toggle('on',re); });
    Panel.open({title:'検索', focus:'input', body:[
      mk('div',{class:'bprow'},[mk('span',{class:'bplabel',text:'項目'}), fld]),
      mk('div',{class:'bprow'},[mk('span',{class:'bplabel',text:'検索語'}), q]),
      mk('div',{class:'bprow'},[cy]),
      mk('div',{class:'bprow'},[cr]),
      mk('div',{class:'bpnote',style:'max-width:280px',text:
        'ゆらぎ同一視を入れると、渡辺で渡邊・渡邉も、斉藤で齋藤も同じものとして拾う。'+
        '図書館の目録や名簿を扱う仕事では、これが無いと同じ人が何人にも分かれる。'})
    ], switches:[
      {l:'新規検索', def:true, act:()=>{
        const s = q.value.trim();
        const hit = c.recs.filter(r=>Card.match(r, c, fld.value, s, yur, re));
        cb(hit);
        Msg.flash(hit.length+'枚のカードが検索状態に入った');
      }},
      {l:'絞り込み', act:()=>{
        const s = q.value.trim();
        const base = c.recs;
        const hit = base.filter(r=>Card.match(r, c, fld.value, s, yur, re));
        cb(hit);
      }},
      {l:'取消'}]});
  },
  match(r, c, field, s, yur, re){
    if(!s) return true;
    const vals = (field==='*' ? c.fields.map(f=>f.name) : [field]).map(k=>{
      const v = r[k];
      return (v && v.kid) ? Graph.name(v.to) : String(v==null?'':v);
    });
    for(const v of vals){
      if(re){
        try {
          const pat = s.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.');
          const rx = new RegExp(pat);
          if(yur ? rx.test(CharDB.fold(v)) : rx.test(v)) return true;
        } catch(e){}
        continue;
      }
      if(yur ? CharDB.yuragiMatch(v, s) : v.indexOf(s)>=0) return true;
    }
    return false;
  },
  dupCheck(c, w){
    const seen = {}, dups = [];
    const key = c.fields[0].name;
    c.recs.forEach((r,i)=>{
      const v = (r[key]&&r[key].kid) ? Graph.name(r[key].to) : String(r[key]==null?'':r[key]);
      const f = CharDB.fold(v);
      if(seen[f]!=null) dups.push([seen[f], i, v]);
      else seen[f] = i;
    });
    Panel.open({title:'重複をチェックする', body:
      '<div class="bpnote" style="max-width:300px">'+
      '項目「'+esc(key)+'」を、異形字ゆらぎを同一視して比べた。<br><br>'+
      (dups.length
        ? '重複 '+dups.length+'件：<br>'+dups.map(d=>
            (d[0]+1)+'枚目 と '+(d[1]+1)+'枚目 …… '+esc(d[2])).join('<br>')+
          '<br><br>字の形が違っても同じ名前として見つかる。これが名簿の仕事で'+
          '本当に要る機能である。'
        : '重複はなかった。')+
      '</div>'});
  }
};

/* ==================================================================
   20. 基本ブラウザ — the web browser
   ------------------------------------------------------------------
   Note the vocabulary trap for English readers: in 超漢字, 基本ブラウザ
   is the *web* browser. The object browser is 基本文章編集 showing a
   実身 as a 仮身一覧 — there is no separate file manager, because a
   folder is only a document that happens to hold references.
   ================================================================== */
const Browser = {
  open(w){
    const j = Graph.get(w.jid), c = j.content;
    const wrap = el('div','brwrap');
    const panel = el('div','brpanel');
    const doc = el('div','brdoc');
    const stat = el('div','brstat');
    wrap.append(panel, doc, stat);
    w.view.appendChild(wrap);
    let hist = [c.url], at = 0;
    const api = {
      render(){
        panel.innerHTML = '';
        const b = (t,fn,dis,gl)=>{
          const s = el('div','sw'+(dis?' dis':''), t);
          s.style.minWidth='0'; s.style.padding='0 6px';
          if(gl) s.setAttribute('data-gloss', gl);
          s.addEventListener('click', ()=>{ if(!dis) fn(); });
          return s;
        };
        const url = mk('input',{class:'bfield url', value:hist[at]});
        url.addEventListener('keydown', e=>{
          e.stopPropagation();
          if(e.key==='Enter') api.go(url.value.trim());
        });
        panel.append(
          b('◀', ()=>{ at--; api.load(); }, at<=0, 'brback'),
          b('▶', ()=>{ at++; api.load(); }, at>=hist.length-1),
          b('更新', ()=>api.load()),
          url,
          b('しおり', ()=>Menu.show(SITES.map(s=>({l:s.title,
            act:()=>api.go(s.url)})), 300, 60))
        );
        api.load(true);
      },
      go(u){
        if(!u) return;
        hist = hist.slice(0, at+1); hist.push(u); at = hist.length-1;
        api.load();
      },
      load(quiet){
        const u = hist[at];
        c.url = u;
        const page = SITES.find(s=>s.url===u) ||
                     SITES.find(s=>u.indexOf(s.url)===0);
        doc.innerHTML = '';
        if(!page){
          doc.appendChild(mk('div',{class:'banner',
            html:'<b>接続できません</b><br>この展示に入っているのは、当時の内容を'+
            'その場で組み立てた数ページだけである。外へは出ない——一つのHTMLファイルの'+
            '中で完結しているので、ネットワークそのものが無い。'}));
          const ul = el('ul');
          SITES.forEach(s=>{
            const li = el('li');
            const a = mk('a',{href:'#',text:s.title});
            a.addEventListener('click', e=>{ e.preventDefault(); api.go(s.url); });
            li.append(a, mk('span',{style:'color:var(--lo2);font-size:11px',
              text:' — '+s.url}));
            ul.appendChild(li);
          });
          doc.appendChild(ul);
        } else {
          State.data.visited[page.url] = true;
          Browser.paint(page, doc, {nav:api.go, host:w.jid});
        }
        if(!quiet) panel.querySelector('.url').value = u;
        stat.innerHTML = '';
        stat.append(mk('span',{text:'完了'}),
          mk('span',{text:'文字コード：TRONコード（TAD-HTML）'}),
          mk('span',{class:'grow'}),
          mk('span',{text:hist.length+'件の履歴'}));
        WM.sync(w);
        touch();
      },
      save(){ Graph.bump(w.jid); w.dirty=false; touch(); },
      resize(){ WM.sync(w); },
      menu(){
        return [{l:'ブラウザ', sub:()=>[
          {l:'文字コードを指定する', sub:[
            {l:'TRONコード（自動）', chk:true, act:()=>Msg.flash('TRONコードで解釈している')},
            {l:'シフトJIS', act:()=>Msg.flash('シフトJISとして読み直した')},
            {l:'EUC-JP', act:()=>Msg.flash('EUC-JPとして読み直した')},
            {l:'ISO-2022-JP', act:()=>Msg.flash('ISO-2022-JPとして読み直した')}
          ]},
          {l:'文字を階調表示', act:()=>{
            doc.style.textShadow = doc.style.textShadow ? '' : '0 0 .35px currentColor';
            Msg.flash('文字階調表示を切り替えた');
          }},
          '-',
          {l:'ウィンドウの情報を保存する', act:()=>{
            const page = SITES.find(s=>s.url===hist[at]);
            if(!page) return;
            const nj = Graph.make({name:page.title, type:'html',
              content:{k:'html', url:page.url, body:page.body}});
            Graph.place(SYS.home, Graph.newKam(nj.id,{mode:'icon'}));
            Deck.arrange(SYS.home); WM.refreshJid(SYS.home);
            Msg.flash('このページを実身「'+page.title+'」として保存した');
          }},
          {l:'このページを文章として取り込む', act:()=>{
            const page = SITES.find(s=>s.url===hist[at]);
            if(!page) return;
            const segs = [];
            page.body.forEach(bl=>{
              if(bl.t==='h1'||bl.t==='h2') segs.push(TAD.txt(bl.s,{fnt:'gothic',b:true,siz:16}));
              else if(bl.t==='p') segs.push(TAD.txt(bl.s));
              else if(bl.t==='li') segs.push(TAD.txt('・'+bl.s));
              segs.push(TAD.nl());
            });
            const nj = Graph.make({name:page.title+'（取り込み）', type:'bunsho',
              content:TAD.doc(segs)});
            Graph.place(SYS.home, Graph.newKam(nj.id,{mode:'icon'}));
            Deck.arrange(SYS.home); WM.refreshJid(SYS.home);
            Msg.flash('HTMLをTADの文章に変換して実身にした');
          }}
        ]}];
      }
    };
    doc.addEventListener('scroll', ()=>WM.sync(w));
    return api;
  },
  paint(page, host, o){
    o = o || {};
    (page.body||[]).forEach(b=>{
      switch(b.t){
        case 'h1': host.appendChild(mk('h1',{text:b.s})); break;
        case 'h2': host.appendChild(mk('h2',{text:b.s})); break;
        case 'p':  host.appendChild(mk('p',{html:Browser.rich(b.s, host, o)})); break;
        case 'banner': host.appendChild(mk('div',{class:'banner',html:b.s})); break;
        case 'hr': host.appendChild(el('hr')); break;
        case 'ul': {
          const ul = el('ul');
          b.items.forEach(it=>{
            const li = el('li');
            if(typeof it === 'string') li.innerHTML = Browser.rich(it, host, o);
            else {
              const a = mk('a',{href:'#',text:it.t});
              a.addEventListener('click', e=>{ e.preventDefault();
                if(o.nav) o.nav(it.u); });
              li.appendChild(a);
              if(it.n) li.appendChild(mk('span',{style:'color:#555;font-size:11px',
                text:' — '+it.n}));
            }
            ul.appendChild(li);
          });
          host.appendChild(ul);
          break;
        }
        case 'table': {
          const t = el('table');
          b.rows.forEach((r,i)=>{
            const tr = el('tr');
            r.forEach(cell=>tr.appendChild(mk(i===0?'th':'td',{text:String(cell)})));
            t.appendChild(tr);
          });
          host.appendChild(t);
          break;
        }
        case 'pre': host.appendChild(mk('pre',{style:'font:11px var(--mono);'+
          'background:var(--face2);border:1px solid var(--lo);padding:5px 7px;'+
          'overflow:auto',text:b.s})); break;
      }
    });
  },
  rich(s, host, o){
    /* the only markup the built-in pages use: [[title|url]] links */
    return esc(s).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,
      (m,t,u)=>'<a href="#" data-u="'+esc(u)+'">'+esc(t)+'</a>');
  }
};
/* link clicks inside built-in pages */
document.addEventListener('click', e=>{

  if(!a) return;
  e.preventDefault();
  const w = WM.wins[WM.act];

});

const Mail = {
  open(w){
    const j = Graph.get(w.jid), c = j.content;
    const wrap = el('div','mlwrap');
    const list = el('div','mllist');
    const body = el('div','mlbody');
    wrap.append(list, body);
    w.view.appendChild(wrap);
    let at = 0;
    const api = {
      render(){
        list.innerHTML = '';
        const t = el('table');
        const hr = el('tr');
        ['','差出人','件名','日付'].forEach(h=>hr.appendChild(mk('th',{text:h})));
        t.appendChild(hr);
        c.msgs.forEach((m,i)=>{
          const tr = el('tr');
          if(i===at) tr.className='cur';
          if(m.unread) tr.className += ' unread';
          tr.append(
            mk('td',{text:(m.attach&&m.attach.length)?'📎':'',style:'width:14px'}),
            mk('td',{text:m.from||''}),
            mk('td',{text:m.subj||'(件名なし)'}),
            mk('td',{text:m.date||'',style:'width:74px'}));
          tr.addEventListener('mousedown', ()=>{ at=i; m.unread=false;
            WM.dirty(w); api.render(); });
          t.appendChild(tr);
        });
        list.appendChild(t);
        body.innerHTML = '';
        const m = c.msgs[at];
        if(!m){ body.appendChild(mk('div',{class:'bpnote',text:'メールがない。'})); return; }
        body.appendChild(mk('div',{class:'mlhdr',html:
          '差出人： '+esc(m.from||'')+'<br>宛先： '+esc(m.to||'')+
          '<br>件名： '+esc(m.subj||'')+'<br>日付： '+esc(m.date||'')+
          (m.charset?'<br>文字セット： '+esc(m.charset):'')}));
        (m.body||'').split('\n').forEach(ln=>{
          body.appendChild(mk('div',{text:ln || ' '}));
        });
        if(m.attach && m.attach.length){
          body.appendChild(mk('div',{style:'margin-top:9px;border-top:1px solid var(--lo);'+
            'padding-top:6px;font:11px var(--gothic);color:var(--lo2)',text:'添付：'}));
          const row = el('div');
          row.style.cssText='display:flex;flex-wrap:wrap;gap:4px;margin-top:3px';
          m.attach.forEach(a=>row.appendChild(Deck.build(a, w.jid, {dates:false})));
          body.appendChild(row);
        }
        WM.sync(w);
      },
      onKey(e){
        if(e.key==='ArrowDown'){ e.preventDefault(); at=Math.min(c.msgs.length-1,at+1);
          if(c.msgs[at]) c.msgs[at].unread=false; api.render(); return true; }
        if(e.key==='ArrowUp'){ e.preventDefault(); at=Math.max(0,at-1); api.render(); return true; }
        return false;
      },
      copyToTray(){
        const m = c.msgs[at]; if(!m) return;
        Tray.pushText('件名: '+m.subj+'\n'+m.body);
      },
      save(){ Graph.bump(w.jid); w.dirty=false; touch(); },
      resize(){ WM.sync(w); },
      menu(){
        return [{l:'メール', sub:()=>[
          {l:'メールを受信する', act:()=>{
            Msg.flash('接続していない。この展示にネットワークは無い。');
          }},
          {l:'メールを送信する', act:()=>Mail.compose(c, api, w)},
          {l:'返信する', dis:!c.msgs[at], act:()=>Mail.compose(c, api, w, c.msgs[at])},
          '-',
          {l:'メールを検索する', act:()=>{
            Panel.prompt('メールを検索','件名・本文','', q=>{
              if(!q) return;
              const hit = c.msgs.findIndex(m=>
                CharDB.yuragiMatch((m.subj||'')+(m.body||''), q));
              if(hit<0){ Msg.flash('見つからなかった'); return; }
              at = hit; api.render();
              Msg.flash((hit+1)+'通目に見つけた（ゆらぎ同一視あり）');
            });
          }},
          {l:'添付を実身として保存', dis:!(c.msgs[at]&&c.msgs[at].attach&&c.msgs[at].attach.length),
            act:()=>{
              const m = c.msgs[at];
              m.attach.forEach(a=>{
                Graph.place(SYS.home, Graph.newKam(a.to, {mode:'icon'}));
              });
              Deck.arrange(SYS.home); WM.refreshJid(SYS.home);
              Msg.flash('添付の仮身を初期ウィンドウに置いた');
            }},
          '-',
          {l:'文字セットについて', act:()=>Panel.open({title:'文字セット', body:
            '<div class="bpnote" style="max-width:300px">'+
            '超漢字メールは、TRONコードの文書をそのまま送れない相手のために'+
            '文字セットを選んで送る。18万字の世界から6万字の世界へ手紙を出すには、'+
            'どの字を捨てるかを決めなければならない——それがこの設定である。</div>'})}
        ]}];
      }
    };
    body.addEventListener('scroll', ()=>WM.sync(w));
    return api;
  },
  compose(c, api, w, reply){
    const to = mk('input',{class:'bfield',style:'width:190px',
      value: reply ? (reply.from||'') : ''});
    const sj = mk('input',{class:'bfield',style:'width:190px',
      value: reply ? ('Re: '+(reply.subj||'')) : ''});
    const bd = mk('textarea',{class:'bfield',style:'width:250px;height:70px',
      text: reply ? ('\n\n> '+String(reply.body||'').split('\n').join('\n> ')) : ''});
    [to,sj,bd].forEach(n=>n.addEventListener('keydown', e=>e.stopPropagation()));
    Panel.open({title:'メール編集', body:[
      mk('div',{class:'bprow'},[mk('span',{class:'bplabel',style:'width:44px',text:'宛先'}),to]),
      mk('div',{class:'bprow'},[mk('span',{class:'bplabel',style:'width:44px',text:'件名'}),sj]),
      mk('div',{class:'bprow'},[bd])
    ], switches:[{l:'送信', def:true, act:()=>{
      c.msgs.unshift({from:'私 <me@example.jp>', to:to.value, subj:sj.value||'(件名なし)',
        date:stampShort(Date.now()), body:bd.value, unread:false, sent:true,
        charset:'TRONコード'});
      WM.dirty(w); api.render();
      Msg.flash('送信箱に入れた。実際には出ていかない。');
    }}, {l:'取消'}]});
  }
};
