<p>The net self-calibrates by emitting a low-amplitude reference pulse every <b>47.0 seconds</b> and reading the lattice's response. This matters for the interpretation of external periodic signals, as the survey team learned to its cost ([[SV-016]], [[ML-405]]). The net's reach scales with delivered sensor power: at nominal it resolves masses out to about fifteen light-years; above 105% it reaches further and begins to show faint contacts that are otherwise below threshold.</p>`, ["TM-0033", "SV-016", "SV-010"]);

E("TM-0033", "SIGNAL PROCESSOR STACK AND THE SENSOR POWER CURVE", "signal processor sensor power curve refresh rate resolution stale confidence degraded",
`<p>Every sensor reading on this vessel passes through the <b>signal processor stack</b> on Deck 7, and the stack is where the sensor power allocation shows itself most plainly. Four things degrade together as power falls below nominal:</p>
<ol><li><b>Refresh rate.</b> At nominal the displays update roughly twice a second. At 50% they update every second and a quarter; at 20% every three seconds; below that the display is marked STALE with the age of the last reading.</li>
<li><b>Resolution.</b> The aperture display coarsens: twenty-four columns at nominal, eighteen at 80%, twelve at 60%, eight at 40%, five at anything less.</li>
<li><b>Precision.</b> Readings lose decimal places as confidence falls.</li>
<li><b>Reach.</b> Range in light-years is proportional to delivered power.</li></ol>
<p>Above 105% the stack enters EXTENDED mode and surfaces contacts that are normally below threshold. This is the single most useful fact on the ship for a surveyor and the single most dangerous for a navigator, because the power has to come from somewhere ([[TM-0012]]).</p>`, ["TM-0030", "TM-0032", "PM-006", "panel:sensors"]);

E("TM-0040", "ATMOSPHERE RECYCLING LOOPS", "environmental atmosphere recycling loops scrubbers oxygen carbon dioxide life support",
`<p>Two <b>atmosphere recycling loops</b> — loop 1 forward, loop 2 aft — scrub carbon dioxide, restore oxygen and hold humidity across the eleven decks. Either loop alone can carry the whole vessel at reduced margin; both together give the comfortable air the crew is used to. Loop 2 is supplemented by the arboretum on Deck 9 ([[TM-0100]]), which is why the horticulturist is a member of the environmental watch.</p>
<p>The loops are the reason the environmental trunk carries the sternest thresholds on the grid. Below <b>70%</b> of nominal the recyclers fall behind and the console raises CONDITION ELEVATED on its own; below <b>40%</b> it declares EMERGENCY. There is no operator setting that suppresses either. Scrubber saturation and loop pressure faults are isolated by [[PM-007]].</p>`, ["TM-0041", "TM-0042", "PM-007", "PM-001"]);

E("TM-0041", "THERMAL REGULATION", "thermal regulation heat radiators temperature environmental",
`<p><b>Thermal regulation</b> moves waste heat from the core, the drive and forty-seven warm bodies to the radiator panels on the dorsal hull. It is part of the environmental trunk and degrades with it, though more forgivingly than the atmosphere loops: a cold ship is uncomfortable long before it is dangerous.</p>
<p>The setpoint drifts when the regulation controller is under-powered, and the mess will complain before any console does. Repair, as for the rest of the environmental plant, is by [[PM-007]].</p>`, ["TM-0040", "PM-007"]);

E("TM-0042", "WATER RECLAMATION", "water reclamation reserve environmental tanks",
`<p><b>Water reclamation</b> recovers, filters and re-mineralises the vessel's water, holding a reserve in tanks on Deck 9 sufficient for forty days at normal consumption. It shares the environmental trunk. Reclamation is the least power-sensitive of the environmental functions and the first the environmental technician will accept a cut to, which is why the STATION and MINIMUM power profiles ([[PM-002]]) preserve the atmosphere loops before they preserve the tanks.</p>`, ["TM-0040", "PM-002"]);

E("TM-0050", "HULL-STRESS COMPENSATION FIELD", "hull stress compensation field structural emitters generator forward aft integrity",
`<p>The <b>hull-stress compensation field</b> (HSC) is projected by forward and aft emitter rings and a central field generator, and its job is to carry the loads the drive puts on a 212-metre hull that was, in the end, built by people. Its requirement rises with drive rating ([[TM-0021]]) and it is the subsystem that debris fields, dense nebulae and hard manoeuvres test first ([[PM-004]]).</p>
<p>The stress monitor node reports hull load continuously to the Status console. When the field is below requirement the alert machine escalates on its own; the visitor to the Operations console may not stand a condition down while that is true. Emitter phase errors are corrected by [[PM-009]].</p>`, ["TM-0021", "PM-009", "PM-004"]);

E("TM-0060", "LIBRARY COMPUTER CORE — CORES A AND B", "library computer core primary archive computing retrieval index bus",
`<p>The <b>library computer</b> runs on two cores in the Deck 2 vault: <b>core A</b>, the primary, which serves the consoles, and <b>core B</b>, the archive, which holds the survey corpus and the vessel's technical library — this document among them. A retrieval index ([[TM-0061]]) sits between them and the data bus carries the results to every station.</p>
<p>Computing shares the grid like everything else. Below 80% of nominal, retrieval slows and returns fewer results; below 50% the parser accepts only keyword queries; below 30% the natural-language front end is switched off altogether and the console says so. The failover procedure, should core A fault, is [[PM-010]]. The query protocol is [[PM-014]].</p>`, ["TM-0061", "PM-010", "PM-014", "panel:library"]);

E("TM-0061", "RETRIEVAL INDEX AND QUERY PARSER", "retrieval index query parser natural language computer prompt search full text",
`<p>The <b>retrieval index</b> is a full-text inverted index over every entry in the library: each word, stemmed, points at the entries that contain it, weighted by where it appears (title, keywords, body). A query is stemmed the same way and the entries are ranked by how many of its terms they match and how rare those terms are across the corpus.</p>
<p>In front of the index sits the <b>query parser</b>, which accepts the attention word <b>COMPUTER,</b> followed by a request in ordinary phrasing. It recognises a small number of intents — the status of a subsystem, the distance to a system, the record of a crew member, the present condition, the time — and answers those from the live vessel rather than the archive. Anything else becomes a search. Voice input is accepted where the console's audio pickup is fitted; otherwise the request is typed.</p>
<p>The parser is honest about its limits. It does not understand you; it matches you. When computing power is short it says which of its functions it has switched off ([[TM-0060]]).</p>`, ["TM-0060", "PM-014", "panel:library"]);

E("TM-0070", "CLINICAL BAY", "medical clinical bay diagnostic table pharmacy stores isolation ward deck 5",
`<p>The <b>clinical bay</b> on Deck 5 is a six-bed facility with an autonomic diagnostic table, refrigerated pharmacy stores and a two-bed isolation ward. It is staffed by the medical officer ([[PR-005]]) and one nurse ([[PR-016]]), which is the Commission's standard for a forty-seven-person vessel and, in the medical officer's recorded opinion, one nurse short.</p>
<p>The medical trunk is small — 40 MW nominal — and is protected by the emergency battery reserve ([[TM-0013]]) rather than by any interlock on the grid, so the console <i>will</i> let an operator cut it. Below 50% the bay is flagged ON RESERVE POWER and the pharmacy stores begin to warm; the protocol is [[PM-011]].</p>`, ["PR-005", "PR-016", "PM-011", "TM-0013"]);

E("TM-0080", "LONG-RANGE COMMUNICATIONS ARRAY AND PHASE LOCK", "communications array long range phase lock reference oscillator kettleridge relay messages queue",
`<p>The <b>long-range array</b> talks to the Kettleridge Relay ([[SV-015]]) and, through it, to the Commission and to other vessels. It works by holding a <b>phase lock</b> between the vessel's reference oscillator and the relay's beacon; with the lock held, messages pass in either direction with a delay that depends on power and distance. With the lock lost, nothing passes at all.</p>
<p>The lock is fragile in exactly one way. If the communications trunk is <b>unpowered for more than a few seconds</b> the oscillator drifts out of the capture range and the lock is gone. Restoring power does not restore it: the array must be cold-started by the procedure in [[TM-0447]], which requires a minimum allocation of 20 MW to succeed. Officers have lost the lock by shedding communications load in a hurry more often than by any fault, which is why the console warns when the allocation reaches zero. Below 30% of nominal the array is OFFLINE and messages are queued in the buffers ([[PM-012]]).</p>`, ["TM-0447", "PM-012", "SV-015", "panel:comms"]);

E("TM-0447", "COMMUNICATIONS ARRAY — COLD START PROCEDURE", "cold start communications array phase lock lost purge seed acquire procedure 447 restore",
`<p><b>Applicability.</b> The communications phase lock has been lost ([[TM-0080]]) and the Operations console reports PHASE LOCK LOST. Restoring power to the trunk alone will not clear the condition; the array shows no fault, because there is none. The oscillator has simply drifted out of the capture range and must be walked back in.</p>
<p><b>Preconditions.</b> Allocate at least <b>20 MW</b> to communications. The final step refuses below that figure.</p>
<p><b>Procedure.</b> On the Engineering console ([[panel:eng|ENGINEERING]]) select COMMUNICATIONS, then the LONG-RANGE ARRAY node, and perform the following steps in this order and no other:</p>
<ol><li><b>PURGE</b> — clear the message buffers and the oscillator's phase history.</li>
<li><b>SEED</b> — load the relay's reference frequency into the oscillator from the stored almanac.</li>
<li><b>ACQUIRE</b> — sweep the capture range and lock.</li></ol>
<p>Any step out of sequence resets the sequence. On success the console reports PHASE LOCK ACQUIRED and queued messages flow. The procedure was written after the loss of contact with OSV Halcyon Gate ([[HX-008]]), whose crew had the power to talk and did not know how to make the array listen. It is filed at 0447 for the reason given in [[HX-007]].</p>`, ["TM-0080", "PM-012", "HX-008", "HX-007", "panel:eng"]);

E("TM-0090", "CONSOLE DISPLAY FABRICATION AND THE GRAMMAR OF THE INTERFACE", "console display fabrication grammar interface elbow bar block sweep text primitives palette exhibit construction how this was built html museum",
`<p>This manual documents the construction of the console you are reading it on. It is filed as a technical manual because that is what it is.</p>
<p><b>Fabrication.</b> The console is a single document in a browser: one file, its styling and its logic inline, no external resources, no network, no build step. It runs from a local file. Everything visible is drawn by the browser from five shapes — there are no images.</p>
<p><b>The grammar.</b> A component library renders exactly five primitives and nothing else: the <b>elbow</b> (an L-shaped joint whose outer radius equals the bar's thickness plus its inner radius, so the bar keeps its thickness through the bend), the <b>bar</b> (a rule with one rounded cap, broken by gaps that carry small blocks or text), the <b>block</b> (a flat rectangle, pill-ended, one-end-rounded or square, which may be a control or may be nothing), the <b>sweep</b> (the same joint at a larger radius, joining the header to the sidebar) and <b>text</b> (uppercase, condensed, right-aligned in blocks). An audit at power-on walks every element on the console and reports anything painted outside that set. The count is in the museum guide.</p>
<p><b>Behind the grammar.</b> One simulation model holds the grid, the drive, the field, the sensors, the cores, the array, the clock and the course. Every panel reads from it; every control writes to it through a method that may refuse. An alert machine derives a palette and a layout from the model's condition. A library — this one — indexes a corpus written for the vessel and answers a prompt. An audio engine synthesises its tones. A state manager remembers what you did.</p>
<p><b>Typography.</b> The condensed face the look is known for is a licensed font and is not fetched. A stack of locally installed condensed faces is tried and a probe measures whatever arrives, squeezing it horizontally toward the intended proportion. The squeeze factor is shown in the guide.</p>
<p><b>Honesty.</b> Nothing on this console recreates anything that existed. The design language it submits to was created for a television production in 1987 as printed graphics on backlit acrylic, and had no behaviour. All behaviour here is invented and labelled as such. See [[TM-0091]] for the colour assignment and [[HX-010]] for the in-vessel history of the standard.</p>`, ["TM-0091", "HX-010", "panel:about"]);

E("TM-0091", "CONSOLE COLOUR ASSIGNMENTS — STANDARD 7", "console colour color assignment palette peach salmon tan butterscotch lilac lavender periwinkle sky alert navigation status control meaning",
`<p>Console displays aboard Commission vessels follow <b>Standard 7</b>: flat colour on black, no gradation, no outline, no shadow, no small type. Nine colours are permitted — peach, salmon, tan, butterscotch, lilac, lavender, periwinkle, sky and an alert red-orange — and each is assigned a meaning that holds on every panel:</p>
<ul><li><b>Peach and salmon</b> — navigation between panels; salmon marks the panel you are on and the titles.</li>
<li><b>Lavender and lilac</b> — status: readouts, meters, records.</li>
<li><b>Butterscotch and tan</b> — controls: anything that changes the vessel's state.</li>
<li><b>Sky and periwinkle</b> — data: figures, results, chart features.</li>
<li><b>Red-orange</b> — alerts, and nothing else, ever.</li></ul>
<p>Under CONDITION ELEVATED the whole palette is pulled toward amber and under EMERGENCY toward the alert hue, so that the condition is visible from across a compartment without reading anything ([[TM-0110]]). The standard admits that structural blocks and controls look identical; it holds that a trained operator does not need them to differ, and that a console legible from the far side of a compartment is worth more than one that explains itself. See [[TM-0090]].</p>`, ["TM-0090", "TM-0110", "HX-010"]);

E("TM-0100", "ARBORETUM — DECK 9 HORTICULTURAL CONTROLS", "arboretum deck 9 horticulture plants beds moisture light hydroponics brannigan environmental supplement",
`<p>The <b>arboretum</b> on Deck 9 is a 140-square-metre planted compartment kept by the life sciences technician ([[PR-018]]). It supplements atmosphere loop 2 ([[TM-0040]]) by a few percent, supplies fresh produce to the mess on a schedule the quartermaster describes as "aspirational", and is, by a wide margin, the compartment the crew spends most of its off-watch time in.</p>
<p>Six planted beds are managed from the horticultural control panel, which reports moisture and light per bed and lets the keeper water or relight a bed. The panel is not on the main console's sidebar — it is a Deck 9 station — but it can be reached from this entry: [[panel:arboretum|HORTICULTURAL CONTROL]].</p>
<p>The beds run, from forward to aft: leaf crops, root crops, legumes, dwarf fruit, the herb bed and what the keeper's log calls "the garden proper", which grows nothing anyone eats and is the most visited of the six.</p>`, ["PR-018", "TM-0040", "panel:arboretum", "ML-410"]);

E("TM-0110", "ALERT CONDITION SIGNALLING", "alert condition signalling normal elevated emergency klaxon palette layout console reconfigure",
`<p>When the vessel's condition changes, every console aboard <b>reconfigures at once</b>. Under CONDITION ELEVATED the palette shifts toward amber, the frame breathes slowly and a soft double tone sounds every few seconds. Under EMERGENCY the palette shifts to the alert hue, the frame pulses, non-essential panels shrink on the sidebar to make room for Operations, Status and Engineering, an alert strip appears at the head of every panel naming the causes and their remedies, and the klaxon sounds until acknowledged.</p>
<p>Acknowledging silences the klaxon and changes nothing else. Standing down requires the causes to be cleared ([[PM-003]]). The full doctrine is [[PM-001]]. The colours are derived, not stored: there is one palette on this vessel and two ways of bending it ([[TM-0091]]).</p>`, ["PM-001", "PM-003", "TM-0091"]);

/* ---------------------------------------------------------------- PM ---- */
E("PM-001", "ALERT CONDITIONS — NORMAL, ELEVATED, EMERGENCY", "alert conditions doctrine normal elevated emergency thresholds set operator simulation stand down",
`<p>The vessel operates in one of three <b>conditions</b>.</p>
<p><b>CONDITION NORMAL.</b> Routine operations. All panels available. Palette as Standard 7.</p>
<p><b>CONDITION ELEVATED.</b> A hazard exists or a threshold has been crossed: environmental below 70%, hull stress below the drive rating's requirement, core temperature above 70%, or a debris encounter. Raised automatically by the console, or by the watch officer when a situation warrants readiness. The palette shifts amber.</p>
<p><b>CONDITION EMERGENCY.</b> Life or hull at risk: environmental below 40%, hull stress more than 25 points below requirement, core above 90%, hull strikes in progress. Raised automatically or by any officer. Klaxon, alert palette, sidebar reorganised.</p>
<p>The effective condition is the <b>higher</b> of the operator's setting and the console's own assessment. An operator may raise the condition at any time and may lower it only to the level the console will accept; the console states what prevents it. This is deliberate: a condition is a fact about the vessel, not an opinion about it. Standing down is [[PM-003]].</p>`, ["PM-003", "TM-0110", "TM-0021", "TM-0040"]);

E("PM-002", "POWER REALLOCATION PROCEDURE AND THE FIVE PROFILES", "power reallocation procedure profiles nominal survey cruise station minimum allocation steps refused",
`<p>Power is moved on the Operations console in <b>10 MW steps</b>, or by applying one of five profiles. A change is applied instantly and its consequences follow instantly; there is no confirmation step, because the grid's own refusals are the safeguard.</p>
<p><b>Before reallocating:</b> read the reserve figure. If the total you intend exceeds generation, shed first. If you intend to cut propulsion, check the drive rating; if hull stress, check the rating's requirement ([[TM-0021]]). If you intend to cut communications to zero, know that the phase lock will be lost in seconds ([[TM-0080]]).</p>
<p><b>The profiles.</b> NOMINAL restores design allocation (730 MW). SURVEY moves power from propulsion and hull stress into sensors and computing for station-keeping science (690 MW). CRUISE favours propulsion and hull stress for transit at high rating (740 MW). STATION is the quiet-watch profile: minimal propulsion, generous sensors, computing and communications (580 MW). MINIMUM (260 MW) is for running on the core alone at reduced output and will raise CONDITION ELEVATED on its own, because environmental at 80 MW is below the 70% threshold — apply it only with reason.</p>
<p>A profile is refused as a whole if any part of it would be refused alone.</p>`, ["TM-0012", "TM-0021", "TM-0080", "panel:ops"]);

E("PM-003", "STANDING DOWN FROM AN ALERT", "standing down alert stand down normal acknowledge causes cleared klaxon",
`<p>To return the vessel to CONDITION NORMAL:</p>
<ol><li><b>Acknowledge</b> the alert. This silences the klaxon. It does nothing else and is not a stand-down.</li>
<li><b>Read the causes</b> in the alert strip. Each names its remedy — restore environmental power above the threshold, raise hull stress power or lower the rating, reduce core output, hold position in the debris field.</li>
<li><b>Clear every cause.</b> The console re-assesses continuously; when its own assessment falls, the strip shortens.</li>
<li><b>Set CONDITION NORMAL</b> from the Operations console or the footer. If any cause remains, the console refuses and repeats the remedy. It is not being difficult. It is being right.</li></ol>
<p>A condition set by an operator above the console's assessment can be lowered at once. A condition the console itself insists on cannot be lowered by anyone ([[PM-001]]).</p>`, ["PM-001", "TM-0110"]);

E("PM-004", "DEBRIS FIELD TRANSIT", "debris field transit hull strikes hold position hull stress 100 percent procedure encounter",
`<p>Uncharted debris is the commonest hazard in the Reach and the one that most reliably tests a watch. When the sensors report a debris field ahead the console raises CONDITION ELEVATED on its own.</p>
<p><b>Immediate actions.</b> Either bring the <b>hull-stress compensation field to 100%</b> of nominal or better, or set <b>drive rating 0</b> and hold position until the field has been characterised. Either action is sufficient; both are prudent. If neither is taken within about half a minute the console will report hull strikes and escalate to EMERGENCY.</p>
<p><b>Duration.</b> Fields in the Reach are typically crossed, or characterised well enough to route around, in about two minutes. The console announces DEBRIS FIELD CLEARED and records the encounter in the event log. Stand down by [[PM-003]]. The Ossuary encounter ([[ML-102]]) is the reference case and the reason this procedure is worded as it is.</p>`, ["PM-003", "TM-0050", "ML-102"]);

E("PM-005", "CORE THERMAL EXCURSION RESPONSE", "core thermal excursion temperature response reduce output percent",
`<p>Core temperature rises whenever output is held above 100%. The console shows the temperature as a fraction of the design limit and raises CONDITION ELEVATED at 70% and EMERGENCY at 90%.</p>
<p><b>Response.</b> Reduce core output to 100% or below. If the allocation prevents the reduction — the console will say so — shed load first, in this order: sensors, computing, communications, propulsion (after reducing the drive rating), then medical, then and only then hull stress and environmental. Temperature falls at a fixed rate once output is at or below 100%; the excursion will clear on its own and the condition can then be stood down ([[PM-003]]). Do not take the auxiliary cells offline during an excursion; they are the load you will need to carry.</p>`, ["TM-0010", "PM-003", "PM-002"]);

E("PM-006", "SENSOR ARRAY FAULT ISOLATION", "sensor array fault isolation repair procedure isolate purge realign reset lateral spectrometer gravimetric processor",
`<p>Applies to faults on any sensor node: lateral arrays, spectrometer bank, gravimetric net, signal processor. A faulted node delivers a fraction of its throughput and the whole sensor trunk degrades in proportion ([[TM-0033]]).</p>
<p>On the Engineering console select SENSORS, then the faulted node, and perform:</p>
<ol><li><b>ISOLATE</b> the node from the trunk.</li><li><b>PURGE</b> its buffers and calibration tables.</li><li><b>REALIGN</b> against the reference source.</li><li><b>RESET</b> to return it to the trunk.</li></ol>
<p>Steps out of sequence are rejected and the sequence starts again. Each step takes a moment; the console shows WORKING. Four steps, in that order, every time.</p>`, ["TM-0030", "TM-0033", "panel:eng"]);

E("PM-007", "ATMOSPHERE LOOP AND ENVIRONMENTAL FAULT ISOLATION", "environmental atmosphere loop fault isolation repair isolate purge reset scrubber thermal water",
`<p>Applies to faults on the environmental nodes: either atmosphere loop, thermal regulation, water reclamation. A faulted loop reduces the trunk's throughput and may by itself push environmental below the 70% threshold ([[TM-0040]]); the alert that follows is real and should be treated as such — raise environmental allocation while the repair proceeds if the reserve allows.</p>
<p>On the Engineering console select ENVIRONMENTAL, then the node, and perform: <b>ISOLATE</b>, <b>PURGE</b>, <b>RESET</b>. Three steps. The procedure is deliberately short; the environmental technician's phrase is "you do not want to be reading while you cannot breathe."</p>`, ["TM-0040", "TM-0041", "TM-0042", "panel:eng"]);

E("PM-008", "DRIVE COOLANT AND PROPULSION FAULT ISOLATION", "propulsion drive fault isolation repair coolant injector coils controller isolate purge seed reset",
`<p>Applies to faults on the propulsion nodes: injector manifold, coolant loop, translation coils, drive controller. A propulsion fault reduces delivered power and therefore the available drive rating; if the vessel is under way the controller steps the rating down and the course takes longer ([[TM-0020]]).</p>
<p>On the Engineering console select PROPULSION, then the node, and perform: <b>ISOLATE</b>, <b>PURGE</b>, <b>SEED</b> (reload the node's operating parameters from the almanac), <b>RESET</b>. Four steps. Do not confuse this sequence with the sensor sequence ([[PM-006]]), which realigns rather than seeds; the console will reject the wrong step, but the time is lost.</p>`, ["TM-0020", "PM-006", "panel:eng"]);

E("PM-009", "HULL-STRESS EMITTER REALIGNMENT", "hull stress emitter realignment fault repair structural isolate realign reset",
`<p>Applies to faults on the hull-stress nodes: forward emitters, aft emitters, field generator, stress monitor. A faulted emitter lowers the field, and if the vessel is at a rating that needs the field the console will escalate on its own ([[TM-0021]]). <b>Reduce the drive rating first</b> if the reserve cannot cover the shortfall.</p>
<p>On the Engineering console select HULL STRESS, then the node, and perform: <b>ISOLATE</b>, <b>REALIGN</b>, <b>RESET</b>. Three steps; there is nothing to purge in an emitter.</p>`, ["TM-0050", "TM-0021", "panel:eng"]);

E("PM-010", "COMPUTING CORE FAILOVER", "computing core failover fault repair isolate seed acquire reset core a b index bus",
`<p>Applies to faults on the computing nodes: core A, core B, the retrieval index, the data bus. A computing fault slows the library and shortens its answers ([[TM-0060]]); a fault on core A specifically will make this very procedure harder to read, which is why it is short.</p>
<p>On the Engineering console select COMPUTING, then the node, and perform: <b>ISOLATE</b>, <b>SEED</b> (load the node's image from the other core), <b>ACQUIRE</b> (re-synchronise with the bus), <b>RESET</b>. Four steps.</p>`, ["TM-0060", "TM-0061", "panel:eng"]);

E("PM-011", "CLINICAL BAY POWER LOSS PROTOCOL", "medical clinical bay power loss protocol reserve pharmacy isolate reset",
`<p>When medical allocation falls below 50% the bay is flagged ON RESERVE POWER. Pharmacy stores begin to warm within the hour and the diagnostic table drops to manual mode. The protocol is to restore allocation before either matters; the medical officer's standing instruction is that the bay's 40 MW is "the cheapest thing on the ship and the last thing to cut."</p>
<p>For a node fault on the bay (diagnostic table, pharmacy stores, isolation ward): on the Engineering console select MEDICAL, then the node, and perform <b>ISOLATE</b>, <b>RESET</b>. Two steps. The bay's equipment is designed to be restarted by a nurse in the dark.</p>`, ["TM-0070", "PR-005", "panel:eng"]);

E("PM-012", "COMMUNICATIONS FAULT ISOLATION", "communications fault isolation repair buffers oscillator encoder isolate purge reset phase lock cold start",
`<p>Applies to node faults on the communications trunk: long-range array, reference oscillator, message buffers, encoder. On the Engineering console select COMMUNICATIONS, then the node, and perform <b>ISOLATE</b>, <b>PURGE</b>, <b>RESET</b>.</p>
<p><b>Distinguish a fault from a lost lock.</b> A fault shows on the node with a named cause. A lost phase lock shows on no node at all, because nothing is broken — the array is merely deaf. If the console reports PHASE LOCK LOST, this procedure will not help; use the cold start, [[TM-0447]].</p>`, ["TM-0080", "TM-0447", "panel:eng"]);

E("PM-013", "WATCH HANDOVER", "watch handover first second third watch officer duty roster procedure",
`<p>The vessel keeps three eight-hour watches: <b>FIRST</b> (00:00–08:00), <b>SECOND</b> (08:00–16:00) and <b>THIRD</b> (16:00–24:00), ship's time, counted from mission day 001. The duty roster ([[panel:personnel|PERSONNEL]]) shows who holds each.</p>
<p>At handover the outgoing watch officer states the condition, the power profile and reserve, the drive rating and course, any open faults and their procedure step, the communications state and any queued messages, and anything the console has refused in the last watch and why. The incoming officer repeats it back. The handover is logged. Nothing about this is automated and nothing about it should be.</p>`, ["panel:personnel", "PR-020", "PR-021"]);

E("PM-014", "LIBRARY QUERY PROTOCOL", "library query protocol computer prompt attention word natural language search intents distance status who is voice",
`<p>Address the library with the attention word <b>COMPUTER,</b> and a request. The parser ([[TM-0061]]) recognises:</p>
<ul><li><b>Status</b> — "status of sensors", "how is environmental", "power report", "what is the reserve".</li>
<li><b>Navigation</b> — "how far to Verrin", "distance to Kettleridge", "course to Brightwater", "where are we".</li>
<li><b>Personnel</b> — "who is the chief engineer", "who is Wren Tallis", "who is on watch".</li>
<li><b>Condition and time</b> — "what is the condition", "what time is it", "mission day".</li>
<li><b>Search</b> — anything else. "tell me about the gloss-moss", "cold start procedure", "debris".</li></ul>
<p>Queries may be spoken where the console's audio pickup is fitted and typed where it is not. Results are ranked; open one by pressing it. Every entry shows its cross-references as blocks at the foot, so a search can be followed by browsing. Bookmark what you will want again. The console remembers what you have read.</p>`, ["TM-0061", "TM-0060", "panel:library"]);

E("PM-015", "COURSE PLOTTING AND ENGAGEMENT", "course plotting engagement navigation plot engage abort drive rating transit time chart",
`<p>On the Navigation console ([[panel:nav|NAVIGATION]]) press a system on the chart to select it; the panel shows its distance from the vessel and the transit time at the present drive rating. <b>PLOT</b> lays the course. Set a drive rating from Operations or the navigation panel, checking the hull-stress requirement ([[TM-0021]]). <b>ENGAGE</b> begins the transit; the vessel's marker moves along the plotted legs and the mission clock advances. <b>ABORT</b> holds position wherever the vessel is.</p>
<p>Courses are plotted as two legs at right angles rather than as a straight line, which is a convention of the chart rather than of the drive: the chart is drawn to the same standard as the consoles and does not draw diagonals. Arrival sets the rating to 0 and holds position; the sensors then read the new system.</p>`, ["TM-0020", "TM-0021", "panel:nav"]);

E("PM-016", "EVACUATION STATIONS", "evacuation stations lifeboats muster procedure emergency",
`<p>Four twelve-person lifeboats on Deck 4 and the two survey launches on Deck 8 provide places for sixty-four, seventeen more than the complement. Muster is by department: Command and Operations to boats 1 and 2, Engineering to boat 3 and launch A, Science, Medical and Life Sciences to boat 4 and launch B. The watch officer musters last and confirms the count.</p>
<p>The order to evacuate is given by the survey commander or, in her absence, the first officer, and by no console. No panel on this vessel can launch a boat, on purpose.</p>`, ["PM-001", "PR-001", "PR-002"]);

/* ---------------------------------------------------------------- ML ---- */
E("ML-001", "COMMANDER'S LOG, MD 001 — DEPARTURE FROM KETTLERIDGE", "log departure kettleridge relay mission day 1 vane commander corvane reach survey begins",
`<p><i>Survey Commander Idris Vane.</i> Antiphon cleared Kettleridge Relay at 06:40 ship's time with forty-seven aboard, stores for four hundred days, and a nine-hundred-day plan that the Directorate describes as ambitious and the crew describes as a plan. Rating 4 to the Meridian Line, where we will begin the long baseline proper.</p>
<p>Stationmaster Quist saw us off with the traditional message from the relay — the same three words the first Antiphon's crew called across the water ([[HX-003]]) — and Calloway answered it correctly, which pleased him. First watch is Abara's. The arboretum is planted. The number of things that can go wrong is very large and I have decided not to count them today.</p>`, ["HX-003", "PR-001", "SV-015"]);

E("ML-018", "COMMANDER'S LOG, MD 018 — THE MERIDIAN LINE", "log meridian line crossing baseline survey begins mission day 18",
`<p><i>Survey Commander Idris Vane.</i> We crossed the Meridian Line at 14:02 — an agreed boundary drawn on a chart, marked by nothing, invisible on every instrument we own ([[HX-002]]). Petrakis nevertheless marked the moment on the chart in the mess and the second watch made rather a lot of it.</p>
<p>The long baseline begins here: the gravimetric net at full aperture, the laterals sweeping, the spectrometer logging every star we pass. Quill has asked for the SURVEY power profile as the standing configuration and I have agreed, with the condition that the watch officer restores NOMINAL before any transit above rating 5. Okonkwo-Reyes wants it noted that this condition will be forgotten by somebody within a month. Noted.</p>`, ["HX-002", "PM-002", "PR-004"]);

E("ML-044", "SCIENCE LOG, MD 044 — CINDER ROW", "log cinder row red dwarfs triple survey quill science tidally locked",
`<p><i>Science Lead Dr Amaranth Quill.</i> Three red dwarfs in a tight hierarchy, one small tidally locked world around the middle one, and nothing else ([[SV-003]]). It took eleven days to say that with confidence and the crew is restless in a way that surprises me on day forty-four; I had expected it around day two hundred.</p>
<p>Anand says the restlessness is normal and healthy and that I should be worried when it stops. Brannigan has responded by announcing a tomato. There is, as yet, no tomato.</p>`, ["SV-003", "PR-004", "PR-018"]);

E("ML-071", "SCIENCE LOG, MD 071 — VERRIN II AND THE DRIFTERS", "log verrin drifters aerial filter feeders first observation ocean world biology varga-adichie",
`<p><i>Dr Ilse Varga-Adichie, xenobiologist.</i> Verrin II is an ocean world with an oxygen atmosphere and a permanent cloud deck at four kilometres, and the cloud deck is inhabited. The <b>drifters</b> ([[SV-006]]) are filter-feeding aerial organisms — sacs of lifting gas trailing feeding fronds — moving in loose flocks of several hundred along the equatorial jet. They are not sapient by any test we can apply from orbit and I would like it recorded that we did not try very hard, because the correct thing to do with a biosphere you have just found is to look at it and leave.</p>
<p>We spent nine days in orbit at STATION profile with sensors at 130% and it was the best nine days of my professional life. Oduya cried. Lindqvist pretended not to.</p>`, ["SV-006", "SV-005", "PR-023"]);

E("ML-102", "COMMANDER'S LOG, MD 102 — OSSUARY DEBRIS RING, HULL STRIKE", "log ossuary debris ring hull strike white dwarf emergency structural field lesson procedure",
`<p><i>Survey Commander Idris Vane.</i> We took hull strikes in the Ossuary ring at 03:10 during the first watch. The field was at 75% because the standing profile was SURVEY and the ring was denser than the long-range survey had shown ([[SV-007]]). The console went to ELEVATED on its own when the debris registered and to EMERGENCY forty seconds later when the strikes began, which was exactly right and exactly too late to be comfortable.</p>
<p>Abara did the correct thing — rating 0, field to 100% — and we sat in the ring for two hours while Vasquez-Ng walked the hull. Frame 47 has a dent and a name now. Nobody hurt. I have rewritten the debris procedure ([[PM-004]]) so that the first line is the action and not the explanation, and I have rewritten my standing order on the SURVEY profile so that it no longer depends on anyone's memory.</p>`, ["SV-007", "PM-004", "PR-020", "PR-010"]);

E("ML-140", "SCIENCE LOG, MD 140 — NINE LANTERNS", "log nine lanterns open cluster survey blue stars cantor rendezvous",
`<p><i>Science Lead Dr Amaranth Quill.</i> Nine hot young stars in a volume you could cross in a day at rating 6, throwing enough light that the arboretum's keeper asked whether he could turn his lamps off and open a port. He could not. The cluster is fully charted ([[SV-009]]); we met OSV Cantor here on day 134 and the two ships spent three days alongside comparing calibrations and, according to the quartermaster, spare parts.</p>
<p>Cantor will work the Lanterns and the Marrow for the rest of the year while we go on to Halveth's Star. Brask and Vane have agreed a schedule of correspondence by relay. I gather the two commanders have been writing to each other since the academy and that the schedule is a formality.</p>`, ["SV-009", "SV-011", "PR-001"]);

E("ML-188", "QUARTERMASTER'S LOG, MD 188 — LANTERN HILL, FIRST RESUPPLY", "log lantern hill resupply tender quartermaster adeyemi stores rendezvous",
`<p><i>Quartermaster Fenwick Adeyemi.</i> The tender Lantern Hill met us as scheduled and transferred two hundred days of consumables, twelve pharmacy pallets, a replacement spectrometer detector and a crate addressed to the arboretum that turned out to contain soil. Master Farrant asked why a ship with a water reclamation plant needed six hundred kilograms of dirt and was told by Brannigan, at length.</p>
<p>The next rendezvous is set for MD 400 at Halveth's Star. I have provisioned to MD 430 on the assumption that tenders are late, because tenders are late.</p>`, ["PR-012", "PR-018", "ML-410"]);

E("ML-231", "SCIENCE LOG, MD 231 — TOLMACH'S ANOMALY, FIRST PASS", "log tolmach anomaly dark compact object first pass gravimetric no optical counterpart",
`<p><i>Science Lead Dr Amaranth Quill.</i> A mass of roughly two stellar masses with no optical counterpart, a thin ionised halo and nothing in orbit ([[SV-010]]). The gravimetric net found it at long range and the laterals found nothing at short range, which is the definition of the class. We made one pass at rating 2 with hull stress at 100% because Okonkwo-Reyes does not trust things he cannot see, and I do not blame him.</p>
<p>I have flagged the Anomaly for a second visit on the return leg. There is something in the halo's spectrum that Tanaka-Ferreira describes as "tidy" and I would like to know what he means.</p>`, ["SV-010", "SV-016", "PR-008"]);

E("ML-266", "ENGINEERING LOG, MD 266 — MARROW DEEP, SENSORS IN THE DARK", "log marrow deep nebula dust sensors degraded engineering okonkwo-reyes power sensors 150 percent",
`<p><i>Chief Engineer Tomasz Okonkwo-Reyes.</i> Six days at the edge of the Marrow with the sensors at 150% and everything else at what the chart in the mess is now calling "the diet". The dust cuts the laterals' reach by half and the science team's answer was to feed the arrays until the grid complained, which it did, in writing, forty-one times. I have kept the refusals. They are a useful record of exactly where the limits are.</p>
<p>The embedded source in the core of the nebula is probably a protostar ([[SV-011]]). It is definitely warm. Solvang would like it noted that running the ship this hard on environmental at 100% for a week is fine and that running it at 90% would not have been, and that she was asked.</p>`, ["SV-011", "TM-0033", "PR-003", "PR-009"]);

E("ML-301", "MEDICAL LOG, MD 301 — A NOTE ON THE CREW", "log medical crew wellbeing anand morale three hundred days routine",
`<p><i>Dr Sefu Anand, medical officer.</i> Three hundred days out. Forty-seven people, no serious injury, one broken wrist (the arboretum ladder), the usual colds, and a level of low-grade grievance about the mess rota that I regard as the healthiest sign on the ship. Sleep is good. Nobody is drinking anything they should not be. The watch officers have kept the handover ritual ([[PM-013]]) without being told to and I think it does more for us than the pharmacy does.</p>
<p>I have asked the commander for a second nurse at the next rotation and been given the answer I expected. Kowalczyk has asked me to stop asking, on the grounds that it makes him look indispensable, which he is.</p>`, ["PR-005", "PR-016", "PM-013"]);

E("ML-340", "COMMANDER'S LOG, MD 340 — THE AUDITOR", "log auditor marsh commission systems audit arrives cantor transfer",
`<p><i>Survey Commander Idris Vane.</i> Systems Auditor Gideon Marsh joined us today by launch from Cantor, who had him from the relay, who had him from the Directorate, who did not warn me ([[PR-024]]). He is here to audit "power discipline and procedural compliance" for the Commission's mid-mission review and has already read the grid's refusal log, all of it, with what I can only call enjoyment.</p>
<p>I have given him the run of the consoles and quarters on Deck 3. He has given me a form. Okonkwo-Reyes has given him a look. Tallis has given him nothing at all, which I am told is characteristic.</p>`, ["PR-024", "PR-013", "PR-003"]);

E("ML-377", "COMMANDER'S LOG, MD 377 — HALVETH'S STAR", "log halveth star arrival station keeping gloss moss survey buoy",
`<p><i>Survey Commander Idris Vane.</i> Arrived Halveth's Star and took up station at Halveth III, the gloss-moss world ([[SV-002]]). This is the anchor of the long baseline: we hold here for sixty days, take the deep gravimetric series that the whole mission exists to take, meet the tender, and turn for home by way of the Anomaly. Survey Buoy 47 was deployed at 11:15 and is answering.</p>
<p>The gloss-moss is exactly as the probes described it and more beautiful than they could. Varga-Adichie has asked for a landing. The Commission's rule on biospheres is clear and I have said no, and I have said it while wanting very badly to say yes, which I record so that the next commander knows it is possible.</p>`, ["SV-001", "SV-002", "PR-023"]);

E("ML-398", "SENSOR LOG, MD 398 — SIGNAL 47, FIRST DETECTION", "log signal 47 first detection periodic 47 seconds tolmach direction tanaka-ferreira",
`<p><i>Sensor Specialist Rudo Tanaka-Ferreira.</i> At 02:51, during the deep gravimetric series, the signal processor flagged a periodic component in the long-range data with a period of <b>47.0 seconds</b>, bearing consistent with Tolmach's Anomaly at eighteen light-years. It is weak, it is regular, and when I fold the data on the period there is structure inside each cycle that I cannot yet explain ([[SV-016]]).</p>
<p>I have named it Signal 47 because the science lead said I could not call it anything else and be taken seriously. Calloway has asked Cantor whether they see it. Marsh has asked whether the detection was made under an approved power profile. It was.</p>`, ["SV-016", "SV-010", "PR-008", "ML-405"]);

E("ML-405", "SCIENCE LOG, MD 405 — CANTOR SEES IT TOO", "log cantor signal 47 confirmation correspondence structure period brask",
`<p><i>Science Lead Dr Amaranth Quill.</i> Cantor confirms a 47-second periodic component from the same bearing. That rules out an instrument fault local to us, and the first watch has taken it as licence to speculate. I have asked them to speculate quietly.</p>
<p>The structure inside the cycle is the troubling part. It is too regular for a natural rotator and too simple for a message, and Tanaka-Ferreira says it looks like something beating against something. I have asked him what, precisely, aboard this vessel has a period of forty-seven seconds. He has gone to look at the gravimetric net's manual ([[TM-0032]]) with an expression I recognise. The correspondence with Cantor is in the communications log.</p>`, ["SV-016", "TM-0032", "ML-398", "panel:comms"]);

E("ML-410", "QUARTERMASTER'S LOG, MD 410 — LANTERN HILL OVERDUE", "log lantern hill overdue tender resupply stores rationing pharmacy arboretum",
`<p><i>Quartermaster Fenwick Adeyemi.</i> Lantern Hill is ten days overdue and the relay has no traffic from her since MD 391. I have provisioned to MD 430 and we will make it, but the pharmacy is thinner than Anand likes and the mess is on the arboretum's schedule, which means the arboretum is suddenly the most important compartment on the ship and its keeper has become insufferable.</p>
<p>The commander has asked the Directorate for an update by relay. I have asked Brannigan for the tomato. Both of us are waiting.</p>`, ["ML-188", "PR-012", "PR-018", "TM-0100", "panel:comms"]);

E("ML-412", "COMMANDER'S LOG, MD 412 — TODAY", "log today current mission day 412 station keeping halveth status summary",
`<p><i>Survey Commander Idris Vane.</i> Day four hundred and twelve. Station-keeping at Halveth III; the deep series is thirty-five days complete of sixty. Tender overdue, Directorate queried. Signal 47 under analysis; Tanaka-Ferreira has a theory he is not yet willing to write down. The auditor has requested access to the alert log, the refusal log and, this morning, the arboretum's watering schedule, which I have granted because I could not think of a reason not to.</p>
<p>The console in front of you holds the vessel as she is at this moment. What you move, moves. What you cut, degrades. The grid will tell you when you have gone too far, and the grid is never wrong; it is only ever unwelcome. Handover to the second watch at 08:00 was clean. Osei-Lund has the third.</p>`, ["ML-410", "ML-405", "PR-001", "panel:ops"]);

const P = (id, name, rank, dept, watch, body, tags, xrefs) => E(id, `${name} — ${rank}`, `personnel crew ${name.toLowerCase()} ${rank.toLowerCase()} ${dept.toLowerCase()} ${tags || ""}`, body, xrefs);
P("PR-001", "IDRIS VANE", "SURVEY COMMANDER", "COMMAND", "SECOND",
`<p><b>Idris Vane</b> (she/her). Commanding officer, OSV Antiphon. Twenty-two years in Commission service; second command; previously first officer of OSV Halcyon Gate on her final survey ([[HX-008]]), an experience that shaped her attitude to communications discipline and, her officers say, to everything else.</p>
<p>Known for rewriting procedures so that the first sentence is the action. Keeps the commander's log in plain language and expects the same from others. Off watch: plays a stringed instrument badly and knows it.</p>`, "commanding officer captain", ["ML-001", "ML-412", "HX-008"]);
P("PR-002", "HALLORAN MBEKI-SATO", "FIRST OFFICER", "COMMAND", "FIRST",
`<p><b>Halloran Mbeki-Sato</b> (he/him). First officer. Fourteen years' service; qualified in navigation and engineering, which is unusual and makes him the officer the chief engineer argues with least. Holds the first watch by preference — "the ship is honest at three in the morning" — and runs the handover ritual ([[PM-013]]) as if it were a sacrament.</p>`, "executive officer xo", ["PM-013", "PR-001"]);
P("PR-003", "TOMASZ OKONKWO-REYES", "CHIEF ENGINEER", "ENGINEERING", "SECOND",
`<p><b>Tomasz Okonkwo-Reyes</b> (he/him). Chief engineer, responsible for the core, the drive, the field and the grid ([[TM-0012]]). Nineteen years' service, the last eleven in Kestrel-class engine rooms. Keeps the grid's refusal log and reads it aloud in the mess when he thinks a point needs making. Author of the phrase "the grid is never wrong; it is only ever unwelcome," which the commander has since borrowed without attribution.</p>`, "engineer core drive", ["TM-0012", "TM-0021", "ML-266"]);
P("PR-004", "DR AMARANTH QUILL", "SCIENCE LEAD", "SCIENCE", "SECOND",
`<p><b>Dr Amaranth Quill</b> (they/them). Science lead; principal investigator of the Corvane Reach Long-Baseline Survey. Gravimetrist by training. Wrote the survey plan and defends it, and has been known to trade a day of transit for an hour of data. Responsible for the standing SURVEY power profile and for the arguments about it ([[ML-018]], [[ML-266]]).</p>`, "scientist principal investigator", ["ML-018", "ML-266", "SV-016"]);
P("PR-005", "DR SEFU ANAND", "MEDICAL OFFICER", "MEDICAL", "SECOND",
`<p><b>Dr Sefu Anand</b> (he/him). Medical officer, clinical bay, Deck 5 ([[TM-0070]]). Has served on three long surveys and holds firm views on sleep, rotas and the number of nurses a forty-seven-person vessel requires (two). Records the crew's grievances as vital signs. Standing instruction on the medical trunk: "the cheapest thing on the ship and the last thing to cut."</p>`, "doctor physician", ["TM-0070", "ML-301", "PM-011"]);
P("PR-006", "PELL ARKWRIGHT", "NAVIGATOR", "OPERATIONS", "THIRD",
`<p><b>Pell Arkwright</b> (she/her). Navigator. Plots the courses, keeps the chart and owns the rating-nine paradox ([[TM-0021]]) in the sense that she is the one who has to explain it to everyone who asks why the ship cannot simply go faster. Prefers rating 6 for transit and has the figures to defend it.</p>`, "navigation courses chart", ["PM-015", "TM-0021", "panel:nav"]);
P("PR-007", "INES CALLOWAY", "COMMUNICATIONS OFFICER", "OPERATIONS", "SECOND",
`<p><b>Ines Calloway</b> (she/her). Communications officer; keeper of the phase lock ([[TM-0080]]) and of the correspondence log. Answered the relay's departure message correctly on MD 001 and has not let anyone forget it. Maintains the schedule of exchanges with OSV Cantor and the increasingly pointed queries to the Directorate about the tender.</p>`, "comms signals relay", ["TM-0080", "TM-0447", "panel:comms"]);
P("PR-008", "RUDO TANAKA-FERREIRA", "SENSOR SPECIALIST", "SCIENCE", "FIRST",
`<p><b>Rudo Tanaka-Ferreira</b> (he/him). Sensor specialist; runs the signal processor stack ([[TM-0033]]) and the arrays. Discovered Signal 47 ([[ML-398]]) and named it, then spent two weeks trying to un-discover it, which he regards as the correct order of operations. Has the gravimetric net's manual open on his console at present and a theory he will not yet write down.</p>`, "sensors signal 47", ["TM-0033", "ML-398", "SV-016"]);
P("PR-009", "MARIT SOLVANG", "ENVIRONMENTAL SYSTEMS TECHNICIAN", "ENGINEERING", "THIRD",
`<p><b>Marit Solvang</b> (she/her). Environmental systems technician; the atmosphere loops, thermal regulation and water reclamation are hers ([[TM-0040]]). Author of the procedure note "you do not want to be reading while you cannot breathe" ([[PM-007]]). Sits on the environmental watch with the arboretum's keeper and has opinions about his soil.</p>`, "environmental life support", ["TM-0040", "PM-007", "ML-266"]);
P("PR-010", "DION VASQUEZ-NG", "STRUCTURAL ENGINEER", "ENGINEERING", "FIRST",
`<p><b>Dion Vasquez-Ng</b> (he/him). Structural engineer; the hull-stress compensation field and the hull it protects ([[TM-0050]]). Walked the hull after the Ossuary strikes ([[ML-102]]) and named the dent on frame 47, a name the crew now uses for the frame, the dent and, occasionally, the engineer.</p>`, "structural hull field", ["TM-0050", "PM-009", "ML-102"]);
P("PR-011", "OYELARAN BASSEY", "COMPUTING SYSTEMS OFFICER", "OPERATIONS", "SECOND",
`<p><b>Oyelaran Bassey</b> (she/her). Computing systems officer; cores A and B, the retrieval index and the parser ([[TM-0060]], [[TM-0061]]). Wrote the parser's intent list and its refusals. Maintains that the library is the most important system on the ship because it is the only one that remembers, and has never lost the argument because nobody has been willing to have it.</p>`, "computer library index", ["TM-0060", "TM-0061", "PM-014"]);
P("PR-012", "FENWICK ADEYEMI", "QUARTERMASTER", "OPERATIONS", "THIRD",
`<p><b>Fenwick Adeyemi</b> (he/him). Quartermaster; stores, consumables, the mess rota and the correspondence with tenders ([[ML-188]], [[ML-410]]). Provisions on the assumption that tenders are late. Has been right every time and takes no pleasure in it, or says so.</p>`, "stores supplies", ["ML-188", "ML-410"]);
P("PR-013", "WREN TALLIS", "SUB-LIEUTENANT", "SPECIAL PROJECTS", "VARIOUS",
`<p><b>Wren Tallis</b> (they/them). Sub-Lieutenant. Assignment: <b>Special Projects (Liaison)</b>. Reports to: <i>see attached</i>. There is nothing attached.</p>
<p>Duty station: various. Watch: as required. Quarters: Deck 3, cabin 47, which the quartermaster notes is listed as a storeroom on the yard drawings. Qualifications: <i>on file</i>. Duty log for the last thirty days, in full: "Present." "Present." "Present." "Not present." "Present." The auditor has asked three times what Special Projects are and has received on each occasion a courteous and complete answer that nobody present could afterwards recall.</p>
<p>The commander's only annotation to this record reads: "Leave it."</p>`, "liaison special projects vague mysterious", ["PR-024", "ML-340"]);
P("PR-014", "KASPAR LINDQVIST", "JUNIOR SURVEYOR", "SCIENCE", "THIRD",
`<p><b>Kaspar Lindqvist</b> (he/him). Junior surveyor, first long survey. Runs the spectrometer bank under Tanaka-Ferreira and keeps the stellar catalogue. Did not cry at Verrin II ([[ML-071]]) and would like the record to show that he did not.</p>`, "junior surveyor", ["ML-071", "TM-0031"]);
P("PR-015", "NIA ODUYA", "JUNIOR SURVEYOR", "SCIENCE", "FIRST",
`<p><b>Nia Oduya</b> (she/her). Junior surveyor, first long survey. Runs the laterals on the first watch and is the reason the Halveth ice belt is catalogued to a precision Quill calls "unnecessary and wonderful." Cried at Verrin II and says so.</p>`, "junior surveyor", ["ML-071", "SV-001"]);
P("PR-016", "BERTRAM KOWALCZYK", "NURSE", "MEDICAL", "THIRD",
`<p><b>Bertram Kowalczyk</b> (he/him). Nurse, clinical bay. The only nurse. Can restart every piece of equipment in the bay in the dark ([[PM-011]]) and has. Has asked the medical officer to stop asking for a second nurse, on grounds of vanity, and been refused.</p>`, "nurse medical", ["TM-0070", "PM-011", "ML-301"]);
P("PR-017", "SIGRUN ACHTERBERG", "PROPULSION TECHNICIAN", "ENGINEERING", "FIRST",
`<p><b>Sigrun Achterberg</b> (she/her). Propulsion technician; the injector manifold, coolant loop, translation coils and controller are hers to keep ([[TM-0020]]). Runs the drive fault procedure ([[PM-008]]) faster than the console can display it and regards this as the minimum standard.</p>`, "propulsion drive technician", ["TM-0020", "PM-008"]);
P("PR-018", "YUSUF BRANNIGAN", "LIFE SCIENCES TECHNICIAN", "LIFE SCIENCES", "SECOND",
`<p><b>Yusuf Brannigan</b> (he/him). Life sciences technician; keeper of the arboretum ([[TM-0100]]) and member of the environmental watch. Requested six hundred kilograms of soil from the tender and got it. Has promised a tomato since MD 044. Since the tender went overdue his compartment has become the most important on the ship and he has, by every account including his own, become insufferable.</p>`, "arboretum horticulture gardener", ["TM-0100", "ML-044", "ML-410", "panel:arboretum"]);
P("PR-019", "LIOR PETRAKIS", "CARTOGRAPHER", "SCIENCE", "SECOND",
`<p><b>Lior Petrakis</b> (they/them). Cartographer; keeps the chart of the Reach in the library and the larger one in the mess, on which the Meridian Line is marked in a colour that is not in Standard 7 and about which the commander has decided to say nothing. Named Thessaly Gap and refuses to say after what.</p>`, "cartographer chart map", ["SV-019", "HX-005", "panel:nav"]);
P("PR-020", "CONSTANCE ABARA", "WATCH OFFICER", "COMMAND", "FIRST",
`<p><b>Constance Abara</b> (she/her). Watch officer, first watch. Had the watch during the Ossuary strikes ([[ML-102]]) and did the right thing in the right order without the procedure in front of her, which is why the procedure now reads the way she did it. Holds that the handover is the most important eight minutes of the day.</p>`, "watch officer", ["ML-102", "PM-013"]);
P("PR-021", "DMITRI OSEI-LUND", "WATCH OFFICER", "COMMAND", "THIRD",
`<p><b>Dmitri Osei-Lund</b> (he/him). Watch officer, third watch. Qualified on every console aboard and teaches the junior surveyors the Operations station on the grounds that "everyone should be refused by the grid at least once before they have opinions about it." Has the third watch today ([[ML-412]]).</p>`, "watch officer", ["ML-412", "PM-013"]);
P("PR-022", "TAMSIN ROQUE", "ENGINEERING APPRENTICE", "ENGINEERING", "THIRD",
`<p><b>Tamsin Roque</b> (she/her). Engineering apprentice; first posting. Keeps the fault log and, since MD 266, the refusal log the chief engineer reads from in the mess ([[ML-266]]). Broke her wrist on the arboretum ladder on MD 219 and has not been allowed to forget it by the medical officer, the keeper or the ladder.</p>`, "apprentice", ["ML-266", "ML-301"]);
P("PR-023", "DR ILSE VARGA-ADICHIE", "XENOBIOLOGIST", "SCIENCE", "FIRST",
`<p><b>Dr Ilse Varga-Adichie</b> (she/her). Xenobiologist. Described the Verrin drifters ([[SV-006]]) and the Halveth gloss-moss ([[SV-002]]) and asked for a landing at both, and was refused at both under the Commission's rule on biospheres, and agrees with the rule, and asked anyway. Holds that the correct thing to do with a biosphere is to look at it and leave.</p>`, "biologist xenobiology species", ["SV-006", "SV-002", "ML-071"]);
P("PR-024", "GIDEON MARSH", "SYSTEMS AUDITOR", "COMMISSION (ATTACHED)", "SECOND",
`<p><b>Gideon Marsh</b> (he/him). Systems auditor, attached from the Directorate at Harrowgate on MD 340 ([[ML-340]]) to audit power discipline and procedural compliance for the mid-mission review. Has read the grid's refusal log in its entirety, with evident enjoyment. Has asked what Special Projects are, three times ([[PR-013]]). Is, the commander notes, "perfectly pleasant and completely unnerving, which I assume is the job."</p>`, "auditor commission inspector", ["ML-340", "PR-013"]);

E("SV-001", "HALVETH'S STAR SYSTEM", "halveth star system k3 survey current position station keeping planets ice belt buoy",
`<p><b>Halveth's Star</b>, K3 main sequence, 42 light-years from Kettleridge Relay. Four planets and an outer ice belt. Halveth I and II are airless and thinly-aired rock respectively; Halveth III is the gloss-moss world ([[SV-002]]); Halveth IV is a gas giant with a modest ring. The ice belt at 7.5 astronomical units is catalogued to a precision the science lead calls unnecessary ([[PR-015]]).</p>
<p>The system is the anchor of the long baseline. Antiphon has held station at Halveth III since MD 377 ([[ML-377]]) taking the deep gravimetric series. Survey Buoy 47 is in orbit alongside and will remain as a permanent reference when the vessel departs.</p>`, ["SV-002", "ML-377", "panel:nav", "panel:sensors"]);

E("SV-002", "HALVETH III AND THE GLOSS-MOSS", "halveth iii gloss moss chemosynthetic mat biosphere species reflective",
`<p><b>Halveth III</b> is a cool, dim world under a K3 star, with a thin nitrogen atmosphere and a surface two-thirds covered by the organism the probes named <b>gloss-moss</b>: a chemosynthetic mat, centimetres thick, continental in extent, whose upper surface is mirror-bright. The gloss is a layer of mineral platelets the mat secretes and orients toward the star, and from orbit the day side flashes as the planet turns.</p>
<p>The mat is alive by every criterion the survey applies and is not, by any, sapient. It is the largest single organism the Commission has recorded. The Commission's rule on biospheres forbids landing; the xenobiologist ([[PR-023]]) asked, was refused ([[ML-377]]), and agrees with the refusal. Sensors at station read the mat's reflectance cycle directly and the crew has taken to watching it at shift change.</p>`, ["SV-001", "PR-023", "ML-377"]);

E("SV-003", "CINDER ROW", "cinder row triple red dwarf system tidally locked rock",
`<p><b>Cinder Row</b>: three M4 red dwarfs in a hierarchical triple, the inner pair separated by a fraction of an astronomical unit and the third at eleven. One small world, Cinder B-1, tidally locked to the middle star, with a permanent day side hot enough to soften lead and a night side cold enough to freeze the atmosphere it does not have. Eleven days of survey ([[ML-044]]) established that this is the complete inventory. The name is the cartographer's and refers to the colour.</p>`, ["ML-044", "PR-019"]);

E("SV-004", "VERRIN SYSTEM", "verrin f8 system ocean world ice giant survey",
`<p><b>Verrin</b>, F8 main sequence, 23 light-years from the relay. Three planets: Verrin I, a molten rock inside half an astronomical unit; Verrin II, the ocean world ([[SV-005]]); Verrin III, an ice giant at six astronomical units with a fractured icy moon. The system is the first in the Reach where the survey found life, and the entry for Verrin II is accordingly the longest in the survey corpus and the one the crew re-reads.</p>`, ["SV-005", "SV-006"]);

E("SV-005", "VERRIN II — OCEAN WORLD", "verrin ii ocean world atmosphere oxygen cloud deck equatorial jet",
`<p><b>Verrin II</b>: 1.4 astronomical units from an F8 star, a global ocean averaging four kilometres deep, an oxygen-nitrogen atmosphere and a permanent cloud deck at about four kilometres altitude that the equatorial jet drives around the planet in nine local days. No land above the waterline. The oxygen is biological in origin; the ocean is full of something photosynthetic that the survey could not resolve from orbit and did not attempt to sample.</p>
<p>The cloud deck is inhabited by the drifters ([[SV-006]]). Antiphon held station for nine days at 130% sensor power ([[ML-071]]) and departed without landing.</p>`, ["SV-004", "SV-006", "ML-071"]);

E("SV-006", "VERRIN DRIFTERS — SPECIES RECORD", "drifters species verrin aerial filter feeder lifting gas flocks biology non-sapient",
`<p><b>Verrin drifters.</b> Aerial filter-feeding organisms of the Verrin II cloud deck ([[SV-005]]). Body plan: a translucent lifting sac two to six metres across, filled with a biologically produced light gas, trailing feeding fronds of ten to thirty metres. They graze the aerial plankton of the cloud deck, moving in loose flocks of several hundred along the equatorial jet. Flocks appear to co-ordinate — the survey recorded the whole flock rising through the deck ahead of a storm cell — by a means not determined.</p>
<p>Assessment: not sapient by any test applicable from orbit; the xenobiologist's record ([[ML-071]]) notes that the survey did not try very hard, on principle. No landing, no sampling, no contact. Recommended for a dedicated biological mission with a proper ethics board and a great deal more patience than a long-baseline survey can spare. The crew's favourite entry in the library, by the library's own count.</p>`, ["SV-005", "ML-071", "PR-023"]);

E("SV-007", "OSSUARY — WHITE DWARF WITH DEBRIS RING", "ossuary white dwarf debris ring dense fragments hull strike derelict faint contact",
`<p><b>Ossuary</b>: a white dwarf 33 light-years from the relay, orbited at a third of an astronomical unit by a dense ring of planetary debris — the remains of an inner system consumed when the star left the main sequence. Two large core fragments are catalogued. The ring is denser than the long-range survey suggested, which Antiphon learned by taking hull strikes in it on MD 102 ([[ML-102]]).</p>
<p>A faint, regular, metallic contact at half an astronomical unit registered once, on the extended-range sensor mode, and could not be re-acquired at nominal power. It is logged as a possible derelict and is not further characterised. The name is the cartographer's.</p>`, ["ML-102", "PM-004", "TM-0033"]);

E("SV-008", "PALE AND DARK SISTERS", "pale dark sisters binary a2 m6 scorched rock",
`<p>A wide binary: <b>Pale Sister</b>, an A2 main-sequence star, and <b>Dark Sister</b>, an M6 red dwarf at 41 astronomical units. One scorched rock orbits the primary at 1.9 astronomical units. The pair is a useful calibration source for the spectrometer bank, being two well-behaved stars of very different class in one field, and Lindqvist ([[PR-014]]) has used it as such. Nothing else of note. The names are older than the survey and their origin is not recorded.</p>`, ["PR-014", "TM-0031"]);

E("SV-009", "NINE LANTERNS — OPEN CLUSTER", "nine lanterns open cluster young blue stars cantor",
`<p><b>Nine Lanterns</b>: an open cluster of nine hot young stars — one B9 giant and eight A-class dwarfs — within a volume six light-years across, 45 light-years from the relay. Bright enough at the cluster's heart to read by. No planets found around any member; the cluster is too young. Surveyed MD 134–140 ([[ML-140]]) in company with OSV Cantor, which continues to work the cluster and the adjacent Marrow Deep ([[SV-011]]) and is the vessel's correspondent by relay.</p>`, ["ML-140", "SV-011", "panel:comms"]);

E("SV-010", "TOLMACH'S ANOMALY — DARK COMPACT OBJECT", "tolmach anomaly dark compact object two solar masses halo ionised signal 47 source",
`<p><b>Tolmach's Anomaly</b>: a compact, non-luminous mass of roughly two solar masses, 60 light-years from the relay, with a thin ionised gas halo and no companion. Found by the gravimetric net at long range; invisible to the laterals at short range ([[ML-231]]). Named for the gravimetrist who predicted such an object in the Reach from the motions of neighbouring stars a generation before anyone went to look.</p>
<p>The bearing of Signal 47 ([[SV-016]]) is consistent with the Anomaly. On the extended-range sensor mode a structured periodic source registers in the halo. The second visit, on the return leg, is the most anticipated event of the remaining mission.</p>`, ["ML-231", "SV-016", "ML-398"]);

E("SV-011", "MARROW DEEP — DARK NEBULA", "marrow deep dark nebula dust protostar embedded source sensors half range",
`<p><b>Marrow Deep</b>: a dark nebula some four light-years across, 52 light-years from the relay, opaque at optical wavelengths and dense enough to halve the laterals' reach at its margin ([[ML-266]]). An embedded warm source at its core is provisionally a protostar. Antiphon surveyed the margin for six days at 150% sensor power; the interior is left to Cantor. The name was given by the first survey to sight it and refers, the cartographer says, to the colour of the thing in the middle.</p>`, ["ML-266", "SV-009"]);

E("SV-012", "SALTMARSH AND THE RATTLERS", "saltmarsh k7 brine flats crystal fields rattlers pseudo-life mineral growth",
`<p><b>Saltmarsh</b>, K7 main sequence, 71 light-years from the relay. Saltmarsh I is a small world of brine flats and crystal fields, and the crystal fields are the interesting part: the <b>rattlers</b> are mineral growths, metres tall, that fracture and regrow on a cycle tied to the planet's day and emit a sharp acoustic click as they do. From orbit the fields chatter. Whether the rattlers meet any definition of life is a question the survey has referred upward, having no wish to be the ones to answer it. Not yet visited by Antiphon; data from the probe survey.</p>`, ["SV-013", "HX-009"]);

E("SV-013", "BRIGHTWATER AND THE LAMP-EELS", "brightwater g0 ocean world bioluminescent lamp eels species",
`<p><b>Brightwater</b>, G0 main sequence, 74 light-years from the relay. Brightwater II is a second ocean world, warmer than Verrin II and without its cloud deck, and its night side glows: the <b>lamp-eels</b>, serpentine bioluminescent organisms of the upper ocean, gather in schools kilometres across whose light is visible from orbit. Probe data only; Antiphon's return leg does not reach it. Recommended, with Verrin, for a dedicated biological mission.</p>`, ["SV-006", "SV-012"]);

E("SV-014", "CORVANE PRIME — BLUE GIANT", "corvane prime b7 giant blue ejected shell reach namesake",
`<p><b>Corvane Prime</b>, a B7 giant 80 light-years from the relay and the brightest thing in the Reach, surrounded by a shell of gas it ejected in the recent astronomical past. The Reach is named for the cartographer Elisenda Corvane ([[HX-005]]) and the star for the Reach. The spectrometer bank reads it at any power level; it is the calibration star for the whole survey.</p>`, ["HX-005", "TM-0031"]);

E("SV-015", "KETTLERIDGE RELAY", "kettleridge relay station meridian line beacons quist phase lock reference origin",
`<p><b>Kettleridge Relay</b>: the Commission's forward station on the Meridian Line and the fixed point of the whole survey. A crewed station of thirty in orbit around a G2 star, with two beacons at the edge of the system. The relay is the phase-lock reference for every long-range array in the Reach ([[TM-0080]]) and the point through which all correspondence passes. Stationmaster Auberon Quist has held the post for nine years and sends every departing vessel the same three words ([[HX-003]]). Its construction is described in [[HX-006]].</p>`, ["TM-0080", "HX-003", "HX-006", "ML-001"]);

E("SV-016", "SIGNAL 47 — ANALYSIS", "signal 47 analysis periodic forty seven seconds structure beat gravimetric calibration tolmach natural",
`<p><b>Signal 47</b>: a weak periodic component in the long-range gravimetric data, period 47.0 seconds, bearing consistent with Tolmach's Anomaly ([[SV-010]]). First detected MD 398 ([[ML-398]]); confirmed by OSV Cantor from a second baseline MD 405 ([[ML-405]]).</p>
<p><b>The period</b> is real, external and natural: a compact rotator in the Anomaly's halo, most probably. Two vessels see it from two places; it is not ours.</p>
<p><b>The structure</b> inside each cycle, which looked too regular for nature and too simple for intent, is under active analysis. The sensor specialist has noted that the gravimetric net's own calibration pulse has a period of exactly 47.0 seconds ([[TM-0032]]) and that a real external signal with the same period, beating against the net's reference, would produce in the processed data precisely the kind of tidy structure observed. The correspondence with Cantor on this point is in the communications log; read all of it.</p>`, ["SV-010", "ML-398", "ML-405", "TM-0032", "panel:comms"]);

E("SV-017", "ANVERS POINT", "anvers point k1 debris belt airless rock thin co2",
`<p><b>Anvers Point</b>, K1 main sequence, 11 light-years from the relay and the first system inside the Line. Two rocks and a debris belt; nothing living, nothing moving. It was surveyed by the relay's own launches before Antiphon arrived and serves the survey as a check on the calibration of the laterals: if Anvers looks different, the arrays are wrong.</p>`, ["SV-015", "TM-0030"]);

E("SV-018", "QUENNELL", "quennell g5 water ice ringed gas giant",
`<p><b>Quennell</b>, G5 main sequence, 59 light-years from the relay. Three planets: a rock, a water-ice world at 1.1 astronomical units that would be temperate under a brighter star, and a ringed gas giant. The rings are the finest in the Reach and the cartographer has asked that the return leg pass close enough to see them. The navigator has said no, and then said she would look at it.</p>`, ["PR-019", "PR-006"]);

E("SV-019", "THESSALY GAP", "thessaly gap void starless volume named petrakis",
`<p><b>Thessaly Gap</b>: a starless volume some six light-years across at the northern edge of the chart. Nothing is there, which is itself worth recording; the gravimetric net reads the volume as slightly underdense, as if something had cleared it. Named by the cartographer ([[PR-019]]), who declines to say after what. Not on any transit plan.</p>`, ["PR-019"]);

E("SV-020", "ULMER'S WAKE — SUPERNOVA REMNANT", "ulmer wake supernova remnant pulsar shell expanding",
`<p><b>Ulmer's Wake</b>: the expanding shell of a supernova some ten thousand years old, with a pulsar of period 0.41 seconds at its centre, 36 light-years from the relay. The shell is a hazard to hull stress at close range and a joy to the spectrometer at any range. The pulsar is the timing reference against which the survey checks its clocks, and the reason the sensor specialist was sure, at once, that a 47-second period was not a pulsar ([[SV-016]]).</p>`, ["SV-016", "TM-0031"]);

E("SV-021", "FALLOWFIELD", "fallowfield g8 temperate dry world ice giant",
`<p><b>Fallowfield</b>, G8 main sequence, 30 light-years from the relay. Fallowfield II is a temperate, dry world with a thin atmosphere and no detectable biosphere — the closest thing in the Reach to a place one could stand without a suit, and entirely empty. The name is the cartographer's and is, for once, self-explanatory. Probe data only.</p>`, ["SV-004"]);

E("SV-022", "GANNET", "gannet f2 asteroid belt rock",
`<p><b>Gannet</b>, F2 main sequence, at the north-eastern corner of the chart. One rock and an asteroid belt; surveyed by probe; not on any transit plan. Listed for completeness. The cartographer notes that every survey needs one system about which there is nothing to say.</p>`, ["PR-019"]);

E("SV-023", "IRONHOLD", "ironhold k0 iron rich rocks gas giant metallic",
`<p><b>Ironhold</b>, K0 main sequence, at the far edge of the Reach. Two unusually iron-rich rocky planets — their densities suggest stripped cores — and a gas giant. Of interest to the Commission's resource assessors and of none, the science lead says, to anyone else. Probe data only.</p>`, ["SV-022"]);
