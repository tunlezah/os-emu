<!DOCTYPE html>
<html lang="en" data-motion="full" data-text="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LCARS (1987) — The OS Museum</title>
<meta name="description" content="A single-file, in-browser homage to LCARS, the Library Computer Access/Retrieval System designed by Michael Okuda for a 1987 television production — a design language that was never software. This exhibit builds the working system behind the graphics: a power grid whose reallocations degrade the sensors across the console, a searchable library computer with an original corpus, stellar cartography, a duty roster, a correspondence log, engineering diagnostics and a three-state alert cascade that reorganises the whole interface. Everything is invented and labelled as invention. An independent tribute; no affiliation claimed.">
<style>
/* ==========================================================================
   LCARS — the Library Computer Access/Retrieval System.
   A single-file exhibit for The OS Museum.
   --------------------------------------------------------------------------
   READ THIS FIRST. Every other exhibit in this collection recreates software
   that existed. This one cannot, because LCARS was never software. The panels
   on the 1987 television set were sheets of backlit coloured acrylic with
   graphics printed on them; the chirps were added in post-production; later
   seasons used pre-rendered video loops. There was no file system, no command
   structure, no event handler. LCARS is a set of graphics designed by Michael
   Okuda to be photographed, and it has no behaviour to recreate because it
   never had any.

   THE THESIS. So the task here is to build the thing behind the graphics and
   to label the invention as invention. The interface is composed from FIVE
   PRIMITIVES and nothing else — the elbow, the bar, the block, the sweep and
   text — through a small component API (MODULE 1, built first), and an audit
   at boot walks the DOM to prove that nothing visible sits outside that set.
   Behind the grammar is a genuine system: one simulation model (MODULE 4)
   that every panel reads from, so pulling power away from the sensors makes
   the sensor panel visibly worse, pulling it from environmental raises an
   alert on its own, and overcommitting the total is refused in the console's
   own voice. The acronym says LIBRARY, so there is a library: an original,
   full-text searchable corpus about an invented vessel (MODULE 7).

   GEOMETRY. The elbow's proportions are strict and getting them wrong is the
   commonest failure in reimplementations: the outer arc's radius equals the
   bar's thickness PLUS the inner (concave) radius, so the bar keeps its
   thickness through the bend, and the vertical leg is wider than the
   horizontal one. Alignment is absolute — every gap is one unit (--u) and
   every edge is shared. Rhythm is the identity as much as colour is.

   PALETTE. The earlier, warmer scheme: peach, salmon, tan, butterscotch,
   lilac, lavender, periwinkle, sky, and a red-orange reserved for alerts —
   flat colour on pure black, defined once as tokens and used nowhere else.
   The language shifted across later productions toward cooler blues and
   greys; the guide says so. Colour meaning (navigation / status / controls /
   alerts) is this exhibit's own consistent assignment; the original was not
   consistent and never needed to be.

   RIGHTS. An unofficial tribute to a design language. No insignia, no
   wordmarks, no canonical names, no character names, no dialogue, none of
   Okuda's actual graphics, no imitation of the computer voice. The vessel,
   its registry, its mission, its crew and every word in its library were
   written for this page. The face associated with the original is a licensed
   commercial font and is not fetched: a stack of locally available condensed
   faces is used, and a probe measures whatever arrives and squeezes it
   horizontally toward the right proportion (--sq).

   TWO VOICES. The console speaks in its own fiction. The museum annotates in
   the margin — the rail across the top and the guide drawer — in a different
   typeface, and never inside the console's frame. The honesty lives there.

   NO NETWORK. One file, no CDNs, no web fonts, no images, no fetch. Works
   from file://. LocalStorage under "osmuseum.lcars.*" remembers the power
   allocation, the alert state, panel history, bookmarks, read entries,
   comms read state and the audio and accessibility preferences.
   ========================================================================== */

/* ==========================================================================
   0. TOKENS — the whole visual vocabulary lives here and nowhere else.
   ========================================================================== */
:root{
  /* rhythm */
  --u:5px;                       /* the gap unit; every gap is one of these */
  --T:30px;                      /* bar thickness: header, footer, horizontal legs */
  --W:150px;                     /* sidebar width: the vertical leg */
  --ri:24px;                     /* elbow inner (concave) radius */
  --ro:calc(var(--T) + var(--ri)); /* elbow outer radius = thickness + inner radius */
  --sri:44px;                    /* sweep inner radius */
  --sro:calc(var(--T) + var(--sri));
  --rail:40px;                   /* right-hand structural rail */
  --rows-h:56px;                 /* standard sidebar block height */
  /* type */
  --lc-font:"Helvetica Neue Condensed","HelveticaNeue-CondensedBold","Helvetica Neue","Arial Narrow","Roboto Condensed","Liberation Sans Narrow","Nimbus Sans Narrow","DejaVu Sans Condensed","Arial","Helvetica",sans-serif;
  --sq:1;                        /* horizontal squeeze, set by the font probe */
  --ts:1;                        /* text scale (accessibility) */
  --fs-label:calc(15px * var(--ts));
  --fs-small:calc(12px * var(--ts));
  --fs-read:calc(19px * var(--ts));
  --fs-title:calc(30px * var(--ts));
  --fs-prose:calc(18px * var(--ts));
  --fs-big:calc(44px * var(--ts));
  /* the palette — the earlier, warmer scheme, flat on black */
  --peach:#FFCC99;
  --salmon:#FF9966;
  --tan:#CC9966;
  --butterscotch:#FFCC66;
  --lilac:#CC99CC;
  --lavender:#9999CC;
  --periwinkle:#9999FF;
  --sky:#99CCFF;
  --alert:#EE5533;
  --ink:#000000;
  --paper:#F5F1E8;              /* text on black where the palette is too loud */
  /* semantic assignment — this exhibit's invention, applied consistently */
  --c-nav:var(--peach);
  --c-nav-on:var(--salmon);
  --c-title:var(--salmon);
  --c-status:var(--lavender);
  --c-status2:var(--lilac);
  --c-control:var(--butterscotch);
  --c-control2:var(--tan);
  --c-data:var(--sky);
  --c-data2:var(--periwinkle);
  --c-alert:var(--alert);
  --c-frame:var(--peach);
  --c-frame2:var(--tan);
  --c-struct:var(--lavender);
  /* museum voice */
  --mus-bg:#12141b; --mus-edge:#2a2f3d; --mus-fg:#e6e9f2; --mus-dim:#aab1c5; --mus-faint:#727a90; --mus-accent:#7fd1c9;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-text="large"]{--ts:1.22}
html[data-text="xlarge"]{--ts:1.45}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--paper);overflow:hidden}
body{font-family:var(--lc-font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit}

/* ==========================================================================
   1. MUSEUM RAIL — the margin, not the console. Different typeface on purpose.
   ========================================================================== */
#musrail{
  position:fixed;left:0;right:0;top:0;height:34px;z-index:600;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--mus-bg);border-bottom:1px solid var(--mus-edge);
  font:12px var(--mono);color:var(--mus-dim);
}
#musrail .brand{color:var(--mus-faint);letter-spacing:.14em;text-transform:uppercase;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#musrail .brand b{color:var(--mus-dim);font-weight:600}
#musrail .spacer{flex:1}
.mbtn{background:#1a1f2e;border:1px solid var(--mus-edge);color:var(--mus-dim);border-radius:4px;font:600 11px var(--mono);padding:5px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.mbtn:hover{color:var(--mus-fg);border-color:var(--mus-accent)}
.mbtn.on{background:var(--mus-accent);border-color:var(--mus-accent);color:#062a2a;font-weight:700}
.mbtn.warn:hover{border-color:#ff8f8f;color:#ffd7d7}
@media (max-width:820px){ #musrail .hideable{display:none} }

/* ==========================================================================
   2. THE GRAMMAR — five primitives. Nothing visible inside #console may be
      anything other than one of these classes (the audit checks).
   ========================================================================== */
/* --- text ---------------------------------------------------------------- */
.lc-t{
  display:inline-block;white-space:nowrap;font-weight:700;text-transform:uppercase;
  line-height:1;letter-spacing:.01em;color:var(--c,var(--peach));
  transform:scaleX(var(--sq));transform-origin:right center;font-size:var(--fs-label);
}
.lc-t.l{transform-origin:left center}
.lc-t.c{transform-origin:center center}
.lc-t.small{font-size:var(--fs-small)}
.lc-t.read{font-size:var(--fs-read)}
.lc-t.title{font-size:var(--fs-title)}
.lc-t.big{font-size:var(--fs-big)}
.lc-t.wrap{white-space:normal;line-height:1.15}
/* block-level running text: lay it out wider, then squeeze it into place */
.lc-prose{
  width:calc(100% / var(--sq));transform:scaleX(var(--sq));transform-origin:0 0;
  font-weight:400;font-size:var(--fs-prose);line-height:1.3;color:var(--paper);text-transform:none;
}
.lc-prose p{margin:0 0 .75em 0}
.lc-prose b{color:var(--peach);font-weight:700}
.lc-prose i{color:var(--sky);font-style:normal}
.lc-prose .id{color:var(--c-data);font-weight:700}
.lc-prose h3{font-size:1.15em;text-transform:uppercase;color:var(--salmon);margin:.6em 0 .3em;font-weight:700}
.lc-prose ol,.lc-prose ul{margin:0 0 .75em 1.4em}
.lc-prose li{margin:.15em 0}
.lc-prose .xr{color:var(--sky);text-decoration:none;font-weight:700;cursor:pointer}
/* --- block --------------------------------------------------------------- */
.lc-block{
  position:relative;flex:none;background:var(--c,var(--peach));min-height:var(--T);
  overflow:hidden;color:var(--ink);user-select:none;
}
.lc-block.pill{border-radius:9999px}
.lc-block.rl{border-radius:9999px 0 0 9999px}
.lc-block.rr{border-radius:0 9999px 9999px 0}
.lc-block.sq{border-radius:0}
.lc-block.btn{cursor:pointer}
.lc-block .lc-t{position:absolute;right:calc(var(--u) + 3px);bottom:var(--u);color:var(--ink)}
.lc-block .lc-t.l{left:calc(var(--u) + 3px);right:auto}
.lc-block .lc-t.c{left:0;right:0;text-align:center;transform-origin:center center}
.lc-block .lc-t.tl{left:calc(var(--u) + 3px);right:auto;top:var(--u);bottom:auto}
.lc-block .lc-t.tr{top:var(--u);bottom:auto}
.lc-block .lc-n{position:absolute;left:calc(var(--u) + 3px);top:var(--u);font-size:var(--fs-small);color:var(--ink);opacity:.75}
.lc-block.flash{background:#fff !important}
.lc-block.dim{opacity:.55}
.lc-block.off{background:#3a3a3a}
.lc-block.off .lc-t,.lc-block.off .lc-n{color:#000}
/* --- bar ----------------------------------------------------------------- */
.lc-bar{display:flex;align-items:stretch;gap:var(--u);height:var(--T);min-width:0}
.lc-bar.v{flex-direction:column;width:var(--T);height:auto}
.lc-seg{flex:1 1 auto;background:var(--c,var(--peach));min-width:var(--T)}
.lc-bar.v .lc-seg{min-width:0;min-height:var(--T)}
.lc-seg.fix{flex:0 0 auto}
.lc-seg.cap-r{border-radius:0 9999px 9999px 0}
.lc-seg.cap-l{border-radius:9999px 0 0 9999px}
.lc-bar.v .lc-seg.cap-b{border-radius:0 0 9999px 9999px}
.lc-bar.v .lc-seg.cap-t{border-radius:9999px 9999px 0 0}
.lc-bar .lc-block{height:100%}
.lc-bar .lc-gap{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 calc(var(--u) * 2);min-width:0;overflow:hidden}
.lc-bar .lc-gap .lc-t{margin-bottom:-2px}
.lc-bar .lc-gap.l{justify-content:flex-start}
/* --- elbow and sweep ------------------------------------------------------ */
.lc-elbow{position:relative;flex:none;background:var(--c,var(--peach));width:calc(var(--W) + var(--ri));height:calc(var(--T) + var(--ri))}
.lc-elbow::after{content:"";position:absolute;height:var(--ri);background:#000}
.lc-elbow.tl{border-top-left-radius:var(--ro)}
.lc-elbow.tl::after{left:var(--W);right:0;top:var(--T);border-top-left-radius:var(--ri)}
.lc-elbow.tr{border-top-right-radius:var(--ro)}
.lc-elbow.tr::after{right:var(--W);left:0;top:var(--T);border-top-right-radius:var(--ri)}
.lc-elbow.bl{border-bottom-left-radius:var(--ro)}
.lc-elbow.bl::after{left:var(--W);right:0;bottom:var(--T);border-bottom-left-radius:var(--ri)}
.lc-elbow.br{border-bottom-right-radius:var(--ro)}
.lc-elbow.br::after{right:var(--W);left:0;bottom:var(--T);border-bottom-right-radius:var(--ri)}
.lc-elbow .lc-t{position:absolute;color:var(--ink)}
.lc-elbow.tl .lc-t,.lc-elbow.tr .lc-t{bottom:var(--u)}
.lc-elbow.bl .lc-t,.lc-elbow.br .lc-t{top:var(--u)}
.lc-elbow.tl .lc-t,.lc-elbow.bl .lc-t{right:calc(100% - var(--W) + var(--u) + 3px)}
.lc-elbow.tr .lc-t,.lc-elbow.br .lc-t{left:calc(100% - var(--W) + var(--u) + 3px);transform-origin:left center}
.lc-elbow .lc-n{position:absolute;left:calc(var(--u) + 3px);top:var(--u);font-size:var(--fs-small);color:var(--ink);opacity:.75}
.lc-sweep{--ri:var(--sri);--ro:var(--sro)}
/* small frame variants used inside panels */
.lc-mini{--W:60px;--T:14px;--ri:12px;--ro:26px}
.lc-mini .lc-t{font-size:var(--fs-small)}

/* ==========================================================================
   3. LAYOUT ENGINE — the console grid. Rows: header T | inner ri | body |
      inner ri | footer T. Columns: sidebar W | inner ri | main | rail.
   ========================================================================== */
#console{
  position:fixed;left:0;right:0;top:34px;bottom:0;background:#000;
  display:grid;
  grid-template-columns:var(--W) var(--sri) minmax(0,1fr) var(--rail);
  grid-template-rows:var(--T) var(--sri) minmax(0,1fr) var(--ri) var(--T);
  padding:var(--u);gap:0;
}
#console.norail{grid-template-columns:var(--W) var(--sri) minmax(0,1fr) 0}
#f-tl{grid-area:1/1/3/3}
#f-head{grid-area:1/3/2/5;display:flex;min-width:0}
#f-side{grid-area:3/1/4/2;display:flex;flex-direction:column;gap:var(--u);padding-top:var(--u);min-height:0;overflow:hidden;position:relative}
#f-side .lc-block{width:var(--W);height:var(--rows-h)}
#f-side .lc-block.fill{flex:1 1 auto;height:auto;min-height:var(--T)}
#f-side .lc-block.short{height:calc(var(--rows-h) * .5)}
#f-side .lc-block.tall{height:calc(var(--rows-h) * 1.6)}
#f-main{grid-area:2/3/5/4;min-width:0;min-height:0;overflow:hidden;padding:var(--u) var(--u) var(--u) calc(var(--u) * 2);display:flex;flex-direction:column;position:relative}
#f-rail{grid-area:2/4/5/5;display:flex;flex-direction:column;gap:var(--u);padding:var(--u) 0 var(--u) var(--u);min-height:0}
#f-rail .lc-block{width:calc(var(--rail) - var(--u));min-height:calc(var(--T) * .6);flex:1 1 auto}
#console.norail #f-rail{display:none}
#f-bl{grid-area:4/1/6/3;align-self:end;width:calc(var(--W) + var(--sri))}
#f-foot{grid-area:5/3/6/5;display:flex;min-width:0}
#f-bl.lc-elbow{margin-top:auto}

/* main region composition helpers (containers only; nothing here paints) */
.pan{display:flex;flex-direction:column;gap:var(--u);flex:1 1 auto;min-height:0;min-width:0}
.row{display:flex;gap:var(--u);align-items:stretch;min-width:0}
.row.grow{flex:1 1 auto;min-height:0}
.col{display:flex;flex-direction:column;gap:var(--u);min-width:0;min-height:0}
.col.grow{flex:1 1 auto}
.fill{flex:1 1 auto;min-width:0;min-height:0}
.cell{display:flex;align-items:flex-end;justify-content:flex-end;min-width:0;overflow:hidden;padding:0 var(--u)}
.cell.l{justify-content:flex-start}
.cell.c{justify-content:center}
.cell.mid{align-items:center}
.grid{display:grid;gap:var(--u);min-width:0;min-height:0}
.scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.padded{padding:calc(var(--u) * 2) calc(var(--u) * 3)}
.hidden{display:none !important}
.meter{position:relative;display:flex;gap:var(--u);align-items:stretch;min-width:0}
.meter .lc-block{transition:width .6s ease,opacity .4s}
.seg-meter{display:flex;gap:calc(var(--u) * .6);align-items:flex-end;min-width:0}
.seg-meter .lc-block{flex:1 1 0;min-height:0;transition:opacity .3s}
.vseg{display:flex;flex-direction:column-reverse;gap:calc(var(--u) * .6);min-height:0;flex:1 1 auto}
.vseg .lc-block{flex:1 1 0;min-height:0;width:100%}
#lc-input{
  font:700 var(--fs-read) var(--lc-font);text-transform:uppercase;letter-spacing:.01em;color:var(--sky);
  background:transparent;border:0;outline:0;width:100%;min-width:0;caret-color:var(--sky);padding:0 var(--u);
}
#lc-input::placeholder{color:var(--lavender);opacity:.8}
.blink{animation:lc-blink 1s steps(2,start) infinite}
@keyframes lc-blink{to{visibility:hidden}}

/* chart (navigation) — dots are blocks, lines are bars, labels are text */
.chart{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.chart .lc-block{position:absolute}
.chart .lc-t{position:absolute}
.chart .grid-h{position:absolute;left:0;right:0;height:2px;background:#2a2a2a}
.chart .grid-v{position:absolute;top:0;bottom:0;width:2px;background:#2a2a2a}
.chart .route{position:absolute;background:var(--c-control)}
.chart .star{border-radius:9999px;transform:translate(-50%,-50%);cursor:pointer}
.chart .ship{transform:translate(-50%,-50%);transition:left 1s linear,top 1s linear}

/* ==========================================================================
   4. ALERT STATES — the frame pulses, the palette is re-derived in JS.
   ========================================================================== */
#console[data-alert="elevated"] #f-head .lc-seg,#console[data-alert="elevated"] #f-tl{animation:lc-breathe 3.2s ease-in-out infinite}
#console[data-alert="emergency"] .lc-elbow,#console[data-alert="emergency"] #f-head .lc-seg,#console[data-alert="emergency"] #f-foot .lc-seg,#console[data-alert="emergency"] #f-rail .lc-block{animation:lc-pulse 1.1s ease-in-out infinite}
@keyframes lc-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes lc-breathe{0%,100%{opacity:1}50%{opacity:.7}}
html[data-motion="reduce"] *{animation:none !important;transition:none !important}
.stagger .lc-block{animation:lc-in .35s ease both}
@keyframes lc-in{from{opacity:0}to{opacity:1}}

/* ==========================================================================
   5. THE GUIDE — museum voice, over the console, never inside its frame.
   ========================================================================== */
#guide{
  position:fixed;top:34px;right:0;bottom:0;width:min(480px,100vw);z-index:500;
  background:var(--mus-bg);border-left:1px solid var(--mus-edge);color:var(--mus-fg);
  font:14px/1.5 var(--sans);display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .25s ease;
}
#guide.open{transform:none}
#guide header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--mus-edge)}
#guide h2{font:700 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mus-dim)}
#gtabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--mus-edge)}
#gtabs button{background:transparent;border:1px solid var(--mus-edge);color:var(--mus-dim);border-radius:4px;font:11px var(--mono);padding:4px 8px;cursor:pointer}
#gtabs button.on{background:#1f2536;color:var(--mus-fg);border-color:var(--mus-accent)}
#gbody{flex:1;overflow:auto;padding:14px 16px 30px}
#gbody h3{font:700 15px var(--sans);margin:18px 0 6px;color:var(--mus-fg)}
#gbody h3:first-child{margin-top:0}
#gbody p{margin:0 0 10px;color:var(--mus-dim)}
#gbody p b,#gbody li b{color:var(--mus-fg)}
#gbody ul,#gbody ol{margin:0 0 12px 20px;color:var(--mus-dim)}
#gbody li{margin:4px 0}
#gbody code{font:12px var(--mono);background:#1a1f2e;padding:1px 5px;border-radius:3px;color:var(--mus-fg)}
#gbody .inv{display:inline-block;font:700 9px var(--mono);letter-spacing:.1em;background:#3a2a10;color:#f6c76a;border-radius:3px;padding:1px 5px;vertical-align:middle;margin-right:4px}
#gbody .real{display:inline-block;font:700 9px var(--mono);letter-spacing:.1em;background:#10302a;color:#7fd1c9;border-radius:3px;padding:1px 5px;vertical-align:middle;margin-right:4px}
#gbody .swatches{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
#gbody .sw{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--mus-dim)}
#gbody .sw i{display:inline-block;width:26px;height:16px;border-radius:3px}
#gbody .gbtn{background:#1a1f2e;border:1px solid var(--mus-edge);color:var(--mus-fg);border-radius:4px;font:600 12px var(--mono);padding:6px 10px;cursor:pointer;margin:2px 4px 2px 0}
#gbody .gbtn.on{background:var(--mus-accent);color:#062a2a;border-color:var(--mus-accent)}
#gbody .gbtn.warn{border-color:#7a3030;color:#ffb3b3}
#gbody details{margin:8px 0;border:1px solid var(--mus-edge);border-radius:6px;padding:8px 12px}
#gbody summary{cursor:pointer;color:var(--mus-fg);font-weight:600}
#gbody .audit{font:12px var(--mono);background:#0b0d13;border:1px solid var(--mus-edge);border-radius:6px;padding:8px 10px;color:var(--mus-dim);white-space:pre-wrap}
#gbody .fig{margin:8px 0 14px;padding:10px;background:#000;border-radius:6px;border:1px solid var(--mus-edge)}
#gbody .fig .cap{font:11px var(--mono);color:var(--mus-faint);margin-top:8px}
#gbody a{color:var(--mus-accent)}
/* invention labels: museum stickers that can be switched on over the console */
.inv-tag{position:absolute;z-index:20;font:700 9px var(--mono);letter-spacing:.1em;background:#3a2a10;color:#f6c76a;border:1px solid #6a4a10;border-radius:3px;padding:1px 5px;pointer-events:none;text-transform:uppercase}
.inv-tag.real{background:#10302a;color:#7fd1c9;border-color:#1f6a5a}

<body>

<!-- museum rail: the margin. Not part of the console; a different typeface on purpose. -->
<div id="musrail" role="toolbar" aria-label="Museum controls">
  <span class="brand"><b>The OS Museum</b> · LCARS · a design language, 1987 · <span class="hideable">independent tribute — every behaviour here is invented</span></span>
  <span class="spacer"></span>
  <button class="mbtn" id="m-labels" type="button" title="Show museum labels over the console marking what is invented and what was real">Labels</button>
  <button class="mbtn" id="m-sound" type="button" title="Synthesised tones. Off by default; nothing plays until you turn it on.">Sound: off</button>
  <button class="mbtn" id="m-guide" type="button">Guide</button>
  <a class="mbtn hideable" href="index.html" title="Back to the museum">Museum</a>
</div>

<!-- the console. Everything inside is rendered by the grammar module. -->
<div id="console" data-alert="normal" role="application" aria-label="LCARS console"></div>

<!-- the guide: museum voice -->
<aside id="guide" aria-label="Exhibit guide">
  <header><h2>Exhibit guide</h2><button class="mbtn" id="guideclose" type="button">Close</button></header>
  <div id="gtabs"></div>
  <div id="gbody"></div>
</aside>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ==========================================================================
   MODULE 0 — small utilities. DOM helper, an event bus, a seeded PRNG for
   the numbers that mean nothing, colour maths for the alert palettes.
   ========================================================================== */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pad = (n, w) => String(n).padStart(w, "0");
const fmt = (n, d = 0) => Number(n).toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k === "text") el.textContent = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "data") for (const d in v) el.dataset[d] = v[d];
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

/* event bus: the simulation announces, the panels listen */
const Bus = (() => {
  const subs = new Map();
  return {
    on(ev, fn) { if (!subs.has(ev)) subs.set(ev, new Set()); subs.get(ev).add(fn); return () => subs.get(ev).delete(fn); },
    emit(ev, data) { const s = subs.get(ev); if (s) for (const fn of Array.from(s)) { try { fn(data); } catch (e) { console.error("[LCARS bus]", ev, e); } } },
  };
})();

/* seeded PRNG (mulberry32) so the meaningless numbers stay put between renders */
function seeded(seedStr) {
  let a = 0x9e3779b9;
  for (let i = 0; i < seedStr.length; i++) a = Math.imul(a ^ seedStr.charCodeAt(i), 0x85ebca6b) >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
/* The numbers that mean nothing. One of them turns up far more often than chance allows. */
function numLabel(seed) {
  const r = seeded("n:" + seed);
  const roll = r();
  const four = () => pad(Math.floor(r() * 10000), 4);
  if (roll < 0.34) {                       // the recurring one
    const forms = [() => "47-" + pad(Math.floor(r() * 1000), 3), () => pad(Math.floor(r() * 100), 2) + "-47", () => "47" + pad(Math.floor(r() * 100), 2), () => pad(Math.floor(r() * 10), 1) + "47" + pad(Math.floor(r() * 10), 1)];
    return forms[Math.floor(r() * forms.length)]();
  }
  if (roll < 0.62) return pad(Math.floor(r() * 100), 2) + "-" + pad(Math.floor(r() * 1000), 3);
  return four();
}

/* colour maths for the alert palettes */
function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(r, g, b) { return "#" + [r, g, b].map(v => pad(clamp(Math.round(v), 0, 255).toString(16), 2)).join("").toUpperCase(); }
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let hh = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) hh = (g - b) / d + (g < b ? 6 : 0); else if (mx === g) hh = (b - r) / d + 2; else hh = (r - g) / d + 4; hh *= 60; }
  return [hh, s, l];
}
function hslToRgb(hh, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((hh / 60) % 2 - 1)), m = l - c / 2; let r, g, b;
  if (hh < 60) [r, g, b] = [c, x, 0]; else if (hh < 120) [r, g, b] = [x, c, 0]; else if (hh < 180) [r, g, b] = [0, c, x];
  else if (hh < 240) [r, g, b] = [0, x, c]; else if (hh < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
/* pull a colour's hue toward a target hue by `amount` (0..1), with saturation/lightness nudges */
function shiftHue(hex, targetHue, amount, satBoost = 0, lightMul = 1) {
  const [hh, s, l] = rgbToHsl(...hexToRgb(hex));
  let d = ((targetHue - hh + 540) % 360) - 180;          // shortest way round
  const nh = (hh + d * amount + 360) % 360;
  return rgbToHex(...hslToRgb(nh, clamp(s + satBoost, 0, 1), clamp(l * lightMul, 0, 1)));
}

const now = () => performance.now();
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ==========================================================================
   MODULE 1 — THE LCARS GRAMMAR. Five primitives and a palette. Built first;
   nothing else in the console renders except through these functions.
     LC.text   — uppercase condensed text (squeezed toward the right width)
     LC.block  — a flat rectangle: pill, one rounded end, or square
     LC.bar    — a rule of standard thickness with a rounded cap, broken by
                 gaps that hold small blocks or a line of text
     LC.elbow  — the L-shaped frame joint; outer radius = thickness + inner
     LC.sweep  — the same joint with the large radius used at the header
     LC.prose  — running text (the library speaks in paragraphs)
   Plus the font probe (--sq) and the audit that proves the rule held.
   ========================================================================== */
const LC = (() => {
  const COLORS = ["peach", "salmon", "tan", "butterscotch", "lilac", "lavender", "periwinkle", "sky", "alert",
                  "nav", "nav-on", "title", "status", "status2", "control", "control2", "data", "data2", "frame", "frame2", "struct"];
  const cvar = c => !c ? null : c.startsWith("#") ? c : c.startsWith("var(") ? c : (["nav", "nav-on", "title", "status", "status2", "control", "control2", "data", "data2", "frame", "frame2", "struct", "alert"].includes(c) ? `var(--c-${c})` : `var(--${c})`);

  function text(str, o = {}) {
    const cls = ["lc-t", o.align || "r", o.size || "", o.wrap ? "wrap" : "", o.cls || ""].filter(Boolean).join(" ");
    const el = h("span", { class: cls, text: str });
    if (o.color) el.style.setProperty("--c", cvar(o.color));
    if (o.title) el.title = o.title;
    return el;
  }

  let pressHook = null;   // the audio engine plugs in here
  function press(el, kind) {
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 110);
    if (pressHook) pressHook(kind || "press");
  }

  function block(o = {}) {
    const cls = ["lc-block", o.shape || "sq", o.onPress ? "btn" : "", o.dim ? "dim" : "", o.off ? "off" : "", o.cls || ""].filter(Boolean).join(" ");
    const el = h("div", { class: cls });
    if (o.color) el.style.setProperty("--c", cvar(o.color));
    if (o.w != null) el.style.width = typeof o.w === "number" ? o.w + "px" : o.w;
    if (o.h != null) el.style.height = typeof o.h === "number" ? o.h + "px" : o.h;
    if (o.flex != null) el.style.flex = o.flex;
    if (o.minw != null) el.style.minWidth = typeof o.minw === "number" ? o.minw + "px" : o.minw;
    if (o.title) el.title = o.title;
    if (o.num !== false) {
      const n = o.num === true || o.num == null ? (o.label ? numLabel(o.label + (o.seed || "")) : null) : o.num;
      if (n) el.append(h("span", { class: "lc-n lc-t l", text: n }));
    }
    if (o.label != null) el.append(text(o.label, { align: o.align || "r", size: o.size, cls: o.labelCls }));
    if (o.onPress) {
      el.setAttribute("role", "button"); el.tabIndex = 0;
      el.addEventListener("pointerdown", e => { if (e.button === 0 || e.pointerType !== "mouse") press(el, o.tone); });
      el.addEventListener("click", e => { e.preventDefault(); o.onPress(el, e); });
      el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); press(el, o.tone); o.onPress(el, e); } });
      if (o.label) el.setAttribute("aria-label", o.aria || o.label);
    }
    return el;
  }

  /* items: {seg:true, flex?, w?, cap?:'l'|'r'|'t'|'b', color?} | {block:{...}} | {gap:true, text, color, size, w} */
  function bar(o = {}) {
    const el = h("div", { class: ["lc-bar", o.dir === "v" ? "v" : "", o.cls || ""].filter(Boolean).join(" ") });
    if (o.color) el.style.setProperty("--c", cvar(o.color));
    if (o.h != null) el.style.height = typeof o.h === "number" ? o.h + "px" : o.h;
    for (const it of (o.items || [{ seg: true }])) {
      if (it.seg) {
        const s = h("div", { class: ["lc-seg", it.cap ? "cap-" + it.cap : "", it.w != null ? "fix" : ""].filter(Boolean).join(" ") });
        if (it.color) s.style.setProperty("--c", cvar(it.color));
        if (it.w != null) { s.style.width = typeof it.w === "number" ? it.w + "px" : it.w; s.style.flex = "0 0 auto"; }
        if (it.flex != null) s.style.flex = it.flex;
        el.append(s);
      } else if (it.block) {
        el.append(it.block.nodeType ? it.block : block(Object.assign({ shape: "sq", w: 44 }, it.block)));
      } else if (it.gap) {
        const g = h("div", { class: "lc-gap" + (it.align === "l" ? " l" : "") + (it.cls ? " " + it.cls : "") });
        if (it.w != null) g.style.width = typeof it.w === "number" ? it.w + "px" : it.w;
        if (it.flex != null) g.style.flex = it.flex;
        if (it.text != null) g.append(text(it.text, { color: it.color || "title", size: it.size || "read", align: it.align || "r", cls: it.cls }));
        if (it.node) g.append(it.node);
        el.append(g);
      }
    }
    return el;
  }

  function elbow(o = {}) {
    const el = h("div", { class: ["lc-elbow", o.corner || "tl", o.sweep ? "lc-sweep" : "", o.mini ? "lc-mini" : "", o.cls || ""].filter(Boolean).join(" ") });
    if (o.color) el.style.setProperty("--c", cvar(o.color));
    if (o.W != null) el.style.setProperty("--W", o.W + "px");
    if (o.T != null) el.style.setProperty("--T", o.T + "px");
    if (o.ri != null) { el.style.setProperty("--ri", o.ri + "px"); el.style.setProperty("--ro", (o.ri + (o.T || 30)) + "px"); }
    if (o.num !== false) el.append(h("span", { class: "lc-n lc-t l", text: o.num || numLabel("elbow:" + (o.label || o.corner)) }));
    if (o.label) el.append(text(o.label, { align: (o.corner || "tl").endsWith("r") ? "l" : "r" }));
    if (o.onPress) { el.classList.add("btn"); el.style.cursor = "pointer"; el.addEventListener("pointerdown", () => press(el)); el.addEventListener("click", () => o.onPress(el)); }
    return el;
  }
  const sweep = o => elbow(Object.assign({}, o, { sweep: true }));

  function prose(html, o = {}) {
    const el = h("div", { class: "lc-prose" + (o.cls ? " " + o.cls : ""), html });
    return el;
  }

  /* --- the font probe: how condensed is what we actually got? ------------- */
  function probeFont() {
    try {
      const c = document.createElement("canvas").getContext("2d");
      const stack = getComputedStyle(document.documentElement).getPropertyValue("--lc-font") || "sans-serif";
      c.font = `700 100px ${stack}`;
      const sample = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      const w = c.measureText(sample).width / sample.length / 100;      // average em advance
      const target = 0.44;                                               // the look wants very narrow capitals
      const sq = clamp(target / w, 0.6, 1);
      document.documentElement.style.setProperty("--sq", sq.toFixed(3));
      return { measured: w, squeeze: sq, stack };
    } catch (e) { return { measured: null, squeeze: 1, stack: "?" }; }
  }

  /* --- the audit: nothing visible outside the five primitives -------------- */
  function audit(root) {
    const out = { text: 0, block: 0, bar: 0, elbow: 0, sweep: 0, violations: [] };
    const allowedPaint = el => el.classList.contains("lc-block") || el.classList.contains("lc-seg") || el.classList.contains("lc-elbow") || el.id === "lc-input";
    for (const el of root.querySelectorAll("*")) {
      const cl = el.classList;
      if (cl.contains("inv-tag")) continue;                            // museum sticker, not console
      if (cl.contains("lc-t") || cl.contains("lc-prose")) out.text++;
      if (cl.contains("lc-block")) out.block++;
      if (cl.contains("lc-seg")) out.bar++;
      if (cl.contains("lc-elbow")) { if (cl.contains("lc-sweep")) out.sweep++; else out.elbow++; }
      const tag = el.tagName;
      if (/^(IMG|SVG|CANVAS|VIDEO|PICTURE|IFRAME|HR|TABLE|BUTTON|SELECT|TEXTAREA)$/.test(tag)) out.violations.push(tag.toLowerCase() + " element");
      if (tag === "INPUT" && el.id !== "lc-input") out.violations.push("input element");
      const cs = getComputedStyle(el);
      const painted = (cs.backgroundColor !== "rgba(0, 0, 0, 0)" && cs.backgroundColor !== "transparent" && cs.backgroundColor !== "rgb(0, 0, 0)") || cs.backgroundImage !== "none";
      const bordered = ["Top", "Right", "Bottom", "Left"].some(s => parseFloat(cs["border" + s + "Width"]) > 0 && cs["border" + s + "Style"] !== "none");
      const shadowed = cs.boxShadow !== "none" || cs.textShadow !== "none";
      if ((painted || bordered) && !allowedPaint(el) && !el.closest(".lc-block")) out.violations.push(`${tag.toLowerCase()}.${(el.className || "").toString().split(" ")[0] || "?"} paints outside the grammar`);
      if (shadowed) out.violations.push(`${tag.toLowerCase()} has a shadow`);
      if (cs.backgroundImage !== "none") out.violations.push(`${tag.toLowerCase()} has a gradient or image`);
    }
    return out;
  }

  return { text, block, bar, elbow, sweep, prose, press, probeFont, audit, COLORS, setPressHook(fn) { pressHook = fn; } };
})();

/* ==========================================================================
   MODULE 3 — STATE MANAGER. LocalStorage under one prefix, with a full reset.
   Persisted: power allocation, alert state, panel history, library bookmarks
   and read entries, comms read state, audio and accessibility preferences.
   ========================================================================== */
const Store = (() => {
  const PREFIX = "osmuseum.lcars.";
  let ok = true;
  try { localStorage.setItem(PREFIX + "probe", "1"); localStorage.removeItem(PREFIX + "probe"); } catch (e) { ok = false; }
  return {
    available: ok,
    get(k, def) { if (!ok) return def; try { const v = localStorage.getItem(PREFIX + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { if (!ok) return; try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) { /* full or blocked: the console forgets, quietly */ } },
    del(k) { if (!ok) return; try { localStorage.removeItem(PREFIX + k); } catch (e) {} },
    keys() { if (!ok) return []; const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PREFIX)) out.push(k.slice(PREFIX.length)); } return out; },
    resetAll() { for (const k of this.keys()) this.del(k); },
  };

const Sim = (() => {
  const saved = Store.get("sim", null);
  const S = Object.assign({
    alloc: { prop: 240, sens: 90, env: 110, struct: 120, comp: 70, med: 40, comm: 60 },
    corePct: 100, auxOnline: true, coreTemp: 0.12,
    drive: 0,
    caps: {},                    // nodeId -> capacity 0..1 (absent = 1)
    faults: {},                  // nodeId -> {kind, since, proc, step}
    commLock: true, commDownSince: null,
    pos: { x: 52, y: 24 }, at: "halveth", course: null,   // course: {to, from:{x,y}, corner:{x,y}, startMs, days, rating}
    missionMin: 412 * 1440 + 14 * 60 + 32,   // MD 412, 14:32
    lastReal: Date.now(),
    eventLog: [], nextEventAt: null, event: null, lastEventReal: 0,
    arboretum: null,
  }, saved || {});
  if (saved && saved.alloc) S.alloc = Object.assign({ prop: 240, sens: 90, env: 110, struct: 120, comp: 70, med: 40, comm: 60 }, saved.alloc);

  const SIM_MIN_PER_SEC = 10;   // the mission clock runs at ten simulated minutes per real second
  let lastMsg = { text: "", kind: "info", at: 0 };
  let lastSave = 0, saveTimer = null;
  const persist = force => {                     // throttled: at most every 1.5 s, or at once when forced
    if (force) { clearTimeout(saveTimer); saveTimer = null; S.lastReal = Date.now(); Store.set("sim", S); lastSave = Date.now(); return; }
    if (saveTimer) return;
    saveTimer = setTimeout(() => { saveTimer = null; S.lastReal = Date.now(); Store.set("sim", S); lastSave = Date.now(); }, Math.max(50, 1500 - (Date.now() - lastSave)));
  };
  const say = (text, kind = "info") => { lastMsg = { text, kind, at: Date.now() }; Bus.emit("say", lastMsg); return false; };
  const ok = (text) => { if (text) say(text, "ok"); Bus.emit("change"); persist(); return true; };

  /* --- derived quantities ------------------------------------------------ */
  const generation = () => Math.round(CORE_MW * S.corePct / 100) + (S.auxOnline ? AUX_MW : 0);
  const allocated = () => Object.values(S.alloc).reduce((a, b) => a + b, 0);
  const reserve = () => generation() - allocated();
  const cap = id => S.caps[id] == null ? 1 : S.caps[id];
  const throughput = sid => SUB[sid].nodes.reduce((a, [nid, , w]) => a + w * cap(nid), 0);   // 0..1
  const delivered = sid => S.alloc[sid] * throughput(sid);
  const eff = sid => {
    if (sid === "comm" && !S.commLock) return 0;
    return delivered(sid) / SUB[sid].nominal;
  };
  const maxRating = () => clamp(Math.floor(delivered("prop") / 25), 0, 9);

  function sensorProfile() {
    const e = eff("sens");
    return {
      eff: e,
      refreshMs: e <= 0 ? Infinity : clamp(600 / e, 500, 9000),
      cols: e >= 1 ? 24 : e >= .8 ? 18 : e >= .6 ? 12 : e >= .4 ? 8 : e > 0 ? 5 : 0,
      digits: e >= .8 ? 2 : e >= .5 ? 1 : 0,
      rangeLy: Math.round(e * 15 * 10) / 10,
      confidence: clamp(Math.round(e * 96), 0, 99),
      grade: e >= 1.05 ? "EXTENDED" : e >= .8 ? "NOMINAL" : e >= .5 ? "DEGRADED" : e > 0 ? "MINIMAL" : "OFFLINE",
    };
  }
  function computingProfile() {
    const e = eff("comp");
    return { eff: e, delayMs: e >= 1 ? 0 : Math.round((1 - e) * 2600), maxResults: e >= .8 ? 14 : e >= .5 ? 7 : e > 0 ? 3 : 0, parser: e >= .3, grade: e >= .8 ? "NOMINAL" : e >= .5 ? "DEGRADED" : e >= .3 ? "MINIMAL" : e > 0 ? "KEYWORD ONLY" : "OFFLINE" };
  }
  function commsProfile() {
    const e = eff("comm");
    return { eff: e, online: e >= .3, lock: S.commLock, delayMs: e >= 1 ? 4000 : Math.round(4000 + (1 - e) * 20000), grade: !S.commLock ? "PHASE LOCK LOST" : e >= .8 ? "NOMINAL" : e >= .3 ? "DEGRADED" : "OFFLINE" };
  }

  /* --- issues: what the alert machine reads ------------------------------ */
  function issues() {
    const out = [];
    const env = eff("env"), st = eff("struct"), need = needStruct(S.drive);
    if (env < .4) out.push({ level: 2, id: "env", text: "LIFE SUPPORT BELOW MINIMUM — ENVIRONMENTAL " + Math.round(env * 100) + "%", fix: "RESTORE ENVIRONMENTAL POWER ABOVE 40%" });
    else if (env < .7) out.push({ level: 1, id: "env", text: "ATMOSPHERE RECYCLING DEGRADED — ENVIRONMENTAL " + Math.round(env * 100) + "%", fix: "RESTORE ENVIRONMENTAL POWER ABOVE 70%" });
    if (st < need - .25) out.push({ level: 2, id: "struct", text: "HULL STRESS FIELD INSUFFICIENT FOR DRIVE RATING " + S.drive, fix: "RAISE HULL STRESS POWER OR REDUCE DRIVE RATING" });
    else if (st < need) out.push({ level: 1, id: "struct", text: "HULL STRESS FIELD BELOW REQUIREMENT FOR DRIVE RATING " + S.drive, fix: "RAISE HULL STRESS POWER OR REDUCE DRIVE RATING" });
    if (S.coreTemp > .9) out.push({ level: 2, id: "core", text: "PRIMARY CORE THERMAL LIMIT — " + Math.round(S.coreTemp * 100) + "%", fix: "REDUCE CORE OUTPUT TO 100% OR BELOW" });
    else if (S.coreTemp > .7) out.push({ level: 1, id: "core", text: "PRIMARY CORE THERMAL EXCURSION — " + Math.round(S.coreTemp * 100) + "%", fix: "REDUCE CORE OUTPUT" });
    if (S.event && S.event.kind === "debris") {
      const lvl = S.event.escalated ? 2 : 1;
      out.push({ level: lvl, id: "debris", text: lvl === 2 ? "DEBRIS FIELD — HULL STRIKES IN PROGRESS" : "DEBRIS FIELD ENCOUNTER — HULL STRIKES PROBABLE", fix: "HULL STRESS FIELD TO 100% OR HOLD POSITION (DRIVE 0)" });
    }
    /* advisories: not alerts, but the console notes them */
    if (eff("sens") < .5) out.push({ level: 0, id: "sens", text: "SENSOR RESOLUTION MINIMAL — " + Math.round(eff("sens") * 100) + "%" });
    if (eff("comp") < .5) out.push({ level: 0, id: "comp", text: "LIBRARY RETRIEVAL DEGRADED — COMPUTING " + Math.round(eff("comp") * 100) + "%" });
    if (eff("med") < .5) out.push({ level: 0, id: "med", text: "CLINICAL BAY ON RESERVE POWER" });
    if (!S.commLock) out.push({ level: 0, id: "comm", text: "COMMUNICATIONS PHASE LOCK LOST — COLD START REQUIRED (TM-0447)" });
    else if (eff("comm") < .3) out.push({ level: 0, id: "comm", text: "COMMUNICATIONS ARRAY OFFLINE — MESSAGES QUEUED" });
    for (const nid in S.faults) out.push({ level: 0, id: "fault:" + nid, text: "FAULT — " + nodeName(nid) + ": " + S.faults[nid].kind });
    return out;
  }
  const nodeName = nid => { for (const s of SUBSYSTEMS) for (const n of s.nodes) if (n[0] === nid) return n[1]; return nid; };
  const nodeSub = nid => nid.split(".")[0];

  /* --- controls: every one may refuse ----------------------------------- */
  function setAlloc(sid, mw) {
    mw = clamp(Math.round(mw / STEP) * STEP, 0, 400);
    const sub = SUB[sid];
    const other = allocated() - S.alloc[sid];
    if (other + mw > generation()) return say(`ALLOCATION REFUSED — TOTAL DEMAND ${fmt(other + mw)} MW EXCEEDS AVAILABLE ${fmt(generation())} MW`, "deny");
    if (sid === "prop" && mw < S.drive * 25 && S.drive > 0) return say(`ALLOCATION REFUSED — DRIVE RATING ${S.drive} REQUIRES ${S.drive * 25} MW PROPULSION. REDUCE DRIVE RATING FIRST`, "deny");
    if (sid === "struct" && S.drive > 0 && mw / sub.nominal < needStruct(S.drive) - .25) return say(`ALLOCATION REFUSED — HULL STRESS FIELD CANNOT FALL BELOW ${Math.round((needStruct(S.drive) - .25) * 100)}% AT DRIVE RATING ${S.drive}`, "deny");
    const was = S.alloc[sid];
    S.alloc[sid] = mw;
    if (sid === "comm") {
      if (mw === 0 && S.commLock) { S.commDownSince = Date.now(); }
      if (mw > 0) S.commDownSince = null;
    }
    const e = eff(sid);
    let note = `${sub.name} ${fmt(mw)} MW — ${Math.round(e * 100)}% OF NOMINAL`;
    if (sid === "sens") note += e < .5 ? " — SENSOR DISPLAYS DEGRADING" : e > 1.05 ? " — EXTENDED RANGE" : "";
    if (sid === "env" && e < .7) note += " — WARNING PROPAGATED";
    if (sid === "comm" && mw === 0) note += " — ARRAY UNPOWERED. PHASE LOCK WILL DECAY";
    if (was !== mw) Bus.emit("alloc", { sid, mw, was });
    return ok(note);
  }
  function nudge(sid, dir) { return setAlloc(sid, S.alloc[sid] + dir * STEP); }
  function preset(name) {
    const P = {
      NOMINAL: { prop: 240, sens: 90, env: 110, struct: 120, comp: 70, med: 40, comm: 60 },
      SURVEY:  { prop: 120, sens: 150, env: 110, struct: 90, comp: 110, med: 40, comm: 70 },
      CRUISE:  { prop: 280, sens: 60, env: 110, struct: 160, comp: 50, med: 40, comm: 40 },
      STATION: { prop: 40, sens: 120, env: 120, struct: 60, comp: 100, med: 60, comm: 80 },
      MINIMUM: { prop: 30, sens: 30, env: 80, struct: 40, comp: 30, med: 30, comm: 20 },
    }[name];
    if (!P) return false;
    const total = Object.values(P).reduce((a, b) => a + b, 0);
    if (total > generation()) return say(`PRESET REFUSED — ${name} REQUIRES ${total} MW, ${generation()} MW AVAILABLE`, "deny");
    if (P.prop < S.drive * 25 && S.drive > 0) return say(`PRESET REFUSED — DRIVE RATING ${S.drive} REQUIRES ${S.drive * 25} MW PROPULSION. REDUCE DRIVE RATING FIRST`, "deny");
    if (S.drive > 0 && P.struct / 120 < needStruct(S.drive) - .25) return say(`PRESET REFUSED — HULL STRESS FIELD TOO LOW FOR DRIVE RATING ${S.drive}`, "deny");
    S.alloc = Object.assign({}, P);
    if (P.comm === 0) S.commDownSince = Date.now(); else S.commDownSince = null;
    Bus.emit("alloc", { sid: "*" });
    return ok(`POWER PROFILE ${name} APPLIED — ${total} MW ALLOCATED, ${generation() - total} MW RESERVE`);
  }
  function setCore(pct) {
    pct = clamp(pct, 60, 110);
    const gen = Math.round(CORE_MW * pct / 100) + (S.auxOnline ? AUX_MW : 0);
    if (gen < allocated()) return say(`CORE OUTPUT REFUSED — ${pct}% YIELDS ${gen} MW, ${allocated()} MW ALLOCATED. SHED LOAD FIRST`, "deny");
    S.corePct = pct;
    return ok(pct > 100 ? `CORE OUTPUT ${pct}% — THERMAL MARGIN WILL ERODE` : `CORE OUTPUT ${pct}% — ${gen} MW GENERATED`);
  }
  function toggleAux() {
    if (S.auxOnline) {
      const gen = Math.round(CORE_MW * S.corePct / 100);
      if (gen < allocated()) return say(`AUXILIARY CELLS CANNOT GO OFFLINE — ${allocated()} MW ALLOCATED, CORE ALONE YIELDS ${gen} MW. SHED ${allocated() - gen} MW FIRST`, "deny");
      S.auxOnline = false; return ok("AUXILIARY CELL BANK OFFLINE — " + gen + " MW AVAILABLE");
    }
    S.auxOnline = true; return ok("AUXILIARY CELL BANK ONLINE — " + generation() + " MW AVAILABLE");
  }
  function setDrive(r) {
    r = clamp(r, 0, 9);
    if (r > maxRating()) return say(`DRIVE RATING ${r} REFUSED — PROPULSION DELIVERS ${Math.round(delivered("prop"))} MW, RATING ${r} REQUIRES ${r * 25} MW`, "deny");
    if (r > 0 && eff("struct") < needStruct(r) - .25) return say(`DRIVE RATING ${r} REFUSED — HULL STRESS FIELD AT ${Math.round(eff("struct") * 100)}%, RATING ${r} NEEDS AT LEAST ${Math.round((needStruct(r) - .25) * 100)}%`, "deny");
    if (r === 0 && S.course && S.course.engaged) { S.course.engaged = false; S.course.pausedAt = Date.now(); }
    S.drive = r;
    if (S.course && !S.course.engaged && r > 0 && S.course.resume) { /* re-engage handled by engage() */ }
    const warn = r > 0 && eff("struct") < needStruct(r) ? " — HULL STRESS FIELD BELOW REQUIREMENT" : "";
    return ok(r === 0 ? "DRIVE RATING 0 — HOLDING POSITION" : `DRIVE RATING ${r} — ${fmt(speedC(r), 0)} C${warn}`);
  }

  /* --- navigation -------------------------------------------------------- */
  function plot(toId) {
    const to = STAR[toId]; if (!to) return false;
    if (S.at === toId && !S.course) return say(`ALREADY STATION-KEEPING AT ${to.name}`, "deny");
    const from = { x: S.pos.x, y: S.pos.y };
    S.course = { to: toId, from, corner: { x: to.x, y: from.y }, ly: dist(from, to), progress: 0, engaged: false, rating: 0 };
    return ok(`COURSE PLOTTED — ${to.name}, ${fmt(S.course.ly, 1)} LY`);
  }
  function engage() {
    if (!S.course) return say("NO COURSE PLOTTED", "deny");
    if (S.drive <= 0) return say("DRIVE RATING 0 — SET A DRIVE RATING BEFORE ENGAGING", "deny");
    if (S.course.engaged) return say("COURSE ALREADY ENGAGED", "deny");
    S.course.engaged = true; S.course.rating = S.drive; S.course.engagedAt = Date.now(); S.at = null;
    const d = transitDays(S.course.ly * (1 - S.course.progress), S.drive);
    return ok(`ENGAGED — ${STAR[S.course.to].name} IN ${fmt(d, 1)} DAYS AT RATING ${S.drive}`);
  }
  function abort() {
    if (!S.course) return say("NO COURSE TO ABORT", "deny");
    S.course = null; S.at = nearest().id;
    return ok("COURSE ABORTED — HOLDING POSITION");
  }
  function nearest() { let best = null, bd = 1e9; for (const s of STARS) { const d = dist(S.pos, s); if (d < bd) { bd = d; best = s; } } return bd < 0.75 ? best : { id: null, name: "OPEN SPACE" }; }
  function advanceCourse(simMinutes) {
    const c = S.course; if (!c || !c.engaged) return;
    const r = S.drive; if (r <= 0) { c.engaged = false; return; }
    const lyPerMin = speedC(r) / 365.25 / 1440;
    const total = c.ly;
    const done = clamp(c.progress + (lyPerMin * simMinutes) / total, 0, 1);
    c.progress = done;
    // orthogonal route: horizontal leg then vertical leg
    const legH = Math.abs(c.corner.x - c.from.x), legV = Math.abs(STAR[c.to].y - c.corner.y), legs = legH + legV || 1;
    const along = done * legs;
    if (along <= legH) { S.pos = { x: lerp(c.from.x, c.corner.x, legH ? along / legH : 1), y: c.from.y }; }
    else { S.pos = { x: c.corner.x, y: lerp(c.corner.y, STAR[c.to].y, legV ? (along - legH) / legV : 1) }; }
    if (done >= 1) {
      const to = STAR[c.to]; S.pos = { x: to.x, y: to.y }; S.at = c.to; S.course = null; S.drive = 0;
      S.eventLog.push({ md: missionDay(), text: "ARRIVED " + to.name + " — HOLDING POSITION" });
      say(`ARRIVAL — ${to.name}. DRIVE RATING 0, HOLDING POSITION`, "ok");
      Bus.emit("arrival", to);
    }
  }

  /* --- engineering: faults and procedures -------------------------------- */
  function injectFault(nid) {
    if (S.faults[nid]) return say("NODE ALREADY FAULTED", "deny");
    const sid = nodeSub(nid), kinds = FAULT_KINDS[sid];
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    S.faults[nid] = { kind, since: Date.now(), proc: SUB[sid].repair, step: 0, working: false };
    S.caps[nid] = 0.15;
    if (S.drive > maxRating()) { S.drive = maxRating(); say(`FAULT INJECTED — ${nodeName(nid)}: ${kind}. DRIVE RATING REDUCED TO ${S.drive}`, "deny"); Bus.emit("change"); persist(); return true; }
    return ok(`FAULT — ${nodeName(nid)}: ${kind}. REPAIR PROCEDURE ${SUB[sid].repair}`);
  }
  function stepProcedure(nid, action) {
    const f = S.faults[nid];
    if (!f) {
      if (nid === "comm.array" && !S.commLock) return coldStartStep(action);
      if (action === "ISOLATE") return say(`${nodeName(nid)} ISOLATED — NO FAULT PRESENT. RESET TO RESTORE`, "info");
      return say(`${nodeName(nid)} — ${action}: NO FAULT PRESENT, NO ACTION TAKEN`, "info");
    }
    if (f.working) return say("PROCEDURE STEP IN PROGRESS", "deny");
    const steps = PROCEDURES[f.proc];
    if (steps[f.step] !== action) { f.step = 0; return say(`PROCEDURE STEP REJECTED — ${action} IS NOT STEP ${f.step + 1} OF ${f.proc}. SEQUENCE RESET. REFER TO ${f.proc}`, "deny"); }
    f.working = true; Bus.emit("change");
    setTimeout(() => {
      f.working = false; f.step++;
      if (f.step >= steps.length) { delete S.faults[nid]; delete S.caps[nid]; ok(`${nodeName(nid)} RESTORED — ${f.proc} COMPLETE`); Bus.emit("repaired", nid); }
      else ok(`${f.proc} STEP ${f.step} OF ${steps.length} COMPLETE — NEXT: ${steps[f.step]}`);
    }, 1400);
    return true;
  }
  function coldStartStep(action) {
    const steps = PROCEDURES["TM-0447"];
    S.coldStep = S.coldStep || 0;
    if (S.coldWorking) return say("COLD START STEP IN PROGRESS", "deny");
    if (steps[S.coldStep] !== action) { S.coldStep = 0; return say(`COLD START STEP REJECTED — ${action} IS NOT STEP ${S.coldStep + 1}. SEQUENCE RESET. REFER TO TM-0447`, "deny"); }
    if (action === "ACQUIRE" && S.alloc.comm < 20) return say("LOCK ACQUISITION REFUSED — MINIMUM 20 MW COMMUNICATIONS ALLOCATION REQUIRED", "deny");
    S.coldWorking = true; Bus.emit("change");
    setTimeout(() => {
      S.coldWorking = false; S.coldStep++;
      if (S.coldStep >= steps.length) { S.commLock = true; S.coldStep = 0; S.commDownSince = null; ok("PHASE LOCK ACQUIRED — COMMUNICATIONS ARRAY RESTORED"); Bus.emit("commlock", true); }
      else ok(`COLD START STEP ${S.coldStep} OF ${steps.length} COMPLETE — NEXT: ${steps[S.coldStep]}`);
    }, 1600);
    return true;
  }

  /* --- the mission clock, the ticking, the event of its own choosing ----- */
  const missionDay = () => Math.floor(S.missionMin / 1440);
  const clockText = () => { const m = S.missionMin % 1440; return `MD ${pad(missionDay(), 3)} · ${pad(Math.floor(m / 60), 2)}:${pad(Math.floor(m % 60), 2)}`; };
  const watchName = () => { const hr = Math.floor((S.missionMin % 1440) / 60); return hr < 8 ? "FIRST WATCH" : hr < 16 ? "SECOND WATCH" : "THIRD WATCH"; };

  let lastTick = Date.now(), bootAt = Date.now();
  function tick() {
    const t = Date.now(), dt = clamp((t - lastTick) / 1000, 0, 5); lastTick = t;
    S.missionMin += dt * SIM_MIN_PER_SEC;
    // core thermal
    if (S.corePct > 100) S.coreTemp = clamp(S.coreTemp + (S.corePct - 100) / 10 * 0.012 * dt, 0, 1);
    else S.coreTemp = clamp(S.coreTemp - 0.01 * dt, 0.12 - (100 - S.corePct) / 400, 1);
    // comms phase lock decays after three seconds unpowered
    if (S.commLock && S.alloc.comm === 0 && S.commDownSince && t - S.commDownSince > 3000) {
      S.commLock = false; S.coldStep = 0; say("COMMUNICATIONS PHASE LOCK LOST — REFER TO TM-0447 FOR COLD START", "deny"); Bus.emit("commlock", false);
    }
    // drive rating cannot exceed what propulsion delivers
    if (S.drive > maxRating()) { S.drive = maxRating(); say(`DRIVE RATING REDUCED TO ${S.drive} — INSUFFICIENT PROPULSION POWER`, "deny"); }
    advanceCourse(dt * SIM_MIN_PER_SEC);
    // the alert of the simulation's own choosing
    if (S.nextEventAt == null) {
      const recent = (Date.now() - (S.lastEventReal || 0)) < 30 * 60 * 1000;
      S.nextEventAt = bootAt + (recent ? 20 * 60 * 1000 : (150 + Math.random() * 270) * 1000);
    }
    if (!S.event && t > S.nextEventAt) {
      S.event = { kind: "debris", startedAt: t, escalated: false };
      S.lastEventReal = t; S.nextEventAt = t + 25 * 60 * 1000;
      S.eventLog.push({ md: missionDay(), text: "DEBRIS FIELD ENCOUNTERED — UNCHARTED" });
      say("SENSORS — UNCHARTED DEBRIS FIELD AHEAD. HULL STRIKES PROBABLE", "deny");
      Bus.emit("event", S.event);
    }
    if (S.event && S.event.kind === "debris") {
      const age = t - S.event.startedAt;
      const safe = eff("struct") >= 1.0 || S.drive === 0;
      if (!S.event.escalated && age > 30000 && !safe) { S.event.escalated = true; say("HULL STRIKES — STRUCTURAL LOAD EXCEEDING FIELD CAPACITY", "deny"); Bus.emit("event", S.event); }
      if (S.event.escalated && safe) { S.event.escalated = false; Bus.emit("event", S.event); }
      if (age > 120000) { S.event = null; S.eventLog.push({ md: missionDay(), text: "DEBRIS FIELD CLEARED" }); say("DEBRIS FIELD CLEARED — ALL SECTIONS REPORT", "ok"); Bus.emit("event", null); }
    }
    Bus.emit("tick", { dt, t });
    persist();
  }

  /* --- power-on housekeeping --------------------------------------------- */
  (function resume() {
    // simulated time passed while the page was closed, at the same rate, capped at a day
    const away = clamp((Date.now() - (S.lastReal || Date.now())) / 1000, 0, 8640);
    if (away > 2) { S.missionMin += away * SIM_MIN_PER_SEC; advanceCourse(away * SIM_MIN_PER_SEC); }
    S.nextEventAt = null; S.event = null; S.coldWorking = false;
    for (const nid in S.faults) S.faults[nid].working = false;
  })();

  function reset() { Store.del("sim"); }
  return {
    S, SUBSYSTEMS, STARS,
    generation, allocated, reserve, eff, delivered, throughput, cap, maxRating, issues, nodeName, nodeSub,
    sensorProfile, computingProfile, commsProfile,
    setAlloc, nudge, preset, setCore, toggleAux, setDrive, plot, engage, abort, nearest,
    injectFault, stepProcedure, coldStartStep,
    missionDay, clockText, watchName, tick, say, lastMsg: () => lastMsg, reset, persist,
    needStruct, speedC, transitDays, dist,
  };
})();

/* ==========================================================================
   MODULE 5 — ALERT STATE MACHINE. Three conditions: NORMAL, ELEVATED,
   EMERGENCY. The effective condition is the higher of what the visitor set
   and what the simulation demands; the visitor may not stand down below
   what the model insists on. Each condition derives its own palette from
   the base tokens (hue pulled toward amber, then toward the alert red) and
   its own layout (the panel framework listens for "alert").
   ========================================================================== */
const Alert = (() => {
  const LEVELS = ["normal", "elevated", "emergency"];
  const NAMES = ["CONDITION NORMAL", "CONDITION ELEVATED", "CONDITION EMERGENCY"];
  const BASE = { peach: "#FFCC99", salmon: "#FF9966", tan: "#CC9966", butterscotch: "#FFCC66", lilac: "#CC99CC", lavender: "#9999CC", periwinkle: "#9999FF", sky: "#99CCFF", paper: "#F5F1E8" };
  let manual = clamp(Store.get("alert.manual", 0), 0, 2);
  let sim = 0, current = -1, acked = false;
  let causes = [];

  function derive(level) {
    const out = {};
    for (const k in BASE) {
      if (level === 0) out[k] = BASE[k];
      else if (level === 1) out[k] = shiftHue(BASE[k], 40, k === "paper" ? .3 : .55, .12, k === "paper" ? 1 : .97);
      else out[k] = shiftHue(BASE[k], 14, k === "paper" ? .5 : .78, .22, k === "paper" ? .98 : .93);
    }
    return out;
  }
  const PALETTES = [derive(0), derive(1), derive(2)];

  function effective() { return Math.max(manual, sim); }
  function recompute(silent) {
    const iss = Sim.issues();
    causes = iss.filter(i => i.level > 0);
    sim = causes.reduce((m, i) => Math.max(m, i.level), 0);
    apply(silent);
  }
  function apply(silent) {
    const lvl = effective();
    const con = $("#console");
    if (lvl !== current) {
      const rising = lvl > current;
      current = lvl; acked = false;
      con.dataset.alert = LEVELS[lvl];
      const P = PALETTES[lvl];
      for (const k in P) con.style.setProperty("--" + k, P[k]);
      con.style.setProperty("--c-frame", lvl === 2 ? "var(--alert)" : lvl === 1 ? "var(--butterscotch)" : "var(--peach)");
      con.style.setProperty("--c-title", lvl === 2 ? "var(--alert)" : "var(--salmon)");
      Bus.emit("alert", { level: lvl, name: NAMES[lvl], rising, causes });
      if (!silent) { if (lvl === 2) Snd.klaxon(true); else Snd.klaxon(false); if (lvl === 1 && rising) Snd.tone("alert"); if (lvl === 0 && !rising) Snd.tone("ack"); }
    } else {
      Bus.emit("alert-causes", { level: lvl, causes });
    }
    Snd.elevated(lvl === 1);
  }
  function set(level, byUser) {
    level = clamp(level, 0, 2);
    if (byUser && level < sim) {
      const c = causes[0];
      Sim.say(`CONDITION CANNOT BE LOWERED — ${c ? c.text : "SIMULATION DEMANDS " + NAMES[sim]}${c && c.fix ? ". " + c.fix : ""}`, "deny");
      return false;
    }
    manual = level; Store.set("alert.manual", manual);
    Sim.say(level === 0 ? "STANDING DOWN — CONDITION NORMAL" : NAMES[level] + (byUser ? " — SET BY OPERATOR" : ""), level === 0 ? "ok" : "deny");
    apply();
    return true;
  }
  function acknowledge() { acked = true; Snd.klaxon(false); Sim.say("ALERT ACKNOWLEDGED — KLAXON SILENCED. CONDITION UNCHANGED", "ok"); Bus.emit("alert-causes", { level: effective(), causes }); }
  Bus.on("change", () => recompute());
  Bus.on("tick", () => recompute());
  Bus.on("event", () => recompute());
  return { LEVELS, NAMES, PALETTES, effective, set, acknowledge, causes: () => causes, manual: () => manual, simLevel: () => sim, recompute, acked: () => acked, derive };
})();

/* ==========================================================================
   MODULE 6 — AUDIO ENGINE. Original synthesised tones via Web Audio: a press
   chirp, confirm, deny, acknowledge, an alert tick, a klaxon and a soft
   ambient bed. Nothing recorded, nothing imitated. Off by default; the
   context is created on the first user gesture after sound is switched on.
   ========================================================================== */
const Snd = (() => {
  let ctx = null, master = null, klax = null, amb = null, elevTimer = null;
  let enabled = !!Prefs.get("sound"), ambientOn = !!Prefs.get("ambient");

  function ensure() {
    if (ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
      return true;
    } catch (e) { return false; }
  }
  function env(g, t0, a, hold, r, peak) {
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.setValueAtTime(peak, t0 + a + hold); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + hold + r);
  }
  function beep(freq, t0, dur, type = "sine", peak = 0.18, glideTo = null) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0); if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    env(g, t0, 0.006, Math.max(0.01, dur - 0.03), 0.03, peak);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function tone(kind) {
    if (!enabled || !ensure()) return;
    if (ctx.state === "suspended") ctx.resume();
    const t = ctx.currentTime + 0.005;
    switch (kind) {
      case "press":   beep(1480, t, 0.045, "sine", 0.12); beep(1975, t + 0.05, 0.05, "sine", 0.12); break;
      case "nav":     beep(1175, t, 0.05, "sine", 0.12); beep(1760, t + 0.055, 0.06, "sine", 0.12); break;
      case "confirm": beep(880, t, 0.09, "sine", 0.16, 1320); beep(1760, t + 0.1, 0.12, "sine", 0.14); break;
      case "deny":    beep(196, t, 0.08, "square", 0.08); beep(196, t + 0.13, 0.11, "square", 0.08); break;
      case "ack":     beep(1568, t, 0.06, "sine", 0.14); beep(1318, t + 0.07, 0.06, "sine", 0.14); beep(1046, t + 0.14, 0.1, "sine", 0.14); break;
      case "alert":   beep(660, t, 0.14, "triangle", 0.16); beep(880, t + 0.16, 0.18, "triangle", 0.16); break;
      case "tick":    beep(1046, t, 0.03, "sine", 0.06); break;
      case "message": beep(1320, t, 0.06, "sine", 0.12); beep(1320, t + 0.09, 0.06, "sine", 0.12); beep(1760, t + 0.2, 0.12, "sine", 0.12); break;
      default:        beep(1480, t, 0.045, "sine", 0.12);
    }
  }
  function klaxon(on) {
    if (!on) { if (klax) { try { klax.stop(); } catch (e) {} klax = null; } return; }
    if (klax || !enabled || !ensure()) return;
    if (ctx.state === "suspended") ctx.resume();
    let alive = true, timer = null;
    const cycle = () => {
      if (!alive) return;
      const t = ctx.currentTime + 0.02;
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = "sawtooth"; f.type = "lowpass"; f.frequency.value = 1800;
      o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(880, t + 0.62);
      env(g, t, 0.03, 0.55, 0.12, 0.07);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 0.8);
      timer = setTimeout(cycle, 1150);
    };
    cycle();
    klax = { stop() { alive = false; clearTimeout(timer); } };
  }
  function elevated(on) {
    if (!on) { clearTimeout(elevTimer); elevTimer = null; return; }
    if (elevTimer) return;
    const tickIt = () => { tone("tick"); setTimeout(() => tone("tick"), 140); elevTimer = setTimeout(tickIt, 6000); };
    elevTimer = setTimeout(tickIt, 6000);
  }
  function ambient(on) {
    ambientOn = on; Prefs.set("ambient", on);
    if (!on) { if (amb) { try { amb.stop(); } catch (e) {} amb = null; } return; }
    if (!enabled || !ensure() || amb) return;
    if (ctx.state === "suspended") ctx.resume();
    const g = ctx.createGain(); g.gain.value = 0.0001; g.connect(master);
    const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = 55; const og = ctx.createGain(); og.gain.value = 0.35; o.connect(og); og.connect(g); o.start();
    const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = 110.5; const og2 = ctx.createGain(); og2.gain.value = 0.12; o2.connect(og2); og2.connect(g); o2.start();
    // brown noise bed
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    const n = ctx.createBufferSource(); n.buffer = buf; n.loop = true; const nf = ctx.createBiquadFilter(); nf.type = "lowpass"; nf.frequency.value = 320;
    const ng = ctx.createGain(); ng.gain.value = 0.5; n.connect(nf); nf.connect(ng); ng.connect(g); n.start();
    g.gain.exponentialRampToValueAtTime(0.05, ctx.currentTime + 2.5);
    amb = { stop() { g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8); setTimeout(() => { try { o.stop(); o2.stop(); n.stop(); } catch (e) {} }, 900); } };
  }
  function setEnabled(on) {
    enabled = !!on; Prefs.set("sound", enabled);
    if (!enabled) { klaxon(false); elevated(false); if (amb) { try { amb.stop(); } catch (e) {} amb = null; } }
    else { ensure(); if (ambientOn) ambient(true); if (Alert.effective() === 2 && !Alert.acked()) klaxon(true); }
    Bus.emit("sound", enabled);
  }
  LC.setPressHook(kind => tone(kind));
  return { tone, klaxon, elevated, ambient, setEnabled, enabled: () => enabled, ambientOn: () => ambientOn, available: () => !!(window.AudioContext || window.webkitAudioContext) };
})();

/* ==========================================================================
   MODULE 7a — THE CORPUS. Original in-universe material for the invented
   vessel OSV ANTIPHON (OSV-1147) of the Outward Survey Commission: technical
   manuals (TM), procedures (PM), mission logs (ML), personnel records (PR),
   survey data (SV) and history (HX). Cross-references are written [[ID]] or
   [[ID|label]]; [[panel:xyz|label]] opens a console panel. Every word here
   was written for this exhibit. Nothing is quoted from anywhere.
   ========================================================================== */
const CATS = { TM: "TECHNICAL MANUALS", PM: "PROCEDURES", ML: "MISSION LOGS", PR: "PERSONNEL", SV: "SURVEY DATA", HX: "HISTORY" };
const CORPUS = [];
const E = (id, title, tags, body, xrefs) => CORPUS.push({ id, cat: id.slice(0, 2), title, tags, body, xrefs: xrefs || [] });

/* ---------------------------------------------------------------- TM ---- */
E("TM-0001", "OSV ANTIPHON — VESSEL OVERVIEW", "ship vessel antiphon 1147 kestrel class overview decks crew complement dimensions",
`<p><b>OSV ANTIPHON</b>, registry <span class="id">OSV-1147</span>, is the fourth of six Kestrel-class long-baseline survey cruisers built for the Outward Survey Commission at the Harrowgate Yards. Length 212 m, beam 64 m, eleven decks, standard complement forty-seven. She was commissioned in Commission Year 38 and is presently engaged on the Corvane Reach Long-Baseline Survey, a nine-hundred-day charting mission beyond the Meridian Line ([[HX-001]], [[HX-002]]).</p>
<p>The vessel is organised around a single <b>power distribution grid</b> ([[TM-0012]]) fed by the primary fusion core ([[TM-0010]]) and an auxiliary cell bank ([[TM-0011]]). Seven trunk feeds serve propulsion, sensors, environmental, hull stress compensation, computing, medical and communications. Every operational decision on this ship is, sooner or later, a decision about where those megawatts go, which is why the Operations console ([[panel:ops|OPERATIONS]]) is the first station any officer qualifies on.</p>
<p>Deck plan in brief: Decks 1–2 command and the library computer core; Decks 3–4 crew quarters and the mess; Deck 5 the clinical bay ([[TM-0070]]); Decks 6–8 survey laboratories and the lateral arrays; Deck 9 the arboretum ([[TM-0100]]) and environmental plant; Decks 10–11 the core, the drive and stores. The name is explained in [[HX-003]].</p>`, ["TM-0012", "HX-001", "HX-003", "PR-001"]);

E("TM-0010", "PRIMARY FUSION CORE — WEXLER-HAHN TOROID", "core fusion power generation 620 megawatts thermal output percent temperature",
`<p>The <b>Wexler-Hahn toroidal fusion core</b> is rated at <b>620 MW</b> continuous electrical output at 100% setting. It can be driven to 110% for limited periods; above 100% the coolant margin erodes and core temperature climbs steadily until output is reduced. The thermal excursion procedure is [[PM-005]].</p>
<p>Output is set from the Operations console in ten-percent steps between 60% and 110%. The console will refuse a reduction that would leave generation below the current allocation: shed load first, then reduce output. It will not refuse an increase, but it will tell you what you are spending. Core temperature is displayed as a fraction of the design limit; 70% is the elevated threshold and 90% the emergency threshold ([[PM-001]]).</p>
<p>The core is on Deck 10, aft. Its containment is passive and does not depend on the grid it feeds — a design requirement carried over from the loss of the first Commission vessel to a cascading power fault, long before this class was drawn.</p>`, ["TM-0011", "TM-0012", "PM-005"]);

E("TM-0011", "AUXILIARY CELL BANK", "auxiliary cells battery bank 180 megawatts offline online generation reserve",
`<p>Twenty-four <b>auxiliary cells</b> on Deck 11 contribute a further <b>180 MW</b> to the grid when online, giving a total generation of 800 MW with the core at 100%. The bank exists so that the core can be run below its rating for most of a long survey, extending its service life; it is normal to leave the cells online and the core at 100%, and it is also normal to run the core at 90% with the cells online on a quiet station-keeping watch.</p>
<p>Taking the bank offline is a legitimate test of the crew's power discipline and the console permits it only when the core alone can carry the present allocation. Otherwise it refuses, and says by how much the allocation must be reduced. Compare [[TM-0013]], the emergency battery reserve, which is <i>not</i> on the grid and cannot be allocated from any console.</p>`, ["TM-0010", "TM-0012", "TM-0013"]);

E("TM-0012", "POWER DISTRIBUTION GRID — SEVEN TRUNKS", "power grid distribution allocation trunk subsystems propulsion sensors environmental structural computing medical communications megawatts nominal",
`<p>The <b>power distribution grid</b> carries generation to seven trunk feeds. Each trunk has a <b>nominal demand</b> at which its subsystem performs to specification: propulsion 240 MW, sensors 90 MW, environmental 110 MW, hull stress compensation 120 MW, computing 70 MW, medical 40 MW, communications 60 MW — 730 MW in all, leaving 70 MW in reserve at full generation.</p>
<p>Allocation is not a suggestion. A subsystem given less than nominal <b>performs less well in proportion</b>: sensor arrays refresh more slowly and resolve less finely ([[TM-0033]]), atmosphere loops fall behind ([[TM-0040]]), the library retrieves fewer results more slowly ([[TM-0061]]), and the communications array loses its phase lock entirely if left unpowered for more than a few seconds ([[TM-0080]], [[TM-0447]]). A subsystem given <i>more</i> than nominal may exceed specification — sensors above 105% reach further and see fainter things.</p>
<p>The grid refuses any allocation whose total exceeds generation, and it will refuse a cut to propulsion or hull stress that the current drive rating cannot tolerate ([[TM-0021]]). Refusals are stated in plain language with the figures. There is no override. The reallocation procedure is [[PM-002]]; the five standard power profiles are described there.</p>`, ["TM-0010", "TM-0011", "PM-002", "TM-0021", "panel:ops"]);

E("TM-0013", "EMERGENCY BATTERY RESERVE", "battery reserve emergency 36 megawatt hours isolated not on grid",
`<p>The <b>emergency battery reserve</b> holds 36 MWh in isolated cells on Deck 11 and is connected to nothing but the environmental trunk and the clinical bay, through a switch that closes only when the grid itself fails. It is not visible on the Operations console because it cannot be allocated: its whole purpose is to be beyond reach.</p>
<p>At minimum environmental load the reserve keeps the crew breathing for roughly nineteen hours. Every Commission vessel carries one, sized for the time it takes a sister vessel at rating 7 to cover forty light-years. That figure is not a coincidence ([[TM-0021]]).</p>`, ["TM-0011", "TM-0040", "PM-016"]);

E("TM-0020", "KESSLER-AMUNDSEN TRANSLATION DRIVE", "drive propulsion kessler amundsen translation rating speed light years c coils injector coolant",
`<p>The <b>Kessler-Amundsen translation drive</b> moves the vessel between stars. Its output is expressed as a <b>drive rating</b> from 0 (holding position) to 9. Effective speed rises steeply with rating: a rating of 3 corresponds to about 47 times the speed of light, a rating of 6 to about 530, and a rating of 9 to about 2,190. The relationship is a power law — rating to the three-and-a-half — and the navigation console ([[panel:nav|NAVIGATION]]) computes transit times from it directly.</p>
<p>The drive comprises the injector manifold, the coolant loop, the translation coils and the drive controller. Each rating step requires <b>25 MW</b> of delivered propulsion power, so at nominal allocation (240 MW) rating 9 is available; a fault that reduces the trunk's throughput reduces the available rating, and if a rating is already set above what propulsion can now deliver the controller steps it down and says so.</p>
<p>The drive does not care about the hull. The hull-stress compensation field does ([[TM-0021]], [[TM-0050]]).</p>`, ["TM-0021", "TM-0050", "PM-008", "PM-015"]);

E("TM-0021", "DRIVE RATING AND HULL STRESS — THE RATING NINE PARADOX", "drive rating hull stress requirement paradox nine structural field percent",
`<p>Each drive rating imposes a load on the hull that the <b>hull-stress compensation field</b> must carry. The field requirement, as a fraction of nominal allocation, is <b>40% plus 7% per rating step</b>: rating 3 needs 61%, rating 6 needs 82%, rating 9 needs 103%. Holding position needs 30%.</p>
<p>Notice the last figure. At rating 9 the field needs <i>more than its nominal allocation</i>. The Kestrel class can run at rating 9, but only if power is deliberately moved into hull stress from somewhere else — usually sensors, since nobody surveys anything at rating 9. Engineers call this the <b>rating nine paradox</b> and it is not a fault; it is the yard telling you that the top rating is for transit, not for work.</p>
<p>The console enforces the relationship both ways. It refuses a drive rating the field cannot support, and it refuses to cut the field below what the current rating needs less a 25-point margin. Inside that margin the alert machine raises CONDITION ELEVATED; beyond it, EMERGENCY ([[PM-001]]). The correct response to either is to raise hull stress power or reduce the rating — never to argue with the grid.</p>`, ["TM-0020", "TM-0050", "PM-001", "PM-002"]);

E("TM-0030", "LATERAL SURVEY ARRAYS", "sensors lateral arrays port starboard survey scan short range",
`<p>The two <b>lateral survey arrays</b> run the length of Decks 6 to 8 on either beam. They are the workhorses of the short-range scan: planetary bodies, belts, stations and vessels within a system are resolved by the laterals and classified by the signal processor ([[TM-0033]]).</p>
<p>Array performance is a direct function of delivered sensor power. Below about 80% of nominal the classification confidence drops noticeably; below 50% bodies are detected but not classified and appear as UNRESOLVED; below 40% only the largest bodies register at all. The fault isolation procedure for the arrays is [[PM-006]].</p>`, ["TM-0033", "PM-006", "panel:sensors"]);

E("TM-0031", "FORWARD SPECTROMETER BANK", "spectrometer spectral scan stellar class lines absorption forward bank",
`<p>The <b>forward spectrometer bank</b> resolves the spectrum of whatever the bow is pointed at, which is usually the local star. It returns the stellar class, the dominant absorption lines and, at adequate power, the abundances that let the survey team estimate the age of a system. The SPECTRAL scan mode on the sensors console reads from this bank.</p>
<p>Dark current in the detectors rises when the bank is under-powered, and the readings become noisy before they become wrong: a spectral scan at 50% sensor power will still name the class but will not commit to line strengths. Repair is by [[PM-006]].</p>`, ["TM-0030", "TM-0033", "SV-014"]);

E("TM-0032", "GRAVIMETRIC NET", "gravimetric net gravity calibration ping 47 seconds masses long range",
`<p>The <b>gravimetric net</b> is a lattice of forty-seven gravimeters distributed through the hull, read together as a single instrument. It detects mass at long range — compact objects, giant planets, the dark heart of a nebula — and is the basis of the LONG RANGE scan mode.</p>
