E("HX-001", "THE OUTWARD SURVEY COMMISSION", "outward survey commission founding charter civilian directorate harrowgate history",
`<p>The <b>Outward Survey Commission</b> was chartered in Commission Year 1 under the Meridian Accords ([[HX-002]]) as a purely civilian body with one task: to chart, catalogue and describe the space beyond the Meridian Line, and to do nothing else there. It builds and crews survey vessels, maintains the Kettleridge Relay ([[SV-015]]) and publishes what it finds. It carries no weapons, claims no territory and lands on no living world. Its Directorate sits at Harrowgate, beside the yards that build its ships ([[HX-004]]).</p>
<p>The Commission's rule on biospheres — look and leave — has been tested on every long survey and has held on every one, usually over the strenuous objection of the biologist who most wanted to break it ([[PR-023]]).</p>`, ["HX-002", "HX-004", "SV-015"]);

E("HX-002", "THE MERIDIAN ACCORDS AND THE MERIDIAN LINE", "meridian accords line boundary agreement charter history",
`<p>The <b>Meridian Accords</b> fixed the Meridian Line — an agreed boundary of settled space, drawn on a chart and marked by nothing — and founded the Commission to survey what lay beyond it ([[HX-001]]). The Line exists in no instrument. Every vessel crossing it nevertheless marks the moment ([[ML-018]]), and the cartographer of every vessel draws it in a colour of their own choosing, which is a tradition the Commission has never sanctioned and never stopped.</p>`, ["HX-001", "ML-018"]);

E("HX-003", "THE FIRST ANTIPHON — WHY THE SHIP IS CALLED WHAT IT IS", "antiphon name origin first ship coast survey call response fog three words",
`<p>The first <b>Antiphon</b> was a sounding vessel of the old coast survey, working fog-bound channels long before anyone left the ground. Her crews kept station in fog by <b>call and response</b>: a call from the leadsman, an answer from the boat, sung back and forth across the water so that neither lost the other. An antiphon is a thing sung in answer. The name passed to the Commission's fourth Kestrel-class vessel because a survey ship's whole purpose is to call into the dark and record what answers.</p>
<p>Kettleridge Relay sends every departing vessel the leadsman's three words, and a communications officer who does not answer correctly hears about it for the whole mission ([[ML-001]], [[PR-007]]). The words are not recorded here; they are the crew's.</p>`, ["ML-001", "PR-007", "TM-0001"]);

E("HX-004", "THE KESTREL CLASS AND KESTREL'S REST", "kestrel class development harrowgate yards six vessels first ship marker",
`<p>Six <b>Kestrel-class</b> long-baseline survey cruisers were built at the Harrowgate Yards: Kestrel, Halcyon Gate, Cantor, Antiphon, Lantern Hill (completed as a tender) and one hull not yet named. The class was designed around a single power grid with a small number of large trunks, on the principle that a survey crew should be able to see every megawatt and argue about it ([[TM-0012]]). The first of the class ended her service at the M2 star now called <b>Kestrel's Rest</b>, where a commemorative buoy marks the point at which she completed the first crossing of the Reach.</p>`, ["TM-0012", "HX-008", "SV-009"]);

E("HX-005", "THE NAMING OF THE CORVANE REACH", "corvane reach naming elisenda corvane cartographer history",
`<p>The region beyond the Meridian Line was named for <b>Elisenda Corvane</b>, the cartographer who first argued, from the motions of stars near the Line, that the volume beyond held a large dark mass — the object now called Tolmach's Anomaly ([[SV-010]]) — and who drew the first chart of the Reach from a desk without ever seeing it. Its brightest star, the blue giant, carries her name too ([[SV-014]]). She did not live to see the Commission founded. Her chart was wrong in every particular and right in its shape.</p>`, ["SV-010", "SV-014", "PR-019"]);

E("HX-006", "THE CONSTRUCTION OF KETTLERIDGE RELAY", "kettleridge relay construction history station beacons reference",
`<p><b>Kettleridge Relay</b> was assembled in orbit around a G2 star on the Meridian Line over four years, the first structure the Commission built and still its largest. Its purpose was, and is, to be a fixed point: a phase reference for every array in the Reach ([[TM-0080]]), a rendezvous for tenders, a place to send a message to. Its first stationmaster is said to have chosen the site because the star was "boring in every way that matters." Nine stationmasters later it remains so.</p>`, ["SV-015", "TM-0080"]);

E("HX-007", "THE FORTY-SEVEN CONVENTION", "forty seven 47 convention numbers labels meaning yard frame numbering joke",
`<p>Console displays aboard Commission vessels carry small numeric labels that have no meaning. This is by design: Standard 7 ([[TM-0091]]) requires that structural blocks and controls be indistinguishable, and a block without a number looks unfinished. The labels are generated from the Harrowgate Yards' frame-numbering scheme, which for reasons lost to the yard's own records begins at <b>47</b>.</p>
<p>The consequence is that the number 47 appears on Commission consoles far more often than chance would allow, and every crew notices within a week, and every crew decides it means something. It does not. The cold-start manual is filed at 0447 ([[TM-0447]]), the gravimetric net has forty-seven gravimeters and a 47-second reference ([[TM-0032]]), the vessel carries forty-seven crew, Sub-Lieutenant Tallis has cabin 47, and frame 47 has a dent with a name. The auditor has asked about this too.</p>`, ["TM-0091", "TM-0447", "TM-0032", "PR-013"]);

E("HX-008", "OSV HALCYON GATE AND THE LOST LOCK", "halcyon gate lost phase lock communications silence cold start procedure origin history vane",
`<p><b>OSV Halcyon Gate</b>, second of the Kestrel class, went silent for forty-one days on her final survey. Nothing was broken. A watch officer, shedding load in a hurry during a core thermal excursion, cut the communications trunk to zero; the phase lock decayed in seconds; and when power was restored the array, which reported no fault, would not listen. The crew had every megawatt they needed and no procedure. They found the relay again by trial and error, and the cold start ([[TM-0447]]) was written the week they came home so that nobody would have to again.</p>
<p>Her first officer on that survey was Idris Vane ([[PR-001]]). It is not a coincidence that the Operations console aboard Antiphon warns when the communications allocation reaches zero.</p>`, ["TM-0447", "TM-0080", "PR-001"]);

E("HX-009", "THE LONG-BASELINE METHOD", "long baseline survey method gravimetric two points parallax distance science",
`<p>A <b>long-baseline survey</b> measures the same distant masses from two widely separated points and derives their distances and motions from the difference — the same geometry as a pair of eyes, on a scale of light-years. Antiphon's baseline runs from Kettleridge to Halveth's Star, 42 light-years; Cantor's, from the Lanterns, gives a third point. The deep series at Halveth ([[ML-377]]) is the far end of the baseline and the reason the vessel has held station for thirty-five days doing, to an untrained eye, nothing at all. The method rewards patience, station-keeping discipline and a generous sensor allocation, and punishes the lack of any of them.</p>`, ["ML-377", "TM-0032", "PR-004"]);

E("HX-010", "STANDARD 7 — THE CONSOLE DISPLAY STANDARD", "standard 7 console display history flat colour black backlit panels legibility compartment budget",
`<p>Commission consoles follow a display standard adopted for the first Kestrel and never revised: flat colour on black, no gradation, no outline, no small type, large targets, a fixed rhythm of gaps and edges ([[TM-0090]], [[TM-0091]]). The standard's stated rationale is legibility — a console must be readable from the far side of a compartment in a glance — and its unstated one was cost. The first Kestrel's panels were backlit printed sheets, because that was what the yard could afford, and the standard was written to make a virtue of what the yard could afford.</p>
<p>It succeeded so completely that later, richer vessels kept it, and its constraints became its identity. The standard has known weaknesses, which the museum guide beside this console enumerates more candidly than the standard does: an operator cannot tell a control from decoration, cannot tell where they are, cannot go back, and receives no help. The standard's answer is that its operators are trained. That is an answer.</p>`, ["TM-0090", "TM-0091", "panel:about"]);

/* ==========================================================================
   MODULE 7b — THE LIBRARY. A full-text inverted index over the corpus, a
   ranked search, cross-references in both directions, bookmarks and read
   state, and the query parser behind the "COMPUTER," prompt, which answers a
   few intents from the live vessel and turns everything else into a search.
   Voice input through the Web Speech API where the browser offers it.
   ========================================================================== */
const Library = (() => {
  const STOP = new Set("a an the and or of to in on at for by with from as is are was were be been being it its this that these those there here what which who whom whose when where why how do does did done can could will would shall should may might must have has had having i you he she they we me him her them us my your his their our about into over under than then so if but not no yes all any some more most very just also only own same too s t".split(" "));
  const stem = w => {
    if (w.length <= 3) return w;
    w = w.replace(/'s$/, "");
    if (/ies$/.test(w)) return w.slice(0, -3) + "y";
    if (/(sses|shes|ches|xes)$/.test(w)) return w.slice(0, -2);
    if (/ing$/.test(w) && w.length > 5) return w.slice(0, -3);
    if (/ed$/.test(w) && w.length > 4) return w.slice(0, -2);
    if (/s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
    return w;
  };
  const words = s => (String(s).toLowerCase().replace(/<[^>]+>/g, " ").replace(/\[\[([^\]|]+)(\|[^\]]*)?\]\]/g, (m, a, b) => " " + a.replace(/^panel:/, "") + " " + (b ? b.slice(1) : "") + " ").match(/[a-z0-9]+(?:'[a-z]+)?/g) || []);
  const tokens = s => words(s).filter(w => !STOP.has(w)).map(stem);

  const byId = Object.fromEntries(CORPUS.map(e => [e.id, e]));
  const index = new Map();          // term -> Map(id -> weight)
  const backlinks = {};             // id -> Set(ids that link to it)
  const N = CORPUS.length;
  (function build() {
    for (const e of CORPUS) {
      const add = (list, w) => { const seen = {}; for (const t of list) seen[t] = (seen[t] || 0) + 1; for (const t in seen) { if (!index.has(t)) index.set(t, new Map()); const m = index.get(t); m.set(e.id, (m.get(e.id) || 0) + w * (1 + Math.log(seen[t]))); } };
      add(tokens(e.title), 4); add(tokens(e.tags), 2.5); add(tokens(e.body), 1); add(tokens(e.id.replace("-", " ") + " " + e.id), 3);
      const links = new Set(e.xrefs.filter(x => !x.startsWith("panel:")));
      for (const m of e.body.matchAll(/\[\[([^\]|]+)(?:\|[^\]]*)?\]\]/g)) if (!m[1].startsWith("panel:")) links.add(m[1]);
      e.links = Array.from(links).filter(id => byId[id]);
      e.panels = Array.from(new Set([...e.xrefs, ...Array.from(e.body.matchAll(/\[\[(panel:[^\]|]+)(?:\|[^\]]*)?\]\]/g)).map(m => m[1])].filter(x => x.startsWith("panel:")))).map(x => x.slice(6));
      for (const id of e.links) { (backlinks[id] = backlinks[id] || new Set()).add(e.id); }
    }
  })();
  const idf = t => { const m = index.get(t); return m ? Math.log(1 + N / m.size) : 0; };

  function search(q, limit = 12) {
    const terms = Array.from(new Set(tokens(q)));
    if (!terms.length) return [];
    const scores = new Map(), hits = new Map();
    for (const t of terms) {
      let m = index.get(t);
      if (!m && t.length >= 4) {                                   // prefix fallback
        m = new Map();
        for (const [k, v] of index) if (k.startsWith(t)) for (const [id, w] of v) m.set(id, (m.get(id) || 0) + w * 0.6);
      }
      if (!m) continue;
      const w = idf(t) || 1;
      for (const [id, tw] of m) { scores.set(id, (scores.get(id) || 0) + tw * w); hits.set(id, (hits.get(id) || 0) + 1); }
    }
    const out = [];
    for (const [id, s] of scores) out.push({ id, entry: byId[id], score: s * (hits.get(id) === terms.length ? 1.6 : 1) * (0.7 + 0.3 * hits.get(id) / terms.length) });
    out.sort((a, b) => b.score - a.score);
    return out.slice(0, limit).map(r => Object.assign(r, { snippet: snippet(r.entry, terms) }));
  }
  function snippet(e, terms) {
    const plain = e.body.replace(/<[^>]+>/g, " ").replace(/\[\[([^\]|]+)\|([^\]]*)\]\]/g, "$2").replace(/\[\[([^\]]+)\]\]/g, "$1").replace(/\s+/g, " ").trim();
    const sents = plain.split(/(?<=[.!?])\s+/);
    const hit = sents.find(s => tokens(s).some(t => terms.includes(t))) || sents[0] || "";
    return hit.length > 180 ? hit.slice(0, 177).replace(/\s\S*$/, "") + "…" : hit;
  }
  const entry = id => byId[id];
  const byCat = cat => CORPUS.filter(e => e.cat === cat);
  const related = id => { const e = byId[id]; if (!e) return []; const set = new Set(e.links); for (const b of (backlinks[id] || [])) set.add(b); set.delete(id); return Array.from(set); };
  const titleOf = id => byId[id] ? byId[id].title : id;

  /* bookmarks and read state */
  let bookmarks = Store.get("lib.bookmarks", []), read = Store.get("lib.read", []);
  const isBookmarked = id => bookmarks.includes(id);
  const toggleBookmark = id => { bookmarks = isBookmarked(id) ? bookmarks.filter(x => x !== id) : [...bookmarks, id]; Store.set("lib.bookmarks", bookmarks); return isBookmarked(id); };
  const markRead = id => { if (!read.includes(id)) { read.push(id); Store.set("lib.read", read); } };
  const isRead = id => read.includes(id);

  /* render body html: [[ID|label]] -> xref spans; panel links too */
  function renderBody(e) {
    return e.body.replace(/\[\[([^\]|]+)(?:\|([^\]]*))?\]\]/g, (m, id, label) => {
      if (id.startsWith("panel:")) return `<span class="xr" data-panel="${esc(id.slice(6))}">${esc(label || id.slice(6).toUpperCase())}</span>`;
      const t = byId[id]; return `<span class="xr" data-entry="${esc(id)}">${esc(label || (t ? t.title : id))}</span>`;
    });
  }

  /* ---- the query parser: a few intents from the live vessel, else search ---- */
  const SUBWORDS = { prop: /\b(propulsion|drive|engine|translation)\b/, sens: /\b(sensor|sensors|array|arrays|scan|scanning)\b/, env: /\b(environmental|life support|atmosphere|air|oxygen|environment)\b/, struct: /\b(hull|structural|stress|field|integrity)\b/, comp: /\b(computing|computer core|cores?|library core|processing)\b/, med: /\b(medical|clinical|sick ?bay|infirmary)\b/, comm: /\b(communications?|comms|array|phase lock|relay link)\b/ };
  function parse(raw) {
    let q = String(raw || "").trim().replace(/^\s*(computer|library)\s*[,:;.!-]?\s*/i, "").replace(/[?!.]+$/, "").trim();
    const lq = q.toLowerCase();
    if (!q) return { kind: "empty" };
    const cp = Sim.computingProfile();
    const fillers = /^(please\s+)?(tell me about|tell me|what is|what's|what are|who is|who's|show me|show|find|search for|search|look up|lookup|information on|info on|define|explain|describe|open|read|display|give me|what do you know about|do you have anything on|anything on)\s+/i;
    // live intents
    if (/\b(condition|alert|alarm)\b/.test(lq) && !/\bprocedure|manual|doctrine\b/.test(lq)) {
      const c = Alert.causes(); return { kind: "answer", text: `${Alert.NAMES[Alert.effective()]}${c.length ? " — " + c.map(x => x.text).join("; ") : " — NO ACTIVE CAUSES"}`, results: ["PM-001", "PM-003"] };
    }
    if (/\b(what time|time is it|clock|mission day|what day|the date|today)\b/.test(lq)) return { kind: "answer", text: `${Sim.clockText()} — ${Sim.watchName()}`, results: ["ML-412", "PM-013"] };
    if (/\b(where are we|our position|where is the ship|current position|location of the ship)\b/.test(lq)) {
      const n = Sim.nearest(); const c = Sim.S.course;
      return { kind: "answer", text: c && c.engaged ? `UNDER WAY TO ${STAR[c.to].name} — ${Math.round(c.progress * 100)}% OF ${fmt(c.ly, 1)} LY AT RATING ${Sim.S.drive}` : `HOLDING POSITION — ${n.name}${n.id ? ", " + STAR[n.id].cls : ""}`, results: n.id ? [STAR[n.id].lib] : [], actions: [{ label: "NAVIGATION", panel: "nav" }] };
    }
    if (/\b(who is on watch|who's on watch|on duty|current watch|who has the watch)\b/.test(lq)) {
      const w = Sim.watchName().split(" ")[0]; const names = ROSTER.filter(r => r.watch === w).map(r => r.name);
      return { kind: "answer", text: `${Sim.watchName()} — ${names.length} ON DUTY: ${names.slice(0, 6).join(", ")}${names.length > 6 ? " AND " + (names.length - 6) + " OTHERS" : ""}`, results: ["PM-013"], actions: [{ label: "PERSONNEL", panel: "personnel" }] };
    }
    if (/\b(who is|who's|who are|record of|file on|personnel file)\b/.test(lq)) {
      const rest = lq.replace(/\b(who is|who's|who are|the|record of|file on|personnel file|for|of)\b/g, " ").trim();
      const hit = ROSTER.find(r => rest && (r.name.toLowerCase().includes(rest) || rest.split(/\s+/).every(w => (r.name + " " + r.rank + " " + r.dept).toLowerCase().includes(w))));
      if (hit) return { kind: "answer", text: `${hit.name} — ${hit.rank}, ${hit.dept}, ${hit.watch} WATCH`, results: hit.rec ? [hit.rec] : [], actions: [{ label: "PERSONNEL", panel: "personnel" }] };
    }
    if (/\b(how far|distance|course to|plot|transit|travel to|go to|set course|far is|get to|reach)\b/.test(lq)) {
      const star = STARS.find(s => s.name.toLowerCase().split(/[^a-z]+/).filter(w => w.length > 3 && w !== "star" && w !== "point" && w !== "relay" && w !== "deep").some(w => lq.includes(w)));
      if (star) {
        const d = Sim.dist(Sim.S.pos, star), r = Sim.S.drive;
        return { kind: "answer", text: `${star.name} — ${fmt(d, 1)} LY. ${r > 0 ? "TRANSIT " + fmt(Sim.transitDays(d, r), 1) + " DAYS AT RATING " + r : "SET A DRIVE RATING FOR TRANSIT TIME. AT RATING 6: " + fmt(Sim.transitDays(d, 6), 1) + " DAYS"}`, results: [star.lib, "PM-015"], actions: [{ label: "PLOT COURSE", fn: () => { Sim.plot(star.id); UI.show("nav"); } }] };
      }
    }
    if (/\b(status|state|how is|how are|report|level|power|reserve|allocation|generation|megawatt|mw)\b/.test(lq)) {
      const sid = Object.keys(SUBWORDS).find(k => SUBWORDS[k].test(lq));
      if (sid) {
        const s = SUB[sid], e = Sim.eff(sid);
        return { kind: "answer", text: `${s.name} — ${fmt(Sim.S.alloc[sid])} MW ALLOCATED, ${fmt(Sim.delivered(sid))} MW DELIVERED, ${Math.round(e * 100)}% OF NOMINAL${e < .5 ? " — DEGRADED" : e > 1.05 ? " — ABOVE SPECIFICATION" : ""}`, results: { prop: ["TM-0020"], sens: ["TM-0033"], env: ["TM-0040"], struct: ["TM-0050"], comp: ["TM-0060"], med: ["TM-0070"], comm: ["TM-0080"] }[sid], actions: [{ label: "OPERATIONS", panel: "ops" }] };
      }
      if (/\b(power|reserve|allocation|generation|report|grid)\b/.test(lq)) return { kind: "answer", text: `GENERATION ${fmt(Sim.generation())} MW — ALLOCATED ${fmt(Sim.allocated())} MW — RESERVE ${fmt(Sim.reserve())} MW — CORE ${Sim.S.corePct}%, AUXILIARY ${Sim.S.auxOnline ? "ONLINE" : "OFFLINE"}`, results: ["TM-0012", "PM-002"], actions: [{ label: "OPERATIONS", panel: "ops" }] };
    }
    if (/\bbookmarks?\b/.test(lq)) return { kind: "answer", text: bookmarks.length ? `${bookmarks.length} BOOKMARKED ENTRIES` : "NO BOOKMARKS", results: bookmarks.slice(0, 12) };
    // search
    if (!cp.parser && words(q).length > 3) return { kind: "refused", text: "NATURAL LANGUAGE PARSER OFFLINE — COMPUTING BELOW 30%. USE ONE OR TWO KEYWORDS" };
    const cleaned = q.replace(fillers, "").trim() || q;
    const res = search(cleaned, cp.maxResults || 1);
    return { kind: "search", text: res.length ? `${res.length} ENTR${res.length === 1 ? "Y" : "IES"} FOR "${cleaned.toUpperCase()}"${cp.maxResults < 14 ? " — RETRIEVAL LIMITED TO " + cp.maxResults : ""}` : `NO ENTRIES FOR "${cleaned.toUpperCase()}"`, results: res.map(r => r.id), search: res, delay: cp.delayMs };
  }

  /* ---- voice ---- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  function listen(onResult, onEnd) {
    if (!SR) { onEnd("unavailable"); return null; }
    try {
      const r = new SR(); r.lang = "en-GB"; r.interimResults = false; r.maxAlternatives = 1;
      let got = false;
      r.onresult = e => { got = true; onResult(e.results[0][0].transcript); };
      r.onerror = e => onEnd(e.error || "error");
      r.onend = () => onEnd(got ? "done" : "silence");

    } catch (e) { onEnd("error"); return null; }
  }

  return { CORPUS, CATS, search, entry, byCat, related, titleOf, renderBody, parse, listen, voiceAvailable: !!SR, isBookmarked, toggleBookmark, markRead, isRead, bookmarks: () => bookmarks.slice(), readCount: () => read.length, size: N, indexSize: () => index.size, reset() { bookmarks = []; read = []; } };
})();

/* ---- the kit: composite pieces made only of primitives ------------------- */
const UIK = {
  /* a section header: a bar with the title in a gap */
  title(text, o = {}) {

  },
  /* label / value pair as a row of two cells */
  kv(label, value, o = {}) {
    const v = LC.text(value, { color: o.valueColor || "data", size: o.size || "read" });
    const el = h("div", { class: "row", style: { minHeight: "26px" } }, h("div", { class: "cell l fill" }, LC.text(label, { color: o.labelColor || "peach", align: "l", size: o.labelSize || "" })), h("div", { class: "cell" }, v));

  /* a horizontal meter: a filled block over an unlit track, with an optional nominal marker */
  hmeter(o = {}) {

    const track = LC.block({ off: true, num: false, flex: "1 1 auto", h: o.h || 22 });
    const fill = LC.block({ color: o.hue || "status", num: false, h: o.h || 22, cls: "fillb" });

    el.append(track, fill);

    el.set = (frac, hue) => { fill.style.width = clamp(frac * 100, 0, 100) + "%"; if (hue) fill.style.setProperty("--c", `var(--c-${hue})`); };
    el.fill = fill; return el;
  },
  /* a segmented meter: n small blocks, lit in proportion */
  seg(o = {}) {
    const n = o.n || 10, el = h("div", { class: "seg-meter", style: { height: (o.h || 22) + "px", flex: "1 1 auto" } });
    const segs = []; for (let i = 0; i < n; i++) { const b = LC.block({ off: true, num: false, h: o.h || 22 }); segs.push(b); el.append(b); }

  },
  /* pages instead of scrollbars: PREV / PAGE n OF m / NEXT */
  pager(o = {}) {
    let items = o.items || [], page = 0; const per = o.per || 8;

    const pageTxt = LC.text("", { color: "data", size: "small", align: "c" });
    const prev = LC.block({ color: "nav", label: "PREV", num: false, w: 74, h: 30, onPress: () => { if (page > 0) { page--; draw(); } else Snd.tone("deny"); } });
    const next = LC.block({ color: "nav", label: "NEXT", num: false, w: 74, h: 30, onPress: () => { if ((page + 1) * per < items.length) { page++; draw(); } else Snd.tone("deny"); } });
    const bar = h("div", { class: "row", style: { alignItems: "center" } }, prev, h("div", { class: "cell c fill mid" }, pageTxt), next);
    const el = h("div", { class: "col", style: { flex: o.flex || "1 1 auto", minHeight: 0 } }, list, bar);

const UI = (() => {

    if (pendingLock && t > pendingLock) { pendingLock = null; delivered.s7 = true; Store.set("comms.delivered", delivered); Snd.tone("message"); Sim.say("INCOMING — OSV CANTOR: SIGNAL 47 RESOLVED", "ok"); Bus.emit("comms"); }

Panels.about = {
  title: "ABOUT THIS CONSOLE",
  render(host) {
    host.style.position = "relative";
    host.append(UIK.title("ABOUT — AN INDEPENDENT TRIBUTE"), UIK.tag("the one panel where the museum speaks inside the frame", { real: true, pos: "tr" }));
    const body = h("div", { class: "entry-body" }, LC.prose(`
<p><b>LCARS</b> — the Library Computer Access/Retrieval System — is a design language created by <b>Michael Okuda</b> for a television production that first aired in 1987. The look everyone associates with the future was his: flat colour blocks on black, enormous rounded elbows, condensed capitals, numbers that mean nothing. This console exists because of that work, and the credit is his.</p>
<p><b>It was never software.</b> The panels on the set were sheets of backlit coloured acrylic with graphics printed on them. Actors pressed them and nothing happened; the sounds were added afterwards. Later seasons used pre-rendered video. There was no file system, no command structure, no event handler — nothing to recreate, because there was never any behaviour. Gene Roddenberry wanted the displays simple and largely static because animated screens were beyond the budget, and Okuda's answer to that constraint became one of the most recognisable interfaces ever made.</p>
<p><b>Everything this console does is invented.</b> The vessel, her registry, her mission, her crew, her library and every figure on every panel were written for this page. The behaviour — the power grid and its refusals, the sensors that degrade, the alert cascade, the library that answers — is one more attempt at a question the original never had to face: what would this actually do? Thousands of people have built their own answers over three decades, for every desktop, dashboard, wall panel and watch, with no commercial reason to bother. This is one more of those, and it says so.</p>
<p><b>No affiliation is claimed.</b> This is an unofficial homage. It uses no trademarked material — no insignia, no wordmarks, no canonical names, no character names, no dialogue, none of Okuda's actual graphics, and no imitation of the computer voice. The typeface associated with the original is a licensed font and is not used; whatever condensed face your system has is squeezed toward the right proportion instead. The tones are synthesised here and copied from nothing.</p>
<p><b>What the constraint got right</b> is real, and this console tries to honour it: enormous targets, extreme contrast, no chrome, instant parseability — and, by accident, an interface built for a camera in a wide shot turns out to be an interface for people who cannot see small things or hit small targets.</p>
<p><b>What it got wrong</b> is documented in the museum guide beside this console, in the museum's voice rather than the vessel's: you cannot tell a control from decoration, you cannot tell where you are, you cannot go back, and there is no help. Those are properties of the original, faithfully kept.</p>
<p>The construction of this console is filed as a technical manual in its own library: <span class="xr" data-entry="TM-0090">TM-0090</span>. The in-vessel history of the display standard is <span class="xr" data-entry="HX-010">HX-010</span>.</p>`));
    body.addEventListener("click", ev => { const x = ev.target.closest(".xr"); if (x && x.dataset.entry) { Snd.tone("nav"); UI.openEntry(x.dataset.entry); } });
    host.append(UIK.scroller(body));
    host.append(h("div", { class: "row" }, LC.block({ color: "control", label: "MUSEUM GUIDE", num: false, h: 44, flex: "1 1 0", onPress: () => Guide.open("first"), tone: "ack" }), LC.block({ color: "nav", label: "TM-0090 — HOW THIS WAS BUILT", num: false, h: 44, flex: "1 1 0", onPress: () => UI.openEntry("TM-0090") }), LC.block({ color: "nav", label: "BACK TO THE MUSEUM", num: false, h: 44, flex: "1 1 0", onPress: () => { location.href = "index.html"; } })));
    return null;
  },
};

const Guide = (() => {
  let probe = { measured: null, squeeze: 1, stack: "" };
  const TABS = [
    { id: "first", label: "Read this first" },
    { id: "grammar", label: "The grammar" },
    { id: "does", label: "What it does" },
    { id: "limits", label: "Honest limitations" },
    { id: "right", label: "What it got right" },
    { id: "invented", label: "Invented / real" },
    { id: "eggs", label: "Easter eggs" },
    { id: "credits", label: "Credits & settings" },
  ];
  const INV = "<span class='inv'>INVENTED</span>", REAL = "<span class='real'>REAL</span>";

  const content = {
    first: () => `
<h3>This exhibit is different</h3>
<p>Every other exhibit in this museum recreates software that existed. This one cannot, because <b>LCARS was never software</b>. The panels on the 1987 television set were sheets of backlit coloured acrylic with graphics printed on them. Actors pressed them and nothing happened; the chirps were added in post-production. Later seasons used pre-rendered video loops. There was never a file system, never a command structure, never an event handler. LCARS is a set of graphics designed to be photographed, and it has no behaviour to recreate because it never had any.</p>
<p>That makes it the most interesting entry here rather than the least, for three reasons.</p>
<p><b>It was designed by a budget.</b> The producers wanted the displays simple and largely static because animated screens were unaffordable. Michael Okuda's answer — flat colour blocks on black, behind plexiglass, lit from behind — was a constraint solved so elegantly that it became one of the most recognisable interfaces ever made. The look everyone associates with the future was a cost-saving measure.</p>
<p><b>It is the most reimplemented interface in history.</b> There are LCARS themes for every desktop, LCARS web frameworks, car dashboards, home-automation panels and watch faces, built over three decades by people with no commercial reason to bother. Every one is an attempt to answer a question the original never faced: <i>what would this actually do?</i> This exhibit is another such attempt, and it is honest that that is what it is.</p>
<p><b>It was designed for legibility at a distance, on camera</b>, and that is a real design discipline. Every property of LCARS — enormous flat targets, no gradients, no small type, unambiguous colour, no chrome whatsoever — follows from needing to be parsed by a television audience in a two-second wide shot. The result is accidentally excellent for anyone with low vision or limited fine motor control, and a defensible answer to what a professional instrument panel should look like.</p>
<h3>So what is this?</h3>
<p>A working system that submits completely to a visual grammar it did not design, and finds out what that grammar can and cannot do. Not a recreation — there is nothing to recreate. The console in front of you belongs to an invented vessel, <b>OSV Antiphon</b>, and speaks in its own fiction. The museum speaks here, in the margin, in a different typeface. The two voices never mix.</p>
<p><b>Start here:</b> open <b>OPERATIONS</b>, press <b>−</b> beside SENSORS six or seven times, then open <b>SENSORS</b>. Then come back and read "What it does".</p>`,

    grammar: () => {
      const cs = getComputedStyle($("#console"));
      const sw = ["peach", "salmon", "tan", "butterscotch", "lilac", "lavender", "periwinkle", "sky", "alert", "unlit"].map(k => `<span class="sw"><i style="background:${cs.getPropertyValue("--" + k).trim()}"></i>${k}</span>`).join("");
      return `
<h3>Five primitives</h3>
<p>Everything on the console is composed from a very small set of shapes, through a component library that renders nothing else. If a part of the interface cannot be expressed as one of these, it does not belong here.</p>
<ul>
<li><b>The elbow</b> — the L-shaped frame joint. Its outer corner is a large radius; its inner corner is a smaller, concave radius. The proportions are strict: <b>the outer radius equals the bar's thickness plus the inner radius</b>, so the bar keeps its thickness through the bend, and the vertical leg is wider than the horizontal one. Getting this relationship wrong — a lumpy bend, an outer radius that is too small, arcs that fight each other — is the single most common failure in LCARS reimplementations.</li>
<li><b>The bar</b> — a rule of standard thickness with one rounded cap, broken by gaps that hold a small block or a line of text.</li>
<li><b>The block</b> — a flat rectangle, pill-ended, one-end-rounded or square. A block may be a control, a label, or nothing at all, and there is deliberately no way to tell which by looking.</li>
<li><b>The sweep</b> — the same joint at a larger radius, joining the header to the sidebar at the top left.</li>
<li><b>Text</b> — uppercase, condensed, right-aligned in blocks, with small numbers of no stated meaning.</li>
</ul>
<div class="fig" id="g-fig"></div>
<h3>The rhythm</h3>
<p>Alignment is absolute. Every gap is one unit (<code>--u</code>, 5px), bars are <code>--T</code> thick, the sidebar is <code>--W</code> wide, and the elbow's radii are derived from those. LCARS looks wrong the instant the rhythm is off, so the layout is a fixed grid: header, inner radius, body, inner radius, footer.</p>
<h3>The palette</h3>
<p>Nine flat colours on pure black, plus an unlit grey for a block that is not lit, defined once as named tokens and used nowhere else. This exhibit targets the <b>earlier, warmer</b> scheme — peach, salmon, tan, butterscotch, lilac, lavender, periwinkle, sky, and a red-orange reserved for alerts.</p>
<div class="swatches">${sw}</div>
<p>${REAL} The palette drifted considerably across later productions — toward cooler blues, greys and a good deal more purple — and fan reconstructions differ about exact values, which were never published. These are this exhibit's readings of the early look, not measurements.</p>
<p>${INV} <b>Colour meaning.</b> Peach and salmon for navigation; lavender and lilac for status; butterscotch and tan for controls; sky and periwinkle for data; red-orange for alerts only. The original assigned colour inconsistently and never needed to do otherwise. Any consistent scheme is an invention, and this one is ours.</p>
<h3>Typography</h3>
<p>The face associated with the original is a licensed commercial font and is not fetched. The page tries a stack of locally installed condensed faces and then <b>measures what arrived</b>: on this machine the average uppercase glyph came out at <b>${probe.measured ? probe.measured.toFixed(3) : "?"} em</b>, against a target of 0.44, so text is squeezed horizontally by a factor of <b>${probe.squeeze.toFixed(3)}</b>. The squeeze is a transform, so it never fetches anything. Numerals and labels are uppercase and tight because that is half the identity.</p>
<h3>The audit</h3>
<p>At power-on, and whenever you open this tab, the page walks every element inside the console and reports anything painted outside the five primitives.</p>
<div class="audit" id="g-audit">…</div>`;
    },

    does: () => `
<h3>A system, not a mood board</h3>
<p>An LCARS exhibit with no function is a screensaver. This one has a single simulation model behind every panel, so subsystems genuinely affect each other. All of it is ${INV}, and the console never pretends otherwise.</p>
<h3>Operations — the killer demonstration</h3>
<p>A power grid: 620 MW from the core, 180 MW from auxiliary cells, seven trunks with nominal demands. Press <b>+</b> and <b>−</b> to move ten megawatts at a time, or apply a profile. <b>Consequences follow:</b></p>
<ul>
<li>Pull power from <b>SENSORS</b> and the Sensors panel refreshes more slowly, coarsens its aperture, loses decimal places and marks its readings STALE. Give it more than 105% and it sees things it otherwise cannot.</li>
<li>Pull it from <b>ENVIRONMENTAL</b> below 70% and the console raises CONDITION ELEVATED on its own; below 40%, EMERGENCY. You cannot stand down until it is fixed.</li>
<li>Cut <b>COMMUNICATIONS</b> to zero and the array's phase lock decays in three seconds. Restoring power does not restore it.</li>
<li>Starve <b>COMPUTING</b> and the library retrieves fewer results, more slowly; below 30% its parser switches off.</li>
<li>Overcommit the total and the grid <b>refuses</b>, in its own voice, with the figures.</li>
</ul>
<h3>The library computer</h3>
<p>The acronym stands for Library Computer Access/Retrieval System, and almost no reimplementation ever builds the library. This one has ${Library.size} original entries — technical manuals, procedures, mission logs, personnel records, survey data and history for an invented vessel — under a full-text inverted index. Type after <b>COMPUTER,</b> in ordinary phrasing: <i>status of sensors</i>, <i>how far to Verrin</i>, <i>who is the chief engineer</i>, <i>cold start procedure</i>. A handful of intents are answered from the live vessel; everything else becomes a ranked search. Voice input uses the Web Speech API where the browser offers it (${Library.voiceAvailable ? "it does here" : "it does not here, so the VOICE block says so"}).</p>
<h3>The other panels</h3>
<ul>
<li><b>Status</b> — bar graphs, gauges and scrolling readouts fed from the same model.</li>
<li><b>Navigation</b> — an original chart of twenty systems. Press a star, PLOT, set a drive rating, ENGAGE, and the ship moves. Transit time is distance over rating<sup>3.5</sup>; the hull-stress field must carry the rating, and rating 9 needs more than its nominal power.</li>
<li><b>Sensors</b> — four scan modes whose results depend on power and on where the ship is.</li>
<li><b>Personnel</b> — a roster of forty-seven; reassign watches.</li>
<li><b>Communications</b> — three threads of original correspondence; replies queue when the array is unpowered.</li>
<li><b>Engineering</b> — subsystem trees, fault injection, and repairs whose step order is in the library.</li>
</ul>
<h3>The alert cascade</h3>
<p>Three conditions — NORMAL, ELEVATED, EMERGENCY — each with its own palette, derived from the base tokens by pulling every hue toward amber or toward the alert red, and its own layout: the sidebar reorders to promote Operations, Status and Engineering; under EMERGENCY the other panels shrink, an alert strip names the causes and their remedies, the frame pulses and a klaxon sounds (if sound is on). Both you and the simulation can trigger it. The simulation will, at a moment of its choosing.</p>`,

    limits: () => `
<h3>What the grammar cannot do</h3>
<p>An exhibit built on invention owes its visitors a candid section. These are properties of the original, faithfully kept, and they are genuinely interesting problems.</p>
<ul>
<li><b>You cannot tell what is a button.</b> LCARS gives active controls and inert decoration exactly the same appearance. That is not an oversight here; it is a property of the original, which never needed the distinction because nothing was ever pressed for real. Every serious reimplementation runs into it, and there is no fix that does not break the look. The sidebar's filler blocks, the rail on the right, half the small blocks in the bars: some do something and some do not.</li>
<li><b>There is no hierarchy signal and no back affordance.</b> You cannot tell where you are or how you got there. The header names the current panel and the active sidebar block changes colour — both small inventions — but there is no breadcrumb, no history, no back. Navigation is the sidebar and the header, and that is all. The console does remember your history; it just has no way to show it to you.</li>
<li><b>There is no error state.</b> A set decoration never had to report a failure. The exhibit had to invent one: the console <i>speaks</i>, in the footer and in Operations, and its refusals are text in the alert colour. Speaking is outside the grammar. So is the text field on the Library panel, and the blinking caret in it — the original had no keyboard and no typing.</li>
<li><b>The condensed type is hard to read below a certain size</b>, which is why the original never used small text. This exhibit's smallest labels are already pushing it, and long library entries in condensed capitals would be unreadable — so the library's prose is set in mixed case, which the original never showed.</li>
<li><b>Scrolling.</b> There are no scrollbars in the language. Lists here are paged with PREV and NEXT; long text scrolls behind UP and DOWN blocks with the scrollbar hidden. Both are inventions.</li>
<li><b>Colour coding is inconsistent in the source material</b>, and any consistent scheme — including this one — is the exhibit's own.</li>
<li><b>It assumes trained operators.</b> No discoverability, no onboarding, no tooltips, no help. For a professional instrument panel that is a legitimate position — pilots and radiographers use interfaces like this on purpose — but it is a position, and it should be named as one. This guide is the help. The console has none.</li>
<li><b>And the largest: all behaviour here is invented.</b> Nothing in this exhibit's function is a recreation, because there was nothing to recreate.</li>
</ul>`,

    right: () => `
<h3>What the constraint got right</h3>
<ul>
<li><b>Enormous targets</b>, unmissable at a glance and usable with imprecise input. Nothing on this console is smaller than a fingertip.</li>
<li><b>Extreme contrast</b>: saturated flat colour on pure black is legible in almost any lighting.</li>
<li><b>No chrome at all.</b> Every pixel is either content, structure or a control. There are no borders, bevels, shadows, gradients, outlines or icons anywhere in the frame, and the audit proves it.</li>
<li><b>Instant parseability</b>, which is the whole reason it was designed the way it was: a television audience had two seconds in a wide shot.</li>
<li><b>An accessibility dividend nobody was aiming for.</b> An interface built for a camera in a wide shot happens to be an interface for people who cannot see small things or hit small targets. The text-size setting on the Credits tab scales the whole console; the rhythm holds because it is all relative units.</li>
<li><b>Touch, not pointing.</b> There is no hover behaviour, no right-click, no drag, no windows, no overlap. Everything is a tap on a large target, and panels reconfigure in place. On a touchscreen this exhibit is at home in a way most of the museum is not.</li>
</ul>`,

    invented: () => `
<h3>Label the invention as invention</h3>
<p>Press <b>Labels</b> in the museum rail (or below) to show museum stickers over the console: amber for ${INV}, green for ${REAL}. They are the museum's voice and sit outside the grammar, which is why they look nothing like the console.</p>
<p><button class="gbtn" id="g-labels">Toggle labels</button></p>
<h3>Real</h3>
<ul>
<li>${REAL} The grammar: elbows with a large outer and small inner radius, bars with rounded caps, blocks as pills and squares, sweeps, condensed uppercase text right-aligned in blocks, meaningless numbers.</li>
<li>${REAL} Flat colour on pure black; no gradients, shadows, outlines or icons.</li>
<li>${REAL} The warm early palette and its shift, later, toward cooler blues and greys.</li>
<li>${REAL} That controls and decoration are indistinguishable, that there is no back, no hierarchy, no help.</li>
<li>${REAL} The joke about one recurring number.</li>
</ul>
<h3>Invented</h3>
<ul>
<li>${INV} Everything that happens when you press something.</li>
<li>${INV} The vessel OSV Antiphon, her registry, her mission, her crew, the Outward Survey Commission, the Corvane Reach and every system on the chart.</li>
<li>${INV} The power model, the drive law (rating<sup>3.5</sup>), the hull-stress requirement, the sensor degradation curve, the phase lock and its cold start.</li>
<li>${INV} The three alert conditions, their palettes and their layouts. The original's alert modes were a colour change and a flashing graphic.</li>
<li>${INV} The consistent colour semantics.</li>
<li>${INV} The console's voice — its refusals and notices. The original had no error state.</li>
<li>${INV} The active-panel colour, the pagers, the hidden-scrollbar scrollers, the text field and caret, the brief white flash on press.</li>
<li>${INV} The tones. Synthesised here in a comparable register; copied from nothing.</li>
<li>${INV} The library, all ${Library.size} entries of it, and the parser.</li>
</ul>`,

    eggs: () => `
<h3>Things hidden in the console</h3>
<p>Spoilers, folded away. The console will never tell you any of this; there is no help in the language.</p>
<details><summary>The number that means nothing</summary><p>Small numeric labels throughout appear to mean something and do not — but one number recurs far more often than chance allows. Count the 47s. It is a long-standing joke in the source material (a writer's alma mater had a tradition about it) and this exhibit reproduces the habit in spirit: the registry, the crew complement, the cold-start manual's number, the gravimetric net's period, a cabin, a hull frame. The library's own explanation is HX-007.</p></details>
<details><summary>The manual about itself</summary><p>The library entry <b>TM-0090</b> documents this exhibit's own construction, filed as a technical manual for the console you are reading it on.</p></details>
<details><summary>The subsystem you can lose</summary><p>Take <b>COMMUNICATIONS</b> to 0 MW in Operations and wait three seconds. Restoring power will not bring it back. The procedure is in the library — search <i>cold start</i> — and must be performed in Engineering on the right node in the right order.</p></details>
<details><summary>The suspiciously vague personnel file</summary><p>Sub-Lieutenant <b>Wren Tallis</b>, Special Projects (Liaison). Reports to: see attached. Try to reassign them.</p></details>
<details><summary>The thread that resolves</summary><p>Read every message in the <b>SIGNAL 47</b> thread in Communications, with the array powered, and wait a moment.</p></details>
<details><summary>The alert of the simulation's own choosing</summary><p>Between about two and a half and seven minutes into a session the ship meets an uncharted debris field. The procedure is PM-004, and the first line is the action.</p></details>
<details><summary>The panel the sidebar does not have</summary><p>There is a Deck 9 station reachable only from a cross-reference in a library entry. Search <i>arboretum</i>.</p></details>
<details><summary>The rating nine paradox</summary><p>At drive rating 9 the hull-stress field needs more than its nominal allocation. TM-0021 explains; the grid enforces.</p></details>`,

    credits: () => `
<h3>Credit</h3>
<p><b>LCARS</b> is a design language created by <b>Michael Okuda</b> for a television production first broadcast in 1987. The design is his, and this exhibit exists because of it. It is an <b>independent, unofficial tribute</b>; no affiliation with any rights holder is claimed or implied. It uses no trademarked material — no insignia, wordmarks, canonical names, character names, dialogue or original graphics — and does not imitate the computer voice. The vessel, its crew, its mission and its library were written for this page.</p>
<p><b>A note about the acrylic.</b> The most famous interface in science fiction was, physically, sheets of coloured Plexiglas with printed film on them, lit from behind by fluorescent tubes. It was built to a budget, it was built to be photographed, and it was never wired to anything. This is one of thousands of attempts to wire it up, offered with respect to the man who drew it.</p>
<h3>Technical</h3>
<p>One file; no CDNs, no web fonts, no images, no fetch. Font stack measured at <b>${probe.measured ? probe.measured.toFixed(3) : "?"} em</b> average glyph, squeeze <b>${probe.squeeze.toFixed(3)}</b>. Library: ${Library.size} entries, ${Library.indexSize()} index terms. Audio: Web Audio ${Snd.available() ? "available" : "unavailable"}; speech input ${Library.voiceAvailable ? "available" : "unavailable"}. Storage: ${Store.available ? "LocalStorage under <code>osmuseum.lcars.*</code>" : "unavailable — nothing is remembered in this browser"}.</p>
<h3>Settings</h3>
<p>These belong to you, not the vessel.</p>
<p>
<button class="gbtn" id="g-sound">Sound: ${Snd.enabled() ? "on" : "off"}</button>
<button class="gbtn" id="g-ambient">Ambient bed: ${Snd.ambientOn() ? "on" : "off"}</button>
<button class="gbtn" id="g-motion">Motion: ${Prefs.get("motion") === "reduce" ? "reduced" : "full"}</button>
<button class="gbtn" id="g-text">Text: ${Prefs.get("text")}</button>
</p>
<p>Sound is off by default and stays off until you turn it on, because ambient audio that starts unbidden is rude. Reduced motion stops the alert pulse, the meter transitions and the power-on stagger. Text size scales the whole console.</p>
<h3>Reset</h3>
<p>Forgets everything this browser remembers about the console: power allocation, alert state, panel history, bookmarks, read entries, comms state, roster changes and these settings.</p>
<p><button class="gbtn warn" id="g-reset">Full reset</button></p>`,
  };

  let tab = "first";
  function render() {
    const tabs = $("#gtabs"); clear(tabs);
    for (const t of TABS) tabs.append(h("button", { type: "button", class: t.id === tab ? "on" : "", text: t.label, onclick: () => { tab = t.id; render(); } }));
    const body = $("#gbody"); body.innerHTML = content[tab]();
    body.scrollTop = 0;
    if (tab === "grammar") { drawFigure(); const a = LC.audit($("#console")); $("#g-audit").textContent = `text ${a.text} · blocks ${a.block} · bar segments ${a.bar} · elbows ${a.elbow} · sweeps ${a.sweep}\nviolations: ${a.violations.length ? a.violations.slice(0, 8).join("; ") : "none — every painted element is a primitive"}`; }
    if (tab === "invented") $("#g-labels").onclick = () => { Prefs.set("labels", !Prefs.get("labels")); Toast.show(Prefs.get("labels") ? "Museum labels <b>on</b>. Amber marks invention, green marks what was real." : "Museum labels off."); };
    if (tab === "credits") {
      $("#g-sound").onclick = () => { Snd.setEnabled(!Snd.enabled()); if (Snd.enabled()) Snd.tone("confirm"); render(); };
      $("#g-ambient").onclick = () => { if (!Snd.enabled()) { Snd.setEnabled(true); } Snd.ambient(!Snd.ambientOn()); render(); };
      $("#g-motion").onclick = () => { const v = Prefs.get("motion") === "reduce" ? "full" : "reduce"; Prefs.set("motion", v); document.documentElement.dataset.motion = v; render(); };
      $("#g-text").onclick = () => { const seq = ["normal", "large", "xlarge"]; const v = seq[(seq.indexOf(Prefs.get("text")) + 1) % 3]; Prefs.set("text", v); document.documentElement.dataset.text = v; render(); };
      let armed = false; const rb = $("#g-reset");
      rb.onclick = () => { if (!armed) { armed = true; rb.textContent = "Press again to confirm — this forgets everything"; setTimeout(() => { armed = false; rb.textContent = "Full reset"; }, 5000); return; } Store.resetAll(); location.reload(); };
    }
  }
  function drawFigure() {
    const fig = $("#g-fig"); if (!fig) return; clear(fig);
    const wrap = h("div", { style: { position: "relative", height: "120px", "--W": "90px", "--T": "22px", "--ri": "18px", "--ro": "40px", "--sq": getComputedStyle(document.documentElement).getPropertyValue("--sq") } });
    const el = LC.elbow({ corner: "tl", color: "peach", label: "ELBOW", num: "47" }); el.style.position = "absolute"; el.style.left = "0"; el.style.top = "0";
    const bar = LC.bar({ color: "peach", h: 22, items: [{ seg: true, flex: "1 1 auto" }, { block: { color: "lavender", w: 30, num: false } }, { gap: true, text: "BAR", color: "salmon", size: "" }, { seg: true, w: 40, cap: "r" }] }); bar.style.position = "absolute"; bar.style.left = "113px"; bar.style.right = "0"; bar.style.top = "0";
    const b1 = LC.block({ color: "peach", label: "BLOCK", w: 90, h: 34, num: "47-1" }); b1.style.position = "absolute"; b1.style.left = "0"; b1.style.top = "45px";
    const b2 = LC.block({ color: "butterscotch", label: "PILL", shape: "pill", w: 120, h: 28, num: false }); b2.style.position = "absolute"; b2.style.left = "113px"; b2.style.top = "48px";
    const b3 = LC.block({ color: "lavender", label: "RL", shape: "rl", w: 70, h: 28, num: false }); b3.style.position = "absolute"; b3.style.left = "243px"; b3.style.top = "48px";
    const t = LC.text("OUTER RADIUS = THICKNESS + INNER RADIUS", { color: "sky", align: "l", size: "small" }); t.style.position = "absolute"; t.style.left = "0"; t.style.top = "94px";
    wrap.append(el, bar, b1, b2, b3, t); fig.append(wrap, h("div", { class: "cap", text: "The primitives, drawn live by the same component library that draws the console." }));
  }
  function open(which) { if (which) tab = which; render(); $("#guide").classList.add("open"); $("#m-guide").classList.add("on"); }
  function close() { $("#guide").classList.remove("open"); $("#m-guide").classList.remove("on"); }
  function toggle() { $("#guide").classList.contains("open") ? close() : open(); }
  function init(probeResult) { probe = probeResult || probe; $("#guideclose").onclick = close; $("#m-guide").onclick = toggle; render(); }
  return { open, close, toggle, init, render };
})();

/* ==========================================================================
   MODULE 10 — POWER ON. The original never booted; it was lit or it was not.
   So: measure the font, apply the visitor's preferences, build the frame,
   restore the panel that was open, start the clock. Then get out of the way.
   ========================================================================== */
(function boot() {
  const probe = LC.probeFont();
  document.documentElement.dataset.motion = Prefs.get("motion") || "full";
  document.documentElement.dataset.text = Prefs.get("text") || "normal";
  UI.build();
  Alert.recompute(true);
  const start = Store.get("panel.current", "ops");
  UI.show(Panels[start] ? start : "ops");
  setInterval(() => Sim.tick(), 250);
  Guide.init(probe);

  // museum rail
  const soundBtn = $("#m-sound"), labelsBtn = $("#m-labels");
  const syncRail = () => { soundBtn.textContent = "Sound: " + (Snd.enabled() ? "on" : "off"); soundBtn.classList.toggle("on", Snd.enabled()); labelsBtn.classList.toggle("on", !!Prefs.get("labels")); };
  soundBtn.onclick = () => { Snd.setEnabled(!Snd.enabled()); if (Snd.enabled()) { Snd.tone("confirm"); Toast.show("Sound <b>on</b>. Every tone is synthesised here — a press chirp, confirm, deny, acknowledge, a klaxon — in a comparable register, copied from nothing. The ambient bed is a separate switch in the guide."); } syncRail(); };
  labelsBtn.onclick = () => { Prefs.set("labels", !Prefs.get("labels")); syncRail(); Toast.show(Prefs.get("labels") ? "Museum labels <b>on</b>: amber marks invention, green marks what was real. They are the museum's voice and sit outside the grammar." : "Museum labels off."); };
  Bus.on("sound", syncRail); Bus.on("prefs", syncRail); syncRail();

  // the audit, once, into the console log for anyone who looks
  requestAnimationFrame(() => { const a = LC.audit($("#console")); console.info(`[LCARS grammar audit] text ${a.text} · blocks ${a.block} · bars ${a.bar} · elbows ${a.elbow} · sweeps ${a.sweep} · violations ${a.violations.length}`, a.violations); });

  // first visit: one museum toast, then silence
  if (!Store.get("visited")) {
    Store.set("visited", true);
    setTimeout(() => Toast.show("A tribute to a design language that was never software. <b>Everything this console does is invented</b> — the Guide explains. Try OPERATIONS: pull power from SENSORS, then look at the Sensors panel.", 10000), 900);
  }
  window.addEventListener("beforeunload", () => Sim.persist(true));
  document.addEventListener("visibilitychange", () => { if (document.hidden) Sim.persist(true); });
  window.addEventListener("keydown", e => { if (e.key === "Escape") Guide.close(); });
})();
</script>
