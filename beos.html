Apps.define('Magnify',{
  icon:'magnify',singleton:true,w:212,h:190,minw:140,minh:130,
  title:()=>'Magnify',
  make(win){
    const c=win.pad(4);
    const canv=U.el('canvas');
    canv.style.cssText='position:absolute;left:4px;right:4px;top:4px;bottom:34px;'+
      'width:calc(100% - 8px);background:#000;border:1px solid var(--panel-lo2)';
    c.appendChild(canv);
    const ctx=canv.getContext('2d');
    const info=U.div('tick'); info.style.cssText='position:absolute;left:5px;bottom:4px;'+
      'font-family:var(--mono);line-height:1.5';
    c.appendChild(info);
    let zoom=8, frozen=false, mx=0, my=0, grid=true;
    const track=e=>{ if(!frozen){ mx=e.clientX; my=e.clientY; } };
    document.addEventListener('pointermove',track);
    win.on('close',()=>document.removeEventListener('pointermove',track));
    /* sample the "screen" by asking the compositor what is under each point */
    function colorAt(x,y){
      const el=document.elementFromPoint(x,y);
      if(!el) return '#000';
      let n=el;
      while(n){
        const bg=getComputedStyle(n).backgroundColor;
        if(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent') return bg;
        n=n.parentElement;
      }
      return '#000';
    }
    let cache=[],lastT=0;
    const stop=Anim.add((dt,ts)=>{
      const W=canv.clientWidth,H=canv.clientHeight;
      if(canv.width!==W||canv.height!==H){ canv.width=W; canv.height=H; }
      const cols=Math.ceil(W/zoom), rows=Math.ceil(H/zoom);
      if(ts-lastT>110){
        lastT=ts; cache=[];
        const x0=mx-Math.floor(cols/2), y0=my-Math.floor(rows/2);
        for(let j=0;j<rows;j++){
          const line=[];
          for(let i=0;i<cols;i++) line.push(colorAt(x0+i,y0+j));
          cache.push(line);
        }
      }
      ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
      cache.forEach((line,j)=>line.forEach((col,i)=>{
        ctx.fillStyle=col; ctx.fillRect(i*zoom,j*zoom,zoom,zoom);
      }));
      if(grid&&zoom>=6){
        ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=1;
        for(let i=0;i<=cols;i++){ ctx.beginPath(); ctx.moveTo(i*zoom,0); ctx.lineTo(i*zoom,H); ctx.stroke(); }
        for(let j=0;j<=rows;j++){ ctx.beginPath(); ctx.moveTo(0,j*zoom); ctx.lineTo(W,j*zoom); ctx.stroke(); }
      }
      const cc=Math.floor(cols/2), cr=Math.floor(rows/2);
      ctx.strokeStyle='#fff'; ctx.lineWidth=1;
      ctx.strokeRect(cc*zoom+0.5,cr*zoom+0.5,zoom-1,zoom-1);
      const col=(cache[cr]&&cache[cr][cc])||'rgb(0, 0, 0)';
      const m=col.match(/\d+/g)||[0,0,0];
      const hex='#'+m.slice(0,3).map(x=>U.pad(Number(x).toString(16),2)).join('');
      info.innerHTML=(frozen?'<b>frozen</b> ':'')+'x '+mx+'  y '+my+'  ×'+zoom+
        '<br>'+hex+'  rgb('+m.slice(0,3).join(', ')+')';
    },0.10);
    win.on('close',stop);
    win.setMenuBar([{label:'Magnify',items:()=>[
      {label:'Freeze',checked:frozen,sc:'Space',fn:()=>frozen=!frozen},
      {label:'Show Grid',checked:grid,fn:()=>grid=!grid},
      {sep:true},
      {label:'Zoom',sub:[2,4,6,8,12,16].map(z=>({label:'×'+z,marked:zoom===z,fn:()=>zoom=z}))},
      {sep:true},
      {label:'Copy Colour Value',fn:()=>{ try{document.execCommand('copy');}catch(e){} }},
      {label:'Close',sc:'Alt+W',fn:()=>win.close()}
    ]}]);
    win.el.addEventListener('keydown',e=>{ if(e.key===' '){ U.stop(e); frozen=!frozen; } });
  }
});

          lsc.viewport.scrollTop=lsc.viewport.scrollHeight; lsc.update();

      if(!archive){ Alert.show({type:'stop',title:'Expander',text:'Choose an archive first.'}); return; }
      let f=0;
      out.textContent='';
      const iv=setInterval(()=>{
        f+=0.07+rnd()*0.06;
        prog.set(Math.min(1,f));
        Load.spike(0.55,200);
        const i=Math.floor(f*FAKE.length);
        if(FAKE[i]) out.textContent='inflating: '+FAKE[i]+'\n'+out.textContent;
        if(f>=1){
          clearInterval(iv);
          const folder=FS.add(dest,{name:FS.uniqueName(dest,archive.name.replace(/\.[^.]+$/,'')),
            type:'dir'});
          FAKE.forEach(p=>{
            const parts=p.split('/');
            let d=folder;
            parts.slice(0,-1).forEach(seg=>{
              let n=FS.kids(d).find(k=>k.name===seg);
              if(!n) n=FS.add(d,{name:seg,type:'dir'});
              d=n;
            });
            FS.add(d,{name:parts[parts.length-1],type:'file',
              mime:/\.html$/.test(p)?MIME.HTML:MIME.TEXT,
              data:'(expanded from '+archive.name+')\n',size:rint(200,90000)});
          });
          State.dirty(); Tracker.refreshAll();
          out.textContent='done — '+FAKE.length+' items into '+FS.path(folder)+'\n'+out.textContent;
          Tracker.openFolder(folder);
        }
      },120);
    }

      {label:'Select…',fn:()=>Panel.openFile(n=>{ archive=n; t1.value=FS.path(n); })},
      {label:'Expand',fn:()=>expand()},
      {label:'Show Contents',fn:()=>show()},
      {sep:true},{label:'Close',sc:'Alt+W',fn:()=>win.close()}]}]);
  }
});
Apps.define('DiskProbe',{
  icon:'diskprobe',numbered:true,w:520,h:320,minw:340,minh:180,
  title:(o)=>'DiskProbe'+(o&&o.node?': '+o.node.name:''),
  make(win,inst,opts){
    let node=opts.node||FS.byPath('/boot/README');
    const c=win.content;
    const sc=new Scroller(c,{v:true,bg:'#fff'});
    const view=U.div('hexview'); view.style.position='relative';
    sc.content.appendChild(view);
    let block=0;
    function bytes(){
      const d=node.data||'';
      if(d) return Array.from(d).map(ch=>ch.charCodeAt(0)&0xff);
      // binaries get plausible-looking content
      const n=Math.min(2048,node.size||512), out=[];
      let s=node.name.length*7919;
      const magic=[0x7f,0x45,0x4c,0x46,0x01,0x01,0x01,0x00];
      for(let i=0;i<n;i++){
        if(i<magic.length){ out.push(magic[i]); continue; }
        s=(s*1103515245+12345)&0x7fffffff;
        out.push((s>>7)&0xff);
      }
      return out;
    }
    function draw(){
      const b=bytes();
      const start=block*512;
      const end=Math.min(b.length,start+512);
      let html='';
      for(let off=start;off<end;off+=16){
        const row=b.slice(off,off+16);
        const hex=row.map(x=>U.pad(x.toString(16),2)).join(' ');
        const asc=row.map(x=>(x>=32&&x<127)?U.esc(String.fromCharCode(x)):'.').join('');
        html+='<div class="hl"><span class="off">'+U.pad(off.toString(16),8)+'</span>'+
          '<span>'+U.pad(hex,47,' ')+'</span><span class="as">'+asc+'</span></div>';
      }
      if(!html) html='<div class="hl"><span class="off">(empty file)</span></div>';
      view.innerHTML=html;
      win.setTitle('DiskProbe: '+node.name+'  block '+block+' of '+
        Math.max(1,Math.ceil(b.length/512)));
      sc.update();
    }
    win.setMenuBar([
      {label:'File',items:()=>[
        {label:'Open…',sc:'Alt+O',fn:()=>Panel.openFile(n=>{ node=n; block=0; draw(); })},
        {label:'Open Device',sub:FS.kids(FS.get(FS.rootId)).map(v=>({label:v.devname||v.name,
          fn:()=>{ node={name:v.devname||v.name,size:v.capacity,data:''}; block=0; draw(); }}))},
        {sep:true},
        {label:'Get Info',disabled:!node.id,fn:()=>node.id&&Tracker.getInfo(node)},
        {label:'Close',sc:'Alt+W',fn:()=>win.close()}
      ]},
      {label:'Block',items:()=>[
        {label:'Next Block',sc:'Alt+↓',fn:()=>{ block++; draw(); }},
        {label:'Previous Block',sc:'Alt+↑',fn:()=>{ block=Math.max(0,block-1); draw(); }},
        {label:'First Block',fn:()=>{ block=0; draw(); }}
      ]},
      {label:'Attributes',items:()=>{
        const keys=Object.keys(node.attrs||{});
        if(!keys.length) return [{label:'(this file carries no attributes)',disabled:true}];
        return keys.map(k=>({label:k+' = '+node.attrs[k],fn:()=>{}}));
      }}
    ]);
    draw();
    win.on('resize',()=>sc.update());
    win.el.addEventListener('keydown',e=>{
      if(e.altKey&&e.key==='ArrowDown'){ U.stop(e); block++; draw(); }
      if(e.altKey&&e.key==='ArrowUp'){ U.stop(e); block=Math.max(0,block-1); draw(); }
    });
  }
});

/* multiply a CSS colour by a shading factor — hsl() and #rrggbb only */
function shadeCSS(col,k){
  let m=String(col).match(/^hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)$/);
  if(m) return 'hsl('+m[1]+','+m[2]+'%,'+U.clamp(Math.round(Number(m[3])*k),4,96)+'%)';
  m=String(col).match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if(m) return 'rgb('+[1,2,3].map(i=>U.clamp(Math.round(parseInt(m[i],16)*k),0,255)).join(',')+')';
  return col;
}
function svgFromPix(pix){
  const SZ=pix.length;
  let s='<svg viewBox="0 0 '+SZ+' '+SZ+'" width="100%" height="100%" shape-rendering="crispEdges">';
  for(let y=0;y<SZ;y++)for(let x=0;x<SZ;x++){
    const p=pix[y][x];
    if(p&&p!=='transparent') s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+p+'"/>';
  }
  return s+'</svg>';
}

      [{label:'Folder',value:MIME.DIR},{label:'Plain text file',value:MIME.TEXT}]);

        .map(c=>({label:c.l,value:c.a}));

      if(mime==='*') Object.keys(SCHEMA).forEach(m=>FS.schemaFor(m).forEach(s=>{
        if(!out.some(o=>o.value===s.a)) out.push({label:s.l+'  ('+(MIME_NAMES[m]||m)+')',value:s.a});

      const relPop=Ctl.popup(STRREL,'contains',v=>state.rel=v,{w:96});
      const valField=Ctl.text('',v=>state.value=v,{w:105});
      function relSync(){
        const d=FS.colDef(state.attr);
        const items=d.t==='time'?TIMEREL:(d.t==='size'||d.t==='int')?NUMREL:STRREL;
        relPop.setItems(items,items[0].value); state.rel=items[0].value;

        {sm:true,w:20});

        const m=s.match(/^\s*([A-Za-z0-9:_]+)\s*(==|=|~=|~|!=|\^|>|<)\s*"?([^"]*)"?\s*$/);

    }
    w.setMenuBar([{label:'Find',items:()=>[
      {label:'Search',sc:'Enter',fn:search},

      {sep:true},

    ]}]);
    build();
    w.el.addEventListener('keydown',e=>{

    return w;
  }
  return {open};
})();

/* ============================================================
   35. Screen resolution, screen saver, screen grabs
   ============================================================ */
const Screen = (()=>{
  /* The screen is never scaled — a scaled stage would put pointer coordinates
     and window coordinates in different spaces, and dragging would feel wrong.
     Instead the visible screen is the requested mode clipped to the viewport. */
  function apply(){
    const st=document.getElementById('stage');
    const [w,h]=State.prefs.screen.res.split('x').map(Number);
    const W=Math.min(w,window.innerWidth), H=Math.min(h,window.innerHeight);
    st.style.transform='translate(-50%,-50%)';
    st.style.width=W+'px'; st.style.height=H+'px';
    WM.all().forEach(win=>{
      if(win.x>W-40||win.y>H-24) win.moveTo(Math.min(win.x,W-40),Math.min(win.y,H-24));
    });
    Deskbar.place();
    Desk.refresh();
  }
  function grab(){
    const dir=FS.byPath('/boot/home/grabs');
    const n=FS.add(dir,{name:FS.uniqueName(dir,'screen shot.png'),type:'file',mime:'image/png',
      icon:'doc',size:rint(60000,180000),created:now(),mtime:now(),
      attrs:{'Media:Width':State.prefs.screen.res.split('x')[0],
             'Media:Height':State.prefs.screen.res.split('x')[1]}});
    State.dirty(); Tracker.refreshAll();
    Sound.click();
    const sw=Tracker.statusWindow('Screen grab','Saved '+n.name+' in /boot/home/grabs');
    sw.set(1,''+U.size(n.size));
    setTimeout(()=>sw.close(),1100);
  }
  return {apply,grab};
})();

const Saver = (()=>{
  let on=false, stop=null, last=now();
  function start(){
    if(on) return;
    on=true;
    const el=document.getElementById('screensaver');
    el.style.display='block'; el.innerHTML='';
    const canv=U.el('canvas'); el.appendChild(canv);
    const ctx=canv.getContext('2d');
    const mod=State.prefs.saver.module;
    const wins=Array.from({length:14},()=>({x:rnd(),y:rnd(),z:0.2+rnd()*0.9,
      vx:(rnd()-0.5)*0.0004,vy:(rnd()-0.5)*0.0004,vz:0.00018+rnd()*0.0004}));
    const stars=Array.from({length:260},()=>({x:rnd()*2-1,y:rnd()*2-1,z:rnd()*2+0.2}));
    stop=Anim.add(dt=>{
      const W=el.clientWidth,H=el.clientHeight;
      if(canv.width!==W||canv.height!==H){ canv.width=W; canv.height=H; }
      ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
      if(mod==='Flying Windows'){
        wins.forEach(w=>{
          w.z+=w.vz*dt; w.x+=w.vx*dt; w.y+=w.vy*dt;
          if(w.z>1.5){ w.z=0.15; w.x=rnd(); w.y=rnd(); }
          const ww=40*w.z*2, hh=30*w.z*2;
          const px=W/2+(w.x-0.5)*W*w.z, py=H/2+(w.y-0.5)*H*w.z;
          ctx.fillStyle='#d8d8d8'; ctx.fillRect(px,py,ww,hh);
          ctx.fillStyle='#ffcb00'; ctx.fillRect(px,py-Math.max(2,hh*0.14),ww*0.55,Math.max(2,hh*0.14));
          ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.strokeRect(px,py,ww,hh);
        });
      } else if(mod==='Starfield'){
        stars.forEach(s=>{
          s.z-=dt*0.0012;
          if(s.z<0.15){ s.z=2.2; s.x=rnd()*2-1; s.y=rnd()*2-1; }
          const k=Math.min(W,H)*0.8/s.z;
          const px=W/2+s.x*k, py=H/2+s.y*k;
          const b=U.clamp(1.4-s.z*0.5,0.1,1);
          ctx.fillStyle='rgba(255,255,255,'+b+')';
          ctx.fillRect(px,py,b>0.7?2:1,b>0.7?2:1);
        });
      }
    },0.10);
    const wake=()=>quit();
    ['pointerdown','pointermove','keydown','wheel'].forEach(ev=>
      document.addEventListener(ev,wake,{once:true,capture:true}));
  }
  function quit(){
    if(!on) return;
    on=false; if(stop) stop();
    document.getElementById('screensaver').style.display='none';
    last=now();
  }
  function poke(){ last=now(); if(on) quit(); }
  function watch(){
    setInterval(()=>{
      if(!State.prefs.saver.enabled||on) return;
      if(now()-last>State.prefs.saver.delay*60000) start();
    },2000);
    ['pointermove','pointerdown','keydown','wheel'].forEach(ev=>
      document.addEventListener(ev,()=>{ last=now(); },true));
  }
  return {start,quit,watch,poke,get active(){return on;}};
})();

/* ============================================================
   36. Power: shutdown, restart, and Kernel Debugger Land
   ============================================================ */
const Power = (()=>{
  const SHUT=[
    'Tracker: saving desktop state',
    'Deskbar: goodbye',
    'app_server: closing 0 remaining windows',
    'media_server: stopping nodes',
    'net_server: bringing etherpci0 down',
    'syslog_daemon: rotating /boot/var/log/syslog',
    'bfs: flushing journal on /Work',
    'bfs: flushing journal on /boot',
    'bfs: /boot unmounted cleanly',
    'kernel: 0 threads remaining',
    'kernel: halting'
  ];
  function shutdown(restart){
    Alert.show({type:'warning',title:'Shut Down',
      text:restart?'Restart the computer?':'Are you sure you want to shut down?\n\n'+
        'Anything you have not saved will not be saved for you.',
      buttons:['Cancel',restart?'Restart':'Shut Down'],def:1,
      cb:i=>{ if(i===1) sequence(restart); }});
  }
  function sequence(restart){
    State.save();
    if(State.prefs.sounds.events.startup) Sound.shutdown();
    const sd=document.getElementById('shutdown');
    sd.className=''; sd.style.display='block'; sd.textContent='';
    let i=0;
    const step=()=>{
      if(i<SHUT.length){
        sd.textContent+=SHUT[i]+'\n'; i++;
        setTimeout(step,rint(90,220));
      } else {
        setTimeout(()=>{
          if(restart){ replay(); }
          else {
            sd.className='safe'; sd.style.display='flex';
            sd.innerHTML='<div style="font:22px var(--ui);color:#ffcb00">'+
              'It&rsquo;s now safe to turn off your computer.</div>'+
              '<div style="font:11px var(--ui);color:#8fa8c0;margin-top:10px">'+
              'The journal is flushed. The volumes are clean.</div>'+
              '<div style="font:11px var(--ui);color:#55697d;margin-top:26px">'+
              'Reload this page to boot again.</div>';
          }
        },420);
      }
    };
    step();
  }
  function replay(){
    // close everything and run the boot sequence again, in place
    WM.all().slice().forEach(w=>{ w.dead=true; w.el.remove(); });
    WM.all().length=0;
    Object.keys(Apps.instances).forEach(k=>Apps.instances[k].length=0);
    Object.keys(Tracker.openWins).forEach(k=>delete Tracker.openWins[k]);
    document.getElementById('shutdown').style.display='none';
    document.getElementById('desktop').style.display='none';
    SYS.bootTime=now();
    location.reload();
  }
  function restart(){ shutdown(true); }
  return {shutdown:()=>shutdown(false),restart,sequence};
})();

const KDL = (()=>{
  let active=false, buf='', lines=[];
  function enter(reason){
    if(active) return;
    active=true;
    const el=document.getElementById('kdl');
    el.style.display='block';
    lines=[
      'Welcome to Kernel Debugging Land...',
      '',
      reason||'PANIC: unhandled condition in the kernel',
      '',
      'Stack trace for thread 0x'+(4096+rint(1,900)).toString(16)+' "'+
        (WM.focused?WM.focused.app.toLowerCase():'idle_thread')+'"',
      '    frame  caller     <image>:function + offset',
      ' 0 8005ae10  8003b2c4  <kernel_intel>:panic + 0x2a',
      ' 1 8005ae40  8003c118  <kernel_intel>:_user_debugger + 0x66',
      ' 2 8005ae7c  80041fd0  <kernel_intel>:handle_debug_trap + 0x14',
      ' 3 8005aeb0  8004a7a8  <kernel_intel>:int_bottom + 0x3d',
      '',
      'kernel debugger commands: continue, reboot, teams, threads, bt, help',
      ''
    ];
    render();
    document.addEventListener('keydown',key,true);
  }
  function render(){
    const el=document.getElementById('kdl');
    el.innerHTML=U.esc(lines.join('\n'))+'\n<b>kdebug&gt;</b> '+U.esc(buf)+'<span class="cur"> </span>';
    el.scrollTop=el.scrollHeight;
  }
  function out(s){ String(s).split('\n').forEach(l=>lines.push(l)); }
  function key(e){
    if(!active) return;
    U.stop(e);
    if(e.key==='Enter'){
      const cmd=buf.trim(); buf='';
      lines.push('kdebug> '+cmd);
      run(cmd);
      render();
      return;
    }
    if(e.key==='Backspace'){ buf=buf.slice(0,-1); render(); return; }
    if(e.key.length===1){ buf+=e.key; render(); }
  }
  function run(cmd){
    const a=cmd.split(/\s+/);
    switch(a[0]){
      case '': return;
      case 'help': case '?':
        out('  continue (co)   leave the debugger and carry on');
        out('  reboot          restart the machine now');
        out('  teams           list teams');
        out('  threads         list a few threads');
        out('  bt              backtrace of the current thread');
        out('  sc              same, with more numbers');
        out('  ints            interrupt counts');
        out('  haiku           because you are here anyway');
        out('');
        return;
      case 'continue': case 'co': case 'c':
        out('resuming...');
        setTimeout(()=>{
          active=false;
          document.removeEventListener('keydown',key,true);
          document.getElementById('kdl').style.display='none';
          lines=[]; buf='';
          const l=FS.byPath('/boot/var/log/syslog');
          if(l){ l.data+='KERN: returned from kernel debugger; system continues\n'; State.dirty(); }
        },420);
        return;
      case 'reboot': case 'reset':
        out('rebooting...');
        setTimeout(()=>{ active=false;
          document.removeEventListener('keydown',key,true); location.reload(); },500);
        return;
      case 'teams':
        out('team           id  threads  name');
        Teams.list().forEach(t=>out('0x'+(0x1000+t.id).toString(16)+'  '+U.pad(t.id,5,' ')+
          U.pad(t.threads,9,' ')+'  '+t.name));
        out('');
        return;
      case 'threads':
        out(' thread         state  prio  team  name');
        [['0x1a04','ready',10,1,'idle thread 0'],['0x1a05','ready',10,1,'idle thread 1'],
         ['0x2110','waiting',15,42,'picasso'],['0x2111','waiting',15,42,'input_server'],
         ['0x3320','running',10,73,'Tracker'],['0x47a1','waiting',5,1138,'wind_catches_lily']]
          .forEach(r=>out(' '+r[0]+U.pad(r[1],9,' ')+U.pad(r[2],6,' ')+U.pad(r[3],6,' ')+'  '+r[4]));
        out('');
        return;
      case 'bt': case 'sc':
        out(' 0 8005ae10  8003b2c4  <kernel_intel>:panic + 0x2a');
        out(' 1 8005ae40  8003c118  <kernel_intel>:_user_debugger + 0x66');
        out(' 2 8005ae7c  80041fd0  <kernel_intel>:handle_debug_trap + 0x14');
        out(' 3 8005aeb0  8004a7a8  <kernel_intel>:int_bottom + 0x3d');
        out(' 4 8005aef0  00131a44  <app_server>:BWindow::Show() + 0x84');
        out('');
        return;
      case 'ints':
        out('  irq  count      handler');
        [[0,rint(90000,300000),'timer'],[1,rint(2000,9000),'keyboard'],
         [12,rint(4000,40000),'ps2 mouse'],[14,rint(9000,90000),'ide 0'],
         [11,rint(3000,30000),'etherpci']].forEach(r=>
          out('  '+U.pad(r[0],3,' ')+'  '+U.pad(r[1],9,' ')+'  '+r[2]));
        out('');
        return;
      case 'haiku':
        out('');
        NetPositive.randomHaiku().forEach(l=>out('    '+l));
        out('');
        return;
      default:
        out('unknown command "'+a[0]+'" -- try help');
        out('');
    }
  }
  return {enter,get active(){return active;}};
})();

/* ============================================================
   37. Global keys, focus-follows-mouse, boot
   ============================================================ */
function installGlobalKeys(){
  document.addEventListener('keydown',e=>{
    if(KDL.active) return;
    if(Saver.active){ Saver.quit(); return; }
    const cmd=e.altKey||e.metaKey;
    // workspace switching: Alt+F1..F9
    if(cmd&&/^F([1-9]|1[0-2])$/.test(e.key)){
      const n=Number(e.key.slice(1))-1;
      if(n<State.prefs.workspaces.count){ U.stop(e); Desk.setWorkspace(n); }
      return;
    }
    if(e.ctrlKey&&e.altKey&&(e.key==='Delete'||e.key==='Backspace')){
      U.stop(e); Apps.launch('TeamMonitor'); return;
    }
    if(e.ctrlKey&&e.key==='Tab'){ U.stop(e); WM.focusNext(e.shiftKey); return; }
    if(e.key==='PrintScreen'||(cmd&&e.key==='p'&&e.shiftKey)){ U.stop(e); Screen.grab(); return; }
    if(cmd&&e.key.toLowerCase()==='f'&&!e.shiftKey){
      const t=e.target;
      if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
      U.stop(e); Find.open(); return;
    }
    if(cmd&&e.key.toLowerCase()==='q'){
      const f=WM.focused;
      if(f&&f.app!=='Tracker'){
        U.stop(e);
        const inst=Apps.instances[f.app];
        if(inst) inst.slice().forEach(i=>i.win&&i.win.close());
        else f.close();
      }
      return;
    }
    if(cmd&&e.key.toLowerCase()==='w'){
      const f=WM.focused;
      const t=e.target;
      if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
      if(f&&!f.el.contains(document.activeElement)){ U.stop(e); f.close(); }
      return;
    }
    // Twitcher-ish: Alt+Tab also cycles, because muscle memory
    if(cmd&&e.key==='Tab'){ U.stop(e); WM.focusNext(e.shiftKey); return; }
  },false);

  // focus follows mouse, when asked for
  document.addEventListener('pointermove',e=>{
    if(!State.prefs.appearance.focusFollows) return;
    if(DragMgr.active||Menu.isOpen) return;
    const w=e.target.closest?e.target.closest('.win'):null;
    if(w&&w._win&&WM.focused!==w._win) w._win.focus();
  });
  window.addEventListener('beforeunload',()=>State.save());
  window.addEventListener('resize',()=>{
    Screen.apply();
  });
}

/* ============================================================
   38. Boot the simulation
   ============================================================ */
/* windows carry a back-pointer so pointer events can find them */
(function patchWinPointer(){
  const proto=WM.Win.prototype;
  const oldFocus=proto.focus;
  proto.focus=function(){ this.el._win=this; return oldFocus.call(this); };
})();

(function main(){
  State.load();
  // restore any icons drawn in Icon-O-Matic before the Tracker draws them
  FS.all().forEach(n=>{
    if(n.iconPix&&n.icon&&n.icon.indexOf('pix:')===0){
      const data=n.iconPix;
      Icons.art[n.icon]=()=>svgFromPix(JSON.parse(data));
    }
  });
  // sound + appearance preferences take effect before anything is drawn
  Sound.enabled=State.prefs.sounds.enabled;
  Sound.setVolume(State.prefs.sounds.volume);
  const a=State.prefs.appearance;
  const rs=document.documentElement.style;
  rs.setProperty('--panel',a.panel); rs.setProperty('--tab',a.tab); rs.setProperty('--sel',a.sel);
  rs.setProperty('--fs',State.prefs.fonts.plainSize+'px');

  WM.init();
  Desk.init();
  Deskbar.init();
  Screen.apply();
  installGlobalKeys();
  Saver.watch();

  // keep a live syslog, because something should be writing to it
  setInterval(()=>{
    const l=FS.byPath('/boot/var/log/syslog');
    if(!l) return;
    const msgs=[
      'app_server: workspace '+(Desk.ws+1)+' active, '+WM.all().length+' windows',
      'bfs: journal checkpoint on /boot, 0 pending transactions',
      'media_server: node graph idle',
      'net_server: etherpci0 link up 100Mb full duplex',
      'registrar: mime database sync',
      'kernel: '+Teams.list().reduce((s,t)=>s+t.threads,0)+' threads in '+
        Teams.list().length+' teams'
    ];
    const d=new Date();
    l.data+=U.MON[d.getMonth()]+' '+U.pad(d.getDate(),2,' ')+' '+U.pad(d.getHours(),2)+':'+
      U.pad(d.getMinutes(),2)+':'+U.pad(d.getSeconds(),2)+' '+SYS.hostname+' '+
      msgs[Math.floor(rnd()*msgs.length)]+'\n';
    l.size=l.data.length;
  },45000);

  Boot.run(()=>{
    SYS.bootTime=now();
    Desk.refresh();            // the desktop can only be measured once it is visible
    Deskbar.refreshTeams();
    State.dirty();
  });
})();
