const Alert = (()=>{
  function show(o){
    o=o||{};
    const buttons=o.buttons||['OK'];
    const def=o.def!=null?o.def:buttons.length-1;
    const w=WM.open({title:o.title||'Alert',app:o.app||'Alert',w:o.w||360,h:0,
      resizable:false,zoomable:false,x:o.x,y:o.y,modal:true});
    w.el.classList.add('alertwin');
    const c=w.content; c.style.padding='12px 14px 12px 12px';
    const row=U.div('row'); row.style.alignItems='flex-start'; row.style.gap='12px';
    const ic=U.div('alertico'); ic.innerHTML=(AlertIcons[o.type||'info']||AlertIcons.info)();
    row.appendChild(ic);
    const tx=U.div('txt'); tx.textContent=o.text||''; tx.style.whiteSpace='pre-wrap';
    row.appendChild(tx);
    c.appendChild(row);
    const bs=U.div('btns');
    const btns=buttons.map((b,i)=>{
      const btn=Ctl.button(b,()=>{ w.close(); o.cb&&o.cb(i,b); },{def:i===def});
      bs.appendChild(btn); return btn;
    });
    c.appendChild(bs);
    // size to content, center over stage
    const b=WM.bounds();
    const hh=row.offsetHeight+bs.offsetHeight+12+12+12;   // paddings + gap
    w.resizeTo(o.w||360,hh+21);
    if(o.x==null) w.moveTo(Math.round((b.w-(o.w||360))/2), Math.round(b.h*0.28));
    if(State.prefs.sounds.events.beep) (o.type==='stop'||o.type==='warning')?Sound.alert():Sound.beep();
    const kd=e=>{
      if(e.key==='Enter'){ U.stop(e); btns[def].click(); }
      else if(e.key==='Escape'){
        const ci=buttons.findIndex(b=>/cancel/i.test(b));
        U.stop(e); if(ci>=0) btns[ci].click(); else w.close();
      }
    };
    document.addEventListener('keydown',kd,true);
    w.on('close',()=>document.removeEventListener('keydown',kd,true));
    w.focus();

  }
  function ask(text,cb,o){
    return show(Object.assign({text,buttons:['Cancel','OK'],def:1,type:'idea',
      cb:i=>{ if(i===1)cb&&cb(); }},o||{}));
  }
  return {show,ask};
})();
/* ============================================================
   11. Drag manager — icons between windows, desktop, Trash, Deskbar
   ============================================================ */
const DragMgr = (()=>{
  let st=null;
  const proxyLayer = ()=>document.getElementById('dragproxy');

  function begin(items,srcView,e){
    if(!items.length) return;
    const layer=proxyLayer(), sr=U.rect(document.getElementById('stage'));
    const prox=U.div();
    prox.style.cssText='position:absolute;opacity:.62;pointer-events:none';
    items.slice(0,5).forEach((n,i)=>{
      const d=U.div(); d.style.cssText='position:absolute;left:'+(i*7)+'px;top:'+(i*5)+'px;width:32px;height:32px';
      d.innerHTML=Icons.svg(FS.icon(n)); prox.appendChild(d);
    });
    if(items.length>1){
      const c=U.div(null,String(items.length));
      c.style.cssText='position:absolute;left:34px;top:34px;background:#ffcb00;border:1px solid #000;'+
        'font:bold 9px var(--ui);padding:0 3px';
      prox.appendChild(c);
    }
    layer.appendChild(prox);
    st={items,srcView,prox,sr,target:null,targetEl:null};
    move(e);
    document.addEventListener('pointermove',move,true);
    document.addEventListener('pointerup',drop,true);
    document.body.style.cursor='grabbing';
  }
  function move(e){
    if(!st) return;
    st.prox.style.left=(e.clientX-st.sr.left-16)+'px';
    st.prox.style.top=(e.clientY-st.sr.top-16)+'px';
    st.prox.style.display='none';
    const el=document.elementFromPoint(e.clientX,e.clientY);
    st.prox.style.display='';
    if(st.targetEl){ st.targetEl.classList.remove('dropinto'); st.targetEl=null; }
    st.target=null;
    if(!el) return;
    // 1. an item that can receive (folder / volume / trash)
    const item=el.closest('.ficon,.dicon,.lvrow');
    if(item&&item._node){
      const n=item._node;
      if((n.type==='dir'||n.type==='vol'||n.type==='trash')&&!st.items.some(i=>i.id===n.id)){
        st.target={node:n,kind:'into'}; st.targetEl=item; item.classList.add('dropinto'); return;
      }
    }
    // 2. Deskbar Trash-ish targets
    const tray=el.closest('#deskbar');
    if(tray){ st.target=null; return; }
    // 3. a view background
    const view=el.closest('[data-viewid]');
    if(view&&view._view){
      const v=view._view;
      if(v.node){ st.target={node:v.node,kind:'view',view:v,x:e.clientX,y:e.clientY}; }
      return;
    }
    // 4. desktop
    const dsk=el.closest('#dsk-icons,#desktop');
    if(dsk){ st.target={node:Desk.desktopNode(),kind:'desktop',x:e.clientX,y:e.clientY}; }
  }
  function drop(e){
    document.removeEventListener('pointermove',move,true);
    document.removeEventListener('pointerup',drop,true);
    document.body.style.cursor='';
    if(!st) return;
    const s=st; st=null;
    if(s.targetEl) s.targetEl.classList.remove('dropinto');
    s.prox.remove();
    if(!s.target){ return; }
    const dest=s.target.node;
    if(!dest) return;
    // volumes and the Trash can be shuffled around a view, never moved into one
    if(s.items.some(i=>i.type==='vol'||i.type==='trash')){
      if(s.target.kind==='desktop') Desk.placeAt(s.items,e);
      else if(s.target.kind==='view'&&s.target.view&&s.target.view.mode!=='list')
        s.target.view.placeAt(s.items,e);
      return;
    }
    const same = s.items.every(i=>i.parent===dest.id);
    if(same && (s.target.kind==='view'||s.target.kind==='desktop')){
      // reposition icons inside the same folder
      if(s.target.view&&s.target.view.mode!=='list'){
        s.target.view.placeAt(s.items,e);
      } else if(s.target.kind==='desktop'){
        Desk.placeAt(s.items,e);
      }
      State.dirty();
      return;
    }
    if(dest.ro||FS.volumeOf(dest).ro){
      Alert.show({type:'stop',title:'Tracker',
        text:'The volume "'+FS.volumeOf(dest).name+'" is read-only.\nYou can\'t copy items onto it.'});
      return;
    }
    const toTrash = dest.type==='trash';
    const crossVol = FS.volumeOf(dest)!==FS.volumeOf(s.items[0]);
    const copy = e.ctrlKey || (crossVol && !e.altKey);
    Tracker.transfer(s.items,dest,{copy:copy&&!toTrash,trash:toTrash,
      dropPoint:(s.target.kind!=='into')?{view:s.target.view,e}:null});
  }
  return {begin,get active(){return !!st;}};
})();

/* ============================================================
   12. ItemView — icon / mini icon / list, shared by Tracker + Desktop
   ============================================================ */
let VIEWSEQ=0;
class ItemView {
  constructor(host,opts){
    this.opts=opts||{};
    this.node=this.opts.node||null;
    this.win=this.opts.win||null;
    this.desktop=!!this.opts.desktop;
    this.key=this.opts.key||(this.node?FS.path(this.node):'view');
    this.id='v'+(++VIEWSEQ);
    this.sel=new Set();
    this.host=host;
    const vs=State.view('tv:'+this.key,{mode:this.desktop?'icon':'icon',
      cols:['name','size','mtime'],sort:'name',rev:false,widths:{}});
    this.mode=vs.mode; this.cols=vs.cols.slice(); this.sort=vs.sort; this.rev=vs.rev;
    this.widths=Object.assign({},vs.widths);
    this.build();
  }
  vs(o){ State.setView('tv:'+this.key,Object.assign({mode:this.mode,cols:this.cols,
    sort:this.sort,rev:this.rev,widths:this.widths},o||{})); }
  build(){
    this.host.innerHTML='';
    this.root=U.div(this.desktop?'':'fill');
    if(this.desktop){ this.root.className=''; this.root.style.cssText='position:absolute;inset:0'; }
    this.root.dataset.viewid=this.id; this.root._view=this;
    this.host.appendChild(this.root);
    this.render();
  }
  items(){
    let list;
    if(this.opts.items) list=this.opts.items();
    else list=FS.kids(this.node).filter(n=>!(n.name[0]==='.'&&!State.prefs.tracker.showHidden));
    const dir=this.rev?-1:1;
    const key=this.sort;
    const def=FS.colDef(key);
    // the desktop keeps mount order: boot first, then the other volumes, Trash last
    if(this.desktop) return list;
    list.sort((a,b)=>{
      if(State.prefs.tracker.sortFolders && this.mode==='list'){
        const ad=(a.type==='dir'||a.type==='vol'||a.type==='trash')?0:1;
        const bd=(b.type==='dir'||b.type==='vol'||b.type==='trash')?0:1;
        if(ad!==bd) return ad-bd;
      }
      let av=FS.field(a,key), bv=FS.field(b,key);
      if(def.t==='time'||def.t==='size'||def.t==='int'){ av=Number(av)||0; bv=Number(bv)||0;
        return (av-bv)*dir; }
      av=String(av==null?'':av).toLowerCase(); bv=String(bv==null?'':bv).toLowerCase();
      return av<bv?-1*dir:av>bv?1*dir:0;
    });
    return list;
  }
  /* ---------- rendering ---------- */
  render(){
    const keep=new Set(this.sel);
    this.root.innerHTML='';
    if(this.mode==='list'&&!this.desktop) this.renderList();
    else this.renderIcons();
    this.sel=new Set([...keep].filter(id=>FS.get(id)));
    this.applySel();
    if(this.win) this.updateStatus();
  }
  renderIcons(){
    const wrap=U.div(this.desktop?'':'iconview');
    if(this.desktop) wrap.style.cssText='position:absolute;inset:0';
    if(this.desktop){
      const ct=U.div('iview-ct'); wrap.appendChild(ct);
      this.ct=ct;
    } else {
      this.scroller=new Scroller(wrap,{v:true,h:true});
      this.scroller.content.style.position='relative';
      this.ct=this.scroller.content;
    }
    this.root.appendChild(wrap);
    const list=this.items();
    const mini=this.mode==='mini';
    const cw=mini?152:78, ch=mini?18:52;
    const posmap=State.view('pos:'+this.key,{});
    let auto=0;
    const avail=Math.max(1,Math.floor((this.host.clientWidth-8)/cw))||8;
    const used={};
    list.forEach(n=>{
      const el=U.div('ficon'+(mini?' mini':'')+(this.desktop?' dicon':''));
      if(this.desktop){ el.className='dicon'; }
      el._node=n; el.dataset.id=n.id;
      const ic=U.div('ic'); ic.innerHTML=Icons.svg(FS.icon(n));
      const lb=U.div('lb',n.name);
      el.appendChild(ic); el.appendChild(lb);
      let p=posmap[n.name];
      if(!p){
        if(this.desktop){
          // volumes live under the Deskbar in the top-right corner, as they always have
          const col=Math.floor(auto/9), rowi=auto%9;
          const HW=this.host.clientWidth||WM.bounds().w;
          p={x:Math.max(4,HW-88-col*82),y:34+rowi*62};
        } else {
          p={x:8+(auto%avail)*cw,y:6+Math.floor(auto/avail)*ch};
        }
        auto++;
      }
      el.style.left=p.x+'px'; el.style.top=p.y+'px';
      this.wire(el,n);
      this.ct.appendChild(el);
      used[n.name]=p;
    });
    // size the canvas so scrollbars mean something
    if(!this.desktop){
      let mx=0,my=0;
      Object.values(used).forEach(p=>{ mx=Math.max(mx,p.x+cw); my=Math.max(my,p.y+ch); });
      this.ct.style.width=Math.max(mx+10,this.host.clientWidth-16)+'px';
      this.ct.style.height=Math.max(my+10,this.host.clientHeight-16)+'px';
      if(this.scroller) this.scroller.update();
    }
    this.bgWire(wrap);
  }
  renderList(){
    const lv=U.div('lv');
    const hd=U.div('hd'); lv.appendChild(hd);
    const rows=U.div('rows'); lv.appendChild(rows);
    this.root.appendChild(lv);
    const cols=this.cols.map(a=>{
      const d=FS.colDef(a);
      return {a,l:d.l,t:d.t,w:this.widths[a]||d.w};
    });
    cols.forEach((c,i)=>{
      const h=U.div('col'+(this.sort===c.a?(this.rev?' desc':' asc'):''),c.l);
      h.style.width=c.w+'px'; h.style.flex='0 0 '+c.w+'px';
      h.appendChild(U.div('ar'));
      const grab=U.div('grab'); h.appendChild(grab);
      h.addEventListener('pointerdown',e=>{
        if(e.target===grab) return;
        U.stop(e);
        if(this.sort===c.a) this.rev=!this.rev; else { this.sort=c.a; this.rev=false; }
        this.vs(); this.render();
      });
      h.addEventListener('contextmenu',e=>{ U.stop(e); this.columnMenu(e); });
      grab.addEventListener('pointerdown',e=>{
        U.stop(e);
        const sx=e.clientX, ow=c.w;
        const mv=ev=>{ const w=Math.max(34,ow+ev.clientX-sx);
          this.widths[c.a]=w; h.style.width=w+'px'; h.style.flex='0 0 '+w+'px';
          rows.querySelectorAll('.lvrow').forEach(r=>{
            const cell=r.children[i]; if(cell){ cell.style.width=w+'px'; cell.style.flex='0 0 '+w+'px'; }
          });
        };
        const up=()=>{ document.removeEventListener('pointermove',mv);
          document.removeEventListener('pointerup',up); this.vs(); };
        document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
      });
      hd.appendChild(h);
    });
    const sc=new Scroller(rows,{v:true,h:true});
    this.scroller=sc;
    sc.viewport.addEventListener('scroll',()=>{ hd.scrollLeft=sc.viewport.scrollLeft; });
    const body=sc.content;
    const list=this.items();
    list.forEach((n,ri)=>{
      const r=U.div('lvrow'+(ri%2?' alt':''));
      r._node=n; r.dataset.id=n.id;
      cols.forEach((c,ci)=>{
        const cell=U.div('c'+(ci===0?' n':''));
        cell.style.width=c.w+'px'; cell.style.flex='0 0 '+c.w+'px';
        if(ci===0){
          const ic=U.div('ic'); ic.innerHTML=Icons.svg(FS.icon(n)); cell.appendChild(ic);
          cell.appendChild(U.el('span',null,c.a==='name'?n.name:this.fmt(n,c)));
        } else {
          cell.textContent=this.fmt(n,c);
        }
        r.appendChild(cell);
      });
      this.wire(r,n);
      body.appendChild(r);
    });
    body.style.width=cols.reduce((s,c)=>s+c.w,0)+'px';
    setTimeout(()=>sc.update(),0);
    this.bgWire(rows);
  }
  fmt(n,c){
    const v=FS.field(n,c.a);
    if(v==null||v==='') return '-';
    if(c.t==='time') return U.date(typeof v==='number'?v:Date.parse(v));
    if(c.t==='size') return U.size(v);
    return String(v);
  }
  /* ---------- interaction ---------- */
  wire(el,n){
    el.addEventListener('pointerdown',e=>{
      if(e.button===2) return;
      e.stopPropagation();
      if(this.win) this.win.focus();
      const already=this.sel.has(n.id);
      if(e.shiftKey||e.metaKey){ if(already)this.sel.delete(n.id); else this.sel.add(n.id); }
      else if(!already){ this.sel.clear(); this.sel.add(n.id); }
      this.applySel();
      // possible drag
      const sx=e.clientX, sy=e.clientY;
      let started=false;
      const mv=ev=>{
        if(started) return;
        if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>4){
          started=true;
          const items=[...this.sel].map(FS.get).filter(Boolean);
          DragMgr.begin(items.length?items:[n],this,ev);
          cleanup();
        }
      };
      const up=()=>{ cleanup(); };
      const cleanup=()=>{ document.removeEventListener('pointermove',mv);
        document.removeEventListener('pointerup',up); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
    el.addEventListener('dblclick',e=>{
      e.stopPropagation();
      this.open(n,e);
    });
    el.addEventListener('contextmenu',e=>{
      U.stop(e);
      if(!this.sel.has(n.id)){ this.sel.clear(); this.sel.add(n.id); this.applySel(); }
      Tracker.fileMenu(e,[...this.sel].map(FS.get).filter(Boolean),this);
    });
  }
  bgWire(el){
    el.addEventListener('pointerdown',e=>{
      if(e.target.closest('.ficon,.dicon,.lvrow,.scbar')) return;
      if(this.win) this.win.focus();
      this.sel.clear(); this.applySel();
      // rubber band
      const sr=U.rect(this.root);
      const sx=e.clientX, sy=e.clientY;
      const band=U.div(); band.style.cssText=
        'position:absolute;border:1px dotted #333;pointer-events:none;z-index:40';
      let on=false;
      const mv=ev=>{
        if(!on&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<4) return;
        if(!on){ on=true; this.root.appendChild(band); }
        const x1=Math.min(sx,ev.clientX)-sr.left, y1=Math.min(sy,ev.clientY)-sr.top;
        const x2=Math.max(sx,ev.clientX)-sr.left, y2=Math.max(sy,ev.clientY)-sr.top;
        band.style.left=x1+'px'; band.style.top=y1+'px';
        band.style.width=(x2-x1)+'px'; band.style.height=(y2-y1)+'px';
        this.sel.clear();
        this.root.querySelectorAll('.ficon,.dicon,.lvrow').forEach(it=>{
          const r=U.rect(it);
          if(r.right>Math.min(sx,ev.clientX)&&r.left<Math.max(sx,ev.clientX)&&
             r.bottom>Math.min(sy,ev.clientY)&&r.top<Math.max(sy,ev.clientY)) this.sel.add(it._node.id);
        });
        this.applySel();
      };
      const up=()=>{ document.removeEventListener('pointermove',mv);
        document.removeEventListener('pointerup',up); band.remove(); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
    el.addEventListener('contextmenu',e=>{
      if(e.target.closest('.ficon,.dicon,.lvrow')) return;
      U.stop(e);
      if(this.desktop) Desk.contextMenu(e);
      else Tracker.viewMenu(e,this);
    });
  }
  applySel(){
    this.root.querySelectorAll('.ficon,.dicon,.lvrow').forEach(el=>{
      el.classList.toggle('sel',this.sel.has(el._node.id));
    });
    if(this.win) this.updateStatus();
  }
  selection(){ return [...this.sel].map(FS.get).filter(Boolean); }
  selectAll(){ this.items().forEach(n=>this.sel.add(n.id)); this.applySel(); }
  open(n,e){
    if(e&&e.altKey&&this.win&&(n.type==='dir'||n.type==='vol')){
      // Option-double-click: open in this window, close the parent (single-window feel)
      Tracker.openFolder(n); this.win.close(); return;
    }
    Tracker.launch(n,this);
  }
  setMode(m){ this.mode=m; this.vs(); this.render(); }
  placeAt(items,e){
    const sr=U.rect(this.ct||this.root);
    const pm=State.view('pos:'+this.key,{});
    items.forEach((n,i)=>{
      pm[n.name]={x:Math.max(0,Math.round(e.clientX-sr.left-16+i*6)),
                  y:Math.max(0,Math.round(e.clientY-sr.top-16+i*4))};
    });
    State.dirty(); this.render();
  }
  cleanUp(){
    const pm=State.view('pos:'+this.key,{});
    Object.keys(pm).forEach(k=>delete pm[k]);
    const list=this.items();
    const mini=this.mode==='mini';
    const cw=mini?152:78, ch=mini?18:52;
    const avail=this.desktop?8:Math.max(1,Math.floor((this.host.clientWidth-8)/cw));
    list.forEach((n,i)=>{
      if(this.desktop){ const col=Math.floor(i/9), r=i%9;
        pm[n.name]={x:Math.max(4,this.host.clientWidth-88-col*82),y:34+r*62}; }
      else pm[n.name]={x:8+(i%avail)*cw,y:6+Math.floor(i/avail)*ch};
    });
    State.dirty(); this.render();
  }
  columnMenu(e){
    const cur=new Set(this.cols);
    const mk=c=>({label:c.l,checked:cur.has(c.a),disabled:c.a==='name',fn:()=>{
      if(cur.has(c.a)) this.cols=this.cols.filter(a=>a!==c.a); else this.cols.push(c.a);
      this.vs(); this.render();
    }});
    const items=BASE_COLS.map(mk);
    // attribute columns offered by the types actually present in this folder
    const types=new Set(this.items().map(n=>n.mime));
    let any=false;
    types.forEach(t=>{
      const sch=FS.schemaFor(t); if(!sch.length) return;
      if(!any){ items.push({sep:true}); any=true; }
      items.push({label:(MIME_NAMES[t]||t)+' attributes',disabled:true});
      sch.forEach(c=>items.push(mk(c)));
    });
    Menu.atEvent(items,e);
  }
  updateStatus(){
    if(!this.win||!this.win.statusEl) return;
    const list=this.items();
    const n=this.sel.size;
    this.win.statusEl.textContent = n? (n+' of '+list.length+' item'+(list.length===1?'':'s')+' selected')
      : (list.length+' item'+(list.length===1?'':'s'));
  }
  renameSelected(){
    const n=this.selection()[0]; if(!n) return;
    if(n.sys||n.ro){ Alert.show({type:'stop',title:'Tracker',
      text:'You can\'t rename "'+n.name+'". It belongs to the system.'}); return; }
    const el=this.root.querySelector('[data-id="'+n.id+'"]'); if(!el) return;
    const lb=el.querySelector('.lb')||el.querySelector('.c.n span');
    const r=U.rect(lb), pr=U.rect(this.root);
    const box=U.div('lbl-edit');
    box.style.left=(r.left-pr.left-2)+'px'; box.style.top=(r.top-pr.top-1)+'px';
    const inp=U.el('input'); inp.value=n.name; inp.style.width=Math.max(70,r.width+30)+'px';
    box.appendChild(inp); this.root.appendChild(box);
    inp.focus(); inp.setSelectionRange(0,n.name.replace(/\.[^.]+$/,'').length);
    const done=ok=>{
      if(box.parentNode){
        if(ok&&inp.value.trim()&&inp.value!==n.name){
          const p=FS.get(n.parent);
          const clash=FS.kids(p).some(k=>k!==n&&k.name.toLowerCase()===inp.value.trim().toLowerCase());
          if(clash) Alert.show({type:'stop',title:'Tracker',
            text:'A file named "'+inp.value.trim()+'" already exists in this folder.'});
          else { n.name=inp.value.trim(); n.mtime=now(); State.dirty(); }
        }
        box.remove(); this.render(); Tracker.refreshAll();
      }
    };
    inp.addEventListener('keydown',e=>{ e.stopPropagation();
      if(e.key==='Enter')done(true); else if(e.key==='Escape')done(false); });
    inp.addEventListener('blur',()=>done(true));
  }
  keydown(e){
    if(e.key==='Enter'){ const s=this.selection(); if(s.length){ U.stop(e);
      if(e.altKey) this.renameSelected(); else s.forEach(n=>Tracker.launch(n,this)); } return true; }
    if(e.key==='Delete'||e.key==='Backspace'){
      const s=this.selection(); if(s.length){ U.stop(e); Tracker.moveToTrash(s,e.shiftKey); } return true; }
    if(e.key==='a'&&(e.altKey||e.metaKey)){ U.stop(e); this.selectAll(); return true; }
    if(/^Arrow/.test(e.key)){
      const list=this.items(); if(!list.length) return false;
      const cur=list.findIndex(n=>this.sel.has(n.id));
      let i=cur;
      if(this.mode==='list'||this.desktop===false&&this.mode==='mini'){
        i = e.key==='ArrowDown'?Math.min(list.length-1,cur+1):e.key==='ArrowUp'?Math.max(0,cur-1):cur;
      } else {
        const per=Math.max(1,Math.floor((this.host.clientWidth-8)/78));
        if(e.key==='ArrowRight') i=Math.min(list.length-1,cur+1);
        else if(e.key==='ArrowLeft') i=Math.max(0,cur-1);
        else if(e.key==='ArrowDown') i=Math.min(list.length-1,cur+per);
        else if(e.key==='ArrowUp') i=Math.max(0,cur-per);
      }
      if(cur<0) i=0;
      if(i!==cur||cur<0){ U.stop(e); this.sel.clear(); this.sel.add(list[i].id); this.applySel();
        const el=this.root.querySelector('[data-id="'+list[i].id+'"]');
        if(el&&this.scroller){ const r=U.rect(el), vr=U.rect(this.scroller.viewport);
          if(r.top<vr.top) this.scroller.viewport.scrollTop-=(vr.top-r.top)+2;
          else if(r.bottom>vr.bottom) this.scroller.viewport.scrollTop+=(r.bottom-vr.bottom)+2;
          this.scroller.update(); }
      }
      return true;
    }
    if(e.key.length===1&&!e.altKey&&!e.ctrlKey&&!e.metaKey){
      const list=this.items();
      const hit=list.find(n=>n.name.toLowerCase().indexOf(e.key.toLowerCase())===0);
      if(hit){ this.sel.clear(); this.sel.add(hit.id); this.applySel(); return true; }
    }
    return false;
  }
}

/* ============================================================
   13. Tracker
   ============================================================ */
const Tracker = (()=>{
  const openWins={};    // node id -> win
  const recent={docs:[],apps:[],folders:[]};

  function refreshAll(){
    Object.values(openWins).forEach(w=>{ if(w&&w.view&&!w.dead) w.view.render(); });
    Desk.refresh(); Deskbar.refreshTeams();
  }
  function pushRecent(kind,n){
    const p=FS.path(n);
    const a=recent[kind];
    const i=a.indexOf(p); if(i>=0)a.splice(i,1);
    a.unshift(p); if(a.length>10)a.pop();
  }
  /* ---------- launching ---------- */
  function launch(n,view){
    if(!n) return;
    if(n.type==='dir'||n.type==='vol'){ openFolder(n); return; }
    if(n.type==='trash'){ openFolder(n); return; }
    if(n.mime===MIME.QUERY){ openQueryNode(n); return; }
    if(n.type==='app'||n.mime===MIME.APP){
      pushRecent('apps',n);
      const a=n.app||n.name;
      if(a.indexOf('pref:')===0) Prefs.open(a.slice(5));
      else if(Apps.registry[a]) Apps.launch(a);
      else Alert.show({type:'stop',title:'Tracker',
        text:'Could not launch "'+n.name+'".\n\nThe application is not installed on this simulation.'});
      return;
    }
    pushRecent('docs',n);
    switch(n.mime){
      case MIME.TEXT: Apps.launch('StyledEdit',{node:n}); break;
      case MIME.HTML: Apps.launch('NetPositive',{url:(n.data||'').indexOf('doc:')===0?
        'be:'+n.data.slice(4).replace(/^\//,''):'file://'+FS.path(n)}); break;
      case MIME.PERSON: Apps.launch('People',{node:n}); break;
      case MIME.MAIL: Apps.launch('BeMail',{node:n}); break;
      case MIME.BOOKMARK: Apps.launch('NetPositive',{url:n.attrs['META:url']}); break;
      case MIME.AUDIO: case 'audio/x-wav': Apps.launch('MediaPlayer',{node:n}); break;
      case MIME.MOVIE: Apps.launch('MediaPlayer',{node:n}); break;
      default:
        Alert.show({type:'info',title:'Tracker',
          text:'There is no preferred application for files of type\n"'+n.mime+'".\n\n'+
               'Open it with StyledEdit?',buttons:['Cancel','Open'],def:1,
          cb:i=>{ if(i===1) Apps.launch('StyledEdit',{node:n}); }});
    }
  }
  /* ---------- folder windows (spatial) ---------- */
  function openFolder(n,opts){
    opts=opts||{};
    if(openWins[n.id]&&!openWins[n.id].dead){
      const w=openWins[n.id];
      if(w.minimized) w.restore(); else w.focus();
      return w;
    }
    const path=FS.path(n);
    const isVol=n.type==='vol';
    const w=WM.open({title:n.type==='trash'?'Trash':n.name,app:'Tracker',
      key:'trk:'+path,w:opts.w||420,h:opts.h||270,minw:180,minh:110,
      icon:FS.icon(n)});
    openWins[n.id]=w;
    w.node=n;
    pushRecent('folders',n);

    const trk=U.div('trk'); w.content.appendChild(trk);
    const body=U.div('body');
    const status=U.div('status');
    const statusText=U.el('span'); status.appendChild(statusText);
    w.statusEl=statusText;
    trk.appendChild(body); trk.appendChild(status);

    const view=new ItemView(body,{node:n,win:w,key:path});
    w.view=view;

    w.setMenuBar([
      {label:'File',items:()=>fileMenuItems(view.selection(),view,n)},
      {label:'Window',items:()=>windowMenuItems(view,w,n)},
      {label:'Attributes',items:()=>attrMenuItems(view)}
    ]);
    // volume free-space readout, like Tracker's status line
    if(isVol) statusText.textContent='';
    const upd=()=>{
      view.updateStatus();
      if(isVol&&!view.sel.size){
        statusText.textContent=view.items().length+' items — '+
          U.size(n.capacity-n.used)+' free of '+U.size(n.capacity);
      }
    };
    w.on('resize',()=>{ if(view.scroller)view.scroller.update(); });
    w.on('resized',()=>view.render());
    w.on('close',()=>{ delete openWins[n.id]; });
    w.on('focus',upd);
    upd();
    w.el.tabIndex=0;
    w.el.addEventListener('keydown',e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
      if(handleTrackerKeys(e,view,w,n)) return;
      view.keydown(e);
    });
    return w;
  }
  function handleTrackerKeys(e,view,w,n){
    const cmd=e.altKey||e.metaKey;
    if(!cmd) return false;
    switch(e.key.toLowerCase()){
      case 'w': U.stop(e); w.close(); return true;
      case 'i': U.stop(e); view.selection().forEach(getInfo); return true;
      case 'e': U.stop(e); view.renameSelected(); return true;
      case 'd': U.stop(e); duplicate(view.selection()); return true;
      case 't': U.stop(e); moveToTrash(view.selection()); return true;
      case 'n': U.stop(e); newFolder(n,view); return true;
      case 'y': U.stop(e); resizeToFit(view,w); return true;
      case 'k': U.stop(e); view.cleanUp(); return true;
      case '1': U.stop(e); view.setMode('icon'); return true;
      case '2': U.stop(e); view.setMode('mini'); return true;
      case '3': U.stop(e); view.setMode('list'); return true;
      case 'arrowup': U.stop(e); { const p=FS.get(n.parent); if(p&&p.parent!==null) openFolder(p);
        else if(p) openFolder(p); } return true;
    }
    return false;
  }
  function resizeToFit(view,w){
    const list=view.items();
    if(view.mode==='list'){
      const wid=view.cols.reduce((s,a)=>s+(view.widths[a]||FS.colDef(a).w),0)+18;
      w.resizeTo(Math.min(WM.bounds().w-20,wid),Math.min(WM.bounds().h-60,list.length*16+58));
    } else {
      const per=Math.min(list.length,6)||1;
      w.resizeTo(per*78+22,Math.ceil(list.length/per)*52+56);
    }
    view.render();
  }
  /* ---------- menus ---------- */

        {label:'Folder',fn:()=>newFolder(dir,view)},

        {label:'Person',fn:()=>newFile(dir,view,MIME.PERSON,'untitled person')},
        {label:'Bookmark',fn:()=>newFile(dir,view,MIME.BOOKMARK,'untitled bookmark')}
      ]},
      {sep:true},
      {label:'Open',sc:'Enter',disabled:!has,fn:()=>sel.forEach(n=>launch(n,view))},
      {label:'Get Info',sc:'Alt+I',disabled:!has,fn:()=>sel.forEach(getInfo)},
      {label:'Edit Name',sc:'Alt+E',disabled:!one,fn:()=>view.renameSelected()},
      {label:'Duplicate',sc:'Alt+D',disabled:!has,fn:()=>duplicate(sel)},

  function windowMenuItems(view,w,n){

  function attrMenuItems(view){
    const cur=new Set(view.cols);
    const mk=c=>({label:c.l,checked:cur.has(c.a),disabled:c.a==='name',fn:()=>{
      if(cur.has(c.a)) view.cols=view.cols.filter(a=>a!==c.a); else view.cols.push(c.a);
      view.vs(); view.render(); }});
    const out=BASE_COLS.map(mk);
    const types=new Set(view.items().map(n=>n.mime));
    let any=false;
    types.forEach(t=>{
      const sch=FS.schemaFor(t); if(!sch.length) return;
      out.push({sep:true},{label:(MIME_NAMES[t]||t),disabled:true});
      sch.forEach(c=>out.push(mk(c))); any=true;
    });
    if(view.mode!=='list'){
      return [{label:'(List view only)',disabled:true},{sep:true}].concat(out);
    }
    return out;
  }
  function destMenu(sel,move){
    const roots=[FS.byPath('/boot/home'),FS.byPath('/boot/home/Desktop'),
      FS.byPath('/Work'),FS.byPath('/boot')].filter(Boolean);
    function sub(dir,depth){
      const dirs=FS.kids(dir).filter(k=>k.type==='dir');
      const items=[{label:(move?'Move':'Copy')+' here',fn:()=>transfer(sel,dir,{copy:!move})}];
      if(dirs.length) items.push({sep:true});
      dirs.slice(0,24).forEach(d=>items.push(depth<3
        ? {label:d.name,sub:sub(d,depth+1)}
        : {label:d.name,fn:()=>transfer(sel,d,{copy:!move})}));
      return items;
    }
    return roots.map(r=>({label:r.name==='home'?'home':r.name,sub:sub(r,0)}));
  }
  function addonMenu(sel,dir,view){
    return [
      {label:'Open Terminal',fn:()=>Apps.launch('Terminal',{cwd:FS.path(dir)})},
      {label:'Mount Volume',sub:Desk.mountItems()},

  function fileMenu(e,sel,view){

  function viewMenu(e,view){

      Menu.atEvent([
        {label:'List View',marked:view.mode==='list',fn:()=>view.setMode('list')},

      {label:'Mini Icon View',marked:view.mode==='mini',fn:()=>view.setMode('mini')},
      {label:'List View',marked:view.mode==='list',fn:()=>view.setMode('list')},
      {sep:true},
      {label:'Clean Up',disabled:view.mode==='list',fn:()=>view.cleanUp()},
      {label:'Select All',fn:()=>view.selectAll()},
      {sep:true},
      {label:'Open Parent',disabled:!FS.get(n.parent),fn:()=>{const p=FS.get(n.parent); if(p)openFolder(p);}},
      {label:'Add-Ons',sub:addonMenu([],n,view)}
    ],e);
  }
  /* ---------- operations ---------- */
  function newFolder(dir,view){
    if(dir.ro){ Alert.show({type:'stop',title:'Tracker',text:'This volume is read-only.'}); return; }
    const n=FS.add(dir,{name:FS.kids(dir).some(k=>k.name==='New folder')?
      FS.uniqueName(dir,'New folder'):'New folder',type:'dir'});
    State.dirty(); refreshAll();
    setTimeout(()=>{
      const v=view||(openWins[dir.id]&&openWins[dir.id].view);
      if(v){ v.sel.clear(); v.sel.add(n.id); v.applySel(); v.renameSelected(); }
    },20);
    return n;
  }
  function newFile(dir,view,mime,base){
    const n=FS.add(dir,{name:FS.uniqueName(dir,base),type:'file',mime,data:'',
      created:now(),mtime:now()});
    if(mime===MIME.PERSON) n.attrs={'META:name':base};
    State.dirty(); refreshAll();
    setTimeout(()=>{ const v=view||(openWins[dir.id]&&openWins[dir.id].view);
      if(v){ v.sel.clear(); v.sel.add(n.id); v.applySel(); v.renameSelected(); } },20);
    return n;
  }
  function createLink(sel,dir){
    sel.forEach(n=>{
      const l=FS.add(dir,{name:FS.uniqueName(dir,'link to '+n.name),type:'file',
        mime:'application/x-vnd.Be-symlink',icon:'link',size:0});
      l.linkTo=FS.path(n);
    });
    State.dirty(); refreshAll();
  }
  function duplicate(sel){
    if(!sel.length) return;
    sel.forEach(n=>{
      const p=FS.get(n.parent); if(!p||p.ro) return;
      FS.clone(n,p,FS.uniqueName(p,n.name));
    });
    State.dirty(); refreshAll();
  }
  function moveToTrash(sel,hard){
    if(!sel.length) return;
    const sys=sel.filter(n=>n.sys||n.ro);
    if(sys.length){
      Alert.show({type:'stop',title:'Tracker',
        text:'"'+sys[0].name+'" can\'t be moved to the Trash.\n\n'+
             'It is either on a read-only volume or part of the system.'});
      return;
    }
    if(hard){
      Alert.show({type:'warning',title:'Tracker',
        text:'Delete '+(sel.length===1?'"'+sel[0].name+'"':sel.length+' items')+' immediately?\n\n'+
             'This cannot be undone.',buttons:['Cancel','Delete'],def:1,
        cb:i=>{ if(i===1){ sel.forEach(n=>FS.remove(n)); Sound.empty(); State.dirty(); refreshAll(); } }});
      return;
    }
    const tr=FS.trash();
    sel.forEach(n=>FS.move(n,tr));
    Sound.trash();
    State.dirty(); refreshAll();
  }
  function emptyTrash(){
    const tr=FS.trash();
    const k=FS.kids(tr);
    if(!k.length){ Alert.show({type:'info',title:'Tracker',text:'The Trash is already empty.'}); return; }
    Alert.show({type:'warning',title:'Tracker',
      text:'Are you sure you want to delete the '+k.length+' item'+(k.length===1?'':'s')+
        ' in the Trash?\n\nThis cannot be undone.',
      buttons:['Cancel','Empty Trash'],def:1,
      cb:i=>{ if(i===1){ k.forEach(n=>FS.remove(n)); Sound.empty(); State.dirty(); refreshAll(); } }});
  }
  /* ---------- Tracker status window (simulated long copies) ---------- */
  function statusWindow(title,label){
    const b=WM.bounds();
    const w=WM.open({title:title,app:'Tracker',w:300,h:78,resizable:false,zoomable:false,
      x:Math.round((b.w-300)/2),y:56,allWorkspaces:true});
    const c=w.pad(9);
    const l=U.div('belabel',label); l.style.marginBottom='6px';
    const p=Ctl.progress(0);
    const l2=U.div('tick','preparing…'); l2.style.marginTop='5px';
    c.appendChild(l); c.appendChild(p); c.appendChild(l2);
    return {win:w,set:(f,t)=>{ p.set(f); if(t)l2.textContent=t; },setLabel:t=>l.textContent=t,
      close:()=>w.close()};
  }
  function transfer(items,dest,opt){
    opt=opt||{};
    items=items.filter(n=>n&&n.id!==dest.id);
    if(!items.length) return;
    if(opt.trash){ moveToTrash(items); return; }
    if(dest.ro||FS.volumeOf(dest).ro){
      Alert.show({type:'stop',title:'Tracker',
        text:'The volume "'+FS.volumeOf(dest).name+'" is read-only.\n\n'+
             'You can\'t write to it. Copy the items somewhere else first.'});
      return;
    }
    const sys=items.filter(n=>!opt.copy&&(n.sys||n.ro));
    if(sys.length&&!opt.copy){
      Alert.show({type:'stop',title:'Tracker',
        text:'"'+sys[0].name+'" can\'t be moved.\n\nIt is part of the system or on a read-only volume.'});
      return;
    }
    let total=0;
    items.forEach(n=>FS.walk(n,x=>total+=(x.size||0)));
    const big = total>2*1024*1024 || items.length>6;
    const doIt=()=>{
      items.forEach(n=>{ if(opt.copy) FS.clone(n,dest); else FS.move(n,dest); });
      State.dirty(); refreshAll();
    };
    if(!big){ doIt(); Load.spike(0.35,400); return; }
    // simulate a long operation without blocking anything
    const sw=statusWindow(opt.copy?'Copying':'Moving',
      (opt.copy?'Copying ':'Moving ')+(items.length===1?'"'+items[0].name+'"':items.length+' items')+
      ' to "'+dest.name+'"');
    let done=0;
    const per=Math.max(1,Math.round(total/28));
    const iv=setInterval(()=>{
      done+=per*(0.6+rnd()*0.9);
      const f=Math.min(1,done/total);
      sw.set(f,U.size(Math.min(done,total))+' of '+U.size(total)+
        '  ('+Math.round(f*100)+'%)');
      Load.spike(0.5,180);
      if(f>=1){ clearInterval(iv); doIt(); setTimeout(()=>sw.close(),220); }
    },90);
  }
  function zipOMatic(sel,dir){
    const sw=statusWindow('ZipOMatic','Creating archive from '+
      (sel.length===1?'"'+sel[0].name+'"':sel.length+' items'));
    let f=0;
    const iv=setInterval(()=>{
      f+=0.06+rnd()*0.08;
      sw.set(Math.min(1,f),'deflating… '+Math.round(Math.min(1,f)*100)+'%');
      Load.spike(0.75,200);
      if(f>=1){
        clearInterval(iv);
        const name=(sel.length===1?sel[0].name:dir.name)+'.zip';
        let total=0; sel.forEach(n=>FS.walk(n,x=>total+=x.size||0));
        FS.add(dir,{name:FS.uniqueName(dir,name),type:'file',mime:'application/zip',
          icon:'expander',size:Math.round(total*0.42)+220,created:now(),mtime:now()});
        State.dirty(); refreshAll(); setTimeout(()=>sw.close(),200);
      }
    },110);
  }
  /* ---------- Get Info ---------- */
  function getInfo(n){
    const key='info:'+FS.path(n);
    const ex=WM.find(w=>w.infoKey===key)[0];
    if(ex){ ex.focus(); return ex; }
    const w=WM.open({title:n.name+' info',app:'Tracker',w:330,h:250,minw:280,minh:180,
      key:'ginfo'});
    w.infoKey=key;
    const c=w.pad(10);
    const top=U.div('row'); top.style.alignItems='flex-start'; top.style.gap='10px';
    const ic=U.div(); ic.style.cssText='width:32px;height:32px;flex:0 0 32px';
    ic.innerHTML=Icons.svg(FS.icon(n));
    const nm=U.div(); nm.style.flex='1 1 auto';
    const nmt=U.div(null,n.name); nmt.style.font='bold 11px var(--ui)';
    nm.appendChild(nmt);
    nm.appendChild(U.div('tick',FS.kindOf(n)));
    top.appendChild(ic); top.appendChild(nm);
    c.appendChild(top); c.appendChild(Ctl.hr());
    const g=U.div(); g.style.cssText='display:grid;grid-template-columns:78px 1fr;gap:3px 8px;font:10px var(--ui)';
    const rowk=(k,v,mono)=>{
      const a=U.div(null,k+':'); a.style.textAlign='right'; a.style.color='#444';
      const b=U.div('selectable',v); if(mono)b.style.fontFamily='var(--mono)';
      g.appendChild(a); g.appendChild(b);
    };
    if(n.type==='vol'){
      rowk('Capacity',U.size(n.capacity));
      rowk('Used',U.size(n.used)+'  ('+Math.round(n.used/n.capacity*100)+'%)');
      rowk('Free',U.size(n.capacity-n.used));
      rowk('Device',n.devname||'-',true);
      rowk('File system','bfs');
      rowk('Mounted at',FS.path(n),true);
      rowk('Read only',n.ro?'yes':'no');
      const bar=Ctl.progress(n.used/n.capacity); bar.style.gridColumn='1 / span 2'; bar.style.marginTop='4px';
      g.appendChild(bar);
    } else {
      let sz=n.size||0, cnt=0;
      if(n.kids){ sz=0; FS.walk(n,x=>{ if(x!==n){cnt++; sz+=x.size||0;} }); }
      rowk('Size',n.kids?U.size(sz)+' in '+cnt+' item'+(cnt===1?'':'s'):U.size(sz));
      rowk('Created',U.date(n.created));
      rowk('Modified',U.date(n.mtime));
      rowk('Location',FS.path(FS.get(n.parent)||n),true);
      rowk('MIME type',n.type==='dir'?MIME.DIR:n.mime,true);
      rowk('Permissions',FS.field(n,'perms'),true);
      rowk('Owner',FS.field(n,'owner'));
      if(n.linkTo) rowk('Link to',n.linkTo,true);
    }
    c.appendChild(g);
    const attrs=Object.keys(n.attrs||{}).filter(k=>n.attrs[k]!==''&&n.attrs[k]!=null);
    if(attrs.length){
      const bx=Ctl.box('Attributes');
      const ag=U.div(); ag.style.cssText='display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font:10px var(--mono)';
      attrs.forEach(k=>{
        const a=U.div(null,k); a.style.color='#335';
        const d=FS.colDef(k);
        let v=n.attrs[k];
        if(d.t==='time'&&typeof v==='number') v=U.date(v);
        const b=U.div('selectable',String(v));
        ag.appendChild(a); ag.appendChild(b);
      });
      bx.appendChild(ag); c.appendChild(bx);
    }
    c.style.overflow='auto';
    return w;
  }
  function fileType(n){
    const w=WM.open({title:'FileType: '+n.name,app:'Tracker',w:300,h:170,resizable:false});
    const c=w.pad(10);
    const mimeItems=Object.keys(MIME_NAMES).map(m=>({label:MIME_NAMES[m]+'  ('+m+')',value:m}));
    c.appendChild(Ctl.box('File Type',
      Ctl.field('Type:',Ctl.popup(mimeItems,n.mime,v=>{ n.mime=v; State.dirty(); refreshAll(); },{w:190}),40)));
    c.appendChild(Ctl.box('Preferred Application',
      Ctl.field('Signature:',Ctl.text('application/x-vnd.Be-'+
        (n.mime===MIME.TEXT?'StyledEdit':n.mime===MIME.PERSON?'People':'NPOS'),null,{w:170}),58)));
    const bs=U.div('row'); bs.style.marginTop='10px'; bs.style.justifyContent='flex-end';
    bs.appendChild(Ctl.button('Done',()=>w.close(),{def:true}));
    c.appendChild(bs);
  }
  /* ---------- queries ---------- */
  function openQueryNode(n){
    openQuery(n.pred,n.scope||'/boot',n.name,n);
  }
  function openQuery(pred,scope,title,node){
    const w=WM.open({title:title||('Query: '+FS.predString(pred)),app:'Tracker',
      w:520,h:280,key:'query:'+(title||FS.predString(pred))});
    const trk=U.div('trk'); w.content.appendChild(trk);
    const body=U.div('body'); const status=U.div('status');
    const st=U.el('span'); status.appendChild(st); w.statusEl=st;
    trk.appendChild(body); trk.appendChild(status);
    let results=[];
    const view=new ItemView(body,{items:()=>results,win:w,key:'query:'+(title||FS.predString(pred)),
      node:null});
    view.mode='list';
    if(view.cols.length<4) view.cols=['name','path','mtime','size'];
    w.view=view;
    const rerun=()=>{
      results=FS.runQuery(pred,scope);
      view.render();
      st.textContent=results.length+' item'+(results.length===1?'':'s')+
        ' — live query on '+(scope||'/')+'  ['+FS.predString(pred)+']';
    };
    view.node=null;
    w.setMenuBar([
      {label:'File',items:()=>[
        {label:'Open',disabled:!view.selection().length,fn:()=>view.selection().forEach(n=>launch(n,view))},
        {label:'Get Info',disabled:!view.selection().length,fn:()=>view.selection().forEach(getInfo)},
        {label:'Open Containing Folder',disabled:!view.selection().length,fn:()=>{
          const s=view.selection()[0]; if(s){ const p=FS.get(s.parent); if(p) openFolder(p); } }},
        {sep:true},
        {label:'Move to Trash',disabled:!view.selection().length,fn:()=>{
          moveToTrash(view.selection()); rerun(); }},
        {sep:true},
        {label:node?'Re-save Query':'Save Query…',fn:()=>{
          const dir=FS.byPath('/boot/home/queries');
          if(node){ node.pred=pred; node.scope=scope; }
          else FS.add(dir,{name:FS.uniqueName(dir,title||'New query'),type:'file',
            mime:MIME.QUERY,pred:pred,scope:scope,size:512});
          State.dirty(); refreshAll();
          Alert.show({type:'info',title:'Find',text:'Query saved in /boot/home/queries.\n\n'+
            'Double-click it any time — the results are always current.'});
        }},
        {label:'Refresh Now',fn:rerun},
        {sep:true},
        {label:'Close',sc:'Alt+W',fn:()=>w.close()}
      ]},
      {label:'Window',items:()=>windowMenuItems(view,w,FS.byPath(scope)||FS.get(FS.rootId))},
      {label:'Attributes',items:()=>attrMenuItems(view)}
    ]);
    rerun();
    const iv=setInterval(()=>{ if(!w.dead&&w.visible) rerun(); },4000);
    w.on('close',()=>clearInterval(iv));
    w.on('resize',()=>view.scroller&&view.scroller.update());
    w.el.tabIndex=0;
    w.el.addEventListener('keydown',e=>view.keydown(e));
    return w;
  }
  return {launch,openFolder,openQuery,openQueryNode,getInfo,newFolder,newFile,duplicate,
    moveToTrash,emptyTrash,transfer,refreshAll,fileMenu,viewMenu,fileMenuItems,windowMenuItems,
    statusWindow,recent,openWins,zipOMatic,fileType};
})();

/* ============================================================
   14. Desktop + workspaces + replicant shelf
   ============================================================ */
const Desk = (()=>{
  let view=null, ws=0, unmounted={};
  function desktopNode(){ return FS.byPath('/boot/home/Desktop'); }
  function init(){
    ws=State.prefs.workspaces.current||0;
    const host=document.getElementById('dsk-icons');
    view=new ItemView(host,{desktop:true,node:desktopNode(),key:'desktop',
      items:()=>{
        const vols=FS.kids(FS.get(FS.rootId)).filter(v=>!unmounted[v.name]);
        const dk=FS.kids(desktopNode()).filter(n=>n.type!=='trash');
        const tr=FS.trash();
        return vols.concat(dk).concat(tr?[tr]:[]);
      }});
    applyColor();

    const all=FS.kids(FS.get(FS.rootId));

          text:'You can\'t unmount the boot volume.\n\nIt is holding the floor up.'}); return; }
        unmounted[v.name]=true;
      }
      refresh(); Sound.click();
    }}));
    return items.concat([{sep:true},{label:'Mount all disks now',fn:()=>{ unmounted={}; refresh(); }},
      {label:'Settings',disabled:true}]);
  }
  function contextMenu(e){
    Menu.atEvent([
      {label:'New Folder',sc:'Alt+N',fn:()=>Tracker.newFolder(desktopNode(),view)},
      {sep:true},
      {label:'Icon View',marked:view.mode==='icon',fn:()=>view.setMode('icon')},
      {label:'Mini Icon View',marked:view.mode==='mini',fn:()=>view.setMode('mini')},
      {label:'List View',disabled:true},
      {sep:true},
      {label:'Clean Up',sc:'Alt+K',fn:()=>view.cleanUp()},
      {label:'Select All',sc:'Alt+A',fn:()=>view.selectAll()},
      {sep:true},
      {label:'Mount',sub:mountItems()},
      {label:'Add-Ons',sub:[
        {label:'Open Terminal',fn:()=>Apps.launch('Terminal',{cwd:'/boot/home'})},
        {label:'Backgrounds',fn:()=>Prefs.open('Backgrounds')}
      ]},
      {sep:true},
      {label:'Empty Trash',fn:()=>Tracker.emptyTrash()},
      {sep:true},
      {label:'Open Home Folder',fn:()=>Tracker.openFolder(FS.byPath('/boot/home'))},
      {label:'Backgrounds…',fn:()=>Prefs.open('Backgrounds')}

  }
  return {init,refresh,setWorkspace,applyColor,contextMenu,mountItems,placeAt,desktopNode,
    get ws(){return ws;}, get view(){return view;}};
})();

/* ============================================================
   15. Replicants — drag an app's handle onto the desktop shelf
   ============================================================ */
const Replicants = (()=>{
  const live=[];
  function layer(){ return document.getElementById('replicants'); }
  function add(kind,x,y,cfg,quiet){
    const el=U.div('replicant');
    el.style.left=x+'px'; el.style.top=y+'px';
    const h=U.div('rhandle');
    el.appendChild(h);
    if(!State.prefs.deskbar.showReplicants) el.classList.add('norep');
    const body=U.div(); body.style.cssText='position:relative';
    el.appendChild(body);
    layer().appendChild(el);
    const rep={el,kind,cfg:cfg||{},body,stop:null};
    const mk=Apps.replicantFactory[kind];
    if(!mk){ el.remove(); return null; }
    rep.stop=mk(body,rep.cfg);
    live.push(rep);
    h.addEventListener('pointerdown',e=>{
      U.stop(e);
      const sr=U.rect(layer());
      const ox=parseInt(el.style.left,10), oy=parseInt(el.style.top,10);
      const sx=e.clientX, sy=e.clientY;
      const mv=ev=>{ el.style.left=(ox+ev.clientX-sx)+'px'; el.style.top=(oy+ev.clientY-sy)+'px'; };
      const up=()=>{ document.removeEventListener('pointermove',mv);
        document.removeEventListener('pointerup',up); save(); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
    el.addEventListener('contextmenu',e=>{
      U.stop(e);
      Menu.atEvent([
        {label:'About '+kind+' Replicant…',fn:()=>Alert.show({type:'info',title:kind,
          text:kind+' replicant\n\nStill running, still its own thread, still living on\n'+
          'the Tracker\'s desktop shelf. Nothing was copied — this is\nthe same code the application runs.'})},
        {sep:true},
        {label:'Remove Replicant',fn:()=>remove(rep)}
      ],e);
    });
    if(!quiet) save();
    return rep;
  }
  function remove(rep){
    if(rep.stop) try{rep.stop();}catch(e){}
    rep.el.remove();
    const i=live.indexOf(rep); if(i>=0)live.splice(i,1);
    save();
  }
  function save(){
    State.s.replicants=live.map(r=>({kind:r.kind,x:parseInt(r.el.style.left,10),
      y:parseInt(r.el.style.top,10),cfg:r.cfg}));
    State.dirty();
  }
  function restore(){
    (State.s.replicants||[]).forEach(r=>add(r.kind,r.x,r.y,r.cfg,true));
  }
  function showHandles(v){
    live.forEach(r=>r.el.classList.toggle('norep',!v));
  }
  /* dragging a window's replicant handle onto the desktop */
  function dragOut(kind,e,cfg){
    const sr=U.rect(document.getElementById('replicants'));
    const ghost=U.div();
    ghost.style.cssText='position:absolute;pointer-events:none;opacity:.6;border:1px dotted #fff;'+
      'width:70px;height:50px;z-index:7100';
    document.getElementById('dragproxy').appendChild(ghost);
    const mv=ev=>{ ghost.style.left=(ev.clientX-sr.left-35)+'px'; ghost.style.top=(ev.clientY-sr.top-25)+'px'; };
    const up=ev=>{
      document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
      ghost.remove();
      const el=document.elementFromPoint(ev.clientX,ev.clientY);
      if(el&&(el.closest('#dsk-icons')||el.closest('#replicants')||el.id==='desktop')){
        add(kind,Math.round(ev.clientX-sr.left-30),Math.round(ev.clientY-sr.top-20),cfg);
        Sound.click();
      } else {
        Alert.show({type:'idea',title:'Replicant',
          text:'Drop the handle on the desktop.\n\nThe Tracker\'s desktop is the shelf that\n'+
               'accepts replicants.'});
      }
    };
    document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    mv(e);
  }
  function attachHandle(win,kind,cfgFn){
    const h=U.div('rhandle');
    win.frame.appendChild(h);
    win.repHandle=h;
    h.addEventListener('pointerdown',e=>{ U.stop(e); dragOut(kind,e,cfgFn?cfgFn():{}); });
    const sync=()=>h.style.display=State.prefs.deskbar.showReplicants?'':'none';
    sync(); win.on('focus',sync);
    return h;
  }
  return {add,remove,restore,showHandles,dragOut,attachHandle,live};
})();

/* ============================================================
   16. Simulated CPU load — what Pulse and the Deskbar react to
   ============================================================ */
const Load = (()=>{
  let base=[0.06,0.04];
  let spikes=[];
  const cpuOn=[true,true];
  function spike(amount,ms){ spikes.push({a:amount,until:now()+(ms||500)}); }
  function sustained(fn){ return fn; }
  function sample(i){
    if(!cpuOn[i]) return 0;
    const t=now()/1000;
    let v=base[i]+0.05*Math.sin(t*(1.7+i*0.4))+0.03*rnd();
    spikes=spikes.filter(s=>s.until>now());
    let extra=spikes.reduce((s,x)=>s+x.a,0);
    // work spreads across enabled CPUs, because it does
    const n=cpuOn.filter(Boolean).length||1;
    v += (extra+Anim.load())/n;
    return U.clamp(v,0.01,1);
  }
  return {spike,sample,cpuOn,sustained};
})();

/* animation registry: every live thing registers, one rAF drives them all */
const Anim = (()=>{
  const jobs=new Set();
  let running=false, last=0;
  function add(fn,cost){ const j={fn,cost:cost||0.12}; jobs.add(j); start(); return ()=>jobs.delete(j); }
  function load(){ let s=0; jobs.forEach(j=>s+=j.cost); return Math.min(0.9,s); }
  function start(){
    if(running) return; running=true;
    const tick=ts=>{
      const dt=Math.min(60,ts-last||16); last=ts;
      jobs.forEach(j=>{ try{ j.fn(dt,ts); }catch(e){} });
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  return {add,load,jobs};
})();
/* ============================================================
   17. Deskbar
   ============================================================ */
const Deskbar = (()=>{
  let el,logo,clockEl,tray,teamList,holdTimer=null;
  function init(){
    el=document.getElementById('deskbar');
    el.innerHTML='';
    const top=U.div('dbtop');
    logo=U.div('belogo');
    logo.innerHTML='<div style="width:18px;height:18px">'+Icons.svg('beos')+'</div>';
    clockEl=U.div('clock');
    top.appendChild(logo); top.appendChild(clockEl);
    el.appendChild(top);
    tray=U.div('tray'); el.appendChild(tray);
    teamList=U.div('dbteams'); el.appendChild(teamList);
    logo.addEventListener('pointerdown',e=>{ U.stop(e); openBeMenu(e); });
    clockEl.addEventListener('pointerdown',e=>{
      if(e.button===2) return;
      U.stop(e);
      holdTimer=setTimeout(()=>{ clockEl.dataset.long='1'; tick(); },260);
    });
    const relax=()=>{ clearTimeout(holdTimer); delete clockEl.dataset.long; tick(); };
    clockEl.addEventListener('pointerup',relax);
    clockEl.addEventListener('pointerleave',relax);
    clockEl.addEventListener('contextmenu',e=>{ U.stop(e); clockMenu(e); });
    el.addEventListener('contextmenu',e=>{
      if(e.target.closest('.clock')) return;
      U.stop(e); openBeMenu(e);
    });
    place();
    tick(); setInterval(tick,1000);
    refreshTeams();
  }
  function place(){
    if(!el) return;
    const loc=State.prefs.deskbar.location;
    el.style.left=el.style.right=el.style.top=el.style.bottom='auto';
    el.classList.toggle('mini',State.prefs.deskbar.mini);
    el.style.width=State.prefs.deskbar.mini?'auto':'130px';
    if(loc.indexOf('top')===0){ el.style.top='0'; } else { el.style.bottom='0'; }
    if(loc.indexOf('right')>0){ el.style.right='0'; el.style.borderRight='none'; el.style.borderLeft='1px solid #000'; }
    else { el.style.left='0'; el.style.borderLeft='none'; el.style.borderRight='1px solid #000'; }
  }
  function tick(){
    if(!State.prefs.deskbar.showClock){ clockEl.textContent=''; return; }
    const d=new Date();
    if(clockEl.dataset.long){
      clockEl.textContent=U.DAY[d.getDay()]+', '+U.MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
      clockEl.style.fontSize='9px';
      return;
    }
    clockEl.style.fontSize='';
    const p=State.prefs.deskbar;
    if(p.use24) clockEl.textContent=U.pad(d.getHours(),2)+':'+U.pad(d.getMinutes(),2)+
      (p.showSeconds?':'+U.pad(d.getSeconds(),2):'');
    else clockEl.textContent=U.time12(d,p.showSeconds);
  }
  function clockMenu(e){
    const p=State.prefs.deskbar;
    Menu.atEvent([
      {label:'24 Hour Clock',checked:p.use24,fn:()=>{p.use24=!p.use24;State.dirty();tick();}},
      {label:'Show Seconds',checked:p.showSeconds,fn:()=>{p.showSeconds=!p.showSeconds;State.dirty();tick();}},
      {sep:true},
      {label:'Hide Clock',fn:()=>{p.showClock=false;State.dirty();tick();}},
      {label:'Time Preferences…',fn:()=>Prefs.open('Time')}
    ],e);
  }
  function appMenu(dirPath,label){
    const dir=FS.byPath(dirPath);
    if(!dir) return [{label:'(empty)',disabled:true}];
    return FS.kids(dir).sort((a,b)=>a.name.localeCompare(b.name)).map(n=>{
      if(n.type==='dir') return {label:n.name,icon:'folder',sub:appMenu(FS.path(n))};
      return {label:n.name,icon:FS.icon(n),fn:()=>Tracker.launch(n)};
    });
  }
  function recentMenu(kind){
    const a=Tracker.recent[kind];
    if(!a.length) return [{label:'(none yet)',disabled:true}];
    return a.map(p=>{
      const n=FS.byPath(p);
      if(!n) return {label:p,disabled:true};
      return {label:n.name,icon:FS.icon(n),fn:()=>Tracker.launch(n)};
    });
  }
  function openBeMenu(e){
    logo.classList.add('open');
    const p=State.prefs.deskbar;
    const items=[
      {label:'About BeOS…',icon:'beos',fn:()=>Apps.about()},
      {sep:true},
      {label:'Find…',sc:'Alt+F',icon:'docquery',fn:()=>Find.open()},
      {label:'Show Replicants',checked:p.showReplicants,fn:()=>{
        p.showReplicants=!p.showReplicants; State.dirty();
        Replicants.showHandles(p.showReplicants);
        WM.all().forEach(w=>{ if(w.repHandle) w.repHandle.style.display=p.showReplicants?'':'none'; });
      }},
      {label:'Mount',icon:'volume',sub:Desk.mountItems()},
      {sep:true},
      {label:'Applications',icon:'folder',sub:appMenu('/boot/beos/apps')},
      {label:'Preferences',icon:'prefs',sub:appMenu('/boot/beos/preferences')},
      {label:'Demos',icon:'demo3d',sub:appMenu('/boot/apps')},
      {sep:true},
      {label:'Recent Documents',sub:recentMenu('docs')},
      {label:'Recent Folders',sub:recentMenu('folders')},
      {label:'Recent Applications',sub:recentMenu('apps')},
      {sep:true},
      {label:'Deskbar Preferences',sub:[
        {label:'Mini Mode',checked:p.mini,fn:()=>{p.mini=!p.mini;State.dirty();place();refreshTeams();}},
        {label:'Expand New Teams',checked:p.expandTeams,fn:()=>{p.expandTeams=!p.expandTeams;
          State.dirty();refreshTeams();}},
        {label:'Show Clock',checked:p.showClock,fn:()=>{p.showClock=!p.showClock;State.dirty();tick();}},
        {sep:true},
        {label:'Top Right',marked:p.location==='top-right',fn:()=>{p.location='top-right';State.dirty();place();}},
        {label:'Top Left',marked:p.location==='top-left',fn:()=>{p.location='top-left';State.dirty();place();}},
        {label:'Bottom Right',marked:p.location==='bottom-right',fn:()=>{p.location='bottom-right';State.dirty();place();}},
        {label:'Bottom Left',marked:p.location==='bottom-left',fn:()=>{p.location='bottom-left';State.dirty();place();}}
      ]},
      {label:'Workspaces',icon:'workspaces',sub:Array.from({length:State.prefs.workspaces.count},(_,i)=>({
        label:'Workspace '+(i+1),marked:Desk.ws===i,sc:'Alt+F'+(i+1),fn:()=>Desk.setWorkspace(i)}))
        .concat([{sep:true},{label:'Workspaces…',fn:()=>Apps.launch('Workspaces')}])},
      {sep:true},
      {label:'Restart',fn:()=>Power.restart()},
      {label:'Shut Down',fn:()=>Power.shutdown()}
    ];
    const r=U.rect(logo), sr=U.rect(document.getElementById('stage'));
    Menu.open(items,r.left-sr.left,r.bottom-sr.top,{onDone:()=>logo.classList.remove('open')});
  }
  function teams(){
    const map={};
    // Tracker and Deskbar are always running, because they are
    map['Tracker']={name:'Tracker',icon:'folder',wins:[],sys:true};
    map['Deskbar']={name:'Deskbar',icon:'beos',wins:[],sys:true};
    WM.all().forEach(w=>{
      const a=w.app||'Tracker';
      if(!map[a]) map[a]={name:a,icon:Apps.iconFor(a),wins:[]};
      map[a].wins.push(w);
    });
    Object.keys(Apps.instances).forEach(a=>{
      if(Apps.instances[a].length&&!map[a]) map[a]={name:a,icon:Apps.iconFor(a),wins:[]};
    });
    return Object.values(map);
  }
  let miniStops=[];
  function refreshTeams(){
    if(!tray) return;
    miniStops.forEach(f=>{ try{f();}catch(e){} }); miniStops=[];
    const list=teams();
    tray.innerHTML=''; teamList.innerHTML='';
    list.forEach(t=>{
      const ti=U.div('ti');
      if(t.name==='Pulse'&&Apps.instances.Pulse&&Apps.instances.Pulse.length){
        const mp=Apps.miniPulse();
        if(mp.stopAnim) miniStops.push(mp.stopAnim);
        ti.appendChild(mp);
      } else ti.innerHTML=Icons.svg(t.icon);
      ti.title=t.name;
      const focusedApp=WM.focused&&WM.focused.app;
      if(t.name===focusedApp) ti.classList.add('hilite');
      ti.addEventListener('pointerdown',e=>{ U.stop(e); teamMenu(e,t); });
      tray.appendChild(ti);
      if(State.prefs.deskbar.expandTeams&&!State.prefs.deskbar.mini){
        const row=U.div('row');
        row.style.cssText='gap:3px;padding:1px 3px;font:9px var(--ui);align-items:center';
        const ic=U.div(); ic.style.cssText='width:12px;height:12px;flex:0 0 12px';
        ic.innerHTML=Icons.svg(t.icon);
        row.appendChild(ic); row.appendChild(U.el('span',null,t.name));
        row.addEventListener('pointerdown',e=>{ U.stop(e); teamMenu(e,t); });
        teamList.appendChild(row);
        t.wins.forEach(w=>{
          const r2=U.div(null,'  '+w.title);
          r2.style.cssText='font:9px var(--ui);padding:0 3px 0 16px;overflow:hidden;'+
            'text-overflow:ellipsis;white-space:nowrap';
          if(w.minimized) r2.style.color='#888';
          r2.addEventListener('pointerdown',e=>{ U.stop(e); w.minimized?w.restore():w.focus(); });
          teamList.appendChild(r2);
        });
      }
    });
  }
  function teamMenu(e,t){
    const items=[];
    if(t.wins.length){
      t.wins.forEach(w=>items.push({label:(w.minimized?'○ ':'')+w.title,
        fn:()=>{ w.minimized?w.restore():w.focus(); }}));
      items.push({sep:true});
    }
    if(t.name==='Tracker'){
      items.push({label:'Open Home Folder',fn:()=>Tracker.openFolder(FS.byPath('/boot/home'))});
      items.push({label:'Empty Trash',fn:()=>Tracker.emptyTrash()});
      items.push({sep:true});
    }
    items.push({label:'About '+t.name+'…',fn:()=>Apps.aboutApp(t.name)});
    items.push({label:'Quit',disabled:t.sys,fn:()=>{
      if(t.sys) return;
      t.wins.slice().forEach(w=>w.close());
      const inst=Apps.instances[t.name];
      if(inst) inst.length=0;
      refreshTeams();
    }});
    Menu.atEvent(items,e);
  }
  return {init,refreshTeams,place,tick,teams};
})();

    tracker:'<svg viewBox="0 0 44 44"><path d="M6 14 L18 14 L21 10 L38 10 L38 34 L6 34 Z" fill="#c8b273" stroke="#f0e6c8" stroke-width="2"/>'+
      '<path d="M6 14 L18 14 L21 10 L38 10 L38 15 L6 15 Z" fill="#e0cd9a"/></svg>'
  };
  let skipped=false, done=false, onDone=null;

  function logo(){
    return '<svg viewBox="0 0 240 96" width="240" height="96">'+
      '<rect x="2" y="2" width="86" height="86" fill="#ffcb00"/>'+
      '<text x="45" y="66" font-family="Verdana,sans-serif" font-size="52" font-weight="bold" '+
      'fill="#20344c" text-anchor="middle">Be</text>'+
      '<text x="100" y="46" font-family="Verdana,sans-serif" font-size="27" font-weight="bold" fill="#f0f4f8">OS</text>'+
      '<text x="100" y="70" font-family="Verdana,sans-serif" font-size="13" fill="#8fa8c0">'+
      SYS.version+'  '+SYS.build+'</text></svg>';
  }
  function run(cb){
    onDone=cb;
    const bios=document.getElementById('bios');
    const boot=document.getElementById('bootscreen');
    bios.style.display='';
    let li=0, txt='';
    document.addEventListener('keydown',skipKey,true);
    const step=()=>{
      if(skipped||done) return;
      if(li<BIOS.length){
        txt+=BIOS[li]+'\n'; li++;
        bios.innerHTML=U.esc(txt)+'<span class="cur"> </span>';
        setTimeout(step, li<6?90:(BIOS[li-1]===''?30:70));
      } else {
        bios.classList.add('fadeout');
        setTimeout(()=>{ bios.style.display='none'; bios.classList.remove('fadeout'); bootScreen(); },380);
      }
    };
    setTimeout(step,220);
  }
  function bootScreen(){
    if(skipped||done) return;
    const boot=document.getElementById('bootscreen');
    boot.style.display='';
    boot.innerHTML='';
    const lg=U.div('logo'); lg.innerHTML=logo(); boot.appendChild(lg);
    const row=U.div('icons');
    const els=STAGES.map(s=>{ const d=U.div('bi'); d.innerHTML=GLYPH[s.icon]; row.appendChild(d); return d; });
    boot.appendChild(row);
    const msg=U.div('bmsg'); boot.appendChild(msg);
    const skip=U.div('skip','ESC to skip'); boot.appendChild(skip);
    if(State.prefs.sounds.events.startup) setTimeout(()=>Sound.startup(),240);
    let i=0;
    const step=()=>{
      if(skipped||done) return;
      if(i<els.length){
        els[i].classList.add('on');
        msg.textContent=STAGES[i].msg;
        i++;
        setTimeout(step,rint(190,340));
      } else {
        msg.textContent='';
        setTimeout(()=>{
          boot.classList.add('fadeout');
          setTimeout(()=>{ boot.style.display='none'; boot.classList.remove('fadeout'); finish(); },420);
        },320);
      }
    };
    setTimeout(step,420);
  }
  function skipKey(e){
    if(e.key==='Escape'&&!done){ U.stop(e); skipped=true; skip(); }
  }
  function skip(){
    document.getElementById('bios').style.display='none';
    document.getElementById('bootscreen').style.display='none';
    finish();
  }
  function finish(){
    if(done) return; done=true;
    document.removeEventListener('keydown',skipKey,true);
    const d=document.getElementById('desktop');
    d.style.display=''; d.classList.add('fadein');
    setTimeout(()=>d.classList.remove('fadein'),400);
    if(onDone) onDone();
  }
  return {run,logo};
})();

const Apps = (()=>{
  const registry={}, instances={}, replicantFactory={};
  function define(name,def){ registry[name]=def; instances[name]=instances[name]||[]; }
  function iconFor(name){
    if(registry[name]&&registry[name].icon) return registry[name].icon;
    const n=FS.byPath('/boot/beos/apps/'+name)||FS.byPath('/boot/apps/'+name);
    if(n) return FS.icon(n);
    return 'app';
  }
  function launch(name,opts){
    opts=opts||{};
    const def=registry[name];
    if(!def){ Alert.show({type:'stop',title:'Tracker',text:'Application "'+name+'" not found.'}); return; }
    instances[name]=instances[name]||[];
    if(def.singleton&&instances[name].length){
      const inst=instances[name][0];
      if(inst.win){ if(inst.win.minimized) inst.win.restore(); else inst.win.focus(); }
      if(inst.reopen) inst.reopen(opts);
      return inst;
    }
    const seq=instances[name].length+1;
    const title=def.title?def.title(opts,seq):(name+(def.numbered&&seq>1?' '+seq:''));
    const win=WM.open(Object.assign({title,app:name,icon:def.icon,
      w:def.w||360,h:def.h||240,minw:def.minw,minh:def.minh,
      resizable:def.resizable!==false,zoomable:def.zoomable!==false,
      key:def.singleton?('app:'+name):('app:'+name+':'+(seq>1?seq:''))},def.winOpts||{}));
    const inst={name,win,opts};
    instances[name].push(inst);
    win.on('close',()=>{
      const i=instances[name].indexOf(inst); if(i>=0)instances[name].splice(i,1);
      if(inst.destroy) try{inst.destroy();}catch(e){}
      Deskbar.refreshTeams();
    });
    try{ def.make(win,inst,opts); }catch(e){ console.error(e);
      Alert.show({type:'stop',title:name,text:'The application "'+name+'" crashed while starting.\n\n'+
        String(e.message||e)}); }

    idt.innerHTML='Version '+SYS.version+' '+SYS.build+'<br>'+

  function credits(){

  function aboutApp(name){
    const blurbs={
      Tracker:'Tracker\n\nThe file manager, the desktop, and the reason your\nwindows remember where they were.',
      Deskbar:'Deskbar\n\nEvery team you are running, one click away.\nDrag it to any corner. It will stay there.',
      Terminal:'Terminal\n\nA window onto the shell. Try  listattr  on a\nPerson file and see what the file system knows.',
      NetPositive:'NetPositive\n\nA web browser with opinions about tables and a\nweakness for haiku.',
      Pulse:'Pulse\n\nTwo CPUs, drawn honestly. Turning them off is\nyour business, but read the alert first.',
      StyledEdit:'StyledEdit\n\nText, with styles, saved as attributes on the file\nrather than markup inside it.',
      People:'People\n\nEvery field you type becomes an attribute you can\nquery. The address book IS the database.',

    };
