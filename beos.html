<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeOS R5</title>
<style>
/* ===========================================================
   BeOS R5 Simulation — stylesheet
   Palette notes:
     panel  216,216,216   window tab 255,203,0   desktop 51,102,152
   All bevels are 1px, flat, no shadows, no radii. 1999 forever.
   =========================================================== */
:root{
  --panel:#d8d8d8;
  --panel-hi:#ffffff;
  --panel-lo:#9a9a9a;
  --panel-lo2:#666666;
  --panel-dark:#c0c0c0;
  --tab:#ffcb00;
  --tab-lo:#c19a00;
  --tab-hi:#ffe680;
  --tab-inactive:#d8d8d8;
  --desk:#336698;
  --sel:#336698;
  --sel-fg:#ffffff;
  --menu:#d8d8d8;
  --doc:#ffffff;
  --ui: Verdana, Geneva, "DejaVu Sans", "Bitstream Vera Sans", sans-serif;
  --mono: "Menlo", "DejaVu Sans Mono", "Consolas", "Courier New", monospace;
  --fs:11px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{
  font:var(--fs)/1.25 var(--ui);
  color:#000;
  -webkit-font-smoothing:none;
  font-smooth:never;
  cursor:default;
  user-select:none;
  -webkit-user-select:none;
}
img,svg{display:block}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- screen ---------- */
#screen{
  position:fixed;inset:0;overflow:hidden;background:#000;
}
#stage{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:1024px;height:768px;overflow:hidden;background:var(--desk);
}
#stage.fill{left:0;top:0;transform:none;width:100%;height:100%}

/* ---------- bevel helpers ---------- */
.bev-out{border:1px solid;border-color:var(--panel-hi) var(--panel-lo) var(--panel-lo) var(--panel-hi)}
.bev-in{border:1px solid;border-color:var(--panel-lo) var(--panel-hi) var(--panel-hi) var(--panel-lo)}
.bev-out2{border:2px solid;border-color:var(--panel-hi) var(--panel-lo2) var(--panel-lo2) var(--panel-hi)}

/* ---------- BIOS / boot ---------- */
#bios{
  position:absolute;inset:0;background:#000;color:#c8c8c8;
  font:12px/1.35 var(--mono);padding:10px 12px;white-space:pre-wrap;z-index:9000;
}
#bios b{color:#fff;font-weight:normal}
#bios .cur{background:#c8c8c8;color:#000}

#bootscreen{
  position:absolute;inset:0;background:#000;z-index:8900;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
}
#bootscreen .logo{margin-bottom:26px}
#bootscreen .icons{display:flex;gap:14px}
#bootscreen .bi{width:44px;height:44px;opacity:.16;transition:opacity .1s linear}
#bootscreen .bi.on{opacity:1}
#bootscreen .bmsg{
  margin-top:22px;color:#9fb6cf;font:10px var(--ui);height:14px;letter-spacing:.5px
}
#bootscreen .skip{position:absolute;bottom:10px;right:12px;color:#3a4a5a;font:9px var(--ui)}
.fadeout{animation:fadeout .45s ease forwards}
@keyframes fadeout{to{opacity:0}}
.fadein{animation:fadein .35s ease forwards}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- desktop ---------- */
#desktop{position:absolute;inset:0;overflow:hidden}
#dsk-icons,#replicants,#windows,#dragproxy{position:absolute;inset:0}
#windows,#replicants{pointer-events:none}
#windows>.win,#replicants>.replicant{pointer-events:auto}
#dragproxy{pointer-events:none;z-index:7000}

/* desktop icons */
.dicon{
  position:absolute;width:76px;text-align:center;padding:2px 0 0;
  cursor:default;
}
.dicon .ic{margin:0 auto;width:32px;height:32px}
.dicon .lb{
  display:inline-block;max-width:74px;margin-top:1px;padding:0 2px;
  font:10px var(--ui);color:#fff;
  text-shadow:1px 1px 0 rgba(0,0,0,.75);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dicon.sel .lb{background:var(--sel);color:#fff;text-shadow:none;outline:1px solid #fff}
.dicon.sel .ic{filter:brightness(.82) saturate(1.3)}
.dicon.ghost{opacity:.45}

/* ---------- window ---------- */
.win{
  position:absolute;display:flex;flex-direction:column;
  background:var(--panel);
}
.win .tabrow{height:19px;position:relative}
.wtab{
  position:absolute;top:0;height:19px;display:flex;align-items:center;
  background:var(--tab);
  border:1px solid #000;border-bottom:none;
  padding:0 5px 0 4px;gap:4px;overflow:hidden;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.55);
}
.win.inactive .wtab{background:var(--tab-inactive);box-shadow:inset 1px 1px 0 #fff}
.win.inactive .wtab .wtitle{color:#4c4c4c}
.wtab .wtitle{
  font:bold 10px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:clip;
  flex:1 1 auto;padding-top:1px;letter-spacing:.2px
}
.wbox{width:11px;height:11px;flex:0 0 auto;background:var(--tab);
  border:1px solid #000;box-shadow:inset 1px 1px 0 #ffe680, inset -1px -1px 0 #a37f00}
.win.inactive .wbox{background:#cfcfcf;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #909090}
.wbox:active{box-shadow:inset 1px 1px 0 #a37f00, inset -1px -1px 0 #ffe680}
.wbox.zoom{width:13px;height:13px;position:relative}
.wbox.zoom::after{
  content:"";position:absolute;left:1px;top:1px;width:6px;height:6px;
  border:1px solid #000;background:transparent
}
.win .frame{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  border:1px solid #000;background:var(--panel);position:relative;
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 var(--panel-lo);
}
.win .content{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.win.zoomed{}
.rsz{
  position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;z-index:6;
}
.rsz svg{position:absolute;inset:0}
.win .rsz-e{position:absolute;right:-2px;top:0;bottom:14px;width:5px;cursor:ew-resize}
.win .rsz-s{position:absolute;left:0;right:14px;bottom:-2px;height:5px;cursor:ns-resize}
.win .rsz-w{position:absolute;left:-2px;top:0;bottom:0;width:5px;cursor:ew-resize}
.win .rsz-n{position:absolute;left:0;right:0;top:-2px;height:4px;cursor:ns-resize}
.win.nores .rsz,.win.nores .rsz-e,.win.nores .rsz-s,.win.nores .rsz-w,.win.nores .rsz-n{display:none}
.dragoutline{position:absolute;border:1px dotted #fff;pointer-events:none;z-index:6999;mix-blend-mode:difference}

/* ---------- menus ---------- */
.menubar{
  display:flex;height:17px;background:var(--panel);flex:0 0 auto;
  border-bottom:1px solid var(--panel-lo);align-items:stretch;
}
.menubar>.mb{padding:2px 7px 0;font:10px var(--ui);white-space:nowrap}
.menubar>.mb.open{background:var(--sel);color:#fff}
.bemenu{
  position:absolute;z-index:8000;background:var(--menu);
  border:1px solid #000;padding:1px 0;min-width:90px;
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 var(--panel-lo);
}
.bemenu .mi{
  padding:2px 18px 2px 16px;font:10px var(--ui);white-space:nowrap;
  display:flex;align-items:center;gap:10px;position:relative
}
.bemenu .mi .sc{margin-left:auto;color:#555;font:10px var(--mono)}
.bemenu .mi.hot{background:var(--sel);color:#fff}
.bemenu .mi.hot .sc{color:#dbe6f2}
.bemenu .mi.dis{color:#999}
.bemenu .mi.dis.hot{background:transparent;color:#999}
.bemenu .sep{height:1px;background:var(--panel-lo);margin:2px 1px;border-bottom:1px solid #fff}
.bemenu .mi .mk{position:absolute;left:4px;top:2px;font:10px var(--ui)}
.bemenu .mi .sub{margin-left:auto;padding-left:12px}
.bemenu .mi .ico{width:16px;height:16px;margin:-2px 0 -2px -12px}
.bemenu.icons .mi{padding-left:24px}
.bemenu.icons .mi .ico{position:absolute;left:4px;top:1px;margin:0}

/* ---------- controls ---------- */
.bebtn{
  min-width:62px;height:20px;padding:0 10px;background:var(--panel);
  border:1px solid var(--panel-lo2);
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 var(--panel-lo);
  font:10px var(--ui);text-align:center;line-height:18px;white-space:nowrap
}
.bebtn:active,.bebtn.down{box-shadow:inset 1px 1px 0 var(--panel-lo),inset -1px -1px 0 #fff;background:#cfcfcf}
.bebtn[disabled],.bebtn.dis{color:#999;box-shadow:inset 1px 1px 0 #fff}
.bebtn.def{outline:1px solid #000;outline-offset:2px}
.bebtn.sm{min-width:0;height:17px;line-height:15px;padding:0 6px}
.becheck,.beradio{display:flex;align-items:center;gap:5px;font:10px var(--ui);padding:1px 0}
.becheck .bx{
  width:11px;height:11px;flex:0 0 auto;background:#fff;border:1px solid var(--panel-lo2);
  box-shadow:inset 1px 1px 0 var(--panel-lo);position:relative
}
.becheck.on .bx::after{
  content:"";position:absolute;left:1px;top:1px;right:1px;bottom:1px;background:#20344c
}
.beradio .rd{
  width:11px;height:11px;flex:0 0 auto;border-radius:50%;background:#fff;
  border:1px solid var(--panel-lo2);box-shadow:inset 1px 1px 0 var(--panel-lo);position:relative
}
.beradio.on .rd::after{
  content:"";position:absolute;left:2px;top:2px;width:5px;height:5px;border-radius:50%;background:#20344c
}
.bepop{
  height:19px;min-width:80px;display:inline-flex;align-items:center;gap:6px;
  background:var(--panel);border:1px solid var(--panel-lo2);
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 var(--panel-lo);
  padding:0 3px 0 7px;font:10px var(--ui);white-space:nowrap
}
.bepop .val{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
.bepop .mk{
  width:11px;height:11px;flex:0 0 auto;background:var(--panel);
  border:1px solid var(--panel-lo2);box-shadow:inset 1px 1px 0 #fff;
  display:flex;align-items:center;justify-content:center
}
.bepop .mk::after{content:"";border:3px solid transparent;border-top-color:#333;margin-top:2px}
.betext{
  height:19px;background:#fff;border:1px solid var(--panel-lo2);
  box-shadow:inset 1px 1px 0 var(--panel-lo);padding:0 3px;font:10px var(--ui);
  user-select:text;-webkit-user-select:text;outline:none;width:100%
}
.betext:focus{border-color:#20344c}
textarea.betext{height:auto;line-height:1.3;padding:2px 3px;resize:none}
.belabel{font:10px var(--ui)}
.bebox{
  border:1px solid var(--panel-lo);box-shadow:1px 1px 0 #fff inset,-1px -1px 0 var(--panel-lo) inset;
  margin:8px 0 0;padding:9px 8px 8px;position:relative
}
.bebox>.cap{position:absolute;left:6px;top:-6px;background:var(--panel);padding:0 3px;font:bold 10px var(--ui)}
.hr{height:1px;background:var(--panel-lo);border-bottom:1px solid #fff;margin:6px 0}
.beslider{height:18px;position:relative;flex:1 1 auto}
.beslider .tr{position:absolute;left:0;right:0;top:8px;height:3px;background:#b0b0b0;
  border:1px solid var(--panel-lo2);box-shadow:inset 0 1px 0 #8f8f8f}
.beslider .th{
  position:absolute;top:2px;width:9px;height:15px;background:var(--panel);
  border:1px solid var(--panel-lo2);box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 var(--panel-lo)
}
.progress{height:14px;background:#fff;border:1px solid var(--panel-lo2);
  box-shadow:inset 1px 1px 0 var(--panel-lo);position:relative;overflow:hidden}
.progress>i{position:absolute;inset:0 auto 0 0;background:#5478a8;
  box-shadow:inset 0 1px 0 #7c9cc6, inset 0 -1px 0 #3d5c85}

/* ---------- custom BeOS scrollbars ---------- */
.scfr{position:absolute;inset:0;display:grid;grid-template-columns:1fr 14px;grid-template-rows:1fr 14px}
.scfr.novs{grid-template-columns:1fr 0}
.scfr.nohs{grid-template-rows:1fr 0}
.scvp{grid-column:1;grid-row:1;overflow:hidden;position:relative;background:var(--doc)}
.scvp>.scct{position:absolute;left:0;top:0;min-width:100%}
.scbar{background:#cfcfcf;position:relative;border:1px solid var(--panel-lo2);
  box-shadow:inset 1px 1px 0 #fff}
.scbar.v{grid-column:2;grid-row:1;border-left:1px solid var(--panel-lo2)}
.scbar.h{grid-column:1;grid-row:2}
.scfr>.corner{grid-column:2;grid-row:2;background:var(--panel)}
.scar{position:absolute;width:12px;height:12px;background:var(--panel);
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 var(--panel-lo);
  display:flex;align-items:center;justify-content:center}
.scar:active{box-shadow:inset 1px 1px 0 var(--panel-lo), inset -1px -1px 0 #fff}
.scar i{border:3px solid transparent;display:block}
.scar.up i{border-bottom-color:#333;margin-bottom:2px}
.scar.dn i{border-top-color:#333;margin-top:2px}
.scar.lf i{border-right-color:#333;margin-right:2px}
.scar.rt i{border-left-color:#333;margin-left:2px}
.scth{position:absolute;background:var(--panel);
  border:1px solid var(--panel-lo2);
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 var(--panel-lo);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.scth .kn{width:5px;height:5px;background:
  radial-gradient(circle at 1px 1px,#8a8a8a 1px,transparent 1px) 0 0/2px 2px;
  opacity:.9}
.scth.v .kn{width:6px;height:14px}
.scth.h .kn{width:14px;height:6px}
.nokn .scth .kn{display:none}

/* ---------- tracker ---------- */
.trk{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel)}
.trk .body{flex:1 1 auto;min-height:0;position:relative}
.iconview{position:absolute;inset:0;background:var(--doc);overflow:hidden}
.iview-ct{position:absolute;left:0;top:0;width:100%;height:100%}
.ficon{position:absolute;width:74px;text-align:center;padding-top:3px}
.ficon .ic{margin:0 auto;width:32px;height:32px}
.ficon .lb{display:inline-block;max-width:72px;padding:0 2px;font:10px var(--ui);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficon.sel .lb{background:var(--sel);color:#fff}
.ficon.sel .ic{filter:brightness(.82) saturate(1.3)}
.ficon.mini{width:150px;height:16px;display:flex;align-items:center;gap:4px;text-align:left;padding:0 2px}
.ficon.mini .ic{width:16px;height:16px;margin:0}
.ficon.ghost{opacity:.4}
.lbl-edit{position:absolute;z-index:50}
.lbl-edit input{font:10px var(--ui);border:1px solid #000;background:#fff;padding:0 1px;
  user-select:text;-webkit-user-select:text;outline:none}

.lv{position:absolute;inset:0;background:var(--doc);display:flex;flex-direction:column}
.lv .hd{display:flex;height:17px;background:var(--panel);flex:0 0 auto;
  border-bottom:1px solid var(--panel-lo2);position:relative;overflow:hidden}
.lv .hd .col{
  position:relative;padding:2px 4px 0;font:bold 10px var(--ui);
  border-right:1px solid var(--panel-lo);overflow:hidden;white-space:nowrap;
  box-shadow:inset 1px 1px 0 #fff}
.lv .hd .col .ar{position:absolute;right:3px;top:5px;border:3px solid transparent}
.lv .hd .col.asc .ar{border-bottom-color:#333;margin-top:-2px}
.lv .hd .col.desc .ar{border-top-color:#333}
.lv .hd .col .grab{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:3}
.lv .rows{flex:1 1 auto;min-height:0;position:relative}
.lvrow{display:flex;height:16px;align-items:center;white-space:nowrap}
.lvrow>.c{padding:0 4px;overflow:hidden;text-overflow:ellipsis;font:10px var(--ui);flex:0 0 auto}
.lvrow>.c.n{display:flex;align-items:center;gap:4px}
.lvrow>.c.n .ic{width:16px;height:16px;flex:0 0 auto}
.lvrow.sel{background:var(--sel);color:#fff}
.lvrow.alt{background:#f2f4f7}
.lvrow.sel.alt{background:var(--sel)}
.lvrow.ghost{opacity:.45}
.dropinto{outline:2px solid #000;outline-offset:-2px}

.trk .status{
  height:15px;flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:0 4px;font:9px var(--ui);border-top:1px solid var(--panel-lo);color:#333}

/* ---------- deskbar ---------- */
#deskbar{
  position:absolute;right:0;top:0;z-index:6000;background:var(--panel);
  border:1px solid #000;border-top:none;border-right:none;
  box-shadow:inset 1px 1px 0 #fff;
  display:flex;flex-direction:column;width:130px
}
#deskbar .dbtop{display:flex;align-items:stretch;height:22px;border-bottom:1px solid var(--panel-lo)}
#deskbar .belogo{width:26px;display:flex;align-items:center;justify-content:center}
#deskbar .belogo.open{background:var(--sel)}
#deskbar .clock{flex:1 1 auto;display:flex;align-items:center;justify-content:flex-end;
  padding-right:5px;font:10px var(--ui)}
#deskbar .tray{display:flex;flex-wrap:wrap;gap:2px;padding:3px;min-height:22px;align-content:flex-start}
#deskbar .tray .ti{width:16px;height:16px;position:relative}
#deskbar .tray .ti.hilite{outline:1px dotted #333}
#deskbar.mini{width:auto}
#deskbar .dbteams{border-top:1px solid #fff}

/* ---------- terminal ---------- */
.term{position:absolute;inset:0;background:#000;color:#e8e8e8;
  font:12px/1.28 var(--mono);padding:2px 4px;overflow:hidden;
  user-select:text;-webkit-user-select:text;white-space:pre-wrap;word-break:break-word}
.term.lightbg{background:#ffffff;color:#000}
.term .cur{background:#e8e8e8;color:#000;animation:blink 1.1s steps(1,end) infinite}
.term.lightbg .cur{background:#000;color:#fff}
@keyframes blink{50%{opacity:0}}
.term b{color:#fff;font-weight:normal}
.term .g{color:#7fdc7f}.term .y{color:#e8d060}.term .r{color:#ff8c78}
.term .c{color:#7fd8e8}.term .m{color:#d9a0ff}.term .dim{color:#9a9a9a}

/* ---------- misc app bits ---------- */
.pad{padding:8px}
.row{display:flex;align-items:center;gap:6px}
.col{display:flex;flex-direction:column;gap:5px}
.grow{flex:1 1 auto;min-width:0}
.right{margin-left:auto}
.doc{position:absolute;inset:0;background:#fff}
.styled{
  position:absolute;inset:0;background:#fff;padding:3px 5px;font:12px/1.35 var(--ui);
  overflow:auto;user-select:text;-webkit-user-select:text;outline:none;white-space:pre-wrap
}
.alertwin .txt{font:10px/1.45 var(--ui);user-select:text;-webkit-user-select:text}
.alertwin .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.alertico{width:32px;height:32px;flex:0 0 auto}

.np-page{position:absolute;inset:0;background:#fff;overflow:hidden}
.np-body{padding:12px 16px;font:12px/1.5 "Times New Roman",Times,serif;color:#000;
  user-select:text;-webkit-user-select:text}
.np-body h1{font:bold 22px "Times New Roman",serif;margin:2px 0 8px}
.np-body h2{font:bold 16px "Times New Roman",serif;margin:14px 0 5px}
.np-body h3{font:bold 13px "Times New Roman",serif;margin:12px 0 4px}
.np-body p{margin:7px 0}
.np-body ul,.np-body ol{margin:7px 0 7px 26px}
.np-body li{margin:2px 0}
.np-body a{color:#0000cc;text-decoration:underline;cursor:pointer}
.np-body a:visited{color:#551a8b}
.np-body hr{border:none;border-top:1px solid #999;margin:12px 0}
.np-body pre{font:11px var(--mono);background:#eee;padding:6px;border:1px solid #ccc;overflow-x:auto}
.np-body table{border-collapse:collapse;margin:8px 0}
.np-body td,.np-body th{border:1px solid #999;padding:3px 6px;font-size:12px}
.np-body .haiku{font:italic 15px/1.75 "Times New Roman",serif;margin:16px 0 16px 24px;color:#333}
.np-body blockquote{margin:8px 0 8px 22px;color:#333}
.np-body .ctr{text-align:center}
.np-body .sm{font-size:10px;color:#555}
.np-bar{display:flex;align-items:center;gap:4px;padding:3px;background:var(--panel);
  border-bottom:1px solid var(--panel-lo)}
.np-url{flex:1 1 auto}
.np-stat{height:15px;font:9px var(--ui);padding:1px 4px;border-top:1px solid var(--panel-lo);
  background:var(--panel);display:flex;align-items:center;gap:6px}

.pulse-cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.pulse-bar{width:26px;height:66px;background:#000;border:1px solid var(--panel-lo2);
  box-shadow:inset 1px 1px 0 var(--panel-lo);position:relative;overflow:hidden}
.pulse-bar>i{position:absolute;left:0;right:0;bottom:0;background:#4ba64b;
  background-image:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.55) 2px 3px)}
.cpu-btn{width:26px;font:9px var(--ui);text-align:center;padding:1px 0;background:var(--panel);
  border:1px solid var(--panel-lo2);box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 var(--panel-lo)}
.cpu-btn.off{box-shadow:inset 1px 1px 0 var(--panel-lo),inset -1px -1px 0 #fff;background:#c6c6c6;color:#777}
.mini-pulse{display:flex;gap:1px;align-items:flex-end;height:16px;width:16px;background:#000;
  border:1px solid #555;padding:1px}
.mini-pulse i{flex:1 1 auto;background:#4ba64b;align-self:flex-end}

.replicant{position:absolute;z-index:5;}
.replicant .rhandle{
  position:absolute;left:-1px;top:-1px;width:9px;height:9px;background:var(--panel);
  border:1px solid #000;cursor:move;z-index:3;
  background-image:radial-gradient(circle at 1px 1px,#666 .5px,transparent .5px);
  background-size:2px 2px}
.replicant.norep .rhandle{display:none}
.win .rhandle{position:absolute;left:1px;bottom:1px;width:9px;height:9px;background:var(--panel);
  border:1px solid #000;cursor:move;z-index:7;
  background-image:radial-gradient(circle at 1px 1px,#666 .5px,transparent .5px);background-size:2px 2px}

#shutdown{position:absolute;inset:0;z-index:9500;background:#000;color:#d8d8d8;
  font:13px/1.6 var(--mono);padding:14px;display:none;white-space:pre-wrap}
#shutdown.safe{display:flex;align-items:center;justify-content:center;text-align:center;
  font:16px var(--ui);color:#fff;background:#000;flex-direction:column;gap:14px}
#kdl{position:absolute;inset:0;z-index:9600;background:#0000a8;color:#fff;
  font:13px/1.35 var(--mono);padding:10px;display:none;white-space:pre-wrap;
  user-select:text;-webkit-user-select:text}
#kdl .cur{background:#fff;color:#0000a8}

#screensaver{position:absolute;inset:0;z-index:9400;background:#000;display:none}
#screensaver canvas{position:absolute;inset:0}

.credits{position:absolute;inset:0;overflow:hidden;background:#000}
.credits .rollin{position:absolute;left:0;right:0;color:#fff;text-align:center;
  font:11px/1.7 var(--ui)}
.credits .rollin b{color:var(--tab)}

.magbox{position:absolute;inset:0;background:#000}
.hexview{position:absolute;inset:0;background:#fff;font:11px/1.3 var(--mono);
  overflow:hidden;user-select:text;-webkit-user-select:text}
.hexview .hl{display:flex;gap:10px;padding:0 4px}
.hexview .off{color:#777}
.hexview .as{color:#0b3}
.iom-canvas{background:
  conic-gradient(#c8c8c8 25%,#f0f0f0 0 50%,#c8c8c8 0 75%,#f0f0f0 0) 0 0/12px 12px;
  border:1px solid var(--panel-lo2)}

.tick{font:9px var(--ui);color:#444}
.mono{font-family:var(--mono)}
.nosel{user-select:none;-webkit-user-select:none}
.selectable{user-select:text;-webkit-user-select:text}
.dimtext{color:#666}
.center{display:flex;align-items:center;justify-content:center}
.fill{position:absolute;inset:0}
.scrollpane{position:absolute;inset:0;overflow:auto}
.cdlcd{width:100%;background:#0b1a0b;color:#7fe87f;font:11px var(--mono);
  border:1px solid var(--panel-lo2);box-shadow:inset 1px 1px 0 var(--panel-lo);padding:3px 5px}
.transport{display:flex;gap:3px}
.transport .tb{width:24px;height:20px;display:flex;align-items:center;justify-content:center}
.vu{height:8px;background:#000;border:1px solid var(--panel-lo2);position:relative;overflow:hidden}
.vu>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4ba64b,#d8d84b 70%,#d84b4b)}
</style>
</head>
<body>
<div id="screen">
  <div id="stage">
    <div id="desktop" style="display:none">
      <div id="dsk-icons"></div>
      <div id="replicants"></div>
      <div id="windows"></div>
      <div id="deskbar"></div>
    </div>
    <div id="screensaver"></div>
    <div id="bootscreen" style="display:none"></div>
    <div id="bios"></div>
    <div id="shutdown"></div>
    <div id="kdl"></div>
    <div id="dragproxy"></div>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   0. Utilities
   ============================================================ */
const U = {
  el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls;
    if(txt!=null)e.textContent=txt; return e; },
  div(cls,txt){ return U.el('div',cls,txt); },
  frag(){ return document.createDocumentFragment(); },
  clamp(v,a,b){ return v<a?a:v>b?b:v; },
  // ids must stay unique across sessions, so they carry a time base as well as a counter
  uid(p){ U._n=(U._n||0)+1;
    return (p||'n')+'_'+Date.now().toString(36)+U._n.toString(36); },
  pad(n,w,c){ n=String(n); while(n.length<w)n=(c||'0')+n; return n; },
  size(b){
    if(b==null) return '-';
    if(b<1024) return b+' bytes';
    if(b<1024*1024) return (b/1024).toFixed(b/1024<10?2:1)+' KiB';
    if(b<1024*1024*1024) return (b/1048576).toFixed(2)+' MiB';
    return (b/1073741824).toFixed(2)+' GiB';
  },
  MON:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  DAY:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
  date(t){ // BeOS Tracker style: "Mon, Aug 3, 2026, 07:14 PM"
    if(!t) return '-';
    const d=new Date(t); let h=d.getHours(); const ap=h>=12?'PM':'AM';
    h=h%12; if(h===0)h=12;
    return U.DAY[d.getDay()].slice(0,3)+', '+U.MON[d.getMonth()]+' '+d.getDate()+', '+
      d.getFullYear()+', '+U.pad(h,2)+':'+U.pad(d.getMinutes(),2)+' '+ap;
  },
  shortdate(t){ const d=new Date(t); return U.MON[d.getMonth()]+' '+d.getDate()+' '+U.pad(d.getHours(),2)+':'+U.pad(d.getMinutes(),2); },
  time12(d,sec){ let h=d.getHours(); const ap=h>=12?'PM':'AM'; h=h%12||12;
    return h+':'+U.pad(d.getMinutes(),2)+(sec?':'+U.pad(d.getSeconds(),2):'')+' '+ap; },
  esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },
  on(e,t,f,o){ e.addEventListener(t,f,o); return ()=>e.removeEventListener(t,f,o); },
  stop(e){ e.preventDefault(); e.stopPropagation(); },
  rect(e){ return e.getBoundingClientRect(); },
  // deterministic-ish PRNG so repeated boots feel stable but alive
  words(n){ const w=['stream','kernel','node','render','media','frame','pulse','token','glyph','vector',
    'buffer','cache','thread','port','team','sem','area','volume','index','query'];
    let s=[]; for(let i=0;i<n;i++)s.push(w[Math.floor(rnd()*w.length)]); return s.join(' '); }
};
let _seed=1337;
function rnd(){ _seed=(_seed*1103515245+12345)&0x7fffffff; return _seed/0x7fffffff; }
function rint(a,b){ return a+Math.floor(rnd()*(b-a+1)); }
function now(){ return Date.now(); }

/* ============================================================
   1. Icons — all artwork generated in code (isometric 3/4 style)
   ============================================================ */
const Icons = (()=>{
  const S = (inner,vb)=>'<svg viewBox="0 0 '+(vb||32)+' '+(vb||32)+'" width="100%" height="100%" '+
    'shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';
  const P=(d,f,s,w)=>'<path d="'+d+'" fill="'+(f||'none')+'"'+(s?' stroke="'+s+'" stroke-width="'+(w||1)+'"':'')+'/>';
  const R=(x,y,w,h,f,s)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(f||'none')+'"'+
    (s?' stroke="'+s+'" stroke-width="1"':'')+'/>';
  const C=(cx,cy,r,f,s)=>'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(f||'none')+'"'+
    (s?' stroke="'+s+'" stroke-width="1"':'')+'/>';
  const E=(cx,cy,rx,ry,f,s)=>'<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(f||'none')+'"'+
    (s?' stroke="'+s+'" stroke-width="1"':'')+'/>';
  const L=(x1,y1,x2,y2,s,w)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+s+'" stroke-width="'+(w||1)+'"/>';
  const T=(x,y,s,f,sz,b)=>'<text x="'+x+'" y="'+y+'" fill="'+f+'" font-family="Verdana,sans-serif" font-size="'+sz+
    '"'+(b?' font-weight="bold"':'')+' text-anchor="middle">'+U.esc(s)+'</text>';
  const D='#3d3d3d';           // outline
  const lines=(x,y,w,n,c,gap)=>{ let s=''; for(let i=0;i<n;i++) s+=L(x,y+i*(gap||3),x+w,y+i*(gap||3),c||'#8899aa'); return s; };

  const art = {
    /* ---- containers ---- */
    folder(){ return S(
      P('M3 10 L13 10 L15.5 7 L28 7 L28 26 L3 26 Z','#c8b273',D)+
      P('M3 10 L13 10 L15.5 7 L28 7 L28 10 L3 10 Z','#e0cd9a')+
      P('M5 12 L26 12 L26 24 L5 24 Z','#d8c489')+
      L(5,24,26,24,'#a08c50')+L(26,12,26,24,'#a08c50')); },
    folderopen(){ return S(
      P('M3 10 L13 10 L15.5 7 L28 7 L28 12 L9 12 L5 26 L3 26 Z','#c8b273',D)+
      P('M9 12 L31 12 L27 26 L5 26 Z','#e3d1a2',D)); },
    volume(){ return S(
      P('M4 9 L16 4 L28 9 L16 14 Z','#b9c6d6',D)+
      P('M4 9 L4 22 L16 27 L16 14 Z','#8b9cb0',D)+
      P('M16 14 L28 9 L28 22 L16 27 Z','#a4b3c4',D)+
      E(16,9,5.5,2.4,'#e8eef5','#6a7d92')+C(16,9,1.2,'#6a7d92')+
      R(6,19,4,2,'#4b6a3c')+R(11,21,3,2,'#7d3c3c')); },
    volume2(){ return S(
      P('M4 9 L16 4 L28 9 L16 14 Z','#c9d0b6',D)+
      P('M4 9 L4 22 L16 27 L16 14 Z','#98a186',D)+
      P('M16 14 L28 9 L28 22 L16 27 Z','#b0b89c',D)+
      E(16,9,5.5,2.4,'#eef2e6','#6f7a5f')+C(16,9,1.2,'#6f7a5f')+
      R(6,19,4,2,'#4b6a3c')); },
    cd(){ return S(
      E(16,17,12,8,'#c9d4e0',D)+E(16,15.5,12,8,'#e8eef4',D)+
      E(16,15.5,9,5.6,'#b9cbe0','#8fa4bb')+E(16,15.5,3.2,2,'#f4f8fb','#8fa4bb')+
      P('M8 12 Q16 9 24 12','none')+
      '<path d="M9 13 Q16 10 23 13" fill="none" stroke="#ffffff" stroke-width="1" opacity=".8"/>'+
      '<path d="M10 19 Q16 22 22 19" fill="none" stroke="#98acc2" stroke-width="1"/>'); },
    floppy(){ return S(R(5,5,22,22,'#4a5566',D)+R(10,6,12,9,'#dfe4ea',D)+R(9,18,14,8,'#cfd6de',D)+R(19,7,2,7,'#8b94a1')); },
    trash(){ return S(
      P('M9 10 L23 10 L21.5 27 L10.5 27 Z','#b9bcc0',D)+
      E(16,10,7,2.6,'#d4d7db',D)+
      L(12,13,13,25,'#8e9195')+L(16,13,16,25,'#8e9195')+L(20,13,19,25,'#8e9195')+
      P('M8 7 L24 7 L24 9 L8 9 Z','#c6c9cd',D)+R(14,4,4,3,'#c6c9cd',D)); },
    trashfull(){ return S(
      P('M9 10 L23 10 L21.5 27 L10.5 27 Z','#b9bcc0',D)+
      E(16,10,7,2.6,'#d4d7db',D)+
      L(12,13,13,25,'#8e9195')+L(16,13,16,25,'#8e9195')+L(20,13,19,25,'#8e9195')+
      P('M10 8 L14 3 L18 6 L22 2 L23 9 L9 9 Z','#f2f0e6',D)+
      P('M13 5 L16 7 L14 8 Z','#dcd8c4')+
      P('M6 6 L10 4 L11 8 Z','#ffffff',D)); },
    /* ---- documents ---- */
    doc(){ return S(
      P('M7 3 L20 3 L25 8 L25 29 L7 29 Z','#ffffff',D)+
      P('M20 3 L25 8 L20 8 Z','#d0d0d0',D)+
      lines(10,12,12,5,'#93a3b5',3)); },
    docstyled(){ return S(
      P('M7 3 L20 3 L25 8 L25 29 L7 29 Z','#ffffff',D)+P('M20 3 L25 8 L20 8 Z','#d0d0d0',D)+
      L(10,12,20,12,'#3a4a5a',1.6)+lines(10,15,11,4,'#93a3b5',3)+
      P('M17 25 L25 17 L28 20 L20 28 L16 29 Z','#d8a24b',D)+P('M25 17 L28 20 L26.5 21.5 L23.5 18.5 Z','#8d6b2f')); },
    dochtml(){ return S(
      P('M7 3 L20 3 L25 8 L25 29 L7 29 Z','#ffffff',D)+P('M20 3 L25 8 L20 8 Z','#d0d0d0',D)+
      T(16,20,'</>','#2d5f8f',7,1)); },
    docmail(){ return S(
      P('M3 8 L29 8 L29 25 L3 25 Z','#f2f2ea',D)+
      P('M3 8 L16 18 L29 8','none','#7a7a70')+
      P('M3 25 L12 16 M29 25 L20 16','none','#a8a89e')); },
    docperson(){ return S(
      R(4,5,24,22,'#f4f1e4',D)+C(12,13,4,'#c9a06a',D)+
      P('M6 24 Q12 17 18 24 Z','#c9a06a',D)+lines(19,12,7,4,'#9aa7b5',3)); },
    docquery(){ return S(
      P('M4 8 L14 8 L16 6 L28 6 L28 24 L4 24 Z','#b9c9dd',D)+
      C(20,19,6,'#e8f2fb','#33506e')+L(24.5,23.5,29,28,'#33506e',2.2)+
      L(17,19,23,19,'#33506e')+L(20,16,20,22,'#33506e')); },
    bookmark(){ return S(
      P('M7 3 L20 3 L25 8 L25 29 L7 29 Z','#ffffff',D)+P('M20 3 L25 8 L20 8 Z','#d0d0d0',D)+
      C(16,17,7,'#7fb2e0',D)+E(16,17,7,3,'none','#2d5f8f')+L(16,10,16,24,'#2d5f8f')); },
    book(){ return S(
      P('M4 5 L15 8 L15 28 L4 25 Z','#8f4a4a',D)+P('M28 5 L17 8 L17 28 L28 25 Z','#a35656',D)+
      P('M15 8 L16 7 L17 8 L17 28 L16 27 L15 28 Z','#f0ece0',D)+
      lines(6,12,7,4,'#c99',3.4)+lines(19,12,7,4,'#c99',3.4)); },
    audio(){ return S(
      C(12,22,5,'#2d3a4a',D)+C(22,20,5,'#2d3a4a',D)+
      P('M17 22 L17 8 L27 5 L27 20','none',D)+L(17,8,17,22,D)+L(27,5,27,20,D)+
      P('M17 8 L27 5 L27 8 L17 11 Z','#2d3a4a',D)); },
    movie(){ return S(R(3,7,26,18,'#2b2b2b',D)+
      R(5,9,22,14,'#5f7d9b',D)+
      [0,1,2,3,4].map(i=>R(5+i*4.6,4,3,3,'#2b2b2b',D)).join('')+
      P('M13 13 L20 16 L13 19 Z','#ffffff')); },
    /* ---- apps ---- */
    app(){ return S(
      P('M6 11 L16 6 L26 11 L16 16 Z','#d8d8d8',D)+
      P('M6 11 L6 22 L16 27 L16 16 Z','#a8a8a8',D)+
      P('M16 16 L26 11 L26 22 L16 27 Z','#c0c0c0',D)+
      C(16,11,3,'#ffcb00',D)); },
    terminal(){ return S(
      R(3,5,26,21,'#c8c8c8',D)+R(5,7,22,17,'#101418',D)+
      T(11,17,'$','#7fdc7f',9,1)+R(14,13,6,1.6,'#7fdc7f')+
      R(11,26,10,2,'#b0b0b0',D)); },
    browser(){ return S(
      C(16,16,12,'#dff0ff',D)+E(16,16,12,5,'none','#3a6fa5')+
      L(4,16,28,16,'#3a6fa5')+E(16,16,5,12,'none','#3a6fa5')+
      P('M7 9 Q16 13 25 9','none','#3a6fa5')+P('M7 23 Q16 19 25 23','none','#3a6fa5')+
      P('M20 20 L29 20 L29 29 L20 29 Z','#ffffff',D)+T(24.5,27.5,'N','#2d5f8f',7,1)); },
    people(){ return S(
      C(11,11,5,'#c9a06a',D)+P('M3 26 Q11 15 19 26 Z','#5f7d9b',D)+
      C(22,14,4,'#e0b884',D)+P('M15 27 Q22 19 29 27 Z','#7d9bb9',D)); },
    mail(){ return S(
      P('M3 9 L29 9 L29 25 L3 25 Z','#f4f2e8',D)+P('M3 9 L16 19 L29 9','none','#8a8a80')+
      C(24,8,5,'#c94b4b',D)+T(24,11,'1','#fff',7,1)); },
    pulse(){ return S(
      R(3,5,26,19,'#c8c8c8',D)+R(5,7,22,15,'#0a0f0a',D)+
      [0,1,2,3,4,5].map(i=>R(7+i*3.2,20-((i*5)%12)-2,2.2,((i*5)%12)+2,'#4ba64b')).join('')+
      R(11,24,10,2,'#b0b0b0',D)); },
    clock(){ return S(
      C(16,16,12,'#e8e4d8',D)+C(16,16,10.5,'none','#b0aa9a')+
      [0,3,6,9].map(i=>{const a=i*Math.PI/6;return L(16+Math.sin(a)*9,16-Math.cos(a)*9,16+Math.sin(a)*7.5,16-Math.cos(a)*7.5,'#555',1.2)}).join('')+
      L(16,16,16,9,'#222',1.4)+L(16,16,21,18,'#222',1.4)+C(16,16,1.3,'#c94b4b')); },
    prefs(){ return S(
      R(4,4,24,24,'#d8d8d8',D)+
      L(8,11,24,11,'#8a8a8a')+R(12,8,4,6,'#5f7d9b',D)+
      L(8,18,24,18,'#8a8a8a')+R(18,15,4,6,'#5f7d9b',D)+
      L(8,25,24,25,'#8a8a8a')+R(9,22,4,6,'#5f7d9b',D)); },
    gear(){ return S(
      C(16,16,9,'#b9c2cc',D)+C(16,16,4,'#e8eef4',D)+
      [0,1,2,3,4,5,6,7].map(i=>{const a=i*Math.PI/4;
        return R(16+Math.cos(a)*10-2,16+Math.sin(a)*10-2,4,4,'#b9c2cc',D)}).join('')); },
    media(){ return S(
      R(3,7,26,18,'#c8c8c8',D)+R(5,9,22,12,'#101418',D)+
      P('M13 12 L21 15 L13 18 Z','#7fdc7f')+
      R(6,22,7,2,'#8a8a8a',D)+R(20,22,6,2,'#8a8a8a',D)); },
    cdplayer(){ return S(
      R(3,8,26,17,'#c8c8c8',D)+E(11,16,7,6,'#dfe8f0',D)+C(11,16,1.6,'#8fa4bb')+
      R(20,12,7,3,'#0b1a0b',D)+R(20,18,3,3,'#8a8a8a',D)+R(24,18,3,3,'#8a8a8a',D)); },
    demo3d(){ return S(
      P('M16 4 L27 10 L27 22 L16 28 L5 22 L5 10 Z','#5f7d9b',D)+
      P('M16 4 L27 10 L16 16 L5 10 Z','#8fb0cc',D)+
      P('M16 16 L27 10 L27 22 L16 28 Z','#4a6580',D)+
      L(5,10,5,22,D)+L(16,16,16,28,'#39506a')); },
    magnify(){ return S(C(14,14,9,'#e8f2fb',D)+C(14,14,6.5,'none','#8fa4bb')+
      L(20.5,20.5,28,28,D,3)); },
    expander(){ return S(
      P('M6 6 L26 6 L26 26 L6 26 Z','#c8b273',D)+
      P('M16 9 L21 15 L18 15 L18 22 L14 22 L14 15 L11 15 Z','#5f7d9b',D)); },
    diskprobe(){ return S(
      P('M4 9 L16 4 L28 9 L16 14 Z','#b9c6d6',D)+P('M4 9 L4 20 L16 25 L16 14 Z','#8b9cb0',D)+
      P('M16 14 L28 9 L28 20 L16 25 Z','#a4b3c4',D)+
      C(21,20,6,'#e8f2fb','#33506e')+L(25,24,30,29,'#33506e',2.2)); },
    iconomatic(){ return S(
      R(4,4,24,24,'#ffffff',D)+
      P('M8 22 L18 12 L22 16 L12 26 L7 27 Z','#d8a24b',D)+P('M18 12 L22 16 L20 18 L16 14 Z','#8d6b2f')+
      C(9,9,3,'#c94b4b',D)+C(16,8,3,'#4b8ac9',D)+C(23,10,3,'#4ba64b',D)); },
    workspaces(){ return S(R(3,5,26,22,'#8a8a8a',D)+
      [0,1,2].map(r=>[0,1,2].map(c=>R(5+c*8,7+r*7,7,6,(r*3+c)===0?'#ffcb00':'#5f7d9b','#333')).join('')).join('')); },
    teams(){ return S(R(3,5,26,21,'#c8c8c8',D)+R(5,7,22,17,'#f4f4f4',D)+
      lines(7,11,18,5,'#8fa4bb',3)+C(23,20,4,'#c94b4b',D)+L(21,20,25,20,'#fff',1.6)); },
    query(){ return art.docquery(); },
    net(){ return S(
      C(16,16,11,'#dff0ff',D)+E(16,16,11,4.5,'none','#3a6fa5')+L(5,16,27,16,'#3a6fa5')+
      E(16,16,4.5,11,'none','#3a6fa5')+R(2,24,8,5,'#c8c8c8',D)+R(22,24,8,5,'#c8c8c8',D)); },
    sound(){ return S(P('M6 13 L11 13 L17 7 L17 25 L11 19 L6 19 Z','#c8b273',D)+
      '<path d="M20 11 Q24 16 20 21" fill="none" stroke="#3a6fa5" stroke-width="1.4"/>'+
      '<path d="M23 8 Q29 16 23 24" fill="none" stroke="#3a6fa5" stroke-width="1.4"/>'); },
    screen(){ return S(R(3,5,26,18,'#c8c8c8',D)+R(5,7,22,14,'#336698',D)+R(11,24,10,3,'#a8a8a8',D)); },

   2. Sound Manager — everything synthesized, no audio files
   ============================================================ */
const Sound = (()=>{
  let ctx=null, master=null;
  const st = {enabled:true, volume:0.5};
  function ac(){
    if(!ctx){
      try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
      master = ctx.createGain(); master.gain.value=st.volume; master.connect(ctx.destination);
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function setVolume(v){ st.volume=v; if(master) master.gain.value=v; }
  function tone(f,dur,type,gain,delay,slide){
    if(!st.enabled) return; const c=ac(); if(!c) return;
    const t0=c.currentTime+(delay||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+dur);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain==null?0.18:gain,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03);
  }
  function noise(dur,gain,hp,delay){
    if(!st.enabled) return; const c=ac(); if(!c) return;
    const t0=c.currentTime+(delay||0);
    const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(); s.buffer=b;
    const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||900;
    const g=c.createGain(); g.gain.value=gain==null?0.12:gain;
    s.connect(f); f.connect(g); g.connect(master); s.start(t0);
  }
  const S = {
    get enabled(){ return st.enabled; },
    set enabled(v){ st.enabled=v; },
    setVolume, tone, noise,
    startup(){ // rising fifths, faintly Be-ish
      [0,1,2,3].forEach((i)=>tone([392,587.33,783.99,1174.66][i],1.5-i*0.12,'triangle',0.13,i*0.11));
      tone(196,2.0,'sine',0.09,0.02);
    },
    beep(){ tone(880,0.12,'square',0.09); tone(1320,0.1,'square',0.05,0.02); },
    alert(){ tone(660,0.16,'triangle',0.12); tone(494,0.22,'triangle',0.1,0.14); },
    click(){ noise(0.02,0.05,2400); },
    key(){ noise(0.012,0.03,3200); },
    trash(){ noise(0.22,0.13,600); tone(160,0.2,'sawtooth',0.05,0.02,90); },
    empty(){ noise(0.5,0.16,400); tone(120,0.5,'sawtooth',0.06,0,60); },
    open(){ tone(523,0.07,'sine',0.06); tone(784,0.09,'sine',0.05,0.05); },
    close(){ tone(523,0.07,'sine',0.05); tone(392,0.09,'sine',0.05,0.04); },
    shutdown(){ [523.25,415.3,311.13,207.65].forEach((f,i)=>tone(f,0.9-i*0.1,'triangle',0.12,i*0.16)); },
    cd(n){ tone(440*Math.pow(2,((n||0)%12)/12),0.5,'sine',0.1); },
    error(){ tone(220,0.35,'square',0.1); tone(207,0.35,'square',0.08,0.02); }
  };
  return S;
})();

const BASE_COLS = [

const FS = (()=>{
  const nodes = {};      // id -> node
  let rootId = null;

  function mk(o){
    const n = Object.assign({
      id:U.uid('f'), name:'untitled', type:'file', mime:MIME.TEXT,
      attrs:{}, size:0, data:'', kids:null, parent:null,
      created:now()-rint(60,900)*86400000, mtime:now()-rint(1,60)*86400000,
      sys:false, pos:null, app:null, perms:'-rw-r--r--', owner:'baron'
    },o);
    if(n.type==='dir'||n.type==='vol'||n.type==='trash'){ n.kids=n.kids||[]; n.mime=n.mime||MIME.DIR; }
    if(n.data && !o.size) n.size=n.data.length;
    nodes[n.id]=n; return n;
  }
  function get(id){ return nodes[id]||null; }
  function add(parent,o){
    const n = mk(o); n.parent = parent?parent.id:null;
    if(parent){ if(!parent.kids)parent.kids=[]; parent.kids.push(n.id); parent.mtime=now(); }
    return n;
  }
  function remove(n){
    const p=get(n.parent); if(p&&p.kids){ const i=p.kids.indexOf(n.id); if(i>=0)p.kids.splice(i,1); p.mtime=now(); }
    (function del(x){ if(x.kids) x.kids.slice().forEach(k=>{const c=get(k); if(c)del(c);}); delete nodes[x.id]; })(n);
  }
  function kids(n){ return (n&&n.kids)?n.kids.map(get).filter(Boolean):[]; }
  function path(n){
    if(!n) return '';
    if(!n.parent) return n.name==='/'?'/':'/'+n.name;
    const p=get(n.parent), pp=path(p);
    return (pp==='/'?'/':pp+'/')+n.name;
  }
  function byPath(p){
    if(!p) return null;
    p=p.replace(/\/+$/,''); if(p===''||p==='/') return get(rootId);
    const parts=p.split('/').filter(Boolean);
    let cur=get(rootId);
    for(const part of parts){
      if(part==='.') continue;
      if(part==='..'){ cur=get(cur.parent)||get(rootId); continue; }
      const k=kids(cur).find(c=>c.name.toLowerCase()===part.toLowerCase());
      if(!k) return null; cur=k;
    }
    return cur;
  }
  function uniqueName(parent,base){
    const ks=kids(parent).map(k=>k.name.toLowerCase());
    if(ks.indexOf(base.toLowerCase())<0) return base;
    const m=base.match(/^(.*?)(\.[a-z0-9]+)?$/i), stem=m[1], ext=m[2]||'';
    let i=1, cand;
    do{ cand=stem+' '+(i===1?'copy':'copy '+i)+ext; i++; }while(ks.indexOf(cand.toLowerCase())>=0);
    return cand;
  }
  function move(n,dest){
    if(!n||!dest) return false;
    if(n.id===dest.id) return false;
    let p=dest; while(p){ if(p.id===n.id) return false; p=get(p.parent); }  // no loops
    const old=get(n.parent);
    if(old&&old.kids){ const i=old.kids.indexOf(n.id); if(i>=0)old.kids.splice(i,1); old.mtime=now(); }
    n.name = kids(dest).some(k=>k.id!==n.id&&k.name.toLowerCase()===n.name.toLowerCase())
      ? uniqueName(dest,n.name) : n.name;
    n.parent=dest.id; dest.kids.push(n.id); dest.mtime=now(); n.pos=null;
    return true;
  }
  function clone(n,dest,name){
    const c = add(dest,{name:name||uniqueName(dest,n.name),type:n.type,mime:n.mime,
      attrs:JSON.parse(JSON.stringify(n.attrs)),data:n.data,size:n.size,app:n.app,
      icon:n.icon,created:now(),mtime:now()});
    if(n.kids) kids(n).forEach(k=>clone(k,c));
    if(c.kids) c.size=0;
    return c;
  }
  function walk(n,fn){ if(!n)return; fn(n); kids(n).forEach(k=>walk(k,fn)); }
  function all(){ return Object.values(nodes); }
  function volumeOf(n){ let c=n; while(c&&get(c.parent)&&get(c.parent).parent!==null) c=get(c.parent);
    return c&&get(c.parent)?c:n; }
  function icon(n){
    if(n.icon) return n.icon;
    if(n.type==='trash') return kids(n).length?'trashfull':'trash';
    if(n.type==='vol') return n.volIcon||'volume';
    if(n.type==='dir') return 'folder';
    return Icons.has(n.mime)?n.mime:'doc';
  }
  function kindOf(n){
    if(n.type==='dir') return 'Folder';
    if(n.type==='vol') return 'Be volume';
    if(n.type==='trash') return 'Trash';
    if(n.type==='app') return 'Application';
    return MIME_NAMES[n.mime]||n.mime;
  }
  function field(n,a){
    switch(a){
      case 'name': return n.name;
      case 'size': return n.type==='dir'||n.type==='trash'?null:n.size;
      case 'mtime': return n.mtime;
      case 'created': return n.created;
      case 'kind': return kindOf(n);
      case 'path': return path(get(n.parent)||n);
      case 'BEOS:TYPE': return n.type==='dir'?MIME.DIR:n.mime;
      case 'perms': return n.type==='dir'?'drwxr-xr-x':(n.type==='app'?'-rwxr-xr-x':n.perms);
      case 'owner': return n.owner||'baron';
      default: return n.attrs[a];
    }
  }
  function schemaFor(mime){ return SCHEMA[mime]||[]; }
  function colDef(a){
    let c = BASE_COLS.find(c=>c.a===a);
    if(c) return c;
    for(const k in SCHEMA){ const f=SCHEMA[k].find(x=>x.a===a); if(f) return f; }
    return {a:a,l:a,t:'string',w:110};
  }
  function trash(){ return byPath('/boot/home/Desktop/Trash'); }

  /* ---- queries: predicate objects, evaluated live ---- */
  function evalPred(n,pr){
    if(!pr) return false;
    if(pr.op==='and') return pr.terms.every(t=>evalPred(n,t));
    if(pr.op==='or')  return pr.terms.some(t=>evalPred(n,t));
    if(pr.mime && pr.mime!=='*'){
      if(pr.mime===MIME.DIR ? n.type!=='dir' : (n.mime!==pr.mime)) return false;
    }
    if(!pr.attr) return true;
    let v = field(n,pr.attr);
    const def = colDef(pr.attr);
    if(def.t==='time'){
      const t=typeof v==='number'?v:Date.parse(v||0)||0;
      const target = parseDateish(pr.value);
      if(target==null) return false;
      if(pr.rel==='before') return t<target;
      if(pr.rel==='after') return t>target;
      return Math.abs(t-target)<86400000;
    }
    if(def.t==='size'||def.t==='int'){
      const a=Number(v)||0, b=Number(String(pr.value).replace(/[^\d.]/g,''))||0;
      const mult=/k/i.test(pr.value)?1024:/m/i.test(pr.value)?1048576:1;
      const bb=b*mult;
      switch(pr.rel){ case 'greater': return a>bb; case 'less': return a<bb;
        case 'is': return a===bb; case 'isnot': return a!==bb; default: return a===bb; }
    }
    v = String(v==null?'':v).toLowerCase();
    const q = String(pr.value==null?'':pr.value).toLowerCase();
    switch(pr.rel){
      case 'is': return v===q;
      case 'isnot': return v!==q;
      case 'starts': return v.indexOf(q)===0;
      case 'ends': return v.slice(-q.length)===q;
      case 'contains': default: return q===''?false:v.indexOf(q)>=0;
    }
  }
  function parseDateish(s){
    if(s==null) return null;
    s=String(s).trim().toLowerCase();
    const d0=new Date(); d0.setHours(0,0,0,0);
    if(s==='today') return d0.getTime();
    if(s==='yesterday') return d0.getTime()-86400000;
    let m=s.match(/^(\d+)\s*(day|week|month)s?\s*ago$/);
    if(m) return d0.getTime()-Number(m[1])*(m[2]==='day'?1:m[2]==='week'?7:30)*86400000;
    const t=Date.parse(s); return isNaN(t)?null:t;
  }
  function runQuery(pred,scope){
    const out=[];
    const start = scope?byPath(scope):get(rootId);
    const tr = trash();
    walk(start,n=>{
      if(n.type==='vol'||n.type==='trash'||!n.parent) return;
      if(n.sysHidden) return;
      let p=n; let inTrash=false;
      while(p){ if(tr&&p.id===tr.id){inTrash=true;break;} p=get(p.parent); }
      if(inTrash) return;
      if(evalPred(n,pred)) out.push(n);
    });
    return out;
  }
  function predString(pr){
    if(!pr) return '';
    if(pr.op==='and'||pr.op==='or') return '('+pr.terms.map(predString).join(' '+pr.op.toUpperCase()+' ')+')';
    const rel={contains:'~',is:'==',isnot:'!=',starts:'^',ends:'$',greater:'>',less:'<',before:'<',after:'>'}[pr.rel]||'~';
    let s=(pr.attr||'name')+rel+'"'+(pr.value||'')+'"';
    if(pr.mime&&pr.mime!=='*') s='(BEOS:TYPE=="'+pr.mime+'")&&('+s+')';
    return s;
  }

  /* ---------- serialize ---------- */
  function dump(){
    const out={};
    for(const id in nodes){
      const n=nodes[id];
      out[id]={id:n.id,name:n.name,type:n.type,mime:n.mime,attrs:n.attrs,size:n.size,
        data:n.data,kids:n.kids,parent:n.parent,created:n.created,mtime:n.mtime,sys:n.sys,
        pos:n.pos,app:n.app,icon:n.icon,volIcon:n.volIcon,pred:n.pred,scope:n.scope,
        capacity:n.capacity,used:n.used,devname:n.devname,ro:n.ro,perms:n.perms,owner:n.owner,
        sysHidden:n.sysHidden,iconPix:n.iconPix,linkTo:n.linkTo};
    }
    return {root:rootId,nodes:out};
  }
  function load(d){
    for(const k in nodes) delete nodes[k];
    for(const id in d.nodes) nodes[id]=d.nodes[id];
    rootId=d.root;
    // repair anything a previous session may have written badly: dangling or duplicated links
    for(const id in nodes){
      const n=nodes[id];
      if(n.id!==id) n.id=id;
      if(n.kids){
        const seen={};
        n.kids=n.kids.filter(k=>{
          if(!nodes[k]||seen[k]||k===id) return false;
          seen[k]=1; return true;
        });
      }
    }
  }
  function setRoot(n){ rootId=n.id; }
  return {mk,add,remove,kids,path,byPath,move,clone,walk,all,get,icon,kindOf,field,
    schemaFor,colDef,uniqueName,runQuery,evalPred,predString,parseDateish,trash,volumeOf,
    dump,load,setRoot, get rootId(){return rootId;}, nodes};
})();

"================================================================\n\n"+
"NEW IN THIS RELEASE\n"+
"  * Deskbar can be collapsed to a single row and dragged to any\n"+

"=======================================\n\n"+
"A team is a running program: one address space, many threads.\n"+

"Rules of thumb that have not failed me yet:\n\n"+
"  1. One window, one thread. The window's thread does drawing and\n"+

/* ============================================================
   5. State Manager — LocalStorage persistence
   ============================================================ */
const State = (()=>{
  const KEY='beos.r5.state.v1';
  const DEF = {
    ver:1,
    prefs:{
      appearance:{panel:'#d8d8d8',tab:'#ffcb00',sel:'#336698',doubleArrows:true,knobs:true,
        winTabWidth:'normal',focusFollows:false},
      workspaces:{count:9,current:0,
        colors:['#336698','#2d4f6b','#4a5f4a','#5a4a5a','#3f3f52','#6b5a3f','#2f5a5a','#4a3f3f','#555555'],
        rows:3,cols:3},
      screen:{res:'1024x768',depth:'32 bits/pixel',refresh:'75 Hz'},
      fonts:{plain:'Swis721 BT',plainSize:11,fixed:'Courier10 BT',fixedSize:12},
      keyboard:{delay:2,repeat:6,keymap:'US-International'},
      mouse:{speed:3,accel:2,dblclick:400,focus:'click',buttons:2},
      menu:{font:'Swis721 BT',size:11,altAsCtrl:false,clickToOpen:true},
      sounds:{enabled:true,volume:0.5,events:{startup:true,beep:true,trash:true,window:false}},
      vm:{enabled:true,sizeMB:384},
      saver:{enabled:false,delay:5,module:'Flying Windows',password:false},
      time:{use24:false,showSeconds:false,tz:'Local'},
      net:{hostname:SYS.hostname,domain:'local',ip:SYS.ip,mask:SYS.mask,gw:SYS.gw,dns:SYS.dns,
        dhcp:false,iface:'etherpci0',ftp:false,telnet:false},
      deskbar:{showReplicants:true,showClock:true,expandTeams:false,mini:false,
        location:'top-right',showSeconds:false,use24:false},
      tracker:{singleWindow:false,showAllExt:true,sortFolders:true,showHidden:false}
    },
    view:{},        // per-node-path window geometry / view mode / columns
    replicants:[],
    term:{history:[],cwd:'/boot/home'},
    np:{history:[],home:'be:start'},
    fs:null,
    dsk:{}          // desktop icon positions by path
  };
  let st=null, timer=null;

  function deepMerge(d,s){
    const o=Array.isArray(d)?d.slice():Object.assign({},d);
    if(!s||typeof s!=='object') return o;
    for(const k in s){
      if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&d[k]&&typeof d[k]==='object')
        o[k]=deepMerge(d[k],s[k]);
      else o[k]=s[k];
    }
    return o;
  }
  function load(){
    let raw=null;
    try{ raw=localStorage.getItem(KEY); }catch(e){}
    let saved=null;
    if(raw){ try{ saved=JSON.parse(raw); }catch(e){ saved=null; } }
    if(saved && saved.ver===DEF.ver){
      st = deepMerge(DEF,saved);
      if(st.fs && st.fs.nodes && st.fs.root){ FS.load(st.fs); }
      else seedFS();
    } else { st = deepMerge(DEF,{}); seedFS(); }
    st.fs=null;
    return st;
  }
  function save(){
    if(!st) return;
    clearTimeout(timer); timer=null;
    try{
      const out=Object.assign({},st,{fs:FS.dump()});
      localStorage.setItem(KEY,JSON.stringify(out));
    }catch(e){ /* quota or private mode: run stateless, no drama */ }
  }
  function dirty(){ if(!timer) timer=setTimeout(save,700); }
  function reset(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  return {
    load,save,dirty,reset,
    get s(){ return st; },
    get prefs(){ return st.prefs; },
    view(key,def){ if(!st.view[key]) st.view[key]=Object.assign({},def||{}); return st.view[key]; },
    setView(key,o){ st.view[key]=Object.assign(st.view[key]||{},o); dirty(); }
  };
})();
/* ============================================================
   6. Menus (BMenu / BPopUpMenu analog)
   ============================================================ */
const Menu = (()=>{
  let stack=[];      // open menu layers
  let onDone=null;
  const layer = ()=>document.getElementById('stage');

  function close(all){
    while(stack.length>(all?0:1)){ const m=stack.pop(); if(m.el.parentNode)m.el.parentNode.removeChild(m.el); }
    if(all){
      stack=[];
      document.removeEventListener('pointerdown',outside,true);
      document.removeEventListener('keydown',keys,true);
      if(onDone){ const f=onDone; onDone=null; f(); }
    }
  }
  function closeTo(depth){
    while(stack.length>depth){ const m=stack.pop(); if(m.el.parentNode)m.el.parentNode.removeChild(m.el); }
  }
  function outside(e){
    for(const m of stack) if(m.el.contains(e.target)) return;
    U.stop(e); close(true);
  }
  function keys(e){
    if(e.key==='Escape'){ U.stop(e); close(true); return; }
    const top=stack[stack.length-1]; if(!top) return;
    const items=top.rows.filter(r=>!r.item.sep&&!r.item.disabled);
    if(!items.length) return;
    let i=items.findIndex(r=>r.el.classList.contains('hot'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      U.stop(e);
      i = e.key==='ArrowDown' ? (i+1)%items.length : (i<=0?items.length-1:i-1);
      top.rows.forEach(r=>r.el.classList.remove('hot'));
      items[i].el.classList.add('hot');
    } else if(e.key==='ArrowRight'){
      if(i>=0&&items[i].item.sub){ U.stop(e); openSub(top,items[i]); }
    } else if(e.key==='ArrowLeft'){
      if(stack.length>1){ U.stop(e); closeTo(stack.length-1); }
    } else if(e.key==='Enter'||e.key===' '){
      if(i>=0){ U.stop(e); pick(items[i].item); }
    }
  }
  function pick(item){
    if(item.disabled) return;
    close(true);
    if(item.fn) setTimeout(()=>item.fn(item),0);
  }
  function openSub(m,row){
    if(row.subOpen) return;
    closeTo(m.depth+1);
    const r=U.rect(row.el), sr=U.rect(layer());
    build(row.item.sub,r.right-sr.left-3,r.top-sr.top-2,{depth:m.depth+1,parentRow:row});
  }
  function build(items,x,y,opt){
    opt=opt||{};
    const el=U.div('bemenu'+(items.some(i=>i.icon)?' icons':''));
    const rows=[];
    const m={el,rows,depth:opt.depth||0};
    items.forEach(item=>{
      if(item.sep){ const s=U.div('sep'); el.appendChild(s); rows.push({el:s,item}); return; }
      const r=U.div('mi'+(item.disabled?' dis':''));
      if(item.icon){ const ic=U.div('ico'); ic.innerHTML=Icons.svg(item.icon); r.appendChild(ic); }
      if(item.checked) { const k=U.div('mk','✓'); r.appendChild(k); }
      else if(item.marked){ const k=U.div('mk','●'); r.appendChild(k); }
      const lb=U.el('span',null,item.label); r.appendChild(lb);
      if(item.sc){ const s=U.div('sc',item.sc); r.appendChild(s); }
      if(item.sub){ const s=U.div('sub','▶'); r.appendChild(s); }
      r.addEventListener('pointerenter',()=>{
        m.rows.forEach(q=>q.el.classList.remove('hot'));
        if(!item.disabled) r.classList.add('hot');
        closeTo(m.depth+1);
        if(item.sub&&!item.disabled) openSub(m,{el:r,item});
      });
      r.addEventListener('pointerup',e=>{
        U.stop(e);
        if(item.sub) return;
        pick(item);
      });
      el.appendChild(r); rows.push({el:r,item});
    });
    el.style.left='-9999px'; el.style.top='0px';
    layer().appendChild(el);
    const w=el.offsetWidth,h=el.offsetHeight;
    const sw=layer().clientWidth, sh=layer().clientHeight;
    let nx=x, ny=y;
    if(opt.alignIndex!=null){
      const row=rows[opt.alignIndex];
      if(row) ny = y - (row.el.offsetTop+row.el.offsetHeight/2);
    }
    if(nx+w>sw-2) nx = opt.parentRow? Math.max(2,x-w-U.rect(opt.parentRow.el).width) : Math.max(2,sw-w-2);
    if(ny+h>sh-2) ny = Math.max(2,sh-h-2);
    if(ny<2) ny=2;
    el.style.left=Math.round(nx)+'px'; el.style.top=Math.round(ny)+'px';
    stack.push(m);
    return m;
  }
  function open(items,x,y,opts){
    opts=opts||{};
    close(true);
    onDone=opts.onDone||null;
    document.addEventListener('pointerdown',outside,true);
    document.addEventListener('keydown',keys,true);
    return build(items,x,y,{depth:0,alignIndex:opts.alignIndex});
  }
  function atEvent(items,e,opts){
    const sr=U.rect(layer());
    return open(items,e.clientX-sr.left,e.clientY-sr.top,opts);
  }
  return {open,atEvent,close,get isOpen(){return stack.length>0;}};
})();

/* ============================================================
   7. Controls (BControl analogs)
   ============================================================ */
const Ctl = {
  button(label,fn,o){
    o=o||{};
    const b=U.div('bebtn'+(o.def?' def':'')+(o.sm?' sm':'')+(o.dis?' dis':''),label);
    if(o.w) b.style.minWidth=o.w+'px';
    b.addEventListener('pointerdown',e=>{ U.stop(e); if(b.classList.contains('dis'))return;
      b.classList.add('down'); });
    b.addEventListener('pointerup',e=>{ b.classList.remove('down'); });
    b.addEventListener('pointerleave',()=>b.classList.remove('down'));
    b.addEventListener('click',e=>{ U.stop(e); if(b.classList.contains('dis'))return;
      Sound.click(); fn&&fn(e,b); });
    b.setLabel=t=>b.textContent=t;
    b.enable=v=>b.classList.toggle('dis',!v);
    return b;
  },
  check(label,val,fn){
    const c=U.div('becheck'+(val?' on':''));
    c.appendChild(U.div('bx'));
    c.appendChild(U.el('span',null,label));
    c.addEventListener('click',e=>{ U.stop(e); c.classList.toggle('on');
      Sound.click(); fn&&fn(c.classList.contains('on')); });
    c.set=v=>c.classList.toggle('on',!!v);
    c.get=()=>c.classList.contains('on');
    return c;
  },
  radio(label,val,fn){
    const c=U.div('beradio'+(val?' on':''));
    c.appendChild(U.div('rd'));
    c.appendChild(U.el('span',null,label));
    c.addEventListener('click',e=>{ U.stop(e);
      const g=c.parentNode?c.parentNode.querySelectorAll('.beradio'):[];
      g.forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); Sound.click(); fn&&fn(true); });
    c.set=v=>c.classList.toggle('on',!!v);
    return c;
  },
  radioGroup(labels,sel,fn){
    const box=U.div('col');
    labels.forEach((l,i)=>box.appendChild(Ctl.radio(l,i===sel,()=>fn&&fn(i,l))));
    return box;
  },
  /* BeOS pop-up: menu opens over the field with the current item under the cursor */
  popup(items,value,fn,o){
    o=o||{};
    const p=U.div('bepop');
    const v=U.div('val'); p.appendChild(v); p.appendChild(U.div('mk'));
    if(o.w) p.style.minWidth=o.w+'px';
    function label(){
      const it=items.find(i=>i.value===p.value);
      return it?it.label:(p.value==null?'':String(p.value));
    }
    p.value=value;
    p.render=()=>{ v.textContent=label(); };
    p.setItems=(it,val)=>{ items=it; if(val!==undefined)p.value=val; p.render(); };
    p.render();
    p.addEventListener('pointerdown',e=>{
      U.stop(e);
      const idx=Math.max(0,items.findIndex(i=>i.value===p.value));
      const mi=items.map((i,n)=>({label:i.label,marked:i.value===p.value,fn:()=>{
        p.value=i.value; p.render(); fn&&fn(i.value,i);
      }}));
      Menu.atEvent(mi,e,{alignIndex:idx});
    });
    return p;
  },
  text(value,fn,o){
    o=o||{};
    const t=U.el('input','betext'); t.type=o.pw?'password':'text';
    t.value=value==null?'':value;
    if(o.w) t.style.width=o.w+'px';
    if(o.ph) t.placeholder=o.ph;
    if(o.mono) t.style.fontFamily='var(--mono)';
    t.addEventListener('input',()=>fn&&fn(t.value,'input'));
    t.addEventListener('change',()=>fn&&fn(t.value,'change'));
    t.addEventListener('keydown',e=>{
      e.stopPropagation();
      if(e.key==='Enter') fn&&fn(t.value,'enter');
    });
    t.addEventListener('pointerdown',e=>e.stopPropagation());
    return t;
  },
  area(value,fn,o){
    o=o||{};
    const t=U.el('textarea','betext');
    t.value=value==null?'':value;
    if(o.rows) t.rows=o.rows;
    if(o.mono) t.style.fontFamily='var(--mono)';
    t.addEventListener('input',()=>fn&&fn(t.value));
    t.addEventListener('keydown',e=>e.stopPropagation());
    t.addEventListener('pointerdown',e=>e.stopPropagation());
    return t;
  },
  label(txt,cls){ return U.div('belabel'+(cls?' '+cls:''),txt); },
  box(cap,...kids){
    const b=U.div('bebox');
    if(cap) b.appendChild(U.div('cap',cap));
    kids.forEach(k=>k&&b.appendChild(k));
    return b;
  },
  row(...kids){ const r=U.div('row'); kids.forEach(k=>k&&r.appendChild(k)); return r; },
  col(...kids){ const c=U.div('col'); kids.forEach(k=>k&&c.appendChild(k)); return c; },
  hr(){ return U.div('hr'); },
  space(px){ const s=U.div(); s.style.height=(px||6)+'px'; return s; },
  field(label,ctl,lw){
    const r=U.div('row');
    const l=U.div('belabel',label); l.style.width=(lw||78)+'px'; l.style.textAlign='right';
    r.appendChild(l); r.appendChild(ctl); return r;
  },
  slider(min,max,val,fn,o){
    o=o||{};
    const s=U.div('beslider'); s.appendChild(U.div('tr'));
    const th=U.div('th'); s.appendChild(th);
    if(o.w) s.style.flex='0 0 '+o.w+'px';
    let v=val;
    function place(){
      const w=s.clientWidth-9;
      th.style.left=Math.round((v-min)/(max-min)*w)+'px';
    }
    s.setValue=nv=>{ v=U.clamp(nv,min,max); place(); };
    s.getValue=()=>v;
    function grab(e){
      U.stop(e);
      const r=U.rect(s), w=r.width-9;
      const mv=ev=>{
        const nv=min+(U.clamp(ev.clientX-r.left-4.5,0,w)/w)*(max-min);
        v=o.step?Math.round(nv/o.step)*o.step:nv; v=U.clamp(v,min,max); place(); fn&&fn(v);
      };
      const up=()=>{ document.removeEventListener('pointermove',mv);
        document.removeEventListener('pointerup',up); fn&&fn(v,true); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
      mv(e);
    }
    s.addEventListener('pointerdown',grab);
    setTimeout(place,0);
    return s;
  },
  progress(v){
    const p=U.div('progress'); const i=U.el('i'); p.appendChild(i);
    p.set=x=>{ i.style.width=U.clamp(x*100,0,100)+'%'; };
    p.set(v||0);
    return p;
  }
};

/* ============================================================
   8. BeOS scroll bars — double arrows, knurled thumb
   ============================================================ */
class Scroller {
  constructor(host,opts){
    opts=opts||{};
    this.v = opts.v!==false; this.h = !!opts.h;
    this.frame=U.div('scfr'+(this.v?'':' novs')+(this.h?'':' nohs'));
    this.viewport=U.div('scvp');
    this.content=U.div('scct');
    this.viewport.appendChild(this.content);
    this.frame.appendChild(this.viewport);
    if(opts.bg) this.viewport.style.background=opts.bg;
    this.step = opts.step||16;
    if(this.v) this.frame.appendChild(this._bar('v'));
    if(this.h) this.frame.appendChild(this._bar('h'));
    if(this.v&&this.h) this.frame.appendChild(U.div('corner'));
    host.appendChild(this.frame);
    this.viewport.addEventListener('wheel',e=>{
      const vv=this.viewport;
      if(this.v&&vv.scrollHeight>vv.clientHeight){ vv.scrollTop+=e.deltaY; e.preventDefault(); }
      else if(this.h&&vv.scrollWidth>vv.clientWidth){ vv.scrollLeft+=e.deltaY; e.preventDefault(); }
      this.update();
    },{passive:false});
    this.viewport.addEventListener('scroll',()=>this.update());
    this._ro=null;
    if(window.ResizeObserver){
      this._ro=new ResizeObserver(()=>this.update()); this._ro.observe(this.viewport);
    }
    setTimeout(()=>this.update(),0);
    if(!State.prefs.appearance.knobs) this.frame.classList.add('nokn');
  }
  _bar(dir){
    const bar=U.div('scbar '+dir);
    const th=U.div('scth '+dir); th.appendChild(U.div('kn'));
    const mk=(cls,d)=>{
      const a=U.div('scar '+cls); a.appendChild(U.el('i'));
      let t=null,iv=null;
      a.addEventListener('pointerdown',e=>{ U.stop(e);
        this._scrollBy(dir,d*this.step);
        t=setTimeout(()=>{ iv=setInterval(()=>this._scrollBy(dir,d*this.step),40); },300);
      });
      const stop=()=>{ clearTimeout(t); clearInterval(iv); };
      a.addEventListener('pointerup',stop); a.addEventListener('pointerleave',stop);
      return a;
    };
    const dbl=State.prefs.appearance.doubleArrows;
    const A=dir==='v'?['up','dn']:['lf','rt'];
    bar.a1=mk(A[0],-1); bar.a2=mk(A[1],1);
    bar.b1=mk(A[0],-1); bar.b2=mk(A[1],1);
    bar.appendChild(bar.a1); bar.appendChild(bar.a2);
    if(dbl){ bar.appendChild(bar.b1); bar.appendChild(bar.b2); }
    bar.appendChild(th);
    bar.th=th; bar.dbl=dbl;
    // track paging
    bar.addEventListener('pointerdown',e=>{
      if(e.target!==bar) return;
      U.stop(e);
      const r=U.rect(bar), tr=U.rect(th);
      const before = dir==='v' ? e.clientY<tr.top : e.clientX<tr.left;
      const page = dir==='v'?this.viewport.clientHeight-20:this.viewport.clientWidth-20;
      this._scrollBy(dir,(before?-1:1)*page);
    });
    th.addEventListener('pointerdown',e=>{
      U.stop(e);
      const vv=this.viewport;
      const start = dir==='v'?e.clientY:e.clientX;
      const s0 = dir==='v'?vv.scrollTop:vv.scrollLeft;
      const g=this._geom(dir,bar);
      const range = dir==='v'?(vv.scrollHeight-vv.clientHeight):(vv.scrollWidth-vv.clientWidth);
      const travel = g.trackLen-g.thumbLen;
      const mv=ev=>{
        const d=(dir==='v'?ev.clientY:ev.clientX)-start;
        const nv=s0+(travel>0?d/travel*range:0);
        if(dir==='v') vv.scrollTop=nv; else vv.scrollLeft=nv;
        this.update();
      };
      const up=()=>{ document.removeEventListener('pointermove',mv);
        document.removeEventListener('pointerup',up); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
    if(dir==='v') this.vbar=bar; else this.hbar=bar;
    return bar;
  }
  _scrollBy(dir,d){
    if(dir==='v') this.viewport.scrollTop+=d; else this.viewport.scrollLeft+=d;
    this.update();
  }
  _geom(dir,bar){
    const len = dir==='v'?bar.clientHeight:bar.clientWidth;
    const arrows = bar.dbl?26:13;   // one group at each end
    const t0=arrows, t1=len-arrows;
    const trackLen=Math.max(8,t1-t0);
    const vv=this.viewport;
    const vis = dir==='v'?vv.clientHeight:vv.clientWidth;
    const tot = dir==='v'?vv.scrollHeight:vv.scrollWidth;
    const frac = tot>0?Math.min(1,vis/tot):1;
    const thumbLen = Math.max(14,Math.round(trackLen*frac));
    return {t0,t1,trackLen,thumbLen,frac,vis,tot};
  }
  _layout(dir,bar){
    const len = dir==='v'?bar.clientHeight:bar.clientWidth;
    if(!len) return;
    const g=this._geom(dir,bar);
    const pos=(el,off)=>{ if(dir==='v'){ el.style.top=off+'px'; el.style.left='0px'; }
      else { el.style.left=off+'px'; el.style.top='0px'; } };
    if(bar.dbl){
      pos(bar.a1,0); pos(bar.a2,12);
      pos(bar.b1,len-25); pos(bar.b2,len-13);
    } else { pos(bar.a1,0); pos(bar.a2,len-12); bar.b1.style.display='none'; bar.b2.style.display='none'; }
    const vv=this.viewport;
    const range = dir==='v'?(vv.scrollHeight-vv.clientHeight):(vv.scrollWidth-vv.clientWidth);
    const cur = dir==='v'?vv.scrollTop:vv.scrollLeft;
    const travel=g.trackLen-g.thumbLen;
    const off = g.t0 + (range>0?U.clamp(cur/range,0,1)*travel:0);
    if(dir==='v'){ bar.th.style.top=Math.round(off)+'px'; bar.th.style.left='0px';
      bar.th.style.width='12px'; bar.th.style.height=g.thumbLen+'px'; }
    else { bar.th.style.left=Math.round(off)+'px'; bar.th.style.top='0px';
      bar.th.style.height='12px'; bar.th.style.width=g.thumbLen+'px'; }
    bar.th.style.display = g.frac>=1?'none':'flex';
  }
  update(){
    if(this.v&&this.vbar) this._layout('v',this.vbar);
    if(this.h&&this.hbar) this._layout('h',this.hbar);
  }
  scrollTo(x,y){ if(y!=null)this.viewport.scrollTop=y; if(x!=null)this.viewport.scrollLeft=x; this.update(); }
  destroy(){ if(this._ro)this._ro.disconnect(); }
}

/* ============================================================
   9. Window Manager — the app_server analog
   ============================================================ */
const WM = (()=>{
  const wins=[];
  let z=100, focused=null, layer=null;
  let stageW=1024, stageH=768;

  function init(){
    layer=document.getElementById('windows');
    const st=document.getElementById('stage');
    stageW=st.clientWidth; stageH=st.clientHeight;
  }
  function bounds(){ const st=document.getElementById('stage');
    return {w:st.clientWidth,h:st.clientHeight}; }

  class Win {
    constructor(o){
      o=o||{};
      this.o=o;
      this.app=o.app||'Tracker';
      this.title=o.title||'untitled';
      this.ws = o.allWorkspaces?-1:(o.ws!=null?o.ws:Desk.ws);
      this.minw=o.minw||140; this.minh=o.minh||60;
      this.resizable=o.resizable!==false;
      this.key=o.key||null;
      this.tabOffset=o.tabOffset||0;
      this.modal=!!o.modal;
      this.subwin=!!o.subwin;

      const saved = this.key?State.view('win:'+this.key):null;
      const b=bounds();
      let w=o.w||360, h=o.h||220;
      let x=o.x, y=o.y;
      if(saved&&saved.w&&!o.forceGeom){ w=saved.w; h=saved.h; if(saved.x!=null){x=saved.x;y=saved.y;}
        if(saved.tabOffset!=null) this.tabOffset=saved.tabOffset; }
      if(x==null){ // cascade
        const n=wins.length;
        x=40+(n%9)*22; y=40+(n%9)*20;
      }
      w=Math.min(w,b.w-8); h=Math.min(h,b.h-30);
      x=U.clamp(x,-w+60,b.w-40); y=U.clamp(y,0,b.h-30);

      const el=U.div('win'); this.el=el;
      el.style.left=x+'px'; el.style.top=y+'px';
      el.style.width=w+'px'; el.style.height=h+'px';
      if(!this.resizable) el.classList.add('nores');

      const tabrow=U.div('tabrow'); this.tabrow=tabrow;
      const tab=U.div('wtab'); this.tab=tab;
      this.closeBox=U.div('wbox close');
      this.titleEl=U.div('wtitle',this.title);
      this.zoomBox=U.div('wbox zoom');
      tab.appendChild(this.closeBox); tab.appendChild(this.titleEl);
      if(o.zoomable!==false) tab.appendChild(this.zoomBox);
      tabrow.appendChild(tab);
      el.appendChild(tabrow);

      const frame=U.div('frame'); this.frame=frame;
      this.content=U.div('content');
      frame.appendChild(this.content);
      el.appendChild(frame);

      if(this.resizable){
        const knob=U.div('rsz');
        knob.innerHTML='<svg viewBox="0 0 14 14" width="14" height="14" shape-rendering="crispEdges">'+
          '<rect x="0" y="0" width="14" height="14" fill="#d8d8d8"/>'+
          '<path d="M13 3 L3 13 M13 7 L7 13 M13 11 L11 13" stroke="#8a8a8a" stroke-width="1" fill="none"/>'+
          '<path d="M13 4 L4 13 M13 8 L8 13 M13 12 L12 13" stroke="#ffffff" stroke-width="1" fill="none"/>'+
          '</svg>';
        frame.appendChild(knob);
        this.knob=knob;
        knob.addEventListener('pointerdown',e=>this._resize(e,'se'));
        ['e','s','w','n'].forEach(d=>{
          const g=U.div('rsz-'+d); frame.appendChild(g);
          g.addEventListener('pointerdown',e=>this._resize(e,d));
        });
      }

      // tab interactions
      tab.addEventListener('pointerdown',e=>this._tabDown(e));
      tab.addEventListener('dblclick',e=>{ U.stop(e); this.minimize(); });
      tab.addEventListener('contextmenu',e=>{ U.stop(e); this._tabMenu(e); });
      this.closeBox.addEventListener('pointerdown',e=>e.stopPropagation());
      this.closeBox.addEventListener('click',e=>{ U.stop(e);
        if(e.shiftKey) this.minimize(); else this.close(); });
      this.zoomBox.addEventListener('pointerdown',e=>e.stopPropagation());
      this.zoomBox.addEventListener('click',e=>{ U.stop(e); this.zoom(); });
      el.addEventListener('pointerdown',()=>{ if(!this.dead) this.focus(); },true);

      layer.appendChild(el);
      wins.push(this);
      this.zIndex(++z);
      this._fitTab();
      this.focus();
      if(this.ws!==-1 && this.ws!==Desk.ws) this.el.style.display='none';
      if(State.prefs.sounds.events.window) Sound.open();
      Deskbar.refreshTeams();
    }
    /* ---- geometry ---- */
    get x(){ return parseInt(this.el.style.left,10)||0; }
    get y(){ return parseInt(this.el.style.top,10)||0; }
    get w(){ return this.el.offsetWidth; }
    get h(){ return this.el.offsetHeight; }
    moveTo(x,y){ this.el.style.left=Math.round(x)+'px'; this.el.style.top=Math.round(y)+'px'; this._save(); }
    resizeTo(w,h){
      this.el.style.width=Math.max(this.minw,Math.round(w))+'px';
      this.el.style.height=Math.max(this.minh,Math.round(h))+'px';
      this._fitTab(); this._save(); this.emit('resize');
    }
    zIndex(v){ this.el.style.zIndex=v; this.z=v; }
    setTitle(t){ this.title=t; this.titleEl.textContent=t; this._fitTab(); Deskbar.refreshTeams(); }
    _fitTab(){
      // tab width follows title, clipped to window width (authentic Be behaviour)
      const pad = 20 + (this.o.zoomable!==false?17:0) + 10;
      const probe=U.el('span');
      probe.style.cssText='position:absolute;visibility:hidden;font:bold 10px var(--ui);letter-spacing:.2px';
      probe.textContent=this.title; document.body.appendChild(probe);
      const tw=Math.min(this.w-4, Math.max(52, probe.offsetWidth+pad));
      probe.remove();
      this.tabW=tw;
      this.tabOffset=U.clamp(this.tabOffset,0,Math.max(0,this.w-tw));
      this.tab.style.width=tw+'px';
      this.tab.style.left=this.tabOffset+'px';
    }
    _save(){
      if(!this.key) return;
      State.setView('win:'+this.key,{x:this.x,y:this.y,w:this.w,h:this.h,tabOffset:this.tabOffset});
    }
    /* ---- focus / stacking ---- */
    focus(){
      if(focused===this){ return; }
      if(focused){ focused.el.classList.add('inactive'); focused.emit('blur'); }
      focused=this;
      this.el.classList.remove('inactive');
      this.zIndex(++z);
      this.emit('focus');
      Deskbar.refreshTeams();
    }
    sendToBack(){
      const minz=Math.min.apply(null,wins.filter(w=>w!==this).map(w=>w.z||100).concat([100]));
      this.zIndex(minz-1);
      if(focused===this){
        const top=wins.filter(w=>w!==this&&w.visible).sort((a,b)=>b.z-a.z)[0];
        focused=null; if(top) top.focus(); else this.el.classList.add('inactive');
      }
    }
    get visible(){ return this.el.style.display!=='none'&&!this.minimized; }
    /* ---- tab drag: move window; shift = slide tab ---- */
    _tabDown(e){
      if(e.button!==0) return;
      U.stop(e);
      this.focus();
      const slide=e.shiftKey;
      const sx=e.clientX, sy=e.clientY;
      const ox=this.x, oy=this.y, otab=this.tabOffset;
      const b=bounds();
      let moved=false, raf=null, nx=ox, ny=oy;
      const apply=()=>{ raf=null;
        if(slide){ this.tabOffset=U.clamp(otab+(nx-ox),0,Math.max(0,this.w-this.tabW));
          this.tab.style.left=this.tabOffset+'px'; }
        else { this.el.style.left=nx+'px'; this.el.style.top=ny+'px'; }
      };
      const mv=ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        if(!moved&&Math.abs(dx)+Math.abs(dy)<2) return;
        moved=true;
        nx=ox+dx; ny=oy+dy;
        if(!slide){
          if(!ev.ctrlKey){ // keep tab reachable
            nx=U.clamp(nx,-this.w+50,b.w-40);
            ny=U.clamp(ny,0,b.h-24);
          }
        } else { nx=ox+dx; }
        if(!raf) raf=requestAnimationFrame(apply);
      };
      const up=()=>{
        document.removeEventListener('pointermove',mv);
        document.removeEventListener('pointerup',up);
        if(raf) cancelAnimationFrame(raf), apply();
        this._save();
      };
      document.addEventListener('pointermove',mv);
      document.addEventListener('pointerup',up);
    }
    _tabMenu(e){
      Menu.atEvent([
        {label:'Close',sc:'Alt+W',fn:()=>this.close()},
        {label:'Minimize',fn:()=>this.minimize()},
        {label:'Zoom',fn:()=>this.zoom()},
        {sep:true},
        {label:'Send to Back',fn:()=>this.sendToBack()},
        {label:'Move to Workspace',sub:Array.from({length:State.prefs.workspaces.count},(_,i)=>({
          label:'Workspace '+(i+1),marked:this.ws===i,fn:()=>this.setWorkspace(i)}))
          .concat([{sep:true},{label:'All Workspaces',marked:this.ws===-1,fn:()=>this.setWorkspace(-1)}])}
      ],e);
    }
    _resize(e,dir){
      if(!this.resizable) return;
      U.stop(e); this.focus();
      const sx=e.clientX, sy=e.clientY;
      const ox=this.x, oy=this.y, ow=this.w, oh=this.h;
      const b=bounds();
      let raf=null, st={};
      const apply=()=>{ raf=null;
        this.el.style.left=st.x+'px'; this.el.style.top=st.y+'px';
        this.el.style.width=st.w+'px'; this.el.style.height=st.h+'px';
        this._fitTab(); this.emit('resize');
      };
      const mv=ev=>{
        let dx=ev.clientX-sx, dy=ev.clientY-sy;
        let x=ox,y=oy,w=ow,h=oh;
        if(dir.indexOf('e')>=0) w=Math.max(this.minw,ow+dx);
        if(dir.indexOf('s')>=0) h=Math.max(this.minh,oh+dy);
        if(dir.indexOf('w')>=0){ w=Math.max(this.minw,ow-dx); x=ox+(ow-w); }
        if(dir.indexOf('n')>=0){ h=Math.max(this.minh,oh-dy); y=oy+(oh-h); }
        w=Math.min(w,b.w+200); h=Math.min(h,b.h+200);
        st={x,y,w,h};
        if(!raf) raf=requestAnimationFrame(apply);
      };
      const up=()=>{
        document.removeEventListener('pointermove',mv);
        document.removeEventListener('pointerup',up);
        if(raf) cancelAnimationFrame(raf),apply();
        this._save(); this.emit('resized');
      };
      document.addEventListener('pointermove',mv);
      document.addEventListener('pointerup',up);
    }
    zoom(){
      const b=bounds();
      if(!this.zoomed){
        this._pre={x:this.x,y:this.y,w:this.w,h:this.h};
        this.zoomed=true;
        this.el.style.left='0px'; this.el.style.top='0px';
        this.el.style.width=b.w+'px'; this.el.style.height=b.h+'px';
      } else {
        this.zoomed=false;
        this.el.style.left=this._pre.x+'px'; this.el.style.top=this._pre.y+'px';
        this.el.style.width=this._pre.w+'px'; this.el.style.height=this._pre.h+'px';
      }
      this._fitTab(); this.emit('resize'); this._save();
    }
    minimize(){
      this.minimized=true; this.el.style.display='none';
      Sound.close();
      const top=wins.filter(w=>w!==this&&w.visible).sort((a,b)=>b.z-a.z)[0];
      if(focused===this){ focused=null; if(top) top.focus(); }
      Deskbar.refreshTeams();
    }
    restore(){
      this.minimized=false;
      if(this.ws!==-1&&this.ws!==Desk.ws) Desk.setWorkspace(this.ws);
      this.el.style.display='';
      this.focus();
    }
    setWorkspace(i){
      this.ws=i;
      this.el.style.display=(i===-1||i===Desk.ws)&&!this.minimized?'':'none';
      Deskbar.refreshTeams();
    }
    close(){
      if(this.dead) return;
      if(this.onClose&&this.onClose()===false) return;
      this.dead=true;
      this.emit('close');
      if(State.prefs.sounds.events.window) Sound.close();
      const i=wins.indexOf(this); if(i>=0)wins.splice(i,1);
      this.el.remove();
      if(focused===this){
        focused=null;
        const top=wins.filter(w=>w.visible).sort((a,b)=>b.z-a.z)[0];
        if(top) top.focus();
      }
      Deskbar.refreshTeams();
      State.dirty();
    }
    /* ---- content helpers ---- */
    setMenuBar(defs){
      if(this.menubar) this.menubar.remove();
      const bar=U.div('menubar'); this.menubar=bar;
      this.menuDefs=defs;
      defs.forEach(d=>{
        const b=U.div('mb',d.label);
        b.addEventListener('pointerdown',e=>{
          U.stop(e); this.focus();
          b.classList.add('open');
          const r=U.rect(b), sr=U.rect(document.getElementById('stage'));
          Menu.open(typeof d.items==='function'?d.items():d.items,
            r.left-sr.left, r.bottom-sr.top,{onDone:()=>b.classList.remove('open')});
        });
        b.addEventListener('pointerenter',()=>{
          if(Menu.isOpen && !b.classList.contains('open') && bar.querySelector('.mb.open')){
            bar.querySelectorAll('.mb.open').forEach(x=>x.classList.remove('open'));
            b.dispatchEvent(new PointerEvent('pointerdown',{bubbles:false}));
          }
        });
        bar.appendChild(b);
      });
      this.frame.insertBefore(bar,this.content);
      return bar;
    }
    pad(px){ this.content.style.padding=(px==null?8:px)+'px'; return this.content; }
    /* simple event bus */
    on(ev,fn){ (this._ev=this._ev||{})[ev]=(this._ev[ev]||[]).concat(fn); return this; }
    emit(ev,a){ const l=this._ev&&this._ev[ev]; if(l)l.forEach(f=>{try{f(a);}catch(e){console.error(e);}}); }
  }

  function open(o){ return new Win(o); }
  function all(){ return wins.slice(); }
  function find(fn){ return wins.filter(fn); }
  function byApp(app){ return wins.filter(w=>w.app===app); }
  function showWorkspace(i){
    wins.forEach(w=>{
      const vis=(w.ws===-1||w.ws===i)&&!w.minimized;
      w.el.style.display=vis?'':'none';
    });
    const top=wins.filter(w=>w.visible).sort((a,b)=>b.z-a.z)[0];
    focused=null;
    wins.forEach(w=>w.el.classList.add('inactive'));
    if(top) top.focus();
  }
  function focusNext(back){
    const v=wins.filter(w=>w.visible&&!w.modal).sort((a,b)=>b.z-a.z);
    if(v.length<2) return;
    const w = back? v[v.length-1] : v[1];
    w.focus();
  }
  return {init,open,all,find,byApp,showWorkspace,focusNext,Win,
    get focused(){return focused;}, set focused(w){focused=w;}, bounds};
})();
