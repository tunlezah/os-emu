  }
};

/* ---- 91.proof.js ---- */
/* ==========================================================================
   MODULE 15b — THE PROOF. The exhibit claims the two processors are the
   architecture, not decoration. This takes over the machine and shows it
   the ordinary way — the power switch, the menu, diskettes in the drives,
   commands typed at the prompt — and every check reads the bus model's
   own state as the running modules left it. Nothing here makes a result;
   it only watches the packets, the processors and the screen.
   ========================================================================== */
const Proof = {
  last: '', running: false, rec: null, hooked: false, bar: null,
  hook() {
    if (this.hooked) return; this.hooked = true;
    Bus.on((t, d) => {
      const r = this.rec; if (!r) return;
      if (t === 'pkt' && d.phase === 'req') r.pkts.push({ from: d.from, to: d.to, fn: d.fn });
      else if (t === 'cpu') r.cpu.push({ id: d.id, state: d.state, task: d.task || '' });
      else if (t === 'exec') r.exec.push(d);
    });
  },
  /* a window on the record: everything that happened since mark() */
  mark() { return { p: this.rec.pkts.length, c: this.rec.cpu.length, e: this.rec.exec.length }; },
  since(m) { return { pkts: this.rec.pkts.slice(m.p), cpu: this.rec.cpu.slice(m.c), exec: this.rec.exec.slice(m.e) }; },
  status(t) {
    if (!this.bar) { this.bar = U.el('div', { class: 'toast' }, ''); $('#toasts').appendChild(this.bar); }
    this.bar.innerHTML = `<b>The proof is running.</b> ${U.esc(t)} <span style="color:#8b939c">— watch the panel. Keys are ignored until it finishes.</span>`;
  },
  async run() {
    if (this.running) return;
    this.hook(); this.running = true; this.rec = { pkts: [], cpu: [], exec: [] };
    const log = []; let pass = 0, fail = 0; const t0 = performance.now();
    const show = () => {
      this.last = log.join('\n'); const o = $('#prooflog'); if (o) o.innerHTML = this.last;
      const r = $('#proofres'); if (r) r.textContent = this.running ? `running — ${pass} passed${fail ? ', ' + fail + ' failed' : ''}` : `${pass} of ${pass + fail} checks passed`;
    };
    const head = t => { log.push(`\n<b>${U.esc(t)}</b>`); show(); this.status(t); };
    const check = (ok, t) => { log.push(`${ok ? '<span style="color:#7fdc8a">PASS</span>' : '<span style="color:#ff8a7a">FAIL</span>'}  ${U.esc(t)}`); if (ok) pass++; else fail++; show(); return ok; };
    const note = t => { log.push('      ' + U.esc(t)); show(); };
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const until = async (f, ms, what) => {
      const end = performance.now() + ms;
      while (!f()) { if (!FW.powered) throw new Error('the power was switched off'); if (performance.now() > end) throw new Error('timed out waiting for ' + what); await sleep(40); }
    };
    const idle = () => Con.waiters.length > 0 && VT.pending() === 0;
    const atPrompt = k => idle() && Bus.i88.state === 'poll' && Bus.i88.task.startsWith(k);
    const screen = () => VT.screenText(false);
    const type = async s => { await sleep(250); Con.push(s + '\r'); await sleep(60); };
    /* the ordinary prompt, answering MS-DOS's date and time questions on the way */
    const prompt = async (k, ms, what) => {
      const end = performance.now() + ms;
      while (!atPrompt(k)) {
        if (!FW.powered) throw new Error('the power was switched off');
        if (performance.now() > end) throw new Error('timed out waiting for ' + what);
        if (idle() && /Enter new (date|time)/.test(VT.lineText(VT.y))) { await sleep(300); Con.push('\r'); }
        await sleep(40);
      }
    };
    const menu = () => until(() => FW.state === 'menu' && VT.pending() === 0, 20000, 'the Main System Menu');
    const load = (a, b) => {
      for (const s of ['A', 'B']) if (RX50.slots[s]) RX50.eject(s);
      for (const [id, s] of [[a, 'A'], [b, 'B']]) {
        if (!id) continue; const d = Media.get(id); if (!d) return `the ${id} diskette is missing`;
        if (d.where === 'PC') PCdesk.eject();
        RX50.insert(d, s, s === 'B');
      }
      Museum.paintLibrary && Museum.paintLibrary(); return null;
    };
    /* what the visitor had: put back afterwards */
    const saved = { on: FW.powered, A: RX50.slots.A && [RX50.slots.A.id, RX50.slots.A.flipped], B: RX50.slots.B && [RX50.slots.B.id, RX50.slots.B.flipped], ab: FW.setup.autoBoot };
    const sink = KB.sink, first = Museum.first;
    KB.sink = () => { }; Museum.first = () => { };
    $('#guide').classList.remove('show');
    log.push(`Rainbow ${Machine.model}, ${Machine.memK}K, firmware ${Machine.fwVersion()}  —  ${new Date().toLocaleString()}`);
    try {
      /* ---- 1. power, self-test, menu */
      head('1. Power up: the 8088 runs the firmware; the Z80 is held in reset');
      load(null, null);
      if (FW.powered) { FW.power(false); await sleep(900); }
      FW.setup.autoBoot = '?';
      FW.power(true); await menu();
      check(Bus.exec === 'i88', 'the firmware and its menu run on the 8088');
      check(Bus.z80.state === 'reset', 'the Z80 is held in reset at the Main System Menu');

      /* ---- 2. terminal mode */
      head('2. T — terminal mode, with no diskette');
      let m = this.mark();
      FW.terminal(); await sleep(400);
      Line.tx('\r');
      await until(() => /Username:/.test(screen()), 12000, 'the VAX to offer Username:');
      let w = this.since(m);
      check(FW.state === 'terminal', 'the firmware is a VT102: keyboard ↔ communications port ↔ screen');
      check(w.pkts.filter(p => p.to === 'z80').length === 0 && Bus.z80.state === 'reset', 'no packet crossed to the Z80; it stayed in reset throughout');
      check(/Username:/.test(screen()), 'the VAX answered through the comm port: "Username:" is on the screen');
      FW.ctrlSetup(); await menu();

      /* ---- 3. CP/M-86/80 */
      head('3. CP/M-86/80 in drive A, the CP/M-80 programs in drive B');
      const miss = load('cpm8680', 'cpm80');
      if (miss || Media.get('cpm8680').boot !== 'cpm8680') { check(false, miss || 'the CP/M-86/80 diskette has been reformatted — reset the exhibit to factory defaults to restore it'); throw new Error('stopped'); }
      m = this.mark();
      FW.run(ctx => FW.boot(ctx, 'A'));
      await prompt('CCP:', 40000, 'the A> prompt');
      w = this.since(m);
      const bootRd = w.pkts.filter(p => p.from === 'i88' && p.to === 'z80' && p.fn === 0x13).length;
      check(bootRd > 10, `CP/M started: ${bootRd} READ SECTOR packets, 8088 → Z80, each one a sector the Z80 read from the RX50`);
      check(Bus.exec === 'i88' && Bus.z80.state === 'halt', 'at the A> prompt the CCP runs on the 8088; the Z80 is halted, waiting for disk requests');

      head('3a. B: then SIEVE — no SIEVE.CMD on B:, so SIEVE.COM, on the Z80');
      await type('B:'); await prompt('CCP:', 15000, 'the B> prompt');
      m = this.mark(); let zMaster = false, waited = false; const tz = performance.now();
      await type('SIEVE');
      await until(() => { if (Bus.exec === 'z80') zMaster = true; if (Bus.i88.state === 'wait' && /Z80 Service Routine/.test(Bus.i88.task)) waited = true; return zMaster && performance.now() - tz > 800; }, 20000, 'the Z80 to take over');
      await prompt('CCP:', 40000, 'SIEVE.COM to finish');
      const zSec = ((performance.now() - tz) / 1000).toFixed(1);
      w = this.since(m);
      const starts = w.pkts.filter(p => p.from === 'i88' && p.to === 'z80' && p.fn === 0x21).length;
      const bdos = w.pkts.filter(p => p.from === 'z80' && p.to === 'i88' && p.fn >= 0x40).length;
      const si = w.pkts.findIndex(p => p.fn === 0x21), pre = w.pkts.slice(0, si < 0 ? w.pkts.length : si).filter(p => p.from === 'i88' && p.to === 'z80' && p.fn === 0x13).length;
      check(starts === 1, 'the 8088 sent START Z80 AT 0100h (21h) across the shared memory');
      check(zMaster || w.exec.includes('z80'), 'while SIEVE.COM ran, the Z80 was the executing processor');
      check(waited || w.cpu.some(c => c.id === 'i88' && c.state === 'wait' && /Z80 Service Routine/.test(c.task)), 'the 8088 waited in its Z80 Service Routine');
      check(bdos > 0, `${bdos} BDOS packets Z80 → 8088: every character the Z80 printed crossed to the 8088, which owns the screen`);
      note(`Before the START, ${pre} sectors — Z80CCP.SYS, Z80.SYS and SIEVE.COM itself — each read by the Z80 at the 8088's request, into memory the Z80 would then run from.`);
      check(/1899 primes/.test(screen()), 'the answer is on the screen: 1899 primes');
      check(Bus.exec === 'i88', 'SIEVE.COM ended with BDOS 0; control came back to the CCP on the 8088');

      head('3b. A: then SIEVE — A: has SIEVE.CMD, and the 8088 runs it');
      await type('A:'); await prompt('CCP:', 15000, 'the A> prompt');
      m = this.mark(); const t8 = performance.now();
      await type('SIEVE');
      await until(() => Bus.i88.state === 'run' && /SIEVE/.test(Bus.i88.task), 20000, 'SIEVE.CMD to start');
      await prompt('CCP:', 40000, 'SIEVE.CMD to finish');
      const iSec = ((performance.now() - t8) / 1000).toFixed(1);
      w = this.since(m);
      check(!w.exec.includes('z80') && !w.pkts.some(p => p.fn === 0x21), 'no START Z80: the 8088 ran SIEVE.CMD itself');
      check(!w.cpu.some(c => c.id === 'z80' && c.state === 'run'), 'the Z80 only served the diskette: ' + w.pkts.filter(p => p.to === 'z80' && p.fn === 0x13).length + ' sectors, then halted');
      note(`Same prompt, same command, two processors: SIEVE.COM on the Z80 took ${zSec} s, SIEVE.CMD on the 8088 ${iSec} s.`);

      /* ---- 4. MS-DOS */
      head('4. MS-DOS V2.11 in drive A');
      if (Machine.memK < 128) {
        note(`Skipped: this Rainbow has ${Machine.memK}K, and MS-DOS needs 128K. Fit memory in the Machine panel and run the proof again.`);
      } else {
        FW.ctrlSetup(); await menu();
        const miss2 = load('msdos211', null);
        if (miss2 || Media.get('msdos211').boot !== 'msdos211') { check(false, miss2 || 'the MS-DOS diskette has been reformatted — reset the exhibit to factory defaults to restore it'); throw new Error('stopped'); }
        m = this.mark();
        FW.run(ctx => FW.boot(ctx, 'A'));
        await prompt('COMMAND.COM', 60000, 'the MS-DOS prompt');
        w = this.since(m);
        const dosRd = w.pkts.filter(p => p.from === 'i88' && p.to === 'z80' && p.fn === 0x13).length;
        check(dosRd > 10, `IO.SYS, MSDOS.SYS and COMMAND.COM came across as ${dosRd} READ SECTOR packets, 8088 → Z80`);
        check(Bus.exec === 'i88', 'MS-DOS runs on the 8088 alone');
        m = this.mark(); const rd0 = Bus.n.rd, z0 = Bus.n.toZ;
        await type('DIR'); await prompt('COMMAND.COM', 30000, 'DIR to finish');
        w = this.since(m);
        check(Bus.n.rd > rd0 && Bus.n.toZ > z0, `DIR: ${Bus.n.rd - rd0} sectors, each a packet to the Z80 — the 8088 never touches the drive`);
        check(w.cpu.some(c => c.id === 'z80' && c.state === 'serve' && /RX50 read/.test(c.task)), 'the Z80 served every read: its task was the RX50, the 8088 waited on its done flag');
        check(!w.exec.includes('z80'), 'no program ran on the Z80: under MS-DOS it is the diskette processor and nothing else');
        check(/File\(s\)/.test(screen()), 'the directory is on the screen');
      }
    } catch (e) {
      if (e && e.message !== 'stopped') check(false, 'interrupted: ' + (e && e.message || e));
    } finally {
      /* put the visitor's machine back as it was */
      KB.sink = sink; Museum.first = first; this.rec = null;
      FW.setup.autoBoot = saved.ab;
      try {
        load(null, null);
        for (const s of ['A', 'B']) { const v = saved[s]; const d = v && Media.get(v[0]); if (d && d.where === 'box') RX50.insert(d, s, v[1]); }
        Museum.paintLibrary && Museum.paintLibrary();
        if (!saved.on) FW.power(false); else if (FW.powered) FW.ctrlSetup();
      } catch (e) { console.error(e); }
      this.running = false;
      log.push(`\n<b>${pass} of ${pass + fail} checks passed</b> in ${((performance.now() - t0) / 1000).toFixed(0)} s.${fail ? '' : ' The two processors are the architecture.'}`);
      show();
      if (this.bar) { this.bar.remove(); this.bar = null; }
      Store.set('proof', { pass, fail, at: Date.now() });
      Guide.open('colophon');
      const o = $('#prooflog'); if (o) o.scrollIntoView({ block: 'end' });
    }
  }
};

/* ---- 95.museum.js ---- */
/* ==========================================================================
   MODULE 16 — THE MUSEUM SHELL. The rail, the layout of the desk, the
   diskette box, the machine configuration, the printer, the toasts in the
   museum's voice, and start-up. Everything here is outside the machine.
   ========================================================================== */
const Museum = {
  view: 'desk', seen: {}, keyGrab: null,
  init() {
    Snd.init(); Machine.load(); NVM; Media.load(); Win.load(); this.seen = Store.get('seen', {});
    Inst.init(); VT.init(); CRT.init(); KB.init(); FW.init(); Line.init(); Line.host = VAX; VAX.init && VAX.init();
    GFX.init && GFX.init(); PCdesk.init && PCdesk.init(); Guide.init && Guide.init();
    CRT.phosphor = Machine.monitor === 'color' ? 'color' : Machine.monitor; CRT.bright = Store.get('bright', 0.85); CRT.contrast = Store.get('contrast', 0.9);
    this.paintMachine(); this.buildLibrary(); this.buildConfig(); this.buildPrinter(); this.label();
    for (const d of Media.disks) if (d.where === 'A' || d.where === 'B') { RX50.slots[d.where] = d; }
    /* the RX50 shipped with a protective card in each slot; on the very first visit, so does this one */
    if (!Store.get('cardsOut', false) && !RX50.slots.A && !RX50.slots.B) { const c = Media.get('card'); if (c) { RX50.slots.A = c; c.where = 'A'; c.flipped = false; } }
    RX50.paint();
    this.keybar(); this.softKeys(); this.wire(); this.layout(); window.addEventListener('resize', () => this.layout());
    Bus.setMode('off', 'Power off');
    /* the label follows the machine: whatever takes it over sets the mode */
    Bus.on(t => { if (t === 'mode') { clearTimeout(this.labelT); this.labelT = setTimeout(() => this.label(), 120); } });
    if (!Store.get('introSeen', false)) this.intro(); else this.offToast = this.toast('<b>The machine is off.</b> The power switch is on the front of the system unit, at the left. <span class="gbtn" data-act="power">Switch it on</span>', 9000);
    setInterval(() => this.idle(), 1000);
  },
  /* ---------------- layout: the desk, or leaning in to the screen ---------------- */
  layout() {
    const st = $('#stage'), sc = $('#scene'); const W = st.clientWidth, H = st.clientHeight;
    const mon = $('#monitor'), su = $('#sysunit'), kb = $('#kbd'), db = $('#dbox'), rear = $('#rear'), cord = $('#kbcord');
    if (this.view === 'screen') {
      /* the monitor as large as the stage allows; the LK201's special keys in a bar beneath */
      const bar = $('#keybar'); bar.style.display = 'flex'; const bh = bar.offsetHeight + 10;
      /* on a narrow screen the page scrolls: the monitor takes the full width and the stage grows to fit it and the keys */
      const narrow = window.innerWidth <= 860;
      const mS = narrow ? (W - 12) / 820 : Math.min((W - 30) / 820, (H - bh - 14) / 670);
      if (narrow) st.style.height = Math.ceil(670 * mS + bh + 24) + 'px';
      sc.style.transform = 'none'; sc.style.width = W + 'px'; sc.style.height = H + 'px';
      mon.style.cssText = `left:${(W - 820 * mS) / 2}px;top:6px;transform:scale(${mS});transform-origin:0 0`;
      kb.style.cssText = 'display:none'; su.style.cssText = 'display:none'; db.style.display = 'none'; rear.style.display = 'none'; cord.style.display = 'none';
    } else {
      st.style.height = ''; const H2 = st.clientHeight, s = Math.min(W / 1320, H2 / 1230);
      sc.style.width = '1320px'; sc.style.height = '1230px';
      sc.style.transform = `translate(${(W - 1320 * s) / 2}px,${Math.max(0, (H2 - 1230 * s) / 2)}px) scale(${s})`;
      mon.style.cssText = ''; kb.style.cssText = ''; su.style.cssText = ''; db.style.display = ''; rear.style.display = ''; cord.style.display = ''; $('#keybar').style.display = 'none';
      this.cord();
    }
    CRT.size(); CRT.settle = 3; VT.dirty = true;
  },
  keybar() {
    const bar = U.el('div', { id: 'keybar' }); $('#stage').appendChild(bar);
    const groups = [['f1', 'f2', 'f3', 'f4', 'f5'], ['f6', 'f7', 'f8', 'f9', 'f10'], ['f11', 'f12', 'f13', 'f14'], ['help', 'do'], ['f17', 'f18', 'f19', 'f20'], ['find', 'ins', 'rem', 'sel', 'prev', 'next'], ['up', 'down', 'left', 'right'], ['pf1', 'pf2', 'pf3', 'pf4', 'kpminus', 'kpcomma', 'enter'], ['comp', 'ctrl', 'lock']];
    for (const g of groups) {
      const grp = U.el('div', { class: 'kbg' });
      for (const id of g) {
        const k = KB.byId[id]; if (!k) continue; const lbl = k.strip || (k.l2 && !/^F\d/.test(k.l1) ? k.l1 + ' ' + k.l2 : k.l1);
        const b = U.el('button', { class: 'kbk', 'data-k': id, title: k.l1 + (k.strip ? ' — ' + k.strip : '') }); b.textContent = id === 'kpminus' ? 'KP −' : id === 'kpcomma' ? 'KP ,' : id === 'enter' ? 'Enter' : lbl || k.l1;
        b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); KB.press(id, true); b.classList.add('down'); });
        const up = () => { KB.release(id); b.classList.remove('down'); if (id === 'ctrl' || id === 'lock') b.classList.toggle('on', id === 'lock' ? KB.lock : false); };
        b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
        grp.appendChild(b);
      }
      bar.appendChild(grp);
    }
    /* a phone or tablet has no LK201 and no hardware keys: its own keyboard types on the LK201 instead */
    const tg = U.el('div', { class: 'kbg' }), tb = U.el('button', { class: 'kbk', title: 'Bring up this device\'s own keyboard' }); tb.textContent = 'Type…';
    tb.addEventListener('click', () => this.softkb && this.softkb.focus()); tg.appendChild(tb); bar.appendChild(tg);
  },
  softKeys() {
    const t = U.el('textarea', { id: 'softkb', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Type on the Rainbow' });
    document.body.appendChild(t); this.softkb = t;
    const idFor = ch => {
      if (/^[a-z]$/i.test(ch)) return ['k' + ch.toUpperCase(), ch !== ch.toLowerCase()];
      if (ch === ' ') return ['space', false];
      for (const id in KB.CHARS) { const c = KB.CHARS[id]; if (c[0] === ch) return [id, false]; if (c[1] === ch) return [id, true]; }
      return null;
    };
    const type = ch => { const m = idFor(ch); if (!m) return; const sh = KB.shift; KB.shift = m[1]; KB.fire(m[0], ch); KB.shift = sh; };
    t.addEventListener('compositionend', e => { for (const ch of e.data || '') type(ch); t.value = ''; });
    t.addEventListener('beforeinput', e => {
      if (e.inputType === 'insertCompositionText') return;
      e.preventDefault(); Snd.ctx();
      if (e.inputType === 'insertText') for (const ch of e.data || '') type(ch);
      else if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') KB.fire('ret');
      else if (e.inputType === 'deleteContentBackward') KB.fire('del');
    });
    /* on a touch screen, tapping the glass brings the keyboard up */
    $('#mon-glass').addEventListener('click', () => { if (window.matchMedia && matchMedia('(pointer: coarse)').matches) t.focus(); });
  },
  cord() {
    /* the keyboard's coiled cord runs to the monitor, which carries it to the system unit */
    const svg = $('#kbcord'); let d = 'M 1150 905 C 1210 880, 1230 820, 1180 760'; let coil = '';
    for (let i = 0; i < 16; i++) { const t = i / 15; const x = 1150 + (1180 - 1150) * t + Math.sin(t * 3) * 40; const y = 905 - (905 - 740) * t; coil += `<ellipse cx="${x}" cy="${y}" rx="9" ry="4" fill="none" stroke="#3a3833" stroke-width="3"/>`; }
    svg.innerHTML = coil + `<path d="M 1060 700 C 1090 690, 1120 700, 1150 735" stroke="#3a3833" stroke-width="5" fill="none"/>`;
  },
  setView(v) {
    this.view = v; document.body.classList.toggle('rearview', v === 'rear');
    $('#bDesk').classList.toggle('on', v === 'desk'); $('#bScreen').classList.toggle('on', v === 'screen'); $('#bRear').classList.toggle('on', v === 'rear');
    if (v === 'rear') this.view = 'desk', document.body.classList.add('rearview');
    this.layout();
  },
  /* ---------------- wiring ---------------- */
  wire() {
    $('#pwr').addEventListener('click', () => this.powerToggle());
    for (const s of ['A', 'B']) {
      const el = $('#slot' + s);
      el.querySelector('.latch').addEventListener('click', e => { e.stopPropagation(); RX50.toggleDoor(s); });
      el.addEventListener('click', () => { if (RX50.slots[s]) { const d = RX50.eject(s); if (d && d.fmt === 'card') { Store.set('cardsOut', true); this.first('card'); } } else this.openLib(s); });
      el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('droptarget'); });
      el.addEventListener('dragleave', () => el.classList.remove('droptarget'));
      el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('droptarget'); const id = e.dataTransfer.getData('text/plain'); const d = Media.get(id); if (d) this.insertDisk(d, s); });
    }
    $('#dbox').addEventListener('click', () => this.openLib());
    $('#bDesk').onclick = () => this.setView('desk'); $('#bScreen').onclick = () => this.setView('screen'); $('#bRear').onclick = () => { document.body.classList.toggle('rearview'); $('#bRear').classList.toggle('on'); if (this.view === 'screen') this.setView('desk'), document.body.classList.add('rearview'); };
    $('#bDisks').onclick = () => this.openLib();
    $('#bPC').onclick = () => PCdesk.toggle && PCdesk.toggle();
    $('#bPrinter').onclick = () => this.togglePanel('prtpanel');
    $('#bConfig').onclick = () => this.togglePanel('cfgpanel');
    $('#bSound').onclick = () => { Snd.toggle(!Snd.on); $('#bSound').classList.toggle('on', Snd.on); };
    $('#bSound').classList.toggle('on', Snd.on);
    $('#bSide').onclick = () => { document.body.classList.toggle('noside'); this.layout(); };
    $('#bGuide').onclick = () => Guide.open && Guide.open();
    document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a) this.act(a.dataset.act, a); const c = e.target.closest('[data-close]'); if (c) $('#' + c.dataset.close).classList.remove('show'); });
    this.knob('#kBright', 'bright'); this.knob('#kContrast', 'contrast');
    /* panels can be dragged by their headers */
    for (const p of $$('.panel')) this.draggable(p);
  },
  knob(sel, prop) {
    const k = $(sel); const set = v => { CRT[prop] = U.clamp(v, 0.15, 1); k.style.setProperty('--rot', (CRT[prop] * 270 - 135) + 'deg'); CRT.settle = 4; Store.set(prop, CRT[prop]); };
    set(CRT[prop]); let y0 = 0, v0 = 0;
    k.addEventListener('pointerdown', e => { y0 = e.clientY; v0 = CRT[prop]; k.setPointerCapture(e.pointerId); const mv = ev => set(v0 + (y0 - ev.clientY) / 150); const up = () => { k.removeEventListener('pointermove', mv); k.removeEventListener('pointerup', up); }; k.addEventListener('pointermove', mv); k.addEventListener('pointerup', up); });
    k.addEventListener('wheel', e => { e.preventDefault(); set(CRT[prop] - Math.sign(e.deltaY) * 0.05); }, { passive: false });
  },
  draggable(p) {
    const h = p.querySelector('.ph'); if (!h) return;
    h.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; const r = p.getBoundingClientRect(); const dx = e.clientX - r.left, dy = e.clientY - r.top; h.setPointerCapture(e.pointerId); const mv = ev => { p.style.left = (ev.clientX - dx) + 'px'; p.style.top = Math.max(36, ev.clientY - dy) + 'px'; p.style.transform = 'none'; p.style.right = 'auto'; }; const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); }; h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); });
  },
  togglePanel(id) { $('#' + id).classList.toggle('show'); if (id === 'prtpanel') this.renderPaper(); if (id === 'cfgpanel') this.buildConfig(); },
  act(a, el) {
    if (a === 'power') { if (!FW.powered) this.powerToggle(); }
    else if (a === 'guide') Guide.open && Guide.open();
    else if (a.startsWith('tab:')) Guide.open && Guide.open(a.slice(4));
    else if (a === 'screen') this.setView('screen');
    else if (a === 'disks') this.openLib();
    else if (a === 'pc') PCdesk.toggle && PCdesk.toggle(true);
    else if (a === 'printer') this.togglePanel('prtpanel');
    else if (a === 'config') this.togglePanel('cfgpanel');
    else if (a.startsWith('insert:')) { const [, id, s] = a.split(':'); const d = Media.get(id); if (d) this.insertDisk(d, s); }
    else if (a === 'intro-close') { $('#intro').classList.remove('show'); Store.set('introSeen', true); }
    else if (a === 'intro-on') { $('#intro').classList.remove('show'); Store.set('introSeen', true); if (!FW.powered) this.powerToggle(); }
    else if (a === 'proof') Proof.run && Proof.run();
    else if (a === 'factory') this.factoryReset();
  },
  powerToggle() { Snd.ctx(); FW.power(!FW.powered); if (FW.powered) this.first('power'); },
  idle() {
    /* the firmware's automatic screen blank after 30 minutes idle (AUTO SCREEN BLANK in Set-Up) */
    if (FW.powered && FW.setup.autoBlank && FW.state !== 'blank' && performance.now() - (FW.lastKey || performance.now()) > 30 * 60000) { FW._saveBright = CRT.bright; FW.state = 'blank'; CRT.bright = 0.02; }
  },
  /* ---------------- toasts: the museum's voice ---------------- */
  toast(html, ms = 8000) {
    const t = U.el('div', { class: 'toast' }, html); $('#toasts').appendChild(t);
    while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
    setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 450); }, ms);
    return t;
  },
  first(k) {
    if (this.seen[k]) return; const m = (Guide.FIRST || {})[k]; if (!m) return;
    this.seen[k] = 1; Store.set('seen', this.seen); this.toast(m, 11000);
  },
  crash(e) { this.toast('<b>The exhibit hit a fault.</b> ' + U.esc(e && e.message || e) + ' — press Set-Up, then Ctrl/Set-Up, to reset the machine.', 12000); },
  onPower(on) { this.label(); if (on && this.offToast) { this.offToast.remove(); this.offToast = null; } },
  onMenu(msg) { this.label(); if (msg === 22) this.first('cardmsg'); },
  onTerminal() { this.label(); this.first('terminal'); },
  onDos() { this.label(); },
  onCpm() { this.label(); },
  /* ---------------- the museum label beside the machine ---------------- */
  label() { const L = $('#labelbox'); if (L && Guide.label) L.innerHTML = Guide.label(); },
  /* ---------------- the diskette box ---------------- */
  openLib(slot) { this.libSlot = slot || null; $('#lib').classList.add('show'); this.paintLibrary(); },
  buildLibrary() { },
  paintLibrary() {
    const g = $('#libgrid'); if (!g || !$('#lib').classList.contains('show')) return; g.innerHTML = '';
    for (const d of Media.disks) {
      const F = FMT[d.fmt] || {}; const cls = 'sleeve' + (F.kind === 'ibm' ? ' ibm' : d.fmt === 'wps' || d.fmt === 'pos' || d.fmt === 'vt180' ? ' other' : '') + (d.where !== 'box' ? ' inuse' : '') + (d.wp ? ' wprot' : '');
      const s = U.el('div', { class: cls, draggable: 'true', title: (d.note || '') });
      const where = d.where === 'box' ? '' : d.where === 'PC' ? ' — in the IBM PC' : ` — in drive ${d.where}${RX50.flippedWrong(d.where) ? ' (wrong way up!)' : ''}`;
      s.innerHTML = `<div class="lab"><b>${U.esc(d.label[0])}</b>${U.esc(d.label[1] || '')}<br><span style="color:#6a6358">${U.esc(d.label[2] || '')}${where}</span><span class="fmt">${U.esc(F.name || '')}</span></div><div class="wp"></div><div class="hole"></div><div class="win"></div><div class="acts"></div>`;
      const acts = s.querySelector('.acts');
      const btn = (t, f, tip) => { const b = U.el('button', { class: 'mbtn', title: tip || '' }, t); b.onclick = e => { e.stopPropagation(); f(); }; acts.appendChild(b); };
      if (d.where === 'box') {
        btn('Drive A', () => this.insertDisk(d, 'A'), 'Upper slot, label up');
        btn('Drive B', () => this.insertDisk(d, 'B'), 'Lower slot, label down — as the RX50 requires');
        if (PCdesk.insert) btn('IBM PC', () => PCdesk.insert(d), 'The PC on the next desk');
      } else if (d.where === 'A' || d.where === 'B') btn('Eject', () => { RX50.eject(d.where); this.paintLibrary(); });
      else if (d.where === 'PC') btn('Eject', () => { PCdesk.eject(); this.paintLibrary(); });
      if (d.fmt !== 'card') btn(d.wp ? 'Tab off' : 'Tab on', () => { d.wp = !d.wp; Media.save(); this.paintLibrary(); }, 'Write-protect tab');
      s.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', d.id); });
      g.appendChild(s);
    }
  },
  insertDisk(d, s) {
    if (d.where === 'PC' && PCdesk.eject) PCdesk.eject();
    if (d.where === 'A' || d.where === 'B') RX50.eject(d.where);
    if (RX50.slots[s]) { const o = RX50.eject(s); if (o && o.fmt === 'card') Store.set('cardsOut', true); }
    RX50.insert(d, s, s === 'B');
    this.paintLibrary(); $('#lib').classList.remove('show');
    const F = FMT[d.fmt]; if (F.kind === 'ibm') this.first('ibmdisk'); if (d.fmt === 'wps' || d.fmt === 'pos') this.first('otherdisk');
    this.toast(`<b>${U.esc(d.label[0])}</b> is in drive ${s}${s === 'B' ? ', label down' : ''}. ${FW.state === 'menu' ? `Type <b>${s}</b> at the menu to start from it.` : ''}`, 5000);
  },
  /* ---------------- the machine configuration ---------------- */
  buildConfig() {
    const P = $('#cfgpanel'); const off = !FW.powered; const M = Machine;
    const opt = (v, cur, lbl) => `<option value="${v}"${v == cur ? ' selected' : ''}>${lbl}</option>`;
    P.innerHTML = `<div class="ph">The machine <button class="mbtn x" data-close="cfgpanel">✕</button></div><div class="pb" style="width:360px">
      ${off ? '' : '<p style="color:#e8c46a;margin-bottom:8px">Switch the machine off to change its hardware.</p>'}
      <p><label>Model <select id="cfModel" ${off ? '' : 'disabled'}>${opt('100B', M.model, 'Rainbow 100B (1984) — 128K, Winchester boot')}${opt('100A', M.model, 'Rainbow 100A (1982) — 64K, diskettes only')}</select></label></p>
      <p style="margin-top:6px"><label>Memory <select id="cfMem" ${off ? '' : 'disabled'}>${M.MEM[M.model].map(k => opt(k, M.memK, k + 'K' + (k === M.MEM[M.model][0] ? ' (standard)' : ''))).join('')}</select></label></p>
      <p style="margin-top:6px"><label>Winchester <select id="cfWin" ${off && M.model === '100B' ? '' : 'disabled'}>${opt('none', M.win, 'none')}${opt('RD50', M.win, 'RD50 — 5 MB')}${opt('RD51', M.win, 'RD51 — 10 MB')}</select></label></p>
      <p style="margin-top:6px"><label><input type="checkbox" id="cfGfx" ${M.gfx ? 'checked' : ''} ${off ? '' : 'disabled'}> Color/Graphics option (7220, 384×240×16 or 800×240×4 of 4,096)</label></p>
      <p style="margin-top:6px"><label>Monitor <select id="cfMon">${opt('green', M.monitor, 'VR201 — green phosphor')}${opt('amber', M.monitor, 'VR201 — amber phosphor')}${opt('white', M.monitor, 'VR201 — white phosphor')}${opt('color', M.monitor, 'VR241 — colour')}</select></label></p>
      <hr style="border:0;border-top:1px solid #272b33;margin:10px 0">
      <p style="font-size:11.5px;color:#9aa1aa">The 100A variant is the machine as announced in May 1982: 64K, the original firmware, no Winchester boot, a louder AC fan, and a Compose key that only rings the bell. MS-DOS needs 128K.</p>
      <p style="margin-top:8px"><button class="mbtn warn" data-act="factory">Reset the exhibit to factory defaults…</button></p></div>`;
    const on = (id, f) => { const e = $('#' + id); if (e) e.onchange = f; };
    on('cfModel', e => { M.model = e.target.value; M.memK = M.MEM[M.model][0]; if (M.model === '100A') M.win = 'none'; M.save(); FW.setup = NVM.read(); FW.apply(); this.paintMachine(); this.buildConfig(); });
    on('cfMem', e => { M.memK = +e.target.value; M.save(); Inst.drawMap(); });
    on('cfWin', e => { M.win = e.target.value; M.save(); this.paintMachine(); });
    on('cfGfx', e => { M.gfx = e.target.checked; M.save(); this.paintMachine(); });
    on('cfMon', e => { M.monitor = e.target.value; M.save(); CRT.phosphor = M.monitor; CRT.settle = 4; this.paintMachine(); });
  },
  paintMachine() {
    $('#suplate').textContent = Machine.model === '100B' ? 'PC100-B' : 'PC100-A';
    $('#monplate').textContent = Machine.monitor === 'color' ? 'VR241' : 'VR201';
    $('.brand i').textContent = 'DEC Rainbow ' + Machine.model; $('#brandYear').textContent = Machine.model === '100B' ? '1984' : '1982';
    document.title = `DEC Rainbow ${Machine.model} (${Machine.model === '100B' ? 1984 : 1982}) — The OS Museum`;
    this.label();
  },
  factoryReset() {
    if (FW.powered) { this.toast('Switch the machine off first — the factory reset clears the NVM, every diskette and the Winchester.'); return; }
    if (!confirm('Reset the exhibit to factory defaults? This is the firmware\'s Shift/D for the whole exhibit: Set-Up, every file on every diskette, the Winchester, the VAX account and the machine configuration.')) return;
    Store.wipe(); Store.set('defaultsStored', true); Store.set('introSeen', true); location.reload();
  },
  /* ---------------- the printer ---------------- */
  buildPrinter() {
    const P = $('#prtpanel'); P.style.cssText = 'right:430px;top:60px;width:560px';
    P.innerHTML = `<div class="ph">LA50 — printer port, 4800 baud <button class="mbtn" id="tear">Tear off</button><button class="mbtn x" data-close="prtpanel">✕</button></div>
      <div class="pb" style="padding:0"><pre id="paper" style="margin:0;height:420px;overflow:auto;background:repeating-linear-gradient(#f7f5ee 0 18px,#eef3ea 18px 36px);color:#2a2a33;font:12px/18px var(--mono);padding:10px 26px;border-left:12px dotted #ddd;border-right:12px dotted #ddd;user-select:text;-webkit-user-select:text;white-space:pre-wrap"></pre></div>`;
    $('#tear').onclick = () => Printer.tear();
  },
  renderPaper() { const p = $('#paper'); if (!p) return; p.textContent = Printer.paper || '(the paper is blank — press Print Screen, or COPY a file to PRN)'; p.scrollTop = p.scrollHeight; },
  printerActive() { if (!$('#prtpanel').classList.contains('show')) { this.first('printer'); } },
  keyTarget(e, isDown) {
    if ($('#guide').classList.contains('show') || $('#intro').classList.contains('show')) { if (isDown && e.code === 'Escape') { $('#guide').classList.remove('show'); $('#intro').classList.remove('show'); } return true; }
    if (PCdesk.focused && PCdesk.focused()) { PCdesk.key(e, isDown); return true; }
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return true;
    if (isDown && e.ctrlKey && e.shiftKey && e.code === 'KeyG') { Guide.open && Guide.open(); e.preventDefault(); return true; }
    return false;
  },
  intro() {
    const I = $('#intro'); I.innerHTML = Guide.intro ? Guide.intro() : ''; I.classList.add('show');
  }
};

   START-UP. Every module is defined above; now the machine is assembled.

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => Museum.init()); else Museum.init();

</script>
