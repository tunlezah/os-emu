<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEC Rainbow 100B (1984) — The OS Museum</title>
<meta name="description" content="A single-file, in-browser simulation of the Digital Equipment Corporation Rainbow 100B of 1984: two processors on two buses joined by shared memory, a VT102 terminal in ROM, CP/M-86/80 dispatching 8-bit programs to the Z80 and 16-bit programs to the 8088, MS-DOS 2.11 against the IBM compatibility wall, the RX50 diskette nobody else could read, and a simulated VAX at the other end of the serial line. Built for The OS Museum.">
<!--
  ==========================================================================
  DEC Rainbow 100B (1984) — a single-file exhibit for The OS Museum.
  --------------------------------------------------------------------------
  THE THESIS. The right features, the wrong standard. In 1982 Digital
  Equipment Corporation built a personal computer that was better than the
  IBM PC on almost every line of the specification: two processors, a VT-
  class 132-column display with hardware smooth scrolling, the LK201
  keyboard, three operating systems from one menu, and a genuine VT102 in
  ROM. It was not IBM PC compatible, and by 1983 compatibility was the only
  line that mattered.

  BUILD ORDER CARRIES THE THESIS. The dual-processor and bus model was
  written first and every other module is its client: the firmware, both
  operating systems and the instrumentation panel. When MS-DOS reads a
  diskette, the 8088 really does build a request packet in shared memory
  and ring the Z80's doorbell, and the Z80 really does drive the RX50 and
  ring back; the panel draws those messages because they happen, not
  because it is told a story about them.

  ARTWORK. All original, drawn in code. No DEC logotype or its boxed-letter
  treatment, no rainbow badge, no reproduction of the industrial design of
  the system unit, the VR201 or the LK201: an original system in the same
  idiom, with a neutral placeholder wherever a mark would be — including on
  the boot screen. The character set is an original bitmap drawn for this
  file in the VT100 idiom, with DEC Special Graphics and the double-width
  and double-height line attributes.

  RESEARCH. Menus, Set-Up screens, error tables, the CP/M-86/80 cross-CPU
  protocol, MS-DOS 2.11's contents and the I/O map follow DEC's own
  documentation (EK-RB100-TM addendum, AA-P309A-TV, AA-P696A-TV, the MS-DOS
  V2.05 and V2.11 kits, the Rainbow Handbook 1984). Everything the visitor
  can create, and every program in the compatibility library, is original.

  VOCABULARY IS DELIBERATE. Diskette, not floppy. Winchester, not hard
  drive. Terminal mode. Set-Up. The editing keypad. PF keys. Compose.
  ==========================================================================
-->
<style>
/* ==========================================================================
   STYLE. The museum (rail, panels, label, guide) is drawn in the museum's
   own voice: dark, quiet, monospaced. The machine is drawn in the idiom of
   1984 office plastic — a putty system unit, a charcoal drive face, a long
   low keyboard — every surface an original gradient, nothing fetched.
   ========================================================================== */
:root{
  --mus-bg:#0b0c0e; --mus-panel:#131519; --mus-panel2:#181b20; --mus-edge:#272b33;
  --mus-fg:#e7e9ec; --mus-dim:#9aa1aa; --mus-faint:#5f6670;
  --mus-accent:#7fd4a0;            /* the Desktop wing, warmed to a P1 phosphor */
  --mus-accent2:#e8c46a; --mus-warn:#ff8f8f; --mus-z80:#6fb7ff; --mus-i88:#ffb454;
  --mono:ui-monospace,"SF Mono","Cascadia Code","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --putty:#d8d0bf; --putty-hi:#eae4d6; --putty-lo:#bcb3a0; --putty-dk:#968d7a;
  --char:#2a2a2c; --char-hi:#3a3a3d; --char-lo:#19191a;
  --key-lt:#e9e2d2; --key-lt2:#d6ceba; --key-dk:#aba594; --key-dk2:#938d7c; --legend:#34322c;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#08090b; color:var(--mus-fg); font-family:var(--sans);
  overflow:hidden; user-select:none; -webkit-user-select:none;
}
button{font-family:inherit;cursor:pointer}
code,kbd{font-family:var(--mono)}

/* ================= museum rail ================= */
#rail{position:fixed;left:0;right:0;top:0;height:36px;z-index:600;display:flex;align-items:center;gap:6px;
  padding:0 10px;background:linear-gradient(#17191e,#0e0f12);border-bottom:1px solid var(--mus-edge);font:12px var(--mono)}
#rail .brand{color:var(--mus-faint);letter-spacing:.14em;text-transform:uppercase;font-size:10px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
#rail .brand b{color:var(--mus-dim);font-weight:600}
#rail .brand i{font-style:normal;color:var(--mus-accent)}
#rail .spacer{flex:1}
.mbtn{background:#1a1d23;border:1px solid #2b3038;color:#c3c9d1;border-radius:4px;padding:4px 9px;font:11px var(--mono);
  letter-spacing:.04em;white-space:nowrap}
.mbtn:hover{border-color:#46505c;color:#fff}
.mbtn.on{background:#1f3527;border-color:#3d7a52;color:#bff0cf}
.mbtn.warn{border-color:#5a3434;color:#ffb3b3}
.mbtn:disabled{opacity:.4;cursor:default}
.mseg{display:inline-flex;border:1px solid #2b3038;border-radius:4px;overflow:hidden}
.mseg .mbtn{border:0;border-radius:0;border-right:1px solid #2b3038}
.mseg .mbtn:last-child{border-right:0}

/* ================= stage ================= */
#stage{position:fixed;left:0;top:36px;bottom:0;right:420px;overflow:hidden;
  background:
    radial-gradient(ellipse 80% 55% at 45% 18%, rgba(255,248,230,.07), transparent 70%),
    linear-gradient(#15161a 0%, #121316 58%, #2a241d 58.2%, #231e18 100%)}
body.noside #stage{right:0}
#scene{position:absolute;left:0;top:0;width:1320px;height:1230px;transform-origin:0 0}
#scene .comp{position:absolute}

/* ================= the monitor ================= */
#monitor{left:250px;top:10px;width:820px;height:700px}
#mon-case{position:absolute;left:0;top:0;width:820px;height:612px;border-radius:26px 26px 20px 20px;
  background:linear-gradient(175deg,var(--putty-hi) 0%,var(--putty) 35%,var(--putty-lo) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -6px 12px rgba(0,0,0,.18),0 18px 30px rgba(0,0,0,.45)}
#mon-bezel{position:absolute;left:44px;top:40px;width:732px;height:512px;border-radius:22px;
  background:linear-gradient(#c6bda9,#b1a893);box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.5)}
#mon-glass{position:absolute;left:22px;top:18px;width:688px;height:476px;border-radius:30px/36px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,#141a15 0%,#0a0d0b 70%,#050606 100%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.95),inset 0 0 6px rgba(0,0,0,.9)}
#crt{position:absolute;left:24px;top:22px;width:640px;height:432px;image-rendering:auto}
#gfxc{position:absolute;left:24px;top:22px;width:640px;height:432px;display:none;mix-blend-mode:screen}
#mon-glass::after{content:"";position:absolute;inset:0;border-radius:30px/36px;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 30% 18%,rgba(255,255,255,.07),transparent 60%),
             radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(0,0,0,.45) 100%)}
#mon-strip{position:absolute;left:44px;top:562px;width:732px;height:38px;display:flex;align-items:center;gap:14px;padding:0 18px}
.mark{position:relative;width:74px;height:18px;border:1px solid rgba(60,55,45,.35);border-radius:2px;
  background:repeating-linear-gradient(135deg,rgba(80,72,58,.10) 0 4px,transparent 4px 8px)}
.mark::after{content:"placeholder";position:absolute;left:0;right:0;top:4px;text-align:center;font:7px var(--mono);
  color:rgba(60,55,45,.55);letter-spacing:.2em;text-transform:uppercase}
.modelplate{font:10px var(--mono);color:#6e6656;letter-spacing:.18em}
.knob{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8c8577,#3f3b33 70%);
  box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.3);position:relative;cursor:ns-resize}
.knob::after{content:"";position:absolute;left:12px;top:3px;width:2px;height:8px;background:#e8e0cc;border-radius:1px;transform-origin:1px 10px;transform:rotate(var(--rot,0deg))}
.knoblbl{font:8px var(--mono);color:#6e6656;letter-spacing:.1em;text-transform:uppercase}
#mon-neck{position:absolute;left:330px;top:606px;width:160px;height:40px;
  background:linear-gradient(90deg,#a39a86,#c9c0ad 50%,#a39a86);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
#mon-base{position:absolute;left:230px;top:640px;width:360px;height:26px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(#d3cab8,#aaa18c);box-shadow:0 6px 10px rgba(0,0,0,.4)}
#mon-cable{position:absolute;left:780px;top:520px;width:120px;height:260px;pointer-events:none}

/* ================= the system unit ================= */
#sysunit{left:90px;top:666px;width:1140px;height:196px}
#su-top{position:absolute;left:14px;top:0;width:1112px;height:18px;border-radius:8px 8px 0 0;
  background:linear-gradient(#efe9dc,#d9d1c1)}
#su-front{position:absolute;left:0;top:16px;width:1140px;height:176px;border-radius:6px 6px 10px 10px;
  background:linear-gradient(#ddd5c4 0%,#cfc7b5 60%,#bbb29e 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 16px 26px rgba(0,0,0,.5)}
#su-vents{position:absolute;left:250px;top:40px;width:330px;height:96px;
  background:repeating-linear-gradient(90deg,rgba(70,64,52,.28) 0 3px,transparent 3px 11px);border-radius:3px;opacity:.7}
#su-badge{position:absolute;left:44px;top:46px;display:flex;flex-direction:column;gap:8px}
#su-badge .modelplate{font-size:11px}
#pwr{position:absolute;left:150px;top:108px;width:46px;height:40px;border-radius:5px;background:#2e2d2a;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.7);cursor:pointer}
#pwr .rock{position:absolute;left:6px;top:5px;width:34px;height:30px;border-radius:3px;
  background:linear-gradient(#4a4843,#2a2926);transition:transform .08s}
#pwr .rock::before{content:"1";position:absolute;left:0;right:0;top:2px;text-align:center;font:bold 10px var(--mono);color:#cfc8b8}
#pwr .rock::after{content:"0";position:absolute;left:0;right:0;bottom:1px;text-align:center;font:bold 10px var(--mono);color:#8b857a}
#pwr.on .rock{background:linear-gradient(#2a2926,#4a4843)}
#pwrlbl{position:absolute;left:140px;top:152px;width:66px;text-align:center;font:8px var(--mono);color:#6e6656;letter-spacing:.12em}

/* the RX50: two slots, one above the other, on a common spindle */
#rx50{position:absolute;left:668px;top:30px;width:430px;height:136px;border-radius:5px;
  background:linear-gradient(#343437,#232325);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 3px #b5ac98,0 0 0 4px #9c937f}
.slot{position:absolute;left:18px;width:394px;height:52px}
#slotA{top:10px} #slotB{top:74px}
.slot .mouth{position:absolute;left:38px;top:20px;width:300px;height:12px;border-radius:2px;background:#050506;
  box-shadow:inset 0 2px 4px #000,0 1px 0 rgba(255,255,255,.06)}
.slot .orange{position:absolute;left:52px;top:34px;width:24px;height:4px;background:#e0802a;border-radius:1px;opacity:0;transition:opacity .2s}
.slot.open .orange{opacity:1}
.slot .disk{position:absolute;left:44px;top:14px;width:288px;height:8px;border-radius:1px;background:#1b1b1d;opacity:0;
  box-shadow:inset 0 0 0 1px #3b3b3f}
.slot.loaded .disk{opacity:1}
.slot .disk .lbl{position:absolute;left:40px;top:1px;width:120px;height:5px;background:#e9e4d8;border-radius:1px}
.slot.flipped .disk .lbl{background:#2c2c2f}
.slot .latch{position:absolute;left:170px;top:8px;width:36px;height:36px;cursor:pointer}
.slot .latch .bar{position:absolute;left:14px;top:-4px;width:8px;height:44px;border-radius:4px;
  background:linear-gradient(90deg,#6a6a6f,#9c9ca3 45%,#58585c);box-shadow:0 2px 3px rgba(0,0,0,.6);
  transform-origin:4px 22px;transition:transform .18s ease-out;transform:rotate(90deg)}
.slot.open .latch .bar{transform:rotate(0deg)}
.slot .latch .hub{position:absolute;left:11px;top:11px;width:14px;height:14px;border-radius:50%;background:#7c7c82;box-shadow:inset 0 1px 1px rgba(255,255,255,.3)}
.slot .led{position:absolute;left:356px;top:21px;width:10px;height:10px;border-radius:50%;background:#3a1a12;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.slot .led.on{background:#ff6a3a;box-shadow:0 0 8px 2px rgba(255,90,40,.7)}
.slot .dl{position:absolute;left:8px;top:18px;font:bold 12px var(--mono);color:#77777d}
.slot .drop{position:absolute;inset:-4px;border-radius:6px;border:2px dashed transparent;pointer-events:none}
.slot.droptarget .drop{border-color:#7fd4a0}
#winlamp{position:absolute;left:980px;top:176px;display:none}

/* ================= the keyboard: LK201 in the idiom ================= */
#kbd{left:40px;top:878px;width:1240px;height:330px}
#kb-case{position:absolute;left:0;top:0;width:1240px;height:330px;border-radius:14px 14px 22px 22px;
  background:linear-gradient(#e2dbcb,#c9c0ad 70%,#b0a792);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 14px 24px rgba(0,0,0,.5)}
#kb-keys{position:absolute;left:24px;top:22px;width:1192px;height:292px}
.key{position:absolute;border-radius:5px;border:0;padding:0;color:var(--legend);font:9px/1.05 var(--sans);text-align:left;
  background:linear-gradient(#f3eee2,var(--key-lt) 55%,var(--key-lt2));
  box-shadow:0 3px 0 #a79f8b,0 4px 3px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .03s}
.key.dk{background:linear-gradient(#bdb7a7,var(--key-dk) 55%,var(--key-dk2));box-shadow:0 3px 0 #7d7768,0 4px 3px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.key .l1,.key .l2{position:absolute;left:5px;right:3px;white-space:nowrap;overflow:hidden}
.key .l1{top:4px} .key .l2{bottom:5px}
.key.c .l1,.key.c .l2{text-align:center;left:2px;right:2px}
.key.big .l1{font-size:13px;top:6px}
.key.sm .l1,.key.sm .l2{font-size:7.5px}
.key.down{transform:translateY(3px);box-shadow:0 0 0 #a79f8b,0 1px 1px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.key.latched{box-shadow:0 1px 0 #a79f8b,0 2px 2px rgba(0,0,0,.35),inset 0 0 0 2px rgba(127,212,160,.55)}
#kb-leds{position:absolute;left:890px;top:6px;display:flex;gap:18px}
.kled{display:flex;flex-direction:column;align-items:center;gap:2px}
.kled i{width:11px;height:5px;border-radius:2px;background:#5b3b2b;box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.kled.on i{background:#ffb347;box-shadow:0 0 6px 1px rgba(255,170,60,.8)}
.kled span{font:6.5px var(--mono);color:#5e5849;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
#kb-mark{position:absolute;left:30px;top:6px}
#kb-mark .mark{width:60px;height:12px}
#kb-mark .mark::after{top:2px;font-size:6px}
#kb-cord{position:absolute;pointer-events:none}

/* the diskette box on the desk */
#dbox{left:1150px;top:560px;width:150px;height:108px;cursor:pointer}
#dbox .box{position:absolute;left:0;bottom:0;width:150px;height:70px;border-radius:4px;
  background:linear-gradient(#5a5d63,#3c3e43);box-shadow:0 8px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
#dbox .sl{position:absolute;bottom:40px;width:118px;height:62px;border-radius:2px;background:#1c1c1e;box-shadow:0 0 0 1px #09090a}
#dbox .sl::after{content:"";position:absolute;left:10px;top:8px;width:60px;height:16px;background:#ece6d7;border-radius:1px}
#dbox .t{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:9px var(--mono);color:#c9ccd2;letter-spacing:.14em}
#dbox:hover .box{box-shadow:0 8px 14px rgba(0,0,0,.5),0 0 0 2px #7fd4a0}

/* the rear panel (flip view) */
#rear{left:90px;top:680px;width:1140px;height:176px;display:none;border-radius:6px;
  background:linear-gradient(#cbc3b1,#b3aa96);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 14px 24px rgba(0,0,0,.5)}
body.rearview #rear{display:block} body.rearview #sysunit{visibility:hidden}
.port{position:absolute;top:58px;height:40px;border-radius:6px 6px 14px 14px;background:#5d5d62;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.port::before{content:"";width:80%;height:40%;border-radius:3px;
  background:repeating-linear-gradient(90deg,#2a2a2d 0 3px,#8e8e95 3px 5px)}
.plbl{position:absolute;top:104px;font:9px var(--mono);color:#4f4a3f;letter-spacing:.12em;text-align:center}
.dled{width:9px;height:9px;border-radius:50%;background:#2f1a14;display:inline-block;margin:0 3px;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.dled.on{background:#ff5b3a;box-shadow:0 0 6px rgba(255,80,40,.8)}
#fan{position:absolute;left:40px;top:34px;width:110px;height:110px;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,#3f3f43 0 3px,#a39a86 3px 7px);opacity:.75}

/* ================= side panel: instruments + label ================= */
#side{position:fixed;right:0;top:36px;bottom:0;width:420px;background:var(--mus-panel);border-left:1px solid var(--mus-edge);
  display:flex;flex-direction:column;z-index:50}
body.noside #side{display:none}
#inst{flex:0 0 auto;padding:10px 12px 8px;border-bottom:1px solid var(--mus-edge);font:11px var(--mono);color:var(--mus-dim)}
#inst h3,#labelbox h3{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mus-faint);margin-bottom:6px;display:flex;align-items:center;gap:8px}
#inst h3 .modepill{margin-left:auto;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfe6ee;background:#1e232b;border:1px solid #333a45;border-radius:10px;padding:1px 8px;letter-spacing:.06em;text-transform:none;font-weight:500}
.cpus{display:grid;grid-template-columns:1fr 64px 1fr;gap:6px;align-items:stretch}
.cpu{border:1px solid #2a2f37;border-radius:6px;padding:6px 7px;background:#101216;position:relative;min-height:112px}
.cpu .nm{font:600 12px var(--mono);color:#e8ecf0;display:flex;justify-content:space-between}
.cpu .nm small{font-weight:400;color:var(--mus-faint);font-size:9.5px}
.cpu .st{margin-top:4px;font:600 10px var(--mono);letter-spacing:.08em}
.cpu .task{margin-top:2px;color:#c9d0d8;font-size:10.5px;min-height:28px;line-height:1.3}
.cpu .pc{color:var(--mus-faint);font-size:10px;margin-top:2px}
.cpu canvas{display:block;width:100%;height:22px;margin-top:4px}
.cpu.z80{border-color:#23384f} .cpu.i88{border-color:#4a3a22}
.cpu.z80 .st{color:var(--mus-z80)} .cpu.i88 .st{color:var(--mus-i88)}
.cpu.exec{box-shadow:0 0 0 1px currentColor inset}
.cpu.z80.exec{box-shadow:0 0 0 1px #3d7bc4,0 0 14px rgba(80,160,255,.25)}
.cpu.i88.exec{box-shadow:0 0 0 1px #c08a3a,0 0 14px rgba(255,170,70,.25)}
.shared{border:1px solid #2a2f37;border-radius:6px;background:linear-gradient(#141821,#12151b);position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;text-align:center}
.shared b{font-size:9px;color:#aeb6c0;letter-spacing:.06em}
.shared span{font-size:8.5px;color:var(--mus-faint)}
.shared .lane{position:absolute;left:0;right:0;top:50%;height:1px;background:#2c3440}
.pkt{position:absolute;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:2px;pointer-events:none}
.pkt.to80{background:var(--mus-i88);box-shadow:0 0 6px var(--mus-i88)}
.pkt.toz{background:var(--mus-z80);box-shadow:0 0 6px var(--mus-z80)}
.busses{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.bus{font-size:10px;color:#8f98a3}
.bus .dev{display:flex;align-items:center;gap:5px;line-height:1.55}
.bus .dev i{width:7px;height:7px;border-radius:50%;background:#262a31;flex:0 0 auto}
.bus .dev.act i{background:#7fd4a0;box-shadow:0 0 5px #7fd4a0}
.bus .dev.err i{background:#ff6b6b;box-shadow:0 0 5px #ff6b6b}
.bus .dev.off{opacity:.35}
.bus h4{font:600 9px var(--mono);letter-spacing:.14em;color:var(--mus-faint);text-transform:uppercase;margin-bottom:2px}
#pktlog{margin-top:7px;height:112px;overflow:hidden;background:#0c0e11;border:1px solid #22262d;border-radius:5px;padding:4px 6px;font-size:9.8px;line-height:1.42;color:#9aa3ad}
#pktlog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pktlog .z{color:#8ec8ff} #pktlog .e{color:#ffc680} #pktlog .x{color:#ff9d9d} #pktlog .n{color:#b9e8c8}
#memmap{margin-top:7px}
.mm{display:flex;height:13px;border-radius:3px;overflow:hidden;border:1px solid #262b33;margin-top:2px;position:relative}

#guide .gwrap{position:absolute;left:50%;top:18px;bottom:18px;width:min(1080px,94vw);transform:translateX(-50%);
  background:var(--mus-panel);border:1px solid var(--mus-edge);border-radius:10px;display:flex;overflow:hidden}
#gtabs{flex:0 0 210px;border-right:1px solid var(--mus-edge);overflow:auto;padding:10px 0;background:#101216}
#gtabs button{display:block;width:100%;text-align:left;background:none;border:0;color:#aab2bb;font:12px var(--mono);padding:6px 16px}
#gtabs button:hover{color:#fff;background:#171a1f}
#gtabs button.on{color:#bff0cf;background:#16241b;border-left:2px solid #7fd4a0;padding-left:14px}
#gbody{flex:1;overflow:auto;padding:22px 96px 30px 30px;font:14px/1.62 var(--sans);color:#d3d9df;user-select:text;-webkit-user-select:text}
#gbody h2{font:600 22px/1.25 var(--sans);color:#f3f5f7;margin:0 0 12px}
#gbody h3{font:600 15px var(--sans);color:#e9edf1;margin:18px 0 6px}
#gbody p{margin:0 0 11px;max-width:760px}
#gbody ul{margin:0 0 12px 20px;max-width:760px} #gbody li{margin:0 0 5px}
#gbody code{background:#1b1f25;border:1px solid #2a2f37;border-radius:3px;padding:0 4px;font-size:12.5px;color:#cfe8d6}
#gbody table{border-collapse:collapse;margin:6px 0 14px;font:12.5px var(--sans);max-width:780px}
#gbody td,#gbody th{border:1px solid #2a2f37;padding:5px 9px;text-align:left;vertical-align:top}
#gbody th{background:#171a1f;color:#e9edf1;font-weight:600}
#gbody .yes{color:#9fe0b4} #gbody .no{color:#ff9f9f} #gbody .meh{color:#e8c46a}
#gbody blockquote{border-left:3px solid #3d7a52;padding:4px 12px;margin:8px 0 14px;color:#c2cad2;max-width:740px}
#gclose{position:absolute;right:12px;top:10px}
.panel{position:fixed;z-index:650;display:none;background:var(--mus-panel);border:1px solid var(--mus-edge);border-radius:10px;
  box-shadow:0 20px 50px rgba(0,0,0,.6)}
.panel.show{display:block}
.panel .ph{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--mus-edge);font:600 11px var(--mono);
  letter-spacing:.12em;text-transform:uppercase;color:var(--mus-dim);cursor:move}
.panel .ph .x{margin-left:auto}
.panel .pb{padding:12px;font:12px/1.5 var(--sans);color:#cdd3da}
#toasts{position:fixed;left:18px;bottom:18px;z-index:900;display:flex;flex-direction:column;gap:8px;max-width:440px;pointer-events:none}
.toast{pointer-events:auto;background:rgba(19,22,27,.97);border:1px solid #2f3640;border-left:3px solid var(--mus-accent);border-radius:6px;
  padding:9px 12px;font:12.5px/1.5 var(--sans);color:#d8dee4;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .25s ease-out}
.toast b{color:#fff} .toast code{font:11.5px var(--mono);color:#cfe8d6}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* diskette library */
#lib{left:50%;top:70px;transform:translateX(-50%);width:min(980px,96vw);max-height:calc(100vh - 110px);overflow:auto}
#libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:12px}
.sleeve{position:relative;height:150px;border-radius:4px;background:#1d1d20;box-shadow:inset 0 0 0 1px #09090a,0 4px 10px rgba(0,0,0,.4);cursor:grab;overflow:hidden}
.sleeve .hole{position:absolute;left:50%;top:84px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:#0b0b0c;box-shadow:0 0 0 7px #26262a}

.sleeve .lab b{display:block;font-size:11px;color:#111}
.sleeve .lab .fmt{position:absolute;right:6px;bottom:4px;font-size:8.5px;color:#7a1f1f;letter-spacing:.08em}
.sleeve.ibm .lab{background:#dfe8f2} .sleeve.ibm{background:#26262b}
.sleeve.other .lab{background:#f2e3c9}
.sleeve .acts{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:4px}
.sleeve .acts .mbtn{padding:2px 7px;font-size:10px}
.sleeve.inuse{opacity:.45}
.sleeve .wp{position:absolute;right:0;top:36px;width:8px;height:14px;background:#0b0b0c}
.sleeve.wprot .wp{background:#b8b3a6}

/* the special-key bar in Screen view */
#keybar{position:absolute;left:0;right:0;bottom:0;display:none;flex-wrap:wrap;justify-content:center;gap:8px;padding:6px 10px 8px;
  background:linear-gradient(#17191e,#0f1013);border-top:1px solid var(--mus-edge);z-index:5}
#keybar .kbg{display:flex;gap:3px}
#keybar .kbk{background:linear-gradient(#bdb7a7,#a39d8d);border:0;border-radius:3px;color:#26241f;font:600 10px var(--sans);padding:5px 7px;

  #gtabs{flex:0 0 auto;max-height:26vh;border-right:0;border-bottom:1px solid var(--mus-edge)}

}

#libgrid{grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.sleeve{height:178px}
.sleeve .lab{height:auto;min-height:64px;display:flex;flex-direction:column}

.sleeve .win{top:130px}

<body>
<div id="rail">
  <div class="brand"><b>The OS Museum</b> — <i>DEC Rainbow 100B</i> · <span id="brandYear">1984</span> · simulation</div>
  <div class="spacer"></div>
  <div class="mseg"><button class="mbtn on" id="bDesk" title="The whole machine on the desk">Desk</button><button class="mbtn" id="bScreen" title="Lean in to the screen">Screen</button><button class="mbtn" id="bRear" title="Turn the system unit round">Rear</button></div>
  <button class="mbtn" id="bDisks" title="The diskette box">Diskettes</button>
  <button class="mbtn" id="bPC" title="The IBM PC on the next desk">IBM PC</button>
  <button class="mbtn" id="bPrinter" title="The LA50 on the printer port">Printer</button>
  <button class="mbtn" id="bConfig" title="Model, memory, options, monitor">Machine</button>
  <button class="mbtn on" id="bSound" title="Sound on/off">Sound</button>
  <button class="mbtn" id="bSide" title="Show/hide the instruments">Instruments</button>
  <button class="mbtn" id="bGuide" title="The museum guide">Guide</button>
</div>

<div id="stage">
  <div id="scene">
    <!-- the VR201-idiom monochrome monitor (original drawing) -->
    <div class="comp" id="monitor">
      <svg id="mon-cable" viewBox="0 0 120 260"><path d="M20 10 C 70 40, 90 120, 60 250" stroke="#2b2a27" stroke-width="9" fill="none" stroke-linecap="round"/></svg>
      <div id="mon-case">
        <div id="mon-bezel">
          <div id="mon-glass"><canvas id="crt"></canvas><canvas id="gfxc"></canvas></div>
        </div>
        <div id="mon-strip">
          <div class="mark" title="A neutral placeholder where the maker's mark sat"></div>
          <div class="modelplate" id="monplate">VR201</div>
          <div style="flex:1"></div>
          <div class="knoblbl">bright</div><div class="knob" id="kBright" title="Brightness — drag up or down"></div>
          <div class="knoblbl">contrast</div><div class="knob" id="kContrast" title="Contrast — drag up or down"></div>
        </div>
      </div>
      <div id="mon-neck"></div>
      <div id="mon-base"></div>
    </div>

    <!-- the system unit: a low putty box with the RX50 on its face -->
    <div class="comp" id="sysunit">
      <div id="su-top"></div>
      <div id="su-front">
        <div id="su-badge"><div class="mark" title="A neutral placeholder where the badge sat"></div><div class="modelplate" id="suplate">PC100-B</div></div>
        <div id="su-vents"></div>

        <div id="pwrlbl">POWER</div>

          <div class="slot" id="slotA" data-slot="A"><div class="dl">A</div><div class="mouth"></div><div class="disk"><div class="lbl"></div></div><div class="orange"></div><div class="latch" title="Drive A door"><div class="bar"></div><div class="hub"></div></div><div class="led"></div><div class="drop"></div></div>
          <div class="slot" id="slotB" data-slot="B"><div class="dl">B</div><div class="mouth"></div><div class="disk"><div class="lbl"></div></div><div class="orange"></div><div class="latch" title="Drive B door"><div class="bar"></div><div class="hub"></div></div><div class="led"></div><div class="drop"></div></div>

      <div id="fan" title="The power supply fan"></div>
      <div class="port" style="left:250px;width:120px" title="Communications port — 25 pins, RS-232, to the VAX"></div><div class="plbl" style="left:250px;width:120px">COMM</div>
      <div class="port" style="left:410px;width:120px" title="Printer port — serial, to the LA50"></div><div class="plbl" style="left:410px;width:120px">PRINTER</div>
      <div class="port" style="left:570px;width:90px" title="Video — 15 pins: monitor, keyboard data and +12V for the VR201"></div><div class="plbl" style="left:570px;width:90px">VIDEO</div>
      <div class="plbl" style="left:700px;top:40px;width:200px">DIAGNOSTIC LIGHTS</div>
      <div id="diaglights" style="position:absolute;left:712px;top:62px"></div>
      <div class="plbl" style="left:700px;top:84px;width:200px;font-size:8px">1 2 3 4 5 6 7</div>
      <div class="port" style="left:960px;width:110px;border-radius:6px" title="AC input"></div><div class="plbl" style="left:960px;width:110px">AC IN</div>
    </div>

    <div class="comp" id="kbd">
      <div id="kb-case">

      <div class="sl" style="left:12px"></div><div class="sl" style="left:20px;bottom:44px"></div><div class="sl" style="left:28px;bottom:48px"></div>
      <div class="box"><div class="t">DISKETTES</div></div>

    <svg class="comp" id="kbcord" style="left:0;top:0;width:1320px;height:1230px;pointer-events:none" viewBox="0 0 1320 1230"></svg>

<aside id="side">

<div class="panel" id="lib"><div class="ph">Diskette box <span style="font-weight:400;letter-spacing:0;text-transform:none;color:#6c737c">— drag a diskette onto a slot, or use its buttons. The lower slot takes its diskette label-down.</span><button class="mbtn x" data-close="lib">✕</button></div><div id="libgrid"></div></div>

<div class="panel" id="prtpanel"></div>
<div class="panel" id="cfgpanel"></div>

<script>
"use strict";

/* ---- 30.util.js ---- */
/* ==========================================================================
   MODULE 0 — UTILITIES AND PROCESS CONTEXTS.
   Everything that runs on the simulated machine is an async function holding
   a Ctx. Ctrl/Set-Up (the firmware reset) and the power switch kill the
   running Ctx, and every await inside it rejects with Killed, so nothing
   survives a reset that should not — exactly as a reset clears a machine.
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  pad: (n, w, c = ' ') => String(n).padStart(w, c),
  padr: (s, w, c = ' ') => String(s).padEnd(w, c),
  hex: (n, w = 2) => (n >>> 0).toString(16).toUpperCase().padStart(w, '0'),
  esc: s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])),
  hash(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; },
  rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  el(tag, attrs, html) { const e = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k === 'style') e.style.cssText = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if (html != null) e.innerHTML = html; return e; },
  now: () => performance.now(),
  /* the simulated calendar: the exhibit lives in the autumn of 1984, on today's day and month */
  simDate() { const d = new Date(); const s = new Date(1984, d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds()); return s; },
  DAYS: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
  MON: ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'],
  vmsDate(d = U.simDate(), withTime = true) { const t = `${U.pad(d.getDate(), 2)}-${U.MON[d.getMonth()]}-${d.getFullYear()}`; return withTime ? `${t} ${U.pad(d.getHours(), 2, '0')}:${U.pad(d.getMinutes(), 2, '0')}:${U.pad(d.getSeconds(), 2, '0')}.${U.pad(Math.floor(d.getMilliseconds() / 10), 2, '0')}` : t; },
  dosDate(ms) { const d = new Date(ms); return `${U.pad(d.getMonth() + 1, 2)}-${U.pad(d.getDate(), 2, '0')}-${String(d.getFullYear()).slice(2)}`; },
  dosTime(ms) { const d = new Date(ms); let h = d.getHours(); const ap = h >= 12 ? 'p' : 'a'; h = h % 12 || 12; return `${U.pad(h, 2)}:${U.pad(d.getMinutes(), 2, '0')}${ap}`; },
  wrapText(s, w) { const out = []; for (const para of String(s).split('\n')) { let line = ''; for (const word of para.split(/ +/)) { if ((line + ' ' + word).trim().length > w) { out.push(line); line = word; } else line = (line ? line + ' ' : '') + word; } out.push(line); } return out; },
  bytesOf: s => { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255; return a; }
};

class Killed extends Error { constructor() { super('killed'); this.killed = true; } }
class Ctx {
  constructor(name) { this.name = name; this.dead = false; this.waiters = new Set(); this.onKill = []; }
  kill() { if (this.dead) return; this.dead = true; for (const w of Array.from(this.waiters)) w(); this.waiters.clear(); for (const f of this.onKill) try { f(); } catch (e) { } }
  check() { if (this.dead) throw new Killed(); }
  sleep(ms) {
    this.check();
    return new Promise((res, rej) => {
      const k = () => { clearTimeout(t); rej(new Killed()); };
      const t = setTimeout(() => { this.waiters.delete(k); this.dead ? rej(new Killed()) : res(); }, Math.max(0, ms));
      this.waiters.add(k);
    });
  }
  /* make any promise abandonable by a reset */
  wrap(p) {
    this.check();
    return new Promise((res, rej) => {
      const k = () => rej(new Killed()); this.waiters.add(k);
      p.then(v => { this.waiters.delete(k); this.dead ? rej(new Killed()) : res(v); }, e => { this.waiters.delete(k); rej(e); });
    });
  }
  frame() { return this.wrap(new Promise(r => requestAnimationFrame(() => r()))); }
}
const isKilled = e => e && e.killed;

/* ==========================================================================
   MODULE 14 — STATE MANAGER. LocalStorage, every read and write guarded,
   because the page must work in a private window or with storage blocked.
   Keys: nvm (Set-Up per model), cfg (model, memory, options, monitor),
   media (the diskette library with every file created on it), win (the
   Winchester), vax (the simulated VAX account), pc, flags.
   ========================================================================== */
const Store = {
  P: 'osm.rainbow100.',
  get(k, d) { try { const v = localStorage.getItem(this.P + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(this.P + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(this.P + k); } catch (e) { } },
  wipe() { try { const ks = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(this.P)) ks.push(k); } ks.forEach(k => localStorage.removeItem(k)); } catch (e) { } },
  _t: {}, soon(k, fn, ms = 400) { clearTimeout(this._t[k]); this._t[k] = setTimeout(() => this.set(k, fn()), ms); }
};

/* ==========================================================================
   MODULE 13 — SOUND MANAGER. Synthesized, nothing fetched. The LK201's click
   and bell came from a small transducer in the keyboard driven by the
   keyboard's own processor; the click volume is a Set-Up parameter (Misc:
   CLICK VOL 1–8) and it defaults on, because it did. The RX50's two
   diskettes turn on one spindle and its heads step together; the 100A's
   AC fan is louder than the 100B's DC fan.
   ========================================================================== */
const Snd = {
  on: true, ac: null, master: null, loops: {},
  init() { this.on = Store.get('sound', true); },
  ctx() {
    if (!this.on) return null;
    if (!this.ac) {
      try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = 0.8; this.master.connect(this.ac.destination); } catch (e) { return null; }
    }
    if (this.ac.state === 'suspended') this.ac.resume().catch(() => { });
    return this.ac;
  },
  toggle(v) { this.on = v; Store.set('sound', v); if (!v) { for (const k in this.loops) this.stopLoop(k); if (this.ac) this.ac.suspend().catch(() => { }); } else { this.ctx(); Museum.syncLoops && Museum.syncLoops(); } },

/* ==========================================================================
   MODULE 1 — THE DUAL-PROCESSOR AND BUS MODEL. Written first; everything
   else is its client, and the instrumentation panel is its first client.

   THE HARDWARE AS DEC DOCUMENTED IT. Two 8-bit buses joined only by RAM.
   The Z80A (4.012 MHz) owns a bus carrying the RX50 controller (an FD1793)
   and 2K of private RAM; it can see 62K of the low 64K bank. The 8088
   (4.815 MHz) owns a bus carrying the video (DC011/DC012, 4K screen RAM
   and 4K attribute RAM), the keyboard's 8251A, the 7201 MPSC for the
   communications and printer ports, the Winchester controller, the
   graphics option, the NVM that holds Set-Up, the ROM, all of the RAM,
   and its own 2K that the Z80 cannot see (the interrupt vectors live
   there, which is why the two never collide).

   THE DIVISION OF LABOUR. The Z80 performs every diskette access for both
   processors. When the 8088 wants a sector it builds a message packet in
   shared memory, stores the packet's address at an agreed location and
   writes I/O port 00h, which interrupts the Z80 (RST 30h). The Z80 does
   the work on the FD1793, writes a status into the packet and writes its
   own port 00h, which interrupts the 8088 (INT 27h — "interrupt 39" in
   the CP/M-86/80 design manual). The roles reverse when the 8088 asks the
   Z80 to start an 8-bit program: the Z80 becomes master and the 8088
   waits in a service loop for BDOS requests, because the keyboard and the
   screen are on the 8088's bus and the Z80 cannot touch them. Packet
   function codes are DEC's: 13h read sector, 14h write sector, 15h check
   media, 21h start Z80 at an address, 22h move block, 40h+n BDOS n.

   Nothing in this module draws. It keeps the state and emits events; the
   Inst object below is one listener, the structural test is another.
   ========================================================================== */
class CPU {
  constructor(id, name, mhz) { this.id = id; this.name = name; this.mhz = mhz; this.hist = new Array(60).fill(0); this.reset(); }
  reset() { this.state = 'off'; this.task = ''; this.where = ''; this.load = 0; this.target = 0; this.role = ''; }
}

  z80: new CPU('z80', 'Z80A', 4.012),
  i88: new CPU('i88', '8088', 4.815),
  exec: null,            /* which processor is running the foreground program */
  mode: 'off', modeLabel: 'Power off',
  seq: 0, depth: 0,
  n: { toZ: 0, to88: 0, rd: 0, wr: 0, bdos: 0, hd: 0, starts: 0, ibmWrites: 0, ibmPorts: 0 },
  L: [],
  on(f) { this.L.push(f); },
  emit(type, d) { for (const f of this.L) try { f(type, d); } catch (e) { console.error(e); } },
  cpu(id) { return id === 'z80' ? this.z80 : this.i88; },
  other(id) { return id === 'z80' ? 'i88' : 'z80'; },
  /* the one call every client uses to say what a processor is doing */
  set(id, state, task, where, load) {

  setExec(id) { this.exec = id; this.emit('exec', id); },
  setMode(mode, label) { this.mode = mode; this.modeLabel = label; this.emit('mode', { mode, label }); },
  power(on) {

/* ---- 50.machine.js ---- */

/* ==========================================================================

   comm channel of the 7201 MPSC, and a cable to a VAX. Characters travel at
   the line rate — 960 a second at 9600 baud — in both directions. The
   Rainbow's receive buffer is 255 characters; when it passes its high-water
   mark the firmware sends XOFF (if AUTO XON/XOFF is set) and the host
   stops, which is how Hold Screen and a smooth scroll avoid losing text.
   A baud-rate or parity mismatch garbles the line, as it did.
   ========================================================================== */

/* ==========================================================================
   THE LA50 on the printer port — serial, 4800 baud, 8N, as DEC shipped

   machine, the printer's data register.

/* ---- 51.fw.js ---- */
/* ==========================================================================

   the 100A's terse "not ready" or "boot load". Fatal errors ring three

   the back of the system unit.

  17: ['Main Board', 'video ram', true], 18: ['Main Board', 'Z80 crc', true], 19: ['Main Board', 'ram 0-64K', true], 20: ['Main Board', 'unsolicited interrupt, Z80', true],
  21: ['Drive Not Ready', 'not ready'], 22: ['Remove Card or Diskette', 'remove card'], 23: ['Non-System Diskette', 'non-system disk'], 24: ['New Memory Size = ', 'new memory size = '],
  25: ['Set-Up Defaults Stored', 'set-up defaults'], 26: ['Main Board', 'ram arbitration', true], 27: ['Memory Board', 'ram option'], 28: ['RX50 Controller Board', 'rx50 controller'],
  29: ['Main Board', 'Z80 response'], 30: ['Main Board', 'rom crc, rom 0', true], 33: ['Main Board', 'contention', true], 40: ['Main Board', 'printer port'], 50: ['Main Board', 'keyboard port', true], 60: ['Main Board', 'comm. port']

  init() {

  },

  /* ------------------------------------------------------------------ self-test */
  async powerUp(ctx, kind) {

  /* a key, with the escape sequences the LK201 sends parsed back into names */

/* ==========================================================================
   MODULE 6 — THE RX50, THE WINCHESTER, AND THE MEDIA.

   THE RX50. One drive, two 5¼-inch slots one above the other, on a common
   spindle: both diskettes turn whenever the motor runs, and one head
   carriage steps both heads together. Each diskette is single-sided,
   96 tracks per inch, 80 tracks of 10 sectors of 512 bytes — 400K — with
   a 2:1 interleave on the data tracks. The heads read the underside of
   each diskette, so the upper slot takes its diskette label-up and the
   lower slot label-down. The same physical diskettes went into the DECmate
   II and the Professional 350, each of which wrote a file structure the
   other two could not read.

   THE WALL IN BOTH DIRECTIONS, AS DOCUMENTED. DEC's MS-DOS driver
   identified and read the IBM PC's single-sided 8- and 9-sector formats
   and the VT180's; it could write them too, but the RX50's narrow 96-tpi
   head could not erase the IBM's wide 48-tpi track, so what it wrote was
   usually unreadable on the PC. It could not read the double-sided 360K
   diskette that every PC wrote by default from 1983: it saw one side of
   it, took it for a single-sided diskette, and read the wrong sectors. And
   no IBM PC could read an RX50 diskette at all without special software.

   The file systems are logical (a directory of names and sizes and
   contents) but every operation on them is paid for in real sectors,
   real head steps and real cross-CPU packets.
   ========================================================================== */
const FMT = {
  msdos: { name: 'RX50 · MS-DOS', kind: 'rx50', spt: 10, tracks: 80, sides: 1, cap: 393216, dirMax: 96, clus: 512 },
  cpm: { name: 'RX50 · CP/M-86/80', kind: 'rx50', spt: 10, tracks: 80, sides: 1, cap: 399360, dirMax: 128, clus: 2048 },
  rx50: { name: 'RX50 · pre-formatted', kind: 'rx50', spt: 10, tracks: 80, sides: 1, cap: 0 },
  blank: { name: 'unformatted', kind: 'rx50', spt: 0, tracks: 80, sides: 1, cap: 0 },
  wps: { name: 'RX50 · DECmate II WPS', kind: 'rx50', spt: 10, tracks: 80, sides: 1 },
  pos: { name: 'RX50 · Professional P/OS', kind: 'rx50', spt: 10, tracks: 80, sides: 1 },
  vt180: { name: 'VT180 · CP/M-80', kind: 'rx18', spt: 9, tracks: 40, sides: 1, cap: 174080, dirMax: 64, clus: 1024 },
  'ibm-ss8': { name: 'IBM PC · SS/DD 160K', kind: 'ibm', spt: 8, tracks: 40, sides: 1, cap: 160256, dirMax: 64, clus: 512 },
  'ibm-ss9': { name: 'IBM PC · SS/DD 180K', kind: 'ibm', spt: 9, tracks: 40, sides: 1, cap: 179712, dirMax: 64, clus: 512 },
  'ibm-ds9': { name: 'IBM PC · DS/DD 360K', kind: 'ibm', spt: 9, tracks: 40, sides: 2, cap: 362496, dirMax: 112, clus: 1024 },
  card: { name: 'protective card', kind: 'card', spt: 0 }
};
const DATE84 = (m, d, h = 10, mi = 0) => new Date(1984, m - 1, d, h, mi).getTime();
const DATE83 = (m, d, h = 10, mi = 0) => new Date(1983, m - 1, d, h, mi).getTime();
/* Windows 1.03 for the Rainbow is from 1986, two years after this 100B: it is in the box as a later curiosity */
const DATE86 = new Date(1986, 7, 18, 12, 0).getTime();

/* ---------------- a logical MS-DOS file system (FAT semantics) ---------------- */
const DosFS = {
  mk(vol, files) { const fs = { type: 'dos', vol: vol || '', root: { a: 16, d: {} } }; for (const f of files || []) this.put(fs, f.n, f); return fs; },
  split(path) { return path.replace(/\//g, '\\').split('\\').filter(Boolean).map(s => s.toUpperCase()); },
  dir(fs, parts) { let d = fs.root; for (const p of parts) { const e = d.d[p]; if (!e || !(e.a & 16)) return null; d = e; } return d; },
  put(fs, path, f) {
    const parts = this.split(path); const name = parts.pop(); let d = fs.root;
    for (const p of parts) { if (!d.d[p]) d.d[p] = { n: p, a: 16, t: f.t || DATE84(9, 1), d: {} }; d = d.d[p]; }
    const e = Object.assign({ a: 32, t: DATE84(9, 1) }, f, { n: name }); if (e.x != null && e.s == null) e.s = e.x.length; d.d[name] = e; return e;
  },
  used(fs) { const F = FMT[fs.fmt || 'msdos']; const cl = F && F.clus || 512; let n = 0; const walk = d => { for (const k in d.d) { const e = d.d[k]; if (e.a & 16) { n += cl; walk(e); } else n += Math.ceil((e.s || 0) / cl) * cl; } }; walk(fs.root); return n; }
};
const CpmFS = {
  mk(files) { return { type: 'cpm', files: (files || []).map(f => Object.assign({ u: 0 }, f)) }; },
  used(fs) { let n = 0; for (const f of fs.files) n += Math.max(1, Math.ceil((f.s || 0) / 2048)) * 2048; return n; }
};

/* ---------------- the diskette library ---------------- */
const Media = {
  disks: [], ver: 7,
  get(id) { return this.disks.find(d => d.id === id); },
  save() { Store.soon('media', () => ({ ver: this.ver, disks: this.disks })); },
  load() { const s = Store.get('media', null); if (s && s.ver === this.ver && Array.isArray(s.disks)) this.disks = s.disks; else this.disks = Library.build(); for (const d of this.disks) if (d.where !== 'box' && d.where !== 'PC') d.where = 'box'; },
  reset() { this.disks = Library.build(); this.save(); }
};

/* ==========================================================================
   THE RX50 DRIVE (on the Z80's bus). Every call here is made by the Z80,
   inside a Bus.request handler — that is the architecture, and it is what
   makes the instrumentation honest.
   ========================================================================== */
const RX50 = {
  slots: { A: null, B: null }, door: { A: 'closed', B: 'closed' }, head: 0, motor: false, motorT: null, busy: false,
  el(s) { return $('#slot' + s); },
  flippedWrong(s) { const d = this.slots[s]; if (!d || d.fmt === 'card') return false; return s === 'A' ? !!d.flipped : !d.flipped; },
  /* the drive's physical front: latches, the orange strip, the diskette edge, the busy lights */
  paint() {
    for (const s of ['A', 'B']) {
      const e = this.el(s); if (!e) continue; const d = this.slots[s];
      e.classList.toggle('open', this.door[s] === 'open'); e.classList.toggle('loaded', !!d); e.classList.toggle('flipped', !!(d && d.flipped));
      e.title = d ? `Drive ${s}: ${d.label[0]}${this.flippedWrong(s) ? ' — inserted the wrong way up' : ''}` : `Drive ${s}: empty`;
    }
    Museum.paintLibrary && Museum.paintLibrary();
  },
  lights(on, s) { for (const k of ['A', 'B']) { const l = this.el(k) && this.el(k).querySelector('.led'); if (l) l.classList.toggle('on', !!on && (s ? s === k : false)); } },
  toggleDoor(s) {
    this.door[s] = this.door[s] === 'open' ? 'closed' : 'open'; Snd.latch(); this.paint();
    OS.mediaChanged && OS.mediaChanged(s);
    if (this.door[s] === 'open') Museum.first('door');
  },
  insert(d, s, flipped) {
    if (this.slots[s]) return 'occupied';
    if (this.door[s] !== 'open') { this.door[s] = 'open'; }
    if (d.where === 'A' || d.where === 'B') this.slots[d.where] = null;
    d.where = s; d.flipped = flipped == null ? s === 'B' : flipped; this.slots[s] = d;
    this.door[s] = 'closed'; Snd.latch(); this.paint(); Media.save(); OS.mediaChanged && OS.mediaChanged(s);
    return 'ok';
  },
  eject(s) { const d = this.slots[s]; if (!d) return null; this.door[s] = 'open'; this.slots[s] = null; d.where = 'box'; Snd.latch(); this.paint(); Media.save(); OS.mediaChanged && OS.mediaChanged(s); return d; },
  stop() { clearTimeout(this.motorT); this.motor = false; Snd.stopLoop('motor'); this.lights(false); },
  async spin(ctx) {
    clearTimeout(this.motorT);
    if (!this.motor) { this.motor = true; Snd.motor(); await ctx.sleep(260); }
    this.motorT = setTimeout(() => { this.motor = false; Snd.stopLoop('motor'); }, 2600);
  },
  async seek(ctx, t) {
    const n = Math.abs(t - this.head); if (!n) return;
    for (let i = 0; i < n; i++) { if (i % 2 === 0 || n < 6) Snd.step(); await ctx.sleep(n > 10 ? 3 : 6); }
    this.head = t; await ctx.sleep(16);
  },
  /* can the Z80 read this slot at all? returns an error name or null */
  check(s) {
    const d = this.slots[s];
    if (!d || this.door[s] !== 'closed') return 'notready';
    if (d.fmt === 'card') return 'card';
    if (this.flippedWrong(s)) return 'notready';
    return null;
  },
  /* one physical transfer of n sectors on track t: motor, seek, rotation, data */
  async xfer(ctx, s, t, n, write) {
    Bus.dev('fdc'); this.lights(true, s); await this.spin(ctx); await this.seek(ctx, t);
    const seq = this.lastT === t; this.lastT = t;
    await ctx.sleep((seq ? 4 : 40 + Math.random() * 120) + n * (write ? 42 : 34));
    this.lights(false); Bus.io('z80', write ? 'out' : 'in', 0x63, null, null);
  },
  async readBoot(ctx, s) {
    const e = this.check(s);
    await this.spin(ctx); this.lights(true, s); await this.seek(ctx, 0); await ctx.sleep(220); this.lights(false);
    if (e === 'card') return { ok: false, msg: 22 };
    if (e) return { ok: false, msg: FW.model === '100B' ? 21 : 12 };
    const d = this.slots[s];
    if (d.fmt === 'blank') { await ctx.sleep(600); return { ok: false, msg: FW.model === '100B' ? 9 : 11 }; }
    if (d.boot === 'vt180') return { ok: false, msg: 29 };
    if (!d.boot || FMT[d.fmt].kind !== 'rx50') return { ok: false, msg: 23 };
    return { ok: true, boot: d.boot, disk: d };
  },
  async selfTest(ctx, s) {
    const d = this.slots[s];
    if (!d || this.door[s] !== 'closed' || this.flippedWrong(s)) { await ctx.sleep(500); return 12; }
    if (d.fmt === 'blank') { await this.spin(ctx); await this.seek(ctx, 40); return 5; }
    if (d.fmt === 'card') return 22;
    if (FMT[d.fmt].kind !== 'rx50') { await this.spin(ctx); await this.seek(ctx, 20); return 5; }
    this.lights(true, s); await this.spin(ctx); for (const t of [0, 79, 40, 0]) await this.seek(ctx, t); await ctx.sleep(300); this.lights(false);
    return 0;
  }
};

/* ==========================================================================
   THE WINCHESTER (100B only): an RD50 (5 MB) or RD51 (10 MB) on the WD1010
   controller — on the 8088's bus. Unlike the diskettes, the Z80 never sees
   it: Winchester transfers are the one kind of disk I/O that does not
   cross the shared memory. Partitioned for MS-DOS and CP/M-86/80; the
   firmware's W boots the partition marked for auto-boot.
   ========================================================================== */
const Win = {
  parts: null, spun: false, spinT: 0,
  load() { const s = Store.get('win', null); this.parts = s && s.ver === Media.ver ? s.parts : Library.winchester(); },
  save() { Store.soon('win', () => ({ ver: Media.ver, parts: this.parts })); },
  present() { return Machine.model === '100B' && Machine.win !== 'none'; },
  spinUp() { this.spinT = performance.now(); this.spun = true; },
  spinDown() { this.spun = false; },
  ready() { return this.present() && this.spun && performance.now() - this.spinT > 3500; },
  part(i) { return this.parts[i]; },
  async xfer(ctx, n, write) {
    Bus.dev('hdc'); Bus.n.hd += n; Bus.io('i88', write ? 'out' : 'in', 0x60, null, null);
    if (Math.random() < 0.5) Snd.hddSeek();
    await ctx.sleep(12 + n * 4);
  },
  async boot(ctx) {
    while (!this.ready() && this.spun) { await VT.write('\x1b[H\x1b[7mWinchester spinning up\x1b[m'); await ctx.sleep(400); }
    await VT.write('\x1b[H\x1b[2J');
    if (!this.present()) return { ok: false, msg: 21 };
    const i = this.parts.findIndex(p => p.auto); if (i < 0) return { ok: false, msg: 23 };
    Bus.set('i88', 'run', 'Firmware: read Winchester track 0 (WD1010)', 'ROM'); await this.xfer(ctx, 2);
    return { ok: true, boot: this.parts[i].boot, part: i };
  }
};

/* ==========================================================================
   DISK I/O AS THE OPERATING SYSTEMS DO IT. For a diskette, one message
   packet per 512-byte sector, 8088 → Z80 (13h read, 14h write), exactly as
   CP/M-86/80's READHST and WRITEHST do; the Z80 drives the RX50 and rings
   back. For the Winchester, the 8088 talks to the WD1010 itself.
   Returns an error name, or null.
   ========================================================================== */
const Disk = {
  cacheOK: {},
  /* sectors: how many; lba: where, for the head position; kind: read|write */
  async io(ctx, drive, kind, sectors, lba, why) {
    sectors = Math.max(1, Math.ceil(sectors));
    if (drive >= 'E') {
      if (!Win.present()) return 'notready';
      Bus.set('i88', Bus.i88.state === 'wait' ? 'wait' : 'run', null, null);
      await Win.xfer(ctx, sectors, kind === 'write'); return null;
    }
    const s = drive === 'A' || drive === 'B' ? drive : null;
    if (!s) return 'notready';
    let err = null, left = sectors, l = lba || 0;
    const quiet = sectors > 3;
    while (left > 0 && !err) {
      const n = 1; const t = Math.min(79, Math.floor(l / 10)), sec = (l % 10) + 1;
      err = await Bus.request(ctx, 'i88', 'z80', {
        fn: kind === 'write' ? 0x14 : 0x13, desc: `${s}: trk ${U.pad(t, 2, '0')} sec ${U.pad(sec, 2, '0')}${why ? '  ' + why : ''}`, quiet,
        waitTask: `BIOS: waiting for the Z80 — ${kind} ${s}: (done flag, INT 27h)`, serveTask: `RX50 ${kind}: drive ${s}, track ${t}, sector ${sec}`, serveWhere: 'FD1793 · ports 60–63h',
        handler: async () => { const e = RX50.check(s); if (e) { await ctx.sleep(300); return { status: 0x80, err: e }; } const d = RX50.slots[s]; if (d.fmt === 'blank') { await RX50.xfer(ctx, s, t, 1); await ctx.sleep(400); return { status: 0x10, err: 'rnf' }; } if (kind === 'write' && d.wp) { await ctx.sleep(80); return { status: 0x40, err: 'wp' }; } await RX50.xfer(ctx, s, t, n, kind === 'write'); return { status: 0 }; },
        retDesc: v => v.err ? ({ notready: 'drive not ready', card: 'drive not ready', wp: 'write protected', rnf: 'record not found' }[v.err]) : 'done'
      }).then(v => v.err || null);
      left -= n; l += 1;
    }
    return err;
  }
};

/* ---- 61.library.js ---- */

  dosSys(h) {

const Compat = {
  hwScramble: false,
  /* ------------------------------------------------------------------
     THE RAINBOW'S IMPLEMENTATION of the IBM machine interface.
     ------------------------------------------------------------------ */
  rainbowEnv(ctx, env, P) {
    const self = this; let mem = {}; const memTop = Machine.memK * 1024; let writesIBM = 0, lastLog = 0;
    const log = (t, cls = 'x') => { if (performance.now() - lastLog > 120) { Bus.note(t, cls); lastLog = performance.now(); } };
    return {
      machine: 'rainbow',
      async print(s) { Bus.set('i88', 'run', `${P.file}: INT 21h console output`, 'TPA'); await DOS.w(s.replace(/\r\n/g, '\n')); },
      async input(max) { Bus.set('i88', 'poll', `${P.file}: INT 21h fn 0Ah — buffered input`, 'TPA'); return Con.readLine(ctx, { ctrlC: true, max, echoCR: false }); },
      async getkey() { const c = await Con.getc(ctx); if (c === '\x03') throw { ctrlC: true }; return c; },
      async sleep(ms) { await ctx.sleep(ms); },
      status(t) { Bus.set('i88', 'run', `${P.file}: ${t}`, 'TPA', 1); },
      async int(n, r) {
        const out = Object.assign({}, r);
        if (n === 0x18) {
          /* the firmware's fast video call: line, column, count, and memory as characters and attributes */
          log(`INT 18h — the Rainbow firmware's screen-write call, with IBM-shaped registers`);
          Bus.dev('video'); const rr = U.rng(r.dx ^ r.bp); let o = '\x1b7';
          for (let row = 1; row <= 24; row++) { o += `\x1b[${row};1H`; for (let c = 0; c < 80; c++) { const b = Math.floor(rr() * 224) + 32; const a = rr(); o += (a < 0.12 ? '\x1b[5;7m' : a < 0.25 ? '\x1b[1m' : a < 0.3 ? '\x1b[4m' : '\x1b[m') + String.fromCharCode(b === 127 ? 35 : b); } }
          await Con.write(o + '\x1b[m\x1b8'); Museum.first('int18'); return out;
        }
        if (n === 0x21) return out;
        /* nothing is there: the IBM's BIOS vectors return having done nothing */
        log(`INT ${U.hex(n)}h AH=${U.hex(r.ah || 0)} — no IBM BIOS here; the vector returns`, 'x');
        Bus.set('i88', 'run', `${P.file}: INT ${U.hex(n)}h — IBM BIOS call, nothing there`, 'TPA', 1);
        return out;
      },
      async poke(addr, v) {
        if (addr >= 0xB0000 && addr < 0xC0000) {
          writesIBM++; Bus.n.ibmWrites++;
          if (writesIBM % 50 === 1) { Bus.memTouch(addr, 50, addr < memTop ? 'IBM video memory → ordinary RAM here, never displayed' : `IBM video memory → no RAM there (${Machine.memK}K fitted)`); }
          if (addr < memTop) mem[addr] = v;
          return;
        }
        if (addr < memTop) mem[addr] = v;
      },
      peek(addr) { if (addr >= 0xF0000) return U.hash('rom' + addr) & 255; if (addr >= memTop) return 0xFF; return mem[addr] ?? (U.hash('m' + addr) & 255); },
      peekStr(addr, n) { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(this.peek(addr + i)); return s; },
      async outp(port, v) {
        Bus.n.ibmPorts++; const p = port & 0x1FF;
        let note;
        if (p === 0x40) { Line.tx(String.fromCharCode(v)); note = 'IBM timer ch 0 → MPSC COMMUNICATIONS DATA: a byte down the line'; Bus.dev('mpsc'); }
        else if (p === 0x41) { Printer.write(String.fromCharCode(v | 0x20)); note = 'IBM timer ch 1 → MPSC PRINTER DATA: a byte to the LA50'; Bus.dev('mpsc'); }
        else if (p === 0x42) { self.hwScramble = true; Printer.write(String.fromCharCode(33 + (v % 90))); note = 'IBM timer ch 2 (speaker) → MPSC COMM CONTROL: the comm port reprogrammed'; Bus.dev('mpsc', 'err'); Museum.first('mpsc'); }
        else if (p === 0x43) { self.hwScramble = true; Printer.write(String.fromCharCode(33 + (v % 90)) + (v & 1 ? '\r\n' : '')); note = 'IBM timer mode → MPSC PRINTER CONTROL: the printer port reprogrammed'; Bus.dev('mpsc', 'err'); }
        else if (p >= 0x60 && p <= 0x67) { note = `IBM keyboard/speaker port → WD1010 Winchester register ${p - 0x60}${Win.present() ? '' : ' (no controller fitted)'}`; Bus.dev('hdc', Win.present() ? 'act' : 'err'); }
        else if (p === 0x20 || p === 0x21) note = 'IBM 8259 interrupt controller → extended communications option (not fitted)';
        else note = `port ${U.hex(port, 3)}h → ${U.hex(p, 3)}h on the Rainbow's 9-bit I/O map: nothing there`;
        Bus.io('i88', 'out', port, v, note);
      },
      async inp(port) {
        const p = port & 0x1FF; Bus.n.ibmPorts++;
        if (p === 0x60) { Bus.io('i88', 'in', port, null, 'IBM keyboard data → WD1010 data register: ' + (Win.present() ? '50h' : 'FFh')); Bus.dev('hdc'); return Win.present() ? 0x50 : 0xFF; }
        if (p === 0x61) return Win.present() ? 0x00 : 0xFF;
        if (p === 0x3DA || p === 0x1DA) return 0xFF;
        return 0xFF;
      },
      async hook(vec, fn) { Bus.io('i88', 'out', 0, null, `hooked INT ${U.hex(vec)}h — on a Rainbow no hardware interrupt uses that vector`); },
      dirList() { const v = DOS.vol(DOS.cur); const D = v.fs && DosFS.dir(v.fs, DosFS.split(DOS.cwd[DOS.cur] || '')); return D ? Object.values(D.d).map(e => e.n) : []; },
      async hangHere(why) { await DOS.hang(ctx, why); },
      verdict(kind, text) { Compat.verdict(P, kind, text); }
    };
  },
  async run(ctx, id, env) {
    const P = PROGS[id]; if (!P) { await DOS.w('Bad command or file name\n'); return; }
    Bus.setMode('8088', `MS-DOS — ${P.file}: ${({ dos: 'DOS calls only', bios: 'IBM BIOS calls', hw: 'IBM hardware, directly' })[P.cls]}`);
    const m = this.rainbowEnv(ctx, env, P);
    try { await P.run(m); }
    catch (e) { if (e && e.ctrlC) { await DOS.w('^C\n'); } else throw e; }
    Bus.setMode('8088', 'MS-DOS 2.11 — 8088 in charge, Z80 serving the diskettes');
  },
  shown: {},
  verdict(P, kind, text) {
    const lead = { ran: 'It ran.', nothing: 'Nothing happened — which is what happened.', garbage: 'Nonsense.', 'garbage+hang': 'Garbage, then a hang.', 'nothing+hang': 'Nothing, and then a hang.', spectacular: 'Spectacularly wrong.' }[kind] || '';
    const cls = { dos: 'uses only MS-DOS calls', bios: 'calls the IBM PC\'s BIOS', hw: 'drives the IBM PC\'s hardware directly' }[P.cls];
    const tail = kind === 'ran' ? '' : ' <b>Set-Up, then Ctrl/Set-Up</b> resets the machine.';
    Museum.toast(`<b>${U.esc(P.title)}</b> — ${cls}. <b>${lead}</b> ${text}${kind.includes('hang') || kind === 'spectacular' ? tail : ''} <span class="gbtn" data-act="tab:compat">The compatibility wall</span>`, 16000);
    Guide.tried && Guide.tried(P, kind);
  }
};

/* ---- 73.cpm.js ---- */
/* ==========================================================================
   MODULE 8 — CP/M-86/80, CP/M-86 AND CP/M-80: ONE PROMPT, TWO PROCESSORS.

   Digital Research's CP/M-86, patched by DEC (the CP/M-86/80 Software
   Design and Maintenance Manual, AA-P309A-TV, April 1983). The CCP and the
   BDOS run on the 8088. When you name a transient, the CCP looks for a
   .CMD file first; if there is one it is an 8088 program and runs as in
   CP/M-86. If there is no .CMD but there is a .COM, it is an 8-bit
   CP/M-80 program: the CCP loads Z80CCP.SYS, which reconfigures memory so
   that the transient can start at 0100h, reads the .COM directly into the
   Z80's memory, and issues START Z80 (packet 21h). From then on the Z80 is
   the master. The keyboard and the screen are on the 8088's bus, so every
   BDOS call the 8-bit program makes becomes a packet to the 8088, which
   waits in its Z80 Service Routine, performs the call, and interrupts the
   Z80 back. A disk read by an 8-bit program therefore crosses the shared
   memory three times: Z80 → 8088 (BDOS read), 8088 → Z80 (read the
   sector), and back. The visitor sees none of this at the prompt, which
   was the point, and all of it in the panel.

   The CP/M-80 environment (the Z80 side: base page at 0000h, BDOS entry at
   0005h, the TPA from 0100h — BE00h bytes, 47.5K, on a 64K system as DEC's
   manual gives it) and the CP/M-86 environment (the 8088 side: TPA from
   3D00h) are the two halves; CP/M-86/80 is the dispatcher that joins them.
   ========================================================================== */
const CPM = {
  cur: 'A', user: 0, boot: 'A', config: '8088', lst: false, submit: null,
  /* ------------------------------------------------------------------ what CP/M makes of a medium */
  vol(d) {
    if (d === 'E') { if (!Win.present()) return { err: 'notready' }; const p = Win.parts.find(p => p.fs && p.fs.type === 'cpm'); return p ? { fs: p.fs, win: true } : { err: 'select' }; }
    if (d === 'C' || d === 'D') return { err: 'notready' };
    if (!'AB'.includes(d)) return { err: 'select' };
    const e = RX50.check(d); if (e) return { err: 'notready' };
    const k = RX50.slots[d];
    if (k.fmt === 'cpm' || k.fmt === 'vt180') return { fs: k.fs, disk: k };
    if (k.fmt === 'rx50') { if (!k.fs || k.fs.type !== 'cpm') k.fs = CpmFS.mk([]); return { fs: k.fs, disk: k }; }
    if (k.fmt === 'blank') return { err: 'read', disk: k };
    if (FMT[k.fmt].kind === 'ibm') return { err: 'seek', disk: k };
    return { fs: this.garbageDir(k), disk: k, junk: true };
  },
  /* an MS-DOS, DECmate or Professional diskette read as a CP/M directory */
  garbageDir(k) {
    if (k._junk) return k._junk; const r = U.rng(U.hash(k.id + 'cpmjunk')); const files = [];
    const ch = () => { const c = Math.floor(r() * 190) + 33; return String.fromCharCode(c > 126 ? c + 34 : c); };
    for (let i = 0; i < 7 + Math.floor(r() * 6); i++) { let n = '', e = ''; for (let j = 0; j < 8; j++) n += ch(); for (let j = 0; j < 3; j++) e += ch(); files.push({ n, e, u: 0, s: Math.floor(r() * 30000) }); }
    Object.defineProperty(k, '_junk', { value: { type: 'cpm', files, junk: true }, enumerable: false, configurable: true }); return k._junk;
  },
  w(s) { return Con.write(s.replace(/\r?\n/g, '\r\n')); },
  /* the Rainbow BIOS's own error messages, from the design manual */
  async biosErr(ctx, err, d) {
    const t = { notready: `Drive not ready — ${d}:`, read: `Read error on drive ${d}:, track 02, sector 01`, seek: `Seek error on drive ${d}:, track 02`, wp: `Drive write protected — ${d}:` }[err];
    if (!t) { await this.w(`\nBdos Err On ${d}: Select\n`); throw { cpmAbort: true }; }
    await this.w('\n' + t + '\n');
    if (err === 'read') { await this.w('Press return to ignore error, any other key to continue\n'); const k = await Con.getc(ctx); if (k === '\r') return 'ignore'; await this.w(`\nBdos Err On ${d}: Bad Sector\n`); throw { cpmAbort: true }; }
    await this.w('Press CTRL-C to restart,\nspace bar to retry, or any other key to continue.\n');
    const k = await Con.getc(ctx); if (k === '\x03') throw { cpmAbort: true }; if (k === ' ') return 'retry';
    await this.w(`\nBdos Err On ${d}: ${err === 'wp' ? 'R/O' : 'Bad Sector'}\n`); throw { cpmAbort: true };
  },
  /* disk work: from the 8088 BIOS, one packet per sector to the Z80 */
  async disk(ctx, d, kind, sectors, why) {
    for (; ;) {
      const v = this.vol(d);
      if (v.err) { if (await this.biosErr(ctx, v.err, d) === 'retry') continue; return v; }
      if (v.win) { await Win.xfer(ctx, sectors, kind === 'write'); return v; }
      const e = await Disk.io(ctx, d, kind, sectors, 20 + (U.hash(why || '') % 700), why);
      if (!e) return v;
      if (await this.biosErr(ctx, e === 'wp' ? 'wp' : e === 'notready' ? 'notready' : 'read', d) === 'retry') continue;
      return v;
    }
  },
  /* ------------------------------------------------------------------ boot */
  mapFor(cfg) {
    const top = Math.min(Machine.memK, 896) * 1024;
    if (cfg === 'z80') {
      const big = Machine.memK >= 128;
      MemMap.set(big ? [{ a: 0, b: 0x3FF, l: 'interrupt vectors', c: '#8a6a3a' }, { a: 0x400, b: 0x7FF, l: '8088 private: the Z80 Service Routine', c: '#a0703a' }, { a: 0x800, b: 0xE3FF, l: 'Z80 transient program area (the 8088\'s view)', c: '#2f5f8f', short: 'Z80 TPA' }, { a: 0xE400, b: 0xFFFF, l: 'Z80: pseudo BDOS/BIOS/CCP, disk primitives, interface layer', c: '#3b6a8a' }, { a: 0x10000, b: 0x16FFF, l: 'CPM.SYS — moved above 64K, out of the Z80\'s way', c: '#b07a3a', short: 'CPM' }, { a: 0x17000, b: top - 1, l: 'unused while the Z80 runs', c: '#3a3a30' }]
        : [{ a: 0, b: 0x3FF, l: 'interrupt vectors', c: '#8a6a3a' }, { a: 0x400, b: 0x7FF, l: '8088 private: the Z80 Service Routine', c: '#a0703a' }, { a: 0x800, b: 0xBF3F, l: 'Z80 TPA (0100–BF3Fh: BE00h bytes, 47.5K)', c: '#2f5f8f', short: 'Z80 TPA' }, { a: 0xBF40, b: 0xE7FF, l: 'CPM.SYS (8088)', c: '#b07a3a' }, { a: 0xE800, b: 0xFFFF, l: 'Z80 pseudo BDOS/BIOS/CCP and primitives', c: '#3b6a8a' }],
        [{ a: 0, b: 0xFF, l: 'base page: 0000h JMP warm boot, 0005h JMP BDOS', c: '#6fb7ff', short: 'bp' }, { a: 0x100, b: 0x7FF, l: 'TPA (in the Z80\'s private 2K)', c: '#2f5f8f' }, { a: 0x800, b: big ? 0xE3FF : 0xBF3F, l: 'TPA (shared RAM)', c: '#2f5f8f', short: 'TPA' }, { a: big ? 0xE400 : 0xBF40, b: 0xFFFF, l: 'pseudo BDOS, BIOS, CCP; interface layer', c: '#3b6a8a' }]);

/* ==========================================================================
   MODULE 11 — THE COLOR/GRAPHICS OPTION. A separate board on the 8088's
   bus (ports 50h–57h) with its own memory and an NEC 7220 display
   controller: 384 × 240 in sixteen colours, or 800 × 240 in four, each
   chosen from a palette of 4,096 through a colour map; the text display is
   overlaid on it. With a VR241 the picture is in colour; on a VR201 each

  present() { return Machine.gfx; },
  visible() { return this.on && this.present(); },
  reset() { this.on = false; this.setMode('med'); this.defaultClut(); this.dirty = true; CRT.settle = 4; },
  defaultClut() { this.clut = [[0, 0, 0, 0], [15, 15, 15, 15], [15, 0, 0, 6], [0, 13, 0, 9], [0, 3, 15, 5], [15, 13, 0, 12], [0, 13, 13, 10], [13, 0, 13, 7], [8, 8, 8, 8], [15, 8, 0, 9], [6, 11, 3, 8], [9, 5, 2, 6], [2, 6, 12, 6], [12, 12, 10, 12], [15, 10, 11, 11], [4, 2, 9, 4]]; this.dirty = true; },

  pset(x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.buf[y * this.w + x] = c & (this.cols() - 1); },
  line(x0, y0, x1, y1, c) { x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0; const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy; for (; ;) { this.pset(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } this.dirty = true; },

/* ==========================================================================
   GSX-86 AND GRAFDEMO — a demonstration in the DEC idiom: the colour map,
   business graphics of the kind GSX was sold for, vector line drawing, and
   the 800-dot mode. Any key advances; Exit (F10) leaves.
   ========================================================================== */
const GfxProgs = {
  async gsx(ctx, env) {
    if (!GFX.present()) { await DOS.w('\nGSX-86: DDRBMED.SYS: the Color/Graphics option is not installed\n'); return; }
    await DOS.w('\nGSX-86 Version 1.1   Graphics System Extension\nCopyright (c) 1983 Digital Research, Inc.\n\nGSX-86 loaded.  Devices assigned from ASSIGN.SYS:\n  01  DDRBMED   Rainbow Color/Graphics option, 384 x 240, 16 colours\n  02  DDRBHI    Rainbow Color/Graphics option, 800 x 240, 4 colours\n  21  DDLA50    LA50 printer\n');
  },
  async grafdemo(ctx, env) {
    if (!GFX.present()) { await DOS.w('\nGRAFDEMO requires the Rainbow Color/Graphics option.\nSwitch the Rainbow off and fit one: Machine, in the rail.\n'); Museum.first('nogfx'); return; }
    Bus.setMode('8088', 'MS-DOS — GRAFDEMO driving the 7220 graphics option through GSX');
    const G = GFX; const wait = async (ms) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { if (Con.avail()) { const c = Con.q.shift(); while (Con.q.length) Con.q.shift(); return c === '\x1b' || c === 'q' || c === 'Q' ? 'exit' : 'key'; } await ctx.sleep(40); } return 'time'; };
    await Con.write('\x1b[H\x1b[2J'); G.on = true; Museum.first('gfx');
    try {
      /* 1. the colour map: sixteen of four thousand and ninety-six */
      G.setMode('med'); G.defaultClut(); G.clear(0);
      G.text(52, 14, 'Rainbow Color/Graphics Option', 1, 1); G.text(76, 30, '16 of 4,096 colours', 13, 1);
      for (let i = 0; i < 16; i++) G.rect(24 + i * 21, 60, 19, 110, i, true);
      G.text(64, 196, 'any key: next   Exit: stop', 8, 1);
      for (let k = 0; k < 120; k++) { const ph = k / 12; for (let i = 2; i < 16; i++) { const h = (i / 14 + ph * 0.05) % 1; const [r, g, b] = [Math.sin(h * 6.28) * 7.5 + 7.5, Math.sin(h * 6.28 + 2.1) * 7.5 + 7.5, Math.sin(h * 6.28 + 4.2) * 7.5 + 7.5].map(Math.round); G.clut[i] = [r, g, b, Math.round((r + g + b) / 3)]; } G.dirty = true; Bus.dev('gdc'); const w = await wait(60); if (w === 'exit') return; if (w === 'key') break; }
      G.defaultClut();
      /* 2. business graphics */
      G.clear(0); G.text(40, 8, 'Claims by quarter, 1984 (thousands)', 1); const q = [112, 108, 121, 96];
      G.line(40, 200, 360, 200, 1); G.line(40, 40, 40, 200, 1);
      q.forEach((v, i) => { G.rect(60 + i * 72, 200 - v * 1.3, 44, v * 1.3, [2, 3, 4, 5][i], true); G.text(66 + i * 72, 206, 'Q' + (i + 1), 13); G.text(64 + i * 72, 188 - v * 1.3, String(v), 13); });
      if (await wait(3500) === 'exit') return;
      G.clear(0); G.text(96, 8, 'Where the budget went', 1); const parts = [[0.38, 2], [0.26, 4], [0.17, 3], [0.11, 5], [0.08, 7]]; let a = -Math.PI / 2;
      for (const [f, c] of parts) { G.wedge(150, 124, 88, a, a + f * Math.PI * 2, c); a += f * Math.PI * 2; }
      ['Motor', 'Property', 'Liability', 'Systems', 'Other'].forEach((t, i) => { G.rect(282, 60 + i * 22, 12, 10, parts[i][1], true); G.text(300, 60 + i * 22, t, 13); });

      G.clear(0); G.text(120, 8, 'Vector drawing', 1);
      for (let k = 0; k < 90; k++) { const t = k / 90 * Math.PI * 2; G.line(192 + Math.cos(t) * 150, 124 + Math.sin(t * 3) * 90, 192 + Math.cos(t + 2.2) * 150, 124 + Math.sin(t * 3 + 2.2) * 90, 2 + (k % 13)); if (k % 6 === 0) { Bus.dev('gdc'); await ctx.sleep(30); } }

/* ==========================================================================
   WINDOWS 1.03 FOR THE RAINBOW (1986) — a later curiosity, two years after
   this 100B. Microsoft produced a version
   because DEC was a large enough customer to ask; it drew on the graphics
   option in the 800 × 240 four-colour mode. Here: the tiled windows of
   Windows 1.0 (they could not overlap), MS-DOS Executive, a clock, the icon
   area along the bottom, and the keyboard for everything, as the Rainbow
   had no standard mouse. The tiled windows ran here too, on a machine that
   could not run most of the software they were for.
   ========================================================================== */

  running: false,
  stop() { this.running = false; },
  async run(ctx, env) {
    if (!GFX.present()) { await DOS.w('\nWindows requires the Rainbow Color/Graphics option.\n'); Museum.first('nogfx'); return; }
    const G = GFX; this.running = true; await Con.write('\x1b[H\x1b[2J'); G.setMode('hi'); G.clut = [[0, 0, 0, 0], [15, 15, 15, 15], [2, 5, 11, 5], [11, 11, 11, 11]].concat(G.clut.slice(4)); G.on = true;
    Bus.setMode('8088', 'Windows 1.03 — tiled windows on the graphics option'); Bus.set('i88', 'run', 'WIN100.BIN: Windows 1.03 for the Rainbow', 'TPA'); Museum.first('windows');

      G.rect(0, top + 12, 800, 11, 3, true); G.text(6, top + 13, 'File  View  Special', 0);
      G.text(6, top + 26, `${DOS.cur}:\\   ${files.length} files`, 0); G.line(0, top + 37, 800, top + 37, 0);
      files.forEach((f, i) => { const col = Math.floor(i / 12), row = i % 12; const x = 8 + col * 130, y = top + 42 + row * 10; if (i === sel) { G.rect(x - 2, y - 1, 124, 10, 0, true); G.text(x, y, f, 1); } else G.text(x, y, f, 0); });
      G.rect(0, top, 800, h, 0);
      /* the Clock, tiled beneath */
      if (clockOn) { const cy = top + h; G.rect(0, cy, 400, 12, 2, true); G.text(176, cy + 1, 'Clock', 1); G.rect(0, cy, 400, 46, 0); const d = new Date(DOS.now()); G.text(150, cy + 24, `${U.pad(d.getHours(), 2, '0')}:${U.pad(d.getMinutes(), 2, '0')}:${U.pad(d.getSeconds(), 2, '0')}`, 0, 1); }
      /* the icon area */
      G.rect(0, 216, 800, 24, 3, true); G.rect(420, 219, 60, 18, 0); G.text(424, 224, 'CALC', 0); G.rect(500, 219, 60, 18, 0); G.text(502, 224, 'NOTEPD', 0);

      if (menu) { G.rect(4, 23, 150, 44, 1, true); G.rect(4, 23, 150, 44, 0); ['Run...', 'Load...', 'Copy...'].forEach((t, i) => G.text(12, 27 + i * 12, t, 0)); }
    };
    draw();
    try {
      for (; this.running;) {
        const t0 = performance.now(); while (!Con.avail() && performance.now() - t0 < 1000) await ctx.sleep(50);
        if (!Con.avail()) { draw(); continue; }
        const k = await Con.key(ctx);
        if (k === 'exit' || k === 'esc' || k === 'f4') { G.rect(260, 90, 280, 50, 1, true); G.rect(260, 90, 280, 50, 0); G.text(282, 100, 'This will end your Windows session.', 0); G.text(330, 120, 'Do = OK    Cancel = no', 0); const a = await Con.key(ctx); if (a === 'do' || a === '\r' || a === 'y' || a === 'Y') break; draw(); continue; }
