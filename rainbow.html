/* ---- 75.apps.js ---- */
/* ==========================================================================
   MODULE 9c — THE APPLICATIONS DEC SECURED. DEC did get the major
   applications ported: the spreadsheet that defined the era, a word
   processor, a database, and its own word processing from the DECmate.
   These are original stand-ins with original names — Quadrant, Penwright,
   Strata II, Scriptor/RB — and like the real Rainbow versions they draw
   with VT100 escape sequences through the firmware, which is why they run.
   It did not matter: the long tail of everything else did not come.
   ========================================================================== */
const Apps = {
  async run(ctx, id, env) {
    if (id === 'gsx') return GfxProgs.gsx(ctx, env);
    if (id === 'grafdemo') return GfxProgs.grafdemo(ctx, env);
    const A = { quadrant: Quadrant, penwright: Penwright, strata: Strata, scriptor: Scriptor }[id];
    if (!A) { await DOS.w('Bad command or file name\n'); return; }
    Bus.setMode('8088', `MS-DOS — ${A.title}, the Rainbow version`); Museum.first('app');
    const saveAwm = VT.m.awm; VT.m.awm = false;
    try { await A.run(ctx, env); }
    finally { VT.m.awm = saveAwm; await Con.write('\x1b[m\x1b[r\x1b[H\x1b[2J'); Bus.setMode('8088', 'MS-DOS 2.11 — 8088 in charge, Z80 serving the diskettes'); }
  }
};
const E_ = '\x1b[';
const cup = (r, c) => `${E_}${r};${c}H`;

/* ---------------- QUADRANT: the spreadsheet ---------------- */
const Quadrant = {
  title: 'Quadrant 1.1',
  async run(ctx, env) {
    const cells = {}; const COLS = 8, ROWS = 20, W = 9;
    const demo = { A1: 'Q3 CLAIMS', A3: 'Motor', A4: 'Property', A5: 'Liability', A7: 'TOTAL', B2: '"Jul', C2: '"Aug', D2: '"Sep', E2: '"Qtr', B3: '40600', C3: '37950', D3: '42210', B4: '29940', C4: '30310', D4: '28650', B5: '19120', C5: '18870', D5: '20390', E3: '@SUM(B3..D3)', E4: '@SUM(B4..D4)', E5: '@SUM(B5..D5)', B7: '@SUM(B3..B5)', C7: '@SUM(C3..C5)', D7: '@SUM(D3..D5)', E7: '@SUM(E3..E5)' };
    Object.assign(cells, demo);
    let cr = 0, cc = 0, msg = 'READY';
    const name = (c, r) => String.fromCharCode(65 + c) + (r + 1);
    const val = (ref, seen = new Set()) => {
      const s = cells[ref]; if (s == null || s === '') return 0; if (seen.has(ref)) return NaN; seen.add(ref);
      if (/^[A-Za-z"']/.test(s) && !/^@/.test(s)) return 0;
      return this.evalf(s, r => val(r, new Set(seen)));
    };
    const show = ref => { const s = cells[ref]; if (s == null) return ''; if (/^["']/.test(s)) return s.slice(1); if (/^[A-Za-z]/.test(s) && !/^@/.test(s)) return s; const v = val(ref); return isNaN(v) ? 'ERR' : (Math.round(v * 100) / 100).toLocaleString('en-US'); };
    const cellStr = (c, r) => { const ref = name(c, r); const s = show(ref); const raw = cells[ref]; const num = raw != null && !/^["']|^[A-Za-z]/.test(raw) || /^@/.test(raw || ''); return num ? s.slice(0, W - 1).padStart(W - 1) + ' ' : s.slice(0, W).padEnd(W); };
    const paint = async (full) => {
      let o = full ? '\x1b[H\x1b[2J' : '';
      const ref = name(cc, cr);
      o += cup(1, 1) + `${ref}: ${cells[ref] || ''}`.padEnd(70).slice(0, 70) + `\x1b[7m${msg.padStart(9)}\x1b[m`;
      if (full) { o += cup(3, 1) + '\x1b[7m    ' + Array.from({ length: COLS }, (_, i) => ('    ' + String.fromCharCode(65 + i)).padEnd(W)).join('') + '\x1b[m'; }
      for (let r = 0; r < ROWS; r++) { o += cup(4 + r, 1) + `\x1b[7m${String(r + 1).padStart(3)} \x1b[m`; for (let c = 0; c < COLS; c++) { const s = cellStr(c, r); o += (r === cr && c === cc ? '\x1b[7m' + s + '\x1b[m' : s); } }
      o += cup(24, 1) + '\x1b[K/ menu   Help   Find: go to   Remove: erase   Exit: quit' + cup(2, 1);
      await Con.write(o);
    };
    await paint(true); Museum.first('quadrant');
    for (; ;) {
      const k = await Con.key(ctx); msg = 'READY';
      if (k === 'up') cr = Math.max(0, cr - 1); else if (k === 'down') cr = Math.min(ROWS - 1, cr + 1); else if (k === 'left') cc = Math.max(0, cc - 1); else if (k === 'right' || k === '\t') cc = Math.min(COLS - 1, cc + 1);
      else if (k === 'prev') cr = Math.max(0, cr - 10); else if (k === 'next') cr = Math.min(ROWS - 1, cr + 10);
      else if (k === 'rem') delete cells[name(cc, cr)];
      else if (k === 'exit') { if (await this.ask('Quit Quadrant?  Y/N')) return; }
      else if (k === 'help') { await Con.write('\x1b[H\x1b[2J\x1b#3  Quadrant help\r\n\x1b#4  Quadrant help\r\n\r\n  Type a number, a label, or a formula (+B3*2, @SUM(B3..D3), @AVG, @MAX, @MIN).\r\n  Return enters it.  The arrows move.  Prev/Next Screen move ten rows.\r\n  /  opens the menu:  Graph (on the Color/Graphics option), Blank, Quit.\r\n\r\n  This is the Rainbow version: it draws with VT100 escape sequences through the\r\n  firmware.  The IBM PC version writes to the IBM\'s video memory, and on a\r\n  Rainbow shows nothing at all.\r\n\r\n  Press any key.'); await Con.key(ctx); await paint(true); continue; }
      else if (k === 'find') { await Con.write(cup(2, 1) + '\x1b[KGo to cell: '); const t = (await Con.readLine(ctx, { echoCR: false })).trim().toUpperCase(); const m = /^([A-H])(\d{1,2})$/.exec(t); if (m) { cc = m[1].charCodeAt(0) - 65; cr = U.clamp(+m[2] - 1, 0, ROWS - 1); } }
      else if (k === '/') { await Con.write(cup(2, 1) + '\x1b[K\x1b[1mGraph  Blank  Quit\x1b[m   (first letter)'); const m = (await Con.getc(ctx)).toUpperCase(); if (m === 'Q') { if (await this.ask('Quit Quadrant?  Y/N')) return; } else if (m === 'B') { Object.keys(cells).forEach(k2 => delete cells[k2]); } else if (m === 'G') { await this.graph(ctx, cells, val); } await paint(true); continue; }
      else if (typeof k === 'string' && k.length === 1 && k >= ' ') {
        await Con.write(cup(2, 1) + '\x1b[K' + k); msg = /[0-9+\-.(@=]/.test(k) ? 'VALUE' : 'LABEL'; await Con.write(cup(1, 72) + `\x1b[7m${msg.padStart(9)}\x1b[m` + cup(2, 2));
        const rest = await Con.readLine(ctx, { echoCR: false }); let s = (k + rest).trim(); if (s.startsWith('=')) s = '+' + s.slice(1);
        cells[name(cc, cr)] = s; msg = 'READY'; cr = Math.min(ROWS - 1, cr + 1);
        await Con.write(cup(2, 1) + '\x1b[K');
      }
      else if (k === '\r' || k === 'do') { }
      await paint(false);
    }
  },
  evalf(s, get) {
    s = s.replace(/^\+/, '');
    const rng = (a, b) => { const c0 = a.charCodeAt(0), c1 = b.charCodeAt(0), r0 = +a.slice(1), r1 = +b.slice(1); const out = []; for (let c = Math.min(c0, c1); c <= Math.max(c0, c1); c++) for (let r = Math.min(r0, r1); r <= Math.max(r0, r1); r++) out.push(get(String.fromCharCode(c) + r)); return out; };
    s = s.toUpperCase().replace(/@(SUM|AVG|MAX|MIN|COUNT)\(([A-H]\d+)\.\.([A-H]\d+)\)/g, (m, f, a, b) => { const v = rng(a, b); const r = { SUM: v.reduce((x, y) => x + y, 0), AVG: v.reduce((x, y) => x + y, 0) / v.length, MAX: Math.max(...v), MIN: Math.min(...v), COUNT: v.length }[f]; return String(r); });
    s = s.replace(/\b([A-H])(\d{1,2})\b/g, (m, c, r) => '(' + get(c + r) + ')');
    if (!/^[\d+\-*/().\s eE]+$/.test(s)) return NaN;
    try { const v = Function('"use strict";return (' + s + ')')(); return typeof v === 'number' && isFinite(v) ? v : NaN; } catch (e) { return NaN; }
  },
  async ask(q) { await Con.write(cup(2, 1) + '\x1b[K' + q + ' '); const c = (await Con.getc(FW.ctx)).toUpperCase(); await Con.write(cup(2, 1) + '\x1b[K'); return c === 'Y'; },
  async graph(ctx, cells, val) {
    if (!GFX.present()) { await Con.write(cup(2, 1) + '\x1b[K\x1b[7mNo graphics hardware: the Color/Graphics option is not installed\x1b[m'); await ctx.sleep(1800); return; }
    const G = GFX; G.setMode('med'); G.defaultClut(); G.clear(0); G.on = true; await Con.write('\x1b[H\x1b[2J');
    const rows = [3, 4, 5].map(r => ({ l: cells['A' + r] || 'Row ' + r, v: ['B', 'C', 'D'].map(c => val(c + r)) }));
    const max = Math.max(1, ...rows.flatMap(r => r.v)); G.text(70, 8, 'Quadrant graph: B3..D5', 1); G.line(40, 210, 370, 210, 1); G.line(40, 30, 40, 210, 1);
    rows.forEach((r, i) => r.v.forEach((v, j) => { const x = 56 + j * 108 + i * 28, h = v / max * 170; G.rect(x, 210 - h, 24, h, [2, 3, 4][i], true); }));
    ['Jul', 'Aug', 'Sep'].forEach((m, j) => G.text(82 + j * 108, 216, m, 13)); rows.forEach((r, i) => { G.rect(270, 30 + i * 14, 10, 8, [2, 3, 4][i], true); G.text(286, 30 + i * 14, r.l.slice(0, 10), 13); });
    Museum.first('quadgraph'); await Con.key(ctx); G.on = false; G.clear(0); CRT.settle = 4;
  }
};

/* ---------------- a full-screen editor on the console, shared by Penwright and Scriptor ---------------- */
const ScreenEd = {
  async edit(ctx, o) {
    const L = (o.text || '').replace(/\r/g, '').replace(/\x1a.*$/s, '').split('\n'); if (!L.length) L.push('');
    let r = 0, c = 0, top = 0, ins = true, gold = false; const R0 = o.top || 3, R1 = 22, H = R1 - R0 + 1; const WRAP = o.wrap || 72;
    const status = () => `${cup(1, 1)}\x1b[7m${(' ' + o.title + '  ' + o.file).padEnd(46)}${(`line ${r + 1}  col ${c + 1}  ${ins ? 'INSERT' : 'OVERTYPE'}${gold ? '  GOLD' : ''} `).padStart(34)}\x1b[m`;
    const paint = async (full) => {
      if (r < top) top = r; if (r >= top + H) top = r - H + 1;
      let s = full ? '\x1b[H\x1b[2J' + (o.ruler ? cup(2, 1) + o.ruler : '') + cup(24, 1) + o.help : '';
      s += status(); for (let i = 0; i < H; i++) { const ln = L[top + i]; s += cup(R0 + i, 1) + '\x1b[K' + (ln == null ? (top + i === L.length ? '\x1b[1m<end of document>\x1b[m' : '') : ln.slice(0, 79)); }
      s += cup(R0 + r - top, Math.min(79, c) + 1); await Con.write(s);
    };
    const wrapLine = () => { if (L[r].length <= WRAP) return; const cut = L[r].lastIndexOf(' ', WRAP); if (cut <= 0) return; const tail = L[r].slice(cut + 1); L[r] = L[r].slice(0, cut); L.splice(r + 1, 0, tail); if (c > cut) { r++; c = c - cut - 1; } };
    await paint(true);
    for (; ;) {
      const k = await Con.key(ctx);
      if (o.gold && k === 'pf1') { gold = !gold; await Con.write(status() + cup(R0 + r - top, c + 1)); continue; }
      if (gold) { gold = false; const g = o.gold(k); if (g === 'menu' || g === 'save') return { text: L.join('\r\n'), action: g }; }
      if (k === 'up') { if (r > 0) r--; c = Math.min(c, L[r].length); } else if (k === 'down') { if (r < L.length - 1) r++; c = Math.min(c, L[r].length); }
      else if (k === 'left') { if (c > 0) c--; else if (r > 0) { r--; c = L[r].length; } } else if (k === 'right') { if (c < L[r].length) c++; else if (r < L.length - 1) { r++; c = 0; } }
      else if (k === 'prev') { r = Math.max(0, r - H); c = 0; } else if (k === 'next') { r = Math.min(L.length - 1, r + H); c = 0; }
      else if (k === '\r') { L.splice(r + 1, 0, L[r].slice(c)); L[r] = L[r].slice(0, c); r++; c = 0; }
      else if (k === '\x7f' || k === '\b') { if (c > 0) { L[r] = L[r].slice(0, c - 1) + L[r].slice(c); c--; } else if (r > 0) { c = L[r - 1].length; L[r - 1] += L[r]; L.splice(r, 1); r--; } }
      else if (k === 'rem') { if (c < L[r].length) L[r] = L[r].slice(0, c) + L[r].slice(c + 1); else if (r < L.length - 1) { L[r] += L[r + 1]; L.splice(r + 1, 1); } }
      else if (k === 'ins') ins = !ins;
      else if (k === 'find') { await Con.write(cup(23, 1) + '\x1b[K\x1b[1mFind:\x1b[m '); const t = await Con.readLine(ctx, { echoCR: false }); await Con.write(cup(23, 1) + '\x1b[K'); if (t) { for (let i = 0; i < L.length; i++) { const j = L[(r + i) % L.length].toLowerCase().indexOf(t.toLowerCase(), i === 0 ? c + 1 : 0); if (j >= 0) { r = (r + i) % L.length; c = j; break; } } } }
      else if (k === 'exit') return { text: L.join('\r\n'), action: 'save' };
      else if (k === 'do') return { text: L.join('\r\n'), action: 'menu' };
      else if (k === 'help' && o.helpText) { await Con.write('\x1b[H\x1b[2J' + o.helpText + '\r\n\r\n  Press any key.'); await Con.key(ctx); await paint(true); continue; }
      else if (typeof k === 'string' && k.length === 1 && k >= ' ') { L[r] = ins ? L[r].slice(0, c) + k + L[r].slice(c) : L[r].slice(0, c) + k + L[r].slice(c + 1); c++; wrapLine(); }
      await paint(false);
    }
  }
};

/* ---------------- PENWRIGHT: the word processor ---------------- */
const Penwright = {
  title: 'Penwright 2.1',
  async run(ctx, env) {
    const file = (env.args[0] || 'LETTER.DOC').toUpperCase(); let text = await DOS.readText(ctx, file); if (text == null) text = '';
    for (; ;) {
      const res = await ScreenEd.edit(ctx, { title: 'PENWRIGHT 2.1', file: DOS.cur + ':' + file, text, ruler: '\x1b[1m' + 'L----!----!----!----!----!----!----!----!----!----!----!----!----!----!--R' + '\x1b[m', help: '\x1b[7m Help \x1b[m help  \x1b[7m Do \x1b[m menu  \x1b[7m Find \x1b[m search  \x1b[7m Insert Here \x1b[m insert/overtype  \x1b[7m Exit \x1b[m save and quit', helpText: '\x1b#6  Penwright\r\n\r\n  The arrows move, Return starts a new line, <X deletes backwards and Remove\r\n  deletes forwards.  Insert Here switches between insert and overtype.  Find\r\n  searches.  Prev and Next Screen page.  Do opens the menu: Save, Print on the\r\n  LA50, Quit.  Exit saves and returns to MS-DOS.' });

};

/* ---------------- STRATA II: the database, with a dot prompt ---------------- */
const Strata = {
  title: 'Strata II',
  DB: { CLIENTS: { fields: [['NAME', 'C', 22], ['CITY', 'C', 14], ['POLICY', 'C', 8], ['PREMIUM', 'N', 8], ['CLAIMS', 'N', 3]], rows: [['Abernethy, R.', 'Worcester', 'M-10233', 412, 0], ['Baptiste, L.', 'Providence', 'P-20417', 288.5, 1], ['Castellano, M.', 'Hartford', 'M-10566', 519, 2], ['Delacroix, A.', 'Springfield', 'L-30071', 140, 0], ['Eriksen, T.', 'Worcester', 'M-10802', 377.25, 1], ['Fairbairn, J.', 'Nashua', 'P-20588', 301, 0], ['Gallagher, S.', 'Lowell', 'M-11019', 455, 3], ['Hollis, P.', 'Worcester', 'L-30112', 96, 0], ['Iwasaki, K.', 'Providence', 'M-11204', 402.8, 0], ['Janacek, V.', 'Manchester', 'P-20713', 264, 1], ['Kowalczyk, E.', 'Lowell', 'M-11377', 498, 2], ['Lindqvist, B.', 'Hartford', 'L-30148', 188, 0], ['Moreau, C.', 'Nashua', 'M-11430', 351.4, 1], ['Nakamura, H.', 'Worcester', 'P-20899', 233, 0], ['Okafor, G.', 'Springfield', 'M-11562', 612, 4]] } },
  async run(ctx, env) {

    await w('\x1b[H\x1b[2J\nSTRATA II  version 2.4  (c) 1983\nfor the Rainbow 100 under MS-DOS\n\nType HELP for help.\n'); Museum.first('strata');
    const fields = () => db.fields.map(f => f[0]);
    const get = (row, f) => row[fields().indexOf(f)];
    const cond = (s, row) => { if (!s) return true; let e = s.toUpperCase().replace(/\.AND\./g, '&&').replace(/\.OR\./g, '||').replace(/\.NOT\./g, '!').replace(/(^|[^<>!=])=([^=])/g, '$1==$2').replace(/#/g, '!='); for (const f of fields()) { const v = get(row, f); e = e.replace(new RegExp('\\b' + f + '\\b', 'g'), typeof v === 'number' ? String(v) : JSON.stringify(v.toUpperCase())); } if (/[^\s\d.<>=!&|()"\w,'\-]/.test(e)) return false; try { return !!Function('"use strict";return (' + e + ')')(); } catch (x) { throw { syntax: true }; } };
    const line = (i, row) => `${String(i + 1).padStart(7)} ${db.fields.map((f, j) => f[1] === 'N' ? String(row[j].toFixed ? (f[0] === 'PREMIUM' ? row[j].toFixed(2) : row[j]) : row[j]).padStart(f[2]) : String(row[j]).padEnd(f[2])).join(' ')}`;
    for (; ;) {
      await w('\n. '); let l; try { l = (await Con.readLine(ctx, { echoCR: false })).trim(); } catch (e) { if (e && e.ctrlC) continue; throw e; }
      await w('\n'); const u = l.toUpperCase(); const verb = u.split(/\s+/)[0].slice(0, 4);
      try {
        if (!u) continue;
        if (verb === 'QUIT') { await w('*** END RUN STRATA II ***\n'); return; }
        if (verb === 'HELP') { await w('USE <file>   LIST [FOR <cond>]   DISPLAY [ALL]   COUNT [FOR ...]\nSUM <field> [FOR ...]   AVERAGE <field>   GO <n>|TOP|BOTTOM   SKIP [n]\nLOCATE FOR <cond>   CONTINUE   ? <expression>   DIR   QUIT\nExample:  USE CLIENTS   then   LIST FOR CITY = "WORCESTER"\n'); continue; }
        if (verb === 'DIR') { await w('Database files    # records   last update\nCLIENTS.DBF             15     09/20/84\n'); continue; }
        if (verb === 'USE') { const n = u.split(/\s+/)[1] || ''; db = this.DB[n.replace(/\.DBF$/, '')] || null; rec = 0; if (!db) await w('FILE DOES NOT EXIST\n'); else await DOS.disk(ctx, DOS.cur, 'read', 7, 'CLIENTS.DBF'); continue; }
        if (verb === '?') { await w(String(this.expr(u.slice(1), db && db.rows[rec], db, get)) + '\n'); continue; }
        if (!db) { await w('NO DATABASE IN USE, ENTER FILENAME: '); continue; }

        if (verb === 'LIST' || (verb === 'DISP' && /ALL|FOR/.test(u))) { await w('Record# ' + db.fields.map(f => f[1] === 'N' ? f[0].padStart(f[2]) : f[0].padEnd(f[2])).join(' ') + '\n'); for (let i = 0; i < db.rows.length; i++) if (cond(forC, db.rows[i])) await w(line(i, db.rows[i]) + '\n'); continue; }
        if (verb === 'DISP') { if (rec >= db.rows.length) { await w('END OF FILE ENCOUNTERED\n'); continue; } await w(line(rec, db.rows[rec]) + '\n'); continue; }
        if (verb === 'COUN') { await w(`COUNT = ${String(db.rows.filter(r => cond(forC, r)).length).padStart(5, '0')}\n`); continue; }

/* ---- 76.misc.js ---- */
/* ==========================================================================
   MODULE 12 — OTHER OPERATING SYSTEMS, AND THE DIAGNOSTIC DISKETTE.
   The dual-processor design attracted an unusual set of ports: Concurrent
   CP/M-86, the UCSD p-System, Venix/86R (a UNIX derivative), an early QNX,
   and Windows 1.03. The p-System is here as a bootable curiosity: an
   operating system that ran compiled P-code on an interpreter, so the same
   program ran on any processor the interpreter did. DEC's own Diagnostic
   Diskette is here too, because it exercises the bus model end to end.
   ========================================================================== */
const PSys = {
  vol: [['SYSTEM.PASCAL', 42, 'Code'], ['SYSTEM.FILER', 28, 'Code'], ['SYSTEM.EDITOR', 45, 'Code'], ['SYSTEM.COMPILER', 69, 'Code'], ['SYSTEM.MISCINFO', 1, 'Data'], ['SYSTEM.LIBRARY', 36, 'Code'], ['HELLO.TEXT', 4, 'Text'], ['HELLO.CODE', 2, 'Code']],

    Bus.setMode('boot', 'UCSD p-System loading'); Bus.set('z80', 'halt', 'Disk primitives — serving the p-machine\'s reads', 'Z80 private');
    Bus.set('i88', 'run', 'p-System: loading the P-machine interpreter', 'low RAM'); Bus.setExec('i88');
    await Disk.io(ctx, drv, 'read', 24, 0, 'SYSTEM.PASCAL');
    Bus.setMode('8088', 'UCSD p-System IV — P-code on the 8088\'s interpreter');
    await Con.write('\x1b[H\x1b[2J\r\n\r\n       Welcome  RAINBOW,  to\r\n\r\n       U.C.S.D.  p-System  IV.13\r\n\r\n       Current date is  28-Sep-84\r\n\r\n\r\n');
    Museum.first('psys');
    const prompt = 'Command: E(dit, R(un, F(ile, C(omp, L(ink, X(ecute, A(ssem, D(ebug,? [IV.13]';
    for (; ;) {
      Bus.set('i88', 'poll', 'P-machine: waiting for a command key', 'interpreter');

const Diag = {
  async start(ctx, drv) {
    FW.state = 'console'; FW.base = 'console'; VT.m.ansi = true;
    Bus.setMode('8088', 'Rainbow 100 Diagnostic Diskette'); Bus.set('i88', 'run', 'Diagnostic executive', 'low RAM'); Bus.set('z80', 'halt', 'Disk primitives', 'Z80 private'); Bus.setExec('i88');
    await Disk.io(ctx, drv, 'read', 16, 0, 'diagnostic executive');
    for (; ;) {
      await Con.write('\x1b[H\x1b[2J\r\n  Rainbow 100 Diagnostic Diskette VERSION 2.0 09/12/84\r\n  Copyright (c) 1983 Digital Equipment Corporation\r\n\r\n\x1b[1m                         MAIN DIAGNOSTIC MENU\x1b[m\r\n\r\n        [1]  TEST DRIVES A AND B\r\n        [2]  TEST COMPUTER\r\n        [3]  DISPLAY INDIVIDUAL TEST MENU\r\n        [4]  INSTALL NEW DIAGNOSTIC\r\n\r\n  PERFORM ONE OF THE FOLLOWING\r\n    * TYPE MENU NUMBER THEN PRESS <Return>\r\n    * PRESS <Help> FOR A MORE DESCRIPTIVE MENU\r\n    * PRESS <Set-Up> <Ctrl/Set-Up> TO RESTART SYSTEM\r\n\r\n  ');
      Museum.first('diag');
      const l = (await Con.readLine(ctx)).trim();
      if (l === '1') await this.drives(ctx);
      else if (l === '2' || l === '3') await this.computer(ctx, l === '3');
      else if (l === '4') { await Con.write('\r\n  NO NEW DIAGNOSTIC ON THIS DISKETTE.  PRESS <Return>'); await Con.readLine(ctx); }
    }
  },
  async drives(ctx) {
    await Con.write('\r\n  TEST DRIVES A AND B -- insert formatted scratch diskettes.  <Return> to begin');
    await Con.readLine(ctx);
    for (const s of ['A', 'B']) {
      await Con.write(`\r\n  DRIVE ${s}: `);
      const r = await Bus.request(ctx, 'i88', 'z80', { fn: 0x15, desc: `drive ${s}: seek, read, write, restore`, handler: () => RX50.selfTest(ctx, s), retDesc: v => v ? 'error' : 'passes' });
      await Con.write(r ? `\x1b[7m FAILURE: DRIVE ${s}: ${({ 12: 'NOT READY', 5: 'SEEK ERROR', 22: 'CARD IN DRIVE' })[r] || 'ERROR ' + r} \x1b[m` : 'PASSED');
    }
    await Con.write('\r\n\r\n  PRESS <Return> FOR THE MENU'); await Con.readLine(ctx);
  },
  async computer(ctx, one) {
    const tests = [['MEMORY (8088)', 'zram', 900], ['MEMORY (Z80)', 'zram', 600], ['VIDEO', 'video', 700], ['KEYBOARD', 'kbd', 400], ['COMM/PRINTER PORTS', 'mpsc', 600], ['NONVOLATILE MEMORY', 'rom', 300], ['GRAPHICS OPTION', 'gdc', 500], ['WINCHESTER', 'hdc', 700]];
    await Con.write('\x1b[H\x1b[2J\r\n  TEST COMPUTER -- the whole system, one test after another\r\n\r\n');
    for (const [n, dev, ms] of tests) {
      await Con.write(`    ${n.padEnd(24)}`);
      if (dev === 'gdc' && !Machine.gfx) { await Con.write('NOT INSTALLED\r\n'); continue; }
      if (dev === 'hdc' && !Win.present()) { await Con.write('NOT INSTALLED\r\n'); continue; }
      if (n === 'MEMORY (Z80)') { await Bus.request(ctx, 'i88', 'z80', { fn: 0x22, desc: 'move block: Z80 memory test', handler: async () => { Bus.set('z80', 'serve', 'Diagnostic: testing 62K shared + 2K private', 'all Z80 memory'); await ctx.sleep(ms); return {}; }, retDesc: () => 'Z80 memory passes' }); }
      else { for (let i = 0; i < 6; i++) { Bus.dev(dev); await ctx.sleep(ms / 6); } }
      await Con.write('PASSED\r\n');
    }
    await Con.write('\r\n  ALL TESTS PASSED.  PRESS <Return> FOR THE MENU'); await Con.readLine(ctx);
  }
};

    if (!FW.powered) now = `<p><b>It is switched off.</b> The power switch is on the front of the system unit, at the left. <span class="gbtn" data-act="power">Switch it on</span></p>`;
    else if (st === 'menu') now = `<p><b>This is the firmware's Main System Menu.</b> Press <b>T</b> and the machine is a VT102 terminal, at once, with no diskette at all. Or open the <span class="gbtn" data-act="disks">diskette box</span>, put MS-DOS or CP/M-86/80 in drive A, and press <b>A</b>.</p>`;
    else if (st === 'terminal') now = `<p><b>Terminal mode.</b> A VAX is on the other end of the line. Press <b>Return</b>, then log in as <b>VISITOR</b>, password <b>RAINBOW</b>. Set-Up is the F3 key (the third on the top row); Set-Up then Ctrl/Set-Up returns to the menu.</p>`;
    else if (st === 'console' || st === 'boot') now = `<p><b>${U.esc(Bus.modeLabel || 'An operating system is running')}.</b> Watch the panel above: which processor is executing, and every packet that crosses the shared memory between them.</p>`;
    return `<p class="big">The right features, the wrong standard</p>
      <p>The <b>DEC Rainbow ${M}</b>, ${M === '100B' ? '1984' : '1982'}: two processors, a VT-class screen of 80 or 132 columns that scrolls smoothly in hardware, the LK201 keyboard, three operating systems from one menu, and a genuine VT102 in ROM. On almost every line of the specification it was a better machine than the IBM PC.</p>
      <p>It was not IBM PC compatible — not the memory map, not the video, not the keyboard, not the diskette, not the expansion bus — and by 1983 compatibility was the only line that mattered. A standard is the one feature you cannot engineer.</p>
      ${now}<hr><div class="kv">Machine <b>Rainbow ${M}</b> · <b>${Machine.memK}K</b> · ${Machine.win !== 'none' && M === '100B' ? `<b>${Machine.win}</b> Winchester · ` : ''}${Machine.gfx ? '<b>graphics option</b> · ' : ''}<b>${Machine.monitor === 'color' ? 'VR241 colour' : 'VR201 ' + Machine.monitor}</b></div>
      <p style="margin-top:8px"><span class="gbtn" data-act="guide">The guide</span><span class="gbtn" data-act="tab:compat">The compatibility wall</span><span class="gbtn" data-act="tab:arch">What the panel shows</span><span class="gbtn" data-act="screen">Lean in to the screen</span></p>`;
  },
  intro() {
    const row = (a, b, c) => `<tr><td>${a}</td><td class="${b[0]}">${b.slice(1)}</td><td class="${c[0]}">${c.slice(1)}</td></tr>`;
    return `<div class="gwrap" style="display:block;overflow:auto;padding:28px 36px"><div style="max-width:900px;margin:0 auto;font:14px/1.6 var(--sans);color:#d3d9df">
      <h2 style="font:600 28px/1.2 var(--sans);color:#f3f5f7;margin-bottom:4px">Every line but one, again</h2>
      <div style="font:11px var(--mono);letter-spacing:.14em;color:#6c737c;text-transform:uppercase;margin-bottom:16px">Digital Equipment Corporation Rainbow 100B · 1984 · against the IBM PC XT of the same year</div>
      <table style="border-collapse:collapse;width:100%;font-size:13px;margin-bottom:14px">
        <tr><th style="text-align:left;padding:4px 8px;color:#e9edf1"></th><th style="text-align:left;padding:4px 8px;color:#bff0cf">Rainbow 100B</th><th style="text-align:left;padding:4px 8px;color:#e9edf1">IBM PC XT</th></tr>
        ${[row('Processors', 'yZ80A and 8088 — 8- and 16-bit software', 'n8088 only'), row('Text display', 'y80 or 132 columns, smooth hardware scroll', 'n80 columns, no smooth scroll'), row('Line attributes', 'ydouble width, double height, line drawing', 'nnone'), row('Keyboard', 'yLK201: editing keypad, 20 function keys, Compose', 'n83 keys, no editing keypad'), row('Operating systems in the box', 'yCP/M-86/80 and MS-DOS 2.11', 'nPC DOS'), row('Terminal', 'ya VT102 in ROM — press T', 'nneeds software and a card'), row('Diskettes', 'y400K per diskette, two in one drive', 'n360K'), row('Graphics', 'y384×240 in 16 of 4,096, or 800×240', 'n320×200 in 4 fixed colours'), row('IBM PC compatible', 'nno', 'yyes')].join('')}
      </table>
      <p>It won every line of the specification but one, and the missing line was compatibility. If you have visited the <a href="symbian.html" style="color:#9fe0b4">Nokia N95</a>, you have seen the matched pair: that phone won every line but interaction. Engineering does not beat a standard, and it does not beat a user's thumb.</p>
      <p>Everything here is simulated in this page, with nothing fetched: two processors on two buses joined by shared memory, the firmware, the VT102, CP/M-86/80, MS-DOS 2.11, a VAX on the serial line, and an IBM PC on the next desk for comparison. The panel on the right shows what the two processors are doing; it is the most interesting thing about the machine and invisible from the screen.</p>
      <p style="margin-top:18px"><button class="mbtn on" data-act="intro-on" style="font-size:13px;padding:8px 18px">Switch it on</button> <button class="mbtn" data-act="intro-close" style="font-size:13px;padding:8px 14px">Look at it first</button> <span style="font-size:12px;color:#8b939c;margin-left:10px">Then press <b>T</b>. The keys you type go to the LK201; F3 is Set-Up.</span></p>
      </div></div>`;
  },
  /* ---------------- first-time notes, in the museum's voice ---------------- */

    power: '<b>Power on.</b> The keyboard\'s four lights flash in turn, the tube warms, and the firmware writes <b>TESTING...</b> in reverse video while the 8088 tests the ROM, the RAM, the Z80 and the ports. On a fault it prints DEC\'s numbered message and lights a code on the back. <span class="gbtn" data-act="tab:setup">About the firmware</span>',
    cardmsg: '<b>MESSAGE 22 — Remove Card or Diskette.</b> The RX50 shipped with a cardboard protector in each slot, and this one still has one in drive A. The message is not fatal: press <b>T</b> and the machine is a terminal anyway. Click drive A to take the card out.',

    terminal: '<b>Terminal mode, instantly, with no diskette.</b> The firmware\'s background loop joins the keyboard to the communications port and the port to the VT102 in ROM. Nothing else runs; the Z80 is not even needed. Press <b>Return</b>: the VAX is waiting. <b>VISITOR</b> / <b>RAINBOW</b>. <span class="gbtn" data-act="tab:terminal">Why this came first</span>',
    setup: '<b>Set-Up.</b> The same mechanism as the VT100\'s: six menus (Next Screen and Prev Screen), arrows to choose and change, <b>Shift/S</b> to save to the NVM, <b>Shift/R</b> to recall, <b>Shift/D</b> for the factory defaults, and <b>Ctrl/Set-Up</b> to reset the whole machine. The first menu is the tab ruler. <span class="gbtn" data-act="tab:setup">Set-Up</span>',
    hold: '<b>Hold Screen.</b> The firmware stops taking characters; in terminal mode the receive buffer fills, AUTO XON/XOFF sends XOFF, and the VAX stops. Press it again to go on.',
    compose: '<b>Compose Character.</b> Compose, then two keys: <b>e</b> then <b>\'</b> makes é, <b>a</b> then <b>"</b> makes ä, <b>s s</b> makes ß, <b>L -</b> makes £. The 100B\'s firmware implements the compose algorithm and sends the DEC Multinational code. On a 100A the key only rang the bell.',
    compose100a: '<b>Compose rings the bell on a 100A.</b> DEC\'s 1983 terminal manual: in terminal mode the key "is non-functional and rings the bell". The 100B\'s larger firmware added the compose algorithm.',
    col132: '<b>132 columns.</b> Each character cell is nine dots wide instead of ten, and a page of a wide report fits. The IBM PC\'s display could not do this. <span class="gbtn" data-act="screen">Lean in</span>',
    col132vax: '<b>The host switched the terminal to 132 columns</b> by sending ESC [ ? 3 h down the line. Now <b>TYPE BUDGET84.DAT</b>: a page wider than an IBM PC could show.',
    rubout: '<b>CP/M\'s rubout.</b> In CP/M the delete key echoes the character it deletes, rather than erasing it — the way it was. F12 (BS) moves back and erases.',
    door: '<b>The RX50\'s door.</b> A latch lever for each slot. Both diskettes turn on one spindle, and one carriage moves both heads. The lower slot takes its diskette label-down.',
    ibmdisk: '<b>An IBM diskette in the RX50.</b> DEC\'s MS-DOS could read the IBM\'s <i>single-sided</i> formats. The double-sided 360K diskette every PC wrote from 1983 is another matter. Try <b>DIR B:</b>, then <b>TYPE</b> a file. <span class="gbtn" data-act="tab:rx50">The diskette</span>',
    otherdisk: '<b>Same diskette, another machine.</b> The DECmate II and the Professional used the same RX50 media with their own file structures. The Rainbow can turn the diskette; it cannot read what is on it.',

    print: '<b>Print Screen</b> sends the screen to the LA50 on the printer port — serial, 4800 baud, 8 bits, no parity, as DEC shipped both.',
    defaults: '<b>Factory defaults restored.</b> They are not saved until you press Shift/S.',
    smooth: '<b>Smooth scroll.</b> The Rainbow\'s DC011/DC012 video moved the picture a scan line at a time, in hardware, while the parser waited. The MISC screen sets the rate.',
    jump: '<b>Jump scroll</b>: faster, and ordinary. Put it back to SMOOTH to see what the IBM PC could not do.',

    vaxin: '<b>You are logged in to a VAX that is not there.</b> The host asked the terminal what it was, with ESC [ c, and the Rainbow answered ESC [ ? 6 c: a VT102. Try <b>DIR</b>, <b>MAIL</b>, <b>SHOW USERS</b>, <b>EDIT NOTES.TXT</b>, <b>SET TERMINAL/WIDTH=132</b>. <span class="gbtn" data-act="tab:terminal">More</span>',
    showusers: '<b>SHOW USERS.</b> The people in the machine room\'s world: this is what the Rainbow was for in most of the offices that bought it.',
    budget: '<b>BUDGET84.DAT is 118 columns wide.</b> At 80 columns it wraps; <b>SET TERMINAL/WIDTH=132</b> and TYPE it again, and the page fits.',
    mailread: '<b>VAX/VMS Mail.</b> SEND, REPLY, DIRECTORY, DELETE, EXIT. Reply to someone and they will answer.',
    edt: '<b>EDT, in keypad mode.</b> The numeric keypad is the editor: <b>PF1</b> is GOLD, <b>PF2</b> is HELP. The editing keypad does what it says: <b>Find</b> searches (type the string, then Enter), Remove cuts, Insert Here pastes, Select marks. <b>Ctrl/Z</b> and <b>EXIT</b> to save. On a PC keyboard, Home is Find.',
    edtfind: '<b>The Find key.</b> The editing keypad the PC world did not get for years, doing exactly what its label says, in the editor it was designed with.',
    edthelp: '<b>EDT\'s keypad diagram</b>, drawn by the host in DEC Special Graphics — the line-drawing set — down a 9600-baud line.',
    edtexit: '<b>A new version.</b> VMS never overwrites: the file is now one version higher. DIRECTORY shows both.',
    msdos64k: '<b>MS-DOS needs 128K.</b> DEC documented it. A 100A shipped with 64K: enough for CP/M-86/80, not for MS-DOS. Fit memory in <span class="gbtn" data-act="config">Machine</span>.',
    cls: '<b>CLS</b> on a Rainbow sends ESC [ 2 J to the VT102 firmware. There is no video BIOS to call.',

    typebin: '<b>TYPE on a program</b> sends its bytes to a terminal. Some of them are control characters, and the terminal acts on them: the line-drawing set is often one of the results.',
    ibmss: '<b>An IBM single-sided diskette, read.</b> DEC\'s driver identified the IBM\'s 8- and 9-sector single-sided formats. Reading was fine; writing was not recommended. Now try running one of its programs.',
    ibmds: '<b>A double-sided IBM diskette, misread.</b> The RX50 reads only one side. It found the directory — the first sectors are on side 0 — took the diskette for single-sided, and every file it reads will come from the wrong sectors. TYPE one. <span class="gbtn" data-act="tab:rx50">Why</span>',

  /* ---------------- the guide ---------------- */
  PAGES: {
    welcome: () => `<h2>Start here</h2>
      <p>This is a Digital Equipment Corporation Rainbow 100B, as it sat on the desk of a DEC customer in 1984: a putty system unit with the RX50 dual diskette drive on its face, a VR201 monitor, and the long, low LK201 keyboard. Everything is simulated in this one page.</p>
      <h3>Ten minutes, in order</h3>
      <ul>
        <li><b>Switch it on</b> (the rocker at the front left of the system unit). Watch the keyboard's lights, the TESTING message and the Main System Menu.</li>
        <li><b>Press T.</b> You are a VT102 terminal, instantly, with no diskette. Press Return and log in to the VAX: <code>VISITOR</code>, password <code>RAINBOW</code>. Try <code>MAIL</code>, <code>SHOW USERS</code>, <code>EDIT NOTES.TXT</code> (the keypad is the editor; the Find key searches), and <code>SET TERMINAL/WIDTH=132</code> then <code>TYPE BUDGET84.DAT</code>.</li>
        <li><b>Press F3</b> for Set-Up; <b>Ctrl+F3</b> inside Set-Up resets the machine to its menu.</li>
        <li>Open the <b>diskette box</b>, put <b>MS-DOS V2.11</b> in drive A, press <b>A</b>. Answer the date and time with Return. <code>TYPE README.TXT</code>, then <code>TYPE ESCAPE.TXT</code>. Watch the panel: every sector is a packet from the 8088 to the Z80.</li>
        <li>Put <b>PC programs that do and do not run</b> in drive B. <code>B:</code>, then try <code>LOANCALC</code> — it runs — and then <code>STARFALL</code>, and open the printer.</li>
        <li>Put <b>CP/M-86/80</b> in A and <b>CP/M-80 programs</b> in B; start from A. <code>SIEVE</code> runs on the 8088; <code>B:</code> then <code>SIEVE</code> runs on the Z80. Nothing on the screen tells you a hand-over happened. The panel does.</li>
      </ul>
      <h3>Keys</h3>
      <p>Your keyboard is mapped onto the LK201. F1 Hold Screen, F2 Print Screen, <b>F3 Set-Up</b>, F4, F5 Break, F6–F10 Interrupt, Resume, Cancel, Main Screen, Exit, F11 sends ESC (Esc does too), F12 BS. Home is <b>Find</b>, Insert is Insert Here, Delete is Remove, End is Select, Page Up and Page Down are Prev and Next Screen. Num Lock, /, * and − are PF1–PF4. Alt is Compose Character. Backspace is the LK201's <code>&lt;X]</code> delete key. In Screen view, a bar of the LK201's special keys sits under the monitor; in Desk view you can press any key on the drawn keyboard.</p>
      <h3>The rail</h3>
      <p><b>Diskettes</b> opens the diskette box. <b>IBM PC</b> opens the PC on the next desk. <b>Printer</b> shows the LA50. <b>Machine</b> changes the model (100A or 100B), the memory, the Winchester, the graphics option and the monitor — with the power off. <b>Rear</b> turns the system unit round.</p>`,
    thesis: () => `<h2>The right features, the wrong standard</h2>
      <p>In 1982 Digital Equipment Corporation was the second-largest computer company in the world. It had some of the best engineers in the industry; it owned the minicomputer market with the PDP-11 and the VAX; and its terminals — the VT100 and its descendants — were the reference design for what a screen and a keyboard should be. When it built a personal computer, it built one that was, on almost every technical measure, better than the IBM PC.</p>
      <p>The Rainbow had two processors, a Zilog Z80A and an Intel 8088, so that one boot menu could reach all three of the era's major operating systems: CP/M-80 on the Z80, CP/M-86 and MS-DOS on the 8088. Its display was VT-class: 80 or 132 columns, crisp, with a smooth scroll the IBM PC's video could not do. Its keyboard was the LK201, the VT220's, with an editing keypad and a Compose key. Its RX50 drive held two diskettes in one unit. And at a keystroke it became a VT102 terminal to a VAX, which for DEC's installed base was worth more than all the rest.</p>
      <p>It failed completely. It was not IBM PC compatible — not the memory map, not the video, not the keyboard, not the diskette format, not the expansion bus — and by 1983 compatibility was the only feature that mattered. A program that used only MS-DOS calls would run; the great majority of PC software, which wrote to the IBM's video memory and called the IBM's BIOS directly, would not. David Ahl, who had worked at DEC before founding <i>Creative Computing</i>, called it "a disastrous foray into the personal computer market". DEC replaced it in 1986 with the VAXmate, which was PC-compatible, which is to say that DEC conceded.</p>
      <h3>A matched pair</h3>
      <p>This collection also holds the <a href="symbian.html">Nokia N95</a>. The two exhibits are a pair with a difference. The N95 won every line of the spec sheet but one, and the missing line was interaction. The Rainbow won every line but one, and the missing line was compatibility. Engineering does not beat a standard, and it does not beat a user's thumb.</p>
      <table><tr><th></th><th>Rainbow 100B (1984)</th><th>IBM PC XT (1984)</th></tr>
      <tr><td>Processors</td><td class="yes">Z80A 4.012 MHz and 8088 4.815 MHz</td><td>8088 4.77 MHz</td></tr>
      <tr><td>Standard memory</td><td>128K, to 896K</td><td>128K–256K, to 640K</td></tr>
      <tr><td>Text</td><td class="yes">80/132 × 24, smooth scroll, double width and height, line drawing</td><td>80 × 25</td></tr>
      <tr><td>Keyboard</td><td class="yes">LK201: 105 keys, editing keypad, Compose</td><td>83 keys</td></tr>
      <tr><td>Diskettes</td><td>RX50: two 400K single-sided diskettes in one drive</td><td>one 360K double-sided drive</td></tr>
      <tr><td>Hard disk</td><td>5 or 10 MB Winchester option, bootable</td><td>10 MB standard</td></tr>
      <tr><td>Terminal</td><td class="yes">VT102 in ROM</td><td>software and a card</td></tr>
      <tr><td>Price</td><td>$2,750 for the 100B; $5,475 for the 100+ with a Winchester</td><td>about $5,000 with its fixed disk</td></tr>
      <tr><td>Runs the software in the shops</td><td class="no">a small part of it</td><td class="yes">all of it</td></tr></table>`,
    terminal: () => `<h2>A terminal company built a computer</h2>
      <p>The Rainbow's boot menu offers terminal mode as a peer of starting an operating system: <b>T = enter Terminal Mode</b>, beside A, B, C, D and W. Press T and the machine is a VT102, with no diskette, no operating system and no Z80: the firmware's background loop joins the keyboard to the communications port and the port to the VT102 in ROM. That single menu entry is the whole company. DEC's world was a large computer in a machine room and a terminal on every desk, and the Rainbow was a terminal that could also, if you insisted, be a computer. So terminal mode is the most polished and most instant thing on the machine, and here it is too.</p>
      <h3>The VAX at the other end</h3>
      <p>On the serial line is a VAX-11/780 running VAX/VMS V4.0 at an invented insurance company, with invented colleagues. Press Return, and log in as <code>VISITOR</code> with the password <code>RAINBOW</code>. Things to do: <code>DIRECTORY</code>, <code>TYPE WELCOME.TXT</code>, <code>MAIL</code> (read, reply — people answer), <code>SHOW USERS</code>, <code>SHOW TERMINAL</code> (the Rainbow told the host it was a VT102), <code>EDIT NOTES.TXT</code>, <code>SET TERMINAL/WIDTH=132</code>, <code>HELP</code>, <code>LOGOUT</code>.</p>
      <p>Everything crosses a simulated 9600-baud line, 960 characters a second, in both directions. EDT draws its screen with the VT102's scrolling region and insert and delete functions; the host keeps a copy of what it believes is on your screen and sends only the differences, and the Rainbow's smooth scroll carries the text. Hold Screen stops the display; the receive buffer fills; the firmware sends XOFF, and the host stops. Change the baud rate in Set-Up's MODEM screen and the line turns to garbage, as it did.</p>
      <h3>EDT and the editing keypad</h3>
      <p>In EDT the numeric keypad is the editor — PF1 is GOLD, PF2 is HELP, 4 and 5 set the direction, 1 moves by word, 0 by line, the decimal point selects — and the LK201's editing keypad does what its labels say: <b>Find</b> asks for a string and searches, Remove cuts, Insert Here pastes, Select marks, Prev and Next Screen page. Ctrl/Z drops to line mode, where EXIT writes a new version of the file.</p>
      <p>If this collection's <a href="sunos.html">SunOS</a> and <a href="solaris.html">CDE</a> exhibits are the workstation — a computer on the desk, a network behind it — this is the other model: the computer in the machine room and a terminal on the desk. The Rainbow was a terminal first.</p>`,
    three: () => `<h2>Three machines at once</h2>
      <p>DEC could not decide which personal computer to make, so in May 1982 it announced three, on the same day, in the same industrial design:</p>
      <table><tr><th>Machine</th><th>Processor</th><th>Software world</th></tr>
      <tr><td><b>Rainbow 100</b></td><td>Zilog Z80A and Intel 8088</td><td>CP/M-80, CP/M-86, MS-DOS; a VT102 in ROM</td></tr>
      <tr><td><b>DECmate II</b></td><td>Harris/Intersil 6120 — a PDP-8 on a chip</td><td>WPS-8 word processing, COS-310</td></tr>
      <tr><td><b>Professional 325 and 350</b></td><td>F-11 — a PDP-11 on a chip</td><td>P/OS, a version of RSX-11M</td></tr></table>
      <p>Three processor families, three software worlds, one launch, and one diskette: all three used the RX50, and none could read the others' diskettes (the exhibit's diskette box has one from each). The Rainbow was a third of one of the clearest strategic errors in the industry's history. DEC's sales force, which sold minicomputers to data-processing departments, now had three incompatible desktop machines to explain, none of them the one the customer's own staff were buying.</p>
      <p>Contemporary accounts give the Rainbow's launch price as $3,245 with 64K in 1982. The Professional was the one Ken Olsen, DEC's founder, was said to favour. All three were gone by the end of the decade.</p>`,
    arch: () => `<h2>Two processors, two buses</h2>
      <p>The Rainbow is two computers in one case, joined only by memory. The <b>Z80A</b> has its own 8-bit bus, carrying the RX50 controller (an FD1793) and 2K of RAM that only it can see; it can see 62K of the 8088's low 64K bank. The <b>8088</b> has its own 8-bit bus, carrying everything else: the video (DC011 and DC012, 4K of screen RAM and 4K of attribute RAM), the 8251A that talks to the keyboard, the 7201 MPSC for the communications and printer ports, the Winchester controller, the graphics option, the NVM that holds Set-Up, the ROM, all of the memory — and its own 2K that the Z80 cannot see, which is where the interrupt vectors live.</p>
      <h3>The division of labour</h3>
      <p>The Z80 performs every diskette access for both processors. When the 8088 wants a sector it builds a message packet in shared memory, stores the packet's address at an agreed location, and writes I/O port 00h, which interrupts the Z80. The Z80 does the work, writes a status into the packet, and writes its own port 00h, which interrupts the 8088 (interrupt 39, 27h). DEC's function codes: 13h read a sector, 14h write one, 15h check media, 21h start the Z80 at an address, 22h move a block, 40h and up for BDOS calls going the other way.</p>
      <p>The panel on the right is the first client of the exhibit's bus model, and it draws those packets because they happen: when MS-DOS runs DIR, you will see 8088→Z80 13h READ SECTOR and Z80→8088 done, once per sector. The Winchester is the exception: it is on the 8088's bus, so its transfers never cross.</p>
      <h3>Three modes</h3>
      <ul><li><b>Terminal mode</b>: the firmware runs the VT102 on the 8088; the Z80 is held in reset. No operating system is loaded.</li>
      <li><b>8088 mode</b>: MS-DOS or CP/M-86 runs on the 8088; the Z80 halts and waits to be asked for a sector — an I/O processor.</li>
      <li><b>Z80 mode</b>: an 8-bit CP/M-80 program runs on the Z80. The keyboard and screen are on the 8088's bus, so the 8088 waits in a service routine and performs each BDOS call for it. The roles are reversed, and the panel shows it.</li></ul>
      <h3>Memory, honestly</h3>
      <p>The 100B has 128K on its system module, as a low 64K bank the Z80 shares and a high 64K bank it cannot see; the memory option takes the total to 896K, all of it the 8088's. The 100A had 64K. Each operating system arranges the shared bank differently, and the panel's two bars show both views: the 8088's megabyte, with the IBM PC's video addresses marked on it for what they are here (ordinary memory, or nothing), and the Z80's 64K, whose low 2K is its own.</p>`,
    cpm: () => `<h2>CP/M-86/80: one prompt, two processors</h2>
      <p>Digital Research's CP/M-86, patched by DEC, ran both 8-bit and 16-bit programs from the same A> prompt. The CCP and the BDOS run on the 8088. When you name a program, the CCP looks for a <code>.CMD</code> file first: that is an 8088 program, and it runs as in plain CP/M-86. If there is no .CMD but there is a <code>.COM</code>, it is an 8-bit CP/M-80 program. The CCP loads <code>Z80CCP.SYS</code>, which reconfigures memory so the program can start at 0100h — moving CP/M out of the way, loading <code>Z80.SYS</code> — and reads the .COM straight into the Z80's memory with a flag set "so that it will appear to the BIOS that the Z80 is requesting the read". Then START Z80, and the Z80 is the master. The 8088 waits in its Z80 Service Routine, and every BDOS call the 8-bit program makes becomes a packet to it. A disk read by an 8-bit program crosses the shared memory three times.</p>
      <p>Try it: CP/M-86/80 in drive A, the CP/M-80 programs diskette in drive B. <code>SIEVE</code> on A: runs SIEVE.CMD on the 8088. <code>B:</code>, then <code>SIEVE</code>: B: has only SIEVE.COM, and the Z80 runs it, more slowly. Nothing on the screen tells you a hand-over occurred. <code>PIP</code> and <code>STAT</code> work the same way: PIP.CMD on A:, PIP.COM on B:. <code>LIFE</code> draws with VT100 cursor addressing from the Z80, every byte of it through the 8088.</p>
      <p>On a 64K system the Z80's transient program area is BE00h bytes — 47.5K, as DEC's manual gives it; BIGCALC.COM is too big for it on a 64K 100A and loads on a 100B.</p>
      <h3>CP/M-80, CP/M-86, and the timing</h3>
      <p>In 1982, CP/M compatibility was a selling point: there was a large library of 8-bit business software, and a Z80 inside meant it ran. By 1984 it was a historical note: the PC had taken the market and MS-DOS with it. The Rainbow's timing straddled the change and got the worst of both — a CP/M machine when CP/M was ending, and an MS-DOS machine that was not an IBM.</p>
      <p>CP/M's own commands work as CP/M said them: <code>DIR</code>, <code>TYPE</code>, <code>ERA</code>, <code>REN NEW=OLD</code>, <code>USER n</code>, <code>STAT</code>, <code>PIP B:=A:*.TXT</code>, <code>SUBMIT HELLO</code>, and <code>ED</code>, the editor everyone remembers for the wrong reasons (type <code>#A</code> first, <code>#T</code> to see the text, <code>E</code> to save).</p>`,
    compat: () => {
      const T = Guide.triedSet || {};
      const row = id => { const P = PROGS[id]; const t = T[P.file]; return `<tr><td><code>${P.file}</code></td><td>${U.esc(P.title)}<br><span style="color:#8b939c">${U.esc(P.vendor)}, ${P.year}</span></td><td>${({ dos: 'MS-DOS calls only', bios: 'IBM BIOS calls', hw: 'IBM hardware, directly' })[P.cls]}</td><td class="${P.cls === 'dos' ? 'yes' : 'no'}">${P.cls === 'dos' ? 'runs' : 'fails'}</td><td>${t ? '✓ tried' : ''}</td></tr>`; };
      return `<h2>The compatibility wall</h2>
      <p>MS-DOS on the Rainbow is real MS-DOS, and any program that asks MS-DOS to do everything — every character on the screen, every key, every file — runs. That was the promise: like CP/M before it, MS-DOS would make hardware interchangeable. It did not, because the IBM PC's MS-DOS was slow at the screen and the IBM PC's hardware was documented, so programs went around it: they called the IBM's BIOS, wrote straight into its video memory, read its keyboard port and programmed its timer. On a Rainbow none of those things is where the program expects it.</p>
      <h3>How the exhibit decides</h3>
      <p>Each program here is written once, against the machine it expects, through a small machine interface. The IBM PC on the next desk implements that interface correctly. The Rainbow implements it from DEC's own maps: INT 10h, 16h, 13h, 11h and 12h return having done nothing (the Rainbow's firmware is at INT 40h, its diskettes at INT 65h); B8000h and B0000h are ordinary RAM or nothing; ports 60h and 61h are the Winchester controller; ports 40h–43h are the communications and printer ports' MPSC; INT 18h is the firmware's screen-write call; the IBM's timer tick never arrives. Nothing in any program says what should go wrong on a Rainbow. What goes wrong comes out of the maps.</p>
      <table><tr><th>File</th><th>Program</th><th>How it reaches the machine</th><th>Rainbow</th><th>Tried here</th></tr>${Object.keys(PROGS).map(row).join('')}</table>
      <p>Three of twelve. That is the honest proportion: in 1983 most commercial PC software fell into the second and third categories, and the most popular — the games, the spreadsheets, the fast utilities — were in the third, because going to the hardware was what made them fast.</p>
      <h3>The applications DEC secured</h3>
      <p>DEC did the work. It secured Rainbow versions of the major applications — the spreadsheet that defined the era, a word processor, a database — and brought its own word processing over from the DECmate. They are here as original stand-ins on the <b>Rainbow Applications</b> diskette: <b>Quadrant</b>, <b>Penwright</b>, <b>Strata II</b> and <b>Scriptor/RB</b>, and they run, because they draw with VT100 escape sequences through the firmware. The IBM edition of Quadrant is on the compatibility diskette as QUADIBM.EXE. Run both. It did not matter: the major applications came, and the long tail of everything else did not, and a customer buys the machine for the tail.</p>
      <p>Later, a program called Code Blue ran many text-mode IBM programs on the Rainbow by intercepting the BIOS calls and the video writes — an emulator of the standard, which is another way of saying that the standard had won.</p>`;
    },
    rx50: () => `<h2>The diskette nobody else could read</h2>
      <p>The RX50 is one drive with two slots, one above the other, on a common spindle: both diskettes turn when the motor runs, and one carriage steps both heads. The heads read the underside of each diskette, so the upper slot (A) takes a diskette label-up and the lower (B) takes it label-down. Each diskette is single-sided, 96 tracks per inch, 80 tracks of ten 512-byte sectors — 400K — with a 2:1 interleave on the data tracks.</p>
      <h3>What DEC documented, in both directions</h3>
      <ul>
        <li><b>IBM → Rainbow.</b> DEC's MS-DOS driver automatically identified and read the IBM PC's <i>single-sided</i> 8- and 9-sector diskettes (160K and 180K) and the VT180's. It could write them too, but "data written to IBM diskettes is usually unreadable by the IBM PC, because the narrow head of the RX50 cannot fully erase the wide data tracks." It could not read the double-sided 360K diskette, which is what every PC wrote by default from PC DOS 2.0 in 1983: it sees one side, takes the diskette for single-sided, finds the directory and then reads every file from the wrong sectors. DEC warned: do not run CHKDSK /F on one.</li>
        <li><b>Rainbow → IBM.</b> No IBM PC could read an RX50 diskette without special software (and, later, a 96-tpi drive). DEC eventually shipped RX50DRVR for the PC AT's high-density drive; Sydex sold RainDOS and 22DISK.</li>
      </ul>
      <h3>The experiment</h3>
      <p>Open the <span class="gbtn" data-act="pc">IBM PC</span>. Grace in Underwriting needs RATES.TXT, which is on the PC's fixed disk and on her double-sided diskette. Put her diskette in the Rainbow: the directory appears, and the file is nonsense. Put a blank diskette in the PC, <code>FORMAT A:</code>, <code>COPY RATES.TXT A:</code>, carry it across: nonsense again. <code>FORMAT A:/1</code> instead — single-sided — and the Rainbow reads it. Now write on it from the Rainbow and carry it back. The diskette was the problem, and then it was the solution, and then it was the problem again.</p>
      <p>The same physical diskettes went into the DECmate II and the Professional 350. Three machines, one medium, three file structures. The box has one of each.</p>
      <h3>The Winchester</h3>
      <p>The 100B's firmware can start from a Winchester — an RD50 of 5 MB or an RD51 of 10 MB on a WD1010 controller, partitioned here for MS-DOS (E:) and CP/M-86/80 — with <b>W</b> at the menu, or automatically if Set-Up's AUTO-BOOT screen says W. The 100A had no W.</p>`,
    setup: () => `<h2>Set-Up</h2>
      <p>The Set-Up key — F3, the third key on the top row — works in terminal mode, at the menu and under an operating system: the screen is saved, Set-Up takes it over, and pressing Set-Up again gives it back. It is the same mechanism as the VT100's, and a DEC user looks for it at once.</p>
      <table><tr><th>Screen</th><th>What it sets</th></tr>
      <tr><td>TABS</td><td>The tab ruler: arrows move, T or up/down sets and clears a stop, Ctrl/Tab clears all, Shift/Tab restores every eighth column.</td></tr>
      <tr><td>PARAM SET</td><td>The switches, in groups of four, as 1s and 0s with the selected one named below: scroll (jump or smooth), 80 or 132 columns, cursor, ANSI or VT52, auto repeat, screen (dark or light), margin bell, keyclick, auto XON/XOFF, auto wrap, new line mode, character set, auto screen blank, 60 or 50 Hz, print options, local echo, break, stop bits, parity checking, answerback, disconnect options — and on the 100B lock mode, keyboard and character codes. Shift/A stores an answerback message.</td></tr>
      <tr><td>MODEM</td><td>Data bits and parity, transmit and receive baud, protocol (FDXA, FDXB, FDXC). The VAX's line is 9600, 8 bits, no parity: change it and see.</td></tr>
      <tr><td>PRINTER</td><td>The LA50's line: 4800 baud, 8N.</td></tr>
      <tr><td>MISC</td><td>Scroll rate (1–3), bell volume and <b>click volume</b> (1–8).</td></tr>
      <tr><td>AUTO-BOOT</td><td>(100B only) The drive to start from at power-up: A, B, C, D, W, or ? for none.</td></tr></table>
      <p><b>Next Screen</b> and <b>Prev Screen</b> move between screens; <b>Help</b> shows the keys. <b>Shift/S</b> saves to the NVM, <b>Shift/R</b> recalls, <b>Shift/D</b> restores the factory defaults, <b>L</b> switches between LINE and LOCAL, and <b>Ctrl/Set-Up</b> resets the whole machine — a brief test, then the menu. That is how you leave terminal mode, and how you recover from an IBM program that has taken the 8088 somewhere it cannot return from.</p>
      <p>DEC's note, which the exhibit follows: some features must stay at their factory settings to use the software that came with the machine — ANSI emulation, auto-wrap off, new line mode LF.</p>
      <p>Screen brightness was a knob on the VR201, not a Set-Up field as on the VT100; the monitor's two knobs work (drag them).</p>
      <p style="margin-top:14px"><button class="mbtn warn" data-act="factory">Reset the whole exhibit to factory defaults…</button> — the Shift/D of the museum: Set-Up, every diskette, the Winchester, the VAX account and the machine configuration.</p>`,
    lk201: () => `<h2>The LK201</h2>
      <p>The same keyboard DEC put on the VT220, and it matters: a main typing area; twenty function keys in groups, with a label strip naming what the Rainbow made of them; the six-key <b>editing keypad</b> — Find, Insert Here, Remove, Select, Prev Screen, Next Screen — over an inverted T of arrows; a numeric keypad with <b>PF1–PF4</b> along its top and a tall Enter; and <b>Compose Character</b> at the lower left. IBM adopted the inverted-T arrows and the separate editing keys for its own enhanced keyboard in 1985.</p>
      <p>There is no Escape key: F11 sends ESC, F12 BS, F13 LF — which is why DEC's EDLIN notes tell you to use the Interrupt key when an escape is needed. There is no Alt key and no Ctrl-Alt-Del: the reset is Set-Up, then Ctrl/Set-Up.</p>
      <p>The four lights are Hold Screen, Lock, Compose and Wait. The click comes from a transducer in the keyboard, and its volume is set in Set-Up's MISC screen; it is on by default, because it was. The keyboard cable plugs into the monitor, which carries it to the system unit in the same cable as the video.</p>
      <h3>Compose Character</h3>
      <p>On the 100B, press Compose, then two keys: <code>e</code> then <code>'</code> gives é; <code>a</code> <code>"</code> ä; <code>s</code> <code>s</code> ß; <code>c</code> <code>,</code> ç; <code>L</code> <code>-</code> £; <code>&lt;</code> <code>&lt;</code> «. The Compose light is on while you compose. On the 100A the key rang the bell in terminal mode: DEC's 1983 manual reserved it for "future Rainbow 100 systems", and the 100B is that system.</p>`,
    graphics: () => `<h2>The graphics option</h2>
      <p>A separate board with its own memory and an NEC 7220 display controller, driving a colour monitor (the VR241) or the ordinary VR201: 384 × 240 in sixteen colours chosen from a palette of 4,096, or 800 × 240 in four, with the text display overlaid on it. The 7220 draws lines and fills areas itself. Few programs used it. The interface software was Digital Research's <b>GSX</b>, the Graphics System Extension, which found little software on any machine.</p>
      <p>Fit it in <span class="gbtn" data-act="config">Machine</span> (with the power off) and choose the VR241, start MS-DOS, put the <b>GSX-86 Graphics</b> diskette in drive B, and run <code>B:GRAFDEMO</code>: the colour map, business graphics of the kind GSX was sold for, vector drawing, and the 800-dot mode. Quadrant's /G graphs on it; Windows 1.03 needs it.</p>
      <p>A detail for the precise: DEC's standard colour cable connected the VR241's green gun to the Rainbow's monochrome output, so text appeared on the green gun. The exhibit draws the graphics in full colour and the text in green.</p>`,
    others: () => `<h2>Other operating systems</h2>
      <p>The dual-processor design attracted an unusual set of ports. What is documented:</p>
      <ul>
        <li><b>Concurrent CP/M-86</b> (Digital Research): multitasking CP/M for the 8088. It could not run 8-bit programs.</li>
        <li><b>UCSD p-System</b> (SofTech Microsystems): compiled P-code on an interpreter, so a program ran on any machine with a p-machine — another answer to incompatibility. It is on the diskette box as a bootable curiosity.</li>
        <li><b>Venix/86R</b> (VenturCom): a UNIX derivative. The record describes Venix 2.0 of 1984 as still based on Version 7 UNIX; it is sometimes described as System III. Its source has since been recovered by Rainbow enthusiasts.</li>
        <li><b>QNX</b> (Quantum Software Systems): the early 8088 versions of the microkernel system ran on the Rainbow. This collection's <a href="qnx.html">QNX 4.25</a> exhibit is the same system fifteen years later, on one floppy.</li>
        <li><b>Windows 1.03</b> — from 1986, two years after this 100B, and in the box as a later curiosity: Microsoft produced a Rainbow version because DEC was a large enough customer to ask. It drew on the graphics option in the 800 × 240 four-colour mode, and it is in the diskette box. If you have seen <a href="win101.html">Windows 1.01</a> here, these are the same tiled windows, on a machine that could not run most of the software they were for.</li>
      </ul>`,
    models: () => `<h2>100A and 100B</h2>
      <p>The exhibit is the 100B of 1984, the machine at its most complete; the 100A of 1982 is offered as a variant (<span class="gbtn" data-act="config">Machine</span>, power off). The difference is the story of a company revising a machine the market had already declined.</p>
      <table><tr><th></th><th>100A (May 1982)</th><th>100B (1984)</th></tr>
      <tr><td>Memory on the system module</td><td>64K</td><td>128K</td></tr><tr><td>Memory with options</td><td>256K with DEC's boards</td><td>896K</td></tr>
      <tr><td>Firmware</td><td>three 8K ROMs, version 04.03.11A</td><td>two 16K ROMs, 05.03A</td></tr>
      <tr><td>Menu</td><td>A, B, C, D, S, T</td><td>A, B, C, D, <b>W</b>, S, T</td></tr>
      <tr><td>Winchester</td><td>cannot start from one</td><td>RD50 or RD51, bootable; auto-boot</td></tr>
      <tr><td>Self-test messages</td><td>terse: "not ready", "boot load"</td><td>longer: "See Owner's Manual - MESSAGE 21 - Drive Not Ready"</td></tr>
      <tr><td>Compose</td><td>rings the bell</td><td>composes DEC Multinational characters</td></tr>
      <tr><td>Set-Up</td><td>five screens</td><td>six, with AUTO-BOOT, lock mode, national keyboards, 8-bit codes</td></tr>
      <tr><td>Power supply and fan</td><td>H7842-A, an AC fan (louder)</td><td>H7842-D, strong enough for a Winchester; a DC fan</td></tr>
      <tr><td>Interrupt vectors</td><td>20h–27h, the range MS-DOS uses for itself</td><td>relocatable out of the way, to A0h–A7h</td></tr>
      <tr><td>Price</td><td>$3,245 at launch, 64K</td><td>$2,750; the 100+ with a 10 MB Winchester $5,475</td></tr></table>
      <p>MS-DOS needs 128K; a 100A as shipped could run CP/M-86/80 but not MS-DOS until memory was added.</p>`,
    limits: () => `<h2>Honest limitations</h2>
      <ul>
        <li><b>Not IBM PC compatible</b>, in every dimension that mattered: memory map, video, keyboard, BIOS, diskette, expansion bus.</li>
        <li><b>The diskettes</b>: a proprietary format, readable by no IBM; IBM's standard double-sided format unreadable here.</li>
        <li><b>The price</b>: well above an IBM PC in a comparable configuration, and DEC's pricing did not fall fast enough.</li>
        <li><b>The 100A could not start from a hard disk</b>, and the 100B arrived after the market had moved.</li>
        <li><b>Expansion was limited to DEC's own options</b>; there were no industry-standard slots, so the third-party card industry that grew up around the PC passed the Rainbow by.</li>
        <li><b>The dual-processor design was a compromise.</b> A period judgement, often repeated: that the Rainbow was a box of compromises, trying to be everything to everyone, and failing to be anything to all but a few.</li>
        <li><b>DEC's sales organisation</b> sold minicomputers to data-processing departments, and did not know how to sell a personal computer to anyone. One DEC salesman's reported view: why try to sell twelve Rainbows when you get the same commission for one VAX.</li>
        <li><b>Three machines at once</b>: the Rainbow, the DECmate II and the Professional, incompatible with each other, launched together.</li>
        <li><b>The cultural one</b>: the company's leadership did not believe the personal computer was a serious category, and its personal computer reflected that.</li>
      </ul>`,
    right: () => `<h2>What was right</h2>
      <ul>
        <li><b>The display</b>: 132 columns, smooth scrolling in hardware, double width and height, line drawing — better than any IBM PC screen of the era.</li>
        <li><b>The keyboard</b>: the LK201, with an editing keypad the PC world did not get for years.</li>
        <li><b>Three operating systems from one menu</b>, and a combined CP/M that ran both processors' software transparently.</li>
        <li><b>A genuine VT102 in ROM</b>, which made it the best terminal a DEC shop could put on a desk.</li>
        <li><b>The engineering</b>: two buses, shared memory, an I/O processor — a design of real elegance, executed cleanly.</li>
        <li><b>DEC did the work</b>: it secured versions of the major applications, produced a competent MS-DOS, and shipped documentation of the quality DEC was known for — which is why this exhibit could be built from it.</li>
        <li>And for the offices that had a VAX in the machine room, it was <b>exactly the right machine</b> — which was not enough offices.</li>
      </ul>`,
    afterlife: () => `<h2>The afterlife</h2>
      <p>Sales were poor from the start. DEC cut prices and revised the firmware; the 100B arrived in 1984, and the 100+ with its Winchester, and neither changed the trajectory. DEC discontinued the line, and in 1986 shipped the <b>VAXmate</b>: an IBM PC AT-compatible personal computer with a DEC network connection. That was an admission. The Professional and the DECmate died alongside the Rainbow. DEC never succeeded in personal computers.</p>
      <p>The company itself was acquired in 1998 by Compaq — a maker of IBM PC-compatible computers — which is the sort of ending a museum should not have to point at.</p>
      <p>The Rainbow's community is small and precise: its FAQs, its archives of DEC's manuals and firmware, its emulators and its recovered software are why so much of this exhibit could follow the documentation rather than guess.</p>`,
    easter: () => `<h2>Things to try</h2>
      <ul>
        <li>Press <b>T</b>, and be a terminal instantly, with no diskette.</li>
        <li>Watch the panel light the <b>Z80</b> while MS-DOS reads a diskette.</li>
        <li>Run <b>SIEVE</b> on A: and again on B: under CP/M-86/80, and watch the processors swap.</li>
        <li>Run <b>STARFALL</b>: an IBM PC program writing to video memory that is not there — and open the printer.</li>
        <li>Put the <b>Underwriting — PC DOS 2.10</b> diskette in the RX50, and <code>TYPE RATES.TXT</code>.</li>
        <li><code>TYPE ESCAPE.TXT</code>, and the screen obeys.</li>
        <li>On the VAX, <code>SET TERMINAL/WIDTH=132</code> and <code>TYPE BUDGET84.DAT</code>: a page that fits.</li>
        <li>The <b>Set-Up</b> screen's tab ruler.</li>
        <li><b>Compose</b>, e, ' — an accented letter (on the 100B).</li>
        <li>The editing keypad's <b>Find</b> key, in EDT.</li>
        <li><code>TYPE README.TXT</code> on the MS-DOS diskette, from a previous owner.</li>
        <li><b>Windows 1.03</b>, with the graphics option fitted: a tiled window on a Rainbow.</li>
        <li>Start from the <b>VT180</b> diskette, and meet MESSAGE 29.</li>
        <li>Hold a key down while the machine tests itself.</li>
        <li><code>PROMPT $E[7m$P$G$E[m</code> under MS-DOS.</li>
        <li><code>DEBUG</code>, then <code>D F400:3FF0</code>: the firmware's version bytes.</li>
        <li>Switch to the <b>100A</b>, press Compose in terminal mode, and listen.</li>
      </ul>`,
    colophon: () => `<h2>Colophon and the proof</h2>
      <p>One HTML file, with no external resources. Everything drawn in code; the character set is an original bitmap in the VT100 idiom; the machine is an original drawing in the idiom of the system unit, the VR201 and the LK201, with a neutral placeholder wherever a maker's mark would be — including the boot screen, where the logotype stood in double height.</p>
      <h3>Sources</h3>
      <p>Menus, Set-Up screens, the error table, the self-test behaviour and the 100A/100B differences follow DEC's <i>Rainbow Technical Manual Addendum for PC100-A, PC100-B and Rainbow 100+</i> (EK-RB100-TM-001, December 1984) and the 100B's language ROM. The cross-CPU protocol follows the <i>Rainbow 100 CP/M-86/80 Software Design and Maintenance Manual</i> (AA-P309A-TV, April 1983). The keyboard codes and the Rainbow's differences from a VT102 follow the <i>Rainbow 100 Terminal Emulation Manual</i> (AA-P696A-TV, March 1983). MS-DOS's contents, sign-on and caveats follow DEC's <i>Rainbow MS-DOS V2.05 Technical Documentation</i> and <i>MS-DOS Version 2.11</i> kit (1984), and the architecture the <i>Rainbow Handbook</i> (1984). The I/O maps were checked against the MAME project's Rainbow driver; the community's Rainbow FAQ supplied the RX50's upside-down lower slot, the fans and the options.</p>
      <p>Invented, and labelled as invention: the VAX, its company, its people and its mail; every program in the compatibility library; Quadrant, Penwright, Strata II and Scriptor; the previous owner and his README. The 100A's exact message layout and some Set-Up screen layouts are reconstructions from DEC's text where no screen survives in the documents consulted.</p>
      <h3>The proof</h3>
      <p>The exhibit's claim is that the two processors are the architecture, not decoration. This button takes over the machine and demonstrates it, checking the bus model's own state as it goes: terminal mode needs no Z80; under CP/M-86/80 a .COM transient puts the Z80 in charge with the 8088 waiting in its service routine, and a .CMD puts the 8088 in charge; under MS-DOS the 8088 is in charge and every diskette sector crosses to the Z80 as a packet.</p>
      <p><button class="mbtn on" data-act="proof">Run the proof</button> <span id="proofres" style="font:12px var(--mono);color:#9aa3ad"></span></p>
