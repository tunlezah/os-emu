/* ---------- Messaging (org.museum.messaging) ---------- */
(function(){
  const PKG='org.museum.messaging';
  Registry.register({
    pkg:PKG,label:'Messaging',theme:Holo.THEME.LIGHT_DARK_AB,targetSdk:14,
    receivers:{
      'SMS_RECEIVED':x=>{
        const c=Content.query('contacts',c=>c.phones&&c.phones.some(p=>p.num===x.addr))[0];
        const m=Content.add('messages',{addr:x.addr,body:x.text,when:Date.now(),incoming:true,read:false});
        Notif.post({id:'sms.'+x.addr,pkg:PKG,title:c?c.name:x.addr,text:x.text,wrap:true,statusIcon:'message',
          intent:{action:'VIEW',component:PKG+'/Thread',extras:{addr:x.addr}}});
      }
    },
    activities:[
      {name:'Main',launcher:true,filters:[{action:'MAIN'},{action:'SEND',type:['text/plain','image/*']},{action:'SENDTO',scheme:['sms','smsto']}],
       create(intent,win,ctx){
        if(intent.action==='SEND'||intent.action==='SENDTO'){
          return thread(win,ctx,{addr:'',share:intent.extras});
        }
        const ab=Holo.actionBar({title:'Messaging',icon:Art.appIcon(PKG,28),
          actions:[{icon:'add',label:'New message',on:()=>Intents.start({action:'VIEW',component:PKG+'/Thread',extras:{addr:''}})},
                   {icon:'search',label:'Search',on:()=>Holo.toast('Search messages')}],
          overflow:[{label:'Delete all threads',on:()=>{ Content.data.messages=[]; Content.save(); body(); }},
                    {label:'Settings',on:()=>Holo.toast('Messaging settings')}]});
        win.appendChild(ab.el);
        const content=el('div','h-content'); win.appendChild(content);
        function body(){
          content.innerHTML='';
          const ts=Content.threads();
          if(!ts.length){ content.appendChild(Holo.empty('message','No conversations','Send yourself a text from the museum rail')); return; }
          const sc=Holo.scroll(); content.appendChild(sc);
          const l=Holo.list();
          ts.forEach(t=>{
            l.appendChild(Holo.listItem({icon:Art.avatar(t.name,40),title:t.name,unread:!!t.unread,
              sub:(t.last.incoming?'':'You: ')+t.last.body,
              right:'<span style="font-size:11px">'+esc(fmtShort(t.last.when))+'</span>'
                +(t.unread?'<span style="background:var(--h-accent);color:var(--h-accent-ink);border-radius:9px;padding:0 6px;font-size:10px;font-weight:700">'+t.unread+'</span>':''),
              on:()=>Intents.start({action:'VIEW',component:PKG+'/Thread',extras:{addr:t.addr}}),
              onLong:(row)=>{
                const cab=Holo.cab(win,{count:1,actions:[{icon:'trash',label:'Delete',on:()=>{
                  Content.data.messages=Content.data.messages.filter(m=>m.addr!==t.addr); Content.save(); cab.close(); body(); }}],
                  onClose:()=>row.classList.remove('on')});
                row.classList.add('on');
              }}));
          });
          sc.scroller.appendChild(l);
        }
        body();
        return {resume(){ body(); }};
      }},
      {name:'Thread',filters:[{action:'VIEW',type:['vnd.sms/thread']}],
       create(intent,win,ctx){ return thread(win,ctx,intent.extras); }}
    ]
  });
  function thread(win,ctx,extras){
    let addr=extras.addr||'';
    const c=Content.query('contacts',c=>c.phones&&c.phones.some(p=>p.num===addr))[0];
    const ab=Holo.actionBar({up:true,onUp:()=>ctx.finish(),icon:Art.appIcon(PKG,28),
      title:c?c.name:(addr||'New message'),subtitle:addr||null,
      actions:[{icon:'phone',label:'Call',on:()=>{ if(addr) Intents.start({action:'CALL',uri:'tel:'+addr}); }}],
      overflow:[{label:'Attach',on:()=>attach()},
                {label:'Add subject',on:()=>Holo.toast('MMS subject added')},
                {label:'Delete thread',on:()=>{ Content.data.messages=Content.data.messages.filter(m=>m.addr!==addr); Content.save(); ctx.finish(); }}]});
    win.appendChild(ab.el);
    const sc=Holo.scroll(); win.appendChild(sc);
    const compose=el('div');
    compose.style.cssText='flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px;border-top:1px solid var(--h-div)';
    const inp=Holo.edit({hint:'Type message',multi:true,rows:1});
    inp.style.cssText+=';flex:1';
    const send=Holo.button('Send',{primary:true,on:()=>{
      const v=inp.value.trim(); if(!v||!addr) { if(!addr) Holo.toast('Enter a recipient'); return; }
      Content.add('messages',{addr,body:v,when:Date.now(),incoming:false,read:true});
      DataUsage.record(0.01,PKG); inp.value=''; render();
      setTimeout(()=>{
        const reply=pick(['On my way.','Ha. Yes.','Can you send the picture?','Six works.','Will call you in ten.']);
        Registry.broadcast('SMS_RECEIVED',{addr,text:reply});
        render();
      },2600+Math.random()*2000);
    }});
    compose.appendChild(inp); compose.appendChild(send);
    win.appendChild(compose);
    if(!addr){
      const to=el('div'); to.style.cssText='padding:6px 12px;border-bottom:1px solid var(--h-div);display:flex;gap:8px;align-items:center';
      const t=Holo.edit({hint:'To',on:v=>{ addr=v; }}); to.appendChild(t);
      const pickBtn=Holo.button('',{borderless:true,icon:'person',on:()=>{
        Intents.start({action:'PICK',type:'vnd.contact/item'});
      }});
      to.appendChild(pickBtn);
      win.insertBefore(to,sc);
    }
    if(extras.share){
      inp.value=extras.share.text||extras.share.subject||'';
      if(extras.share.imageKey) Holo.toast('Picture attached — this is now an MMS');
    }
    function attach(){
      Holo.dialog({title:'Attach',tight:true,bodyNode:(()=>{
        const l=Holo.list();
        [['image','Pictures'],['camera','Capture picture'],['music','Audio'],['pin','Location'],['person','Contact']].forEach(a=>{
          l.appendChild(Holo.listItem({icon:'<div style="width:24px;color:var(--h-fg)">'+ic(a[0])+'</div>',title:a[1],
            on:()=>{ $$('.h-scrim').forEach(s=>s.remove()); Holo.toast(a[1]+' attached — this message is now an MMS'); }}));
        });
        return l;
      })(),buttons:[{label:'Cancel'}]});
    }
    function render(){
      const box=sc.scroller; box.innerHTML='';
      const ms=Content.query('messages',m=>m.addr===addr).sort((a,b)=>a.when-b.when);
      ms.forEach(m=>{
        if(m.incoming&&!m.read){ m.read=true; Content.save(); }
        const row=el('div'); row.style.cssText='display:flex;padding:4px 10px;'+(m.incoming?'':'justify-content:flex-end');
        const b=el('div');
        b.style.cssText='max-width:74%;padding:9px 12px;border-radius:var(--h-radius);font-size:15px;line-height:1.4;'
          +(m.incoming?'background:var(--h-bg2);border:1px solid var(--h-div)':'background:var(--h-accent);color:var(--h-accent-ink)');
        b.innerHTML=Linkify.html(m.body)+'<div style="font-size:10px;opacity:.7;margin-top:4px">'+esc(fmtClockShort(new Date(m.when)))+'</div>';
        Linkify.bind(b);
        row.appendChild(b); box.appendChild(row);
      });
      Notif.cancel('sms.'+addr);
      setTimeout(()=>{ box.scrollTop=box.scrollHeight; },30);
    }
    render();
    return {resume(){ render(); },result(r){ if(r&&r.contact){ addr=r.contact.phones[0].num; ab.setTitle(r.contact.name); render(); } }};
  }
})();

/* ---------- Gmail (org.museum.gmail) ---------- */
(function(){
  const PKG='org.museum.gmail';
  const LABELS=['Inbox','Starred','Ferry','Work','Sent','All mail'];
  Registry.register({
    pkg:PKG,label:'Gmail',theme:Holo.THEME.LIGHT_DARK_AB,targetSdk:15,
    providers:{mail:{query:f=>Content.query('mail',f)}},
    activities:[
      {name:'Main',launcher:true,filters:[{action:'MAIN'},{action:'SENDTO',scheme:['mailto']},{action:'SEND',type:['text/plain','image/*','*/*']}],
       create(intent,win,ctx){
        if(intent.action==='SEND'||intent.action==='SENDTO') return compose(win,ctx,intent);
        let label=0, sel=[];
        const ab=Holo.actionBar({icon:Art.appIcon(PKG,28),
          spinnerTitle:{items:LABELS,sel:0,on:i=>{ label=i; body(); }},
          actions:[{icon:'search',label:'Search',on:()=>Holo.toast('Search mail')},
                   {icon:'edit',label:'Compose',on:()=>Intents.start({action:'SENDTO',component:PKG+'/Compose',uri:'mailto:'})},
                   {icon:'refresh',label:'Refresh',on:(b)=>refresh(b)}],
          overflow:[{label:'Settings',on:()=>Holo.toast('Gmail settings')},
                    {label:'Help',on:()=>Holo.toast('Help')},
                    {label:'Send feedback',on:()=>Holo.toast('Feedback')}]});
        win.appendChild(ab.el);
        const content=el('div','h-content'); win.appendChild(content);
        function refresh(b){
          if(!Sys.online()){ Holo.toast('No connection'); return; }
          ab.setProgress(0.05);
          let p=0; const iv=setInterval(()=>{ p+=0.16; ab.setProgress(p); DataUsage.record(0.5,PKG);
            if(p>=1){ clearInterval(iv); ab.setProgress(0);
              if(Math.random()<0.55){ newMail(); body(); } } },160);
        }
        function newMail(){
          const froms=[['Priya Nandakumar','priya@dailystandard.example','Re: winter timetable','The harbour committee has moved the meeting to Thursday. Same room.'],
            ['Marcus Bell','marcus.bell@example.net','Photos from Saturday','Sent the good ones to your phone. The one of the pier is the keeper.'],
            ['Vantage Mobile','noreply@vantage.example','Your data usage','You have used 60% of your monthly mobile data allowance.']];
          const f=pick(froms);
          const m=Content.add('mail',{fromName:f[0],from:f[1],subject:f[2],body:f[3],when:Date.now(),read:false,box:'inbox',labels:[]});
          Notif.post({id:'mail.'+m.id,pkg:PKG,title:f[0],text:f[2],text2:f[3],statusIcon:'mail',
            intent:{action:'VIEW',component:PKG+'/Conversation',extras:{id:m.id}}});
        }
        function rows(){
          const all=Content.all('mail');
          if(label===1) return all.filter(m=>m.starred);
          if(label===4) return all.filter(m=>m.box==='sent');
          if(label===5) return all.filter(m=>m.box!=='trash');
          if(label>=2&&label<=3) return all.filter(m=>(m.labels||[]).indexOf(LABELS[label])>=0);
          return all.filter(m=>m.box==='inbox');
        }
        function body(){
          content.innerHTML='';
          const list=rows().sort((a,b)=>b.when-a.when);
          ab.setSubtitle&&ab.setSubtitle(null);
          if(!list.length){ content.appendChild(Holo.empty('mail','No conversations','Press refresh on the Action Bar')); return; }
          const sc=Holo.scroll(); content.appendChild(sc);
          const l=Holo.list();
          list.forEach(m=>{
            const star=el('div'); star.style.cssText='width:26px;display:flex;align-items:center;justify-content:center;color:'+(m.starred?Holo.color('caution','lightdark'):'var(--h-fg3)')+';cursor:pointer';
            star.innerHTML=ic(m.starred?'star':'starO');
            star.onclick=e=>{ e.stopPropagation(); m.starred=!m.starred; Content.save(); body(); };
            const row=Holo.listItem({title:m.fromName,unread:!m.read,sub:m.subject,sub2:m.body.slice(0,60)+'…',
              right:'<span style="font-size:11px">'+esc(fmtShort(m.when))+'</span>',
              on:()=>Intents.start({action:'VIEW',component:PKG+'/Conversation',extras:{id:m.id,label}}),
              onLong:()=>selectMode(m)});
            row.insertBefore(star,row.firstChild);
            l.appendChild(row);
          });
          sc.scroller.appendChild(l);
        }
        function selectMode(m){
          sel=[m.id];
          const cab=Holo.cab(win,{count:1,actions:[
            {icon:'archive',label:'Archive',on:()=>{ sel.forEach(id=>Content.update('mail',id,{box:'archive'})); cab.close(); body(); Holo.toast('Archived'); }},
            {icon:'trash',label:'Delete',on:()=>{ sel.forEach(id=>Content.update('mail',id,{box:'trash'})); cab.close(); body(); Holo.toast('Deleted'); }},
            {icon:'mail',label:'Mark read',on:()=>{ sel.forEach(id=>Content.update('mail',id,{read:true})); cab.close(); body(); }},
            {icon:'label',label:'Labels',on:()=>Holo.toast('Change labels')}]});
        }
        body();
        return {resume(){ body(); }};
      }},
      {name:'Conversation',filters:[{action:'VIEW',type:['vnd.mail/item']}],
       create(intent,win,ctx){
        /* swipe between conversations — 4.0's Gmail let you move to the next
           or previous message with a horizontal flick, without going back to
           the list first. It is a small thing that changed how the
           application felt to use. */
        let list=Content.all('mail').filter(m=>m.box==='inbox').sort((a,b)=>b.when-a.when);
        let i=Math.max(0,list.findIndex(m=>m.id===intent.extras.id));
        if(!list.length) list=[Content.find('mail',intent.extras.id)].filter(Boolean);
        const ab=Holo.actionBar({up:true,onUp:()=>ctx.finish(),icon:Art.appIcon(PKG,28),title:'',
          actions:[{icon:'archive',label:'Archive',on:()=>{ Content.update('mail',cur().id,{box:'archive'}); Holo.toast('Archived'); next(1,true); }},
                   {icon:'trash',label:'Delete',on:()=>{ Content.update('mail',cur().id,{box:'trash'}); Holo.toast('Deleted'); next(1,true); }},
                   {icon:'label',label:'Labels',on:()=>Holo.toast('Change labels')}],
          overflow:[{label:'Mark unread',on:()=>{ Content.update('mail',cur().id,{read:false}); ctx.finish(); }},
                    {label:'Reply',on:()=>reply()},{label:'Forward',on:()=>reply(true)},
                    {label:'Show in People',on:()=>Holo.toast('No contact for this sender')}]});
        win.appendChild(ab.el);
        const pager=el('div','h-content'); pager.style.position='relative'; win.appendChild(pager);
        const page=el('div'); page.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column';
        pager.appendChild(page);
        function cur(){ return list[clamp(i,0,list.length-1)]; }
        function render(){
          const m=cur(); if(!m){ ctx.finish(); return; }
          if(!m.read){ Content.update('mail',m.id,{read:true}); Notif.cancel('mail.'+m.id); }
          ab.setTitle((i+1)+' of '+list.length);
          page.innerHTML='';
          const sc=Holo.scroll(); page.appendChild(sc);
          const head=el('div'); head.style.cssText='padding:14px 16px 8px';
          head.innerHTML='<div style="font-size:20px;margin-bottom:10px">'+esc(m.subject)+'</div>';
          const fr=el('div'); fr.style.cssText='display:flex;gap:10px;align-items:center';
          fr.innerHTML='<div style="width:40px;height:40px;border-radius:var(--h-icon-radius);overflow:hidden">'+Art.avatar(m.fromName,40)+'</div>'
            +'<div style="flex:1;min-width:0"><div style="font-size:15px">'+esc(m.fromName)+'</div>'
            +'<div style="font-size:12px;color:var(--h-fg2)">to me · '+esc(fmtShort(m.when))+'</div></div>';
          head.appendChild(fr);
          sc.scroller.appendChild(head);
          const bd=el('div'); bd.style.cssText='padding:12px 16px;font-size:15px;line-height:1.55;color:var(--h-fg)';
          bd.innerHTML=Linkify.html(m.body); Linkify.bind(bd);
          sc.scroller.appendChild(bd);
          const bar=el('div','h-btnbar');
          bar.appendChild(Holo.button('Reply',{icon:'reply',on:()=>reply()}));
          bar.appendChild(Holo.button('Reply all',{on:()=>reply()}));
          bar.appendChild(Holo.button('Forward',{icon:'send',on:()=>reply(true)}));
          sc.scroller.appendChild(bar);
          const hint=el('div'); hint.style.cssText='padding:6px 16px 22px;font-size:11px;color:var(--h-fg3);text-align:center';
          hint.textContent='Swipe left or right for the next conversation';
          sc.scroller.appendChild(hint);
        }
        function next(d,silent){
          if(i+d<0||i+d>=list.length){ if(!silent) Holo.toast(d>0?'No newer conversations':'No older conversations'); if(silent) ctx.finish(); return; }
          i+=d;
          page.style.transition='transform .18s,opacity .18s';
          page.style.transform='translateX('+(d>0?-40:40)+'px)'; page.style.opacity='0';
          setTimeout(()=>{ render(); page.style.transition='none'; page.style.transform='translateX('+(d>0?40:-40)+'px)';
            requestAnimationFrame(()=>{ page.style.transition='transform .18s,opacity .18s'; page.style.transform=''; page.style.opacity='1'; }); },170);
          Guide.mark('gmailswipe');
        }
        function reply(fwd){
          Intents.start({action:'SENDTO',component:PKG+'/Compose',uri:'mailto:'+cur().from,
            extras:{subject:(fwd?'Fwd: ':'Re: ')+cur().subject,quote:cur().body}});
        }
        let dx0=0;
        onDrag(pager,{threshold:12,
          start:()=>{ page.style.transition='none'; },
          move:({dx,dy})=>{ if(Math.abs(dy)>Math.abs(dx)) return; dx0=dx/dpScale(); page.style.transform='translateX('+dx0+'px)'; },
          end:()=>{ page.style.transition='transform .18s'; if(Math.abs(dx0)>70) next(dx0<0?1:-1); else page.style.transform=''; dx0=0; }});
        render();
        return {};
      }},
      {name:'Compose',filters:[{action:'SENDTO',scheme:['mailto']}],
       create(intent,win,ctx){ return compose(win,ctx,intent); }}
    ]
  });
  function compose(win,ctx,intent){
    const to=(intent.uri||'').replace('mailto:','');
    const ex=intent.extras||{};
    const ab=Holo.actionBar({up:true,onUp:()=>ctx.finish(),icon:Art.appIcon(PKG,28),title:'Compose',
      actions:[{icon:'attach',label:'Attach',on:()=>Holo.toast('Attached')},
               {icon:'send',label:'Send',on:()=>{ Content.add('mail',{fromName:Content.owner().name,from:Content.owner().email,
          to:tof.value,subject:sub.value,body:bod.value,when:Date.now(),read:true,box:'sent'});
          DataUsage.record(0.3,PKG); Holo.toast('Sending…'); ctx.finish(); }}],
      overflow:[{label:'Save draft',on:()=>{ Holo.toast('Draft saved'); ctx.finish(); }},
                {label:'Discard',on:()=>{ Holo.toast('Discarded'); ctx.finish(); }}]});
    win.appendChild(ab.el);
    const sc=Holo.scroll(); win.appendChild(sc);
    const p=el('div'); p.style.cssText='padding:8px 16px';
    const tof=Holo.edit({hint:'To',value:to||ex.to||''});
    const sub=Holo.edit({hint:'Subject',value:ex.subject||ex.text&&'' ||''});
    const bod=Holo.edit({hint:'Compose email',multi:true,rows:10,value:(ex.text||'')+(ex.quote?'\n\n\n--------\n'+ex.quote:'')});
    [tof,sub,bod].forEach(f=>{ const w=el('div','h-field'); w.appendChild(f); p.appendChild(w); });
    if(ex.imageKey){
      const a=el('div','h-chip','1 attachment · '+esc(ex.imageName||'picture.jpg')); p.appendChild(a);
    }
    const from=el('div'); from.style.cssText='font-size:12px;color:var(--h-fg2);padding-top:6px';
    from.textContent='From '+Content.owner().email;
    p.appendChild(from);
    sc.scroller.appendChild(p);
    setTimeout(()=>tof.focus(),120);
    return {};
  }
})();

/* ---------- Calendar (org.museum.calendar) ---------- */
(function(){
  const PKG='org.museum.calendar';
  const VIEWS=['Day','Week','Month','Agenda'];
  Registry.register({
    pkg:PKG,label:'Calendar',theme:Holo.THEME.LIGHT_DARK_AB,targetSdk:15,
    providers:{events:{query:f=>Content.query('events',f)}},
    activities:[
      {name:'Main',launcher:true,filters:[{action:'MAIN'},{action:'VIEW',type:['vnd.event/item']}],
       create(intent,win,ctx){
        let view=3, day=dayStart(Date.now());
        const ab=Holo.actionBar({icon:Art.appIcon(PKG,28),
          spinnerTitle:{items:VIEWS,sel:3,on:i=>{ view=i; body(); }},
          actions:[{icon:'add',label:'New event',on:()=>edit()},
                   {icon:'clock',label:'Today',on:()=>{ day=dayStart(Date.now()); body(); }}],
          overflow:[{label:'Refresh',on:()=>{ DataUsage.record(0.2,PKG); Holo.toast('Calendars synced'); }},
                    {label:'Calendars to display',on:()=>Holo.toast('2 calendars')},
                    {label:'Settings',on:()=>Holo.toast('Calendar settings')}]});
        win.appendChild(ab.el);
        const content=el('div','h-content'); win.appendChild(content);
        function evs(from,to){ return Content.all('events').filter(e=>e.when>=from&&e.when<to).sort((a,b)=>a.when-b.when); }
        function body(){
          content.innerHTML='';
          ab.setSubtitle&&ab.setSubtitle(null);
          if(view===3) agenda();
          else if(view===2) month();
          else if(view===1) week();
          else dayView();
        }
        function agenda(){
          const sc=Holo.scroll(); content.appendChild(sc);
          const list=Content.all('events').sort((a,b)=>a.when-b.when);
          let d='';
          const l=Holo.list();
          list.forEach(e=>{
            const ds=fmtDate(e.when);
            if(ds!==d){ d=ds; l.appendChild(Holo.header(ds)); }
            l.appendChild(Holo.listItem({icon:'<div style="width:4px;height:100%;background:'+e.color+'"></div>',
              title:e.title,sub:fmtClockShort(new Date(e.when))+(e.where?' · '+e.where:''),
              on:()=>detail(e)}));
          });
          sc.scroller.appendChild(l);
        }
        function dayView(){
          const sc=Holo.scroll(); content.appendChild(sc);
          const hd=el('div','h-header',fmtDate(day)); sc.scroller.appendChild(hd);
          const grid=el('div'); grid.style.cssText='position:relative';
          for(let h=6;h<23;h++){
            const r=el('div'); r.style.cssText='height:44px;border-top:1px solid var(--h-div);display:flex';
            r.innerHTML='<div style="width:54px;font-size:11px;color:var(--h-fg2);padding:2px 6px;text-align:right">'+(h>12?h-12+' PM':h===12?'12 PM':h+' AM')+'</div>';
            grid.appendChild(r);
          }
          evs(day,day+DAY_MS).forEach(e=>{
            const d=new Date(e.when); const off=(d.getHours()-6)*44+(d.getMinutes()/60)*44;
            const b=el('div'); b.style.cssText='position:absolute;left:58px;right:8px;top:'+off+'px;height:'+Math.max(20,(e.dur||60)/60*44)+'px;'
              +'background:'+e.color+';border-radius:var(--h-radius);padding:3px 7px;font-size:12px;color:'+Holo.color('onImage')+';cursor:pointer;overflow:hidden';
            b.textContent=e.title; b.onclick=()=>detail(e);
            grid.appendChild(b);
          });
          sc.scroller.appendChild(grid);
        }
        function week(){
          const sc=Holo.scroll(); content.appendChild(sc);
          const start=day-((new Date(day).getDay())*DAY_MS);
          const g=el('div'); g.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--h-div)';
          for(let i=0;i<7;i++){
            const d0=start+i*DAY_MS;
            const c=el('div'); c.style.cssText='background:var(--h-bg);min-height:140px;padding:4px;cursor:pointer';
            c.innerHTML='<div style="font-size:11px;color:var(--h-fg2)">'+DAYS3[new Date(d0).getDay()]+' '+new Date(d0).getDate()+'</div>';
            evs(d0,d0+DAY_MS).forEach(e=>{
              const b=el('div'); b.style.cssText='margin-top:2px;font-size:10px;padding:2px 3px;border-radius:2px;background:'+e.color+';color:'+Holo.color('onImage')+';overflow:hidden;white-space:nowrap;text-overflow:ellipsis';
              b.textContent=e.title; c.appendChild(b);
            });
            c.onclick=()=>{ day=d0; view=0; ab.el.querySelector('.h-ab-spin .t').textContent='Day'; body(); };
            g.appendChild(c);
          }
          sc.scroller.appendChild(g);
        }
        function month(){
          const sc=Holo.scroll(); content.appendChild(sc);
          const d0=new Date(day); const first=new Date(d0.getFullYear(),d0.getMonth(),1);
          const off=first.getDay();
          sc.scroller.appendChild(Holo.header(MONTHS[d0.getMonth()]+' '+d0.getFullYear()));
          const g=el('div'); g.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--h-div)';
          DAYS3.forEach(n=>{ const h=el('div'); h.style.cssText='background:var(--h-bg);font-size:10px;color:var(--h-fg2);text-align:center;padding:4px'; h.textContent=n; g.appendChild(h); });
          for(let i=0;i<42;i++){
            const dd=new Date(d0.getFullYear(),d0.getMonth(),1-off+i);
            const c=el('div'); c.style.cssText='background:var(--h-bg);min-height:56px;padding:3px;font-size:11px;cursor:pointer;'
              +(dd.getMonth()!==d0.getMonth()?'opacity:.35;':'');
            c.innerHTML='<div>'+dd.getDate()+'</div>';
            evs(dayStart(dd.getTime()),dayStart(dd.getTime())+DAY_MS).slice(0,3).forEach(e=>{
              const b=el('div'); b.style.cssText='height:3px;margin-top:2px;border-radius:2px;background:'+e.color; c.appendChild(b);
            });
            c.onclick=()=>{ day=dayStart(dd.getTime()); view=0; ab.el.querySelector('.h-ab-spin .t').textContent='Day'; body(); };
            g.appendChild(c);
          }
          sc.scroller.appendChild(g);
        }
        function detail(e){
          Holo.dialog({title:e.title,html:'<p><b>'+esc(fmtDate(e.when))+'</b>, '+esc(fmtClockShort(new Date(e.when)))+'</p>'
            +(e.where?'<p style="margin-top:8px">'+Linkify.html(e.where)+'</p>':'')
            +(e.note?'<p style="margin-top:8px;color:var(--h-fg3)">'+esc(e.note)+'</p>':''),
            host:win,theme:'lightdark',
            buttons:[{label:'Delete',on:()=>{ Content.remove('events',e.id); body(); }},{label:'Done'}]});
          setTimeout(()=>Linkify.bind(win),30);
        }
        function edit(){
          const b=el('div');
          const t=Holo.edit({hint:'Event name'}); const w=Holo.edit({hint:'Where'});
          [t,w].forEach(f=>{ const x=el('div','h-field'); x.appendChild(f); b.appendChild(x); });
          Holo.dialog({title:'New event',bodyNode:b,host:win,theme:'lightdark',buttons:[
            {label:'Cancel'},{label:'Save',on:()=>{ if(!t.value) return false;
              Content.add('events',{title:t.value,where:w.value,when:Date.now()+3600000,dur:60,color:Holo.color('chart')[1],cal:'Personal'});
              body(); Holo.toast('Event saved'); }}]});
        }
        body();
        if(intent.extras&&intent.extras.id){ const e=Content.find('events',intent.extras.id); if(e) setTimeout(()=>detail(e),200); }
        return {resume(){ body(); }};
      }},
      {name:'Event',filters:[{action:'VIEW',type:['vnd.event/detail']}],
       create(intent,win,ctx){
        const e=Content.find('events',intent.extras.id);
        const ab=Holo.actionBar({up:true,onUp:()=>ctx.finish(),title:e?e.title:'Event',icon:Art.appIcon(PKG,28)});
        win.appendChild(ab.el);
        const sc=Holo.scroll(); win.appendChild(sc);
        const p=Holo.pad(e?('<div class="h-title">'+esc(e.title)+'</div>'
          +'<p class="h-body" style="margin-top:8px">'+esc(fmtDate(e.when))+' · '+esc(fmtClockShort(new Date(e.when)))+'</p>'
          +(e.where?'<p class="h-body">'+Linkify.html(e.where)+'</p>':'')):'Event not found');
        sc.scroller.appendChild(p); Linkify.bind(p);
        return {};
      }}
    ]
  });
})();

/* ---------- Browser (org.museum.browser) ----------
   Browser, not Chrome. Chrome for Android arrived as a beta for this
   version in February 2012 and did not become the default browser until
   4.1 shipped on 4.2-era devices; in November 2011 this was the browser,
   and it was a good one. Tabs, an incognito mode, bookmarks that synced
   with the desktop, "request desktop site", and saving a page to read
   offline — all of which the competing browser of the same month had
   either none of or one of. */
(function(){
  const PKG='org.museum.browser';
  const SITE={
    'http://dailystandard.example/':{title:'The Daily Standard — Port Ellery',kb:420,
      html:'<h1>The Daily Standard</h1><p class="by">Port Ellery · Thursday</p>'
        +'<h2><a data-href="http://dailystandard.example/tech/ics">The phone that finally looks like it was designed</a></h2>'
        +'<p class="by">By Owen Park, Technology</p>'
        +'<p>For four years Android has been the thing you bought because it was cheaper, or because it was on your network, or because you wanted a keyboard. This week it becomes the thing you might buy because you like it. <a data-href="http://dailystandard.example/tech/ics">Read more &raquo;</a></p>'
        +'<h2><a data-href="http://dailystandard.example/city/ferry">Winter ferry timetable delayed again</a></h2>'
        +'<p class="by">By Priya Nandakumar, City desk</p>'
        +'<p>Pier 2 will keep its summer hours until at least December, the harbour committee said last night. Tips: <a data-href="mailto:tips@dailystandard.example">tips@dailystandard.example</a>, or 555-0190.</p>'
        +'<h2>Gallery Nine opens autumn show</h2><p>Doors at seven, at <a data-href="geo:0,0?q=9+Pier+Walk">9 Pier Walk</a>.</p>'},
    'http://dailystandard.example/tech/ics':{title:'The phone that finally looks designed — The Daily Standard',kb:380,
      html:'<h1>The phone that finally looks like it was designed</h1><p class="by">By Owen Park · Technology</p>'
        +'<p>Pick it up and the first thing you notice is what is missing. There are no buttons on the front. None. The three you need are drawn on the screen and they move out of the way when the screen has better things to do with the space.</p>'
        +'<p>The second thing is that it is all one thing. For three years an Android phone was a collection of screens that had plainly been drawn by different people on different days — a settings list here, a mail list there, a dialer that belonged to another decade. This one has a single grammar: thin lines, flat surfaces, a cold blue that means "you may touch this", and a bar across the top of every application that always works the same way.</p>'
        +'<p>It is worth being blunt about why this matters and why it does not. It does not matter commercially. This platform passed the iPhone in American share last year and passed Symbian at the turn of this one, and it did that while looking like an engineering project. It won on price, on being on every network, on choice of hardware, and on giving away turn-by-turn navigation in 2009, which killed an entire industry in a weekend.</p>'
        +'<p>What this release changes is the argument. Until this week the honest case for Android was that it was better value and more open. From this week it is also, for the first time, a case about the thing itself.</p>'
        +'<p>Two complaints. The screen is a PenTile panel and you can see its structure on fine text. And it still drops frames — less than its predecessor, more than its competitor. That is a fixable problem and it is not fixed here.</p>'},
    'http://dailystandard.example/city/ferry':{title:'Winter ferry timetable delayed — The Daily Standard',kb:210,
      html:'<h1>Winter ferry timetable delayed again</h1><p class="by">By Priya Nandakumar</p>'
        +'<p>The Pier 2 service will keep its summer hours until at least December. The committee meets at <a data-href="geo:0,0?q=Harbour+Office">the Harbour Office</a> on Thursday at 6pm.</p>'
        +'<p>Questions to the city desk on 555-0190.</p>'},
    'http://transit.example/':{title:'Port Ellery Transit',kb:180,
      html:'<h1>Port Ellery Transit</h1><p>Line 7 now terminates at Central after 22:00.</p>'
        +'<table><tr><th>Line</th><th>Next</th></tr><tr><td>2 — Harbour</td><td>4 min</td></tr><tr><td>7 — Central</td><td>11 min</td></tr><tr><td>Ferry</td><td>18 min</td></tr></table>'
        +'<p><a data-href="http://transit.example/map">Network map</a></p>'},
    'http://transit.example/map':{title:'Network map — Port Ellery Transit',kb:640,
      html:'<h1>Network map</h1><p>This page is heavy: 640 kB of it, which in 2011 was most of an afternoon’s allowance on a bad tariff.</p><p>Pier 2 &rarr; Central &rarr; Gallery Nine &rarr; Harbour Office.</p>'},
    'http://devnotes.example/holo':{title:'Notes for developers: the Holo theme',kb:150,
      html:'<h1>Notes for developers: the Holo theme</h1>'
        +'<p>From this release, a device that wants the Market must carry the Holo themes unmodified, whatever else it ships. A manufacturer may still theme its own skin on top; it may not change what <code>Theme.Holo</code> looks like.</p>'
        +'<p>That is the first floor the platform has ever had. Declare <code>Theme.Holo</code> and your application will look the same on every compatible device in the world, which has not been true of anything on Android before today.</p>'
        +'<p>Use the Action Bar. The hardware Menu key is gone. If you target an older platform the system will draw a Menu button for you in the navigation bar, and your users will see it, and they will know.</p>'},
    'about:blank':{title:'New tab',kb:0,html:'<h1 style="opacity:.4">New tab</h1>'}
  };
  Registry.register({
    pkg:PKG,label:'Browser',theme:Holo.THEME.LIGHT_DARK_AB,targetSdk:15,
    providers:{bookmarks:{query:f=>Content.query('bookmarks',f)}},
    activities:[
      {name:'Main',launcher:true,filters:[{action:'MAIN'},{action:'VIEW',scheme:['http','https']},{action:'WEB_SEARCH'}],
       create(intent,win,ctx){
        let tabs=[{url:'http://dailystandard.example/',incognito:false,hist:['http://dailystandard.example/'],hi:0}];
        let cur=0, desktop=false;
        if(intent.uri){ tabs=[{url:String(intent.uri),incognito:false,hist:[String(intent.uri)],hi:0}]; }
        const ab=Holo.actionBar({icon:Art.appIcon(PKG,28),title:'',
          actions:[{icon:'starO',label:'Bookmark',on:(b)=>{ const t=T(); const has=Content.all('bookmarks').some(x=>x.url===t.url);
              if(has){ Holo.toast('Already bookmarked'); return; }
              Content.add('bookmarks',{title:(SITE[t.url]||{}).title||t.url,url:t.url,folder:'Bookmarks'});
              b.innerHTML=ic('star'); Holo.toast('Bookmarked. It will sync to the desktop.'); Guide.mark('bookmark'); }},
            {icon:'tabs',label:'Tabs',on:(b)=>tabMenu(b)}],
          overflow:()=>[
            {label:'New tab',on:()=>{ tabs.push({url:'about:blank',incognito:false,hist:['about:blank'],hi:0}); cur=tabs.length-1; render(); }},
            {label:'New incognito tab',on:()=>{ tabs.push({url:'about:blank',incognito:true,hist:['about:blank'],hi:0}); cur=tabs.length-1; render();
              Guide.mark('incognito');
              MToast.show('<b>An incognito tab.</b> Pages opened here leave nothing in history or in the cookie jar. The browser on the other platform would not get a private mode on the phone for another year and a half.','apps'); }},
            {label:'Bookmarks',on:()=>bookmarks()},
            {label:desktop?'Request mobile site':'Request desktop site',checked:desktop,on:()=>{ desktop=!desktop; render();
              Holo.toast(desktop?'Requesting desktop site':'Requesting mobile site'); Guide.mark('desktop'); }},
            {label:'Save for offline reading',on:()=>{ const t=T();
              const saved=State.get('offline',{}); saved[t.url]=true; State.set('offline',saved);
              Holo.toast('Saved for offline reading'); Guide.mark('offline'); }},
            {label:'Share page',on:()=>Intents.send('text/plain',{text:T().url,subject:(SITE[T().url]||{}).title})},
            {label:'Find on page',on:()=>Holo.toast('Find on page')},

          ]});
        win.appendChild(ab.el);
        const barWrap=el('div'); barWrap.style.cssText='flex:0 0 auto;padding:6px 8px;border-bottom:1px solid var(--h-div);display:flex;gap:6px;align-items:center';
        const urlInp=Holo.edit({hint:'Search or type URL',enter:v=>go(v)});
        urlInp.style.cssText+=';font-size:14px';
        const goB=el('div'); goB.style.cssText='width:26px;color:var(--h-fg2);cursor:pointer'; goB.innerHTML=ic('refresh');
        goB.onclick=()=>render();
        barWrap.appendChild(urlInp); barWrap.appendChild(goB);
        win.appendChild(barWrap);
        const view=el('div','h-content'); win.appendChild(view);
        function T(){ return tabs[clamp(cur,0,tabs.length-1)]; }
        function go(v){
          let u=v.trim();
          if(!/^[a-z]+:/.test(u)) u='http://'+u.replace(/^\/+/,'');
          const t=T(); t.hist=t.hist.slice(0,t.hi+1); t.hist.push(u); t.hi=t.hist.length-1; t.url=u; render();
        }
        function tabMenu(anchor){
          const items=tabs.map((t,i)=>({label:((SITE[t.url]||{}).title||t.url).slice(0,28)+(t.incognito?'  (incognito)':''),

          items.push({label:'New tab',on:()=>{ tabs.push({url:'about:blank',incognito:false,hist:['about:blank'],hi:0}); cur=tabs.length-1; render(); }});
          if(tabs.length>1) items.push({label:'Close this tab',on:()=>{ tabs.splice(cur,1); cur=clamp(cur,0,tabs.length-1); render(); }});

        function bookmarks(){
          const b=el('div');

          Content.all('bookmarks').forEach(bk=>l.appendChild(Holo.listItem({
            icon:'<img src="'+Art.photo('page:'+bk.url,80,80)+'" style="width:100%;height:100%;object-fit:cover">',
            title:bk.title,sub:bk.url,on:()=>{ $$('.h-scrim',win).forEach(s=>s.remove()); go(bk.url); },
            onLong:()=>{ Content.remove('bookmarks',bk.id); Holo.toast('Bookmark deleted'); }})));
          b.appendChild(l);
          Holo.dialog({title:'Bookmarks',bodyNode:b,tight:true,host:win,theme:'lightdark',buttons:[{label:'Close'}]});
        }
        function render(){
          const t=T();
          urlInp.value=t.url==='about:blank'?'':t.url;
          ab.setTitle((SITE[t.url]||{}).title||t.url);
          ab.setSubtitle(t.incognito?'Incognito':null);
          const bkAct=ab.action('Bookmark'); if(bkAct) bkAct.innerHTML=ic(Content.all('bookmarks').some(x=>x.url===t.url)?'star':'starO');
          view.innerHTML='';
          const page=SITE[t.url];
          const offline=State.get('offline',{})[t.url];
          if(!page){
            view.appendChild(Holo.empty('offline','Web page not available','The URL '+t.url+' could not be found.'));
            return;
          }
          if(!Sys.online()&&!offline){
            const e=Holo.empty('offline','Web page not available',
              DataUsage.cut?'Mobile data is off — you have reached your data limit.':'No connection.');
            const b=Holo.button(DataUsage.cut?'Data usage settings':'Wi-Fi settings',{primary:true,on:()=>
              Intents.start({action:DataUsage.cut?'DATA_USAGE_SETTINGS':'SETTINGS'})});
            e.appendChild(b);
            view.appendChild(e);
            if(DataUsage.cut) Guide.mark('datacut');
            return;
          }
          if(!offline) DataUsage.record(page.kb/1024,PKG);
          ab.setProgress(0.1);
          let p=0.1; const iv=setInterval(()=>{ p+=0.22; ab.setProgress(p); if(p>=1){ clearInterval(iv); ab.setProgress(0); } },90);
          const sc=Holo.scroll(); view.appendChild(sc);
          const doc=el('div');
          doc.style.cssText='padding:14px 16px 30px;color:var(--h-fg);font-size:'+(desktop?'11px':'15px')+';line-height:1.6;'
            +(desktop?'width:980px;transform-origin:0 0;transform:scale('+(360/980)+');':'');
          doc.innerHTML='<style>'
            +'.bpage h1{font-size:'+(desktop?'22px':'22px')+';font-weight:400;margin:0 0 6px}'
            +'.bpage h2{font-size:17px;font-weight:400;margin:16px 0 4px}'
            +'.bpage p{margin:0 0 11px}'
            +'.bpage .by{font-size:12px;color:var(--h-fg2);margin:0 0 10px}'
            +'.bpage a{color:var(--h-accent);text-decoration:underline;cursor:pointer}'
            +'.bpage table{border-collapse:collapse;width:100%;margin:10px 0}'
            +'.bpage td,.bpage th{border:1px solid var(--h-div);padding:4px 7px;text-align:left;font-size:13px}'
            +'.bpage code{font-family:var(--robotomono);background:var(--h-bg2);padding:1px 4px;border:1px solid var(--h-div)}'
            +'</style><div class="bpage">'+page.html+'</div>';
          sc.scroller.appendChild(doc);
          if(offline){ const n=el('div','h-chip','Saved page — reading offline'); n.style.margin='0 16px'; sc.scroller.insertBefore(n,doc); }
          if(t.incognito){ const n=el('div','h-chip','Incognito — this page will not be recorded'); n.style.margin='10px 16px 0'; sc.scroller.insertBefore(n,doc); }
          $$('a[data-href]',doc).forEach(a=>a.onclick=()=>{
            const h=a.dataset.href;
            if(/^(mailto|tel|geo):/.test(h)) Intents.view(h); else go(h);
          });
          if(!t.incognito) Content.add('history',{url:t.url,title:page.title,when:Date.now()});
          /* zoom controls: 4.0's Browser had pinch, and the drawn buttons
             here stand in for two fingers the visitor does not have */
          const zoom=el('div'); zoom.style.cssText='position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:4';
          [['zoomOut',-1],['zoomIn',1]].forEach(z=>{
            const b=el('div'); b.style.cssText='width:36px;height:36px;border-radius:var(--h-radius);background:var(--h-popup-bg);'
              +'border:1px solid var(--h-popup-border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--h-fg)';
            b.innerHTML=ic(z[0]);
            b.onclick=()=>{ const s=parseFloat(doc.dataset.z||(desktop?(360/980):1))+z[1]*0.15;
              doc.dataset.z=clamp(s,0.3,2.4); doc.style.transformOrigin='0 0'; doc.style.transform='scale('+doc.dataset.z+')'; };
            zoom.appendChild(b);
          });
          view.appendChild(zoom);
        }
        render();
        return {
          back(){ const t=T(); if(t.hi>0){ t.hi--; t.url=t.hist[t.hi]; render(); return true; } return false; },
          resume(){ render(); }
        };
      }}
    ]
  });
})();

/* ---------- Maps (org.museum.maps) ---------- */
(function(){
  const PKG='org.museum.maps';
  const PLACES={'Harbour Office':[0.34,0.58],'9 Pier Walk':[0.62,0.41],'Central Station':[0.5,0.72],
    'Gallery Nine':[0.62,0.4],'Pier 2':[0.28,0.3],'Harbour Cafe':[0.44,0.5]};
  Registry.register({
    pkg:PKG,label:'Maps',theme:Holo.THEME.DARK,targetSdk:15,
    activities:[
      {name:'Main',launcher:true,filters:[{action:'MAIN'},{action:'VIEW',scheme:['geo']}],
       create(intent,win,ctx){
        let q='Port Ellery';
        if(intent.uri){ const m=/q=([^&]+)/.exec(String(intent.uri)); if(m) q=decodeURIComponent(m[1].replace(/\+/g,' ')); }
        const ab=Holo.actionBar({title:'Maps',subtitle:q,icon:Art.appIcon(PKG,28),up:!!intent.uri,onUp:()=>ctx.finish(),
          actions:[{icon:'search',label:'Search',on:()=>Holo.toast('Search Maps')},
                   {icon:'pin',label:'My location',on:()=>Holo.toast('Locating…')}],
          overflow:[{label:'Navigate',on:()=>Holo.toast('Turn-by-turn navigation — free, from late 2009, and the single feature that did more for this platform’s share than any design decision.')},
                    {label:'Beam this place',on:()=>Beam.offer({kind:'map',title:q,body:'Port Ellery · '+q})},
                    {label:'Layers',on:()=>Holo.toast('Traffic, satellite, transit')}]});
        win.appendChild(ab.el);
        const c=el('div','h-content'); c.style.position='relative'; win.appendChild(c);
        const cv=el('canvas'); cv.width=360; cv.height=520; cv.style.cssText='width:100%;height:100%;display:block';
        c.appendChild(cv);
        const g=cv.getContext('2d');
        function draw(){
          const W=cv.width,H=cv.height, r=seeded(4242);
          g.fillStyle='#0e1a14'; g.fillRect(0,0,W,H);
          g.fillStyle='#10344a'; g.beginPath(); g.moveTo(0,H*0.18); g.quadraticCurveTo(W*0.5,H*0.05,W,H*0.24); g.lineTo(W,0); g.lineTo(0,0); g.fill();
          g.strokeStyle='#2c3a30'; g.lineWidth=7;
          for(let i=0;i<9;i++){ g.beginPath(); g.moveTo(0,H*(0.28+i*0.08)); g.lineTo(W,H*(0.26+i*0.085)); g.stroke(); }
          for(let i=0;i<7;i++){ g.beginPath(); g.moveTo(W*(0.08+i*0.14),H*0.2); g.lineTo(W*(0.1+i*0.14),H); g.stroke(); }
          g.strokeStyle='#4a5f4e'; g.lineWidth=3;
          for(let i=0;i<9;i++){ g.beginPath(); g.moveTo(0,H*(0.28+i*0.08)); g.lineTo(W,H*(0.26+i*0.085)); g.stroke(); }
          g.fillStyle='#1a2b20';
          for(let i=0;i<40;i++){ const x=r()*W,y=H*0.22+r()*H*0.78; g.fillRect(x,y,8+r()*22,8+r()*18); }
          const p=PLACES[q]||[0.5,0.5];
          const px=p[0]*W, py=p[1]*H;
          g.fillStyle=Holo.color('warn','dark');
          g.beginPath(); g.moveTo(px,py); g.lineTo(px-9,py-22); g.lineTo(px+9,py-22); g.closePath(); g.fill();
          g.beginPath(); g.arc(px,py-26,11,0,7); g.fill();
          g.fillStyle='#fff'; g.beginPath(); g.arc(px,py-26,4,0,7); g.fill();
          g.fillStyle='rgba(0,0,0,.72)'; g.fillRect(8,H-58,W-16,44);
          g.fillStyle='#fff'; g.font='15px sans-serif'; g.fillText(q,16,H-36);
          g.fillStyle='#9aa3ad'; g.font='12px sans-serif'; g.fillText('Port Ellery · touch and hold for options',16,H-20);
        }
        draw();
        DataUsage.record(0.6,PKG);
        return {lightStatus:false};
      }}
    ]
  });
})();

/* ---------- Camera (org.museum.camera) ----------
   The camera that shipped with 4.0 was, by the standards of the year,
   startling in one respect and mediocre in another. Zero shutter lag is
   the startling part: press the button and the picture is already taken,
   because the sensor never stopped. Continuous autofocus, face detection,
   panorama, 1080p video and time-lapse all arrived here too, and so did
   the live video effects — face distortion and background replacement —
   which were absurd, which everyone tried once, and which are therefore
   in this exhibit. The mediocre part is the 5-megapixel sensor, which was
   not a flagship sensor and was reviewed as such. */
(function(){
  const PKG='org.museum.camera';
  Registry.register({
    pkg:PKG,label:'Camera',theme:Holo.THEME.DARK,targetSdk:15,
    activities:[
      {name:'Main',launcher:true,filters:[{action:'MAIN'},{action:'IMAGE_CAPTURE'}],
       create(intent,win,ctx){
        let mode='photo', front=false, fx='none', bg='none', zsl=true, panoOn=false, recording=false, timelapse=false;
        let t=0, panoX=0, faces=[];
        win.style.background='#000';
        const view=el('div','cam-view'); win.appendChild(view);
        const cv=el('canvas'); cv.width=360; cv.height=640; view.appendChild(cv);
        const g=cv.getContext('2d');
        const zsllab=el('div','cam-zsl','ZERO SHUTTER LAG'); view.appendChild(zsllab);
        const focus=el('div','cam-focus'); view.appendChild(focus);
        const pano=el('div','cam-pano'); pano.innerHTML='<div class="strip"></div><div class="cursor"></div>'; view.appendChild(pano);
        const fxbar=el('div','cam-fx'); view.appendChild(fxbar);
        const ctrl=el('div','cam-ctrl'); view.appendChild(ctrl);
        const thumb=el('div','cam-thumb'); ctrl.appendChild(thumb);
        const shutter=el('div','cam-shutter'); ctrl.appendChild(shutter);
        const modeBtns={};
        [['camera','photo'],['video','video'],['pano','pano']].forEach(m=>{
          const b=el('div','cam-mode'+(m[1]===mode?' on':'')); b.innerHTML=ic(m[0]); b.title=m[1];
          b.onclick=()=>{ setMode(m[1]); }; modeBtns[m[1]]=b; ctrl.appendChild(b);
        });
        const fxBtn=el('div','cam-mode'); fxBtn.innerHTML=ic('effects'); fxBtn.title='Effects';
        fxBtn.onclick=()=>{ fxbar.classList.toggle('on'); }; ctrl.appendChild(fxBtn);
        const swap=el('div','cam-mode'); swap.innerHTML=ic('swapcam'); swap.title='Switch camera';
        swap.onclick=()=>{ front=!front; Sound.tick(); buildFx(); }; ctrl.appendChild(swap);
        const setBtn=el('div','cam-mode'); setBtn.innerHTML=ic('settings');
        setBtn.onclick=(e)=>Holo.popup(setBtn,[
          {label:'Zero shutter lag',checked:zsl,on:()=>{ zsl=!zsl; zsllab.style.display=zsl?'':'none';
            if(!zsl) MToast.show('<b>Shutter lag, restored.</b> Press the button now and count. This is what every phone camera felt like before this release: the picture is taken when the software gets round to it, which is after the moment you wanted.','apps'); }},
          {label:'Time lapse',checked:timelapse,on:()=>{ timelapse=!timelapse; Holo.toast(timelapse?'Time lapse on — 1 frame every 2s':'Time lapse off'); }},
          {label:'Store location',checked:true,on:()=>{}},
          {label:'Picture size: 5M (2592 × 1944)',on:()=>Holo.toast('5 megapixels. A flagship in 2011 had eight, and the reviews said so.')},
          {label:'Video quality: 1080p',on:()=>Holo.toast('1080p, new in this release')}
        ],{align:'right'});
        ctrl.appendChild(setBtn);
        const EFFECTS=[['none','None'],['bigeyes','Big eyes'],['squeeze','Squeeze'],['bigmouth','Big mouth'],['bignose','Big nose']];
        const BACKS=[['none','No backdrop'],['space','In space'],['sunset','Sunset'],['disco','Disco']];
        function buildFx(){
          fxbar.innerHTML='';
          EFFECTS.concat(BACKS).forEach(e=>{
            const isBg=BACKS.some(b=>b[0]===e[0]);
            const b=el('div','fx'+((isBg?bg:fx)===e[0]?' on':''));
            const sw=el('div','sw'); sw.appendChild(swatch(e[0]));
            b.appendChild(sw); b.appendChild(el('span',null,esc(e[1])));
            b.onclick=()=>{ if(isBg){ bg=e[0]; } else { fx=e[0]; } buildFx();
              if(e[0]!=='none'){ Guide.mark('effects');
                if(isBg) MToast.show('<b>Background replacement, live, in 2011.</b> Stand still, step out of frame once so it learns the backdrop, and the phone cuts you out and puts you somewhere ridiculous. It was a party trick, it was in the launch keynote, and everybody tried it exactly once.','easter'); } };
            fxbar.appendChild(b);
          });
        }
        function swatch(kind){
          const c=document.createElement('canvas'); c.width=44; c.height=44;
          const gg=c.getContext('2d');
          gg.fillStyle='#1a2430'; gg.fillRect(0,0,44,44);
          if(kind==='space'){ gg.fillStyle='#05060c'; gg.fillRect(0,0,44,44);
            for(let i=0;i<16;i++){ gg.fillStyle='rgba(255,255,255,'+(0.3+Math.random()*0.7)+')'; gg.fillRect(Math.random()*44,Math.random()*44,1.4,1.4); } }
          else if(kind==='sunset'){ const lg=gg.createLinearGradient(0,0,0,44); lg.addColorStop(0,'#3a1f5c'); lg.addColorStop(.6,'#d4622a'); lg.addColorStop(1,'#1b1113'); gg.fillStyle=lg; gg.fillRect(0,0,44,44); }
          else if(kind==='disco'){ for(let i=0;i<9;i++){ gg.fillStyle='hsl('+(i*40)+',80%,55%)'; gg.fillRect((i%3)*15,Math.floor(i/3)*15,14,14); } }
          else gg.drawImage(Art.ownerFace(44,44,{tilt:0}),0,0);
          return c;
        }
        buildFx();
        function setMode(m){
          mode=m; Object.keys(modeBtns).forEach(k=>modeBtns[k].classList.toggle('on',k===m));
          pano.classList.toggle('on',m==='pano');
          if(m==='pano'){ panoX=0; pano.querySelector('.strip').innerHTML=''; Guide.mark('pano');
            MToast.show('<b>Panorama.</b> Press the shutter and sweep the phone slowly to the right. The strip along the bottom is the stitcher telling you how it is doing.','apps'); }
          shutter.classList.toggle('rec',false); recording=false;
        }
        /* the scene, drawn; the effects are applied to it as it is drawn,
           which is what "live" meant */
        function draw(){
          t++;
          const W=cv.width,H=cv.height;
          if(bg!=='none'&&front){
            if(bg==='space'){ g.fillStyle='#04050b'; g.fillRect(0,0,W,H);
              const r=seeded(7); for(let i=0;i<120;i++){ g.fillStyle='rgba(255,255,255,'+(0.25+((i*37)%70)/100)+')'; g.fillRect((i*97)%W,(i*53)%H,1.6,1.6); }
              g.fillStyle='#3a6ea8'; g.beginPath(); g.arc(W*0.78,H*0.2,44,0,7); g.fill(); }
            else if(bg==='sunset'){ const lg=g.createLinearGradient(0,0,0,H); lg.addColorStop(0,'#2b1650'); lg.addColorStop(.55,'#d4622a'); lg.addColorStop(.7,'#8e2f26'); lg.addColorStop(1,'#120d12'); g.fillStyle=lg; g.fillRect(0,0,W,H); }
            else { for(let i=0;i<24;i++){ g.fillStyle='hsl('+((t*4+i*30)%360)+',85%,'+(35+((i*7)%30))+'%)'; g.fillRect((i%4)*W/4,Math.floor(i/4)*H/6,W/4,H/6); } }
          } else {
            const sky=g.createLinearGradient(0,0,0,H*0.6);
            sky.addColorStop(0,'#1d3a55'); sky.addColorStop(1,'#7ba6c4');
            g.fillStyle=sky; g.fillRect(0,0,W,H*0.62);
            g.fillStyle='#24313a'; g.fillRect(0,H*0.62,W,H*0.38);
            const off=panoOn?-panoX*1.4:Math.sin(t/90)*6;
            g.fillStyle='#16242e';
            for(let i=-2;i<10;i++){ const x=off+i*64; g.fillRect(x,H*0.36+((i*37)%50),46,H*0.28); }
            g.fillStyle='#0f4a60'; g.fillRect(0,H*0.6,W,10);
            g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=1;
            for(let i=0;i<8;i++){ g.beginPath(); g.moveTo(0,H*0.66+i*18); g.lineTo(W,H*0.66+i*18+6); g.stroke(); }
          }
          /* a face in the frame, distorted by whichever effect is on */
          if(front||mode!=='pano'){
            const fw=front?200:120, fh=fw;
            const fxs={bigeyes:1,squeeze:2,bigmouth:3,bignose:4,none:0}[fx]||0;
            const face=Art.ownerFace(fw,fh,{tilt:Math.sin(t/40)*0.05,gaze:Math.sin(t/30)});
            const cxp=W/2+Math.sin(t/60)*10, cyp=H*(front?0.36:0.44);
            g.save();
            if(fxs===2){ g.translate(cxp,cyp); g.scale(0.62,1.25); g.translate(-cxp,-cyp); }
            g.drawImage(face,cxp-fw/2,cyp-fh/2,fw,fh);
            if(fxs===1){ /* big eyes: magnify the eye region */
              const ew=fw*0.5, eh=fh*0.22;
              g.drawImage(face,fw*0.22,fh*0.3,fw*0.56,fh*0.18, cxp-ew/2,cyp-fh*0.2-eh/2, ew*1.35, eh*1.6);
            }
            if(fxs===3){ const mw=fw*0.42, mh=fh*0.2;
              g.drawImage(face,fw*0.3,fh*0.56,fw*0.4,fh*0.16, cxp-mw/2, cyp+fh*0.12, mw*1.5, mh*1.6); }
            if(fxs===4){ const nw=fw*0.2, nh=fh*0.22;
              g.drawImage(face,fw*0.4,fh*0.42,fw*0.2,fh*0.18, cxp-nw*0.8, cyp-fh*0.02, nw*1.9, nh*1.5); }
            g.restore();
            faces=[{x:cxp-fw*0.34,y:cyp-fh*0.42,w:fw*0.68,h:fh*0.84}];
          } else faces=[];
          drawFaces();
          if(recording){
            g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(0,0,W,26);
            g.fillStyle='#ff4444'; g.beginPath(); g.arc(16,13,5,0,7); g.fill();
            const s=Math.floor((Date.now()-recStart)/(timelapse?200:1000));
            g.fillStyle='#fff'; g.font='13px sans-serif'; g.fillText(pad2(Math.floor(s/60))+':'+pad2(s%60)+(timelapse?'  time lapse':'  1080p'),28,17);
            DataUsage.record(0,PKG);
          }
          raf(draw);
        }
        function drawFaces(){
          $$('.cam-face',view).forEach(n=>n.remove());
          if(mode==='pano') return;
          faces.forEach(f=>{
            const b=el('div','cam-face locked');
            b.style.cssText='left:'+(f.x/360*100)+'%;top:'+(f.y/640*100)+'%;width:'+(f.w/360*100)+'%;height:'+(f.h/640*100)+'%';
            view.appendChild(b);
          });
        }
        /* continuous autofocus: it hunts by itself, and tapping tells it
           where to look */
        view.addEventListener('click',e=>{
          if(e.target.closest('.cam-ctrl')||e.target.closest('.cam-fx')) return;
          const r=view.getBoundingClientRect(), s=dpScale();
          focus.style.left=((e.clientX-r.left)/s)+'px'; focus.style.top=((e.clientY-r.top)/s)+'px';
          focus.classList.remove('on','ok'); void focus.offsetWidth; focus.classList.add('on');
          setTimeout(()=>focus.classList.add('ok'),260);
        });
        setInterval(()=>{ if(mode!=='pano'&&!recording){ focus.style.left='50%'; focus.style.top='44%';
          focus.classList.remove('on','ok'); void focus.offsetWidth; focus.classList.add('on');
          setTimeout(()=>focus.classList.add('ok'),240); } },7000);
        let recStart=0, panoTimer=null;
        shutter.onclick=()=>{
          if(mode==='photo'){
            const take=()=>{
              Sound.shutter();
              const key='img_'+Date.now();
              Content.add('images',{id:key,name:'IMG_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.jpg',
                album:'Camera',when:Date.now(),key:key,w:2592,h:1944,fx:fx!=='none'?fx:null});
              thumb.innerHTML='<img src="'+Art.photo(key,88,88)+'" style="width:100%;height:100%;object-fit:cover">';
              flash();
              if(intent.action==='IMAGE_CAPTURE'){ ctx.finish({imageKey:key}); }
            };
            if(zsl) take(); else { Holo.toast('…'); setTimeout(take,780); }
          } else if(mode==='video'){
            recording=!recording; shutter.classList.toggle('rec',recording);
            if(recording){ recStart=Date.now(); Sound.tick(); }
            else {
              const key='vid_'+Date.now();
              Content.add('images',{id:key,name:'VID_'+Date.now()+'.mp4',album:'Camera',when:Date.now(),key:key,video:true,w:1920,h:1080});
              Holo.toast(timelapse?'Time lapse saved':'1080p video saved');
            }
          } else {
            if(panoTimer){ endPano(); return; }
            panoOn=true; panoX=0;
            const strip=pano.querySelector('.strip'); strip.innerHTML='';
            panoTimer=setInterval(()=>{
              panoX+=6;
              const seg=el('div'); seg.style.cssText='width:14px;height:100%;flex:0 0 auto;background-size:cover';
              seg.style.backgroundImage='url('+Art.photo('pano'+Math.floor(panoX/40),20,40)+')';
              strip.appendChild(seg);
              pano.querySelector('.cursor').style.left=clamp(panoX/2.6,0,268)+'px';
              if(panoX>=300) endPano();
            },90);
          }
        };
        function endPano(){
          clearInterval(panoTimer); panoTimer=null; panoOn=false;
          Sound.shutter();
          const key='pano_'+Date.now();
          Content.add('images',{id:key,name:'PANO_'+Date.now()+'.jpg',album:'Camera',when:Date.now(),key:key,w:5400,h:1200,pano:true});
          flash(); Holo.toast('Panorama saved');
        }
        function flash(){ const f=el('div'); f.style.cssText='position:absolute;inset:0;z-index:9;background:'+Holo.color('paper','dark');
          view.appendChild(f); requestAnimationFrame(()=>{ f.style.transition='opacity .3s'; f.style.opacity='0'; });
          setTimeout(()=>f.remove(),340); }
        thumb.onclick=()=>Intents.start({action:'VIEW',type:'image/*',extras:{album:'Camera'}});
        const last=Content.all('images')[0];
        if(last) thumb.innerHTML='<img src="'+Art.photo(last.key,88,88)+'" style="width:100%;height:100%;object-fit:cover">';
        draw();
        return {dimNav:true,lightStatus:true};
      }}
    ]
  });
})();

/* ---------- Gallery (org.museum.gallery) ----------
   With the photo editor 4.0 built in: crop, rotate, exposure and a row of
   filters, on the phone, with no second application and no computer. */
(function(){
  const PKG='org.museum.gallery';
  Registry.register({
    pkg:PKG,label:'Gallery',theme:Holo.THEME.DARK,targetSdk:15,
    providers:{images:{query:f=>Content.query('images',f)}},
    activities:[
      {name:'Main',launcher:true,filters:[{action:'MAIN'},{action:'VIEW',type:['image/*']},{action:'PICK',type:['image/*']}],
       create(intent,win,ctx){
        const pickMode=intent.action==='PICK';
        let album=(intent.extras||{}).album||null;
        const ab=Holo.actionBar({title:pickMode?'Select picture':'Gallery',icon:Art.appIcon(PKG,28),
          up:!!album||pickMode,onUp:()=>{ if(album&&!pickMode){ album=null; body(); } else ctx.finish(); },
          spinnerTitle:album?null:{items:['Albums','By time','By location','By people'],sel:0,on:()=>body()},
          actions:[{icon:'camera',label:'Camera',on:()=>Intents.start({action:'IMAGE_CAPTURE'})}],
          overflow:[{label:'Make available offline',on:()=>Holo.toast('Already on the device')},
                    {label:'Settings',on:()=>Holo.toast('Gallery settings')}]});
        win.appendChild(ab.el);
        const content=el('div','h-content'); win.appendChild(content);
        function albums(){
          const by={};
          Content.all('images').forEach(i=>{ (by[i.album]=by[i.album]||[]).push(i); });
          return Object.keys(by).map(k=>({name:k,items:by[k]}));
        }
        function body(){
          content.innerHTML='';
          ab.setTitle(album||(pickMode?'Select picture':'Gallery'));
          const sc=Holo.scroll(); content.appendChild(sc);
          if(!album){
            const g=el('div','h-grid'); g.style.gridTemplateColumns='1fr 1fr';
            albums().forEach(a=>{
              const c=el('div'); c.style.cssText='position:relative;aspect-ratio:1.2/1;cursor:pointer;overflow:hidden;border-radius:var(--h-radius)';
              c.innerHTML='<img src="'+Art.photo(a.items[0].key,240,200)+'" style="width:100%;height:100%;object-fit:cover;display:block">'
                +'<div style="position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85))">'
                +'<div style="font-size:14px;color:'+Holo.color('onImage')+'">'+esc(a.name)+'</div>'
                +'<div style="font-size:11px;color:'+Holo.color('onImageDim')+'">'+a.items.length+'</div></div>';
              c.onclick=()=>{ album=a.name; body(); };
              g.appendChild(c);
            });
            sc.scroller.appendChild(g);
            if(!albums().length) content.appendChild(Holo.empty('image','No pictures','Take one with the Camera, or press the shutter with Power + Volume Down'));
            return;
          }
          const items=Content.query('images',i=>i.album===album).sort((a,b)=>b.when-a.when);
          const g=el('div','h-grid'); g.style.gridTemplateColumns='1fr 1fr 1fr';
          items.forEach(i=>{
            const c=el('div'); c.style.cssText='position:relative;aspect-ratio:1/1;cursor:pointer;overflow:hidden';
            c.innerHTML='<img src="'+Art.photo(i.key,160,160)+'" style="width:100%;height:100%;object-fit:cover;display:block">'
              +(i.video?'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:'+Holo.color('onImage')+'">'+ic('play')+'</div>':'')
              +(i.pano?'<div style="position:absolute;left:3px;bottom:3px;width:16px;color:'+Holo.color('onImage')+'">'+ic('pano')+'</div>':'');
            c.onclick=()=>{ if(pickMode){ ctx.finish({imageKey:i.key,imageName:i.name}); return; } viewer(i,items); };
            g.appendChild(c);
          });
          sc.scroller.appendChild(g);
        }
        function viewer(img,items){
          let idx=items.indexOf(img);
          const ov=el('div'); ov.style.cssText='position:absolute;inset:0;background:var(--h-bg);z-index:9;display:flex;flex-direction:column';
          const vab=Holo.actionBar({up:true,onUp:()=>ov.remove(),title:'',icon:null,
            actions:[{icon:'share',label:'Share',on:()=>{ const i=items[idx];
                Intents.send('image/*',{imageKey:i.key,imageName:i.name,text:'Sent from my phone'}); }},
              {icon:'trash',label:'Delete',on:()=>{ Content.remove('images',items[idx].id); ov.remove(); body(); }}],
            overflow:[{label:'Edit',on:()=>editor(items[idx],ov)},
                      {label:'Rotate left',on:()=>{ rot-=90; place(); }},
                      {label:'Rotate right',on:()=>{ rot+=90; place(); }},
                      {label:'Crop',on:()=>editor(items[idx],ov)},
                      {label:'Set picture as',on:()=>Holo.toast('Set as wallpaper or contact photo')},
                      {label:'Beam this picture',on:()=>Beam.offer({kind:'photo',title:items[idx].name,key:items[idx].key})},
                      {label:'Details',on:()=>{ const i=items[idx];
                        Holo.dialog({title:'Details',host:ov,theme:'dark',
                          html:'<p>'+esc(i.name)+'</p><p style="color:var(--h-fg3)">'+i.w+' × '+i.h
                            +'<br>'+esc(fmtDate(i.when))+'<br>'+(i.fx?'Effect: '+esc(i.fx):'No effect')+'</p>',
                          buttons:[{label:'Close'}]}); }}]});
          ov.appendChild(vab.el);
          const stage=el('div'); stage.style.cssText='flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center';
          const im=el('img'); im.style.cssText='max-width:100%;max-height:100%;display:block;transition:transform .2s';
          stage.appendChild(im); ov.appendChild(stage);
          let rot=0;
          function place(){ const i=items[idx]; im.src=Art.photo(i.key,720,540); im.style.transform='rotate('+rot+'deg)';
            vab.setTitle(i.name); vab.setSubtitle((idx+1)+' of '+items.length); }
          let dx0=0;
          onDrag(stage,{threshold:10,
            move:({dx,dy})=>{ if(Math.abs(dy)>Math.abs(dx)) return; dx0=dx/dpScale(); im.style.transition='none'; im.style.transform='translateX('+dx0+'px) rotate('+rot+'deg)'; },
            end:()=>{ im.style.transition='transform .2s';
              if(Math.abs(dx0)>60){ idx=clamp(idx+(dx0<0?1:-1),0,items.length-1); rot=0; }
              place(); dx0=0; }});
          place(); win.appendChild(ov);
        }
        function editor(img,host){
          const ov=el('div'); ov.style.cssText='position:absolute;inset:0;background:var(--h-bg);z-index:10;display:flex;flex-direction:column';
          let filter='none', exposure=0, crop=false, rot=0;
          const eab=Holo.actionBar({up:true,onUp:()=>ov.remove(),title:'Edit',
            actions:[{icon:'done',label:'Save',text:true,on:()=>{
              const key=img.key+'_edit'+Date.now();
              Content.add('images',{id:key,name:img.name.replace('.jpg','')+'_edited.jpg',album:'Edited',when:Date.now(),key,w:img.w,h:img.h});
              Holo.toast('Saved a copy'); ov.remove(); body(); Guide.mark('editor'); }}]});
          ov.appendChild(eab.el);
          const stage=el('div'); stage.style.cssText='flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative';
          const cnv=el('canvas'); cnv.width=320; cnv.height=240; cnv.style.cssText='max-width:94%;max-height:94%';
          stage.appendChild(cnv); ov.appendChild(stage);
          const base=new Image(); base.src=Art.photo(img.key,320,240);
          base.onload=()=>paint();
          function paint(){
            const g2=cnv.getContext('2d');
            g2.save(); g2.clearRect(0,0,320,240);
            g2.translate(160,120); g2.rotate(rot*Math.PI/180); g2.translate(-160,-120);
            let f='';
            if(filter==='mono') f='grayscale(1)';
            else if(filter==='sepia') f='sepia(.8)';
            else if(filter==='cross') f='saturate(2.2) hue-rotate(-18deg) contrast(1.15)';
            else if(filter==='cold') f='hue-rotate(160deg) saturate(1.3)';
            else if(filter==='doc') f='contrast(1.8) grayscale(1) brightness(1.1)';
            g2.filter=(f?f+' ':'')+'brightness('+(1+exposure)+')';
            if(crop) g2.drawImage(base,40,30,240,180,0,0,320,240);
            else g2.drawImage(base,0,0,320,240);
            g2.restore();
          }
          const tools=el('div'); tools.style.cssText='flex:0 0 auto;padding:8px;border-top:1px solid var(--h-div)';
          const row=el('div'); row.style.cssText='display:flex;gap:8px;overflow-x:auto;padding-bottom:6px';
          [['none','Original'],['mono','Mono'],['sepia','Sepia'],['cross','Cross'],['cold','Cold'],['doc','Doc']].forEach(f=>{
            const b=Holo.button(f[1],{borderless:filter!==f[0],primary:filter===f[0],on:()=>{ filter=f[0]; paint(); row.querySelectorAll('button').forEach(x=>x.classList.remove('primary')); b.classList.add('primary'); }});
            row.appendChild(b);
          });
          tools.appendChild(row);
          const ex=el('div'); ex.style.cssText='display:flex;align-items:center;gap:10px;padding:4px 4px 0';
          ex.innerHTML='<span style="font-size:12px;color:var(--h-fg2);width:64px">Exposure</span>';
          ex.appendChild(Holo.seek({value:0.5,on:v=>{ exposure=(v-0.5); paint(); }}));
          tools.appendChild(ex);
          const r2=el('div','h-btnbar');
          r2.appendChild(Holo.button('Crop',{icon:'crop',on:()=>{ crop=!crop; paint(); }}));
          r2.appendChild(Holo.button('Rotate',{icon:'rotate',on:()=>{ rot=(rot+90)%360; paint(); }}));
          tools.appendChild(r2);
          ov.appendChild(tools);
          (host||win).appendChild(ov);
        }
        body();
        return {resume(){ body(); }};
      }}
    ]
  });
})();

/* ---------- Music (org.museum.music) ---------- */
(function(){
  const PKG='org.museum.music';
  Registry.register({
    pkg:PKG,label:'Music',theme:Holo.THEME.DARK,targetSdk:15,
    activities:[
      {name:'Main',launcher:true,filters:[{action:'MAIN'},{action:'VIEW',type:['audio/*']}],
       create(intent,win,ctx){
        let tab=0;
        const ab=Holo.actionBar({title:'Music',icon:Art.appIcon(PKG,28),
          tabs:{items:[{label:'Albums'},{label:'Artists'},{label:'Songs'},{label:'Playlists'}],sel:0,scrollable:true,on:i=>{ tab=i; body(); }},
          actions:[{icon:'search',label:'Search',on:()=>Holo.toast('Search music')}],
          overflow:[{label:'Shuffle all',on:()=>{ Music.play(pick(Content.all('audio'))); body(); }},
                    {label:'Settings',on:()=>Holo.toast('Music settings')}]});
        win.appendChild(ab.el);
        const content=el('div','h-content'); win.appendChild(content);
        function body(){
          content.innerHTML='';
          const sc=Holo.scroll(); content.appendChild(sc);
          const songs=Content.all('audio');
          if(tab===0){
            const albums={}; songs.forEach(s=>{ (albums[s.album]=albums[s.album]||[]).push(s); });
            const g=el('div','h-grid'); g.style.gridTemplateColumns='1fr 1fr';
            Object.keys(albums).forEach(a=>{
              const c=el('div'); c.style.cssText='cursor:pointer';
              c.innerHTML='<img src="'+Art.albumArt(a,180)+'" style="width:100%;aspect-ratio:1/1;display:block;border-radius:var(--h-radius)">'
                +'<div style="font-size:13px;margin-top:4px">'+esc(a)+'</div>'
                +'<div style="font-size:11px;color:var(--h-fg2)">'+esc(albums[a][0].artist)+'</div>';
              c.onclick=()=>{ Music.play(albums[a][0]); player(); };
              g.appendChild(c);
            });
            sc.scroller.appendChild(g);
          } else {
            const l=Holo.list();
            const items=tab===2?songs:tab===1?
              Array.from(new Set(songs.map(s=>s.artist))).map(a=>({title:a,artist:a,album:'',list:true}))
              :[{title:'Recently added',list:true},{title:'My favourites',list:true}];
            items.forEach(s=>l.appendChild(Holo.listItem({
              icon:s.list?null:'<img src="'+Art.albumArt(s.album,40)+'" style="width:100%;height:100%">',
              title:s.title,sub:s.list?null:s.artist+' · '+s.album,
              right:s.list?null:'<span style="font-size:11px">'+Math.floor(s.dur/60)+':'+pad2(s.dur%60)+'</span>',
              on:()=>{ if(s.list){ tab=2; body(); return; } Music.play(s); player(); }})));
            sc.scroller.appendChild(l);
          }
          if(Music.current){
            const bar=el('div'); bar.style.cssText='flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px;border-top:1px solid var(--h-div);cursor:pointer';
            bar.innerHTML='<img src="'+Art.albumArt(Music.current.album,40)+'" style="width:40px;height:40px;border-radius:var(--h-radius)">'
              +'<div style="flex:1;min-width:0"><div style="font-size:14px">'+esc(Music.current.title)+'</div>'
              +'<div style="font-size:11px;color:var(--h-fg2)">'+esc(Music.current.artist)+'</div></div>';
            const p=el('div'); p.style.cssText='width:28px;color:var(--h-fg)'; p.innerHTML=ic(Music.playing?'pause':'play');
            p.onclick=e=>{ e.stopPropagation(); Music.toggle(); body(); };
            bar.appendChild(p);
            bar.onclick=()=>player();
            content.appendChild(bar);
          }
        }
        function player(){
          const ov=el('div'); ov.style.cssText='position:absolute;inset:0;background:var(--h-bg);z-index:8;display:flex;flex-direction:column';
          const pab=Holo.actionBar({up:true,onUp:()=>ov.remove(),title:Music.current.album,subtitle:Music.current.artist,
            overflow:[{label:'Add to playlist',on:()=>Holo.toast('Added')},{label:'Use as ringtone',on:()=>Holo.toast('Set as ringtone')}]});
          ov.appendChild(pab.el);
          const b=el('div','h-content'); b.style.cssText+=';align-items:center;justify-content:center;gap:14px;padding:16px';
          b.innerHTML='<img src="'+Art.albumArt(Music.current.album,260)+'" style="width:62%;aspect-ratio:1/1;border-radius:var(--h-radius)">'
            +'<div style="text-align:center"><div style="font-size:19px">'+esc(Music.current.title)+'</div>'
            +'<div style="font-size:13px;color:var(--h-fg2)">'+esc(Music.current.artist)+'</div></div>';
          const sk=Holo.seek({value:0,on:()=>{}}); sk.style.width='86%'; b.appendChild(sk);
          const ctl=el('div'); ctl.style.cssText='display:flex;gap:24px;align-items:center;color:var(--h-fg)';
          [['prev',()=>Music.prev()],[Music.playing?'pause':'play',()=>{ Music.toggle(); }],['next',()=>Music.next()]].forEach((c,i)=>{
            const x=el('div'); x.style.cssText='width:'+(i===1?42:30)+'px;cursor:pointer'; x.innerHTML=ic(c[0]);
            x.onclick=()=>{ c[1](); ov.remove(); body(); player(); }; ctl.appendChild(x);
          });
          b.appendChild(ctl);
          ov.appendChild(b); win.appendChild(ov);
          let pos=0;
          const iv=setInterval(()=>{ if(!Music.playing) return; pos+=1/(Music.current.dur||180); sk.setValue(clamp(pos,0,1)); if(pos>=1){ pos=0; Music.next(); } },1000);
          ov.addEventListener('DOMNodeRemoved',()=>clearInterval(iv));
        }
        body();
        return {resume(){ body(); }};
      }}
    ]
  });
  window.Music={
    current:null, playing:false, _seq:null,
    play(s){ this.current=s; this.playing=true; this.notif(); this.loop(); },
    toggle(){ this.playing=!this.playing; if(this.playing) this.loop(); else clearInterval(this._seq); this.notif(); },
    next(){ const a=Content.all('audio'); const i=a.indexOf(this.current); this.play(a[(i+1)%a.length]); },
    prev(){ const a=Content.all('audio'); const i=a.indexOf(this.current); this.play(a[(i-1+a.length)%a.length]); },
    loop(){
      clearInterval(this._seq);
      /* a small sequencer so that "playing" is audible when sound is on */
      const r=seeded(hashStr(this.current.title));
      const scale=[262,294,330,392,440,523,587,659];

        ongoing:this.playing,statusIcon:'music',silent:true,ticker:false,
        intent:{action:'MAIN',component:PKG+'/Main'}});
      if(!this.playing) Notif.cancel('music.now');

(function(){

       create(intent,win,ctx){
        let tab=0;
        const ab=Holo.actionBar({title:'Clock',icon:Art.appIcon(PKG,28),
          tabs:{items:[{icon:'alarm',label:'Alarm'},{icon:'clock',label:'Clock'},{icon:'timelapse',label:'Timer'}],sel:0,on:i=>{ tab=i; body(); }},
          actions:[{icon:'add',label:'Add alarm',on:()=>add()}]});
        win.appendChild(ab.el);
        const content=el('div','h-content'); win.appendChild(content);
        function alarms(){ return State.get('alarms',[{h:6,m:45,on:true,days:'Mon–Fri',label:'Ferry'},{h:7,m:30,on:false,days:'Sat, Sun',label:''}]); }
        function save(a){ State.set('alarms',a); }
        function body(){
          content.innerHTML='';
          if(tab===1){
            const b=el('div','h-content'); b.style.cssText+=';align-items:center;justify-content:center';
            const cp=fmtClockParts(new Date());
            b.innerHTML='<div style="font-size:78px;font-weight:200;letter-spacing:-.02em">'+esc(cp.t)
              +'<span style="font-size:24px;font-weight:400"> '+esc(cp.ap)+'</span></div>'
              +'<div style="font-size:15px;color:var(--h-fg2);margin-top:6px">'+esc(fmtDate(Date.now()))+'</div>';
            content.appendChild(b);
            return;
          }
          if(tab===2){
            const b=el('div','h-content'); b.style.cssText+=';align-items:center;justify-content:center;gap:14px';
            b.innerHTML='<div style="font-size:56px;font-weight:200">00:05:00</div>';
            b.appendChild(Holo.button('Start',{primary:true,on:()=>Holo.toast('Timer started')}));
            content.appendChild(b); return;
          }
          const sc=Holo.scroll(); content.appendChild(sc);
          const l=Holo.list(); const as=alarms();
          as.forEach((a,i)=>{
            const sw=Holo.switch_(a.on,v=>{ a.on=v; save(as); });
            l.appendChild(Holo.listItem({title:(a.h>12?a.h-12:a.h)+':'+pad2(a.m)+(a.h<12?' AM':' PM'),
              sub:(a.label?a.label+' · ':'')+a.days,widget:sw,on:()=>{}}));
          });
          sc.scroller.appendChild(l);
        }
        function add(){
          const as=alarms(); as.push({h:8,m:0,on:true,days:'Every day',label:''}); save(as); body(); Holo.toast('Alarm set');
        }
        body();
        const iv=setInterval(()=>{ if(tab===1) body(); },10000);
        return {destroy(){ clearInterval(iv); }};
      }}
    ]
  });
})();

                   :'Does NOT declare Holo — it targets an older platform, so it brings its own look and summons the Menu button.')+'</p>'));
          win.appendChild(ov);
        }
        body();
        return {resume(){ body(); }};
      }}
    ]
  });
  const MARKET_ICON=Art.ICONS[PKG], PLAY_ICON=Art.ICONS['org.museum.market.play'];
  window.Market={

                   :'<b>Back to Android Market.</b> That was its name when this phone went on sale in November 2011, and this exhibit uses the vocabulary of the moment it is set in.','market');
