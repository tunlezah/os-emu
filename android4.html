      /* ---- Data usage: the graph, the breakdown, and the two lines ---- */
      {name:'DataUsage',filters:[{action:'MAIN'},{action:'DATA_USAGE_SETTINGS'}],
       create(intent,win,ctx){
        const ab=Holo.actionBar({title:'Data usage',up:true,onUp:()=>ctx.finish(),icon:Art.appIcon(PKG,28),
          tabs:{items:[{label:'Mobile'},{label:'Wi-Fi'}],sel:0,on:i=>{ tabi=i; body(); }},
          overflow:()=>[
            {label:'Data roaming',checked:false,on:()=>Holo.toast('Roaming off')},
            {label:'Restrict background data',checked:false,on:()=>Holo.toast('Set it per application below')},
            {label:'Show Wi-Fi usage',checked:true,on:()=>{}},
            {label:'Mobile networks',on:()=>Holo.toast('Mobile network settings')}]});
        win.appendChild(ab.el);
        let tabi=0;
        const sc=Holo.scroll(); win.appendChild(sc);
        function body(){
          sc.scroller.innerHTML='';
          if(tabi===1){
            sc.scroller.appendChild(Holo.pad('<div class="h-title">Wi-Fi</div>'
              +'<p class="h-body" style="margin-top:8px">Wi-Fi is not counted against the mobile limit and never was. That is the whole reason this feature worked: it gave you somewhere to put the expensive traffic.</p>'));
            const l=Holo.list();
            DataUsage.byApp().slice(0,6).forEach(a=>l.appendChild(Holo.listItem({icon:Art.appIcon(a.pkg,40),
              title:(Registry.pkg(a.pkg)||{label:a.pkg}).label,sub:mb(a.mb*2.4)+' over Wi-Fi'})));
            sc.scroller.appendChild(l);
            return;
          }
          const top=el('div'); top.style.cssText='padding:10px 16px 0';
          const cyc=el('div'); cyc.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:6px';
          cyc.appendChild(Holo.spinner(['Cycle: '+MON3[new Date(DataUsage.cycleStart()).getMonth()]+' '+DataUsage.cycleDay+' – '
            +MON3[new Date(DataUsage.cycleEnd()).getMonth()]+' '+DataUsage.cycleDay,'Change cycle…'],0,i=>{
              if(i===1) Holo.toast('Billing cycle resets on the '+DataUsage.cycleDay+'th');
            }));
          top.appendChild(cyc);
          const limRow=el('div'); limRow.style.cssText='display:flex;align-items:center;gap:10px;padding:4px 0';
          limRow.appendChild(el('span','h-body','Set mobile data limit'));
          limRow.appendChild(el('div',null,'')); limRow.lastChild.style.flex='1';
          limRow.appendChild(Holo.switch_(DataUsage.limitOn,v=>{
            if(v){
              Holo.dialog({title:'Limiting data usage',host:win,theme:'dark',
                html:'<p>Your mobile data connection will be turned off when the limit you set is reached.</p>'
                  +'<p style="margin-top:8px;color:var(--h-fg3)">Since data usage is measured by your phone, and your operator may account for usage differently, consider using a conservative limit.</p>',
                buttons:[{label:'Cancel',on:()=>{ DataUsage.limitOn=false; DataUsage.save(); body(); }},
                         {label:'OK',on:()=>{ DataUsage.limitOn=true; DataUsage.save(); DataUsage.check(); body(); Guide.mark('datalimit'); }}]});
            } else { DataUsage.limitOn=false; DataUsage.cut=false; DataUsage.save(); Notif.cancel('du.limit'); body(); }
          }));
          top.appendChild(limRow);
          sc.scroller.appendChild(top);

          /* the chart */
          const wrap=el('div'); wrap.style.cssText='padding:0 16px';
          const chart=el('div','du-chart');
          const cv=el('canvas'); cv.width=328; cv.height=190; chart.appendChild(cv);
          const total=DataUsage.cycleTotal();
          const yMax=Math.max(DataUsage.limitOn?DataUsage.limit*1.25:0,total*1.35,600);
          const y2v=y=>clamp((1-y/190)*yMax,0,yMax);
          const v2y=v=>190-(clamp(v,0,yMax)/yMax)*190;
          function paint(){
            const g=cv.getContext('2d'), W=cv.width, H=cv.height;
            g.clearRect(0,0,W,H);
            g.fillStyle=Holo.color('bgAlt','dark'); g.fillRect(0,0,W,H);
            g.strokeStyle=Holo.color('divider','dark'); g.lineWidth=1;
            for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(0,H*i/4); g.lineTo(W,H*i/4); g.stroke(); }
            const s=DataUsage.series(), n=s.length;
            /* the daily bars, then the running total */
            const acc=Holo.color('accent','dark');
            s.forEach((d,i)=>{
              if(!d.day) return;
              const x=i/n*W, bw=Math.max(2,W/n-2);
              const h=(d.day/yMax)*H*3;
              g.fillStyle='rgba(255,255,255,.14)'; g.fillRect(x,H-h,bw,h);
            });
            g.strokeStyle=acc; g.lineWidth=2; g.beginPath();
            let started=false;
            s.forEach((d,i)=>{ if(d.run==null) return; const x=i/n*W, y=v2y(d.run);
              if(!started){ g.moveTo(x,y); started=true; } else g.lineTo(x,y); });
            g.stroke();
            g.lineTo((DataUsage.dayOfCycle()-1)/n*W,H); g.lineTo(0,H); g.closePath();
            g.fillStyle=acc.replace(')',',.18)').replace('rgb','rgba');
            g.globalAlpha=0.18; g.fillStyle=acc; g.fill(); g.globalAlpha=1;
            /* today's marker */
            const tx=(DataUsage.dayOfCycle()-1)/n*W;
            g.strokeStyle='rgba(255,255,255,.4)'; g.setLineDash([3,3]);
            g.beginPath(); g.moveTo(tx,0); g.lineTo(tx,H); g.stroke(); g.setLineDash([]);
          }
          const warnLine=el('div','du-line'); warnLine.innerHTML='<div class="grab"></div>';
          const limLine=el('div','du-line limit'); limLine.innerHTML='<div class="grab"></div>';
          chart.appendChild(warnLine); chart.appendChild(limLine);
          function placeLines(){
            warnLine.style.top=v2y(DataUsage.warn)+'px';
            warnLine.querySelector('.grab').textContent=mb(DataUsage.warn)+' warning';
            limLine.style.display=DataUsage.limitOn?'':'none';
            limLine.style.top=v2y(DataUsage.limit)+'px';
            limLine.querySelector('.grab').textContent=mb(DataUsage.limit)+' limit';
          }
          function dragLine(node,key){
            let start=0;
            onDrag(node,{stop:true,
              start:()=>{ start=v2y(DataUsage[key]); },
              move:({dy})=>{
                const y=clamp(start+dy/dpScale(),0,190);
                DataUsage[key]=Math.max(10,Math.round(y2v(y)/10)*10);
                if(key==='limit'&&DataUsage.warn>DataUsage.limit) DataUsage.warn=DataUsage.limit-10;
                if(key==='warn'&&DataUsage.limitOn&&DataUsage.warn>DataUsage.limit) DataUsage.warn=DataUsage.limit;
                placeLines(); paint();
              },
              end:()=>{ DataUsage.save(); DataUsage.check(); body();
                if(key==='limit') Guide.mark('draglimit'); }
            });
          }
          dragLine(warnLine,'warn'); dragLine(limLine,'limit');
          wrap.appendChild(chart);
          const legend=el('div','du-legend');
          legend.innerHTML='<span><i style="background:'+Holo.color('accent','dark')+'"></i>'+mb(total)+' used</span>'
            +'<span><i style="background:'+Holo.color('caution','dark')+'"></i>warning</span>'
            +(DataUsage.limitOn?'<span><i style="background:'+Holo.color('warn','dark')+'"></i>limit</span>':'')
            +'<span style="margin-left:auto">day '+DataUsage.dayOfCycle()+' of '+DataUsage.cycleLen()+'</span>';
          wrap.appendChild(legend);
          if(DataUsage.cut){
            const w=el('div','h-card'); w.style.cssText+=';padding:10px;margin-bottom:10px;border-color:'+Holo.color('warn','dark');
            w.innerHTML='<div style="color:'+Holo.color('warn','dark')+';font-size:14px">Mobile data is off</div>'
              +'<div style="font-size:12px;color:var(--h-fg2);margin-top:3px">You have reached your limit. Wi-Fi still works.</div>';
            wrap.appendChild(w);
          }
          sc.scroller.appendChild(wrap);
          paint(); placeLines();

          sc.scroller.appendChild(Holo.header('Application usage'));
          const l=Holo.list();
          const apps=DataUsage.byApp(); const max=apps.length?apps[0].mb:1;
          apps.forEach(a=>{
            const m=Registry.pkg(a.pkg)||{label:a.pkg};
            const bar=el('div','barbg'); const f=el('div','bar'); f.style.width=(a.mb/max*100)+'%'; bar.appendChild(f);
            const row=el('div','du-app');
            row.innerHTML='<div style="width:40px;height:40px;flex:0 0 auto">'+Art.appIcon(a.pkg,40)+'</div>';
            const tx=el('div'); tx.style.cssText='flex:1;min-width:0';
            tx.innerHTML='<div style="font-size:15px">'+esc(m.label)+'</div>';
            tx.appendChild(bar);
            row.appendChild(tx);
            row.appendChild(el('div',null,'<span style="font-size:13px;color:var(--h-fg2)">'+mb(a.mb)+'</span>'));
            row.onclick=()=>appDetail(a);
            l.appendChild(row);
          });
          sc.scroller.appendChild(l);
          sc.scroller.appendChild(Holo.pad('<p class="h-body" style="font-size:12px;color:var(--h-fg3)">'
            +'Measured by the phone. Your operator may count differently, which is why the real screen told you to be conservative.</p>'));
        }
        function appDetail(a){
          const m=Registry.pkg(a.pkg)||{label:a.pkg};
          const b=el('div');
          b.innerHTML='<p class="h-body">'+mb(a.mb)+' of mobile data this cycle.</p>';
          const row=el('div'); row.style.cssText='display:flex;align-items:center;gap:10px;margin-top:12px';
          row.appendChild(el('span','h-body','Restrict background data'));

          b.appendChild(row);
          Holo.dialog({title:m.label,bodyNode:b,host:win,theme:'dark',buttons:[{label:'Done'}]});
        }
        body();
        return {resume(){ body(); }};
      }},

          l.appendChild(verRow);

          l.appendChild(Holo.listItem({title:'Kernel version',sub:'3.0.8-g4a7b4ff\nandroid-build@museum #1'}));
          l.appendChild(Holo.listItem({title:'Build number',sub:'ITL41D'}));
          box.appendChild(l);
          box.appendChild(Holo.pad('<p class="h-body" style="font-size:12px;color:var(--h-fg3)">'

            +'4.65&Prime; 1280 × 720 PenTile AMOLED · dual-core 1.2 GHz · 1 GB RAM · NFC · barometer · no microSD slot.</p>'
            +'<p class="h-body" style="font-size:12px;color:var(--h-fg3);margin-top:8px">'+esc(spec.note)+'</p>'));
        });
        function egg(w){
          Guide.mark('egg');
          const ov=el('div'); ov.style.cssText='position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:'+Holo.color('info','dark');
          const cv=el('canvas'); cv.width=360; cv.height=560; cv.style.cssText='width:100%;height:100%;display:block';
          ov.appendChild(cv);
          const cap=el('div'); cap.style.cssText='position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.7);color:'+Holo.color('onImage','dark');
          cap.textContent='Touch and hold';
          ov.appendChild(cap);
          w.appendChild(ov);
          let flying=false, t=0;
          const g=cv.getContext('2d');
          /* An original creature. Not the Android robot: a wafer sprite —
             two biscuit slabs with a cream middle, two eyes and a rainbow
             behind it. The version-number Easter egg started one release
             before this one and has been in every release since; this is
             ours. */
          function sprite(x,y,s,hue){
            g.save(); g.translate(x,y); g.scale(s,s);
            if(flying){
              for(let i=0;i<6;i++){ g.fillStyle='hsla('+((hue+i*40)%360)+',85%,60%,.85)';
                g.fillRect(-64-i*0,-9+i*3,58,3); }
            }
            g.fillStyle='#caa06a'; g.fillRect(-18,-14,36,9);
            g.fillStyle='#f3efe3'; g.fillRect(-18,-5,36,8);
            g.fillStyle='#caa06a'; g.fillRect(-18,3,36,9);
            g.fillStyle='#8a6a3c';
            for(let i=-15;i<16;i+=6){ g.fillRect(i,-12,2,2); g.fillRect(i,6,2,2); }
            g.fillStyle='#1d1d1d';
            g.beginPath(); g.arc(-6,-1,2.4,0,7); g.fill();
            g.beginPath(); g.arc(6,-1,2.4,0,7); g.fill();
            g.fillStyle='#ffffff';
            g.beginPath(); g.arc(-6.7,-1.7,0.9,0,7); g.fill();
            g.beginPath(); g.arc(5.3,-1.7,0.9,0,7); g.fill();
            g.restore();
          }
          const field=[];
          for(let i=0;i<26;i++) field.push({x:Math.random()*360,y:Math.random()*560,v:0.6+Math.random()*2.2,
            s:0.7+Math.random()*1.5,hue:Math.random()*360});
          function draw(){
            t++;
            const bg=g.createLinearGradient(0,0,0,560);
            bg.addColorStop(0,flying?'#0a2a3a':'#1b7fa8'); bg.addColorStop(1,flying?'#061722':'#33b5e5');
            g.fillStyle=bg; g.fillRect(0,0,360,560);
            if(flying){
              field.forEach(f=>{ f.x+=f.v*2.4; if(f.x>430){ f.x=-70; f.y=Math.random()*560; }
                sprite(f.x,f.y,f.s,f.hue+t); });
            } else {
              sprite(180,280,5.4+Math.sin(t/26)*0.22,0);
            }
            if(ov.isConnected) raf(draw);
          }
          draw();
          Holo.longPress(ov,()=>{ if(!flying){ flying=true; cap.textContent='';
            Sound.tone(660,0.12,'triangle',0.1); setTimeout(()=>Sound.tone(880,0.2,'triangle',0.09),120);
            MToast.show('<b>The version-number Easter egg.</b> Tap the Android version seven times and something appears; hold it and something sillier happens. It began one release before this one and has been in every release since. The creature here is an original — the real one is not ours to draw.','easter'); } });
          ov.onclick=()=>{ if(!flying) return; ov.remove(); };
          setTimeout(()=>{ ov.addEventListener('click',()=>ov.remove()); },1400);
        }

/* ---- explore by touch, new in 4.0 ---- */
const Access={
  on:false, node:null,
  set(v){
    this.on=v; $id('lcd').classList.toggle('exploring',v);
    if(!this.node){ this.node=el('div'); this.node.id='speak'; $id('lcd').appendChild(this.node); }
    this.node.classList.toggle('on',v);
    if(v&&!this._bound){
      this._bound=true;
      $id('lcd').addEventListener('pointermove',e=>{
        if(!this.on) return;
        const t=document.elementFromPoint(e.clientX,e.clientY);
        if(!t||t===this._last) return;
        $$('.exphl').forEach(n=>n.classList.remove('exphl'));
        const spoken=t.closest('.h-li,.h-ab-act,.h-btn,.cell,.nb,.h-tab,.nrow,.h-switch');
        if(!spoken) return;
        spoken.classList.add('exphl'); this._last=t;
        const txt=(spoken.querySelector('.h-li-title')||spoken.querySelector('.lbl')||spoken).textContent.trim()
          ||spoken.title||spoken.dataset.k||'button';
        const kind=spoken.classList.contains('h-switch')?(spoken.classList.contains('on')?'switch, on':'switch, off')
          :spoken.classList.contains('nb')?'navigation button':spoken.classList.contains('h-li')?'list item':'button';
        this.node.innerHTML='<b>Explore by touch</b>'+esc(txt.slice(0,90))+' — '+kind+'. Double-tap to activate.';
        Sound.tick();
      });
    }
  }
};

/* ==========================================================================
   ANDROID BEAM — tap two devices back to back and hand something over.
   NFC brings the two phones into contact; the actual payload goes over
   Bluetooth or Wi-Fi once they have agreed. The gesture is the interface:
   the screen you are looking at shrinks, you touch it, and it flies.
   ========================================================================== */
const Beam={
  pending:null,
  ready(){ return Sys.flags.nfc && $id('device2').classList.contains('on'); },
  showDevice(v){
    $id('device2').classList.toggle('on',v);
    Display.fit();
    if(v){ this.render({kind:'idle'}); }
  },
  offer(payload){
    if(!Sys.flags.nfc){ Holo.toast('NFC is off'); return; }
    if(!$id('device2').classList.contains('on')){
      this.showDevice(true);
      MToast.show('<b>A second handset, on the desk.</b> Press <b>Tap the phones together</b> below it, then touch the shrunken screen to beam.','beam');
    }
    this.pending=payload;
    const layer=$id('beamlayer');
    layer.innerHTML='<div class="bshrink"></div><div class="btxt">Touch to beam</div>'
      +'<div class="bsub">'+esc(payload.title||'')+'</div>';
    /* the shrunken screen is the live screen — a clone of whatever is in
       front, which is what made the gesture legible */
    const top=Stack.foreground();
    const src=top?top.win:$id('home');
    const clone=src.cloneNode(true);
    clone.style.cssText+=';position:absolute;inset:0;pointer-events:none';
    layer.querySelector('.bshrink').appendChild(clone);
    layer.classList.add('on');
    requestAnimationFrame(()=>layer.classList.add('go'));
    Sound.tone(520,0.1,'sine',0.1,900);
    layer.onclick=()=>{ this.fire(); };
    clearTimeout(this._t); this._t=setTimeout(()=>{ this.cancel(); },7000);
  },
  cancel(){ const l=$id('beamlayer'); l.classList.remove('on','go'); l.innerHTML=''; this.pending=null; },
  fire(){
    if(!this.pending) { this.cancel(); return; }
    const p=this.pending;
    Sound.beam();
    this.cancel();
    $id('device2').classList.add('tapped');
    setTimeout(()=>$id('device2').classList.remove('tapped'),500);
    this.render(p);
    Holo.toast('Beam complete');
    Guide.mark('beam');
    MToast.show('<b>Beamed.</b> NFC only got the two handsets to agree; the payload went over Bluetooth. The competing platform had nothing like it for another two years, and when it did it worked only between its own devices.','beam');
  },
  render(p){
    const b=$id('device2').querySelector('.d2body');
    $id('d2clk').textContent=fmtClockShort(new Date());
    if(!p||p.kind==='idle'){
      b.innerHTML='<div class="d2ab">Home</div><div class="d2pad" style="color:#8a8a8a">'
        +'A second handset with NFC. Beam a web page, a contact, a place or a picture to it from the Galaxy Nexus — '
        +'the overflow menu in the Browser, People, Maps, Gallery and the Market all offer it.</div>';
      return;
    }
    if(p.kind==='photo'){
      b.innerHTML='<div class="d2ab">Gallery</div>'
        +'<img src="'+Art.photo(p.key,226,300)+'" style="width:100%;display:block">'
        +'<div class="d2pad">'+esc(p.title||'')+'</div>';
      return;
    }
    const heads={page:'Browser',contact:'People',map:'Maps',market:'Android Market'};
    b.innerHTML='<div class="d2ab">'+esc(heads[p.kind]||'Received')+'</div>'
      +'<div class="d2pad"><div style="font-size:14px;margin-bottom:6px">'+esc(p.title||'')+'</div>'
      +'<div style="color:#9a9a9a;line-height:1.5">'+esc(p.body||'')+'</div>'
      +'<div style="margin-top:12px;font-size:10px;color:#5c6570">Received over Android Beam</div></div>';
  },
  explain(host){
    Holo.dialog({title:'Android Beam',host:host||$id('sysoverlay'),theme:'dark',
      html:'<p>Hold two NFC phones back to back. Whatever is on your screen shrinks; touch it and it goes across.</p>'

  open(tab){ if(tab) this.tab=tab; $id('guide').classList.add('open'); $id('btnGuide').classList.add('on'); this.render(); },
  close(){ $id('guide').classList.remove('open'); $id('btnGuide').classList.remove('on'); },
  toggle(){ $id('guide').classList.contains('open')?this.close():this.open(); },
  mark(id){ if(!id||this.found[id]) return; this.found[id]=true; State.set('found',this.found);
    if($id('guide').classList.contains('open')&&this.tab==='easter') this.render(); },
  render(){
    $$('#gtabs button').forEach((b,i)=>b.classList.toggle('on',this.TABS[i][0]===this.tab));
    const body=$id('gbody');
    body.innerHTML=this.html(this.tab);
    body.scrollTop=0;
    $$('.gact',body).forEach(b=>b.onclick=()=>this.act(b.dataset.a));
    $$('.xref',body).forEach(b=>b.onclick=()=>this.open(b.dataset.t));
    if(this.tab==='dashboard'){ const d=body.querySelector('#dash'); if(d) Dashboard.render(d); }
  },
  act(a){
    switch(a){
      case 'skin': ThemeLayer.toggle(); break;
      case 'holo': ThemeLayer.set('holo'); break;
      case 'orbit': ThemeLayer.set('orbit'); break;
      case 'settings': this.close(); Intents.start({action:'MAIN',component:'org.museum.settings/Main'}); break;
      case 'datausage': this.close(); Intents.start({action:'MAIN',component:'org.museum.settings/DataUsage'}); break;
      case 'security': this.close(); Intents.start({action:'MAIN',component:'org.museum.settings/Security'}); break;
      case 'about': this.close(); Intents.start({action:'MAIN',component:'org.museum.settings/About'}); break;
      case 'legacy': this.close(); Intents.start({action:'MAIN',component:'org.museum.ledger/Main'}); break;
      case 'legacy2': this.close(); Intents.start({action:'MAIN',component:'org.museum.transit/Main'}); break;
      case 'camera': this.close(); Intents.start({action:'MAIN',component:'org.museum.camera/Main'}); break;
      case 'browser': this.close(); Intents.start({action:'MAIN',component:'org.museum.browser/Main'}); break;
      case 'gmail': this.close(); Intents.start({action:'MAIN',component:'org.museum.gmail/Main'}); break;
      case 'market': this.close(); Intents.start({action:'MAIN',component:'org.museum.market/Main'}); break;
      case 'recents': this.close(); Recents.show(); break;
      case 'shade': this.close(); Notif.openShade(); break;
      case 'home': this.close(); Stack.home(); break;
      case 'drawer': this.close(); Stack.home(); setTimeout(()=>AllApps.show(),200); break;
      case 'rotate': Device.rotate(); break;
      case 'lock': this.close(); Device.screenOff(); setTimeout(()=>Device.screenOn(),600); break;
      case 'shot': this.close(); Device.screenshot(); break;
      case 'desk': this.close(); Desk.open(); break;
      case 'photo': this.close(); Desk.tab='photo'; Desk.open(); break;
      case 'beam': this.close(); Beam.showDevice(true); Beam.explain(); break;
      case 'loupe': Display.toggleLoupe(); break;
      case 'pentile': Sys.set('pentile',!Sys.settings.pentile); $id('pentile').classList.toggle('on',Sys.settings.pentile); break;
      case 'jank': Sys.set('jank',!Sys.settings.jank); $id('acts').classList.toggle('jank',Sys.settings.jank);
        Holo.toast(Sys.settings.jank?'Dropped frames: on':'Dropped frames: off'); break;
      case 'model': Device.setModel(Device.model==='gsm'?'lte':'gsm'); break;
      case 'rename': Market.rename(!Market.renamed()); break;
      case 'sms': Museum.incomingText(); break;
      case 'call': Call.incoming(); break;
      case 'reset': Museum.confirmReset(); break;
      case 'folderdemo': this.close(); Stack.home(); Holo.toast('Long-press an icon, then drop it on another'); break;
    }
  },
  html(id){
    const A=(a,l)=>'<span class="gact" data-a="'+a+'">'+l+'</span>';
    const X=(t,l)=>'<span class="xref" data-t="'+t+'">'+l+'</span>';
    switch(id){

    case 'welcome': return '<h3>Android 4.0 “Ice Cream Sandwich”</h3>'
      +'<p><b>Samsung Galaxy Nexus, November 2011.</b> A slab of glass with nothing on its face. Three symbols glowing along the bottom of the screen. Thin blue lines on black.</p>'
      +'<div class="pull">This is the release reviewers described, almost unanimously, as Android growing up. It is also the release that ran, as designed, on a small minority of the phones it was designed for. Both of those are the exhibit.</div>'
      +'<h4>Four things, in four minutes</h4>'
      +'<ul>'
      +'<li>'+A('recents','Open Recents')+' and throw three cards off the screen.</li>'
      +'<li>'+A('folderdemo','Go to the Home screen')+' and drag one icon onto another. A folder. Three years late.</li>'
      +'<li>'+A('datausage','Open Data usage')+' and drag the red limit line down until something gets cut off.</li>'
      +'<li>'+A('photo','Take the photograph off the desk')+' and show it to the lock screen.</li>'
      +'</ul>'
      +'<p>Then '+A('skin','flip the skin toggle')+' and look at the whole phone again — that is what most people who bought an Android phone that year were actually looking at — and open '+X('dashboard','the dashboard')+' to see how few of them were looking at this version at all.</p>'
      +'<p>The argument is in '+X('thesis','the thesis')+'. Everything the exhibit is not telling you the truth about is in '+X('honest','honest limits')+'.</p>';

    case 'thesis': return '<h3>The market decided before the product was finished</h3>'
      +'<p>Visitors arrive with a question: <em>when did Android stop being the cheap alternative and become a real one?</em> The honest answer has two parts and they are two years apart.</p>'
      +'<h4>Commercially, the tipping point was 2010, and it was ugly</h4>'
      +'<p>Android passed the iPhone in United States market share during 2010, and passed <b>Symbian</b> — the world’s number-one smartphone platform for a decade — around the turn of 2011. It did that running <b>Eclair, Froyo and Gingerbread</b>: versions that still looked like an engineering project, on hardware from a dozen manufacturers, each smearing its own skin over the top.</p>'
      +'<p>It won on price. It won on being available on every carrier while its competitor was locked to one. It won on choice of hardware. And it won on free Google services — most decisively <b>free turn-by-turn navigation in late 2009</b>, which erased an entire product category overnight. A carrier advertising campaign built around the word “Droid” did the rest.</p>'
      +'<p><b>None of that had anything to do with how it looked.</b></p>'
      +'<h4>In perception, the tipping point is this release</h4>'
      +'<p>Ice Cream Sandwich is the version reviewers called Android growing up: the first with a coherent design language, the first that looked designed rather than assembled. Its author was <b>Matias Duarte</b>, hired by Google in 2010 from Palm, where he had led the design of <b>webOS</b>.</p>'
      +'<p><b>Holo</b> — dark, blue-edged, thin-lined, glowing, deliberately digital — was a genuine third way at a moment when the industry had two: the competitor’s skeuomorphism, and Windows Phone’s typographic minimalism. And Google made the Holo theme a <b>compatibility requirement</b>: the first real attempt to constrain what manufacturers could do to the platform.</p>'
      +'<div class="pull">So design followed adoption here, which is the reverse of how the industry tells the story. Android did not win because it got beautiful. It got beautiful because it had already won, and Google could finally afford to make the winner look like it deserved to.</div>'
      +'<h4>The coda</h4>'
      +'<p>Holo lasted three years. <b>Jelly Bean</b>, eight months later, fixed the frame rate that this release never quite managed and added Google Now. <b>Material Design</b> in 2014 replaced Holo entirely.</p>'
      +'<p>And for most of its life Holo was not what most Android users saw, because most Android phones were sold with a manufacturer’s skin over the top. <b>The design language that made Android a peer was seen in its intended form by a minority of the people using it.</b> That is a strange and interesting thing for a museum to be able to show, so this exhibit shows it directly: '+A('skin','the skin toggle')+' and '+X('dashboard','the dashboard')+'.</p>';

    case 'holo': return '<h3>Holo, built first and built as a layer</h3>'
      +'<p>The exhibit is about a design language being imposed on a platform, so the design language here is a real layer that every application renders through — not a coat of paint applied at the end. It is <b>MODULE 1</b> of the file, built before the intent registry, before the launcher, before anything you can see.</p>'
      +'<h4>What Holo actually is</h4>'
      +'<ul>'
      +'<li><b>Three themes.</b> <span class="kbd">Theme.Holo</span> (dark), <span class="kbd">Theme.Holo.Light</span>, and <span class="kbd">Theme.Holo.Light.DarkActionBar</span> — the combination Gmail, People, Calendar, the Browser and the Market all used. An application declares one in its manifest and says nothing else about its appearance, ever.</li>'
      +'<li><b>The accent.</b> Holo blue, <span class="kbd">#33B5E5</span>. It means “you may touch this”, and it is almost the only colour in the system.</li>'
      +'<li><b>Thin lines, flat surfaces.</b> No gradients, no bevels, no drop shadows, and — a real break with Gingerbread — <b>no text shadows</b>. Light comes from the interface rather than from an imagined window.</li>'
      +'<li><b>The edge glow.</b> Drag a list past its end and a crescent of blue appears. It is the most recognisable single thing Holo does while your finger is on the glass.</li>'
      +'<li><b>Proportions.</b> 25dp status bar, 48dp Action Bar, 48dp navigation bar, 48dp minimum touch targets, 16dp gutters, an 8dp rhythm.</li>'
      +'</ul>'
      +'<h4>The Action Bar</h4>'
      +'<p>The pattern Holo standardised and made compulsory: <b>icon and title on the left</b> with the up affordance, <b>tabs or a spinner</b> beneath or inline, the important <b>actions as icons on the right</b>, and everything else behind <b>three vertical dots</b> — the overflow menu, which is what replaced the hardware Menu key.</p>'
      +'<p>Every application in this exhibit gets its bar from the design system. None of them draws one. '+A('gmail','Open Gmail')+' and then '+A('settings','Settings')+': the same bar, two themes, no shared code.</p>'
      +'<h4>Roboto</h4>'
      +'<p>New in this release, by Christian Robertson, and it was widely and publicly mocked at launch — a critic called it a Frankenstein assembled from the bones of Helvetica, Univers, Myriad and DIN, and the phrase stuck. It was revised, substantially, for later versions. This exhibit does not fetch it: it resolves Roboto locally if your machine has it and otherwise uses a neo-grotesque of similar proportion.</p>'
      +'<p>The structural claim is checked, not asserted. See '+X('colophon','the Colophon')+'.</p>';

    case 'skin': return '<h3>The skin toggle</h3>'
      +'<p>This is the exhibit’s most instructive control, and the shortest route to its argument.</p>'
      +'<div class="vs"><div class="a"><h5>Stock Holo</h5>Black. Flat. Thin blue lines. Square switches. No shadows under the type. The theme the Compatibility Definition Document required every Android 4.0 device to carry, unmodified.</div>'
      +'<div class="b"><h5>Kestrel Orbit UX 3.0</h5>Glossy gradients, rounded corners, a warm accent, shadows under every letter, taller rows, a switch that says ON and OFF because somebody decided the sliding block was not obvious. Invented for this exhibit — not a reproduction of any real skin, but written in the dialect nearly all of them spoke.</div></div>'
      +'<p>'+A('skin','Flip it')+' with an application open. Flip it in the middle of a task. Flip it with the shade down.</p>'
      +'<h4>What just happened, and what did not</h4>'
      +'<p>Every application changed. <b>Not one of them was told.</b> Not one line of any application’s code ran differently. The applications declared a theme; the theme layer decided what that theme resolves to; the component library reads the answer. That is what the compatibility requirement was for, and it is why a manufacturer could re-dress the entire platform without breaking anything.</p>'
      +'<p>It is also why Google’s floor was so low. The requirement said the Holo theme must be <b>present and unmodified</b>. It did not say anyone had to look at it. A manufacturer could ship Holo, untouched, underneath a skin that covered every screen the buyer would ever see — and most did.</p>'
      +'<div class="pull">Holo made Android a peer in the eyes of reviewers. Most Android buyers never saw it.</div>'
      +'<p>One honest wrinkle, which the skin here reproduces: flip to the skin and pull the shade down. There is a row of <b>toggles</b> at the top. Stock Android has none and will not until 4.2, two releases later. On this, the skins got there first, and it is fair to say so.</p>'
      +'<p>Then read '+X('dashboard','the dashboard')+', which is the other half of the same sentence.</p>';

    case 'dashboard': return '<h3>The platform version dashboard</h3>'
      +'<p>Google published the share of active devices running each version. Scrub it month by month. The column is the whole Android world; the blue band is this release.</p>'
      +'<div id="dash"></div>'
      +'<h4>What it says</h4>'
      +'<p><b>Six months after launch, in May 2012, Ice Cream Sandwich was on 4.9% of Android devices and Gingerbread was on 64.4%.</b> It did not pass a tenth until July 2012. It peaked at <b>29.3% in April 2013</b> and never went higher, because by then Jelly Bean was taking its place. <b>It never once led the platform it redesigned.</b></p>'
      +'<p>Manufacturers and carriers took months or years to ship it, and a great many devices never received it at all. The reason is not mysterious: an update cost a manufacturer money and earned it nothing, and on a carrier-controlled handset it needed the carrier’s blessing as well. '+A('model','Switch this exhibit to the LTE model')+' and look at System updates in '+A('about','About phone')+' — that handset was Google’s own reference device and its owners waited months at a time.</p>'
      +'<div class="pull">The release that made Android a peer in the eyes of reviewers was, for most of its life, running as designed on a small minority of the phones it was designed for. Let the visitor draw the conclusion; the exhibit only has to put the two facts next to each other.</div>';

    case 'nav': return '<h3>Three buttons, drawn on the screen</h3>'
      +'<p>There is nothing on the front of this handset. No Menu key, no Search key, no Home button, no trackball. Navigation moved entirely into the display, and the chin below the screen is bare because it has nothing left to hold.</p>'
      +'<ul>'
      +'<li><b>Back</b> — walks out through the activity stack, across applications, exactly as it had since 1.0.</li>'
      +'<li><b>Home</b> — leaves everything running and returns to the launcher.</li>'
      +'<li><b>Recents</b> — the card stack. '+A('recents','Open it')+'.</li>'
      +'</ul>'
      +'<p>No Menu button. No Search button. Menu went into the Action Bar’s overflow; Search became an action in the bar of whatever application needed it. Both had been hardware keys on every Android phone before this one.</p>'
      +'<h4>The card stack</h4>'
      +'<p>A vertical stack of tasks, each a live thumbnail of where that application was when you left it, each thrown away with a horizontal swipe. This is <b>webOS’s card metaphor</b> arriving on Android, brought by the man who drew webOS, and it is where that idea survived after Palm did not. It has outlived every Android redesign since.</p>'
      +'<h4>Rotation</h4>'
      +'<p>'+A('rotate','Turn the handset')+'. The navigation bar relocates to the side of the screen. It is the same bar; it is software, so it is drawn wherever the system decides it should be.</p>'
      +'<p>The fourth button has a page of its own: '+X('legacy','the Menu button')+'.</p>';

    case 'legacy': return '<h3>The legacy Menu button, and the shaming it accidentally did</h3>'
      +'<p>Applications built for older versions of the platform still expected a hardware Menu key. Android 4.0 gave them one: a <b>three-dot button that appears in the navigation bar</b> only while such an application is in the foreground, and vanishes the moment it closes.</p>'
      +'<p>'+A('legacy','Open Pocket Ledger')+' — targets Android 2.3 — or '+A('legacy2','Metro Times')+' — targets 2.2. Watch the bar change shape. Press Back and watch it change back.</p>'
      +'<div class="pull">It was a compatibility measure. What it became was a public mark of an application nobody had updated — a shaming device the platform did not set out to build, and which worked.</div>'
      +'<p>Notice what else changes. Those two applications do not get Holo at all: they declared the old default theme, so the system gives them the pre-Honeycomb look — a grey gradient title bar, bevelled buttons, an orange highlight, shadows under the text. Next to a 4.0 application the difference is not subtle, and that was the point.</p>'
      +'<p>There is a third one in the shop: <b>Skyline Weather</b>, in '+A('market','the Market')+', described there as written for Android 2.2 and never updated. Install it and it brings the Menu button with it.</p>'
      +'<p>Flip '+A('skin','the skin')+' while one of them is open: even the old theme gets recoloured, because a manufacturer was never going to leave a grey title bar alone if it could put its own gradient on it.</p>';

    case 'home': return '<h3>The Home screen, the launcher, and two things three years late</h3>'
      +'<p>Five panels over a wallpaper, a favourites tray along the bottom with the All Apps button in its centre, and a wallpaper that travels more slowly than the panels do.</p>'
      +'<h4>Folders</h4>'
      +'<p>Drag one icon onto another. That is it, and it had not been possible before. Open the folder, and the name field is at the bottom of the panel. Long-press an icon inside to take it out again; drop a folder to one item and it stops being a folder.</p>'
      +'<h4>Resizable widgets</h4>'
      +'<p>Long-press a widget and let go. Handles appear on all four sides. Before 4.0 a widget was whatever size its author had decided and you lived with it.</p>'
      +'<p>Six live ones here — clock, calendar, mail, music, bookmarks, data usage, search — and the launcher knows nothing about any of them. It knows how to host a widget, how big this one says it must be, and how to draw a frame round it. That separation is why a third party could ship one at all.</p>'
      +'<h4>All Apps</h4>'
      +'<p>'+A('drawer','Open the drawer')+'. A paged grid with an <b>Apps / Widgets</b> tab pair — the widgets moved in here, out of the long-press menu, and you place one by dragging it out. Long-press an application to drop it on the Home screen.</p>'
      +'<h4>The lock screen</h4>'
      +'<p>'+A('lock','Lock the phone')+'. Touch the padlock and the ring appears; drag it outward to unlock, or toward the camera to go straight there. <b>Notifications do not appear on the lock screen.</b> That is 5.0. Neither do widgets — 4.2.</p>'
      +'<p>Long-press an empty patch of wallpaper for the wallpaper picker, including an original live one.</p>';

    case 'shade': return '<h3>The notification shade</h3>'
      +'<p>Pull down from the status bar. Each notification carries the posting application’s icon on the left and the time on the right.</p>'
      +'<div class="pull">New in this release: <b>swipe any single notification sideways and it is gone.</b> The competing platform would not have that for years.</div>'
      +'<p>'+A('shade','Open the shade')+' and throw one away. Then '+A('sms','make a text message arrive')+' and watch it appear without interrupting anything.</p>'
      +'<h4>What is in it</h4>'
      +'<ul><li>A header with the operator and the date, a <b>settings shortcut</b>, and a <b>clear-all</b> button.</li>'
      +'<li>An <b>Ongoing</b> section — music, a download in progress, a data warning — which cannot be swiped away, because it is describing something that is still happening.</li>'
      +'<li>Progress inside a notification, which is how a download reports itself.</li></ul>'
      +'<div class="absent"><b>No quick settings tiles.</b> Not here, not in this release. Wi-Fi, Bluetooth, brightness and the rest are two releases away, in 4.2. Any Android phone of this era with toggles in the shade had them from its manufacturer, not from Google — which you can see for yourself by flipping '+A('skin','the skin')+' and pulling the shade down again.</div>'
      +'<div class="absent"><b>No lock screen notifications.</b> 5.0, three years later.</div>';

    case 'data': return '<h3>Data usage, and a limit that is not advice</h3>'
      +'<p>One of this release’s best features, and one the competing platform did not match for years. '+A('datausage','Open it')+'.</p>'
      +'<ul>'
      +'<li>A graph of <b>mobile</b> data over the billing cycle — Wi-Fi was never counted, which is the whole reason the feature worked.</li>'
      +'<li>A <b>per-application breakdown</b>, sorted, with a bar each. Touch one to restrict its background data.</li>'
      +'<li>Two draggable lines: an amber <b>warning</b> and a red <b>limit</b>.</li>'
      +'</ul>'
      +'<h4>Drag the red line down</h4>'
      +'<p>The limit is enforced. Cross it and the system turns mobile data off — and in this exhibit it really does. The Browser stops loading and says so. The Market stops downloading mid-file. Mail stops arriving. Wi-Fi keeps working, because Wi-Fi was never the problem.</p>'
      +'<p>'+A('browser','Open the Browser')+' afterwards and watch it fail, then come back and lift the line.</p>'
      +'<div class="pull">In 2011 a monthly allowance was small, a bill shock was common, and the phone in your pocket was the only thing that knew what it had spent. Putting the meter and the tap on the same screen was, quietly, one of the most practical things anyone did to a phone that year.</div>'
      +'<p>The screen also warned you, in Google’s own words, that the phone’s count and the operator’s count would not agree and you should set a conservative limit. That sentence is still on the dialog here.</p>';

    case 'face': return '<h3>Face Unlock, and the photograph</h3>'
      +'<p>New in 4.0: unlock the phone by letting it recognise your face. '+A('security','Settings › Security › Screen lock')+' to enrol, and the setup flow is worth reading, because Google wrote the warning itself.</p>'
      +'<div class="pull">“Face Unlock is less secure than a pattern or a PIN. Someone who looks similar to you could unlock your phone.” — the real setup screen, approximately, and it required a backup PIN or pattern before it would let you finish.</div>'
      +'<h4>The defeat</h4>'
      +'<p>Within days of the phone going on sale, people were opening handsets by holding up a <b>printed photograph</b> of the owner. It was on every technology site within a week of launch.</p>'
      +'<p>There is a photograph on the desk. '+A('photo','Take it out')+', hold it up, lock the phone, and watch the camera accept it.</p>'
      +'<p>This is not a bug in the simulation. It is the fact, and the exhibit labels it plainly rather than quietly making the recogniser cleverer. A liveness check — requiring a blink — arrived with <b>Jelly Bean in mid-2012</b>, after the trick was famous. It is not in 4.0, and this exhibit does not pre-empt it: the switch for it in Security does nothing and says why.</p>'
      +'<p>Worth being fair about, too: Face Unlock was never offered as security. It was offered as convenience, with a PIN compulsory behind it. The complaint is not that it was weak; it is that it was demonstrated on a stage as though it were not.</p>';

    case 'apps': return '<h3>The launch set</h3>'
      +'<p>Every one of them original work, every one rendering through the design system and the Action Bar, and none of them referencing another by name.</p>'
      +'<ul>'
      +'<li><b>Browser</b> — tabs, an incognito mode, bookmarks that sync, <b>request desktop site</b>, and <b>save for offline reading</b>. Not Chrome: Chrome for Android arrived as a <b>beta for this version in February 2012</b> and was not the default browser here. '+A('browser','Open it')+'</li>'
      +'<li><b>People</b> — the redesigned contacts, with large photographs, a <b>Me</b> profile, and social-network aggregation, which was the era’s obsession and which every platform tried for about three years.</li>'
      +'<li><b>Gmail</b> — the Action Bar, a label spinner as the title, a contextual bar for selections, and <b>swipe between conversations</b>: flick horizontally in a message to reach the next one without returning to the list.</li>'
      +'<li><b>Calendar</b> — redesigned, with day, week, month and agenda.</li>'
      +'<li><b>Talk</b> — with <b>video chat</b>. Long-press a friend.</li>'
      +'<li><b>Messaging</b>, <b>Phone</b> — tabs for dialer, favourites and the log.</li>'
      +'<li><b>Camera</b> — '+A('camera','open it')+' for zero shutter lag, continuous autofocus, face detection, panorama, 1080p video, time lapse, and the <b>live video effects</b>: face distortion and background replacement, which were absurd and which everyone tried exactly once. Turn zero shutter lag off in its settings and count the delay you used to live with.</li>'
      +'<li><b>Gallery</b> — with the <b>photo editor</b> built in: crop, rotate, exposure and filters, on the phone, with no second application and no computer.</li>'
      +'<li><b>Data usage</b> in Settings — '+X('data','its own page')+'.</li>'
      +'<li><b>Android Market</b> — '+A('market','open it')+'; still that name. '+A('rename','Advance to March 2012')+' and watch it become Google Play.</li>'
      +'<li><b>Voice typing</b> — press the microphone on the keyboard. <b>Continuous</b> transcription: the words land as they are spoken rather than in one lump at the end, which was new.</li>'
      +'<li><b>Screenshots</b> — Power + Volume Down on the drawn keys, built into the platform for the first time. It took three years.</li>'
      +'<li><b>Wi-Fi Direct</b> and the <b>accessibility</b> rebuild, including <b>explore by touch</b> — both in Settings.</li>'
      +'</ul>';

    case 'beam': return '<h3>Android Beam</h3>'
      +'<p>Hold two NFC phones back to back. Whatever is on your screen shrinks; touch it and it goes across. A web page, a contact, a place on the map, an application’s page in the shop.</p>'
      +'<p>'+A('beam','Bring out a second handset')+', then use <b>Beam</b> in the overflow menu of the Browser, People, Maps, Gallery or the Market.</p>'
      +'<p>NFC only gets the two handsets to agree; the payload itself travels over Bluetooth. That detail matters, because it is why the transfer is not limited to a few hundred bytes.</p>'
      +'<p>The competing platform had nothing comparable for another two years, and when it did, it worked only between its own devices. Beam needed two phones, which is why most people never used it, and it remains the clearest thing anyone has done with NFC on a phone.</p>'
      +'<p>The Galaxy Nexus also had a <b>barometer</b>, which was unusual. It was there to help the GPS get a fix faster, not to count stairs. The '+A('desk','desk')+' lists what else is inside.</p>';

    case 'device': return '<h3>The Galaxy Nexus</h3>'
      +'<p>The launch and reference device: <b>GSM model, 17 November 2011; LTE model, 15 December 2011</b>. '+A('model','Switch between them')+'.</p>'
      +'<ul>'
      +'<li><b>4.65 inches, 1280 × 720</b> — among the first 720p phone screens. At xhdpi that is 640 × 360 density-independent pixels, and dp is the grid the interface is actually drawn on. This exhibit draws in dp and scales by exactly two to reach the panel’s real pixels; the scale control in the rail offers Fit, ½× (one dp per screen pixel) and 1× (every device pixel).</li>'
      +'<li><b>PenTile RGBG</b> — two subpixels per pixel, green on every one, red and blue alternating. A white field is interpolated rather than painted, it was visible on fine text, and people complained, correctly. '+A('loupe','Open the loupe')+' or '+A('pentile','overlay the subpixels')+'.</li>'
      +'<li><b>No hardware buttons on the front.</b> This is the point of the device and of the release.</li>'
      +'<li>Curved “contour” cover glass; the panel underneath is flat.</li>'
      +'<li>Dual-core 1.2 GHz, <b>1 GB of RAM</b>, NFC, a barometer, a 5-megapixel rear camera, a notification light, pogo pins on the left edge for a desk dock that was hard to buy.</li>'
      +'<li><b>No microSD slot</b>, which was controversial and stayed that way. 16 GB on the GSM model, 32 GB on the LTE.</li>'
      +'</ul>'
      +'<h4>The LTE model, honestly</h4>'
      +'<p>A bigger battery than the GSM model and markedly worse endurance — the first-generation LTE radio simply ate it. And its software updates were <b>held by its carrier for months at a time</b>, so the phone sold as Google’s own reference device could be a version behind the phone in the next pocket. That is the part of this story that most undermined the idea of a reference device at all, and it belongs in the record.</p>'
      +'<h4>The price</h4>'
      +'<p>Sold through operators on contract from November 2011. In <b>April 2012 Google began selling it unlocked and direct at $399</b> — the first time it had done that, and a plain signal of where the company wanted the platform to go.</p>';

    case 'honest': return '<h3>Honest limitations</h3>'
      +'<div class="absent"><b>Adoption was slow, and that is the headline.</b> Six months after launch it was on well under a tenth of Android devices; Gingerbread was on nearly two thirds. Manufacturers and carriers took months or years to ship it, and many devices never received it at all. '+X('dashboard','The dashboard')+'.</div>'
      +'<div class="absent"><b>Face Unlock was fooled by a photograph within days.</b> Google’s own setup screen conceded it was less secure than a PIN. '+X('face','See it happen')+'.</div>'
      +'<div class="absent"><b>It still dropped frames.</b> Scrolling and transitions were smoother than Gingerbread and noticeably less smooth than the competition. The systematic fix — vsync, triple buffering, touch prediction — is Jelly Bean’s Project Butter, eight months later, and this exhibit does not pre-empt it: the stutter is modelled. '+A('jank','Turn it off and on')+' and feel the difference the wrong way round.</div>'
      +'<div class="absent"><b>The Galaxy Nexus battery life was poor</b>, badly so on the LTE model. <b>The camera was mediocre</b> for a flagship — five megapixels when eight was normal — though the zero-shutter-lag capture was genuinely ahead of everyone. <b>The PenTile screen showed its structure.</b></div>'
      +'<div class="absent"><b>Roboto was widely and publicly mocked</b> — a Frankenstein of famous typefaces, said its critics, and the phrase stuck. It was revised substantially later.</div>'
      +'<div class="absent"><b>Holo was largely ignored by manufacturers for their own applications.</b> The required theme was present on the device; the skin covered nearly everything the user actually saw. '+A('skin','The toggle')+' is that fact, made pressable.</div>'
      +'<div class="absent"><b>The LTE model’s updates were held by its carrier</b> for months at a time, which undermined the entire idea of a Google reference device.</div>'
      +'<div class="absent"><b>Not here yet:</b> no Chrome, no Google Now, no quick settings tiles, no lock-screen notifications, no lock-screen widgets, no per-permission control, no Material Design, no floating action buttons, no gesture navigation, no translucent system bars. Several of those are one release away and none of them is in this one.</div>';

    case 'right': return '<h3>What was right</h3>'
      +'<ul>'
      +'<li><b>A coherent design language</b> — the platform’s first, and one that stood apart from both alternatives of its moment: not skeuomorphic, not typographic minimalism, but something that admitted it was software.</li>'
      +'<li><b>On-screen navigation</b>, which the whole industry adopted within three years.</li>'
      +'<li><b>The Recents card stack</b>, which has survived every redesign since — and which is webOS’s idea, carried over by webOS’s designer.</li>'
      +'<li><b>Swipe-to-dismiss notifications</b> and <b>the data usage controls</b>, both years ahead of the competition.</li>'
      +'<li><b>Folders</b> and <b>resizable widgets</b>, finally.</li>'
      +'<li><b>The compatibility requirement</b>, which was the first structural attempt to give the platform a floor — imperfect, widely papered over, and still the beginning of the answer.</li>'
      +'<li><b>Zero shutter lag</b>, which made the phone camera feel like a camera.</li>'
      +'<li><b>Screenshots in the platform</b>, at last.</li>'
      +'<li>And <b>the honesty of the design itself</b>: it did not pretend to be paper, leather, linen or brushed metal. It looked like software, and it was the first mass-market mobile interface that was comfortable saying so.</li>'
      +'</ul>'
      +'<div class="pull">Two and a half years later the competitor shipped a flat redesign of its own. Whatever else is true about who copied whom, the argument that a phone interface should stop imitating objects was won here first.</div>';

    case 'easter': return '<h3>Things to try</h3>'
      +this.checklist()
      +'<h4>And a few more</h4>'
      +'<ul>'
      +'<li>'+A('shot','Power + Volume Down')+' — a screenshot, in the platform for the first time. The guide note is the point: it took three years.</li>'
      +'<li>'+A('about','About phone')+' — tap the Android version seven times, then hold what appears. The version-number Easter egg started one release before this one and has been in every release since. The creature here is an original; the real one is not ours to draw.</li>'
      +'<li>'+A('camera','A live video effect')+' — switch to the front camera, open Effects, and put yourself in space.</li>'
      +'<li>'+A('rotate','Rotate the handset')+' and watch the navigation bar move to the side.</li>'
      +'<li>'+A('rename','Advance the clock to March 2012')+' and watch Android Market become Google Play.</li>'
      +'<li>'+A('call','An incoming call')+' — the one thing that legitimately takes the whole screen.</li>'
      +'</ul>';

    case 'pair': return '<h3>Paired with the rest of the collection</h3>'
      +'<h4>Android 1.0 — T-Mobile G1 (2008)</h4>'
      +'<p>The same platform three years earlier, and the same argument from the other end. That exhibit’s thesis is that <b>the phone which lost the shop won the architecture</b>: intents, the shade, a cross-application Back stack, sync with no cable — all present in 2008, all inside something nobody would call designed. This one is that platform finally attending to the shop. The plumbing here is the same plumbing; what changed is everything you can see.</p>'
      +'<h4>Palm OS 3.5 (2000) — and the lineage</h4>'
      +'<p>Worth noting carefully: <b>the designer of webOS designed this</b>. Matias Duarte led webOS at Palm and joined Google in 2010, and the Recents card stack with swipe-to-dismiss is webOS’s card metaphor arriving on Android. It is where that idea survived after Palm did not. The Palm exhibit in this collection is the earlier company, winning by subtraction; this is a piece of its last work, outliving it.</p>'
      +'<h4>Windows 8 (2012) and Mac OS X Tiger / the flat turn</h4>'
      +'<p>Holo (2011), Windows 8’s Metro (2012) and the competitor’s own flat redesign (2013–2014) belong to one moment and can be read as a group: three attempts, within three years, to stop pretending that software is made of objects. They disagreed about almost everything else. Windows 8 bet on typography and motion; Holo bet on light and line; the third bet on translucency and depth cues without texture. Standing in front of all three is the cleanest way to see that the flat turn was an argument, not a fashion.</p>';

    case 'colophon': return '<h3>Colophon</h3>'
      +'<p>One HTML file. No network, no build step, no dependencies, no external assets. Open it from a disk and it runs.</p>'
      +'<h4>Modules, in build order</h4>'
      +'<p>The order carries the thesis: <b>1</b> the Holo design system and the Action Bar framework; <b>2</b> the theme variant layer; <b>3</b> the intent registry and activity stack; <b>4</b> the notification service; <b>5</b> the device shell; <b>6</b> the display layer; <b>7</b> the navigation bar and task model; <b>9</b> the widget framework; <b>10</b> the home screen and launcher; <b>11</b> the keyguard and Face Unlock; <b>12</b> the data usage model; <b>13</b> the applications; <b>14</b> the fragmentation dashboard; <b>15</b> the sound manager; <b>16</b> the state manager; <b>17</b> this guide.</p>'
      +'<h4>Structural self-tests</h4>'
      +'<p><b>1. Applications do not know about the theme.</b> <span id="test1">running…</span></p>'
      +'<p><b>2. No application module names another.</b> <span id="test2">running…</span></p>'
      +'<p><b>3. The theme layer really is a layer.</b> <span id="test3">running…</span> — this one measures rendered pixels: it reads the computed style of a live application’s Action Bar, list row, switch and button, swaps the variant, reads them again, and counts the properties that moved.</p>'
      +'<h4>Artwork</h4>'
      +'<p>All original, drawn in code: the handset in the idiom of the original, every application icon, every photograph, every album cover, the map of Port Ellery, the live wallpaper, the owner’s face and the printed photograph of it. No Google application icons, no Android robot, no Google or Samsung marks, no Samsung industrial design; a neutral placeholder sits wherever a logo would. Roboto is resolved locally if present and never fetched.</p>'
      +'<h4>Vocabulary</h4>'
      +'<p>Ice Cream Sandwich, Holo, the Action Bar, the overflow menu, Recents, Android Beam, Face Unlock, and Android Market until March 2012 — after which '+A('rename','the exhibit will rename it')+'. Applications and apps: by now both are current.</p>'
      +'<h4>Sound</h4>'
      +'<p>Synthesized, nothing fetched: notification pips, the unlock pair, the shutter, the keyboard tick, a ringtone, the beam sweep, and a small sequencer so that the Music application is audible. Off by default; the drawn volume keys set the level.</p>'
      +'<h4>Persistence</h4>'
      +'<p>LocalStorage: the panels, folders, widget placement and sizes, the wallpaper, installed applications, the theme toggle, the lock method and Face Unlock enrolment, data usage and its limits, mail, contacts, messages, notification state and the device model. '+A('reset','Factory data reset')+' puts it back, and asks first.</p>';
    }
    return '';
  },
  checklist(){
    const items=[
      ['swipecard','Threw a Recents card off the screen'],
      ['folder','Made a folder by dropping one icon on another'],
      ['draglimit','Dragged the data limit line'],
      ['datacut','Had mobile data cut off by your own limit'],
      ['facedefeat','Opened the phone with a photograph'],
      ['skin','Flipped the skin toggle'],
      ['dashboard','Scrubbed the version dashboard'],
      ['legacy','Saw the legacy Menu button appear'],
      ['swipedismiss','Swiped a notification away'],
      ['resize','Resized a widget'],
      ['screenshot','Took a screenshot with Power + Volume Down'],
      ['effects','Used a live video effect'],
      ['beam','Beamed something to the second handset'],
      ['egg','Found the version-number Easter egg'],
      ['gmailswipe','Swiped between two conversations in Gmail'],
      ['voice','Used continuous voice typing'],
      ['pano','Swept a panorama'],
      ['incognito','Opened an incognito tab'],
      ['rotate','Rotated the handset'],
      ['market','Watched the Market become Google Play']
    ];
    const n=items.filter(i=>this.found[i[0]]).length;
    return '<p><b>'+n+' of '+items.length+'</b> found.</p><ul>'
      +items.map(i=>'<li>'+(this.found[i[0]]?'<b style="color:var(--mus-accent2)">✓</b> ':'<span style="opacity:.45">○</span> ')
        +(this.found[i[0]]?'<b>'+esc(i[1])+'</b>':esc(i[1]))+'</li>').join('')+'</ul>';
  }
};

/* ==========================================================================
   THE MUSEUM — boot, the rail, the self-tests, the reset.
   ========================================================================== */
const Museum={
  startedAt:Date.now(),
  init(){
    State.load();
    Sys.init(); Sound.init(); ThemeLayer.init();
    Content.init(); Wallpapers.init();
    if(!State.get('seeded',false)){ Seed.run(); State.set('seeded',true); }
    Registry.defaults=State.get('intentDefaults',{});
    Device.init();
    Notif.init();
    DataUsage.init();
    Display.init(); Stack.init(); NavBar.init(); Recents.init();
    Installer.restore();
    Launcher.init(); Keyguard.init(); IME.init(); Desk.init(); Guide.init();
    if(Sys.storeName()==='Play Store') Art.ICONS['org.museum.market']=Art.ICONS['org.museum.market.play'];
    $id('acts').classList.toggle('jank',Sys.settings.jank);
    $id('pentile').classList.toggle('on',Sys.settings.pentile);
    $id('lcd').classList.toggle('bounds',Sys.settings.layoutBounds);
    this.rail();
    setInterval(()=>Widgets.tick(),20000);
    setInterval(()=>Notif.renderStatus(),30000);
    this.boot();
    this.selfTests();
    if(!State.get('welcomed')){ State.set('welcomed',true); setTimeout(()=>Guide.open('welcome'),2600); }
  },
  rail(){
    $id('btnSkin').onclick=()=>ThemeLayer.toggle();
    $id('btnRotate').onclick=()=>Device.rotate();
    $id('btnModel').onclick=()=>Device.setModel(Device.model==='gsm'?'lte':'gsm');
    $id('btnBeam').onclick=()=>{ const on=!$id('device2').classList.contains('on'); Beam.showDevice(on);
      if(on) Beam.explain(); };
    $id('btnDesk').onclick=()=>Desk.toggle();
    $id('btnSMS').onclick=()=>this.incomingText();
    $id('btnScale').onclick=()=>Display.cycleScale();
    $id('btnReset').onclick=()=>this.confirmReset();
    $id('btnSound').onclick=()=>{ Sound.set(!Sound.on); this.syncSoundBtn(); if(Sound.on) Sound.ensure(); };
    this.syncSoundBtn();
    /* keyboard shortcuts for a visitor at a desk */
    document.addEventListener('keydown',e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
      if(e.key==='Escape'){ Stack.back(); e.preventDefault(); }
      else if(e.key==='Home'||e.key==='h') Stack.home();
      else if(e.key==='r') Recents.toggle();
      else if(e.key==='s') ThemeLayer.toggle();
      else if(e.key==='g') Guide.toggle();
      else if(e.key==='n') Notif.toggleShade();
    });
  },
  syncSoundBtn(){
    const b=$id('btnSound'); if(!b) return;
    b.textContent='Sound: '+(Sound.on?'on':'off'); b.classList.toggle('on',Sound.on);
  },
  incomingText(){
    const opts=[['555-0126','Look at this: http://dailystandard.example/tech/ics — it has no buttons on the front'],
      ['555-0142','Harbour Cafe at six? geo:0,0?q=Harbour+Cafe'],
      ['555-0155','apparently a printed photo opens the face unlock. try it'],
      ['555-0107','Sunday. One o’clock. Bring the phone.'],
      ['555-0190','Desk needs the ferry pictures by four. Ring me on 555-0190.']];
    const o=pick(opts);
    Registry.broadcast('SMS_RECEIVED',{addr:o[0],text:o[1]});
  },
  boot(){
    const b=el('div'); b.id='bootscr';
    b.style.cssText='position:absolute;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;'
      +'align-items:center;justify-content:center;gap:18px;font-family:var(--roboto);cursor:pointer';
    b.innerHTML='<div style="font-size:11px;letter-spacing:.42em;color:#4a4a4a;text-transform:uppercase">starting</div>'
      +'<div style="font-size:30px;font-weight:200;letter-spacing:.16em;color:#fff">ANDROID</div>'
      +'<div style="font-size:13px;letter-spacing:.3em;color:#33b5e5">4.0</div>'
      +'<div style="width:150px;height:2px;background:#161616;overflow:hidden;border-radius:2px">'
      +'<i style="display:block;height:100%;width:38%;background:#33b5e5;animation:hindet 1.3s ease-in-out infinite"></i></div>'
      +'<div style="position:absolute;bottom:26px;font-size:10px;color:#2e2e2e;letter-spacing:.2em">ICE CREAM SANDWICH</div>';
    $id('lcd').appendChild(b);
    const done=()=>{ if(!b.isConnected) return; b.style.transition='opacity .4s'; b.style.opacity='0';
      setTimeout(()=>b.remove(),420); Keyguard.show(); };
    b.onclick=done;
    setTimeout(done,2300);
  },
  confirmReset(){
    Holo.dialog({title:'Factory data reset',
      html:'<p>This will erase all data from your phone’s internal storage, including:</p>'
        +'<ul style="margin:8px 0 0 16px;line-height:1.6"><li>Your account</li><li>System and app data and settings</li>'
        +'<li>Downloaded apps</li><li>Music, pictures and other user data</li><li>The Home screen you arranged</li></ul>'
        +'<p style="margin-top:10px;color:var(--h-fg3)">The exhibit will restart as a fresh phone.</p>',
      buttons:[{label:'Cancel'},{label:'Reset phone',on:()=>this.factoryReset()}]});
  },
  factoryReset(){
    const keep={sound:State.get('sound',false),vol:State.get('vol',0.55),scaleMode:State.get('scaleMode','fit')};
    State.eraseAll();
    State.data={sound:keep.sound,vol:keep.vol,scaleMode:keep.scaleMode};
    State.saveNow();
    const o=el('div'); o.style.cssText='position:absolute;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;'
      +'align-items:center;justify-content:center;gap:14px;color:#fff;font-family:var(--roboto)';
    o.innerHTML='<div class="h-prog"></div><div style="font-size:14px">Erasing…</div>';
    $id('lcd').appendChild(o);
    setTimeout(()=>location.reload(),1500);
  },

  /* ======================================================================
     THE SELF-TESTS. The exhibit makes three structural claims; these check
     them against the file's own source and against rendered pixels, rather
     than asking to be believed.
     ====================================================================== */
  sections(){
    const src=Array.from(document.scripts).map(s=>s.textContent).join('\n');
    const parts=src.split(/\/\* -{10} /).slice(1);
    return parts.map(p=>{
      const title=p.slice(0,p.indexOf(' -{0,}')>=0?0:p.indexOf('\n')).split(' ----------')[0].trim();
      const body=p.split(/\/\* ={10}/)[0];
      const own=[...new Set((body.match(/pkg\s*:\s*'(org\.museum\.[a-z]+)'/g)||[]).map(m=>/'([^']+)'/.exec(m)[1]))];
      const pkgm=/const PKG\s*=\s*'([^']+)'/.exec(body);
      if(pkgm&&own.indexOf(pkgm[1])<0) own.push(pkgm[1]);
      return {title,body,own,isApp:!!pkgm};
    }).filter(s=>s.isApp);
  },
  test1(){
    /* No application module knows which design system is active. */
    const banned=[[/ThemeLayer/,'names the theme layer'],
                  [/data-variant|dataset\.variant/,'reads the variant attribute'],
                  [/['"]orbit['"]/,'names a variant'],
                  [/isSkinned/,'asks whether a skin is on'],
                  [/(background|border-color)\s*:\s*#[0-9a-f]{3}/i,'sets an interface colour literally'],
                  [/[^-a-z]color\s*:\s*#[0-9a-f]{3}/i,'sets an interface colour literally']];
    const bad=[];
    this.sections().forEach(s=>{
      banned.forEach(b=>{ if(b[0].test(s.body)) bad.push(s.title+' — '+b[1]); });
    });
    const n=this.sections().length;
    return bad.length
      ? 'FAILED: '+bad.join('; ')
      : 'passed — '+n+' application modules. None names the theme layer, reads the variant, or writes an interface colour. '
        +'Where one needs a colour it asks for a role (Holo.color(\'warn\')) and the layer answers.';
  },
  test2(){
    /* No application module names another. */
    const bad=[];
    this.sections().forEach(s=>{
      const refs=[...new Set(s.body.match(/org\.museum\.[a-z]+/g)||[])].filter(r=>s.own.indexOf(r)<0);
      if(refs.length) bad.push(s.title+' → '+refs.join(', '));
    });
    return bad.length
      ? 'FAILED: '+bad.join('; ')
      : 'passed — '+this.sections().length+' application modules, none references another by name. '
        +'When two need to talk they go through the intent registry, the content providers or a broadcast, as the real system requires.';
  },
  test3(){
    /* Measure the swap. Render a real application's components in both
       variants and count the computed properties that move. */
    try{
      const probe=el('div'); probe.className='h-win'; probe.dataset.apptheme='lightdark';
      probe.style.cssText='position:absolute;left:-9999px;top:0;width:360px;height:400px;visibility:hidden';
      const ab=Holo.actionBar({title:'Probe',icon:'',actions:[{icon:'search',label:'s'}],overflow:[{label:'x'}]});
      probe.appendChild(ab.el);
      const li=Holo.listItem({title:'Row',sub:'Sub'});
      const list=Holo.list(); list.appendChild(li); probe.appendChild(list);
      const btn=Holo.button('Button',{primary:true}); probe.appendChild(btn);
      const sw=Holo.switch_(true); probe.appendChild(sw);
      const hdr=Holo.header('Header'); probe.appendChild(hdr);
      $id('lcd').appendChild(probe);
      const targets=[[ab.bar,['background-color','background-image','height','box-shadow']],
                     [ab.bar.querySelector('.h-ab-title'),['font-weight','font-size','text-shadow','color']],
                     [li,['min-height','border-bottom-color','background-image']],
                     [btn,['background-color','background-image','border-radius','text-transform','font-weight','box-shadow']],
                     [sw,['width','height','border-radius','background-color']],
                     [hdr,['color','background-color','background-image','padding-top']]];
      const read=()=>targets.map(t=>t[1].map(p=>getComputedStyle(t[0]).getPropertyValue(p)).join('|'));
      const before=this.variantSnapshot=read();
      const was=ThemeLayer.variant;
      const other=was==='holo'?'orbit':'holo';
      $id('lcd').dataset.variant=other;
      const after=read();
      $id('lcd').dataset.variant=was;
      probe.remove();
      let moved=0,total=0;
      before.forEach((b,i)=>{ const bs=b.split('|'), as=after[i].split('|');
        bs.forEach((v,j)=>{ total++; if(v!==as[j]) moved++; }); });
      return moved===total
        ? 'passed — all '+total+' measured properties changed across the swap, on a component tree built by an application and never touched by it.'
        : (moved>total*0.6
          ? 'passed — '+moved+' of '+total+' measured properties changed across the swap. '
            +'The rest are shared on purpose: both design systems agree on a few dimensions.'
          : 'FAILED: only '+moved+' of '+total+' properties changed; the variant is not reaching the components.');
    }catch(e){ return 'could not run ('+e.message+')'; }
  },
  selfTests(){
    const results={test1:this.test1(),test2:this.test2(),test3:this.test3()};
    this.results=results;
    const orig=Guide.html.bind(Guide);
    Guide.html=id=>{
      let h=orig(id);
      if(id==='colophon'){
        h=h.replace('<span id="test1">running…</span>','<span id="test1">'+esc(results.test1)+'</span>')
           .replace('<span id="test2">running…</span>','<span id="test2">'+esc(results.test2)+'</span>')
           .replace('<span id="test3">running…</span>','<span id="test3">'+esc(results.test3)+'</span>');
      }
      return h;
    };
    Object.keys(results).forEach(k=>{ if(/^FAILED/.test(results[k])) console.warn(k,results[k]); });
  }
};
document.addEventListener('DOMContentLoaded',()=>Museum.init());
</script>
</body>
