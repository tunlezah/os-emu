/* ==========================================================================
   MODULE 6 — THE DISPLAY LAYER
   --------------------------------------------------------------------------
   4.65 inches, 1280 × 720, which made this one of the first 720p phones.
   At xhdpi that is 640 × 360 density-independent pixels, and dp is the grid
   the interface is actually drawn on, so the exhibit draws in dp and scales
   by exactly two to reach the panel's real pixels. 1× shows every one of
   them and wants a tall window; Fit is the sane default.

   The panel is PenTile RGBG: two subpixels per pixel rather than three,
   with green on every pixel and red and blue alternating. It was visible on
   text and people complained, correctly. The loupe shows the layout.
   ========================================================================== */
const Display={
  scale:1, scaleMode:'fit', loupeOn:false,
  init(){
    this.scaleMode=State.get('scaleMode','fit');
    window.addEventListener('resize',()=>this.fit());
    this.fit();
    const lp=$id('loupe');
    $id('panel').addEventListener('pointermove',e=>{ if(this.loupeOn) this.drawLoupe(e); });
  },
  fit(){
    const room=$id('room');
    const stage=$id('stage');
    const w=$id('device').offsetWidth||820, h=$id('device').offsetHeight||1450;
    const extra=$id('device2').classList.contains('on')?310:0;
    const aw=room.clientWidth-40, ah=room.clientHeight-30;
    let s;
    if(this.scaleMode==='fit') s=Math.min(aw/(w+extra),ah/h);
    else if(this.scaleMode==='1') s=1;
    else if(this.scaleMode==='0.5') s=0.5;
    else s=Math.min(aw/(w+extra),ah/h);
    this.scale=clamp(s,0.14,2);
    stage.style.setProperty('--s',this.scale);
    const devPx=(this.scale*2).toFixed(2);
    $id('scalenote').innerHTML='1280 × 720 · 4.65&Prime; · xhdpi (320 dpi) · 640 × 360 dp<br>'
      +'1 device pixel = '+devPx+' screen pixels'+(Math.abs(this.scale-0.5)<0.001?' — one for one':'')
      +'<br>PenTile RGBG — press the loupe in the guide';
    const b=$id('btnScale'); if(b) b.textContent='Scale: '+(this.scaleMode==='fit'?'fit':this.scaleMode+'×');
  },
  cycleScale(){
    const modes=['fit','0.5','1'];
    this.scaleMode=modes[(modes.indexOf(this.scaleMode)+1)%modes.length];
    State.set('scaleMode',this.scaleMode); this.fit();
    if(this.scaleMode==='1') MToast.show('<b>1×.</b> Every one of the panel’s 1280 × 720 pixels, one for one with your own screen. You will need a tall window; that is what a 720p phone in 2011 asked of a 2011 desktop.');
    if(this.scaleMode==='0.5') MToast.show('<b>0.5×.</b> One density-independent pixel per screen pixel — the grid the interface is authored on, and the reason the same layout fitted a 320 × 480 phone and this one.');
  },
  toggleLoupe(){
    this.loupeOn=!this.loupeOn;
    $id('loupe').classList.toggle('on',this.loupeOn);
    $id('pentile').classList.toggle('on',this.loupeOn&&Sys.settings.pentile);
    if(this.loupeOn){ this.drawLoupe(); MToast.show('<b>The loupe.</b> Move the pointer over the screen. The panel is PenTile RGBG — green on every pixel, red and blue alternating — so a white line is not a row of whole pixels, and at arm’s length fine text showed it.','device'); }
  },
  drawLoupe(e){
    const lp=$id('loupe'), cv=lp.querySelector('canvas'), g=cv.getContext('2d');
    g.clearRect(0,0,120,120);
    /* draw the RGBG stripe pattern the panel actually used, magnified */
    const px=10;
    for(let y=0;y<12;y++) for(let x=0;x<12;x++){
      const even=(x+y)%2===0;
      g.fillStyle='#0a0a0a'; g.fillRect(x*px,y*px,px,px);
      g.fillStyle='#22cc22'; g.fillRect(x*px+px*0.52,y*px+1,px*0.4,px-2);
      g.fillStyle=even?'#dd2222':'#2244dd'; g.fillRect(x*px+px*0.08,y*px+1,px*0.4,px-2);
    }
    lp.querySelector('p').innerHTML='PenTile RGBG — two subpixels per pixel.<br>'
      +'Green on every one, red and blue alternating.<br>A white field is interpolated, not painted.<br>'
      +'<span style="color:#9aa3ad">Reviewers noticed. People complained. Both were right.</span>';
  }
};

/* ==========================================================================
   THE SOFT KEYBOARD — an input method, hosted by the system.
   4.0 improved the keyboard and the spell-checker and added continuous
   voice typing: press the microphone and speak, and the words appear as
   you go rather than after you stop, which was new.
   ========================================================================== */
const IME={
  target:null, shift:true, sym:false, open:false, rec:false,
  ROWS:[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['@shift','z','x','c','v','b','n','m','@del'],['@sym','@mic',' ','.','@go']],
  SYMS:[['1','2','3','4','5','6','7','8','9','0'],['-','/',':',';','(',')','$','&','@','"'],['@sym2',',','?','!','\'','+','=','#','@del'],['@abc','@mic',' ','.','@go']],
  DICT:['the','and','you','that','have','for','not','with','this','but','they','phone','android','sandwich','museum',
        'meeting','tomorrow','thanks','tonight','ferry','harbour','recieve','definately','tommorow','seperate'],
  MISSPELLED:{recieve:'receive',definately:'definitely',tommorow:'tomorrow',seperate:'separate',adress:'address',occured:'occurred'},
  init(){ this.render(); },
  attach(input){
    this.target=input; this.show();
    input.addEventListener('blur',()=>{ setTimeout(()=>{ if(document.activeElement!==input) this.hide(); },120); },{once:true});
  },
  show(){ $id('ime').classList.add('on'); this.open=true; this.render(); },
  hide(){ $id('ime').classList.remove('on'); this.open=false; this.target=null; },
  render(){
    const k=$id('ime');
    const rows=this.sym?this.SYMS:this.ROWS;
    let h='<div class="sugg"></div>';
    rows.forEach(r=>{
      h+='<div class="krow">';
      r.forEach(key=>{
        if(key==='@shift') h+='<div class="k wide fn" data-k="@shift">'+(this.shift?'⬆':'⇧')+'</div>';
        else if(key==='@del') h+='<div class="k wide fn" data-k="@del">⌫</div>';
        else if(key==='@sym') h+='<div class="k wide fn" data-k="@sym">?123</div>';
        else if(key==='@sym2') h+='<div class="k wide fn" data-k="@sym2">=\\&lt;</div>';
        else if(key==='@abc') h+='<div class="k wide fn" data-k="@abc">ABC</div>';
        else if(key==='@mic') h+='<div class="k fn mic" data-k="@mic">'+ic('mic')+'</div>';
        else if(key==='@go') h+='<div class="k wide fn" data-k="@go">↵</div>';
        else if(key===' ') h+='<div class="k space" data-k=" "></div>';
        else { const disp=this.shift&&!this.sym?key.toUpperCase():key;
          h+='<div class="k" data-k="'+esc(key)+'"><span>'+esc(disp)+'</span><span class="kpop">'+esc(disp)+'</span></div>'; }
      });
      h+='</div>';
    });
    h+='<div class="voice"><div class="mic">'+ic('mic')+'</div><div class="vt">Speak now</div><div class="vt" id="vtext" style="color:#fff;font-size:15px;min-height:20px;padding:0 20px;text-align:center"></div></div>';
    k.innerHTML=h;
    $$('.k',k).forEach(b=>{
      b.addEventListener('pointerdown',()=>{ b.classList.add('down'); Sound.click(); });
      ['pointerup','pointerleave','pointercancel'].forEach(e=>b.addEventListener(e,()=>b.classList.remove('down')));
      b.addEventListener('click',()=>this.key(b.dataset.k));
    });
    this.suggest();
  },
  key(k){
    const t=this.target; if(!t) return;
    if(k==='@shift'){ this.shift=!this.shift; this.render(); return; }
    if(k==='@sym'){ this.sym=true; this.render(); return; }
    if(k==='@sym2'){ this.render(); return; }
    if(k==='@abc'){ this.sym=false; this.render(); return; }
    if(k==='@mic'){ this.voice(); return; }
    if(k==='@del'){ t.value=t.value.slice(0,-1); t.dispatchEvent(new Event('input',{bubbles:true})); this.suggest(); return; }
    if(k==='@go'){ t.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true})); return; }
    let ch=k;
    if(this.shift&&!this.sym){ ch=k.toUpperCase(); this.shift=false; this.render(); }
    t.value+=ch; t.dispatchEvent(new Event('input',{bubbles:true}));
    this.suggest();
  },
  suggest(){
    const s=$id('ime').querySelector('.sugg'); if(!s) return;
    const t=this.target;
    const word=t?(t.value.split(/\s/).pop()||''):'';
    let opts=[];
    if(word.length>1){
      const fix=this.MISSPELLED[word.toLowerCase()];
      if(fix) opts=[word,fix,''];
      else opts=this.DICT.filter(w=>w.startsWith(word.toLowerCase())).slice(0,3);
    }
    if(!opts.length) opts=['I','The','We'];
    s.innerHTML=opts.filter(Boolean).map((w,i)=>'<div class="'+(i===1&&this.MISSPELLED[word.toLowerCase()]?'best':'')+'">'+esc(w)+'</div>').join('');
    $$('div',s).forEach(d=>d.onclick=()=>{
      if(!this.target) return;
      const parts=this.target.value.split(/(\s)/);
      parts[parts.length-1]=d.textContent;
      this.target.value=parts.join('')+' ';
      this.target.dispatchEvent(new Event('input',{bubbles:true})); this.suggest();
    });
  },
  voice(){
    const v=$id('ime').querySelector('.voice');
    v.classList.add('on'); this.rec=true;
    Sound.tone(880,0.1,'sine',0.12);
    const phrase=pick(['meeting moved to four o\'clock','on the ferry now see you at six',
      'ice cream sandwich is the one with the blue lines','bring the charger, this thing is empty again',
      'tell them the pictures are on the phone']);
    const words=phrase.split(' ');
    const out=$id('vtext'); out.textContent='';
    let i=0;
    const tick=()=>{
      if(!this.rec) return;
      out.textContent+=(i?' ':'')+words[i];
      /* continuous transcription: the words land as they are spoken, not in
         one lump at the end. That was the new part. */
      if(this.target){ this.target.value=(this.target.value?this.target.value.replace(/\s+$/,'')+' ':'')+words[i];
        this.target.dispatchEvent(new Event('input',{bubbles:true})); }
      i++;
      if(i<words.length) setTimeout(tick,330);
      else setTimeout(()=>{ v.classList.remove('on'); this.rec=false; Guide.mark('voice');
        MToast.show('<b>Voice typing, continuously.</b> Before 4.0 the recogniser waited for you to stop and then produced a block. This one streams, and you can watch it change its mind mid-sentence.','apps'); },500);
    };
    setTimeout(tick,420);
    v.onclick=()=>{ this.rec=false; v.classList.remove('on'); };
  },
  spellHtml(text){
    if(!Sys.settings.spell) return esc(text);
    return esc(text).split(/(\s+)/).map(w=>{
      const bare=w.replace(/[^a-z']/gi,'').toLowerCase();
      return this.MISSPELLED[bare]?'<span class="spellerr">'+w+'</span>':w;
    }).join('');
  }
};

/* ==========================================================================
   MODULE 11 — THE KEYGUARD, AND FACE UNLOCK
   --------------------------------------------------------------------------
   The lock screen ring: touch the padlock, the ring appears, drag outward
   to unlock or toward the camera to go straight to it. Notifications do not
   appear here — that is three years away — and neither do widgets.

   Face Unlock is new in this release and is the exhibit's most useful piece
   of honesty. Google's own setup screen conceded, in writing, that it was
   less secure than a pattern or a PIN, and required one as a fallback.
   Within days of launch people were opening phones by holding up a
   photograph of the owner. There is a printed photograph on the desk.
   ========================================================================== */
const Keyguard={
  locked:false, method:'slide', pinBuf:'', faceEnrolled:false, patternBuf:[],
  init(){
    this.method=State.get('lockMethod','slide');
    this.faceEnrolled=State.get('faceEnrolled',false);
    this.el=$id('keyguard');
    this.lock(true);
  },
  lock(silent){
    this.locked=true; this.el.classList.add('on'); this.render();
    if(!silent) Sound.lock();
    Notif.closeShade(); Recents.hide(); Holo.closePopup();
  },
  show(){ if(this.locked){ this.el.classList.add('on'); this.render(); } },
  unlock(){
    this.locked=false; this.el.classList.remove('on','facing','pin','pattern');
    Sound.unlock(); Notif.renderStatus();
    Guide.mark('unlock');
  },
  render(){
    const k=this.el;
    k.className='on';
    const owner=Content.owner();
    const cp=fmtClockParts(new Date());
    k.innerHTML='<div class="kwall"></div>'
      +'<div class="kclock"><div class="t">'+esc(cp.t)+(cp.ap?'<b> '+cp.ap+'</b>':'')+'</div>'
      +'<div class="d">'+esc(fmtDate(Date.now()))+'</div>'
      +'<div class="c">'+esc(Sys.carrier())+'</div></div>'
      +'<div class="kface"><div class="fview"><canvas width="176" height="176"></canvas><div class="fstat">Looking for your face…</div></div></div>'
      +'<div class="kring"><div class="ringbg"></div>'
      +'<div class="ktarget left">'+ic('unlock')+'</div>'
      +'<div class="ktarget right">'+ic('camera')+'</div>'
      +'<div class="knob">'+ic('lock')+'</div></div>'
      +'<div class="khint"></div>'
      +'<div class="kowner">'+esc(owner.name)+' · '+esc(owner.email)+'</div>'
      +'<div class="kpin"><div style="color:#fff;font-size:14px" id="pinmsg">Enter PIN</div>'
      +'<div class="dots"><i></i><i></i><i></i><i></i></div>'
      +'<div class="pad"></div></div>';
    /* the wallpaper behind the lock screen is the home wallpaper, blurred */
    const w=k.querySelector('.kwall');
    w.appendChild(Wallpapers.still());
    const hint=k.querySelector('.khint');
    hint.textContent=this.method==='slide'?'Drag the padlock to unlock, or to the camera':
      this.method==='face'?'Face Unlock — less secure than a PIN':'Drag outward, then enter your '+(this.method==='pin'?'PIN':'pattern');
    this.bindRing();
    const pad=k.querySelector('.pad');
    ['1','2','3','4','5','6','7','8','9','←','0','OK'].forEach(d=>{
      const b=el('button',null,d); b.onclick=()=>this.pinKey(d); pad.appendChild(b);
    });
    if(this.method==='face'&&this.faceEnrolled) this.startFace();
  },
  bindRing(){
    const ring=this.el.querySelector('.kring'), knob=this.el.querySelector('.knob');
    const tl=this.el.querySelector('.ktarget.left'), tr=this.el.querySelector('.ktarget.right');
    let hot=null;
    onDrag(knob,{
      start:()=>{ ring.classList.add('active'); },
      move:({dx,dy})=>{
        const x=dx/dpScale(), y=dy/dpScale();
        knob.style.transform='translate('+x+'px,'+y+'px)';
        const d=Math.hypot(x,y);
        hot=null;
        if(x<-40&&Math.abs(y-72)<90) hot='unlock';
        else if(x>40&&Math.abs(y-72)<90) hot='camera';
        else if(d>76) hot='unlock';
        tl.classList.toggle('hot',hot==='unlock'); tr.classList.toggle('hot',hot==='camera');
      },
      end:()=>{
        knob.style.transition='transform .18s'; knob.style.transform='';
        setTimeout(()=>knob.style.transition='',200);
        ring.classList.remove('active'); tl.classList.remove('hot'); tr.classList.remove('hot');
        if(hot==='camera'){ this.afterUnlock({action:'MAIN',component:'org.museum.camera/Main'}); }
        else if(hot==='unlock'){ this.afterUnlock(null); }
        hot=null;
      }});
  },
  afterUnlock(intent){
    if(this.method==='pin'||this.method==='pattern'||(this.method==='face'&&this.faceEnrolled&&!this._faceOk)){
      if(this.method==='face'){ Holo.toast('Face not recognised — use your backup PIN'); }
      this.el.classList.add('pin'); this.pinBuf=''; this.updateDots(); this._pending=intent||null; return;
    }
    this.unlock();
    if(intent) setTimeout(()=>Intents.start(intent),140);
  },
  pinKey(d){
    Sound.click();
    if(d==='←'){ this.pinBuf=this.pinBuf.slice(0,-1); this.updateDots(); return; }
    if(d==='OK'){ this.checkPin(); return; }
    if(this.pinBuf.length>=4) return;
    this.pinBuf+=d; this.updateDots();
    if(this.pinBuf.length===4) setTimeout(()=>this.checkPin(),160);
  },
  updateDots(){ $$('.kpin .dots i',this.el).forEach((n,i)=>n.classList.toggle('on',i<this.pinBuf.length)); },
  checkPin(){
    if(this.pinBuf===State.get('pin','1024')){
      const p=this._pending; this._pending=null; this.unlock();
      if(p) setTimeout(()=>Intents.start(p),140);
    } else {
      $id('pinmsg').textContent='Wrong PIN. Try again.'; Sound.err(); this.pinBuf=''; this.updateDots();
    }
  },

  /* ---- Face Unlock ---- */
  startFace(){
    this.el.classList.add('facing');
    this._faceOk=false;
    const cv=this.el.querySelector('.kface canvas'), st=this.el.querySelector('.fstat'), fv=this.el.querySelector('.fview');
    let t=0, found=0;
    clearInterval(this._faceT);
    this._faceT=setInterval(()=>{
      t++;
      const photo=Desk.photoHeld;
      const g=cv.getContext('2d');
      const src=Art.ownerFace(176,176,{paper:photo,tilt:photo?0.02:Math.sin(t/7)*0.045,gaze:photo?0:Math.sin(t/5)});
      g.clearRect(0,0,176,176); g.drawImage(src,0,0);
      /* the recogniser: it is looking at a flat image of a face and it
         cannot tell whether the face is attached to anybody. */
      if(t>6){
        found++;
        if(found>4&&!this._faceOk){
          this._faceOk=true;
          fv.classList.add('match'); st.textContent=photo?'Recognised':'Recognised';
          Sound.unlock();
          clearInterval(this._faceT);
          setTimeout(()=>{
            this.unlock();
            if(photo){
              Guide.mark('facedefeat');
              MToast.show('<b>The photograph opened the phone.</b> This happened within days of launch, to real handsets, and Google\u2019s own setup screen had already conceded that Face Unlock was less secure than a pattern or a PIN. It is not a bug in this simulation; it is the fact.','facelimit');
            } else Guide.mark('face');
          },520);
        } else if(!this._faceOk) st.textContent='Hold still…';
      }
    },110);
  },
  stopFace(){ clearInterval(this._faceT); this.el.classList.remove('facing'); },

  setMethod(m){
    this.method=m; State.set('lockMethod',m);
    if(m!=='face') { this.faceEnrolled=false; State.set('faceEnrolled',false); }
  },
  enrolFace(done){
    /* the setup flow, including the sentence Google wrote itself */
    const body=el('div');
    body.style.cssText='display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0';
    const box=el('div'); box.style.cssText='width:180px;height:180px;border-radius:50%;overflow:hidden;border:3px solid var(--h-accent);position:relative';
    const cv=el('canvas'); cv.width=180; cv.height=180; cv.style.cssText='width:100%;height:100%;display:block';
    box.appendChild(cv); body.appendChild(box);
    const msg=el('div','h-body','Position your face inside the circle.'); msg.style.textAlign='center'; body.appendChild(msg);
    const bar=Holo.progressBar({value:0}); bar.style.width='180px'; body.appendChild(bar);
    const d=Holo.dialog({title:'Set up Face Unlock',bodyNode:body,cancelable:false,buttons:[{label:'Cancel',on:()=>{ clearInterval(iv); }}]});
    let t=0;
    const iv=setInterval(()=>{
      t++;
      const g=cv.getContext('2d');
      g.drawImage(Art.ownerFace(180,180,{tilt:Math.sin(t/6)*0.05,gaze:Math.sin(t/4)}),0,0);
      bar.setValue(t/26);
      if(t===8) msg.textContent='Keep your face in the circle…';
      if(t>=26){
        clearInterval(iv); d.close();
        this.faceEnrolled=true; State.set('faceEnrolled',true); this.setMethod('face');
        Holo.dialog({title:'Face Unlock is less secure',
          html:'<p>Someone who looks similar to you could unlock your phone.</p>'
            +'<p style="margin-top:10px;color:var(--h-fg3)">You must also set a backup PIN or pattern. This warning is close to what Google put on the real screen, and the record is that the method was defeated by a printed photograph within days of the phone going on sale.</p>',
          buttons:[{label:'Set backup PIN',on:()=>{ Holo.toast('Backup PIN is 1024'); State.set('pin','1024'); done&&done(); }}],cancelable:false});
        Guide.mark('faceenrol');
      }
    },100);
  }
};

/* ==========================================================================
   CONTENT PROVIDERS — the shared data every application reads through.
   No application talks to another; they talk to these. Contacts, messages,
   mail, the calendar, the pictures, the music, the bookmarks and the
   catalogue all live here, and all of it persists.
   ========================================================================== */
const Content={
  data:{},
  COLS:['contacts','messages','mail','events','images','audio','bookmarks','history','market','downloads','notes'],
  init(){
    this.data=State.get('content',null)||this.empty();
    this.COLS.forEach(c=>{ if(!this.data[c]) this.data[c]=[]; });
  },
  empty(){ const o={}; this.COLS.forEach(c=>o[c]=[]); return o; },
  save(){ State.set('content',this.data); },
  all(c){ return this.data[c]||[]; },
  query(c,fn){ return (this.data[c]||[]).filter(fn||(()=>true)); },
  find(c,id){ return (this.data[c]||[]).find(x=>x.id===id); },
  add(c,o){ o.id=o.id||uid(c); (this.data[c]=this.data[c]||[]).unshift(o); this.save(); return o; },
  update(c,id,patch){ const o=this.find(c,id); if(o){ Object.assign(o,patch); this.save(); } return o; },
  remove(c,id){ const a=this.data[c]||[]; const i=a.findIndex(x=>x.id===id); if(i>=0){ a.splice(i,1); this.save(); } },
  owner(){ return State.get('owner',{name:'Ada Whitlock',email:'ada.whitlock@example.org',phone:'555-0134'}); },
  threads(){
    const by={};
    this.all('messages').forEach(m=>{ (by[m.addr]=by[m.addr]||[]).push(m); });
    return Object.keys(by).map(a=>{
      const ms=by[a].sort((x,y)=>x.when-y.when);
      const c=this.all('contacts').find(c=>c.phones&&c.phones.some(p=>p.num===a));
      return {addr:a,name:c?c.name:a,contact:c,msgs:ms,last:ms[ms.length-1],
        unread:ms.filter(m=>m.incoming&&!m.read).length};
    }).sort((x,y)=>y.last.when-x.last.when);
  }
};

/* ---- wallpapers, one of them alive ---- */
const Wallpapers={
  list:[
    {id:'filament',name:'Filament',live:true},
    {id:'deepwater',name:'Deep Water',live:false},
    {id:'grid',name:'Blue Grid',live:false},
    {id:'dusk',name:'Dusk Ridge',live:false},
    {id:'paper',name:'Grey Card',live:false}
  ],
  current:'filament', _raf:null, _cv:null,
  init(){ this.current=State.get('wallpaper','filament'); },
  set(id){ this.current=id; State.set('wallpaper',id); this.mount($id('wallpaper')); },
  mount(host){
    if(!host) return;
    cancelAnimationFrame(this._raf); host.innerHTML='';
    const w=this.list.find(x=>x.id===this.current)||this.list[0];
    if(w.live) this.live(host); else host.appendChild(this.still());
  },
  still(){
    const d=el('div','wpstill');
    const id=this.current, w=this.list.find(x=>x.id===id)||this.list[1];
    if(id==='deepwater') d.style.background='radial-gradient(ellipse 120% 90% at 50% 0%, #0a4a6e 0%, #05253a 45%, #020a12 100%)';
    else if(id==='grid') d.style.cssText+=';background:#05121a;background-image:linear-gradient(rgba(51,181,229,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(51,181,229,.18) 1px,transparent 1px),radial-gradient(ellipse 80% 60% at 50% 30%,rgba(51,181,229,.2),transparent 70%);background-size:34px 34px,34px 34px,100% 100%';
    else if(id==='dusk') d.style.background='linear-gradient(#1b1030 0%,#4a2350 34%,#a8522f 62%,#1a1418 63%,#0a0a10 100%)';
    else if(id==='paper') d.style.background='linear-gradient(160deg,#3a3f46,#22262b)';
    else d.style.background='#05121a';
    return d;
  },
  live(host){
    const cv=document.createElement('canvas'); host.appendChild(cv); this._cv=cv;
    const fit=()=>{ cv.width=host.clientWidth||480; cv.height=host.clientHeight||640; };
    fit();
    const g=cv.getContext('2d');
    const N=26, parts=[];
    for(let i=0;i<N;i++) parts.push({x:Math.random(),y:Math.random(),v:0.00016+Math.random()*0.0006,
      a:Math.random()*6.28,len:0.08+Math.random()*0.22,hue:186+Math.random()*26,w:0.6+Math.random()*1.8});
    let t=0;
    const draw=()=>{
      t++;
      if(cv.width!==host.clientWidth||cv.height!==host.clientHeight) fit();
      const W=cv.width,H=cv.height;
      g.fillStyle='#03070c'; g.fillRect(0,0,W,H);
      const gr=g.createRadialGradient(W*0.5,H*0.18,10,W*0.5,H*0.5,W*1.1);
      gr.addColorStop(0,'rgba(20,70,100,.5)'); gr.addColorStop(1,'rgba(2,6,12,0)');
      g.fillStyle=gr; g.fillRect(0,0,W,H);
      parts.forEach(p=>{
        p.a+=Math.sin((t+p.hue)/220)*0.006;
        p.x+=Math.cos(p.a)*p.v; p.y+=Math.sin(p.a)*p.v*1.4;
        if(p.x<-0.2)p.x=1.2; if(p.x>1.2)p.x=-0.2; if(p.y<-0.2)p.y=1.2; if(p.y>1.2)p.y=-0.2;
        const x=p.x*W,y=p.y*H, ex=x+Math.cos(p.a)*p.len*W, ey=y+Math.sin(p.a)*p.len*H;
        const lg=g.createLinearGradient(x,y,ex,ey);
        lg.addColorStop(0,'hsla('+p.hue+',90%,62%,0)');
        lg.addColorStop(0.5,'hsla('+p.hue+',90%,62%,'+(0.34+0.2*Math.sin(t/60+p.a))+')');
        lg.addColorStop(1,'hsla('+p.hue+',90%,70%,0)');
        g.strokeStyle=lg; g.lineWidth=p.w; g.beginPath(); g.moveTo(x,y); g.lineTo(ex,ey); g.stroke();
      });
      this._raf=requestAnimationFrame(draw);
    };
    draw();
  }
};

/* ---- the installer: applications added from the Market ---- */
const Installer={
  hidden:{},
  restore(){
    const inst=State.get('installed',[]);

    const iv=setInterval(()=>{
      p+=0.12+Math.random()*0.1;

/* ==========================================================================
   MODULE 10 — THE HOME SCREEN AND LAUNCHER
   MODULE 9 — THE WIDGET FRAMEWORK (hosted here, and generic: the launcher
   knows nothing about any particular widget)
   --------------------------------------------------------------------------
   Five panels over a wallpaper, a favourites tray along the bottom with the
   All Apps button in its centre, and two things that arrived three years
   late and were very welcome: FOLDERS, made by dragging one icon onto
   another, and RESIZABLE WIDGETS, which you get by long-pressing a widget
   and dragging the handles.

   All Apps is a paged grid with an Apps / Widgets tab pair, and a widget is
   placed by dragging it out of that drawer onto a panel.
   ========================================================================== */
const Launcher={
  COLS:4, ROWS:5, page:0, ready:false, drag:null, resizeSel:null,
  home:null,
  init(){
    this.home=State.get('home',null)||this.defaultHome();
    this.build(); this.ready=true;
  },
  defaultHome(){
    const p=[[],[],[],[],[]];
    p[2]=[ {t:'app',pkg:'org.museum.people',c:0,r:0},
           {t:'app',pkg:'org.museum.calendar',c:1,r:0},
           {t:'app',pkg:'org.museum.camera',c:2,r:0},
           {t:'app',pkg:'org.museum.gallery',c:3,r:0},
           {t:'widget',w:'clock',c:0,r:1,cw:4,ch:2},
           {t:'widget',w:'calendar',c:0,r:3,cw:4,ch:2} ];
    p[1]=[ {t:'widget',w:'gmail',c:0,r:0,cw:4,ch:3},
           {t:'app',pkg:'org.museum.market',c:0,r:3},
           {t:'app',pkg:'org.museum.settings',c:1,r:3},
           {t:'app',pkg:'org.museum.clock',c:2,r:3},
           {t:'app',pkg:'org.museum.calculator',c:3,r:3} ];
    p[3]=[ {t:'widget',w:'music',c:0,r:0,cw:4,ch:2},
           {t:'widget',w:'data',c:0,r:2,cw:2,ch:2},
           {t:'app',pkg:'org.museum.maps',c:2,r:2},
           {t:'app',pkg:'org.museum.talk',c:3,r:2},
           {t:'app',pkg:'org.museum.ledger',c:2,r:3},
           {t:'app',pkg:'org.museum.transit',c:3,r:3} ];
    p[0]=[ {t:'widget',w:'bookmarks',c:0,r:0,cw:4,ch:3} ];
    p[4]=[];
    return {panels:p,tray:['org.museum.phone','org.museum.people','org.museum.messaging','org.museum.browser'],page:2};
  },
  save(){ State.set('home',this.home); },

  build(){
    const h=$id('home');
    h.innerHTML='<div id="wallpaper"></div><div id="panels"></div><div id="pageind"></div>'
      +'<div id="tray"></div><div id="homebar"></div><div id="dragghost"></div><div id="droptarget"></div>';
    Wallpapers.mount($id('wallpaper'));
    const ps=$id('panels');
    this.home.panels.forEach((_,i)=>ps.appendChild(el('div','panel')));
    this.page=this.home.page||2;
    this.renderPanels(); this.renderTray(); this.renderInd();
    this.bindSwipe();
    this.goto(this.page,true);
    AllApps.init(); Folder.init();
    const hb=$id('homebar');
    hb.innerHTML='<div class="ht" data-k="remove">'+ic('close')+'<span>Remove</span></div>'
      +'<div class="ht" data-k="info">'+ic('info')+'<span>App info</span></div>';
  },
  relayout(){ this.renderPanels(); this.renderTray(); this.goto(this.page,true); },
  themeChanged(){ this.renderPanels(); this.renderTray(); },
  resume(){ this.renderPanels(); },
  cellW(){ return $id('panels').clientWidth/this.COLS; },
  cellH(){ const ph=$id('panels').clientHeight; return ph/this.ROWS; },

  renderPanels(){
    const ps=$$('.panel',$id('panels'));
    ps.forEach((p,i)=>{
      p.innerHTML='';
      (this.home.panels[i]||[]).forEach(item=>p.appendChild(this.node(item,i)));
    });
    /* widgets size themselves from their own box, which has no height until
       the panel is laid out, so give them one frame and re-draw */
    requestAnimationFrame(()=>Widgets.tick());
  },
  node(item,pi){
    const cw=this.cellW(), ch=this.cellH();
    if(item.t==='widget'){
      const w=Widgets.create(item.w,item);
      w.style.left=(item.c*cw+4)+'px'; w.style.top=(item.r*ch+4)+'px';
      w.style.width=(item.cw*cw-8)+'px'; w.style.height=(item.ch*ch-8)+'px';
      w._item=item; w._panel=pi;
      Holo.longPress(w,()=>this.pickUp(w,item,pi,true));
      return w;
    }
    const c=el('div','cell');
    c.style.left=(item.c*cw)+'px'; c.style.top=(item.r*ch)+'px';
    c.style.width=cw+'px'; c.style.height=ch+'px';
    const ico=el('div','icoWrap');
    if(item.t==='folder'){
      const f=el('div','folderIco');
      (item.items||[]).slice(0,4).forEach(p=>{ const m=el('div'); m.innerHTML=Art.appIcon(p,16); f.appendChild(m); });
      ico.appendChild(f); ico.style.background='none'; ico.style.border='0';
    } else ico.innerHTML=Art.appIcon(item.pkg,48);
    c.appendChild(ico);
    const badge=this.badgeFor(item);
    if(badge) ico.appendChild(el('div','badge',String(badge)));
    c.appendChild(el('div','lbl',esc(this.labelFor(item))));
    c._item=item; c._panel=pi;
    c.onclick=()=>{ if(this.drag) return; this.open(item,c); };
    Holo.longPress(c,()=>this.pickUp(c,item,pi));
    return c;
  },
  labelFor(item){
    if(item.t==='folder') return item.name||'Folder';
    const p=Registry.pkg(item.pkg); return p?p.label:'—';
  },
  badgeFor(item){
    if(item.t!=='app') return 0;
    /* an unread count, drawn by the launcher from the content providers.
       Stock Android had no badges; a manufacturer skin usually did, so this
       is one more thing the variant decides rather than the application. */
    if(ThemeLayer.variant!=='orbit') return 0;
    if(item.pkg==='org.museum.messaging') return Content.threads().reduce((n,t)=>n+t.unread,0);
    if(item.pkg==='org.museum.gmail') return Content.query('mail',m=>!m.read&&m.box==='inbox').length;
    return 0;
  },
  open(item,node){
    if(item.t==='folder'){ Folder.show(item,node); return; }
    Sound.click();
    Intents.start({action:'MAIN',component:item.pkg+'/Main'});
  },

  renderTray(){
    const t=$id('tray'); t.innerHTML='';
    const half=Math.ceil(this.home.tray.length/2);
    this.home.tray.forEach((pkg,i)=>{
      if(i===half){ const b=el('div'); b.id='allappsbtn'; b.innerHTML=this.allAppsGlyph(); b.onclick=()=>AllApps.show(); t.appendChild(b); }
      const c=el('div','cell');
      const ico=el('div','icoWrap'); ico.innerHTML=Art.appIcon(pkg,48); c.appendChild(ico);
      c.appendChild(el('div','lbl'));
      c.onclick=()=>Intents.start({action:'MAIN',component:pkg+'/Main'});
      c.title=(Registry.pkg(pkg)||{}).label||'';
      t.appendChild(c);
    });
    if(this.home.tray.length<half*2){ const b=el('div'); b.id='allappsbtn'; b.innerHTML=this.allAppsGlyph(); b.onclick=()=>AllApps.show(); t.appendChild(b); }
  },
  allAppsGlyph(){
    const col=ThemeLayer.variant==='orbit'?'#ffffff':'#ffffff';
    let g='';
    for(let y=0;y<4;y++) for(let x=0;x<4;x++) g+='<rect x="'+(6+x*9)+'" y="'+(6+y*9)+'" width="6" height="6" rx="1"/>';
    return '<svg viewBox="0 0 48 48" width="48" height="48" fill="'+col+'" style="display:block">'+g+'</svg>';
  },
  renderInd(){
    const pi=$id('pageind'); pi.innerHTML='';
    this.home.panels.forEach((_,i)=>{ const d=el('i'); if(i===this.page) d.classList.add('on'); pi.appendChild(d); });
  },
  goto(i,instant){
    this.page=clamp(i,0,this.home.panels.length-1);
    this.home.page=this.page; this.save();
    const ps=$id('panels');
    ps.style.transition=instant?'none':'transform .28s cubic-bezier(.25,.8,.3,1)';
    ps.style.transform='translateX('+(-this.page*100)+'%)';
    /* the wallpaper travels more slowly than the panels — the parallax that
       made five panels feel like one continuous surface */
    const wp=$id('wallpaper');
    const span=this.home.panels.length-1;
    wp.style.transition=instant?'none':'transform .28s cubic-bezier(.25,.8,.3,1)';
    wp.style.transform='translateX('+(-(this.page/Math.max(1,span))*60+30)+'px)';
    this.renderInd();
    const ind=$id('pageind'); ind.classList.add('on');
    clearTimeout(this._indT); this._indT=setTimeout(()=>ind.classList.remove('on'),900);
  },
  bindSwipe(){
    const ps=$id('panels');
    let base=0,w=0,active=false;
    onDrag($id('home'),{threshold:8,
      start:({e})=>{ if(this.drag||AllApps.open||Folder.open) { active=false; return; }
        if(e.target.closest('.widget')&&e.target.closest('.widget').dataset.scroll) { active=false; return; }
        active=true; w=ps.clientWidth; base=-this.page*w; ps.style.transition='none'; },
      move:({dx,dy})=>{ if(!active) return; if(Math.abs(dy)>Math.abs(dx)*1.6) return;
        ps.style.transform='translateX('+(base+dx/dpScale())+'px)'; },
      end:({dx})=>{ if(!active) return; active=false;
        const d=dx/dpScale();
        if(Math.abs(d)>w*0.22) this.goto(this.page-Math.sign(d));
        else this.goto(this.page); }
    });
    /* long-press the wallpaper: choose a new one. That is what 4.0 did with
       an empty patch of home screen — the old "Add to Home screen" dialog
       was gone, because the drawer now did that job. */
    Holo.longPress($id('panels'),()=>{ if(this.drag) return; this.wallpaperPicker(); });
  },
  wallpaperPicker(){
    const body=el('div');
    const grid=el('div'); grid.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px';
    Wallpapers.list.forEach(w=>{
      const b=el('div'); b.style.cssText='cursor:pointer;text-align:center';
      const sw=el('div'); sw.style.cssText='height:64px;border-radius:2px;overflow:hidden;border:1px solid var(--h-div);position:relative';
      const old=Wallpapers.current; Wallpapers.current=w.id;
      sw.appendChild(Wallpapers.still()); Wallpapers.current=old;
      if(w.live){ sw.innerHTML='<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#0e4a66,#03070c)"></div>'
        +'<div style="position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(51,181,229,.75) 48%,transparent 60%)"></div>'; }
      b.appendChild(sw);
      b.appendChild(el('div',null,'<span style="font-size:11px;color:var(--h-fg2)">'+esc(w.name)+(w.live?' ·live':'')+'</span>'));
      b.onclick=()=>{ Wallpapers.set(w.id); d.close(); Guide.mark('wallpaper');
        if(w.live) MToast.show('<b>A live wallpaper.</b> Android had them from 2.1 and they were, honestly, mostly a battery tax. This one is drawn in code like everything else here.'); };
      grid.appendChild(b);
    });
    body.appendChild(grid);
    const d=Holo.dialog({title:'Choose wallpaper from',bodyNode:body,buttons:[{label:'Cancel'}]});
  },

  /* ---- dragging: icons, folders and widgets ---- */
  pickUp(node,item,pi,isWidget){
    if(this.drag) return;
    Sound.tick();
    const ghost=$id('dragghost');
    if(isWidget){
      /* a long press on a widget lifts it; let go without moving and you get
         the resize frame, which is the 4.0 gesture people had to be told
         about and then never forgot. */
      this.selectWidget(node,item,pi);
      return;
    }
    ghost.innerHTML=item.t==='folder'?node.querySelector('.folderIco').outerHTML:Art.appIcon(item.pkg,48);
    ghost.style.display='block';
    $id('homebar').classList.add('on');
    node.classList.add('dragging');
    this.drag={node,item,pi,isWidget:false,over:null};
    const move=e=>{
      const r=$id('panels').getBoundingClientRect(), s=dpScale();
      const x=(e.clientX-r.left)/s, y=(e.clientY-r.top)/s;
      ghost.style.left=(x-24)+'px'; ghost.style.top=(y-24)+'px';
      const hb=$id('homebar');
      /* the remove bar sits over the first row of icons, so an icon under
         the pointer wins unless the drag is right at the top edge */
      const cell=document.elementsFromPoint(e.clientX,e.clientY).find(n=>n.classList&&n.classList.contains('cell')&&n!==node);
      const overBar=y<26||(y<54&&!cell);
      $$('.ht',hb).forEach(h=>h.classList.toggle('hot',overBar&&h.dataset.k==='remove'));
      $$('.cell').forEach(c=>c.style.outline='');
      if(cell&&!overBar){ cell.style.outline='2px solid '+Holo.color('accent'); this.drag.over=cell; }
      else this.drag.over=null;
      /* drag to the edge and the panels turn */
      if(x<18&&!this._edge){ this._edge=setTimeout(()=>{ this.goto(this.page-1); this._edge=null; },380); }
      else if(x>$id('panels').clientWidth-18&&!this._edge){ this._edge=setTimeout(()=>{ this.goto(this.page+1); this._edge=null; },380); }
      else if(x>=18&&x<=$id('panels').clientWidth-18){ clearTimeout(this._edge); this._edge=null; }
      this.drag.last={x,y,overBar};
    };
    const up=e=>{
      document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      clearTimeout(this._edge); this._edge=null;
      ghost.style.display='none'; node.classList.remove('dragging');
      $id('homebar').classList.remove('on');
      $$('.cell').forEach(c=>c.style.outline='');
      const d=this.drag; this.drag=null;
      if(!d.last){ return; }
      if(d.last.overBar){ this.removeItem(item,pi); return; }
      if(d.over&&d.over._item){ this.makeFolder(item,pi,d.over._item,d.over._panel); return; }
      const cw=this.cellW(), chh=this.cellH();
      const c=clamp(Math.floor(d.last.x/cw),0,this.COLS-1), r=clamp(Math.floor(d.last.y/chh),0,this.ROWS-1);
      this.moveItem(item,pi,this.page,c,r);
    };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  },
  occupied(pi,c,r,except){
    return (this.home.panels[pi]||[]).some(i=>{
      if(i===except) return false;
      const cw=i.cw||1, ch=i.ch||1;
      return c>=i.c&&c<i.c+cw&&r>=i.r&&r<i.r+ch;
    });
  },
  freeCell(pi,c,r,except){
    if(!this.occupied(pi,c,r,except)) return {c,r};
    for(let rr=0;rr<this.ROWS;rr++) for(let cc=0;cc<this.COLS;cc++) if(!this.occupied(pi,cc,rr,except)) return {c:cc,r:rr};
    return null;
  },
  moveItem(item,fromPanel,toPanel,c,r){
    const spot=this.freeCell(toPanel,c,r,item);
    if(!spot){ Holo.toast('No more room on this Home screen'); this.renderPanels(); return; }
    const arr=this.home.panels[fromPanel]; const i=arr.indexOf(item); if(i>=0) arr.splice(i,1);
    item.c=spot.c; item.r=spot.r;
    this.home.panels[toPanel].push(item);
    this.save(); this.renderPanels();
  },
  removeItem(item,pi){
    const arr=this.home.panels[pi]; const i=arr.indexOf(item); if(i>=0) arr.splice(i,1);
    this.save(); this.renderPanels(); Holo.toast('Removed');
  },
  makeFolder(a,ap,b,bp){
    if(a.t==='widget'||b.t==='widget'){ this.renderPanels(); return; }
    const arrA=this.home.panels[ap]; const i=arrA.indexOf(a); if(i>=0) arrA.splice(i,1);
    if(b.t==='folder'){
      b.items=b.items.concat(a.t==='folder'?a.items:[a.pkg]);
    } else {
      const arrB=this.home.panels[bp]; const j=arrB.indexOf(b);
      const f={t:'folder',name:'Folder',items:[b.pkg].concat(a.t==='folder'?a.items:[a.pkg]),c:b.c,r:b.r};
      arrB.splice(j,1,f);
    }
    this.save(); this.renderPanels();
    Sound.tick(); Guide.mark('folder');
    MToast.show('<b>A folder, made by dropping one icon on another.</b> Three years late, and the single most requested thing on the platform. Open it, then rename it — the name field is at the bottom of the panel.','home');
  },

  /* ---- widget selection and resizing ---- */
  selectWidget(node,item,pi){
    this.clearResize();
    node.classList.add('sel');
    const fr=el('div','wresize on');
    const cw=this.cellW(), ch=this.cellH();
    const place=()=>{
      fr.style.left=(item.c*cw+2)+'px'; fr.style.top=(item.r*ch+2)+'px';
      fr.style.width=(item.cw*cw-4)+'px'; fr.style.height=(item.ch*ch-4)+'px';
    };
    fr.innerHTML='<b class="l"></b><b class="r"></b><b class="t v"></b><b class="bo v"></b>';
    place();
    node.parentNode.appendChild(fr);
    this.resizeSel={node,item,fr,pi};
    ['l','r','t','bo'].forEach(k=>{
      const h=fr.querySelector('.'+k);
      onDrag(h,{stop:true,
        move:({dx,dy})=>{
          const ddx=Math.round((dx/dpScale())/cw), ddy=Math.round((dy/dpScale())/ch);
          const o={c:item.c,r:item.r,cw:item.cw,ch:item.ch};
          if(k==='r') o.cw=clamp(item.cw+ddx,1,this.COLS-item.c);
          if(k==='l'){ const nc=clamp(item.c+ddx,0,item.c+item.cw-1); o.cw=item.cw+(item.c-nc); o.c=nc; }
          if(k==='bo') o.ch=clamp(item.ch+ddy,1,this.ROWS-item.r);
          if(k==='t'){ const nr=clamp(item.r+ddy,0,item.r+item.ch-1); o.ch=item.ch+(item.r-nr); o.r=nr; }
          Object.assign(item,o); place();
          node.style.left=(item.c*cw+4)+'px'; node.style.top=(item.r*ch+4)+'px';
          node.style.width=(item.cw*cw-8)+'px'; node.style.height=(item.ch*ch-8)+'px';
          Widgets.resized(node,item);
        },
        end:()=>{ this.save(); Guide.mark('resize'); }
      });
    });
    /* tap anywhere else and the frame goes away; drag the widget itself and
       it moves like any other item */
    setTimeout(()=>{
      const off=e=>{ if(fr.contains(e.target)||node.contains(e.target)) return; this.clearResize(); document.removeEventListener('pointerdown',off); };
      document.addEventListener('pointerdown',off);
    },10);
    MToast.show('<b>Resizable widgets.</b> Long-press, let go, and the handles appear. Before 4.0 a widget was whatever size its author decided and you lived with it.','home');
  },
  clearResize(){
    if(!this.resizeSel) return;
    this.resizeSel.node.classList.remove('sel'); this.resizeSel.fr.remove();
    this.resizeSel=null; this.save();
  },
  rebuildDrawer(){ AllApps.build(); this.renderPanels(); },
  addToHome(pkg){
    const spot=this.freeCell(this.page,0,0,null);
    if(!spot){ Holo.toast('No more room on this Home screen'); return false; }
    this.home.panels[this.page].push({t:'app',pkg,c:spot.c,r:spot.r});
    this.save(); this.renderPanels(); return true;
  },
  addWidget(wid){
    const def=Widgets.DEFS[wid];
    let spot=null;
    for(let r=0;r<=this.ROWS-def.ch&&!spot;r++) for(let c=0;c<=this.COLS-def.cw&&!spot;c++){
      let ok=true;
      for(let rr=r;rr<r+def.ch;rr++) for(let cc=c;cc<c+def.cw;cc++) if(this.occupied(this.page,cc,rr)) ok=false;
      if(ok) spot={c,r};
    }
    if(!spot){ Holo.toast('No room for this widget on this Home screen'); return false; }
    this.home.panels[this.page].push({t:'widget',w:wid,c:spot.c,r:spot.r,cw:def.cw,ch:def.ch});
    this.save(); this.renderPanels(); return true;
  }
};

/* ---- the widget framework ----
   The launcher hosts these generically. It knows their declared minimum
   size and how to draw a frame round them; it knows nothing about what any
   of them contains, and none of them knows which launcher is hosting it.
   That separation is why a third party could ship one at all. */
const Widgets={
  DEFS:{
    clock:{name:'Clock',cw:4,ch:2,min:[2,2],desc:'4 × 2'},
    calendar:{name:'Calendar',cw:4,ch:2,min:[2,2],desc:'4 × 2'},
    gmail:{name:'Gmail',cw:4,ch:3,min:[3,2],desc:'4 × 3'},
    music:{name:'Music',cw:4,ch:2,min:[2,2],desc:'4 × 2'},
    bookmarks:{name:'Bookmarks',cw:4,ch:3,min:[2,2],desc:'4 × 3'},
    data:{name:'Data usage',cw:2,ch:2,min:[2,2],desc:'2 × 2'},
    search:{name:'Search',cw:4,ch:1,min:[3,1],desc:'4 × 1'}
  },
  create(id,item){
    const n=el('div','widget'); n.dataset.w=id;
    const pad=el('div','wgpad'); n.appendChild(pad);
    n._render=()=>this.render(id,pad,item,n);
    n._render();
    return n;
  },
  resized(node,item){ if(node._render) node._render(); },
  tick(){ $$('.widget',$id('home')).forEach(w=>{ if(w._render&&!w.dataset.static) w._render(); }); },
  render(id,pad,item,node){
    const small=(item.cw||4)<=2, short=(item.ch||2)<=1;
    pad.innerHTML='';
    const acc=ThemeLayer.role('accent');
    if(id==='clock'){
      const d=new Date(), cp=fmtClockParts(d);
      node.style.setProperty('--wg-bg','transparent');
      pad.style.justifyContent='center'; pad.style.alignItems='center';
      const box=el('div'); box.style.cssText='display:flex;align-items:center;gap:12px';
      /* the analogue face, drawn; 4.0's stock clock widget was an analogue
         one and the digital one came with it */
      const R=Math.min(pad.clientHeight*0.8,72);
      const ang=(d.getHours()%12+d.getMinutes()/60)*30, am=d.getMinutes()*6;
      box.innerHTML='<svg width="'+R+'" height="'+R+'" viewBox="0 0 100 100">'
        +'<circle cx="50" cy="50" r="46" fill="rgba(0,0,0,.28)" stroke="rgba(255,255,255,.5)" stroke-width="3"/>'
        +'<line x1="50" y1="50" x2="'+(50+26*Math.sin(ang*Math.PI/180))+'" y2="'+(50-26*Math.cos(ang*Math.PI/180))+'" stroke="#fff" stroke-width="5" stroke-linecap="round"/>'
        +'<line x1="50" y1="50" x2="'+(50+37*Math.sin(am*Math.PI/180))+'" y2="'+(50-37*Math.cos(am*Math.PI/180))+'" stroke="'+acc+'" stroke-width="3.4" stroke-linecap="round"/>'
        +'<circle cx="50" cy="50" r="4" fill="'+acc+'"/></svg>';
      if(!small){
        const t=el('div');
        t.innerHTML='<div class="wbig">'+esc(cp.t)+'<span style="font-size:18px;font-weight:400"> '+esc(cp.ap)+'</span></div>'
          +'<div class="wsmall">'+esc(fmtDate(Date.now()))+'</div>'
          +'<div class="wtiny">'+esc(Sys.carrier())+' · '+esc(Sys.netType())+'</div>';
        box.appendChild(t);
      }
      pad.appendChild(box);
      node.onclick=()=>Intents.start({action:'MAIN',component:'org.museum.clock/Main'});
    }
    else if(id==='calendar'){
      pad.appendChild(el('div','wgtitle','<span>'+ic('calendar')+'</span><span>Calendar</span><span class="sp"></span>'));
      const soon=Content.all('events').filter(e=>e.when>Date.now()-3600000).sort((a,b)=>a.when-b.when).slice(0,(item.ch||2)*2-1);
      if(!soon.length) pad.appendChild(el('div','wsmall','Nothing coming up'));
      soon.forEach(e=>{
        const r=el('div','wrow');
        r.innerHTML='<span style="width:3px;align-self:stretch;background:'+e.color+'"></span>'
          +'<span style="width:58px;color:#cfd6df">'+esc(fmtClockShort(new Date(e.when)))+'</span>'
          +'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(e.title)+'</span>';

        .sort((x,y)=>x.label.localeCompare(y.label));
      const per=20; const n=Math.max(1,Math.ceil(apps.length/per));

        apps.slice(p*per,(p+1)*per).forEach(m=>{
          const c=el('div','cell'); c.style.position='relative';
          const ico=el('div','icoWrap'); ico.innerHTML=Art.appIcon(m.pkg,48); c.appendChild(ico);
          c.appendChild(el('div','lbl',esc(m.label)));
          c.onclick=()=>{ this.hide(); Intents.start({action:'MAIN',component:m.pkg+'/Main'}); };
          Holo.longPress(c,()=>{ this.hide(); if(Launcher.addToHome(m.pkg)){ Holo.toast('Added to Home'); Guide.mark('drawer'); } });
          pg.appendChild(c);
        });
        pages.appendChild(pg);
      }
      this.pageCount=n; this.page=clamp(this.page,0,n-1);
    } else {
      const pg=el('div','wpage');
      Object.keys(Widgets.DEFS).forEach(k=>{
        const d=Widgets.DEFS[k];
        const b=el('div','wprev');
        b.innerHTML='<div class="wnm">'+esc(d.name)+'</div><div class="wsz">'+esc(d.desc)+' — long-press to place</div>';
        const prev=el('div'); prev.style.cssText='margin-top:8px;height:64px;position:relative;overflow:hidden;border-radius:2px;background:rgba(0,0,0,.35)';
        const w=Widgets.create(k,{cw:d.cw,ch:d.ch});
        w.style.cssText+=';position:absolute;inset:0;width:100%;height:100%';
        prev.appendChild(w); b.appendChild(prev);
        const place=()=>{ this.hide(); if(Launcher.addWidget(k)){ Holo.toast(d.name+' added'); Guide.mark('widget'); } };
        b.onclick=place; Holo.longPress(b,place);
        pg.appendChild(b);
      });
      pages.appendChild(pg);
      this.pageCount=1; this.page=0;
    }
    this.renderInd(); this.goto(this.page,true);
    if(!this._swipe){ this._swipe=true; this.bindSwipe(); }
  },
  renderInd(){
    const i=$id('allapps').querySelector('.aaind'); i.innerHTML='';
    for(let p=0;p<this.pageCount;p++){ const d=el('i'); if(p===this.page) d.classList.add('on'); i.appendChild(d); }
  },
  goto(p,instant){
    this.page=clamp(p,0,this.pageCount-1);
    const pages=$id('allapps').querySelector('.aapages');
    pages.style.transition=instant?'none':'transform .26s cubic-bezier(.25,.8,.3,1)';
    pages.style.transform='translateX('+(-this.page*100)+'%)';
    this.renderInd();
  },
  bindSwipe(){
    const pages=$id('allapps').querySelector('.aapages');
    let base=0,w=0;
    onDrag(pages,{threshold:8,
      start:()=>{ w=pages.clientWidth; base=-this.page*w; pages.style.transition='none'; },
      move:({dx,dy})=>{ if(Math.abs(dy)>Math.abs(dx)*1.6) return; pages.style.transform='translateX('+(base+dx/dpScale())+'px)'; },
      end:({dx})=>{ const d=dx/dpScale(); if(Math.abs(d)>w*0.22) this.goto(this.page-Math.sign(d)); else this.goto(this.page); }});
  },
  show(){ this.build(); $id('allapps').classList.add('on'); this.open=true; Sound.click(); Guide.mark('drawer'); },
  hide(){ $id('allapps').classList.remove('on'); this.open=false; }
};

/* ==========================================================================
   MODULE 12 — THE DATA USAGE MODEL
   --------------------------------------------------------------------------
   One of this release's best features and one the competing platform did
   not match for years: a graph of mobile data over the billing cycle, a
   per-application breakdown, and two lines you can drag — a warning line
   and a hard limit. The limit is not advice. Cross it and the system turns
   mobile data off, and the exhibit honours that: the Browser stops loading,
   the Market stops downloading, mail stops arriving. Drag the line down far
   enough and you will cut something off mid-sentence, which is exactly what
   it was for.
   ========================================================================== */
const DataUsage={
  cycleDay:14, limitOn:false, limit:2048, warn:1536, cut:false, days:null,
  init(){
    const s=State.get('data',null);
    if(s){ Object.assign(this,s); }
    if(!this.days) this.days=this.seed();
    this.check(true);
    setInterval(()=>this.background(),9000);
  },
  save(){ State.set('data',{cycleDay:this.cycleDay,limitOn:this.limitOn,limit:this.limit,warn:this.warn,cut:this.cut,days:this.days}); },
  seed(){
    const d={}, r=seeded(20111117);
    const apps=['org.museum.browser','org.museum.gmail','org.museum.market','org.museum.music','org.museum.maps','org.museum.talk','org.museum.gallery'];
    const start=this.cycleStart();
    for(let i=0;i<this.dayOfCycle();i++){
      const day={};
      apps.forEach(a=>{ if(r()<0.8) day[a]=+(r()*(a==='org.museum.browser'?46:a==='org.museum.market'?70:20)).toFixed(2); });
      d[start+i*DAY_MS]=day;
    }
    return d;
  },
  cycleStart(){
    const n=new Date(); let y=n.getFullYear(), m=n.getMonth();
    if(n.getDate()<this.cycleDay) m--;
    if(m<0){ m=11; y--; }
    const d=new Date(y,m,this.cycleDay); d.setHours(0,0,0,0); return d.getTime();
  },
  cycleEnd(){ const s=new Date(this.cycleStart()); return new Date(s.getFullYear(),s.getMonth()+1,this.cycleDay).getTime(); },
  dayOfCycle(){ return Math.max(1,Math.floor((Date.now()-this.cycleStart())/DAY_MS)+1); },
  cycleLen(){ return Math.round((this.cycleEnd()-this.cycleStart())/DAY_MS); },
  cycleTotal(){ return Object.keys(this.days).reduce((n,k)=>n+Object.values(this.days[k]).reduce((a,b)=>a+b,0),0); },
  byApp(){
    const by={};
    Object.values(this.days).forEach(d=>Object.keys(d).forEach(p=>{ by[p]=(by[p]||0)+d[p]; }));
    return Object.keys(by).map(p=>({pkg:p,mb:by[p]})).sort((a,b)=>b.mb-a.mb);
  },
  series(){
    const n=this.cycleLen(), s=this.cycleStart(), out=[];
    let run=0;
    for(let i=0;i<n;i++){
      const k=s+i*DAY_MS;
      const day=this.days[k]?Object.values(this.days[k]).reduce((a,b)=>a+b,0):0;
      if(k<=Date.now()) run+=day;
      out.push({t:k,day,run:k<=Date.now()?run:null});
    }
    return out;
  },
  record(amount,pkg){
    if(Sys.flags.wifi) return;          /* Wi-Fi was never counted, and that
                                           is why the feature worked */
    if(!Sys.mobileUp()) return;
    if(Restricted.isRestricted(pkg)&&!this.foreground(pkg)) return;
    const k=dayStart(Date.now());
    const d=this.days[k]=this.days[k]||{};
    d[pkg]=+((d[pkg]||0)+amount).toFixed(3);
    this.save(); this.check();
  },
  foreground(pkg){ return Stack.currentPkg()===pkg; },
  background(){
    /* the ordinary background chatter of a phone with an account on it */
    if(!Sys.mobileUp()||Sys.flags.wifi) return;
    if(!Sys.flags.sync) return;
    ['org.museum.gmail','org.museum.talk','org.museum.people','org.museum.calendar'].forEach(p=>{
      if(Math.random()<0.4) this.record(0.04+Math.random()*0.2,p);
    });
  },
  check(quiet){
    const t=this.cycleTotal();
    if(this.limitOn&&t>=this.limit){
      if(!this.cut){
        this.cut=true; this.save();
        Notif.post({id:'du.limit',pkg:'org.museum.settings',title:'Mobile data limit reached',
          text:'Mobile data has been turned off. Touch to change your limit.',statusIcon:'warn',
          ongoing:true,led:ThemeLayer.role('warn'),
          intent:{action:'MAIN',component:'org.museum.settings/DataUsage'}});
        Registry.broadcast('CONNECTIVITY_CHANGED',{});
        if(!quiet){
          Guide.mark('datacut');
          MToast.show('<b>Mobile data is off.</b> Not a warning — the limit line is enforced. Open the Browser and watch it fail; the Market will not download; mail will not arrive. Wi-Fi still works, which is exactly how it worked, and exactly why people used it.','data');
        }
      }
    } else if(this.cut){
      this.cut=false; this.save(); Notif.cancel('du.limit');
      Registry.broadcast('CONNECTIVITY_CHANGED',{});
    }
    if(this.limitOn&&!this.cut&&t>=this.warn&&!this._warned){
      this._warned=true;
      Notif.post({id:'du.warn',pkg:'org.museum.settings',title:'Data usage warning',
        text:mb(t)+' of mobile data used',statusIcon:'warn',
        intent:{action:'MAIN',component:'org.museum.settings/DataUsage'}});
    }
    if(t<this.warn) this._warned=false;
  }
};
/* per-application background data restriction, which 4.0 also introduced */
const Restricted={
  set(){ return State.get('restricted',{}); },
  isRestricted(pkg){ return !!this.set()[pkg]; },
  toggle(pkg){ const s=this.set(); s[pkg]=!s[pkg]; State.set('restricted',s); return s[pkg]; }
};

   MODULE 1. None of them draws chrome; none of them names another; none of
   them contains a colour. Where one needs a colour it asks for a role. Two
   self-tests in the Colophon check all three claims against this file's own

/* ---------- Phone (org.museum.phone) ---------- */
(function(){
  const PKG='org.museum.phone';
  Registry.register({
    pkg:PKG,label:'Phone',theme:Holo.THEME.DARK,targetSdk:14,
    activities:[
      {name:'Main',launcher:true,filters:[{action:'MAIN'},{action:'DIAL',scheme:['tel']},{action:'CALL',scheme:['tel']}],
       create(intent,win,ctx){
        let tab=intent.action==='DIAL'||intent.action==='CALL'?0:1;
        let dialed=intent.uri?String(intent.uri).replace('tel:',''):'';
        const ab=Holo.actionBar({title:'Phone',icon:Art.appIcon(PKG,28),
          tabs:{items:[{icon:'phone',label:'Dialer'},{icon:'star',label:'Favourites'},{icon:'clock',label:'Call log'}],sel:tab,
                on:i=>{ tab=i; body(); }},
          overflow:[{label:'Settings',on:()=>Holo.toast('Call settings')},{label:'Add contact',on:()=>Intents.start({action:'INSERT',type:'vnd.contact/item'})}]});
        win.appendChild(ab.el);
        const content=el('div','h-content'); win.appendChild(content);
        function body(){
          content.innerHTML='';
          if(tab===0) content.appendChild(dialer());
          else if(tab===1) content.appendChild(favourites());
          else content.appendChild(log());
        }
        function dialer(){
          const w=el('div','h-content');
          const disp=el('div'); disp.style.cssText='padding:18px 16px 8px;font-size:30px;text-align:center;min-height:56px;letter-spacing:.02em';
          disp.textContent=dialed||'';
          w.appendChild(disp);
          const hint=el('div'); hint.style.cssText='text-align:center;font-size:12px;color:var(--h-fg2);min-height:16px';
          w.appendChild(hint);
          const grid=el('div'); grid.style.cssText='flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:1px;background:var(--h-div)';
          [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['∗',''],['0','+'],['#','']].forEach(k=>{
            const b=el('div'); b.style.cssText='background:var(--h-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer';
            b.innerHTML='<div style="font-size:26px">'+k[0]+'</div><div style="font-size:10px;color:var(--h-fg2);letter-spacing:.14em">'+k[1]+'</div>';
            b.onclick=()=>{ Sound.tone(700+'123456789*0#'.indexOf(k[0])*40,0.08,'sine',0.1); dialed+=k[0]; disp.textContent=dialed;
              const c=Content.query('contacts',c=>c.phones&&c.phones.some(p=>p.num.replace(/\D/g,'').includes(dialed.replace(/\D/g,''))))[0];
              hint.textContent=dialed&&c?c.name:''; };
            grid.appendChild(b);
          });
          w.appendChild(grid);
          const bar=el('div'); bar.style.cssText='display:flex;align-items:center;height:60px;border-top:1px solid var(--h-div)';
          const call=el('div'); call.style.cssText='flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;color:'+Holo.color('ok',ctx.rec.comp.theme);
          call.innerHTML='<span style="width:30px;display:block">'+ic('phone')+'</span>';
          call.onclick=()=>{ if(!dialed) return; Call.start(dialed); };
          const del=el('div'); del.style.cssText='width:64px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--h-fg2)';
          del.innerHTML='<span style="width:24px;display:block">'+ic('back')+'</span>';
          del.onclick=()=>{ dialed=dialed.slice(0,-1); disp.textContent=dialed; };
          bar.appendChild(el('div',null,'')); bar.firstChild.style.width='64px';
          bar.appendChild(call); bar.appendChild(del);
          w.appendChild(bar);
          return w;
        }
        function favourites(){
          const sc=Holo.scroll(); const g=el('div');
          g.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--h-div)';
          Content.query('contacts',c=>c.starred).forEach(c=>{
            const t=el('div'); t.style.cssText='position:relative;aspect-ratio:1/1;cursor:pointer;background:var(--h-bg)';
            t.innerHTML='<div style="position:absolute;inset:0">'+Art.avatar(c.name,200).replace('width="200" height="200"','width="100%" height="100%"')+'</div>'
              +'<div style="position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:14px">'+esc(c.name)+'</div>';
            t.onclick=()=>Call.start(c.phones[0].num,c.name);
            g.appendChild(t);
          });
          sc.scroller.appendChild(g);
          return sc;
        }
        function log(){
          const sc=Holo.scroll(); const l=Holo.list();
          const calls=State.get('calllog',[]);
          if(!calls.length) return Holo.empty('phone','No calls yet','Dial a number, or ring the phone from the museum rail');
          calls.forEach(c=>{

        }
        body();

        return {resume(){ }};
      }},
      {name:'InCall',theme:Holo.THEME.DARK,filters:[{action:'INCALL'}],
       create(intent,win,ctx){
        const name=intent.extras.name||intent.extras.num, num=intent.extras.num;
        win.style.background='#000';
        const w=el('div','h-content'); w.style.cssText+=';align-items:center;justify-content:center;gap:10px;position:relative';
        const bg=el('div'); bg.style.cssText='position:absolute;inset:0;opacity:.24';

        w.appendChild(bg);
        const box=el('div'); box.style.cssText='position:relative;text-align:center';
        box.innerHTML='<div style="width:104px;height:104px;border-radius:2px;overflow:hidden;margin:0 auto 14px">'

          +'<div style="font-size:26px">'+esc(name)+'</div>'
          +'<div style="font-size:14px;color:var(--h-fg2);margin-top:4px" id="callstat">'+(intent.extras.incoming?'Incoming call':'Dialling…')+'</div>'
          +'<div style="font-size:13px;color:var(--h-fg3);margin-top:2px">'+esc(num)+' · mobile</div>';
        w.appendChild(box);
        win.appendChild(w);
        const stat=()=>w.querySelector('#callstat');
        let t0=Date.now(), iv=null;
        const bar=el('div'); bar.style.cssText='position:relative;display:flex;padding:16px;gap:12px;justify-content:center';
        if(intent.extras.incoming){
          const a=Holo.button('Answer',{primary:true,icon:'phone',on:()=>{ answer(); }});
          const d=Holo.button('Decline',{icon:'endcall',on:()=>{ end('Declined'); }});
          bar.appendChild(a); bar.appendChild(d);
        } else { bar.appendChild(Holo.button('End call',{icon:'endcall',on:()=>end('Call ended')})); setTimeout(answer,2100); }
        win.appendChild(bar);
        function answer(){
          if(iv) return;
          stat().textContent='00:00'; t0=Date.now();
          iv=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); if(stat()) stat().textContent=pad2(Math.floor(s/60))+':'+pad2(s%60); },1000);
          bar.innerHTML=''; bar.appendChild(Holo.button('End call',{icon:'endcall',on:()=>end('Call ended')}));
          DataUsage.record(0,PKG);
        }
        function end(msg){
          clearInterval(iv);
          const log=State.get('calllog',[]);
          log.unshift({num,name,when:Date.now(),dir:intent.extras.incoming?(iv?'in':'missed'):'out'});
          State.set('calllog',log.slice(0,40));
          Holo.toast(msg); ctx.finish();
        }
        return {dimNav:false,destroy(){ clearInterval(iv); }};
      }}
    ]
  });
  window.Call={
    start(num,name){
      const c=Content.query('contacts',c=>c.phones&&c.phones.some(p=>p.num===num))[0];
      Intents.start({action:'INCALL',component:PKG+'/InCall',extras:{num,name:name||(c?c.name:num)}});
    },
    incoming(){
      const c=pick(Content.query('contacts',c=>c.phones&&c.phones.length));
      Sound.ring();
      Intents.start({action:'INCALL',component:PKG+'/InCall',extras:{num:c.phones[0].num,name:c.name,incoming:true}});
    }
  };
})();

/* a framework service, not an application: turn the web addresses, phone
   numbers and map locations inside a piece of text into things that
   dispatch intents. Android called it Linkify and it is the reason a text
   message could hand a link to the Browser without either of them knowing
   the other existed. */
const Linkify={
  html(text){
    let h=esc(text);
    h=h.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g,'<span class="lk" data-uri="$1">$1</span>');
    h=h.replace(/(geo:[-0-9.,]+(?:\?q=[^\s<]+)?)/g,'<span class="lk" data-uri="$1">$1</span>');
    h=h.replace(/\b(\d{3}-\d{4})\b/g,'<span class="lk" data-uri="tel:$1">$1</span>');
    h=h.replace(/\b([a-z0-9._%-]+@[a-z0-9.-]+\.[a-z]{2,})\b/gi,'<span class="lk" data-uri="mailto:$1">$1</span>');
    return h;
  },
  bind(node){
    $$('.lk',node).forEach(s=>{
      s.style.cssText='color:var(--h-accent);text-decoration:underline;cursor:pointer';
      s.onclick=e=>{ e.stopPropagation(); Intents.view(s.dataset.uri); };
    });
  }
};
