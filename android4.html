/* ==========================================================================
   MODULE 1 — THE HOLO DESIGN SYSTEM AND THE ACTION BAR FRAMEWORK
   --------------------------------------------------------------------------
   The first module in the file and the one every other module depends on.
   Applications do not draw chrome. They ask this object for a window, an
   Action Bar, a list, a switch, a dialog, and they are handed components
   that already know how they look, because how they look is decided one
   layer down, in MODULE 2.

   An application declares one of the three real themes in its manifest —
   Theme.Holo, Theme.Holo.Light, Theme.Holo.Light.DarkActionBar — and that
   declaration is all it ever says about its appearance. Nothing in any
   application below reads the active variant, and a self-test in the
   Colophon enforces it by reading this file's own source.

   Where an application genuinely needs a colour — a chart, a warning, a
   graph fill — it asks for a ROLE, never a value: Holo.color('warn') and
   not a hex triplet. The theme layer answers.
   ========================================================================== */
const Holo={
  THEME:{DARK:'dark',LIGHT:'light',LIGHT_DARK_AB:'lightdark'},
  _probe:null,

  /* ---- the themed window an activity lives in ---- */
  window(theme){ const r=el('div','h-win'); r.dataset.apptheme=theme||this.THEME.DARK; return r; },
  content(){ return el('div','h-content'); },
  pad(html){ return el('div','h-pad',html); },

  /* a scroller with Holo's edge glow. Drag a list past its end and the
     crescent of accent light appears — the single most recognisable thing
     Holo does while a finger is on the glass. */
  scroll(cls){
    const wrap=el('div','h-content'); wrap.style.position='relative';
    const sc=el('div','h-scroll'+(cls?' '+cls:''));
    const gt=el('div','h-glow top'), gb=el('div','h-glow bot');
    wrap.appendChild(sc); wrap.appendChild(gt); wrap.appendChild(gb);
    let pull=0;
    const flash=g=>{ g.classList.add('show'); clearTimeout(g._t); g._t=setTimeout(()=>g.classList.remove('show'),260); };
    sc.addEventListener('wheel',e=>{
      if(e.deltaY<0 && sc.scrollTop<=0) flash(gt);
      if(e.deltaY>0 && sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1) flash(gb);
    },{passive:true});
    onDrag(sc,{ threshold:4,
      start:()=>{ pull=sc.scrollTop; },
      move:({dy})=>{
        if(sc.scrollTop<=0&&dy>12) flash(gt);
        else if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1&&dy<-12) flash(gb);
        sc.scrollTop=pull-dy/dpScale()*2;

    wrap.scroller=sc; return wrap;
  },

  /* ---- THE ACTION BAR ----
     Title and up affordance on the left; tabs or a spinner beneath or
     inline; the important actions as icons on the right; everything else
     behind three vertical dots. This replaced the hardware Menu key, and
     making it compulsory is how Google stopped every application inventing
     its own title bar. */
  actionBar(spec){
    spec=spec||{};
    const wrap=el('div'); wrap.style.flex='0 0 auto';
    const bar=el('div','h-ab');
    /* home / up */
    const home=el('div','h-ab-home'+(spec.onUp||spec.up?'':' nohome'));
    if(spec.up) home.innerHTML='<svg class="h-ab-up" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 1.5L1.5 7l5 5.5"/></svg>';
    const icoBox=el('div','h-ab-icon');
    if(spec.icon){ if(typeof spec.icon==='string') icoBox.innerHTML=spec.icon; else icoBox.appendChild(spec.icon); }
    else icoBox.style.display='none';
    home.appendChild(icoBox);
    const titles=el('div','h-ab-titles');
    const t=el('div','h-ab-title',esc(spec.title||''));
    titles.appendChild(t);
    let sub=null;
    if(spec.subtitle!=null){ sub=el('div','h-ab-sub',esc(spec.subtitle)); titles.appendChild(sub); }
    if(spec.spinnerTitle){ /* the Action Bar spinner used in place of a title */
      const sp=el('div','h-ab-spin');
      const st=el('div','t',esc(spec.spinnerTitle.items[spec.spinnerTitle.sel||0]));
      sp.appendChild(st); sp.appendChild(el('div','car'));
      sp.onclick=e=>{ e.stopPropagation(); Holo.popup(sp,spec.spinnerTitle.items.map((L,i)=>({label:L,checked:i===(spec.spinnerTitle.sel||0),on:()=>{ spec.spinnerTitle.sel=i; st.textContent=L; spec.spinnerTitle.on&&spec.spinnerTitle.on(i); }}))); };
      home.appendChild(sp);
    } else home.appendChild(titles);
    if(spec.onUp) home.onclick=spec.onUp;
    bar.appendChild(home);
    bar.appendChild(el('div','h-ab-spacer'));
    /* actions */
    const acts=el('div','h-ab-actions'); bar.appendChild(acts);
    const mkAct=a=>{
      const b=el('div','h-ab-act'+(a.text?' wide':'')+(a.disabled?' disabled':''));
      b.title=a.label||''; b.dataset.act=a.id||a.label||'';
      b.innerHTML=a.text?('<span class="txt">'+esc(a.label)+'</span>'):ic(a.icon);
      b.onclick=e=>{ e.stopPropagation(); Sound.click(); a.on&&a.on(b,e); };
      return b;
    };
    (spec.actions||[]).forEach(a=>acts.appendChild(mkAct(a)));
    if(spec.overflow&&spec.overflow.length){
      const ov=el('div','h-ab-ovf','<i></i>'); ov.title='More options'; ov.dataset.act='overflow';
      ov.onclick=e=>{ e.stopPropagation(); Sound.click(); Holo.popup(ov,typeof spec.overflow==='function'?spec.overflow():spec.overflow,{align:'right'}); };
      bar.appendChild(ov);
    }
    const prog=el('div','h-ab-prog'); bar.appendChild(prog);
    wrap.appendChild(bar);
    /* second row: tabs */
    let tabsEl=null, tabNodes=[];
    if(spec.tabs){
      tabsEl=el('div','h-ab-tabs'+(spec.tabs.scrollable?' scrollable':''));
      spec.tabs.items.forEach((it,i)=>{
        const tb=el('div','h-tab'+(i===(spec.tabs.sel||0)?' on':''));
        tb.innerHTML=(it.icon?ic(it.icon):'')+(it.label?'<span>'+esc(it.label)+'</span>':'');
        if(it.badge) tb.appendChild(el('span','dot',String(it.badge)));
        tb.onclick=()=>{ Sound.click(); api.selectTab(i); spec.tabs.on&&spec.tabs.on(i); };
        tabNodes.push(tb); tabsEl.appendChild(tb);
      });
      wrap.appendChild(tabsEl);
    }
    const api={
      el:wrap, bar, tabsEl,
      setTitle(v){ t.textContent=v; },
      setSubtitle(v){ if(!sub){ sub=el('div','h-ab-sub'); titles.appendChild(sub); } sub.textContent=v||''; sub.style.display=v?'':'none'; },
      setProgress(p){ prog.style.width=(p==null?0:clamp(p,0,1)*100)+'%'; },
      selectTab(i){ tabNodes.forEach((n,j)=>n.classList.toggle('on',i===j)); },
      tabBadge(i,v){ const n=tabNodes[i]; if(!n) return; let d=n.querySelector('.dot'); if(!v){ if(d)d.remove(); return; } if(!d){ d=el('span','dot'); n.appendChild(d); } d.textContent=String(v); },
      setActions(list){ acts.innerHTML=''; list.forEach(a=>acts.appendChild(mkAct(a))); },
      action(id){ return acts.querySelector('[data-act="'+id+'"]'); }
    };
    wrap.api=api; return api;
  },

  /* the split Action Bar: on a narrow screen the actions get their own bar
     along the bottom of the window. */
  splitBar(actions){
    const s=el('div','h-split');
    actions.forEach(a=>{
      const b=el('div','h-ab-act'+(a.disabled?' disabled':''));
      b.title=a.label||''; b.innerHTML=ic(a.icon)+(a.label&&a.showLabel?'<span class="txt">'+esc(a.label)+'</span>':'');
      b.onclick=()=>{ Sound.click(); a.on&&a.on(b); }; s.appendChild(b);
    });
    return s;
  },

  /* the contextual Action Bar — long-press a row and the bar is replaced */
  cab(host,spec){
    const c=el('div','h-cab');
    const done=el('div','done',ic('done')); c.appendChild(done);
    const count=el('div','count',String(spec.count||1)); c.appendChild(count);
    c.appendChild(el('div','h-ab-spacer'));
    const acts=el('div','h-ab-actions');
    (spec.actions||[]).forEach(a=>{
      const b=el('div','h-ab-act'); b.title=a.label||''; b.innerHTML=ic(a.icon);
      b.onclick=()=>{ Sound.click(); a.on&&a.on(); }; acts.appendChild(b);
    });
    c.appendChild(acts);
    host.appendChild(c); requestAnimationFrame(()=>c.classList.add('on'));
    const close=()=>{ c.classList.remove('on'); setTimeout(()=>c.remove(),200); spec.onClose&&spec.onClose(); };
    done.onclick=close;
    return {el:c,close,setCount(n){ count.textContent=String(n); }};
  },

  /* ---- lists ---- */
  list(){ return el('div','h-list'); },
  listItem(s){
    const r=el('div','h-li'+(s.cls?' '+s.cls:''));
    if(s.icon){ const b=el('div','h-li-icon'+(s.iconSize?' '+s.iconSize:'')); if(typeof s.icon==='string') b.innerHTML=s.icon; else b.appendChild(s.icon); r.appendChild(b); }
    const tx=el('div','h-li-text');
    if(s.title!=null) tx.appendChild(el('div','h-li-title'+(s.unread?' unread':''),esc(s.title)));
    if(s.sub!=null) tx.appendChild(el('div','h-li-sub'+(s.wrap?' wrap':''),s.subHtml?s.sub:esc(s.sub)));
    if(s.sub2!=null) tx.appendChild(el('div','h-li-sub',esc(s.sub2)));
    r.appendChild(tx);
    if(s.right){ const rt=el('div','h-li-right'); if(typeof s.right==='string') rt.innerHTML=s.right; else rt.appendChild(s.right); r.appendChild(rt); }
    if(s.widget){ r.appendChild(s.widget); }
    if(s.on) r.onclick=e=>{ Sound.click(); s.on(e,r); };
    if(s.onLong) Holo.longPress(r,()=>s.onLong(r));
    if(s.disabled) r.classList.add('disabled');

  },
  header(text){ return el('div','h-header',esc(text)); },
  sep(){ return el('div','h-sep'); },

  longPress(node,fn,ms){
    let t=null,moved=false;
    node.addEventListener('pointerdown',()=>{ moved=false; clearTimeout(t); t=setTimeout(()=>{ if(!moved){ Sound.tick(); fn(); } },ms||480); });

  /* ---- controls ---- */
  button(label,o){
    o=o||{}; const b=el('button','h-btn'+(o.primary?' primary':'')+(o.borderless?' borderless':'')+(o.block?' block':'')+(o.disabled?' disabled':''));
    b.innerHTML=(o.icon?ic(o.icon):'')+'<span>'+esc(label)+'</span>';
    if(o.on) b.onclick=e=>{ Sound.click(); o.on(e,b); };
    return b;
  },
  switch_(on,cb){
    const s=el('div','h-switch'+(on?' on':''));
    s.innerHTML='<span class="lab l">ON</span><span class="lab r">OFF</span><div class="thumb"></div>';
    s.onclick=e=>{ e.stopPropagation(); s.classList.toggle('on'); Sound.tick(); cb&&cb(s.classList.contains('on')); };
    s.setOn=v=>s.classList.toggle('on',!!v); s.isOn=()=>s.classList.contains('on');

  },
  check(on,cb){
    const c=el('div','h-check'+(on?' on':''));
    c.onclick=e=>{ e.stopPropagation(); c.classList.toggle('on'); Sound.tick(); cb&&cb(c.classList.contains('on')); };
    c.setOn=v=>c.classList.toggle('on',!!v); c.isOn=()=>c.classList.contains('on');
    return c;
  },
  radio(on){ return el('div','h-radio'+(on?' on':'')); },
  edit(o){
    o=o||{}; const e2=el(o.multi?'textarea':'input','h-edit'+(o.multi?' multi':''));
    if(!o.multi) e2.type=o.type||'text';
    e2.placeholder=o.hint||''; if(o.value!=null) e2.value=o.value;
    if(o.rows) e2.rows=o.rows;
    if(o.on) e2.addEventListener('input',()=>o.on(e2.value));
    if(o.enter) e2.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!o.multi){ ev.preventDefault(); o.enter(e2.value); } });

  seek(o){
    o=o||{}; const s=el('div','h-seek'); const trk=el('div','trk'); const fil=el('div','fil'); const thb=el('div','thb');
    trk.appendChild(fil); s.appendChild(trk); s.appendChild(thb);
    let v=o.value==null?0.5:o.value;
    const draw=()=>{ fil.style.width=(v*100)+'%'; thb.style.left=(v*100)+'%'; };
    const setFrom=x=>{ const r=trk.getBoundingClientRect(); v=clamp((x-r.left)/r.width,0,1); draw(); o.on&&o.on(v); };
    onDrag(s,{stop:true,start:({x})=>setFrom(x),move:({x})=>setFrom(x)});

  },
  progressBar(o){
    o=o||{}; const p=el('div','h-progh'+(o.indeterminate?' indet':'')); const i=el('i'); p.appendChild(i);
    p.setValue=v=>{ i.style.width=clamp(v,0,1)*100+'%'; }; if(!o.indeterminate) p.setValue(o.value||0); else i.style.width='38%';

  progress(){ return el('div','h-prog'); },
  chip(t){ return el('span','h-chip',esc(t)); },
  card(){ return el('div','h-card'); },
  empty(icon,text,sub){
    const e2=el('div','h-empty');
    e2.innerHTML=ic(icon)+'<div>'+esc(text)+'</div>'+(sub?'<div style="font-size:13px;opacity:.7">'+esc(sub)+'</div>':'');
    return e2;
  },
  spinner(items,sel,cb){
    const s=el('div','h-spin'); const t=el('span',null,esc(items[sel||0]));
    s.appendChild(t); s.appendChild(el('div','car'));
    s.onclick=e=>{ e.stopPropagation(); Holo.popup(s,items.map((L,i)=>({label:L,checked:i===(s._sel||sel||0),on:()=>{ s._sel=i; t.textContent=L; cb&&cb(i); }}))); };
    s._sel=sel||0; s.setSel=i=>{ s._sel=i; t.textContent=items[i]; };

  /* ---- popups: the overflow menu and the spinner list ---- */
  popup(anchor,items,o){
    o=o||{}; Holo.closePopup();
    const host=anchor.closest('.h-win')||$id('lcd');
    const p=el('div','h-popup');
    (typeof items==='function'?items():items).forEach(it=>{
      if(it.sep){ p.appendChild(el('div','it sep')); return; }
      const r=el('div','it'+(it.checked?' on':'')+(it.disabled?' disabled':''));
      r.innerHTML=(it.icon?'<span style="width:20px;display:flex">'+ic(it.icon)+'</span>':'')+'<span style="flex:1">'+esc(it.label)+'</span>'+(it.checked?'<span class="ck">'+ic('done')+'</span>':'');
      r.onclick=()=>{ Sound.click(); Holo.closePopup(); it.on&&it.on(); };
      p.appendChild(r);
    });
    host.appendChild(p);
    const ar=anchor.getBoundingClientRect(), hr=host.getBoundingClientRect(), s=dpScale();
    const w=p.offsetWidth, h=p.offsetHeight;
    let left=(ar.left-hr.left)/s, top=(ar.bottom-hr.top)/s+2;
    if(o.align==='right'||left+w>host.clientWidth-4) left=Math.max(4,(ar.right-hr.left)/s-w);
    if(top+h>host.clientHeight-4) top=Math.max(4,(ar.top-hr.top)/s-h-2);
    p.style.left=left+'px'; p.style.top=top+'px';
    Holo._popup=p;
    const off=e=>{ if(p.contains(e.target)) return; Holo.closePopup(); };
    setTimeout(()=>document.addEventListener('pointerdown',off,{once:true}),0);
    Holo._popupOff=off;
    return p;
  },
  closePopup(){ if(Holo._popup){ Holo._popup.remove(); Holo._popup=null; } if(Holo._popupOff){ document.removeEventListener('pointerdown',Holo._popupOff); Holo._popupOff=null; } },

  /* ---- dialogs ---- */
  dialog(spec){
    const host=spec.host||$id('sysoverlay');
    const scrim=el('div','h-scrim'); scrim.dataset.apptheme=spec.theme||(host===$id('sysoverlay')?'dark':(host.closest('[data-apptheme]')||{dataset:{}}).dataset.apptheme||'dark');
    const d=el('div','h-dialog');
    if(spec.title){ d.appendChild(el('div','dt',esc(spec.title))); d.appendChild(el('div','drule')); }
    const body=el('div','db'+(spec.tight?' tight':''));
    if(spec.bodyNode) body.appendChild(spec.bodyNode);
    else if(spec.html!=null) body.innerHTML=spec.html;
    else body.textContent=spec.message||'';
    d.appendChild(body);
    const close=()=>{ scrim.classList.remove('on'); setTimeout(()=>scrim.remove(),180); spec.onClose&&spec.onClose(); };
    if(spec.buttons&&spec.buttons.length){
      const bb=el('div','dbtns');
      spec.buttons.forEach(b=>{
        const btn=el('button',b.disabled?'disabled':null,esc(b.label));
        btn.onclick=()=>{ Sound.click(); if(b.on&&b.on()===false) return; close(); };
        bb.appendChild(btn);
      });
      d.appendChild(bb);
    }
    scrim.appendChild(d);
    if(spec.cancelable!==false) scrim.onclick=e=>{ if(e.target===scrim) close(); };
    host.appendChild(scrim); requestAnimationFrame(()=>scrim.classList.add('on'));
    return {el:scrim,close,body};
  },

  toast(msg,long){
    const host=$id('sysoverlay');
    if(Holo._toast) Holo._toast.remove();
    const t=el('div','h-toast'); t.dataset.apptheme='dark'; t.textContent=msg;
    host.appendChild(t); Holo._toast=t;
    requestAnimationFrame(()=>t.classList.add('on'));

    return t;
  },

  /* ---- semantic colour: applications ask for a role, never a value ---- */
  color(role,theme){
    return ThemeLayer.role(role,theme);
  }
};

Holo.titleBar=function(title,opts){

};

/* ==========================================================================
   MODULE 2 — THE THEME VARIANT LAYER (the behaviour half)
   --------------------------------------------------------------------------
   One attribute on the display decides which of two design systems the
   component sheet resolves against. Applications never read it. They never
   write it. They are not told when it changes. Everything they render
   changes anyway, because none of them drew their own chrome in the first
   place.

   That is the whole point of a compatibility requirement, and it is the
   exhibit's argument in one control: Google could mandate the theme, and
   the manufacturers could sit on top of it, and the visitor can do both.
   ========================================================================== */
const ThemeLayer={
  VARIANTS:[
    {id:'holo', name:'Stock Holo', full:'Android 4.0 Holo — the theme the Compatibility Definition Document required every device to carry, unmodified.'},
    {id:'orbit',name:'Kestrel Orbit UX 3.0', full:'An invented manufacturer skin, in the idiom of 2011: glossy, warm, round, heavy, shadowed. Not a reproduction of any real one.'}
  ],
  variant:'holo',
  /* roles an application may ask for when it genuinely needs a colour.
     It asks for the meaning; the layer supplies the value. */
  palette:{
    holo:{
      dark:     {warn:'#ff4444',ok:'#99cc00',caution:'#ffbb33',info:'#33b5e5',purple:'#aa66cc',
                 chart:['#33b5e5','#99cc00','#ffbb33','#aa66cc','#ff4444','#0099cc'],
                 ink:'#000000',paper:'#ffffff',onImage:'#ffffff',onImageDim:'rgba(255,255,255,.76)',
                 scrimInk:'rgba(255,255,255,.12)'},
      light:    {warn:'#cc0000',ok:'#669900',caution:'#ff8800',info:'#0099cc',purple:'#9933cc',
                 chart:['#0099cc','#669900','#ff8800','#9933cc','#cc0000','#33b5e5'],
                 ink:'#000000',paper:'#ffffff',onImage:'#ffffff',onImageDim:'rgba(255,255,255,.76)',
                 scrimInk:'rgba(0,0,0,.1)'}
    },
    orbit:{
      dark:     {warn:'#e0453c',ok:'#7ab33e',caution:'#f0a13c',info:'#5aa9e6',purple:'#b07ad0',
                 chart:['#f0a13c','#7ab33e','#5aa9e6','#b07ad0','#e0453c','#d9b74a'],
                 ink:'#0b0f16',paper:'#ffffff',onImage:'#fff6e9',onImageDim:'rgba(255,240,222,.78)',
                 scrimInk:'rgba(255,255,255,.1)'},
      light:    {warn:'#c0352c',ok:'#5f9130',caution:'#d1801f',info:'#3d86bd',purple:'#8f5fae',
                 chart:['#d1801f','#5f9130','#3d86bd','#8f5fae','#c0352c','#b09232'],
                 ink:'#16202c',paper:'#ffffff',onImage:'#fff6e9',onImageDim:'rgba(255,240,222,.78)',
                 scrimInk:'rgba(0,0,0,.09)'}
    }
  },
  /* roles that are simply tokens already declared in the stylesheet */
  CSSROLE:{accent:'--h-accent',accentDim:'--h-accent-dk',accentBright:'--h-accent-br',
           fg:'--h-fg',fgDim:'--h-fg2',fgFaint:'--h-fg3',bg:'--h-bg',bgAlt:'--h-bg2',
           divider:'--h-div',press:'--h-press',barBg:'--h-ab-bg',barFg:'--h-ab-fg',track:'--h-prog-track'},
  _probes:{},

  init(){
    this.variant=State.get('variant','holo');
    this.apply();
  },
  apply(){
    const lcd=$id('lcd'); lcd.dataset.variant=this.variant;
    document.body.dataset.variant=this.variant;
    const b=$id('btnSkin');
    if(b){ b.textContent='Skin: '+(this.variant==='orbit'?'on':'off'); b.classList.toggle('on',this.variant==='orbit'); }
    /* the launcher's wallpaper and the system icons are chrome too, so they
       follow the variant like everything else. */
    /* a change of design system is a CONFIGURATION CHANGE, which is the only
       thing an application is ever told: not what changed, only that
       something did. Android's own answer is to rebuild the activity; here
       each one is simply resumed, which re-runs whatever drawing it does
       into a canvas. No application learns which variant is active. */
    if(window.Stack&&Stack.ready) Stack.configurationChanged();
    if(window.Launcher&&Launcher.ready) Launcher.themeChanged();
    if(window.Notif&&Notif.ready) Notif.render();
    if(window.NavBar&&NavBar.ready) NavBar.render();
  },
  set(v){ this.variant=v; State.set('variant',v); this.apply(); },
  toggle(){
    this.set(this.variant==='holo'?'orbit':'holo');
    const n=this.VARIANTS.find(v=>v.id===this.variant);
    MToast.show('<b>'+esc(n.name)+'.</b> Every application on this phone just changed. Not one of them was told, and not one line of their code ran differently — the design system is a layer underneath them, which is exactly what the compatibility requirement was for.', 'skin');
    Guide.mark('skin');
  },
  isSkinned(){ return this.variant!=='orbit'?false:true; },
  probe(theme){
    let p=this._probes[theme];
    if(!p||!p.isConnected){
      p=el('div','h-win'); p.dataset.apptheme=theme; p.style.cssText='position:absolute;left:-9999px;top:0;width:1px;height:1px;visibility:hidden';
      $id('lcd').appendChild(p); this._probes[theme]=p;
    }
    return p;
  },
  role(name,theme){
    theme=theme||'dark';
    const css=this.CSSROLE[name];
    if(css){ const v=getComputedStyle(this.probe(theme)).getPropertyValue(css).trim(); if(v) return v; }
    const fam=(theme==='dark')?'dark':'light';
    const p=this.palette[this.variant][fam];
    if(name==='chart') return p.chart;
    if(p[name]!=null) return p[name];
    return '#888888';
  },
  chart(i,theme){ const c=this.role('chart',theme); return c[i%c.length]; }
};

/* ==========================================================================
   MODULE 3 — INTENT REGISTRY AND ACTIVITY STACK
   --------------------------------------------------------------------------
   Shared in design with this museum's Android 1.0 exhibit, because it is
   the same system three years later and the structure did not change: a
   component declares what it can do, another component hands work off
   without knowing who takes it, and the Back key walks out through the
   stack whether or not the activities below belong to the same program.

   What IS different in 4.0 is above this module, not in it — the Action
   Bar, Recents, the on-screen navigation. The plumbing stayed.
   ========================================================================== */
const Registry={
  pkgs:{}, comps:{}, defaults:{}, receivers:{}, providers:{},
  register(m){
    this.pkgs[m.pkg]=m;
    m.activities.forEach(a=>{
      a.pkg=m.pkg; a.manifest=m; a.full=m.pkg+'/'+a.name;
      if(!a.theme) a.theme=m.theme||'dark';
      this.comps[a.full]=a;
    });
    if(m.receivers) Object.keys(m.receivers).forEach(k=>{ (this.receivers[k]=this.receivers[k]||[]).push({pkg:m.pkg,fn:m.receivers[k]}); });
    if(m.providers) Object.keys(m.providers).forEach(k=>{ this.providers[k]=m.providers[k]; });
    return m;
  },
  pkg(p){ return this.pkgs[p]; },
  component(full){ return this.comps[full]; },
  launchers(){ return Object.values(this.comps).filter(c=>c.launcher&&!(Installer.hidden[c.pkg])); },
  provider(a){ return this.providers[a]; },
  /* resolve an intent to the components that declared they can take it */
  resolve(intent){
    const out=[];
    Object.values(this.comps).forEach(c=>{
      if(!c.filters) return;
      if(Installer.hidden[c.pkg]) return;
      const ok=c.filters.some(f=>{
        if(f.action!==intent.action) return false;
        if(f.scheme&&intent.uri){ const s=String(intent.uri).split(':')[0]; if(f.scheme.indexOf(s)<0) return false; }
        else if(f.scheme&&!intent.uri) return false;
        if(f.type&&intent.type){ if(!f.type.some(t=>t==='*/*'||t===intent.type||(t.endsWith('/*')&&intent.type.startsWith(t.slice(0,-1))))) return false; }
        else if(f.type&&!intent.type) return false;
        if(f.host&&intent.uri){ try{ const h=String(intent.uri).replace(/^[a-z]+:\/\//,'').split('/')[0]; if(f.host.indexOf(h)<0) return false; }catch(e){ return false; } }
        return true;
      });
      if(ok) out.push(c);
    });
    return out;
  },
  broadcast(action,extras){
    (this.receivers[action]||[]).forEach(r=>{ try{ r.fn(extras||{}); }catch(e){ console.warn('receiver',action,e); } });
  },
  defaultFor(intent){ return this.defaults[this.key(intent)]; },
  setDefault(intent,full){ this.defaults[this.key(intent)]=full; State.set('intentDefaults',this.defaults); },
  clearDefaults(){ this.defaults={}; State.set('intentDefaults',{}); },
  key(i){ return i.action+'|'+(i.type||'')+'|'+(i.uri?String(i.uri).split(':')[0]:''); }
};

const Intents={
  start(intent,opts){
    opts=opts||{};
    if(intent.component) return Stack.launch(Registry.component(intent.component),intent,opts);
    const cands=Registry.resolve(intent);
    if(!cands.length){
      Holo.toast('No application can perform this action.');
      return null;
    }
    if(cands.length===1) return Stack.launch(cands[0],intent,opts);
    const d=Registry.defaultFor(intent);
    if(d&&Registry.component(d)&&cands.some(c=>c.full===d)) return Stack.launch(Registry.component(d),intent,opts);
    return Chooser.show(cands,intent,opts);
  },
  view(uri,extras){ return this.start({action:'VIEW',uri,extras:extras||{}}); },
  send(type,extras){ return this.start({action:'SEND',type,extras:extras||{}}); }
};

/* the "Complete action using…" chooser, with its Always / Just once pair */
const Chooser={
  show(cands,intent,opts){
    const body=el('div');
    let chosen=null; const rows=[];
    let always=null, once=null;
    cands.forEach(c=>{
      const r=Holo.listItem({icon:Art.appIcon(c.pkg,40),title:c.manifest.label,
        sub:(c.label||null),
        on:()=>{ chosen=c; rows.forEach(x=>x.classList.remove('on')); r.classList.add('on');
                 if(always){ always.classList.remove('disabled'); once.classList.remove('disabled'); } }});
      rows.push(r); body.appendChild(r);
    });
    const d=Holo.dialog({title:'Complete action using',bodyNode:body,tight:true,theme:'dark',
      buttons:[
        {label:'Always',on:()=>{ if(!chosen) return false; Registry.setDefault(intent,chosen.full);
            Guide.mark('chooser'); Stack.launch(chosen,intent,opts); }},
        {label:'Just once',on:()=>{ if(!chosen) return false; Guide.mark('chooser'); Stack.launch(chosen,intent,opts); }}
      ]});
    const btns=$$('.dbtns button',d.el);
    always=btns[0]; once=btns[1];
    always.classList.add('disabled'); once.classList.add('disabled');
    return null;
  }
};

/* ---- the activity stack ----
   A flat stack of activity records, each tagged with the task it belongs
   to. Back pops one record; when the record below belongs to a different
   application you walk out into it, which is the behaviour that made an
   Android phone feel like one program rather than twenty. Recents lists
   the distinct tasks, newest first. */
const Stack={
  recs:[], tasks:[], host:null, ready:false, seq:1, atHome:true,
  init(){ this.host=$id('acts'); this.ready=true; },

  launch(comp,intent,opts){
    opts=opts||{};
    if(!comp){ Holo.toast('Application not found.'); return null; }
    intent=intent||{action:'MAIN'};
    const cur=this.top();
    const isMain=intent.action==='MAIN';
    let task=null;
    /* singleTask for a launcher intent: an application already running is
       brought forward rather than started again. */
    if(isMain&&!opts.newTask){
      task=this.tasks.find(t=>t.pkg===comp.pkg)||null;
      if(task){
        this.bringForward(task);
        const topRec=task.recs[task.recs.length-1];
        if(!intent.component||(topRec&&topRec.comp.full===comp.full)) return topRec;
      }
    }
    if(!task){
      if(isMain||opts.newTask||!cur){
        task={id:'t'+(this.seq++),pkg:comp.pkg,label:comp.manifest.label,recs:[],last:Date.now()};
        this.tasks.push(task);
      } else {
        /* started by another activity: it joins the CALLER's task, which is
           how Back walks out through four applications as though they were
           one. */
        task=cur.task;
      }
    }
    const rec={id:'a'+(this.seq++),comp,intent,task,root:null,inst:null,opts};
    task.recs.push(rec); task.last=Date.now();
    this.recs.push(rec);
    this.mount(rec);
    this.showLauncher(false);
    this.afterChange(cur);
    return rec;
  },
  mount(rec){
    const wrap=el('div','actwrap entering');
    wrap.dataset.act=rec.comp.full;
    const win=Holo.window(rec.comp.theme);
    wrap.appendChild(win);
    rec.root=wrap; rec.win=win;
    this.host.appendChild(wrap);
    const ctx={
      rec, finish:(r)=>this.finish(rec,r), intent:rec.intent,
      pkg:rec.comp.pkg, label:rec.comp.manifest.label,
      setTheme:(t)=>{ win.dataset.apptheme=t; }
    };
    try{ rec.inst=rec.comp.create(rec.intent,win,ctx)||{}; }
    catch(e){ console.error('activity',rec.comp.full,e); rec.inst={}; win.appendChild(Holo.empty('warn','This application has stopped.',String(e.message||e))); }
    setTimeout(()=>wrap.classList.remove('entering'),300);
    rec.inst.resume&&rec.inst.resume();
  },
  top(){ return this.recs[this.recs.length-1]||null; },
  /* what the visitor is actually looking at: nothing, when the launcher is
     in front, even though the tasks are all still alive behind it. */
  foreground(){ return this.atHome?null:this.top(); },
  topComp(){ const t=this.top(); return t?t.comp:null; },
  finish(rec,result){
    const i=this.recs.indexOf(rec); if(i<0) return;
    this.recs.splice(i,1);
    const ti=rec.task.recs.indexOf(rec); if(ti>=0) rec.task.recs.splice(ti,1);
    rec.inst&&rec.inst.pause&&rec.inst.pause();
    rec.inst&&rec.inst.destroy&&rec.inst.destroy();
    rec.root.classList.add('leaving');
    setTimeout(()=>rec.root.remove(),220);
    if(!rec.task.recs.length){ const k=this.tasks.indexOf(rec.task); if(k>=0) this.tasks.splice(k,1); }
    const nt=this.top();
    if(nt){ nt.root.classList.remove('hidden'); nt.inst&&nt.inst.resume&&nt.inst.resume(); if(result&&nt.inst&&nt.inst.result) nt.inst.result(result); }
    this.afterChange(null,true);
  },
  back(){
    if(Holo._popup){ Holo.closePopup(); return true; }
    const scr=$$('.h-scrim',$id('sysoverlay')); if(scr.length){ scr[scr.length-1].click(); return true; }
    if(Folder.open){ Folder.close(); return true; }
    if(AllApps.open){ AllApps.hide(); return true; }
    if(Notif.shadeOpen){ Notif.closeShade(); return true; }
    if(Recents.open){ Recents.hide(); return true; }
    const t=this.top(); if(!t){ return false; }
    if(t.inst&&t.inst.back&&t.inst.back()) return true;
    this.finish(t);
    return true;
  },
  home(){
    Holo.closePopup(); Recents.hide(); Notif.closeShade(); AllApps.hide(); Folder.close();
    const t=this.top();
    if(t){ t.inst&&t.inst.pause&&t.inst.pause(); }
    this.recs.forEach(r=>r.root.classList.add('hidden'));
    this.showLauncher(true);
    this.afterChange();
  },
  showLauncher(v){ $id('home').style.display=v?'':'none'; this.atHome=v; if(v) Launcher.resume(); },
  bringForward(task){
    task.last=Date.now();
    /* move the task's records to the top, keeping their internal order */
    this.recs=this.recs.filter(r=>r.task!==task).concat(task.recs);
    this.recs.forEach(r=>r.root.classList.add('hidden'));
    const t=this.top(); if(t){ t.root.classList.remove('hidden'); t.inst&&t.inst.resume&&t.inst.resume(); }
    this.showLauncher(false);
    this.afterChange();
  },
  removeTask(task){
    task.recs.slice().forEach(r=>{
      r.inst&&r.inst.destroy&&r.inst.destroy();
      r.root.remove();
      const i=this.recs.indexOf(r); if(i>=0) this.recs.splice(i,1);
    });
    const k=this.tasks.indexOf(task); if(k>=0) this.tasks.splice(k,1);
    if(!this.recs.length) this.showLauncher(true);
    this.afterChange();
  },
  afterChange(prev){
    const t=this.top();
    if(!t) this.showLauncher(true);
    if(this.atHome){
      this.recs.forEach(r=>r.root.classList.add('hidden'));
    } else {
      this.recs.forEach((r,i)=>r.root.classList.toggle('hidden',i!==this.recs.length-1));
      if(t) t.inst&&t.inst.resume&&t.inst.resume();
    }
    if(prev&&prev!==t&&prev.inst&&prev.inst.pause) prev.inst.pause();
    NavBar.render();
    Sys.applyImmersive();
  },
  /* the legacy Menu affordance depends on what is in front, so ask it */
  legacyMenu(){
    const t=this.foreground();
    if(!t) return null;
    if((t.comp.manifest.targetSdk||14)>=11) return null;
    return (t.inst&&t.inst.menu)?t.inst.menu():[];
  },
  currentPkg(){ const t=this.top(); return t?t.comp.pkg:'org.museum.home'; },
  configurationChanged(){
    Registry.broadcast('CONFIGURATION_CHANGED',{});
    this.recs.forEach(r=>{ try{ r.inst&&r.inst.resume&&r.inst.resume(); }catch(e){ console.warn('resume',e); } });
  }
};

/* ==========================================================================
   MODULE 4 — THE NOTIFICATION SERVICE
   --------------------------------------------------------------------------
   Android's shade was three years old by this release and this is where it
   grew the feature that mattered most: any single notification can be
   thrown sideways off the screen and dismissed on its own. The competing
   platform would not have that for years.

   What is NOT here is as important. There are no quick settings tiles —
   those arrive in 4.2, two releases later. There are no notifications on
   the lock screen — 5.0. There is a settings shortcut and a clear-all
   button in the header, and an ongoing section that cannot be swiped away,
   and that is the whole shade in 2011.

   Note, honestly, what the SKIN adds: a row of toggles at the top. Several
   manufacturers shipped that a year before Google did, which is a real and
   slightly awkward part of the record.
   ========================================================================== */
const Notif={
  items:[], shadeOpen:false, ready:false, _y:0,
  init(){
    this.items=State.get('notifs',[]).map(n=>Object.assign({},n));
    const sh=$id('shade');
    sh.innerHTML='<div class="shead"><span class="car"></span><span class="ic" data-a="settings"></span><span class="ic" data-a="clear"></span></div>'
      +'<div class="stoggles"></div><div class="slist"></div><div class="handle"></div>';
    sh.querySelector('[data-a="settings"]').innerHTML=ic('settings');
    sh.querySelector('[data-a="clear"]').innerHTML=ic('close');
    sh.querySelector('[data-a="settings"]').onclick=()=>{ this.closeShade(); Intents.start({action:'MAIN',component:'org.museum.settings/Main'}); };
    sh.querySelector('[data-a="clear"]').onclick=()=>{ this.clearAll(); };
    this.bindDrag();
    this.ready=true; this.render(); this.renderStatus();
    setInterval(()=>this.renderStatus(),20000);
  },
  save(){ State.set('notifs',this.items.map(n=>{ const c=Object.assign({},n); delete c.iconNode; return c; })); },

  post(n){
    n=Object.assign({id:uid('n'),when:Date.now(),pkg:'org.museum.system'},n);
    const i=this.items.findIndex(x=>x.id===n.id);
    if(i>=0) this.items[i]=n; else this.items.unshift(n);
    this.items.sort((a,b)=>(b.ongoing?1:0)-(a.ongoing?1:0)||b.when-a.when);
    this.save(); this.render(); this.renderStatus();
    if(n.ticker!==false&&!this.shadeOpen) this.tick(n);
    if(!n.silent){ n.pkg==='org.museum.messaging'?Sound.message():Sound.notify(); Device.led(n.led||ThemeLayer.role('accent')); }
    Registry.broadcast('NOTIFICATION_POSTED',{id:n.id,pkg:n.pkg});
    return n.id;
  },
  cancel(id){ const i=this.items.findIndex(x=>x.id===id); if(i>=0){ this.items.splice(i,1); this.save(); this.render(); this.renderStatus(); } },
  cancelPkg(pkg){ this.items=this.items.filter(n=>n.pkg!==pkg); this.save(); this.render(); this.renderStatus(); },
  get(id){ return this.items.find(x=>x.id===id); },
  clearAll(){
    const keep=this.items.filter(n=>n.ongoing);
    const cleared=this.items.length-keep.length;
    this.items=keep; this.save(); this.render(); this.renderStatus();
    if(cleared) Guide.mark('clearall');
    if(!this.items.length) setTimeout(()=>this.closeShade(),160);
  },
  tick(n){
    const sb=$id('statusbar').querySelector('.tick'); if(!sb) return;
    sb.textContent=(n.title||'')+(n.text?'  '+n.text:'');
    sb.style.opacity='1';
    clearTimeout(this._tk); this._tk=setTimeout(()=>{ sb.style.opacity='0'; setTimeout(()=>{ sb.textContent=''; sb.style.opacity=''; },300); },3200);
  },

  render(){
    if(!this.ready) return;
    const sh=$id('shade'), list=sh.querySelector('.slist');
    sh.querySelector('.car').textContent=Sys.carrier()+'  ·  '+fmtDate(Date.now());
    /* the toggles row exists only under the skin. Stock Holo has none and
       will not have any until 4.2, which the guide says plainly. */
    const tg=sh.querySelector('.stoggles');
    if(ThemeLayer.variant==='orbit'){
      tg.style.display='flex';
      if(!tg.dataset.built){
        tg.dataset.built='1';
        [['wifi','Wi-Fi','wifi'],['bluetooth','BT','bt'],['data','Data','data'],['brightness','Bright','bright'],['sync','Sync','sync']].forEach(t=>{
          const b=el('div','tg'); b.dataset.k=t[2]; b.innerHTML=ic(t[0])+'<span>'+t[1]+'</span>';
          b.onclick=()=>{ Sys.toggle(t[2]); this.render(); };
          tg.appendChild(b);
        });
      }
      $$('.tg',tg).forEach(b=>b.classList.toggle('on',!!Sys.flags[b.dataset.k]));
    } else tg.style.display='none';

    list.innerHTML='';
    if(!this.items.length){ list.appendChild(el('div','empty','No notifications')); return; }
    const ongoing=this.items.filter(n=>n.ongoing), latest=this.items.filter(n=>!n.ongoing);
    if(ongoing.length){ list.appendChild(el('div','nsec','Ongoing')); ongoing.forEach(n=>list.appendChild(this.row(n))); }
    if(latest.length){ if(ongoing.length) list.appendChild(el('div','nsec','Notifications')); latest.forEach(n=>list.appendChild(this.row(n))); }
  },
  row(n){
    const r=el('div','nrow'+(n.ongoing?' ongoing':''));
    const ico=el('div','nico'); ico.innerHTML=Art.appIcon(n.pkg,26); r.appendChild(ico);
    const b=el('div','nbody');
    b.appendChild(el('div','nt',esc(n.title||'')));
    if(n.text) b.appendChild(el('div','nx'+(n.wrap?' wrap':''),esc(n.text)));
    if(n.text2) b.appendChild(el('div','nx',esc(n.text2)));
    if(n.progress!=null){ const p=el('div','nprog'); const i=el('i'); i.style.width=clamp(n.progress,0,1)*100+'%'; p.appendChild(i); b.appendChild(p); }
    r.appendChild(b);
    r.appendChild(el('div','ntime',fmtClockShort(new Date(n.when))));
    r.onclick=()=>{
      if(n.intent){ this.closeShade(); setTimeout(()=>{ Intents.start(n.intent); },180); }
      if(n.autoCancel!==false&&!n.ongoing) this.cancel(n.id);
    };
    /* swipe it away — the new thing in this release */
    if(!n.ongoing){
      let x=0, w=0;
      onDrag(r,{threshold:5,
        start:()=>{ w=r.offsetWidth; r.classList.add('swiping'); },
        move:({dx,dy})=>{ if(Math.abs(dx)<Math.abs(dy)) return; x=dx/dpScale(); r.style.transform='translateX('+x+'px)'; r.style.opacity=String(clamp(1-Math.abs(x)/(w*0.9),0.05,1)); },
        end:()=>{
          r.classList.remove('swiping');
          if(Math.abs(x)>w*0.35){
            r.style.transition='transform .16s,opacity .16s';
            r.style.transform='translateX('+(x>0?w:-w)+'px)'; r.style.opacity='0';
            Sound.tick(); Guide.mark('swipedismiss');
            setTimeout(()=>this.cancel(n.id),150);
          } else { r.style.transition='transform .16s,opacity .16s'; r.style.transform=''; r.style.opacity=''; setTimeout(()=>{ r.style.transition=''; },180); }
          x=0;
        }});
    }
    return r;
  },
  renderStatus(){
    const sb=$id('statusbar');
    if(!sb.dataset.built){
      sb.dataset.built='1';
      sb.innerHTML='<div class="nicons"></div><div class="tick"></div><div class="sysicons"></div><div class="clk"></div>';
    }
    const ni=sb.querySelector('.nicons');
    ni.innerHTML='';
    const seen={};
    this.items.slice(0,6).forEach(n=>{ if(seen[n.pkg+(n.statusIcon||'')]) return; seen[n.pkg+(n.statusIcon||'')]=1;
      const s=el('span'); s.innerHTML=n.statusIcon?ic(n.statusIcon):Art.appIcon(n.pkg,15); s.style.cssText='width:15px;height:15px;display:block'; ni.appendChild(s); });
    const sy=sb.querySelector('.sysicons');
    sy.innerHTML=(Sys.flags.airplane?ic('airplane'):'')
      +(Sys.flags.wifi?ic('wifi'):'')
      +(Sys.flags.airplane?'':(Sys.flags.data?ic('signal'):'<span style="opacity:.4">'+ic('signal')+'</span>'))
      +(Sys.flags.bt?ic('bluetooth'):'')
      +(Device.silent?ic('vibrate'):'')
      +Art.batteryIcon(Device.battery,Device.charging);
    sb.querySelector('.clk').textContent=fmtClockShort(new Date());
  },

  /* ---- the shade gesture ---- */
  bindDrag(){
    const sh=$id('shade'), grab=$id('shadegrab');
    let openH=0, from=0;
    const H=()=>sh.offsetHeight;
    onDrag(grab,{
      start:()=>{ if(Keyguard.locked) return; sh.classList.remove('anim'); from=this.shadeOpen?0:-H(); openH=H(); },
      move:({dy})=>{ if(Keyguard.locked) return; const y=clamp(from+dy/dpScale(),-openH,0); sh.style.transform='translateY('+y+'px)'; this._y=y; },
      end:()=>{ if(Keyguard.locked) return; sh.classList.add('anim'); if(this._y>-openH*0.6) this.openShade(); else this.closeShade(); }
    });
    onDrag(sh.querySelector('.handle'),{
      start:()=>{ sh.classList.remove('anim'); openH=H(); from=0; },
      move:({dy})=>{ const y=clamp(from+dy/dpScale(),-openH,0); sh.style.transform='translateY('+y+'px)'; this._y=y; },
      end:()=>{ sh.classList.add('anim'); if(this._y>-openH*0.6) this.openShade(); else this.closeShade(); }
    });
    sh.querySelector('.handle').onclick=()=>this.closeShade();
    grab.onclick=()=>{ if(!this.shadeOpen&&!Keyguard.locked) this.openShade(); };
  },
  openShade(){ const sh=$id('shade'); this.render(); sh.classList.add('anim'); sh.style.transform='translateY(0)'; this.shadeOpen=true; Device.led(null); Guide.mark('shade'); },
  closeShade(){ const sh=$id('shade'); sh.classList.add('anim'); sh.style.transform=''; this.shadeOpen=false; },
  toggleShade(){ this.shadeOpen?this.closeShade():this.openShade(); }
};

/* ==========================================================================
   THE MUSEUM TOAST — the exhibit talking, not the phone.
   ========================================================================== */
const MToast={
  show(html,guideTab){
    const t=$id('mtoast');
    t.innerHTML=html+(guideTab?' <span class="gbtn" data-t="'+guideTab+'">Guide &rsaquo;</span>':'');
    t.classList.add('show');
    const b=t.querySelector('.gbtn'); if(b) b.onclick=()=>{ Guide.open(b.dataset.t); t.classList.remove('show'); };
    clearTimeout(this._t); this._t=setTimeout(()=>t.classList.remove('show'),guideTab?9000:5200);
  },
  hide(){ $id('mtoast').classList.remove('show'); }
};

/* ==========================================================================
   MODULE 7 — THE NAVIGATION BAR AND THE TASK MODEL
   --------------------------------------------------------------------------
   Three buttons, drawn on the screen, and nothing on the front of the
   handset at all. This is the release that did it, and the industry
   followed within three years.

   The fourth button is the exhibit's favourite accident. Applications built
   against an older platform still expected a hardware Menu key, so the
   system gave them one: a three-dot button that appears in the navigation
   bar only while such an application is in the foreground, and vanishes
   when it closes. It was meant as compatibility. What it became was a
   public mark of an application nobody had updated — a shaming device that
   the platform did not set out to build.
   ========================================================================== */
const NavBar={
  ready:false,
  init(){ this.ready=true; this.render(); },
  render(){
    if(!this.ready) return;
    const nb=$id('navbar');
    const legacy=Stack.legacyMenu();
    nb.className=legacy?'legacy':'';
    const mk=(k,title,icon)=>{ const b=el('div','nb'+(k==='menu'?' menu':'')); b.dataset.k=k; b.title=title;
      b.innerHTML=k==='menu'?'<i></i>':ic(icon); return b; };
    nb.innerHTML='';
    const grp=el('div','grp');
    grp.appendChild(mk('back','Back','back'));
    grp.appendChild(mk('home','Home','home'));
    grp.appendChild(mk('recents','Recent apps','recents'));
    nb.appendChild(grp);
    if(legacy){ const m=mk('menu','Menu — this application was built before Android 3.0 and still expects a hardware Menu key'); nb.appendChild(m); }
    $$('.nb',nb).forEach(b=>{
      b.onclick=()=>{
        Sound.click();
        if(b.dataset.k==='back') Stack.back();
        else if(b.dataset.k==='home') Stack.home();
        else if(b.dataset.k==='recents') Recents.toggle();
        else if(b.dataset.k==='menu') this.legacyMenu(b);
      };
    });
    if(legacy&&!State.get('sawLegacy')){
      State.set('sawLegacy',true);
      setTimeout(()=>{ MToast.show('<b>A fourth button just appeared.</b> This application was built before Android 3.0 and still expects a hardware Menu key, so the system draws one for it. It is a compatibility measure that became a public mark of an application nobody had updated.','legacy'); },700);
    }
    Guide.mark(legacy?'legacy':null);
  },
  legacyMenu(anchor){
    const items=Stack.legacyMenu()||[];
    if(!items.length){ Holo.toast('No menu items.'); return; }
    Holo.popup(anchor,items.map(i=>({label:i.label,icon:i.icon,on:i.on})),{align:'right'});
  }
};

/* ---- Recents: the card stack ---- */
const Recents={
  open:false,
  init(){ this.el=$id('recents'); },
  toggle(){ this.open?this.hide():this.show(); },
  show(){
    if(Keyguard.locked) return;
    Holo.closePopup(); Notif.closeShade(); AllApps.hide(); Folder.close();
    const sc=this.el.querySelector('.rscroll'); sc.innerHTML='';
    const tasks=Stack.tasks.slice().sort((a,b)=>a.last-b.last);
    const emp=this.el.querySelector('.rempty');
    if(!tasks.length){
      emp.textContent='No recent apps.';
      emp.style.display='flex';
    } else { emp.style.display='none'; }
    tasks.forEach(t=>sc.appendChild(this.card(t)));
    this.el.classList.add('on'); this.open=true;
    sc.scrollTop=sc.scrollHeight;
    Guide.mark('recents');
  },
  hide(){ this.el.classList.remove('on'); this.open=false; },
  card(task){
    const c=el('div','rcard');
    const lab=el('div','rlabel');
    lab.innerHTML='<div class="ri">'+Art.appIcon(task.pkg,26)+'</div><div class="rn">'+esc(task.label)+'</div>';
    c.appendChild(lab);
    const th=el('div','rthumb');
    const inner=el('div','inner');
    /* a live thumbnail: the activity's own tree, cloned where it stands.
       This is the webOS idea — the card IS the application, paused. */
    const rec=task.recs[task.recs.length-1];
    if(rec&&rec.win){
      const clone=rec.win.cloneNode(true);
      $$('input,textarea',clone).forEach(n=>{ n.disabled=true; });
      $$('canvas',clone).forEach(n=>{ n.style.background='#111'; });
      inner.appendChild(clone);
    }
    th.appendChild(inner); th.appendChild(el('div','shine'));
    c.appendChild(th);
    requestAnimationFrame(()=>{
      const w=th.clientWidth, h=th.clientHeight;
      const s=Math.max(w/360,h/640);
      inner.style.transform='scale('+s+')';
      inner.style.width=(w/s)+'px'; inner.style.height=(h/s)+'px';
    });
    c.onclick=()=>{ this.hide(); Stack.bringForward(task); };
    /* throw it away sideways, exactly as webOS did */
    let x=0,w=0;
    onDrag(c,{threshold:6,
      start:()=>{ w=c.offsetWidth; c.classList.add('nodown'); },
      move:({dx,dy})=>{ if(Math.abs(dx)<Math.abs(dy)) return; x=dx/dpScale(); c.style.transform='translateX('+x+'px)'; c.style.opacity=String(clamp(1-Math.abs(x)/(w*0.8),0.05,1)); },
      end:()=>{
        c.classList.remove('nodown');
        if(Math.abs(x)>w*0.3){
          c.style.transform='translateX('+(x>0?w*1.2:-w*1.2)+'px)'; c.style.opacity='0';
          Sound.tick(); Guide.mark('swipecard');
          setTimeout(()=>{ c.style.height='0'; c.style.margin='0'; c.remove(); Stack.removeTask(task);
            if(!Stack.tasks.length){ const emp=this.el.querySelector('.rempty'); emp.textContent='No recent apps.'; emp.style.display='flex'; } },170);
        } else { c.style.transform=''; c.style.opacity=''; }
        x=0;
      }});
    return c;
  }
};

  /* ---- generated photographs ----
     Every picture in this exhibit is a function of its own name. No file
     is ever fetched; the same string always paints the same picture. */
  photo(key,w,h){
    w=w||320; h=h||240;
    const r=seeded(hashStr(key));
    const kind=['landscape','portraitish','city','still','abstract'][Math.floor(r()*5)];
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const g=c.getContext('2d');
    const hue=Math.floor(r()*360);
    if(kind==='landscape'){
      const sky=g.createLinearGradient(0,0,0,h*0.62);
      sky.addColorStop(0,'hsl('+((hue+200)%360)+',55%,'+(28+r()*18)+'%)');
      sky.addColorStop(1,'hsl('+((hue+30)%360)+',60%,'+(62+r()*18)+'%)');
      g.fillStyle=sky; g.fillRect(0,0,w,h*0.66);
      g.fillStyle='hsla('+((hue+40)%360)+',70%,88%,.9)';
      g.beginPath(); g.arc(w*(0.2+r()*0.6),h*(0.15+r()*0.2),h*0.06,0,7); g.fill();
      for(let L=0;L<3;L++){
        g.fillStyle='hsl('+((hue+170+L*12)%360)+',30%,'+(30-L*7)+'%)';
        g.beginPath(); g.moveTo(0,h);
        let y=h*(0.5+L*0.07);
        g.lineTo(0,y);
        for(let x=0;x<=w;x+=w/9){ y+=(r()-0.5)*h*0.12; g.lineTo(x,clamp(y,h*0.32,h*0.86)); }
        g.lineTo(w,h); g.closePath(); g.fill();
      }
      g.fillStyle='hsl('+((hue+150)%360)+',32%,16%)'; g.fillRect(0,h*0.84,w,h*0.16);
    } else if(kind==='city'){
      const sky=g.createLinearGradient(0,0,0,h); sky.addColorStop(0,'hsl('+hue+',40%,14%)'); sky.addColorStop(1,'hsl('+((hue+40)%360)+',55%,34%)');
      g.fillStyle=sky; g.fillRect(0,0,w,h);
      let x=0;
      while(x<w){ const bw=w*(0.06+r()*0.1), bh=h*(0.25+r()*0.55);
        g.fillStyle='hsl('+((hue+r()*30)%360)+',18%,'+(8+r()*12)+'%)'; g.fillRect(x,h-bh,bw,bh);
        for(let wy=h-bh+6;wy<h-6;wy+=9) for(let wx=x+4;wx<x+bw-5;wx+=8) if(r()>0.45){ g.fillStyle='hsla(45,90%,72%,'+(0.3+r()*0.6)+')'; g.fillRect(wx,wy,3,4); }
        x+=bw+2; }
    } else if(kind==='portraitish'){
      g.fillStyle='hsl('+hue+',26%,'+(24+r()*22)+'%)'; g.fillRect(0,0,w,h);
      const cx=w*0.5, cy=h*0.56, rr=Math.min(w,h)*0.3;
      g.fillStyle='hsl('+(20+r()*22)+',38%,'+(52+r()*22)+'%)';
      g.beginPath(); g.ellipse(cx,cy-rr*0.35,rr*0.78,rr,0,0,7); g.fill();
      g.beginPath(); g.moveTo(cx-rr*1.5,h); g.quadraticCurveTo(cx,cy+rr*0.4,cx+rr*1.5,h); g.fill();
      g.fillStyle='rgba(0,0,0,.65)';
      g.beginPath(); g.ellipse(cx-rr*0.3,cy-rr*0.55,rr*0.09,rr*0.06,0,0,7); g.fill();
      g.beginPath(); g.ellipse(cx+rr*0.3,cy-rr*0.55,rr*0.09,rr*0.06,0,0,7); g.fill();
    } else if(kind==='still'){
      g.fillStyle='hsl('+hue+',18%,'+(78+r()*14)+'%)'; g.fillRect(0,0,w,h);
      for(let i=0;i<5;i++){ g.fillStyle='hsla('+((hue+i*47)%360)+',58%,'+(40+r()*24)+'%,.9)';
        const s=Math.min(w,h)*(0.12+r()*0.22);
        g.beginPath(); g.ellipse(w*(0.2+r()*0.6),h*(0.3+r()*0.5),s,s*(0.6+r()*0.6),r()*3,0,7); g.fill(); }
      g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(0,h*0.82,w,h*0.18);
    } else {
      g.fillStyle='hsl('+hue+',40%,12%)'; g.fillRect(0,0,w,h);
      for(let i=0;i<26;i++){ g.strokeStyle='hsla('+((hue+i*9)%360)+',80%,'+(45+r()*30)+'%,.65)'; g.lineWidth=1+r()*3;
        g.beginPath(); g.moveTo(r()*w,r()*h); g.bezierCurveTo(r()*w,r()*h,r()*w,r()*h,r()*w,r()*h); g.stroke(); }
    }
    /* film: a little vignette so the pictures read as photographs */
    const v=g.createRadialGradient(w/2,h/2,Math.min(w,h)*0.2,w/2,h/2,Math.max(w,h)*0.75);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.38)');
    g.fillStyle=v; g.fillRect(0,0,w,h);
    return c.toDataURL('image/jpeg',0.72);
  },
  photoImg(key,w,h,style){ return '<img src="'+this.photo(key,w,h)+'" style="width:100%;height:100%;object-fit:cover;display:block;'+(style||'')+'" alt="">'; },

  avatar(name,size){
    size=size||40;
    const r=seeded(hashStr(name));
    const hue=Math.floor(r()*360);
    const init=String(name||'?').split(/\s+/).map(s=>s[0]||'').slice(0,2).join('').toUpperCase();
    const skin='hsl('+(18+r()*20)+','+(30+r()*20)+'%,'+(46+r()*30)+'%)';
    const hair='hsl('+(r()<0.3?(30+r()*20):(r()*40))+','+(20+r()*40)+'%,'+(10+r()*32)+'%)';
    if(hashStr(name)%5===0){
      /* a few contacts simply have no photograph, as they never do */
      return '<svg viewBox="0 0 48 48" width="'+size+'" height="'+size+'" style="display:block">'
        +'<rect width="48" height="48" fill="hsl('+hue+',26%,34%)"/>'
        +'<text x="24" y="31" font-family="sans-serif" font-size="18" font-weight="500" fill="#ffffff" text-anchor="middle">'+esc(init)+'</text></svg>';
    }
    return '<svg viewBox="0 0 48 48" width="'+size+'" height="'+size+'" style="display:block">'
      +'<rect width="48" height="48" fill="hsl('+hue+',34%,'+(26+r()*24)+'%)"/>'
      +'<circle cx="24" cy="21" r="10" fill="'+skin+'"/>'
      +'<path d="M14 21a10 10 0 0 1 20 0c0-7-3-10-10-10s-10 3-10 10z" fill="'+hair+'"/>'
      +'<path d="M6 48c0-9 8-13 18-13s18 4 18 13z" fill="hsl('+((hue+180)%360)+',36%,'+(34+r()*20)+'%)"/>'
      +'<circle cx="20.5" cy="21" r="1.3" fill="#1a1a1a"/><circle cx="27.5" cy="21" r="1.3" fill="#1a1a1a"/>'
      +'<path d="M21 26a4 4 0 0 0 6 0" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="1.2" stroke-linecap="round"/></svg>';
  },

  /* the owner's face, for Face Unlock and for the photograph that defeats it */
  ownerFace(w,h,opts){
    opts=opts||{};
    const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
    g.fillStyle=opts.paper?'#f2efe8':'#10131a'; g.fillRect(0,0,w,h);
    if(!opts.paper){ const bg=g.createRadialGradient(w/2,h*0.4,10,w/2,h*0.5,w*0.8);
      bg.addColorStop(0,'#26303c'); bg.addColorStop(1,'#0a0d12'); g.fillStyle=bg; g.fillRect(0,0,w,h); }
    const cx=w/2, cy=h*0.52, R=Math.min(w,h)*0.3;
    g.save(); g.translate(cx,cy);
    if(opts.tilt) g.rotate(opts.tilt);
    /* neck and shoulders */
    g.fillStyle='#c98f6e'; g.fillRect(-R*0.3,R*0.55,R*0.6,R*0.6);
    g.fillStyle=opts.paper?'#4a5d7a':'#324a63';
    g.beginPath(); g.moveTo(-R*2.2,h); g.quadraticCurveTo(0,R*0.75,R*2.2,h); g.fill();
    /* head */
    g.fillStyle='#e0aa85';
    g.beginPath(); g.ellipse(0,0,R*0.78,R,0,0,7); g.fill();
    /* hair */
    g.fillStyle='#3a2a20';
    g.beginPath(); g.ellipse(0,-R*0.34,R*0.82,R*0.66,0,Math.PI,0); g.fill();
    g.beginPath(); g.ellipse(-R*0.66,-R*0.1,R*0.16,R*0.42,0.2,0,7); g.fill();
    g.beginPath(); g.ellipse(R*0.66,-R*0.1,R*0.16,R*0.42,-0.2,0,7); g.fill();
    /* eyes */
    const ey=-R*0.12;
    [-1,1].forEach(s=>{
      g.fillStyle='#fdfdfb'; g.beginPath(); g.ellipse(s*R*0.32,ey,R*0.15,R*0.09,0,0,7); g.fill();
      g.fillStyle='#4a3626'; g.beginPath(); g.arc(s*R*0.32+(opts.gaze||0)*R*0.05,ey,R*0.07,0,7); g.fill();
      g.fillStyle='#14100c'; g.beginPath(); g.arc(s*R*0.32+(opts.gaze||0)*R*0.05,ey,R*0.032,0,7); g.fill();
      g.strokeStyle='#3a2a20'; g.lineWidth=R*0.045; g.beginPath();
      g.arc(s*R*0.32,ey-R*0.02,R*0.17,Math.PI*1.15,Math.PI*1.85); g.stroke();
    });
    /* nose and mouth */
    g.strokeStyle='rgba(120,80,55,.7)'; g.lineWidth=R*0.035;
    g.beginPath(); g.moveTo(0,ey+R*0.06); g.lineTo(-R*0.06,ey+R*0.3); g.lineTo(R*0.04,ey+R*0.33); g.stroke();
    g.strokeStyle='#a8563f'; g.lineWidth=R*0.055;
    g.beginPath(); g.arc(0,ey+R*0.42,R*0.24,0.25,Math.PI-0.25); g.stroke();
    g.restore();
    if(opts.paper){
      /* the print: a slight gloss and a white border, because this is a
         photograph someone had printed, and that is all it took. */
      const gl=g.createLinearGradient(0,0,w,h);
      gl.addColorStop(0,'rgba(255,255,255,.22)'); gl.addColorStop(.5,'rgba(255,255,255,0)'); gl.addColorStop(1,'rgba(255,255,255,.12)');
      g.fillStyle=gl; g.fillRect(0,0,w,h);
      g.strokeStyle='#ffffff'; g.lineWidth=Math.max(4,w*0.03); g.strokeRect(0,0,w,h);
    }
    return c;
  },

  albumArt(key,size){
    const s=size||160, r=seeded(hashStr(key));
    const c=document.createElement('canvas'); c.width=s; c.height=s; const g=c.getContext('2d');
    const hue=Math.floor(r()*360);
    g.fillStyle='hsl('+hue+',42%,'+(16+r()*22)+'%)'; g.fillRect(0,0,s,s);
    const style=Math.floor(r()*4);
    if(style===0){ for(let i=0;i<7;i++){ g.fillStyle='hsla('+((hue+i*22)%360)+',70%,'+(40+i*5)+'%,.85)'; g.fillRect(0,s*i/7,s,s/14); } }
    else if(style===1){ g.fillStyle='hsl('+((hue+180)%360)+',72%,58%)'; g.beginPath(); g.arc(s/2,s/2,s*0.3,0,7); g.fill();
      g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=2; g.beginPath(); g.arc(s/2,s/2,s*0.4,0,7); g.stroke(); }
    else if(style===2){ for(let i=0;i<24;i++){ g.fillStyle='hsla('+((hue+i*15)%360)+',65%,55%,.5)';
      g.beginPath(); g.moveTo(r()*s,r()*s); g.lineTo(r()*s,r()*s); g.lineTo(r()*s,r()*s); g.fill(); } }
    else { g.fillStyle='hsl('+((hue+40)%360)+',70%,52%)'; g.fillRect(s*0.14,s*0.14,s*0.72,s*0.72);
      g.fillStyle='hsl('+hue+',45%,14%)'; g.fillRect(s*0.28,s*0.28,s*0.44,s*0.44); }
    return c.toDataURL('image/png');
  },

  /* a neutral placeholder where a manufacturer's or an operator's mark sat */
  placeholder(w,h,label){
    return '<div style="width:'+w+'px;height:'+h+'px;border:1px dashed rgba(255,255,255,.28);border-radius:2px;'
      +'display:flex;align-items:center;justify-content:center;font-size:8px;letter-spacing:.14em;'
      +'color:rgba(255,255,255,.4);text-transform:uppercase">'+esc(label||'mark')+'</div>';
  }
};

/* ==========================================================================
   MODULE 5 — THE DEVICE SHELL (the Galaxy Nexus, in two forms)
   --------------------------------------------------------------------------
   Two models, because the honest record needs both. The GSM model reached
   shops in November 2011; the LTE model in December, on a single American
   carrier, with a bigger battery that still did worse, and with its
   software updates held by that carrier for months at a time — which rather
   undermined the entire idea of a Google reference device.

   Sensors: NFC, a barometer, an accelerometer, a magnetometer, proximity
   and light. Storage is fixed at manufacture and there is no microSD slot,
   which was controversial and remained so.
   ========================================================================== */
const Sys={
  settings:{}, flags:{}, carrierName:'Vantage', boot:false,
  init(){
    this.settings=Object.assign({use24:false,brightAuto:true,bright:0.72,rotationLock:false,
      jank:true,layoutBounds:false,pentile:false,ttsExplore:false,spell:true,voice:true},State.get('settings',{}));
    this.flags=Object.assign({wifi:true,bt:false,data:true,airplane:false,sync:true,bright:false,nfc:true,wifiDirect:false},State.get('flags',{}));
  },
  save(){ State.set('settings',this.settings); State.set('flags',this.flags); },
  set(k,v){ this.settings[k]=v; this.save(); },
  toggle(k){ this.flags[k]=!this.flags[k]; this.save(); Notif.renderStatus(); Registry.broadcast('CONNECTIVITY_CHANGED',{}); return this.flags[k]; },
  storeName(){ return State.get('googlePlay',false)?'Play Store':'Android Market'; },
  carrier(){ return this.flags.airplane?'No service':(Device.model==='lte'?this.carrierName+' LTE':this.carrierName); },
  netType(){ return this.flags.wifi?'Wi-Fi':(Device.model==='lte'?'LTE':'HSPA+'); },
  mobileUp(){ return !this.flags.airplane && this.flags.data && !DataUsage.cut; },
  online(){ return this.flags.wifi || this.mobileUp(); },
  applyImmersive(){ /* 4.0 dimmed the navigation bar for full-screen video and
                       reading; it never hid it for an ordinary application. */
    const t=Stack.foreground();
    const dim=!!(t&&t.inst&&t.inst.dimNav);
    $id('navbar').classList.toggle('dim',dim&&!Recents.open);
    const lite=!!(t&&t.inst&&t.inst.lightStatus);
    $id('statusbar').classList.toggle('lite',lite);
  }
};
