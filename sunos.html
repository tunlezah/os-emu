<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SunOS 4.1.4 / OpenWindows 3 — a museum exhibit</title>
<meta name="description" content="An interactive, single-file simulation of SunOS 4.1.4 with OpenWindows 3 and the OPEN LOOK desktop on a SPARCstation. Nothing real runs; everything responds.">
<style>
/* ==========================================================================
   SunOS 4.1.4 / OpenWindows 3 — single-file museum exhibit
   All artwork is original, generated in code. No external resources.
   ========================================================================== */
:root{
  --bg1:#d9d5c9;            /* OPEN LOOK BG1 (control area)  */
  --bg2:#b3afa3;            /* BG2 (darker shading)          */
  --bg3:#8c887d;            /* BG3 (darkest shading)         */
  --hi:#f5f3ec;             /* highlight                     */
  --ink:#1a1a1a;
  --sel:#5b5952;            /* menu highlight                */
  --ui:12px "Lucida Sans","Lucida Grande",Verdana,Geneva,sans-serif;
  --uib:bold 12px "Lucida Sans","Lucida Grande",Verdana,Geneva,sans-serif;
  --mono:"Lucida Console","Courier New",Courier,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#101010;overflow:hidden}
body{font:var(--ui);color:var(--ink);-webkit-user-select:none;user-select:none}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101010}
#stage{position:relative;width:1152px;height:900px;background:#000;transform-origin:center center;box-shadow:0 0 60px rgba(0,0,0,.8)}
#stage.grey{filter:grayscale(1)}

/* ---------- the glass console (PROM / boot / text login) ---------- */
#glass{position:absolute;inset:0;background:#fcfcf4;color:#111;display:block;overflow:hidden}
#glass pre{font:16px/22px var(--mono);white-space:pre;margin:12px 0 0 16px}
#glass .cur{background:#111;color:#fcfcf4}
#glass.dark{background:#111;color:#eee}

/* ---------- desktop ---------- */
#desktop{position:absolute;inset:0;display:none}
#desktop.on{display:block}
#wallpaper{position:absolute;inset:0}
#iconlayer,#winlayer,#menulayer,#noticelayer{position:absolute;inset:0;pointer-events:none}
#iconlayer>*,#winlayer>*,#menulayer>*,#noticelayer>*{pointer-events:auto}
#noticelayer.block{pointer-events:auto}

/* ---------- olwm window frames ---------- */
.olwin{position:absolute;background:var(--bg1);border:1px solid #000;
  box-shadow:1px 1px 0 rgba(0,0,0,.55);display:flex;flex-direction:column;min-width:120px;min-height:60px}
.olwin.focus{box-shadow:2px 2px 0 rgba(0,0,0,.65)}
.olhdr{height:22px;flex:0 0 22px;position:relative;display:flex;align-items:center;
  background:var(--bg1);border-bottom:1px solid var(--bg3);cursor:default}
.olwin.focus .olhdr{background:var(--bg2);border-bottom:1px solid #000}
.oltitle{position:absolute;left:26px;right:26px;text-align:center;font:var(--uib);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.wmenub{width:15px;height:13px;margin-left:6px;border:1px solid #3c3a34;background:linear-gradient(var(--hi),var(--bg2));
  display:flex;align-items:center;justify-content:center;font-size:8px;line-height:1;color:#222;cursor:default}
.wmenub:active{background:var(--bg2)}
.olbody{flex:1;position:relative;overflow:hidden;margin:3px;border:1px solid var(--bg3);background:var(--bg1)}
.olbody.plain{border:none;margin:0}
/* resize corners */
.rc{position:absolute;width:14px;height:14px;z-index:5}
.rc::before{content:"";position:absolute;inset:0}
.rc.nw{left:-2px;top:-2px;cursor:nw-resize;border-left:3px solid #000;border-top:3px solid #000}
.rc.ne{right:-2px;top:-2px;cursor:ne-resize;border-right:3px solid #000;border-top:3px solid #000}
.rc.sw{left:-2px;bottom:-2px;cursor:sw-resize;border-left:3px solid #000;border-bottom:3px solid #000}
.rc.se{right:-2px;bottom:-2px;cursor:se-resize;border-right:3px solid #000;border-bottom:3px solid #000}
.rc::after{content:"";position:absolute;inset:2px;background:var(--bg1)}
.rc.nw::after{border-right:1px solid var(--bg3);border-bottom:1px solid var(--bg3)}
.rc.ne::after{border-left:1px solid var(--bg3);border-bottom:1px solid var(--bg3)}
.rc.sw::after{border-right:1px solid var(--bg3);border-top:1px solid var(--bg3)}
.rc.se::after{border-left:1px solid var(--bg3);border-top:1px solid var(--bg3)}

/* ---------- workspace icons ---------- */
.olicon{position:absolute;width:80px;text-align:center;cursor:default}
.olicon .pic{width:64px;height:52px;margin:0 auto;border:1px solid #000;background:var(--bg1);
  box-shadow:1px 1px 0 rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.olicon .lbl{margin-top:2px;font:11px "Lucida Sans",Verdana,sans-serif;color:#111;
  background:transparent;padding:0 2px;display:inline-block;max-width:80px;overflow:hidden;white-space:nowrap}
.olicon.sel .pic{outline:2px solid #000}

/* ---------- menus ---------- */
.olmenu{position:absolute;background:var(--bg1);border:1px solid #000;
  box-shadow:2px 2px 0 rgba(0,0,0,.45);padding:3px 3px 4px;min-width:110px;z-index:200;font:var(--ui)}
.olmenu .mhead{display:flex;align-items:center;min-height:16px;padding:1px 4px 3px;
  border-bottom:1px solid var(--bg3);margin-bottom:3px}
.olmenu .mhead .mtitle{flex:1;text-align:center;font:var(--uib);padding-right:14px}
.olmenu.pinned{box-shadow:2px 2px 0 rgba(0,0,0,.6)}
.mi{position:relative;padding:3px 20px 3px 12px;border:1px solid transparent;border-radius:11px;white-space:nowrap;cursor:default}
.mi.def{border:1px solid #55524a}
.mi.hot{background:var(--sel);color:#fff}
.mi.dis{color:#8f8b80}
.mi.sub::after{content:"";position:absolute;right:7px;top:50%;margin-top:-4px;
  border-left:7px solid #333;border-top:4px solid transparent;border-bottom:4px solid transparent}
.mi.hot.sub::after{border-left-color:#fff}
.msep{height:1px;background:var(--bg3);margin:3px 6px}

/* pushpin */
.pin{width:16px;height:16px;flex:0 0 16px;cursor:default;position:relative}
.pin svg{display:block}

/* ---------- OPEN LOOK controls ---------- */
.olbtn{display:inline-block;padding:2px 16px;border:1px solid #46443c;border-radius:12px;
  background:linear-gradient(var(--hi) 20%,var(--bg1) 60%,var(--bg2));font:var(--ui);
  cursor:default;position:relative;text-align:center;min-width:56px}
.olbtn:active,.olbtn.pressed{background:var(--bg2)}
.olbtn.def::after{content:"";position:absolute;inset:2px;border:1px solid #46443c;border-radius:9px;pointer-events:none}
.olbtn.menu::after2{}
.olbtn.dis{color:#8f8b80;border-color:#8f8b80}
.olrow{display:flex;gap:10px;align-items:center;margin:6px 0}
.ollbl{font:var(--uib)}
/* exclusive / nonexclusive choice items */
.olchoice{display:inline-flex}
.olchoice .ch{padding:2px 10px;border:1px solid #46443c;border-left:none;background:linear-gradient(var(--hi),var(--bg1));cursor:default}
.olchoice .ch:first-child{border-left:1px solid #46443c}
.olchoice .ch.on{background:var(--bg2);box-shadow:inset 1px 1px 2px rgba(0,0,0,.35)}
.olcheck{display:inline-flex;align-items:center;gap:6px;cursor:default}
.olcheck .box{width:12px;height:12px;border:1px solid #46443c;background:linear-gradient(var(--hi),var(--bg1));position:relative}
.olcheck.on .box{background:var(--bg2);box-shadow:inset 1px 1px 2px rgba(0,0,0,.35)}
.olcheck.on .box::after{content:"";position:absolute;left:3px;top:0px;width:4px;height:8px;
  border-right:2px solid #222;border-bottom:2px solid #222;transform:rotate(38deg)}
.oltxt{border:none;border-bottom:1px solid #46443c;background:transparent;font:var(--ui);
  padding:2px 2px;outline:none;-webkit-user-select:text;user-select:text}
.olslider{-webkit-appearance:none;appearance:none;height:4px;background:var(--bg3);border:1px solid #55524a}
.olslider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:14px;background:linear-gradient(var(--hi),var(--bg2));border:1px solid #333}

/* ---------- OPEN LOOK scrollbar (the elevator) ---------- */
.olsbwrap{display:flex;height:100%}
.olsb{width:19px;flex:0 0 19px;position:relative;background:transparent}
.olsb .cable{position:absolute;left:8px;top:14px;bottom:14px;width:3px;background:var(--bg2);border:1px solid var(--bg3)}
.olsb .prop{position:absolute;left:8px;width:3px;background:#6e6a60}
.olsb .anchor{position:absolute;left:3px;width:13px;height:11px;border:1px solid #46443c;
  background:linear-gradient(var(--hi),var(--bg1))}
.olsb .anchor.top{top:1px}.olsb .anchor.bot{bottom:1px}
.olsb .anchor:active{background:var(--bg2)}
.olsb .elev{position:absolute;left:1px;width:17px;height:51px;border:1px solid #333;
  background:var(--bg1);box-shadow:1px 1px 0 rgba(0,0,0,.35)}
.olsb .elev .b{height:17px;display:flex;align-items:center;justify-content:center;position:relative}
.olsb .elev .b.up{border-bottom:1px solid var(--bg2)}
.olsb .elev .b.dn{border-top:1px solid var(--bg2)}
.olsb .elev .b.up::after{content:"";border-bottom:6px solid #333;border-left:4px solid transparent;border-right:4px solid transparent}
.olsb .elev .b.dn::after{content:"";border-top:6px solid #333;border-left:4px solid transparent;border-right:4px solid transparent}
.olsb .elev .b.mid{background:repeating-linear-gradient(0deg,var(--bg1) 0 2px,var(--bg2) 2px 3px)}
.olsb .elev .b:active{background:var(--bg2)}

/* ---------- notices ---------- */
#noticelayer .shade{position:absolute;inset:0}
.notice{position:absolute;background:var(--bg1);border:2px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.5);
  padding:14px 22px;min-width:260px;max-width:560px;z-index:400}
.notice .nmsg{text-align:center;margin-bottom:14px;white-space:pre-line;line-height:1.5}
.notice .nbtns{display:flex;gap:14px;justify-content:center}
.shard{position:absolute;border:1px solid #333;pointer-events:none;z-index:399}

/* ---------- terminals (cmdtool / shelltool) ---------- */
.term{background:#fff;color:#111;height:100%;overflow:hidden;position:relative;cursor:text}
.term pre{font:13px/16px var(--mono);white-space:pre;margin:2px 0 0 4px}
.term .cur{background:#111;color:#fff}
.term .inv{background:#111;color:#fff}
#glass .inv{background:#111;color:#fcfcf4}
.term.unfocused .cur{background:transparent;color:#111;outline:1px solid #111}

/* ---------- File Manager ---------- */
.fmbar{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--bg3);background:var(--bg1)}
.fmpath{font:var(--uib)}
.fmgrid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px;padding:8px;overflow:hidden;background:#fff;height:100%}
.fmitem{width:84px;height:74px;text-align:center;cursor:default;padding-top:2px}
.fmitem .fic{height:40px;display:flex;align-items:center;justify-content:center}
.fmitem .fnm{font:11px "Lucida Sans",Verdana,sans-serif;word-break:break-all;line-height:1.15;padding:0 2px;display:inline-block}
.fmitem.sel .fnm{background:#333;color:#fff}
.fmstatus{padding:3px 8px;border-top:1px solid var(--bg3);font:11px "Lucida Sans",Verdana,sans-serif;color:#333}
.dragghost{position:absolute;z-index:500;pointer-events:none;opacity:.8}

/* ---------- Mail Tool ---------- */
.mtlist{background:#fff;border-bottom:1px solid var(--bg3);overflow:hidden;font:12px var(--mono);white-space:pre;cursor:default}
.mtrow{padding:1px 6px}
.mtrow.sel{background:#333;color:#fff}
.mtread{background:#fff;overflow:hidden;flex:1}
.mtread pre{font:12px/15px var(--mono);margin:4px 6px;white-space:pre-wrap}
.mtbtns{display:flex;gap:8px;padding:5px 8px;border-bottom:1px solid var(--bg3)}

/* ---------- misc app bits ---------- */
.padded{padding:10px}
.calcgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px}
.calcgrid .olbtn{min-width:0;padding:3px 0}
.calcdisp{font:15px var(--mono);background:#e8e6da;border:1px solid var(--bg3);margin:8px 8px 0;
  padding:4px 8px;text-align:right;letter-spacing:1px}
.cmgrid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--bg3);border-top:1px solid var(--bg3);flex:1}
.cmcell{border-right:1px solid var(--bg3);border-bottom:1px solid var(--bg3);padding:2px 3px;background:#fff;
  font:11px "Lucida Sans",Verdana,sans-serif;overflow:hidden;position:relative;cursor:default}
.cmcell .d{font:var(--uib)}
.cmcell.hd{background:var(--bg1);text-align:center;font:var(--uib);padding:3px 0}
.cmcell.today .d{background:#333;color:#fff;padding:0 3px}
.cmcell .apt{color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
.abnav{width:190px;flex:0 0 190px;border-right:1px solid var(--bg3);background:#fff;overflow:hidden;padding:4px 0}
.abnav .e{padding:3px 10px;cursor:default}
.abnav .e.sel{background:#333;color:#fff}
.abpage{flex:1;background:#fffef8;overflow:hidden;position:relative}
.abpage .inner{padding:18px 26px;font:13px/1.6 Georgia,"Times New Roman",serif;-webkit-user-select:text;user-select:text}
.abpage h2{font:bold 17px Georgia,serif;margin:0 0 10px;border-bottom:1px solid #999;padding-bottom:6px}
.abpage h3{font:bold 13px Georgia,serif;margin:12px 0 4px}
.abpage p{margin:6px 0}
.abpage code{font:12px var(--mono);background:#efede2;padding:0 3px}
.abpage .placard{border:1px solid #a09c90;background:#f4f1e4;padding:8px 12px;margin:10px 0;font-size:12px}
textarea.tedit{width:100%;height:100%;border:none;resize:none;outline:none;background:#fff;
  font:13px/17px var(--mono);padding:6px;-webkit-user-select:text;user-select:text}
.iegrid{display:grid;grid-template-columns:repeat(32,8px);grid-auto-rows:8px;border:1px solid #000;background:#fff;cursor:crosshair}
.iegrid div{border-right:1px solid #eee;border-bottom:1px solid #eee}
.iegrid div.on{background:#111}
.statusline{font:11px "Lucida Sans",Verdana,sans-serif;color:#333;padding:3px 8px;border-top:1px solid var(--bg3)}
canvas{display:block}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#777;font:11px var(--mono);pointer-events:none;z-index:50}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="glass"><pre id="glasspre"></pre></div>
    <div id="desktop">
      <canvas id="wallpaper" width="1152" height="900"></canvas>
      <div id="winlayer"></div>
      <div id="iconlayer"></div>
      <div id="menulayer"></div>
      <div id="noticelayer"></div>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>
<script>
"use strict";
/* =====================================================================
   utils
   ===================================================================== */
const $id=i=>document.getElementById(i);
function E(tag,cls,parent,text){const e=document.createElement(tag);if(cls)e.className=cls;
  if(text!==undefined)e.textContent=text;if(parent)parent.appendChild(e);return e;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function lpad(s,n){s=String(s);return s.length>=n?s:" ".repeat(n-s.length)+s;}
function rpad(s,n){s=String(s);return s.length>=n?s.slice(0,n):s+" ".repeat(n-s.length);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* the machine lives on Tuesday 15 November 1994; only the time of day moves */
function simNow(){const r=new Date();
  return new Date(1994,10,15,r.getHours(),r.getMinutes(),r.getSeconds());}
function fmtClock(d){return lpad(d.getHours(),2).replace(/ /g,"0")+":"+lpad(d.getMinutes(),2).replace(/ /g,"0");}
/* ls(1) shows the clock for anything under six months old, the year for the rest.
   Anything stamped with a real modern clock is something you just made: call it now. */
function fmtLsDate(t){
  let d=new Date(t);
  if(d.getFullYear()>1994)d=simNow();
  const age=new Date(1994,10,15)-new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const recent=age<184*86400000&&age>-86400000;
  return MON[d.getMonth()]+" "+lpad(d.getDate(),2)+" "+(recent
    ?lpad(d.getHours(),2).replace(/ /g,"0")+":"+lpad(d.getMinutes(),2).replace(/ /g,"0")
    :" "+d.getFullYear());}
function fmtFull(d){return DAY[d.getDay()]+" "+MON[d.getMonth()]+" "+lpad(d.getDate(),2)+" "+
  [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>lpad(n,2).replace(/ /g,"0")).join(":")+" PST 1994";}
/* an era timestamp: given month(0-11), day, hour -> ms with year 1994 (or 1993) */
function T94(mon,day,hh,yr){const d=new Date(yr||1994,mon,day,hh||12,(day*7+mon*3)%60);return d.getTime();}

/* =====================================================================
   global sim state
   ===================================================================== */
const SIM={
  mode:"off",              // off | prom | boot | console | desktop
  host:"sundance",
  user:null,
  bootTime:0,
  bootId:0,
  frozen:null,             // {mode} saved by Stop-A
  session:{talkDone:false,nfsDone:false,homeTouch:0,mailReplied:false},
  consoleShell:null,
};
/* Stop-A holds the world still.  Anything that would otherwise keep ticking --
   a boot in progress, a ping between packets -- parks here until 'go'. */
const FREEZE={
  on:false,waiters:[],
  hold(){this.on=true;},
  release(){this.on=false;const w=this.waiters;this.waiters=[];for(const r of w)r();},
  async wait(){while(this.on)await new Promise(r=>this.waiters.push(r));}
};
const ACT={cpu:5,pkts:2,page:0,load:0.08,
  bump(c,p){this.cpu=Math.min(100,this.cpu+(c||8));if(p)this.pkts=Math.min(100,this.pkts+p);},
  tick(){this.cpu=Math.max(2,this.cpu*0.82);this.pkts=Math.max(1,this.pkts*0.7+Math.random()*3);
    this.page=Math.max(0,this.page*0.8+(Math.random()<0.06?18:0));
    this.load=this.load*0.985+this.cpu/100*0.03;}
};
setInterval(()=>ACT.tick(),500);

/* =====================================================================
   persistent state (localStorage)
   ===================================================================== */
const ST={
  d:null,
  defaults(){return{
    nvram:{"auto-boot?":"true","boot-device":"disk","boot-file":"","diag-switch?":"false",
      "oem-banner":"","oem-banner?":"false","input-device":"keyboard","output-device":"screen",
      "screen-#columns":"80","screen-#rows":"34","use-nvramrc?":"false","security-mode":"none",
      "sbus-probe-list":"0123","watchdog-reboot?":"false"},
    props:{wsColor:"gray",grey:false,sndKey:false,sndBell:true,sndHum:false},
    hist:[],home:null,mailRead:[],mailGone:[],mailExtra:[],cal:[],binds:{},
    last:"prom",eggBanner:0};},
  load(){try{const raw=localStorage.getItem("sunos414-exhibit");
      this.d=raw?Object.assign(this.defaults(),JSON.parse(raw)):this.defaults();}
    catch(e){this.d=this.defaults();}},
  save(){
    try{localStorage.setItem("sunos414-exhibit",JSON.stringify(this.d));}
    catch(e){
      /* rasterfiles are the only thing here big enough to fill the quota:
         drop the pixels, keep the files, and the home directory still survives */
      try{
        const strip=n=>{if(!n)return n;
          if(n.t==="d"){const c={};for(const k in n.c)c[k]=strip(n.c[k]);return Object.assign({},n,{c});}
          if(n.img)return Object.assign({},n,{img:null});
          return n;};
        const lean=Object.assign({},this.d,{home:strip(this.d.home)});
        localStorage.setItem("sunos414-exhibit",JSON.stringify(lean));
      }catch(e2){}
    }
  },
  tSave:0,
  lazySave(){clearTimeout(this.tSave);this.tSave=setTimeout(()=>this.save(),400);}
};
ST.load();
window.addEventListener("beforeunload",()=>{ST.d.home=vfsSerialize(vfsGet("/export/home/demo"));ST.save();});

/* =====================================================================
   sound manager (all synthesized, defaults quiet)
   ===================================================================== */
const SND={
  ctx:null,humNode:null,
  ensure(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();return this.ctx;},
  tone(f,dur,vol,type,when){const c=this.ensure();if(!c)return;
    const o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.value=f;
    const t=c.currentTime+(when||0);g.gain.setValueAtTime(vol||.08,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);
    o.start(t);o.stop(t+dur+.02);},
  beep(){this.tone(1000,.22,.1,"square");},                       /* SPARC power-on */
  bell(){if(ST.d.props.sndBell)this.tone(1180,.14,.09,"square");},
  click(){if(ST.d.props.sndKey)this.tone(2200,.012,.03,"square");},
  hum(on){const c=this.ensure();if(!c)return;
    if(on&&!this.humNode){const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),ch=b.getChannelData(0);
      let v=0;for(let i=0;i<ch.length;i++){v=v*.97+(Math.random()*2-1)*.03;ch[i]=v;}
      const s=c.createBufferSource();s.buffer=b;s.loop=true;const g=c.createGain();g.gain.value=.05;
      const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=180;
      s.connect(f).connect(g).connect(c.destination);s.start();this.humNode=s;}
    else if(!on&&this.humNode){this.humNode.stop();this.humNode=null;}},
  /* Audio Tool clips: returns Float32Array samples (8kHz-ish feel) for waveform + plays */
  clipDefs:{
    "gong.au":{len:1.6,gen:(t)=>Math.sin(2*Math.PI*392*t)*Math.exp(-2.2*t)*.6+Math.sin(2*Math.PI*587*t)*Math.exp(-3*t)*.3},
    "flourish.au":{len:1.4,gen:(t)=>{const seq=[262,330,392,523,659,784];const i=Math.min(5,Math.floor(t/0.22));
      const f=seq[i];return Math.sin(2*Math.PI*f*t)*Math.exp(-6*(t-i*0.22))*.5;}},
    "drip.au":{len:0.9,gen:(t)=>Math.sin(2*Math.PI*(900-700*t)*t)*Math.exp(-7*t)*.6},
    "busy.au":{len:1.5,gen:(t)=>((Math.floor(t*2)%2)===0?1:0)*(Math.sin(2*Math.PI*480*t)+Math.sin(2*Math.PI*620*t))*.25}
  },
  renderClip(name){const def=this.clipDefs[name];if(!def)return null;const sr=8000,n=Math.floor(def.len*sr);
    const a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=def.gen(i/sr);return a;},
  playClip(name,onend){const c=this.ensure();if(!c){if(onend)onend();return;}
    const a=this.renderClip(name);if(!a){if(onend)onend();return;}
    const b=c.createBuffer(1,a.length,8000);b.getChannelData(0).set(a);
    const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=.5;
    s.connect(g).connect(c.destination);s.onended=onend;s.start();return s;}
};

/* =====================================================================
   virtual file system — BSD layout, SunOS 4.1.4 flavour
   node: {t:'d',c:{}} | {t:'f',data,size?,x?} | {t:'l',to}
   every node may carry: own, grp, mode, mt (mtime ms)
   ===================================================================== */
function FD(c,o){return Object.assign({t:"d",c:c||{},own:"root",grp:"wheel",mode:"drwxr-xr-x",mt:T94(9,14)},o);}
function FF(data,o){return Object.assign({t:"f",data:data||"",own:"root",grp:"wheel",mode:"-rw-r--r--",mt:T94(9,14)},o);}
function FL(to,o){return Object.assign({t:"l",to,own:"root",grp:"wheel",mode:"lrwxrwxrwx",mt:T94(9,14)},o);}
function FX(o){return FF("\x7fELF",Object.assign({mode:"-rwxr-xr-x",size:24576+((Math.random()*90000)|0)},o));} // binary-ish

/* --- path resolution --- */
function normPath(p,cwd){
  if(!p)p=cwd||"/";
  if(p[0]!=="/")p=(cwd==="/"?"":cwd)+"/"+p;
  const parts=p.split("/").filter(x=>x&&x!==".");
  const out=[];
  for(const part of parts){if(part==="..")out.pop();else out.push(part);}
  return "/"+out.join("/");
}
function vfsGet(path,noFollowLast){
  const p=normPath(path);
  if(p==="/")return FS;
  const parts=p.slice(1).split("/");
  let node=FS,depth=0;
  for(let i=0;i<parts.length;i++){
    if(!node||node.t!=="d")return null;
    node=node.c[parts[i]];
    if(!node)return null;
    if(node.t==="l"&&!(noFollowLast&&i===parts.length-1)){
      if(depth++>8)return null;
      node=vfsGet(node.to,false);
    }
  }
  return node;
}
function vfsParent(path){const p=normPath(path);if(p==="/")return null;
  const i=p.lastIndexOf("/");return{dir:vfsGet(p.slice(0,i)||"/"),name:p.slice(i+1),ppath:p.slice(0,i)||"/"};}
function fsize(n){if(n.t==="d")return 512+Object.keys(n.c).length*24;
  if(n.t==="l")return n.to.length;
  if(n.spool)return mailSpoolText().length;
  return n.size!==undefined?n.size:(n.data?n.data.length:0);}
function fdata(n){return n.spool?mailSpoolText():(n.data||"");}
function isNFSPath(p){p=normPath(p);return p==="/home"||p.startsWith("/home/")||p.startsWith("/var/spool/mail");}
function vfsWrite(path,data,owner){
  const pr=vfsParent(path);if(!pr||!pr.dir||pr.dir.t!=="d")return null;
  let n=pr.dir.c[pr.name];
  if(!n){n=FF(data,{own:owner||"demo",grp:"staff",mt:Date.now()});pr.dir.c[pr.name]=n;}
  else if(n.t==="f"){n.data=data;n.mt=Date.now();delete n.size;}
  else return null;
  homeChanged();return n;
}
function vfsMkdir(path,owner){
  const pr=vfsParent(path);if(!pr||!pr.dir||pr.dir.t!=="d"||pr.dir.c[pr.name])return null;
  const n=FD({},{own:owner||"demo",grp:"staff",mt:Date.now()});pr.dir.c[pr.name]=n;homeChanged();return n;
}
function vfsRm(path){const pr=vfsParent(path);if(!pr||!pr.dir)return false;
  if(!pr.dir.c[pr.name])return false;delete pr.dir.c[pr.name];homeChanged();return true;}

/* persistence of the home directory */
function vfsSerialize(node){
  if(!node)return null;
  if(node.t==="d"){const c={};for(const k in node.c)c[k]=vfsSerialize(node.c[k]);
    return{t:"d",c,mt:node.mt,mode:node.mode};}
  if(node.t==="l")return{t:"l",to:node.to};
  return{t:"f",data:node.data,mt:node.mt,mode:node.mode,au:node.au,img:node.img};
}
function vfsRestore(s){
  if(!s)return null;
  if(s.t==="d"){const n=FD({},{own:"demo",grp:"staff",mode:s.mode||"drwxr-xr-x",mt:s.mt||Date.now()});
    for(const k in s.c){const ch=vfsRestore(s.c[k]);if(ch)n.c[k]=ch;}return n;}
  if(s.t==="l")return FL(s.to,{own:"demo",grp:"staff"});
  return FF(s.data||"",{own:"demo",grp:"staff",mode:s.mode||"-rw-r--r--",mt:s.mt||Date.now(),au:s.au,img:s.img});
}

/* =====================================================================
   terminal — shared by the glass console, cmdtool and shelltool
   ===================================================================== */
class Term{
  constructor(pre,cols,rows,opts){
    this.pre=pre;this.cols=cols;this.rows=rows;
    opts=opts||{};
    this.scrollback=opts.scrollback!==undefined?opts.scrollback:500;
    this.lines=[""];
    this.viewTop=null;         // null = follow the tail
    this.raw=null;             // raw key handler
    this.screen=null;          // screen mode (vi, more, talk)
    this.cursorOn=true;
    this.focused=true;
    this.onUpdate=null;        // scrollbar hook
    this.bellFn=opts.bell||(()=>SND.bell());
  }
  write(s){
    s=String(s);
    for(let i=0;i<s.length;i++){
      const ch=s[i];
      if(ch==="\n"){this.lines.push("");}
      else if(ch==="\r"){/* ignore */}
      else if(ch==="\x07"){this.bellFn();}
      else if(ch==="\b"){
        let last=this.lines[this.lines.length-1];
        if(last.length)this.lines[this.lines.length-1]=last.slice(0,-1);
        else if(this.lines.length>1){this.lines.pop();}
      }
      else{
        let last=this.lines[this.lines.length-1];
        if(last.length>=this.cols){this.lines.push(ch);}
        else this.lines[this.lines.length-1]=last+ch;
      }
    }
    const max=Math.max(this.rows,this.scrollback);
    if(this.lines.length>max)this.lines.splice(0,this.lines.length-max);
    this.viewTop=null;
    this.render();
  }
  clear(){this.lines=[""];this.viewTop=null;this.render();}
  totalLines(){return this.lines.length;}
  scrollTo(top){
    if(this.split){this.split.top=clamp(top,0,Math.max(0,this.lines.length-1));this.render();return;}
    const maxTop=Math.max(0,this.lines.length-this.rows);
    top=clamp(top,0,maxTop);
    this.viewTop=(top>=maxTop)?null:top;
    this.render();
  }
  curTop(){if(this.split)return this.split.top;
    return this.viewTop===null?Math.max(0,this.lines.length-this.rows):this.viewTop;}
  render(){
    let html="";
    if(this.screen){
      const sc=this.screen;
      for(let r=0;r<this.rows;r++){
        const row=sc.rows[r]||{text:""};
        let t=(row.text||"").slice(0,this.cols);
        let line;
        if(sc.cur&&sc.cur[0]===r&&this.cursorOn){
          const c=Math.min(sc.cur[1],this.cols-1);
          while(t.length<=c)t+=" ";
          line=esc(t.slice(0,c))+'<span class="cur">'+esc(t[c]||" ")+"</span>"+esc(t.slice(c+1));
        }else if(row.inv){
          line='<span class="inv">'+esc(t)+"</span>";
        }else line=esc(t);
        html+=line+"\n";
      }
    }else if(this.split){
      /* cmdtool's split view: the upper pane holds still in the scrollback
         while the lower pane stays with the running shell */
      const up=this.split.rows;
      const upTop=clamp(this.split.top,0,Math.max(0,this.lines.length-1));
      for(let i=0;i<up;i++)html+=esc(this.lines[upTop+i]!==undefined?this.lines[upTop+i]:"")+"\n";
      html+='<span class="inv">'+esc("-".repeat(this.cols))+"</span>\n";
      const low=this.rows-up-1;
      const lowTop=Math.max(0,this.lines.length-low);
      for(let i=0;i<low;i++){
        const l=this.lines[lowTop+i];
        if(l===undefined){html+="\n";continue;}
        if(lowTop+i===this.lines.length-1&&this.cursorOn)html+=esc(l)+'<span class="cur"> </span>';
        else html+=esc(l);
        html+="\n";
      }
    }else{
      const top=this.curTop();
      const vis=this.lines.slice(top,top+this.rows);
      for(let i=0;i<vis.length;i++){
        const isLast=(top+i===this.lines.length-1);
        if(isLast&&this.cursorOn&&this.viewTop===null){
          html+=esc(vis[i])+'<span class="cur"> </span>';
        }else html+=esc(vis[i]);
        html+="\n";
      }
    }
    this.pre.innerHTML=html;
    this.pre.parentElement.classList.toggle("unfocused",!this.focused);
    if(this.onUpdate)this.onUpdate();
  }
  enterScreen(){
    this.savedLines=this.lines.slice();
    this.screen={rows:[],cur:null};
    this.render();
  }
  setRow(r,text,inv){if(!this.screen)return;this.screen.rows[r]={text:text||"",inv:!!inv};}
  setCur(r,c){if(!this.screen)return;this.screen.cur=(r===null)?null:[r,c];}
  exitScreen(){
    this.screen=null;
    if(this.savedLines){this.lines=this.savedLines;this.savedLines=null;}
    this.render();
  }
  key(e){
    if(this.raw){this.raw(e);return true;}
    return false;
  }
}

/* line editor: returns a promise for one line of input */
function readLine(term,opts){
  opts=opts||{};
  const echo=opts.echo!==false;
  const hist=opts.hist||null;
  let buf="",histIdx=hist?hist.length:0,saved="";
  return new Promise(resolve=>{
    function redraw(nbuf){
      if(echo){for(let i=0;i<buf.length;i++)term.write("\b");term.write(nbuf);}
      buf=nbuf;
    }
    term.raw=e=>{
      if(e.ctrlKey&&!e.altKey){
        const k=e.key.toLowerCase();
        if(k==="c"){term.write("^C\n");finish("\x03");return;}
        if(k==="d"){if(buf==="")finish(null);return;}
        if(k==="u"){redraw("");return;}
        if(k==="l"){term.clear();if(opts.onCtrlL)opts.onCtrlL();term.write(buf);return;}
        if(k==="w"){const t=buf.replace(/\S+\s*$/,"");redraw(t);return;}
        return;
      }
      if(e.altKey||e.metaKey)return;
      SND.click();
      if(e.key==="Enter"){term.write("\n");finish(buf);}
      else if(e.key==="Backspace"){if(buf.length){buf=buf.slice(0,-1);if(echo)term.write("\b");}}
      else if(e.key==="ArrowUp"&&hist){
        if(histIdx>0){if(histIdx===hist.length)saved=buf;histIdx--;redraw(hist[histIdx]);}
      }
      else if(e.key==="ArrowDown"&&hist){
        if(histIdx<hist.length){histIdx++;redraw(histIdx===hist.length?saved:hist[histIdx]);}
      }
      else if(e.key==="Tab"){/* csh had no completion out of the box; honour that */ term.write("\x07");}
      else if(e.key==="Escape"&&opts.esc){finish("\x1b");}
      else if(e.key.length===1){buf+=e.key;if(echo)term.write(e.key);}
    };
    function finish(v){term.raw=null;resolve(v);}
  });
}

/* =====================================================================
   more(1) — the pager
   ===================================================================== */
function pageText(term,text,name){
  const lines=String(text).replace(/\t/g,"        ").split("\n");
  if(lines.length&&lines[lines.length-1]==="")lines.pop();
  if(lines.length<=term.rows-1){          // fits: just print it
    term.write(lines.join("\n")+"\n");
    return Promise.resolve();
  }
  return new Promise(resolve=>{
    term.enterScreen();
    let top=0;const body=term.rows-1;
    function draw(){
      for(let r=0;r<body;r++)term.setRow(r,lines[top+r]!==undefined?lines[top+r]:"~");
      const pct=Math.min(100,Math.round((top+body)/lines.length*100));
      const done=top+body>=lines.length;
      term.setRow(body,done?"(END)":"--More--("+pct+"%)"+(name?" "+name:""),true);
      term.setCur(null);
      term.render();
    }
    draw();
    term.raw=e=>{
      const k=e.key;
      if(k==="q"||k==="Q"||(e.ctrlKey&&k.toLowerCase()==="c")){finish();return;}
      if(k===" "||k==="f"){if(top+body>=lines.length){finish();return;}top=Math.min(top+body,Math.max(0,lines.length-1));draw();return;}
      if(k==="Enter"||k==="j"||k==="ArrowDown"){if(top+body>=lines.length){finish();return;}top++;draw();return;}
      if(k==="b"||k==="k"||k==="ArrowUp"){top=Math.max(0,top-(k==="b"?body:1));draw();return;}
    };
    function finish(){term.raw=null;term.exitScreen();resolve();}
  });
}

/* =====================================================================
   vi(1) — small but genuine: modal, hjkl, counts, dd/yy/p, :w :q, /search
   ===================================================================== */
function runVi(sh,term,fname){
  return new Promise(resolve=>{
    const path=fname?normPath(fname,sh.cwd):null;
    let node=path?vfsGet(path):null;
    let buf=node&&node.t==="f"?fdata(node).split("\n"):[""];
    if(buf.length>1&&buf[buf.length-1]==="")buf.pop();
    if(!buf.length)buf=[""];
    const newFile=!node;
    let top=0,cy=0,cx=0,mode="n",cmd="",pend="",count="",yank=null,dirty=false;
    let msg=path?('"'+path+'"'+(newFile?" [New file]":" "+buf.length+" lines, "+fdata(node).length+" characters")):"no file";
    let lastSearch="";
    let undo=null;
    const body=term.rows-1;
    term.enterScreen();
    function snap(){undo={buf:buf.slice(),cy,cx};}
    function line(){return buf[cy]||"";}
    function fix(){cy=clamp(cy,0,buf.length-1);
      const maxx=mode==="i"?line().length:Math.max(0,line().length-1);
      cx=clamp(cx,0,maxx);
      if(cy<top)top=cy;if(cy>=top+body)top=cy-body+1;}
    function draw(){
      fix();
      for(let r=0;r<body;r++){
        const i=top+r;
        term.setRow(r,i<buf.length?buf[i].replace(/\t/g,"        "):"~");
      }
      let st;
      if(mode===":"||mode==="/")st=(mode===":"?":":"/")+cmd;
      else st=msg||(mode==="i"?"-- INSERT --":"");
      term.setRow(body,st,false);
      if(mode===":"||mode==="/")term.setCur(body,st.length);
      else{
        /* account for tab expansion in cursor col */
        let vc=0;const s=line();for(let i=0;i<cx&&i<s.length;i++)vc+=(s[i]==="\t")?8:1;
        term.setCur(cy-top,vc);
      }
      term.render();
    }
    function save(as){
      const p=as?normPath(as,sh.cwd):path;
      if(!p){msg="No current filename";return false;}
      const text=buf.join("\n")+"\n";
      if(vfsWrite(p,text,sh.user)){dirty=false;msg='"'+p+'" '+buf.length+" lines, "+text.length+" characters";return true;}
      msg='"'+p+'" Permission denied';return false;
    }
    function quit(){term.raw=null;term.exitScreen();resolve();}
    function exCmd(c){
      const m=c.match(/^(w?q?!?|wq|x)(?:\s+(\S+))?$/);
      msg="";
      if(c==="q"){if(dirty){msg="No write since last change (:quit! overrides)";}else quit();return;}
      if(c==="q!"){quit();return;}
      if(c==="w"||c.startsWith("w ")){save(c.slice(2).trim()||null);return;}
      if(c==="wq"||c==="x"||c==="wq!"){if(save(null))quit();return;}
      if(/^\d+$/.test(c)){cy=clamp(parseInt(c)-1,0,buf.length-1);cx=0;return;}
      if(c==="set nu"||c==="set nonu"||c===""){return;}
      msg="Not an editor command: "+c;
    }
    function search(pat,fromNext){
      if(!pat)pat=lastSearch;if(!pat){msg="No previous regular expression";return;}
      lastSearch=pat;
      let re;try{re=new RegExp(pat);}catch(e){re=new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));}
      for(let i=1;i<=buf.length;i++){
        const y=(cy+i)%buf.length;
        const startx=(i===buf.length&&!fromNext)?0:0;
        const mch=buf[y].match(re);
        if(mch&&!(y===cy&&mch.index===cx)){cy=y;cx=mch.index;return;}
      }
      msg="Pattern not found";
    }
    function delLines(n){snap();const removed=buf.splice(cy,n);yank={lines:removed};
      if(!buf.length)buf=[""];dirty=true;}
    term.raw=e=>{
      if(e.ctrlKey&&e.key.toLowerCase()==="c"){if(mode==="i"){mode="n";cx=Math.max(0,cx-1);}msg="Type :quit<Enter> to exit vi";draw();return;}
      const k=e.key;
      if(mode===":"||mode==="/"){
        if(k==="Enter"){const c=cmd;cmd="";const m=mode;mode="n";
          if(m===":")exCmd(c);else search(c,false);draw();return;}
        if(k==="Escape"){cmd="";mode="n";draw();return;}
        if(k==="Backspace"){if(cmd)cmd=cmd.slice(0,-1);else mode="n";draw();return;}
        if(k.length===1)cmd+=k;draw();return;
      }
      if(mode==="i"){
        if(k==="Escape"){mode="n";cx=Math.max(0,cx-1);msg="";draw();return;}
        if(k==="Enter"){snapOnce();const s=line();buf.splice(cy,1,s.slice(0,cx),s.slice(cx));cy++;cx=0;dirty=true;draw();return;}
        if(k==="Backspace"){snapOnce();
          if(cx>0){buf[cy]=line().slice(0,cx-1)+line().slice(cx);cx--;}
          else if(cy>0){cx=buf[cy-1].length;buf[cy-1]+=buf[cy];buf.splice(cy,1);cy--;}
          dirty=true;draw();return;}
        if(k==="Tab"){snapOnce();buf[cy]=line().slice(0,cx)+"\t"+line().slice(cx);cx++;dirty=true;draw();e.preventDefault();return;}
        if(k.length===1&&!e.ctrlKey&&!e.metaKey){snapOnce();buf[cy]=line().slice(0,cx)+k+line().slice(cx);cx++;dirty=true;draw();return;}
        if(k==="ArrowLeft"){cx=Math.max(0,cx-1);draw();return;}
        if(k==="ArrowRight"){cx=Math.min(line().length,cx+1);draw();return;}
        if(k==="ArrowUp"){cy=Math.max(0,cy-1);draw();return;}
        if(k==="ArrowDown"){cy=Math.min(buf.length-1,cy+1);draw();return;}
        return;
      }
      /* ---- normal mode ---- */
      msg="";
      let insSnapped=false;
      function snapOnce2(){}
      if(/^[0-9]$/.test(k)&&!(k==="0"&&count==="")){count+=k;return;}
      const n=count?parseInt(count):1;
      const hadCount=!!count;count="";
      if(pend==="d"){
        pend="";
        if(k==="d"){delLines(n);draw();return;}
        if(k==="w"){snap();const s=line();const m=s.slice(cx).match(/^\s*\S+\s*/);
          if(m){buf[cy]=s.slice(0,cx)+s.slice(cx+m[0].length);dirty=true;}draw();return;}
        if(k==="$"){snap();buf[cy]=line().slice(0,cx);dirty=true;cx=Math.max(0,cx-1);draw();return;}
        draw();return;
      }
      if(pend==="y"){pend="";if(k==="y"){yank={lines:buf.slice(cy,cy+n)};msg=n+" line"+(n>1?"s":"")+" yanked";}draw();return;}
      if(pend==="g"){pend="";if(k==="g"){cy=0;cx=0;}draw();return;}
      if(pend==="r"){pend="";if(k.length===1){snap();const s=line();if(cx<s.length){buf[cy]=s.slice(0,cx)+k+s.slice(cx+1);dirty=true;}}draw();return;}
      if(pend==="Z"){pend="";if(k==="Z"){if(save(null))quit();return;}draw();return;}
      switch(k){
        case "h":case "ArrowLeft":cx-=n;break;
        case "l":case "ArrowRight":case " ":cx+=n;break;
        case "j":case "ArrowDown":case "Enter":cy+=n;break;
        case "k":case "ArrowUp":cy-=n;break;
        case "0":cx=0;break;
        case "$":cx=Math.max(0,line().length-1);break;
        case "^":{const m=line().match(/\S/);cx=m?m.index:0;break;}
        case "w":{let s=line().slice(cx).match(/^\S*\s+/);
          if(s)cx+=s[0].length;else if(cy<buf.length-1){cy++;cx=0;}else cx=line().length-1;break;}
        case "b":{const pre=line().slice(0,cx);const m=pre.match(/(\S+)\s*$/);
          if(m)cx=m.index;else if(cy>0){cy--;cx=Math.max(0,line().length-1);}break;}
        case "G":cy=hadCount?n-1:buf.length-1;cx=0;break;
        case "g":pend="g";break;
        case "x":{snap();const s=line();if(s.length){buf[cy]=s.slice(0,cx)+s.slice(cx+n);dirty=true;}break;}
        case "X":{snap();if(cx>0){const s=line();buf[cy]=s.slice(0,cx-1)+s.slice(cx);cx--;dirty=true;}break;}
        case "d":pend="d";break;
        case "y":pend="y";break;
        case "r":pend="r";break;
        case "Z":pend="Z";break;
        case "D":{snap();buf[cy]=line().slice(0,cx);dirty=true;cx=Math.max(0,cx-1);break;}
        case "J":{if(cy<buf.length-1){snap();buf[cy]=line()+" "+buf[cy+1].replace(/^\s+/,"");buf.splice(cy+1,1);dirty=true;}break;}
        case "p":{if(yank){snap();buf.splice(cy+1,0,...yank.lines.slice());cy++;cx=0;dirty=true;}break;}
        case "P":{if(yank){snap();buf.splice(cy,0,...yank.lines.slice());cx=0;dirty=true;}break;}
        case "i":mode="i";break;
        case "I":{const m=line().match(/\S/);cx=m?m.index:0;mode="i";break;}
        case "a":cx=Math.min(line().length,cx+1);mode="i";break;
        case "A":cx=line().length;mode="i";break;
        case "o":snap();buf.splice(cy+1,0,"");cy++;cx=0;mode="i";dirty=true;break;
        case "O":snap();buf.splice(cy,0,"");cx=0;mode="i";dirty=true;break;
        case "u":{if(undo){const u=undo;undo={buf:buf.slice(),cy,cx};buf=u.buf;cy=u.cy;cx=u.cx;}break;}
        case ":":mode=":";cmd="";break;
        case "/":mode="/";cmd="";break;
        case "n":search(null,true);break;
        case "Escape":break;
        default:
          if(e.ctrlKey&&k.toLowerCase()==="f"){cy+=body;top+=body;}
          else if(e.ctrlKey&&k.toLowerCase()==="b"){cy-=body;top=Math.max(0,top-body);}
          else if(e.ctrlKey&&k.toLowerCase()==="g"){msg='"'+(path||"?")+'"'+(dirty?" [Modified]":"")+" line "+(cy+1)+" of "+buf.length;}
          else if(k.length===1){term.bellFn();}
          break;
      }
      draw();
    };
    let snappedForInsert=false;
    function snapOnce(){if(!snappedForInsert){snap();snappedForInsert=true;setTimeout(()=>snappedForInsert=false,0);} }
    draw();
  });
}
/* =====================================================================
   the shell — csh(1), BSD userland, SunOS 4.1.4 to the bone
   ===================================================================== */
let TTYSEQ=0;
const PRINTQ=[];         /* shared with Print Tool */
let PRINTSEQ=17;

class Shell{
  constructor(term,opts){
    opts=opts||{};
    this.term=term;
    this.user=opts.user||"demo";
    this.env={HOME:this.user==="root"?"/":"/export/home/demo",USER:this.user,
      PATH:"/usr/openwin/bin:/usr/ucb:/usr/bin:/bin:/usr/etc:.",SHELL:"/bin/csh",TERM:"sun",
      OPENWINHOME:"/usr/openwin",PRINTER:"lw"};
    this.cwd=this.env.HOME;
    this.aliases={ll:"ls -lg",h:"history"};
    this.isConsole=!!opts.console;
    this.hist=this.isConsole?(ST.d.hist||[]):[];
    this.onExit=opts.onExit||null;
    this.tty=opts.tty||(this.isConsole?"console":"p"+(TTYSEQ++));
    this.dead=false;this.intr=false;this.subsh=false;this.suStack=[];
    this.bootId=SIM.bootId;
    this.biff=true;
  }
  alive(){return !this.dead&&this.bootId===SIM.bootId;}
  prompt(){if(this.subsh)return this.user==="root"?"# ":"$ ";
    return SIM.host+(this.user==="root"?"# ":"% ");}
  async nfs(path){await NET.touch(path,this.term);}
  write(s){this.term.write(s);}
  async repl(){
    while(this.alive()){
      this.term.write(this.prompt());
      const line=await readLine(this.term,{hist:this.hist});
      if(!this.alive())return;
      if(line===null){ /* ^D */
        if(this.suStack.length){this.popSu();continue;}
        if(this.subsh){this.subsh=false;this.user=this.subUser||this.user;continue;}
        this.term.write("logout\n");
        if(this.onExit){this.dead=true;this.onExit();return;}
        continue;
      }
      if(line==="\x03")continue;
      await this.exec(line);
    }
  }
  popSu(){const prev=this.suStack.pop();this.user=prev.user;this.env=prev.env;this.cwd=prev.cwd;}
  addHist(line){
    if(!line.trim())return;
    if(this.hist[this.hist.length-1]!==line)this.hist.push(line);
    if(this.hist.length>100)this.hist.shift();
    if(this.isConsole){ST.d.hist=this.hist;ST.lazySave();}
  }
  histExpand(line){
    if(!/[!]/.test(line))return line;
    const h=this.hist;
    const out=line.replace(/!(!|-?\d+|[a-zA-Z]\w*)/g,(m,ref)=>{
      let s=null;
      if(ref==="!")s=h[h.length-1];
      else if(/^-?\d+$/.test(ref)){const n=parseInt(ref);s=n<0?h[h.length+n]:h[n-1];}
      else{for(let i=h.length-1;i>=0;i--)if(h[i].startsWith(ref)){s=h[i];break;}}
      if(s===null||s===undefined)throw new Error(ref+": Event not found.");

  }
  expandVars(tok){
    return tok.replace(/\$(\w+)/g,(m,v)=>this.env[v]!==undefined?this.env[v]:m)

  tokenize(s){

    const dir=vfsGet(normPath(dirPart||".",this.cwd));
    if(!dir||dir.t!=="d")return[tok];
    const re=new RegExp("^"+pat.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\*/g,".*").replace(/\?/g,".")+"$");
    const m=Object.keys(dir.c).filter(n=>!n.startsWith(".")&&re.test(n)).sort().map(n=>dirPart+n);
    return m.length?m:null;
  }
  async exec(line){
    line=line.trim();
    if(!line)return;
    ACT.bump(14);
    let expanded;
    try{expanded=this.histExpand(line);}
    catch(e){this.term.write(e.message+"\n");return;}
    if(expanded!==line)this.term.write(expanded+"\n");
    this.addHist(expanded);
    /* alias (first word only, once) */
    const fw=expanded.split(/\s+/)[0];
    if(this.aliases[fw])expanded=this.aliases[fw]+expanded.slice(fw.length);
    /* sequences: sync; sync; halt */
    const seqs=expanded.split(";");

      if(seq.trim())await this.execPipeline(seq.trim());
    }
  }
  async execPipeline(line){
    this.intr=false;
    const segs=line.split("|").map(s=>s.trim()).filter(Boolean);
    if(!segs.length)return;
    let buffer=null;                 // stdin for next stage
    /* interrupt catcher while a command runs */
    const prevRaw=this.term.raw;
    for(let si=0;si<segs.length;si++){
      let toks=this.tokenize(segs[si]).map(t=>this.expandVars(t));
      /* redirection (last segment) */
      let redir=null,append=false;
      const ri=toks.findIndex(t=>t===">"||t===">>");
      if(ri>=0){append=toks[ri]===">>";redir=toks[ri+1];toks=toks.slice(0,ri);}
      else{
        const m=toks.length&&toks[toks.length-1].match(/^(>>?)(.+)$/);
        if(m){append=m[1]===">>";redir=m[2];toks=toks.slice(0,-1);}
      }
      if(!toks.length)continue;
      /* glob expansion */
      let argv=[toks[0]];
      let globFail=null;
      for(let i=1;i<toks.length;i++){
        const g=this.glob(toks[i]);
        if(g===null){globFail=true;}
        else argv.push(...g);
      }
      if(globFail&&argv.length===1){this.term.write(toks[0]+": No match.\n");return;}
      const name=argv[0],args=argv.slice(1);
      let out=[];
      const lastStage=(si===segs.length-1);
      const io={
        sh:this,stdin:buffer,
        interactive:lastStage&&!redir,
        out:s=>out.push(s),
      };
      const cmd=this.lookup(name);
      if(!cmd){this.term.write(name+": Command not found.\n");return;}
      if(!this.term.raw)this.term.raw=e=>{
        if(e.ctrlKey&&e.key.toLowerCase()==="c"){this.intr=true;this.term.write("^C\n");}
      };
      try{await cmd.call(null,this,io,args,name);}
      catch(err){this.term.write(name+": internal simulation fault ("+(err&&err.message)+")\n");}
      /* only a living shell owns the terminal: halt and reboot hand it to the PROM,
         and stealing the key handler back would leave 'ok' unable to hear 'boot' */
      if(this.alive()&&this.term.raw&&!this.screenBusy)this.term.raw=prevRaw||null;
      buffer=out.join("");
      if(!this.alive())return;
      if(this.intr)break;
      if(lastStage){
        if(redir){
          const p=normPath(redir,this.cwd);
          await this.nfs(p);
          const ex=vfsGet(p);
          const data=(append&&ex&&ex.t==="f"?fdata(ex):"")+buffer;
          if(!vfsWrite(p,data,this.user))this.term.write(redir+": Permission denied.\n");
        }else if(buffer)this.term.write(buffer);
      }
    }
    if(this.alive())this.term.raw=prevRaw||null;
  }
  lookup(name){
    if(CMDS[name])return CMDS[name];
    /* running ./a.out or a compiled artifact */
    const p=normPath(name.startsWith("/")||name.startsWith("./")?name:name,this.cwd);
    const node=vfsGet(p);
    if(node&&node.t==="f"&&node.exeOut!==undefined){
      return async(sh,io)=>{io.out(node.exeOut);};
    }
    if(name==="a.out"){const n2=vfsGet(normPath("a.out",this.cwd));
      if(n2&&n2.exeOut!==undefined)return async(sh,io)=>io.out(n2.exeOut);}
    return null;
  }
  async isleep(ms){
    const step=100;let t=0;
    while(t<ms&&!this.intr&&this.alive()){await FREEZE.wait();await sleep(Math.min(step,ms-t));t+=step;}
  }
}

function lsLong(name,node,grp){
  const links=node.t==="d"?2+Object.keys(node.c).filter(k=>node.c[k].t==="d").length:1;
  let nm=name;
  if(node.t==="l")nm=name+" -> "+node.to;
  return node.mode+" "+lpad(links,3)+" "+rpad(node.own||"root",8)+
    (grp?" "+rpad(node.grp||"wheel",8):"")+
    lpad(fsize(node),7)+" "+fmtLsDate(node.mt||T94(9,14))+" "+nm;
}

function bannerArt(text){
  const cv=document.createElement("canvas");
  const chars=text.slice(0,10);
  cv.width=8*chars.length;cv.height=8;
  const g=cv.getContext("2d");
  g.fillStyle="#000";g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle="#fff";g.font="bold 8px monospace";g.textBaseline="top";
  for(let i=0;i<chars.length;i++)g.fillText(chars[i],i*8+1,0);
  const px=g.getImageData(0,0,cv.width,cv.height).data;
  let out="";
  for(let y=0;y<8;y++){let row="";
    for(let x=0;x<cv.width;x++)row+=px[(y*cv.width+x)*4]>100?"#":" ";
    out+=row.replace(/\s+$/,"")+"\n";}
  return out;
}

/* ---------- the command registry ---------- */
const CMDS={};
function C(names,fn){for(const n of names.split(" "))CMDS[n]=fn;}

C("ls",async(sh,io,args)=>{
  let flags="",paths=[];
  for(const a of args){if(a.startsWith("-"))flags+=a.slice(1);else paths.push(a);}
  const long=flags.includes("l"),all=flags.includes("a"),grp=flags.includes("g"),F=flags.includes("F");
  if(!paths.length)paths=["."];
  let out=[];
  for(const p0 of paths){
    const p=normPath(p0,sh.cwd);
    await sh.nfs(p);
    const node=vfsGet(p);
    if(!node){out.push(p0+" not found");continue;}
    if(node.t!=="d"){out.push(long?lsLong(p0,node,grp):p0);continue;}
    let names=Object.keys(node.c).sort();
    if(!all)names=names.filter(n=>!n.startsWith("."));
    else names=[".",".."].concat(names);
    if(paths.length>1)out.push(p0+":");
    if(long){
      out.push("total "+names.reduce((a,n)=>a+Math.ceil(fsize(n==="."||n===".."?node:node.c[n])/512),0));
      for(const n of names)out.push(lsLong(n,n==="."||n===".."?node:node.c[n],grp));
    }else{
      const dec=n=>{if(!F)return n;const c=n==="."||n===".."?node:node.c[n];
        return n+(c.t==="d"?"/":(c.t==="l"?"@":(c.mode&&c.mode[3]==="x"?"*":"")));};
      const dn=names.map(dec);
      const w=Math.max(...dn.map(n=>n.length))+2;
      const perRow=Math.max(1,Math.floor(80/w));
      for(let i=0;i<dn.length;i+=perRow)out.push(dn.slice(i,i+perRow).map(n=>rpad(n,w)).join("").replace(/\s+$/,""));
    }
  }
  if(out.length)io.out(out.join("\n")+"\n");
});

C("grep egrep fgrep",async(sh,io,args)=>{
  let inv=false,ic=false,num=false,pat=null;const files=[];
  for(const a of args){
    if(a==="-v")inv=true;else if(a==="-i")ic=true;else if(a==="-n")num=true;
    else if(pat===null)pat=a;else files.push(a);
  }
  if(pat===null){io.out("usage: grep [ -vni ] pattern [ file ... ]\n");return;}
  let re;try{re=new RegExp(pat,ic?"i":"");}catch(e){re=new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),ic?"i":"");}
  async function doText(text,label){
    const L=text.split("\n");if(L[L.length-1]==="")L.pop();
    L.forEach((l,i)=>{if(re.test(l)!==inv)io.out((label?label+":":"")+(num?(i+1)+":":"")+l+"\n");});
  }
  if(!files.length)await doText(io.stdin||"");
  else for(const f of files){const p=normPath(f,sh.cwd);await sh.nfs(p);
    const nd=vfsGet(p);
    if(!nd){io.out("grep: "+f+": No such file or directory\n");continue;}
    await doText(fdata(nd),files.length>1?f:null);}
});
C("wc",async(sh,io,args)=>{
  const files=args.filter(a=>!a.startsWith("-"));
  const flags=args.filter(a=>a.startsWith("-")).join("");
  function count(text,label){
    const l=(text.match(/\n/g)||[]).length;
    const w=(text.match(/\S+/g)||[]).length;
    const c=text.length;
    let s="";
    if(!flags||flags.includes("l"))s+=lpad(l,8);
    if(!flags||flags.includes("w"))s+=lpad(w,8);
    if(!flags||flags.includes("c"))s+=lpad(c,8);
    io.out(s+(label?" "+label:"")+"\n");
  }
  if(!files.length)count(io.stdin||"");
  else for(const f of files){const nd=vfsGet(normPath(f,sh.cwd));
    if(nd)count(fdata(nd),f);else io.out("wc: "+f+" not found\n");}
});

C("rlogin",async(sh,io,args)=>{
  const host=args[0];
  if(!host){io.out("usage: rlogin host\n");return;}
  if(!NET.hosts[host]||host===SIM.host){io.out(host+": unknown host\n");return;}
  if(!io.interactive)return;
  if(host!=="fileserver"){await sh.isleep(2500);sh.term.write(host+": Connection timed out\n");return;}
  await sh.isleep(700);
  sh.term.write("Last login: Mon Nov 14 17:22:41 from sundance\n"+
    "SunOS Release 4.1.4 (FILESERVER) #4: Wed Sep 21 03:11:09 PDT 1994\n"+
    "fileserver, keeper of /export/home.  Be gentle.  Log out when done.\n");
  while(sh.alive()){
    sh.term.write("fileserver% ");
    const line=await readLine(sh.term,{hist:[]});
    if(line===null||line==="logout"||line==="exit"){sh.term.write("Connection closed.\n");return;}
    if(line==="\x03"||!line.trim())continue;
    const t=line.trim();
    if(t==="uname -a")sh.term.write("SunOS fileserver 4.1.4 4 sun4m\n");
    else if(t==="hostname")sh.term.write("fileserver\n");
    else if(t.startsWith("ls"))sh.term.write("export   home     var\n");
    else if(t==="who")sh.term.write("wendy    ttyp2    Nov 15 09:15  (sundance)\nkjs      console  Nov 15 07:58\n");
    else if(t==="uptime")sh.term.write("  2:31pm  up 92 days,  4:31,  2 users,  load average: 1.92, 1.75, 1.60\n");
    else if(t.startsWith("cd"))sh.term.write("");
    else sh.term.write(t.split(/\s/)[0]+": Command not found.  (fileserver is busy; try commands it likes: uname -a, who, uptime, ls, logout)\n");
  }
});

C("cc gcc",async(sh,io,args,name)=>{
  if(name==="gcc"){io.out("gcc: Command not found.\n(there is a copy on fileserver:/usr/local, like everywhere else in 1994)\n");return;}
  let out="a.out";const files=[];
  for(let i=0;i<args.length;i++){
    if(args[i]==="-o"){out=args[++i];continue;}
    if(args[i].startsWith("-"))continue;
    files.push(args[i]);
  }
  if(!files.length){io.out("cc: no input files\n");return;}
  const p=normPath(files[0],sh.cwd);await sh.nfs(p);
  const n=vfsGet(p);
  if(!n||n.t!=="f"){io.out("cc: "+files[0]+": No such file or directory\n");return;}
  const src=fdata(n);
  ACT.bump(45);
  await sh.isleep(1200+Math.random()*600);
  if(!/main\s*\(/.test(src)){io.out("ld: Undefined symbol\n   _main\n");return;}
  let text="";
  const re=/printf\s*\(\s*"((?:[^"\\]|\\.)*)"/g;let m;
  while((m=re.exec(src)))text+=m[1].replace(/\\n/g,"\n").replace(/\\t/g,"\t").replace(/\\"/g,'"').replace(/%[sd]/g,"42");
  const node=vfsWrite(normPath(out,sh.cwd),"\x7fELF",sh.user);
  if(node){node.mode="-rwxr-xr-x";node.exeOut=text||"";node.size=24576+src.length*3;homeChanged();}
});

C("tar",async(sh,io,args)=>{
  const mode=args[0]||"";
  const files=args.slice(1).filter(a=>!a.startsWith("/dev/"));
  const dev=args.find(a=>a.startsWith("/dev/"));
  if(mode.includes("t")){
    io.out("tar: reading "+(dev||"/dev/rst0")+"\n");
    await sh.isleep(900);
    io.out("thesis/\nthesis/ch1.tr\nthesis/ch4.tr\nTODO\nnotes\n");
    return;
  }
  if(mode.includes("c")){
    const list=files.length?files:["."];
    for(const f of list){
      const p=normPath(f,sh.cwd);await sh.nfs(p);
      const n=vfsGet(p);
      if(!n){io.out("tar: "+f+": No such file or directory\n");continue;}
      const emit=(path,node)=>{
        if(mode.includes("v"))io.out("a "+path+(node.t==="d"?"/":" "+Math.max(1,Math.ceil(fsize(node)/512))+" blocks")+"\n");
        if(node.t==="d")for(const k in node.c)emit(path+"/"+k,node.c[k]);
      };
      emit(f.replace(/\/+$/,""),n);
      await sh.isleep(400);
    }
    return;
  }
  if(mode.includes("x")){io.out("tar: blocksize = 20\n");await sh.isleep(700);io.out("tar: extract complete (into the same imaginary place it came from)\n");return;}
  io.out("tar: usage  tar [ cxt ][ vf ] [ tapefile ] files ...\n");
});

/* =====================================================================
   talk(1) — the split screen, and the once-a-session interruption
   ===================================================================== */
async function runTalk(sh){
  const term=sh.term;
  term.enterScreen();
  const mid=Math.floor(term.rows/2);
  const mine=[],theirs=[];
  let done=false;
  function draw(){
    term.setRow(0,"[Connection established]",true);
    for(let r=1;r<mid;r++)term.setRow(r,mine[r-1]||"");
    let dash="";for(let i=0;i<term.cols;i++)dash+="-";
    term.setRow(mid,dash);
    for(let r=mid+1;r<term.rows;r++)term.setRow(r,theirs[r-mid-1]||"");
    const my=mine.length?mine[mine.length-1]:"";
    term.setCur(Math.max(1,mine.length),my.length);
    term.render();
  }
  function sayTheirs(s,cps){
    return new Promise(res=>{
      theirs.push("");
      let i=0;
      const t=setInterval(()=>{
        if(done){clearInterval(t);res();return;}
        if(FREEZE.on)return;              /* even wendy waits for 'go' */
        theirs[theirs.length-1]+=s[i++];draw();
        if(i>=s.length){clearInterval(t);res();}
      },cps||45);
    });
  }
  mine.push("");
  term.raw=e=>{
    if(e.ctrlKey&&(e.key.toLowerCase()==="c"||e.key.toLowerCase()==="d")){finish();return;}
    if(e.key==="Enter"){mine.push("");if(mine.length>mid-1)mine.shift();draw();return;}
    if(e.key==="Backspace"){const l=mine[mine.length-1];mine[mine.length-1]=l.slice(0,-1);draw();return;}
    if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){mine[mine.length-1]+=e.key;draw();SND.click();}
  };
  draw();
  const script=[
    [1200,"hey.  saw your machine drop to the ok prompt earlier"],
    [3500,"stop-a again?  you know kjs can see the console logs, right"],
    [4200,"anyway.  migration meeting thursday.  10am.  they have slides."],
    [3800,"forty-one slides.  wendy counted."],
    [4200,"bring coffee.  bring TWO coffees."],
    [5000,"ok back to work.  the build won't break itself.  (it will)"]
  ];
  (async()=>{
    for(const [d,s] of script){
      await sleep(d);
      if(done)return;
      await sayTheirs(s);
    }
    await sleep(4000);
    if(!done){await sayTheirs("[Connection closing.  Exiting]");await sleep(900);finish();}
  })();
  function finish(){
    if(done)return;done=true;
    term.raw=null;term.exitScreen();
    term.write("[Connection closed.  Exiting]\n");
  }
  while(!done)await sleep(200);
}
/* the once-per-session drive-by */
function scheduleTalkPester(){
  setTimeout(()=>{
    if(SIM.session.talkDone)return;
    SIM.session.talkDone=true;
    const term=(SIM.mode==="desktop"&&WM.focusWin&&WM.focusWin.term)?WM.focusWin.term:
      (SIM.mode==="console"?CONSOLE.term:null);
    if(!term)return;
    term.write("\x07\nMessage from Talk_Daemon@"+SIM.host+" at "+fmtClock(simNow())+" ...\n"+
      "talk: connection requested by wendy@fileserver.\n"+
      "talk: respond with:  talk wendy@fileserver\n");
  },240000+Math.random()*120000);
}

function manPage(name,sect,title,body){
  const hdr=name.toUpperCase()+"("+sect+")";
  const mid=sect==="1"?"USER COMMANDS":sect==="7"?"MISCELLANEOUS":"MAINTENANCE COMMANDS";
  const pad1=Math.max(1,Math.floor((66-hdr.length*2-mid.length)/2));
  return hdr+" ".repeat(pad1)+mid+" ".repeat(Math.max(1,66-hdr.length*2-mid.length-pad1))+hdr+"\n\n"+
    "NAME\n     "+title+"\n\n"+body+
    "\n\nSun Release 4.1       Last change: 22 September 1993              1\n";
}

/* =====================================================================
   the glass console + PROM monitor + boot manager
   ===================================================================== */
const GLASS={
  el:$id("glass"),
  term:null,
  init(){this.term=new Term($id("glasspre"),80,38,{scrollback:400});},
  show(){this.el.style.display="block";$id("desktop").classList.remove("on");},
};

/* ---------- PROM (OpenBoot flavour) ---------- */
const PROM={
  get vars(){return ST.d.nvram;},
  savedHTML:null,
  bannerLines(){
    const L=[];
    if(this.vars["oem-banner?"]==="true"&&this.vars["oem-banner"])
      L.push(this.vars["oem-banner"]);
    L.push("SPARCstation 2, Type 4 Keyboard");
    L.push("ROM Rev. 2.2, 32 MB memory installed, Serial #12648430");
    L.push("Ethernet address 8:0:20:1a:c3:5d, Host ID: 55c0ffee");
    return L;
  },
  /* enter the monitor.  frozen=true means Stop-A: the world is held, not dead */
  enter(frozen){
    const t=GLASS.term;
    if(frozen){
      FREEZE.hold();
      SIM.frozen={mode:SIM.mode,html:$id("glasspre").innerHTML,
        lines:t.lines.slice(),screen:t.screen,saved:t.savedLines,raw:t.raw};
      /* seed the monitor's screen with whatever was frozen there */
      if(SIM.mode==="desktop"){t.lines=[""];}
      else{t.lines=$id("glasspre").textContent.split("\n").slice(-30);}
      t.screen=null;t.savedLines=null;t.raw=null;
      GLASS.show();
      t.write("\nAbort at PC 0x"+((Math.random()*0xffffff)|0).toString(16)+"\nType  'go' to resume\n");
    }else{
      SIM.frozen=null;FREEZE.release();
    }
    SIM.mode="prom";
    ST.d.last="prom";ST.lazySave();
    this.loop();
  },
  async loop(){
    const t=GLASS.term;
    const myBoot=SIM.bootId;
    while(SIM.mode==="prom"&&myBoot===SIM.bootId){
      t.write("ok ");
      const line=await readLine(t,{hist:[]});
      if(SIM.mode!=="prom"||myBoot!==SIM.bootId)return;
      if(line===null||line==="\x03")continue;
      const done=await this.cmd(line.trim());
      if(done)return;
    }
  },
  async cmd(line){
    const t=GLASS.term;
    if(!line)return false;
    const [c,...rest]=line.split(/\s+/);
    switch(c){
      case "banner":
        SND.beep();
        t.write("\n"+this.bannerLines().join("\n")+"\n\n");return false;
      case "printenv":{
        if(rest[0]){const v=this.vars[rest[0]];
          t.write(rest[0]+" = "+(v!==undefined?v:"no such parameter")+"\n");return false;}
        t.write("Parameter Name        Value                          Default Value\n");
        const defs=ST.defaults().nvram;
        for(const k in this.vars)
          t.write(rpad(k,22)+rpad(this.vars[k]===""?"":this.vars[k],31)+(defs[k]||"")+"\n");
        return false;}
      case "setenv":{
        if(!rest.length){t.write("Usage: setenv parameter-name value\n");return false;}
        const key=rest[0],val=rest.slice(1).join(" ");
        this.vars[key]=val;
        if(key==="oem-banner"&&val)this.vars["oem-banner?"]="true";
        t.write(key+" = "+val+"\n");
        ST.lazySave();return false;}
      case "set-defaults":
        ST.d.nvram=ST.defaults().nvram;t.write("Setting NVRAM parameters to default values.\n");ST.lazySave();return false;
      case "probe-scsi":
        t.write("Target 1\n  Unit 0   Disk     SUN0535 Copyright (C) 1994 Sun Microsystems\n"+
                "Target 3\n  Unit 0   Disk     SUN0424 Copyright (C) 1994 Sun Microsystems\n"+
                "Target 4\n  Unit 0   Removable Tape  ARCHIVE QIC-150\n");
        await sleep(400);return false;
      case "test-all":
        t.write("Testing /sbus/dma@0,400000  ");await sleep(500);t.write("ok\n");
        t.write("Testing /sbus/esp@0,800000  ");await sleep(700);t.write("ok\n");
        t.write("Testing /sbus/le@0,c00000   ");await sleep(600);t.write("ok\n");
        t.write("Testing /sbus/cgsix@1,0     ");await sleep(500);t.write("ok\n");
        t.write("Testing memory              ");await sleep(900);t.write("32 MB ok\n");
        return false;
      case "test":
        t.write("Testing "+(rest[0]||"nothing")+"  ");await sleep(600);t.write("ok\n");return false;
      case "go":
        if(SIM.frozen){
          const f=SIM.frozen;SIM.frozen=null;
          const t2=GLASS.term;
          t2.lines=f.lines;t2.screen=f.screen;t2.savedLines=f.saved;t2.raw=f.raw;
          SIM.mode=f.mode;
          if(f.mode==="desktop"){$id("desktop").classList.add("on");GLASS.el.style.display="none";}
          else t2.render();
          ST.d.last=f.mode==="desktop"?"openwin":"console";ST.lazySave();
          FREEZE.release();      /* and the world picks up exactly where it stopped */
          return true;
        }
        t.write("go: nothing to resume; the program is gone.  Try  boot\n");
        return false;
      case "boot":case "b":
        SIM.frozen=null;
        BOOT.run(false,rest.join(" "));
        return true;
      case "reset":
        t.write("Resetting ...\n");await sleep(1200);
        SIM.frozen=null;BOOT.run(false);return true;
      case "sync":
        t.write("syncing file systems... done\n");return false;
      case "eject":
        t.write("fd0: no floppy in drive (there was never a floppy in the drive)\n");return false;
      case "help":
        t.write("Type  help <category>  in a real PROM.  This one knows:\n"+
          "  banner        show the power-on banner\n"+
          "  printenv      display NVRAM parameters\n"+
          "  setenv        change an NVRAM parameter (try oem-banner)\n"+
          "  set-defaults  restore NVRAM defaults\n"+
          "  probe-scsi    list devices on the SCSI bus\n"+
          "  test-all      run the self-tests\n"+
          "  boot          load and start the operating system\n"+
          "  go            resume a program interrupted with L1-A (Stop-A)\n");
        return false;
      default:
        t.write(c+": unknown command\n");return false;
    }
  }
};

/* ---------- boot manager: the whole BSD liturgy ---------- */
const BOOT={
  skip:false,
  async d(ms){await FREEZE.wait();if(!this.skip)await sleep(ms);},
  probeLines(){return[
    "mem = 32768K (0x2000000)",
    "avail mem = 29888512",
    "Ethernet address = 8:0:20:1a:c3:5d",
    "cpu = SUNW,Sun 4/75",
    "zs0 at obio 0xf1000000 pri 12",
    "zs1 at obio 0xf0000000 pri 12",
    "audio0 at obio 0xf7201000 pri 13",
    "sbus0 at SBus slot 0 0x0",
    "dma0 at SBus slot 0 0x400000",
    "esp0 at SBus slot 0 0x800000 pri 3",
    "sd0 at esp0 target 3 lun 0",
    "sd0: <SUN0424 cyl 1151 alt 2 hd 9 sec 80>",
    "sd1 at esp0 target 1 lun 0",
    "sd1: <SUN0535 cyl 1866 alt 2 hd 7 sec 80>",
    "st0 at esp0 target 4 lun 0",
    "st0: <Archive QIC-150>",
    "fd0 at obio 0xf7200000 pri 11",
    "le0 at SBus slot 0 0xc00000 pri 5",
    "cgsix0 at SBus slot 1 0x0",
    "cgsix0: screen 1152x900, single buffered, 1M mappable, rev 6",
    "root on sd0a fstype 4.2",
    "swap on sd0b fstype spec size 65520K",
    "dump on sd0b fstype spec size 65508K"
  ];},
  async run(powerOn,bootArgs){
    SIM.bootId++;
    const myBoot=SIM.bootId;
    SIM.frozen=null;FREEZE.release();
    teardownDesktop();
    SIM.mode="boot";this.skip=false;
    SIM.session={talkDone:false,nfsDone:false,homeTouch:0,mailReplied:false};
    GLASS.show();
    const t=GLASS.term;
    t.raw=null;t.screen=null;t.clear();
    hint("ESC skips ahead · Ctrl+Alt+A is Stop-A (L1-A)");
    /* a boot held at the ok prompt by Stop-A is suspended, not abandoned */
    const alive=()=>SIM.bootId===myBoot&&
      (SIM.mode==="boot"||(SIM.frozen&&SIM.frozen.mode==="boot"));
    if(powerOn){
      SND.beep();
      await this.d(700);if(!alive())return;
      t.write("Testing");
      for(let i=0;i<5;i++){await this.d(320);if(!alive())return;t.write(".");}
      t.write("\n\n");
    }
    t.write(PROM.bannerLines().join("\n")+"\n\n");
    await this.d(900);if(!alive())return;

/* ---------- console session: login, motd, csh ---------- */
const CONSOLE={
  get term(){return GLASS.term;},
  shell:null,
  async loginLoop(autoScript){
    const t=this.term;
    const myBoot=SIM.bootId;
    ST.d.last="console";ST.lazySave();
    while(SIM.mode==="console"&&myBoot===SIM.bootId){
      t.write("\n"+SIM.host+" console login: ");
      let user;
      if(autoScript&&autoScript.length){user=autoScript.shift();t.write(user+"\n");}
      else user=await readLine(t,{});
      if(SIM.mode!=="console"||myBoot!==SIM.bootId)return;
      if(user===null||user==="\x03"||!user.trim())continue;
      user=user.trim();
      if(user!=="demo"&&user!=="root"){
        t.write("Password:");
        await readLine(t,{echo:false});
        await sleep(900);
        t.write("\nLogin incorrect\n");
        continue;
      }
      if(user==="root"){
        t.write("Password:");
        const pw=(autoScript)?"":await readLine(t,{echo:false});
        t.write("\n");
        if(pw!==""){await sleep(900);t.write("Login incorrect\n");continue;}
        await sleep(300);
        t.write("Last login: Fri Nov 11 23:40:41 on console\n");
        t.write("SunOS Release 4.1.4 (GENERIC) #2: Fri Oct 14 11:09:07 PDT 1994\n");
        t.write("\n(yes: return at the password prompt.  it was a simpler, riskier time,\n"+
                " and this particular machine never did get around to having one.)\n\n");
        t.write("You have new mail.\n");
      }else{
        await sleep(250);
        t.write("Last login: Mon Nov 14 09:12:03 on console\n");
        t.write(ETC_MOTD);
        const unread=MAIL_MSGS.concat(ST.d.mailExtra||[]).filter(m=>
          (ST.d.mailGone||[]).indexOf(m.id)<0&&(ST.d.mailRead||[]).indexOf(m.id)<0).length;
        t.write(unread?"You have new mail.\n":"You have mail.\n");
      }
      const sh=new Shell(t,{user,console:true,tty:"console",
        onExit:()=>{/* logout: fall out of repl, loop prints login: again */}});
      this.shell=sh;SIM.consoleShell=sh;SIM.user=user;
      scheduleTalkPester();
      if(autoScript&&autoScript.length){
        const cmd=autoScript.shift();
        t.write(sh.prompt()+cmd+"\n");
        await sh.exec(cmd);
      }
      await sh.repl();
      if(SIM.mode!=="console"||myBoot!==SIM.bootId)return;
      SIM.user=null;
    }
  }
};

/* ---------- system lifecycle ---------- */
const SYS={
  owResolve:null,
  async startOpenWin(sh){
    const t=sh.term;
    ST.d.last="openwin";ST.lazySave();
    const chatter=[
      ["Starting OpenWindows Version 3 (X11/NeWS server)...",500],
      ["xnews: X11 Version 11 revision 5; NeWS Version 3",400],
      ["Using display :0, frame buffer /dev/fb (cgsix0, 1152x900)",450],
      ["olwm: OPEN LOOK window manager",380],
      ["Starting DeskSet tools...",600]
    ];
    for(const [line,ms] of chatter){t.write(line+"\n");await sleep(ms);ACT.bump(30);}
    await sleep(400);
    SIM.mode="desktop";
    enterDesktop();
    /* the console shell blocks here until the workspace Exit */
    await new Promise(res=>{this.owResolve=res;});
    if(!sh.alive())return;
    SIM.mode="console";
    ST.d.last="console";ST.lazySave();
    GLASS.show();
    t.write("\nExiting OpenWindows...\nX11/NeWS server shut down.\n");
    await sleep(300);
  },
  exitOpenWin(){
    teardownDesktop();
    if(this.owResolve){const r=this.owResolve;this.owResolve=null;r();}
  },
  async halt(sh,reboot,broadcast){
    const t=sh.term;
    SIM.frozen=null;FREEZE.release();
    ACT.bump(60);
    if(broadcast){
      t.write("Shutdown at "+fmtClock(simNow())+" (in 0 minutes)\n\n");
      await sleep(500);
      t.write("        *** FINAL System shutdown message from "+sh.user+"@"+SIM.host+" ***\n\n"+
              "System going down IMMEDIATELY\n\n");
      await sleep(1000);
    }
    const wasDesktop=SIM.mode==="desktop";
    if(wasDesktop){teardownDesktop();GLASS.show();
      if(this.owResolve){this.owResolve=null;}}
    SIM.mode="halting";
    const gt=GLASS.term;
    gt.raw=null;gt.screen=null;
    gt.write("\n"+SIM.host+" syncing file systems...");
    await sleep(900);
    gt.write(" done\n");
    await sleep(500);
    if(reboot){gt.write("rebooting...\n");await sleep(900);BOOT.run(false);return;}
    gt.write("Halted\n\nProgram terminated\n");
    SIM.bootId++;         /* orphan every pending shell loop */
    PROM.enter(false);
  }
};

   OPEN LOOK toolkit — pushpins, menus, notices, the elevator
