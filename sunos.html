let STAGE_SCALE=1;
function stagePoint(e){
  const r=$id("stage").getBoundingClientRect();
  return{x:(e.clientX-r.left)/STAGE_SCALE,y:(e.clientY-r.top)/STAGE_SCALE};
}
function pinSVG(pinned){
  if(pinned)
    return '<svg width="16" height="16" viewBox="0 0 16 16">'+
      '<circle cx="8" cy="4.5" r="3" fill="#d9d5c9" stroke="#333"/>'+
      '<rect x="7" y="7" width="2" height="6" fill="#555" stroke="#333" stroke-width=".5"/>'+
      '<ellipse cx="8" cy="13" rx="4" ry="1.4" fill="none" stroke="#333"/></svg>';
  return '<svg width="16" height="16" viewBox="0 0 16 16">'+
    '<ellipse cx="11" cy="13" rx="4" ry="1.4" fill="none" stroke="#333"/>'+
    '<g transform="rotate(-40 6 8)">'+
    '<circle cx="3" cy="5" r="3" fill="#d9d5c9" stroke="#333"/>'+
    '<rect x="2.2" y="7.6" width="1.6" height="5.5" fill="#555" stroke="#333" stroke-width=".5"/>'+
    '</g></svg>';
}

/* ---------- menus ---------- */
const MENUS={
  open:[],          /* stack of transient menus */
  pressSession:null,
  closeAll(){for(const m of this.open)m.remove();this.open=[];this.pressSession=null;},
  /* spec: {title, pin, items:[{label,action,def,sub,dis}]} */
  show(spec,x,y,opts){
    opts=opts||{};
    const layer=$id("menulayer");
    const m=E("div","olmenu",layer);
    m._depth=opts.depth||0;
    if(spec.title||spec.pin){
      const h=E("div","mhead",m);
      if(spec.pin){
        const p=E("div","pin",h);p.innerHTML=pinSVG(false);
        p.addEventListener("mouseup",ev=>{ev.stopPropagation();this.pinMenu(spec,m);});
        p.addEventListener("mousedown",ev=>ev.stopPropagation());
        p.addEventListener("mouseenter",()=>{p._hot=true;});
      }
      if(spec.title)E("div","mtitle",h,spec.title);
    }
    for(const it of spec.items){
      if(it.sep){E("div","msep",m);continue;}
      const d=E("div","mi"+(it.def?" def":"")+(it.dis?" dis":"")+(it.sub?" sub":""),m,it.label);
      d._item=it;
      d.addEventListener("mouseenter",()=>{
        for(const sib of m.querySelectorAll(".mi"))sib.classList.remove("hot");
        if(!it.dis)d.classList.add("hot");
        /* close deeper menus */
        while(this.open.length&&this.open[this.open.length-1]._depth>m._depth)
          this.open.pop().remove();
        if(it.sub&&!it.dis){
          const r=d.getBoundingClientRect(),sr=$id("stage").getBoundingClientRect();
          this.show(it.sub,(r.right-sr.left)/STAGE_SCALE-4,(r.top-sr.top)/STAGE_SCALE-4,{depth:m._depth+1});
        }
      });
      /* mouseup alone: press-drag-release and click-then-click both end in one, and
         only one, activation.  A click listener here would fire the item twice. */
      d.addEventListener("mouseup",ev=>{this.activate(it,ev);});
    }
    /* clamp to stage */
    layer.appendChild(m);
    const mw=m.offsetWidth,mh=m.offsetHeight;
    m.style.left=clamp(x,2,1150-mw)+"px";
    m.style.top=clamp(y,2,898-mh)+"px";
    this.open.push(m);
    return m;
  },
  activate(it,ev){
    if(!it||it.dis||it.sub)return;
    this.closeAll();
    if(it.action)it.action(ev);
  },
  /* press-drag-release: track mouseup while MENU held */
  beginPress(spec,x,y){
    this.closeAll();
    this.pressSession="press";
    const t0=Date.now(),x0=x,y0=y;
    this.show(spec,x,y);
    const up=ev=>{
      document.removeEventListener("mouseup",up);
      const p=stagePoint(ev);
      const moved=Math.abs(p.x-x0)+Math.abs(p.y-y0)>8||Date.now()-t0>350;
      const el=document.elementFromPoint(ev.clientX,ev.clientY);
      const mi=el&&el.closest?el.closest(".mi"):null;
      if(mi&&mi._item&&!mi._item.sub){this.activate(mi._item,ev);return;}
      const pin=el&&el.closest?el.closest(".pin"):null;
      if(pin)return; /* pin's own handler ran */
      if(moved&&!(el&&el.closest&&el.closest(".olmenu")))this.closeAll();
      else this.pressSession=null; /* posted: stays open */
    };
    document.addEventListener("mouseup",up);
  },
  pinMenu(spec,m){
    this.closeAll();
    const layer=$id("menulayer");
    const pm=E("div","olmenu pinned",layer);
    const h=E("div","mhead",pm);
    const p=E("div","pin",h);p.innerHTML=pinSVG(true);
    p.addEventListener("click",()=>pm.remove());
    E("div","mtitle",h,spec.title||"");
    for(const it of spec.items){
      if(it.sep){E("div","msep",pm);continue;}
      const d=E("div","mi"+(it.def?" def":"")+(it.dis?" dis":"")+(it.sub?" sub":""),pm,it.label);
      d.addEventListener("mouseenter",()=>{if(!it.dis)d.classList.add("hot");});
      d.addEventListener("mouseleave",()=>d.classList.remove("hot"));
      d.addEventListener("click",ev=>{
        if(it.dis)return;
        if(it.sub){const r=d.getBoundingClientRect(),sr=$id("stage").getBoundingClientRect();
          MENUS.show(it.sub,(r.right-sr.left)/STAGE_SCALE-4,(r.top-sr.top)/STAGE_SCALE-4,{depth:9});return;}
        if(it.action)it.action(ev);
      });
    }
    pm.style.left=m.style.left;pm.style.top=m.style.top;
    /* drag the pinned menu by its head */
    h.addEventListener("mousedown",ev=>{
      if(ev.button!==0||ev.target.closest(".pin"))return;
      const p0=stagePoint(ev),ox=pm.offsetLeft-p0.x,oy=pm.offsetTop-p0.y;
      const mv=e2=>{const q=stagePoint(e2);
        pm.style.left=clamp(q.x+ox,0,1152-40)+"px";pm.style.top=clamp(q.y+oy,0,900-20)+"px";};
      const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);};
      document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
    });
  }
};

/* An OPEN LOOK menu button: SELECT-click runs the default item without ever
   showing the menu; SELECT-press-hold, or MENU, posts it.  Half the speed of
   the desktop lived in that distinction. */
function menuButton(el,specFn){
  el.textContent=el.textContent.replace(/\s*▽$/,"")+" ▽";
  el.addEventListener("mousedown",ev=>{
    if(ev.button===2){ev.preventDefault();const q=stagePoint(ev);MENUS.beginPress(specFn(),q.x,q.y);return;}
    if(ev.button!==0)return;
    ev.preventDefault();
    const r=el.getBoundingClientRect(),sr=$id("stage").getBoundingClientRect();
    const x=(r.left-sr.left)/STAGE_SCALE,y=(r.bottom-sr.top)/STAGE_SCALE+2;
    let posted=false;
    const timer=setTimeout(()=>{posted=true;MENUS.beginPress(specFn(),x,y);},240);
    const up=()=>{
      clearTimeout(timer);document.removeEventListener("mouseup",up);
      if(posted)return;
      const def=specFn().items.find(i=>i.def);
      if(def&&def.action)def.action({target:el});
    };
    document.addEventListener("mouseup",up);
  });
}

/* ---------- notices: modal, and they EMANATE ---------- */
let NOTICE_OPEN=false;
function notice(opts){
  return new Promise(resolve=>{
    const layer=$id("noticelayer");
    layer.classList.add("block");
    NOTICE_OPEN=true;
    const shade=E("div","shade",layer);
    SND.bell();
    let ox=576,oy=350;
    if(opts.from){
      if(opts.from.getBoundingClientRect){
        const r=opts.from.getBoundingClientRect(),sr=$id("stage").getBoundingClientRect();
        ox=(r.left+r.width/2-sr.left)/STAGE_SCALE;oy=(r.top+r.height/2-sr.top)/STAGE_SCALE;
      }else{ox=opts.from.x;oy=opts.from.y;}
    }
    const n=E("div","notice",layer);
    E("div","nmsg",n,opts.msg);
    const btns=E("div","nbtns",n);
    n.style.visibility="hidden";
    layer.appendChild(n);
    const nw=Math.min(560,Math.max(280,n.offsetWidth)),nh=n.offsetHeight;
    const nx=clamp(576-nw/2,20,1132-nw),ny=clamp(340-nh/2,20,860-nh);
    n.style.left=nx+"px";n.style.top=ny+"px";
    /* emanation: expanding outline shards from the origin */
    const steps=4;
    let step=0;
    const anim=setInterval(()=>{
      step++;
      const f=step/steps;
      const s=E("div","shard",layer);
      s.style.left=(ox+(nx-ox)*f)+"px";s.style.top=(oy+(ny-oy)*f)+"px";
      s.style.width=(4+(nw-4)*f)+"px";s.style.height=(4+(nh-4)*f)+"px";
      setTimeout(()=>s.remove(),120);
      if(step>=steps){
        clearInterval(anim);
        n.style.visibility="visible";
        (opts.buttons||["Continue"]).forEach((b,i)=>{
          const el=E("div","olbtn"+((opts.def===undefined?0:opts.def)===i?" def":""),btns,b);
          el.addEventListener("click",()=>finish(b));
        });
      }
    },35);
    function finish(label){
      n.remove();shade.remove();
      layer.classList.remove("block");
      NOTICE_OPEN=false;
      resolve(label);
    }
    layer._noticeDefault=()=>{const d=n.querySelector(".olbtn.def");if(d)d.click();};
  });
}

/* ---------- the elevator scrollbar ---------- */
class OLScrollbar{
  /* hooks: total(), view(), top(), scrollTo(line) */
  constructor(parent,hooks){
    this.h=hooks;
    const el=this.el=E("div","olsb",parent);
    el.innerHTML='<div class="anchor top"></div><div class="cable"></div><div class="prop"></div>'+
      '<div class="elev"><div class="b up"></div><div class="b mid"></div><div class="b dn"></div></div>'+
      '<div class="anchor bot"></div>';
    this.elev=el.querySelector(".elev");
    this.prop=el.querySelector(".prop");
    el.querySelector(".anchor.top").addEventListener("click",()=>this.go(0));
    el.querySelector(".anchor.bot").addEventListener("click",()=>this.go(1e9));
    el.querySelector(".b.up").addEventListener("mousedown",ev=>{ev.stopPropagation();this.rel(-1,ev);});
    el.querySelector(".b.dn").addEventListener("mousedown",ev=>{ev.stopPropagation();this.rel(1,ev);});
    el.querySelector(".b.mid").addEventListener("mousedown",ev=>{ev.stopPropagation();this.drag(ev);});
    el.addEventListener("mousedown",ev=>{
      if(ev.button!==0||ev.target.closest(".elev")||ev.target.closest(".anchor"))return;
      const p=stagePoint(ev);
      const er=this.elev.getBoundingClientRect(),sr=$id("stage").getBoundingClientRect();
      const ey=(er.top-sr.top)/STAGE_SCALE;
      this.go2(this.h.top()+(p.y<ey?-1:1)*Math.max(1,this.h.view()-2));
    });
    this.update();
  }
  trackTop(){return 14;}
  trackH(){return this.el.clientHeight-28-51;}
  go(line){this.go2(line);}
  go2(line){this.h.scrollTo(line);this.update();}
  rel(d,ev){
    this.go2(this.h.top()+d);
    let t=setTimeout(function again(self,dd){self.go2(self.h.top()+dd);t=setTimeout(()=>again(self,dd),80);}.bind(null,this,d),350);
    const up=()=>{clearTimeout(t);document.removeEventListener("mouseup",up);};
    document.addEventListener("mouseup",up);
  }
  drag(ev){
    const startY=stagePoint(ev).y,startTop=this.h.top();
    const denom=Math.max(1,this.h.total()-this.h.view());
    const mv=e2=>{
      const dy=stagePoint(e2).y-startY;
      const linesPer=denom/Math.max(1,this.trackH());
      this.go2(Math.round(startTop+dy*linesPer));
    };
    const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);};
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
  }
  update(){
    const total=Math.max(1,this.h.total()),view=this.h.view(),top=this.h.top();
    const maxTop=Math.max(0,total-view);
    const frac=maxTop?clamp(top/maxTop,0,1):0;
    const y=this.trackTop()+frac*Math.max(0,this.trackH());
    this.elev.style.top=y+"px";
    /* proportion indicator: how much of the doc is visible */
    const propH=clamp(view/total,0.05,1)*(this.trackH()+51);
    this.prop.style.top=(this.trackTop()+frac*(this.trackH()+51-propH))+"px";
    this.prop.style.height=propH+"px";
  }
}

const WM={
  wins:[],zTop:20,pidseq:221,focusWin:null,iconSlot:0,
  register(w){this.wins.push(w);},
  unregister(w){const i=this.wins.indexOf(w);if(i>=0)this.wins.splice(i,1);
    if(this.focusWin===w)this.focus(this.wins[this.wins.length-1]||null);},
  focus(w){
    if(this.focusWin&&this.focusWin!==w){this.focusWin.el.classList.remove("focus");
      if(this.focusWin.term){this.focusWin.term.focused=false;this.focusWin.term.render();}}
    this.focusWin=w;
    if(w){w.el.classList.add("focus");
      if(w.term){w.term.focused=true;w.term.render();}}
  },
  routeKey(e){
    if(NOTICE_OPEN){
      if(e.key==="Enter"){const l=$id("noticelayer");if(l._noticeDefault)l._noticeDefault();}
      return true;
    }
    const w=this.focusWin;
    if(w&&!w.iconified){
      if(w.term)return w.term.key(e)!==false;
      if(w.onKey)return w.onKey(e);
    }
    return false;
  },
  closeAll(){for(const w of this.wins.slice())w.destroy();this.wins=[];this.focusWin=null;this.iconSlot=0;}
};

class OLWin{
  /* opts: title,x,y,w,h,app,proc,resizable,menuItems(fn),onQuit,pushpin,iconLabel,iconDraw,onResize,plainBody */
  constructor(opts){
    this.o=opts;
    this.pid=WM.pidseq++;
    this.proc=opts.proc||null;
    this.iconified=false;
    this.fullsz=null;
    const el=this.el=E("div","olwin",$id("winlayer"));
    el.style.left=(opts.x||80)+"px";el.style.top=(opts.y||80)+"px";
    el.style.width=(opts.w||400)+"px";el.style.height=(opts.h||300)+"px";
    const hdr=this.hdr=E("div","olhdr",el);
    if(opts.pushpin){
      const p=E("div","pin",hdr);p.style.marginLeft="5px";p.innerHTML=pinSVG(true);
      p.addEventListener("click",()=>this.quit());
    }else{
      const wb=E("div","wmenub",hdr,"▽");
      wb.title="";
      wb.addEventListener("click",ev=>{ev.stopPropagation();this.iconify();});
      wb.addEventListener("mousedown",ev=>{
        if(ev.button===2){ev.stopPropagation();ev.preventDefault();
          const p=stagePoint(ev);MENUS.beginPress(this.winMenuSpec(),p.x,p.y);}
      });
    }
    this.titleEl=E("div","oltitle",hdr,opts.title||"");
    const body=this.body=E("div","olbody"+(opts.plainBody?" plain":""),el);
    /* header interactions */
    hdr.addEventListener("mousedown",ev=>{
      if(ev.button===1)return;                    /* ADJUST does not raise: OPEN LOOK law */
      if(ev.button===2){ev.preventDefault();
        const p=stagePoint(ev);MENUS.beginPress(this.winMenuSpec(),p.x,p.y);return;}
      this.raise();this.dragMove(ev);
    });
    hdr.addEventListener("dblclick",()=>this.fullSize());
    el.addEventListener("mousedown",ev=>{
      if(ev.button===0){this.raise();}
    },true);
    /* resize corners */
    if(opts.resizable!==false){
      for(const c of["nw","ne","sw","se"]){
        const rc=E("div","rc "+c,el);
        rc.addEventListener("mousedown",ev=>{
          if(ev.button!==0)return;
          ev.stopPropagation();ev.preventDefault();
          this.raise();this.dragResize(ev,c);
        });
      }
    }
    WM.register(this);
    this.raise();
  }
  winMenuSpec(){
    const self=this;
    const items=[
      {label:"Close",def:true,action:()=>self.iconify()},
      {label:this.fullsz?"Restore Size":"Full Size",action:()=>self.fullSize()},
      {label:"Properties...",action:()=>notice({msg:"This window has no properties.\n(Few did.  It was fine.)",buttons:["Continue"],from:self.hdr})},
      {label:"Back",action:()=>self.lower()},
      {label:"Refresh",action:()=>{if(self.term)self.term.render();}},
      {sep:true},
      {label:"Quit",action:()=>self.quit()}
    ];
    return{title:this.o.title,pin:true,items};
  }
  raise(){this.el.style.zIndex=++WM.zTop;WM.focus(this);}
  lower(){this.el.style.zIndex=15;}
  setTitle(s){this.titleEl.textContent=s;this.o.title=s;}
  dragMove(ev){
    if(ev.button!==0||ev.target.closest(".wmenub")||ev.target.closest(".pin"))return;
    const p0=stagePoint(ev),ox=this.el.offsetLeft-p0.x,oy=this.el.offsetTop-p0.y;
    const mv=e2=>{const q=stagePoint(e2);
      this.el.style.left=clamp(q.x+ox,-this.el.offsetWidth+60,1152-40)+"px";
      this.el.style.top=clamp(q.y+oy,0,900-24)+"px";};
    const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);};
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
  }
  dragResize(ev,corner){
    const p0=stagePoint(ev);
    const sx=this.el.offsetLeft,sy=this.el.offsetTop,sw=this.el.offsetWidth,sh=this.el.offsetHeight;
    const minW=this.o.minW||180,minH=this.o.minH||100;
    const mv=e2=>{
      const q=stagePoint(e2),dx=q.x-p0.x,dy=q.y-p0.y;
      let x=sx,y=sy,w=sw,h=sh;
      if(corner.includes("e"))w=sw+dx;
      if(corner.includes("s"))h=sh+dy;
      if(corner.includes("w")){w=sw-dx;x=sx+dx;}
      if(corner.includes("n")){h=sh-dy;y=sy+dy;}
      if(w<minW){if(corner.includes("w"))x-=minW-w;w=minW;}
      if(h<minH){if(corner.includes("n"))y-=minH-h;h=minH;}
      this.el.style.left=x+"px";this.el.style.top=y+"px";
      this.el.style.width=w+"px";this.el.style.height=h+"px";
      if(this.o.onResize)this.o.onResize(w,h);
    };
    const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);};
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
  }
  fullSize(){
    if(this.fullsz){
      const f=this.fullsz;this.fullsz=null;
      Object.assign(this.el.style,{left:f.x,top:f.y,width:f.w,height:f.h});
    }else{
      this.fullsz={x:this.el.style.left,y:this.el.style.top,w:this.el.style.width,h:this.el.style.height};
      Object.assign(this.el.style,{left:this.el.offsetLeft+"px",top:"0px",height:"898px"});
    }
    if(this.o.onResize)this.o.onResize(this.el.offsetWidth,this.el.offsetHeight);
  }
  iconify(){
    if(this.iconified)return;
    this.iconified=true;
    this.el.style.display="none";
    const ic=this.iconEl=E("div","olicon",$id("iconlayer"));
    const slot=WM.iconSlot++;
    ic.style.left=(12+(slot%12)*88)+"px";
    ic.style.top=(820-Math.floor(slot/12)*86)+"px";
    const pic=E("div","pic",ic);
    if(this.o.iconDraw)this.o.iconDraw(pic);
    else E("div","",pic,this.o.iconLabel||"tool").style.font="10px Lucida Sans,Verdana,sans-serif";
    E("div","lbl",ic,this.o.iconLabel||this.o.title||"window");
    ic.addEventListener("dblclick",()=>this.restore());
    ic.addEventListener("mousedown",ev=>{
      if(ev.button===2){ev.preventDefault();
        const p=stagePoint(ev);
        MENUS.beginPress({title:this.o.iconLabel||this.o.title,items:[
          {label:"Open",def:true,action:()=>this.restore()},
          {label:"Quit",action:()=>this.quit()}
        ]},p.x,p.y);
        return;
      }
      if(ev.button!==0)return;
      ic.classList.add("sel");
      const p0=stagePoint(ev),ox=ic.offsetLeft-p0.x,oy=ic.offsetTop-p0.y;
      let moved=false;
      const mv=e2=>{const q=stagePoint(e2);moved=true;
        ic.style.left=clamp(q.x+ox,0,1152-80)+"px";ic.style.top=clamp(q.y+oy,0,900-70)+"px";};
      const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);
        setTimeout(()=>ic.classList.remove("sel"),300);};
      document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
    });
  }
  restore(){
    if(!this.iconified)return;
    this.iconified=false;
    if(this.iconEl){this.iconEl.remove();this.iconEl=null;}
    this.el.style.display="flex";
    this.raise();
  }
  quit(){
    if(this.o.onQuit&&this.o.onQuit()===false)return;
    this.destroy();
  }
  destroy(){
    if(this.iconEl)this.iconEl.remove();
    this.el.remove();
    WM.unregister(this);
    if(this.o.onDestroy)this.o.onDestroy();
  }
}

/* ---------- global input routing ---------- */
document.addEventListener("contextmenu",e=>e.preventDefault());
$id("desktop").addEventListener("mousedown",e=>{
  SND.ensure();
  if(e.button===2){
    /* MENU on something not already handled (headers/icons stop propagation) */
    const p=stagePoint(e);
    if(e.target.closest(".olmenu"))return;
    const winEl=e.target.closest(".olwin");
    if(!winEl){e.preventDefault();MENUS.beginPress(WORKSPACE.rootMenuSpec(),p.x,p.y);return;}
    const w=WM.wins.find(x=>x.el===winEl);
    if(w&&w.menuSpec){e.preventDefault();MENUS.beginPress(w.menuSpec(),p.x,p.y);}
    else if(w){e.preventDefault();MENUS.beginPress(w.winMenuSpec(),p.x,p.y);}
    return;
  }
  if(e.button===0&&!e.target.closest(".olwin")&&!e.target.closest(".olmenu")&&!e.target.closest(".olicon")){
    MENUS.closeAll();
  }
  if(e.button===1)e.preventDefault(); /* ADJUST: acknowledged, politely ignored */
});
document.addEventListener("keydown",e=>{
  /* Stop-A: the most Sun gesture there is */
  if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==="a"){
    e.preventDefault();
    if(SIM.mode==="console"||SIM.mode==="desktop"||SIM.mode==="boot"){
      SND.beep();PROM.enter(true);
    }
    return;
  }
  if(e.metaKey)return;
  if(SIM.mode==="boot"){
    if(e.key==="Escape"){BOOT.skip=true;}
    e.preventDefault();return;
  }
  if(SIM.mode==="prom"||SIM.mode==="console"){
    SND.ensure();
    GLASS.term.key(e);
    if(e.key!=="F5"&&e.key!=="F12"&&!(e.ctrlKey&&e.shiftKey))e.preventDefault();
    return;
  }
  if(SIM.mode==="desktop"){
    const used=WM.routeKey(e);
    if(used!==false&&e.key!=="F5"&&e.key!=="F12"&&!(e.ctrlKey&&e.shiftKey))e.preventDefault();
  }
});

DEF("filemgr",{singleton:true,make(){
  let cwd="/export/home/demo";
  const win=new OLWin({title:"File Manager - "+cwd,x:150,y:120,w:560,h:420,proc:"filemgr",
    iconLabel:"File Manager",iconDraw:pic=>pic.appendChild(svgel("folder")),
    minW:360,minH:240,plainBody:true,
    onDestroy:()=>{delete APPS.single.filemgr;}});
  const bar=E("div","fmbar",win.body);
  const bHome=E("div","olbtn",bar,"Home");
  const bUp=E("div","olbtn",bar,"Up");
  const bWaste=E("div","olbtn",bar,"Wastebasket...");
  const pathEl=E("span","fmpath",bar,cwd);
  const gridWrap=E("div","",win.body);
  gridWrap.style.cssText="flex:1;overflow:hidden;display:flex;flex-direction:column;height:calc(100% - 66px)";
  const grid=E("div","fmgrid",gridWrap);
  const status=E("div","fmstatus",win.body,"");
  win.body.style.display="flex";win.body.style.flexDirection="column";
  async function refresh(){
    pathEl.textContent=cwd;
    win.setTitle("File Manager - "+cwd);
    if(isNFSPath(cwd)){
      status.textContent="reading "+cwd+" from fileserver...";
      const t0=SIM.session.nfsDone;
      await NET.touch(cwd,null);
      if(NET.down){status.textContent="NFS server fileserver not responding still trying";
        while(NET.down)await sleep(300);}
    }
    grid.innerHTML="";
    const dir=vfsGet(cwd);
    if(!dir||dir.t!=="d"){status.textContent="cannot read "+cwd;return;}
    const names=Object.keys(dir.c).filter(n=>!n.startsWith(".")).sort(
      (a,b)=>{const da=dir.c[a].t==="d"?0:1,db=dir.c[b].t==="d"?0:1;return da-db||a.localeCompare(b);});
    for(const n of names){
      const node=dir.c[n];
      const real=node.t==="l"?vfsGet(node.to):node;
      const it=E("div","fmitem",grid);
      const fic=E("div","fic",it);
      const ext=n.includes(".")?n.slice(n.lastIndexOf(".")+1):"";
      if(real&&real.t==="d")fic.appendChild(svgel("folder"));
      else if(node.iconPx||(ST.d.binds[ext]&&real&&real.t==="f")){
        const px=node.iconPx||ST.d.binds[ext];
        const cv=document.createElement("canvas");cv.width=32;cv.height=32;
        const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,32,32);g.fillStyle="#111";
        for(let i=0;i<px.length&&i<1024;i++)if(px[i]==="1")g.fillRect(i%32,(i/32)|0,1,1);
        cv.style.cssText="width:32px;height:32px;border:1px solid #999";
        fic.appendChild(cv);
      }
      else if(real&&real.img){const im=document.createElement("img");im.src=real.img;
        im.style.cssText="max-width:40px;max-height:34px;border:1px solid #999";fic.appendChild(im);}
      else if(real&&real.au)fic.appendChild(svgel("audio"));
      else if(real&&(real.exeOut!==undefined||(real.mode&&real.mode[3]==="x")))fic.appendChild(svgel("exec"));
      else fic.appendChild(svgel("doc"));
      E("div","fnm",it,n);
      it.addEventListener("dblclick",()=>openItem(n,node,real));
      it.addEventListener("mousedown",ev=>{
        /* ADJUST extends the selection and leaves the rest of it alone */
        const adjust=ev.button===1||(ev.button===0&&ev.altKey);
        if(adjust){ev.preventDefault();it.classList.toggle("sel");count();return;}
        if(ev.button!==0)return;
        for(const s of grid.children)s.classList.remove("sel");
        it.classList.add("sel");count();
        dragFile(ev,n,node,it);
      });
    }
    count();
  }
  function count(){
    const total=grid.children.length,sel=grid.querySelectorAll(".fmitem.sel").length;
    status.textContent=total+" items"+(sel?", "+sel+" selected":"")+
      (isNFSPath(cwd)?"   (NFS: fileserver)":"");
  }
  function openItem(n,node,real){
    const full=normPath(cwd+"/"+n);
    if(real&&real.t==="d"){cwd=node.t==="l"?node.to:full;refresh();return;}
    if(!real)return;
    if(real.au){APPS.launch("audiotool",n);return;}
    if(real.img){viewRaster(n,real);return;}
    if(n.endsWith(".icon")&&real.iconPx!==undefined){APPS.launch("iconedit",{path:full});return;}
    if(real.exeOut!==undefined){notice({msg:n+" is an executable.\nRun it from a Command Tool:  "+n,buttons:["Continue"],from:win.hdr});return;}
    APPS.launch("textedit",{path:full});
  }
  function dragFile(ev,n,node,it){
    const start=stagePoint(ev);let ghost=null;
    const mv=e2=>{
      const p=stagePoint(e2);
      if(!ghost&&Math.abs(p.x-start.x)+Math.abs(p.y-start.y)>8){
        ghost=E("div","dragghost",$id("desktop"));
        ghost.innerHTML=ICON_SVGS.doc;
        const l=E("div","",ghost,n);l.style.cssText="font:10px Lucida Sans,Verdana;background:#fff;border:1px solid #999;padding:0 2px";
      }
      if(ghost){ghost.style.left=(p.x+6)+"px";ghost.style.top=(p.y+6)+"px";}
    };
    const up=e2=>{
      document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);
      if(!ghost)return;
      ghost.remove();
      const el=document.elementFromPoint(e2.clientX,e2.clientY);
      const winEl=el&&el.closest?el.closest(".olwin"):null;
      const target=winEl?WM.wins.find(x=>x.el===winEl):null;
      if(target&&target.dropFile)target.dropFile(normPath(cwd+"/"+n),n,node);
      else if(target===win){/* dropped on ourselves: nothing */}
    };
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
  }
  bHome.addEventListener("click",()=>{cwd="/export/home/demo";refresh();});
  bUp.addEventListener("click",()=>{if(cwd!=="/"){cwd=normPath(cwd+"/..");refresh();}});
  bWaste.addEventListener("click",()=>APPS.launch("wastebasket"));
  win.menuSpec=()=>({title:"File Manager",pin:true,items:[
    {label:"Open Home",def:true,action:()=>{cwd="/export/home/demo";refresh();}},
    {label:"Go to /home (NFS)",action:()=>{cwd="/home";refresh();}},
    {label:"Go to /usr/demo/SOUND",action:()=>{cwd="/usr/demo/SOUND";refresh();}},
    {label:"Go to / (root)",action:()=>{cwd="/";refresh();}},
    {sep:true},
    {label:"Drag a file onto the Print Tool or a Mail Tool compose window.",dis:true}
  ]});
  win.fmRefresh=refresh;
  refresh();
  return win;
}});

DEF("textedit",{make(arg){
  const win=new OLWin({title:"Text Editor",x:200,y:100,w:560,h:440,proc:"textedit",
    iconLabel:"textedit",iconDraw:pic=>pic.appendChild(svgel("doc")),plainBody:true,minW:320,minH:200});

  ta.spellcheck=false;
  ta.addEventListener("keydown",e=>e.stopPropagation());
  ta.addEventListener("mousedown",()=>win.raise());
  function load(path){
    const node=vfsGet(path);
    if(!node||node.t!=="f"){info.textContent="(new file)";return;}
    ta.value=fdata(node);
    nameEl.value=path;
    win.setTitle("Text Editor - "+path.split("/").pop());
    info.textContent="";
  }
  function save(){
    const p=normPath(nameEl.value.trim()||"untitled","/export/home/demo");
    if(!nameEl.value.trim()){info.textContent="give it a name first";return;}
    if(vfsWrite(p,ta.value,"demo")){info.textContent="stored "+p.split("/").pop()+" at "+fmtClock(simNow());
      win.setTitle("Text Editor - "+p.split("/").pop());
      if(APPS.single.filemgr&&APPS.single.filemgr.fmRefresh)APPS.single.filemgr.fmRefresh();}
    else info.textContent="cannot write "+p;
  }
  const fileMenu={title:"File",pin:true,items:[
    {label:"Save",def:true,action:save},
    {label:"Load...",action:()=>{const p=normPath(nameEl.value.trim(),"/export/home/demo");load(p);}},
    {label:"Store as New File",action:save},
    {sep:true},
    {label:"Empty Document",action:()=>{ta.value="";info.textContent="";}}
  ]};
  const extrasMenu={title:"Extras",pin:true,items:[
    {label:"Format (wrap at 72)",def:true,action:()=>{
      ta.value=ta.value.split("\n\n").map(par=>{
        const words=par.replace(/\n/g," ").split(/\s+/).filter(Boolean);
        let line="",out=[];
        for(const w2 of words){if((line+" "+w2).trim().length>72){out.push(line.trim());line=w2;}else line+=" "+w2;}
        if(line.trim())out.push(line.trim());
        return out.join("\n");}).join("\n\n");}},
    {label:"Capitalize",action:()=>{ta.value=ta.value.replace(/\b[a-z]/g,c=>c.toUpperCase());}},
    {label:"Insert Date",action:()=>{ta.value+=(ta.value.endsWith("\n")||!ta.value?"":"\n")+fmtFull(simNow())+"\n";}},
    {label:"Insert Brackets ()",action:()=>{ta.value+="()";}}
  ]};
  menuButton(bFile,()=>fileMenu);
  menuButton(bExtras,()=>extrasMenu);
  win.dropFile=(path)=>{load(path);};
  if(arg&&arg.path)load(arg.path);
  else{nameEl.value="/export/home/demo/untitled";}
  return win;
}});

DEF("mailtool",{singleton:true,make(){

  win.body.style.cssText+="display:flex;flex-direction:column";

  const bDone=E("div","olbtn",btns,"Done");
  const bNext=E("div","olbtn def",btns,"Next");
  const bDel=E("div","olbtn",btns,"Delete");
  const bComp=E("div","olbtn",btns,"Compose");
  const bReply=E("div","olbtn",btns,"Reply");
  const list=E("div","mtlist",win.body);list.style.height="128px";
  const read=E("div","mtread",win.body);
  const pre=E("pre","",read);
  let sel=null;
  function msgs(){const gone=ST.d.mailGone||[];
    return MAIL_MSGS.concat(ST.d.mailExtra||[]).filter(m=>gone.indexOf(m.id)<0);}
  function refresh(){
    list.innerHTML="";
    const ms=msgs();
    ms.forEach((m,i)=>{
      const isRead=(ST.d.mailRead||[]).indexOf(m.id)>=0;
      const row=E("div","mtrow"+(sel===m.id?" sel":""),list,
        (isRead?"  ":" N")+lpad(i+1,3)+"  "+rpad(m.from,22)+rpad(fmtLsDate(m.date),14)+" "+m.subj.slice(0,44));
      row.addEventListener("click",()=>{show(m);});
      row.addEventListener("dblclick",()=>{show(m);});
    });
    win.setTitle("Mail Tool - /var/spool/mail/demo   "+ms.length+" messages");
  }
  function show(m){
    sel=m.id;
    if((ST.d.mailRead||[]).indexOf(m.id)<0){ST.d.mailRead.push(m.id);ST.lazySave();}
    pre.textContent="Date: "+fmtFull(new Date(m.date))+"\nFrom: "+m.from+"\nTo: demo@sundance\nSubject: "+m.subj+"\n\n"+m.body;
    refresh();
  }
  bNext.addEventListener("click",()=>{
    const ms=msgs();if(!ms.length)return;
    const i=ms.findIndex(m=>m.id===sel);
    show(ms[(i+1)%ms.length]);
  });
  bDel.addEventListener("click",()=>{
    if(sel===null)return;
    ST.d.mailGone.push(sel);ST.lazySave();
    pre.textContent="";sel=null;refresh();
  });
  bDone.addEventListener("click",()=>{win.iconify();});
  bComp.addEventListener("click",()=>composeWin());
  bReply.addEventListener("click",()=>{
    const m=msgs().find(x=>x.id===sel);
    composeWin(m?{to:m.from,subj:"Re: "+m.subj}:null);
  });
  win.menuSpec=()=>({title:"Mail Tool",pin:true,items:[
    {label:"Compose",def:true,action:()=>composeWin()},
    {label:"Print message",action:()=>{if(sel!==null){const m=msgs().find(x=>x.id===sel);
      PRINTQ.push({job:PRINTSEQ++,user:"demo",file:"mail-"+sel,size:m?m.body.length:0,state:"waiting"});
      APPS.refreshPrint();}}},
    {sep:true},
    {label:"Done (commit + close to icon)",action:()=>win.iconify()}
  ]});
  win.dropFile=(path,name)=>{composeWin({attach:{path,name}});};
  function composeWin(seed){
    const cw=new OLWin({title:"Mail Tool: Compose Message",x:380,y:240,w:520,h:380,
      proc:"mailtool -c",iconLabel:"Compose",plainBody:true,minW:360,minH:240,
      iconDraw:pic=>pic.appendChild(svgel("mail"))});
    cw.body.style.cssText+="display:flex;flex-direction:column";
    const r1=E("div","fmbar",cw.body);E("span","ollbl",r1,"To:");
    const to=E("input","oltxt",r1);to.style.flex="1";
    const r2=E("div","fmbar",cw.body);E("span","ollbl",r2,"Subject:");
    const subj=E("input","oltxt",r2);subj.style.flex="1";
    const ta=E("textarea","tedit",cw.body);
    for(const el of[to,subj,ta]){el.addEventListener("keydown",e=>e.stopPropagation());el.spellcheck=false;}
    const r3=E("div","mtbtns",cw.body);
    const bDeliver=E("div","olbtn def",r3,"Deliver");
    const bCancel=E("div","olbtn",r3,"Cancel");
    const st=E("span","",r3,"");st.style.cssText="font-size:11px;color:#555;align-self:center";
    if(seed&&seed.to)to.value=seed.to;
    if(seed&&seed.subj)subj.value=seed.subj;
    if(seed&&seed.attach)ta.value="\n----------\n[attachment: "+seed.attach.name+" ("+fsize(vfsGet(seed.attach.path)||{t:"f",data:""})+" bytes)]\n";
    cw.dropFile=(path,name)=>{
      ta.value+=(ta.value.endsWith("\n")||!ta.value?"":"\n")+"[attachment: "+name+" ("+fsize(vfsGet(path)||{t:"f",data:""})+" bytes)]\n";
    };
    bCancel.addEventListener("click",()=>cw.quit());
    bDeliver.addEventListener("click",async()=>{
      const dest=to.value.trim();
      if(!dest){st.textContent="To: whom?";return;}
      st.textContent="delivering via sendmail...";
      ACT.bump(10,25);
      await sleep(1400);
      cw.quit();
      if(/wendy/.test(dest)&&!SIM.session.mailReplied){
        SIM.session.mailReplied=true;
        setTimeout(()=>{
          const id=100+((ST.d.mailExtra||[]).length);
          ST.d.mailExtra.push({id,from:"wendy@fileserver",date:Date.now(),
            subj:"Re: "+(subj.value||"(no subject)"),

             "More after the migration meeting.  Bring the donuts if\nI don't make it back.\n\n- w\n"});
          ST.lazySave();
          consoleMsg("New mail for demo has arrived");
          SND.bell();
          refresh();
        },25000+Math.random()*20000);
      }
    });
    return cw;
  }
  refresh();
  const first=msgs()[0];if(first)show(first);
  return win;
}});

DEF("calctool",{singleton:true,make(){
  const win=new OLWin({title:"Calculator",x:760,y:230,w:240,h:322,proc:"calctool",resizable:false,
    iconLabel:"calctool",plainBody:true,
    iconDraw:pic=>{pic.innerHTML='<svg width="24" height="32" viewBox="0 0 24 32"><rect x="1" y="1" width="22" height="30" fill="#dcd8cc" stroke="#333"/><rect x="3" y="3" width="18" height="6" fill="#fff" stroke="#333"/><g fill="#fff" stroke="#333">'+
      [0,1,2].map(r=>[0,1,2].map(c=>'<rect x="'+(3+c*6.4)+'" y="'+(12+r*6)+'" width="5" height="4.4"/>').join("")).join("")+'</g></svg>';},
    onDestroy:()=>{delete APPS.single.calctool;}});
  const disp=E("div","calcdisp",win.body,"0");
  let acc=null,op=null,cur="0",fresh=true;
  function show(){disp.textContent=cur.length>14?Number(cur).toExponential(8):cur;}
  function press(k){
    if(/\d/.test(k)){if(fresh||cur==="0"){cur=k;fresh=false;}else cur+=k;}
    else if(k==="."){if(fresh){cur="0.";fresh=false;}else if(!cur.includes("."))cur+=".";}
    else if(k==="+/-"){cur=cur.startsWith("-")?cur.slice(1):"-"+cur;}
    else if(k==="C"){acc=null;op=null;cur="0";fresh=true;}
    else if(k==="CE"){cur="0";fresh=true;}
    else if(k==="1/x"){cur=String(1/parseFloat(cur));fresh=true;}
    else if(k==="sqrt"){cur=String(Math.sqrt(parseFloat(cur)));fresh=true;}
    else if(k==="%"){cur=String(parseFloat(cur)/100);fresh=true;}
    else{
      if(op!==null&&!fresh){
        const b=parseFloat(cur);
        acc=op==="+"?acc+b:op==="-"?acc-b:op==="x"?acc*b:(b===0?NaN:acc/b);
        cur=String(Math.round(acc*1e10)/1e10);
      }else if(acc===null)acc=parseFloat(cur);
      op=k==="="?null:k;
      if(k==="=")acc=null,op=null;
      fresh=true;
    }
    show();
  }
  const keys=["C","CE","%","1/x","sqrt","7","8","9","/","+/-","4","5","6","x","-","1","2","3","+","=",
              "0",".","",""];
  const grid=E("div","calcgrid",win.body);
  for(const k of keys){
    if(k===""){E("div","",grid);continue;}
    const b=E("div","olbtn"+(k==="="?" def":""),grid,k==="/"?"÷":k);
    b.addEventListener("click",()=>{press(k);SND.click();});
  }
  win.onKey=e=>{
    const map={Enter:"=","*":"x","/":"/","-":"-","+":"+"};
    if(/^\d$/.test(e.key))press(e.key);
    else if(e.key===".")press(".");
    else if(map[e.key])press(map[e.key]);
    else if(e.key==="Escape")press("C");
    else if(e.key==="Backspace")press("CE");
    return true;
  };
  return win;
}});

function renderScreenshot(only){
  const cv=document.createElement("canvas");cv.width=1152;cv.height=900;
  const g=cv.getContext("2d");
  /* the workspace stipple */
  const col=WS_COLORS[ST.d.props.wsColor]||WS_COLORS.gray;
  const tile=document.createElement("canvas");tile.width=4;tile.height=4;
  const tg=tile.getContext("2d");
  tg.fillStyle=col.a;tg.fillRect(0,0,4,4);tg.fillStyle=col.b;
  tg.fillRect(0,0,1,1);tg.fillRect(2,1,1,1);tg.fillRect(0,2,1,1);tg.fillRect(2,3,1,1);tg.fillRect(3,0,1,1);tg.fillRect(1,2,1,1);
  g.fillStyle=g.createPattern(tile,"repeat");g.fillRect(0,0,1152,900);
  /* icons */
  for(const w of WM.wins)if(w.iconified&&w.iconEl){
    const x=w.iconEl.offsetLeft,y=w.iconEl.offsetTop;
    g.fillStyle="#d9d5c9";g.fillRect(x+8,y,64,52);
    g.strokeStyle="#000";g.strokeRect(x+8,y,64,52);
    g.fillStyle="#111";g.font="10px Lucida Sans,Verdana,sans-serif";g.textAlign="center";
    g.fillText((w.o.iconLabel||"tool").slice(0,12),x+40,y+64);
  }
  /* windows, bottom to top */
  const ordered=WM.wins.filter(w=>!w.iconified).sort((a,b)=>(+a.el.style.zIndex||0)-(+b.el.style.zIndex||0));
  for(const w of ordered){
    const x=w.el.offsetLeft,y=w.el.offsetTop,ww=w.el.offsetWidth,hh=w.el.offsetHeight;
    g.fillStyle="#d9d5c9";g.fillRect(x,y,ww,hh);
    g.strokeStyle="#000";g.lineWidth=1;g.strokeRect(x+.5,y+.5,ww-1,hh-1);
    g.fillStyle=w===WM.focusWin?"#b3afa3":"#d9d5c9";g.fillRect(x+1,y+1,ww-2,21);
    g.strokeStyle="#8c887d";g.beginPath();g.moveTo(x+1,y+22.5);g.lineTo(x+ww-1,y+22.5);g.stroke();
    g.fillStyle="#111";g.font="bold 12px Lucida Sans,Verdana,sans-serif";g.textAlign="center";
    g.fillText(w.o.title||"",x+ww/2,y+15,ww-40);
    g.textAlign="left";
    /* body */
    g.fillStyle="#fff";g.fillRect(x+4,y+26,ww-8,hh-30);
    const cvs=w.body.querySelector("canvas");
    const preEl=w.term?w.body.querySelector("pre"):null;
    if(cvs){try{g.drawImage(cvs,x+6,y+28);}catch(e){}}
    else if(preEl){
      g.fillStyle="#111";g.font="12px Lucida Console,Courier New,monospace";
      const lines=preEl.textContent.split("\n").slice(0,Math.floor((hh-34)/15));
      lines.forEach((l,i)=>g.fillText(l.slice(0,Math.floor((ww-16)/7)),x+8,y+40+i*15));
    }else{
      g.fillStyle="#888";g.font="11px Lucida Sans,Verdana,sans-serif";
      g.fillText("["+(w.proc||"window")+"]",x+10,y+42);
    }
  }
  if(only&&!only.iconified){
    /* crop to the one window, frame and all, the way Snapshot's window mode did */
    const x=only.el.offsetLeft-2,y=only.el.offsetTop-2;
    const w=only.el.offsetWidth+4,h=only.el.offsetHeight+4;
    const cut=document.createElement("canvas");cut.width=w;cut.height=h;
    cut.getContext("2d").drawImage(cv,x,y,w,h,0,0,w,h);
    return cut.toDataURL("image/png");
  }
  return cv.toDataURL("image/png");
}

    const g=cv.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,420,140);
    g.strokeStyle="#999";g.beginPath();g.moveTo(0,70);g.lineTo(420,70);g.stroke();
    g.strokeStyle="#111";g.beginPath();
    for(let x=0;x<420;x++){
      const i=Math.floor(x/420*a.length);
      let mx=0;for(let j=i;j<Math.min(a.length,i+Math.ceil(a.length/420));j++)mx=Math.max(mx,Math.abs(a[j]));
      g.moveTo(x,70-mx*62);g.lineTo(x,70+mx*62);
    }
    g.stroke();
    dur.textContent=SND.clipDefs[name].len.toFixed(1)+" sec, "+Math.floor(SND.clipDefs[name].len*8000)+" bytes";
  }
  selEl.addEventListener("change",drawWave);
  bPlay.addEventListener("click",()=>{
    if(playing)try{playing.stop();}catch(e){}
    playing=SND.playClip(selEl.value,()=>{playing=null;});
    ACT.bump(15);
  });
  bStop.addEventListener("click",()=>{if(playing){try{playing.stop();}catch(e){}playing=null;}});
  win.dropFile=(path,name,node)=>{
    const real=node&&node.t==="l"?vfsGet(node.to):node;
    if(real&&real.au){selEl.value=real.au;drawWave();}
  };
  if(arg&&SND.clipDefs[arg])selEl.value=arg;
  drawWave();
  return win;
}});

DEF("demo_poly",{singleton:true,make(){
  const win=new OLWin({title:"Demo: Polyhedron",x:420,y:180,w:340,h:370,proc:"polydemo",
    iconLabel:"polyhedron",plainBody:true,resizable:false,
    iconDraw:pic=>{pic.innerHTML='<svg width="28" height="28" viewBox="0 0 28 28"><polygon points="14,2 26,10 22,24 6,24 2,10" fill="#dcd8cc" stroke="#333"/><path d="M14 2 L14 14 L2 10 M14 14 L26 10 M14 14 L22 24 M14 14 L6 24" fill="none" stroke="#333"/></svg>';},
    onDestroy:()=>{cancelAnimationFrame(raf);delete APPS.single.demo_poly;}});
  win.body.style.background="#111";
  const cv=E("canvas","",win.body);cv.width=330;cv.height=336;
  const g=cv.getContext("2d");
  /* icosahedron */
  const t=(1+Math.sqrt(5))/2;
  const V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]]
    .map(v=>{const l=Math.hypot(...v);return v.map(x=>x/l);});
  const Fc=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
    [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  let a=0,b=0,raf=0;
  function frame(){
    a+=0.011;b+=0.007;
    const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);
    const P=V.map(([x,y,z])=>{
      let x1=x*ca-z*sa,z1=x*sa+z*ca;
      let y1=y*cb-z1*sb,z2=y*sb+z1*cb;
      return[x1,y1,z2];
    });
    const grey=ST.d.props.grey;
    g.fillStyle="#111";g.fillRect(0,0,330,336);
    const faces=Fc.map(f=>{
      const zs=(P[f[0]][2]+P[f[1]][2]+P[f[2]][2])/3;
      return{f,zs};
    }).sort((x,y)=>x.zs-y.zs);
    const col=WS_COLORS[ST.d.props.wsColor]||WS_COLORS.gray;
    for(const {f,zs} of faces){
      if(zs<0)continue;
      const pts=f.map(i=>[165+P[i][0]*118,168+P[i][1]*118]);
      const shade=clamp(0.35+zs*0.65,0,1);
      g.beginPath();g.moveTo(pts[0][0],pts[0][1]);g.lineTo(pts[1][0],pts[1][1]);g.lineTo(pts[2][0],pts[2][1]);g.closePath();
      if(grey){
        /* match the workspace stipple when the exhibit is greyscale */
        const v=Math.round(140+shade*90);
        g.fillStyle="rgb("+v+","+v+","+v+")";
      }else{
        g.fillStyle="rgb("+Math.round(90+shade*120)+","+Math.round(80+shade*100)+","+Math.round(60+shade*70)+")";
      }
      g.fill();g.strokeStyle="#111";g.stroke();
    }
    g.fillStyle="#666";g.font="10px Lucida Console,monospace";
    g.fillText("icosahedron, 20 faces, 60 field-drawn triangles/sec",8,328);
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  return win;
}});
DEF("demo_fract",{singleton:true,make(){
  const win=new OLWin({title:"Demo: Mandelbrot",x:480,y:200,w:340,h:390,proc:"fractdemo",
    iconLabel:"mandelbrot",plainBody:true,resizable:false,
    iconDraw:pic=>{pic.innerHTML='<svg width="28" height="28" viewBox="0 0 28 28"><rect x="1" y="1" width="26" height="26" fill="#fff" stroke="#333"/><circle cx="17" cy="14" r="6" fill="#333"/><circle cx="9" cy="14" r="3.4" fill="#333"/><circle cx="5" cy="14" r="1.4" fill="#333"/></svg>';},
    onDestroy:()=>{stop=true;delete APPS.single.demo_fract;}});
  const cv=E("canvas","",win.body);cv.width=330;cv.height=330;
  const info=E("div","statusline",win.body,"SELECT to zoom in, ADJUST (or Alt+SELECT) to zoom out");
  const g=cv.getContext("2d");
  let cx=-0.6,cyy=0,scale=140,stop=false;
  function render(){
    let row=0;
    const img=g.createImageData(330,1);
    function doRows(){
      if(stop)return;
      const t0=performance.now();
      while(row<330&&performance.now()-t0<14){
        for(let x=0;x<330;x++){
          const cr=cx+(x-165)/scale,ci=cyy+(row-165)/scale;
          let zr=0,zi=0,i=0;
          for(;i<64;i++){const zr2=zr*zr-zi*zi+cr;zi=2*zr*zi+ci;zr=zr2;if(zr*zr+zi*zi>4)break;}
          const p=x*4;
          if(i===64){img.data[p]=0;img.data[p+1]=0;img.data[p+2]=0;}
          else{const v=i/64;
            img.data[p]=Math.round(40+v*215);img.data[p+1]=Math.round(30+v*160);img.data[p+2]=Math.round(80+v*100);}
          img.data[p+3]=255;
        }
        g.putImageData(img,0,row);
        row++;
      }
      ACT.bump(6);
      if(row<330)requestAnimationFrame(doRows);
    }
    doRows();
  }
  cv.addEventListener("mousedown",ev=>{
    const r=cv.getBoundingClientRect();
    const px=(ev.clientX-r.left)/STAGE_SCALE/ (r.width/STAGE_SCALE/330);
    const py=(ev.clientY-r.top)/STAGE_SCALE/(r.height/STAGE_SCALE/330);
    cx+= (px-165)/scale; cyy+=(py-165)/scale;
    if(ev.button===1||ev.altKey)scale/=2.5;else if(ev.button===0)scale*=2.5;
    render();
  });
  render();
  return win;
}});

function init(){
  GLASS.init();
  SIM.bootTime=Date.now()-1000*60*17;   /* uptime credit: the machine was on before you arrived */
  const last=ST.d.last;
  if(!ST.d.visited){
    ST.d.visited=true;ST.save();
    BOOT.run(true);
    return;
  }
  if(last==="prom"){
    SIM.mode="console";       /* so PROM.enter doesn't think it froze anything */
    GLASS.show();
    GLASS.term.write(PROM.bannerLines().join("\n")+"\n\n");
    hint("ok>  try: banner · printenv · probe-scsi · boot   —  Ctrl+Alt+A is Stop-A");
    PROM.enter(false);
    return;
  }
  if(last==="openwin"){
    SIM.mode="console";
    SIM.bootTime=Date.now()-1000*60*60*4;
    GLASS.show();
    GLASS.term.write("SunOS Release 4.1.4 (GENERIC) #2: Fri Oct 14 11:09:07 PDT 1994\n\n"+
      "(resuming the session you left; Suns did not reboot for small reasons)\n");
    hint("");
    CONSOLE.loginLoop(["demo","openwin"]);
    return;
  }
  /* console */
  SIM.mode="console";
  GLASS.show();
  GLASS.term.write("SunOS Release 4.1.4 (GENERIC) #2: Fri Oct 14 11:09:07 PDT 1994\n");
  hint("log in as demo (or root; about the password: just press Return) — Ctrl+Alt+A is Stop-A");
  CONSOLE.loginLoop();
}
init();
