<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>SGI IRIX 4.0.5 + fsn — "It's a UNIX System" — The OS Museum</title>
<meta name="description" content="A single-file simulation of a Silicon Graphics workstation running IRIX 4.0.5 in a certain island control room: PROM, 4Dwm, xwsh, csh, gr_osview and the real 3D file browser, fsn.">
<style>
/* ============================================================
   IRIX 4.0.5 / fsn exhibit — fully self-contained.
   Layer 1: the real machine (SGI, IRIX, 4Dwm, xwsh, fsn).
   Layer 2: InGen's park software, just some programs on top.
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; background:#000; overflow:hidden; }
body { font-family: Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }

/* ---------- the physical display: 1280x1024 logical, scaled ---------- */
#stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
#screen {
  position:relative; width:1280px; height:1024px; background:#000;
  transform-origin:center center; overflow:hidden;
  cursor:default;
}
#screen, #screen * { user-select:none; }
#screen .selectable, #screen .selectable * { user-select:text; }

/* ---------- CRT treatment (subtle, default on-light) ---------- */
#crt { position:absolute; inset:0; pointer-events:none; z-index:9000; }
#crt.on {
  background:
    radial-gradient(ellipse 95% 92% at 50% 48%, transparent 62%, rgba(0,0,0,0.28) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.055) 0 1px, transparent 1px 3px);
}
#crt.on::after {
  content:""; position:absolute; inset:0;
  background: radial-gradient(ellipse 40% 25% at 32% 18%, rgba(255,255,255,0.05), transparent 70%);
}

/* ---------- boot / PROM layer ---------- */
#bootlayer {
  position:absolute; inset:0; background:#000; z-index:5000; display:none;
  padding:24px 30px; overflow:hidden;

/* ---------- login layer ---------- */
#loginlayer { position:absolute; inset:0; z-index:4500; display:none; }

<script>
"use strict";

/* ============================================================
   CORE — utilities, persistence, sound, activity model
   ============================================================ */
const $ = (s,el)=> (el||document).querySelector(s);
const el = (tag, cls, parent)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(parent) parent.appendChild(e); return e; };
const clamp=(v,a,b)=> v<a?a:(v>b?b:v);
const pad=(s,n)=>{ s=String(s); while(s.length<n) s=s+" "; return s; };
const lpad=(s,n)=>{ s=String(s); while(s.length<n) s=" "+s; return s; };
const zpad=(n,w)=>{ let s=String(n); while(s.length<w) s="0"+s; return s; };
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* The simulated clock: the night of June 11, 1993, Isla Nublar.
   SIM.now() returns ms; starts 19:02 local and runs in real time. */
const SIM = {
  t0: Date.UTC(1993,5,11,19,2,0),
  start: Date.now(),
  now(){ return this.t0 + (Date.now()-this.start); },
  date(){ return new Date(this.now()); },
  stamp(ms){ const d=new Date(ms===undefined?this.now():ms);
    return MONTHS[d.getUTCMonth()]+" "+lpad(d.getUTCDate(),2)+" "+zpad(d.getUTCHours(),2)+":"+zpad(d.getUTCMinutes(),2)+":"+zpad(d.getUTCSeconds(),2); },
  hm(ms){ const d=new Date(ms===undefined?this.now():ms); return zpad(d.getUTCHours(),2)+":"+zpad(d.getUTCMinutes(),2); },
  full(ms){ const d=new Date(ms===undefined?this.now():ms);
    return DAYS[d.getUTCDay()]+" "+MONTHS[d.getUTCMonth()]+" "+lpad(d.getUTCDate(),2)+" "+zpad(d.getUTCHours(),2)+":"+zpad(d.getUTCMinutes(),2)+":"+zpad(d.getUTCSeconds(),2)+" PDT 1993"; },
  lsdate(ms){ const d=new Date(ms); return MONTHS[d.getUTCMonth()]+" "+lpad(d.getUTCDate(),2)+" "+
    (Math.abs(this.now()-ms) > 15552000000 ? " 1993" : zpad(d.getUTCHours(),2)+":"+zpad(d.getUTCMinutes(),2)); }
};
/* helper to build timestamps relative to boot (negative hours = past) */
const AGO = (hours)=> SIM.t0 - hours*3600000;

/* ---------- persistence ---------- */
const State = {
  KEY:"osmuseum.irix.v1",
  data:null,
  load(){
    try { this.data = JSON.parse(localStorage.getItem(this.KEY)) || {}; }
    catch(e){ this.data = {}; }
    this.data.prefs   = this.data.prefs   || { sound:false, crt:true };
    this.data.history = this.data.history || {};
    this.data.winpos  = this.data.winpos  || {};
    this.data.fsnmarks= this.data.fsnmarks|| [];
    this.data.fs      = this.data.fs      || { files:{}, removed:[] };
    this.data.park    = this.data.park    || null;
    this.data.scenario= this.data.scenario|| null;

/* ---------- system activity model (drives gr_osview) ----------
   Anything in the simulation can post load; it decays over time. */
const Activity = {
  cpuUser:0.03, cpuSys:0.02, disk:0, net:0, mem:0.46, intr:0.01,
  _spikes:[],
  bump(kind, amt, dur){ this._spikes.push({kind, amt, until:performance.now()+(dur||800)}); },
  sample(){
    const now=performance.now();
    this._spikes=this._spikes.filter(s=>s.until>now);
    let u=0.02+Math.random()*0.05, s=0.01+Math.random()*0.03, d=Math.random()*0.04, n=Math.random()*0.03, it=0.01+Math.random()*0.02;
    for(const sp of this._spikes){
      if(sp.kind==="cpu") u+=sp.amt; else if(sp.kind==="sys") s+=sp.amt;
      else if(sp.kind==="disk") d+=sp.amt; else if(sp.kind==="net") n+=sp.amt;
      else if(sp.kind==="intr") it+=sp.amt;
    }
    this.cpuUser=clamp(u,0,1); this.cpuSys=clamp(s,0,1-this.cpuUser);
    this.disk=clamp(d,0,1); this.net=clamp(n,0,1); this.intr=clamp(it,0,1);
    this.mem=clamp(this.mem + (Math.random()-0.5)*0.004, 0.38, 0.86);
    return this;
  }
};

/* ============================================================
   VIRTUAL FILESYSTEM — one tree, seen by csh and by fsn alike.
   IRIX conventions: /usr/people homes, /usr/bsd, /var/adm/SYSLOG.
   ============================================================ */
function strhash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h; }

const FS = {
  root:null, hostname:"control",

  node(t,name){ return { t, name, parent:null, children: t==="d"?{}:null,
    content: t==="f"?"":null, size:0, mtime:AGO(24*90), owner:"root", group:"sys",
    mode: t==="d"?0o755:0o644, exec:null, dyn:null, target:null }; },

  build(){
    this.root=this.node("d","/");
    buildTree(this);           // defined with the content, below
    this.applyDeltas();
  },

  /* ---- path plumbing ---- */
  normalize(path, cwd){
    if(!path) path=cwd||"/";
    if(path[0]!=="/") path=(cwd==="/"?"":cwd)+"/"+path;
    const out=[];
    for(const part of path.split("/")){
      if(!part||part===".") continue;
      if(part===".."){ out.pop(); continue; }
      out.push(part);
    }
    return "/"+out.join("/");
  },
  resolve(path, cwd, followLink){
    const abs=this.normalize(path,cwd);
    if(abs==="/") return this.root;
    let cur=this.root;
    for(const part of abs.slice(1).split("/")){
      if(!cur||cur.t!=="d") return null;
      cur=cur.children[part];
      if(cur && cur.t==="l" && followLink!==false)
        cur=this.resolve(cur.target,"/");
    }
    return cur||null;
  },
  pathOf(node){
    const parts=[]; let n=node;
    while(n && n.parent){ parts.unshift(n.name); n=n.parent; }
    return "/"+parts.join("/");
  },
  fileSize(n){
    if(n.t==="f") return n.size || (n.dyn? (n.dyn()||"").length : (n.content||"").length);
    return 0;
  },
  read(n){ if(n.dyn) return n.dyn(); return n.content||""; },

  /* ---- mutation (records deltas for persistence) ---- */
  attach(parentPath, node){
    const p=this.resolve(parentPath,"/");
    if(!p||p.t!=="d") return null;
    node.parent=p; p.children[node.name]=node; return node;
  },
  addDir(path, opt){
    opt=opt||{};
    const abs=this.normalize(path,"/");
    if(this.resolve(abs,"/")) return this.resolve(abs,"/");
    const i=abs.lastIndexOf("/");
    const parent=i===0?"/":abs.slice(0,i), name=abs.slice(i+1);
    if(!this.resolve(parent,"/")) this.addDir(parent);
    const n=this.node("d",name);
    if(opt.owner)n.owner=opt.owner; if(opt.group)n.group=opt.group;
    if(opt.mode!==undefined)n.mode=opt.mode; if(opt.mtime)n.mtime=opt.mtime;
    return this.attach(parent,n);
  },
  addFile(path, opt){
    opt=opt||{};
    const abs=this.normalize(path,"/");
    const i=abs.lastIndexOf("/");
    const parent=i===0?"/":abs.slice(0,i), name=abs.slice(i+1);
    if(!this.resolve(parent,"/")) this.addDir(parent);
    const n=this.node("f",name);
    n.content=opt.content!==undefined?opt.content:"";
    if(opt.dyn)n.dyn=opt.dyn;
    if(opt.exec){ n.exec=opt.exec; n.mode=opt.mode!==undefined?opt.mode:0o755; }
    else if(opt.mode!==undefined) n.mode=opt.mode;
    if(opt.size)n.size=opt.size;
    if(opt.owner)n.owner=opt.owner; if(opt.group)n.group=opt.group;
    n.mtime=opt.mtime||AGO(24*30 + (strhash(abs)%2000)/10);
    this.attach(parent,n);
    return n;
  },
  addLink(path,target){
    const abs=this.normalize(path,"/");
    const i=abs.lastIndexOf("/");
    const n=this.node("l",abs.slice(i+1));
    n.target=target; n.mode=0o777;
    this.attach(i===0?"/":abs.slice(0,i),n);
    return n;
  },

  /* user-visible mutations, persisted */
  writeFile(path, content, cwd, opt){
    opt=opt||{};
    const abs=this.normalize(path,cwd);
    let n=this.resolve(abs,"/");
    if(n && n.t!=="f") return null;
    if(!n){
      const i=abs.lastIndexOf("/");
      const parent=this.resolve(i===0?"/":abs.slice(0,i),"/");
      if(!parent||parent.t!=="d") return null;
      n=this.node("f",abs.slice(i+1));
      n.owner=opt.owner||"root"; n.group=opt.group||"user";
      this.attach(this.pathOf(parent),n);
    }
    n.content=content; n.dyn=null; n.size=0; n.mtime=SIM.now();
    this.recordFile(abs,n);
    Bus.emit("fschange",abs);
    return n;
  },
  appendFile(path, text, opt){
    const n=this.resolve(path,"/");
    if(n&&n.t==="f"&&!n.dyn){ n.content+=text; n.mtime=SIM.now(); Bus.emit("fschange",path); return n; }
    if(!n) return this.writeFile(path,text,"/",opt);
    return null;
  },
  mkdirUser(path,cwd,owner){
    const abs=this.normalize(path,cwd);
    if(this.resolve(abs,"/")) return "exists";
    const i=abs.lastIndexOf("/");
    const parent=this.resolve(i===0?"/":abs.slice(0,i),"/");
    if(!parent||parent.t!=="d") return "noparent";
    const n=this.node("d",abs.slice(i+1));
    n.owner=owner||"root"; n.group="user"; n.mtime=SIM.now();
    this.attach(this.pathOf(parent),n);
    State.data.fs.files[abs]={dir:1,owner:n.owner,mtime:n.mtime};
    State.data.fs.removed=State.data.fs.removed.filter(p=>p!==abs);
    State.save(); Bus.emit("fschange",abs);
    return null;
  },
  removeUser(path,cwd){
    const abs=this.normalize(path,cwd);
    const n=this.resolve(abs,"/",false);
    if(!n) return "nonexistent";
    if(n.t==="d"&&Object.keys(n.children).length) return "notempty";
    delete n.parent.children[n.name];
    delete State.data.fs.files[abs];
    if(!State.data.fs.removed.includes(abs)) State.data.fs.removed.push(abs);
    State.save(); Bus.emit("fschange",abs);
    return null;
  },
  recordFile(abs,n){
    State.data.fs.files[abs]={content:n.content,mtime:n.mtime,owner:n.owner,mode:n.mode};
    State.data.fs.removed=State.data.fs.removed.filter(p=>p!==abs);
    State.save();
  },
  applyDeltas(){
    const d=State.data.fs;
    for(const p of d.removed){
      const n=this.resolve(p,"/",false);
      if(n&&n.parent) delete n.parent.children[n.name];
    }
    const paths=Object.keys(d.files).sort((a,b)=>a.length-b.length);
    for(const p of paths){
      const rec=d.files[p];
      if(rec.dir){ const n=this.addDir(p,{owner:rec.owner}); if(n)n.mtime=rec.mtime; }
      else{
        let n=this.resolve(p,"/");
        if(!n||n.t!=="f") n=this.addFile(p,{});
        if(n){ n.content=rec.content; n.dyn=null; n.size=0; n.mtime=rec.mtime;
               n.owner=rec.owner||n.owner; if(rec.mode!==undefined)n.mode=rec.mode; }
      }
    }
  },

  modeStr(n){
    const t=n.t==="d"?"d":(n.t==="l"?"l":"-");
    let s=t;
    for(let i=8;i>=0;i--){
      const bit=(n.mode>>i)&1;
      const ch="rwxrwxrwx"[8-i];
      s+=bit?ch:"-";
    }
    return s;
  },
  lsLong(n, name){
    const links = n.t==="d" ? 2+Object.values(n.children).filter(c=>c.t==="d").length : 1;
    let nm=name||n.name;
    if(n.t==="l") nm+=" -> "+n.target;
    return this.modeStr(n)+" "+lpad(links,4)+" "+pad(n.owner,8)+" "+pad(n.group,8)+
      lpad(this.fileSize(n)||(n.t==="d"?512:0),9)+" "+SIM.lsdate(n.mtime)+" "+nm;
  },
  isText(n){
    if(n.t!=="f") return false;
    if(n.dyn) return true;
    const c=n.content||"";
    if(n.size && !c) return false;
    for(let i=0;i<Math.min(c.length,200);i++){ const cc=c.charCodeAt(i); if(cc<9||(cc>13&&cc<32)) return false; }
    return true;
  }
};

"\n"+
"struct doorgrp grp[] = {\n"+
"    { \"Visitor Center main\",  1, 'A' },\n"+
"    { \"Control room\",         1, 'A' },\n"+
"    { \"Labs / hatchery\",      1, 'B' },\n"+
"    { \"Cryo store\",           1, 'B' },\n"+
"    { \"Maintenance shed 04\",  1, 'C' },\n"+
"    { \"Emergency bunker\",     1, 'C' },\n"+
"    { \"Garage / motor pool\",  1, 'C' },\n"+
"    { \"East dock gate\",       1, 'D' },\n"+

"    for (i = 0; i < 8; i++) {\n"+

CONTENT.ingen_fence_c =
"/* fence.c — perimeter breaker control + voltage telemetry.\n"+
" * The relays live on host 'gate'; we RPC over and hope.\n"+
" * 10,000 volts nominal. The dinosaurs have learned the sound\n"+
" * the wires make when they are dead. I put that in a status\n"+
" * report and nobody replied.\n"+
" */\n"+
"#define SECTORS 12\n"+
"double nominal_kv = 10.0;\n"+
"\n"+
"int energize(int sector)\n"+
"{\n"+
"    /* breakers must be closed IN ORDER after a main trip;\n"+
"     * skipping order browns out the whole east line */\n"+
"    if (!breaker_closed(sector - 1) && sector > 0)\n"+
"        warn(\"sector %d: close %d first\", sector, sector - 1);\n"+
"    return rpc_call(\"gate\", RELAY_CLOSE, sector);\n"+
"}\n";

CONTENT.ingen_census_c =
"/* census.c — population census by motion-sensor sweep.\n"+
" *\n"+
" * HOW THIS ACTUALLY WORKS, because it will bite someone:\n"+
" * the sweep STOPS when it has found expected[] animals of each\n"+
" * species. Management wanted the nightly run under 30 seconds\n"+
" * on brachio, and 'the expected number is the number' (their\n"+
" * words). So we count UP TO the expectation and declare victory.\n"+
" *\n"+
" * If you ever suspect there are MORE animals than expected,\n"+
" * raise the expectation and run it again. The tally file the\n"+
" * sensors write is on stego:/vol/park/records if you want the\n"+
" * raw truth. I put this comment here instead of fixing it\n"+
" * because the fix was declined as a change order. twice. -dn\n"+
" */\n"+
"int sweep(int species, int expected)\n"+
"{\n"+
"    int found = 0;\n"+
"    while (found < expected && sensors_remaining())\n"+
"        found += next_sensor_hit(species);\n"+
"    return found;   /* == expected, almost by construction */\n"+
"}\n";

/* ============================================================
   TREE BUILDER
   ============================================================ */
function buildTree(fs){
  const D=(p,o)=>fs.addDir(p,o), F=(p,o)=>fs.addFile(p,o), L=(p,t)=>fs.addLink(p,t);

  /* skeleton */
  ["/etc","/etc/config","/etc/init.d","/etc/rc0.d","/etc/rc2.d","/dev","/lib","/tmp",
   "/var","/var/adm","/var/spool","/var/spool/lp","/var/spool/cron","/var/tmp",
   "/usr","/usr/bin","/usr/sbin","/usr/bsd","/usr/etc","/usr/lib","/usr/lib/X11",
   "/usr/lib/X11/app-defaults","/usr/include","/usr/share","/usr/share/catman",
   "/usr/bin/X11","/usr/demos","/usr/demos/bin","/usr/people","/usr/local",
   "/usr/local/bin","/usr/local/boot","/vol","/vol/park","/vol/genome","/CDROM","/debug"
  ].forEach(p=>D(p));
  D("/tmp",{mode:0o777}); D("/var/tmp",{mode:0o777});
  L("/bin","/usr/bin"); L("/usr/tmp","/var/tmp");

  /* kernel + devices */
  F("/unix",{size:2306212, mtime:AGO(24*63), mode:0o644}).kind="kernel";
  ["root","usr","rroot","rusr","tty","ttyq1","ttyq2","ttyq3","console","null",
   "tape","nrtape","gfx","kbd","mouse"].forEach(d=>F("/dev/"+d,{size:0,mode:0o666,mtime:AGO(24*90)}));

  /* /etc */
  F("/etc/motd",{content:CONTENT.motd, mtime:AGO(11)});
  F("/etc/sys_id",{content:CONTENT.sys_id, mtime:AGO(24*200)});
  F("/etc/hosts",{content:CONTENT.hosts, mtime:AGO(24*18)});
  F("/etc/fstab",{content:CONTENT.fstab, mtime:AGO(24*40)});
  F("/etc/passwd",{content:CONTENT.passwd, mtime:AGO(24*8)});
  F("/etc/group",{content:CONTENT.group, mtime:AGO(24*8)});
  F("/etc/inetd.conf",{content:CONTENT.inetd, mtime:AGO(24*55)});
  F("/etc/gettydefs",{size:1544, mtime:AGO(24*300)});
  F("/etc/TIMEZONE",{content:"TZ=PST8PDT\n", mtime:AGO(24*300)});
  F("/etc/rc2",{size:3891, mode:0o755, mtime:AGO(24*300)});
  ["S01MOUNTFSYS","S20sysetup","S30network","S31nfs","S88timed","S95grio","S98xdm"]
    .forEach((n,i)=>F("/etc/rc2.d/"+n,{size:400+i*123, mode:0o755, mtime:AGO(24*300)}));
  F("/etc/init.d/network",{size:2210, mode:0o755, mtime:AGO(24*300)});
  F("/etc/config/automount.options",{content:"-v /vol\n", mtime:AGO(24*60)});

/* ============================================================
   xwsh TERMINAL WIDGET — an 80x24 character screen with
   scrollback, cursor, and a raw mode for vi/more to take over.
   ============================================================ */
class Terminal {
  constructor(cols, rows){
    this.cols=cols||80; this.rows=rows||24;
    this.buf=[]; this.attr=[];
    for(let r=0;r<this.rows;r++){ this.buf.push(new Array(this.cols).fill(" ")); this.attr.push(new Array(this.cols).fill(0)); }
    this.cr=0; this.cc=0;
    this.back=[];            // scrollback lines (plain text)
    this.maxBack=600;
    this.viewOff=0;          // >0 = scrolled back
    this.handler=null;       // key handler (shell, vi, pager...)
    this.hideCursor=false;
    this.saved=null;
    this._dirty=true;
    this.el=null; this.pre=null; this.thumb=null;
    this.focused=false;
  }
  mount(parent){
    const wrap=el("div","termwrap",parent);
    const sb=el("div","termscroll",wrap);
    this.thumb=el("div","thumb",sb);
    this.pre=el("pre","termpre",wrap);
    this.el=wrap;
    wrap.addEventListener("wheel",(e)=>{ e.preventDefault();
      this.viewOff=clamp(this.viewOff+(e.deltaY>0?-3:3),0,this.back.length); this.touch(); });
    sb.addEventListener("mousedown",(e)=>{
      const move=(ev)=>{
        const r=sb.getBoundingClientRect();
        const frac=clamp((ev.clientY-r.top)/r.height,0,1);
        this.viewOff=Math.round((1-frac)*this.back.length); this.touch();
      };
      move(e);
      const up=()=>{ window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); };
      window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
      e.preventDefault(); e.stopPropagation();
    });
    this.touch();
    return wrap;
  }
  touch(){ if(!this._dirty){ this._dirty=true; } requestAnimationFrame(()=>this.render()); }
  scrollUp(){
    this.back.push(this.buf[0].join("").replace(/\s+$/,""));
    if(this.back.length>this.maxBack) this.back.shift();
    this.buf.shift(); this.attr.shift();
    this.buf.push(new Array(this.cols).fill(" "));
    this.attr.push(new Array(this.cols).fill(0));
  }
  nl(){ this.cc=0; if(this.cr===this.rows-1) this.scrollUp(); else this.cr++; }
  write(s){
    this.viewOff=0;
    for(const ch of s){
      if(ch==="\n"){ this.nl(); }
      else if(ch==="\r"){ this.cc=0; }
      else if(ch==="\b"){ if(this.cc>0)this.cc--; }
      else if(ch==="\x07"){ Sound.bell(); }
      else if(ch==="\t"){ do{ this.put(" "); }while(this.cc%8!==0&&this.cc<this.cols-1); }
      else this.put(ch);
    }
    this.touch();
  }
  put(ch){
    if(this.cc>=this.cols){ this.nl(); }
    this.buf[this.cr][this.cc]=ch; this.attr[this.cr][this.cc]=0; this.cc++;
  }
  clearEOL(){ for(let c=this.cc;c<this.cols;c++){ this.buf[this.cr][c]=" "; this.attr[this.cr][c]=0; } this.touch(); }
  clear(){ for(let r=0;r<this.rows;r++){ this.buf[r].fill(" "); this.attr[r].fill(0);} this.cr=0; this.cc=0; this.viewOff=0; this.touch(); }
  /* raw screen access (vi) */
  setRow(r, text, invFrom, invTo){
    if(r<0||r>=this.rows) return;
    for(let c=0;c<this.cols;c++){
      this.buf[r][c]=c<text.length?text[c]:" ";
      this.attr[r][c]=(invFrom!==undefined&&c>=invFrom&&c<invTo)?1:0;
    }
    this.touch();
  }
  setCursor(r,c){ this.cr=clamp(r,0,this.rows-1); this.cc=clamp(c,0,this.cols-1); this.touch(); }
  saveScreen(){ this.saved={buf:this.buf.map(r=>r.slice()),attr:this.attr.map(r=>r.slice()),cr:this.cr,cc:this.cc}; }
  restoreScreen(){ if(!this.saved)return; this.buf=this.saved.buf; this.attr=this.saved.attr;
    this.cr=this.saved.cr; this.cc=this.saved.cc; this.saved=null; this.touch(); }
  render(){
    if(!this.pre) return;
    this._dirty=false;
    const out=[];
    const total=this.back.length;
    const off=this.viewOff;
    /* view: if scrolled back, show back lines then top of buffer */
    let lines=[];
    if(off>0){
      const start=total-off;
      for(let i=0;i<this.rows;i++){
        const bi=start+i;
        if(bi<total) lines.push({text:this.back[bi],attr:null,row:-1});
        else { const r=bi-total; lines.push({text:null,attr:null,row:r}); }
      }
    } else {
      for(let r=0;r<this.rows;r++) lines.push({text:null,row:r});
    }
    for(let i=0;i<lines.length;i++){
      const L=lines[i];
      if(L.text!==null&&L.row===-1){ out.push(esc(L.text)); continue; }
      const r=L.row;
      if(r===undefined||r<0||r>=this.rows){ out.push(""); continue; }
      let s="", run="", mode=0;
      const flush=()=>{ if(!run)return;
        if(mode===1) s+='<span class="inv">'+esc(run)+"</span>";
        else if(mode===2) s+='<span class="cur">'+esc(run)+"</span>";
        else s+=esc(run); run=""; };
      for(let c=0;c<this.cols;c++){
        const isCur=(!this.hideCursor&&off===0&&r===this.cr&&c===this.cc&&this.focused);
        const m=isCur?2:this.attr[r][c];
        if(m!==mode){ flush(); mode=m; }
        run+=this.buf[r][c];
      }
      flush();
      out.push(s.replace(/\s+$/,""));
    }
    this.pre.innerHTML=out.join("\n");
    /* scrollbar thumb */
    const frac=this.rows/(this.rows+total);
    const pos=total? 1-(off/total) : 1;
    const h=Math.max(14, frac*100);
    this.thumb.style.height=h+"%";
    this.thumb.style.top=(pos*(100-h))+"%";
  }
  key(e){
    if(this.handler) this.handler(e);
  }
  setFocus(v){ this.focused=v; this.touch(); }
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ============================================================
   csh — the shell. History (!), aliases, globbing, pipes,
   redirection, dotfiles, and a registry of IRIX userland.
   ============================================================ */
class Shell {
  constructor(term, user, opts){
    opts=opts||{};
    this.term=term; this.user=user;
    this.host=FS.hostname;
    this.home = user==="root" ? "/" : "/usr/people/"+user;
    this.cwd = this.home;
    this.env = { HOME:this.home, USER:user, LOGNAME:user, TERM:"iris-ansi",
      SHELL:"/bin/csh", TZ:"PST8PDT", DISPLAY:":0.0",
      PATH:"/usr/local/ingen/bin:/usr/sbin:/usr/bsd:/bin:/usr/bin:/usr/bin/X11:/usr/demos/bin:." };
    this.vars = { prompt: this.host+" \\!% ", history:"100" };
    this.aliases = {};
    this.hist = (State.data.history[user]||[]).slice();
    this.histN = this.hist.length;
    this.lb=[]; this.lp=0; this.hIdx=null; this.hSave="";
    this.pRow=0; this.pCol=0;
    this.job=null;           // running async command {stop()}
    this.raw=null;           // raw key taker (vi, more, prompts)
    this.dead=false;
    this.onexit = opts.onexit||null;
    this.isLogin = !!opts.login;
    this.remote=null;        // {host, prevPrompt} when rlogin'd
    term.handler=(e)=>this.key(e);
  }
  out(s){ this.term.write(s); }
  start(){
    this.readDotfiles();
    if(this.isLogin){
      const motd=FS.resolve("/etc/motd","/");
      if(motd) this.out(FS.read(motd));
      const mail=FS.resolve(this.home+"/mail/inbox","/");
      if(mail) this.out("You have mail.\n");
    }
    this.prompt();
  }
  readDotfiles(){
    const rc=FS.resolve(this.home+"/.cshrc","/");
    if(rc && FS.read(rc)) this.runScript(FS.read(rc));
    if(this.isLogin){
      const lg=FS.resolve(this.home+"/.login","/");
      if(lg && FS.read(lg)) this.runScript(FS.read(lg));
    }
  }
  runScript(text){
    /* enough csh to read real dotfiles: assignments, aliases, and
       if/endif blocks, which are skipped wholesale rather than
       half-evaluated (a shell that guesses is worse than one that waits) */
    let skip=0;
    for(let line of text.split("\n")){
      line=line.trim();
      if(!line||line[0]==="#") continue;
      if(/^if\b.*\bthen\s*$/.test(line)){ skip++; continue; }
      if(/^endif\b/.test(line)){ if(skip)skip--; continue; }
      if(skip) continue;
      if(/^(else|foreach|end|while|switch|case|breaksw|endsw)\b/.test(line)) continue;
      const m=line.match(/^(set|setenv|alias|unalias|echo)\b/);
      if(!m) continue;
      try{ this.execSimple(line); }catch(e){}
    }
  }
  execSimple(line){
    const parts=this.tokenize(line);
    const cmd=parts[0];
    if(cmd==="set"){
      const m=line.match(/^set\s+(\w+)\s*=\s*(.*)$/);
      if(m){
        let v=m[2].trim();
        if(v.startsWith("(")&&v.endsWith(")")){
          const list=v.slice(1,-1).trim().split(/\s+/);
          if(m[1]==="path") this.env.PATH=list.map(p=>p==="."?".":p).join(":");
          this.vars[m[1]]=list.join(" ");
        } else {
          v=v.replace(/^["']|["']$/g,"");
          this.vars[m[1]]=v;
        }
      }
    } else if(cmd==="setenv"){ if(parts[1]) this.env[parts[1]]=(parts[2]||"").replace(/^["']|["']$/g,""); }
    else if(cmd==="alias"){
      if(parts.length===1){ for(const a in this.aliases) this.out(pad(a,12)+"\t"+this.aliases[a]+"\n"); }
      else if(parts.length===2){ if(this.aliases[parts[1]]) this.out(this.aliases[parts[1]]+"\n"); }
      else { const m2=line.match(/^alias\s+(\S+)\s+(.*)$/); this.aliases[m2[1]]=m2[2].replace(/^["']|["']$/g,""); }
    }
    else if(cmd==="unalias"){ delete this.aliases[parts[1]]; }
    else if(cmd==="echo"){ this.out(parts.slice(1).join(" ")+"\n"); }
  }

  promptStr(){
    let p=this.vars.prompt||"% ";
    p=p.replace(/`hostname`/g,this.host).replace(/\$HOST/g,this.host);
    p=p.replace(/\\!/g,String(this.histN+1)).replace(/%m/g,this.host);
    return p;
  }
  prompt(){
    if(this.dead) return;
    if(this.term.cc!==0) this.out("\n");
    this.out(this.promptStr());
    this.pRow=this.term.cr; this.pCol=this.term.cc;
    this.lb=[]; this.lp=0; this.hIdx=null;
  }
  /* ---- line editor ---- */
  drawLine(){
    const t=this.term, cols=t.cols;
    const total=this.pCol+this.lb.length;
    const rowsNeeded=Math.floor(total/cols)+1;
    while(this.pRow+rowsNeeded>t.rows){ t.scrollUp(); this.pRow--; }
    if(this.pRow<0){ this.pRow=0; }
    let r=this.pRow, c=this.pCol;
    for(let i=0;i<=this.lb.length;i++){
      const ch=i<this.lb.length?this.lb[i]:" ";
      t.buf[r][c]=ch; t.attr[r][c]=0;
      c++; if(c>=cols){ c=0; r++; if(r>=t.rows){ t.scrollUp(); r=t.rows-1; this.pRow--; } }
    }
    /* clear to end of that row */
    for(let cc=c;cc<cols;cc++){ t.buf[r][cc]=" "; }
    const cpos=this.pCol+this.lp;
    t.setCursor(this.pRow+Math.floor(cpos/cols), cpos%cols);
  }
  setLine(s){ this.lb=[...s]; this.lp=this.lb.length; this.drawLine(); }

  key(e){
    if(this.raw){ this.raw(e); return; }
    if(this.job){
      if(e.key==="c"&&e.ctrlKey){ const j=this.job; this.job=null; j.stop&&j.stop(); this.out("^C\n"); this.prompt(); }
      return;
    }
    const k=e.key;
    if(e.ctrlKey){
      switch(k.toLowerCase()){
        case "c": this.out("^C\n"); this.prompt(); return;
        case "u": this.lb=[]; this.lp=0; this.drawLine(); return;
        case "a": this.lp=0; this.drawLine(); return;
        case "e": this.lp=this.lb.length; this.drawLine(); return;
        case "k": this.lb.length=this.lp; this.drawLine(); return;
        case "w": { let i=this.lp; while(i>0&&this.lb[i-1]===" ")i--; while(i>0&&this.lb[i-1]!==" ")i--;
          this.lb.splice(i,this.lp-i); this.lp=i; this.drawLine(); return; }
        case "l": this.term.clear(); this.out(this.promptStr()); this.pRow=this.term.cr; this.pCol=this.term.cc; this.drawLine(); return;
        case "d": if(this.lb.length===0){ this.out("logout\n"); this.exit(); } return;
      }
      return;
    }
    if(k==="Enter"){
      const line=this.lb.join("");
      const cpos=this.pCol+this.lb.length;
      this.term.setCursor(this.pRow+Math.floor(cpos/this.term.cols), cpos%this.term.cols);
      this.out("\n");
      this.accept(line);
      return;
    }
    if(k==="Backspace"){ if(this.lp>0){ this.lb.splice(this.lp-1,1); this.lp--; this.drawLine(); } return; }
    if(k==="Delete"){ if(this.lp<this.lb.length){ this.lb.splice(this.lp,1); this.drawLine(); } return; }
    if(k==="ArrowLeft"){ if(this.lp>0)this.lp--; this.drawLine(); return; }
    if(k==="ArrowRight"){ if(this.lp<this.lb.length)this.lp++; this.drawLine(); return; }
    if(k==="Home"){ this.lp=0; this.drawLine(); return; }
    if(k==="End"){ this.lp=this.lb.length; this.drawLine(); return; }
    if(k==="ArrowUp"){
      if(this.hIdx===null){ this.hSave=this.lb.join(""); this.hIdx=this.hist.length; }
      if(this.hIdx>0){ this.hIdx--; this.setLine(this.hist[this.hIdx]||""); }
      return;
    }
    if(k==="ArrowDown"){
      if(this.hIdx===null) return;
      this.hIdx++;
      if(this.hIdx>=this.hist.length){ this.hIdx=null; this.setLine(this.hSave); }
      else this.setLine(this.hist[this.hIdx]);
      return;
    }
    if(k==="Tab"){ this.complete(); return; }
    if(k.length===1){ this.lb.splice(this.lp,0,k); this.lp++; this.drawLine(); Sound.tick(); }
  }

  complete(){
    const line=this.lb.slice(0,this.lp).join("");
    const m=line.match(/(\S*)$/);
    const frag=m[1];
    const isFirst = line.trim().indexOf(" ")===-1 && !line.trim().startsWith("./") && frag===line.trim();
    let cands=[];
    if(isFirst && !frag.includes("/")){
      const seen={};
      for(const d of this.env.PATH.split(":")){
        const n=FS.resolve(d==="."?this.cwd:d,"/");
        if(n&&n.t==="d") for(const name in n.children) if(name.startsWith(frag)&&!seen[name]){ seen[name]=1; cands.push(name); }
      }
      for(const b in Object.keys(this.aliases)) {}
      Object.keys(this.aliases).forEach(a=>{ if(a.startsWith(frag)&&!seen[a]) cands.push(a); });
    } else {
      let dir, base;
      const f=frag.replace(/^~(?=\/|$)/,this.home);
      const i=f.lastIndexOf("/");
      if(i>=0){ dir=f.slice(0,i)||"/"; base=f.slice(i+1); } else { dir=this.cwd; base=f; }
      const n=FS.resolve(dir,this.cwd);
      if(n&&n.t==="d") for(const name in n.children){
        if(name.startsWith(base)) cands.push(name+(n.children[name].t==="d"?"/":""));
      }
      if(cands.length){
        const i2=frag.lastIndexOf("/");
        cands=cands.map(cd=>frag.slice(0,i2+1)+cd);
      }
    }
    if(cands.length===1){
      const add=cands[0].slice(frag.length);
      for(const ch of add){ this.lb.splice(this.lp,0,ch); this.lp++; }
      if(!cands[0].endsWith("/") && isFirst===false){ this.lb.splice(this.lp,0," "); this.lp++; }
      this.drawLine();
    } else if(cands.length>1){
      Sound.bell();
      const common=cands.reduce((a,b)=>{ let i=0; while(i<a.length&&a[i]===b[i])i++; return a.slice(0,i); });
      if(common.length>frag.length){
        const add=common.slice(frag.length);
        for(const ch of add){ this.lb.splice(this.lp,0,ch); this.lp++; }
        this.drawLine();
      } else {
        this.out("\n"+cands.map(c=>c.replace(/\/$/,"")).sort().join("  ")+"\n");
        this.out(this.promptStr()); this.pRow=this.term.cr; this.pCol=this.term.cc; this.drawLine();
      }
    } else Sound.bell();
  }

  accept(line){
    line=line.trimEnd();
    if(!line.trim()){ this.prompt(); return; }
    /* history expansion */
    let expanded=line, didExpand=false;
    if(line.includes("!")){
      expanded=line.replace(/!(!|\d+|[a-zA-Z]\w*)/g,(mm,ref)=>{
        didExpand=true;
        if(ref==="!") return this.hist[this.hist.length-1]||"";
        if(/^\d+$/.test(ref)){ const n=parseInt(ref,10); return this.hist[n-1]||""; }
        for(let i=this.hist.length-1;i>=0;i--) if(this.hist[i].startsWith(ref)) return this.hist[i];
        return "!"+ref;
      });
      if(expanded!==line) this.out(expanded+"\n"); else didExpand=false;
    }
    if(expanded.trim()){
      this.hist.push(expanded);
      if(this.hist.length>200) this.hist.shift();
      this.histN=this.hist.length;
      State.data.history[this.user]=this.hist.slice(-100); State.save();
    }
    this.runLine(expanded);
  }

  runLine(line){
    /* sequence on ; then on && / || (csh has all three) */
    const seqs=[];
    for(const s of this.splitTop(line,";")) seqs.push(...this.splitLogical(s));
    const runNext=(i)=>{
      if(i>=seqs.length){ if(!this.job&&!this.raw&&!this.dead) this.prompt(); return; }
      this.runPipeline(seqs[i], ()=>runNext(i+1));
    };
    runNext(0);
  }
  splitLogical(s){
    const parts=[]; let cur="", q=null;
    for(let i=0;i<s.length;i++){
      const ch=s[i];
      if(q){ cur+=ch; if(ch===q)q=null; continue; }
      if(ch==="'"||ch==='"'){ q=ch; cur+=ch; continue; }
      if((ch==="&"&&s[i+1]==="&")||(ch==="|"&&s[i+1]==="|")){
        parts.push(cur); cur=""; i++; continue;
      }
      cur+=ch;
    }
    parts.push(cur);
    return parts.filter(p=>p.trim());
  }
  splitTop(s,sep){
    const parts=[]; let cur="", q=null;
    for(let i=0;i<s.length;i++){
      const ch=s[i];
      if(q){ cur+=ch; if(ch===q)q=null; continue; }
      if(ch==="'"||ch==='"'){ q=ch; cur+=ch; continue; }
      if(ch===sep){ parts.push(cur); cur=""; continue; }
      cur+=ch;
    }
    parts.push(cur);
    return parts.filter(p=>p.trim());
  }
  tokenize(s){
    /* quoted tokens are remembered (this.quoted) so the globber leaves
       them alone — csh does not expand "*.c" and neither do we */
    const toks=[]; let cur=null, q=null;
    this.quoted=new Set();
    for(let i=0;i<s.length;i++){
      const ch=s[i];
      if(q){ if(ch===q){ q=null; this.quoted.add(toks.length); } else cur=(cur||"")+ch; continue; }
      if(ch==="'"||ch==='"'){ q=ch; cur=cur===null?"":cur; continue; }
      if(ch===" "||ch==="\t"){ if(cur!==null){toks.push(cur);cur=null;} continue; }
      if(ch===">"||ch==="<"){
        if(cur!==null){toks.push(cur);cur=null;}
        if(ch===">"&&s[i+1]===">"){ toks.push(">>"); i++; } else toks.push(ch);
        continue;
      }
      cur=(cur===null?"":cur)+ch;
    }
    if(cur!==null)toks.push(cur);
    return toks;
  }
  expandToken(tok){
    tok=tok.replace(/^~(\w*)/,(m,u)=> u? "/usr/people/"+u : this.home);
    tok=tok.replace(/\$(\w+)/g,(m,v)=> this.env[v]!==undefined?this.env[v]:(this.vars[v]!==undefined?this.vars[v]:""));
    return tok;
  }
  glob(tok){
    if(!/[*?]/.test(tok)) return [tok];
    const i=tok.lastIndexOf("/");
    const dir=i>=0?(tok.slice(0,i)||"/"):this.cwd;
    const patt=i>=0?tok.slice(i+1):tok;
    const n=FS.resolve(dir,this.cwd);
    if(!n||n.t!=="d") return null;
    const re=new RegExp("^"+patt.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\*/g,".*").replace(/\?/g,".")+"$");
    const names=Object.keys(n.children).filter(nm=>re.test(nm)&&(patt.startsWith(".")||!nm.startsWith("."))).sort();
    if(!names.length) return null;
    return names.map(nm=> i>=0? tok.slice(0,i+1)+nm : nm);
  }

  runPipeline(segment, done){
    const stages=this.splitTop(segment,"|");
    let bg=false;
    let last=stages[stages.length-1];
    if(last.trim().endsWith("&")){ bg=true; stages[stages.length-1]=last.trim().slice(0,-1); }
    /* parse each stage */
    const parsed=[];
    for(const st of stages){
      let toks=this.tokenize(st);
      let quoted=this.quoted||new Set();
      /* alias expansion (first word, once) */
      if(toks.length&&this.aliases[toks[0]]){
        const al=this.aliases[toks[0]];
        const rest=toks.slice(1);
        if(al.includes("!*")){
          toks=this.tokenize(al.replace(/\\?!\*/g,rest.join(" ")));
        } else toks=this.tokenize(al).concat(rest);
        quoted=new Set();   /* token positions moved; re-globbing is harmless */
      }
      const cmd={ argv:[], outFile:null, append:false, inFile:null };
      for(let i=0;i<toks.length;i++){
        const t=toks[i];
        if(t===">"||t===">>"){ cmd.outFile=this.expandToken(toks[++i]||""); cmd.append=(t===">>"); continue; }
        if(t==="<"){ cmd.inFile=this.expandToken(toks[++i]||""); continue; }
        const ex=this.expandToken(t);
        if(quoted.has(i)){ cmd.argv.push(ex); continue; }
        const g=this.glob(ex);
        if(g===null){ this.out(t+": No match.\n"); done&&done(); return; }
        cmd.argv.push(...g);
      }
      if(cmd.argv.length) parsed.push(cmd);
    }
    if(!parsed.length){ done&&done(); return; }
    if(bg){ const pid=Proc.nextPid++; this.out("[1] "+pid+"\n"); }

    /* run stages left to right, threading stdin text */
    const runStage=(idx, stdin)=>{
      if(idx>=parsed.length){ done&&done(); return; }
      const cmd=parsed[idx];
      const isLast=idx===parsed.length-1;
      let buffered="";
      const stream={
        shell:this,
        stdin: stdin,
        out:(s)=>{ if(!isLast||cmd.outFile) buffered+=s; else this.out(s); },
        err:(s)=>this.out(s),
        finish:()=>{
          if(cmd.outFile){
            const abs=FS.normalize(cmd.outFile,this.cwd);
            const existing=FS.resolve(abs,"/");
            if(existing&&existing.t==="d"){ this.out(cmd.outFile+": Is a directory\n"); }
            else{
              const prev=(cmd.append&&existing)?FS.read(existing):"";
              FS.writeFile(abs,prev+buffered,"/",{owner:this.user});
              Activity.bump("disk",0.3,500);
            }
            runStage(idx+1,"");
          } else if(!isLast){ runStage(idx+1,buffered); }
          else { done&&done(); }
        }
      };
      if(cmd.inFile){
        const n=FS.resolve(cmd.inFile,this.cwd);
        if(!n||n.t!=="f"){ this.out(cmd.inFile+": No such file or directory\n"); done&&done(); return; }
        stream.stdin=FS.read(n);
      }
      this.execCmd(cmd.argv, stream);
    };
    runStage(0, undefined);
  }

  findExec(name){
    if(name.includes("/")){
      const n=FS.resolve(name,this.cwd);
      return n||null;
    }
    for(const d of this.env.PATH.split(":")){
      const dir=FS.resolve(d==="."?this.cwd:d,"/");
      if(dir&&dir.t==="d"&&dir.children[name]) return dir.children[name];
    }
    return null;
  }

  execCmd(argv, stream){
    const name=argv[0];
    const base=name.includes("/")?name.slice(name.lastIndexOf("/")+1):name;
    /* builtins first (csh semantics) */
    if(Builtins[base]){ const r=Builtins[base](this,argv.slice(1),stream); if(r!=="async") stream.finish(); return; }
    const node=this.findExec(name);
    if(node&&node.t==="f"&&node.exec){
      Activity.bump("cpu",0.35,900);
      const r=node.exec(this,argv.slice(1),stream);
      if(r!=="async") stream.finish();
      return;
    }
    if(Registry[base]){
      if(node||!name.includes("/")){
        Activity.bump("cpu",0.15,400);
        const r=Registry[base](this,argv.slice(1),stream);
        if(r!=="async") stream.finish();
        return;
      }
    }
    if(node&&node.t==="d"){ stream.err(name+": Permission denied.\n"); stream.finish(); return; }
    if(node&&node.t==="f"){
      if((node.mode&0o111)===0){ stream.err(name+": Permission denied.\n"); }
      else stream.err(name+": Exec format error. Wrong Architecture.\n");
      stream.finish(); return;
    }
    stream.err(base+": Command not found.\n");
    stream.finish();
  }

  /* used by commands that need a full path argument resolved */
  res(p){ return FS.resolve(p,this.cwd); }
  abs(p){ return FS.normalize(p,this.cwd); }

  exit(){
    if(this.remote){
      const r=this.remote; this.remote=null;
      this.host=r.host; this.cwd=r.cwd; this.vars.prompt=r.prompt;
      this.out("Connection closed.\n");
      this.prompt();
      return;
    }
    this.dead=true;
    if(this.onexit) this.onexit();
  }
}

/* ============================================================
   USERLAND — csh builtins + /usr/bin & friends.
   System V flavour, BSD compatibility in /usr/bsd, SGI extras.
   ============================================================ */
function sysAppend(line){
  const n=FS.resolve("/var/adm/SYSLOG","/");
  if(n){ n.content+= SIM.stamp().slice(0,15)+" "+line+"\n"; n.mtime=SIM.now(); Bus.emit("fschange","/var/adm/SYSLOG"); }
}
function columnize(names, width){
  width=width||80;
  if(!names.length) return "";
  const w=Math.max(...names.map(n=>n.length))+2;
  const cols=Math.max(1,Math.floor(width/w));
  const rows=Math.ceil(names.length/cols);
  let out="";
  for(let r=0;r<rows;r++){
    let line="";
    for(let c=0;c<cols;c++){
      const i=c*rows+r;
      if(i<names.length) line+=pad(names[i],w);
    }
    out+=line.replace(/\s+$/,"")+"\n";
  }
  return out;
}
function fsWalk(node, path, cb){
  cb(node, path);
  if(node.t==="d") for(const nm of Object.keys(node.children).sort())
    fsWalk(node.children[nm], (path==="/"?"":path)+"/"+nm, cb);
}

/* ---------- pager ---------- */
class Pager {
  constructor(shell, text, title, onExit){
    this.sh=shell; this.t=shell.term;
    this.lines=text.replace(/\n$/,"").split("\n");
    /* wrap long lines */
    const wrapped=[];
    for(const l of this.lines){
      if(l.length<=this.t.cols) wrapped.push(l);
      else for(let i=0;i<l.length;i+=this.t.cols) wrapped.push(l.slice(i,i+this.t.cols));
    }
    this.lines=wrapped;
    this.top=0; this.title=title; this.onExit=onExit;
    this.page=this.t.rows-1;
    if(this.lines.length<=this.page){ /* short: just print */
      this.t.write(text.endsWith("\n")?text:text+"\n");
      onExit&&onExit(); return;
    }
    shell.raw=(e)=>this.keyIn(e);
    this.draw();
  }
  draw(){
    const t=this.t;
    for(let r=0;r<this.page;r++){
      const li=this.top+r;
      t.setRow(r, li<this.lines.length?this.lines[li]:"~");
    }
    const pct=Math.min(100,Math.round(((this.top+this.page)/this.lines.length)*100));
    const st=this.top+this.page>=this.lines.length ? "--More--(END) q to quit" : "--More--("+pct+"%)";
    t.setRow(this.page, st, 0, st.length);
    t.setCursor(this.page, st.length);
  }
  quit(){
    this.sh.raw=null;
    const t=this.t;
    t.setRow(this.page,"");
    t.setCursor(this.page,0);
    this.onExit&&this.onExit();
  }
  keyIn(e){
    const k=e.key;
    if(k==="q"||k==="Q"||(e.ctrlKey&&k==="c")){ this.quit(); return; }
    if(k===" "||k==="f"||k==="PageDown"){
      if(this.top+this.page>=this.lines.length){ this.quit(); return; }
      this.top=Math.min(this.top+this.page, Math.max(0,this.lines.length-this.page)); this.draw(); return;
    }
    if(k==="Enter"||k==="ArrowDown"){
      if(this.top+this.page>=this.lines.length){ this.quit(); return; }
      this.top++; this.draw(); return;
    }
    if(k==="b"||k==="PageUp"||k==="ArrowUp"){ this.top=Math.max(0,this.top-(k==="ArrowUp"?1:this.page)); this.draw(); return; }
    if(k==="g"){ this.top=0; this.draw(); return; }
    if(k==="G"){ this.top=Math.max(0,this.lines.length-this.page); this.draw(); return; }
  }
}

/* ---------- csh builtins ---------- */
const Builtins = {
  cd(sh,a,st){
    const target=a[0]?FS.normalize(sh.expandToken(a[0]),sh.cwd):sh.home;
    const n=FS.resolve(target,"/");
    if(!n) st.err(a[0]+": No such file or directory.\n");
    else if(n.t!=="d") st.err(a[0]+": Not a directory.\n");
    else sh.cwd=FS.pathOf(n);
  },
  chdir(sh,a,st){ Builtins.cd(sh,a,st); },
  pwd(sh,a,st){ st.out(sh.cwd+"\n"); },
  echo(sh,a,st){ st.out(a.join(" ")+"\n"); },
  set(sh,a,st){
    if(!a.length){ for(const k of Object.keys(sh.vars).sort()) st.out(pad(k,12)+"\t"+sh.vars[k]+"\n"); return; }
    sh.execSimple("set "+a.join(" "));
  },
  setenv(sh,a,st){
    if(!a.length){ for(const k of Object.keys(sh.env).sort()) st.out(k+"="+sh.env[k]+"\n"); return; }
    sh.env[a[0]]=a[1]||"";
  },
  unsetenv(sh,a){ delete sh.env[a[0]]; },
  unset(sh,a){ delete sh.vars[a[0]]; },
  alias(sh,a,st){
    if(!a.length){ for(const k of Object.keys(sh.aliases).sort()) st.out(pad(k,12)+"\t"+sh.aliases[k]+"\n"); return; }
    if(a.length===1){ if(sh.aliases[a[0]]) st.out(sh.aliases[a[0]]+"\n"); return; }
    sh.aliases[a[0]]=a.slice(1).join(" ");
  },
  unalias(sh,a){ delete sh.aliases[a[0]]; },
  history(sh,a,st){
    const from=Math.max(0,sh.hist.length-(parseInt(a[0],10)||sh.hist.length));
    for(let i=from;i<sh.hist.length;i++) st.out(lpad(i+1,6)+"  "+sh.hist[i]+"\n");
  },
  jobs(sh,a,st){ if(sh.job) st.out("[1]  + Running                       "+(sh.job.name||"job")+"\n"); },
  rehash(){}, umask(sh,a,st){ if(!a.length) st.out("22\n"); },
  which(sh,a,st){
    for(const nm of a){
      if(sh.aliases[nm]){ st.out(nm+": \t aliased to "+sh.aliases[nm]+"\n"); continue; }
      if(Builtins[nm]){ st.out(nm+": shell built-in command.\n"); continue; }
      let found=null;
      for(const d of sh.env.PATH.split(":")){
        const dir=FS.resolve(d==="."?sh.cwd:d,"/");
        if(dir&&dir.t==="d"&&dir.children[nm]){ found=(d==="."?sh.cwd:d)+"/"+nm; break; }
      }
      st.out(found?found+"\n":"no "+nm+" in "+sh.env.PATH.split(":").join(" ")+"\n");
    }
  },
  source(sh,a,st){
    const n=sh.res(a[0]);
    if(!n||n.t!=="f"){ st.err(a[0]+": No such file or directory.\n"); return; }
    sh.runScript(FS.read(n));
  },
  exit(sh){ sh.exit(); }, logout(sh){ sh.exit(); }, bye(sh){ sh.exit(); },
  time(sh,a,st){ st.out("0.0u 0.0s 0:00 0% 0+0k 0+0io 0pf+0w\n"); }
};

/* ---------- the userland registry ---------- */
const Registry = {};
const R=Registry;

R.ls=(sh,a,st)=>{
  const flags={l:0,a:0,F:0,d:0,one:0};
  const paths=[];
  for(const t of a){
    if(t.startsWith("-")){ for(const f of t.slice(1)){ if(f==="1")flags.one=1; else flags[f]=1; } }
    else paths.push(t);
  }
  if(!paths.length) paths.push(".");
  const many=paths.length>1;
  paths.forEach((p,pi)=>{
    const n=sh.res(p);
    if(!n){ st.err(p+" not found\n"); return; }
    Activity.bump("disk",0.1,300);
    const deco=(node,nm)=>{ if(!flags.F)return nm;
      if(node.t==="d")return nm+"/";
      if(node.t==="l")return nm+"@";
      if(node.mode&0o111)return nm+"*"; return nm; };
    if(n.t!=="d"||flags.d){
      st.out(flags.l?FS.lsLong(n,p)+"\n":deco(n,p)+"\n"); return;
    }
    if(many) st.out((pi?"\n":"")+p+":\n");
    let names=Object.keys(n.children).sort();
    if(!flags.a) names=names.filter(nm=>!nm.startsWith("."));
    else names=[".",".."].concat(names);
    if(flags.l){
      let total=0;
      for(const nm of names){ if(nm==="."||nm==="..")continue;
        const c=n.children[nm];
        total += c.t==="d" ? 1 : Math.ceil(FS.fileSize(c)/512); }
      st.out("total "+total+"\n");
      for(const nm of names){
        const c=nm==="."?n:(nm===".."?(n.parent||n):n.children[nm]);
        st.out(FS.lsLong(c,nm)+"\n");
      }
    } else if(flags.one){
      for(const nm of names) st.out(deco(nm==="."?n:nm===".."?(n.parent||n):n.children[nm],nm)+"\n");
    } else {
      st.out(columnize(names.map(nm=>deco(nm==="."?n:nm===".."?(n.parent||n):n.children[nm],nm)),sh.term.cols));
    }
  });
};
R.cat=(sh,a,st)=>{

function binJunk(seed,len){
  let h=strhash(seed), out="";
  for(let i=0;i<len;i++){ h=(h*1103515245+12345)>>>0; const b=h%256;
    out+= (b>=32&&b<127)?String.fromCharCode(b):(b%7===0?"\n":"·"); }
  return out+"\n";
}

R.tail=(sh,a,st)=>{

    else if(/^-\d+$/.test(t))n=parseInt(t.slice(1),10);
    else files.push(t);
  }
  const getText=(nd)=>FS.read(nd);
  if(!files.length&&st.stdin!==undefined){
    const L=(st.stdin||"").replace(/\n$/,"").split("\n");

  }

  const L=getText(nd).replace(/\n$/,"").split("\n");
  st.out(L.slice(-n).join("\n")+"\n");
  if(!follow) return;
  let lastLen=getText(nd).length;
  const iv=setInterval(()=>{
    const txt=getText(nd);
    if(txt.length>lastLen){ sh.out(txt.slice(lastLen)); lastLen=txt.length; }

R.grep=(sh,a,st)=>{
  const flags={i:0,v:0,n:0,c:0}; const rest=[];
  for(const t of a){ if(t.startsWith("-")&&t.length>1&&/^[ivnc]+$/.test(t.slice(1))){ for(const f of t.slice(1))flags[f]=1; } else rest.push(t); }
  if(!rest.length){ st.err("usage: grep [-ivnc] pattern [file ...]\n"); return; }
  const patt=rest.shift();
  let re;
  try{ re=new RegExp(patt, flags.i?"i":""); }
  catch(e){ const q=patt.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); re=new RegExp(q, flags.i?"i":""); }
  const doText=(text,fname,showName)=>{
    let count=0;
    text.replace(/\n$/,"").split("\n").forEach((line,i)=>{
      const m=re.test(line);
      if(m!==!!flags.v){
        count++;
        if(!flags.c) st.out((showName?fname+":":"")+(flags.n?(i+1)+":":"")+line+"\n");
      }
    });
    if(flags.c) st.out((showName?fname+":":"")+count+"\n");
  };
  if(!rest.length){ doText(st.stdin||"","",false); return; }
  for(const f of rest){
    const nd=sh.res(f);
    if(!nd||nd.t==="d"){ st.err("grep: can't open "+f+"\n"); continue; }
    doText(FS.isText(nd)?FS.read(nd):binJunk(f,300),f,rest.length>1);
  }
};
R.wc=(sh,a,st)=>{

    let s="";

    if(only.includes("c")) s+=lpad(text.length,8);

  const files=a.filter(t=>!t.startsWith("-"));
  if(!files.length){ doText(st.stdin||""); return; }

R.du=(sh,a,st)=>{
  const flags=a.filter(t=>t.startsWith("-")).join("");
  const path=a.filter(t=>!t.startsWith("-"))[0]||".";
  const n=sh.res(path);
  if(!n){ st.err("du: bad status "+path+"\n"); return; }
  const k=flags.includes("k");
  const sum=(node,p,top)=>{
    let s=0;
    if(node.t==="d"){
      for(const nm in node.children) s+=sum(node.children[nm],p+"/"+nm,false);
      s+=1;
      if(!flags.includes("s")||top) st.out(lpad(k?Math.ceil(s/2):s,8)+" "+ (top?path:p) +"\n");
    } else s=Math.ceil(FS.fileSize(node)/512);
    return s;
  };
  if(flags.includes("s")){
    let s=0;
    fsWalk(n,path,(node)=>{ if(node.t==="f")s+=Math.ceil(FS.fileSize(node)/512); });
    st.out(lpad(k?Math.ceil(s/2):s,8)+" "+path+"\n");

};

R.rm=(sh,a,st)=>{

  for(const p of a.filter(t=>!t.startsWith("-"))){

  if(a.some(t=>t==="aux"||t==="-aux")){ st.err("ps: unknown option -- aux\n(usage: ps [ -edaf ] ... this is the System V ps.)\n"); return; }
  if(full) st.out("     UID   PID  PPID  C    STIME TTY      TIME COMMAND\n");
  else st.out("   PID TTY      TIME COMMAND\n");
  const rows=Proc.list.slice().sort((x,y)=>x.pid-y.pid);
  for(const p of rows){

    if(full){
      const d=new Date(p.start);
      const stime=zpad(d.getUTCHours(),2)+":"+zpad(d.getUTCMinutes(),2)+":"+zpad(d.getUTCSeconds(),2);
      st.out(lpad(p.user,8)+lpad(p.pid,6)+lpad(p.ppid,6)+"  0 "+lpad(stime,8)+" "+pad(p.tty,8)+" 0:0"+(p.pid%5)+" "+p.cmd+"\n");

};

/* ============================================================
   vi — small but sincere. Command/insert modes, counts on
   movement, dd dw x yy p u, /search, :w :q :wq :q! :<n>
   ============================================================ */
class Vi {
  constructor(shell, fname, onExit){
    this.sh=shell; this.t=shell.term; this.onExit=onExit;
    this.fname=fname||null;
    this.node=fname?shell.res(fname):null;
    if(this.node&&this.node.t==="d"){ shell.out("vi: "+fname+": Is a directory\n"); onExit&&onExit(); return; }
    this.lines=(this.node?FS.read(this.node):"").replace(/\n$/,"").split("\n");
    if(this.lines.length===1&&this.lines[0]==="") this.lines=[""];
    this.newFile=!this.node;
    this.r=0; this.c=0; this.top=0;
    this.mode="cmd"; this.pending=""; this.count="";
    this.yank=null; this.undoBuf=null; this.msg="";
    this.dirty=false; this.search="";
    this.cmdline=null;
    this.rows=this.t.rows-1;
    this.t.saveScreen(); this.t.hideCursor=false;
    shell.raw=(e)=>{ e.preventDefault&&e.preventDefault(); this.key(e); };
    this.msg=this.fname? "\""+this.fname+"\" "+(this.newFile?"[New file]":this.lines.length+" lines"):"(no file)";
    this.draw();
  }
  snap(){ this.undoBuf={lines:this.lines.slice(),r:this.r,c:this.c}; }
  draw(){
    if(this.done) return;
    const t=this.t;
    if(this.r<this.top) this.top=this.r;
    if(this.r>=this.top+this.rows) this.top=this.r-this.rows+1;
    for(let i=0;i<this.rows;i++){
      const li=this.top+i;
      t.setRow(i, li<this.lines.length? this.lines[li].slice(0,t.cols) : "~");
    }
    let status;
    if(this.cmdline!==null) status=this.cmdline;
    else {
      const mode=this.mode==="ins"?"-- INSERT --  ":"";
      status=mode+this.msg;
      const pos="line "+(this.r+1)+" of "+this.lines.length;
      status=pad(status, t.cols-pos.length-1)+pos;
    }
    t.setRow(this.rows, status.slice(0,t.cols), this.mode==="cmd"&&this.cmdline===null?undefined:undefined);
    if(this.cmdline!==null) t.setCursor(this.rows, this.cmdline.length);
    else t.setCursor(this.r-this.top, Math.min(this.c, Math.max(0,(this.lines[this.r]||"").length-(this.mode==="ins"?0:1)+(this.mode==="ins"?0:1))));
    /* clamp cursor col visually */
    const maxc=this.mode==="ins"?(this.lines[this.r]||"").length:Math.max(0,(this.lines[this.r]||"").length-1);
    if(this.cmdline===null) t.setCursor(this.r-this.top, Math.min(this.c,Math.max(0,maxc)));
  }
  quit(){
    if(this.done) return;
    this.done=true;
    this.sh.raw=null;
    this.t.restoreScreen();
    this.t.write("\n");
    this.onExit&&this.onExit();
  }
  save(name){
    name=name||this.fname;
    if(!name){ this.msg="No current filename"; return false; }
    const text=this.lines.join("\n")+"\n";
    const n=FS.writeFile(this.sh.abs(name),text,"/",{owner:this.sh.user});
    if(!n){ this.msg="\""+name+"\" Cannot create"; return false; }
    this.fname=name; this.dirty=false; this.newFile=false;
    this.msg="\""+name+"\" "+this.lines.length+" lines, "+text.length+" characters";
    Activity.bump("disk",0.3,400);
    return true;
  }
  key(e){
    if(this.done) return;
    const k=e.key;
    if(k==="Shift"||k==="Control"||k==="Alt"||k==="Meta"||k==="CapsLock") return;
    if(this.cmdline!==null){ this.exKey(e); return; }
    if(this.mode==="ins"){ this.insKey(e); return; }
    this.cmdKey(e);
    this.draw();
  }
  exKey(e){
    const k=e.key;
    if(k==="Enter"){ const cmd=this.cmdline.slice(1); this.cmdline=null; this.exec(cmd); this.draw(); return; }
    if(k==="Escape"){ this.cmdline=null; this.draw(); return; }
    if(k==="Backspace"){ this.cmdline=this.cmdline.slice(0,-1); if(!this.cmdline){this.cmdline=null;} this.draw(); return; }
    if(k.length===1&&!e.ctrlKey) { this.cmdline+=k; this.draw(); }
  }
  exec(cmd){
    if(this.cmdlineType==="/"){
      this.search=cmd||this.search;
      this.findNext(1,true);
      return;
    }
    if(cmd==="q"){ if(this.dirty){ this.msg="No write since last change (:quit! overrides)"; } else this.quit(); return; }
    if(cmd==="q!"||cmd==="quit!"){ this.quit(); return; }
    if(cmd==="w"){ this.save(); return; }
    if(cmd.startsWith("w ")){ this.save(cmd.slice(2).trim()); return; }
    if(cmd==="wq"||cmd==="x"){ if(this.save()) this.quit(); return; }
    if(/^\d+$/.test(cmd)){ this.r=clamp(parseInt(cmd,10)-1,0,this.lines.length-1); this.c=0; return; }
    if(cmd==="$"){ this.r=this.lines.length-1; return; }
    if(cmd==="set nu"||cmd==="set number"){ this.msg="(line numbers: the status line knows)"; return; }
    this.msg="Not an editor command: "+cmd;
  }
  findNext(dir,fromCur){
    if(!this.search){ this.msg="No previous regular expression"; return; }
    let re; try{ re=new RegExp(this.search); }catch(err){ re=new RegExp(this.search.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")); }
    const N=this.lines.length;
    for(let i=1;i<=N;i++){
      const li=((this.r+dir*i)%N+N)%N;
      if(re.test(this.lines[li])){ this.r=li; this.c=Math.max(0,this.lines[li].search(re)); this.msg="/"+this.search; return; }
    }
    this.msg="Pattern not found: "+this.search;
  }
  insKey(e){
    const k=e.key;
    if(k==="Escape"){ this.mode="cmd"; this.c=Math.max(0,this.c-1); this.msg=""; this.draw(); return; }
    const line=this.lines[this.r];
    if(k==="Enter"){
      this.lines.splice(this.r+1,0,line.slice(this.c));
      this.lines[this.r]=line.slice(0,this.c);
      this.r++; this.c=0; this.dirty=true; this.draw(); return;
    }
    if(k==="Backspace"){
      if(this.c>0){ this.lines[this.r]=line.slice(0,this.c-1)+line.slice(this.c); this.c--; this.dirty=true; }
      else if(this.r>0){ const prev=this.lines[this.r-1]; this.c=prev.length;
        this.lines[this.r-1]=prev+line; this.lines.splice(this.r,1); this.r--; this.dirty=true; }
      this.draw(); return;
    }
    if(k==="Tab"){ this.lines[this.r]=line.slice(0,this.c)+"        ".slice(0,8-(this.c%8))+line.slice(this.c); this.c+=8-(this.c%8); this.dirty=true; this.draw(); return; }
    if(k.length===1&&!e.ctrlKey&&!e.metaKey){
      this.lines[this.r]=line.slice(0,this.c)+k+line.slice(this.c);
      this.c++; this.dirty=true; Sound.tick(); this.draw();
    }
  }
  cmdKey(e){
    const k=e.key;
    const line=()=>this.lines[this.r]||"";
    const cnt=()=>{ const n=parseInt(this.count,10)||1; this.count=""; return n; };
    if(/^\d$/.test(k)&&!(k==="0"&&this.count==="")){ this.count+=k; return; }
    if(this.pending==="d"){
      this.pending="";
      const n=cnt();
      if(k==="d"){ this.snap(); this.yank={type:"line",text:this.lines.slice(this.r,this.r+n)};
        this.lines.splice(this.r,n); if(!this.lines.length)this.lines=[""];
        this.r=Math.min(this.r,this.lines.length-1); this.c=0; this.dirty=true; this.msg=n+" lines deleted"; return; }
      if(k==="w"){ this.snap(); const l=line(); let i=this.c;
        while(i<l.length&&/\S/.test(l[i]))i++; while(i<l.length&&/\s/.test(l[i]))i++;
        this.lines[this.r]=l.slice(0,this.c)+l.slice(i); this.dirty=true; return; }
      if(k==="$"){ this.snap(); this.lines[this.r]=line().slice(0,this.c); this.dirty=true; return; }
      return;
    }
    if(this.pending==="y"){
      this.pending="";
      if(k==="y"){ const n=cnt(); this.yank={type:"line",text:this.lines.slice(this.r,this.r+n)}; this.msg=n+" lines yanked"; }
      return;
    }
    if(this.pending==="g"){ this.pending=""; if(k==="g"){ this.r=0; this.c=0; } return; }
    switch(k){
      case "h": case "ArrowLeft": this.c=Math.max(0,this.c-cnt()); break;
      case "l": case "ArrowRight": this.c=Math.min(Math.max(0,line().length-1),this.c+cnt()); break;
      case "j": case "ArrowDown": this.r=Math.min(this.lines.length-1,this.r+cnt()); this.c=Math.min(this.c,Math.max(0,line().length-1)); break;
      case "k": case "ArrowUp": this.r=Math.max(0,this.r-cnt()); this.c=Math.min(this.c,Math.max(0,line().length-1)); break;
      case "0": this.c=0; break;
      case "$": this.c=Math.max(0,line().length-1); break;
      case "^": this.c=Math.max(0,line().search(/\S/)); break;
      case "w": { let n=cnt(); while(n--){ const l=line(); let i=this.c;
        while(i<l.length&&/\S/.test(l[i]))i++; while(i<l.length&&/\s/.test(l[i]))i++;
        if(i>=l.length&&this.r<this.lines.length-1){ this.r++; this.c=0; } else this.c=Math.min(i,Math.max(0,l.length-1)); } break; }
      case "b": { const l=line(); let i=this.c;
        while(i>0&&/\s/.test(l[i-1]))i--; while(i>0&&/\S/.test(l[i-1]))i--; this.c=i; break; }
      case "G": this.r=this.count?clamp(parseInt(this.count,10)-1,0,this.lines.length-1):this.lines.length-1; this.count=""; this.c=0; break;
      case "g": this.pending="g"; break;
      case "i": this.snap(); this.mode="ins"; break;
      case "I": this.snap(); this.c=Math.max(0,line().search(/\S/)); if(this.c<0)this.c=0; this.mode="ins"; break;
      case "a": this.snap(); this.c=Math.min(line().length,this.c+1); this.mode="ins"; break;
      case "A": this.snap(); this.c=line().length; this.mode="ins"; break;
      case "o": this.snap(); this.lines.splice(this.r+1,0,""); this.r++; this.c=0; this.mode="ins"; this.dirty=true; break;
      case "O": this.snap(); this.lines.splice(this.r,0,""); this.c=0; this.mode="ins"; this.dirty=true; break;
      case "x": { this.snap(); const n=cnt(); const l=line();
        if(l.length){ this.lines[this.r]=l.slice(0,this.c)+l.slice(this.c+n);
          this.c=Math.min(this.c,Math.max(0,this.lines[this.r].length-1)); this.dirty=true; } break; }
      case "d": this.pending="d"; break;
      case "y": this.pending="y"; break;
      case "p": if(this.yank&&this.yank.type==="line"){ this.snap();
          this.lines.splice(this.r+1,0,...this.yank.text.slice()); this.r++; this.c=0; this.dirty=true; } break;
      case "P": if(this.yank&&this.yank.type==="line"){ this.snap();
          this.lines.splice(this.r,0,...this.yank.text.slice()); this.c=0; this.dirty=true; } break;
      case "u": if(this.undoBuf){ const u=this.undoBuf;
          this.undoBuf={lines:this.lines.slice(),r:this.r,c:this.c};
          this.lines=u.lines; this.r=Math.min(u.r,this.lines.length-1); this.c=u.c; this.msg="1 change undone"; } break;
      case "J": { this.snap(); if(this.r<this.lines.length-1){
          this.lines[this.r]=line()+" "+this.lines[this.r+1].replace(/^\s+/,"");
          this.lines.splice(this.r+1,1); this.dirty=true; } break; }
      case ":": this.cmdline=":"; this.cmdlineType=":"; break;
      case "/": this.cmdline="/"; this.cmdlineType="/"; break;
      case "n": this.findNext(1); break;
      case "N": this.findNext(-1); break;
      case "Escape": this.count=""; this.pending=""; break;
      case "Z": this.pending="Z"; break;
      default:
        if(this.pending==="Z"&&k==="Z"){ if(this.save()||!this.fname) this.quit(); return; }
        this.pending="";
    }
  }
}

/* ============================================================
   X SERVER ANALOG + 4Dwm — window chrome, stacking, iconify,
   three-button mouse semantics, Toolchest, root menus.
   ============================================================ */
const Session = { user:null, mode:"sandbox", loginTime:0 };

const WM = {
  windows:[], zTop:100, focused:null, scale:1,
  init(){
    this.layer=$("#winlayer"); this.iconLayer=$("#iconlayer"); this.screen=$("#screen");
    window.addEventListener("resize",()=>this.fit()); this.fit();
    this.screen.addEventListener("contextmenu",e=>e.preventDefault());
    /* root menus: right = Workspace, middle = window list */
    $("#desktop").addEventListener("mousedown",(e)=>{
      if(e.target!==$("#rootbg")&&e.target!==$("#desktop")) return;
      const p=this.pt(e);
      if(e.button===2) Menu.show(p.x,p.y,this.rootMenu(),"Workspace");
      else if(e.button===1||(e.button===0&&e.altKey)) Menu.show(p.x,p.y,this.windowMenuList(),"Windows");
      else Menu.hideAll();
    });
    /* desktop key routing only; the boot phases are routed in main() */
    document.addEventListener("keydown",(e)=>{
      if(Boot.phase!=="desktop") return;
      if(Menu.openMenus.length&&e.key==="Escape"){ Menu.hideAll(); return; }
      if(e.target&&e.target.tagName==="INPUT") return;
      if(this.focused&&this.focused.onKey){
        if(e.key==="Tab"||e.key==="Backspace"||e.key===" "||e.key.startsWith("Arrow")||e.key==="/"||e.key==="'") e.preventDefault();
        this.focused.onKey(e);
        e.preventDefault();
      }
    });
  },
  fit(){
    const s=Math.min(window.innerWidth/1280, window.innerHeight/1024);
    this.scale=s;
    this.screen.style.transform="scale("+s+")";
  },
  pt(e){
    const r=this.screen.getBoundingClientRect();
    return { x:(e.clientX-r.left)/this.scale, y:(e.clientY-r.top)/this.scale };
  },
  raise(w){
    w.el.style.zIndex=++this.zTop;
    /* keyboard focus follows the raised window: an X client that is
       not on top must not keep eating keystrokes */
    const ae=document.activeElement;
    if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&!w.el.contains(ae)) ae.blur();
    if(this.focused!==w){
      if(this.focused) this.focused.setActive(false);
      this.focused=w; w.setActive(true);
    }
  },
  lower(w){
    let minZ=1e9; this.windows.forEach(x=>{ if(x!==w) minZ=Math.min(minZ,parseInt(x.el.style.zIndex)||100); });
    w.el.style.zIndex=Math.max(10,minZ-1);
  },
  create(opts){ const w=new Win(opts); this.windows.push(w); this.raise(w); return w; },
  closeAll(){ this.windows.slice().forEach(w=>w.close(true)); Menu.hideAll(); },
  rootMenu(){
    return [
      {label:"New Shell", cb:()=>Apps.launch("xwsh")},
      {label:"File System Navigator", cb:()=>Apps.launch("fsn")},
      {label:"System Monitor", cb:()=>Apps.launch("gr_osview")},
      {sep:1},
      {label:"Refresh Screen", cb:()=>{ drawRootWeave(); }},
      {label:"Restart Window Manager", cb:()=>{
        $("#winlayer").style.visibility="hidden";
        setTimeout(()=>{ $("#winlayer").style.visibility="visible"; },600);
      }},
    ];
  },
  windowMenuList(){
    const items=this.windows.map(w=>({label:(w.iconified?"* ":"")+w.title, cb:()=>{ w.deiconify(); WM.raise(w); }}));
    return items.length?items:[{label:"(no windows)",dis:1}];
  }
};

class Win {
  constructor(o){
    this.o=o; this.title=o.title||"untitled";
    this.key=o.key||this.title;
    const saved=State.data.winpos[this.key];
    this.x=saved?saved.x:(o.x!==undefined?o.x:120+Math.random()*200);
    this.y=saved?saved.y:(o.y!==undefined?o.y:120+Math.random()*120);
    this.w=o.w||520; this.h=o.h||400;
    this.x=clamp(this.x,-this.w+80,1240); this.y=clamp(this.y,0,980);
    this.iconified=false; this.maximized=null;
    this.onKey=null; this.dead=false;
    this.proc=Proc.add(o.proc||this.title,{user:Session.user||"root",tty:"console",
      ppid:Proc.wmPid||1, onkill:()=>this.close()});
    const el0=this.el=el("div","win");
    el0.style.zIndex=++WM.zTop;
    el0.innerHTML='<div class="frame"></div>'+
      '<div class="tbar"><div class="wmenu"><div class="glyph-dash"></div></div>'+
      '<div class="ttl"></div><div class="wmin"><div class="glyph-min"></div></div>'+
      '<div class="wmax"><div class="glyph-max"></div></div></div>'+
      '<div class="client"></div>'+
      ["n","s","e","w","ne","nw","se","sw"].map(d=>'<div class="rz rz-'+d+'" data-d="'+d+'"></div>').join("");
    $(".ttl",el0).textContent=this.title;
    if(o.noresize) el0.classList.add("noresize");
    this.client=$(".client",el0);
    WM.layer.appendChild(el0);
    this.applyGeom();

    el0.addEventListener("mousedown",(e)=>{ WM.raise(this); Menu.hideAll(); });
    const tbar=$(".tbar",el0);
    tbar.addEventListener("mousedown",(e)=>{
      if(e.target.closest(".wmenu")||e.target.closest(".wmin")||e.target.closest(".wmax")) return;
      if(e.button!==0&&e.button!==1) return;
      this.startDrag(e);
    });
    tbar.addEventListener("dblclick",(e)=>{
      if(e.target.closest(".wmenu")||e.target.closest(".wmin")||e.target.closest(".wmax")) return;
      this.maximize();
    });
    const wm=$(".wmenu",el0);
    wm.addEventListener("mousedown",(e)=>{ e.stopPropagation(); WM.raise(this);
      const p=WM.pt(e); Menu.show(this.x+6,this.y+30,this.sysMenu()); });
    wm.addEventListener("dblclick",(e)=>{ e.stopPropagation(); this.close(); });
    $(".wmin",el0).addEventListener("click",(e)=>{ e.stopPropagation(); this.iconify(); });
    $(".wmax",el0).addEventListener("click",(e)=>{ e.stopPropagation(); this.maximize(); });
    el0.querySelectorAll(".rz").forEach(rz=>{
      rz.addEventListener("mousedown",(e)=>{ if(e.button!==0)return; e.stopPropagation(); WM.raise(this); this.startResize(e,rz.dataset.d); });
    });
    if(o.build) o.build(this.client,this);
  }
  sysMenu(){
    return [
      {label:"Restore", cb:()=>this.deiconify(), dis:!this.iconified&&!this.maximized},
      {label:"Move", cb:()=>this.kbMove()},
      {label:"Size", cb:()=>this.kbSize(), dis:!!this.o.noresize},
      {label:"Minimize", cb:()=>this.iconify()},
      {label:"Maximize", cb:()=>this.maximize(), dis:!!this.o.noresize},
      {label:"Lower", cb:()=>WM.lower(this)},
      {sep:1},
      {label:"Quit", cb:()=>this.close()}
    ];
  }
  applyGeom(){
    this.el.style.left=this.x+"px"; this.el.style.top=this.y+"px";
    this.el.style.width=this.w+"px"; this.el.style.height=this.h+"px";
  }
  savePos(){ State.data.winpos[this.key]={x:this.x,y:this.y}; State.save(); }
  setActive(v){ this.el.classList.toggle("active",v);
    if(this.term) this.term.setFocus(v);
    if(v&&this.o.onFocus)this.o.onFocus(); }
  startDrag(e){
    const start=WM.pt(e), sx=this.x, sy=this.y;
    const move=(ev)=>{ const p=WM.pt(ev);
      this.x=clamp(sx+p.x-start.x,-this.w+60,1250); this.y=clamp(sy+p.y-start.y,0,1000); this.applyGeom(); };
    const up=()=>{ window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); this.savePos(); };
    window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    e.preventDefault();
  }
  kbMove(){
    const move=(ev)=>{ const p=WM.pt(ev); this.x=p.x-this.w/2; this.y=p.y-13; this.applyGeom(); };
    const up=()=>{ window.removeEventListener("mousemove",move); window.removeEventListener("mousedown",up,true); this.savePos(); };
    window.addEventListener("mousemove",move);
    window.addEventListener("mousedown",up,true);
  }
  kbSize(){
    const move=(ev)=>{ const p=WM.pt(ev);
      this.w=Math.max(this.o.minW||200,p.x-this.x); this.h=Math.max(this.o.minH||120,p.y-this.y);
      this.applyGeom(); this.o.onResize&&this.o.onResize(this); };
    const up=()=>{ window.removeEventListener("mousemove",move); window.removeEventListener("mousedown",up,true); };
    window.addEventListener("mousemove",move);
    window.addEventListener("mousedown",up,true);
  }
  startResize(e,d){
    const start=WM.pt(e), g={x:this.x,y:this.y,w:this.w,h:this.h};
    const minW=this.o.minW||220, minH=this.o.minH||140;
    const move=(ev)=>{
      const p=WM.pt(ev), dx=p.x-start.x, dy=p.y-start.y;
      if(d.includes("e")) this.w=Math.max(minW,g.w+dx);
      if(d.includes("s")) this.h=Math.max(minH,g.h+dy);
      if(d.includes("w")){ const w2=Math.max(minW,g.w-dx); this.x=g.x+(g.w-w2); this.w=w2; }
      if(d.includes("n")){ const h2=Math.max(minH,g.h-dy); this.y=g.y+(g.h-h2); this.h=h2; }
      this.applyGeom(); this.o.onResize&&this.o.onResize(this);
    };
    const up=()=>{ window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); this.savePos(); };
    window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    e.preventDefault();
  }
  iconify(){
    if(this.iconified) return;
    this.iconified=true;
    this.el.style.display="none";
    const slot=WM.windows.filter(w=>w.iconified).length-1;
    const ic=this.icon=el("div","dicon",WM.iconLayer);
    ic.style.left=(20+(Math.floor(slot/8))*96)+"px";
    ic.style.top=(90+(slot%8)*100)+"px";
    const img=el("div","di-img",ic); img.textContent=this.o.iconGlyph||this.title.slice(0,6);
    const lbl=el("div","di-lbl",ic); lbl.textContent=this.o.iconLabel||this.title;
    let px,py,moved;
    ic.addEventListener("mousedown",(e)=>{
      document.querySelectorAll(".dicon").forEach(d=>d.classList.remove("sel"));
      ic.classList.add("sel");
      const p=WM.pt(e); px=p.x-ic.offsetLeft; py=p.y-ic.offsetTop; moved=false;
      const mv=(ev)=>{ const q=WM.pt(ev); ic.style.left=(q.x-px)+"px"; ic.style.top=(q.y-py)+"px"; moved=true; };
      const up=()=>{ window.removeEventListener("mousemove",mv); window.removeEventListener("mouseup",up); };
      window.addEventListener("mousemove",mv); window.addEventListener("mouseup",up);
      e.preventDefault();
    });
    ic.addEventListener("dblclick",()=>this.deiconify());
  }
  deiconify(){
    if(this.maximized){ const g=this.maximized; this.maximized=null;
      this.x=g.x; this.y=g.y; this.w=g.w; this.h=g.h; this.applyGeom(); this.o.onResize&&this.o.onResize(this); }
    if(!this.iconified){ WM.raise(this); return; }
    this.iconified=false;
    if(this.icon){ this.icon.remove(); this.icon=null; }
    this.el.style.display="block";
    WM.raise(this);
  }
  maximize(){
    if(this.o.noresize) return;
    if(this.maximized){ this.deiconify(); return; }
    this.maximized={x:this.x,y:this.y,w:this.w,h:this.h};
    this.x=4; this.y=4; this.w=1272; this.h=1016;
    this.applyGeom(); this.o.onResize&&this.o.onResize(this);
  }
  close(silent){
    if(this.dead) return; this.dead=true;
    if(this.proc) Proc.remove(this.proc);
    if(this.icon) this.icon.remove();
    this.el.remove();
    const i=WM.windows.indexOf(this); if(i>=0)WM.windows.splice(i,1);
    if(WM.focused===this){ WM.focused=null;
      const top=WM.windows.filter(w=>!w.iconified).sort((a,b)=>(parseInt(b.el.style.zIndex)||0)-(parseInt(a.el.style.zIndex)||0))[0];
      if(top) WM.raise(top);
    }
    if(!silent&&this.o.onClose) this.o.onClose();
  }
}

/* ---------- menus ---------- */
const Menu = {
  openMenus:[],
  show(x,y,items,title,depth){
    depth=depth||0;
    while(this.openMenus.length>depth) this.openMenus.pop().remove();
    const m=el("div","menu",$("#screen"));
    if(title){ const t=el("div","mtitle",m); t.textContent=title; }
    for(const it of items){
      if(it.sep){ el("div","msep",m); continue; }
      const mi=el("div","mi"+(it.dis?" dis":"")+(it.sub?" sub":""),m);
      mi.textContent=(it.check!==undefined?(it.check?"■ ":"□ "):"")+it.label;
      if(!it.dis){
        if(it.sub){
          mi.addEventListener("mouseenter",()=>{
            const r=mi.getBoundingClientRect(), mr=m.getBoundingClientRect();
            this.show(x+(mr.width/WM.scale)-4, y+(r.top-mr.top)/WM.scale, it.sub, null, depth+1);
          });
        } else {
          mi.addEventListener("mouseenter",()=>{ while(this.openMenus.length>depth+1) this.openMenus.pop().remove(); });
          mi.addEventListener("mouseup",(e)=>{ e.stopPropagation(); this.hideAll(); it.cb&&it.cb(); Sound.blip(); });
          mi.addEventListener("click",(e)=>{ e.stopPropagation(); });
        }
      }
      if(it.sub&&it.dis) mi.classList.add("dis");
    }
    m.style.left=Math.min(x,1278-190)+"px";
    m.style.top=Math.min(y,1000-items.length*24-20)+"px";
    m.addEventListener("mousedown",e=>e.stopPropagation());
    this.openMenus.push(m);
    setTimeout(()=>{
      const closer=(e)=>{ if(!e.target.closest(".menu")){ this.hideAll(); document.removeEventListener("mousedown",closer,true);} };
      document.addEventListener("mousedown",closer,true);
    },0);
    return m;
  },
  hideAll(){ while(this.openMenus.length) this.openMenus.pop().remove(); }
};

/* ---------- Toolchest ---------- */
const Toolchest = {
  build(){
    const tc=$("#toolchest");
    tc.innerHTML="";
    const bar=el("div","tc-bar",tc);
    const title=el("div","tc-title",bar);
    const cube=el("canvas","tc-cube",title);
    cube.width=13; cube.height=13;
    const g=cube.getContext("2d");
    g.fillStyle="#5a6a9a"; g.fillRect(1,4,8,8); g.fillStyle="#8a9aca";
    g.beginPath(); g.moveTo(1,4); g.lineTo(4,1); g.lineTo(12,1); g.lineTo(9,4); g.closePath(); g.fill();
    g.fillStyle="#3a4a7a"; g.beginPath(); g.moveTo(9,4); g.lineTo(12,1); g.lineTo(12,9); g.lineTo(9,12); g.closePath(); g.fill();
    title.appendChild(document.createTextNode("Toolchest"));
    const menus=this.menus();
    for(const m of menus){
      const item=el("div","tc-item",bar);
      item.textContent=m.label;
      const open=(e)=>{
        e.preventDefault();
        document.querySelectorAll(".tc-item").forEach(i=>i.classList.remove("open"));
        item.classList.add("open");
        const r=item.getBoundingClientRect(), sr=WM.screen.getBoundingClientRect();
        const mm=Menu.show((r.right-sr.left)/WM.scale+2,(r.top-sr.top)/WM.scale,m.items);
        const watch=setInterval(()=>{ if(!Menu.openMenus.includes(mm)){ item.classList.remove("open"); clearInterval(watch); } },200);
      };
      item.addEventListener("mousedown",open);
      item.addEventListener("mouseenter",(e)=>{ if(Menu.openMenus.length) open(e); });
    }
  },
  menus(){
    return [
      { label:"System", items:[
        {label:"Open Unix Shell", cb:()=>Apps.launch("xwsh")},
        {label:"Console", cb:()=>Apps.launch("console")},
        {label:"System Monitor (gr_osview)", cb:()=>Apps.launch("gr_osview")},
        {label:"Hardware Inventory", cb:()=>Apps.launch("sysinfo")},
        {sep:1},
        {label:"Restart System...", cb:()=>confirmDialog("Restart the workstation?",

function confirmDialog(title, text, onOk){
  const win=WM.create({ title:"Confirmation", w:430, h:150+text.split("\n").length*15, noresize:true,
