<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<title>Mac OS 9.2.2 — A Web Simulation</title>
<meta name="description" content="An interactive front-end simulation of Mac OS 9.2.2 (Platinum). Nothing really runs — a museum exhibit in the browser, in one file.">
<style>
/* ============================================================
   Mac OS 9.2.2 Simulation — Platinum appearance
   All original artwork; no Apple assets.
   ============================================================ */
:root{
  --chicago: "Charcoal","Chicago","Tahoma","Lucida Grande",Geneva,Verdana,sans-serif;
  --geneva: "Geneva","Verdana","Tahoma",sans-serif;
  --mono: "Monaco","Courier New",monospace;
  --face:#DDDDDD; --face2:#CCCCCC; --lite:#FFFFFF; --shad:#888888; --dark:#000000;
  --hilite:#9999CC;          /* selection highlight (Appearance) */
  --hilite-text:#000000;
  --menu-h:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
body{font-family:var(--geneva);font-size:12px;cursor:default;}
#screen{position:fixed;inset:0;overflow:hidden;background:#666;}
#desktop{position:absolute;left:0;right:0;top:var(--menu-h);bottom:0;overflow:hidden;}
#deskicons,#winlayer,#striplayer,#draglayer,#balloonlayer{position:absolute;inset:0;}
#winlayer,#draglayer,#balloonlayer{pointer-events:none;}
#winlayer>*{pointer-events:auto;}
#striplayer{pointer-events:none;}
#striplayer>*{pointer-events:auto;}
textarea,input{-webkit-user-select:text;user-select:text;font-family:var(--geneva);font-size:12px;}
[contenteditable]{-webkit-user-select:text;user-select:text;}
svg{display:block;}
.hidden{display:none !important;}

/* ---------------- cursors -------------------- */
body.busy, body.busy *{cursor:wait !important;}

/* ---------------- menu bar -------------------- */
#menubar{
  position:absolute;left:0;top:0;right:0;height:var(--menu-h);
  background:#EEEEEE;border-bottom:1px solid #000;
  display:flex;align-items:stretch;z-index:5000;
  font-family:var(--chicago);font-size:13px;color:#000;
}
#menubar .mtitle{display:flex;align-items:center;padding:0 9px;white-space:nowrap;}
#menubar .mtitle.apple{padding:0 11px;}
#menubar .mtitle.hilite{background:var(--hilite);color:#fff;}
#menubar .mtitle.dim{color:#888;}
#mb-spacer{flex:1;}
#mb-clock{display:flex;align-items:center;padding:0 8px;font-family:var(--chicago);font-size:12px;}
#mb-appmenu{display:flex;align-items:center;padding:0 10px 0 6px;gap:5px;max-width:180px;overflow:hidden;}
#mb-appmenu .appname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#mb-appmenu svg{width:16px;height:16px;flex:0 0 16px;}
.mtitle svg{width:16px;height:16px;}

/* ---------------- pulled-down menus -------------------- */
.menu{
  position:fixed;background:#EEEEEE;border:1px solid #000;
  box-shadow:1px 1px 0 rgba(0,0,0,.45), 2px 2px 0 rgba(0,0,0,.25);
  z-index:6000;min-width:180px;padding:1px 0;
  font-family:var(--chicago);font-size:13px;
}
.menu .mi{display:flex;align-items:center;height:17px;padding:0 12px 0 4px;white-space:nowrap;}
.menu .mi .chk{width:14px;flex:0 0 14px;text-align:center;font-size:11px;}
.menu .mi .lab{flex:1;padding-right:24px;}
.menu .mi .key{color:#000;padding-left:8px;font-size:12px;}
.menu .mi .sub{width:12px;text-align:right;font-size:9px;}
.menu .mi.sel{background:var(--hilite);color:#fff;}
.menu .mi.sel .key{color:#fff;}
.menu .mi.dis{color:#999;}
.menu .mi.dis .key{color:#999;}
.menu .msep{height:1px;margin:2px 1px;background:#AAA;border-bottom:1px solid #fff;}
.menu .mi svg{width:16px;height:16px;margin-right:4px;}

/* ---------------- window chrome (Platinum) -------------------- */
.win{
  position:absolute;background:var(--face);
  border:1px solid #000;
  box-shadow:1px 1px 0 rgba(0,0,0,.35);
  display:flex;flex-direction:column;
}
.win .tbar{
  height:19px;flex:0 0 19px;display:flex;align-items:center;
  background:var(--face);border-bottom:1px solid #000;
  padding:0 4px;position:relative;
}
.win .tbar .stripe{
  flex:1;height:11px;margin:0 4px;
  background:repeating-linear-gradient(to bottom,#F4F4F4 0 1px,#F4F4F4 1px 2px,#9C9C9C 2px 3px);
  border:0;
}
.win .tbar .ttl{
  padding:0 4px;font-family:var(--chicago);font-size:13px;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;
  display:flex;align-items:center;gap:4px;
}
.win .tbar .ttl svg{width:14px;height:14px;}
.wbox{
  width:11px;height:11px;flex:0 0 11px;border:1px solid #222;
  background:linear-gradient(135deg,#F8F8F8 0%,#D8D8D8 45%,#AFAFAF 100%);
  box-shadow:inset 1px 1px 0 #fff;
  position:relative;
}
.wbox:active,.wbox.pressed{background:#777;box-shadow:inset 1px 1px 2px #333;}
.wbox.zoom::after{
  content:"";position:absolute;left:1px;top:1px;width:5px;height:5px;border:1px solid #444;
}
.wbox.shade::after{
  content:"";position:absolute;left:0px;top:4px;width:9px;height:1px;background:#444;box-shadow:0 -1px 0 #fff inset;
}
.win .tbar .wsp{width:4px;flex:0 0 4px;}
.win.inactive .tbar{border-bottom-color:#888;}
.win.inactive .tbar .stripe{background:none;}
.win.inactive .tbar .ttl{color:#777;}
.win.inactive .tbar .wbox{visibility:hidden;}
.win.inactive{border-color:#555;}
.win .wbody{
  flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #999;
  padding:1px;
}
.win.shaded .wbody{display:none;}
.win.shaded{height:auto !important;box-shadow:1px 1px 0 rgba(0,0,0,.35);}
.win.shaded .tbar{border-bottom:0;}
.growbox{
  position:absolute;right:1px;bottom:1px;width:15px;height:15px;z-index:30;
  background:var(--face);border-left:1px solid #666;border-top:1px solid #666;
  cursor:nwse-resize;
}
.growbox::after{
  content:"";position:absolute;left:2px;top:2px;width:9px;height:9px;
  background:
    linear-gradient(135deg,transparent 0 2px,#888 2px 3px,#fff 3px 4px,transparent 4px 6px,#888 6px 7px,#fff 7px 8px,transparent 8px);
  border:1px solid #666;background-color:#DDD;
}

/* zoom rect animation */
.zoomrect{position:fixed;border:1px dotted #555;pointer-events:none;z-index:9000;}

/* ---------------- scroll areas -------------------- */
.scrolly{overflow:auto;scrollbar-width:auto;}
.scrolly::-webkit-scrollbar{width:15px;height:15px;background:#EEE;}
.scrolly::-webkit-scrollbar-track{background:#DDD;border-left:1px solid #888;box-shadow:inset 1px 0 0 #f8f8f8;}
.scrolly::-webkit-scrollbar-thumb{
  background:linear-gradient(90deg,#BFBFEA 0%,#8888C6 100%);
  border:1px solid #333;box-shadow:inset 1px 1px 0 #DEDEF6;
}
.scrolly::-webkit-scrollbar-corner{background:#DDD;}
.scrolly::-webkit-scrollbar-button:single-button{
  background-color:#DDD;border:1px solid #888;width:15px;height:15px;
  background-repeat:no-repeat;background-position:center;
}
.scrolly::-webkit-scrollbar-button:single-button:vertical:decrement{
  background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="9" height="9"><path d="M4.5 1 8 7H1z" fill="%23333"/></svg>');
}
.scrolly::-webkit-scrollbar-button:single-button:vertical:increment{
  background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="9" height="9"><path d="M4.5 8 1 2h7z" fill="%23333"/></svg>');
}
.scrolly::-webkit-scrollbar-button:single-button:horizontal:decrement{
  background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="9" height="9"><path d="M1 4.5 7 1v7z" fill="%23333"/></svg>');
}
.scrolly::-webkit-scrollbar-button:single-button:horizontal:increment{
  background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="9" height="9"><path d="M8 4.5 2 8V1z" fill="%23333"/></svg>');
}

/* ---------------- platinum controls -------------------- */
.btn{
  font-family:var(--chicago);font-size:13px;color:#000;
  background:linear-gradient(180deg,#F6F6F6 0%,#D9D9D9 60%,#BEBEBE 100%);
  border:1px solid #000;border-radius:5px;
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #999;
  padding:2px 14px;min-width:64px;height:20px;cursor:default;
}
.btn:active:not(:disabled){background:#666;color:#fff;box-shadow:inset 1px 1px 2px #222;}
.btn:disabled{color:#999;border-color:#888;}
.defwrap{display:inline-block;border:2px solid #000;border-radius:9px;padding:1px;}
.defwrap .btn{margin:0;}
.dlgbtns{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:14px;}

.cbx{display:flex;align-items:center;gap:6px;font-size:12px;}
.cbx input{appearance:none;width:12px;height:12px;border:1px solid #000;background:#fff;
  box-shadow:inset 1px 1px 0 #ddd;position:relative;flex:0 0 12px;}
.cbx input:checked::after{content:"";position:absolute;left:1px;top:-3px;width:10px;height:10px;
  border-right:2px solid #000;border-bottom:2px solid #000;transform:rotate(40deg) scale(.7);}
.cbx input:disabled{border-color:#999;}
.rad{display:flex;align-items:center;gap:6px;font-size:12px;}
.rad input{appearance:none;width:12px;height:12px;border:1px solid #000;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0%,#ddd 70%,#aaa 100%);position:relative;flex:0 0 12px;}
.rad input:checked::after{content:"";position:absolute;left:2px;top:2px;width:6px;height:6px;border-radius:50%;background:#111;}
.tfield{
  border:1px solid #000;background:#fff;box-shadow:inset 1px 1px 0 #bbb;
  padding:2px 4px;font-size:12px;outline:none;border-radius:0;
}
select.pmenu{
  font-family:var(--chicago);font-size:12px;
  background:linear-gradient(180deg,#F6F6F6,#C9C9C9);
  border:1px solid #000;border-radius:4px;height:20px;padding:0 4px;outline:none;
}
.slider{appearance:none;height:6px;background:linear-gradient(180deg,#999,#ddd);border:1px solid #333;border-radius:3px;}
.slider::-webkit-slider-thumb{appearance:none;width:12px;height:16px;background:linear-gradient(180deg,#eee,#aaa);
  border:1px solid #000;border-radius:3px;box-shadow:inset 1px 1px 0 #fff;}

/* progress bars */
.pbar{height:12px;border:1px solid #000;background:#fff;box-shadow:inset 1px 1px 0 #ccc;position:relative;overflow:hidden;}
.pbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#9C9CE8 0%,#5A5AB4 100%);border-right:1px solid #223;}
.pbar.barber .fill{width:100% !important;background:repeating-linear-gradient(-45deg,#8888D8 0 8px,#C8C8F0 8px 16px);animation:barber .5s linear infinite;}
@keyframes barber{from{background-position:0 0;}to{background-position:22.6px 0;}}

/* group box */
.gbox{border:1px solid #999;box-shadow:1px 1px 0 #fff inset;padding:10px;margin:8px 0;position:relative;}
.gbox>.glabel{position:absolute;top:-8px;left:8px;background:var(--face);padding:0 4px;font-family:var(--chicago);font-size:12px;}

/* tabs (platinum) */
.tabs{display:flex;align-items:flex-end;padding:6px 8px 0;gap:2px;}
.tab{font-family:var(--chicago);font-size:12px;padding:3px 12px;border:1px solid #000;border-bottom:0;
  border-radius:6px 6px 0 0;background:linear-gradient(180deg,#CFCFCF,#BABABA);position:relative;top:1px;}
.tab.on{background:var(--face);padding-bottom:4px;}
.tabpane{border-top:1px solid #000;padding:10px;flex:1;overflow:auto;}

/* ---------------- desktop icons -------------------- */
.dicon{position:absolute;width:76px;text-align:center;z-index:1;}
.dicon .ic{width:32px;height:32px;margin:0 auto;position:relative;}
.dicon .ic svg{width:32px;height:32px;}
.dicon .nm{
  display:inline-block;margin-top:3px;padding:0 3px;font-size:10px;line-height:13px;
  background:#fff;color:#000;max-width:76px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.dicon.sel .ic svg{filter:brightness(.55) contrast(1.1);}
.dicon.sel .nm{background:#000;color:#fff;}
.dicon.dim .ic svg{opacity:.5;}
.dicon .nm input{
  font-size:10px;width:74px;border:1px solid #000;background:#fff;outline:2px solid var(--hilite);
  text-align:center;padding:0;
}
/* label tints */
.lbl1 .ic svg{filter:sepia(1) saturate(4) hue-rotate(-25deg);}   /* Essential - orange */
.lbl2 .ic svg{filter:sepia(1) saturate(6) hue-rotate(-50deg);}   /* Hot - red */
.lbl3 .ic svg{filter:sepia(1) saturate(3) hue-rotate(280deg);}   /* In Progress - pink */
.lbl4 .ic svg{filter:sepia(1) saturate(3) hue-rotate(150deg);}   /* Cool - cyan */
.lbl5 .ic svg{filter:sepia(1) saturate(3) hue-rotate(190deg);}   /* Personal - blue */
.lbl6 .ic svg{filter:sepia(1) saturate(3) hue-rotate(60deg);}    /* Project 1 - green */
.lbl7 .ic svg{filter:sepia(.6) saturate(2) hue-rotate(20deg);}   /* Project 2 - brown */
.dicon.sel.lbl1 .ic svg,.dicon.sel.lbl2 .ic svg,.dicon.sel.lbl3 .ic svg,.dicon.sel.lbl4 .ic svg,
.dicon.sel.lbl5 .ic svg,.dicon.sel.lbl6 .ic svg,.dicon.sel.lbl7 .ic svg{filter:brightness(.55) contrast(1.1);}

/* drag outline */
.dragghost{position:fixed;pointer-events:none;z-index:9500;}
.dragghost .go{position:absolute;border:1px dotted #222;}
.marquee{position:absolute;border:1px dotted #333;background:rgba(120,120,200,.08);z-index:900;pointer-events:none;}

/* ---------------- finder window views -------------------- */
.fwin{display:flex;flex-direction:column;height:100%;background:#fff;}
.fhdr{
  flex:0 0 18px;display:flex;align-items:center;justify-content:center;gap:16px;
  font-size:10px;color:#333;background:var(--face);
  border-bottom:1px solid #888;box-shadow:inset 0 1px 0 #fff;
}
.fbody{flex:1;position:relative;background:#fff;}
.fbody.iconview{min-height:100%;}
.fbody .dicon .nm{background:#fff;}
.fbody .dicon.sel .nm{background:#000;color:#fff;}
/* list view */
table.flist{border-collapse:collapse;width:100%;font-size:11px;}
table.flist th{
  font-weight:normal;text-align:left;font-size:11px;color:#333;background:var(--face);
  border-bottom:1px solid #888;border-right:1px solid #bbb;padding:2px 6px;white-space:nowrap;
  box-shadow:inset 0 1px 0 #fff;
}
table.flist th.on{background:#BBB;}
table.flist td{padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
table.flist tr.frow.sel td{background:var(--hilite);color:#fff;}
table.flist td .tri{display:inline-block;width:12px;color:#555;font-size:9px;}
table.flist td svg{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:4px;}
/* button view */
.fbtnview .fbtn{
  display:inline-flex;flex-direction:column;align-items:center;width:72px;margin:8px 2px;
  padding:6px 2px;border:1px solid #000;border-radius:8px;
  background:linear-gradient(180deg,#F4F4F4,#CFCFCF);box-shadow:inset 1px 1px 0 #fff;
}
.fbtnview .fbtn:active{background:#888;}
.fbtnview .fbtn svg{width:32px;height:32px;}
.fbtnview .fbtn .nm{font-size:10px;margin-top:4px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* pop-up tabbed folders */
.poptab{
  position:absolute;bottom:0;height:22px;padding:0 14px;z-index:1200;
  border:1px solid #000;border-bottom:0;border-radius:8px 8px 0 0;
  background:var(--face);display:flex;align-items:center;gap:5px;
  font-family:var(--chicago);font-size:12px;box-shadow:inset 1px 1px 0 #fff;
}
.poptab svg{width:14px;height:14px;}
.win.popped{border-bottom:0;}

/* ---------------- dialogs & alerts -------------------- */
.win.dlg .wbody{padding:0;}
.dlgpad{padding:14px 16px;}
.alertrow{display:flex;gap:16px;align-items:flex-start;}
.alertrow .aicon{flex:0 0 36px;}
.alertrow .aicon svg{width:36px;height:36px;}
.alertrow .atext{flex:1;font-size:12px;line-height:1.45;padding-top:2px;white-space:pre-line;}
.win.plaindlg .tbar{display:none;}
.win.plaindlg{border:2px solid #000;box-shadow:0 0 0 1px #fff inset, 2px 2px 0 rgba(0,0,0,.4);}
#modalveil{position:fixed;inset:0;z-index:6900;background:transparent;}

/* ---------------- control strip -------------------- */
#cstrip{
  position:absolute;left:0;bottom:26px;height:23px;display:flex;align-items:stretch;z-index:2500;
  font-size:10px;
}
#cstrip .csbody{
  display:flex;align-items:stretch;background:linear-gradient(180deg,#EDEDED,#C9C9C9);
  border:1px solid #000;border-left:0;border-radius:0 10px 10px 0;overflow:hidden;
}
#cstrip .csmod{width:28px;display:flex;align-items:center;justify-content:center;border-right:1px solid #999;box-shadow:inset 1px 0 0 #fff;}
#cstrip .csmod svg{width:18px;height:18px;}
#cstrip .csmod:active{background:#999;}
#cstrip .cstab{
  width:14px;background:linear-gradient(180deg,#EDEDED,#B9B9B9);
  border:1px solid #000;border-left:0;border-radius:0 10px 10px 0;
  display:flex;align-items:center;justify-content:center;font-size:8px;color:#333;
}
.cspop{position:fixed;background:#EEE;border:1px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,.3);z-index:6500;padding:4px;font-size:11px;}
.cspop .mi{padding:2px 10px;}
.cspop .mi.sel{background:var(--hilite);color:#fff;}

/* ---------------- balloon help -------------------- */
.balloon{
  position:fixed;max-width:210px;background:#FFFFCC;border:1px solid #000;
  border-radius:10px;padding:7px 9px;font-size:10px;line-height:1.4;z-index:9800;pointer-events:none;
  box-shadow:1px 1px 0 rgba(0,0,0,.3);
}
.balloon .tail{position:absolute;width:14px;height:14px;overflow:hidden;}
.balloon .tail::after{content:"";position:absolute;width:12px;height:12px;background:#FFFFCC;border:1px solid #000;transform:rotate(45deg);left:0;top:-7px;}

/* ---------------- boot sequence -------------------- */
#boot{position:fixed;inset:0;background:#9799A6;z-index:20000;display:flex;align-items:center;justify-content:center;}
#boot.dark{background:#000;}
#bootmac{width:220px;}
#splash{
  width:420px;background:linear-gradient(180deg,#FDFDFD,#E9E9EF);border:1px solid #000;border-radius:12px;
  box-shadow:2px 3px 0 rgba(0,0,0,.35), inset 0 0 0 1px #fff;
  padding:22px 26px;text-align:center;
}
#splash h1{font-family:var(--chicago);font-weight:normal;font-size:26px;margin:10px 0 2px;}
#splash .ver{font-size:11px;color:#444;margin-bottom:14px;}
#splash .pbar{width:300px;margin:0 auto;}
#splash .stage{font-size:10px;color:#555;margin-top:8px;height:12px;}
#parade{position:fixed;left:10px;bottom:12px;display:flex;gap:8px;align-items:flex-end;z-index:20001;}
#parade .pic{width:34px;height:34px;}
#parade .pic svg{width:32px;height:32px;}
#extoff{position:fixed;top:38%;left:0;right:0;text-align:center;font-family:var(--chicago);font-size:18px;color:#222;z-index:20002;}

/* shutdown / sleep */
#shutscreen{position:fixed;inset:0;background:#000;z-index:21000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
#shutscreen .msg{color:#DDD;font-family:var(--chicago);font-size:22px;text-align:center;}
#shutscreen .hint{color:#333;font-size:11px;}
#sleepveil{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:21000;}

/* ---------------- app-specific -------------------- */
/* Calculator */
.calc{width:172px;background:#DDD;padding:8px;}
.calc .lcd{background:#CDE3CD;border:1px solid #000;box-shadow:inset 1px 1px 2px #567;
  font-family:var(--mono);font-size:16px;text-align:right;padding:3px 6px;margin-bottom:8px;}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.calc button{font-family:var(--chicago);font-size:13px;height:24px;border:1px solid #000;border-radius:4px;
  background:linear-gradient(180deg,#F4F4F4,#C8C8C8);box-shadow:inset 1px 1px 0 #fff, 1px 1px 0 #666;}
.calc button:active{background:#777;color:#fff;}
.calc button.op{background:linear-gradient(180deg,#D6D6EE,#AAAACD);}
.calc button.wide{grid-column:span 2;}
.calc button.tall{grid-row:span 2;height:auto;}

/* Stickies */
.sticky .tbar{height:12px !important;flex-basis:12px !important;border-bottom:1px solid #666;background:transparent !important;padding:0 2px;}
.sticky .tbar .stripe{background:none !important;}
.sticky .tbar .wbox{width:8px;height:8px;flex-basis:8px;}
.sticky .tbar .ttl{display:none;}
.sticky{box-shadow:2px 2px 3px rgba(0,0,0,.25);}
.sticky .wbody{box-shadow:none;padding:0;}
.sticky textarea{width:100%;height:100%;background:transparent;border:0;outline:none;resize:none;font-size:11px;padding:4px;}

/* Note Pad / Scrapbook */
.notepad{display:flex;flex-direction:column;height:100%;background:#FFFFE8;}
.notepad textarea{flex:1;background:transparent;border:0;outline:none;resize:none;padding:8px;font-size:12px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 17px,#BBD 17px 18px);line-height:18px;}
.pagecurl{flex:0 0 22px;border-top:1px solid #999;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:#EEE;font-size:10px;}

.sherlock .statline{flex:0 0 18px;font-size:10px;color:#444;display:flex;align-items:center;padding:0 8px;background:var(--face);border-top:1px solid #999;}

.chooser{display:flex;gap:10px;padding:12px;height:100%;background:var(--face);}
.chooser .devlist,.chooser .zonebox{border:1px solid #000;background:#fff;box-shadow:inset 1px 1px 0 #bbb;overflow:auto;}
.chooser .devlist{width:150px;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:4px;padding:6px;}

.chooser .dev svg{width:32px;height:32px;margin:0 auto;}
.chooser .dev.sel{background:var(--hilite);color:#fff;}
.chooser .right{flex:1;display:flex;flex-direction:column;gap:8px;}

.qtplayer{background:#BBB;display:flex;flex-direction:column;height:100%;}
.qtplayer canvas{background:#000;flex:1;width:100%;}
.qtctl{flex:0 0 24px;display:flex;align-items:center;gap:6px;padding:0 6px;background:linear-gradient(180deg,#E8E8E8,#B8B8B8);border-top:1px solid #666;}

  display:flex;align-items:center;justify-content:center;font-size:9px;}
.qtctl .qbtn:active{background:#777;color:#fff;}
.qtctl .qtrack{flex:1;height:10px;border:1px solid #333;background:#999;position:relative;}
.qtctl .qtrack .qthumb{position:absolute;top:-2px;width:8px;height:13px;background:linear-gradient(180deg,#eee,#999);border:1px solid #000;}

.cdp{background:#C8CCD8;padding:8px;display:flex;flex-direction:column;gap:8px;height:100%;}
.cdp .lcd{background:#1B2B1B;color:#7CFC9C;font-family:var(--mono);font-size:14px;padding:6px 8px;border:2px inset #889;}
.cdp .cdbtns{display:flex;gap:4px;}
.cdp .cdbtns button{flex:1;height:22px;border:1px solid #000;border-radius:3px;background:linear-gradient(180deg,#EEE,#BBB);font-size:11px;}

.browser{display:flex;flex-direction:column;height:100%;background:var(--face);}
.browser .btools{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid #999;}

.browser .addr{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid #999;}
.browser .addr .tfield{flex:1;}
.browser .page{flex:1;background:#fff;overflow:auto;-webkit-user-select:text;user-select:text;}
.browser .bstatus{flex:0 0 18px;font-size:10px;color:#333;display:flex;align-items:center;padding:0 8px;border-top:1px solid #999;}
.wpage{font-family:"Times New Roman",serif;font-size:14px;padding:14px;}
.wpage a{color:#00C;text-decoration:underline;cursor:pointer;}
.wpage h1,.wpage h2{font-family:Arial,Helvetica,sans-serif;}
.wpage .uc{display:inline-block;padding:2px 6px;background:#FF0;border:2px dashed #F00;font-family:Arial;font-weight:bold;font-size:11px;animation:blinker 1s steps(2) infinite;}

.grapher{display:flex;flex-direction:column;height:100%;background:var(--face);}
.grapher .eqrow{display:flex;gap:6px;padding:6px;align-items:center;border-bottom:1px solid #999;}

.stext{width:100%;height:100%;background:#fff;border:0;outline:none;resize:none;padding:6px;font-size:12px;overflow:auto;}

.aboutmac{padding:14px;background:var(--face);}
.aboutmac .toprow{display:flex;gap:14px;align-items:center;margin-bottom:8px;}
.aboutmac h2{font-family:var(--chicago);font-weight:normal;font-size:20px;}
.aboutmac .memline{font-size:11px;display:flex;justify-content:space-between;width:280px;}

.aboutmac .abar svg{width:16px;height:16px;}
.aboutmac .abar .nm{width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.aboutmac .abar .bar{width:160px;height:10px;border:1px solid #333;background:#fff;position:relative;}
.aboutmac .abar .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#B8B8F0,#7878C8);}
.aboutmac .abar .sz{width:60px;text-align:right;color:#333;}

.credits{background:#000;color:#EEE;height:100%;overflow:hidden;position:relative;font-size:12px;text-align:center;}
.credits .roll{position:absolute;left:0;right:0;animation:rollup 30s linear infinite;}

/* Help viewer */
.helpwin{display:flex;height:100%;background:#fff;}
.helpwin .htoc{width:170px;border-right:1px solid #999;background:#F2F2F8;overflow:auto;padding:6px 0;}
.helpwin .htoc .hi{padding:3px 10px;font-size:11px;}
.helpwin .htoc .hi.on{background:var(--hilite);color:#fff;}
.helpwin .hbody{flex:1;overflow:auto;padding:14px;font-size:12px;line-height:1.5;-webkit-user-select:text;user-select:text;}
.helpwin .hbody a{color:#00A;text-decoration:underline;cursor:pointer;}
.helpwin .hbody h1{font-family:var(--chicago);font-size:18px;font-weight:normal;margin-bottom:8px;}
.helpwin .hbody h2{font-size:13px;margin:10px 0 4px;}

/* Extensions Manager / generic list rows */
.xlist{background:#fff;border:1px solid #000;box-shadow:inset 1px 1px 0 #bbb;overflow:auto;font-size:11px;}
.xlist .xrow{display:flex;align-items:center;gap:8px;padding:2px 8px;}
.xlist .xrow.sel{background:var(--hilite);color:#fff;}
.xlist .xrow svg{width:16px;height:16px;flex:0 0 16px;}

.ginfo{padding:10px 14px;font-size:11px;background:var(--face);}
.ginfo .top{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.ginfo .top svg{width:32px;height:32px;}
.ginfo .top .nm{font-family:var(--chicago);font-size:14px;}
.ginfo table{font-size:11px;border-spacing:0 3px;}
.ginfo td.k{color:#333;text-align:right;padding-right:8px;vertical-align:top;white-space:nowrap;}
.ginfo textarea{width:100%;height:44px;resize:none;border:1px solid #000;background:#fff;font-size:11px;padding:2px 4px;outline:none;}

/* Control panel forms */
.cpform{padding:12px;font-size:12px;background:var(--face);height:100%;overflow:auto;}
.cpform .row{display:flex;align-items:center;gap:10px;margin:7px 0;}
.cpform h3{font-family:var(--chicago);font-size:13px;font-weight:normal;margin:4px 0 8px;}
.swatch{width:42px;height:30px;border:1px solid #000;}
.swatch.on{outline:2px solid var(--hilite);}

/* misc */
kbd.k{font-family:var(--geneva);}
.wristwatch{position:fixed;z-index:9999;pointer-events:none;width:24px;height:24px;}

      r.style.height = lerp(from.height, to.height) + 'px';

      else { r.remove(); if (done) done(); }
    };
    tick();
  },

  dragMove(win, e0){
    e0.preventDefault();
    const sx = e0.clientX - win.x, sy = e0.clientY - win.y;
    const d = this.deskRect();
    let moved = false;
    const mm = e => {
      moved = true;
      win.x = clamp(e.clientX - sx, -win.w + 40, d.w - 20);
      win.y = clamp(e.clientY - sy, 0, d.h - 12);
      this.applyRect(win);
    };
    const mu = e => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
      if (moved && win.opts.onMoved) win.opts.onMoved(win, e);
    };
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
  },

  dragResize(win, e0){
    e0.preventDefault(); e0.stopPropagation();
    if (win.shaded) return;
    const sw = win.w - e0.clientX, sh = win.h - e0.clientY;
    const mm = e => {
      win.w = Math.max(win.minW, sw + e.clientX);
      win.h = Math.max(win.minH, sh + e.clientY);
      this.applyRect(win);
      if (win.opts.onResize) win.opts.onResize(win);
    };
    const mu = () => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
      if (win.opts.onResized) win.opts.onResized(win);
    };
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
  },

  closeAppWindows(appId){
    this.windowsOf(appId).slice().forEach(w => { w.opts.onClose = null; this.close(w); });
  },
};

/* ---------------- Dialog / Alert Manager ---------------- */
const Dialogs = {
  showModal(contentEl, o = {}){
    const veil = el('div', {id:'modalveil', onmousedown: e => { e.preventDefault(); Sound.beep(); }});
    $('#screen').append(veil);   // must live inside #screen's stacking context (position:fixed)
    const d = WM.deskRect();
    const w = o.w || 380;
    const win = WM.create({
      title: o.title || '', appId: o.appId || (Apps.current && Apps.current.id) || 'finder',

      content: contentEl, resizable: false, zoomable: false, shadable: !!o.title,
      closable: !!o.closable, cls: o.title ? 'dlg' : 'dlg plaindlg', isModal: true,
      onClose: () => { if (o.onClose) o.onClose(); },
    });
    win.el.style.zIndex = 7000 + (++WM.z);
    veil.style.zIndex = win.el.style.zIndex - 1;
    win.el.style.height = 'auto'; win.h = win.el.offsetHeight;
    WM.modal = win;
    const finish = () => {
      WM.modal = null; veil.remove();
      win.opts.onClose = null; WM.close(win);
      document.removeEventListener('keydown', keyer, true);
    };
    const keyer = e => {
      if (e.key === 'Enter' || e.key === 'Return'){ e.preventDefault(); e.stopPropagation(); const db = win.el.querySelector('.defwrap .btn'); if (db) db.click(); }
      else if (e.key === 'Escape' || (e.key === '.' && (e.metaKey || e.ctrlKey))){ e.preventDefault(); e.stopPropagation(); const cb = win.el.querySelector('.btn[data-cancel]'); if (cb) cb.click(); }
    };
    document.addEventListener('keydown', keyer, true);
    return {win, finish};
  },

  alert(o){
    // o: {icon:'caution'|'stop'|'note', text, buttons:[{label, default, cancel}], sound}
    return new Promise(res => {
      const btns = o.buttons || [{label:'OK', default:true}];
      const row = el('div', {class:'dlgbtns'});
      const content = el('div', {class:'dlgpad'},
        el('div', {class:'alertrow'},
          o.icon ? el('div', {class:'aicon', html: icon(o.icon === 'caution' ? 'alertCaution' : o.icon === 'stop' ? 'alertStop' : o.icon === 'bomb' ? 'bomb' : 'alertNote')}) : null,
          el('div', {class:'atext'}, o.text)),
        row);
      const ctx = this.showModal(content, {w: o.w || 400, appId: o.appId});
      btns.forEach(b => {
        const btn = el('button', {class:'btn'}, b.label);
        if (b.cancel) btn.dataset.cancel = '1';
        btn.addEventListener('click', () => { ctx.finish(); res(b.label); });
        row.append(b.default ? el('span', {class:'defwrap'}, btn) : btn);
      });
      if (o.sound !== false) Sound.beep();
    });
  },

  prompt(text, def, o = {}){
    return new Promise(res => {
      const input = el('input', {class:'tfield', style:'width:100%;margin-top:10px;', value: def || ''});
      const row = el('div', {class:'dlgbtns'});
      const content = el('div', {class:'dlgpad'},
        el('div', {class:'atext'}, text), input, row);
      const ctx = this.showModal(content, {w: o.w || 360});
      const ok = el('button', {class:'btn'}, o.okLabel || 'OK');
      const cancel = el('button', {class:'btn', 'data-cancel':'1'}, 'Cancel');
      ok.addEventListener('click', () => { ctx.finish(); res(input.value); });
      cancel.addEventListener('click', () => { ctx.finish(); res(null); });
      row.append(cancel, el('span', {class:'defwrap'}, ok));

    });

  /* the classic copy-progress window (cancellable with ⌘-.) */
  progress(o){
    // o: {title, detail, total} → returns {tick(done, itemsLeft), close(), cancelled}
    const bar = el('div', {class:'pbar', style:'width:100%;margin-top:8px;'}, el('div', {class:'fill', style:'width:0%'}));
    const line1 = el('div', {style:'font-size:11px;'}, o.detail || '');
    const line2 = el('div', {style:'font-size:10px;color:#444;margin-top:6px;'}, '');
    const row = el('div', {class:'dlgbtns'});
    const content = el('div', {class:'dlgpad'},
      el('div', {style:'font-family:var(--chicago);font-size:13px;margin-bottom:6px;'}, o.title || 'Copy'),
      line1, bar, line2, row);
    const ctx = this.showModal(content, {w: 380});
    const state = {cancelled: false};
    const stop = el('button', {class:'btn', 'data-cancel':'1'}, 'Stop');
    stop.addEventListener('click', () => { state.cancelled = true; });
    row.append(stop);
    document.body.classList.add('busy');

      set(frac, l1, l2){
        bar.firstChild.style.width = Math.round(frac * 100) + '%';
        if (l1 != null) line1.textContent = l1;
        if (l2 != null) line2.textContent = l2;
      },
      close(){ document.body.classList.remove('busy'); ctx.finish(); },
      get cancelled(){ return state.cancelled; },
    };
  },
};
/* ---------------- Menu Bar Manager ---------------- */
const Menus = {
  bar: null,
  openState: null,        // {titleEl, menuEl, def, subs:[]}
  tracking: false,

  init(){
    this.bar = $('#menubar');
    document.addEventListener('mousedown', e => {
      if (this.openState && !e.target.closest('.menu') && !e.target.closest('#menubar')) this.closeAll();
    }, true);
    setInterval(() => this.tickClock(), 1000);
  },

  rebuild(){
    const app = Apps.current;
    this.closeAll();
    this.bar.innerHTML = '';
    // Apple menu
    const appleTitle = el('div', {class:'mtitle apple', html: icon('notapple'),
      dataset:{balloon:'Use this menu to open items you use often: desk accessories, control panels, and more. About This Computer is here too.'}});
    this.attachTitle(appleTitle, () => this.appleMenu());
    this.bar.append(appleTitle);
    // App menus
    (app ? app.menus() : []).concat([this.helpMenuDef(app)]).forEach(m => {
      if (!m) return;
      const t = el('div', {class:'mtitle'}, m.title);
      this.attachTitle(t, () => m.items);
      this.bar.append(t);
    });
    this.bar.append(el('div', {id:'mb-spacer'}));
    // Clock
    if (PREFS().clockShow){
      const clk = el('div', {id:'mb-clock', dataset:{balloon:'This is the menu bar clock, from the Date & Time control panel. Click it to see the date.'}});
      clk.addEventListener('mousedown', () => { this.clockDateFlash = !this.clockDateFlash; this.tickClock(); });
      this.bar.append(clk);
      this.tickClock();
    }
    // Application menu
    const am = el('div', {class:'mtitle', id:'mb-appmenu',
      dataset:{balloon:'Use this menu to switch between the programs that are open, and to hide their windows.'}});
    am.innerHTML = icon(app ? app.icon : 'finder');
    am.append(el('span', {class:'appname'}, app ? app.name : 'Finder'));
    this.attachTitle(am, () => this.appMenu());
    this.bar.append(am);
  },

  tickClock(){
    const c = $('#mb-clock');
    if (!c) return;
    const d = new Date();
    let h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM';
    if (!PREFS().clock24) h = h % 12 || 12;
    const mm = String(d.getMinutes()).padStart(2,'0');
    const colon = PREFS().clockFlash && (d.getSeconds() % 2) ? ' ' : ':';
    if (this.clockDateFlash || PREFS().clockDate){
      c.textContent = `${DAYS[d.getDay()].slice(0,3)}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;
    } else {
      c.textContent = `${h}${colon}${mm} ${ap}`;
    }
  },

  attachTitle(titleEl, getItems){
    titleEl.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      if (WM.modal){ Sound.beep(); return; }
      if (this.openState && this.openState.titleEl === titleEl){ this.closeAll(); return; }
      this.openTitle(titleEl, getItems);
      // press-and-hold tracking: releasing over an item selects it
      const mu = e2 => {
        window.removeEventListener('mouseup', mu);
        const mi = document.elementFromPoint(e2.clientX, e2.clientY);
        const item = mi && mi.closest && mi.closest('.mi');
        if (item && item._cmd) this.selectItem(item);
        // else: sticky menus — stay open
      };
      window.addEventListener('mouseup', mu);
    });
    titleEl.addEventListener('mouseenter', () => {
      if (this.openState && this.openState.titleEl !== titleEl) this.openTitle(titleEl, getItems);
    });
  },

  openTitle(titleEl, getItems){
    this.closeAll();
    titleEl.classList.add('hilite');
    const items = getItems();
    const r = titleEl.getBoundingClientRect();
    const menuEl = this.buildMenu(items);
    menuEl.style.left = Math.min(r.left, window.innerWidth - 240) + 'px';
    menuEl.style.top = r.bottom + 1 + 'px';
    document.body.append(menuEl);
    const mw = menuEl.offsetWidth;
    if (r.left + mw > window.innerWidth - 4) menuEl.style.left = (window.innerWidth - mw - 4) + 'px';
    this.openState = {titleEl, menuEl};
  },

  buildMenu(items, depth = 0){
    const m = el('div', {class:'menu'});
    items.forEach(it => {
      if (!it) return;
      if (it.sep){ m.append(el('div', {class:'msep'})); return; }
      const enabled = typeof it.enabled === 'function' ? it.enabled() : (it.enabled !== false);
      const checked = typeof it.checked === 'function' ? it.checked() : !!it.checked;
      const row = el('div', {class:'mi' + (enabled ? '' : ' dis')},
        el('span', {class:'chk'}, checked ? '✓' : (it.mark || '')),
        it.icon ? el('span', {html: icon(it.icon)}) : null,
        el('span', {class:'lab'}, it.label),
        it.key ? el('span', {class:'key'}, '⌘' + it.key) : null,
        it.submenu ? el('span', {class:'sub'}, '▶') : null,
      );
      if (enabled && (it.cmd || it.submenu)){
        row._cmd = it.cmd; row._submenu = it.submenu;
        row.addEventListener('mouseenter', () => {
          m.querySelectorAll(':scope > .mi.sel').forEach(x => x.classList.remove('sel'));
          row.classList.add('sel');
          this.closeSubs(m);
          if (it.submenu){
            const sm = this.buildMenu(typeof it.submenu === 'function' ? it.submenu() : it.submenu, depth + 1);
            const rr = row.getBoundingClientRect();
            sm.style.left = Math.min(rr.right - 2, window.innerWidth - 200) + 'px';
            sm.style.top = (rr.top - 2) + 'px';
            document.body.append(sm);
            m._sub = sm;
          }
        });
        if (it.cmd) row.addEventListener('mouseup', e => { e.stopPropagation(); this.selectItem(row); });
        if (it.cmd) row.addEventListener('mousedown', e => { e.stopPropagation(); });
      } else {
        row.addEventListener('mouseenter', () => { m.querySelectorAll(':scope > .mi.sel').forEach(x => x.classList.remove('sel')); this.closeSubs(m); });
      }
      m.append(row);
    });
    return m;
  },
  closeSubs(m){ if (m._sub){ this.closeSubs(m._sub); m._sub.remove(); m._sub = null; } },

  selectItem(row){
    // authentic selection flash, then run
    const cmd = row._cmd;
    let n = 0, max = clamp(PREFS().menuBlink, 0, 3) * 2;
    const blink = () => {
      row.classList.toggle('sel');
      if (n++ < max) setTimeout(blink, 45);
      else { this.closeAll(); if (cmd) setTimeout(cmd, 10); }
    };
    blink();
  },

  closeAll(){
    $$('.menu').forEach(m => m.remove());
    $$('#menubar .mtitle.hilite').forEach(t => t.classList.remove('hilite'));
    this.openState = null;
  },

  /* ---- built-in menus ---- */
  appleMenu(){
    const items = [];
    const inFinder = Apps.current && Apps.current.id === 'finder';
    items.push({label: inFinder ? 'About This Computer' : `About ${Apps.current ? Apps.current.name : ''}…`,
      cmd: () => { if (inFinder) Finder.aboutThisComputer(window._optDown); else Apps.current.about ? Apps.current.about() : Dialogs.alert({icon:'note', text:`${Apps.current.name}\n\nA simulated classic application.`, sound:false}); }});
    items.push({sep:true});
    const am = VFS.search('Apple Menu Items').find(n => n.kind === 'folder');
    if (am){
      am.children.slice().sort((a,b) => a.name.localeCompare(b.name)).forEach(n => {
        items.push({label: n.name, icon: n.icon, cmd: () => Finder.openNode(n)});
      });
    }
    items.push({label:'Control Panels', icon:'cpFolder', submenu: () => {
      const cp = VFS.search('Control Panels').find(n => n.kind === 'folder' && VFS.parentOf(n) && VFS.parentOf(n).name === 'System Folder');
      const subs = (cp ? cp.children : []).slice().sort((a,b) => a.name.localeCompare(b.name))
        .map(n => ({label: n.name, icon:'cpanel', cmd: () => ControlPanels.open(n.name)}));
      subs.unshift({label:'Open Control Panels Folder', cmd: () => Finder.openFolderWindow(cp)}, {sep:true});
      return subs;
    }});
    items.push({label:'Favorites', icon:'folder', submenu: [
      {label:'Documents', icon:'folder', cmd: () => Finder.openByPath(['Macintosh HD','Documents'])},
      {label:'Macintosh HD', icon:'hd', cmd: () => Finder.openByPath(['Macintosh HD'])},
    ]});
    items.push({label:'Recent Applications', icon:'folder', submenu: () =>
      (Apps.recent.length ? Apps.recent.map(id => { const a = Apps.registry[id]; return {label: a.name, icon: a.icon, cmd: () => Apps.launch(id)}; }) : [{label:'(none)', enabled:false}])});
    items.push({label:'Recent Documents', icon:'folder', submenu: () =>
      (Finder.recentDocs.length ? Finder.recentDocs.map(id => { const n = VFS.byId(id); return n ? {label: n.name, icon: n.icon, cmd: () => Finder.openNode(n)} : null; }).filter(Boolean) : [{label:'(none)', enabled:false}])});
    items.push({sep:true});
    items.push({label:'Sherlock 2', icon:'sherlock', key:'F', cmd: () => Apps.launch('sherlock')});
    items.push({label:'Chooser', icon:'chooser', cmd: () => Apps.launch('chooser')});
    items.push({sep:true});
    items.push({label:'Shut Down', cmd: () => System.shutDown()});
    return items;
  },

  appMenu(){
    const items = [];
    const cur = Apps.current;
    items.push({label: cur && cur.hidden ? `Show ${cur.name}` : `Hide ${cur ? cur.name : ''}`,
      enabled: !!cur, cmd: () => Apps.toggleHide(cur.id)});
    items.push({label:'Hide Others', cmd: () => Apps.hideOthers()});
    items.push({label:'Show All', cmd: () => Apps.showAll()});
    items.push({sep:true});
    Apps.running().forEach(a => {
      items.push({label: a.name + (a.hidden ? '' : ''), icon: a.icon, mark: a === cur ? '✓' : '', cmd: () => Apps.activate(a.id)});
    });
    return items;
  },

  helpMenuDef(app){
    return {title:'Help', items: [
      {label:'Help Center', cmd: () => HelpCenter.open()},
      {sep:true},
      {label: Balloons.enabled ? 'Hide Balloons' : 'Show Balloons', cmd: () => Balloons.toggle()},
      {sep:true},
      {label:'Mac OS Help', key:'?', cmd: () => HelpCenter.open()},
      ...(app && app.helpItems ? [{sep:true}, ...app.helpItems()] : []),
    ]};
  },

  /* keyboard shortcut dispatch against current menus */
  handleKey(e){
    if (!(e.metaKey || e.ctrlKey)) return false;
    const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
    const defs = (Apps.current ? Apps.current.menus() : []);
    for (const m of defs){
      for (const it of m.items){
        if (it && it.key && it.key.toUpperCase() === k){
          const enabled = typeof it.enabled === 'function' ? it.enabled() : (it.enabled !== false);
          if (enabled && it.cmd){ e.preventDefault(); it.cmd(); return true; }
        }
      }
    }
    if (k === 'F'){ e.preventDefault(); Apps.launch('sherlock'); return true; }
    if (k === '?' || (k === '/' && e.shiftKey)){ e.preventDefault(); HelpCenter.open(); return true; }
    return false;
  },
};

/* ---------------- Application / Desk Accessory framework ----------------
   Cooperative multitasking, one menu bar, Application menu switching. */
const Apps = {
  registry: {},
  order: [],            // launch order of running apps
  current: null,
  recent: [],

  register(app){
    this.registry[app.id] = app;
    app.running = false; app.hidden = false;
    app.memory = app.memory || (app.id === 'finder' ? 1960 : 1024 + Math.floor(Math.random()*4096));
  },
  running(){ return this.order.map(id => this.registry[id]); },

  launch(id, arg){
    const app = this.registry[id];
    if (!app) return null;
    if (app.running){
      this.activate(id);
      if (arg && app.openDocument) app.openDocument(arg);
      return app;
    }
    app.running = true; app.hidden = false;
    this.order.push(id);
    if (id !== 'finder'){
      this.recent = [id, ...this.recent.filter(x => x !== id)].slice(0, 8);
    }
    this.current = app;
    if (app.launch) app.launch(arg);
    Menus.rebuild();
    return app;
  },
  activate(id){
    const app = this.registry[id];
    if (!app || !app.running) return;
    if (app.hidden) this.toggleHide(id, true);
    this.current = app;
    const wins = WM.windowsOf(id);
    if (wins.length){
      const top = wins.sort((a,b) => (+b.el.style.zIndex) - (+a.el.style.zIndex))[0];
      WM.activate(top);
    } else if (id === 'finder'){
      WM.wins.forEach(w => w.el.classList.add('inactive'));
      WM.front = null;
    }
    Menus.rebuild();
  },
  noteActivate(appId){       // a window of appId was clicked
    const app = this.registry[appId];
    if (app && app !== this.current && app.running){
      this.current = app;
      Menus.rebuild();
    }
  },
  noteNoWindows(appId){
    // last window closed; desk accessories quit quietly, real apps stay running
    const app = this.registry[appId];
    if (app && app.running && app.autoQuit) this.quit(appId, true);
  },
  quit(id, silent){
    const app = this.registry[id];
    if (!app || !app.running || app.id === 'finder') return;
    if (app.onQuit) app.onQuit();
    WM.closeAppWindows(id);
    app.running = false; app.hidden = false;
    this.order = this.order.filter(x => x !== id);
    if (this.current === app) this.activate('finder');
    else Menus.rebuild();
  },
  quitAll(){
    this.order.slice().filter(id => id !== 'finder').forEach(id => this.quit(id, true));
  },
  toggleHide(id, forceShow){
    const app = this.registry[id];
    if (!app) return;
    app.hidden = forceShow ? false : !app.hidden;
    WM.windowsOf(id).forEach(w => w.el.classList.toggle('hidden', app.hidden));
    if (app.hidden && this.current === app) this.activate('finder');
    else Menus.rebuild();
  },
  hideOthers(){
    this.order.forEach(id => { if (this.registry[id] !== this.current && !this.registry[id].hidden) this.toggleHide(id); });
  },
  showAll(){
    this.order.forEach(id => { if (this.registry[id].hidden) this.toggleHide(id, true); });
  },

  forceQuitDialog(){
    const app = this.current;
    if (!app || app.id === 'finder'){
      Dialogs.alert({icon:'caution', text:'The Finder cannot be force quit in this simulation. It is, after all, the whole exhibit.'});
      return;
    }
    Dialogs.alert({
      icon:'caution',
      text:`Force "${app.name}" to quit?\nUnsaved changes will be lost.`,
      buttons:[{label:'Cancel', cancel:true}, {label:'Force Quit', default:true}],
    }).then(r => { if (r === 'Force Quit') this.quit(app.id); });
  },
};
