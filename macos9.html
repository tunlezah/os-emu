/* helper: simple one-window app scaffolding */
function singleWindow(app, opts){
  const wins = WM.windowsOf(app.id);
  if (wins.length){ WM.activate(wins[0]); return wins[0]; }
  return WM.create(Object.assign({appId: app.id}, opts));
}
/* ---------------- The Finder ---------------- */
const Finder = {
  id: 'finder', name: 'Finder', icon: 'finder',
  selection: [],            // node ids
  selContainer: null,       // 'desk' or folder node id
  recentDocs: [],
  folderWins: {},           // folderId -> win
  renameTimer: null,

  /* ======== desktop patterns (all generated) ======== */
  patterns: {
    'swirl':      c => Finder.drawSwirl(c, ['#31356E','#4A3E8E','#5F55AC','#3A2F66'], '#262A55'),
    'teal swirl': c => Finder.drawSwirl(c, ['#1F5E5A','#2E7D74','#3F988C','#1A4744'], '#173F3C'),
    'bondi':      c => { const g = c.getContext('2d'); const gr = g.createLinearGradient(0,0,128,128); gr.addColorStop(0,'#0A6E8E'); gr.addColorStop(1,'#0E4C66'); g.fillStyle = gr; g.fillRect(0,0,128,128); },
    'lavender':   c => Finder.drawSwirl(c, ['#6E5A9E','#8674B4','#9C8CC4','#5A4A86'], '#4E4076'),
    'platinum':   c => { const g = c.getContext('2d'); g.fillStyle = '#9799A6'; g.fillRect(0,0,128,128); },
    'gray tile':  c => { const g = c.getContext('2d'); g.fillStyle = '#AAAAAA'; g.fillRect(0,0,128,128); g.fillStyle = '#A2A2A2'; for (let y=0;y<128;y+=2) for (let x=y%4;x<128;x+=4) g.fillRect(x,y,1,1); },
    'System 7':   c => { const g = c.getContext('2d'); g.fillStyle = '#BFBFBF'; g.fillRect(0,0,128,128); g.fillStyle = '#666'; for (let y=0;y<128;y+=4) for (let x=0;x<128;x+=4){ g.fillRect(x+(y%8?2:0), y, 1, 1); } },
  },
  drawSwirl(c, colors, bg){
    const g = c.getContext('2d');
    g.fillStyle = bg; g.fillRect(0,0,128,128);
    const rnd = mulberry(777);
    for (let i = 0; i < 46; i++){
      g.strokeStyle = colors[i % colors.length];
      g.globalAlpha = 0.5 + rnd()*0.5;
      g.lineWidth = 1.5 + rnd()*3;
      g.beginPath();
      const cx = rnd()*128, cy = rnd()*128, r = 8 + rnd()*30;
      g.arc(cx, cy, r, rnd()*Math.PI*2, rnd()*Math.PI*2 + 2 + rnd()*3);
      g.stroke();
      // wrap edges for seamless tiling
      g.beginPath(); g.arc(cx-128, cy, r, 0, Math.PI*2*rnd()+1); g.stroke();
      g.beginPath(); g.arc(cx, cy-128, r, 0, Math.PI*2*rnd()+1); g.stroke();
      g.beginPath(); g.arc(cx+128, cy, r, 0, Math.PI*2*rnd()+1); g.stroke();
      g.beginPath(); g.arc(cx, cy+128, r, 0, Math.PI*2*rnd()+1); g.stroke();
    }
    g.globalAlpha = 1;
  },
  applyPattern(name){
    const fn = this.patterns[name] || this.patterns.swirl;
    const c = el('canvas'); c.width = 128; c.height = 128;
    fn(c);
    $('#desktop').style.background = `url(${c.toDataURL()})`;
    PREFS().pattern = name; State.save();
  },

  /* ======== init & desktop ======== */
  init(){
    Apps.register(this);
    this.running = true;
    Apps.order.unshift('finder');
    Apps.current = this;
    this.applyPattern(PREFS().pattern);
    document.documentElement.style.setProperty('--hilite', PREFS().hilite);
    this.renderDesktop();
    // desktop background interactions
    const desk = $('#deskicons');
    desk.addEventListener('mousedown', e => {
      if (e.target !== desk) return;
      Apps.activate('finder');
      if (e.button === 2) return;
      this.clearSelection();
      this.marquee(e, desk, 'desk');
    });
    desk.addEventListener('contextmenu', e => {
      if (e.target !== desk) return;
      e.preventDefault();
      this.contextMenu(e, null, 'desk');
    });
  },

  deskNodes(){
    return [...VFS.root, ...VFS.deskItems, VFS.trashNode];
  },
  deskPosFor(n, i){
    const saved = State.data.deskPos[n.id];
    if (saved) return saved;
    const d = WM.deskRect();
    if (n.kind === 'trash') return {x: d.w - 84, y: d.h - 70};
    // volumes stack top right, then loose items beneath
    return {x: d.w - 84, y: 8 + i * 66};
  },
  renderDesktop(){
    const layer = $('#deskicons');
    layer.innerHTML = '';
    let vi = 0;
    this.deskNodes().forEach(n => {
      const pos = this.deskPosFor(n, vi++);
      const ic = this.makeIcon(n, 'desk');
      ic.style.left = pos.x + 'px'; ic.style.top = pos.y + 'px';
      layer.append(ic);
    });
  },

  /* ======== icon factory (desktop + windows) ======== */
  iconSvg(n){
    if (n.kind === 'trash') return icon(n.children && n.children.length ? 'trashFull' : 'trash');
    return icon(n.icon || (n.children ? 'folder' : 'doc'));
  },
  makeIcon(n, container){
    const d = el('div', {class:'dicon' + (n.label ? ' lbl' + n.label : ''), dataset:{nid: n.id, container, balloon: this.balloonFor(n)}},
      el('div', {class:'ic', html: this.iconSvg(n)}),
      el('div', {}, el('span', {class:'nm'}, n.name)),
    );
    if (n.kind === 'alias') d.querySelector('.nm').style.fontStyle = 'italic';
    if (this.selection.includes(n.id)) d.classList.add('sel');
    d.addEventListener('mousedown', e => {
      if (e.button === 2) return;
      e.stopPropagation();
      Apps.activate('finder');
      const wasSel = this.selection.includes(n.id);
      const onName = e.target.classList.contains('nm');
      if (e.shiftKey){
        if (wasSel) this.selection = this.selection.filter(x => x !== n.id);
        else if (this.selContainer === container) this.selection.push(n.id);
        else { this.selection = [n.id]; this.selContainer = container; }
      } else if (!wasSel){
        this.selection = [n.id]; this.selContainer = container;
      }
      this.paintSelection();
      // click-pause rename on the name of an already-selected icon
      clearTimeout(this.renameTimer);
      if (onName && wasSel && !e.shiftKey && this.selection.length === 1 && !n.locked && n.kind !== 'trash'){
        this.renameTimer = setTimeout(() => this.beginRename(n, d), 700);
      }
      this.dragIcons(e, n, container);
    });
    d.addEventListener('dblclick', e => {
      e.stopPropagation();
      clearTimeout(this.renameTimer);
      this.openNode(n, {fromEl: d, optionClose: e.altKey, container});
    });
    d.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      if (!this.selection.includes(n.id)){ this.selection = [n.id]; this.selContainer = container; this.paintSelection(); }
      this.contextMenu(e, n, container);
    });
    return d;
  },
  balloonFor(n){
    if (n.kind === 'trash') return 'The Trash holds items you want to throw away. To get rid of them for good, choose Empty Trash from the Special menu.';
    if (n.kind === 'volume') return `This is a ${n.network ? 'shared network volume' : 'disk'} named “${n.name}.” Open it to see what it contains.`;
    if (n.kind === 'folder') return 'A folder. Folders hold files and other folders, to keep your electronic desk tidy.';
    if (n.kind === 'app') return `The application program “${n.name}.” Open it to begin using it.`;
    if (n.kind === 'alias') return 'An alias — a lightweight pointer to the real item, which may live somewhere else.';
    return `A ${VFS.kindOf(n)}.`;
  },
  paintSelection(){
    $$('.dicon').forEach(d => d.classList.toggle('sel', this.selection.includes(d.dataset.nid)));
    $$('tr.frow').forEach(r => r.classList.toggle('sel', this.selection.includes(r.dataset.nid)));
  },
  clearSelection(){ this.selection = []; this.selContainer = null; this.paintSelection(); },
  selNodes(){ return this.selection.map(id => VFS.byId(id)).filter(Boolean); },

  beginRename(n, iconEl){
    const nm = iconEl.querySelector('.nm');
    const input = el('input', {value: n.name});
    nm.replaceWith(el('div', {}, input));
    input.focus(); input.select();
    const commit = ok => {
      const v = input.value.trim();
      if (ok && v && v !== n.name){
        n.name = v.slice(0, 31); n.modified = Date.now();
        VFS.persist();
      }
      this.refreshAll();
    };
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') commit(true);
      if (e.key === 'Escape') commit(false);
    });
    input.addEventListener('blur', () => commit(true));
    input.addEventListener('mousedown', e => e.stopPropagation());
  },

  /* ======== dragging icons (authentic outline drag) ======== */
  dragIcons(e0, n, container){
    const startX = e0.clientX, startY = e0.clientY;
    let ghost = null, started = false;
    let springTimer = null, springEl = null;
    const nodes = () => this.selection.includes(n.id) ? this.selNodes() : [n];
    const iconEls = () => this.selection.map(id => document.querySelector(`.dicon[data-nid="${id}"][data-container="${container}"], .dicon[data-nid="${id}"]`)).filter(Boolean);

    const mm = e => {
      if (!started){
        if (Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY) < 5) return;
        started = true;
        clearTimeout(this.renameTimer);
        ghost = el('div', {class:'dragghost'});
        iconEls().forEach(ie => {
          const r = ie.getBoundingClientRect();
          ghost.append(el('div', {class:'go', style:`left:${r.left - startX}px;top:${r.top - startY}px;width:${r.width}px;height:${r.height - 16}px;`}));
          const nmr = ie.querySelector('.nm').getBoundingClientRect();
          ghost.append(el('div', {class:'go', style:`left:${nmr.left - startX}px;top:${nmr.top - startY}px;width:${nmr.width}px;height:${nmr.height}px;`}));
        });
        document.body.append(ghost);
      }
      ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
      // spring-loaded folders
      const t = this.dropTargetAt(e, nodes());
      if (t && t.spring && t.node){
        if (springEl !== t.el){
          clearTimeout(springTimer); springEl = t.el;
          springTimer = setTimeout(() => {
            let blinks = 0;
            const b = setInterval(() => {
              t.el.classList.toggle('sel');
              if (++blinks >= 6){ clearInterval(b); this.openFolderWindow(t.node); }
            }, 80);
          }, 900);
        }
      } else { clearTimeout(springTimer); springEl = null; }
    };
    const mu = e => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
      clearTimeout(springTimer);
      if (!started) return;
      ghost.remove();
      this.completeDrop(e, nodes(), container);
    };
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
  },
  dropTargetAt(e, dragNodes){
    const elAt = document.elementFromPoint(e.clientX, e.clientY);
    if (!elAt) return null;
    const iconAt = elAt.closest && elAt.closest('.dicon');
    if (iconAt && !dragNodes.some(dn => dn.id === iconAt.dataset.nid)){
      const tn = VFS.resolve(VFS.byId(iconAt.dataset.nid));
      if (tn && (tn.children)) return {node: tn, el: iconAt, spring: tn.kind !== 'trash'};
    }
    const row = elAt.closest && elAt.closest('tr.frow');
    if (row){
      const tn = VFS.byId(row.dataset.nid);
      if (tn && tn.children && !dragNodes.includes(tn)) return {node: tn, el: row, spring: false};
    }
    const winEl = elAt.closest && elAt.closest('.win');
    if (winEl){
      const win = WM.wins.find(w => w.el === winEl);
      if (win && win.folderNode) return {node: win.folderNode, el: winEl, spring: false};
      return {none: true};
    }
    if (elAt.closest && elAt.closest('#deskicons')) return {desk: true};
    return null;
  },
  completeDrop(e, nodes, fromContainer){
    const t = this.dropTargetAt(e, nodes);
    if (!t) return;
    if (t.none){ return; }
    if (t.desk){
      const dtop = $('#desktop').getBoundingClientRect();
      nodes.forEach((dn, i) => {
        if (dn.kind === 'trash'){
          State.data.deskPos[dn.id] = {x: e.clientX - dtop.left - 38, y: e.clientY - dtop.top - 20 + i*8};
          State.save(); this.refreshAll(); return;
        }
        if (VFS.parentOf(dn) || (!VFS.deskItems.includes(dn) && dn.kind !== 'volume')){
          VFS.move(dn, 'desk');
        }
        State.data.deskPos[dn.id] = {x: clamp(e.clientX - dtop.left - 38, 0, dtop.width - 80), y: clamp(e.clientY - dtop.top - 20 + i*10, 0, dtop.height - 50)};
      });
      State.save(); VFS.reindex(); this.refreshAll();
      return;
    }
    const dest = t.node;
    if (dest.kind === 'trash'){
      let moved = 0;
      nodes.forEach(dn => {
        if (dn.kind === 'volume'){ this.ejectVolume(dn); return; }
        if (dn.locked){ Dialogs.alert({icon:'caution', text:`The item “${dn.name}” is locked, so it cannot be moved to the Trash.`}); return; }
        if (VFS.moveToTrash(dn)) moved++;
      });
      VFS.reindex(); this.refreshAll();
      return;
    }
    // cross-volume move → simulated copy with progress
    const destVol = VFS.volumeOf(dest);
    const big = nodes.some(dn => VFS.sizeOf(dn) > 2000000);
    const fromVols = nodes.map(dn => VFS.volumeOf(dn));
    const isCopy = fromVols.some(v => v && destVol && v !== destVol);
    const doMove = () => {
      nodes.forEach(dn => {
        if (dn.kind === 'volume') return;
        if (isCopy){ const c = VFS.cloneTree(dn); c.name = VFS.uniqueName(dest, c.name); VFS.add(dest, c); }
        else VFS.move(dn, dest);
      });
      VFS.reindex(); VFS.persist(); this.refreshAll();
    };
    if (isCopy || big) this.copyProgress(nodes, dest, doMove);
    else doMove();
  },
  copyProgress(nodes, dest, done){
    const total = nodes.reduce((a,n) => a + Math.max(1, VFS.countIn(n) + 1), 0);
    const bytes = nodes.reduce((a,n) => a + VFS.sizeOf(n), 0);
    const p = Dialogs.progress({title: `Copy to “${dest.name}”`, detail: 'Preparing to copy…'});
    let i = 0;
    const step = () => {
      if (p.cancelled){ p.close(); return; }
      i++;
      const frac = i / (total + 2);
      const secs = Math.max(1, Math.round((total - i) * 0.4));
      p.set(frac, `Items remaining to be copied: ${Math.max(0, total - i)}`, `Time remaining: about ${secs} second${secs === 1 ? '' : 's'}   (${fmtSize(Math.floor(bytes * frac))} of ${fmtSize(bytes)})`);
      if (i <= total) setTimeout(step, Math.min(500, 2600 / total));
      else { p.close(); done(); }
    };
    setTimeout(step, 300);
  },

  /* ======== rubber-band selection ======== */
  marquee(e0, layerEl, container){
    const box = el('div', {class:'marquee'});
    layerEl.append(box);
    const r0 = layerEl.getBoundingClientRect();
    const x0 = e0.clientX - r0.left, y0 = e0.clientY - r0.top;
    const mm = e => {
      const x1 = e.clientX - r0.left, y1 = e.clientY - r0.top;
      const x = Math.min(x0,x1), y = Math.min(y0,y1), w = Math.abs(x1-x0), h = Math.abs(y1-y0);
      Object.assign(box.style, {left:x+'px', top:y+'px', width:w+'px', height:h+'px'});
      this.selection = [];
      layerEl.querySelectorAll('.dicon').forEach(d => {
        const ir = d.getBoundingClientRect();
        const ix = ir.left - r0.left, iy = ir.top - r0.top;
        if (ix < x + w && ix + ir.width > x && iy < y + h && iy + ir.height > y) this.selection.push(d.dataset.nid);
      });
      this.selContainer = container;
      this.paintSelection();
    };
    const mu = () => { box.remove(); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
  },

  /* ======== opening things ======== */
  openNode(n, opts = {}){
    n = VFS.resolve(n);
    if (n.children){ this.openFolderWindow(n); return; }
    if (n.kind === 'app' || n.type === 'APPL'){
      if (n.appId) Apps.launch(n.appId);
      else Dialogs.alert({icon:'stop', text:`The application program “${n.name}” could not be opened, because it has been carefully painted onto this exhibit. (It is part of the scenery.)`});
      return;
    }
    if (n.cpanel){ ControlPanels.open(n.cpanel); return; }
    this.recentDocs = [n.id, ...this.recentDocs.filter(x => x !== n.id)].slice(0, 8);
    const byCreator = {ttxt:'simpletext', MSIE:'browser', TVOD:'qtplayer', ogle:'pictviewer'};
    const byType = {TEXT:'simpletext', PICT:'pictviewer', MooV:'qtplayer', AIFF:'qtplayer'};
    const target = byCreator[n.creator] || byType[n.type];
    if (target === 'pictviewer'){ this.openPicture(n); return; }
    if (target){ Apps.launch(target, n); return; }
    if (n.type === 'FFIL'){ this.openFontSample(n); return; }
    if (n.type === 'INIT' || n.type === 'cdev'){
      Dialogs.alert({icon:'note', text:`“${n.name}” is a system ${n.type === 'INIT' ? 'extension' : 'control panel'} file. It is loaded at startup and cannot be opened from here.`});
      return;
    }
    Dialogs.alert({icon:'caution', text:`The document “${n.name}” could not be opened, because the application program that created it could not be found.`});
  },
  openByPath(names){
    let list = VFS.root, node = null;
    for (const nm of names){
      node = (list || []).find(c => c.name === nm);
      if (!node) return;
      list = node.children;
    }
    if (node) this.openNode(node);
  },
  openPicture(n){
    const cv = el('canvas', {width: 320, height: 220, style:'background:#fff;'});
    const g = cv.getContext('2d');
    const rnd = mulberry(n.id.length * 999 + n.name.length);
    g.fillStyle = '#cfe4f7'; g.fillRect(0,0,320,150);
    g.fillStyle = '#4E8F4E'; g.beginPath(); g.moveTo(0,220); g.lineTo(0,150);
    for (let x = 0; x <= 320; x += 20) g.lineTo(x, 150 - rnd()*60);
    g.lineTo(320,220); g.fill();
    g.fillStyle = '#FFD34D'; g.beginPath(); g.arc(60 + rnd()*180, 45, 22, 0, 7); g.fill();
    g.fillStyle = '#333'; g.font = '10px Geneva'; g.fillText('(simulated PICT data)', 8, 212);
    WM.create({title: n.name, appId:'finder', titleIcon:'pict', w: 328, h: 250, resizable:false, content: cv,
      x: 120 + Math.random()*80, y: 80 + Math.random()*60});
  },
  openFontSample(n){
    WM.create({title: n.name, appId:'finder', w: 340, h: 160, resizable:false,
      content: el('div', {style:'background:#fff;height:100%;padding:12px;font-family:' + n.name + ', Geneva;'},
        el('div', {style:'font-size:12px'}, 'How razorback-jumping frogs can level six piqued gymnasts!'),
        el('div', {style:'font-size:18px;margin-top:8px'}, 'How razorback-jumping frogs…'),
        el('div', {style:'font-size:24px;margin-top:8px'}, 'Frogs & gymnasts')),
      x: 140, y: 120});
  },

  /* ======== folder windows ======== */
  winState(n){
    return State.data.winstates[n.id] || (State.data.winstates[n.id] = {view: n.viewMode || 'icon', sort:'name', asc:true, expanded:[]});
  },
  openFolderWindow(n){
    if (this.folderWins[n.id] && !this.folderWins[n.id].dead){
      WM.activate(this.folderWins[n.id]);
      return this.folderWins[n.id];
    }
    const st = this.winState(n);
    const openCount = Object.keys(this.folderWins).length;
    const win = WM.create({
      title: n.name, appId: 'finder',
      x: st.x ?? 30 + (openCount % 6) * 24, y: st.y ?? 30 + (openCount % 6) * 22,
      w: st.w ?? 460, h: st.h ?? 300, minW: 220, minH: 120,
      content: el('div', {class:'fwin'}),
      onClose: w => { delete this.folderWins[n.id]; this.saveWinState(n, w); },
      onMoved: (w, e) => {
        this.saveWinState(n, w);
        const d = WM.deskRect();
        if (e && (e.clientY - $('#desktop').getBoundingClientRect().top) > d.h - 14) this.makePopup(n, w);
      },
      onResized: w => this.saveWinState(n, w),
      zoomSize: w => this.idealSize(n),
    });
    win.folderNode = n;
    this.folderWins[n.id] = win;
    this.renderFolderWindow(win);
    return win;
  },
  saveWinState(n, w){
    const st = this.winState(n);
    Object.assign(st, {x: w.x, y: w.y, w: w.w, h: w.h});
    State.save();
  },
  idealSize(n){
    const count = (n.children || []).length;
    const st = this.winState(n);
    if (st.view === 'list') return {w: 480, h: clamp(60 + count * 16, 120, 420)};
    const cols = Math.min(5, Math.max(2, Math.ceil(Math.sqrt(count || 1))));
    return {w: clamp(cols * 84 + 30, 240, 640), h: clamp(Math.ceil((count || 1) / cols) * 66 + 50, 130, 440)};
  },
  renderFolderWindow(win){
    const n = win.folderNode;
    const st = this.winState(n);
    const root = win.contentEl.querySelector('.fwin');
    root.innerHTML = '';
    const vol = VFS.volumeOf(n) || n;
    const free = (vol.capacity || 0) - VFS.sizeOf(vol);
    root.append(el('div', {class:'fhdr'},
      el('span', {}, `${(n.children||[]).length} items`),
      el('span', {}, vol.capacity ? `${fmtSize(free)} available` : '')));
    const body = el('div', {class:'fbody scrolly', style:'overflow:auto;'});
    root.append(body);
    if (st.view === 'list') this.renderList(body, n, st);
    else if (st.view === 'button') this.renderButtons(body, n);
    else this.renderIcons(body, n, st);
    body.addEventListener('mousedown', e => {
      if (e.target !== body && !e.target.classList.contains('iconpane')) return;
      this.clearSelection();
      if (st.view !== 'list') this.marquee(e, body.querySelector('.iconpane') || body, n.id);
    });
    body.addEventListener('contextmenu', e => {
      if (e.target.closest('.dicon') || e.target.closest('tr.frow')) return;
      e.preventDefault();
      this.contextMenu(e, n, n.id, true);
    });
  },
  renderIcons(body, n, st){
    const pane = el('div', {class:'iconpane', style:'position:relative;min-width:100%;min-height:100%;'});
    body.append(pane);
    const perRow = Math.max(1, Math.floor((body.clientWidth || 420) / 84));
    (n.children || []).forEach((c, i) => {
      const ic = this.makeIcon(c, n.id);
      const p = (c.winPos && c.winPos[n.id]) || {x: 8 + (i % perRow) * 84, y: 6 + Math.floor(i / perRow) * 66};
      ic.style.left = p.x + 'px'; ic.style.top = p.y + 'px';
      pane.append(ic);
    });
    const rows = Math.ceil((n.children || []).length / perRow);
    pane.style.height = Math.max(rows * 66 + 20, 60) + 'px';
  },
  renderButtons(body, n){
    const pane = el('div', {class:'fbtnview', style:'padding:4px;'});
    body.append(pane);
    (n.children || []).forEach(c => {
      const b = el('div', {class:'fbtn', dataset:{nid: c.id}},
        el('div', {html: this.iconSvg(c)}), el('div', {class:'nm'}, c.name));
      b.addEventListener('click', () => this.openNode(c));
      pane.append(b);
    });
  },
  sortKids(kids, st){
    const key = {
      name: c => c.name.toLowerCase(),
      date: c => c.modified,
      size: c => VFS.sizeOf(c),
      kind: c => VFS.kindOf(c),
    }[st.sort] || (c => c.name.toLowerCase());
    return kids.slice().sort((a,b) => {
      const ka = key(a), kb = key(b);
      const r = ka < kb ? -1 : ka > kb ? 1 : 0;
      return st.asc ? r : -r;
    });
  },
  renderList(body, n, st){
    const tbl = el('table', {class:'flist'});
    const cols = [['name','Name'],['date','Date Modified'],['size','Size'],['kind','Kind']];
    const thead = el('tr', {});
    cols.forEach(([k, lab]) => {
      const th = el('th', {class: st.sort === k ? 'on' : ''}, lab + (st.sort === k ? (st.asc ? ' ▲' : ' ▼') : ''));
      th.addEventListener('click', () => {
        if (st.sort === k) st.asc = !st.asc; else { st.sort = k; st.asc = true; }
        State.save(); this.renderFolderWindow(this.folderWins[n.id]);
      });
      thead.append(th);
    });
    tbl.append(thead);
    const addRows = (kids, depth) => {
      this.sortKids(kids, st).forEach(c => {
        const expandable = !!c.children;
        const expanded = st.expanded.includes(c.id);
        const tr = el('tr', {class:'frow', dataset:{nid: c.id}},
          el('td', {style:`padding-left:${6 + depth * 16}px;`},
            el('span', {class:'tri'}, expandable ? (expanded ? '▼' : '▶') : ''),
            el('span', {html: this.iconSvg(c), style:'display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:4px;'}),
            c.name),
          el('td', {}, fmtDateShort(c.modified)),
          el('td', {}, c.children ? '—' : fmtSize(c.size)),
          el('td', {}, VFS.kindOf(c)),
        );
        if (this.selection.includes(c.id)) tr.classList.add('sel');
        tr.addEventListener('mousedown', e => {
          if (e.target.classList.contains('tri')) return;
          if (e.shiftKey && this.selContainer === n.id){
            if (this.selection.includes(c.id)) this.selection = this.selection.filter(x => x !== c.id);
            else this.selection.push(c.id);
          } else if (!this.selection.includes(c.id)){ this.selection = [c.id]; this.selContainer = n.id; }
          this.paintSelection();
        });
        tr.addEventListener('dblclick', () => this.openNode(c));
        tr.addEventListener('contextmenu', e => {
          e.preventDefault();
          if (!this.selection.includes(c.id)){ this.selection = [c.id]; this.selContainer = n.id; this.paintSelection(); }
          this.contextMenu(e, c, n.id);
        });
        const tri = tr.querySelector('.tri');
        if (expandable) tri.addEventListener('mousedown', e => {
          e.stopPropagation();
          if (expanded) st.expanded = st.expanded.filter(x => x !== c.id);
          else st.expanded.push(c.id);
          State.save(); this.renderFolderWindow(this.folderWins[n.id]);
        });
        tbl.append(tr);
        if (expandable && expanded) addRows(c.children, depth + 1);
      });
    };
    addRows(n.children || [], 0);
    body.append(tbl);
  },
  refreshAll(){
    this.renderDesktop();
    Object.values(this.folderWins).forEach(w => { if (!w.dead) this.renderFolderWindow(w); });
    this.paintSelection();
    Popups.render();
  },

  /* ======== pop-up tabbed folders ======== */
  makePopup(n, win){
    WM.close(win);
    if (!State.data.popups.includes(n.id)) State.data.popups.push(n.id);
    State.save();
    Popups.render();
  },

  /* ======== contextual menus (Control-click / right-click) ======== */
  contextMenu(e, n, container, isWindowBg){
    Menus.closeAll();
    let items;
    if (!n || isWindowBg){
      items = [
        {label:'Help', cmd: () => HelpCenter.open()},
        {sep:true},
        {label:'New Folder', cmd: () => this.newFolderIn(isWindowBg ? n : 'desk')},
        {label:'View Options…', cmd: () => this.viewOptions(isWindowBg ? n : null)},
        {sep:true},
        {label:'Change Desktop Background…', cmd: () => ControlPanels.open('Appearance')},
      ];
    } else {
      items = [
        {label:'Help', cmd: () => HelpCenter.open()},
        {sep:true},
        {label:'Open', cmd: () => this.openNode(n)},
        {label:'Get Info', cmd: () => this.getInfo(n)},
        {label:'Label', submenu: this.labelItems()},
        {sep:true},
        {label:'Duplicate', cmd: () => this.duplicateSel()},
        {label:'Make Alias', cmd: () => { this.selNodes().forEach(x => VFS.makeAlias(x)); VFS.reindex(); this.refreshAll(); }},
        n.kind === 'volume'
          ? {label: n.name === 'Macintosh HD' ? 'Eject (startup disk)' : 'Eject', enabled: n.name !== 'Macintosh HD', cmd: () => this.ejectVolume(n)}
          : {label:'Move To Trash', enabled: !n.locked, cmd: () => this.moveSelToTrash()},
      ];
      if (n.kind === 'trash') items = [
        {label:'Help', cmd: () => HelpCenter.open()},
        {sep:true},
        {label:'Open', cmd: () => this.openNode(n)},
        {label:'Get Info', cmd: () => this.getInfo(n)},
        {sep:true},
        {label:'Empty Trash…', enabled: VFS.trashNode.children.length > 0, cmd: () => this.emptyTrash()},
      ];
    }
    const m = Menus.buildMenu(items);
    m.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
    m.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
    document.body.append(m);
    Menus.openState = {titleEl: null, menuEl: m};
  },
  labelItems(){
    const names = ['None','Essential','Hot','In Progress','Cool','Personal','Project 1','Project 2'];
    const colors = ['','#F80','#D00','#F6A','#0AA','#00C','#080','#960'];
    return names.map((nm, i) => ({
      label: nm, mark: this.selNodes().some(x => (x.label||0) === i) ? '✓' : '',
      cmd: () => { this.selNodes().forEach(x => x.label = i); VFS.persist(); this.refreshAll(); },
    }));
  },

  /* ======== commands ======== */
  frontFolder(){
    const w = WM.frontWin();
    return w && w.folderNode ? w.folderNode : null;
  },
  newFolderIn(where){
    const target = where === 'desk' || !where ? 'desk' : where;
    const n = VFS.newFolder(target === 'desk' ? 'desk' : target);
    VFS.reindex();
    this.refreshAll();
    this.selection = [n.id]; this.selContainer = target === 'desk' ? 'desk' : target.id;
    this.paintSelection();
    const ic = document.querySelector(`.dicon[data-nid="${n.id}"]`);
    if (ic) this.beginRename(n, ic);
  },
  duplicateSel(){
    const nodes = this.selNodes().filter(x => x.kind !== 'volume' && x.kind !== 'trash');
    if (!nodes.length) return;
    const big = nodes.some(x => VFS.sizeOf(x) > 2000000 || VFS.countIn(x) > 8);
    const doIt = () => { nodes.forEach(x => VFS.duplicate(x)); VFS.reindex(); this.refreshAll(); };
    if (big) this.copyProgress(nodes, VFS.parentOf(nodes[0]) || {name:'Macintosh HD'}, doIt);
    else doIt();
  },
  moveSelToTrash(){
    this.selNodes().forEach(x => { if (x.kind !== 'volume' && x.kind !== 'trash') VFS.moveToTrash(x); });
    VFS.reindex(); this.clearSelection(); this.refreshAll();
  },
  putAwaySel(){
    this.selNodes().forEach(x => {
      if (x.kind === 'volume') this.ejectVolume(x);
      else VFS.putAway(x);
    });
    VFS.reindex(); this.refreshAll();
  },
  ejectVolume(v){
    if (v.name === 'Macintosh HD'){
      Dialogs.alert({icon:'stop', text:'The startup disk cannot be ejected. Where would the museum go?'});
      return;
    }
    VFS.eject(v);
    delete this.folderWins[v.id];
    WM.wins.slice().forEach(w => { if (w.folderNode && (w.folderNode === v || VFS.volumeOf(w.folderNode) === v)) WM.close(w); });
    this.refreshAll();
  },
  emptyTrash(){
    const items = VFS.trashNode.children;
    if (!items.length){ Sound.beep(); return; }
    const bytes = VFS.sizeOf(VFS.trashNode);
    const count = VFS.countIn(VFS.trashNode);
    const doIt = () => { VFS.emptyTrash(); Sound.crunch(); this.refreshAll(); };
    if (!PREFS().warnEmptyTrash){ doIt(); return; }
    Dialogs.alert({icon:'caution',
      text:`The Trash contains ${count} item${count === 1 ? '' : 's'}, which use${count === 1 ? 's' : ''} ${fmtSize(bytes)} of disk space. Are you sure you want to permanently remove these items?`,
      buttons:[{label:'Cancel', cancel:true}, {label:'OK', default:true}],
    }).then(r => { if (r === 'OK') doIt(); });
  },
  eraseDisk(){
    const n = this.selNodes().find(x => x.kind === 'volume');
    if (!n){ Dialogs.alert({icon:'note', text:'To erase a disk, first select its icon on the desktop.'}); return; }
    Dialogs.alert({icon:'caution',
      text:`Completely erase disk named “${n.name}”?\n(This simulation will pretend very convincingly.)`,
      buttons:[{label:'Cancel', cancel:true, default:true}, {label:'Erase'}],
    }).then(r => {
      if (r !== 'Erase') return;
      const p = Dialogs.progress({title:'Erasing disk…', detail:`Erasing “${n.name}”`});
      let i = 0;
      const step = () => {
        p.set(i / 10, `Erasing “${n.name}”`, '');
        if (i++ < 10 && !p.cancelled) setTimeout(step, 180);
        else { p.close(); if (!p.cancelled){ n.children = []; VFS.persist(); this.refreshAll(); } }
      };
      step();
    });
  },
  selectAllHere(){
    const w = WM.frontWin();
    if (w && w.folderNode){
      this.selection = (w.folderNode.children||[]).map(c => c.id);
      this.selContainer = w.folderNode.id;
    } else {
      this.selection = this.deskNodes().map(nn => nn.id);
      this.selContainer = 'desk';
    }
    this.paintSelection();
  },
  cleanUp(){
    const w = WM.frontWin();
    if (w && w.folderNode){
      (w.folderNode.children||[]).forEach(c => { if (c.winPos) delete c.winPos[w.folderNode.id]; });
      this.renderFolderWindow(w);
    } else {
      State.data.deskPos = {}; State.save(); this.renderDesktop();
    }
  },
  viewOptions(n){
    const target = n || this.frontFolder();
    const content = el('div', {class:'dlgpad'},
      el('div', {style:'font-family:var(--chicago);font-size:13px;margin-bottom:10px;'}, `View Options for “${target ? target.name : 'Desktop'}”`),
      el('label', {class:'rad'}, el('input', {type:'radio', name:'vsz', checked:'1'}), 'Icon size: 32 × 32 (the only honest size)'),
      el('label', {class:'cbx', style:'margin-top:8px;'}, el('input', {type:'checkbox', checked:'1'}), 'Keep arranged: by simulation'),
      el('div', {class:'dlgbtns'}));
    const ctx = Dialogs.showModal(content, {w: 340});
    const ok = el('button', {class:'btn'}, 'OK');
    ok.addEventListener('click', () => ctx.finish());
    content.querySelector('.dlgbtns').append(el('span', {class:'defwrap'}, ok));
  },

  /* ======== Get Info ======== */
  getInfo(n){
    if (!n){ n = this.selNodes()[0]; }
    if (!n){ Sound.beep(); return; }
    const isApp = n.kind === 'app' || n.type === 'APPL';
    const isTrash = n.kind === 'trash';
    const rows = [
      ['Kind:', VFS.kindOf(n)],
      ['Size:', n.children ? `${fmtSize(VFS.sizeOf(n))} for ${VFS.countIn(n)} items` : `${fmtSize(n.size)} (${(n.size||0).toLocaleString()} bytes)`],
      ['Where:', VFS.pathOf(n)],
      ['Created:', fmtDateShort(n.created)],
      ['Modified:', fmtDateShort(n.modified)],
    ];
    if (!n.children) rows.push(['Type/Creator:', `${n.type} / ${n.creator}`]);
    if (n.kind === 'volume') rows.splice(1, 1, ['Capacity:', fmtSize(n.capacity)], ['Available:', fmtSize((n.capacity||0) - VFS.sizeOf(n))]);
    const tbl = el('table', {});
    rows.forEach(([k,v]) => tbl.append(el('tr', {}, el('td', {class:'k'}, k), el('td', {}, v))));
    const comments = el('textarea', {}, n.comments || '');
    comments.addEventListener('input', () => { n.comments = comments.value; VFS.persist(); });
    const box = el('div', {class:'ginfo'},
      el('div', {class:'top'}, el('span', {html: this.iconSvg(n)}), el('span', {class:'nm'}, n.name)),
      tbl);
    if (isApp){
      const mem = n.memMin || (n.memMin = 1024 + Math.floor(Math.random()*2048));
      const memPref = n.memPref || (n.memPref = mem * 2);
      const g = el('div', {class:'gbox'}, el('div', {class:'glabel'}, 'Memory Requirements'),
        el('table', {},
          el('tr', {}, el('td', {class:'k'}, 'Suggested size:'), el('td', {}, `${mem + 512} K`)),
          el('tr', {}, el('td', {class:'k'}, 'Minimum size:'), el('td', {}, el('input', {class:'tfield', style:'width:60px', value: mem}), ' K')),
          el('tr', {}, el('td', {class:'k'}, 'Preferred size:'), el('td', {}, el('input', {class:'tfield', style:'width:60px', value: memPref}), ' K'))));
      box.append(g);
    }
    if (isTrash){
      const cb = el('input', {type:'checkbox'});
      cb.checked = PREFS().warnEmptyTrash;
      cb.addEventListener('change', () => { PREFS().warnEmptyTrash = cb.checked; State.save(); });
      box.append(el('label', {class:'cbx', style:'margin-top:8px;'}, cb, 'Warn before emptying'));
    }
    if (!isTrash){
      const lockCb = el('input', {type:'checkbox'});
      lockCb.checked = !!n.locked;
      lockCb.addEventListener('change', () => { n.locked = lockCb.checked; VFS.persist(); });
      box.append(el('label', {class:'cbx', style:'margin-top:8px;'}, lockCb, 'Locked'));
    }
    box.append(el('div', {style:'margin-top:8px;font-size:11px;'}, 'Comments:'), comments);
    WM.create({title: `${n.name} Info`, appId:'finder', w: 300, h: isApp ? 420 : 350, resizable: false,
      x: 150 + Math.random()*120, y: 60 + Math.random()*60,
      content: el('div', {class:'scrolly', style:'overflow:auto;height:100%;'}, box)});
  },

  /* ======== About This Computer ======== */
  aboutThisComputer(optionHeld){
    if (optionHeld){ this.aboutSimulation(); return; }
    const wrap = el('div', {class:'aboutmac'});
    const paint = () => {
      wrap.innerHTML = '';
      const totalK = 256 * 1024, sysK = 43124;
      const used = Apps.running().reduce((a, x) => a + x.memory, sysK);
      wrap.append(
        el('div', {class:'toprow'},
          el('span', {html: icon('osFace'), style:'width:40px;height:40px;display:inline-block;'}),
          el('div', {},
            el('h2', {}, 'Mac OS 9.2.2'),
            el('div', {style:'font-size:10px;color:#333;'}, '© Simulated Computer, Inc. 1984–2001 (a loving recreation — no Apple code within)'))),
        el('div', {class:'memline'}, el('span', {}, 'Built-in Memory: 256 MB'), el('span', {}, `Version: Mac OS 9.2.2`)),
        el('div', {class:'memline'}, el('span', {}, `Virtual Memory: ${PREFS().vm ? PREFS().vmSize + ' MB on Macintosh HD' : 'Off'}`), el('span', {})),
        el('div', {class:'memline'}, el('span', {}, `Largest Unused Block: ${((totalK - used) / 1024).toFixed(1)} MB`), el('span', {})),
      );
      const apps = el('div', {class:'apps'});
      const bar = (name, ic, alloc, usedK) => el('div', {class:'abar'},
        el('span', {html: icon(ic)}),
        el('span', {class:'nm'}, name),
        el('span', {class:'bar'}, el('i', {style:`width:${clamp(usedK/alloc*100, 4, 100)}%`})),
        el('span', {class:'sz'}, `${(alloc/1024).toFixed(1)} MB`));
      apps.append(bar('Mac OS', 'osFace', sysK, sysK * 0.82));
      Apps.running().forEach(x => apps.append(bar(x.name, x.icon, x.memory, x.memory * (0.35 + 0.5 * Math.abs(Math.sin(Date.now()/3000 + x.name.length))))));
      wrap.append(apps);
    };
    paint();
    const win = WM.create({title:'About This Computer', appId:'finder', w: 430, h: 300, resizable:false,
      x: 90, y: 60, content: wrap, onClose: () => clearInterval(t)});
    const t = setInterval(() => { if (!win.dead) paint(); }, 2000);
  },
  aboutSimulation(){
    const roll = el('div', {class:'roll'},
      el('h2', {style:'font-family:var(--chicago);margin-bottom:14px;'}, 'About This Simulation'),
      ...[
        'A museum exhibit of Mac OS 9.2.2', 'built with nothing but one HTML file,',
        'a great fondness for pinstripes,', 'and an unreasonable number of 1-pixel borders.', '',
        '— Cast —', '', 'The Finder .......... itself', 'Platinum ............. the look',
        'The Extensions Parade .... the icons', 'The Windowshade ........ fwip', 'The Trash ........... bulging',
        '', 'No Apple code or artwork was harmed', '(or used) in the making of this exhibit.', '',
        'Everything is simulated.', 'Nothing really runs.', 'Especially the Copland easter egg.', '',
        'Thanks for visiting.', 'So it goes.',
      ].map(t => el('div', {style:'margin:3px 0'}, t)));
    WM.create({title:'About This Simulation', appId:'finder', w: 380, h: 240, resizable:false, x: 120, y: 80,
      content: el('div', {class:'credits'}, roll)});
  },

  /* ======== screenshot ======== */
  screenshot(){
    Sound.shutter();
    State.data.pictureCount++;
    const n = VFS.node({name: `Picture ${State.data.pictureCount}`, icon:'pict', type:'PICT', creator:'ogle',
      size: 320000 + Math.floor(Math.random()*400000), created: Date.now(), modified: Date.now()});

        {label:'Label', enabled: hasSel, submenu: this.labelItems()},

        {sep:true},
        {label:'Duplicate', key:'D', enabled: hasSel, cmd: () => this.duplicateSel()},

        {label:'Add To Favorites', enabled: hasSel, cmd: () => Dialogs.alert({icon:'note', text:'Added to Favorites. (The Favorites are decorative, like most museum plaques.)', sound:false})},

          {label:'by Kind', cmd: () => this.arrangeBy('kind')},
        ]},

      ]},

        {label:'Erase Disk…', cmd: () => this.eraseDisk()},
        {sep:true},
        {label:'Sleep', cmd: () => System.sleep()},

  curView(){
    const f = this.frontFolder();
    return f ? this.winState(f).view : 'icon';
  },
  setView(v){
    const f = this.frontFolder();
    if (!f){ Sound.beep(); return; }
    this.winState(f).view = v; State.save();
    this.renderFolderWindow(this.folderWins[f.id]);
  },
  arrangeBy(sort){
    const f = this.frontFolder();
    if (!f) return;
    const st = this.winState(f);
    f.children = this.sortKids(f.children, {sort, asc:true});
    (f.children||[]).forEach(c => { if (c.winPos) delete c.winPos[f.id]; });
    VFS.persist();
    this.renderFolderWindow(this.folderWins[f.id]);
  },
  helpItems(){
    return [{label:'Finder Shortcuts', cmd: () => HelpCenter.open('shortcuts')}];
  },
};

/* ---------------- pop-up tabbed folders ---------------- */
const Popups = {
  open: {},           // folderId -> win
  render(){
    $$('.poptab').forEach(t => t.remove());
    const d = WM.deskRect();
    let x = 6;
    State.data.popups = State.data.popups.filter(id => VFS.byId(id));
    State.data.popups.forEach(id => {
      const n = VFS.byId(id);

        e.preventDefault();
        const y0 = e.clientY;
        const mu = e2 => {
          window.removeEventListener('mouseup', mu);
          window.removeEventListener('mousemove', mmv);
          if (dragged && y0 - e2.clientY > 60) this.tearOff(n);
          else this.toggle(n);
        };
        let dragged = false;
        const mmv = () => { dragged = true; };
        window.addEventListener('mousemove', mmv);
        window.addEventListener('mouseup', mu);
      });

      x += tab.offsetWidth + 6;

/* document picker used by several apps */
function pickDocument(type, cb){
  const files = [];
  const visit = n => { if (!n.children && (!type || n.type === type)) files.push(n); (n.children||[]).forEach(visit); };
  VFS.root.forEach(visit); VFS.deskItems.forEach(visit);
  const list = el('div', {class:'xlist scrolly', style:'height:180px;margin-top:8px;'});
  let sel = null;
  files.forEach(f => {
    const row = el('div', {class:'xrow'}, el('span', {html: icon(f.icon || 'doc')}), el('span', {}, `${f.name}  —  ${VFS.pathOf(f)}`));
    row.addEventListener('mousedown', () => { list.querySelectorAll('.xrow.sel').forEach(x => x.classList.remove('sel')); row.classList.add('sel'); sel = f; });
    row.addEventListener('dblclick', () => { ctx.finish(); cb(f); });
    list.append(row);
  });
  const row = el('div', {class:'dlgbtns'});
  const content = el('div', {class:'dlgpad'}, el('div', {style:'font-family:var(--chicago);font-size:13px;'}, 'Open which document?'), list, row);
  const ctx = Dialogs.showModal(content, {w: 420});
  const cancel = el('button', {class:'btn', 'data-cancel':'1'}, 'Cancel');
  cancel.addEventListener('click', () => ctx.finish());
  const open = el('button', {class:'btn'}, 'Open');
  open.addEventListener('click', () => { if (sel){ ctx.finish(); cb(sel); } else Sound.beep(); });
  row.append(cancel, el('span', {class:'defwrap'}, open));
}

/* ---------------- Calculator (desk accessory) ---------------- */
Apps.register({
  id:'calculator', name:'Calculator', icon:'calculator', autoQuit: true,
  acc: null, op: null, cur: '0', fresh: true,
  launch(){
    const lcd = el('div', {class:'lcd'}, '0');
    const keys = el('div', {class:'keys'});
    const layout = [['C','±','÷','×'],['7','8','9','−'],['4','5','6','+'],['1','2','3','='],['0','.','','']];
    const press = k => {
      Sound.click();
      if (k >= '0' && k <= '9'){ this.cur = this.fresh ? k : (this.cur === '0' ? k : this.cur + k); this.fresh = false; }
      else if (k === '.'){ if (this.fresh){ this.cur = '0.'; this.fresh = false; } else if (!this.cur.includes('.')) this.cur += '.'; }
      else if (k === 'C'){ this.cur = '0'; this.acc = null; this.op = null; this.fresh = true; }
      else if (k === '±'){ this.cur = this.cur.startsWith('-') ? this.cur.slice(1) : (this.cur === '0' ? '0' : '-' + this.cur); }
      else {
        const val = parseFloat(this.cur);
        if (this.op && this.acc != null && !this.fresh){
          const f = {'+':(a,b)=>a+b,'−':(a,b)=>a-b,'×':(a,b)=>a*b,'÷':(a,b)=>b===0?NaN:a/b}[this.op];
          this.acc = f(this.acc, val);
        } else if (this.acc == null) this.acc = val;
        this.op = k === '=' ? null : k;
        this.cur = String(Number(this.acc.toPrecision(10)));
        if (this.cur === 'NaN') this.cur = 'Error';
        this.fresh = true;
      }
      lcd.textContent = this.cur;
    };
    layout.flat().forEach(k => {
      if (!k){ keys.append(el('span')); return; }
      const b = el('button', {class: '+-×÷=−'.includes(k) && k !== '' ? 'op' : '', dataset:{balloon: k === 'C' ? 'Clears the calculation. Everyone needs a fresh start.' : undefined}}, k);
      b.addEventListener('click', () => press(k));
      keys.append(b);
    });
    const win = singleWindow(this, {title:'Calculator', w: 172, h: 210, resizable:false, zoomable:false,
      x: 320, y: 90, content: el('div', {class:'calc'}, lcd, keys)});
    win.keyer = e => {
      const map = {'+':'+','-':'−','*':'×','/':'÷','Enter':'=','=':'=','Escape':'C','c':'C','.':'.'};
      if (e.key >= '0' && e.key <= '9') press(e.key);
      else if (map[e.key]) press(map[e.key]);
    };
  },
  handleKey(e){ const w = WM.frontWin(); if (w && w.appId === this.id && w.keyer){ w.keyer(e); return true; } return false; },
  menus(){ return [ stdFileMenu(this), editMenuDef() ]; },
  about(){ Dialogs.alert({icon:'note', sound:false, text:'Calculator\n\nFour functions. Zero pretension.\nA desk accessory since the beginning of desks.'}); },
});

/* ---------------- Key Caps ---------------- */
Apps.register({
  id:'keycaps', name:'Key Caps', icon:'keycaps', autoQuit: true,
  launch(){
    const typed = el('div', {class:'typed'});
    const ROWS = [
      ['`','1','2','3','4','5','6','7','8','9','0','-','=','delete'],
      ['tab','q','w','e','r','t','y','u','i','o','p','[',']','\\'],
      ['caps','a','s','d','f','g','h','j','k','l',';','\'','return'],
      ['shift','z','x','c','v','b','n','m',',','.','/','shift'],
      ['ctrl','opt','⌘','space','⌘','opt','ctrl'],
    ];
    const SHIFTED = {'`':'~','1':'!','2':'@','3':'#','4':'$','5':'%','6':'^','7':'&','8':'*','9':'(','0':')','-':'_','=':'+','[':'{',']':'}','\\':'|',';':':','\'':'"',',':'<','.':'>','/':'?'};
    const OPTED = {'a':'å','s':'ß','d':'∂','f':'ƒ','g':'©','p':'π','e':'´','r':'®','t':'†','y':'¥','u':'¨','o':'ø','1':'¡','2':'™','8':'•','k':'˚','l':'¬','v':'√','m':'µ','c':'ç','z':'Ω','q':'œ','w':'∑','n':'˜','b':'∫'};
    const kbd = el('div', {class:'kbd'});
    const keyEls = {};
    let shiftOn = false, optOn = false;
    const labelFor = base => {
      if (base.length > 1) return base;
      if (optOn && OPTED[base]) return OPTED[base];
      if (shiftOn) return SHIFTED[base] || base.toUpperCase();
      return base;
    };
    const paint = () => {
      ROWS.forEach((row, ri) => row.forEach((base, ci) => {
        const k = keyEls[ri + ',' + ci];
        k.textContent = labelFor(base) === 'space' ? '' : labelFor(base);
      }));
    };
    ROWS.forEach((row, ri) => {
      const r = el('div', {class:'krow'});
      row.forEach((base, ci) => {
        const wide = {'delete':1.6,'tab':1.6,'caps':1.9,'return':1.9,'shift':2.4,'ctrl':1.3,'opt':1.3,'⌘':1.5}[base];
        const k = el('div', {class:'kkey' + (base === 'space' ? ' spring' : ''), style: wide ? `min-width:${wide*22}px;` : ''}, base);
        keyEls[ri + ',' + ci] = k;
        k.addEventListener('mousedown', () => {
          k.classList.add('down');
          setTimeout(() => k.classList.remove('down'), 150);
          if (base === 'space') typed.textContent += ' ';
          else if (base === 'delete') typed.textContent = typed.textContent.slice(0, -1);
          else if (base.length === 1) typed.textContent += labelFor(base);
          Sound.click();
        });
        r.append(k);
      });
      kbd.append(r);
    });
    paint();
    const findKey = evKey => {
      const low = evKey.toLowerCase();
      const name = {' ':'space','backspace':'delete','enter':'return','shift':'shift','control':'ctrl','alt':'opt','meta':'⌘','capslock':'caps','tab':'tab'}[low] || low;
      const out = [];
      ROWS.forEach((row, ri) => row.forEach((b, ci) => { if (b === name || (SHIFTED[b] || '') === evKey) out.push(keyEls[ri + ',' + ci]); }));
      return out;
    };
    const win = singleWindow(this, {title:`Key Caps — ${PREFS().keyboardLayout}`, w: 560, h: 220, x: 90, y: 140,
      resizable:false, content: el('div', {class:'keycaps'}, typed, kbd)});
    const kd = e => {
      if (Apps.current.id !== this.id) return;
      shiftOn = e.shiftKey; optOn = e.altKey; paint();
      findKey(e.key).forEach(k => k.classList.add('down'));
      if (e.key.length === 1 && !e.metaKey && !e.ctrlKey){ typed.textContent += e.key; e.preventDefault(); }
      if (e.key === 'Backspace'){ typed.textContent = typed.textContent.slice(0, -1); e.preventDefault(); }
    };
    const ku = e => {
      shiftOn = e.shiftKey; optOn = e.altKey; paint();
      findKey(e.key).forEach(k => k.classList.remove('down'));
    };
    document.addEventListener('keydown', kd);
    document.addEventListener('keyup', ku);
    win.opts.onClose = () => { document.removeEventListener('keydown', kd); document.removeEventListener('keyup', ku); };
  },
  menus(){ return [ stdFileMenu(this), editMenuDef() ]; },
});

Apps.register({
  id:'qtplayer', name:'QuickTime Player', icon:'qtplayer',

  makeWin(node){
    const cv = el('canvas', {width: 320, height: 200});
    const g = cv.getContext('2d');
    let playing = false, t = 0, raf = null;
    const dur = 600;
    const track = el('div', {class:'qtrack'}, el('div', {class:'qthumb'}));
    const thumb = track.firstChild;
    const draw = () => {
      g.fillStyle = '#000'; g.fillRect(0,0,320,200);
      // generated animation: bouncing shapes + starfield
      for (let i = 0; i < 40; i++){
        const sx = (i * 53 + t * (1 + i % 5)) % 320, sy = (i * 37) % 200;
        g.fillStyle = ['#556','#889','#AAB'][i % 3];
        g.fillRect(320 - sx, sy, 2, 2);
      }
      const bx = 160 + Math.sin(t/30) * 110, by = 100 + Math.abs(Math.sin(t/13)) * -70 + 40;
      g.fillStyle = '#E8C040'; g.beginPath(); g.arc(bx, by, 18, 0, 7); g.fill();
      g.strokeStyle = '#000'; g.stroke();
      g.fillStyle = '#4E8FD0'; g.fillRect(40 + (t % 280), 150, 26, 18);
      g.fillStyle = '#fff'; g.font = '10px Geneva';
      g.fillText(node && node.name ? node.name : 'Sample Movie — generated live, no film was harmed', 8, 192);
      thumb.style.left = `${(t % dur) / dur * 96}%`;
    };
    const loop = () => { if (playing){ t++; draw(); raf = requestAnimationFrame(loop); } };
    draw();
    const btn = el('div', {class:'qbtn', dataset:{balloon:'Play or pause the movie. The classic controller, minus the movie rights.'}}, '▶');
    btn.addEventListener('click', () => {
      playing = !playing; btn.textContent = playing ? '❚❚' : '▶';

    const step = el('div', {class:'qbtn'}, '▶❚');

    const count = WM.windowsOf(this.id).length;
    const win = WM.create({appId: this.id, title: node && node.name ? node.name : 'Sample Movie', w: 326, h: 252,
      x: 200 + count*24, y: 90 + count*24, resizable: false,
      content: el('div', {class:'qtplayer'}, cv, el('div', {class:'qtctl'}, vol, btn, track, step)),

/* ---------------- Graphing Calculator ---------------- */
Apps.register({
  id:'grapher', name:'Graphing Calculator', icon:'grapher',
  launch(){
    const eq = el('input', {class:'tfield', style:'flex:1;font-family:var(--mono);', value:'sin(x) * x/3'});
    const go = el('button', {class:'btn'}, 'Graph');
    const demoBtn = el('button', {class:'btn'}, 'Demo');
    const cv = el('canvas', {width: 460, height: 300});
    let demo = null, phase = 0;
    const compile = src => {
      try {
        const body = src.replace(/\^/g, '**')
          .replace(/\b(sin|cos|tan|abs|sqrt|log|exp|atan|floor|pow|min|max)\b/g, 'Math.$1')
          .replace(/\bpi\b/gi, 'Math.PI');
        const f = new Function('x', 't', `"use strict"; return (${body});`);
        f(0, 0);
        return f;
      } catch(e){ return null; }
    };
    const plot = (f, tval) => {
      const g = cv.getContext('2d');
      const W = cv.width, H = cv.height, XR = 10;
      g.fillStyle = '#fff'; g.fillRect(0,0,W,H);
      g.strokeStyle = '#BBB';
      for (let gx = -XR; gx <= XR; gx += 2){ const px = (gx + XR)/(2*XR)*W; g.beginPath(); g.moveTo(px,0); g.lineTo(px,H); g.stroke(); }
      g.strokeStyle = '#333';
      g.beginPath(); g.moveTo(0,H/2); g.lineTo(W,H/2); g.stroke();
      g.beginPath(); g.moveTo(W/2,0); g.lineTo(W/2,H); g.stroke();
      if (!f) return;
      g.strokeStyle = '#C03030'; g.lineWidth = 1.6; g.beginPath();
      let started = false;
      for (let px = 0; px <= W; px++){
        const x = (px/W) * 2*XR - XR;
        let y;
        try { y = f(x, tval); } catch(e){ y = NaN; }
        if (!isFinite(y)){ started = false; continue; }
        const py = H/2 - y * (H/8);
        if (py < -2000 || py > 2000){ started = false; continue; }
        if (!started){ g.moveTo(px, py); started = true; } else g.lineTo(px, py);
      }
      g.stroke(); g.lineWidth = 1;
      g.fillStyle = '#333'; g.font = '10px Geneva';
      g.fillText('y = ' + eq.value, 8, 14);
    };
    const graph = () => {
      clearInterval(demo); demo = null; demoBtn.textContent = 'Demo';
      const f = compile(eq.value);
      if (!f){ Dialogs.alert({icon:'stop', text:'That equation confused the simulated math coprocessor. Try something like: sin(x) * x/3'}); return; }
      plot(f, 0);
    };
    const DEMOS = ['sin(x*2 + t) * 2', 'sin(x + t) + cos(x*2 - t)/2', 'sin(x*x/4 + t) * 2.4', 'tan(x/2 + t/3)/3', 'abs(sin(x + t)) * 3 - 1.5'];
    let di = 0;
    demoBtn.addEventListener('click', () => {
      if (demo){ clearInterval(demo); demo = null; demoBtn.textContent = 'Demo'; return; }
      demoBtn.textContent = 'Stop';
      let ticks = 0;
      demo = setInterval(() => {
        phase += 0.08; ticks++;
        if (ticks % 120 === 0){ di = (di + 1) % DEMOS.length; eq.value = DEMOS[di]; }
        plot(compile(eq.value.replace(/\bt\b/g, '(' + phase.toFixed(3) + ')')) || compile(eq.value), phase);
      }, 33);
    });
    go.addEventListener('click', graph);
    eq.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') graph(); });
    const win = singleWindow(this, {title:'Graphing Calculator', w: 470, h: 370, x: 100, y: 70, resizable: false,
      content: el('div', {class:'grapher'},
        el('div', {class:'eqrow'}, el('span', {style:'font-family:var(--mono);font-size:13px;'}, 'y ='), eq, go, demoBtn),
        cv),
      onClose: () => clearInterval(demo)});
    graph();
  },
  menus(){ return [ stdFileMenu(this), editMenuDef(), {title:'Equation', items:[
    {label:'Demo Mode', cmd: () => { const w = WM.windowsOf(this.id)[0]; if (w) w.el.querySelectorAll('.btn')[1].click(); }},
  ]} ]; },
  about(){ Dialogs.alert({icon:'note', sound:false, text:'Graphing Calculator\n\nFamously written in spare moments by people\nwho technically did not work there.\nThis one was, too.'}); },
});

      const [name, len] = this.TRACKS[this.cur];
      const m = Math.floor(this.pos/60), s = String(Math.floor(this.pos%60)).padStart(2,'0');
      lcd.textContent = `${String(this.cur+1).padStart(2,'0')}  ${m}:${s}  ${this.playing ? '▶' : '❚❚'}  ${name}`;
      tracks.querySelectorAll('.trow').forEach((r,i) => r.classList.toggle('on', i === this.cur));
    };
    this.TRACKS.forEach(([name, len], i) => {
      const r = el('div', {class:'trow'}, el('span', {}, `${i+1}. ${name}`), el('span', {}, `${Math.floor(len/60)}:${String(len%60).padStart(2,'0')}`));
      r.addEventListener('dblclick', () => { this.cur = i; this.pos = 0; this.play(paint); });
      tracks.append(r);
    });
    const mk = (label, fn) => { const b = el('button', {}, label); b.addEventListener('click', () => fn()); return b; };
    const btns = el('div', {class:'cdbtns'},
      mk('⏮', () => { this.cur = (this.cur + this.TRACKS.length - 1) % this.TRACKS.length; this.pos = 0; if (this.playing) this.play(paint); paint(); }),
      mk('▶', () => this.play(paint)),
      mk('❚❚', () => this.pause(paint)),
      mk('■', () => { this.pause(paint); this.pos = 0; paint(); }),
      mk('⏭', () => { this.cur = (this.cur + 1) % this.TRACKS.length; this.pos = 0; if (this.playing) this.play(paint); paint(); }),
      mk('⏏', () => { this.pause(paint); Dialogs.alert({icon:'note', sound:false, text:'The imaginary disc slides out with a satisfying whir.'}); }),
    );
    singleWindow(this, {title:'AppleCD Audio Player', w: 340, h: 280, x: 240, y: 120, resizable:false,
      content: el('div', {class:'cdp'}, lcd, btns, tracks),
      onClose: () => this.pause(() => {})});
    paint();
  },
  play(paint){
    this.pause(paint);
    this.playing = true;
    // synthesized "CD audio": a gentle generative melody per track
    const scale = [262, 294, 330, 392, 440, 523];
    const rnd = mulberry(1000 + this.cur * 77 + Math.floor(this.pos));
    this.seq = setInterval(() => { if (PREFS().sound) Sound.note(scale[Math.floor(rnd()*scale.length)] * (this.cur % 2 ? 1 : 0.5), .22); }, 280);
    this.timer = setInterval(() => {
      this.pos++;
      if (this.pos >= this.TRACKS[this.cur][1]){ this.cur = (this.cur + 1) % this.TRACKS.length; this.pos = 0; }
      paint();
    }, 1000);
    paint();
  },
  pause(paint){
    this.playing = false;
    clearInterval(this.timer); clearInterval(this.seq);
    this.timer = this.seq = null;
    paint();
  },
  onQuit(){ this.pause(() => {}); },
  menus(){ return [ stdFileMenu(this), editMenuDef(), {title:'Options', items:[
    {label:'Shuffle', cmd: () => { this.cur = Math.floor(Math.random()*this.TRACKS.length); this.pos = 0; }},
    {label:'Repeat', checked:true, cmd: () => {}},
  ]} ]; },
});

/* ---------------- Script Editor ---------------- */
Apps.register({
  id:'scripted', name:'Script Editor', icon:'scriptedit',
  launch(){
    const ta = el('textarea', {spellcheck:'false'});
    ta.value = 'tell application "Finder"\n\tempty trash\nend tell';
    const log = el('div', {class:'selog'}, 'AppleScript-ish ready.\n');
    const say = t => { log.textContent += t + '\n'; log.scrollTop = 1e6; };
    const run = () => {
      const src = ta.value.toLowerCase();
      say('› running…');
      setTimeout(() => {
        if (src.includes('empty trash')){
          if (VFS.trashNode.children.length){ VFS.emptyTrash(); Sound.crunch(); Finder.refreshAll(); say('-- result: trash emptied'); }
          else say('-- result: the Trash was already empty (error -43: items not found)');
        } else if (src.includes('beep')){
          const m = /beep\s+(\d+)/.exec(src);
          const times = m ? clamp(+m[1], 1, 5) : 1;
          for (let i = 0; i < times; i++) setTimeout(() => Sound.beep(), i * 350);
          say(`-- result: beeped ${times} time${times === 1 ? '' : 's'}`);
        } else if (src.includes('open') && src.includes('calculator')){
          Apps.launch('calculator'); say('-- result: Calculator opened');
        } else if (src.includes('desktop pattern') || src.includes('set pattern')){
          const names = Object.keys(Finder.patterns);
          const p = names[Math.floor(Math.random()*names.length)];
          Finder.applyPattern(p); say(`-- result: desktop pattern set to “${p}”`);
        } else if (src.includes('restart')){
          say('-- result: restarting'); setTimeout(() => System.restart(), 600);
        } else if (src.includes('new folder')){
          Finder.newFolderIn('desk'); say('-- result: made new folder on desktop');
        } else {
          say('-- error: this simulated dialect only knows a few tricks (error -1708).\n   Try: empty trash · beep 3 · open calculator · set desktop pattern · new folder');
        }
      }, 400);
    };
    const runBtn = el('button', {class:'btn'}, 'Run');
    runBtn.addEventListener('click', run);
    const check = el('button', {class:'btn'}, 'Check Syntax');
    check.addEventListener('click', () => {
      ta.value = ta.value.split('\n').map(l => l.trim()).map((l, i, a) => {
        let depth = 0;
        for (let j = 0; j < i; j++){ if (/^tell |^repeat|^if /.test(a[j].trim())) depth++; if (/^end/.test(a[j].trim())) depth--; }
        if (/^end/.test(l)) depth--;
        return '\t'.repeat(Math.max(0, depth)) + l;
      }).join('\n');
      say('-- syntax: looks plausible (the compiler is an optimist)');
    });
    const canned = el('select', {class:'pmenu'});
    ['empty trash','beep 3','open calculator','set desktop pattern','new folder','restart'].forEach(s => canned.append(el('option', {}, s)));
    canned.addEventListener('change', () => {
      const s = canned.value;
      ta.value = s === 'beep 3' ? 'beep 3' :
        s === 'restart' ? 'tell application "Finder"\n\trestart\nend tell' :
        `tell application "Finder"\n\t${s}\nend tell`;
    });
    singleWindow(this, {title:'untitled script', w: 440, h: 360, x: 150, y: 80,
      content: el('div', {class:'scripted'},
        el('div', {class:'setools'}, runBtn, check, el('span', {style:'flex:1'}), el('span', {style:'font-size:10px;'}, 'Canned scripts:'), canned),
        ta, log)});
    ta.addEventListener('keydown', e => e.stopPropagation());
  },
  menus(){ return [ stdFileMenu(this), editMenuDef(), {title:'Controls', items:[
    {label:'Run', key:'R', cmd: () => { const w = WM.windowsOf(this.id)[0]; if (w) w.el.querySelector('.btn').click(); }},
  ]} ]; },
  about(){ Dialogs.alert({icon:'note', sound:false, text:'Script Editor\n\ntell application "Museum"\n\tdisplay dialog "Everything is scriptable, in spirit."\nend tell'}); },
});

/* ---------------- Control Strip ---------------- */
const ControlStrip = {
  strip: null,
  render(){
    if (this.strip) this.strip.remove();
    if (!PREFS().stripShown){ this.strip = null; return; }
    const d = WM.deskRect();
    const y = PREFS().stripY != null ? clamp(PREFS().stripY, 40, d.h - 40) : d.h - 46;
    const strip = el('div', {id:'cstrip', style:`bottom:auto;top:${y}px;`});
    this.strip = strip;
    const body = el('div', {class:'csbody' + (PREFS().stripCollapsed ? ' hidden' : '')});
    const mods = [
      ['cpSound', 'Sound volume', e => this.volumePop(e)],
      ['cpMonitors', 'Monitor color depth', e => this.pop(e, [['256 colors','256'],['Thousands','thousands'],['Millions','millions'],['Grays','grays']], PREFS().depth, v => System.setDepth(v))],
      ['cpMonitors', 'Monitor resolution', e => this.pop(e, [['640 x 480','640 x 480'],['800 x 600','800 x 600'],['1024 x 768','1024 x 768']], PREFS().resolution, v => System.setResolution(v))],
      ['netbrowser', 'AppleTalk on/off', e => this.pop(e, [['AppleTalk Active','on'],['AppleTalk Inactive','off']], PREFS().appleTalk ? 'on' : 'off', v => { PREFS().appleTalk = v === 'on'; State.save(); })],
      ['cpSharing', 'File sharing on/off', e => this.pop(e, [['File Sharing On','on'],['File Sharing Off','off']], PREFS().fileSharing ? 'on' : 'off', v => { PREFS().fileSharing = v === 'on'; State.save(); })],
      ['cpEnergy', 'Energy settings', e => this.pop(e, [['Sleep Now','sleep'],['Energy Saver…','open']], null, v => v === 'sleep' ? System.sleep() : ControlPanels.open('Energy Saver'))],
    ];
    mods.forEach(([ic, tip, fn]) => {
      const m = el('div', {class:'csmod', html: icon(ic), dataset:{balloon: `Control Strip module: ${tip}.`}});
      m.addEventListener('mousedown', e => { e.stopPropagation(); fn(e); });
      body.append(m);
    });
    const tab = el('div', {class:'cstab', dataset:{balloon:'Click to collapse or expand the Control Strip. Drag up or down to move it.'}}, PREFS().stripCollapsed ? '▶' : '◀');
    tab.addEventListener('mousedown', e => {
      e.preventDefault();
      const y0 = e.clientY, t0 = parseInt(strip.style.top);
      let moved = false;
      const mm = ev => {
        if (Math.abs(ev.clientY - y0) > 4) moved = true;
        if (moved){
          const ny = clamp(t0 + ev.clientY - y0, 24, WM.deskRect().h - 30);
          strip.style.top = ny + 'px';
        }
      };
      const mu = () => {
        window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu);
        if (moved){ PREFS().stripY = parseInt(strip.style.top); State.save(); }
        else {
          PREFS().stripCollapsed = !PREFS().stripCollapsed; State.save();
          Sound.fwip(PREFS().stripCollapsed);
          this.render();
        }
      };
      window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
    });
    strip.append(body, tab);
    $('#striplayer').append(strip);
  },
  pop(e, items, current, cb){
    $$('.cspop').forEach(p => p.remove());
    const p = el('div', {class:'cspop'});
    items.forEach(([lab, val]) => {
      const mi = el('div', {class:'mi' + (val === current ? ' sel' : '')}, (val === current ? '✓ ' : '   ') + lab);
      mi.addEventListener('mousedown', ev => { ev.stopPropagation(); p.remove(); cb(val); });
      p.append(mi);
    });
    document.body.append(p);
    const r = e.target.closest('.csmod').getBoundingClientRect();
    p.style.left = r.left + 'px';
    p.style.top = Math.max(24, r.top - p.offsetHeight - 4) + 'px';
    const closer = () => { p.remove(); document.removeEventListener('mousedown', closer); };
    setTimeout(() => document.addEventListener('mousedown', closer), 10);
  },
  volumePop(e){
    $$('.cspop').forEach(p => p.remove());
    const s = el('input', {class:'slider', type:'range', min:'0', max:'100', value: String(PREFS().volume * 100), style:'width:24px;height:90px;writing-mode:vertical-lr;direction:rtl;'});
    s.addEventListener('change', () => { PREFS().volume = s.value / 100; State.save(); Sound.beep(); });
    const p = el('div', {class:'cspop'}, s);
    document.body.append(p);
    const r = e.target.closest('.csmod').getBoundingClientRect();
    p.style.left = r.left + 'px';
    p.style.top = (r.top - p.offsetHeight - 4) + 'px';
    const closer = ev => { if (!p.contains(ev.target)){ p.remove(); document.removeEventListener('mousedown', closer); } };
    setTimeout(() => document.addEventListener('mousedown', closer), 10);
  },
};

    const existing = WM.wins.find(w => w.isHelp);
    if (existing){ WM.activate(existing); return; }
    const win = WM.create({title:'Mac OS Help', appId:'finder', w: 560, h: 380, x: 100, y: 60, titleIcon:'helpviewer',
      content: el('div', {style:'display:flex;flex-direction:column;height:100%;'},
        el('div', {style:'display:flex;gap:8px;padding:6px 8px;background:var(--face);border-bottom:1px solid #999;align-items:center;'},
          el('span', {html: icon('helpviewer'), style:'width:18px;height:18px;'}), searchF),
        el('div', {class:'helpwin', style:'flex:1;'}, toc, bodyE))});
    win.isHelp = true;
    show(topic || 'welcome');
  },
};

/* ---------------- System: boot, shutdown, sleep, crash ---------------- */
const System = {
  booted: false,

  boot(fast){
    const boot = el('div', {id:'boot'});
    document.body.append(boot);
    let skipped = false, extsOff = false, finished = false;
    const keyer = e => {
      if (e.key === 'Escape'){ skipped = true; finish(); }
      if (e.key === 'Shift') extsOff = true;
    };
    document.addEventListener('keydown', keyer);
    const finish = () => {
      if (finished) return;
      finished = true;
      document.removeEventListener('keydown', keyer);
      boot.remove();
      $$('#parade, #extoff').forEach(x => x.remove());
      this.booted = true;
      Finder.refreshAll();
      Menus.rebuild();
      ControlStrip.render();
      if (Apps.registry.stickies && State.data.stickies && State.data.stickies.length) Apps.launch('stickies');
      Apps.activate('finder');
    };
    // stage 1: grey screen with the happy computer (original art)
    setTimeout(() => {
      if (skipped) return finish();
      boot.innerHTML = `<div id="bootmac" style="width:120px">${icon('happyMac')}</div>`;
      Sound.chime();
    }, fast ? 100 : 600);
    // stage 2: Welcome splash + progress + parade
    setTimeout(() => {
      if (skipped) return finish();
      boot.innerHTML = '';
      const fill = el('div', {class:'fill', style:'width:0%'});
      const stage = el('div', {class:'stage'}, 'Starting up…');
      boot.append(el('div', {id:'splash'},
        el('div', {style:'width:64px;margin:0 auto;', html: icon('osFace')}),
        el('h1', {}, 'Welcome to Mac OS'),
        el('div', {class:'ver'}, 'Mac OS 9.2.2'),
        el('div', {class:'pbar'}, fill),
        stage));
      if (extsOff){
        document.body.append(el('div', {id:'extoff'}, 'Extensions Off'));
      }
      const parade = el('div', {id:'parade'});
      document.body.append(parade);
      const extFolder = VFS.search('Extensions').find(n => n.kind === 'folder' && VFS.parentOf(n) && VFS.parentOf(n).name === 'System Folder');
      const marchers = extsOff ? [] : (extFolder ? extFolder.children.filter(x => !PREFS().extsOff[x.id]) : []).slice(0, 18);
      const stages = ['Starting up…','Loading system software…','Loading extensions…','Initializing AppleTalk-flavored networking…','Warming pinstripes…','Almost there…'];
      const total = Math.max(marchers.length, 8) + 4;
      let i = 0;
      const step = () => {
        if (skipped) return finish();
        i++;
        fill.style.width = Math.min(100, Math.round(i/total*100)) + '%';
        stage.textContent = stages[Math.min(stages.length - 1, Math.floor(i/total*stages.length))];
        if (i > 2 && marchers[i - 3]){
          const m = marchers[i - 3];
          parade.append(el('div', {class:'pic', html: icon(m.icon || 'extBlue'), title: m.name}));
          if (PREFS().sound) Sound.click();
        }
        if (i < total) setTimeout(step, fast ? 60 : 300 + Math.random()*260);
        else setTimeout(finish, fast ? 100 : 700);
      };
      setTimeout(step, fast ? 60 : 500);
    }, fast ? 200 : 2400);
  },

  shutDown(){
    Dialogs.alert({
      icon:'caution',
      text:'Are you sure you want to shut down your computer now?',
      buttons:[{label:'Cancel', cancel:true}, {label:'Shut Down', default:true}],
    }).then(r => {
      if (r !== 'Shut Down') return;
      Apps.quitAll();
      const s = el('div', {id:'shutscreen'},
        el('div', {class:'msg'}, 'It is now safe to shut down\nyour computer.'),
        el('div', {class:'hint'}, ''));
      document.body.append(s);
      setTimeout(() => { s.querySelector('.hint').textContent = '(click anywhere to press the power key)'; }, 5000);
      s.addEventListener('click', () => { s.remove(); this.boot(false); }, {once:true});
    });
  },
  restart(){
    Apps.quitAll();
    Menus.closeAll();
    this.boot(false);
  },
  sleep(){
    const v = el('div', {id:'sleepveil'});
    document.body.append(v);
    const wake = () => { v.remove(); document.removeEventListener('keydown', wake, true); };
    v.addEventListener('mousedown', wake, {once:true});
    document.addEventListener('keydown', wake, true);
  },
  bomb(){
    const row = el('div', {class:'dlgbtns'});
    const content = el('div', {class:'dlgpad'},
      el('div', {class:'alertrow'},
        el('div', {class:'aicon', html: icon('bomb')}),
        el('div', {class:'atext'}, 'Sorry, a system error occurred.\n\n“Finder” has unexpectedly quit, because an error of Type 11 occurred. (In this simulation, Type 11 means “you found the easter egg.”)')),
      row);
    const ctx = Dialogs.showModal(content, {w: 420});
    const restart = el('button', {class:'btn'}, 'Restart');
    restart.addEventListener('click', () => { ctx.finish(); this.restart(); });
    row.append(el('span', {class:'defwrap'}, restart));
    Sound.boing();
  },
  setDepth(id){
    PREFS().depth = id; State.save();
    const s = $('#screen');
    s.style.filter = {grays:'grayscale(1)', '256':'saturate(1.4) contrast(1.15)', thousands:'saturate(1.05)', millions:''}[id] || '';
    s.style.imageRendering = id === '256' ? 'pixelated' : '';
  },
  setResolution(r){
    PREFS().resolution = r; State.save();
    // the authentic screen blink, without actually changing your monitor
    const veil = el('div', {style:'position:fixed;inset:0;background:#000;z-index:22000;'});
    document.body.append(veil);
    setTimeout(() => veil.remove(), 450);
  },
};

/* ---------------- global keyboard & mouse wiring ---------------- */
function initGlobalInput(){
  window._optDown = false;
  document.addEventListener('keydown', e => {
    if (e.key === 'Alt') window._optDown = true;
    // don't fight text fields for plain typing
    const inField = /INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;

    // ⌘⌥Esc — force quit
    if (e.key === 'Escape' && (e.metaKey || e.ctrlKey) && e.altKey){
      e.preventDefault(); Apps.forceQuitDialog(); return;
    }
    // ⌘⇧3 — screenshot
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === '3' || e.key === '#')){
      e.preventDefault(); Finder.screenshot(); return;
    }
    // ⌘⌥⌃B — the bomb (shhh)
    if ((e.metaKey || e.ctrlKey) && e.altKey && (e.key.toLowerCase() === 'b' || e.code === 'KeyB')){
      e.preventDefault(); System.bomb(); return;
    }
    // ⌘. — cancel (progress dialogs listen via their Stop buttons)
    if ((e.metaKey || e.ctrlKey) && e.key === '.'){
      const stop = document.querySelector('.btn[data-cancel]');
      if (stop){ e.preventDefault(); stop.click(); }
      return;
    }
    if (WM.modal) return;      // modal dialogs own the keyboard (Dialogs installs its own handler)
    // calculator keypad passthrough
    if (Apps.current && Apps.current.handleKey && !inField && !e.metaKey && !e.ctrlKey){
      if (Apps.current.handleKey(e)){ e.preventDefault(); return; }
    }
    // menu shortcuts
    if ((e.metaKey || e.ctrlKey) && !e.altKey){
      if (['x','c','v','a','z'].includes(e.key.toLowerCase()) && inField) return;  // let the browser handle text editing
      if (Menus.handleKey(e)) return;
    }
    // Finder: Return begins rename; Delete moves to trash
    if (Apps.current === Finder && !inField){
      if (e.key === 'Enter' && Finder.selection.length === 1){
        const n = VFS.byId(Finder.selection[0]);
        const ic = document.querySelector(`.dicon[data-nid="${n.id}"]`);
        if (n && ic && !n.locked) Finder.beginRename(n, ic);
      }
      if (e.key === 'Backspace' && (e.metaKey || e.ctrlKey) && Finder.selection.length){
        Finder.moveSelToTrash();
      }
    }
  });
  document.addEventListener('keyup', e => { if (e.key === 'Alt') window._optDown = false; });
  document.addEventListener('contextmenu', e => e.preventDefault());
  // one first user gesture unlocks the audio context
  document.addEventListener('mousedown', () => Sound.ensure(), {once:true, capture:true});
}

/* ---------------- bootstrap ---------------- */
window.addEventListener('load', () => {
  State.load();
  VFS.init();
  Menus.init();
  Balloons.init();
  Finder.init();
  initGlobalInput();
  Menus.rebuild();
  Popups.render();
  window.addEventListener('resize', () => { Finder.renderDesktop(); ControlStrip.render(); Popups.render(); });
  System.boot(false);
});
</script>
