<!--
  ============================================================================
  THE OS MUSEUM — SymbOS 4.0 exhibit
  ----------------------------------------------------------------------------
  SymbOS is a real, actively developed operating system for Z80-based 8-bit
  computers (Amstrad CPC, MSX, Enterprise, PCW, ZX Spectrum Next and more),
  created by Prodatron (Joern Mika) with a community of contributors.
  It is free software, available at https://www.symbos.de

  THIS FILE IS NOT SYMBOS. It is an unofficial, fan-made, front-end-only
  simulation built for the museum: no real OS code, no networking, no file
  system — every pixel here is original artwork drawn in code, in the spirit
  of the real system. Go see the real one. It is better.
  ============================================================================

"use strict";
/* ===========================================================================
   MODULE 0 — UTILITIES
   =========================================================================== */
const U = {
  clamp(v, a, b) { return v < a ? a : (v > b ? b : v); },
  pad2(n) { return (n < 10 ? "0" : "") + n; },
  rnd(n) { return Math.floor(Math.random() * n); },
  pick(a) { return a[U.rnd(a.length)]; },
  lerp(a, b, t) { return a + (b - a) * t; },
  fmtK(k) { return k + "K"; },
  deb(fn, ms) {
    let t = null;
    return function() {
      if (t) clearTimeout(t);
      t = setTimeout(fn, ms);
    };
  },
  now() { return performance.now(); },
  // 8.3-ish name validation/normalisation
  fname(s) {
    s = (s || "").toUpperCase().replace(/[^A-Z0-9_.\-]/g, "");
    let parts = s.split(".");
    let base = (parts[0] || "").slice(0, 8);
    let ext = (parts[1] || "").slice(0, 3);
    return ext ? base + "." + ext : base;
  }
};

   =========================================================================== */

      scheme: {},             // per-platform colour scheme index
      wallpaper: {},          // per-platform wallpaper id
      widgets: { clock: true, cpu: true },
      sound: { master: true, ui: true, key: false, vol: 0.7,
               map: { open: "blip_up", close: "blip_dn", error: "buzz",
                      min: "slide_dn", max: "slide_up", info: "ding" } },
      fsUser: null,           // serialized user changes to the VFS
      scores: {},             // game high scores
      nick: null,             // IRC nickname
      layout: null,           // last open-app layout
      deskIcons: null,        // desktop icon positions
      widgetPos: null,
      oomSeen: false,
      boots: 0
    };
  },
  load() {
    let d = this.defaults();
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const s = JSON.parse(raw);
        for (const k in d) if (s[k] !== undefined) d[k] = s[k];
      }
    } catch (e) { /* first visit / private mode: run stateless */ }
    this.d = d;
  },
  saveNow() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.d)); }
    catch (e) { /* storage full or blocked — the museum keeps running */ }
  },
  reset() {
    try { localStorage.removeItem(this.KEY); } catch (e) {}
    location.reload();
  }
};
ST.save = U.deb(() => ST.saveNow(), 400);

const FW = 6, FH = 8;  // cell advance / line height

/* ===========================================================================
   MODULE 3 — GFX ENGINE
   A fixed logical framebuffer scaled up with nearest-neighbour pixels.
   Colour discipline: every fill uses a palette index, or a dither of two
   palette indexes. Nothing else ever touches the canvas.
   An "ink" is: number (solid index) | [a,b] (50% dither) | [a,b,25|75].
   =========================================================================== */
const G = {
  cv: null, ctx: null,
  W: 320, H: 200, parX: 2, parY: 2,
  pal: ["#000000", "#FFFFFF"],
  epoch: 0,                       // bumped when palette changes (kills caches)
  _glyphs: new Map(), _pats: new Map(), _icons: new Map(),
  dark: 0, light: 1,              // darkest / lightest palette entries
  scaleX: 1, scaleY: 1, offX: 0, offY: 0,

  init(canvas) {
    this.cv = canvas;
    this.ctx = canvas.getContext("2d", { alpha: false });
    window.addEventListener("resize", () => this.fit());
  },

  setMode(w, h, par, pal) {
    this.W = w; this.H = h;
    this.parX = par[0]; this.parY = par[1];
    this.pal = pal.slice();
    this.epoch++;
    this._glyphs.clear(); this._pats.clear(); this._icons.clear();
    // luminance extremes for cursor art
    let lum = c => {
      const n = parseInt(c.slice(1), 16);
      return 0.3 * (n >> 16 & 255) + 0.6 * (n >> 8 & 255) + 0.1 * (n & 255);
    };
    this.dark = 0; this.light = 0;
    pal.forEach((c, i) => {
      if (lum(c) < lum(pal[this.dark])) this.dark = i;
      if (lum(c) > lum(pal[this.light])) this.light = i;
    });
    this.cv.width = w; this.cv.height = h;
    this.ctx.imageSmoothingEnabled = false;
    this.fit();
  },

  fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const bw = this.W * this.parX, bh = this.H * this.parY;
    let k = Math.min(vw / bw, vh / bh);
    if (k > 1) k = Math.floor(k);          // integer upscale when possible
    this.scaleX = k * this.parX; this.scaleY = k * this.parY;
    this.cv.style.width = Math.round(this.W * this.scaleX) + "px";
    this.cv.style.height = Math.round(this.H * this.scaleY) + "px";
    const r = this.cv.getBoundingClientRect();
    this.offX = r.left; this.offY = r.top;
  },

  toLogical(cx, cy) {
    const r = this.cv.getBoundingClientRect();
    return [
      U.clamp(Math.floor((cx - r.left) / (r.width / this.W)), 0, this.W - 1),
      U.clamp(Math.floor((cy - r.top) / (r.height / this.H)), 0, this.H - 1)
    ];
  },

  /* ---- primitive fills ------------------------------------------------ */
  _pattern(a, b, pct) {
    const key = a + "|" + b + "|" + pct + "|" + this.epoch;
    let p = this._pats.get(key);
    if (p) return p;
    const c = document.createElement("canvas");
    c.width = 2; c.height = 2;
    const x = c.getContext("2d");
    // 2x2 ordered dither cells: 25% = one pixel of b, 50% = checker, 75% = three
    const cells = pct === 25 ? [a, a, a, b] : pct === 75 ? [b, b, b, a] : [a, b, b, a];
    x.fillStyle = this.pal[cells[0]]; x.fillRect(0, 0, 1, 1);
    x.fillStyle = this.pal[cells[1]]; x.fillRect(1, 0, 1, 1);
    x.fillStyle = this.pal[cells[2]]; x.fillRect(0, 1, 1, 1);
    x.fillStyle = this.pal[cells[3]]; x.fillRect(1, 1, 1, 1);
    p = this.ctx.createPattern(c, "repeat");
    this._pats.set(key, p);
    return p;
  },

  inkAt(ink, x, y) {   // resolve an ink to a palette index at a pixel
    if (typeof ink === "number") return ink;
    const pct = ink[2] || 50;
    const on = pct === 25 ? ((x & 1) === 1 && (y & 1) === 1)
             : pct === 75 ? !((x & 1) === 1 && (y & 1) === 1)
             : ((x + y) & 1) === 1;
    return on ? ink[1] : ink[0];
  },

  fill(x, y, w, h, ink) {
    if (w <= 0 || h <= 0) return;
    const c = this.ctx;
    if (typeof ink === "number") c.fillStyle = this.pal[ink];
    else c.fillStyle = this._pattern(ink[0], ink[1], ink[2] || 50);
    c.fillRect(x, y, w, h);
  },

  px(x, y, idx) { this.ctx.fillStyle = this.pal[idx]; this.ctx.fillRect(x, y, 1, 1); },
  hline(x, y, w, ink) { this.fill(x, y, w, 1, ink); },
  vline(x, y, h, ink) { this.fill(x, y, 1, h, ink); },

  frame(x, y, w, h, ink) {
    this.hline(x, y, w, ink); this.hline(x, y + h - 1, w, ink);
    this.vline(x, y + 1, h - 2, ink); this.vline(x + w - 1, y + 1, h - 2, ink);
  },

  line(x0, y0, x1, y1, idx) {
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    this.ctx.fillStyle = this.pal[idx];
    for (;;) {
      this.ctx.fillRect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  },

  bevel(x, y, w, h, hi, sh) {  // raised edge: hi top/left, sh bottom/right
    this.hline(x, y, w - 1, hi); this.vline(x, y, h - 1, hi);
    this.hline(x, y + h - 1, w, sh); this.vline(x + w - 1, y, h, sh);
  },

  sunken(x, y, w, h, hi, sh) { this.bevel(x, y, w, h, sh, hi); },

  clip(x, y, w, h) {
    this.ctx.save();
    this.ctx.beginPath();
    this.ctx.rect(x, y, w, h);
    this.ctx.clip();
  },
  unclip() { this.ctx.restore(); },

  /* ---- text ------------------------------------------------------------ */
  _glyph(ch, idx) {
    const key = ch + "|" + idx + "|" + this.epoch;
    let g = this._glyphs.get(key);
    if (g) return g;
    const rows = FONT5[ch] || FONT5["?"];
    const c = document.createElement("canvas");
    c.width = 5; c.height = 7;
    const x = c.getContext("2d");
    x.fillStyle = this.pal[idx];
    for (let r = 0; r < 7; r++)
      for (let b = 0; b < 5; b++)
        if (rows[r] & (16 >> b)) x.fillRect(b, r, 1, 1);
    this._glyphs.set(key, c);
    return c;
  },

  text(x, y, str, idx) {
    str = String(str);
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (ch !== " ") this.ctx.drawImage(this._glyph(ch, idx), x, y);
      x += FW;
    }
    return x;
  },

  textC(cx, y, str, idx) { this.text(cx - Math.floor(String(str).length * FW / 2), y, str, idx); },
  measure(str) { return String(str).length * FW; },

  /* big text = 2x scaled glyphs */
  textBig(x, y, str, idx) {
    str = String(str);
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (ch !== " ") this.ctx.drawImage(this._glyph(ch, idx), x, y, 10, 14);
      x += 12;
    }
  },

  /* ---- icons ------------------------------------------------------------
     Role chars: K outline/black  W white  G face-grey  D dark-shade
                 B blue accent    R red accent  Y yellow accent  C cyan accent
     Every role maps to an ink from the current scheme, so icons obey the
     platform's palette automatically. '.' is transparent. */
  icon(name, x, y, mini) {
    const art = ICONS[name] || ICONS.file;
    const key = name + "|" + (mini ? "m" : "f") + "|" + this.epoch + "|" + Sys.schemeIx;
    let c = this._icons.get(key);
    if (!c) {
      const map = ROLE_ICON();
      const H14 = art.length, W14 = art[0].length;
      const sz = mini ? 8 : W14;
      c = document.createElement("canvas");
      c.width = sz; c.height = mini ? 8 : H14;
      const g = c.getContext("2d");
      for (let py = 0; py < c.height; py++) {
        for (let pxx = 0; pxx < c.width; pxx++) {
          const sx = mini ? Math.floor(pxx * W14 / 8) : pxx;
          const sy = mini ? Math.floor(py * H14 / 8) : py;
          const ch = art[sy][sx];
          if (ch === ".") continue;
          const ink = map[ch] !== undefined ? map[ch] : map.K;
          g.fillStyle = this.pal[this.inkAt(ink, pxx, py)];
          g.fillRect(pxx, py, 1, 1);
        }
      }
      this._icons.set(key, c);
    }
    this.ctx.drawImage(c, x, y);
  }
};

function drawCursor(name, x, y) {
  const c = CURSORS[name] || CURSORS.arrow;
  for (let r = 0; r < c.art.length; r++) {
    const row = c.art[r];
    for (let i = 0; i < row.length; i++) {
      if (row[i] === "K") G.px(x - c.hx + i, y - c.hy + r, G.dark);
      else if (row[i] === "W") G.px(x - c.hx + i, y - c.hy + r, G.light);
    }
  }
}

/* ===========================================================================
   MODULE 5 — PSG SYNTH & SOUND DAEMON
   An AY/PSG-flavoured synthesizer: three square-wave tone channels plus a
   noise channel, with sharp gain envelopes. All Web Audio, all in code.
   =========================================================================== */
const SND = {
  ctx: null, master: null, ready: false,
  noiseBuf: null,
  vuNotes: [null, null, null, null],   // per-channel latest envelope for VU

  ensure() {
    if (this.ready) { if (this.ctx.state === "suspended") this.ctx.resume(); return true; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = ST.d.sound.master ? ST.d.sound.vol * 0.5 : 0;
      this.master.connect(this.ctx.destination);
      // 1s of looped white noise for the noise channel
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      // AY-ish noise: 1-bit LFSR flavour rather than smooth white noise
      let lfsr = 0x1ffff;
      for (let i = 0; i < len; i++) {
        const bit = ((lfsr ^ (lfsr >> 3)) & 1);
        lfsr = (lfsr >> 1) | (bit << 16);
        d[i] = bit ? 0.7 : -0.7;
      }
      this.ready = true;
      return true;
    } catch (e) { return false; }
  },

  applyVolume() {
    if (!this.ready) return;
    this.master.gain.value = ST.d.sound.master ? ST.d.sound.vol * 0.5 : 0;
  },

  /* one square note on a PSG channel, with a fast linear decay envelope */
  tone(ch, freq, vol, dur, opts) {
    if (!this.ready || !ST.d.sound.master) return;
    opts = opts || {};
    const t0 = opts.at !== undefined ? opts.at : this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = "square";
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.slide) osc.frequency.linearRampToValueAtTime(opts.slide, t0 + dur);
    if (opts.vib) {
      const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
      lfo.frequency.value = 6; lg.gain.value = freq * 0.012;
      lfo.connect(lg); lg.connect(osc.frequency);
      lfo.start(t0); lfo.stop(t0 + dur);
    }
    const g = this.ctx.createGain();
    const sus = opts.sustain !== undefined ? opts.sustain : 0.25;
    g.gain.setValueAtTime(vol, t0);
    g.gain.linearRampToValueAtTime(vol * sus, t0 + dur * 0.7);
    g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
    if (ch >= 0) this.vuNotes[ch] = { t: t0, dur, vol };
  },

  noise(vol, dur, rate, opts) {
    if (!this.ready || !ST.d.sound.master) return;
    opts = opts || {};
    const t0 = opts.at !== undefined ? opts.at : this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;
    src.playbackRate.value = rate || 1;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.02);
    if (opts.vuCh !== undefined) this.vuNotes[opts.vuCh] = { t: t0, dur, vol };
  },

  vu(ch) {   // 0..1 approximate current channel level, for the VU bars
    const n = this.vuNotes[ch];
    if (!n || !this.ready) return 0;
    const dt = this.ctx.currentTime - n.t;
    if (dt < 0 || dt > n.dur) return 0;
    return U.clamp(n.vol * (1 - dt / n.dur) * 3, 0, 1);
  },

  /* floppy drive chatter: stepper thunks + head noise */
  floppy(ms) {
    if (!this.ensure() || !ST.d.sound.master) return;
    const t = this.ctx.currentTime;
    const steps = Math.floor(ms / 90);
    for (let i = 0; i < steps; i++) {
      const at = t + i * 0.09 + Math.random() * 0.02;
      this.noise(0.05, 0.05, 4 + Math.random() * 3, { at });
      if (i % 2 === 0) this.tone(-1, 55 + Math.random() * 25, 0.05, 0.03, { at, sustain: 0.9 });
    }
  },

  key() {
    if (!ST.d.sound.key || !this.ready) return;
    this.noise(0.03, 0.015, 8);
  }
};

/* ---- note helpers --------------------------------------------------------- */
const NOTE_IX = { c: 0, "c#": 1, d: 2, "d#": 3, e: 4, f: 5, "f#": 6, g: 7,
                  "g#": 8, a: 9, "a#": 10, b: 11 };
function noteFreq(tok) {   // "c2", "f#3" → Hz
  const m = /^([a-g]#?)(\d)$/.exec(tok);
  if (!m) return 0;
  const midi = 12 * (parseInt(m[2]) + 1) + NOTE_IX[m[1]];
  return 440 * Math.pow(2, (midi - 69) / 12);
}

class Tracker {
  constructor() {
    this.tune = null; this.playing = false;
    this.ord = 0; this.row = 0;
    this.nextRowAt = 0; this.timer = null;
  }
  load(tune) { this.stop(); this.tune = tune; this.ord = 0; this.row = 0; }
  play() {
    if (!this.tune || this.playing) return;
    if (!SND.ensure()) return;
    this.playing = true;
    this.nextRowAt = SND.ctx.currentTime + 0.06;
    this.timer = setInterval(() => this._pump(), 25);
  }
  pause() { this.playing = false; if (this.timer) { clearInterval(this.timer); this.timer = null; } }
  stop() { this.pause(); this.ord = 0; this.row = 0; }
  _tok(patCh, row) {
    const toks = this.tune.patterns[this.tune.order[this.ord]][patCh].trim().split(/\s+/);
    return toks[row] || ".";
  }
  _pump() {
    if (!this.playing) return;
    const lookahead = SND.ctx.currentTime + 0.12;
    while (this.nextRowAt < lookahead) {
      const at = this.nextRowAt, rowDur = 1 / this.tune.rps;
      // tone channels: a=bass b=lead c=arp
      const instr = [
        { vol: 0.16, dur: rowDur * 2.2, sus: 0.5 },
        { vol: 0.12, dur: rowDur * 2.6, sus: 0.45, vib: true },
        { vol: 0.08, dur: rowDur * 1.1, sus: 0.3 }
      ];
      ["a", "b", "c"].forEach((chn, ci) => {
        const tok = this._tok(chn, this.row);
        if (tok !== "." && tok !== "-") {
          const f = noteFreq(tok);
          if (f) SND.tone(ci, f, instr[ci].vol, instr[ci].dur,
                          { at, sustain: instr[ci].sus, vib: instr[ci].vib });
        }
      });
      const d = this._tok("d", this.row);
      if (d === "B") { SND.tone(-1, 90, 0.20, 0.09, { at, slide: 40, sustain: 0.8 });
                       SND.noise(0.10, 0.05, 2, { at, vuCh: 3 }); }
      else if (d === "S") SND.noise(0.14, 0.11, 5, { at, vuCh: 3 });
      else if (d === "H") SND.noise(0.07, 0.04, 12, { at, vuCh: 3 });
      // advance
      this.row++;
      if (this.row >= 16) {
        this.row = 0; this.ord++;
        if (this.ord >= this.tune.order.length) this.ord = 0;
      }
      this.nextRowAt += rowDur;
    }
  }
}

   Nothing here is real; everything here is proud of how small it isn't.
   =========================================================================== */
function _d(n, ch) { return { n, d: 1, ch: ch || [], t: "11-01-25" }; }
function _f(n, sz, attr, c) {   // sz in bytes, or pass content string
  const node = { n, d: 0, t: "11-01-25", attr: attr || {} };
  if (typeof sz === "string") { node.c = sz; node.s = sz.length; }
  else { node.s = sz; if (c !== undefined) node.c = c; }
  return node;
}

    let node = r.node.ch.find(x => x.n === name);
    if (node && node.d) return "A directory has that name";
    if (node && node.attr && node.attr.ro) return "File is read-only";
    if (!node) { node = _f(name, content); r.node.ch.push(node); }
    else { node.c = content; node.s = content.length; }
    node.t = FS.today();
    this.save();
    return null;
  },

  del(path) {
    const r = this.resolve(path);
    if (!r || !r.parent) return "Cannot delete that";
    if (r.node.attr && r.node.attr.sys) return "System file is protected";
    r.parent.ch.splice(r.parent.ch.indexOf(r.node), 1);
    this.save();
    return null;
  },

  ren(path, newName) {
    const r = this.resolve(path);
    newName = U.fname(newName);
    if (!r || !newName) return "Bad name";
    if (r.node.attr && r.node.attr.sys) return "System file is protected";
    const sib = (r.parent ? r.parent.ch : []).find(x => x.n === newName && x !== r.node);
    if (sib) return "Name already exists";
    r.node.n = newName;
    this.save();
    return null;
  },

  copy(srcPath, dstDirPath) {
    const s = this.resolve(srcPath), d = this.resolve(dstDirPath);
    if (!s || !d || !d.node.d) return "Bad path";
    if (s.node.d) return "Use a file, not a directory";
    if (d.node.ch.find(x => x.n === s.node.n))
      return "Target file already exists";
    const k = Math.ceil(this.sizeOf(s.node) / 1024);
    if (this.freeK(d.drive) < k) return "Not enough space on target drive";
    const clone = JSON.parse(JSON.stringify(s.node));
    delete clone.attr; clone.t = FS.today();
    d.node.ch.push(clone);
    this.save();
    return null;
  },

  sizeOf(node) {
    if (!node.d) return node.s || 0;
    return node.ch.reduce((a, c) => a + this.sizeOf(c), 0);
  },

  usedK(drive) {
    const d = this.drives[drive];
    return d ? Math.ceil(this.sizeOf(d.root) / 1024) : 0;
  },
  freeK(drive) {
    const d = this.drives[drive];
    return d ? Math.max(0, d.sizeK - this.usedK(drive)) : 0;
  },

  today() {
    const n = new Date();
    return U.pad2(n.getDate()) + "-" + U.pad2(n.getMonth() + 1) + "-" +
           String(n.getFullYear()).slice(2);
  },

  iconFor(node) {
    if (node.d) return "folder";
    const ext = (node.n.split(".")[1] || "");
    return { TXT: "fileText", INI: "fileText", SMM: "fileMusic", SGX: "filePic",
             EXE: "fileExe", SYS: "fileExe", DRV: "fileExe", FNT: "file" }[ext] || "file";
  },

  fmtSize(bytes) {
    if (bytes < 1024) return bytes + " b";
    return Math.ceil(bytes / 1024) + "K";
  }
};

/* ===========================================================================
   MODULE 7 — TASK & MEMORY MODEL
   The kilobyte accounting behind Task Manager and every About box.
   16K banks, fake PIDs, priorities, and Z80IDLE eating whatever is left.
   =========================================================================== */
const KRN = {
  tasks: [], nextPid: 1,
  totalK: 256, bankK: 16,
  history: [],           // CPU busy% samples for the Task Manager graph
  _accum: 0,
  oomStrikes: 0,
  onOOM: null,           // set by the desktop: shows the polite refusal

  boot(plat) {
    this.totalK = plat.ramK;
    this.tasks = []; this.nextPid = 1; this.history = []; this.oomStrikes = 0;
    this.alloc("SYMBOS", 48, { sys: 1, pri: 1, cpu: 4 });
    this.alloc("DESKTOP", 22, { sys: 1, pri: 3, cpu: 3 });
    this.alloc("SOUNDDMN", 8, { sys: 1, pri: 4, cpu: 1 });
    this.alloc("NETDMN", 10, { sys: 1, pri: 4, cpu: 1 });
    this.alloc("Z80IDLE", 0, { sys: 1, pri: 7, cpu: 0, idle: 1 });
  },

  /* one 16K bank at the top is reserved for the museum easter egg */
  usableK() { return this.totalK - this.bankK; },
  usedK() { return this.tasks.reduce((a, t) => a + t.memK, 0); },
  freeK() { return Math.max(0, this.usableK() - this.usedK()); },

  alloc(name, memK, opts) {
    opts = opts || {};
    if (memK > this.freeK() && !opts.sys) {
      this.oomStrikes++;
      if (this.onOOM) this.onOOM(name, memK, this.oomStrikes);
      return null;
    }
    const t = {
      pid: this.nextPid++, name, memK,
      pri: opts.pri !== undefined ? opts.pri : 5,
      cpu: opts.cpu || 0,          // current cpu weight (percent-ish)
      sys: !!opts.sys, idle: !!opts.idle,
      app: opts.app || null,
      state: "ready"
    };
    this.tasks.push(t);
    return t;
  },

  freeTask(t) {
    const i = this.tasks.indexOf(t);
    if (i >= 0) this.tasks.splice(i, 1);
  },

  byPid(pid) { return this.tasks.find(t => t.pid === pid); },

  setPri(t, pri) { t.pri = U.clamp(pri, 1, 7); },

  busyPct() {
    let b = 0;
    for (const t of this.tasks) if (!t.idle) b += t.cpu;
    return U.clamp(Math.round(b), 2, 97);
  },

  tick(dt) {
    this._accum += dt;
    if (this._accum < 400) return;
    this._accum = 0;
    const busy = this.busyPct() + U.rnd(4);
    this.history.push(U.clamp(busy, 0, 100));
    if (this.history.length > 64) this.history.shift();
    // cosmetic scheduler states
    for (const t of this.tasks) {
      if (t.idle) { t.state = "ready"; t.cpuShow = 100 - this.busyPct(); continue; }
      t.state = t.cpu > 8 ? "running" : (t.cpu > 0 ? "ready" : "waiting");
      t.cpuShow = t.cpu;
    }
  },

  /* bank map: [{label, sys}] one entry per 16K bank */
  banks() {
    const n = Math.floor(this.totalK / this.bankK);
    const map = new Array(n).fill(null);
    let ix = 0;
    for (const t of this.tasks) {
      let need = Math.ceil(t.memK / this.bankK);
      while (need-- > 0 && ix < n - 1) map[ix++] = t;
    }
    const out = map.map(t => t ? { label: t.name, sys: t.sys } : { label: "free", free: true });
    out[n - 1] = { label: "MUSEUM", egg: true };   // the hidden bank
    return out;
  }
};

/* ===========================================================================
   MODULE 8 — UI TOOLKIT
   Retained-mode widgets drawn in chunky pixels. Coordinates are relative to
   the owning window's content area.
   =========================================================================== */
class Ctl {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.visible = true; this.enabled = true;
    this.win = null; this.focusable = false;
  }
  hit(lx, ly) {
    return this.visible && lx >= this.x && ly >= this.y &&
           lx < this.x + this.w && ly < this.y + this.h;
  }
  draw(ox, oy) {}
  mouse(ev) {}     // {type:'down'|'up'|'drag'|'move'|'wheel'|'dbl', x,y,btn,dy}
  key(e) { return false; }
}

/* ---- vertical scrollbar helper ------------------------------------------- */
class VScroll {
  constructor() { this.top = 0; this._drag = null; }
  clampTop(total, vis) { this.top = U.clamp(this.top, 0, Math.max(0, total - vis)); }
  draw(ax, ay, h, total, vis) {
    const W = 8;
    G.fill(ax, ay, W, h, [RC("face"), RC("winBg")]);
    // arrows
    G.fill(ax, ay, W, 8, ROLE("face"));
    G.bevel(ax, ay, W, 8, ROLE("hi"), ROLE("sh"));
    G.text(ax + 1, ay + 1, "▲", RC("text"));
    G.fill(ax, ay + h - 8, W, 8, ROLE("face"));
    G.bevel(ax, ay + h - 8, W, 8, ROLE("hi"), ROLE("sh"));
    G.text(ax + 1, ay + h - 7, "▼", RC("text"));
    if (total > vis) {
      const tr = h - 16;
      const th = Math.max(6, Math.floor(tr * vis / total));
      const ty = ay + 8 + Math.floor((tr - th) * this.top / (total - vis));
      G.fill(ax, ty, W, th, ROLE("face"));
      G.bevel(ax, ty, W, th, ROLE("hi"), ROLE("sh"));
      this._thumb = { ty, th, tr };
    } else this._thumb = null;
  }
  /* returns true if event consumed; mutates this.top */
  mouse(ev, ax, ay, h, total, vis) {
    const inBar = ev.x >= ax && ev.x < ax + 8 && ev.y >= ay && ev.y < ay + h;
    if (ev.type === "down" && inBar) {
      if (ev.y < ay + 8) this.top -= 2;
      else if (ev.y >= ay + h - 8) this.top += 2;
      else if (this._thumb && ev.y >= this._thumb.ty && ev.y < this._thumb.ty + this._thumb.th)
        this._drag = { offY: ev.y - this._thumb.ty };
      else this.top += (this._thumb && ev.y < this._thumb.ty ? -vis : vis);
      this.clampTop(total, vis);
      return true;
    }
    if (ev.type === "drag" && this._drag && this._thumb) {
      const tr = this._thumb.tr, th = this._thumb.th;
      const rel = U.clamp(ev.y - this._drag.offY - (ay + 8), 0, tr - th);
      this.top = Math.round((total - vis) * rel / Math.max(1, tr - th));
      this.clampTop(total, vis);
      return true;
    }
    if (ev.type === "up") this._drag = null;
    if (ev.type === "wheel" && inBar) { this.top += ev.dy > 0 ? 3 : -3; this.clampTop(total, vis); return true; }
    return this._drag !== null;
  }
}

/* ---- basic widgets --------------------------------------------------------- */
class Lbl extends Ctl {
  constructor(x, y, text, role) {
    super(x, y, G.measure(text), 8);
    this.text = text; this.role = role || "text";
  }
  draw(ox, oy) { G.text(ox + this.x, oy + this.y, this.text, RC(this.role)); }
}

class Btn extends Ctl {
  constructor(x, y, w, h, label, cb) {
    super(x, y, w, h || 11);
    this.label = label; this.cb = cb; this.pressed = false; this.focusable = true;
  }
  draw(ox, oy) {
    const x = ox + this.x, y = oy + this.y, p = this.pressed ? 1 : 0;
    G.fill(x, y, this.w, this.h, ROLE("face"));
    if (this.pressed) G.sunken(x, y, this.w, this.h, ROLE("hi"), ROLE("sh"));
    else G.bevel(x, y, this.w, this.h, ROLE("hi"), ROLE("sh"));
    G.frame(x - 0, y - 0, this.w, this.h, this.pressed ? ROLE("sh") : ROLE("face"));
    if (this.pressed) G.frame(x, y, this.w, this.h, ROLE("sh"));
    else G.bevel(x, y, this.w, this.h, ROLE("hi"), ROLE("sh"));
    const c = this.enabled ? RC("text") : RC("dis");
    G.textC(x + Math.floor(this.w / 2) + p, y + Math.floor((this.h - 7) / 2) + p, this.label, c);
  }
  mouse(ev) {
    if (!this.enabled) return;
    if (ev.type === "down") { this.pressed = true; SDN.click(); }
    else if (ev.type === "drag") this.pressed = this.hit(ev.x, ev.y);
    else if (ev.type === "up") {
      const fire = this.pressed && this.hit(ev.x, ev.y);
      this.pressed = false;
      if (fire && this.cb) this.cb();
    }
  }
}

class Chk extends Ctl {
  constructor(x, y, label, val, cb) {
    super(x, y, 10 + G.measure(label), 9);
    this.label = label; this.val = !!val; this.cb = cb;
  }
  draw(ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    G.fill(x, y, 8, 8, ROLE("winBg"));
    G.sunken(x, y, 8, 8, ROLE("hi"), ROLE("sh"));
    if (this.val) G.text(x + 1, y + 1, "✓", RC("text"));
    G.text(x + 11, y + 1, this.label, this.enabled ? RC("text") : RC("dis"));
  }
  mouse(ev) {
    if (ev.type === "up" && this.hit(ev.x, ev.y) && this.enabled) {
      this.val = !this.val; SDN.click();
      if (this.cb) this.cb(this.val);
    }
  }
}

class Rad extends Ctl {
  constructor(x, y, label, group, value) {
    super(x, y, 10 + G.measure(label), 9);
    this.label = label; this.group = group; this.value = value;
  }
  draw(ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    G.fill(x + 1, y + 1, 6, 6, ROLE("winBg"));
    G.frame(x + 1, y + 1, 6, 6, ROLE("sh"));
    G.px(x + 1, y + 1, RC("face")); G.px(x + 6, y + 1, RC("face"));
    G.px(x + 1, y + 6, RC("face")); G.px(x + 6, y + 6, RC("face"));
    if (this.group.val === this.value) G.fill(x + 3, y + 3, 2, 2, RC("text"));
    G.text(x + 11, y + 1, this.label, RC("text"));
  }
  mouse(ev) {
    if (ev.type === "up" && this.hit(ev.x, ev.y)) {
      this.group.val = this.value; SDN.click();
      if (this.group.cb) this.group.cb(this.value);
    }
  }
}

class Edit extends Ctl {
  constructor(x, y, w, text, opts) {
    super(x, y, w, 11);
    opts = opts || {};
    this.text = text || ""; this.cur = this.text.length; this.off = 0;
    this.maxLen = opts.maxLen || 200;
    this.onEnter = opts.onEnter || null; this.onChange = opts.onChange || null;
    this.focusable = true;
  }
  draw(ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    G.fill(x, y, this.w, this.h, ROLE("winBg"));
    G.sunken(x, y, this.w, this.h, ROLE("hi"), ROLE("sh"));
    const maxCh = Math.floor((this.w - 4) / FW);
    if (this.cur < this.off) this.off = this.cur;
    if (this.cur > this.off + maxCh - 1) this.off = this.cur - maxCh + 1;
    const vis = this.text.slice(this.off, this.off + maxCh);
    G.clip(x + 2, y + 2, this.w - 4, 8);
    G.text(x + 2, y + 2, vis, RC("text"));
    G.unclip();
    if (this.win && this.win.focusCtl === this && (Math.floor(Sys.t / 400) & 1) === 0)
      G.vline(x + 2 + (this.cur - this.off) * FW, y + 2, 7, RC("text"));
  }
  mouse(ev) {
    if (ev.type === "down") {
      this.cur = U.clamp(this.off + Math.round((ev.x - this.x - 2) / FW), 0, this.text.length);
    }
  }
  key(e) {
    const k = e.key;
    if (k.length === 1 && !e.ctrlKey && !e.altKey) {
      if (this.text.length < this.maxLen) {
        this.text = this.text.slice(0, this.cur) + k + this.text.slice(this.cur);
        this.cur++; SND.key();
        if (this.onChange) this.onChange(this.text);
      }
      return true;
    }
    if (k === "Backspace") {
      if (this.cur > 0) {
        this.text = this.text.slice(0, this.cur - 1) + this.text.slice(this.cur);
        this.cur--; if (this.onChange) this.onChange(this.text);
      } return true;
    }
    if (k === "Delete") {
      this.text = this.text.slice(0, this.cur) + this.text.slice(this.cur + 1);
      if (this.onChange) this.onChange(this.text);
      return true;
    }
    if (k === "ArrowLeft") { this.cur = Math.max(0, this.cur - 1); return true; }
    if (k === "ArrowRight") { this.cur = Math.min(this.text.length, this.cur + 1); return true; }
    if (k === "Home") { this.cur = 0; return true; }
    if (k === "End") { this.cur = this.text.length; return true; }
    if (k === "Enter") { if (this.onEnter) this.onEnter(this.text); return true; }
    return false;
  }
}

class TxtArea extends Ctl {
  constructor(x, y, w, h, text) {
    super(x, y, w, h);
    this.setText(text || "");
    this.sb = new VScroll();
    this.focusable = true;
    this.onChange = null;
    this.readOnly = false;
  }
  setText(t) { this.lines = String(t).split("\n"); this.r = 0; this.c = 0; if (this.sb) this.sb.top = 0; }
  getText() { return this.lines.join("\n"); }
  visRows() { return Math.floor((this.h - 4) / FH); }
  _changed() { if (this.onChange) this.onChange(); }
  _ensureVis() {
    const v = this.visRows();
    if (this.r < this.sb.top) this.sb.top = this.r;
    if (this.r >= this.sb.top + v) this.sb.top = this.r - v + 1;
  }
  draw(ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    G.fill(x, y, this.w, this.h, ROLE("winBg"));
    G.sunken(x, y, this.w, this.h, ROLE("hi"), ROLE("sh"));
    const v = this.visRows();
    this.sb.clampTop(this.lines.length, v);
    G.clip(x + 2, y + 2, this.w - 12, this.h - 4);
    for (let i = 0; i < v; i++) {
      const li = this.sb.top + i;
      if (li >= this.lines.length) break;
      G.text(x + 2, y + 2 + i * FH, this.lines[li], RC("text"));
    }
    G.unclip();
    if (!this.readOnly && this.win && this.win.focusCtl === this && (Math.floor(Sys.t / 400) & 1) === 0) {
      const cy = y + 2 + (this.r - this.sb.top) * FH;
      if (cy >= y + 2 && cy < y + this.h - 8)
        G.vline(x + 2 + this.c * FW, cy, 7, RC("text"));
    }
    this.sb.draw(x + this.w - 9, y + 1, this.h - 2, this.lines.length, v);
  }
  mouse(ev) {
    if (this.sb.mouse(ev, this.x + this.w - 9, this.y + 1, this.h - 2, this.lines.length, this.visRows()))
      return;
    if (ev.type === "wheel") { this.sb.top += ev.dy > 0 ? 3 : -3; this.sb.clampTop(this.lines.length, this.visRows()); return; }
    if (ev.type === "down") {
      this.r = U.clamp(this.sb.top + Math.floor((ev.y - this.y - 2) / FH), 0, this.lines.length - 1);
      this.c = U.clamp(Math.round((ev.x - this.x - 2) / FW), 0, this.lines[this.r].length);
    }
  }
  key(e) {
    if (this.readOnly) return false;
    const k = e.key, L = this.lines;
    const clampC = () => { this.c = U.clamp(this.c, 0, L[this.r].length); };
    if (k.length === 1 && !e.ctrlKey && !e.altKey) {
      L[this.r] = L[this.r].slice(0, this.c) + k + L[this.r].slice(this.c);
      this.c++; SND.key(); this._changed(); this._ensureVis(); return true;
    }
    switch (k) {
      case "Enter": {
        const rest = L[this.r].slice(this.c);
        L[this.r] = L[this.r].slice(0, this.c);
        L.splice(this.r + 1, 0, rest);
        this.r++; this.c = 0; this._changed(); this._ensureVis(); return true;
      }
      case "Backspace":
        if (this.c > 0) { L[this.r] = L[this.r].slice(0, this.c - 1) + L[this.r].slice(this.c); this.c--; }
        else if (this.r > 0) {
          this.c = L[this.r - 1].length;
          L[this.r - 1] += L[this.r]; L.splice(this.r, 1); this.r--;
        }
        this._changed(); this._ensureVis(); return true;
      case "Delete":
        if (this.c < L[this.r].length) L[this.r] = L[this.r].slice(0, this.c) + L[this.r].slice(this.c + 1);
        else if (this.r < L.length - 1) { L[this.r] += L[this.r + 1]; L.splice(this.r + 1, 1); }
        this._changed(); return true;
      case "ArrowUp": if (this.r > 0) this.r--; clampC(); this._ensureVis(); return true;
      case "ArrowDown": if (this.r < L.length - 1) this.r++; clampC(); this._ensureVis(); return true;
      case "ArrowLeft":
        if (this.c > 0) this.c--;
        else if (this.r > 0) { this.r--; this.c = L[this.r].length; }
        this._ensureVis(); return true;
      case "ArrowRight":
        if (this.c < L[this.r].length) this.c++;
        else if (this.r < L.length - 1) { this.r++; this.c = 0; }
        this._ensureVis(); return true;
      case "Home": this.c = 0; return true;
      case "End": this.c = L[this.r].length; return true;
      case "PageUp": this.r = Math.max(0, this.r - this.visRows()); clampC(); this._ensureVis(); return true;
      case "PageDown": this.r = Math.min(L.length - 1, this.r + this.visRows()); clampC(); this._ensureVis(); return true;
    }
    return false;
  }
}

class ListBox extends Ctl {
  constructor(x, y, w, h, opts) {
    super(x, y, w, h);
    opts = opts || {};
    this.items = [];         // {t, icon?, data?, cols?:[str]}
    this.sel = -1;
    this.sb = new VScroll();
    this.rowH = opts.rowH || 10;
    this.cols = opts.cols || null;   // [{w}] column widths for cols items
    this.onSel = opts.onSel || null;
    this.onDbl = opts.onDbl || null;
    this.onCtx = opts.onCtx || null;
    this.focusable = true;
    this.noBox = opts.noBox || false;
  }
  visRows() { return Math.floor((this.h - 4) / this.rowH); }
  setItems(items, keepSel) {
    this.items = items;
    if (!keepSel) { this.sel = -1; this.sb.top = 0; }
    this.sel = Math.min(this.sel, items.length - 1);
  }
  draw(ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    G.fill(x, y, this.w, this.h, ROLE("winBg"));
    if (!this.noBox) G.sunken(x, y, this.w, this.h, ROLE("hi"), ROLE("sh"));
    const v = this.visRows();
    this.sb.clampTop(this.items.length, v);
    G.clip(x + 2, y + 2, this.w - 12, this.h - 4);
    for (let i = 0; i < v; i++) {
      const ix = this.sb.top + i;
      if (ix >= this.items.length) break;
      const it = this.items[ix];
      const ry = y + 2 + i * this.rowH;
      if (ix === this.sel) {
        G.fill(x + 2, ry - 1, this.w - 12, this.rowH, ROLE("sel"));
      }
      const fg = ix === this.sel ? RC("selFg") : RC("text");
      let tx = x + 3;
      if (it.icon) { G.icon(it.icon, tx, ry - 1, true); tx += 10; }
      if (it.cols && this.cols) {
        for (let ci = 0; ci < it.cols.length; ci++) {
          G.text(tx, ry, it.cols[ci], fg);
          tx += this.cols[ci].w;
        }
      } else G.text(tx, ry, it.t, fg);
    }
    G.unclip();
    this.sb.draw(x + this.w - 9, y + 1, this.h - 2, this.items.length, v);
  }
  _rowAt(ev) {
    const i = this.sb.top + Math.floor((ev.y - this.y - 2) / this.rowH);
    return (i >= 0 && i < this.items.length) ? i : -1;
  }
  mouse(ev) {
    if (this.sb.mouse(ev, this.x + this.w - 9, this.y + 1, this.h - 2, this.items.length, this.visRows()))
      return;
    if (ev.type === "wheel") { this.sb.top += ev.dy > 0 ? 3 : -3; this.sb.clampTop(this.items.length, this.visRows()); return; }
    if (ev.type === "down") {
      const i = this._rowAt(ev);
      if (i >= 0) { this.sel = i; if (this.onSel) this.onSel(this.items[i], i); }
      if (ev.btn === 2 && this.onCtx && i >= 0) this.onCtx(this.items[i], i, ev);
    }
    if (ev.type === "dbl") {
      const i = this._rowAt(ev);
      if (i >= 0 && this.onDbl) this.onDbl(this.items[i], i);
    }
  }
  key(e) {
    if (e.key === "ArrowUp" && this.sel > 0) { this.sel--; this._nav(); return true; }
    if (e.key === "ArrowDown" && this.sel < this.items.length - 1) { this.sel++; this._nav(); return true; }
    if (e.key === "Enter" && this.sel >= 0 && this.onDbl) { this.onDbl(this.items[this.sel], this.sel); return true; }
    return false;
  }
  _nav() {
    const v = this.visRows();
    if (this.sel < this.sb.top) this.sb.top = this.sel;
    if (this.sel >= this.sb.top + v) this.sb.top = this.sel - v + 1;
    if (this.onSel) this.onSel(this.items[this.sel], this.sel);
  }
}

/* Tree with collapsible nodes (a SymbOS 4.0 feature, proudly) */
class TreeCtl extends Ctl {
  constructor(x, y, w, h, opts) {
    super(x, y, w, h);
    opts = opts || {};
    this.roots = [];
    this.sel = null;
    this.sb = new VScroll();
    this.onSel = opts.onSel || null;
    this.focusable = true;
  }
  flat() {
    const out = [];
    const rec = (n, depth) => {
      out.push({ n, depth });
      if (n.open && n.children) n.children.forEach(c => rec(c, depth + 1));
    };
    this.roots.forEach(r => rec(r, 0));
    return out;
  }
  visRows() { return Math.floor((this.h - 4) / 9); }
  draw(ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    G.fill(x, y, this.w, this.h, ROLE("winBg"));
    G.sunken(x, y, this.w, this.h, ROLE("hi"), ROLE("sh"));
    const flat = this.flat(), v = this.visRows();
    this.sb.clampTop(flat.length, v);
    G.clip(x + 2, y + 2, this.w - 12, this.h - 4);
    for (let i = 0; i < v; i++) {
      const ix = this.sb.top + i;
      if (ix >= flat.length) break;
      const { n, depth } = flat[ix];
      const ry = y + 2 + i * 9;
      let tx = x + 3 + depth * 10;
      if (n.children && n.children.length) {
        G.fill(tx, ry, 7, 7, ROLE("winBg"));
        G.frame(tx, ry, 7, 7, RC("sh"));
        G.hline(tx + 2, ry + 3, 3, RC("text"));
        if (!n.open) G.vline(tx + 3, ry + 2, 3, RC("text"));
      }
      tx += 9;
      if (n.icon) { G.icon(n.icon, tx, ry - 1, true); tx += 10; }
      if (n === this.sel) {
        G.fill(tx - 1, ry - 1, G.measure(n.label) + 3, 9, ROLE("sel"));
        G.text(tx, ry, n.label, RC("selFg"));
      } else G.text(tx, ry, n.label, RC("text"));
    }
    G.unclip();
    this.sb.draw(x + this.w - 9, y + 1, this.h - 2, flat.length, v);
  }
  mouse(ev) {
    const flat = this.flat();
    if (this.sb.mouse(ev, this.x + this.w - 9, this.y + 1, this.h - 2, flat.length, this.visRows()))
      return;
    if (ev.type === "wheel") { this.sb.top += ev.dy > 0 ? 2 : -2; this.sb.clampTop(flat.length, this.visRows()); return; }
    if (ev.type === "down") {
      const i = this.sb.top + Math.floor((ev.y - this.y - 2) / 9);
      if (i < 0 || i >= flat.length) return;
      const { n, depth } = flat[i];
      const bx = this.x + 3 + depth * 10;
      if (n.children && n.children.length && ev.x >= bx && ev.x < bx + 8) {
        n.open = !n.open; SDN.click();
      } else {
        this.sel = n;
        if (this.onSel) this.onSel(n);
      }
    }
  }
}

class Slider extends Ctl {
  constructor(x, y, w, min, max, val, cb) {
    super(x, y, w, 11);
    this.min = min; this.max = max; this.val = val; this.cb = cb;
  }
  draw(ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    G.fill(x, y + 4, this.w, 3, ROLE("winBg"));
    G.sunken(x, y + 4, this.w, 3, ROLE("hi"), ROLE("sh"));
    const kx = x + Math.round((this.w - 5) * (this.val - this.min) / (this.max - this.min));
    G.fill(kx, y, 5, 11, ROLE("face"));
    G.bevel(kx, y, 5, 11, ROLE("hi"), ROLE("sh"));
  }
  _set(ev) {
    const t = U.clamp((ev.x - this.x - 2) / (this.w - 5), 0, 1);
    const nv = Math.round(this.min + t * (this.max - this.min));
    if (nv !== this.val) { this.val = nv; if (this.cb) this.cb(nv); }
  }
  mouse(ev) {
    if (ev.type === "down" || ev.type === "drag") this._set(ev);
  }
}

class Prog extends Ctl {
  constructor(x, y, w, h) { super(x, y, w, h || 11); this.val = 0; }
  draw(ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    G.fill(x, y, this.w, this.h, ROLE("winBg"));
    G.sunken(x, y, this.w, this.h, ROLE("hi"), ROLE("sh"));
    const inner = this.w - 4;
    const segs = Math.floor(inner / 5);
    const on = Math.round(segs * U.clamp(this.val, 0, 1));
    for (let i = 0; i < on; i++)
      G.fill(x + 2 + i * 5, y + 2, 4, this.h - 4, ROLE("sel"));
  }
}

class Box extends Ctl {   // group box frame with a small title
  constructor(x, y, w, h, title) { super(x, y, w, h); this.title = title; }
  draw(ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    G.frame(x, y + 3, this.w, this.h - 3, ROLE("sh"));
    G.frame(x + 1, y + 4, this.w - 2, this.h - 5, ROLE("hi"));
    if (this.title) {
      G.fill(x + 6, y, G.measure(this.title) + 4, 8, ROLE("face"));
      G.text(x + 8, y, this.title, RC("text"));
    }
  }
}

class Cv extends Ctl {   // custom-drawn control (games, meters, editors)
  constructor(x, y, w, h, callbacks) {
    super(x, y, w, h);
    Object.assign(this, callbacks || {});   // onDraw, onMouse, onKey
    if (callbacks && callbacks.focusable) this.focusable = true;
  }
  draw(ox, oy) { if (this.onDraw) this.onDraw(ox + this.x, oy + this.y, this); }
  mouse(ev) { if (this.onMouse) this.onMouse(ev, this); }
  key(e) { return this.onKey ? this.onKey(e, this) : false; }
}

/* ===========================================================================
   MODULE 9 — WINDOW MANAGER
   Chrome, z-order, pull-down menus, popup/context menus, modal dialogs and
   the Alt+Tab task switcher (new in 4.0).
   =========================================================================== */
const TASKBAR_H = 14;
const TITLE_H = 10, MENU_H = 9;

function wrapText(str, maxCh) {
  const out = [];
  for (const para of String(str).split("\n")) {
    let line = "";
    for (const word of para.split(" ")) {
      if (line && (line + " " + word).length > maxCh) { out.push(line); line = word; }
      else line = line ? line + " " + word : word;
    }
    out.push(line);
  }
  return out;
}

let _winSeq = 0;
class Win {
  constructor(o) {
    o = o || {};
    this.id = ++_winSeq;
    this.title = o.title || "Window";
    this.icon = o.icon || "symbos";
    this.w = o.w || 160; this.h = o.h || 100;
    this.x = o.x !== undefined ? o.x : 12 + (_winSeq % 8) * 10;
    this.y = o.y !== undefined ? o.y : 10 + (_winSeq % 6) * 8;
    this.resizable = o.resizable !== false;
    this.minimizable = o.minimizable !== false;
    this.maximizable = o.maximizable !== false;
    this.closable = o.closable !== false;
    this.menu = o.menu || null;             // [{label, items:fn|array}]
    this.status = o.status || null;         // string or fn → string
    this.bg = o.bg || "face";
    this.app = o.app || null;               // owning app instance
    this.modal = !!o.modal;
    this.onClose = o.onClose || null;       // return false to veto
    this.onKey = o.onKey || null;
    this.onTick = o.onTick || null;
    this.minimized = false; this.maximized = false;
    this.prevRect = null;
    this.ctls = []; this.focusCtl = null;
    this.flash = 0;
    this.minW = o.minW || 70; this.minH = o.minH || 46;
    this.noTaskbar = !!o.noTaskbar;
    this.defBtn = null; this.cancelBtn = null;
    this.clampToScreen();
  }
  add(c) { c.win = this; this.ctls.push(c); return c; }
  clampToScreen() {
    this.x = U.clamp(this.x, -this.w + 30, G.W - 30);
    this.y = U.clamp(this.y, 0, WM.deskH() - TITLE_H);
  }
  rect() {
    if (this.maximized) return { x: 0, y: 0, w: G.W, h: WM.deskH() };
    return { x: this.x, y: this.y, w: this.w, h: this.h };
  }
  hasMenu() { return this.menu && this.menu.length; }
  hasStatus() { return !!this.status; }
  content() {
    const r = this.rect();
    const my = this.hasMenu() ? MENU_H : 0;
    const sy = this.hasStatus() ? MENU_H : 0;
    return { x: r.x + 2, y: r.y + 2 + TITLE_H + my,
             w: r.w - 4, h: r.h - 4 - TITLE_H - my - sy };
  }
  focused() { return WM.top() === this; }

  tryClose() {
    if (this.onClose && this.onClose() === false) return;
    WM.remove(this);
    SDN.play("close");
    if (this.app && this.app.mainWin === this) AppMan.kill(this.app.pid);
  }

  draw() {
    const r = this.rect(), foc = this.focused();
    // frame
    G.fill(r.x, r.y, r.w, r.h, ROLE("face"));
    G.bevel(r.x, r.y, r.w, r.h, ROLE("hi"), ROLE("border"));
    G.bevel(r.x + 1, r.y + 1, r.w - 2, r.h - 2, ROLE("hi"), ROLE("sh"));
    // title bar
    const flashOn = this.flash > 0 && (this.flash & 1);
    const tActive = (foc && !flashOn) || (!foc && flashOn);
    G.fill(r.x + 2, r.y + 2, r.w - 4, TITLE_H, ROLE(tActive ? "title" : "titleIn"));
    if (this.flash > 0) this.flash--;
    G.icon(this.icon, r.x + 3, r.y + 3, true);
    const btns = this._btns(r);
    G.clip(r.x + 13, r.y + 3, btns[0].x - r.x - 16, 8);
    G.text(r.x + 13, r.y + 4, this.title, RC(tActive ? "titleFg" : "titleInFg"));
    G.unclip();
    for (const b of btns) {
      G.fill(b.x, b.y, 8, 8, ROLE("face"));
      G.bevel(b.x, b.y, 8, 8, ROLE("hi"), ROLE("sh"));
      const c = RC("text");
      if (b.k === "close") {
        G.line(b.x + 2, b.y + 2, b.x + 5, b.y + 5, c);
        G.line(b.x + 5, b.y + 2, b.x + 2, b.y + 5, c);
      } else if (b.k === "max") {
        if (this.maximized) { G.frame(b.x + 3, b.y + 1, 4, 4, c); G.frame(b.x + 1, b.y + 3, 4, 4, c); }
        else G.frame(b.x + 1, b.y + 1, 6, 6, c);
      } else if (b.k === "min") G.hline(b.x + 2, b.y + 6, 4, c);
    }
    // menu bar
    if (this.hasMenu()) {
      const my = r.y + 2 + TITLE_H;
      G.fill(r.x + 2, my, r.w - 4, MENU_H, ROLE("face"));
      G.hline(r.x + 2, my + MENU_H - 1, r.w - 4, ROLE("sh"));
      let mx = r.x + 5;
      for (let i = 0; i < this.menu.length; i++) {
        const m = this.menu[i];
        const w = G.measure(m.label) + 6;
        if (WM._menuOpen && WM._menuOpen.win === this && WM._menuOpen.ix === i) {
          G.fill(mx - 2, my, w, MENU_H - 1, ROLE("sel"));
          G.text(mx + 1, my + 1, m.label, RC("selFg"));
        } else G.text(mx + 1, my + 1, m.label, RC("text"));
        m._x = mx - 2; m._w = w;
        mx += w + 4;
      }
    }
    // content
    const c = this.content();
    G.fill(c.x, c.y, c.w, c.h, ROLE(this.bg));
    G.clip(c.x, c.y, c.w, c.h);
    for (const ctl of this.ctls) if (ctl.visible) ctl.draw(c.x, c.y);
    G.unclip();
    // status bar
    if (this.hasStatus()) {
      const sy = r.y + r.h - 2 - MENU_H;
      G.fill(r.x + 2, sy, r.w - 4, MENU_H, ROLE("face"));
      G.sunken(r.x + 3, sy + 1, r.w - 6, MENU_H - 2, ROLE("hi"), ROLE("sh"));
      const txt = typeof this.status === "function" ? this.status() : this.status;
      G.clip(r.x + 5, sy + 2, r.w - 10, 7);
      G.text(r.x + 6, sy + 2, txt, RC("text"));
      G.unclip();
    }
    // resize grip
    if (this.resizable && !this.maximized) {
      for (let i = 0; i < 3; i++)
        G.line(r.x + r.w - 3 - i * 3, r.y + r.h - 2, r.x + r.w - 2, r.y + r.h - 3 - i * 3, RC("sh"));
    }
  }

  _btns(r) {
    const out = []; let bx = r.x + r.w - 12;
    if (this.closable) { out.push({ k: "close", x: bx, y: r.y + 3 }); bx -= 9; }
    if (this.maximizable) { out.push({ k: "max", x: bx, y: r.y + 3 }); bx -= 9; }
    if (this.minimizable) { out.push({ k: "min", x: bx, y: r.y + 3 }); bx -= 9; }
    return out;
  }

  hitTest(mx, my) {
    const r = this.rect();
    if (mx < r.x || my < r.y || mx >= r.x + r.w || my >= r.y + r.h) return null;
    for (const b of this._btns(r))
      if (mx >= b.x && mx < b.x + 8 && my >= b.y && my < b.y + 8) return { area: "btn", k: b.k };
    if (this.resizable && !this.maximized) {
      const edge = 3;
      const L = mx < r.x + edge, R = mx >= r.x + r.w - edge;
      const T = my < r.y + edge, B = my >= r.y + r.h - edge;
      const corner = mx >= r.x + r.w - 8 && my >= r.y + r.h - 8;
      if (corner || (R && B)) return { area: "resize", dir: "se" };
      if (R) return { area: "resize", dir: "e" };
      if (B) return { area: "resize", dir: "s" };
      if (L) return { area: "resize", dir: "w" };
      if (T && my < r.y + 2) return { area: "resize", dir: "n" };
    }
    if (my < r.y + 2 + TITLE_H) return { area: "title" };
    if (this.hasMenu() && my < r.y + 2 + TITLE_H + MENU_H) {
      for (let i = 0; i < this.menu.length; i++) {
        const m = this.menu[i];
        if (m._x !== undefined && mx >= m._x && mx < m._x + m._w) return { area: "menu", ix: i };
      }
      return { area: "menubar" };
    }
    return { area: "content" };
  }

  routeMouse(ev) {   // ev in screen coords; convert to content-local
    const c = this.content();
    const lev = { type: ev.type, x: ev.x - c.x, y: ev.y - c.y, btn: ev.btn, dy: ev.dy };
    if (ev.type === "down" || ev.type === "dbl") {
      for (let i = this.ctls.length - 1; i >= 0; i--) {
        const ctl = this.ctls[i];
        if (ctl.visible && ctl.enabled !== false && ctl.hit(lev.x, lev.y)) {
          if (ctl.focusable && ev.type === "down") this.focusCtl = ctl;
          ctl.mouse(lev);
          if (ev.type === "down") WM.capture = { win: this, ctl };
          return true;
        }
      }
      if (ev.type === "down") this.focusCtl = null;
    } else if (ev.type === "wheel") {
      for (let i = this.ctls.length - 1; i >= 0; i--) {
        const ctl = this.ctls[i];
        if (ctl.visible && ctl.hit(lev.x, lev.y)) { ctl.mouse(lev); return true; }
      }
    }
    return false;
  }
}

const WM = {
  wins: [], popups: [], capture: null, drag: null,
  altTab: null, _menuOpen: null,
  deskH() { return G.H - TASKBAR_H; },

  add(win, opts) {
    this.wins.push(win);
    if (!(opts && opts.silent)) SDN.play("open");
    return win;
  },
  remove(win) {
    const i = this.wins.indexOf(win);
    if (i >= 0) this.wins.splice(i, 1);
    if (this.capture && this.capture.win === win) this.capture = null;
    DESK.saveLayout();
  },
  top() {
    for (let i = this.wins.length - 1; i >= 0; i--)
      if (!this.wins[i].minimized) return this.wins[i];
    return null;
  },
  modalTop() {
    const t = this.top();
    return t && t.modal ? t : null;
  },
  focusWin(win) {
    const i = this.wins.indexOf(win);
    if (i >= 0) { this.wins.splice(i, 1); this.wins.push(win); }
    win.minimized = false;
  },
  minimize(win) {
    if (!win.minimizable) return;
    win.minimized = true;
    SDN.play("min");
  },
  toggleMax(win) {
    if (!win.maximizable) return;
    win.maximized = !win.maximized;
    SDN.play(win.maximized ? "max" : "min");
  },

  /* ---- dialogs ----------------------------------------------------------- */
  msg(title, text, opts) {
    opts = opts || {};
    const lines = wrapText(text, 34);
    const tw = Math.max(120, Math.min(220, 8 + lines.reduce((a, l) => Math.max(a, l.length), 0) * FW + (opts.icon ? 20 : 0)));
    const btns = opts.buttons || ["OK"];
    const h = 34 + lines.length * FH + 18;
    const win = new Win({
      title, w: tw + 8, h, icon: opts.winIcon || "symbos",
      x: Math.floor((G.W - tw - 8) / 2), y: Math.floor((this.deskH() - h) / 2.4),
      resizable: false, minimizable: false, maximizable: false,
      modal: true, noTaskbar: true
    });
    let ty = 6, tx = 6;
    if (opts.icon) { win.add(new Cv(4, 4, 16, 16, { onDraw: (x, y) => G.icon(opts.icon, x, y) })); tx = 24; }
    for (const l of lines) { win.add(new Lbl(tx, ty, l)); ty += FH; }
    const bw = 42, totW = btns.length * (bw + 6) - 6;
    let bx = Math.floor((tw + 8 - 4 - totW) / 2);
    btns.forEach((b, i) => {
      const btn = win.add(new Btn(bx, ty + 6, bw, 12, b, () => {
        WM.remove(win);
        if (opts.cb) opts.cb(b, i);
      }));
      if (i === 0) win.defBtn = btn;
      if (i === btns.length - 1) win.cancelBtn = btn;
      bx += bw + 6;
    });
    if (opts.error) SDN.play("error"); else if (opts.info) SDN.play("info");
    return this.add(win, { silent: true });
  },

  prompt(title, label, initial, cb, opts) {
    opts = opts || {};
    const w = 170, h = 64;
    const win = new Win({
      title, w, h, icon: opts.icon || "symbos",
      x: Math.floor((G.W - w) / 2), y: Math.floor((this.deskH() - h) / 2.4),
      resizable: false, minimizable: false, maximizable: false, modal: true, noTaskbar: true
    });
    win.add(new Lbl(6, 4, label));
    const ed = win.add(new Edit(6, 14, w - 16, initial || "", {
      onEnter: v => { WM.remove(win); cb(v); }
    }));
    win.focusCtl = ed;
    win.defBtn = win.add(new Btn(w - 100, 30, 42, 12, "OK", () => { WM.remove(win); cb(ed.text); }));
    win.cancelBtn = win.add(new Btn(w - 54, 30, 42, 12, "Cancel", () => { WM.remove(win); if (opts.onCancel) opts.onCancel(); }));
    return this.add(win, { silent: true });
  },

  /* ---- popup menus -------------------------------------------------------- */
  measureMenu(items) {
    let w = 40, h = 4;
    for (const it of items) {
      if (it.sep) { h += 4; continue; }
      let iw = 22 + G.measure(it.t) + (it.key ? G.measure(it.key) + 10 : 0) + (it.sub ? 10 : 0);
      w = Math.max(w, iw);
      h += 10;
    }
    return { w, h };
  },
  openPopup(x, y, items, opts) {
    opts = opts || {};
    items = items.filter(Boolean);
    if (!items.length) return;
    const { w, h } = this.measureMenu(items);
    x = U.clamp(x, 0, G.W - w);
    y = U.clamp(y, 0, G.H - h);
    this.popups.push({ x, y, w, h, items, sel: -1, ownerRect: opts.ownerRect || null,
                       parent: opts.parent, openT: Sys.t, banner: opts.banner });
    if (opts.banner) {
      const p = this.popups[this.popups.length - 1];
      p.x = U.clamp(p.x, 0, G.W - w - 10); p.w += 10;
    }
  },
  closePopups(from) {
    this.popups.length = from || 0;
    if (!this.popups.length) this._menuOpen = null;
  },
  popupAt(x, y) {
    for (let i = this.popups.length - 1; i >= 0; i--) {
      const p = this.popups[i];
      if (x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h) return i;
    }
    return -1;
  },
  drawPopups() {
    for (const p of this.popups) {
      G.fill(p.x, p.y, p.w, p.h, ROLE("face"));
      G.bevel(p.x, p.y, p.w, p.h, ROLE("hi"), ROLE("border"));
      G.bevel(p.x + 1, p.y + 1, p.w - 2, p.h - 2, ROLE("hi"), ROLE("sh"));
      let ix = p.x + 2, iy = p.y + 2, iw = p.w - 4;
      if (p.banner) {
        // vertical "SymbOS 4.0" banner on the start menu
        G.fill(ix, iy, 10, p.h - 4, ROLE("title"));
        const s = "SymbOS 4.0";
        for (let i = 0; i < s.length; i++)
          G.text(ix + 2, p.y + p.h - 12 - i * 7, s[s.length - 1 - i], RC("titleFg"));
        ix += 10; iw -= 10;
      }
      p._itemsY = [];
      for (let i = 0; i < p.items.length; i++) {
        const it = p.items[i];
        if (it.sep) {
          G.hline(ix + 2, iy + 1, iw - 4, ROLE("sh"));
          G.hline(ix + 2, iy + 2, iw - 4, ROLE("hi"));
          p._itemsY.push({ y: iy, h: 4 }); iy += 4; continue;
        }
        const hot = p.sel === i;
        if (hot && !it.disabled) {
          G.fill(ix + 1, iy, iw - 2, 10, ROLE("sel"));
        }
        const fg = it.disabled ? RC("dis") : (hot ? RC("selFg") : RC("text"));
        if (it.icon) G.icon(it.icon, ix + 3, iy + 1, true);
        else if (it.checked) G.text(ix + 3, iy + 1, "✓", fg);
        G.text(ix + 14, iy + 1, it.t, fg);
        if (it.key) G.text(ix + iw - G.measure(it.key) - 4, iy + 1, it.key, fg);
        if (it.sub) G.text(ix + iw - 8, iy + 1, "►", fg);
        p._itemsY.push({ y: iy, h: 10 });
        iy += 10;
      }
      p._ix = ix; p._iw = iw;
    }
  },
  popupMouse(ev) {
    const pi = this.popupAt(ev.x, ev.y);
    if (pi < 0) {
      if (ev.type === "down") {
        // click outside all popups: close (unless on the owner control)
        this.closePopups(0);
        return true;     // swallow
      }
      if (ev.type === "up") {
        const p0 = this.popups[0];
        if (p0 && p0.ownerRect && Sys.t - p0.openT < 500) return true;
        return true;
      }
      return true;
    }
    const p = this.popups[pi];
    const idx = p._itemsY ? p._itemsY.findIndex(r => ev.y >= r.y && ev.y < r.y + r.h) : -1;
    if (ev.type === "move" || ev.type === "down") {
      if (idx >= 0 && !p.items[idx].sep) {
        if (p.sel !== idx) {
          p.sel = idx;
          this.closePopups(pi + 1);
          const it = p.items[idx];
          if (it.sub && !it.disabled) {
            const items = typeof it.sub === "function" ? it.sub() : it.sub;
            this.openPopup(p.x + p.w - 4, p._itemsY[idx].y - 2, items, { parent: pi });
          }
        }
      }
    }
    if (ev.type === "up" && idx >= 0) {
      const it = p.items[idx];
      if (!it.sep && !it.disabled && !it.sub && it.action) {
        this.closePopups(0);
        SDN.click();
        it.action();
      }
    }
    return true;
  },

  /* ---- alt+tab ------------------------------------------------------------ */
  startAltTab() {
    const list = this.wins.filter(w => !w.noTaskbar);
    if (list.length === 0) return;
    if (!this.altTab) this.altTab = { list, ix: 0 };
    this.altTab.ix = (this.altTab.ix + 1) % this.altTab.list.length;
    SDN.click();
  },
  commitAltTab() {
    if (!this.altTab) return;
    const w = this.altTab.list[this.altTab.ix];
    this.altTab = null;
    if (w && this.wins.includes(w)) this.focusWin(w);
  },
  drawAltTab() {
    if (!this.altTab) return;
    const n = this.altTab.list.length;
    const w = Math.max(120, n * 22 + 16), h = 46;
    const x = Math.floor((G.W - w) / 2), y = Math.floor((G.H - h) / 2);
    G.fill(x, y, w, h, ROLE("face"));
    G.bevel(x, y, w, h, ROLE("hi"), ROLE("border"));
    G.bevel(x + 1, y + 1, w - 2, h - 2, ROLE("hi"), ROLE("sh"));
    let ix = x + 8;
    for (let i = 0; i < n; i++) {
      if (i === this.altTab.ix) {
        G.fill(ix - 2, y + 6, 20, 20, ROLE("sel"));
        G.frame(ix - 2, y + 6, 20, 20, ROLE("selFg"));
      }
      G.icon(this.altTab.list[i].icon, ix, y + 9);
      ix += 22;
    }
    const cur = this.altTab.list[this.altTab.ix];
    G.clip(x + 4, y + 32, w - 8, 8);
    G.textC(x + Math.floor(w / 2), y + 32, cur.title, RC("text"));
    G.unclip();
  },

  /* ---- event routing -------------------------------------------------------- */
  cursorFor(x, y) {
    if (Sys.t < Sys.busyUntil) return "busy";
    if (this.drag) {
      if (this.drag.mode === "resize")
        return this.drag.dir === "e" || this.drag.dir === "w" ? "resizeH"
             : this.drag.dir === "s" || this.drag.dir === "n" ? "resizeV" : "resizeD";
      return "arrow";
    }
    if (this.popupAt(x, y) >= 0 || this.popups.length) return "arrow";
    for (let i = this.wins.length - 1; i >= 0; i--) {
      const w = this.wins[i];
      if (w.minimized) continue;
      const ht = w.hitTest(x, y);
      if (ht) {
        if (ht.area === "resize")
          return ht.dir === "e" || ht.dir === "w" ? "resizeH"
               : ht.dir === "s" || ht.dir === "n" ? "resizeV" : "resizeD";
        if (ht.area === "content" && w.cursorFor) {
          const c = w.content();
          const cf = w.cursorFor(x - c.x, y - c.y);
          if (cf) return cf;
        }
        return "arrow";
      }
    }
    return "arrow";
  },

  mouse(ev) {
    if (this.altTab) return true;
    // popup menus grab everything
    if (this.popups.length) return this.popupMouse(ev);
    // captured control
    if (this.capture) {
      const c = this.capture.win.content();
      this.capture.ctl.mouse({ type: ev.type === "move" ? "drag" : ev.type,
                               x: ev.x - c.x, y: ev.y - c.y, btn: ev.btn, dy: ev.dy });
      if (ev.type === "up") this.capture = null;
      return true;
    }
    // window drag/resize in progress
    if (this.drag) {
      const d = this.drag, w = d.win;
      if (ev.type === "move") {
        if (d.mode === "move") {
          w.x = ev.x - d.dx; w.y = ev.y - d.dy;
          w.x = U.clamp(w.x, -w.w + 24, G.W - 24);
          w.y = U.clamp(w.y, 0, this.deskH() - 8);
        } else {
          if (d.dir.includes("e")) w.w = Math.max(w.minW, d.ow + ev.x - d.sx);
          if (d.dir.includes("s")) w.h = Math.max(w.minH, d.oh + ev.y - d.sy);
          if (d.dir.includes("w")) {
            const nw = Math.max(w.minW, d.ow - (ev.x - d.sx));
            w.x = d.ox + (d.ow - nw); w.w = nw;
          }
          if (d.dir.includes("n")) {
            const nh = Math.max(w.minH, d.oh - (ev.y - d.sy));
            w.y = d.oy + (d.oh - nh); w.h = nh;
          }
          if (w.onResize) w.onResize();
        }
      }
      if (ev.type === "up") { this.drag = null; DESK.saveLayout(); }
      return true;
    }
    // modal guard
    const modal = this.modalTop();
    // find window under pointer
    for (let i = this.wins.length - 1; i >= 0; i--) {
      const w = this.wins[i];
      if (w.minimized) continue;
      const ht = w.hitTest(ev.x, ev.y);
      if (!ht) continue;
      if (modal && w !== modal) {
        if (ev.type === "down") { modal.flash = 7; SDN.play("error"); }
        return true;
      }
      if (ev.type === "down" || ev.type === "dbl") {
        if (this.top() !== w) { this.focusWin(w); }
        if (ht.area === "btn") {
          if (ev.type === "down") {
            if (ht.k === "close") w.tryClose();
            else if (ht.k === "max") w.maximized ? this.toggleMax(w) : this.toggleMax(w);
            else if (ht.k === "min") this.minimize(w);
          }
          return true;
        }
        if (ht.area === "title") {
          if (ev.type === "dbl") { if (w.maximizable) this.toggleMax(w); return true; }
          if (!w.maximized && ev.btn === 0)
            this.drag = { mode: "move", win: w, dx: ev.x - w.x, dy: ev.y - w.y };
          return true;
        }
        if (ht.area === "menu" && ev.type === "down") {
          const m = w.menu[ht.ix];
          const items = typeof m.items === "function" ? m.items() : m.items;
          const r = w.rect();
          this._menuOpen = { win: w, ix: ht.ix };
          this.openPopup(m._x, r.y + 2 + TITLE_H + MENU_H - 1, items,
                         { ownerRect: { x: m._x, y: r.y + 2 + TITLE_H, w: m._w, h: MENU_H } });
          return true;
        }
        if (ht.area === "resize" && ev.type === "down" && ev.btn === 0) {
          this.drag = { mode: "resize", win: w, dir: ht.dir, sx: ev.x, sy: ev.y,
                        ow: w.w, oh: w.h, ox: w.x, oy: w.y };
          return true;
        }
        if (ht.area === "content") { w.routeMouse(ev); return true; }
        return true;
      }
      if (ev.type === "wheel" && ht.area === "content") { w.routeMouse(ev); return true; }
      if (ev.type === "move") return true;
      if (ev.type === "up") return true;
    }
    return false;   // let the desktop have it
  },

  key(e) {
    if (this.popups.length) {
      if (e.key === "Escape") this.closePopups(Math.max(0, this.popups.length - 1));
      return true;
    }
    const w = this.top();
    if (!w) return false;
    if (e.key === "Escape" && w.cancelBtn) { w.cancelBtn.cb(); return true; }
    if (e.key === "Enter" && w.defBtn && !(w.focusCtl instanceof TxtArea) &&
        !(w.focusCtl instanceof Edit && w.focusCtl.onEnter)) {
      w.defBtn.cb(); return true;
    }
    if (w.focusCtl && w.focusCtl.key(e)) return true;
    if (w.onKey && w.onKey(e)) return true;
    return false;
  },

  drawAll() {
    for (const w of this.wins) if (!w.minimized) w.draw();
    this.drawPopups();
    this.drawAltTab();
  },

  tick(dt) {
    for (const w of this.wins) if (w.onTick) w.onTick(dt);
  }
};

/* ===========================================================================
   MODULE 10 — DESKTOP / TASKBAR / START MENU / SYSTRAY / WIDGETS
   =========================================================================== */
const DESK = {
  icons: [], selIcon: null, dragIcon: null, dragWidget: null,
  _wallCache: null, _wallKey: "",
  ready: false,

  init() {
    this.ready = false;
    const defs = [
      { id: "symcmd", icon: "symcmd", label: "SymCmd" },
      { id: "shell", icon: "shell", label: "SymShell" },
      { id: "symamp", icon: "symamp", label: "SymAmp" },
      { id: "notepad", icon: "notepad", label: "Notepad" },
      { id: "paint", icon: "paint", label: "SymPaint" },
      { id: "taskman", icon: "taskman", label: "Tasks" },
      { id: "maze", icon: "maze", label: "Maze 3D" },
      { id: "about", icon: "info", label: "About" }
    ];
    const saved = ST.d.deskIcons || {};
    const perCol = Math.max(3, Math.floor((WM.deskH() - 6) / 28));
    this.icons = defs.map((d, i) => ({
      ...d,
      x: saved[d.id] ? saved[d.id][0] : 8 + Math.floor(i / perCol) * 56,
      y: saved[d.id] ? saved[d.id][1] : 4 + (i % perCol) * 28
    }));
    this.widgetPos = ST.d.widgetPos || {
      clock: [G.W - 62, WM.deskH() - 26], cpu: [G.W - 62, WM.deskH() - 52]
    };
    KRN.onOOM = (name, k, strikes) => this.oomDialog(name, k, strikes);
    this.restoreLayout();
    this.ready = true;
  },

  /* ---- wallpaper ---------------------------------------------------------- */
  drawBack() {
    const key = [ST.d.wallpaper[Sys.plat.id] || "plain", G.epoch, Sys.schemeIx, G.W, G.H].join("|");
    if (this._wallKey !== key) {
      this._wallKey = key;
      const c = document.createElement("canvas");
      c.width = G.W; c.height = WM.deskH();
      const realCtx = G.ctx; G.ctx = c.getContext("2d");
      G.ctx.imageSmoothingEnabled = false;
      this.renderWall(ST.d.wallpaper[Sys.plat.id] || "plain", G.W, WM.deskH());
      G.ctx = realCtx;
      this._wallCache = c;
      G._pats.clear();   // patterns were created against the offscreen ctx
    }
    G.ctx.drawImage(this._wallCache, 0, 0);
    // desktop icons
    for (const ic of this.icons) {
      G.icon(ic.icon, ic.x + 4, ic.y);
      const lw = G.measure(ic.label);
      const lx = Math.max(1, ic.x + 11 - Math.floor(lw / 2)), ly = ic.y + 15;
      if (this.selIcon === ic) {
        G.fill(lx - 1, ly - 1, lw + 2, 9, ROLE("sel"));
        G.text(lx, ly, ic.label, RC("selFg"));
      } else {
        // 4-way dark outline so labels stay readable on any wallpaper
        G.text(lx - 1, ly, ic.label, G.dark);
        G.text(lx + 1, ly, ic.label, G.dark);
        G.text(lx, ly - 1, ic.label, G.dark);
        G.text(lx, ly + 1, ic.label, G.dark);
        G.text(lx, ly, ic.label, G.light);
      }
    }
    this.drawWidgets();
  },

  renderWall(wp, W, H) {
    G.fill(0, 0, W, H, ROLE("desk"));
    if (wp === "boing") {
      // dithered checker sphere — a cross-museum wink
      const cx = Math.floor(W / 2), cy = Math.floor(H / 2) - 4;
      const r = Math.floor(Math.min(W, H) / 3.1);
      for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
        const d2 = x * x + y * y;
        if (d2 > r * r) continue;
        const z = Math.sqrt(r * r - d2);
        const u = Math.atan2(x, z), v = Math.asin(y / r);
        const check = (Math.floor((u + 2.2) / 0.52) + Math.floor((v + 2.2) / 0.42)) & 1;
        const lum = (x * -0.5 + y * -0.5 + z) / r;   // fake light from top-left
        const ink = check ? ROLE("accA") : ROLE("winBg");
        let ci = G.inkAt(ink, cx + x, cy + y);
        if (lum < 0.55 && ((cx + x + cy + y) & 1)) ci = G.inkAt(ROLE("border"), x, y);
        G.px(cx + x, cy + y, ci);
      }
      // shadow
      for (let x = -r; x <= r; x++) {
        const w2 = Math.floor(Math.sqrt(r * r - x * x) / 3);
        for (let y = 0; y < w2; y += 2)
          G.px(cx + x + 10, cy + r + 6 + Math.floor(y / 2), G.inkAt([G.dark, G.inkAt(ROLE("desk"), 0, 0)], x, y));
      }
    } else if (wp === "weave") {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const v = ((x + y) >> 3) & 1, w = ((x - y) >> 3) & 1;
        if (v && w) G.px(x, y, G.inkAt(ROLE("accA"), x, y));
        else if (v !== w && ((x + y) & 3) === 0) G.px(x, y, G.inkAt(ROLE("sh"), x, y));
      }
    } else if (wp === "circuit") {
      const step = 24;
      for (let y = step / 2; y < H; y += step) G.hline(0, y, W, ROLE("titleIn"));
      for (let x = step / 2; x < W; x += step) G.vline(x, 0, H, ROLE("titleIn"));
      for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step)
        if ((x * 7 + y * 13) % 5 < 2) { G.fill(x - 1, y - 1, 3, 3, ROLE("hi")); }
    } else if (wp === "logo") {
      const s = "SymbOS 4.0";
      for (let y = 8; y < H; y += 40)
        for (let x = ((y / 40) & 1) * 40 + 4; x < W; x += 110)
          G.text(x, y, s, G.inkAt(ROLE("titleIn"), 0, 0));
      G.icon("symbos", Math.floor(W / 2) - 7, Math.floor(H / 2) - 10);
    }
  },

  wallpapers() {
    return [["plain", "Plain"], ["boing", "Bouncing ball"], ["weave", "Weave"],
            ["circuit", "Circuit"], ["logo", "Logo tile"]];
  },
  setWall(id) {
    ST.d.wallpaper[Sys.plat.id] = id; ST.save();
  },

  /* ---- widgets ------------------------------------------------------------- */
  drawWidgets() {
    if (ST.d.widgets.clock) {
      const [x, y] = this.widgetPos.clock;
      this._widgetFrame(x, y);
      const n = new Date();
      G.text(x + 4, y + 3, U.pad2(n.getHours()) + ":" + U.pad2(n.getMinutes()) + ":" + U.pad2(n.getSeconds()), RC("text"));
      G.text(x + 4, y + 12, U.pad2(n.getDate()) + "-" + U.pad2(n.getMonth() + 1) + "-" + String(n.getFullYear()).slice(2), RC("dis"));
    }
    if (ST.d.widgets.cpu) {
      const [x, y] = this.widgetPos.cpu;
      this._widgetFrame(x, y);
      G.text(x + 4, y + 2, "CPU " + KRN.busyPct() + "%", RC("text"));
      const h = KRN.history;
      for (let i = 0; i < 50; i++) {
        const s = h[h.length - 50 + i];
        if (s === undefined) continue;
        const bh = Math.max(1, Math.round(s * 9 / 100));
        G.vline(x + 4 + i, y + 19 - bh, bh, ROLE("accA"));
      }
    }
  },
  _widgetFrame(x, y) {
    G.fill(x, y, 58, 22, ROLE("face"));
    G.bevel(x, y, 58, 22, ROLE("hi"), ROLE("sh"));
  },
  widgetAt(x, y) {
    for (const k of ["clock", "cpu"]) {
      if (!ST.d.widgets[k]) continue;
      const [wx, wy] = this.widgetPos[k];
      if (x >= wx && x < wx + 58 && y >= wy && y < wy + 22) return k;
    }
    return null;
  },

  /* ---- taskbar --------------------------------------------------------------- */
  drawTaskbar() {
    const y = WM.deskH();
    G.fill(0, y, G.W, TASKBAR_H, ROLE("face"));
    G.hline(0, y, G.W, ROLE("hi"));
    // SymbOS button
    const sb = this._startRect();
    const startOpen = WM.popups.length && WM.popups[0].banner;
    G.fill(sb.x, sb.y, sb.w, sb.h, ROLE("face"));
    if (startOpen) G.sunken(sb.x, sb.y, sb.w, sb.h, ROLE("hi"), ROLE("sh"));
    else G.bevel(sb.x, sb.y, sb.w, sb.h, ROLE("hi"), ROLE("sh"));
    G.icon("symbos", sb.x + 2, sb.y + 2, true);
    G.text(sb.x + 12, sb.y + 3, "SymbOS", RC("text"));
    // systray
    const tr = this._trayRect();
    G.sunken(tr.x, tr.y, tr.w, tr.h, ROLE("hi"), ROLE("sh"));
    G.text(tr.x + 3, tr.y + 3, "♪", ST.d.sound.master ? RC("text") : RC("dis"));
    // network daemon icon: two linked dots
    const nx = tr.x + 12;
    G.fill(nx + 1, tr.y + 3, 3, 3, NET.online ? ROLE("accA") : ROLE("dis"));
    G.fill(nx + 5, tr.y + 6, 3, 3, NET.online ? ROLE("accA") : ROLE("dis"));
    G.px(nx + 4, tr.y + 5, RC("text"));
    const n = new Date();
    G.text(tr.x + 24, tr.y + 3, U.pad2(n.getHours()) + ":" + U.pad2(n.getMinutes()), RC("text"));
    // task buttons
    const list = WM.wins.filter(w => !w.noTaskbar);
    const x0 = sb.x + sb.w + 4, avail = tr.x - 4 - x0;
    const bw = list.length ? Math.min(64, Math.floor(avail / list.length) - 2) : 0;
    this._taskBtns = [];
    list.forEach((w, i) => {
      const bx = x0 + i * (bw + 2);
      if (bw < 18) return;
      const active = WM.top() === w;
      G.fill(bx, y + 2, bw, 11, active ? [RC("face"), RC("hi")] : ROLE("face"));
      if (active) G.sunken(bx, y + 2, bw, 11, ROLE("hi"), ROLE("sh"));
      else G.bevel(bx, y + 2, bw, 11, ROLE("hi"), ROLE("sh"));
      G.icon(w.icon, bx + 2, y + 3, true);
      G.clip(bx + 12, y + 4, bw - 14, 8);
      G.text(bx + 12, y + 4, w.title, RC("text"));
      G.unclip();
      this._taskBtns.push({ x: bx, w: bw, win: w });
    });
  },
  _startRect() { return { x: 2, y: WM.deskH() + 2, w: 48, h: 11 }; },
  _trayRect() { return { x: G.W - 58, y: WM.deskH() + 2, w: 56, h: 11 }; },

  /* ---- start menu ------------------------------------------------------------- */
  openStart() {
    const sb = this._startRect();
    const appsSub = () => [
      { t: "SymCommander", icon: "symcmd", action: () => AppMan.launch("symcmd") },
      { t: "SymShell", icon: "shell", action: () => AppMan.launch("shell") },
      { t: "Notepad", icon: "notepad", action: () => AppMan.launch("notepad") },
      { t: "SymPaint", icon: "paint", action: () => AppMan.launch("paint") },
      { t: "Video Player", icon: "video", action: () => AppMan.launch("video") },
      { t: "Calculator", icon: "calc", action: () => AppMan.launch("calc") },
      { t: "Clock", icon: "clock", action: () => AppMan.launch("clock") },
      { t: "Task Manager", icon: "taskman", action: () => AppMan.launch("taskman") }
    ];
    const gamesSub = () => [
      { t: "SokoSym", icon: "soko", action: () => AppMan.launch("soko") },
      { t: "Slide 2048", icon: "g2048", action: () => AppMan.launch("g2048") },
      { t: "ChessSym", icon: "chess", action: () => AppMan.launch("chess") },
      { t: "Maze 3D", icon: "maze", action: () => AppMan.launch("maze") }
    ];
    const netSub = () => [
      { t: "IRC Client", icon: "irc", action: () => AppMan.launch("irc") },
