  /* ---- layout persistence ---------------------------------------------------- */
  saveLayout() {
    if (!this.ready) return;
    const lay = [];
    for (const w of WM.wins) {
      if (w.noTaskbar || !w.app || w.app.mainWin !== w) continue;
      lay.push({ id: w.app.defId, x: w.x, y: w.y, w: w.w, h: w.h,
                 min: w.minimized, max: w.maximized });
    }
    ST.d.layout = lay;
    const ic = {};
    for (const i of this.icons) ic[i.id] = [i.x, i.y];
    ST.d.deskIcons = ic;
    ST.d.widgetPos = this.widgetPos;
    ST.save();
  },
  restoreLayout() {
    const lay = ST.d.layout;
    if (!lay || !lay.length) return;
    for (const l of lay) {
      const app = AppMan.launch(l.id, { restored: true });
      if (app && app.mainWin) {
        const w = app.mainWin;
        w.x = l.x; w.y = l.y;
        if (w.resizable) { w.w = Math.max(w.minW, l.w); w.h = Math.max(w.minH, l.h); }
        w.minimized = !!l.min; w.maximized = !!l.max;
        w.clampToScreen();
        if (w.onResize) w.onResize();
      }
    }
  },

  /* ---- mouse ------------------------------------------------------------------ */
  mouse(ev) {
    const y0 = WM.deskH();
    // taskbar
    if (ev.y >= y0) {
      if (ev.type !== "down") {
        if (ev.type === "up" && this.dragIcon) this.dragIcon = null;
        return;
      }
      const sb = this._startRect();
      if (ev.x >= sb.x && ev.x < sb.x + sb.w) { SDN.click(); this.openStart(); return; }
      const tr = this._trayRect();
      if (ev.x >= tr.x && ev.x < tr.x + tr.w) {
        if (ev.x < tr.x + 12) this.soundTrayMenu(ev);
        else if (ev.x < tr.x + 23) this.netTrayMenu(ev);
        else {
          if (ev.btn === 2) this.clockTrayMenu(ev);
          else AppMan.launch("clock");
        }
        return;
      }
      for (const b of this._taskBtns || []) {
        if (ev.x >= b.x && ev.x < b.x + b.w) {
          if (ev.btn === 2) {
            WM.openPopup(ev.x, y0 - 46, [
              { t: "Restore", action: () => WM.focusWin(b.win) },
              { t: "Minimize", action: () => WM.minimize(b.win) },
              { t: b.win.maximized ? "Restore size" : "Maximize",
                disabled: !b.win.maximizable, action: () => { WM.focusWin(b.win); WM.toggleMax(b.win); } },
              { sep: 1 },
              { t: "Close", action: () => b.win.tryClose() }
            ]);
          } else if (WM.top() === b.win && !b.win.minimized) WM.minimize(b.win);
          else WM.focusWin(b.win);
          return;
        }
      }
      if (ev.btn === 2)
        WM.openPopup(ev.x, y0 - 36, [
          { t: "Task Manager", icon: "taskman", action: () => AppMan.launch("taskman") },
          { t: "Minimize all", action: () => WM.wins.forEach(w => WM.minimize(w)) }
        ]);
      return;
    }
    // widgets
    const wk = ev.type === "down" ? this.widgetAt(ev.x, ev.y) : null;
    if (wk) {
      if (ev.btn === 2) {
        WM.openPopup(ev.x, ev.y, [
          { t: "Hide widget", action: () => { ST.d.widgets[wk] = false; ST.save(); } }
        ]);
      } else this.dragWidget = { k: wk, dx: ev.x - this.widgetPos[wk][0], dy: ev.y - this.widgetPos[wk][1] };
      return;
    }
    if (this.dragWidget) {
      if (ev.type === "move")
        this.widgetPos[this.dragWidget.k] =
          [U.clamp(ev.x - this.dragWidget.dx, 0, G.W - 58), U.clamp(ev.y - this.dragWidget.dy, 0, y0 - 22)];
      if (ev.type === "up") { this.dragWidget = null; this.saveLayout(); }
      return;
    }
    // desktop icons
    const iconAt = () => this.icons.find(ic =>
      ev.x >= ic.x && ev.x < ic.x + 24 && ev.y >= ic.y && ev.y < ic.y + 24);
    if (ev.type === "dbl") {
      this.dragIcon = null;
      const ic = iconAt();
      if (ic) this.openIcon(ic);
      return;
    }
    if (this.dragIcon) {
      if (ev.type === "move") {
        this.dragIcon.ic.x = U.clamp(ev.x - this.dragIcon.dx, 0, G.W - 22);
        this.dragIcon.ic.y = U.clamp(ev.y - this.dragIcon.dy, 0, y0 - 24);
      }
      if (ev.type === "up") { this.dragIcon = null; this.saveLayout(); }
      return;
    }
    if (ev.type === "down") {
      const ic = iconAt();
      this.selIcon = ic || null;
      if (ic) {
        if (ev.btn === 2) {
          WM.openPopup(ev.x, ev.y, [
            { t: "Open", action: () => this.openIcon(ic) },
            { sep: 1 },
            { t: "Arrange icons", action: () => this.arrangeIcons() }
          ]);
        } else this.dragIcon = { ic, dx: ev.x - ic.x, dy: ev.y - ic.y };
        return;
      }
      if (ev.btn === 2) this.deskMenu(ev);
    }
  },

    if (ic.id === "about") this.aboutSymbOS();
    else AppMan.launch(ic.id);
  },

/* ===========================================================================
   MODULE 11 — APPLICATION FRAMEWORK & CORE APPS
   =========================================================================== */
const AppMan = {
  apps: [],
  launch(id, args) {
    const def = APPDEFS[id];
    if (!def) return null;
    args = args || {};
    if (def.single) {
      const running = this.apps.find(a => a.defId === id);
      if (running) {
        if (running.mainWin) WM.focusWin(running.mainWin);
        if (def.reopen) def.reopen(running, args);
        return running;
      }
    }
    const task = KRN.alloc(def.exe.split(".")[0], def.memK, { cpu: def.cpu || 1 });
    if (!task) return null;
    const app = { defId: id, def, pid: task.pid, task, wins: [], mainWin: null, onTick: null };
    task.app = app;
    this.apps.push(app);
    if (!args.restored) {
      Sys.busyUntil = Sys.t + 350;
      SND.floppy(300);
    }
    def.make(app, args);
    if (app.mainWin && !args.restored) DESK.saveLayout();
    return app;
  },
  kill(pid) {
    const app = this.apps.find(a => a.pid === pid);
    if (!app) return;
    this.apps.splice(this.apps.indexOf(app), 1);
    if (app.onKill) app.onKill();
    for (const w of app.wins.slice()) WM.remove(w);
    KRN.freeTask(app.task);
    DESK.saveLayout();
  },
  launchByExe(name) {
    name = U.fname(name.toUpperCase().endsWith(".EXE") ? name : name + ".EXE");
    for (const id in APPDEFS)
      if (APPDEFS[id].exe === name) return this.launch(id);
    return null;
  },
  openFile(path) {
    const r = FS.resolve(path);
    if (!r || r.node.d) return false;
    const ext = r.node.n.split(".")[1] || "";
    if (ext === "EXE") {
      const app = AppMan.launchByExe(r.node.n);
      if (!app) WM.msg("SymbOS", r.node.n + " is a stage prop - only the applications this museum ships can actually run.", { icon: "info" });
      return true;
    }
    if (ext === "TXT" || ext === "INI") { AppMan.launch("notepad", { path }); return true; }
    if (ext === "SMM") { AppMan.launch("symamp", { file: r.node.n }); return true; }
    if (ext === "SGX") { AppMan.launch("paint", { path }); return true; }
    WM.msg("SymbOS", "No application is associated with " + r.node.n + ".", { icon: "info" });
    return true;
  },
  tick(dt) {
    for (const a of this.apps) if (a.onTick) a.onTick(dt);
  }
};

/* window helper: standard app window bound to an app */
function appWin(app, opts) {
  opts.app = app;
  const win = new Win(opts);
  app.wins.push(win);
  if (!app.mainWin) app.mainWin = win;
  WM.add(win, { silent: !!opts.silent });
  return win;
}

/* generic file picker dialog */
function filePicker(title, opts, cb) {
  opts = opts || {};
  let cwd = opts.cwd || "C:\\DOCS";
  const w = Math.min(210, G.W - 20), h = 130;
  const win = new Win({
    title, icon: "folder", w, h,
    x: Math.floor((G.W - w) / 2), y: Math.max(2, Math.floor((WM.deskH() - h) / 2.5)),
    resizable: false, maximizable: false, minimizable: false, modal: true, noTaskbar: true
  });
  const pathLbl = win.add(new Lbl(4, 2, cwd));
  const list = win.add(new ListBox(4, 12, w - 16, 66, { rowH: 9 }));
  let nameEd = null;
  if (opts.save) {
    win.add(new Lbl(4, 82, "Name:"));
    nameEd = win.add(new Edit(40, 80, w - 52, opts.name || ""));
    win.focusCtl = nameEd;
  }
  const refresh = () => {
    pathLbl.text = cwd;
    const items = [];
    if (cwd.length > 3) items.push({ t: "[..]", icon: "folderOpen", up: true });
    else for (const dl in FS.drives)
      if (dl + ":\\" !== cwd) items.push({ t: "[" + dl + ":]", icon: dl === "A" ? "floppy" : "hdd", drive: dl });
    for (const n of FS.list(cwd)) {
      if (!n.d && opts.ext && !n.n.endsWith("." + opts.ext)) continue;
      items.push({ t: n.d ? "[" + n.n + "]" : n.n, icon: FS.iconFor(n), node: n });
    }
    list.setItems(items);
  };
  list.onDbl = it => {
    if (it.up) { cwd = FS.dirOf(cwd.replace(/\\$/, "")); if (cwd.length === 2) cwd += "\\"; refresh(); return; }
    if (it.drive) { cwd = it.drive + ":\\"; refresh(); return; }
    if (it.node.d) { cwd = (cwd.endsWith("\\") ? cwd : cwd + "\\") + it.node.n; refresh(); return; }
    if (!opts.save) { WM.remove(win); cb((cwd.endsWith("\\") ? cwd : cwd + "\\") + it.node.n); }
    else if (nameEd) nameEd.text = it.node.n;
  };
  list.onSel = it => { if (nameEd && it.node && !it.node.d) { nameEd.text = it.node.n; nameEd.cur = it.node.n.length; } };
  win.defBtn = win.add(new Btn(w - 100, h - 34, 42, 12, opts.save ? "Save" : "Open", () => {
    if (opts.save) {
      let nm = U.fname(nameEd.text);
      if (!nm) return;
      if (opts.ext && !nm.includes(".")) nm += "." + opts.ext;
      WM.remove(win);
      cb((cwd.endsWith("\\") ? cwd : cwd + "\\") + nm, cwd, nm);
    } else {
      const it = list.items[list.sel];
      if (it && it.node && !it.node.d) { WM.remove(win); cb((cwd.endsWith("\\") ? cwd : cwd + "\\") + it.node.n); }
    }
  }));
  win.cancelBtn = win.add(new Btn(w - 54, h - 34, 42, 12, "Cancel", () => WM.remove(win)));
  refresh();
  WM.add(win, { silent: true });
}

/* progress dialog for copy/move — the museum's favourite juggling act */
function progressDialog(title, label, ms, onDone, opts) {
  const w = 180, h = 66;
  const win = new Win({
    title, icon: "folder", w, h,
    x: Math.floor((G.W - w) / 2), y: Math.floor((WM.deskH() - h) / 3),
    resizable: false, maximizable: false, minimizable: false, noTaskbar: true
  });
  win.add(new Lbl(6, 4, label.slice(0, 27)));
  const bar = win.add(new Prog(6, 16, w - 20, 10));
  let cancelled = false, t0 = null;
  win.cancelBtn = win.add(new Btn(Math.floor(w / 2) - 21, 32, 42, 12, "Cancel", () => {
    cancelled = true; WM.remove(win);
    if (opts && opts.onCancel) opts.onCancel();
  }));
  win.onTick = dt => {
    if (t0 === null) t0 = Sys.t;
    const p = U.clamp((Sys.t - t0) / ms, 0, 1);
    bar.val = p;
    if (p >= 1 && !cancelled) {
      cancelled = true;
      WM.remove(win);
      onDone();
    }
  };
  if (opts && opts.floppy) SND.floppy(Math.min(ms, 2500));
  WM.add(win, { silent: true });
  return win;
}

        { label: "Help", items: () => [
          { t: "About SymCommander", action: () => WM.msg("About SymCommander",
            "SymCommander 4.0 - the SymbOS file manager. 24K of code, collapsible tree included.",
            { icon: "symcmd" }) }
        ] }
      ]
    });
    const tree = win.add(new TreeCtl(0, 0, 96, 10));
    const list = win.add(new ListBox(98, 0, 10, 10, {
      rowH: 9, cols: [{ w: 88 }, { w: 34 }, { w: 50 }]
    }));

    const buildTree = () => {
      const mk = (path, node, depth) => {
        const kids = node.ch.filter(c => c.d);
        return {
          label: node.n.replace(":", ": " + (path[0] === "A" ? "Floppy" : Sys.plat.massName).slice(0, 9)).slice(0, 14),
          icon: depth === 0 ? (path[0] === "A" ? "floppy" : "hdd") : "folder",
          open: !!openState[path], data: path,
          children: kids.map(k => mk(path + (path.endsWith("\\") ? "" : "\\") + k.n, k, depth + 1))
        };
      };
      tree.roots = Object.keys(FS.drives).map(dl => mk(dl + ":\\", FS.drives[dl].root, 0));
      // re-select current
      const find = ns => { for (const n of ns) { if (n.data === cwd) return n; const f = find(n.children); if (f) return f; } return null; };
      tree.sel = find(tree.roots);
    };
    const refresh = () => {
      // remember open state
      const rec = n => { openState[n.data] = n.open; n.children.forEach(rec); };
      tree.roots.forEach(rec);
      buildTree();
      const items = FS.list(cwd).map(n => ({
        icon: FS.iconFor(n), node: n,
        cols: [n.n.slice(0, 14), n.d ? "<dir>" : FS.fmtSize(n.s), n.t + (n.attr && n.attr.comp ? " c" : "")]
      }));
      list.setItems(items, true);
    };
    tree.onSel = n => { cwd = n.data; n.open = true; openState[n.data] = true; refresh(); };
    const selNode = () => { const it = list.items[list.sel]; return it ? it.node : null; };
    const selPath = () => { const n = selNode(); return n ? (cwd.endsWith("\\") ? cwd : cwd + "\\") + n.n : null; };

    const openSel = () => {
      const n = selNode();
      if (!n) return;
      if (n.d) { cwd = (cwd.endsWith("\\") ? cwd : cwd + "\\") + n.n; openState[cwd] = true; refresh(); }
      else AppMan.openFile(selPath());
    };
    const newDir = () => WM.prompt("New directory", "Directory name:", "", v => {
      const err = FS.mkdir(cwd, v);
      if (err) WM.msg("SymCommander", err, { icon: "err", error: true });
      refresh();
    });
    const renameSel = () => {
      const n = selNode(); if (!n) return;
      WM.prompt("Rename", "New name for " + n.n + ":", n.n, v => {
        const err = FS.ren(selPath(), v);
        if (err) WM.msg("SymCommander", err, { icon: "err", error: true });
        refresh();
      });
    };
    const delSel = () => {
      const n = selNode(); if (!n) return;
      WM.msg("Delete", "Delete " + n.n + (n.d ? " and its contents" : "") + "?",
        { icon: "warn", buttons: ["Delete", "Cancel"], cb: b => {
          if (b !== "Delete") return;
          const err = FS.del(selPath());
          if (err) WM.msg("SymCommander", err, { icon: "err", error: true });
          refresh();
        } });
    };
    const copySel = move => {
      const n = selNode(); if (!n || n.d) return;
      WM.prompt(move ? "Move to" : "Copy to", "Target directory:", cwd === "C:\\" ? "A:\\" : "C:\\", target => {
        target = target.toUpperCase();
        const t = FS.resolve(target);
        if (!t || !t.node.d) { WM.msg("SymCommander", "No such directory: " + target, { icon: "err", error: true }); return; }
        const ms = U.clamp(Math.ceil(n.s / 1024) * 60, 500, 4000);
        app.task.cpu = 14;
        progressDialog(move ? "Moving..." : "Copying...", n.n + " → " + target, ms, () => {
          app.task.cpu = 2;
          const err = FS.copy(selPath(), target);
          if (err) WM.msg("SymCommander", err, { icon: "err", error: true });
          else if (move) FS.del(selPath());
          refresh();
        }, { floppy: target[0] === "A" || cwd[0] === "A", onCancel: () => { app.task.cpu = 2; } });
      });
    };
    const propsSel = () => {
      const n = selNode(); if (!n) return;
      const clusters = Math.ceil((n.d ? FS.sizeOf(n) : n.s) / 2048);
      let txt = "Name: " + n.n + "\nType: " + (n.d ? "Directory" : (n.n.split(".")[1] || "file") + " file") +
        "\nSize: " + FS.fmtSize(FS.sizeOf(n)) + " (" + FS.sizeOf(n) + " bytes)" +
        "\nOn disk: " + (clusters * 2) + "K in " + clusters + " clusters" +
        "\nModified: " + n.t;
      if (n.attr && n.attr.sys) txt += "\nAttributes: system, protected";
      if (n.attr && n.attr.comp) txt += "\n\nStored with SymbOS 4.0 kernel-level file compression (saves 31%).";
      WM.msg("Properties", txt, { icon: FS.iconFor(n) });
    };

    list.onDbl = () => openSel();
    list.onCtx = (it, i, ev) => {
      const c = win.content();
      WM.openPopup(c.x + ev.x, c.y + ev.y, [
        { t: "Open", action: () => openSel() },
        { sep: 1 },
        { t: "Copy to...", action: () => copySel(false), disabled: it.node.d },
        { t: "Move to...", action: () => copySel(true), disabled: it.node.d },
        { t: "Rename...", action: () => renameSel() },
        { t: "Delete", action: () => delSel() },
        { sep: 1 },
        { t: "Properties...", action: () => propsSel() }
      ]);
    };
    win.onResize = () => {
      const c = win.content();
      tree.h = c.h; tree.w = Math.min(96, Math.floor(c.w / 3));
      list.x = tree.w + 2; list.y = 0;
      list.w = c.w - list.x; list.h = c.h;
    };
    win.onResize();
    buildTree(); refresh();
  }
};

/* ---- SymShell ---------------------------------------------------------------- */
APPDEFS.shell = {
  name: "SymShell", exe: "SYMSHELL.EXE", icon: "shell", memK: 12, cpu: 1,
  make(app) {
    const win = appWin(app, {
      title: "SymShell", icon: "shell",
      w: Math.min(280, G.W - 20), h: Math.min(140, WM.deskH() - 12),
      x: 20, y: 16, minW: 160, minH: 70, bg: "face"
    });
    const S = {
      lines: ["SymShell 4.0 - SymbOS command line", "Type HELP for commands.", ""],
      input: "", cwd: "C:\\", hist: [], histIx: -1, scroll: 0
    };
    const print = t => { for (const l of String(t).split("\n")) S.lines.push(l); S.scroll = 0; };
    const prompt = () => S.cwd + ">";

    const exec = raw => {
      print(prompt() + raw);
      const parts = raw.trim().split(/\s+/);
      const cmd = (parts[0] || "").toUpperCase();
      const arg = raw.trim().slice(parts[0] ? parts[0].length : 0).trim();
      const abs = p => {
        p = (p || "").toUpperCase();
        if (/^[A-Z]:/.test(p)) return p.length === 2 ? p + "\\" : p;
        return (S.cwd.endsWith("\\") ? S.cwd : S.cwd + "\\") + p;
      };
      if (!cmd) return;
      switch (cmd) {
        case "HELP":
          print("DIR CD TYPE COPY DEL REN MD CLS\nMEM TASKS VER TIME ECHO EXIT\nOr type a program name (SYMAMP...)"); break;
        case "VER":
          print("SymbOS 4.0 (build 2025-01) on " + Sys.plat.name + "\nSymShell 4.0 - simulated for the museum"); break;
        case "CLS": S.lines = []; break;
        case "ECHO": print(arg); break;
        case "TIME": print(new Date().toString().slice(0, 24)); break;
        case "DIR": {
          const p = arg ? abs(arg) : S.cwd;
          const r = FS.resolve(p);
          if (!r || !r.node.d) { print("Directory not found: " + p); break; }
          print("Directory of " + p);
          let total = 0;
          for (const n of FS.list(p)) {
            total += n.d ? 0 : n.s;
            print("  " + n.n.padEnd(14) + (n.d ? "  <DIR>" : FS.fmtSize(n.s).padStart(7)) + "  " + n.t);
          }
          print(FS.fmtSize(total).trim() + " in files, " + FS.freeK(p[0]) + "K free");
          break;
        }
        case "CD": {
          if (!arg) { print(S.cwd); break; }
          if (arg === "..") {
            if (S.cwd.length > 3) { S.cwd = FS.dirOf(S.cwd.replace(/\\$/, "")); if (S.cwd.length === 2) S.cwd += "\\"; }
            break;
          }
          const p = abs(arg);
          const r = FS.resolve(p);
          if (r && r.node.d) S.cwd = p.endsWith("\\") || p.length === 3 ? p : p;
          else print("Directory not found: " + p);
          break;
        }
        case "TYPE": {
          const r = FS.resolve(abs(arg));
          if (!r || r.node.d) { print("File not found: " + arg); break; }
          print(r.node.c !== undefined ? r.node.c : "[binary data, " + FS.fmtSize(r.node.s) + " - looks important]");
          break;
        }
        case "COPY": {
          const [a, b] = arg.split(/\s+/);
          if (!a || !b) { print("Usage: COPY file targetdir"); break; }
          const err = FS.copy(abs(a), abs(b));
          print(err || "1 file copied.");
          break;
        }
        case "DEL": { const err = FS.del(abs(arg)); print(err || "Deleted."); break; }
        case "REN": {
          const [a, b] = arg.split(/\s+/);
          if (!a || !b) { print("Usage: REN file newname"); break; }
          print(FS.ren(abs(a), b) || "Renamed.");
          break;
        }
        case "MD": { print(FS.mkdir(S.cwd, arg) || "Directory created."); break; }
        case "MEM": {
          print("Banked memory report (" + KRN.bankK + "K banks):");
          KRN.banks().forEach((b, i) => {
            let label = b.free ? "free" : b.label;
            if (b.egg) label = "??? -> HELLO, VISITOR. ENJOY THE MUSEUM.";
            print("  BANK " + U.pad2(i) + ": " + KRN.bankK + "K  " + label);
          });
          print("Total " + KRN.totalK + "K, used " + KRN.usedK() + "K, free " + KRN.freeK() + "K");
          break;
        }
        case "TASKS": {
          print("PID PRI MEM   STATE    NAME");
          for (const t of KRN.tasks)
            print(" " + String(t.pid).padEnd(3) + " " + t.pri + "  " + (t.memK + "K").padEnd(5) + " " +
                  t.state.padEnd(8) + " " + t.name);
          break;
        }
        case "EXIT": win.tryClose(); return;
        default: {
          const a = AppMan.launchByExe(cmd);
          if (a) print("Started " + a.def.exe + " (PID " + a.pid + ")");
          else print("Unknown command or program: " + cmd + "\nType HELP.");
        }
      }
    };

    const term = win.add(new Cv(0, 0, 10, 10, {
      focusable: true,
      onDraw: (x, y, ctl) => {
        G.fill(x, y, ctl.w, ctl.h, G.dark);
        const rows = Math.floor(ctl.h / FH) - 1;
        const start = Math.max(0, S.lines.length - rows - S.scroll);
        G.clip(x, y, ctl.w, ctl.h);
        let yy = y + 2;
        for (let i = start; i < Math.min(S.lines.length, start + rows); i++) {
          G.text(x + 2, yy, S.lines[i], G.light); yy += FH;
        }
        if (S.scroll === 0) {
          const cur = prompt() + S.input;
          G.text(x + 2, yy, cur, G.light);
          if ((Math.floor(Sys.t / 400) & 1) === 0)
            G.fill(x + 2 + G.measure(cur), yy, 5, 7, G.light);
        }
        G.unclip();
      },
      onMouse: ev => {
        if (ev.type === "wheel") S.scroll = U.clamp(S.scroll + (ev.dy > 0 ? -3 : 3), 0, Math.max(0, S.lines.length - 5));
      },
      onKey: e => {
        const k = e.key;
        if (k.length === 1 && !e.ctrlKey && !e.altKey) { S.input += k; SND.key(); return true; }
        if (k === "Backspace") { S.input = S.input.slice(0, -1); return true; }
        if (k === "Enter") {
          const cmd = S.input; S.input = "";
          if (cmd.trim()) { S.hist.push(cmd); S.histIx = S.hist.length; }
          exec(cmd);
          return true;
        }
        if (k === "ArrowUp") { if (S.histIx > 0) { S.histIx--; S.input = S.hist[S.histIx] || ""; } return true; }
        if (k === "ArrowDown") {
          if (S.histIx < S.hist.length) { S.histIx++; S.input = S.hist[S.histIx] || ""; }
          return true;
        }
        if (k === "Escape") { S.input = ""; return true; }
        return false;
      }
    }));
    win.focusCtl = term;
    win.onResize = () => { const c = win.content(); term.w = c.w; term.h = c.h; };
    win.onResize();
  }
};

APPDEFS.notepad = {

      },

          { sep: 1 },
          { t: "Close", action: () => win.tryClose() }
        ] },
        { label: "Help", items: () => [
          { t: "About Notepad", action: () => WM.msg("About Notepad",

            { icon: "notepad" }) }
        ] }
      ]
    });
    const ta = win.add(new TxtArea(0, 0, 10, 10, ""));
    ta.onChange = () => { if (!dirty) { dirty = true; setTitle(); } };
    win.focusCtl = ta;
    const setTitle = () => {
      win.title = "Notepad - " + (path ? path.split("\\").pop() : "untitled") + (dirty ? " *" : "");
    };
    const load = p => {
      const r = FS.resolve(p);
      if (!r || r.node.d) return;
      ta.setText(r.node.c !== undefined ? r.node.c : "[binary file]");
      path = p; dirty = false; setTitle();
    };
    const save = as => {
      if (!path || as) {
        filePicker("Save text", { save: true, ext: "TXT", cwd: "C:\\DOCS",
          name: path ? path.split("\\").pop() : "NEW.TXT" }, (p, dir, nm) => {
          const err = FS.writeFile(dir, nm, ta.getText());
          if (err) { WM.msg("Notepad", err, { icon: "err", error: true }); return; }
          path = (dir.endsWith("\\") ? dir : dir + "\\") + U.fname(nm);
          dirty = false; setTitle();
        });
      } else {
        const dir = FS.dirOf(path), nm = path.split("\\").pop();
        const err = FS.writeFile(dir, nm, ta.getText());
        if (err) WM.msg("Notepad", err, { icon: "err", error: true });
        else { dirty = false; setTitle(); }
      }
    };
    win.onResize = () => { const c = win.content(); ta.w = c.w; ta.h = c.h; };
    win.onResize();
    if (args && args.path) load(args.path);
    else setTitle();
  }
};

APPDEFS.calc = {
  name: "Calculator", exe: "CALC.EXE", icon: "calc", memK: 6, cpu: 1, single: true,
  make(app) {
    const win = appWin(app, {
      title: "Calculator", icon: "calc", w: 102, h: 112, x: 60, y: 20,
      resizable: false, maximizable: false
    });
    let disp = "0", acc = null, op = null, fresh = true;
    win.add(new Cv(4, 3, 90, 13, {
      onDraw: (x, y) => {
        G.fill(x, y, 90, 13, ROLE("winBg"));
        G.sunken(x, y, 90, 13, ROLE("hi"), ROLE("sh"));
        const s = disp.slice(0, 14);
        G.text(x + 88 - G.measure(s) - 2, y + 3, s, RC("text"));
      }
    }));
    const press = k => {
      SDN.click();
      if (k >= "0" && k <= "9") {
        if (fresh || disp === "0") { disp = k; fresh = false; }
        else if (disp.length < 12) disp += k;
      } else if (k === ".") {
        if (fresh) { disp = "0."; fresh = false; }
        else if (!disp.includes(".")) disp += ".";
      } else if (k === "C") { disp = "0"; acc = null; op = null; fresh = true; }
      else if (k === "±") { disp = disp.startsWith("-") ? disp.slice(1) : (disp !== "0" ? "-" + disp : disp); }
      else if (["+", "-", "*", "/"].includes(k)) { calc(); op = k; fresh = true; }
      else if (k === "=") { calc(); op = null; fresh = true; }
    };
    const calc = () => {
      const v = parseFloat(disp);
      if (acc === null || op === null) { acc = v; return; }
      let r = op === "+" ? acc + v : op === "-" ? acc - v : op === "*" ? acc * v : (v === 0 ? NaN : acc / v);
      if (!isFinite(r) || isNaN(r)) { disp = "Error"; acc = null; return; }
      r = Math.round(r * 1e8) / 1e8;
      disp = String(r).slice(0, 12); acc = r;
    };
    const rows = [["7", "8", "9", "/"], ["4", "5", "6", "*"], ["1", "2", "3", "-"], ["0", ".", "±", "+"], ["C", "=", "", ""]];
    rows.forEach((row, r) => row.forEach((k, c) => {
      if (!k) return;
      const w = (r === 4) ? 44 : 21;
      const x = (r === 4) ? 4 + c * 46 : 4 + c * 23;
      win.add(new Btn(x, 19 + r * 14, w, 12, k, () => press(k)));
    }));
    win.onKey = e => {
      const map = { Enter: "=", Escape: "C", Backspace: "C" };
      const k = map[e.key] || e.key;
      if ("0123456789.+-*/=C".includes(k) && k.length === 1) { press(k); return true; }
      return false;
    };
  }
};

APPDEFS.clock = {
  name: "Clock", exe: "CLOCK.EXE", icon: "clock", memK: 7, cpu: 1, single: true,
  make(app) {
    const win = appWin(app, {
      title: "Clock", icon: "clock", w: 84, h: 100, x: 90, y: 24,
      resizable: false, maximizable: false
    });
    win.add(new Cv(2, 2, 76, 80, {
      onDraw: (x, y) => {
        const cx = x + 38, cy = y + 34, r = 30;
        for (let a = 0; a < 360; a += 3)
          G.px(cx + Math.round(r * Math.cos(a * Math.PI / 180)),
               cy + Math.round(r * Math.sin(a * Math.PI / 180)), RC("text"));
        for (let h = 0; h < 12; h++) {
          const a = h * Math.PI / 6;
          G.fill(cx + Math.round((r - 4) * Math.sin(a)) - 1,
                 cy - Math.round((r - 4) * Math.cos(a)) - 1, 2, 2, RC("text"));
        }
        const n = new Date();
        const hand = (val, max, len, ink) => {
          const a = val / max * 2 * Math.PI;
          G.line(cx, cy, cx + Math.round(len * Math.sin(a)), cy - Math.round(len * Math.cos(a)), ink);
        };
        hand(n.getHours() % 12 + n.getMinutes() / 60, 12, 15, RC("text"));
        hand(n.getMinutes() + n.getSeconds() / 60, 60, 23, RC("text"));
        hand(n.getSeconds(), 60, 26, RC("accA"));
        G.textC(cx, y + 70, n.toTimeString().slice(0, 8), RC("text"));
      }
    }));
  }
};

    const banks = win.add(new Cv(0, 0, 10, 20, {

        const bs = KRN.banks();
        const cell = Math.max(4, Math.min(8, Math.floor((ctl.w - 4) / bs.length)));
        G.text(x, y, "Banks:", RC("dis"));
        for (let i = 0; i < bs.length; i++) {
          const bx = x + 38 + i * cell;
          if (bx + cell > x + ctl.w) break;
          const b = bs[i];
          const ink = b.egg ? ROLE("accB") : b.free ? ROLE("winBg") : b.sys ? ROLE("accA") : ROLE("sel");
          G.fill(bx, y, cell - 1, 7, ink);
          G.frame(bx, y, cell - 1, 7, ROLE("sh"));
        }
        const hovered = ctl._hover;
        G.text(x, y + 10, hovered || "sys / app / free  (one bank = " + KRN.bankK + "K)", RC("dis"));
      },
      onMouse: ev => {
        const bs = KRN.banks();
        const cell = Math.max(4, Math.min(8, Math.floor((banks.w - 4) / bs.length)));
        const i = Math.floor((ev.x - banks.x - 38 + banks.x) / cell);   // local coords
        const ix = Math.floor((ev.x - 38) / cell);
        banks._hover = (ix >= 0 && ix < bs.length) ?
          ("BANK " + U.pad2(ix) + ": " + (bs[ix].free ? "free" : bs[ix].label)) : null;
      }
    }));
    const refresh = () => {
      list.setItems(KRN.tasks.map(t => ({
        task: t,
        t: String(t.pid).padEnd(4) + t.name.padEnd(11) + String(t.pri).padEnd(4) +
           (t.memK + "K").padEnd(6) + t.state
      })), true);
    };
    let acc = 0;
    app.onTick = dt => { acc += dt; if (acc > 500) { acc = 0; refresh(); } };
    win.onResize = () => {
      const c = win.content();
      list.w = c.w; list.h = Math.max(30, c.h - 9 - 14 - 36 - 22);
      const by = 9 + list.h + 2;
      bKill.x = 0; bKill.y = by; bUp.x = 60; bUp.y = by; bDn.x = 92; bDn.y = by;
      graph.x = 0; graph.y = by + 14; graph.w = c.w;
      banks.x = 0; banks.y = by + 50; banks.w = c.w;
    };
    win.onResize();
    refresh();
  }
};

        for (let c = 0; c < 4; c++) {
          const toks = t.patterns[pat][chs[c]].trim().split(/\s+/);

    app.onKill = () => trk.stop();

/* ---- SymPaint ------------------------------------------------------------------ */
const SGX_GEN = {
  "BOING.SGX": (w, h) => {
    const img = new Array(w * h).fill(G.inkAt(ROLE("winBg"), 0, 0));
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2.4;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy;
      if (d2 <= r * r) {
        const z = Math.sqrt(r * r - d2);
        const u = Math.atan2(dx, z), v = Math.asin(dy / r);
        const check = (Math.floor((u + 2.2) / 0.6) + Math.floor((v + 2.2) / 0.5)) & 1;
        img[y * w + x] = G.inkAt(check ? ROLE("accA") : ROLE("hi"), x, y);
      } else img[y * w + x] = G.inkAt(ROLE("desk"), x, y);
    }
    return img;
  },
  "SUNSET.SGX": (w, h) => {
    const img = new Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const t = y / h;
      let ink = t < 0.3 ? ROLE("accB") : t < 0.55 ? [G.inkAt(ROLE("accB"), 0, 0), G.inkAt(ROLE("accA"), 0, 0)] :
                t < 0.75 ? ROLE("accA") : ROLE("border");
      img[y * w + x] = G.inkAt(ink, x, y);
      const scx = w * 0.6, scy = h * 0.42, sr = h / 6;
      if ((x - scx) * (x - scx) + (y - scy) * (y - scy) < sr * sr && t < 0.75)
        img[y * w + x] = G.inkAt(ROLE("hi"), x, y);
    }
    return img;
  },
  "LOGO.SGX": (w, h) => {
    const img = new Array(w * h).fill(G.inkAt(ROLE("title"), 0, 0));
    // big chunky S
    const midx = Math.floor(w / 2) - 12;
    const rows = ["XXXXXXXX", "XX......", "XX......", "XXXXXXXX", "......XX", "......XX", "XXXXXXXX"];
    rows.forEach((row, ry) => {
      for (let rx = 0; rx < row.length; rx++)
        if (row[rx] === "X")
          for (let py = 0; py < 4; py++) for (let px = 0; px < 3; px++)
            img[(8 + ry * 4 + py) * w + (midx + rx * 3 + px)] = G.inkAt(ROLE("hi"), rx, ry);
    });
    return img;
  }
};

APPDEFS.paint = {
  name: "SymPaint", exe: "SYMPAINT.EXE", icon: "paint", memK: 22, cpu: 3,
  make(app, args) {
    const IW = 80, IH = 56, Z = 2;
    let img = new Array(IW * IH).fill(G.inkAt(ROLE("winBg"), 0, 0));
    let colA = RC("text"), colB = G.inkAt(ROLE("winBg"), 0, 0);
    let tool = "pen", dither = false, start = null, preview = null, dirty = false, path = null;
    const W0 = IW * Z + 74, H0 = IH * Z + 40;
    const win = appWin(app, {
      title: "SymPaint", icon: "paint", w: Math.min(W0, G.W - 8), h: Math.min(H0, WM.deskH() - 4),
      x: 24, y: 8, resizable: false, maximizable: false,
      menu: [
        { label: "File", items: () => [
          { t: "New", action: () => { img.fill(G.inkAt(ROLE("winBg"), 0, 0)); path = null; dirty = false; } },
          { t: "Open...", action: () => filePicker("Open image", { ext: "SGX", cwd: "C:\\PICTURES" }, p => load(p)) },
          { t: "Save as...", action: () => save() },
          { sep: 1 },
          { t: "Close", action: () => win.tryClose() }
        ] },
        { label: "Help", items: () => [
          { t: "About SymPaint", action: () => WM.msg("About SymPaint",
            "SymPaint 4.0 - " + G.pal.length + " colours and every dither between them. Doubles as the icon editor, as tradition demands.",
            { icon: "paint" }) }
        ] }
      ]
    });
    const load = p => {
      const r = FS.resolve(p);
      if (!r) return;
      if (r.node.c) {
        try {
          const d = JSON.parse(r.node.c);
          if (d.w === IW && d.data) { img = d.data.map(v => v % G.pal.length); path = p; return; }
        } catch (e) {}
      }
      const gen = SGX_GEN[r.node.n];
      if (gen) { img = gen(IW, IH); path = p; }
    };
    const save = () => {
      filePicker("Save image", { save: true, ext: "SGX", cwd: "C:\\PICTURES", name: path ? path.split("\\").pop() : "NEW.SGX" },
        (p, dir, nm) => {
          const err = FS.writeFile(dir, nm, JSON.stringify({ w: IW, h: IH, data: img }));
          if (err) WM.msg("SymPaint", err, { icon: "err", error: true });
          else { path = p; dirty = false; }
        });
    };
    const setPx = (x, y, erase) => {
      if (x < 0 || y < 0 || x >= IW || y >= IH) return;
      const ink = erase ? colB : (dither ? [colA, colB] : colA);
      img[y * IW + x] = G.inkAt(ink, x, y);
      dirty = true;
    };
    const lineTo = (x0, y0, x1, y1, erase) => {
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
      const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) {
        setPx(x0, y0, erase);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
    };
    const flood = (x, y) => {
      const target = img[y * IW + x];
      const ink = dither ? [colA, colB] : colA;
      if (typeof ink === "number" && ink === target) return;
      const q = [[x, y]], seen = new Set([y * IW + x]);
      while (q.length) {
        const [cx, cy] = q.pop();
        img[cy * IW + cx] = G.inkAt(ink, cx, cy);
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
          const nx = cx + dx, ny = cy + dy, k = ny * IW + nx;
          if (nx >= 0 && ny >= 0 && nx < IW && ny < IH && !seen.has(k) && img[k] === target) {
            seen.add(k); q.push([nx, ny]);
          }
        });
      }
      dirty = true;
    };
    let last = null;
    const canvas = win.add(new Cv(0, 0, IW * Z, IH * Z, {
      onDraw: (x, y) => {
        for (let py = 0; py < IH; py++) for (let px = 0; px < IW; px++)
          G.fill(x + px * Z, y + py * Z, Z, Z, img[py * IW + px]);
        if (preview) {
          const [x0, y0, x1, y1] = preview;
          if (tool === "line") G.line(x + x0 * Z, y + y0 * Z, x + x1 * Z, y + y1 * Z, colA);
          else G.frame(x + Math.min(x0, x1) * Z, y + Math.min(y0, y1) * Z,
                       (Math.abs(x1 - x0) + 1) * Z, (Math.abs(y1 - y0) + 1) * Z, colA);
        }
        G.frame(x - 1, y - 1, IW * Z + 2, IH * Z + 2, ROLE("sh"));
      },
      onMouse: ev => {
        const px = Math.floor(ev.x / Z), py = Math.floor(ev.y / Z);
        const erase = ev.btn === 2;
        if (ev.type === "down") {
          if (tool === "pen") { setPx(px, py, erase); last = [px, py]; }
          else if (tool === "fill") flood(U.clamp(px, 0, IW - 1), U.clamp(py, 0, IH - 1));
          else { start = [px, py]; preview = [px, py, px, py]; }
        } else if (ev.type === "drag") {
          if (tool === "pen" && last) { lineTo(last[0], last[1], px, py, erase); last = [px, py]; }
          else if (start) preview = [start[0], start[1], U.clamp(px, 0, IW - 1), U.clamp(py, 0, IH - 1)];
        } else if (ev.type === "up") {
          if (tool === "line" && start) lineTo(start[0], start[1], U.clamp(px, 0, IW - 1), U.clamp(py, 0, IH - 1));
          if (tool === "rect" && start) {
            const [x0, y0] = start, x1 = U.clamp(px, 0, IW - 1), y1 = U.clamp(py, 0, IH - 1);
            lineTo(x0, y0, x1, y0); lineTo(x1, y0, x1, y1); lineTo(x1, y1, x0, y1); lineTo(x0, y1, x0, y0);
          }
          start = null; preview = null; last = null;
        }
      }
    }));
    win.cursorFor = (lx, ly) => canvas.hit(lx, ly) ? "cross" : null;
    // tools column
    const tx = IW * Z + 4;
    ["pen", "line", "rect", "fill"].forEach((t, i) => {
      const b = win.add(new Btn(tx, i * 14, 30, 12, t, () => {
        tool = t;
        toolBtns.forEach(bb => bb.sel = false);
      }));
      b._tool = t;
    });
    const toolBtns = win.ctls.filter(c => c._tool);
    win.add(new Chk(tx, 58, "dith", dither, v => dither = v));
    win.add(new Cv(tx + 34, 0, 24, 120, {
      onDraw: (x, y) => {
        // palette swatches: left click = A, right = B
        for (let i = 0; i < G.pal.length; i++) {
          const sy = y + i * Math.max(6, Math.floor(110 / G.pal.length));
          G.fill(x, sy, 10, 6, i);
          G.frame(x, sy, 10, 6, ROLE("sh"));
          if (i === colA) G.text(x + 12, sy, "A", RC("text"));
          if (i === colB) G.text(x + 18, sy, "B", RC("text"));
        }
      },
      onMouse: ev => {
        if (ev.type !== "down") return;
        const rowH = Math.max(6, Math.floor(110 / G.pal.length));
        const i = Math.floor(ev.y / rowH);
        if (i >= 0 && i < G.pal.length) { if (ev.btn === 2) colB = i; else colA = i; }
      }
    }));
    // status
    win.add(new Cv(0, IH * Z + 2, IW * Z, 10, {
      onDraw: (x, y) => G.text(x, y + 2, tool + (dither ? "+dith " : " ") + IW + "x" + IH + " " + G.pal.length + "col", RC("dis"))
    }));
    if (args && args.path) load(args.path);
  }
};

/* ---- Video Player: the party piece ----------------------------------------------- */
APPDEFS.video = {
  name: "Video Player", exe: "SYMVIDEO.EXE", icon: "video", memK: 18, cpu: 2, single: true,
  make(app) {
    const VW = 96, VH = 64;
    let playing = false, frame = 0;
    const win = appWin(app, {
      title: "Video Player", icon: "video", w: VW + 12, h: VH + 46, x: 46, y: 14,
      resizable: false, maximizable: false
    });
    const screen = win.add(new Cv(2, 2, VW, VH, {
      onDraw: (x, y) => {
        // 6fps chunky animation, generated per frame
        const f = frame;
        G.clip(x, y, VW, VH);
        // dithered sky + ground
        G.fill(x, y, VW, 40, ROLE("titleIn"));
        G.fill(x, y + 40, VW, VH - 40, [G.inkAt(ROLE("desk"), 0, 0), G.dark]);
        // starfield
        for (let i = 0; i < 14; i++) {
          const sx = (i * 37 + f * (2 + i % 3)) % VW;
          G.px(x + VW - sx, y + (i * 13) % 36, G.light);
        }
        // bouncing dithered ball
        const bx = 10 + (f * 3) % (VW - 30);
        const phase = (f % 24) / 24;
        const by = 8 + Math.abs(Math.sin(phase * Math.PI)) * 28;
        for (let dy = -8; dy <= 8; dy++) for (let dx = -8; dx <= 8; dx++) {
          if (dx * dx + dy * dy > 64) continue;
          const check = ((dx + 8 + (f & 7)) >> 2 & 1) ^ ((dy + 8) >> 2 & 1);
          G.px(x + bx + dx, y + Math.round(by) + dy, G.inkAt(check ? ROLE("accA") : ROLE("hi"), dx, dy));
        }
        // scroller
        const msg = "VIDEO ON AN 8-BIT MICRO * 96x64 * " + (G.pal.length <= 4 ? "4" : "16") + " COLOURS * NO TRICKS ONLY BANKS * ";
        const off = (f * 4) % (msg.length * FW);
        G.text(x + VW - off, y + VH - 10, msg + msg, G.light);
        G.unclip();
        G.frame(x - 1, y - 1, VW + 2, VH + 2, ROLE("sh"));
      }
    }));
    let acc = 0;
    app.onTick = dt => {
      if (!playing) return;
      acc += dt;
      while (acc > 166) { acc -= 166; frame++; }   // ~6 fps, proudly
    };
    win.add(new Btn(2, VH + 6, 30, 12, "►", () => { playing = true; app.task.cpu = 22; }));
    win.add(new Btn(34, VH + 6, 30, 12, "||", () => { playing = false; app.task.cpu = 2; }));
    win.add(new Btn(66, VH + 6, 30, 12, "|<", () => { frame = 0; }));
    win.add(new Cv(2, VH + 20, VW, 10, {
      onDraw: (x, y) => G.text(x, y, "FRM " + String(frame % 1000).padStart(3, "0") + "  6 FPS  3K/frame", RC("dis"))
    }));
  }
};

APPDEFS.irc = {
  name: "IRC Client", exe: "IRC.EXE", icon: "irc", memK: 16, cpu: 2, single: true,
  make(app) {
    const W0 = Math.min(300, G.W - 16), H0 = Math.min(160, WM.deskH() - 12);
    const win = appWin(app, {
      title: "IRC - #symbos", icon: "irc", w: W0, h: H0, x: 8, y: 10,
      minW: 220, minH: 100,
      status: () => NET.online ? "Connected via " + NET.hw() + "  lag 0.4s (simulated)" : "OFFLINE - Network Daemon is down"
    });
    const chat = win.add(new ListBox(0, 0, 10, 10, { rowH: 8 }));
    const users = win.add(new ListBox(0, 0, 62, 10, { rowH: 8 }));
    const input = win.add(new Edit(0, 0, 10, "", { onEnter: v => send(v) }));
    win.focusCtl = input;
    const lines = [];
    const addLine = (nick, text) => {
      const pre = nick ? "<" + nick + "> " : "";
      for (const l of wrapText(pre + text, Math.floor((chat.w - 14) / FW)))
        lines.push({ t: l });
      chat.setItems(lines.slice(), true);
      chat.sb.top = Math.max(0, lines.length - chat.visRows());
    };
    users.setItems([{ t: "@" + IRC_USERS[0] }, ...IRC_USERS.slice(1).map(u => ({ t: " " + u }))]);
    const send = v => {
      if (!v.trim()) return;
      input.text = ""; input.cur = 0;
      if (!NET.online) { addLine(null, "* cannot send: daemon offline"); return; }
      addLine(ST.d.nick, v);
      respond(v.toLowerCase());
    };
    const respond = v => {
      const say = (nick, text, delay) => setTimeout(() => {
        if (WM.wins.includes(win)) addLine(nick, text);
      }, delay);
      if (/when.*(next|version|release|4\.1|5\.0)|next version/.test(v))
        say("prodatron", "when it's done :)", 1600);
      else if (/doom|raycast|3d/.test(v))
        say("bankswitch", "the maze demo in GAMES is the local homage. real thing ran DOOM-style rendering on a CPC, windowed. we do not talk about how", 1800);
      else if (/hello|hi |hey|moin/.test(v + " "))
        say(U.pick(["z80wrangler", "msxmaniac", "nextwave"]), "moin " + ST.d.nick + "! welcome to the politest channel on the retro net", 1400);
      else if (/museum|exhibit|simulat/.test(v))
        say("crtcpoet", "you're IN the museum? wave at the visitors. tell them the real one is at symbos.de", 1700);
      else if (/msx|cpc|pcw|spectrum|next/.test(v))
        say("msxmaniac", "correct machine opinion detected. carry on", 1500);
      else if (/\?/.test(v))
        say(U.pick(IRC_USERS), U.pick(["good question. answer is banks. it's always banks",
          "have you tried opening the task manager and admiring it until the feeling passes?",
          "yes. and on a PCW it's even dithered"]), 2000);
      else if (Math.random() < 0.5)
        say(U.pick(IRC_USERS.slice(1)), U.pick(["+1", "this", "chunky pixels agree with you",
          "log it in DOCS\\TODO.TXT with the other dreams"]), 2400);
    };
    // ambient chatter
    let ambT = 15000 + U.rnd(15000);
    app.onTick = dt => {
      ambT -= dt;
      if (ambT <= 0) {
        ambT = 22000 + U.rnd(26000);
        if (NET.online) { const [n, t] = U.pick(IRC_AMBIENT); addLine(n, t); }
      }
    };
    win.onResize = () => {
      const c = win.content();
      users.x = c.w - 62; users.h = c.h - 14;
      chat.w = c.w - 64; chat.h = c.h - 14;
      input.y = c.h - 12; input.w = c.w;
      chat.setItems(lines.slice(), true);
    };
    win.onResize();
    const start = () => {
      addLine(null, "* Connecting to irc.simulated.net...");
      addLine(null, "* Joined #symbos (" + (IRC_USERS.length + 1) + " users)");
      for (const [n, t] of IRC_BACKLOG) addLine(n, t);
      addLine(null, "* You are " + ST.d.nick);
      users.setItems([...IRC_USERS.map(u => ({ t: (u === "prodatron" ? "@" : " ") + u })), { t: " " + ST.d.nick }]);
    };
    if (!ST.d.nick) {
      WM.prompt("IRC", "Choose a nickname:", "visitor" + (100 + U.rnd(900)), v => {
        ST.d.nick = U.fname(v || "VISITOR").replace(".", "").toLowerCase() || "visitor"; ST.save();
        start();
      }, { icon: "irc" });
    } else start();
  }
};

      focusable: true,
      onDraw: (x, y, ctl) => {
        G.fill(x, y, ctl.w, ctl.h, G.dark);
        const rows = Math.floor(ctl.h / FH);
        const start = Math.max(0, lines.length - rows);
        G.clip(x, y, ctl.w, ctl.h);
        for (let i = 0; i < rows && start + i < lines.length; i++)
          G.text(x + 2, y + 2 + i * FH, lines[start + i], G.light);
        if ((Math.floor(Sys.t / 400) & 1) === 0)
          G.fill(x + 2 + G.measure(lines[lines.length - 1] || ""), y + 2 + (Math.min(rows, lines.length) - 1) * FH, 5, 7, G.light);
        G.unclip();
      },
      onKey: e => {
        const k = e.key.toUpperCase();
        if (!NET.online) { lines.push("NO CARRIER (daemon offline)"); return true; }
        if (k.length !== 1) return false;
        lines[lines.length - 1] += k;

        if (screen === "main") {
          if ("BFWS".includes(k)) { lines.push(""); show(k.toLowerCase()); }
          else if (k === "G") { lines.push("", "NO CARRIER", "(call again any time)"); screen = "dead"; }
          else lines.push("", "Try B, F, W, S or G.", "Command:");
        } else if (screen !== "dead") {
          if (k === "Q") { lines.push(""); show("main"); }
          else lines.push("", "[Q] goes back.", "Command:");
        }
        return true;
      }
    }));
    win.focusCtl = term;
    win.onResize = () => { const c = win.content(); term.w = c.w; term.h = c.h; };

  }
};

        G.clip(x + 2, y + 2, ctl.w - 12, ctl.h - 4);
        for (let i = 0; i < v; i++) {
          const li = sb.top + i;
          if (li >= view._lines.length) break;
          const ln = view._lines[li];
          const yy = y + 2 + i * FH;
          if (ln.big) G.textBig(x + 4, yy, ln.t, RC("title"));
          else if (ln.hr) G.hline(x + 4, yy + 3, ctl.w - 20, ROLE("sh"));
          else if (ln.link) {
            G.text(x + 4, yy, ln.t, RC("sel"));
            G.hline(x + 4, yy + 7, G.measure(ln.t), ROLE("sel"));
          }
          else G.text(x + 4, yy, ln.t, RC("text"));
        }
        G.unclip();
        sb.draw(x + ctl.w - 9, y + 1, ctl.h - 2, view._lines.length, v);
      },
      onMouse: ev => {
        const v = Math.floor((view.h - 4) / FH);
        if (sb.mouse(ev, view.x + view.w - 9, view.y + 1, view.h - 2, view._lines.length, v)) return;
        if (ev.type === "wheel") { sb.top += ev.dy > 0 ? 3 : -3; sb.clampTop(view._lines.length, v); return; }
        if (ev.type === "down") {
          const li = sb.top + Math.floor((ev.y - view.y - 2) / FH);
          const ln = view._lines[li];
          if (ln && ln.link) {
            if (ln.link.startsWith("play:")) AppMan.launch("symamp", { file: ln.link.slice(5) });
            else nav(ln.link);
          }
        }
      }
    }));
    view._lines = [];
    const sb = new VScroll();
    const layout = () => {
      const page = WEBPAGES[url];
      addr.text = url; addr.cur = url.length;
      const maxCh = Math.floor((view.w - 18) / FW);
      const lines = [];
      if (!NET.online) {
        lines.push({ t: "The Network Daemon is offline." }, { t: "" },
                    { t: "Right-click the systray plug to" }, { t: "bring it back." });
      } else if (!page) {
        lines.push({ big: 1, t: "404" }, { t: "" }, { t: "No such page on the simulated" },
                    { t: "web. It is a small web." }, { t: "" }, { link: "symb://home", t: "Take me home" });
      } else {
        win.title = "SymSurf - " + page.title;
        for (const b of page.blocks) {
          if (b.h1) { lines.push({ big: 1, t: b.h1 }, { t: "" }); }
          else if (b.hr) lines.push({ hr: 1 }, { t: "" });
          else if (b.link) { lines.push({ link: b.link, t: b.t }); lines.push({ t: "" }); }
          else for (const l of wrapText(b.p, maxCh)) lines.push({ t: l });
          if (b.p) lines.push({ t: "" });
        }
      }
      view._lines = lines;
      sb.top = 0;
    };
    const nav = u => {
      if (u === url) { layout(); return; }
      history.push(url);
      url = u;
      Sys.busyUntil = Sys.t + 250;
      layout();
    };
    win.cursorFor = (lx, ly) => {
      if (!view.hit(lx, ly)) return null;
      const li = sb.top + Math.floor((ly - view.y - 2) / FH);
      return view._lines[li] && view._lines[li].link ? "cross" : null;
    };
    win.onResize = () => {
      const c = win.content();
      addr.w = c.w - 26; view.w = c.w; view.h = c.h - 14;
      layout();
    };
    win.onResize();
  }
};

/* ---- SokoSym --------------------------------------------------------------- */
const SOKO_LEVELS = [
  ["#######",
   "#     #",
   "# @$. #",
   "#     #",
   "#######"],
  ["########",
   "#      #",
   "# .$@  #",
   "#  $.  #",
   "#      #",
   "########"],
  ["########",
   "#  #   #",
   "# .$   #",
   "# #$#  #",
   "# . @  #",
   "#      #",
   "########"],
  ["#########",
   "#   #   #",
   "# $ . $ #",
   "# . @ . #",
   "# $ . $ #",
   "#   #   #",
   "#########"]
];
APPDEFS.soko = {
  name: "SokoSym", exe: "SOKOSYM.EXE", icon: "soko", memK: 9, cpu: 4,
  make(app) {
    const CELL = 12;
    let lvl = 0, grid, px, py, moves, solved;
    const load = n => {
      lvl = U.clamp(n, 0, SOKO_LEVELS.length - 1);
      grid = SOKO_LEVELS[lvl].map(r => r.split(""));
      moves = 0; solved = false;
      grid.forEach((row, y) => row.forEach((c, x) => {
        if (c === "@" || c === "+") { px = x; py = y; row[x] = c === "+" ? "." : " "; }
      }));
      const gw = grid[0].length * CELL, gh = grid.length * CELL;
      win.w = gw + 8; win.h = gh + 40;
      board.w = gw; board.h = gh;
      win.clampToScreen();
    };
    const win = appWin(app, {
      title: "SokoSym", icon: "soko", w: 100, h: 100, x: 40, y: 16,
      resizable: false, maximizable: false,
      status: () => "Level " + (lvl + 1) + "/" + SOKO_LEVELS.length + "  moves " + moves +
        (ST.d.scores["soko" + lvl] ? "  best " + ST.d.scores["soko" + lvl] : "") +
        (solved ? "  SOLVED! N=next" : "")
    });
    const board = win.add(new Cv(2, 2, 10, 10, {
      focusable: true,
      onDraw: (x, y) => {
        grid.forEach((row, gy) => row.forEach((c, gx) => {
          const cx = x + gx * CELL, cy = y + gy * CELL;
          if (c === "#") {
            G.fill(cx, cy, CELL, CELL, ROLE("titleIn"));
            G.bevel(cx, cy, CELL, CELL, ROLE("hi"), ROLE("sh"));
          } else {
            G.fill(cx, cy, CELL, CELL, ROLE("winBg"));
            if (c === "." || c === "*") {
              G.frame(cx + 4, cy + 4, 4, 4, RC("accA"));
            }
            if (c === "$" || c === "*") {
              G.fill(cx + 1, cy + 1, CELL - 2, CELL - 2, c === "*" ? ROLE("accA") : ROLE("accB"));
              G.frame(cx + 1, cy + 1, CELL - 2, CELL - 2, ROLE("border"));
              G.line(cx + 1, cy + 1, cx + CELL - 2, cy + CELL - 2, RC("border"));
            }
          }
          if (gx === px && gy === py) {
            G.fill(cx + 3, cy + 2, 6, 6, ROLE("sel"));
            G.fill(cx + 4, cy + 8, 4, 3, ROLE("sel"));
            G.frame(cx + 3, cy + 2, 6, 6, ROLE("border"));
          }
        }));
      },
      onKey: e => {
        const k = e.key;
        if (k === "r" || k === "R") { load(lvl); return true; }
        if ((k === "n" || k === "N") && solved) { load(lvl + 1); return true; }
        const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[k];
        if (!d || solved) return false;
        const [dx, dy] = d;
        const c1 = grid[py + dy][px + dx];
        if (c1 === "#") return true;
        if (c1 === "$" || c1 === "*") {
          const c2 = grid[py + 2 * dy][px + 2 * dx];
          if (c2 === "#" || c2 === "$" || c2 === "*") return true;
          grid[py + dy][px + dx] = c1 === "*" ? "." : " ";
          grid[py + 2 * dy][px + 2 * dx] = c2 === "." ? "*" : "$";
        }
        px += dx; py += dy; moves++;
        SND.key();
        if (!grid.some(row => row.includes("$"))) {
          solved = true;
          const key = "soko" + lvl;
          if (!ST.d.scores[key] || moves < ST.d.scores[key]) { ST.d.scores[key] = moves; ST.save(); }
          SDN.play("info");
          if (lvl === SOKO_LEVELS.length - 1)
            WM.msg("SokoSym", "All crates warehoused. The dockworkers of #symbos salute you.", { icon: "soko" });
        }
        return true;
      }
    }));
    win.focusCtl = board;
    load(0);
  }
};

/* ---- Slide 2048 --------------------------------------------------------------- */
APPDEFS.g2048 = {
  name: "Slide 2048", exe: "SLIDE2K.EXE", icon: "g2048", memK: 8, cpu: 3,
  make(app) {
    const CELL = 20;
    let g, score;
    const reset = () => {
      g = new Array(16).fill(0); score = 0;
      spawn(); spawn();
    };
    const spawn = () => {
      const empties = g.map((v, i) => v ? -1 : i).filter(i => i >= 0);
      if (empties.length) g[U.pick(empties)] = Math.random() < 0.9 ? 2 : 4;
    };
    const win = appWin(app, {
      title: "Slide 2048", icon: "g2048", w: CELL * 4 + 8, h: CELL * 4 + 40, x: 70, y: 18,
      resizable: false, maximizable: false,
      status: () => "Score " + score + "  best " + (ST.d.scores.g2048 || 0)
    });
    const inks = () => [ROLE("winBg"), ROLE("accB"), ROLE("accA"), ROLE("sel"),
                        ROLE("titleIn"), [RC("accA"), RC("accB")], [RC("sel"), RC("accA")], ROLE("border")];
    const board = win.add(new Cv(2, 2, CELL * 4, CELL * 4, {
      focusable: true,
      onDraw: (x, y) => {
        const I = inks();
        for (let i = 0; i < 16; i++) {
          const cx = x + (i % 4) * CELL, cy = y + Math.floor(i / 4) * CELL;
          const v = g[i];
          const ink = v ? I[Math.min(I.length - 1, Math.round(Math.log2(v)))] : ROLE("face");
          G.fill(cx + 1, cy + 1, CELL - 2, CELL - 2, ink);
          G.frame(cx, cy, CELL, CELL, ROLE("sh"));
          if (v) {
            const s = String(v);
            const fg = v <= 4 ? RC("text") : RC("selFg");
            G.textC(cx + CELL / 2, cy + CELL / 2 - 3, s, fg);
          }
        }
      },
      onKey: e => {
        const dir = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 }[e.key];
        if (dir === undefined) {
          if (e.key === "r" || e.key === "R") { reset(); return true; }
          return false;
        }
        const before = g.join(",");
        // rotate → slide left → unrotate
        const rot = a => { const b = new Array(16); for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) b[c * 4 + (3 - r)] = a[r * 4 + c]; return b; };
        for (let i = 0; i < dir; i++) g = rot(g);
        for (let r = 0; r < 4; r++) {
          let row = g.slice(r * 4, r * 4 + 4).filter(v => v);
          for (let i = 0; i < row.length - 1; i++)
            if (row[i] === row[i + 1]) { row[i] *= 2; score += row[i]; row.splice(i + 1, 1); }
          while (row.length < 4) row.push(0);
          for (let c = 0; c < 4; c++) g[r * 4 + c] = row[c];
        }
        for (let i = 0; i < (4 - dir) % 4; i++) g = rot(g);
        if (g.join(",") !== before) { spawn(); SND.key(); }
        if (score > (ST.d.scores.g2048 || 0)) { ST.d.scores.g2048 = score; ST.save(); }
        if (g.includes(2048)) WM.msg("Slide 2048", "2048! That number is eight times this machine's RAM in K. Absurd. Well slid.", { icon: "g2048" });
        return true;
      }
    }));
    win.focusCtl = board;
    reset();
  }
};

/* ---- ChessSym -------------------------------------------------------------------- */
APPDEFS.chess = {
  name: "ChessSym", exe: "CHESSSYM.EXE", icon: "chess", memK: 12, cpu: 6,
  make(app) {
    const CELL = 13, BX = 6, BY = 2;
    const VAL = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 100 };
    let board, turn, sel, gameOver, scripted, thinkT = 0, statusMsg;
    const initPos = () => {
      board = new Array(64).fill(null);
      const back = ["R", "N", "B", "Q", "K", "B", "N", "R"];
      for (let i = 0; i < 8; i++) {
        board[i] = "b" + back[i]; board[8 + i] = "bP";
        board[48 + i] = "wP"; board[56 + i] = "w" + back[i];
      }
      turn = "w"; sel = -1; gameOver = false;
      scripted = [["g8", "h6"], ["h6", "g8"], ["g8", "h6"]];   // the museum shuffle
      statusMsg = "Your move (white).";
    };
    const sq = s => (8 - parseInt(s[1])) * 8 + (s.charCodeAt(0) - 97);
    const moves = from => {   // pseudo-legal
      const p = board[from];
      if (!p) return [];
      const col = p[0], kind = p[1], out = [];
      const fx = from % 8, fy = Math.floor(from / 8);
      const add = (x, y, cap) => {
        if (x < 0 || y < 0 || x > 7 || y > 7) return false;
        const t = board[y * 8 + x];
        if (t && t[0] === col) return false;
        if (t && cap === false) return false;
        if (!t && cap === true) return false;
        out.push(y * 8 + x);
        return !t;
      };
      const ray = (dx, dy) => { let x = fx + dx, y = fy + dy; while (add(x, y)) { x += dx; y += dy; } };
      if (kind === "P") {
        const d = col === "w" ? -1 : 1;
        if (add(fx, fy + d, false) && ((col === "w" && fy === 6) || (col === "b" && fy === 1)))
          add(fx, fy + 2 * d, false);
        add(fx - 1, fy + d, true); add(fx + 1, fy + d, true);
      } else if (kind === "N") {
        [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]].forEach(([dx, dy]) => add(fx + dx, fy + dy));
      } else if (kind === "K") {
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++)
          if (dx || dy) add(fx + dx, fy + dy);
      } else {
        if (kind !== "B") { ray(1, 0); ray(-1, 0); ray(0, 1); ray(0, -1); }
        if (kind !== "R") { ray(1, 1); ray(-1, 1); ray(1, -1); ray(-1, -1); }
      }
      return out;
    };
    const doMove = (from, to) => {
      const cap = board[to];
      board[to] = board[from]; board[from] = null;
      // promotion
      if (board[to][1] === "P" && (Math.floor(to / 8) === 0 || Math.floor(to / 8) === 7))
        board[to] = board[to][0] + "Q";
      if (cap && cap[1] === "K") {
        gameOver = true;
        statusMsg = cap[0] === "b" ? "You captured the king! ChessSym resigns with dignity." :
                                     "ChessSym wins. It only needed 12K to do it.";
        WM.msg("ChessSym", statusMsg, { icon: "chess" });
        return;
      }
      turn = turn === "w" ? "b" : "w";
      if (turn === "b") { thinkT = 500 + U.rnd(500); statusMsg = "ChessSym is thinking in 12K..."; }
      else statusMsg = "Your move (white).";
    };
    const aiMove = () => {
      // the same cheeky opening, every time
      while (scripted.length) {
        const [a, b] = scripted.shift();
        const from = sq(a), to = sq(b);
        if (board[from] && board[from][0] === "b" && moves(from).includes(to)) {
          doMove(from, to);
          if (scripted.length === 0) statusMsg = "The traditional ChessSym opening, complete.";
          return;
        }
      }
      let best = null, bestScore = -1;
      for (let i = 0; i < 64; i++) {
        if (!board[i] || board[i][0] !== "b") continue;
        for (const m of moves(i)) {
          const t = board[m];
          const s = (t ? VAL[t[1]] * 10 : 0) + Math.random() * 5;
          if (s > bestScore) { bestScore = s; best = [i, m]; }
        }
      }
      if (best) doMove(best[0], best[1]);
      else { gameOver = true; statusMsg = "ChessSym has no moves and blames the RAM."; }
    };
    const win = appWin(app, {
      title: "ChessSym", icon: "chess", w: CELL * 8 + BX * 2 + 4, h: CELL * 8 + 42, x: 34, y: 4,
      resizable: false, maximizable: false,
      status: () => statusMsg
    });
    win.add(new Cv(BX, BY, CELL * 8, CELL * 8, {
      focusable: true,
      onDraw: (x, y) => {
        for (let i = 0; i < 64; i++) {
          const cx = x + (i % 8) * CELL, cy = y + Math.floor(i / 8) * CELL;
          const dark = ((i % 8) + Math.floor(i / 8)) & 1;
          G.fill(cx, cy, CELL, CELL, dark ? [RC("winBg"), RC("sh")] : ROLE("winBg"));
          if (i === sel) G.frame(cx, cy, CELL, CELL, ROLE("accA"));
          if (sel >= 0 && moves(sel).includes(i)) G.fill(cx + 5, cy + 5, 3, 3, ROLE("accA"));
          const p = board[i];
          if (p) {
            const white = p[0] === "w";
            G.text(cx + 4 + 1, cy + 3 + 1, p[1], white ? G.dark : G.light);
            G.text(cx + 4, cy + 3, p[1], white ? G.light : G.dark);
          }
        }
        G.frame(x - 1, y - 1, CELL * 8 + 2, CELL * 8 + 2, ROLE("border"));
      },
      onMouse: ev => {
        if (ev.type !== "down" || turn !== "w" || gameOver) return;
        const cx = Math.floor(ev.x / CELL), cy = Math.floor(ev.y / CELL);
        if (cx < 0 || cy < 0 || cx > 7 || cy > 7) return;
        const i = cy * 8 + cx;
        if (sel >= 0 && moves(sel).includes(i)) { doMove(sel, i); sel = -1; SND.key(); }
        else if (board[i] && board[i][0] === "w") sel = i;
        else sel = -1;
      },
      onKey: e => {
        if (e.key === "r" || e.key === "R") { initPos(); return true; }
        return false;
      }
    }));
    win.add(new Btn(BX, CELL * 8 + BY + 3, 60, 11, "New game", () => initPos()));
    app.onTick = dt => {
      if (turn === "b" && !gameOver) {
        thinkT -= dt;
        if (thinkT <= 0) aiMove();
      }
    };
    initPos();
  }
};

/* ---- Maze 3D: the crown jewel ------------------------------------------------------ */
const MAZE_MAP = [
  "################",
  "#..............#",
  "#.####.####.##.#",
  "#.#..#....#..#.#",
  "#.#..#.##.#..#.#",
  "#.#..#.#..#....#",
  "#.####.#.####.##",
  "#......#.....#X#",
  "#.####.#####.#.#",
  "#.#..#.....#.#.#",
  "#.#..#####.#.#.#",
  "#.#........#.#.#",
  "#.#.######.#.#.#",
  "#.#......#...#.#",
  "#.########.###.#",
  "################"
];
APPDEFS.maze = {
  name: "Maze 3D", exe: "MAZE3D.EXE", icon: "maze", memK: 20, cpu: 8,
  make(app) {
    const VW = 96, VH = 64;
    let px = 1.5, py = 1.5, ang = 0.7, fps = 0, frames = 0, fpsT = 0, won = false;
    const win = appWin(app, {
      title: "Maze 3D", icon: "maze", w: VW + 12, h: VH + 42,
      x: G.W - VW - 22, y: WM.deskH() - VH - 48,
      resizable: false, maximizable: false,
      status: () => won ? "EXIT FOUND! R restarts" :
        fps + " FPS on a 4MHz Z80 (heroic)  arrows/WASD"
    });
    const cell = (x, y) => (MAZE_MAP[Math.floor(y)] || "")[Math.floor(x)] || "#";
    const view = win.add(new Cv(2, 2, VW, VH, {
      focusable: true,
      onDraw: (x, y) => {
        frames++;
        // ceiling / floor
        G.fill(x, y, VW, VH / 2, ROLE("border"));
        G.fill(x, y + VH / 2, VW, VH / 2, [G.inkAt(ROLE("desk"), 0, 0), G.dark]);
        const FOV = Math.PI / 3;
        for (let col = 0; col < VW; col += 2) {
          const ra = ang - FOV / 2 + (col / VW) * FOV;
          const cos = Math.cos(ra), sin = Math.sin(ra);
          // DDA
          let mapX = Math.floor(px), mapY = Math.floor(py);
          const dX = Math.abs(1 / (cos || 1e-9)), dY = Math.abs(1 / (sin || 1e-9));
          let stepX, stepY, sideX, sideY;
          if (cos < 0) { stepX = -1; sideX = (px - mapX) * dX; } else { stepX = 1; sideX = (mapX + 1 - px) * dX; }
          if (sin < 0) { stepY = -1; sideY = (py - mapY) * dY; } else { stepY = 1; sideY = (mapY + 1 - py) * dY; }
          let side = 0, tile = "#", guard = 0;
          while (guard++ < 64) {
            if (sideX < sideY) { sideX += dX; mapX += stepX; side = 0; }
            else { sideY += dY; mapY += stepY; side = 1; }
            tile = cell(mapX, mapY);
            if (tile === "#" || tile === "X") break;
          }
          let dist = side === 0 ? sideX - dX : sideY - dY;
          dist *= Math.cos(ra - ang);
          const h = Math.min(VH, Math.floor(VH / Math.max(0.15, dist)));
          const y0 = y + Math.floor((VH - h) / 2);
          // wall shades stay visible on every palette, mono included
          const mono = G.pal.length <= 2;
          const A = mono ? G.light : RC("accA"), D = G.dark;
          let ink;
          if (tile === "X") ink = (Math.floor(Sys.t / 300) & 1) ? (mono ? G.light : ROLE("accB")) : [A, D];
          else if (dist < 2) ink = side ? A : [A, D, 75];
          else if (dist < 4) ink = side ? [A, D] : [A, D, 25];
          else ink = [D, A, 25];
          G.fill(x + col, y0, 2, h, ink);
        }
        if (won) G.textC(x + VW / 2, y + VH / 2 - 4, "EXIT!", G.light);
      },
      onKey: e => {
        if (e.key === "r" || e.key === "R") { px = 1.5; py = 1.5; ang = 0.7; won = false; return true; }
        return ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(e.key);
      }
    }));
    win.focusCtl = view;
    app.onTick = dt => {
      const focused = WM.top() === win && !win.minimized;
      app.task.cpu = focused ? 30 : 8;
      // fps meter
      fpsT += dt;
      if (fpsT > 1000) { fps = Math.min(15, frames); frames = 0; fpsT = 0; }
      if (!focused || won) return;
      const sp = dt / 1000 * 2.2, rot = dt / 1000 * 2.6;
      const K = INP.keys;
      const tryMove = (nx, ny) => {
        if (cell(nx, py) !== "#") px = nx;
        if (cell(px, ny) !== "#") py = ny;
      };
      if (K["ArrowUp"] || K["w"]) tryMove(px + Math.cos(ang) * sp, py + Math.sin(ang) * sp);
      if (K["ArrowDown"] || K["s"]) tryMove(px - Math.cos(ang) * sp, py - Math.sin(ang) * sp);
      if (K["ArrowLeft"] || K["a"]) ang -= rot;
      if (K["ArrowRight"] || K["d"]) ang += rot;
      if (cell(px, py) === "X" && !won) {
        won = true;
        SDN.play("info");
        WM.msg("Maze 3D", "You found the exit. A ray-cast corridor, in a window, while everything else kept running. That is the whole museum lesson in one hallway.", { icon: "maze" });
      }
    };
  }
};

/* ===========================================================================
   MODULE 15 — BOOT MANAGER, MACHINE CHOOSER & MAIN LOOP
   =========================================================================== */
const BOOT = {
  phase: null, t0: 0, lines: [], _cards: [],

  toChooser() {
    Sys.state = "chooser";
    G.setMode(320, 240, [2, 2], PAL.EGA16);
    SCHEMES = schemes16(); SCHEME = SCHEMES[0]; Sys.schemeIx = 0;
  },

  start(id, restart) {
    const plat = platById(id);
    ST.d.machine = id; ST.save();
    applyPlatform(plat);
    Sys.state = "poweron";
    this.t0 = U.now();
    this.phase = "poweron";
    this.lines = [];
    SND.floppy(600);
  },

  finish() {
    const plat = Sys.plat;
    applyPlatform(plat);          // restore platform palette after boot screens
    KRN.boot(plat);
    FS.mount(plat);
    WM.wins.length = 0; WM.popups.length = 0; WM.capture = null; WM.drag = null;
    AppMan.apps.length = 0;
    Sys.state = "desktop";
    ST.d.boots++; ST.save();
    DESK.init();
    SDN.startup();
  },

  powerOff() {
    WM.closePopups(0);
    Sys.state = "off";
  },

  skip() { if (Sys.state === "poweron" || Sys.state === "load") this.finish(); },

  /* ---- drawing ---------------------------------------------------------- */
  draw() {
    const t = U.now() - this.t0;
    if (Sys.state === "poweron") {
      this.drawPowerOn(t);
      if (t > this.powerLen()) { Sys.state = "load"; this.t0 = U.now(); SND.floppy(1800); }
    } else if (Sys.state === "load") {
      this.drawLoad(t);
      if (t > 2500) this.finish();
    }
  },

  powerLen() { return { cpc: 1400, msx: 1200, next: 1100, pcw: 1300, vm: 500 }[Sys.plat.family] || 1000; },

  drawPowerOn(t) {
    const fam = Sys.plat.family;
    const typed = (s, start, speed) => s.slice(0, Math.max(0, Math.floor((t - start) / speed)));
    if (fam === "cpc") {
      // firmware flavour: yellow text on blue
      G.ctx.fillStyle = "#000090"; G.ctx.fillRect(0, 0, G.W, G.H);
      const old = G.pal; G.pal = ["#000090", "#FFFF00", "#00FFFF", "#FFFFFF"]; G.epoch++;
      G.text(8, 8, " Amstrad 128K Microcomputer  (v3)", 1);
      G.text(8, 24, " (c)1985 Amstrad plc", 1);
      G.text(8, 32, "      and Locomotive Software Ltd.", 1);
      if (t > 400) G.text(8, 48, " BASIC 1.1", 1);
      if (t > 600) G.text(8, 64, "Ready", 1);
      if (t > 800) G.text(8, 72, typed("RUN\"SYMBOS", 800, 45), 3);
      G.pal = old; G.epoch++;
    } else if (fam === "msx") {
      G.ctx.fillStyle = "#2020C0"; G.ctx.fillRect(0, 0, G.W, G.H);
      const old = G.pal; G.pal = ["#2020C0", "#FFFFFF", "#40D0FF", "#FFFFFF"]; G.epoch++;
      G.textBig(Math.floor(G.W / 2) - 30, 30, "MSX2", 1);
      G.text(Math.floor(G.W / 2) - 60, 60, "version 2.0  RAM 512K found", 2);
      if (t > 500) G.text(Math.floor(G.W / 2) - 60, 76, typed("SYMBOS.COM loading...", 500, 40), 1);
      G.pal = old; G.epoch++;
    } else if (fam === "next") {
      G.ctx.fillStyle = "#000000"; G.ctx.fillRect(0, 0, G.W, G.H);
      // rainbow flash stripe
      const cols = ["#FF0000", "#FFFF00", "#00FF00", "#00FFFF"];
      const off = Math.floor(t / 60);
      for (let i = 0; i < 4; i++) {
        G.ctx.fillStyle = cols[(i + off) % 4];
        G.ctx.fillRect(G.W - 90 + i * 14 - (t / 30) % 14, 12, 12, 22);
      }
      const old = G.pal; G.pal = ["#000000", "#FFFFFF", "#888888", "#00FFFF"]; G.epoch++;
      G.text(10, 16, "ZX Spectrum Next  1024K", 1);
      if (t > 400) G.text(10, 34, typed(".nextload SYMBOS.SNX", 400, 35), 2);
      if (t > 900) G.text(10, 44, "Turbo 28MHz: because we can", 2);
      G.pal = old; G.epoch++;
    } else if (fam === "pcw") {
      G.ctx.fillStyle = "#000000"; G.ctx.fillRect(0, 0, G.W, G.H);
      const old = G.pal; G.pal = ["#000000", "#F0F0E4"]; G.epoch++;
      if (t > 250) G.text(10, 12, "PCW boot: reading track 0...", 1);
      if (t > 700) G.text(10, 22, "SymbOS boot sector found (this disc is friendlier than CP/M)", 1);
      G.pal = old; G.epoch++;
    } else {
      G.ctx.fillStyle = "#000000"; G.ctx.fillRect(0, 0, G.W, G.H);
      const old = G.pal; G.pal = ["#000000", "#55FF55"]; G.epoch++;
      G.text(10, 12, "SymbOSVM: virtual Z80 attached to host. No solder detected.", 1);
      G.pal = old; G.epoch++;
    }
  },

  drawLoad(t) {
    // SymbOS splash — original rendition
    G.ctx.fillStyle = G.pal[G.inkAt(ROLE("desk"), 0, 0)];
    G.fill(0, 0, G.W, G.H, ROLE("desk"));
    const bw = 190, bh = 92;
    const bx = Math.floor((G.W - bw) / 2), by = Math.floor((G.H - bh) / 2) - 8;
    G.fill(bx, by, bw, bh, ROLE("face"));
    G.bevel(bx, by, bw, bh, ROLE("hi"), ROLE("border"));
    G.icon("symbos", bx + 8, by + 8);
    G.textBig(bx + 30, by + 8, "SymbOS 4.0", RC("title"));
    G.text(bx + 30, by + 24, "for " + Sys.plat.name, RC("text"));
    const msgs = [
      "Kernel 4.0 (build 2025-01)",
      "CPU " + Sys.plat.cpu,
      "RAM " + Sys.plat.ramK + "K in " + Math.floor(Sys.plat.ramK / 16) + " banks",
      "Multitasking scheduler ... OK",
      "Drives " + (Sys.plat.floppy ? "A: C:" : "C:") + " ......... OK",
      "Sound Daemon 4.0 ........ OK",
      "Network Daemon 4.0 ...... OK",
      "Desktop Manager ......... OK"
    ];
    const n = Math.min(msgs.length, Math.floor(t / 260));
    for (let i = 0; i < n; i++) G.text(bx + 8, by + 36 + i * 8 - Math.max(0, (n - 5)) * 8, msgs[i], RC("text"));
    // progress
    const p = U.clamp(t / 2500, 0, 1);
    G.sunken(bx + 8, by + bh - 14, bw - 16, 8, ROLE("hi"), ROLE("sh"));
    G.fill(bx + 10, by + bh - 12, Math.floor((bw - 20) * p), 4, ROLE("sel"));
    const hint = "ESC skips (SymbOS itself would already be done)";
    G.textC(Math.floor(G.W / 2) + 1, by + bh + 7, hint, G.dark);
    G.textC(Math.floor(G.W / 2), by + bh + 6, hint, G.light);
  },

  /* ---- machine chooser ------------------------------------------------------ */
  drawChooser() {
    G.fill(0, 0, G.W, G.H, 0);
    for (let x = 0; x < G.W; x += 4) G.px(x, 0, 8);
    G.textBig(Math.floor(G.W / 2) - 78, 5, "THE OS MUSEUM", 15);
    G.textC(Math.floor(G.W / 2), 21, "SymbOS 4.0 - choose your machine", 7);
    G.textC(Math.floor(G.W / 2), 30, "one OS, every machine - that is the point", 8);
    this._cards = [];
    PLATFORMS.forEach((p, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const x = 8 + col * 156, y = 41 + row * 58, w = 148, h = 54;
      this._cards.push({ x, y, w, h, plat: p });
      G.fill(x, y, w, h, 8);
      G.bevel(x, y, w, h, 7, 0);
      G.clip(x + 2, y + 2, w - 4, h - 4);
      G.text(x + 4, y + 3, p.name, 15);
      G.text(x + 4, y + 12, p.modes.base.colDesc, 11);
      G.text(x + 4, y + 20, p.cpu, 7);
      G.text(x + 4, y + 28, p.ramNote, 7);
      G.text(x + 4, y + 37, p.blurb, 14);
      if (p.variantName) {
        const on = !!ST.d.variants[p.id];
        G.fill(x + 4, y + 45, 7, 7, 0);
        G.frame(x + 4, y + 45, 7, 7, 7);
        if (on) G.text(x + 5, y + 45, "✓", 10);
        G.text(x + 14, y + 45, p.variantName, on ? 10 : 8);
        this._cards[this._cards.length - 1].varBox = { x: x + 4, y: y + 45, w: 128, h: 8 };
      }
      G.unclip();
    });
    const fy = 41 + 58 * 3 + 2;
    G.textC(Math.floor(G.W / 2), fy, "SymbOS is real - Prodatron & friends - symbos.de", 7);
    G.textC(Math.floor(G.W / 2), fy + 9, "unofficial museum homage, original artwork", 8);
  },

  chooserMouse(ev) {
    if (ev.type !== "down") return;
    SND.ensure();
    for (const c of this._cards) {
      if (ev.x >= c.x && ev.x < c.x + c.w && ev.y >= c.y && ev.y < c.y + c.h) {
        if (c.varBox && ev.x >= c.varBox.x && ev.x < c.varBox.x + c.varBox.w &&
            ev.y >= c.varBox.y && ev.y < c.varBox.y + c.varBox.h) {
          ST.d.variants[c.plat.id] = !ST.d.variants[c.plat.id];
          ST.save();
          return;
        }
        this.start(c.plat.id);
        return;
      }
    }
  },

  drawOff() {
    G.ctx.fillStyle = "#000000"; G.ctx.fillRect(0, 0, G.W, G.H);
    const old = G.pal; G.pal = ["#000000", "#404040", "#808080"]; G.epoch++;
    if (Math.floor(Sys.t / 900) & 1)
      G.textC(Math.floor(G.W / 2), Math.floor(G.H / 2), "machine is off - click to power on", 1);
    G.pal = old; G.epoch++;
  }
};

/* ===========================================================================
   INPUT
   =========================================================================== */
const INP = {
  keys: {},
  lastDown: { t: 0, x: -99, y: -99, btn: -1 },
  mx: 160, my: 100,

  init(canvas) {
    canvas.addEventListener("contextmenu", e => e.preventDefault());
    canvas.addEventListener("mousedown", e => {
      canvas.focus();
      SND.ensure();
      const [x, y] = G.toLogical(e.clientX, e.clientY);
      this.mx = x; this.my = y;
      const btn = e.button === 2 ? 2 : 0;
      const now = U.now();
      const isDbl = btn === 0 && now - this.lastDown.t < (ST.d.mouseDbl || 400) &&
                    Math.abs(x - this.lastDown.x) < 5 && Math.abs(y - this.lastDown.y) < 5 &&
                    this.lastDown.btn === 0;
      this.lastDown = { t: isDbl ? 0 : now, x, y, btn };
      this.route({ type: "down", x, y, btn });
      if (isDbl) this.route({ type: "dbl", x, y, btn });
      e.preventDefault();
    });
    canvas.addEventListener("mouseup", e => {
      const [x, y] = G.toLogical(e.clientX, e.clientY);
      this.mx = x; this.my = y;
      this.route({ type: "up", x, y, btn: e.button === 2 ? 2 : 0 });
    });
    canvas.addEventListener("mousemove", e => {
      const [x, y] = G.toLogical(e.clientX, e.clientY);
      this.mx = x; this.my = y;
      this.route({ type: "move", x, y, btn: 0 });
    });
    canvas.addEventListener("wheel", e => {
      const [x, y] = G.toLogical(e.clientX, e.clientY);
      this.route({ type: "wheel", x, y, btn: 0, dy: e.deltaY });
      e.preventDefault();
    }, { passive: false });

    window.addEventListener("keydown", e => {
      this.keys[e.key] = true;
      if (["Tab", "Alt", "F1", "F3", "F5"].includes(e.key) ||
          (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)))
        e.preventDefault();
      if (Sys.state === "poweron" || Sys.state === "load") {
        if (e.key === "Escape") BOOT.skip();
        return;
      }
      if (Sys.state === "off") { BOOT.start(Sys.plat.id); return; }
      if (Sys.state !== "desktop") return;
      SND.ensure();
      // Alt+Tab — new in 4.0
      if (e.key === "Tab" && e.altKey) { WM.startAltTab(); return; }
      if (WM.altTab) { if (e.key === "Escape") WM.altTab = null; return; }
      if (e.key === "Escape" && e.ctrlKey) { DESK.openStart(); return; }
      WM.key(e);
    });
    window.addEventListener("keyup", e => {
      delete this.keys[e.key];
      if (e.key === "Alt" && WM.altTab) WM.commitAltTab();
    });
    window.addEventListener("blur", () => { this.keys = {}; if (WM.altTab) WM.altTab = null; });
  },

  route(ev) {
    if (Sys.state === "chooser") { BOOT.chooserMouse(ev); return; }
    if (Sys.state === "poweron" || Sys.state === "load") {
      if (ev.type === "down") BOOT.skip();
      return;
    }
    if (Sys.state === "off") {
      if (ev.type === "down") BOOT.start(Sys.plat.id);
      return;
    }
    if (Sys.state !== "desktop") return;
    // active desktop drags get priority over windows
    if (DESK.dragIcon || DESK.dragWidget) { DESK.mouse(ev); return; }
    if (!WM.mouse(ev)) DESK.mouse(ev);
  }
};

/* ===========================================================================
   MAIN LOOP
   =========================================================================== */
(function main() {
  const canvas = document.getElementById("screen");
  G.init(canvas);
  INP.init(canvas);

  if (ST.d.machine) BOOT.start(ST.d.machine);
  else BOOT.toChooser();

  let last = U.now();
  function frame() {
    const now = U.now();
    const dt = Math.min(100, now - last);
    last = now;
    Sys.t = now;

    if (Sys.state === "desktop") {
      KRN.tick(dt);
      AppMan.tick(dt);
      WM.tick(dt);
      DESK.drawBack();
      for (const w of WM.wins) if (!w.minimized) w.draw();
      DESK.drawTaskbar();
      WM.drawPopups();
      WM.drawAltTab();
    } else if (Sys.state === "chooser") {
      BOOT.drawChooser();
    } else if (Sys.state === "off") {
      BOOT.drawOff();
    } else {
      BOOT.draw();
    }
    drawCursor(WM && Sys.state === "desktop" ? WM.cursorFor(INP.mx, INP.my)
               : (Sys.t < Sys.busyUntil ? "busy" : "arrow"), INP.mx, INP.my);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
