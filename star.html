<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xerox 8010 Information System — Star, 1981 — a simulation</title>
<meta name="description" content="A single-file, front-end simulation of the Xerox 8010 Information System (Star, 1981): 1024x808 one bit deep, a two-button mouse, and nine universal command keys that do the same nine things to everything in the world.">
<style>
/* ==================================================================
   THE OS MUSEUM — Xerox 8010 Information System (Star), 27 April 1981
   A single-file, front-end-only simulation. Nothing real runs.
   Display: 1024 x 808, one bit deep, 72 dpi, 17-inch CRT.
   Desktop grid: 14 x 11 one-inch squares = 154 icon positions.
   ================================================================== */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#15161a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center}

/* ---------------- the machine ---------------- */
#machine{position:relative;background:linear-gradient(178deg,#e0dbcd 0%,#d3cdbc 62%,#c3bca8 100%);
  border-radius:10px;padding:6px 7px 0 7px;
  box-shadow:0 26px 64px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 6px rgba(0,0,0,.16)}
#crt{position:relative;background:#0e0e0e;border-radius:5px;padding:5px;
  box-shadow:inset 0 0 20px #000,0 0 0 1px #97907c}
#stageClip{position:relative;overflow:hidden;background:#fff}
#stage{position:absolute;left:0;top:0;width:1024px;height:808px;transform-origin:0 0;background:#fff;
  color:#000;font:11px/13px Helvetica,Arial,"Liberation Sans",sans-serif;cursor:default;
  -webkit-text-stroke:0.3px}
#stage.onebit{filter:url(#onebit)}
#stage *{ -webkit-font-smoothing:none; -moz-osx-font-smoothing:grayscale; text-rendering:geometricPrecision }
#stage svg{shape-rendering:crispEdges}
#scanoff{position:absolute;inset:0;background:#000;z-index:9999;pointer-events:none;opacity:1;transition:opacity .5s}

/* ---------------- the bezel strip: keyboard + controls ---------------- */
#front{padding:5px 3px 5px 3px}
#brow{display:flex;align-items:flex-end;gap:8px}
#mark{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;padding:0 5px 1px 2px}
#markGlyph{display:block}
#markTxt{font:9px/10px Helvetica,Arial,sans-serif;letter-spacing:.16em;color:#6d6551;text-transform:uppercase}
#modelTxt{font:8px/9px Helvetica,Arial,sans-serif;letter-spacing:.08em;color:#8a8168}

#bank{flex:1 1 auto;display:flex;flex-direction:column;gap:4px;min-width:0}
.krow{display:flex;gap:4px}
.ckey{flex:1 1 0;min-width:0;position:relative;background:linear-gradient(#f2eee2,#d8d2c0);
  border:1px solid #9a927c;border-radius:3px;box-shadow:0 2px 0 #a29a83,inset 0 1px 0 rgba(255,255,255,.7);
  cursor:pointer;padding:4px 2px 4px 2px;text-align:center;transition:none}
.ckey .kt{display:block;font:bold 9px/10px Helvetica,Arial,sans-serif;letter-spacing:.045em;color:#2c2a24;white-space:nowrap;
  overflow:hidden;text-overflow:clip}
.ckey .kh{display:block;font:8px/9px Helvetica,Arial,sans-serif;color:#8a8168;margin-top:1px}
.ckey:hover{background:linear-gradient(#fffdf4,#e4dece)}
.ckey.lit,.ckey:active{background:linear-gradient(#5d5748,#3c382e);box-shadow:0 0 0 #000,inset 0 1px 3px rgba(0,0,0,.6);
  transform:translateY(1px)}
.ckey.lit .kt,.ckey:active .kt{color:#fff}
.ckey.lit .kh,.ckey:active .kh{color:#c8c1ac}
.ckey.armed{background:linear-gradient(#fff6c9,#eadf9a);box-shadow:0 2px 0 #a29a83,inset 0 0 0 2px #6b6350}
#bank.k2 .krow.sec{display:flex}
.krow.sec{display:none}
.krow.sec .ckey{padding:3px 2px}
.krow.sec .ckey .kt{font-size:8px;font-weight:600}

#ctl{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;align-items:stretch;width:206px}
#ctl .cr{display:flex;gap:3px}
#ctl .cr .cbtn{flex:1 1 0}
.cbtn{background:linear-gradient(#eae5d6,#cfc8b5);border:1px solid #9a927c;border-radius:3px;
  font:9px/11px Helvetica,Arial,sans-serif;color:#3a3730;padding:3px 6px;cursor:pointer;text-align:center;
  box-shadow:0 1px 0 #a8a08a;white-space:nowrap;overflow:hidden}
.cbtn:hover{background:linear-gradient(#fbf7ea,#ded7c3)}
.cbtn:active{transform:translateY(1px);box-shadow:none}
.cbtn.on{background:linear-gradient(#5d5748,#3c382e);color:#fff}
#led{position:absolute;right:9px;bottom:9px;width:6px;height:6px;border-radius:50%;
  background:#8fe89a;box-shadow:0 0 7px #8fe89a}
#scaleNote{position:absolute;left:10px;bottom:0;font:8px/9px Helvetica,Arial,sans-serif;color:#9a9179}

/* ================= the screen: one bit deep =================
   Dither patterns are the only "grey" this machine has, and they are
   generated as four-pixel tiles in Display.cssPat and the SVG defs.     */

/* --- the message area: one line, always present, no popups anywhere --- */
#msgArea{position:absolute;left:0;top:0;width:1024px;height:15px;background:#fff;border-bottom:1px solid #000;
  overflow:hidden;z-index:400;display:flex;align-items:center}
#msgText{flex:1 1 auto;padding:0 6px;font:11px/14px Helvetica,Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgMode{flex:0 0 auto;padding:0 6px 0 8px;font:bold 10px/14px Helvetica,Arial,sans-serif;border-left:1px solid #000}
#msgMode.blank{border-left:none}

/* --- the Desktop: everything below the message line --- */
#desk{position:absolute;left:0;top:16px;width:1024px;height:792px;background:#fff;overflow:hidden}
#deskGrid{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:0}
#deskGrid.show{opacity:1;background-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);
  background-size:72px 72px;background-position:8px 0}
#deskPat{position:absolute;inset:0;z-index:0}
#iconLayer{position:absolute;inset:0;z-index:10}
#winLayer{position:absolute;inset:0;z-index:20;pointer-events:none}
#sheetLayer{position:absolute;inset:0;z-index:300;pointer-events:none}
#sheetLayer>*{pointer-events:auto}

/* --- icons: 72 x 72 one-inch squares, art centred in the square --- */
.ico{position:absolute;width:72px;height:72px;z-index:2}
.ico .art{position:absolute;left:0;top:5px;width:72px;height:40px;display:flex;align-items:flex-end;justify-content:center}
.ico .art svg{display:block}
.ico .lab{position:absolute;left:1px;top:46px;width:70px;text-align:center;font:9px/10px Helvetica,Arial,sans-serif;
  max-height:21px;overflow:hidden;word-break:break-word;pointer-events:none}
.ico .lab span{background:#fff;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ico.sel .art svg{filter:invert(1)}
.ico.sel .lab span{background:#000;color:#fff}
.ico.dim{opacity:.4}
.ico .badge{position:absolute;right:5px;top:2px;font:bold 9px/9px Helvetica,Arial,sans-serif;background:#000;color:#fff;padding:1px 2px}
.ico .ren{position:absolute;left:2px;top:46px;width:68px;font:9px Helvetica,Arial,sans-serif;border:1px solid #000;
  background:#fff;text-align:center;outline:none;padding:0}

/* --- windows: tiled, never overlapping. Sheets are the exception. --- */
.win{position:absolute;background:#fff;border:1px solid #000;overflow:hidden;pointer-events:auto}
.win .hdr{position:absolute;left:0;top:0;right:0;height:17px;background:#fff;border-bottom:1px solid #000;
  display:flex;align-items:stretch;overflow:hidden}
.win .hnm{flex:1 1 auto;padding:2px 6px 0 7px;font:bold 11px/14px Helvetica,Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.wsel .hdr{background:#000}
.win.wsel .hnm{color:#fff}
.win.wsel .hbtns .hb{border-color:#fff}
.win .hbtns{flex:0 0 auto;display:flex;gap:3px;padding:1px 3px 1px 0;align-items:center}
.hb{border:1px solid #000;background:#fff;font:10px/11px Helvetica,Arial,sans-serif;padding:1px 5px 2px 5px;cursor:pointer;white-space:nowrap}
.hb:hover{background:#000;color:#fff}
.hb.act{background:#000;color:#fff}
.hb.act:hover{background:#fff;color:#000}
.win .hdr2{position:absolute;left:0;top:17px;right:0;height:16px;background:#fff;border-bottom:1px solid #000;
  display:flex;align-items:center;gap:3px;padding:0 3px;overflow:hidden;font:10px/12px Helvetica,Arial,sans-serif}
.win .body{position:absolute;left:0;right:0;bottom:0;overflow:hidden;background:#fff}
.win .pane{position:absolute;left:0;top:0;right:15px;bottom:0;overflow:hidden}
.win .pane.hasH{bottom:15px}
.win .hscroll{position:absolute;left:0;right:15px;bottom:0;height:15px;border-top:1px solid #000;background:#fff}
.win .hscroll .sTrack{position:absolute;top:0;bottom:0;left:14px;right:14px;border:none;
  border-left:1px solid #000;border-right:1px solid #000}
.win .hscroll .sThumb{position:absolute;top:0;bottom:-1px;left:0;right:auto;min-height:0;min-width:12px}
.win .hscroll .sBtn{position:absolute;top:0;bottom:0;height:auto;width:13px;left:auto;right:auto}
.win .hscroll .sLeft{left:0;border-right:1px solid #000}
.win .hscroll .sRight{right:0;border-left:1px solid #000}
.win .scroll{position:absolute;right:0;top:0;bottom:0;width:15px;border-left:1px solid #000;background:#fff}
.win .sTrack{position:absolute;left:0;right:0;top:14px;bottom:14px;background-color:#fff;
  background-image:repeating-conic-gradient(#000 0% 25%,transparent 0% 100%);background-size:2px 2px;
  border-top:1px solid #000;border-bottom:1px solid #000;cursor:pointer}
.win .sThumb{position:absolute;left:0;right:-1px;background:#fff;border:1px solid #000;cursor:grab;min-height:12px}
.win .sBtn{position:absolute;left:0;right:0;height:13px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.win .sBtn:hover{background:#000}
.win .sBtn:hover svg *{fill:#fff;stroke:#fff}
.win .sTop{top:0;border-bottom:1px solid #000}
.win .sBot{bottom:0;border-top:1px solid #000}
.win .empty{padding:14px;font:11px/16px Helvetica,Arial,sans-serif}

/* --- list bodies (folders, drawers, baskets, queues, directory) --- */
.lst{width:100%;border-collapse:collapse;font:11px/14px Helvetica,Arial,sans-serif}
.lst th{text-align:left;font-weight:bold;border-bottom:1px solid #000;padding:1px 6px;white-space:nowrap;background:#fff;position:sticky;top:0}
.lst td{padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;vertical-align:middle}
.lst tr.r{cursor:default}
.lst tr.r.sel td{background:#000;color:#fff}
.lst tr.r.sel td svg{filter:invert(1)}
.lst td.mini{width:26px;padding:0 2px 0 5px}
.lst td.mini svg{display:block}
.lst tr.r.unread td{font-weight:bold}
.igrid{padding:4px;position:relative;min-height:100%}

/* --- documents --- */
.docpane{background:#fff;padding:0}
.page{position:relative;background:#fff;margin:0 auto}
.pgrule{position:relative;border-top:1px dashed #000;margin:0;height:0}
.pgnum{position:absolute;right:2px;top:2px;font:9px/10px Helvetica,Arial,sans-serif;background:#fff;padding:0 3px}
.pgtop{position:absolute;left:2px;top:2px;font:9px/10px Helvetica,Arial,sans-serif;background:#fff;padding:0 3px}
.para{position:relative;white-space:pre-wrap;word-wrap:break-word}
.ch{white-space:pre-wrap}
.selc{background:#000;color:#fff}
.caret{display:inline-block;width:0;border-left:1px solid #000;margin-left:-1px;height:1em;vertical-align:-.16em;
  animation:blink 1.05s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.docpane.ro .caret{display:none}
.frame{position:relative;border:1px solid #000;margin:5px 0;background:#fff}
.frame.fsel{outline:2px solid #000;outline-offset:1px}
.frame .fcap{font:9px/11px Helvetica,Arial,sans-serif;border-top:1px solid #000;padding:1px 4px;background:#fff}
.gfx{position:relative;overflow:hidden}
.gfx svg{position:absolute;left:0;top:0}
.tbl{border-collapse:collapse;font:11px/14px Helvetica,Arial,sans-serif;width:100%}
.tbl th,.tbl td{border:1px solid #000;padding:1px 4px;text-align:left}
.tbl th{font-weight:bold}
.tbl td.csel,.tbl th.csel{background:#000;color:#fff}
.eqn{text-align:center;padding:7px 4px 6px;line-height:2.7;font-family:"Times New Roman",Times,serif}
.eqn .fcap{line-height:11px}
.eq{display:inline-block;vertical-align:middle;font-family:"Times New Roman",Times,serif}
.eqfrac{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px}
.eqfrac>.n{display:block;padding:0 3px;border-bottom:1px solid #000}
.eqfrac>.d{display:block;padding:0 3px}
.eqsqrt{display:inline-block;vertical-align:middle;border-top:1px solid #000;margin-left:1px;padding:1px 3px 0 2px}
.eqrad{display:inline-block;vertical-align:middle;font-size:1.25em;line-height:1}
.eqsup{vertical-align:super;font-size:.68em}
.eqsub{vertical-align:sub;font-size:.68em}
.eqbig{display:inline-block;vertical-align:middle;font-size:1.7em;line-height:.9}
.eqlim{display:inline-block;vertical-align:middle;text-align:center;line-height:1;margin:0 2px}
.eqlim>.lm{display:block;font-size:.58em;line-height:1.15}
.eqlim>.op{display:block;font-size:1.6em;line-height:1}
.eqbox{display:inline-block;vertical-align:middle}

/* --- property & option sheets: overlays, boxy, flat, 1981 --- */
.sheet{position:absolute;background:#fff;border:2px solid #000;min-width:250px;max-width:640px;z-index:310}
.sheet .shdr{display:flex;align-items:stretch;background:#000;height:17px}
.sheet .stitle{flex:1 1 auto;color:#fff;font:bold 11px/16px Helvetica,Arial,sans-serif;padding:0 7px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;cursor:default}
.sheet .sbtns{flex:0 0 auto;display:flex;gap:3px;padding:1px 3px;align-items:center}
.sheet .sbtns .hb{border-color:#fff}
.sheet .sbody{padding:6px 8px 8px 8px;max-height:640px;overflow:auto}
.sheet.selSheet{box-shadow:0 0 0 2px #fff,0 0 0 4px #000}
.grp{margin:0 0 7px 0}
.grp>.gl{font:bold 10px/12px Helvetica,Arial,sans-serif;border-bottom:1px solid #000;margin-bottom:4px;padding-bottom:1px;
  text-transform:uppercase;letter-spacing:.06em}
.fld{display:flex;align-items:flex-start;gap:8px;margin:0 0 4px 0;font:11px/16px Helvetica,Arial,sans-serif}
.fld>.fl{flex:0 0 118px;text-align:right;padding-top:1px}
.fld>.fv{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-width:0}
.chbtn{border:1px solid #000;background:#fff;font:10px/12px Helvetica,Arial,sans-serif;padding:1px 6px 2px 6px;cursor:pointer;white-space:nowrap}
.chbtn.on{background:#000;color:#fff}
.chbtn:hover{outline:1px solid #000;outline-offset:1px}
.chbtn.mini{padding:0 3px 1px 3px;font-size:9px}
.chbtn.pat{width:22px;height:15px;padding:0}
.sfield{border:1px solid #000;background:#fff;font:11px/14px Helvetica,Arial,sans-serif;padding:1px 3px;outline:none;min-width:40px}
.sfield:focus{box-shadow:inset 0 0 0 1px #000}
.sro{font:11px/16px Helvetica,Arial,sans-serif}
.snote{font:10px/13px Helvetica,Arial,sans-serif;border-top:1px solid #000;margin-top:6px;padding-top:4px}
.stab{display:flex;gap:0;border-bottom:1px solid #000;margin-bottom:6px}
.stab .t{border:1px solid #000;border-bottom:none;background:#fff;font:10px/12px Helvetica,Arial,sans-serif;
  padding:2px 8px;cursor:pointer;margin-right:-1px}
.stab .t.on{background:#000;color:#fff}

/* --- calculator / terminal / charset --- */
.calc{padding:6px;font:11px Helvetica,Arial,sans-serif;width:252px}
.calcDisp{border:1px solid #000;padding:3px 6px;text-align:right;font:bold 17px/20px "Courier New",monospace;background:#fff;overflow:hidden;white-space:nowrap}
.calcTape{border:1px solid #000;border-top:none;height:64px;overflow:auto;font:10px/12px "Courier New",monospace;padding:2px 5px}
.calcKeys{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:5px}
.ckb{border:1px solid #000;background:#fff;font:12px/14px Helvetica,Arial,sans-serif;padding:5px 0;text-align:center;cursor:pointer}
.ckb:hover{background:#000;color:#fff}
.term{font:12px/14px "Courier New",Courier,monospace;padding:4px 6px;white-space:pre-wrap}
.termCur{display:inline-block;width:7px;height:12px;background:#000;vertical-align:-2px;animation:blink 1s steps(1,end) infinite}
.csGrid{display:grid;grid-template-columns:repeat(16,1fr);gap:0}
.csC{border:1px solid #000;margin:-1px 0 0 -1px;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:15px;line-height:1;cursor:pointer;overflow:hidden}
.csC:hover{background:#000;color:#fff}
.csC.on{background:#000;color:#fff}
.csC.void{background-color:#fff;background-image:repeating-conic-gradient(#000 0% 25%,transparent 0% 100%);background-size:2px 2px}
.csKb{display:flex;flex-direction:column;gap:2px;padding:5px}
.csKb .r{display:flex;gap:2px}
.csKb .k{flex:1 1 0;border:1px solid #000;text-align:center;font-size:14px;line-height:22px;height:24px;cursor:pointer;overflow:hidden}
.csKb .k:hover{background:#000;color:#fff}

/* --- help --- */
.help{padding:8px 12px 14px 12px;font:12px/17px Helvetica,Arial,sans-serif;max-width:640px}
.help h3{font-size:13px;margin:10px 0 3px 0;border-bottom:1px solid #000}
.help h3:first-child{margin-top:0}
.help p{margin:0 0 7px 0}
.help ul{margin:0 0 7px 18px}
.help li{margin:0 0 2px 0}
.help .k{border:1px solid #000;padding:0 3px;font:bold 10px/12px Helvetica,Arial,sans-serif;white-space:nowrap}
.help .xr{text-decoration:underline;cursor:pointer}

/* ---------------- the museum's own voice (outside the fiction) ---------------- */
#museum{position:fixed;inset:0;background:#0c0e13;z-index:100000;display:none;overflow:auto;
  color:#e6e9f2;font:15px/1.62 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#museum.on{display:block}
#mwrap{max-width:860px;margin:0 auto;padding:34px 26px 90px}
#museum h1{font-size:1.9rem;line-height:1.15;letter-spacing:-.02em;margin:0 0 4px}
#museum .mkick{font:12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;text-transform:uppercase;
  color:#8fe3d4;margin-bottom:14px}
#museum h2{font-size:1.18rem;margin:30px 0 8px;color:#fff;border-bottom:1px solid #262b39;padding-bottom:5px}
#museum h3{font-size:1rem;margin:18px 0 5px;color:#cfd6e6}
#museum p{margin:0 0 12px;color:#c3cadb}
#museum ul{margin:0 0 12px 20px;color:#c3cadb}
#museum li{margin:0 0 5px}
#museum b,#museum strong{color:#fff}
#museum em{color:#8fe3d4;font-style:normal}
#museum .lede{font-size:1.06rem;color:#dde3ef}
#museum .box{border:1px solid #262b39;background:#12151d;border-radius:9px;padding:14px 16px;margin:0 0 16px}
#museum .box .bt{font:12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;
  color:#8fe3d4;margin-bottom:7px}
#museum table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:14px}
#museum th,#museum td{border-bottom:1px solid #22273400;border-top:1px solid #232838;padding:6px 8px;text-align:left;vertical-align:top;color:#c3cadb}
#museum th{color:#fff;font-weight:600;white-space:nowrap}
#mnav{position:sticky;top:0;background:rgba(12,14,19,.94);backdrop-filter:blur(6px);border-bottom:1px solid #22273a;
  padding:9px 26px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;z-index:2}
#mnav a{font-size:12px;color:#9aa4bb;text-decoration:none;border:1px solid #262b39;border-radius:999px;padding:3px 10px;cursor:pointer}
#mnav a:hover{color:#fff;border-color:#4b5570}
#mclose{margin-left:auto;background:#8fe3d4;color:#08211d;border:none;border-radius:999px;padding:5px 15px;
  font-size:12px;font-weight:700;cursor:pointer}
#museum .fine{font-size:12.5px;color:#78829a}
#museum code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:#181c26;border:1px solid #262b39;
  border-radius:4px;padding:1px 5px;color:#cfe9e3}
#museum .kk{display:inline-block;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid #3a4258;
  border-radius:3px;padding:2px 5px;color:#dde3ef;background:#171b25}
#museum .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){#museum .grid2{grid-template-columns:1fr}}
#museum .try{border-left:3px solid #8fe3d4;padding:2px 0 2px 13px;margin:0 0 14px;color:#dde3ef}
#tooSmall{position:fixed;inset:0;background:#0c0e13;color:#dde3ef;z-index:99999;display:none;
  align-items:center;justify-content:center;text-align:center;padding:30px;font-size:15px;line-height:1.6}
</style>
</head>
<body>

<!-- The one-bit display: every colour in the machine passes through this
     threshold, so nothing on the screen is ever grey or antialiased. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="onebit" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <!-- A true 50% threshold: every pixel leaving this filter is either
         black or white, so the display really is one bit deep. The hairline
         text stroke on #stage compensates for the one thing an outline font
         cannot do by itself — Star's screen fonts were bitmaps drawn for a
         72 dpi raster, with stems a whole pixel wide. -->
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0 1"/>
      <feFuncG type="discrete" tableValues="0 1"/>
      <feFuncB type="discrete" tableValues="0 1"/>
      <feFuncA type="discrete" tableValues="0 1"/>
    </feComponentTransfer>
  </filter>
  <defs id="pats"></defs>
</svg>

<div id="machine">
  <div id="crt">
    <div id="stageClip">

          <path d="M4.7 10 h10.6 M10 4.7 v10.6" stroke="#6d6551" stroke-width="1.6"/>
          <text x="24" y="14.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700"
                letter-spacing="2.4" fill="#6d6551">8010</text>

<div id="tooSmall"><div>The Xerox 8010 screen is 1024 &times; 808 pixels.<br>This window is too small to show it.<br><br>Please widen the browser window, or rotate the device.</div></div>

<script>
"use strict";
/* ==================================================================
   XEROX 8010 INFORMATION SYSTEM (Star) — 27 April 1981
   Front-end simulation. Nothing real runs; no original code or art.

   Module order, and it matters:
     0  DISPLAY      1024x808 one bit deep, dither patterns, scaling
     1  OBJECT MODEL one interface implemented by every selectable thing
     2  SELECTION    SELECT / ADJUST, granularity
     3  DISPATCHER   every operation in the system goes through here
     4  SHEETS       property + option sheets generated from metadata
     5  ICONS        original line art in the Star idiom
     6  DESKTOP      14 x 11 one-inch squares
     7  WINDOWS      tiled, header command buttons
     8  DOCUMENTS    text, graphics, tables, equations, pagination
     9  SERVICES     file drawers, baskets, printers, directory
    10  RECORDS      record files, forms, sort, select, merge
    11  TOOLS        calculator, terminal, character sets, help
    12  KEYBOARD     the command key bank
    13  GUIDE        the museum's own voice, kept outside the fiction
    14  STATE        LocalStorage
   ================================================================== */

/* ======================================================================
   0 · DISPLAY LAYER
   The machine's screen is 1024 x 808, one bit deep, at 72 dots per inch,
   on a 17-inch tube. One inch is therefore 72 pixels, and the Desktop is
   an array of 14 x 11 one-inch squares — 154 icon positions, exactly as
   Star's designers described it. 1024 - 14*72 = 16 px of side margin;
   808 - 11*72 = 16 px, which is where the message line lives.
   ====================================================================== */
const SCREEN_W = 1024, SCREEN_H = 808;
const MSG_H    = 16;                       /* the message line + its rule */
const DESK_W   = SCREEN_W, DESK_H = SCREEN_H - MSG_H;   /* 1024 x 792 */
const CELL     = 72;                       /* one inch at 72 dpi        */
const GRID_C   = 14, GRID_R = 11;          /* 154 squares               */
const GRID_X   = (DESK_W - GRID_C * CELL) / 2;          /* 8 */
const GRID_Y   = 0;

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const el = (t, cls, txt) => { const n = document.createElement(t);
  if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => (n < 10 ? '0' : '') + n;

const Display = (() => {
  const stage = $('#stage'), clip = $('#stageClip'), machine = $('#machine');
  let scale = 1;

  /* Dither patterns are the only greys the machine has. Defined once as
     SVG patterns so icon art and document graphics can share them with
     the CSS classes used by the chrome. */
  const PATTERNS = [
    { id: 'p0',  name: 'None',        px: '' },
    { id: 'p12', name: 'Light',       px: '1000000000000000' },
    { id: 'p25', name: 'Quarter',     px: '1000001000100000' },
    { id: 'p50', name: 'Half',        px: '1001011010010110' },
    { id: 'p75', name: 'Three quarter', px: '0110100101101001' },
    { id: 'p100',name: 'Solid',       px: '1111111111111111' },
    { id: 'ph',  name: 'Horizontal',  px: '1111000011110000' },
    { id: 'pv',  name: 'Vertical',    px: '1000100010001000' },
    { id: 'pd',  name: 'Diagonal',    px: '1000010000100001' },
    { id: 'pb',  name: 'Basket',      px: '1000111110001000' }
  ];
  function buildPatterns() {
    const defs = $('#pats');
    PATTERNS.forEach(p => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
      g.setAttribute('id', 'pat_' + p.id);
      g.setAttribute('width', '4'); g.setAttribute('height', '4');
      g.setAttribute('patternUnits', 'userSpaceOnUse');
      let inner = '<rect width="4" height="4" fill="#fff"/>';
      if (p.px) for (let i = 0; i < 16; i++)
        if (p.px[i] === '1') inner += '<rect x="' + (i % 4) + '" y="' + ((i / 4) | 0) +
          '" width="1" height="1" fill="#000"/>';
      g.innerHTML = inner; defs.appendChild(g);
    });
  }
  /* The same 4 x 4 pattern as a CSS background, for the chrome that isn't
     SVG. Written out as an inline data URI so that it stays pixel-exact and
     nothing is fetched: the tile is four pixels square and it repeats. */
  const patCache = {};
  function cssPat(id) {
    const p = PATTERNS.find(x => x.id === id) || PATTERNS[0];
    if (!p.px) return 'background:#fff';
    if (p.id === 'p100') return 'background:#000';
    if (!patCache[id]) {
      let r = '';
      for (let i = 0; i < 16; i++) if (p.px[i] === '1')
        r += '<rect x="' + (i % 4) + '" y="' + ((i / 4) | 0) + '" width="1" height="1" fill="#000"/>';
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4" ' +
        'shape-rendering="crispEdges"><rect width="4" height="4" fill="#fff"/>' + r + '</svg>';
      patCache[id] = 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")';
    }
    return 'background-color:#fff;background-image:' + patCache[id] +
           ';background-size:4px 4px;background-repeat:repeat';
  }

  function fit() {
    /* the chrome around the tube: 9px of housing above it, 7px of bezel on
       each side of the glass, then the keyboard strip. Kept tight so that a
       1440 x 900 laptop still gets a true 1:1 raster. */
    const front = $('#front').getBoundingClientRect().height || 66;
    const availW = window.innerWidth  - 26;
    const availH = window.innerHeight - front - 26;
    let f = Math.min(availW / SCREEN_W, availH / SCREEN_H);
    /* Integer scaling wherever the viewport allows it: a whole number of
       device pixels per screen pixel is the only way a one-bit raster
       stays one bit. Below 1:1 we have to interpolate, and we say so. */
    if (f >= 3) scale = 3; else if (f >= 2) scale = 2; else if (f >= 1) scale = 1;
    else scale = Math.max(0.36, Math.floor(f * 100) / 100);
    stage.style.transform = 'scale(' + scale + ')';
    clip.style.width  = Math.round(SCREEN_W * scale) + 'px';
    clip.style.height = Math.round(SCREEN_H * scale) + 'px';
    $('#scaleNote').textContent = scale === 1 ? '1024 × 808 at 1:1'
      : (scale > 1 ? '1024 × 808 at ' + scale + ':1'
                   : '1024 × 808 scaled to ' + Math.round(scale * 100) + '% — below 1:1 the raster is interpolated');
    $('#tooSmall').style.display = (window.innerWidth < 560) ? 'flex' : 'none';
  }
  function toStage(ev) {
    const r = clip.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / scale, y: (ev.clientY - r.top) / scale };
  }
  return { buildPatterns, cssPat, PATTERNS, fit, toStage, get scale() { return scale; },
           setOneBit(on) { stage.classList.toggle('onebit', !!on); } };
})();
Display.buildPatterns();

/* ======================================================================
   SOUND — optional, minimal, synthesized, default off.
   This was a quiet machine in a quiet office.
   ====================================================================== */
const Sound = (() => {
  let ctx = null, on = false;
  const ac = () => (ctx || (ctx = new (window.AudioContext || window.webkitAudioContext)()));
  function env(node, g, a, d) {
    const t = ac().currentTime, gn = ac().createGain();
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(g, t + a);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    node.connect(gn); gn.connect(ac().destination); return t;
  }
  function noise(dur) {
    const c = ac(), n = c.createBufferSource(),
          b = c.createBuffer(1, Math.max(1, (c.sampleRate * dur) | 0), c.sampleRate),
          d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    n.buffer = b; return n;
  }
  return {
    get on() { return on; },
    set(v) { on = !!v; if (on) try { ac(); } catch (e) { on = false; } },
    click() { if (!on) return; try { const n = noise(0.012), f = ac().createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 1.4;
      n.connect(f); const t = env(f, 0.055, 0.001, 0.012); n.start(t); n.stop(t + 0.03); } catch (e) {} },
    beep() { if (!on) return; try { const o = ac().createOscillator();
      o.type = 'square'; o.frequency.value = 784;
      const t = env(o, 0.05, 0.004, 0.09); o.start(t); o.stop(t + 0.14); } catch (e) {} },
    disk(dur) { if (!on) return; try { const d = dur || 0.34, n = noise(d),
      f = ac().createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = 3.2;
      const lfo = ac().createOscillator(), lg = ac().createGain();
      lfo.frequency.value = 27; lg.gain.value = 260; lfo.connect(lg); lg.connect(f.frequency);
      n.connect(f); const t = env(f, 0.038, 0.02, d); n.start(t); lfo.start(t);
      n.stop(t + d + 0.05); lfo.stop(t + d + 0.05); } catch (e) {} }
  };
})();

/* ======================================================================
   1 · OBJECT MODEL
   Every selectable thing in the system — a character run, a paragraph, a
   graphic, a table cell, an icon, a folder, a window, a printer, a
   property sheet, the Desktop itself — is reachable as a SELECTABLE with
   exactly one interface. The universal commands in module 3 are written
   against that interface and know nothing about types.

       name()               what to call it in the message line
       kindLabel()          what kind of thing it is
       sheet()              its property sheet, as metadata
       props()              its live property bag (for SAME)
       applyProps(bag)      take properties from another object
       canAccept(child)     may this object receive that one?
       take()               remove and return a portable representation
       peek()               return a copy without removing (COPY)
       put(rep, where)      place a representation into/at this object
       destroy()            DELETE
       openable() / open()  OPEN
       helpKey()            HELP

   A new object type is a single entry in TYPES below. It gets MOVE, COPY,
   DELETE, SHOW PROPERTIES, SAME, AGAIN, UNDO, OPEN and HELP for free,
   because none of those commands contains a single line of type-specific
   code. There is a button in the museum notes that registers a brand new
   type at run time to prove it.
   ====================================================================== */

let world = null;          /* the whole persistent world, plain JSON       */
let nextId = 1;
const uid = p => (p || 'o') + '_' + (nextId++) + '_' + Math.floor(Math.random() * 46656).toString(36);

/* ---- the type registry ------------------------------------------------ */
const TYPES = {};
function defType(name, spec) { TYPES[name] = Object.assign({
  label: name, plural: name + 's', art: () => '', accepts: () => false,
  openable: false, container: false, sheet: () => [], onOpen: null,
  deletable: true, movable: true, copyable: true, help: 'object'
}, spec); }

/* ---- the object store ------------------------------------------------- */
const Obj = {
  get(id) { return world.objects[id] || null; },
  all() { return Object.values(world.objects); },
  make(type, name, extra) {
    const o = Object.assign({
      id: uid(type), type, name, parent: null, props: {}, data: {},
      created: extra && extra.created || nowStamp(), cell: null
    }, extra || {});
    if (!o.id || world.objects[o.id]) o.id = uid(type);
    world.objects[o.id] = o;
    /* type defaults for properties, so property sheets are never empty */
    const t = TYPES[type];
    if (t && t.defaults) for (const k in t.defaults)
      if (!(k in o.props)) o.props[k] = t.defaults[k];
    return o;
  },
  children(id) {
    return Obj.all().filter(o => o.parent === id)
      .sort((a, b) => (a.cell == null ? 1e9 : a.cell) - (b.cell == null ? 1e9 : b.cell) ||
                      a.name.localeCompare(b.name));
  },
  kids(id) { return Obj.children(id); },
  contains(anc, id) { let o = Obj.get(id);
    while (o) { if (o.parent === anc) return true; o = Obj.get(o.parent); } return false; },
  path(id) { const p = []; let o = Obj.get(id);
    while (o) { p.unshift(o.name); o = Obj.get(o.parent); } return p.join('/'); },
  remove(id) { const o = Obj.get(id); if (!o) return null;
    Obj.kids(id).forEach(k => Obj.remove(k.id)); delete world.objects[id]; return o; },
  /* A portable representation: the object and its whole subtree. */
  serialize(id) { const out = []; (function walk(i) { const o = Obj.get(i);
      if (!o) return; out.push(JSON.parse(JSON.stringify(o)));
      Obj.kids(i).forEach(k => walk(k.id)); })(id); return out; },
  deserialize(arr, opts) {
    const map = {}, o0 = arr[0]; const fresh = opts && opts.fresh;
    arr.forEach(o => { const c = JSON.parse(JSON.stringify(o));
      if (fresh) { const nid = uid(c.type); map[c.id] = nid; c.id = nid; }
      else map[c.id] = c.id;
      world.objects[c.id] = c; });
    arr.forEach(o => { const c = world.objects[map[o.id]];
      if (c.parent && map[c.parent]) c.parent = map[c.parent]; });
    return world.objects[map[o0.id]];
  },
  count(id) { return Obj.kids(id).length; },
  size(id) { const o = Obj.get(id); if (!o) return 0;
    let n = (o.data && o.data.body) ? JSON.stringify(o.data).length : 220;
    Obj.kids(id).forEach(k => n += Obj.size(k.id)); return n; }
};

function nowStamp() { const d = world && world.clock ? new Date(world.clock) : new Date(1981, 3, 27, 9, 14);
  return d.getTime(); }
const MON = ['January','February','March','April','May','June','July',
             'August','September','October','November','December'];
function fmtDate(ms) { const d = new Date(ms);
  return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDateTime(ms) { const d = new Date(ms);
  return fmtDate(ms) + ', ' + d.getHours() + ':' + pad2(d.getMinutes()); }
function fmtBytes(n) { if (n < 1024) return n + ' characters';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'K bytes';
  return (n / 1048576).toFixed(2) + 'M bytes'; }

/* ======================================================================
   5 · ICON ART
   Original black-and-white line art, drawn in code in Star's idiom:
   1-pixel outlines, white interiors, dither for shading, nothing else.
   Star's own icons were designed by Norm Cox and are Xerox's; none of
   them is reproduced here. The document icon below is a page with a
   turned corner because that is the visual argument Star made, and
   every document icon since has repeated it.
   ====================================================================== */
const Art = (() => {
  const W = 46, H = 38;
  const svg = (body, w, h) => '<svg width="' + (w || W) + '" height="' + (h || H) +
    '" viewBox="0 0 ' + (w || W) + ' ' + (h || H) + '">' +
    '<g fill="none" stroke="#000" stroke-width="1" stroke-linecap="butt">' + body + '</g></svg>';
  const P = id => 'url(#pat_' + id + ')';

  /* a sheet of paper with a turned corner — the ancestor of them all */
  function sheet(x, y, w, h, fold, rules) {
    const f = fold == null ? 10 : fold;
    /* the page outline, with the corner cut away on the diagonal */
    let s = '<path d="M' + (x + .5) + ' ' + (y + .5) + ' h' + (w - f - 1) + ' l' + f + ' ' + f +
            ' v' + (h - f - 1) + ' h' + (-(w - 1)) + ' z" fill="#fff"/>';
    /* the turned corner itself: the back of the paper, shown as dither,
       with the crease drawn in. This is the shape every document icon
       since has been a redrawing of. */
    s += '<path d="M' + (x + w - f + .5) + ' ' + (y + .5) + ' l' + f + ' ' + f + ' h' + (-f) +
         ' z" fill="' + P('p25') + '"/>';
    if (rules !== false) { const n = Math.max(2, Math.floor((h - 14) / 5));
      for (let i = 0; i < n; i++) { const yy = y + f + 4 + i * 5 + .5;
        if (yy > y + h - 5) break;
        const ww = (i % 3 === 2) ? (w - 13) : (w - 7);
        s += '<path d="M' + (x + 4.5) + ' ' + yy + ' h' + ww + '" stroke-width="1"/>'; }
    }
    return s;
  }

  const A = {};

  A.document = () => svg(sheet(10, 2, 26, 34, 10));
  A.stationery = () => svg(
    '<path d="M6.5 8.5 h25 v29 h-25 z" fill="#fff"/>' +
    '<path d="M8.5 5.5 h25 v29" fill="#fff"/>' +
    sheet(10, 2, 26, 32, 10));
  A.folder = () => svg(
    '<path d="M6.5 11.5 h11 l3 -4 h19 v25 h-33 z" fill="#fff"/>' +
    '<path d="M6.5 15.5 h33" />');
  A.foldertpl = () => svg(
    '<path d="M6.5 11.5 h11 l3 -4 h19 v25 h-33 z" fill="#fff"/>' +
    '<path d="M6.5 15.5 h33" />' +
    '<path d="M27.5 20.5 h9 v9 h-9 z" fill="' + P('p25') + '"/>');
  A.drawer = () => svg(
    '<path d="M4.5 5.5 h37 v27 h-37 z" fill="#fff"/>' +
    '<path d="M4.5 12.5 h37 M4.5 24.5 h37"/>' +
    '<path d="M17.5 16.5 h11 v4 h-11 z" fill="#fff"/>' +
    '<path d="M17.5 27.5 h11 v3 h-11 z" fill="' + P('p50') + '"/>' +
    '<path d="M9.5 8.5 h9 v2 h-9 z" fill="' + P('p50') + '"/>');
  A.inbasket = () => svg(
    '<path d="M17.5 3.5 h13 v10 h-13 z" fill="#fff"/>' +
    '<path d="M19.5 6.5 h9 M19.5 9.5 h9"/>' +
    '<path d="M5.5 18.5 h35 l-4 15 h-27 z" fill="#fff"/>' +
    '<path d="M9.5 22.5 h27 M8.5 27.5 h29"/>' +
    '<path d="M23 14.5 l0 3 M20 15.5 l3 3 l3 -3" fill="none"/>');
  A.inbasketFull = () => svg(
    '<path d="M13.5 1.5 h20 v13 h-20 z" fill="#fff"/>' +
    '<path d="M15.5 4.5 h16 M15.5 7.5 h16 M15.5 10.5 h11"/>' +
    '<path d="M11.5 4.5 h2 v10 h-2 z" fill="' + P('p50') + '"/>' +
    '<path d="M5.5 18.5 h35 l-4 15 h-27 z" fill="#fff"/>' +
    '<path d="M9.5 22.5 h27 M8.5 27.5 h29"/>');
  A.outbasket = () => svg(
    '<path d="M17.5 6.5 h13 v10 h-13 z" fill="#fff"/>' +
    '<path d="M19.5 9.5 h9 M19.5 12.5 h9"/>' +
    '<path d="M5.5 18.5 h35 l-4 15 h-27 z" fill="#fff"/>' +
    '<path d="M9.5 22.5 h27 M8.5 27.5 h29"/>' +
    '<path d="M23.5 6 l0 -4 M20.5 4 l3 -3 l3 3" fill="none"/>');
  A.printer = () => svg(
    '<path d="M14.5 1.5 h18 v9 h-18 z" fill="#fff"/>' +
    '<path d="M16.5 4.5 h14 M16.5 7.5 h10"/>' +
    '<path d="M4.5 11.5 h37 v14 h-37 z" fill="#fff"/>' +
    '<path d="M8.5 15.5 h12 v4 h-12 z" fill="' + P('p50') + '"/>' +
    '<circle cx="34" cy="17.5" r="2" fill="#fff"/>' +
    '<path d="M8.5 25.5 h29 v8 h-29 z" fill="#fff"/>' +
    '<path d="M12.5 29.5 h21"/>');
  A.floppy = () => svg(
    '<path d="M6.5 3.5 h29 l4 4 v27 h-33 z" fill="#fff"/>' +
    '<circle cx="23" cy="20" r="6" fill="#fff"/><circle cx="23" cy="20" r="2" fill="#000"/>' +
    '<path d="M19.5 6.5 h7 v6 h-7 z" fill="' + P('p50') + '"/>' +
    '<path d="M11.5 30.5 h9"/>');
  A.wastebasket = () => svg(
    '<path d="M9.5 8.5 h27 l-4 25 h-19 z" fill="#fff"/>' +
    '<path d="M7.5 4.5 h31 v4 h-31 z" fill="#fff"/>' +

/* ======================================================================
   THE MESSAGE AREA
   Star had no dialog boxes for messages. One line at the top of the
   screen, always present, is where the machine speaks. Commands are
   never greyed out either: you may always press any key, and if it does
   not apply the machine says so here, in words.
   ====================================================================== */
const Msg = (() => {
  const t = $('#msgText'), m = $('#msgMode');
  let timer = null;
  function say(s, beep) {
    t.textContent = s || '';
    if (beep) Sound.beep();
    if (timer) clearTimeout(timer);
    if (s) timer = setTimeout(() => { if (t.textContent === s) t.textContent = idle(); }, 9000);
  }
  function idle() {
    const n = Sel.count();
    if (!n) return 'Nothing is selected. Select something with the SELECT button, then press a command key.';
    return Sel.describe() + ' selected.';
  }
  function mode(s) { m.textContent = s || ''; m.classList.toggle('blank', !s); }
  function refresh() { say(idle()); }
  return { say, mode, refresh, idle };
})();

/* ======================================================================
   1b · THE TYPES
   Each entry below is the whole definition of an object type. None of
   the universal commands reads any of it except through the SELECTABLE
   interface, which is why a new entry needs no changes anywhere else.
   ====================================================================== */
function F(o, key, label, type, opts) {
  return Object.assign({ k: key, l: label, t: type,
    get: () => o.props[key], set: v => { o.props[key] = v; } }, opts || {});
}
function RO(label, val) { return { l: label, t: 'ro', get: () => val }; }
