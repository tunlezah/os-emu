      v = src.r < 0 ? sb.cols[src.c].name : sb.rows[src.r][src.c]; }
    else if (src.kind === 'char') v = src.ch;
    else if (src.kind === 'text') v = textOf(src.ref, normalize(src.a, src.b));
    if (r < 0) b.cols[c].name = v; else b.rows[r][c] = v;
    if (mode === 'move' && src.kind === 'cell') {
      const sb = blk(src.docId, src.bi);
      if (src.r < 0) sb.cols[src.c].name = ''; else sb.rows[src.r][src.c] = '';
    }
    UI.refreshAll();
    return { label: 'putting text in the table', fn: () => restore(id, before) };
  }

  /* typing: no command needed, exactly as Star had it */
  let burst = null;
  function type(id, r, ch) {
    const o = Obj.get(id); if (!o) return;
    if (!o.props.edit) { Msg.say('This document is open for reading. Press Edit in the window header.', true); return; }
    const now = Date.now();
    if (!burst || burst.id !== id || now - burst.t > 1400) {
      burst = { id, t: now, before: snap(id) };
      Cmd.push({ label: 'typing', fn: (b => () => { restore(id, b); burst = null; })(burst.before) });
    } else burst.t = now;
    if (r.s.b !== r.e.b || r.s.i !== r.e.i) {
      const B = body(id);
      if (r.s.b === r.e.b) { const b = B[r.s.b];
        if (isPara(b)) { const a = splitAt(b, r.s.i), z = splitAt(b, r.e.i);
          b.runs.splice(a, z - a); coalesce(b); } }
      else { const first = B[r.s.b], last = B[r.e.b];
        if (isPara(first)) { const a = splitAt(first, r.s.i); first.runs.splice(a); }
        if (isPara(last)) { const z = splitAt(last, r.e.i); last.runs.splice(0, z);
          if (isPara(first)) first.runs = first.runs.concat(last.runs); }
        B.splice(r.s.b + 1, r.e.b - r.s.b); if (isPara(first)) coalesce(first); }
      r = { s: { b: r.s.b, i: r.s.i }, e: { b: r.s.b, i: r.s.i } };
    }
    const B = body(id), b = B[r.s.b];
    if (ch === '\n') {
      if (!isPara(b)) return;
      const k = splitAt(b, r.s.i);
      const tail = b.runs.splice(k);
      const nb = { t: 'p', style: JSON.parse(JSON.stringify(PS(b.style))),
                   runs: tail.length ? tail : [{ s: '', cp: Object.assign({}, CP(b.runs[0] && b.runs[0].cp)) }] };
      coalesce(b); B.splice(r.s.b + 1, 0, nb);
      Sel.set([SelText(id, { b: r.s.b + 1, i: 0 }, { b: r.s.b + 1, i: 0 })]);
    } else if (ch === '\b') {
      if (!isPara(b)) return;
      if (r.s.i > 0) { const a = splitAt(b, r.s.i - 1), z = splitAt(b, r.s.i);
        b.runs.splice(a, z - a); coalesce(b);
        Sel.set([SelText(id, { b: r.s.b, i: r.s.i - 1 }, { b: r.s.b, i: r.s.i - 1 })]); }
      else if (r.s.b > 0 && isPara(B[r.s.b - 1])) {
        const prev = B[r.s.b - 1], at = blockText(prev).length;
        prev.runs = prev.runs.concat(b.runs); coalesce(prev); B.splice(r.s.b, 1);
        Sel.set([SelText(id, { b: r.s.b - 1, i: at }, { b: r.s.b - 1, i: at })]); }
    } else {
      if (!isPara(b)) return;
      const cp = charPropsOf(id, r); delete cp.__mixed;
      insertRuns(id, r.s, [{ s: ch, cp }]);
      Sel.set([SelText(id, { b: r.s.b, i: r.s.i + ch.length }, { b: r.s.b, i: r.s.i + ch.length })]);
    }
    o.props.version = (o.props.version || 1) + 1;
    Sound.click();
    UI.refreshAll();
  }

  /* ---------- hit testing inside a document ------------------------- */
  function posFromPoint(cx, cy) {
    let node = null, off = 0;
    if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(cx, cy);
      if (p) { node = p.offsetNode; off = p.offset; } }
    if (!node && document.caretRangeFromPoint) { const rg = document.caretRangeFromPoint(cx, cy);
      if (rg) { node = rg.startContainer; off = rg.startOffset; } }
    if (!node) return null;
    let sp = node.nodeType === 3 ? node.parentNode : node;
    while (sp && !(sp.dataset && sp.dataset.o != null)) sp = sp.parentNode;
    if (!sp) return null;
    let host = sp; while (host && !(host.dataset && host.dataset.b != null)) host = host.parentNode;
    const bi = Number((sp.dataset.b != null ? sp.dataset.b : (host ? host.dataset.b : 0)));
    return { b: bi, i: Number(sp.dataset.o) + off };
  }
  function widen(id, p, level) {
    const b = blk(id, p.b); if (!isPara(b)) return { s: p, e: p };
    const T = blockText(b);
    if (level === 2) { let a = p.i, z = p.i;
      while (a > 0 && /[\w’'-]/.test(T[a - 1])) a--;
      while (z < T.length && /[\w’'-]/.test(T[z])) z++;
      if (a === z && z < T.length) z++;
      return { s: { b: p.b, i: a }, e: { b: p.b, i: z } }; }
    if (level === 3) { let a = p.i, z = p.i;
      while (a > 0 && !/[.!?]/.test(T[a - 1])) a--;
      while (a < T.length && /\s/.test(T[a])) a++;
      while (z < T.length && !/[.!?]/.test(T[z])) z++;
      if (z < T.length) z++;
      return { s: { b: p.b, i: a }, e: { b: p.b, i: z } }; }
    if (level >= 4) return { s: { b: p.b, i: 0 }, e: { b: p.b, i: T.length } };
    return { s: p, e: p };
  }
  const GRAN = { 1: 'character', 2: 'word', 3: 'sentence', 4: 'paragraph' };

  return { CP, PS, cssFace, render, normalize, textOf, charPropsOf, applyCharProps,
           textSheet, frameSheet, shapeSheet, cellSheet, cellProps, applyCellProps,
           applyFrameProps, applyShapeProps, deleteRange, deleteBlock, deleteShape, clearCell,
           putText, putFrame, putCell, type, posFromPoint, widen, GRAN, colName,
           pageCount, pageBox, body, blk, blockText, snap, restore, isPara,
           eqParse, eqHTML, shapeBBox, PAPER_PT };
})();

/* ======================================================================
   7 · TILED WINDOW MANAGER
   Document windows are tiled and do not overlap. Star chose that on
   purpose, so that no window could ever get lost behind another one, and
   so that the machine never had to ask you to go looking. Property
   sheets, option sheets and messages are the only things allowed over
   the top. There is a limit on how many windows may be open, and when
   you reach it the machine says so in words rather than refusing in
   silence.
   Commands live in the window's own header, on the right, not in a menu.
   Scroll bars are on the right, because Star's designers wanted the left
   edge kept clear for reading; a click in the track jumps to the next
   page boundary rather than to an arbitrary place.
   ====================================================================== */
const Win = (() => {
  let wins = [], seq = 1;
  const layer = () => $('#winLayer');

  /* Windows tile in the area below the first two rows of one-inch squares.
     Star's windows could and did cover the Desktop; here the top two rows
     are kept clear so that the printers, the baskets, the file drawers and
     the documents themselves stay designatable while a window is open —
     without which the central gesture of the machine would be unreachable
     for most of a visit. The museum note says so plainly. */
  const WT = 2 * CELL, WH = DESK_H - WT;              /* 144 .. 792 */
  const H2 = WH / 2, T2 = WT + H2, H3 = WH / 3;
  const LAYOUTS = {
    1: [[0, WT, 1024, WH]],
    2: [[0, WT, 512, WH], [512, WT, 512, WH]],
    3: [[0, WT, 512, WH], [512, WT, 512, H2], [512, T2, 512, H2]],
    4: [[0, WT, 512, H2], [512, WT, 512, H2], [0, T2, 512, H2], [512, T2, 512, H2]],
    5: [[0, WT, 512, H2], [0, T2, 512, H2],
        [512, WT, 512, H3], [512, WT + H3, 512, H3], [512, WT + 2 * H3, 512, H3]],
    6: [[0, WT, 341, H2], [341, WT, 342, H2], [683, WT, 341, H2],
        [0, T2, 341, H2], [341, T2, 342, H2], [683, T2, 341, H2]]
  };

  const get = id => wins.find(w => w.id === id) || null;
  const forObj = oid => wins.find(w => w.objId === oid) || null;

  function limit() { return World.desktop().props.winLimit || 6; }

  function open(objId) {
    const o = Obj.get(objId); if (!o) return null;
    const t = TYPES[o.type] || {};
    if (!t.openable) { Msg.say(o.name + ' cannot be opened.', true); return null; }
    const ex = forObj(objId);
    if (ex) { Msg.say('"' + o.name + '" is already open.'); select(ex.id); return ex; }
    if (wins.length >= limit()) {
      Msg.say('You may have ' + limit() + ' windows open at once, and you have ' + limit() +
              '. Close one — select its header and press DELETE, or use the Close button.', true);
      return null;
    }
    const w = { id: 'w' + (seq++), objId, kind: o.type, title: o.name,
      props: { name: o.name, pageBounds: true, showAs: (o.props.showAs || 'Icons'),
               scrollBar: 'Right', order: wins.length + 1 },
      st: {}, scroll: { x: 0, y: 0 } };
    wins.push(w);
    /* the machine is slow, and it was slow: reading a document off an
       8-inch disk took a visible moment. One of the in-basket notes is
       about exactly this. */
    const heavy = (o.type === 'document' || o.type === 'book') && Obj.size(objId) > 2600;
    render();
    if (heavy) { Msg.say('Reading "' + o.name + '" …'); Sound.disk(0.45);
      w.st.loading = true; render();
      setTimeout(() => { w.st.loading = false; render();
        Msg.say('"' + o.name + '" is open for reading. Press Edit in the header to change it.'); }, 780); }
    else Msg.say('"' + o.name + '" is open.');
    select(w.id);
    return w;
  }

  function close(id) { const w = get(id); if (!w) return;
    wins = wins.filter(x => x.id !== id);
    Sel.set(Sel.items.filter(i => !(i.kind === 'window' && i.ref === id)));
    render(); }
  function closeFor(objId) { const w = forObj(objId); if (w) close(w.id); }
  function closeAll() { wins = []; render(); }
  function select(id) { const w = get(id); if (!w) return; render(); }
  function snapshot(w) { return { objId: w.objId, kind: w.kind, title: w.title,
    props: JSON.parse(JSON.stringify(w.props)), st: {}, scroll: { x: 0, y: 0 } }; }
  function restore(r) { if (wins.length >= limit()) { Msg.say('No room to reopen that window.', true); return; }
    const w = Object.assign({ id: 'w' + (seq++) }, r); wins.push(w); render(); }

  function sheetFor(w) {
    const o = Obj.get(w.objId);
    return { title: 'Window Properties — ' + w.title, shortTitle: 'the window', key: 'win:' + w.id,
      groups: [
        { label: 'Window', fields: [
          { k: 'name', l: 'Name', t: 'text', wide: true, get: () => w.props.name,
            set: v => { w.props.name = v; w.title = v; if (o) o.name = v; render(); UI.refreshAll(); } },
          RO('Shows', o ? ((TYPES[o.type] || {}).label || o.type) : 'nothing'),
          RO('Arrangement', 'Tiled — ' + wins.length + ' of ' + limit() + ' windows open'),
          { k: 'order', l: 'Position', t: 'choice', opts: wins.map((x, i) => i + 1), num: true,
            get: () => wins.indexOf(w) + 1,
            set: v => { const from = wins.indexOf(w); const to = Math.max(0, Math.min(wins.length - 1, v - 1));
              wins.splice(from, 1); wins.splice(to, 0, w); render(); } }
        ]},
        { label: 'Behaviour', fields: [
          { k: 'pageBounds', l: 'Show page boundaries', t: 'toggle', get: () => w.props.pageBounds,
            set: v => { w.props.pageBounds = v; render(); } },
          { k: 'showAs', l: 'Show contents as', t: 'choice', opts: ['Icons', 'Table'],
            get: () => w.props.showAs, set: v => { w.props.showAs = v; render(); } },
          RO('Scroll bar', 'Right. Star put it there deliberately: the left edge is where you read.')
        ]}
      ],
      note: 'A window is an object too. This sheet came out of the same key as the printer’s.' };
  }

  /* ---------- header command buttons, per window kind ---------------- */
  function buttons(w) {
    const o = Obj.get(w.objId) || {}; const B = [];
    const add = (label, fn, act) => B.push({ label, fn, act });
    add('Close', () => close(w.id));
    switch (w.kind) {
      case 'document': case 'book':
        if (w.kind === 'document') {
          if (o.props && o.props.edit) {
            add('Save', () => { o.props.edit = false; Sound.disk(0.3);
              Msg.say('"' + o.name + '" saved to the local disk. ' +
                      'On the real machine a long document could take a minute or two.'); render(); }, true);
            add('Reset', () => { o.props.edit = false; render(); Msg.say('Editing stopped.'); });
            add('Paginate', () => { render();
              Msg.say('Repaginated: ' + Doc.pageCount(o) + ' page' + (Doc.pageCount(o) === 1 ? '' : 's') + '.'); });
          } else add('Edit', () => { o.props.edit = true; render();
            Msg.say('Now editing. Star opened documents for reading and made you ask to change them.'); });
        }
        add('Set Window', () => Sheets.open(sheetFor(w), SelWin(w.id)));
        break;
      case 'folder': case 'drawer': case 'floppy': case 'templates':
        add('Show as', () => { w.props.showAs = w.props.showAs === 'Icons' ? 'Table' : 'Icons';
          render(); Msg.say('Showing contents as ' + w.props.showAs.toLowerCase() + '.'); });
        add('Set Window', () => Sheets.open(sheetFor(w), SelWin(w.id)));
        break;
      case 'wastebasket':
        add('Empty', () => emptyWaste(o));
        add('Set Window', () => Sheets.open(sheetFor(w), SelWin(w.id)));
        break;
      case 'inbasket':
        add('Show as', () => { w.props.showAs = w.props.showAs === 'Icons' ? 'Table' : 'Icons'; render(); });
        add('Mark read', () => { const n = Obj.kids(o.id).filter(m => !m.props.read);
          const before = n.map(m => m.id); n.forEach(m => m.props.read = true);
          Cmd.push({ label: 'marking mail read',
                     fn: () => { before.forEach(i => { const m = Obj.get(i); if (m) m.props.read = false; }); UI.refreshAll(); } });
          UI.refreshAll(); Msg.say(n.length + ' notes marked as read.'); });
        break;
      case 'outbasket':
        add('Send now', () => { const q = Obj.kids(o.id).filter(m => !m.props.sent);
          q.forEach(m => m.props.sent = true); UI.refreshAll();
          Msg.say(q.length ? q.length + ' notes handed to the mail service.' : 'The out-basket is empty.'); });
        break;
      case 'printer':
        add(o.props && o.props.stopped ? 'Start' : 'Stop', () => {
          o.props.stopped = !o.props.stopped; render();
          Msg.say(o.props.stopped ? 'Printing stopped. The queue is held.'
                                  : 'Printing restarted.');
          if (!o.props.stopped) Services.tickPrinter(o.id); });
        break;
      case 'recordfile':
        add('Form', () => { w.st.form = !w.st.form; render(); });
        add('Sort', () => Records.sortSheet(o.id));
        add('Select', () => Records.selectSheet(o.id));
        add('Merge', () => Records.mergeSheet(o.id));
        add('Show all', () => { o.props.filter = ''; render(); Msg.say('Showing all records.'); });
        break;
      case 'charset':
        add(o.props.view === 'Table' ? 'Keyboard' : 'Table', () => {
          o.props.view = o.props.view === 'Table' ? 'Keyboard' : 'Table'; render(); });
        add('Set Window', () => Sheets.open(sheetFor(w), SelWin(w.id)));
        break;
      case 'calculator':
        add('Clear', () => { w.st.calc = null; render(); });
        break;
      case 'terminal':
        add(w.st.connected ? 'Disconnect' : 'Connect', () => Term.toggle(w));
        break;
      case 'mail':
        add('Reply', () => Mailer.reply(o));
        add('File', () => { Msg.say('Select the note, press MOVE, and designate a file drawer. ' +
          'Filing is the same gesture as printing.'); });
        break;
      case 'help':
        add('Contents', () => { w.st.topic = 'contents'; render(); });
        break;
      case 'directory':
        add('Set Window', () => Sheets.open(sheetFor(w), SelWin(w.id)));
        break;
    }
    return B;
  }

  function emptyWaste(o) {
    const kids = Obj.kids(o.id);
    if (!kids.length) { Msg.say('The wastebasket is already empty.'); return; }
    const go = () => {
      const reps = kids.map(k => Obj.serialize(k.id));
      kids.forEach(k => Obj.remove(k.id));
      Cmd.push({ label: 'emptying the wastebasket',
        fn: () => { reps.forEach(r => { const n = Obj.deserialize(r); n.parent = o.id; n.cell = null; });
          UI.refreshAll(); } });
      UI.refreshAll(); Sound.disk(0.5);
      Msg.say('Wastebasket emptied — ' + kids.length + ' item' + (kids.length === 1 ? '' : 's') +
              ' gone. Now press UNDO. It works on this too.');
    };
    if (!o.props.confirm) { go(); return; }
    Sheets.option({ title: 'Empty Wastebasket', key: 'opt:empty', groups: [
      { label: 'Contents', fields: [
        RO('Items', String(kids.length)),
        RO('Occupies', fmtBytes(kids.reduce((a, k) => a + Obj.size(k.id), 0))),
        RO('Afterwards', 'UNDO will still bring all of it back.')
      ]}
    ], note: 'This is an option sheet, not a dialog box. Star had no dialog boxes; ' +
             'messages went to the line at the top of the screen and questions came out as sheets.' },
      () => go(), 'Empty');
  }

  /* ---------- layout and paint ---------- */
  function render() {
    const host = layer(); host.innerHTML = '';
    const n = Math.min(wins.length, 6);
    const L = LAYOUTS[n] || LAYOUTS[1];
    wins.slice(0, 6).forEach((w, i) => {
      const [x, y, ww, hh] = L[i];
      const node = el('div', 'win');
      node.style.left = x + 'px'; node.style.top = y + 'px';
      node.style.width = ww + 'px'; node.style.height = hh + 'px';
      node.dataset.win = w.id;
      if (Sel.items.some(s => s.kind === 'window' && s.ref === w.id)) node.classList.add('wsel');
      /* header */
      const hdr = el('div', 'hdr');
      const o = Obj.get(w.objId);
      hdr.appendChild(el('div', 'hnm', (o ? o.name : w.title) +
        (o && o.props && o.props.edit ? '  ·  editing' : '')));
      const bts = el('div', 'hbtns');
      buttons(w).forEach(b => { const x2 = el('div', 'hb' + (b.act ? ' act' : ''), b.label);
        x2.onmousedown = ev => ev.stopPropagation();
        x2.onclick = ev => { ev.stopPropagation(); Sound.click(); b.fn(); };
        bts.appendChild(x2); });
      hdr.appendChild(bts);
      node.appendChild(hdr);
      /* second header row, where a window's contents need their own commands */
      const row2 = secondRow(w, o);
      let top = 17;
      if (row2) { row2.style.top = '17px'; node.appendChild(row2); top = 33; }
      /* body */
      const body = el('div', 'body'); body.style.top = top + 'px';
      const pane = el('div', 'pane'); pane.dataset.pane = w.id;
      body.appendChild(pane);
      const sb = scrollbar(w, pane);
      body.appendChild(sb);
      const hb = hscrollbar(w, pane);
      body.appendChild(hb);
      node.appendChild(body);
      host.appendChild(node);
      /* contents */
      try { paintBody(w, o, pane); } catch (e) {
        pane.innerHTML = '<div class="empty">This window could not be drawn.</div>'; }
      pane.scrollTop = w.scroll.y; pane.scrollLeft = w.scroll.x;
      pane.addEventListener('scroll', () => { w.scroll.y = pane.scrollTop; w.scroll.x = pane.scrollLeft;
        syncScroll(w.id); }, { passive: true });
      pane.addEventListener('wheel', ev => { ev.preventDefault();
        pane.scrollTop += ev.deltaY; pane.scrollLeft += ev.deltaX; }, { passive: false });
      requestAnimationFrame(() => syncScroll(w.id));
    });
    Sheets.paintSel();
  }

  function secondRow(w, o) {
    if (w.kind === 'document' && o && o.props.edit) {
      const r = el('div', 'hdr2');
      r.appendChild(el('span', '', 'Insert:'));
      const mk = (lbl, fn) => { const b = el('div', 'hb', lbl);
        b.onclick = ev => { ev.stopPropagation(); Sound.click(); fn(); }; r.appendChild(b); };
      const at = () => { const t = Sel.items.find(i => i.kind === 'text' && i.ref === o.id);
        const f = Sel.items.find(i => i.kind === 'frame' && i.docId === o.id);
        return f ? f.bi + 1 : (t ? Doc.normalize(t.a, t.b).e.b + 1 : Doc.body(o.id).length); };
      const ins = (blkObj, what) => { const before = Doc.snap(o.id);
        Doc.body(o.id).splice(at(), 0, blkObj); UI.refreshAll();
        Cmd.push({ label: 'inserting ' + what, fn: () => Doc.restore(o.id, before) });
        Msg.say(what + ' inserted. Select it and press SHOW PROPERTIES.'); };
      mk('Paragraph', () => ins({ t: 'p', style: Doc.PS(), runs: [{ s: 'New paragraph.', cp: Doc.CP() }] }, 'A paragraph'));
      mk('Graphics', () => ins({ t: 'gfx', w: 340, h: 160, cap: 'Figure', shapes: [] }, 'A graphics frame'));
      mk('Table', () => ins({ t: 'tbl', cap: 'Table',
        cols: [{ name: 'Item', w: 150 }, { name: 'Quantity', w: 80, align: 'right' },
               { name: 'Amount', w: 90, align: 'right' }],
        rows: [['', '', ''], ['', '', '']] }, 'A table'));
      mk('Equation', () => ins({ t: 'eqn', src: 'x = {-b \\pm sqrt{b^2 - 4ac}}/{2a}', z: 15 }, 'An equation'));
      mk('Page break', () => ins({ t: 'brk' }, 'A page break'));
      const g = Sel.items.find(i => i.kind === 'frame' && i.docId === o.id &&
        (Doc.blk(o.id, i.bi) || {}).t === 'gfx') ||
        Sel.items.find(i => i.kind === 'shape' && i.docId === o.id);
      if (g) { r.appendChild(el('span', '', ' Draw:'));
        ['line', 'box', 'ell', 'arc', 'txt'].forEach(k => {
          const nm = { line: 'Line', box: 'Box', ell: 'Ellipse', arc: 'Arc', txt: 'Label' }[k];
          const b = el('div', 'hb' + (w.st.tool === k ? ' act' : ''), nm);
          b.onclick = ev => { ev.stopPropagation(); w.st.tool = w.st.tool === k ? null : k;
            w.st.toolFrame = g.bi; render();
            Msg.say(w.st.tool ? 'Press and sweep inside the frame to draw a ' + nm.toLowerCase() + '.'
                              : 'Drawing tool put down.'); };
          r.appendChild(b); });
      }
      return r;
    }
    if (w.kind === 'recordfile' && o) {
      const r = el('div', 'hdr2');
      r.appendChild(el('span', '', (o.data.rows || []).length + ' records' +
        (o.props.filter ? ' — showing those where ' + o.props.filter : '') +
        ' — sorted on ' + o.props.sortField + (o.props.ascending ? ' ascending' : ' descending')));
      return r;
    }
    if (w.kind === 'printer' && o) {
      const r = el('div', 'hdr2');
      r.appendChild(el('span', '', o.name + ':Ashfield:Institute — ' +
        (o.props.stopped ? 'held' : Obj.count(o.id) ? 'printing' : 'idle') +
        ' — ' + o.props.res + ' spots per inch'));
      return r;
    }
    if (w.kind === 'charset' && o) {
      const r = el('div', 'hdr2');
      ['Latin', 'Greek', 'Cyrillic', 'Arabic', 'Hebrew', 'Kana', 'Kanji', 'Mathematics', 'Office'].forEach(s => {
        const b = el('div', 'hb' + (o.props.script === s ? ' act' : ''), s);
        b.onclick = ev => { ev.stopPropagation(); o.props.script = s; render(); }; r.appendChild(b); });
      return r;
    }
    return null;
  }

  function scrollbar(w, pane) {
    const sb = el('div', 'scroll');
    const up = el('div', 'sBtn sTop');
    up.innerHTML = '<svg width="9" height="7"><path d="M4.5 0 L9 7 L0 7 Z" fill="#000"/></svg>';
    const dn = el('div', 'sBtn sBot');
    dn.innerHTML = '<svg width="9" height="7"><path d="M0 0 L9 0 L4.5 7 Z" fill="#000"/></svg>';
    const tr = el('div', 'sTrack'), th = el('div', 'sThumb');
    tr.appendChild(th); sb.appendChild(up); sb.appendChild(tr); sb.appendChild(dn);
    up.onclick = ev => { ev.stopPropagation(); pane.scrollTop -= 18; };
    dn.onclick = ev => { ev.stopPropagation(); pane.scrollTop += 18; };
    /* a click in the track goes to the next page boundary, not to an
       arbitrary offset. This is how Star did it, and it is why nobody
       using Star ever lost their place. */
    tr.onmousedown = ev => {
      ev.stopPropagation();
      if (ev.target === th) { dragThumb(ev, pane, tr, th); return; }
      const r = tr.getBoundingClientRect();
      const down = (ev.clientY - r.top) / Display.scale > (th.offsetTop + th.offsetHeight / 2);
      const step = pageStep(w, pane);
      const cur = pane.scrollTop;
      pane.scrollTop = down ? Math.ceil((cur + 1) / step) * step : Math.floor((cur - 1) / step) * step;
      Msg.say('Scrolled to a page boundary. Star’s large scroll movements always landed on one.');
    };
    return sb;
  }
  function hscrollbar(w, pane) {
    const sb = el('div', 'hscroll');
    const lf = el('div', 'sBtn sLeft');
    lf.innerHTML = '<svg width="7" height="9"><path d="M7 0 L7 9 L0 4.5 Z" fill="#000"/></svg>';
    const rt = el('div', 'sBtn sRight');
    rt.innerHTML = '<svg width="7" height="9"><path d="M0 0 L7 4.5 L0 9 Z" fill="#000"/></svg>';
    const tr = el('div', 'sTrack'), th = el('div', 'sThumb');
    tr.appendChild(th); sb.appendChild(lf); sb.appendChild(tr); sb.appendChild(rt);
    lf.onclick = ev => { ev.stopPropagation(); pane.scrollLeft -= 24; };
    rt.onclick = ev => { ev.stopPropagation(); pane.scrollLeft += 24; };
    tr.onmousedown = ev => { ev.stopPropagation();
      if (ev.target === th) { dragThumbH(ev, pane, tr, th); return; }
      const r = tr.getBoundingClientRect();
      const right = (ev.clientX - r.left) / Display.scale > (th.offsetLeft + th.offsetWidth / 2);
      pane.scrollLeft += right ? pane.clientWidth - 24 : -(pane.clientWidth - 24); };
    return sb;
  }
  function dragThumbH(ev, pane, tr, th) {
    ev.preventDefault();
    const startX = ev.clientX, startLeft = th.offsetLeft;
    const trackW = tr.clientWidth, thW = th.offsetWidth;
    const range = Math.max(1, pane.scrollWidth - pane.clientWidth);
    const move = e => { const dx = (e.clientX - startX) / Display.scale;
      const t = Math.max(0, Math.min(trackW - thW, startLeft + dx));
      pane.scrollLeft = (t / Math.max(1, trackW - thW)) * range; };
    const up = () => { window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  }
  function pageStep(w, pane) {
    const o = Obj.get(w.objId);
    if (o && (o.type === 'document' || o.type === 'book')) {
      const pb = Doc.pageBox(o);
      return Math.max(60, pb.h - o.props.topMargin - o.props.bottomMargin);
    }
    return Math.max(40, pane.clientHeight - 12);
  }
  function dragThumb(ev, pane, tr, th) {
    ev.preventDefault();
    const startY = ev.clientY, startTop = th.offsetTop;
    const trackH = tr.clientHeight, thH = th.offsetHeight;
    const range = Math.max(1, pane.scrollHeight - pane.clientHeight);
    const move = e => { const dy = (e.clientY - startY) / Display.scale;
      const t = Math.max(0, Math.min(trackH - thH, startTop + dy));
      pane.scrollTop = (t / Math.max(1, trackH - thH)) * range; };
    const up = () => { window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  }
  function syncScroll(id) {
    const w = get(id); if (!w) return;
    const pane = $('[data-pane="' + id + '"]'); if (!pane) return;
    const hs = pane.parentNode.querySelector('.hscroll');
    if (hs) { const wide = pane.scrollWidth > pane.clientWidth + 1;
      hs.style.display = wide ? 'block' : 'none';
      pane.classList.toggle('hasH', wide);
      if (wide) { const tr = hs.querySelector('.sTrack'), th = hs.querySelector('.sThumb');
        const W = pane.scrollWidth, V = pane.clientWidth;
        const wpx = Math.max(12, Math.round(tr.clientWidth * (V / W)));
        const l = Math.round((pane.scrollLeft / (W - V)) * (tr.clientWidth - wpx));
        th.style.width = wpx + 'px'; th.style.left = l + 'px'; } }
    const sb = pane.parentNode.querySelector('.scroll'); if (!sb) return;
    const tr = sb.querySelector('.sTrack'), th = sb.querySelector('.sThumb');
    const H = pane.scrollHeight, V = pane.clientHeight;
    if (H <= V + 1) { th.style.top = '0'; th.style.height = tr.clientHeight + 'px'; return; }
    const frac = V / H, h = Math.max(12, Math.round(tr.clientHeight * frac));
    const t = Math.round((pane.scrollTop / (H - V)) * (tr.clientHeight - h));
    th.style.height = h + 'px'; th.style.top = t + 'px';
  }

  return { open, close, closeFor, closeAll, get, forObj, render, sheetFor, snapshot, restore,
           syncScroll, select, buttons, emptyWaste,
           get list() { return wins; }, limit,
           paint: render };
})();

/* ======================================================================
   6 · ICONS AND THE DESKTOP
   The Desktop occupies the whole screen and is an object with its own
   property sheet. Icons sit centred in one-inch squares. Selecting an
   icon and pressing OPEN opens it; selecting it and pressing SHOW
   PROPERTIES gives its property sheet. Nothing here is dragged: to move
   an icon you select it, press MOVE, and point at where it should go.
   ====================================================================== */
const Icons = (() => {
  function art(o) {
    const t = TYPES[o.type] || {};
    try { return t.art ? t.art(o) : Art.draw('unknown'); } catch (e) { return Art.draw('unknown'); }
  }
  function node(o, x, y) {
    const n = el('div', 'ico');
    n.style.left = x + 'px'; n.style.top = y + 'px';
    n.dataset.obj = o.id;
    const a = el('div', 'art'); a.innerHTML = art(o); n.appendChild(a);
    if (World.desktop().props.labels !== 'Hidden') {
      const l = el('div', 'lab');
      l.appendChild(el('span', '', o.name));
      n.appendChild(l);
    }
    const t = TYPES[o.type] || {};
    if (t.container && o.type !== 'desktop') {
      const c = Obj.count(o.id);
      if (o.type === 'inbasket') { const u = Obj.kids(o.id).filter(m => !m.props.read).length;
        if (u) n.appendChild(el('div', 'badge', String(u))); }
      else if (o.type === 'printer' && c) n.appendChild(el('div', 'badge', String(c)));
      else if (o.type === 'outbasket' && c) n.appendChild(el('div', 'badge', String(c)));
    }
    if (Sel.items.some(s => s.kind === 'icon' && s.ref === o.id)) n.classList.add('sel');
    if (Cmd.pending && Cmd.pending.src.some(s => s.kind === 'icon' && s.ref === o.id) &&
        Cmd.pending.cmd === 'MOVE') n.classList.add('dim');
    return n;
  }
  function mini(o) {
    const s = art(o);
    return s.replace(/width="\d+" height="\d+"/, 'width="24" height="20"');
  }
  return { node, mini, art };
})();

/* ---------------- window body painting ------------------------------- */
function paintBody(w, o, pane) {
  if (!o) { pane.innerHTML = '<div class="empty">The object this window showed has gone.</div>'; return; }
  if (w.st.loading) { pane.innerHTML = '<div class="empty">Reading “' + esc(o.name) +
    '” from the local disk …</div>'; return; }
  switch (o.type) {
    case 'document': case 'book': {
      const host = el('div', 'docpane' + (o.props.edit ? '' : ' ro'));
      host.dataset.doc = o.id;
      pane.appendChild(host);
      Doc.render(o, host, w);
      return;
    }
    case 'mail': { paintMail(w, o, pane); return; }
    case 'recordfile': { Records.paint(w, o, pane); return; }
    case 'calculator': { Calc.paint(w, o, pane); return; }
    case 'terminal': { Term.paint(w, o, pane); return; }
    case 'charset': { CharSet.paint(w, o, pane); return; }
    case 'help': { Help.paint(w, o, pane); return; }
    case 'exhibit': { Guide.panel(w, o, pane); return; }
    case 'printer': { paintQueue(w, o, pane); return; }
    case 'inbasket': case 'outbasket': { paintBasket(w, o, pane); return; }
    case 'directory': { paintDirectory(w, o, pane); return; }
    default: {
      if (w.props.showAs === 'Table') paintTableView(w, o, pane);
      else paintIconView(w, o, pane);
    }
  }
}

function sortKids(o) {
  const k = Obj.kids(o.id).slice();
  const by = o.props.sortBy || 'Name';
  k.sort((a, b) => by === 'Date' ? a.created - b.created
    : by === 'Size' ? Obj.size(b.id) - Obj.size(a.id)
    : by === 'Type' ? (a.type.localeCompare(b.type) || a.name.localeCompare(b.name))
    : a.name.localeCompare(b.name));
  return k;
}

function paintIconView(w, o, pane) {
  const kids = sortKids(o);
  const host = el('div', 'igrid');
  if (!kids.length) { host.appendChild(el('div', 'empty',
    o.type === 'wastebasket' ? 'The wastebasket is empty.'
    : o.type === 'drawer' ? 'This file drawer is empty. Select a document, press MOVE, and designate the drawer.'
    : 'Empty. Move something in here — select it, press MOVE, then point.'));
    pane.appendChild(host); return; }
  const cols = Math.max(1, Math.floor((pane.clientWidth - 8) / CELL));
  kids.forEach((k, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    host.appendChild(Icons.node(k, 4 + c * CELL, 4 + r * CELL));
  });
  host.style.height = (12 + Math.ceil(kids.length / cols) * CELL) + 'px';
  pane.appendChild(host);
}

function paintTableView(w, o, pane) {
  const kids = sortKids(o);
  const t = el('table', 'lst');
  const hr = el('tr');
  ['', 'Name', 'Kind', 'Size', 'Created'].forEach(h => hr.appendChild(el('th', '', h)));
  t.appendChild(hr);
  kids.forEach(k => {
    const tr = el('tr', 'r'); tr.dataset.obj = k.id;
    if (Sel.items.some(s => s.kind === 'icon' && s.ref === k.id)) tr.classList.add('sel');
    const c0 = el('td', 'mini'); c0.innerHTML = Icons.mini(k); tr.appendChild(c0);
    tr.appendChild(el('td', '', k.name));
    tr.appendChild(el('td', '', (TYPES[k.type] || {}).label || k.type));
    tr.appendChild(el('td', '', fmtBytes(Obj.size(k.id))));
    tr.appendChild(el('td', '', fmtDate(k.created)));
    t.appendChild(tr);
  });
  if (!kids.length) { pane.appendChild(el('div', 'empty', 'Empty.')); return; }
  pane.appendChild(t);
}

function paintBasket(w, o, pane) {
  const kids = Obj.kids(o.id).slice().sort((a, b) => b.created - a.created);
  if (!kids.length) { pane.appendChild(el('div', 'empty', o.type === 'inbasket'
    ? 'No mail. It will arrive while you work.'
    : 'Nothing waiting. Select a document, press MOVE, and designate the out-basket — ' +
      'the same gesture that prints and files.')); return; }
  if (w.props.showAs === 'Icons' && o.type === 'inbasket') { paintIconView(w, o, pane); return; }
  const t = el('table', 'lst');
  const hr = el('tr');
  (o.type === 'inbasket' ? ['', 'From', 'Subject', 'Posted']
                         : ['', 'To', 'Subject', 'Status']).forEach(h => hr.appendChild(el('th', '', h)));
  t.appendChild(hr);
  kids.forEach(m => {
    const tr = el('tr', 'r' + (!m.props.read ? ' unread' : '')); tr.dataset.obj = m.id;
    if (Sel.items.some(s => s.kind === 'icon' && s.ref === m.id)) tr.classList.add('sel');
    const c0 = el('td', 'mini'); c0.innerHTML = Icons.mini(m); tr.appendChild(c0);
    tr.appendChild(el('td', '', o.type === 'inbasket' ? m.props.from : m.props.to));
    tr.appendChild(el('td', '', m.props.subject || m.name));
    tr.appendChild(el('td', '', o.type === 'inbasket' ? fmtDateTime(m.created)
      : (m.props.sent ? 'Taken by the mail service' : 'Waiting for the next sweep')));
    t.appendChild(tr);
  });
  pane.appendChild(t);
}

function paintMail(w, o, pane) {
  const host = el('div');
  const hd = el('div');
  hd.style.cssText = 'border-bottom:1px solid #000;padding:4px 8px;font:11px/15px Helvetica,Arial,sans-serif';
  hd.innerHTML = '<b>From:</b> ' + esc(o.props.from) + '<br><b>To:</b> ' + esc(o.props.to) +
    '<br><b>Subject:</b> ' + esc(o.props.subject || o.name) +
    '<br><b>Posted:</b> ' + fmtDateTime(o.created) +
    (o.data.enclosureRep ? '<br><b>Enclosure:</b> ' + esc(o.data.enclosureRep[0].name) : '');
  host.appendChild(hd);
  const dp = el('div', 'docpane ro'); dp.dataset.doc = o.id;
  host.appendChild(dp);
  pane.appendChild(host);
  const fake = { id: o.id, props: Object.assign({ paper: PAPER[0], orientation: 'Portrait',
    leftMargin: 30, rightMargin: 30, topMargin: 14, bottomMargin: 20 }, {}), data: o.data };
  Doc.render(fake, dp, w);
  if (o.data.enclosureRep) {
    const b = el('div'); b.style.cssText = 'border-top:1px solid #000;padding:5px 8px';
    const btn = el('div', 'hb', 'Take the enclosure out');

      const n = Obj.deserialize(o.data.enclosureRep, { fresh: true });
      n.parent = World.desktop().id; n.cell = World.freeCell(null);

      Cmd.push({ label: 'taking the enclosure out of the note',
                 fn: () => { Obj.remove(n.id); UI.refreshAll(); } });
      UI.refreshAll();
      Msg.say('"' + n.name + '" is on the Desktop.');
    };
    b.appendChild(btn); pane.appendChild(b);
  }
  if (!o.props.read) { o.props.read = true; setTimeout(() => UI.refreshIcons(), 30); }
}

function paintQueue(w, o, pane) {
  const jobs = Obj.kids(o.id);
  if (!jobs.length) { pane.appendChild(el('div', 'empty',
    'The queue is empty. Select a document, press MOVE, and designate this printer. ' +
    'Printing is not a command in a menu here — it is a place you put a thing.')); return; }
  const t = el('table', 'lst');
  const hr = el('tr'); ['', 'Document', 'Pages', 'Copies', 'Sides', 'Status'].forEach(h => hr.appendChild(el('th', '', h)));
  t.appendChild(hr);
  jobs.forEach(j => {
    const tr = el('tr', 'r'); tr.dataset.obj = j.id;
    if (Sel.items.some(s => s.kind === 'icon' && s.ref === j.id)) tr.classList.add('sel');
    const c0 = el('td', 'mini'); c0.innerHTML = Icons.mini(j); tr.appendChild(c0);
    tr.appendChild(el('td', '', j.name));
    tr.appendChild(el('td', '', String(j.props.pages)));
    tr.appendChild(el('td', '', String(j.props.copies)));
    tr.appendChild(el('td', '', j.props.sides));
    tr.appendChild(el('td', '', o.props.stopped ? 'Held' : j.props.status));

function paintDirectory(w, o, pane) {
  let kids = Obj.kids(o.id);
  const show = o.props.show;
  if (show === 'People') kids = kids.filter(k => k.props.kind === 'Person');
  if (show === 'Services') kids = kids.filter(k => k.props.kind !== 'Person');
  const by = o.props.sortBy;
  kids = kids.slice().sort((a, b) => by === 'Kind' ? (a.props.kind || '').localeCompare(b.props.kind || '')
    : by === 'Where' ? (a.props.where || '').localeCompare(b.props.where || '')
    : a.name.localeCompare(b.name));
  const t = el('table', 'lst');
  const hr = el('tr'); ['', 'Name : domain : organisation', 'Kind', 'Where'].forEach(h => hr.appendChild(el('th', '', h)));
  t.appendChild(hr);
  kids.forEach(k => {
    const tr = el('tr', 'r'); tr.dataset.obj = k.id;
    if (Sel.items.some(s => s.kind === 'icon' && s.ref === k.id)) tr.classList.add('sel');
    const c0 = el('td', 'mini'); c0.innerHTML = Icons.mini(k); tr.appendChild(c0);
    tr.appendChild(el('td', '', k.name));
    tr.appendChild(el('td', '', k.props.kind));
    tr.appendChild(el('td', '', k.props.where));
    t.appendChild(tr);
  });
  pane.appendChild(t);
  const f = el('div', 'empty');
  f.style.borderTop = '1px solid #000';
  f.innerHTML = 'Every line here is an object. Select one and press SHOW PROPERTIES.';
  pane.appendChild(f);
}

/* ======================================================================
   10 · RECORDS PROCESSING
   Star's structured data facility: a record file has named fields, a
   form for entering one record at a time, sorting, a simple selection,
   and the ability to merge records into a document. A record is a
   selectable object like any other, so it has a property sheet.
   ====================================================================== */
const Records = (() => {
  function visible(o) {
    let rows = (o.data.rows || []).map((r, i) => ({ r, i }));
    if (o.props.filter) {
      const m = /^(.+?) (is|contains|is not|is more than|is less than) (.*)$/.exec(o.props.filter);
      if (m) { const fi = (o.data.fields || []).findIndex(f => f.name === m[1]);
        if (fi >= 0) rows = rows.filter(({ r }) => {
          const v = String(r[fi] == null ? '' : r[fi]), q = m[3];
          switch (m[2]) { case 'is': return v.toLowerCase() === q.toLowerCase();
            case 'is not': return v.toLowerCase() !== q.toLowerCase();
            case 'contains': return v.toLowerCase().indexOf(q.toLowerCase()) >= 0;
            case 'is more than': return parseFloat(v.replace(/[^0-9.\-]/g, '')) > parseFloat(q);
            case 'is less than': return parseFloat(v.replace(/[^0-9.\-]/g, '')) < parseFloat(q); }
          return true; }); }
    }
    const fi = (o.data.fields || []).findIndex(f => f.name === o.props.sortField);
    if (fi >= 0) rows.sort((a, b) => { const x = a.r[fi], y = b.r[fi];
      const nx = parseFloat(String(x).replace(/[^0-9.\-]/g, '')), ny = parseFloat(String(y).replace(/[^0-9.\-]/g, ''));
      const c = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : String(x).localeCompare(String(y));
      return o.props.ascending ? c : -c; });
    return rows;
  }

  function paint(w, o, pane) {
    if (w.st.form) { paintForm(w, o, pane); return; }
    const rows = visible(o), F = o.data.fields || [];
    const t = el('table', 'lst');
    const hr = el('tr');
    F.forEach(f => { const h = el('th', '', f.name);
      h.style.textAlign = f.kind === 'Amount' || f.kind === 'Whole number' ? 'right' : 'left';
      hr.appendChild(h); });
    t.appendChild(hr);
    rows.forEach(({ r, i }) => {
      const tr = el('tr', 'r'); tr.dataset.rec = o.id + '#' + i;
      if (Sel.items.some(s => s.kind === 'record' && s.fileId === o.id && s.row === i)) tr.classList.add('sel');
      F.forEach((f, ci) => { const td = el('td', '', String(r[ci] == null ? '' : r[ci]));
        td.style.textAlign = f.kind === 'Amount' || f.kind === 'Whole number' ? 'right' : 'left';
        tr.appendChild(td); });
      t.appendChild(tr);
    });
    pane.appendChild(t);
    if (!rows.length) pane.appendChild(el('div', 'empty', 'No records match the selection. ' +
      'Press Show all in the header.'));
  }

  function paintForm(w, o, pane) {
    const F = o.data.fields || [];
    if (w.st.rec == null) w.st.rec = 0;
    const rows = o.data.rows || [];
    const i = Math.max(0, Math.min(rows.length - 1, w.st.rec));
    const host = el('div'); host.style.padding = '8px 10px';
    const nav = el('div'); nav.style.cssText = 'display:flex;gap:4px;align-items:center;margin-bottom:8px;font:11px Helvetica,Arial,sans-serif';
    const mk = (lbl, fn) => { const b = el('div', 'hb', lbl); b.onclick = fn; nav.appendChild(b); };
    mk('◀ Previous', () => { w.st.rec = Math.max(0, i - 1); Win.render(); });
    nav.appendChild(el('span', '', ' Record ' + (rows.length ? i + 1 : 0) + ' of ' + rows.length + ' '));
    mk('Next ▶', () => { w.st.rec = Math.min(rows.length - 1, i + 1); Win.render(); });
    mk('New record', () => { const before = JSON.parse(JSON.stringify(rows));
      rows.push(F.map(() => '')); w.st.rec = rows.length - 1;
      Cmd.push({ label: 'adding a record', fn: () => { o.data.rows = before; UI.refreshAll(); } });
      Win.render(); Msg.say('A blank record. Type into the fields, then press Next or close the form.'); });
    host.appendChild(nav);
    if (!rows.length) { host.appendChild(el('div', 'empty', 'This record file is empty. Press New record.'));
      pane.appendChild(host); return; }
    F.forEach((f, ci) => {
      const row = el('div', 'fld');
      row.appendChild(el('div', 'fl', f.name));
      const v = el('div', 'fv');
      const inp = el('input', 'sfield'); inp.value = String(rows[i][ci] == null ? '' : rows[i][ci]);
      inp.size = f.kind === 'Text' ? 34 : 14;
      inp.onkeydown = ev => ev.stopPropagation();
      inp.onchange = () => { const before = JSON.parse(JSON.stringify(rows));
        rows[i][ci] = inp.value;
        Cmd.push({ label: 'the change to the record', fn: () => { o.data.rows = before; UI.refreshAll(); } });
        UI.refreshAll(); };
      v.appendChild(inp);
      v.appendChild(el('span', 'sro', ' ' + f.kind.toLowerCase()));
      row.appendChild(v); host.appendChild(row);
    });
    const note = el('div', 'snote', 'A form is a property sheet for a record. Same engine, ' +
      'same shape, and the record file itself has its own sheet on the same key.');
    host.appendChild(note);
    pane.appendChild(host);
  }

  function sheet(fileId, row) {
    const o = Obj.get(fileId); if (!o) return null;
    const F = o.data.fields || [], r = (o.data.rows || [])[row];
    /* an empty record file still answers the key: it says so */
    if (!r) return { title: 'Record Properties', shortTitle: 'the record',
      key: 'rec:' + fileId + ':none',
      groups: [{ label: 'Record', fields: [
        RO('In', o.name), RO('Records in this file', String((o.data.rows || []).length)),
        RO('Fields', F.map(f => f.name).join(', ') || 'none defined') ]}],
      note: 'There is no record here to show. Open the file and press Form to make one.' };
    const set = (ci, v) => { const before = r.slice(); r[ci] = v; UI.refreshAll();
      Cmd.push({ label: 'the change to the record',
                 fn: () => { o.data.rows[row] = before; UI.refreshAll(); } }); };
    return { title: 'Record Properties — ' + (r[0] || 'record ' + (row + 1)),
      shortTitle: 'the record', key: 'rec:' + fileId + ':' + row,
      groups: [
        { label: 'Fields', fields: F.map((f, ci) => ({ k: 'f' + ci, l: f.name,
            t: 'text', get: () => r[ci], set: v => set(ci, v) })) },
        { label: 'Record', fields: [
          RO('In', o.name), RO('Number', String(row + 1) + ' of ' + o.data.rows.length)
        ]}
      ]};
  }
  function deleteRow(fileId, row) {
    const o = Obj.get(fileId); if (!o) return null;
    const before = JSON.parse(JSON.stringify(o.data.rows));
    o.data.rows.splice(row, 1); Sel.clear(); UI.refreshAll();
    return { label: 'deleting the record', fn: () => { o.data.rows = before; UI.refreshAll(); } };
  }
  function sortSheet(id) {
    const o = Obj.get(id); const F = (o.data.fields || []).map(f => f.name);
    const st = { field: o.props.sortField, dir: o.props.ascending ? 'Ascending' : 'Descending' };
    Sheets.option({ title: 'Sort Options — ' + o.name, key: 'opt:sort:' + id, groups: [
      { label: 'Sort', fields: [
        { k: 'field', l: 'On field', t: 'choice', opts: F, get: () => st.field },
        { k: 'dir', l: 'Order', t: 'choice', opts: ['Ascending', 'Descending'], get: () => st.dir }
      ]}]}, out => {
      const b = { f: o.props.sortField, a: o.props.ascending };
      o.props.sortField = out.field; o.props.ascending = out.dir === 'Ascending';
      Cmd.push({ label: 'the sort', fn: () => { o.props.sortField = b.f; o.props.ascending = b.a; UI.refreshAll(); } });
      UI.refreshAll(); Msg.say('Sorted on ' + out.field + ', ' + out.dir.toLowerCase() + '.');
    }, 'Sort');
  }
  function selectSheet(id) {
    const o = Obj.get(id); const F = (o.data.fields || []).map(f => f.name);
    const st = { field: F[0], rel: 'contains', value: '' };
    Sheets.option({ title: 'Select Options — ' + o.name, key: 'opt:sel:' + id, groups: [
      { label: 'Show only records where', fields: [
        { k: 'field', l: 'Field', t: 'choice', opts: F, get: () => st.field },
        { k: 'rel', l: 'Relation', t: 'choice',
          opts: ['is', 'is not', 'contains', 'is more than', 'is less than'], get: () => st.rel },
        { k: 'value', l: 'Value', t: 'text', wide: true, get: () => st.value }
      ]}]}, out => {
      const before = o.props.filter;
      o.props.filter = out.field + ' ' + out.rel + ' ' + out.value;
      Cmd.push({ label: 'the selection', fn: () => { o.props.filter = before; UI.refreshAll(); } });
      UI.refreshAll();
      Msg.say('Showing records where ' + o.props.filter + '. Press Show all to go back.');
    }, 'Select');
  }
  function mergeSheet(id) {
    const o = Obj.get(id);
    const docs = Obj.all().filter(x => x.type === 'document').map(x => x.name);
    const st = { doc: docs[0], what: 'The records now showing' };
    Sheets.option({ title: 'Merge Options — ' + o.name, key: 'opt:merge:' + id, groups: [
      { label: 'Merge into', fields: [
        { k: 'doc', l: 'Document', t: 'choice', opts: docs, get: () => st.doc },
        { k: 'what', l: 'Records', t: 'choice',
          opts: ['The records now showing', 'All records'], get: () => st.what }
      ]},
      { label: 'Field names', fields: [
        RO('Available', (o.data.fields || []).map(f => '<' + f.name + '>').join(' '))
      ]}]}, out => {
      const tmpl = Obj.all().find(x => x.type === 'document' && x.name === out.doc);
      if (!tmpl) { Msg.say('That document could not be found.', true); return; }
      const rows = out.what === 'All records'
        ? (o.data.rows || []).map((r, i) => ({ r, i })) : visible(o);
      const F = o.data.fields || [];
      const body = [];
      rows.forEach(({ r }, n) => {
        (tmpl.data.body || []).forEach(b => {
          const c = JSON.parse(JSON.stringify(b));
          if (c.t === 'p') c.runs.forEach(run => { F.forEach((f, ci) =>
            run.s = run.s.split('<' + f.name + '>').join(String(r[ci] == null ? '' : r[ci]))); });
          if (c.t === 'tbl') c.rows.forEach(row => row.forEach((cell, k) => { F.forEach((f, ci) =>
            row[k] = String(row[k]).split('<' + f.name + '>').join(String(r[ci] == null ? '' : r[ci]))); }));
          body.push(c);
        });
        if (n < rows.length - 1) body.push({ t: 'brk' });
      });
      const nd = Obj.make('document', out.doc + ' — merged', {
        parent: World.desktop().id, cell: World.freeCell(null),
        props: Object.assign({}, tmpl.props, { edit: false, version: 1 }),
        data: { body } });
      Cmd.push({ label: 'the merge', fn: () => { Obj.remove(nd.id); UI.refreshAll(); } });
      UI.refreshAll(); Sound.disk(0.5);
      Msg.say('Merged ' + rows.length + ' record' + (rows.length === 1 ? '' : 's') +
              ' into a new document on the Desktop. Select it and press MOVE onto a printer.');
    }, 'Merge');
  }
  return { paint, sheet, deleteRow, sortSheet, selectSheet, mergeSheet, visible };
})();

/* ======================================================================
   11 · CALCULATOR, TERMINAL, CHARACTER SETS
   ====================================================================== */
const Calc = (() => {
  function fmt(o, v) {
    if (!isFinite(v)) return 'error';
    let s;
    if (o.props.style === 'Floating point') s = String(Number(v.toPrecision(12)));
    else if (o.props.style === 'Engineering') s = v.toExponential(Math.max(1, o.props.decimals));
    else s = v.toFixed(o.props.decimals);
    if (o.props.group && o.props.style === 'Fixed point') {
      const p = s.split('.');
      p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      s = p.join('.');
    }
    return s;
  }
  function paint(w, o, pane) {
    const st = w.st.calc || (w.st.calc = { disp: '0', acc: null, op: null, fresh: true, tape: [] });
    const host = el('div', 'calc');
    const d = el('div', 'calcDisp', fmt(o, parseFloat(st.disp) || 0));
    host.appendChild(d);
    if (o.props.tape) { const t = el('div', 'calcTape');
      st.tape.slice(-40).forEach(l => t.appendChild(el('div', '', l)));
      host.appendChild(t); setTimeout(() => { t.scrollTop = t.scrollHeight; }, 0); }
    const keys = el('div', 'calcKeys');
    const K = ['C', '÷', '×', '−', '+',
               '7', '8', '9', '±', '=',
               '4', '5', '6', '.', 'M+',
               '1', '2', '3', '0', 'MR'];
    K.forEach(k => { const b = el('div', 'ckb', k);
      b.onclick = ev => { ev.stopPropagation(); press(w, o, st, k); }; keys.appendChild(b); });
    host.appendChild(keys);
    const n = el('div', 'snote', 'The calculator is an object: select its icon and press SHOW PROPERTIES ' +
      'to change the decimal places, the display style, or whether it keeps a tape.');
    host.appendChild(n);
    pane.appendChild(host);
  }
  function press(w, o, st, k) {
    Sound.click();
    const num = parseFloat(st.disp) || 0;
    const apply = () => { if (st.op == null || st.acc == null) return num;
      switch (st.op) { case '+': return st.acc + num; case '−': return st.acc - num;
        case '×': return st.acc * num; case '÷': return num === 0 ? NaN : st.acc / num; } return num; };
    if (/[0-9]/.test(k)) { st.disp = st.fresh ? k : (st.disp === '0' ? k : st.disp + k); st.fresh = false; }
    else if (k === '.') { if (st.disp.indexOf('.') < 0) { st.disp = (st.fresh ? '0' : st.disp) + '.'; st.fresh = false; } }
    else if (k === 'C') { st.disp = '0'; st.acc = null; st.op = null; st.fresh = true; st.tape.push('  clear'); }
    else if (k === '±') st.disp = String(-num);
    else if (k === 'M+') { o.props.acc = (o.props.acc || 0) + num; st.tape.push('  M+ ' + fmt(o, num)); }
    else if (k === 'MR') { st.disp = String(o.props.acc || 0); st.fresh = true; st.tape.push('  MR ' + fmt(o, o.props.acc || 0)); }
    else if (k === '=') { const r = apply(); st.tape.push(fmt(o, num) + '  =');
      st.tape.push('= ' + fmt(o, r)); st.disp = String(r); st.acc = null; st.op = null; st.fresh = true; }
    else { const r = st.op != null ? apply() : num;
      st.tape.push(fmt(o, num) + '  ' + k); st.acc = r; st.disp = String(r); st.op = k; st.fresh = true; }
    Win.render();
  }
  return { paint, press };
})();

const Term = (() => {
  const HOSTS = {
    Vireo:  { banner: 'VIREO 4.2  TOPS-ish timesharing  —  16 jobs, load 3.41\r\nLogin: hartnell\r\nPassword:\r\n\r\nGood morning. You have no messages.\r\n', prompt: '@' },
    Bittern:{ banner: 'BITTERN — Physics VAX. UNIX-like, or it likes to think so.\r\nlogin: hartnell\r\n\r\nLast login: Tue Apr 21 08:12 from the 8010 gateway\r\n', prompt: '$ ' },
    'Curlew (IBM)': { banner: 'CURLEW  VM/CMS  READY\r\n', prompt: 'R; ' }
  };
  function paint(w, o, pane) {
    const st = w.st.term || (w.st.term = { lines: [], input: '' });
    if (!w.st.connected && !st.lines.length)
      st.lines = ['Not connected. Press Connect in the window header.',
        '', 'Emulating: ' + o.props.emul + ' at ' + o.props.speed + ' baud, parity ' +
        o.props.parity.toLowerCase() + '.',
        'The connection goes out over the Ethernet to a gateway service,',
        'which is the only way a Star ever spoke to anything that was not a Star.'];
    const host = el('div', 'term');
    host.textContent = st.lines.join('\n') + (w.st.connected ? '\n' + prompt(o) + st.input : '');
    if (w.st.connected) { const c = el('span', 'termCur'); host.appendChild(c); }
    pane.appendChild(host);
    setTimeout(() => { pane.scrollTop = pane.scrollHeight; }, 0);
  }
  const prompt = o => (HOSTS[o.props.host] || HOSTS.Vireo).prompt;
  function toggle(w) {
    const o = Obj.get(w.objId);
    const st = w.st.term || (w.st.term = { lines: [], input: '' });
    if (w.st.connected) { w.st.connected = false;
      st.lines.push('', '[ connection to ' + o.props.host + ' closed ]');
      Msg.say('Disconnected from ' + o.props.host + '.'); }
    else { w.st.connected = true; st.lines = [];
      const b = (HOSTS[o.props.host] || HOSTS.Vireo).banner;
      st.lines = b.split('\r\n');
      st.input = '';
      Msg.say('Connected to ' + o.props.host + ' through the gateway. Type into the window.'); }
    Win.render();
  }
  function key(w, ch) {
    const o = Obj.get(w.objId), st = w.st.term;
    if (!w.st.connected || !st) return false;
    if (ch === '\n') { const line = st.input; st.input = '';
      st.lines.push(prompt(o) + line); run(w, o, st, line.trim()); }
    else if (ch === '\b') st.input = st.input.slice(0, -1);
    else st.input += ch;
    Sound.click(); Win.render(); return true;
  }
  function run(w, o, st, cmd) {
    const p = cmd.split(/\s+/), c = (p[0] || '').toLowerCase();
    const out = s => st.lines.push.apply(st.lines, s.split('\n'));
    if (!cmd) return;
    switch (c) {
      case 'help': case '?': out('Commands understood by this host:\n' +
        '  who   date   dir   type <file>   send   news   logout\n' +
        'This is a canned session. The host is fictional; so is its news.'); break;
      case 'who': out('hartnell  tty14  08:41  the 8010 in room 2\n' +
        'duquesne  tty07  08:12\nokonkwo   tty11  09:03\nvasquez   tty03  07:55'); break;
      case 'date': out('Monday 27 April 1981  09:41:22'); break;
      case 'dir': case 'ls': out('BUDGET.TXT     14 blocks\nSTAR.MEMO       6 blocks\n' +
        'NETWORK.LOG    91 blocks\nPRICES.TXT      3 blocks'); break;
      case 'type': case 'cat': {
        const f = (p[1] || '').toUpperCase();
        if (/PRICE/.test(f)) out('8010 workstation ................ 16,595\n' +
          '8000-series file server ......... 24,000 and up\n' +
          '8044 print service .............. 34,000 and up\n' +
          'Ethernet, per drop .............. see your analyst');
        else if (/STAR/.test(f)) out('The screen shows what the page will look like. I have\n' +
          'watched three people refuse to believe this.');
        else if (/NETWORK/.test(f)) out('[91 blocks of Ethernet packet counts omitted]');
        else out('?No such file. Try DIR.'); break;
      }
      case 'news': out('* The Ethernet in the west wing is up again.\n' +
        '* IBM is said to be readying a small machine for August.\n  Nobody here is very worried.'); break;
      case 'send': out('Use the out-basket. It is faster and it does not lose things.'); break;
      case 'logout': case 'bye': out('Goodbye. 41 minutes of connect time.');
        w.st.connected = false; break;
      default: out('?Unrecognised command "' + cmd + '". Type HELP.');
    }
  }
  return { paint, toggle, key };
})();

/* ======================================================================
   THE MULTILINGUAL STORY
   Star carried an unusually large character set for 1981 — Greek,
   Cyrillic, Arabic, Hebrew, Japanese, Chinese and mathematics — with
   keyboard windows for entering them, because Xerox intended to sell the
   machine worldwide. The encoding underneath it was the Xerox Character
   Code Standard: sixteen bits, fixed width, created in 1980 for the
   Xerox Network Systems architecture. Unicode came out of eight years of
   working with it, and the browser you are reading this in uses the
   descendant. The character below is being drawn by that descendant.
   ====================================================================== */
const CharSet = (() => {
  const range = (a, b, skip) => { const o = [];
    for (let c = a; c <= b; c++) { if (skip && skip.indexOf(c) >= 0) continue;
      o.push(c); } return o; };
  const SCRIPTS = {
    Latin: { codes: range(0x20, 0x7e).concat(range(0xa1, 0xff)),
      note: 'The Latin set, with the accented letters Star needed to sell into Europe.' },
    Greek: { codes: range(0x386, 0x3ce, [0x38b, 0x38d, 0x3a2]),
      note: 'Greek. Star’s Math typeface drew on the same letterforms.' },
    Cyrillic: { codes: range(0x401, 0x45f),
      note: 'Cyrillic. Voice of America and the United States foreign affairs agencies were ' +
            'among the customers who bought Star for exactly this.' },
    Arabic: { codes: range(0x621, 0x64a).concat(range(0x660, 0x669)),
      note: 'Arabic, which reads right to left. Star handled the direction; so does the ' +
            'paragraph below it in the demonstration document.' },
    Hebrew: { codes: range(0x5d0, 0x5ea).concat(range(0x5b0, 0x5bc)),
      note: 'Hebrew, also right to left.' },
    Kana: { codes: range(0x3041, 0x3096).concat(range(0x30a1, 0x30f6)),
      note: 'Hiragana and katakana. The Japanese version of Star was built with Fuji Xerox ' +
            'and sold as J-Star.' },
    Kanji: { codes: '日本語文字漢字情報処理系統計画書類編集出力印刷会議室電話番号住所氏名年月火水木金土曜東京大阪京都研究所開発部門営業技術者機械学習複写機器'
      .split('').map(c => c.codePointAt(0)),
      note: 'A handful of the thousands of kanji Star could hold. A sixteen-bit code was not ' +
            'a luxury here; it was the reason the code was sixteen bits.' },
    Mathematics: { codes: '∑∏∫∮√∞∂∇±×÷≤≥≠≈≡∝∈∉⊂⊃∪∩∀∃∅ℏ⊕⊗⌈⌉⌊⌋∥∠°′″†‡αβγδεθλμπρσφψω'
      .split('').map(c => c.codePointAt(0)),
      note: 'The mathematics set. There was an equation editor to go with it, in 1981.' },
    Office: { codes: '¶§†‡•·—–…‰¢£¥¤©®™°¹²³¼½¾←↑→↓↔⇒☞✓✗☐☑✂✍№℮'
      .split('').map(c => c.codePointAt(0)),
      note: 'The office set: the marks a typist needed and a typewriter did not have.' }
  };
  const KB = {
    Latin: ['`1234567890-=', 'qwertyuiop[]', "asdfghjkl;'", 'zxcvbnm,./'],
    Greek: ['΄1234567890-=', 'ςερτυθιοπ', 'ασδφγηξκλ', 'ζχψωβνμ'],
    Cyrillic: ['ёйцукенгшщзхъ', 'фывапролджэ', 'ячсмитьбю'],
    Arabic: ['ضصثقفغعهخحجد', 'شسيبلاتنمكط', 'ئءؤرلاىةوزظ'],
    Hebrew: ['קראטופ', 'שדגכעיחלך', 'זסבהנמצתץ'],
    Kana: ['ぬふあうえおやゆわほ', 'たていすかんなにらせ', 'つさそひこみもねるめ', 'まちとしはきくりゃ'],
    Kanji: ['日本語文字漢', '情報処理系統', '計画書類編集', '出力印刷会議'],
    Mathematics: ['∑∏∫∮√∞', '∂∇±×÷≤', '≥≠≈≡∝∈', 'αβγδπσ'],
    Office: ['¶§†‡•·', '—–…‰¢£', '©®™°½¾', '←↑→↓✓✗']
  };

  function paint(w, o, pane) {
    const sc = SCRIPTS[o.props.script] || SCRIPTS.Latin;
    const host = el('div');
    const hint = el('div', 'empty');
    hint.style.borderBottom = '1px solid #000';
    hint.innerHTML = esc(sc.note) + '<br>Select a character, then press MOVE or COPY and designate a ' +
      'place in a document. Or just click it while a document is open for editing.';
    host.appendChild(hint);
    if (o.props.view === 'Keyboard') {
      const kb = el('div', 'csKb');
      (KB[o.props.script] || KB.Latin).forEach(row => {
        const r = el('div', 'r');
        Array.from(row).forEach(ch => { const k = el('div', 'k', ch);
          k.dataset.ch = ch; k.dataset.code = 'U+' + ch.codePointAt(0).toString(16).toUpperCase();
          k.dataset.script = o.props.script;
          r.appendChild(k); });
        kb.appendChild(r);
      });
      const note = el('div', 'snote', 'A keyboard window. Star had these so that a typist could ' +
        'reach a script the physical keyboard did not carry — which, for a machine meant to be ' +
        'sold in twenty-seven languages, was most of them.');
      host.appendChild(kb); host.appendChild(note);
    } else {
      const g = el('div', 'csGrid');
      g.style.margin = '1px 0 0 1px';
      sc.codes.forEach(c => {
        const ch = String.fromCodePoint(c);
        const d = el('div', 'csC', ch);
        d.dataset.ch = ch; d.dataset.code = 'U+' + c.toString(16).toUpperCase().padStart(4, '0');
        d.dataset.script = o.props.script;
        if (Sel.items.some(s => s.kind === 'char' && s.ch === ch)) d.classList.add('on');
        if (o.props.codes) d.title = d.dataset.code;
        g.appendChild(d);
      });
      host.appendChild(g);
      /* the deliberately empty boxes: forms that no encoding has ever carried */
      if (o.props.script === 'Kanji') {
        const v = el('div', 'snote');
        v.innerHTML = 'Beyond these there were always more. Sixteen bits held tens of thousands ' +
          'of characters and still did not hold every form of every name — which is the argument ' +
          'that has been running ever since, and which the boxes below stand in for:';
        host.appendChild(v);
        const g2 = el('div', 'csGrid'); g2.style.margin = '1px 0 0 1px';
        for (let i = 0; i < 16; i++) { const d = el('div', 'csC void'); d.title = 'unencoded'; g2.appendChild(d); }
        host.appendChild(g2);
      }
      const f = el('div', 'snote');
      f.innerHTML = 'Codes are shown here as the numbers your browser uses. Star’s own were the ' +
        'Xerox Character Code Standard — sixteen bits, fixed width, 1980, twenty-seven languages. ' +
        'Unicode came out of eight years of working with it, and is what rendered every glyph above.';
      host.appendChild(f);
    }
    pane.appendChild(host);
  }
  function sheet(sc) {
    return { title: 'Character Properties', shortTitle: 'the character', key: 'char:' + sc.code,
      groups: [
        { label: 'Character', fields: [
          RO('Glyph', sc.ch), RO('Script', sc.script), RO('Code in your browser', sc.code),
          RO('Encoding here', 'Unicode — the descendant of Star’s own'),
          RO('Star’s encoding', 'Xerox Character Code Standard, 16 bits, 1980')
        ]}],
      note: 'A character has properties. So does a printer, a folder, a window and the Desktop. ' +
            'That was the whole of the argument, and it is the thing the industry dropped.' };
  }
  return { paint, sheet, SCRIPTS };
})();

  function obj() { let h = Obj.all().find(o => o.type === 'help');
