      RO('Raster', '1024 × 808 pixels'),
      RO('Resolution', '72 dots per inch, 17-inch tube'),
      RO('Squares', GRID_C + ' × ' + GRID_R + ' of one inch — ' + (GRID_C * GRID_R) + ' icon positions')
    ]},
    { label: 'Windows', fields: [
      F(o, 'winLimit', 'How many at once', 'choice', { opts: [2, 3, 4, 6], num: true }),
      RO('Arrangement', 'Tiled. Document windows do not overlap.')
    ]},
    { label: 'This workstation', fields: [
      RO('Logged on', o.props.user),
      RO('Machine', 'Xerox 8010, processor 3-482-119'),
      RO('Memory', '384K bytes'),
      RO('Local disk', '29M bytes, 8-inch'),
      RO('Mouse', 'Two buttons: SELECT and ADJUST'),
      F(o, 'sound', 'Sound', 'toggle')
    ]},
    { note: 'The Desktop is an object, so it has a property sheet, so you got one. ' +
            'Nothing in the system is exempt.' }
  ]
});

/* ======================================================================
   2 · SELECTION MANAGER
   Two buttons, and only two. SELECT replaces the selection; ADJUST
   extends or amends it. Star's designers prototyped six different mouse
   semantics — one one-button design, four two-button designs and one
   three-button design — and argued in print that three was too many and
   one too few. There is no third button here and no context menu.
   ====================================================================== */
const Sel = (() => {
  let items = [];
  function set(list) { items = list ? [].concat(list) : []; after(); }
  function add(it) {
    if (!it) return;
    const i = items.findIndex(x => x.same && x.same(it));
    if (i >= 0) items.splice(i, 1); else items.push(it);
    after();
  }
  function clear() { items = []; after(); }
  function after() { UI.paintSelection(); Msg.refresh(); }
  function describe() {
    if (!items.length) return 'Nothing';
    if (items.length === 1) return items[0].name();
    const k = {}; items.forEach(i => k[i.kindLabel()] = (k[i.kindLabel()] || 0) + 1);
    return Object.keys(k).map(n => k[n] + ' ' + n.toLowerCase() + (k[n] > 1 ? 's' : '')).join(' and ');
  }
  return {
    get items() { return items; },
    set, add, clear, describe,
    count: () => items.length,
    only: () => items.length === 1 ? items[0] : null,
    kind: () => items.length ? items[0].kind : null,
    ids: () => items.filter(i => i.kind === 'icon').map(i => i.ref)
  };
})();

/* ---------- SELECTABLE: one interface, implemented once per family -----
   Everything below returns an object with the same shape. The dispatcher
   in module 3 never asks what family it has.                            */

function baseSel(x) {
  return Object.assign({
    kind: 'object',
    name() { return 'object'; },
    kindLabel() { return 'Object'; },
    same(o) { return o.kind === this.kind && o.ref === this.ref; },
    sheetSpec() { return null; },
    props() { return null; },
    applyProps() { return null; },
    canPut() { return false; },
    put() { return null; },
    remove() { return null; },
    openable() { return false; },
    open() { return null; },
    helpKey() { return 'general'; },
    rect() { return null; }
  }, x);
}

/* --- an icon: any object in the world ------------------------------- */
function SelObj(id) {
  const g = () => Obj.get(id);
  return baseSel({
    kind: 'icon', ref: id,
    name() { const o = g(); return o ? '"' + o.name + '"' : 'a deleted object'; },
    kindLabel() { const o = g(); return o ? (TYPES[o.type] || {}).label || o.type : 'Object'; },
    sheetSpec() {
      const o = g(); if (!o) return null; const t = TYPES[o.type] || {};
      const groups = [{ label: 'Identification', fields: [
        { l: 'Name', t: 'text', get: () => o.name,
          set: v => { const n = String(v).slice(0, 48).trim(); if (n) o.name = n; } },
        RO('Kind', t.label || o.type),
        RO('Created', fmtDateTime(o.created)),
        RO('Size', fmtBytes(Obj.size(o.id))),
        RO('Where', o.parent ? Obj.path(o.parent) : 'Desktop')
      ]}].concat((t.sheet ? t.sheet(o) : []) || []);
      return { title: (t.label || o.type) + ' Properties — ' + o.name, groups, objId: o.id };
    },
    props() { const o = g(); return o ? JSON.parse(JSON.stringify(o.props)) : null; },
    applyProps(bag) {
      const o = g(); if (!o || !bag) return null;
      const before = JSON.parse(JSON.stringify(o.props));
      let n = 0;
      for (const k in bag) if (k in o.props) { o.props[k] = bag[k]; n++; }
      if (!n) return null;
      UI.refreshAll();
      return { label: 'copying properties to ' + o.name,
               fn: () => { o.props = before; UI.refreshAll(); } };
    },
    canPut(src) {
      const o = g(); if (!o) return false;
      const t = TYPES[o.type] || {};
      if (src.kind !== 'icon') return false;
      const c = Obj.get(src.ref); if (!c) return false;
      if (c.id === o.id || Obj.contains(c.id, o.id)) return false;
      return !!(t.accepts && t.accepts(o, c));
    },
    put(src, mode) {
      const o = g(); if (!o) return null;
      return Services.deposit(o, src, mode);
    },
    remove() {
      const o = g(); if (!o) return null;
      const t = TYPES[o.type] || {};
      if (t.deletable === false) {
        const w = (t.label || o.type).toLowerCase();
        return { refuse: (/^[aeiou]/.test(w) ? 'An ' : 'A ') + w +
          ' is part of the workstation. It cannot be deleted.' };
      }
      const waste = World.waste();
      if (!waste || Obj.contains(waste.id, o.id) || o.id === waste.id) {
        const rep = Obj.serialize(o.id), par = o.parent, cell = o.cell;
        Obj.remove(o.id); UI.refreshAll();
        return { label: 'deleting ' + o.name,
                 fn: () => { const n = Obj.deserialize(rep); n.parent = par; n.cell = cell; UI.refreshAll(); } };
      }
      const par = o.parent, cell = o.cell;
      o.parent = waste.id; o.cell = null;
      Win.closeFor(o.id); UI.refreshAll();
      return { label: 'deleting ' + o.name,
               fn: () => { o.parent = par; o.cell = cell; UI.refreshAll(); } };
    },
    openable() { const o = g(); return !!(o && (TYPES[o.type] || {}).openable); },
    open() { const o = g(); return o ? Win.open(o.id) : null; },
    helpKey() { const o = g(); return o ? ((TYPES[o.type] || {}).help || 'object') : 'general'; }
  });
}

/* --- the Desktop itself --------------------------------------------- */
function SelDesktop(cell) {
  const d = () => World.desktop();
  return baseSel({
    kind: 'desktop', ref: 'DESKTOP', cell: cell == null ? null : cell,
    name() { return 'the Desktop'; },
    kindLabel() { return 'Desktop'; },
    sheetSpec() { return SelObj(d().id).sheetSpec(); },
    props() { return SelObj(d().id).props(); },
    applyProps(b) { return SelObj(d().id).applyProps(b); },
    canPut(src) { return src.kind === 'icon' || src.kind === 'window'; },
    put(src, mode) {
      if (src.kind === 'window') return null;
      return Services.deposit(d(), src, mode, this.cell);
    },
    remove() { return { refuse: 'The Desktop cannot be deleted. You are standing on it.' }; },
    helpKey() { return 'desktop'; }
  });
}

/* --- a window ------------------------------------------------------- */
function SelWin(wid) {
  const w = () => Win.get(wid);
  return baseSel({
    kind: 'window', ref: wid,
    name() { const x = w(); return x ? 'the window "' + x.title + '"' : 'a closed window'; },
    kindLabel() { return 'Window'; },
    sheetSpec() { const x = w(); if (!x) return null; return Win.sheetFor(x); },
    props() { const x = w(); return x ? JSON.parse(JSON.stringify(x.props)) : null; },
    applyProps(bag) { const x = w(); if (!x || !bag) return null;
      const before = JSON.parse(JSON.stringify(x.props));
      let n = 0; for (const k in bag) if (k in x.props) { x.props[k] = bag[k]; n++; }
      if (!n) return null; Win.render();
      return { label: 'copying properties to the window', fn: () => { x.props = before; Win.render(); } }; },
    canPut() { return false; },
    remove() { const x = w(); if (!x) return null;
      const rep = Win.snapshot(x); Win.close(wid);
      return { label: 'closing the window "' + rep.title + '"',
               fn: () => { Win.restore(rep); } }; },
    openable() { return false; },
    helpKey() { return 'window'; }
  });
}

/* --- a property sheet, which is also an object ----------------------- */
function SelSheet(sid) {
  const s = () => Sheets.get(sid);
  return baseSel({
    kind: 'sheet', ref: sid,
    name() { const x = s(); return x ? 'the property sheet "' + x.spec.title + '"' : 'a closed sheet'; },
    kindLabel() { return 'Property Sheet'; },
    sheetSpec() { const x = s(); return x ? Sheets.metaSheet(x) : null; },
    props() { const x = s(); return x ? JSON.parse(JSON.stringify(x.props)) : null; },
    applyProps(bag) { const x = s(); if (!x || !bag) return null;
      const before = JSON.parse(JSON.stringify(x.props));
      for (const k in bag) if (k in x.props) x.props[k] = bag[k];
      Sheets.repaint(sid);
      return { label: 'copying properties to a property sheet',
               fn: () => { x.props = before; Sheets.repaint(sid); } }; },
    canPut() { return false; },
    remove() { const x = s(); if (!x) return null;
      const rep = Sheets.snapshot(x); Sheets.close(sid);
      return { label: 'closing a property sheet', fn: () => Sheets.restore(rep) }; },
    helpKey() { return 'sheet'; }
  });
}

/* --- a run of characters in a document ------------------------------ */
function SelText(docId, a, b, gran) {
  const norm = () => Doc.normalize(a, b);
  return baseSel({
    kind: 'text', ref: docId, a, b, gran: gran || 'character',
    same(o) { return o.kind === 'text' && o.ref === docId; },
    name() {
      const r = norm(), s = Doc.textOf(docId, r);
      if (!s.length) return 'an insertion point';
      const t = s.length > 26 ? s.slice(0, 24) + '…' : s;
      return '"' + t.replace(/\n/g, ' ') + '"';
    },
    kindLabel() { const r = norm();
      return Doc.textOf(docId, r).length ? 'Character Run' : 'Insertion point'; },
    sheetSpec() { return Doc.textSheet(docId, norm(), this.gran); },
    props() { return Doc.charPropsOf(docId, norm()); },
    applyProps(bag) { return Doc.applyCharProps(docId, norm(), bag); },
    canPut(src) { return src.kind === 'text' || src.kind === 'char'; },
    put(src, mode) { return Doc.putText(docId, norm(), src, mode); },
    remove() { return Doc.deleteRange(docId, norm()); },
    openable() { return false; },
    helpKey() { return 'text'; }
  });
}

/* --- a frame inside a document: graphics, table or equation --------- */
function SelFrame(docId, bi) {
  const blk = () => (Obj.get(docId) || { data: {} }).data.body[bi];
  const kindName = () => { const b = blk(); return !b ? 'Frame' :
    b.t === 'gfx' ? 'Graphics Frame' : b.t === 'tbl' ? 'Table' :
    b.t === 'eqn' ? 'Equation' : 'Frame'; };
  return baseSel({
    kind: 'frame', ref: docId + '#' + bi, docId, bi,
    name() { const b = blk(); return b ? 'the ' + kindName().toLowerCase() +
      (b.cap ? ' "' + b.cap + '"' : '') : 'a frame'; },
    kindLabel() { return kindName(); },
    sheetSpec() { return Doc.frameSheet(docId, bi); },
    props() { const b = blk(); return b ? JSON.parse(JSON.stringify(b.props || {})) : null; },
    applyProps(bag) { return Doc.applyFrameProps(docId, bi, bag); },
    canPut(src) { return src.kind === 'frame' || src.kind === 'text'; },
    put(src, mode) { return Doc.putFrame(docId, bi, src, mode); },
    remove() { return Doc.deleteBlock(docId, bi); },
    helpKey() { const b = blk(); return b && b.t === 'tbl' ? 'table' :
      b && b.t === 'eqn' ? 'equation' : 'graphics'; }
  });
}

/* --- one shape inside a graphics frame ------------------------------ */
function SelShape(docId, bi, sid) {
  const sh = () => { const b = (Obj.get(docId) || { data: {} }).data.body[bi];
    return b && b.shapes ? b.shapes.find(s => s.id === sid) : null; };
  const KN = { line: 'Line', box: 'Box', ell: 'Ellipse', arc: 'Arc', txt: 'Text Label' };
  return baseSel({
    kind: 'shape', ref: docId + '#' + bi + '#' + sid, docId, bi, sid,
    name() { const s = sh(); return s ? 'a ' + (KN[s.k] || 'shape').toLowerCase() : 'a shape'; },
    kindLabel() { const s = sh(); return s ? (KN[s.k] || 'Shape') : 'Shape'; },
    sheetSpec() { return Doc.shapeSheet(docId, bi, sid); },
    props() { const s = sh(); if (!s) return null;
      return { fill: s.fill, lw: s.lw, f: s.f, z: s.z, dash: s.dash }; },
    applyProps(bag) { return Doc.applyShapeProps(docId, bi, sid, bag); },
    canPut(src) { return false; },
    remove() { return Doc.deleteShape(docId, bi, sid); },
    helpKey() { return 'graphics'; }
  });
}

/* --- a table cell --------------------------------------------------- */
function SelCell(docId, bi, r, c) {
  return baseSel({
    kind: 'cell', ref: docId + '#' + bi + '#' + r + ',' + c, docId, bi, r, c,
    name() { return r < 0 ? 'the column heading "' + Doc.colName(docId, bi, c) + '"'
                          : 'the cell at row ' + (r + 1) + ', column ' + (c + 1); },
    kindLabel() { return r < 0 ? 'Column' : 'Table Cell'; },
    sheetSpec() { return Doc.cellSheet(docId, bi, r, c); },
    props() { return Doc.cellProps(docId, bi, r, c); },
    applyProps(bag) { return Doc.applyCellProps(docId, bi, r, c, bag); },
    canPut(src) { return src.kind === 'cell' || src.kind === 'text' || src.kind === 'char'; },
    put(src, mode) { return Doc.putCell(docId, bi, r, c, src, mode); },
    remove() { return Doc.clearCell(docId, bi, r, c); },
    helpKey() { return 'table'; }
  });
}

/* --- one record in a record file ------------------------------------ */
function SelRecord(fileId, row) {
  return baseSel({
    kind: 'record', ref: fileId + '#' + row, fileId, row,
    name() { const o = Obj.get(fileId); if (!o) return 'a record';
      const r = o.data.rows[row]; return r ? 'the record for ' + r[0] + ' ' + (r[1] || '') : 'a record'; },
    kindLabel() { return 'Record'; },
    sheetSpec() { return Records.sheet(fileId, row); },
    props() { const o = Obj.get(fileId); return o ? { row: o.data.rows[row].slice() } : null; },
    applyProps() { return { refuse: 'Records take their properties from their fields.' }; },
    canPut() { return false; },
    remove() { return Records.deleteRow(fileId, row); },
    helpKey() { return 'records'; }
  });
}

/* --- one character in the character-set window ----------------------- */
function SelChar(ch, code, script) {
  return baseSel({
    kind: 'char', ref: 'ch:' + code, ch, code, script,
    name() { return 'the character ' + (this.ch ? '“' + this.ch + '”' : '') +
      ' (' + this.script + ', ' + this.code + ')'; },
    kindLabel() { return 'Character'; },
    sheetSpec() { return CharSet.sheet(this); },
    props() { return { script: this.script }; },
    canPut() { return false; },
    remove() { return { refuse: 'The character set is read only. Characters cannot be deleted from it.' }; },
    helpKey() { return 'charset'; }
  });
}

/* ======================================================================
   3 · THE UNIVERSAL COMMAND DISPATCHER
   Every operation in the system arrives here. Nine commands, each on its
   own key, each written exactly once, none of them containing a single
   line that knows what kind of thing it is acting on.

     MOVE   select, press the key, then designate where it goes.
            This is not dragging. It was Star's primary idiom and it is
            the whole argument: the noun first, then the verb, then the
            destination.
     COPY   the same, and the original stays.
     SAME   copies properties from the selection to what you designate.
     DELETE removes the selection.
     PROP'S opens the selection's property sheet.
     AGAIN  repeats the last command on the current selection.
     UNDO   reverses the last operation, anywhere in the system.
     OPEN   opens the selection.
     HELP   explains the selection.
   ====================================================================== */
const Cmd = (() => {
  let pending = null;          /* {cmd, src:[Selectable]}                */
  let history = [];            /* {label, fn}                            */
  let last = null;             /* {cmd, dest, bag} for AGAIN             */

  const COMMANDS = ['MOVE', 'COPY', 'SAME', 'DELETE', 'PROP’S', 'AGAIN', 'UNDO', 'OPEN', 'HELP'];

  function push(u) {
    if (!u || !u.fn) return;
    history.push(u); if (history.length > 80) history.shift();
    Keys.setUndo(u.label);
  }
  function pushMulti(label, fns) {
    const list = fns.filter(Boolean);
    if (!list.length) return;
    push({ label, fn: () => { for (let i = list.length - 1; i >= 0; i--) list[i](); } });
  }
  function cancelPending(quiet) {
    if (!pending) return;
    pending = null; Msg.mode(''); Keys.arm(null);
    if (!quiet) Msg.say('Cancelled.');
  }

  /* the designation half of MOVE, COPY and SAME */
  function designate(dest) {
    if (!pending) return false;
    const p = pending, verb = p.cmd;
    pending = null; Msg.mode(''); Keys.arm(null);
    if (!dest) { Msg.say('Nothing there to ' + verb.toLowerCase() + ' to.', true); return true; }

    if (verb === 'SAME') {
      const src = p.src[0];
      const bag = src.props();
      if (!bag) { Msg.say('That has no properties to copy.', true); return true; }
      const u = dest.applyProps(bag);
      if (!u) { Msg.say('Those properties do not apply to ' + dest.name() + '.', true); return true; }
      if (u.refuse) { Msg.say(u.refuse, true); return true; }
      push(u); last = { cmd: 'SAME', bag };
      Msg.say('Properties of ' + src.name() + ' copied to ' + dest.name() + '.');
      return true;
    }

    const mode = verb === 'MOVE' ? 'move' : 'copy';
    const names = p.src.map(s => s.name()), destName = dest.name();
    const undos = []; let done = 0, refused = '', spoke = false;
    p.src.forEach((s, i) => {
      if (!dest.canPut(s)) { refused = refused || (destName + ' will not accept ' + names[i] + '.'); return; }
      const u = dest.put(s, mode);
      if (!u) { refused = refused || ('That ' + mode + ' could not be made.'); return; }
      if (u.refuse) { refused = refused || u.refuse; return; }
      undos.push(u.fn); done++;
      if (u.message && p.src.length === 1) { Msg.say(u.message); spoke = true; }
      if (u.silent) spoke = true;
    });
    if (done) {
      pushMulti((mode === 'move' ? 'moving ' : 'copying ') + (done > 1 ? done + ' objects' : names[0]), undos);
      last = { cmd: verb, dest };
      if (!spoke) Msg.say((mode === 'move' ? 'Moved ' : 'Copied ') +
        (done > 1 ? done + ' objects' : names[0]) + ' to ' + destName + '.');
      UI.refreshAll();
    } else Msg.say(refused || 'That cannot go there.', true);
    return true;
  }

  function arm(verb) {
    const src = Sel.items.slice();
    if (!src.length) { Msg.say('Select something first, then press ' + verb + '. ' +
      'This machine is noun then verb, never the other way round.', true); return; }
    if (verb === 'SAME' && src.length > 1) {
      Msg.say('SAME copies the properties of one object. Select just one.', true); return; }
    pending = { cmd: verb, src };
    Msg.mode(verb + ' to…');
    Keys.arm(verb);
    Msg.say(verb === 'SAME'
      ? 'Now designate the object that should take the properties of ' + src[0].name() + '.'
      : 'Now designate where ' + Sel.describe() + ' should go. (Press the same key again, or STOP, to cancel.)');
  }

  function exec(name) {
    Keys.flash(name);
    Sound.click();
    const N = name.replace('’', "'");

    /* pressing the armed key again cancels; any other command replaces */
    if (pending && (pending.cmd === N || N === 'STOP')) { cancelPending(); return; }
    if (pending && ['MOVE', 'COPY', 'SAME'].indexOf(N) < 0) cancelPending(true);

    switch (N) {
      case 'MOVE': case 'COPY': case 'SAME': arm(N); return;

      case 'DELETE': {
        const src = Sel.items.slice();
        if (!src.length) { Msg.say('Nothing is selected, so there is nothing to delete.', true); return; }
        /* names are read before anything is removed, or they name whatever
           slid into the gap */
        const names = src.map(s => s.name());
        const undos = []; let n = 0, refused = '';
        src.forEach((s, i) => { const u = s.remove();
          if (!u) { refused = refused || (names[i] + ' cannot be deleted.'); return; }
          if (u.refuse) { refused = refused || u.refuse; return; }
          undos.push(u.fn); n++; });
        if (n) { pushMulti('deleting ' + (n > 1 ? n + ' objects' : names[0]), undos);
          last = { cmd: 'DELETE' }; Sel.clear();
          Msg.say('Deleted ' + (n > 1 ? n + ' objects' : names[0]) +
            (src[0].kind === 'icon' ? '. It is in the wastebasket. UNDO will bring it back.' : '. UNDO will bring it back.'));
          UI.refreshAll();
        } else Msg.say(refused, true);
        return;
      }

      case "PROP'S": {
        const s = Sel.only();
        if (!s) {
          if (!Sel.count()) { Sel.set([SelDesktop()]);
            Msg.say('Nothing was selected, so this is the Desktop’s own property sheet.'); }
          else { Msg.say('SHOW PROPERTIES works on one object at a time. ' +
            Sel.count() + ' are selected.', true); return; }
        }
        const t = Sel.only(); const spec = t.sheetSpec();
        if (!spec) { Msg.say(t.name() + ' has no properties. That should not happen; ' +
          'in this system everything has properties.', true); return; }
        Sheets.open(spec, t);
        Msg.say('Property sheet for ' + t.name() + '. Every object in the system answers this key.');
        return;
      }

      case 'AGAIN': {
        if (!last) { Msg.say('There is no previous command to repeat.', true); return; }
        if (!Sel.count()) { Msg.say('AGAIN repeats the last command on the current selection. ' +
          'Nothing is selected.', true); return; }
        if (last.cmd === 'SAME' || last.cmd === 'PROPS') {
          const undos = []; let n = 0;
          Sel.items.forEach(s => { const u = s.applyProps(last.bag);
            if (u && !u.refuse) { undos.push(u.fn); n++; } });
          if (n) { pushMulti('repeating the property change', undos);
            Msg.say('AGAIN: the same properties applied to ' + Sel.describe() + '.'); UI.refreshAll(); }
          else Msg.say('AGAIN: those properties do not apply to ' + Sel.describe() + '.', true);
          return;
        }
        if (last.cmd === 'DELETE') { exec('DELETE'); return; }
        if (last.dest) { pending = { cmd: last.cmd, src: Sel.items.slice() };
          Msg.say('AGAIN: repeating ' + last.cmd + ' to ' + last.dest.name() + '.');
          designate(last.dest); return; }
        Msg.say('AGAIN: nothing to repeat on this selection.', true);
        return;
      }

      case 'UNDO': {
        if (!history.length) { Msg.say('There is nothing left to undo.', true); return; }
        const u = history.pop();
        try { u.fn(); } catch (e) { Msg.say('That could not be undone.', true); return; }
        Keys.setUndo(history.length ? history[history.length - 1].label : null);
        Msg.say('Undone: ' + u.label + '.');
        UI.refreshAll();
        return;
      }

      case 'OPEN': {
        const s = Sel.only();
        if (!s) { if (!Sel.count()) { Msg.say('Select something to open.', true); return; }
          let n = 0; Sel.items.forEach(x => { if (x.openable()) { x.open(); n++; } });
          Msg.say(n ? 'Opened ' + n + ' objects.' : 'None of those can be opened.', !n); return; }
        if (!s.openable()) { Msg.say(s.name() + ' cannot be opened. Try SHOW PROPERTIES instead — ' +
          'everything answers that.', true); return; }
        s.open(); return;
      }

      case 'HELP': Help.forSelection(); return;
      case 'STOP': Msg.say('Stopped.'); return;
      default: Msg.say('Unknown command.', true);
    }
  }

  return { exec, designate, cancelPending, push, pushMulti,
           /* so a property sheet's Apply can be repeated by AGAIN */
           noteProps(bag) { last = { cmd: 'SAME', bag }; },
           get pending() { return pending; },
           get depth() { return history.length; },
           get lastLabel() { return history.length ? history[history.length - 1].label : null; },
           COMMANDS,
           reset() { history = []; pending = null; last = null; Keys.setUndo(null); } };
})();

/* ======================================================================
   4 · PROPERTY SHEET ENGINE
   No property sheet in this system is hand-built. Each one is generated
   from the metadata the object declares, which is why a type registered
   at run time gets a working sheet with no new code. Option sheets are
   the same engine applied to a command that needs arguments.
   Both are overlays — the only things allowed to overlap the tiled
   windows — and both are dismissed with Done or Cancel.
   ====================================================================== */
const Sheets = (() => {
  let list = [], seq = 1;
  const layer = () => $('#sheetLayer');

  function open(spec, owner, opts) {
    const o = opts || {};
    /* one sheet per object, as Star did: pressing the key again raises it */
    const existing = list.find(s => s.key && spec.key && s.key === spec.key);
    if (existing) { raise(existing.id); return existing; }
    const s = {
      id: 'sh' + (seq++), spec, owner, stage: {}, kind: o.kind || 'prop',
      onDone: o.onDone || null, doneLabel: o.doneLabel || 'Done',
      key: spec.key || (spec.objId ? 'obj:' + spec.objId : null),
      x: 0, y: 0, props: { position: 'Where it opened', dismiss: 'Done or Cancel',
                           applies: spec.title || '' }, tab: 0
    };
    list.push(s); build(s); place(s); return s;
  }
  function option(spec, onDone, doneLabel) {
    return open(spec, null, { kind: 'option', onDone, doneLabel: doneLabel || 'Start' });
  }
  const get = id => list.find(s => s.id === id) || null;

  function place(s) {
    const n = s.el, w = n.offsetWidth, h = n.offsetHeight;
    const k = list.filter(x => x !== s).length;
    if (s.x === 0 && s.y === 0) {
      s.x = Math.max(6, Math.min(DESK_W - w - 6, Math.round((DESK_W - w) / 2) + k * 18 - 40));
      s.y = Math.max(6, Math.min(DESK_H - h - 6, 74 + k * 22));
    }
    n.style.left = s.x + 'px'; n.style.top = s.y + 'px';
  }
  function raise(id) { const s = get(id); if (!s) return;
    list = list.filter(x => x.id !== id); list.push(s);
    layer().appendChild(s.el); }

  function val(s, f, i) {
    const k = f.k || ('f' + i);
    return (k in s.stage) ? s.stage[k] : (f.get ? f.get() : '');
  }
  function setVal(s, f, i, v) { s.stage[f.k || ('f' + i)] = v; }

  function build(s) {
    const n = el('div', 'sheet');
    n.dataset.id = s.id;
    const hdr = el('div', 'shdr');
    const ttl = el('div', 'stitle', s.spec.title);
    hdr.appendChild(ttl);
    const bts = el('div', 'sbtns');
    const mk = (lbl, fn) => { const b = el('div', 'hb', lbl);
      b.onmousedown = ev => { ev.stopPropagation(); }; b.onclick = ev => { ev.stopPropagation(); fn(); };
      bts.appendChild(b); return b; };
    if (s.kind === 'option') { mk(s.doneLabel, () => commit(s, true)); mk('Cancel', () => close(s.id)); }
    else {
      mk('Done', () => commit(s, true));
      mk('Apply', () => commit(s, false));
      if (s.spec.objId) mk('Defaults', () => defaults(s));
      mk('Cancel', () => close(s.id));
    }
    hdr.appendChild(bts);
    n.appendChild(hdr);
    const body = el('div', 'sbody');
    n.appendChild(body);
    s.el = n; layer().appendChild(n);
    paint(s);

    /* the header is the sheet as an object: SELECT it and it is selected,
       which is how you get a property sheet for a property sheet */
    hdr.addEventListener('mousedown', ev => {
      if (ev.button === 2) { ev.preventDefault(); Sel.add(SelSheet(s.id)); return; }
      if (ev.button !== 0) return;
      raise(s.id);
      if (Cmd.pending) { Cmd.designate(SelSheet(s.id)); return; }
      Sel.set([SelSheet(s.id)]);
      Msg.say('The property sheet is selected. Press SHOW PROPERTIES again for its own sheet, ' +
              'or MOVE to put it somewhere else.');
    });
    n.addEventListener('mousedown', ev => { raise(s.id); }, true);
    n.addEventListener('contextmenu', ev => ev.preventDefault());
  }

  function paint(s) {
    const body = $('.sbody', s.el);
    body.innerHTML = '';
    let groups = s.spec.groups || [];
    if (s.spec.tabs) {
      const tb = el('div', 'stab');
      s.spec.tabs.forEach((t, i) => { const x = el('div', 't' + (i === s.tab ? ' on' : ''), t);
        x.onclick = () => { s.tab = i; paint(s); }; tb.appendChild(x); });
      body.appendChild(tb);
      groups = (s.spec.groups || []).filter(g => (g.tab || 0) === s.tab);
    }
    groups.forEach(g => {
      const gd = el('div', 'grp');
      if (g.label) gd.appendChild(el('div', 'gl', g.label));
      if (g.note) { const p = el('div', 'snote', g.note); gd.appendChild(p); }
      (g.fields || []).forEach((f, i) => {
        if (f.when && !f.when()) return;
        const row = el('div', 'fld');
        row.appendChild(el('div', 'fl', f.l != null ? f.l + (f.t === 'ro' ? '' : '') : ''));
        const v = el('div', 'fv');
        renderField(s, f, i, v);
        row.appendChild(v); gd.appendChild(row);
      });
      body.appendChild(gd);
    });
    if (s.spec.note) body.appendChild(el('div', 'snote', s.spec.note));
    if (s.spec.foot) { const f = el('div', 'snote'); f.innerHTML = s.spec.foot; body.appendChild(f); }
  }

  function renderField(s, f, i, host) {
    const cur = val(s, f, i);
    switch (f.t) {
      case 'ro': host.appendChild(el('div', 'sro', String(cur == null ? '—' : cur))); break;
      case 'text': case 'num': {
        const inp = el('input', 'sfield');
        inp.type = 'text'; inp.value = cur == null ? '' : String(cur);
        inp.size = f.t === 'num' ? 6 : (f.wide ? 40 : 22);
        inp.oninput = () => setVal(s, f, i, f.t === 'num' ? (parseFloat(inp.value) || 0) : inp.value);
        inp.onkeydown = ev => { ev.stopPropagation();
          if (ev.key === 'Enter') commit(s, s.kind === 'option'); };
        host.appendChild(inp);
        if (f.unit) host.appendChild(el('span', 'sro', ' ' + f.unit));
        break;
      }
      case 'toggle': {
        const b = el('div', 'chbtn' + (cur ? ' on' : ''), cur ? 'Yes' : 'No');
        b.onclick = () => { setVal(s, f, i, !cur); paint(s); };
        host.appendChild(b); break;
      }
      case 'choice': {
        (f.opts || []).forEach(op => {
          const lbl = f.labels ? f.labels[f.opts.indexOf(op)] : String(op);
          const on = String(cur) === String(op);
          const b = el('div', 'chbtn' + (on ? ' on' : ''), lbl);
          b.onclick = () => { setVal(s, f, i, f.num ? Number(op) : op); paint(s);
            if (f.live) commit(s, false); };
          host.appendChild(b);
        });
        break;
      }
      case 'multi': {
        const set = new Set([].concat(cur || []));
        (f.opts || []).forEach(op => {
          const b = el('div', 'chbtn' + (set.has(op) ? ' on' : ''), String(op));
          b.onclick = () => { set.has(op) ? set.delete(op) : set.add(op);
            setVal(s, f, i, Array.from(set)); paint(s); };
          host.appendChild(b);
        });
        break;
      }
      case 'pat': {
        Display.PATTERNS.forEach(p => {
          const b = el('div', 'chbtn pat' + (cur === p.id ? ' on' : ''));
          b.title = p.name;
          b.setAttribute('style', Display.cssPat(p.id) + (cur === p.id ? ';outline:2px solid #000;outline-offset:1px' : ''));
          b.onclick = () => { setVal(s, f, i, p.id); paint(s); };
          host.appendChild(b);
        });
        break;
      }
      case 'face': {
        FACES.forEach(fc => { const on = cur === fc;
          const b = el('div', 'chbtn' + (on ? ' on' : ''), fc);
          b.style.fontFamily = Doc.cssFace(fc);
          b.onclick = () => { setVal(s, f, i, fc); paint(s); };
          host.appendChild(b); });
        break;
      }
      case 'btn': {
        const b = el('div', 'chbtn', f.label || 'Do it');
        b.onclick = () => { if (f.act) f.act(s); };
        host.appendChild(b); break;
      }
      default: host.appendChild(el('div', 'sro', String(cur)));
    }
  }

  function commit(s, closeAfter) {
    if (s.kind === 'option') {
      const out = {};
      (s.spec.groups || []).forEach(g => (g.fields || []).forEach((f, i) => {
        if (f.k) out[f.k] = val(s, f, i); }));
      close(s.id);
      if (s.onDone) s.onDone(out);
      return;
    }
    const befores = [], afters = [], bag = {};
    (s.spec.groups || []).forEach(g => (g.fields || []).forEach((f, i) => {
      const k = f.k || ('f' + i);
      if (!(k in s.stage) || !f.set) return;
      const nv = s.stage[k], ov = f.get ? f.get() : undefined;
      if (String(nv) === String(ov)) return;
      befores.push(() => f.set(ov)); afters.push(() => f.set(nv));
      if (f.k) bag[f.k] = nv;
    }));
    if (afters.length) {
      afters.forEach(fn => fn());
      s.stage = {};
      Cmd.push({ label: 'the change to ' + (s.spec.shortTitle || s.spec.title),
                 fn: () => { befores.forEach(fn => fn()); UI.refreshAll(); Sheets.repaintAll(); } });
      Cmd.noteProps(bag);
      Msg.say(afters.length + (afters.length > 1 ? ' properties' : ' property') +
              ' applied. UNDO reverses it; AGAIN applies the same change to the next thing you select.');
      UI.refreshAll();
      repaintAll();
    } else if (!closeAfter) Msg.say('Nothing in the sheet was changed.');
    if (closeAfter) close(s.id);
  }

  function defaults(s) {
    const o = Obj.get(s.spec.objId); if (!o) return;
    const t = TYPES[o.type] || {};
    const before = JSON.parse(JSON.stringify(o.props));
    o.props = Object.assign({}, t.defaults || {});
    s.stage = {}; paint(s); UI.refreshAll();
    Cmd.push({ label: 'restoring the defaults for ' + o.name,
               fn: () => { o.props = before; UI.refreshAll(); repaintAll(); } });
    Msg.say('Defaults restored for ' + o.name + '.');
  }

  function close(id) { const s = get(id); if (!s) return;
    if (s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el);
    list = list.filter(x => x.id !== id);
    Sel.set(Sel.items.filter(i => !(i.kind === 'sheet' && i.ref === id)));
  }
  function closeAll() { list.slice().forEach(s => close(s.id)); }
  function repaint(id) { const s = get(id); if (s) { paint(s); paintSel(); } }
  function repaintAll() { list.forEach(s => { if (!Object.keys(s.stage).length) paint(s); }); paintSel(); }
  function paintSel() { list.forEach(s => s.el.classList.toggle('selSheet',
    Sel.items.some(i => i.kind === 'sheet' && i.ref === s.id))); }

  function snapshot(s) { return { spec: s.spec, kind: s.kind, x: s.x, y: s.y,
    onDone: s.onDone, doneLabel: s.doneLabel, owner: s.owner, props: s.props }; }
  function restore(r) { const s = open(r.spec, r.owner, { kind: r.kind, onDone: r.onDone,
    doneLabel: r.doneLabel }); s.x = r.x; s.y = r.y; s.props = r.props;
    s.el.style.left = s.x + 'px'; s.el.style.top = s.y + 'px'; return s; }

  /* the sheet's own property sheet — the object model does not blink */
  function metaSheet(s) {
    return { title: 'Property Sheet Properties', shortTitle: 'this property sheet', key: 'meta:' + s.id,
      groups: [
        { label: 'This sheet', fields: [
          RO('Shows the properties of', s.spec.title),
          RO('Kind', s.kind === 'option' ? 'Option sheet' : 'Property sheet'),
          RO('Groups', String((s.spec.groups || []).length)),
          RO('Fields', String((s.spec.groups || []).reduce((a, g) => a + (g.fields || []).length, 0))),
          { k: 'dismiss', l: 'Dismissed with', t: 'choice', opts: ['Done or Cancel'],
            get: () => s.props.dismiss, set: v => { s.props.dismiss = v; } }
        ]},
        { label: 'Where it sits', fields: [
          { k: 'px', l: 'Left', t: 'num', get: () => s.x,
            set: v => { s.x = Math.max(0, Math.min(DESK_W - 60, v | 0)); s.el.style.left = s.x + 'px'; } },
          { k: 'py', l: 'Top', t: 'num', get: () => s.y,
            set: v => { s.y = Math.max(0, Math.min(DESK_H - 30, v | 0)); s.el.style.top = s.y + 'px'; } }
        ]}
      ],
      note: 'A property sheet is an object, so it has properties, so this exists. ' +
            'The object model was not asked to make an exception and it did not make one.' };
  }

  return { open, option, get, close, closeAll, repaint, repaintAll, snapshot, restore,
           metaSheet, paintSel, raise, get list() { return list; },
           at(x, y) { for (let i = list.length - 1; i >= 0; i--) { const s = list[i], r = s.el;
             if (x >= s.x && x <= s.x + r.offsetWidth && y >= s.y && y <= s.y + r.offsetHeight) return s; }
             return null; } };
})();

/* ======================================================================
   9 · NETWORK SERVICES
   Star assumed a network from the start. A file drawer is a volume on a
   file server; the baskets are the mail service; a printer icon is a
   print service on the Ethernet. All three are reached with the same
   gesture — select, press MOVE, designate the icon — and that is the
   entire user interface to the network. One idiom, three services.
   ====================================================================== */
const World = {
  desktop() { let d = Obj.all().find(o => o.type === 'desktop');
    if (!d) d = Obj.make('desktop', 'Desktop'); return d; },
  one(t) { return Obj.all().find(o => o.type === t) || null; },
  waste() { return World.one('wastebasket'); },
  inb() { return World.one('inbasket'); },
  outb() { return World.one('outbasket'); },
  onDesk() { const d = World.desktop(); return Obj.all().filter(o => o.parent === d.id); },
  cellUsed(c) { return World.onDesk().some(o => o.cell === c); },
  freeCell(prefer) {
    const N = GRID_C * GRID_R;
    if (prefer != null && prefer >= 0 && prefer < N && !World.cellUsed(prefer)) return prefer;
    if (prefer != null) { for (let d = 1; d < N; d++) {
      for (const c of [prefer + d, prefer - d, prefer + d * GRID_C, prefer - d * GRID_C])
        if (c >= 0 && c < N && !World.cellUsed(c)) return c; } }
    for (let c = 0; c < N; c++) if (!World.cellUsed(c)) return c;
    return null;
  },
  cellXY(c) { return { x: GRID_X + (c % GRID_C) * CELL, y: GRID_Y + Math.floor(c / GRID_C) * CELL }; },
  cellAt(x, y) { const c = Math.floor((x - GRID_X) / CELL), r = Math.floor(y / CELL);
    if (c < 0 || c >= GRID_C || r < 0 || r >= GRID_R) return null; return r * GRID_C + c; }
};

const Services = {
  /* Every deposit in the system comes through here. The universal
     commands do not know that printing is different from filing,
     because as far as the user's gesture is concerned it is not. */
  deposit(target, src, mode, cell) {
    if (src.kind !== 'icon') return null;
    const o = Obj.get(src.ref); if (!o || !target) return null;
    const t = TYPES[o.type] || {};
    if (mode === 'move' && t.movable === false)
      return { refuse: (t.label || o.type) + ' is part of the workstation and stays where it is. ' +
        'COPY works, though.' };

    /* ---- the print service ---- */
    if (target.type === 'printer') {
      const pages = Doc.pageCount(o);
      const spec = Services.printSheet(o, target, pages);
      Sheets.option(spec, out => {
        const job = Obj.make('job', o.name, { parent: target.id,
          props: { copies: out.copies || 1, sides: out.sides, priority: out.priority,
                   pages, status: 'Waiting' }, data: { of: o.id } });
        Cmd.push({ label: 'printing ' + o.name, fn: () => { Obj.remove(job.id); UI.refreshAll(); } });
        Msg.say('"' + o.name + '" sent to ' + target.name + ' — ' + pages +
                (pages === 1 ? ' page' : ' pages') + ', ' + (out.copies || 1) +
                (out.copies > 1 ? ' copies' : ' copy') + '. Open the printer to watch the queue.');
        Sound.disk(0.5); UI.refreshAll(); Services.tickPrinter(target.id);
      }, 'Print');
      return { label: 'printing ' + o.name, fn: () => {}, silent: true,
               message: 'Fill in the option sheet, then press Print.' };
    }

    /* ---- the mail service ---- */
    if (target.type === 'outbasket') {
      Sheets.option(Services.mailSheet(o), out => {
        const note = Obj.make('mail', o.name, { parent: target.id,
          props: { from: 'Hartnell:Ashfield:Institute', to: out.to, subject: out.subject || o.name,
                   read: true, sent: false },
          data: { body: [ { t: 'p', style: Doc.PS(), runs: [ { s: out.covering ||
                    'Attached, as discussed.', cp: Doc.CP() } ] } ], enclosure: o.id,
                  enclosureRep: Obj.serialize(o.id) } });
        Cmd.push({ label: 'mailing ' + o.name, fn: () => { Obj.remove(note.id); UI.refreshAll(); } });
        Msg.say('"' + o.name + '" is in the out-basket for ' + out.to +
                '. The mail service will take it on the next sweep.');
        Sound.disk(0.4); UI.refreshAll();
        setTimeout(() => { if (Obj.get(note.id)) { note.props.sent = true; UI.refreshAll();
          Msg.say('The mail service has taken "' + note.name + '".'); } }, 4200);
        setTimeout(() => Services.maybeReply(out.to, out.subject || o.name), 12000);
      }, 'Mail');
      return { label: 'mailing ' + o.name, fn: () => {}, silent: true,
               message: 'Fill in the option sheet, then press Mail.' };
    }

    /* ---- filing, and every other container: the plain case ---- */
    const par = o.parent, oldCell = o.cell;
    if (mode === 'copy') {
      /* the name is settled before the copy joins its new siblings, or it
         collides with itself and comes out as "(2)" */
      const nm = Services.uniqueName(target.id, o.name);
      const fromStationery = (Obj.get(o.parent) || {}).type === 'templates';
      const rep = Obj.serialize(o.id);
      const n = Obj.deserialize(rep, { fresh: true });
      n.parent = target.id;
      n.name = nm;
      n.cell = target.type === 'desktop' ? World.freeCell(cell) : null;
      n.created = nowStamp();
      return { label: 'copying ' + o.name, fn: () => { Obj.remove(n.id); UI.refreshAll(); },
               message: fromStationery
                 ? 'A new ' + ((TYPES[n.type] || {}).label || n.type).toLowerCase() +
                   ' on the Desktop, from blank stationery. There is no New command in this ' +
                   'system; COPY is the New command. Press SHOW PROPERTIES to give it a name.'
                 : Services.depositMsg(target, n, 'Copied') };
    }
    if (target.id === par && target.type === 'desktop') {
      const want = World.freeCell(cell);
      if (want == null) return { refuse: 'There is no free square there.' };
      o.cell = want;
      return { label: 'moving ' + o.name, fn: () => { o.cell = oldCell; UI.refreshAll(); },
               message: '"' + o.name + '" moved. Note what you just did: you selected it, ' +
                        'pressed a key, and pointed. You did not drag it.' };
    }
    o.parent = target.id;
    o.cell = target.type === 'desktop' ? World.freeCell(cell) : null;
    if (target.type !== 'desktop') Win.closeFor(o.id);
    return { label: 'moving ' + o.name,
             fn: () => { o.parent = par; o.cell = oldCell; UI.refreshAll(); },
             message: Services.depositMsg(target, o, 'Moved') };
  },

  depositMsg(target, o, verb) {
    if (target.type === 'drawer')
      return '"' + o.name + '" filed in the file drawer "' + target.name + '" on the file server. ' +
             'That was the same gesture that prints and the same gesture that mails.';
    if (target.type === 'wastebasket')
      return '"' + o.name + '" is in the wastebasket. UNDO takes it back out.';
    if (target.type === 'floppy')
      return '"' + o.name + '" written to the floppy disk.';
    if (target.type === 'inbasket')
      return '"' + o.name + '" put in the in-basket.';
    return verb + ' "' + o.name + '" to ' + (target.type === 'desktop' ? 'the Desktop' :
           '"' + target.name + '"') + '.';
  },

  uniqueName(parent, name) {
    const sibs = Obj.kids(parent).map(k => k.name);
    if (sibs.indexOf(name) < 0) return name;
    let n = 2; while (sibs.indexOf(name + ' (' + n + ')') >= 0) n++;
    return name + ' (' + n + ')';
  },

  printSheet(o, printer, pages) {
    const st = { copies: 1, sides: printer.props.sides, priority: printer.props.priority,
                 paper: printer.props.paper, banner: printer.props.banner };
    return { title: 'Print Options — ' + o.name, key: 'opt:print:' + o.id, groups: [
      { label: 'Print', fields: [
        { k: 'copies', l: 'Copies', t: 'num', get: () => st.copies },
        { k: 'sides', l: 'Sides', t: 'choice', opts: ['One sided', 'Two sided'], get: () => st.sides },
        { k: 'paper', l: 'Paper', t: 'choice', opts: PAPER, get: () => st.paper },
        { k: 'priority', l: 'Priority', t: 'choice', opts: ['Low', 'Normal', 'Urgent'], get: () => st.priority },
        { k: 'banner', l: 'Banner sheet', t: 'toggle', get: () => st.banner },
        RO('Pages', String(pages)), RO('Printer', printer.name + ':Ashfield:Institute')
      ]}
    ], note: 'An option sheet is a property sheet for a command. Same engine, same buttons, ' +
             'same key discipline — it appears only because Print needs to know something.' };
  },

  mailSheet(o) {
    const people = Obj.all().filter(x => x.type === 'diritem' && x.props.kind === 'Person')
      .map(x => x.name);
    const st = { to: people[0] || 'Duquesne:Ashfield:Institute', subject: o.name, covering: '' };
    return { title: 'Mail Options — ' + o.name, key: 'opt:mail:' + o.id, groups: [
      { label: 'Send to', fields: [
        { k: 'to', l: 'Recipient', t: 'choice', opts: people, get: () => st.to },
        { k: 'subject', l: 'Subject', t: 'text', wide: true, get: () => st.subject },
        { k: 'covering', l: 'Covering note', t: 'text', wide: true, get: () => st.covering }
      ]},
      { label: 'Service', fields: [
        RO('Mail service', 'Kestrel — 8044 Mail Service'),
        RO('Enclosure', o.name + ' (' + fmtBytes(Obj.size(o.id)) + ')')
      ]}
    ]};
  },

  tickPrinter(pid) {
    const p = Obj.get(pid); if (!p) return;
    const q = Obj.kids(pid);
    const running = q.find(j => j.props.status === 'Printing');
    if (!running) { const next = q.find(j => j.props.status === 'Waiting');
      if (!next) return; next.props.status = 'Printing'; UI.refreshAll(); Sound.disk(0.6); }
    setTimeout(() => {
      const pp = Obj.get(pid); if (!pp) return;
      const j = Obj.kids(pid).find(x => x.props.status === 'Printing');
      if (j) { Obj.remove(j.id); UI.refreshAll();
        Msg.say('"' + j.name + '" printed on ' + pp.name + '.'); }
      if (Obj.kids(pid).length) Services.tickPrinter(pid);
    }, 5200 + Math.random() * 2600);
  },

  maybeReply(to, subject) {
    const who = String(to).split(':')[0];

    Services.arrive(to, 'Re: ' + subject, body);
  },

  arrive(from, subject, blocks) {
    const inb = World.inb(); if (!inb) return;
    const note = Obj.make('mail', subject, { parent: inb.id,
      props: { from, to: 'Hartnell:Ashfield:Institute', subject, read: false },
      data: { body: blocks } });
    UI.refreshAll();
    const how = inb.props.notify;

      '" from ' + String(from).split(':')[0] + '.', how === 'Message and beep');
