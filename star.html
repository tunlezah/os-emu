/* ======================================================================
   UI — repaint. Everything on the screen is derived from the world and
   the selection, so there is exactly one way to bring it up to date.
   ====================================================================== */
const UI = (() => {
  let held = false;
  function refreshIcons() {
    const d = World.desktop();
    const layer = $('#iconLayer');
    layer.innerHTML = '';
    World.onDesk().forEach(o => {
      if (o.cell == null) o.cell = World.freeCell(null);
      if (o.cell == null) return;
      const p = World.cellXY(o.cell);
      layer.appendChild(Icons.node(o, p.x, p.y));
    });
    $('#deskPat').setAttribute('style', Display.cssPat(d.props.pattern || 'p0'));
    $('#deskGrid').classList.toggle('show', !!d.props.grid);
    Display.setOneBit(d.props.depth !== 'Smoothed');
    $('#btnSound').textContent = Sound.on ? 'Sound on' : 'Sound off';
    $('#btnSound').classList.toggle('on', Sound.on);
    $('#btnGrid').classList.toggle('on', !!d.props.grid);
  }
  function refreshAll() {
    if (held) return;
    refreshIcons(); Win.render(); Sheets.repaintAll(); State.saveSoon();
  }
  function paintSelection() { if (held) return; refreshIcons(); Win.render(); Sheets.paintSel(); }
  return { refreshIcons, refreshAll, paintSelection,
           hold(fn) { held = true; try { fn(); } finally { held = false; } refreshAll(); } };
})();

/* ======================================================================
   12 · THE COMMAND KEY BANK
   Star's commands were on dedicated keys on a real keyboard. Visitors
   have no such keyboard, so the bank is drawn under the screen, always
   visible, lighting up as keys are pressed. Without it the central idea
   of this machine is simply unreachable.
   ====================================================================== */
const Keys = (() => {
  const PRIMARY = [
    { n: 'MOVE',    h: 'F1' }, { n: 'COPY',   h: 'F2' }, { n: 'SAME',  h: 'F3' },
    { n: 'DELETE',  h: 'F4' }, { n: "PROP'S", h: 'F5' }, { n: 'AGAIN', h: 'F6' },
    { n: 'UNDO',    h: 'F7' }, { n: 'OPEN',   h: 'F8' }, { n: 'HELP',  h: 'F9' }
  ];
  const SECOND = [
    { n: 'BOLD', h: '^B' }, { n: 'ITALICS', h: '^I' }, { n: 'UNDERLINE', h: '^U' },
    { n: 'LARGER', h: '^.' }, { n: 'SMALLER', h: '^,' }, { n: 'CENTRE', h: '^E' },
    { n: 'FONT', h: '^F' }, { n: 'KEYBOARD', h: '^K' }, { n: 'FIND', h: '^G' },
    { n: 'STOP', h: 'Esc' }
  ];
  const nodes = {};
  function build() {
    const r1 = $('#krow1'), r2 = $('#krow2');
    r1.innerHTML = ''; r2.innerHTML = '';
    PRIMARY.forEach(k => {
      const b = el('div', 'ckey');
      b.innerHTML = '<span class="kt">' + k.n.replace("PROP'S", 'PROP’S') + '</span>' +
                    '<span class="kh">' + k.h + '</span>';
      b.title = k.n + '  —  keyboard ' + k.h;
      b.onclick = () => Cmd.exec(k.n);
      nodes[k.n] = b; r1.appendChild(b);
    });
    SECOND.forEach(k => {
      const b = el('div', 'ckey');
      b.innerHTML = '<span class="kt">' + k.n + '</span>';
      b.title = k.n + '  —  keyboard ' + k.h;
      b.onclick = () => Special.exec(k.n);
      nodes[k.n] = b; r2.appendChild(b);
    });
  }
  let armed = null;
  function flash(n) { const b = nodes[n]; if (!b) return;
    b.classList.add('lit'); setTimeout(() => b.classList.remove('lit'), 150); }
  function arm(n) { Object.values(nodes).forEach(b => b.classList.remove('armed'));
    armed = n; if (n && nodes[n]) nodes[n].classList.add('armed'); }
  function setUndo(label) { const b = nodes.UNDO; if (!b) return;
    b.title = label ? 'UNDO  —  will reverse ' + label : 'UNDO  —  nothing to reverse';
    const h = b.querySelector('.kh'); if (h) h.textContent = label ? 'F7 ·' + Cmd.depth : 'F7'; }
  return { build, flash, arm, setUndo, PRIMARY, SECOND };
})();

/* the other special keys Star had — property changes without a sheet,
   which is what those keys were for */
const Special = (() => {
  function textSel() { return Sel.items.find(i => i.kind === 'text'); }
  function cp(k, fn) {
    const t = textSel();
    if (!t) { Msg.say(k + ' applies to selected text. Select some first.', true); return; }
    const r = Doc.normalize(t.a, t.b);
    if (r.s.b === r.e.b && r.s.i === r.e.i) {
      Msg.say(k + ' needs a run of characters, not just a place between two of them.', true); return; }
    const cur = Doc.charPropsOf(t.ref, r);
    const bag = fn(cur);
    const u = Doc.applyCharProps(t.ref, r, bag);
    if (u) { Cmd.push(u); Cmd.noteProps(bag);
      Msg.say(k + ' applied. AGAIN will do it to the next thing you select.'); }
  }
  function exec(n) {
    Keys.flash(n); Sound.click();
    switch (n) {
      case 'BOLD': cp('BOLD', c => ({ b: !c.b })); return;
      case 'ITALICS': cp('ITALICS', c => ({ i: !c.i })); return;
      case 'UNDERLINE': cp('UNDERLINE', c => ({ u: !c.u })); return;
      case 'LARGER': cp('LARGER', c => ({ z: SIZES[Math.min(SIZES.length - 1, SIZES.indexOf(c.z) + 1)] || c.z + 2 })); return;
      case 'SMALLER': cp('SMALLER', c => ({ z: SIZES[Math.max(0, SIZES.indexOf(c.z) - 1)] || Math.max(6, c.z - 2) })); return;
      case 'CENTRE': {
        const t = textSel();
        if (!t) { Msg.say('CENTRE applies to a paragraph. Select text in one.', true); return; }
        const r = Doc.normalize(t.a, t.b), B = Doc.body(t.ref);
        const before = Doc.snap(t.ref);
        for (let i = r.s.b; i <= r.e.b; i++) { const b = B[i]; if (!Doc.isPara(b)) continue;
          b.style = Doc.PS(b.style);
          b.style.align = b.style.align === 'Centred' ? 'Flush left' : 'Centred'; }
        UI.refreshAll();
        Cmd.push({ label: 'centring the paragraph', fn: () => Doc.restore(t.ref, before) });
        Msg.say('Paragraph alignment changed.');
        return;
      }
      case 'FONT': {
        const t = textSel();
        if (!t) { Msg.say('FONT opens the character property sheet. Select some text first.', true); return; }
        Sheets.open(t.sheetSpec(), t); return;
      }
      case 'KEYBOARD': {
        const c = World.one('charset');
        if (c) { Win.open(c.id); Msg.say('The keyboard windows. Choose a script in the second header row.'); }
        return;
      }
      case 'FIND': find(); return;
      case 'STOP': Cmd.exec('STOP'); Cmd.cancelPending(true); Sel.clear();
        Msg.say('Stopped. Selection cleared.'); return;
    }
  }
  function find() {
    const w = Win.list.find(x => x.kind === 'document' || x.kind === 'book');
    if (!w) { Msg.say('FIND looks in an open document. Open one first.', true); return; }
    const o = Obj.get(w.objId);
    Sheets.option({ title: 'Find Options — ' + o.name, key: 'opt:find', groups: [
      { label: 'Find', fields: [
        { k: 'what', l: 'Text', t: 'text', wide: true, get: () => '' },
        { k: 'from', l: 'Search', t: 'choice', opts: ['From the beginning', 'From the selection'],
          get: () => 'From the beginning' }
      ]}]}, out => {
      const q = String(out.what || ''); if (!q) return;
      const B = Doc.body(o.id);
      let startB = 0, startI = 0;
      if (out.from === 'From the selection') { const t = textSel();
        if (t && t.ref === o.id) { const r = Doc.normalize(t.a, t.b); startB = r.e.b; startI = r.e.i; } }
      for (let b = startB; b < B.length; b++) {
        if (!Doc.isPara(B[b])) continue;
        const T = Doc.blockText(B[b]);
        const i = T.toLowerCase().indexOf(q.toLowerCase(), b === startB ? startI : 0);
        if (i >= 0) { Sel.set([SelText(o.id, { b, i }, { b, i: i + q.length }, 'character')]);
          Msg.say('Found "' + q + '" in paragraph ' + (b + 1) + '. It is selected — now press a command key.');
          UI.refreshAll(); return; }
      }
      Msg.say('"' + q + '" is not in this document.', true);
    }, 'Find');
  }
  return { exec };
})();

/* ======================================================================
   INPUT — SELECT and ADJUST, and nothing else.
   The browser's own context menu is intercepted, because on this machine
   the right button is not a menu: it is ADJUST. A middle button is
   answered honestly rather than ignored.
   ====================================================================== */
const Input = (() => {
  let clickCount = 0, clickAt = 0, clickKey = '';
  let anchor = null;          /* text anchor for ADJUST and sweeping     */
  let focusWin = null;

  function stagePt(ev) { return Display.toStage(ev); }

  function winOf(node) { let n = node; while (n && n !== document.body) {
    if (n.dataset && n.dataset.win) return Win.get(n.dataset.win); n = n.parentNode; } return null; }
  function paneOf(node) { let n = node; while (n && n !== document.body) {
    if (n.dataset && n.dataset.pane) return n; n = n.parentNode; } return null; }
  function docOf(node) { let n = node; while (n && n !== document.body) {
    if (n.dataset && n.dataset.doc) return n.dataset.doc; n = n.parentNode; } return null; }
  function up(node, test) { let n = node; while (n && n !== document.body) {
    if (test(n)) return n; n = n.parentNode; } return null; }

  /* ---- what is under the pointer, as a SELECTABLE ---- */
  function resolve(ev, level) {
    const T = ev.target;
    /* a sheet */
    const sh = up(T, n => n.classList && n.classList.contains('sheet'));
    if (sh) return { sel: SelSheet(sh.dataset.id), dest: SelSheet(sh.dataset.id), inSheet: true };
    /* an icon, in the desktop or in a window */
    const ic = up(T, n => n.dataset && n.dataset.obj);
    if (ic) { const s = SelObj(ic.dataset.obj); return { sel: s, dest: s }; }
    /* a record row */
    const rc = up(T, n => n.dataset && n.dataset.rec);
    if (rc) { const [f, r] = rc.dataset.rec.split('#');
      const s = SelRecord(f, Number(r)); return { sel: s, dest: s }; }
    /* a character in a keyboard window */
    const ch = up(T, n => n.dataset && n.dataset.ch);
    if (ch) { const s = SelChar(ch.dataset.ch, ch.dataset.code, ch.dataset.script);
      return { sel: s, dest: s, isChar: true }; }
    /* inside a document */
    const dp = docOf(T);
    if (dp) {
      const w = winOf(T);
      /* a table cell */
      const td = up(T, n => n.dataset && n.dataset.r != null && n.dataset.c != null);
      if (td) { const s = SelCell(dp, Number(td.dataset.b), Number(td.dataset.r), Number(td.dataset.c));
        return { sel: s, dest: s }; }
      /* a graphics frame, and maybe a shape inside it */
      const gf = up(T, n => n.dataset && n.dataset.gfx);
      if (gf) { const bi = Number(gf.dataset.b);
        const r = gf.getBoundingClientRect();
        const lx = (ev.clientX - r.left) / Display.scale, ly = (ev.clientY - r.top) / Display.scale;
        const b = Doc.blk(dp, bi);
        const hit = (b.shapes || []).slice().reverse().find(sp => { const bb = Doc.shapeBBox(sp);
          return lx >= bb.x - 3 && lx <= bb.x + bb.w + 3 && ly >= bb.y - 3 && ly <= bb.y + bb.h + 3; });
        if (w && w.st.tool && w.st.toolFrame === bi) return { sel: null, dest: null, draw: { bi, lx, ly, w } };
        const s = hit ? SelShape(dp, bi, hit.id) : SelFrame(dp, bi);
        return { sel: s, dest: s, gfx: { bi, lx, ly } };
      }
      /* an equation or a table as a whole */
      const fr = up(T, n => n.dataset && (n.dataset.eqn || n.dataset.tbl));
      if (fr) { const s = SelFrame(dp, Number(fr.dataset.b)); return { sel: s, dest: s }; }
      /* text */
      const p = Doc.posFromPoint(ev.clientX, ev.clientY);
      if (p) { const r = Doc.widen(dp, p, level || 1);
        const s = SelText(dp, r.s, r.e, Doc.GRAN[level || 1]);
        return { sel: s, dest: SelText(dp, p, p, 'character'), textPos: p };
      }
      const s2 = SelObj(dp); return { sel: s2, dest: s2 };
    }
    /* a window header, or the empty part of a window */
    const wn = up(T, n => n.dataset && n.dataset.win);
    if (wn) { const w = Win.get(wn.dataset.win);
      const hdr = up(T, n => n.classList && (n.classList.contains('hdr') || n.classList.contains('hdr2')));
      if (hdr) return { sel: SelWin(w.id), dest: SelWin(w.id), isHdr: true };
      const o = Obj.get(w.objId);
      if (o) { const s = SelObj(o.id); return { sel: null, dest: s, inWin: w }; }
      return { sel: null, dest: null };
    }
    /* the Desktop */
    const pt = stagePt(ev);
    const cell = World.cellAt(pt.x, pt.y - MSG_H);
    const s = SelDesktop(cell);
    return { sel: s, dest: s, onDesk: true, cell };
  }

  function onDown(ev) {
    if (ev.button === 1) { ev.preventDefault();
      Msg.say('This mouse has two buttons: SELECT and ADJUST. Star’s designers argued in print ' +
              'that three was too many and one too few.', true); return; }
    if (ev.button !== 0 && ev.button !== 2) return;
    const adjust = ev.button === 2;
    if (adjust) ev.preventDefault();

    const w = winOf(ev.target); if (w) focusWin = w.id;

    /* click counting gives selection granularity in text */
    const key = ev.target === document ? '' : (ev.target.tagName + (ev.target.dataset.o || ''));
    const now = Date.now();
    if (now - clickAt < 460 && key === clickKey) clickCount = Math.min(4, clickCount + 1);
    else clickCount = 1;
    clickAt = now; clickKey = key;

    const R = resolve(ev, clickCount);
    if (R.inSheet) return;                     /* sheets handle themselves */

    /* the second half of MOVE, COPY or SAME */
    if (Cmd.pending) {
      if (R.draw) { Msg.say('Put the drawing tool down first, or press STOP.', true); return; }
      ev.preventDefault();
      Cmd.designate(R.dest);
      return;
    }

    /* drawing inside a graphics frame */
    if (R.draw) { ev.preventDefault(); startDraw(R.draw, ev); return; }

    /* a character in a keyboard window, clicked while a document is editable */
    if (R.isChar && !adjust) {
      /* find where the text is going before the selection is replaced by
         the character, or the insertion point is lost */
      const t = lastTextPoint();
      Sel.set([R.sel]);
      if (t) { const u = t.put(R.sel, 'copy');
        if (u && !u.refuse) { Cmd.push(u); if (u.message) Msg.say(u.message); }
        else if (u && u.refuse) Msg.say(u.refuse, true);
      } else Msg.say('The character is selected. Press MOVE or COPY and designate a place in a document.');
      return;
    }

    if (!R.sel) { if (!adjust) { Sel.clear();
        if (R.inWin) Msg.say('Nothing selected. The window shows ' +
          (Obj.get(R.inWin.objId) || { name: '?' }).name + '.'); } return; }

    if (adjust) {
      if (R.sel.kind === 'text' && anchor && anchor.doc === R.sel.ref) {
        Sel.set([SelText(R.sel.ref, anchor.pos, R.textPos, 'character')]);
        Msg.say('Selection extended with ADJUST.');
      } else Sel.add(R.sel);
      return;
    }

    Sel.set([R.sel]);
    if (R.sel.kind === 'text') {
      anchor = { doc: R.sel.ref, pos: R.textPos };
      if (clickCount > 1) Msg.say(Sel.describe() + ' selected — granularity: ' +
        Doc.GRAN[clickCount] + '. Click again to widen it, or use ADJUST to stretch it.');
      sweep(R.sel.ref, R.textPos);
    }
    if (R.sel.kind === 'icon' && clickCount >= 2) {
      /* Star opened things with the OPEN key. Two clicks is a modern
         habit; it is honoured, and the machine mentions the key. */
      if (R.sel.openable()) { R.sel.open();
        Msg.say('Opened. On the real machine you would have pressed the OPEN key — ' +
                'it is the one marked OPEN below the screen.'); }
    }
  }

  function lastTextPoint() {
    const t = Sel.items.find(i => i.kind === 'text');
    if (t) return t;
    const w = Win.list.find(x => x.kind === 'document' && (Obj.get(x.objId) || {}).props.edit);
    if (!w) return null;
    const o = Obj.get(w.objId);
    const B = Doc.body(o.id);
    for (let i = B.length - 1; i >= 0; i--) if (Doc.isPara(B[i])) {
      const n = Doc.blockText(B[i]).length;
      return SelText(o.id, { b: i, i: n }, { b: i, i: n });
    }
    return null;
  }

  function sweep(docId, from) {
    const move = e => { const p = Doc.posFromPoint(e.clientX, e.clientY);
      if (!p) return;
      Sel.set([SelText(docId, from, p, 'character')]); };
    const up2 = () => { window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up2); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up2);
  }

  function startDraw(d, ev) {
    const b = Doc.blk(d.bi === undefined ? 0 : d.bi, 0);
    const w = d.w, docId = docOf(ev.target);
    const blkO = Doc.blk(docId, d.bi);
    const tool = w.st.tool;
    const x0 = Math.round(d.lx), y0 = Math.round(d.ly);
    const before = Doc.snap(docId);
    const sh = { id: 's' + Math.random().toString(36).slice(2, 8), k: tool,
                 x: x0, y: y0, w: 1, h: 1, fill: 'p0', lw: 1, dash: 'Solid',
                 f: 'Modern', z: 10, txt: tool === 'txt' ? 'Label' : '' };
    blkO.shapes = blkO.shapes || []; blkO.shapes.push(sh);
    const move = e => { const host = $('[data-b="' + d.bi + '"][data-gfx]');
      if (!host) return; const r = host.getBoundingClientRect();
      sh.w = Math.round((e.clientX - r.left) / Display.scale) - x0;
      sh.h = Math.round((e.clientY - r.top) / Display.scale) - y0;
      if (sh.k === 'box' || sh.k === 'ell' || sh.k === 'arc') {
        if (sh.w < 0) { sh.x = x0 + sh.w; sh.w = -sh.w; } else sh.x = x0;
        if (sh.h < 0) { sh.y = y0 + sh.h; sh.h = -sh.h; } else sh.y = y0;
      }
      UI.refreshAll(); };
    const up2 = () => { window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up2);
      if (Math.abs(sh.w) < 3 && Math.abs(sh.h) < 3 && sh.k !== 'txt') {
        blkO.shapes = blkO.shapes.filter(s => s.id !== sh.id); UI.refreshAll(); return; }
      Cmd.push({ label: 'drawing a ' + tool, fn: () => Doc.restore(docId, before) });
      Sel.set([SelShape(docId, d.bi, sh.id)]);
      Msg.say('Drawn. It is selected — press SHOW PROPERTIES for its line width and fill, ' +
              'or MOVE to put it somewhere else.');
      UI.refreshAll(); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up2);
    UI.refreshAll();
  }

  /* ---- the keyboard ---- */
  const FKEY = { F1: 'MOVE', F2: 'COPY', F3: 'SAME', F4: 'DELETE', F5: "PROP'S",
                 F6: 'AGAIN', F7: 'UNDO', F8: 'OPEN', F9: 'HELP' };
  function onKey(ev) {
    if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    if ($('#museum').classList.contains('on')) {
      if (ev.key === 'Escape') Guide.close(); return; }
    if (FKEY[ev.key]) { ev.preventDefault(); Cmd.exec(FKEY[ev.key]); return; }
    if (ev.ctrlKey || ev.metaKey) {
      const m = { b: 'BOLD', i: 'ITALICS', u: 'UNDERLINE', e: 'CENTRE', f: 'FONT',
                  k: 'KEYBOARD', g: 'FIND', '.': 'LARGER', ',': 'SMALLER' };
      const k = ev.key.toLowerCase();
      if (m[k]) { ev.preventDefault(); Special.exec(m[k]); return; }
      if (k === 'z') { ev.preventDefault(); Cmd.exec('UNDO'); return; }
      return;
    }
    if (ev.key === 'Escape') { ev.preventDefault(); Special.exec('STOP'); return; }

    /* terminal windows take the keyboard when they are the last one used */
    const fw = focusWin ? Win.get(focusWin) : null;
    if (fw && fw.kind === 'terminal' && fw.st.connected) {
      if (ev.key === 'Enter') { ev.preventDefault(); Term.key(fw, '\n'); return; }
      if (ev.key === 'Backspace') { ev.preventDefault(); Term.key(fw, '\b'); return; }
      if (ev.key.length === 1) { ev.preventDefault(); Term.key(fw, ev.key); return; }
    }

    const t = Sel.items.find(i => i.kind === 'text');
    if (t) {
      const o = Obj.get(t.ref);
      const r = Doc.normalize(t.a, t.b);
      if (ev.key === 'Enter') { ev.preventDefault(); Doc.type(t.ref, r, '\n'); return; }
      if (ev.key === 'Backspace') { ev.preventDefault(); Doc.type(t.ref, r, '\b'); return; }
      if (ev.key === 'Delete') { ev.preventDefault();
        if (r.s.b === r.e.b && r.s.i === r.e.i) Cmd.exec('DELETE'); else Cmd.exec('DELETE'); return; }
      if (ev.key === 'Tab') { ev.preventDefault(); Doc.type(t.ref, r, '\t'); return; }
      if (/^Arrow/.test(ev.key)) { ev.preventDefault(); arrow(t, r, ev); return; }
      if (ev.key.length === 1) { ev.preventDefault(); Doc.type(t.ref, r, ev.key); return; }
      return;
    }
    if (ev.key === 'Enter') { ev.preventDefault(); Cmd.exec('OPEN'); return; }
    if (ev.key === 'Backspace' || ev.key === 'Delete') { ev.preventDefault(); Cmd.exec('DELETE'); return; }
  }
  function arrow(t, r, ev) {
    const B = Doc.body(t.ref);
    let p = { b: r.s.b, i: r.s.i };
    if (ev.key === 'ArrowRight') p = { b: r.e.b, i: r.e.i };
    const len = b => Doc.isPara(B[b]) ? Doc.blockText(B[b]).length : 0;
    if (ev.key === 'ArrowRight') { if (p.i < len(p.b)) p.i++;
      else if (p.b < B.length - 1) { p.b++; p.i = 0; } }
    if (ev.key === 'ArrowLeft') { if (p.i > 0) p.i--;
      else if (p.b > 0) { p.b--; p.i = len(p.b); } }
    if (ev.key === 'ArrowUp') { if (p.b > 0) { p.b--; p.i = Math.min(p.i, len(p.b)); } }
    if (ev.key === 'ArrowDown') { if (p.b < B.length - 1) { p.b++; p.i = Math.min(p.i, len(p.b)); } }
    if (ev.shiftKey) Sel.set([SelText(t.ref, { b: r.s.b, i: r.s.i }, p, 'character')]);
    else { Sel.set([SelText(t.ref, p, p, 'character')]); anchor = { doc: t.ref, pos: p }; }
  }

  function install() {
    const st = $('#stage');
    st.addEventListener('mousedown', onDown);
    st.addEventListener('contextmenu', ev => ev.preventDefault());
    document.addEventListener('contextmenu', ev => {
      if (up(ev.target, n => n.id === 'machine')) ev.preventDefault(); });
    document.addEventListener('keydown', onKey);
    window.addEventListener('resize', Display.fit);
    st.addEventListener('dragstart', ev => ev.preventDefault());
  }
  return { install, get focusWin() { return focusWin; } };
})();

/* ======================================================================
   13 · THE GUIDE — the museum's own voice, kept outside the fiction.
   ====================================================================== */
const Guide = (() => {
  const S = [];
  const NAV = { thesis: 'The thesis', before: 'The Alto', principles: 'Eight principles',
    machine: 'The machine', fail: 'Why it failed', kept: 'Taken & dropped', after: 'Afterwards',
    unicode: 'To Unicode', icon: 'That icon', try: 'Things to try', proof: 'The claim',
    honest: 'Real & not', sources: 'Sources' };
  const sec = (id, title, html) => S.push({ id, title, html, nav: NAV[id] || title });

  sec('thesis', 'Almost everything on your screen came from this machine', `
<p class="lede">The desktop. Icons. Folders. Overlapping dialogue boxes. Documents that look on the
screen like they will look on paper. A two‑button mouse. Property sheets. Cut, copy and paste that
work everywhere. Mail arriving in a mailbox. Files living on a network server. Printing by putting a
document onto a printer.</p>
<p>Star did not invent all of it. The <b>Alto</b> and the wider work at Xerox PARC through the 1970s
did much of that: the bitmapped display, the mouse, Ethernet, WYSIWYG editing, overlapping windows,
Smalltalk. What Star did was <em>finish</em> it — assemble the pieces into one coherent, shipping,
commercial product, built not by the research centre but by Xerox's <b>Systems Development
Division</b>, whose job was precisely to turn research into a thing you could buy.</p>
<p>And then, in April 1982, five of the people who built it published <b>“Designing the Star User
Interface”</b> in <i>BYTE</i> — David Canfield Smith, Charles Irby, Ralph Kimball, Bill Verplank and
Eric Harslem — and explained the design principles in public, in careful prose, with reasons. It is
one of the few times in the history of this field that an interface arrived with its own argument
attached.</p>
<div class="box"><div class="bt">The exhibit's real payload</div>
<p>Star also had good ideas the industry <em>dropped</em>. Those are what this exhibit is for:</p>
<ul>
<li><b>Universal commands.</b> A small set of generic operations — MOVE, COPY, DELETE, SHOW
PROPERTIES, COPY PROPERTIES, AGAIN, UNDO, HELP, and OPEN — on dedicated physical keys, working
identically on every object in the system. Not per‑application menus. The same key does the same
thing to a character, a paragraph, a picture, a table cell, an icon, a folder, a printer, a window,
a property sheet and the Desktop.</li>
<li><b>Property sheets on everything.</b> Select any object at all, press one key, get a form
listing every property that object has, editable in place. Uniformly. No exceptions.</li>
<li><b>System‑wide UNDO.</b> In 1981.</li>
<li><b>A conceptual model designed deliberately, written down, and published.</b></li>
</ul>
<p>Spend ten minutes with the command keys and you may come away slightly annoyed at your own
computer. That reaction is the exhibit working.</p></div>`);

  sec('before', 'Before: the Alto, and the difference between research and a product', `
<p>The Alto (1973, PARC) was a research machine: a few thousand were built, mostly for Xerox's own
use, and dozens of incompatible programs ran on it. That was the point of it — it was a laboratory.
Its three‑button mouse meant something different in every program, and Star's designers say so
explicitly as their reason for cutting back to two buttons: consistency was worth more than
expressiveness.</p>
<p>Star's job was different. One coherent system, one set of gestures, one conceptual model, for
someone who had a job to do and no interest in computing. That is why Star is the interesting
artefact even though the Alto is the famous one: the Alto proved the parts could exist, and Star had
to decide what they meant.</p>`);

  sec('principles', 'The eight principles, in the exhibit’s words', `
<p>The <i>BYTE</i> article set out eight design goals. Summarised here rather than quoted:</p>
<table><tr><th>A familiar conceptual model</th><td>Build the system out of things the user already
understands — a desk, documents, folders, file drawers, in‑ and out‑baskets, printers — and then be
rigorous about the metaphor rather than decorative with it.</td></tr>
<tr><th>Seeing and pointing, not remembering and typing</th><td>If the machine can show you the
choice, it should show you the choice. Recognition costs less than recall.</td></tr>
<tr><th>What you see is what you get</th><td>The screen shows the page: real typefaces, real sizes,
real page boundaries. This is where the phrase entered commercial computing.</td></tr>
<tr><th>Universal commands</th><td>A few operations that work on everything, rather than many that
work in one place each.</td></tr>
<tr><th>Consistency</th><td>The same gesture means the same thing everywhere, so that experience in
one part of the system is worth something in every other part.</td></tr>
<tr><th>Simplicity</th><td>Not fewer features — fewer <em>rules</em>. Complexity that can be
derived from a small model is cheaper than complexity you have to memorise.</td></tr>
<tr><th>Modeless interaction</th><td>You should not have to be in a state to do a thing. Select,
then command; type without asking permission first.</td></tr>
<tr><th>User tailorability</th><td>The properties of things are the user's, not the program's, which
is why property sheets are everywhere.</td></tr></table>
<p>They also describe prototyping <b>six</b> different mouse designs before settling: one one‑button
design, four two‑button designs, and one three‑button design. Two buttons was an argued position,
not a default.</p>`);

  sec('machine', 'The machine', `
<table>
<tr><th>Announced</th><td>27 April 1981, as the Xerox 8010 Information System. “Star” is the
software.</td></tr>
<tr><th>Display</th><td>1024 × 808 pixels, black and white, one bit deep, about 38.7 Hz, on a
17‑inch tube — 72 dots to the inch, which is why the Desktop is 14 × 11 squares of one inch and
holds 154 icons. This exhibit renders at exactly that raster.</td></tr>
<tr><th>Processor</th><td>The “Dandelion”: an AMD Am2900 bit‑slice design running the Mesa
instruction set in microcode. Roughly 850 Dhrystones.</td></tr>
<tr><th>Memory</th><td>384 KB standard, expandable to 1.5 MB.</td></tr>
<tr><th>Storage</th><td>10, 29 or 40 MB 8‑inch hard disk, plus an 8‑inch floppy drive.</td></tr>
<tr><th>Software</th><td>Star, written in <b>Mesa</b>, on the <b>Pilot</b> operating system — both
from PARC. Configurations for Interlisp and Smalltalk also existed.</td></tr>
<tr><th>Network</th><td>Ethernet, with 8000‑series file, mail, print, clearinghouse and gateway
services. Names were written <code>local:domain:organisation</code>, which is why the Directory in
this exhibit looks the way it does.</td></tr>
<tr><th>Price</th><td>US$16,595 for one workstation. A usable installation — server, laser printer,
cable — ran from roughly $50,000 to $100,000 and up.</td></tr>
<tr><th>Sold</th><td>Perhaps 25,000 units, all told.</td></tr></table>`);

  sec('fail', 'Why it did not sell', `
<p>All of the following are true at once, which is usually how this goes.</p>
<ul>
<li><b>It cost too much, and not only the workstation.</b> One 8010 was $16,595 and one 8010 on its
own was nearly useless: the drawers were on the file server, printing was on the print server, the
mail was on the Ethernet. Purchasing departments were comparing six figures against a secretary's
salary of about twelve thousand dollars a year.</li>
<li><b>It was slow.</b> Opening a long document took a visible wait; saving one could take minutes,
during which the machine would not talk to you. The in‑basket in this exhibit contains a note about
exactly that, because the complaint is period‑accurate and it mattered.</li>
<li><b>It was closed.</b> There was no way for anyone outside Xerox to write software for it. The
development environment was Mesa on Pilot, in‑house. Whatever Xerox shipped was what you got.</li>
<li><b>It was sold by a copier company.</b> A sales force trained and compensated to sell copiers
and high‑margin laser printers was asked to sell a networked office philosophy. Internal Xerox
politics did not help.</li>
<li><b>The IBM PC arrived on 12 August 1981</b> — under four months later — at a fraction of the
price, technically far cruder, and open to anyone who wanted to write for it. That combination beat
the better machine, as it usually does.</li></ul>`);

  sec('kept', 'What was taken, and what was dropped', `
<div class="grid2">
<div class="box"><div class="bt">Taken</div><ul>
<li>The desktop, and icons on it</li><li>Folders, and the document icon with the turned corner</li>
<li>Overlapping windows and dialogue boxes</li><li>WYSIWYG documents</li>
<li>Cut / copy / paste as system‑wide operations</li><li>Mail in a mailbox, files on a server</li>
<li>Two mouse buttons — eventually, and by a different route</li></ul></div>
<div class="box"><div class="bt">Dropped</div><ul>
<li><b>Universal command keys.</b> Your keyboard has no PROPERTIES key. It has function keys that
mean twelve different things in twelve different programs.</li>
<li><b>Property sheets on literally everything.</b> Modern systems have inspectors for some things,
context menus for others, preference panes for the application, and nothing at all for the rest.</li>
<li><b>Uniform destination semantics.</b> Print, mail and file are three unrelated interfaces
today. Here they are one gesture aimed at three places.</li>
<li><b>Tiled windows as a discipline.</b> Star refused to let a window hide behind another. We took
overlapping windows and then spent forty years inventing ways to find the lost one.</li>
<li><b>Noun‑then‑verb, without exception.</b> Mostly kept, but not <em>without exception</em>, and
the exceptions are where the confusion lives.</li>
<li><b>A published conceptual model.</b> Almost nobody does this any more.</li></ul></div></div>
<p>The one that stings is the second. Select anything in this exhibit — a letter, a paragraph, a
line inside a drawing, a table column, a printer, a mail note, a directory entry, a window, a
property sheet, the Desktop — and press one key. You will not once have to wonder whether it will
work here.</p>`);

  sec('after', 'Where the people and the ideas went', `
<p>Apple's <b>Lisa</b> (1983) and <b>Macintosh</b> (1984) are the direct descendants in spirit, by
way of the 1979 Apple visits to PARC and a good deal of subsequent hiring. The Macintosh made the
opposite trade to Star's on almost every point that matters here: one mouse button instead of two, a
menu bar instead of command keys, overlapping windows instead of tiled ones, drag‑and‑drop instead
of select‑then‑designate, and one‑application‑at‑a‑time instead of a network of services. It also
cost $2,495 instead of $16,595, and that is most of the story.</p>
<p>Star's own line continued. The <b>Xerox 6085</b> (“Daybreak”, 1985) was faster and cost a little
over $6,000; <b>ViewPoint</b> was Star's software redesigned for it; <b>GlobalView</b> carried the
same desktop onto ordinary PC hardware, with the final version 2.1 shipping in <b>1996</b> —
fifteen years after the 8010, still recognisably this system, still with the commands in the window
header.</p>
<p>And underneath all of it, from the beginning: <b>Mesa</b>, a strongly typed modular language with
real interfaces, and <b>Pilot</b>, a single‑user operating system built for it. Both came out of
PARC, and both are why Star was buildable at all in 1981.</p>`);

  sec('unicode', 'A straight line from this machine to the text you are reading', `
<p>Star had to be sold worldwide, so it carried an unusually large character set for its era —
Latin, Greek, Cyrillic, Arabic, Hebrew, Japanese, Chinese, mathematics — with <b>keyboard
windows</b> for entering scripts the physical keyboard did not have. Underneath was the <b>Xerox
Character Code Standard</b>: sixteen bits, fixed width, created in 1980 for the Xerox Network
Systems architecture, and written largely by <b>Joe Becker</b> to cover 27 languages.</p>
<p>In 1987 Becker, with <b>Lee Collins</b> and <b>Mark Davis</b> of Apple, began working out whether
a universal character set was practical. Unicode came out of eight years of working experience with
XCCS. Every glyph in the character‑set window of this exhibit — the kanji, the Arabic, the Cyrillic —
is being drawn by that descendant, in your browser, right now.</p>
<p>The Japanese version of Star was built with Fuji Xerox and sold as <b>J‑Star</b>. Voice of
America and United States foreign‑affairs agencies were among the customers who bought the machine
specifically because of what it could type.</p>`);

  sec('icon', 'The icon on your own screen', `
<p>Star's icons were designed by <b>Norm Cox</b>, a graphic designer at Xerox. His document icon was
a page with a turned‑down corner, and his folder was a folder. Look at whatever file manager you
use. Look at the “save” or “document” glyph in the application you were using ten minutes ago.</p>
<p>None of Cox's drawings appear in this exhibit — they are Xerox's, and the icons here are original
work in the same visual idiom: one‑pixel outlines, white interiors, dither for shading. But the page
with the turned corner is an idea, and the idea is on your screen right now, forty‑five years
later, having been redrawn by everybody and reconsidered by almost nobody.</p>`);

  sec('try', 'Things to try', `

  sec('proof', 'The architectural claim, and a button that tests it', `
<p>Star's designers claimed that their universal commands were universal because the system was
built that way, not because each application had been told to cooperate. This exhibit is built to
make the same claim testable rather than merely stated.</p>
<p>Everything selectable here — a character run, a paragraph, a graphic, a table cell, a record, an
icon, a folder, a printer, a window, a property sheet, the Desktop — implements one interface, and
the nine commands are written once against that interface. A new object type is one registry entry:
a name, a drawing, and a list of properties.</p>
<p>The button below registers a type that did not exist when this page loaded, and puts one on the
Desktop. Not a line of MOVE, COPY, DELETE, SHOW PROPERTIES, SAME, AGAIN, UNDO, OPEN or HELP knows
it exists. Try all nine on it.</p>
<p><button id="mkType" style="background:#8fe3d4;color:#08211d;border:none;border-radius:7px;
padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer">Register a new object type now</button>
<span id="mkTypeMsg" class="fine" style="margin-left:12px"></span></p>`);

  sec('honest', 'What is real here and what is not', `
<p>This is a simulation, not an emulation. No Xerox code runs; there is no Mesa, no Pilot, no
Dandelion microcode. It is one HTML file with no external resources, and it works from
<code>file://</code>.</p>
<ul>
<li><b>Faithful:</b> the 1024 × 808 one‑bit raster at 72 dpi; the 14 × 11 one‑inch Desktop grid;
two mouse buttons named SELECT and ADJUST with no third and no context menu; noun‑then‑verb
throughout; universal commands on dedicated keys; property and option sheets generated from object
metadata; a single message line at the top of the screen and no message windows anywhere; commands
that are never greyed out but explain themselves instead; tiled non‑overlapping document windows
with their commands in the header; scroll bars on the right with large movements landing on page
boundaries; documents that open for reading until you ask to edit; filing, mailing and printing as
one gesture aimed at three places; new objects made by copying blank stationery; and the price,
the date and the specifications above.</li>
<li><b>Invented:</b> the Ashfield Institute and everyone in it, all the correspondence, the
directory, the record file, the terminal host, and every number in the cost table except the
$16,595. The icons are original drawings in Star's idiom, not Norm Cox's icons. The Xerox mark is a
neutral placeholder. Typeface names are Star's; the shapes are whatever your system has.</li>
<li><b>Compressed:</b> Star's real command set was larger, its property sheets deeper, its
applications more capable. Saving a long document really did take minutes; here it takes a moment,
and the exhibit says so rather than pretending.</li>
<li><b>One deliberate accommodation:</b> a Star window could cover the Desktop icons underneath it.
Here the tiled windows begin below the first two rows of one‑inch squares, so that the printers, the
baskets, the file drawers and the documents stay designatable while a window is open. Without that,
the one gesture this exhibit exists to teach would be out of reach for most of a visit.</li></ul>
<p>Star's vocabulary is used throughout and the words that came later are not: no “app”, no “dialog
box”, no “drag and drop”, no “menu bar”. Star had none of those words and mostly none of those
things.</p>`);

  sec('sources', 'Sources', `

<li>David Canfield Smith, Charles Irby, Ralph Kimball, Bill Verplank and Eric Harslem, “Designing

<p class="fine">A fan‑made tribute, for education and for the pleasure of the thing. All product

  function build() {
    const nav = $('#mnav'), wrap = $('#mwrap');
    nav.innerHTML = ''; wrap.innerHTML = '';
    S.forEach(x => { const a = el('a', '', x.nav);
      a.onclick = () => { const t = $('#sec_' + x.id);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      a.title = x.title; nav.appendChild(a); });
    const close = el('button', '', 'Back to the machine'); close.id = 'mclose';
    close.onclick = () => Guide.close(); nav.appendChild(close);
    const head = el('div');
    head.innerHTML = '<div class="mkick">The OS Museum · exhibit note</div>' +
      '<h1>Xerox 8010 Information System</h1>' +
      '<p class="lede" style="margin-top:6px">The software was called Star. It was announced on ' +
      '27 April 1981, cost $16,595 for one workstation, needed a file server and a print server ' +
      'and an Ethernet to be worth anything, arrived under four months before the IBM PC, and did ' +
      'not sell. Almost everything on the screen you are reading this on came from it.</p>';
    wrap.appendChild(head);
    S.forEach(x => { const d = el('div'); d.id = 'sec_' + x.id;
      d.innerHTML = '<h2>' + x.title + '</h2>' + x.html; wrap.appendChild(d); });
    const f = el('div', 'fine');
    f.style.marginTop = '26px';
    f.innerHTML = 'Press <span class="kk">Esc</span> or the button above to go back to the machine.';
    wrap.appendChild(f);
    const b = $('#mkType');
    if (b) b.onclick = () => registerDemoType();
  }
  function open() { build(); $('#museum').classList.add('on'); $('#museum').scrollTop = 0; }
  function close() { $('#museum').classList.remove('on'); }

  /* the proof: a type that did not exist when the page loaded */
  function registerDemoType() {
    const msg = $('#mkTypeMsg');
    if (TYPES.blueprint) { msg.textContent = 'Already registered. It is on the Desktop.';
      close(); Msg.say('The “Blueprint” type is already registered. Try all nine keys on it.'); return; }
    defType('blueprint', {
      label: 'Blueprint', plural: 'Blueprints', art: () => Art.draw('blueprint'),
      openable: false, help: 'blueprint',
      defaults: { scale: '1 : 50', sheetSize: 'E — 34 × 44', revision: 'A',
                  drawnBy: 'nobody', checked: false },
      sheet: o => [
        { label: 'Drawing', fields: [
          F(o, 'scale', 'Scale', 'choice', { opts: ['1 : 20', '1 : 50', '1 : 100'] }),
          F(o, 'sheetSize', 'Sheet', 'choice', { opts: ['A — 8½ × 11', 'C — 17 × 22', 'E — 34 × 44'] }),
          F(o, 'revision', 'Revision', 'text'),
          F(o, 'drawnBy', 'Drawn by', 'text'),
          F(o, 'checked', 'Checked', 'toggle')
        ]},
        { note: 'This entire type — its name, its drawing and these five properties — was ' +
                'registered after the page had finished loading. Not one line was added to MOVE, ' +
                'COPY, DELETE, SHOW PROPERTIES, SAME, AGAIN, UNDO, OPEN or HELP. All nine work.' }
      ]
    });
    const o = Obj.make('blueprint', 'West wing, sheet 3', {
      parent: World.desktop().id, cell: World.freeCell(26) });
    Cmd.push({ label: 'registering the Blueprint type', fn: () => { Obj.remove(o.id); UI.refreshAll(); } });
    UI.refreshAll();
    msg.textContent = 'Registered. “West wing, sheet 3” is on the Desktop.';
    close();

  }

  function panel(w, o, pane) {
    const host = el('div', 'help');
    host.innerHTML =
      '<h3>Museum note</h3>' +
      '<p>Everything else on this Desktop speaks as the machine, in 1981. This one object speaks ' +
      'as the museum, in 2026, and it is the only one that does.</p>' +
      '<p>The full note — what this machine was, what it cost, why it failed four months before ' +
      'the IBM PC arrived, what the industry took from it and what the industry dropped — is ' +
      'outside the fiction, because it would be dishonest to put it inside.</p>';
    const b = el('div', 'hb', 'Open the museum note');
    b.style.cssText = 'display:inline-block;padding:3px 10px;margin:4px 0 10px 0';
    b.onclick = ev => { ev.stopPropagation(); open(); };
    host.appendChild(b);
    const more = el('div');
    more.innerHTML =
      '<h3>The short version</h3>' +
      '<ul><li>Announced 27 April 1981 as the Xerox 8010 Information System; the software is Star.</li>' +
      '<li>1024 × 808, one bit deep, 72 dots to the inch, 17-inch tube.</li>' +
      '<li>$16,595 for the workstation; $50,000–$100,000 and up for anything usable.</li>' +
      '<li>The IBM PC arrived on 12 August 1981. Roughly 25,000 Stars were ever sold.</li>' +
      '<li>Nine keys did the same nine things to everything in the world. Your keyboard has none of them.</li></ul>' +

    host.appendChild(more);

  return { open, close, build, panel, registerDemoType };
})();

/* ======================================================================
   14 · STATE MANAGER
   The Desktop, everything on it, every property, the mail, the
   wastebasket and the window layout, in LocalStorage. Works from
   file:// with no server.
   ====================================================================== */
const State = (() => {
  const KEY = 'osmuseum.xerox8010.star.v1';
  let timer = null;

  function pack() {
    return {
      v: 1, nextId,
      world: { objects: world.objects, clock: world.clock },
      sound: Sound.on,
      keys2: $('#bank').classList.contains('k2'),
      wins: Win.list.map(w => ({ objId: w.objId, props: w.props, st: { form: !!w.st.form } })),
      types: Object.keys(TYPES).indexOf('blueprint') >= 0 ? ['blueprint'] : []
    };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(pack())); }
    catch (e) { /* a full or forbidden store is not worth a message */ }
  }
  function saveSoon() { if (timer) clearTimeout(timer); timer = setTimeout(save, 700); }

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return false; }
    if (!raw) return false;
    let d; try { d = JSON.parse(raw); } catch (e) { return false; }
    if (!d || !d.world || !d.world.objects) return false;
    world = { objects: d.world.objects, clock: d.world.clock || Date.now(), v: 1 };
    nextId = d.nextId || 1000;
    if (!Obj.all().some(o => o.type === 'desktop')) return false;
    if ((d.types || []).indexOf('blueprint') >= 0 && !TYPES.blueprint) {
      /* the run-time type is re-declared on reload, from the same one call */
      Guide.registerDemoTypeQuiet();
    }
    Sound.set(!!d.sound);
    $('#bank').classList.toggle('k2', !!d.keys2);
    $('#btnKeys2').classList.toggle('on', !!d.keys2);
    setTimeout(() => {
      (d.wins || []).forEach(w => { const o = Obj.get(w.objId); if (!o) return;
        const nw = Win.open(w.objId); if (nw && w.props) { Object.assign(nw.props, w.props);
          nw.st.form = !!(w.st && w.st.form); } });
      Win.render();
    }, 60);
    return true;
  }
  function reset() {
    Sheets.option({ title: 'Reset this Desktop', key: 'opt:reset', groups: [
      { label: 'Everything goes back to how it was found', fields: [
        RO('Documents you made', 'discarded'),
        RO('Property changes', 'discarded'),
        RO('Mail, wastebasket, window layout', 'discarded'),
        RO('This one', 'cannot be undone with UNDO')
      ]}], note: 'Everything else in this system can be undone. This is the exception, and it is ' +
        'outside the machine — it is the museum resetting the exhibit, not Star doing anything.' },
      () => { try { localStorage.removeItem(KEY); } catch (e) {}
        Sheets.closeAll(); Win.closeAll(); Cmd.reset(); Sel.clear();
        seedWorld(); UI.refreshAll(); save();
        Msg.say('The Desktop is as it was found, at 9:14 on Monday 27 April 1981.'); },
      'Reset');
  }
  return { save, saveSoon, load, reset, KEY };
})();

/* a quiet form of the run-time registration, for reloads */
Guide.registerDemoTypeQuiet = function () {
  if (TYPES.blueprint) return;
  defType('blueprint', {
    label: 'Blueprint', plural: 'Blueprints', art: () => Art.draw('blueprint'),
    openable: false, help: 'blueprint',
    defaults: { scale: '1 : 50', sheetSize: 'E — 34 × 44', revision: 'A',
                drawnBy: 'nobody', checked: false },
    sheet: o => [
      { label: 'Drawing', fields: [
        F(o, 'scale', 'Scale', 'choice', { opts: ['1 : 20', '1 : 50', '1 : 100'] }),
        F(o, 'sheetSize', 'Sheet', 'choice', { opts: ['A — 8½ × 11', 'C — 17 × 22', 'E — 34 × 44'] }),
        F(o, 'revision', 'Revision', 'text'),
        F(o, 'drawnBy', 'Drawn by', 'text'),
        F(o, 'checked', 'Checked', 'toggle')
      ]},
      { note: 'This entire type was registered after the page finished loading, and every one of ' +
              'the nine universal commands works on it without knowing it exists.' }
    ]
  });
};

/* ======================================================================
   BOOT
   ====================================================================== */
(function boot() {
  Keys.build();
  const restored = State.load();
  if (!restored) seedWorld();

  /* the bezel controls, which are the museum's and not the machine's */
  $('#btnMuseum').onclick = () => Guide.open();
  $('#btnSound').onclick = () => { Sound.set(!Sound.on);
    const d = World.desktop(); d.props.sound = Sound.on;
    UI.refreshIcons(); State.save();
    Msg.say(Sound.on ? 'Sound on: a keyclick, a beep, and the disk. It was a quiet machine.'
                     : 'Sound off.'); if (Sound.on) Sound.beep(); };
  $('#btnKeys2').onclick = () => { const b = $('#bank');
    b.classList.toggle('k2'); $('#btnKeys2').classList.toggle('on', b.classList.contains('k2'));
    Display.fit(); State.save();
    Msg.say(b.classList.contains('k2')
      ? 'Star’s other special keys. These change properties without opening a sheet — which is ' +
        'what they were for.'
      : 'The universal commands are the nine that matter.'); };
  $('#btnGrid').onclick = () => { const d = World.desktop();
    const was = d.props.grid; d.props.grid = !was;
    Cmd.push({ label: 'showing the one-inch grid', fn: () => { d.props.grid = was; UI.refreshAll(); } });
    UI.refreshAll();
    Msg.say(d.props.grid
      ? 'The Desktop is ' + GRID_C + ' × ' + GRID_R + ' squares of one inch — ' + (GRID_C * GRID_R) +
        ' places for an icon, each icon centred in its square. UNDO turns it off again.'
      : 'Grid hidden.'); };
  $('#btnReset').onclick = () => State.reset();
  $('#mnav').addEventListener('click', ev => { if (ev.target && ev.target.id === 'mclose') Guide.close(); });

  Input.install();
  Sound.set(!!World.desktop().props.sound);
  UI.refreshAll();
  Display.fit();
  setTimeout(Display.fit, 120);
  Keys.setUndo(null);

  /* the tube warms up */
  setTimeout(() => { $('#scanoff').style.opacity = '0'; }, 90);
  setTimeout(() => { $('#scanoff').style.display = 'none'; }, 900);

  setTimeout(() => {
    Msg.say('Xerox 8010 Information System. Select something with the left mouse button, ' +
            'then press a command key below the screen. Nine keys, and they work on everything.');
  }, 700);

  Services.startMailClock();
  window.addEventListener('beforeunload', State.save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) State.save(); });
})();
</script>
