        table.appendChild(slot);
        const pile = found[i];
        if (pile.length) {
          const el = cardEl(pile[pile.length-1], true);
          el.style.left = x+"px"; el.style.top = "8px";
          el.addEventListener("click", () => clickHome(i));
          table.appendChild(el);
        }
      }
      for (let col = 0; col < 8; col++) {
        const x = 24 + col*74, baseY = 108;
        const slot = h("div", {style:{position:"absolute", left:x+"px", top:baseY+"px", width:"60px", height:"84px"}});
        slot.addEventListener("click", () => clickCascade(col));
        table.appendChild(slot);
        cascades[col].forEach((c, i) => {
          const el = cardEl(c, true);
          el.style.left = x+"px"; el.style.top = (baseY + i*22)+"px";
          if (sel && sel.kind === "casc" && sel.col === col && i === cascades[col].length-1) el.style.outline = "2px solid #ffff00";
          el.addEventListener("click", e => { e.stopPropagation(); clickCascade(col); });
          el.addEventListener("dblclick", e => { e.stopPropagation(); toFreeCell(col); });
          table.appendChild(el);
        });
      }
      if (found.every(f => f.length === 13)) {
        const s = State.get("fcStats", {w:0, l:0}); s.w++; State.set("fcStats", s);
        Snd.playRecipe("Tada");
        Dlg.msg({title:"FreeCell", icon:"info", text:"Congratulations! You win!\n\nDeal again?", buttons:["Yes","No"]})
          .then(r => { if (r === "Yes") deal(); });
      }
    }
    function selCard(){
      if (!sel) return null;
      if (sel.kind === "cell") return cells[sel.i];
      const pile = cascades[sel.col];
      return pile[pile.length-1];
    }
    function removeSel(){
      if (sel.kind === "cell") cells[sel.i] = null;
      else cascades[sel.col].pop();
      sel = null;
    }
    function clickCell(i){
      if (sel) {
        if (!cells[i]) { const c = selCard(); removeSel(); cells[i] = c; Snd.playRecipe("Click"); }
        else sel = null;
        render(); return;
      }
      if (cells[i]) { sel = {kind:"cell", i}; render(); }
    }
    function clickHome(i){
      if (!sel) return;
      const c = selCard();
      const pile = found[i];
      const ok = pile.length ? (pile[pile.length-1].s === c.s && c.r === pile[pile.length-1].r + 1) : c.r === 1;
      if (ok) { removeSel(); pile.push(c); Snd.tone(700 + c.r*30, .08, {gain:.08}); }
      else sel = null;
      render();
    }
    function clickCascade(col){
      const pile = cascades[col];
      if (sel) {
        if (sel.kind === "casc" && sel.col === col) { sel = null; render(); return; }
        const c = selCard();
        const ok = !pile.length || (cardRed(pile[pile.length-1]) !== cardRed(c) && c.r === pile[pile.length-1].r - 1);
        if (ok) { removeSel(); pile.push(c); Snd.playRecipe("Click"); }
        else sel = null;
        render(); return;
      }
      if (pile.length) { sel = {kind:"casc", col}; render(); }
    }
    function toFreeCell(col){
      const free = cells.findIndex(c => !c);
      if (free >= 0 && cascades[col].length) {
        cells[free] = cascades[col].pop();
        sel = null;
        render();
      }
    }
    win.el.addEventListener("keydown", e => { if (e.key === "F2") { e.preventDefault(); deal(); } });
    win.el.tabIndex = 0;
    deal();
    return win;
  }
});

/* ---------------- Hearts ---------------- */
regApp("hearts", {
  name:"Hearts", icon:"hearts",
  launch(){
    const NAMES = ["You","Bedroom486","Den_pentium","Laptop386"];
    let hands, trick, turn, ledSuit, scores, roundScores, heartsBroken, phase, passSel;
    const win = WM.create({title:"Hearts — The Museum Network Hearts Game", icon:"hearts", w:620, h:470,
      menus:[
        {label:"&Game", items:() => [
          {label:"&New Game", shortcut:"F2", action:newGame},
          {label:"&Score...", action:showScore},
          {sep:true},
          {label:"E&xit", action:()=>win.close()}
        ]},
        {label:"&Help", items:() => [
          {label:"&How to Play", action:()=>Dlg.msg({title:"Hearts Help", icon:"info", w:430,
            text:"Avoid taking hearts (1 point each) and the queen of spades (13 points). Lowest score wins when someone reaches 100.\n\nFirst pick three cards to pass left. The two of clubs leads. Follow suit if you can.\n\nYour three opponents joined from Network Neighborhood and play with mid-90s enthusiasm."})},
          {label:"&About Hearts", action:()=>aboutBox()}
        ]}
      ],
      statusbar:[{text:"Welcome to Hearts"}]});
    const table = h("div", {style:{flex:"1", background:"#008000", position:"relative", overflow:"hidden", margin:"1px"}});
    win.body.appendChild(table);
    const status = t => win.setStatus(t, 0);
    const val = c => c.r === 1 ? 14 : c.r;
    function newGame(){
      scores = [0,0,0,0];
      newRound();
    }
    function newRound(){
      const deck = newDeck();
      hands = [[],[],[],[]];
      deck.forEach((c, i) => hands[i % 4].push(c));
      hands.forEach(hs => hs.sort((a,b) => a.s - b.s || val(a) - val(b)));
      trick = []; ledSuit = null; heartsBroken = false;
      roundScores = [0,0,0,0];
      passSel = new Set();
      phase = "pass";
      status("Select three cards to pass left, then click Pass.");
      render();
    }
    function render(){
      table.innerHTML = "";
      // opponents
      const oppPos = [[null,null],[10, "50%"],[ "50%", 8],["calc(100% - 70px)", "50%"]];
      for (let p = 1; p < 4; p++) {
        const lbl = h("div", {style:{position:"absolute", color:"#fff", fontWeight:"bold", textShadow:"1px 1px 0 #000"}},
          NAMES[p] + " (" + hands[p].length + ")");
        if (p === 1) { lbl.style.left = "8px"; lbl.style.top = "45%"; }
        if (p === 2) { lbl.style.left = "46%"; lbl.style.top = "6px"; }
        if (p === 3) { lbl.style.right = "8px"; lbl.style.top = "45%"; }
        table.appendChild(lbl);
      }
      // current trick
      trick.forEach((t, i) => {
        const el = cardEl(t.c, true);
        const positions = [{l:"46%", t:"52%"}, {l:"36%", t:"38%"}, {l:"46%", t:"24%"}, {l:"56%", t:"38%"}];
        const pos = positions[t.p];
        el.style.left = pos.l; el.style.top = pos.t;
        table.appendChild(el);
      });
      // player hand
      const hnd = hands[0];
      hnd.forEach((c, i) => {
        const el = cardEl(c, true);
        el.style.left = (20 + i * Math.min(42, 540/hnd.length))+"px";
        el.style.bottom = "8px"; el.style.top = "auto";
        if (passSel.has(c)) el.style.transform = "translateY(-14px)";
        el.addEventListener("click", () => clickCard(c));
        table.appendChild(el);
      });
      if (phase === "pass") {
        const b = Dlg.btn("Pass Left", doPass, {default:true});
        Object.assign(b.style, {position:"absolute", left:"46%", top:"46%"});
        b.disabled = passSel.size !== 3;
        table.appendChild(b);
      }
    }
    function clickCard(c){
      if (phase === "pass") {
        if (passSel.has(c)) passSel.delete(c);
        else if (passSel.size < 3) passSel.add(c);
        render();
        return;
      }
      if (phase !== "play" || turn !== 0) return;
      if (!legal(0, c)) { Snd.event("Default sound"); status("You must follow suit (or avoid points on the first trick)."); return; }
      playCard(0, c);
    }
    function doPass(){
      const mine = [...passSel];
      mine.forEach(c => hands[0].splice(hands[0].indexOf(c), 1));
      const gift = [1,2,3].map(p => {
        const give = hands[p].slice(0, 3); // opponents pass their three lowest, a very 1995 strategy
        give.forEach(c => hands[p].splice(hands[p].indexOf(c), 1));
        return give;
      });
      hands[1].push(...mine);
      hands[2].push(...gift[0]);
      hands[3].push(...gift[1]);
      hands[0].push(...gift[2]);
      hands.forEach(hs => hs.sort((a,b) => a.s - b.s || val(a) - val(b)));
      phase = "play";
      turn = hands.findIndex(hs => hs.some(c => c.s === 3 && c.r === 2));
      status(NAMES[turn] + (turn === 0 ? " — you lead with the two of clubs." : " leads."));
      render();
      if (turn !== 0) setTimeout(aiPlay, 700);
      else status("You lead. The two of clubs starts the round.");
    }
    function isFirstTrick(){ return hands.reduce((a,hs)=>a+hs.length,0) === 52 - trick.length - 0 && roundScores.every(s=>s===0) && tricksTaken === 0; }
    let tricksTaken = 0;
    function legal(p, c){
      const hnd = hands[p];
      if (tricksTaken === 0 && trick.length === 0) return c.s === 3 && c.r === 2;
      if (trick.length === 0) {
        if (c.s === 1 && !heartsBroken && hnd.some(x => x.s !== 1)) return false;
        return true;
      }
      if (hnd.some(x => x.s === ledSuit)) return c.s === ledSuit;
      if (tricksTaken === 0 && (c.s === 1 || (c.s === 0 && c.r === 12))) return hnd.every(x => x.s === 1 || (x.s === 0 && x.r === 12));
      return true;
    }
    function playCard(p, c){
      hands[p].splice(hands[p].indexOf(c), 1);
      if (trick.length === 0) ledSuit = c.s;
      if (c.s === 1) heartsBroken = true;
      trick.push({p, c});
      Snd.playRecipe("Click");
      render();
      if (trick.length === 4) { setTimeout(endTrick, 900); return; }
      turn = (turn + 1) % 4;
      if (turn !== 0) setTimeout(aiPlay, 650);
      else status("Your turn.");
    }
    function aiPlay(){
      const p = turn;
      const legalCards = hands[p].filter(c => legal(p, c));
      let pick;
      if (trick.length === 0) pick = legalCards.reduce((a,b) => val(a) <= val(b) ? a : b);
      else {
        const winning = trick.filter(t => t.c.s === ledSuit).reduce((a,b) => val(a.c) > val(b.c) ? a : b);
        const under = legalCards.filter(c => c.s === ledSuit && val(c) < val(winning.c));
        if (under.length) pick = under.reduce((a,b) => val(a) >= val(b) ? a : b);
        else {
          const qs = legalCards.find(c => c.s === 0 && c.r === 12 && ledSuit !== 0);
          const hearts2 = legalCards.filter(c => c.s === 1 && c.s !== ledSuit);
          pick = qs || (hearts2.length ? hearts2.reduce((a,b)=>val(a)>=val(b)?a:b) : legalCards.reduce((a,b)=>val(a)>=val(b)?a:b));
        }
      }
      playCard(p, pick);
    }
    function endTrick(){
      const winner = trick.filter(t => t.c.s === ledSuit).reduce((a,b) => val(a.c) > val(b.c) ? a : b).p;
      const pts = trick.reduce((a,t) => a + (t.c.s === 1 ? 1 : 0) + (t.c.s === 0 && t.c.r === 12 ? 13 : 0), 0);
      roundScores[winner] += pts;
      tricksTaken++;
      trick = []; ledSuit = null;
      turn = winner;
      status(NAMES[winner] + " takes the trick" + (pts ? " (+" + pts + ")" : "") + ".");
      render();
      if (!hands[0].length) { endRound(); return; }
      if (turn !== 0) setTimeout(aiPlay, 800);
    }
    function endRound(){
      const shooter = roundScores.findIndex(s => s === 26);
      if (shooter >= 0) {
        for (let p2 = 0; p2 < 4; p2++) if (p2 !== shooter) scores[p2] += 26;
        status(NAMES[shooter] + " shot the moon!");
      } else for (let p2 = 0; p2 < 4; p2++) scores[p2] += roundScores[p2];
      tricksTaken = 0;
      if (scores.some(s => s >= 100)) {
        const best = Math.min(...scores);
        const who = NAMES[scores.indexOf(best)];
        Snd.playRecipe(scores.indexOf(best) === 0 ? "Tada" : "Chord");
        Dlg.msg({title:"Hearts", icon:"info", text:"Game over!\n\n" + scoreText() + "\n" + who + " wins. Play again?", buttons:["Yes","No"]})
          .then(r => { if (r === "Yes") newGame(); });
        return;
      }
      Dlg.msg({title:"Hearts — end of hand", icon:"info", text:scoreText(), buttons:["Next Hand"]}).then(newRound);
    }
    function scoreText(){
      return NAMES.map((n, i) => n + ": " + scores[i]).join("\n");
    }
    function showScore(){ Dlg.msg({title:"Hearts Score", icon:"info", text:scoreText()}); }
    win.el.addEventListener("keydown", e => { if (e.key === "F2") { e.preventDefault(); newGame(); } });
    win.el.tabIndex = 0;
    tricksTaken = 0;
    newGame();
    return win;
  }
});

  dateTimeProps(){
    const zones = [

    ];
    let zi = State.get("tz", 4);
    Dlg.propSheet({title:"Date/Time Properties", icon:"datetime", w:440, h:430,
      tabs:[
        {label:"Date & Time", build:(p, sheet) => {
          const now = new Date(SimClock.now());

          "January February March April May June July August September October November December".split(" ")
            .forEach((m,i) => mSel.appendChild(h("option", {value:String(i)}, m)));
          mSel.value = String(now.getMonth());
          const ySel = h("input", {class:"field", type:"number", value:String(now.getFullYear()), style:{width:"64px"}});
          const cal = h("div", {style:{display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:"1px", background:"#fff",
            padding:"4px", marginTop:"6px", boxShadow:"inset 1px 1px #808080"}});
          const drawCal = () => {
            cal.innerHTML = "";
            "S M T W T F S".split(" ").forEach(d2 => cal.appendChild(h("div", {style:{textAlign:"center", color:"#808080"}}, d2)));
            const first = new Date(+ySel.value, +mSel.value, 1).getDay();
            const days = new Date(+ySel.value, +mSel.value + 1, 0).getDate();
            for (let i = 0; i < first; i++) cal.appendChild(h("div"));
            for (let d2 = 1; d2 <= days; d2++) {
              const cell = h("div", {style:{textAlign:"center", padding:"1px"}}, String(d2));
              if (d2 === now.getDate() && +mSel.value === now.getMonth()) { cell.style.background = "#000080"; cell.style.color = "#fff"; }
              cell.addEventListener("click", () => { now.setDate(d2); sheet.markDirty(); drawCal(); });
              cal.appendChild(cell);
            }
          };
          mSel.addEventListener("change", () => { now.setMonth(+mSel.value); sheet.markDirty(); drawCal(); });
          ySel.addEventListener("change", () => { now.setFullYear(+ySel.value || 1995); sheet.markDirty(); });
          const clock = h("div", {style:{textAlign:"center", fontSize:"18px", fontFamily:"'Courier New',monospace", margin:"12px 0 4px"}});
          setInterval(() => {
            const d2 = new Date(SimClock.now());
            clock.textContent = d2.toLocaleTimeString("en-US");
          }, 500);
          p.append(
            h("div", {style:{display:"flex", gap:"12px"}},
              h("fieldset", {class:"groupbox", style:{flex:"1"}}, h("legend", {}, "Date"),
                h("div", {style:{display:"flex", gap:"6px"}}, mSel, ySel), cal),
              h("fieldset", {class:"groupbox", style:{width:"140px"}}, h("legend", {}, "Time"), clock,
                h("div", {style:{textAlign:"center", color:"#404040", fontSize:"10px"}}, "It is 1995 in this museum; the seconds are real."))),
            h("div", {style:{marginTop:"10px", color:"#404040"}}, "Current time zone: " + zones[zi].name.replace(/^\([^)]*\)\s*/,"")));
          sheet.getDate = () => now;
          drawCal();
        }},
        {label:"Time Zone", build:(p, sheet) => {
          const sel = h("select", {class:"field", style:{width:"100%"}});
          zones.forEach((z, i) => sel.appendChild(h("option", {value:String(i)}, z.name)));
          sel.value = String(zi);
          const mapWrap = h("div", {class:"b-in", style:{height:"170px", marginTop:"10px", position:"relative",
            background:"#000040", overflow:"hidden", cursor:"grab"}});
          const map = h("canvas", {width:360, height:170, style:{position:"absolute", top:"0"}});
          mapWrap.appendChild(map);
          const g = map.getContext("2d");
          let offset = -zones[zi].x + 180;
          const blobs = [ // stylized continents, entirely original squiggles
            [30,40,50,28],[65,80,28,40],[150,30,60,34],[165,70,36,44],[210,36,80,40],[228,84,30,30],[292,96,34,22],[20,120,60,14]
          ];
          const drawMap = () => {
            g.fillStyle = "#000040"; g.fillRect(0,0,360,170);
            g.fillStyle = "#008000";
            for (const [bx,by,bw,bh] of blobs) {
              const x = ((bx + offset) % 360 + 360) % 360;
              g.beginPath(); g.ellipse(x, by, bw/2, bh/2, 0, 0, 7); g.fill();
              if (x + bw/2 > 360) { g.beginPath(); g.ellipse(x - 360, by, bw/2, bh/2, 0, 0, 7); g.fill(); }
            }
            const hx = ((zones[zi].x + offset) % 360 + 360) % 360;
            g.fillStyle = "rgba(255,255,0,.35)";
            g.fillRect(hx - 12, 0, 24, 170);
            g.strokeStyle = "#ffff00"; g.strokeRect(hx - 12.5, 0, 25, 170);
          };
          drawMap();
          let dragX = null;
          mapWrap.addEventListener("pointerdown", e => { dragX = e.clientX; mapWrap.style.cursor = "grabbing"; });
          window.addEventListener("pointermove", e => {
            if (dragX == null) return;
            offset += e.clientX - dragX;
            dragX = e.clientX;
            let best = 0, bd = 1e9;
            zones.forEach((z, i) => {
              const zx = ((z.x + offset) % 360 + 360) % 360;
              const d2 = Math.abs(zx - 180);
              if (d2 < bd) { bd = d2; best = i; }
            });
            if (best !== zi) { zi = best; sel.value = String(zi); sheet.markDirty(); }
            drawMap();
          });
          window.addEventListener("pointerup", () => { dragX = null; mapWrap.style.cursor = "grab"; });
          sel.addEventListener("change", () => { zi = +sel.value; offset = -zones[zi].x + 180; sheet.markDirty(); drawMap(); });
          p.append(sel, mapWrap,
            h("div", {style:{marginTop:"8px", color:"#404040"}},
              "Drag the world until your home sits in the highlight. This draggable map was quietly retired from later versions of Windows; the museum keeps it running out of respect."),
            h("label", {class:"w95l", style:{marginTop:"10px", display:"flex"}},
              (()=>{ const cb = h("input", {type:"checkbox", class:"w95"}); cb.checked = true; return cb; })(),
              "Automatically adjust clock for daylight saving changes"));
        }}
      ],
      onApply: sheet => {
        State.set("tz", zi);
        if (sheet.getDate) SimClock.set(sheet.getDate().getTime());
        Taskbar.tick();
      }});
  },

  deviceManager(p){
    const tree = [
      {name:"Computer", icon:"computer", kids:[
        {name:"CDROM", icon:"drive_d", kids:[{name:"MUSEUM CD-ROM DRIVE 2X", icon:"drive_d"}]},

        {name:"Keyboard", icon:"keyboard", kids:[{name:"Standard 101/102-Key Keyboard", icon:"keyboard"}]},
        {name:"Monitor", icon:"display", kids:[{name:"SuperVGA 1024x768", icon:"display"}]},
        {name:"Mouse", icon:"mouse", kids:[{name:"Standard Serial Mouse", icon:"mouse"}]},
        {name:"Ports (COM & LPT)", icon:"settings", kids:[
          {name:"Communications Port (COM1)", icon:"settings"},

          {name:"Printer Port (LPT1)", icon:"printer"}]},

          {name:"Museum-Blaster 16 Compatible", icon:"sounds", conflict:true,
           detail:"This device is conflicting with another device. (Code 15)\n\nIRQ 5 is also claimed by an unnamed device that refuses to introduce itself.\n\nTo fix the conflict, change the IRQ jumper on the physical sound card, which — please check — you do not have."},
          {name:"Gameport Joystick", icon:"settings"}]},
        {name:"System devices", icon:"devchip", kids:[
          {name:"PCI bus", icon:"devchip"},
          {name:"Programmable interrupt controller", icon:"devchip"},
          {name:"System CMOS/real time clock", icon:"datetime"},
          {name:"System speaker", icon:"sounds"}]}
      ]}

    let sel = null;
    const open = new Set(["Computer", "Sound, video and game controllers"]);
    const list = h("div", {class:"tree", style:{flex:"1", minHeight:"180px"}});
    const render = () => {
      list.innerHTML = "";
      const walk = (nodes, depth) => {
        for (const n of nodes) {
          const row = h("div", {class:"trow", style:{paddingLeft: depth*16 + "px"}});
          const expander = h("span", {class:"exp"});
          if (n.kids) {
            const box = h("span", {class:"expbox"}, open.has(n.name) ? "−" : "+");
            box.addEventListener("click", e => { e.stopPropagation();
              open.has(n.name) ? open.delete(n.name) : open.add(n.name); render(); });

          row.appendChild(expander);
          const ic = h("span", {class:"ticon"});
          ic.appendChild(iconEl(n.icon, 16));
          if (n.conflict) ic.appendChild(h("span", {style:{position:"absolute", left:"-2px", top:"-4px", color:"#000",

          row.addEventListener("dblclick", () => props());
          list.appendChild(row);
          if (n.kids && open.has(n.name)) walk(n.kids, depth + 1);
        }
      };

            h("fieldset", {class:"groupbox", style:{marginTop:"10px"}}, h("legend", {}, "Device status"),
              h("div", {class:"selectable", style:{whiteSpace:"pre-wrap", lineHeight:"1.4"}},
                sel.conflict ? sel.detail : "This device is working properly.")));

          pp.append(h("div", {class:"b-in", style:{background:"#fff", padding:"6px", fontFamily:"'Courier New',monospace", fontSize:"11px"}},
            sel.conflict

            sel.conflict ? h("div", {style:{marginTop:"8px", color:"#800000"}},
              "Conflicting device list:\nUnknown Device using IRQ 05") : null);

/* ---------------- DOS terminal engine ---------------- */
class DosTerm {
  constructor(el, opts){
    this.el = el; this.opts = opts || {};
    this.cwd = VFS.get("C:\\");
    this.buf = "";
    this.hist = []; this.hidx = 0;
    el.textContent = "";
    this.println("Microsoft(R) Windows 95");
    this.println("   (C)Copyright — well, nobody. A museum simulation of MS-DOS 7.\n");
    this.prompt();
    this.keyHandler = e => this.onKey(e);
  }
  print(t){ this.el.textContent += t; this.el.scrollTop = this.el.scrollHeight; }
  println(t){ this.print((t || "") + "\n"); }
  promptStr(){
    const parts = [];
    let n = this.cwd;
    while (n) { parts.unshift(n.parent ? VFS.shortName(n) : n.name); n = n.parent; }
    return parts.join("\\").replace("\\\\","\\") + (this.cwd.parent ? "" : "\\") + ">";
  }
  prompt(){ this.print(this.promptStr()); this._lineStart = this.el.textContent.length; this.print("_"); }
  redraw(){
    this.el.textContent = this.el.textContent.slice(0, this._lineStart) + this.buf + "_";
    this.el.scrollTop = this.el.scrollHeight;
  }
  onKey(e){
    if (e.key === "F8" || (e.altKey && e.key === "Enter")) return;
    e.preventDefault(); e.stopPropagation();
    if (this.editMode) return this.editorKey(e);
    if (e.key === "Enter") {
      this.el.textContent = this.el.textContent.slice(0, -1); // remove cursor
      this.println("");
      const cmd = this.buf.trim();
      this.buf = "";
      if (cmd) { this.hist.push(cmd); this.hidx = this.hist.length; }
      this.exec(cmd);
      return;
    }
    if (e.key === "Backspace") { this.buf = this.buf.slice(0, -1); this.redraw(); return; }
    if (e.key === "ArrowUp") { if (this.hidx > 0) { this.hidx--; this.buf = this.hist[this.hidx] || ""; this.redraw(); } return; }
    if (e.key === "ArrowDown") { if (this.hidx < this.hist.length) { this.hidx++; this.buf = this.hist[this.hidx] || ""; this.redraw(); } return; }
    if (e.key.length === 1 && !e.ctrlKey && !e.altKey) { this.buf += e.key; this.redraw(); }
  }
  resolve(arg){
    if (!arg) return null;
    arg = arg.replace(/"/g, "");
    if (/^[a-z]:/i.test(arg)) return VFS.get(arg);
    if (arg === "..") return this.cwd.parent || this.cwd;
    if (arg === "\\") { let n = this.cwd; while (n.parent) n = n.parent; return n; }
    let base = this.cwd;
    for (const part of arg.split("\\")) {
      if (!base || !base.kids) return null;
      if (part === "..") { base = base.parent || base; continue; }
      base = base.kids.find(k => k.name.toLowerCase() === part.toLowerCase() ||
        VFS.shortName(k).toLowerCase() === part.toLowerCase());
    }
    return base || null;
  }
  exec(line){
    const [cmdRaw, ...rest] = line.split(/\s+/);
    const cmd = (cmdRaw || "").toUpperCase();
    const arg = rest.join(" ");
    const done = () => this.prompt();
    if (!cmd) return done();
    const C = {
      DIR: () => {
        const target = arg ? this.resolve(arg) : this.cwd;
        if (!target || target.type !== "d") { this.println("File not found"); return; }
        this.println(" Volume in drive C has no label");
        this.println(" Directory of " + VFS.path(target) + "\n");
        let files = 0, dirs = 0, bytes = 0;
        if (target.parent) {
          this.println(".            <DIR>         07-11-95   9:50a");
          this.println("..           <DIR>         07-11-95   9:50a");
        }
        for (const k of VFS.sorted(target)) {
          const short = VFS.shortName(k);
          const [nm, ext] = k.type === "f" && short.includes(".") ? [short.split(".")[0], short.split(".").pop()] : [short, ""];
          const d = new Date(k.date);
          const ds = String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") + "-" + String(d.getFullYear()).slice(2);
          const hh = d.getHours() % 12 || 12, ap = d.getHours() >= 12 ? "p" : "a";
          const ts = String(hh).padStart(2," ") + ":" + String(d.getMinutes()).padStart(2,"0") + ap;
          const size = k.type === "d" ? "<DIR>       " : String(k.size || 0).padStart(12," ");
          // DOS 7 shows the long filename in the right-hand column — brand new in 95
          this.println(nm.padEnd(8," ") + " " + ext.padEnd(3, " ") + " " + size + " " + ds + " " + ts + " " + k.name);
          if (k.type === "d") dirs++; else { files++; bytes += k.size || 0; }
        }
        this.println("       " + files + " file(s)   " + bytes.toLocaleString("en-US") + " bytes");
        this.println("       " + dirs + " dir(s)    376,973,312 bytes free");
      },
      CD: () => {
        if (!arg) { this.println(VFS.path(this.cwd)); return; }
        const t = this.resolve(arg);
        if (t && t.type === "d") this.cwd = t;
        else this.println("Invalid directory");
      },
      TYPE: () => {
        const t = this.resolve(arg);
        if (!t || t.type !== "f") { this.println("File not found - " + arg); return; }
        this.println(t.content != null && !String(t.content).startsWith("data:") ? t.content : "(binary file — best left unTYPEd)");
      },
      CLS: () => { this.el.textContent = ""; },
      VER: () => { this.println("\nWindows 95. [Version 4.00.950]\n"); },
      VOL: () => { this.println(" Volume in drive C has no label\n Volume Serial Number is 1995-0824"); },
      MEM: () => {
        this.println("Memory Type        Total     Used      Free");
        this.println("----------------  --------  --------  --------");
        this.println("Conventional          640K      45K      595K");
        this.println("Upper                 155K     155K        0K");
        this.println("Extended (XMS)      7,168K   1,024K    6,144K");
        this.println("----------------  --------  --------  --------");
        this.println("Total memory        7,963K   1,224K    6,739K\n");
        this.println("Largest executable program size       594K (608,256 bytes)");
      },
      COPY: () => {
        const [srcA, dstA] = arg.split(/\s+/);
        const src = this.resolve(srcA);
        if (!src || src.type !== "f") { this.println("File not found - " + (srcA || "")); return; }
        let dstDir = dstA ? this.resolve(dstA) : this.cwd;
        let newName = src.name;
        if (!dstDir) {
          const parts = dstA.split("\\");
          newName = parts.pop();
          dstDir = parts.length ? this.resolve(parts.join("\\")) : this.cwd;
        }
        if (!dstDir || dstDir.type !== "d") { this.println("Invalid destination"); return; }
        const c = VFS.copy(src, dstDir);
        if (newName !== src.name) VFS.rename(c, newName);
        this.println("        1 file(s) copied");
      },
      DEL: () => {
        const t = this.resolve(arg);
        if (!t || t.type !== "f") { this.println("File not found - " + arg); return; }
        if (t.sys) { this.println("Access denied"); return; }
        VFS.remove(t);
        // DOS deletes skip the Recycle Bin. Authentic and a little thrilling.
      },
      ERASE: () => C.DEL(),
      REN: () => {
        const [a, b] = arg.split(/\s+/);
        const t = this.resolve(a);
        if (!t) { this.println("File not found - " + (a || "")); return; }
        if (!b || VFS.rename(t, b) !== true) this.println("Invalid parameter");
      },
      MD: () => {
        if (!arg) { this.println("Invalid parameter"); return; }
        VFS.create(this.cwd, arg, "d");
      },
      MKDIR: () => C.MD(),
      RD: () => {
        const t = this.resolve(arg);
        if (!t || t.type !== "d") { this.println("Invalid directory"); return; }
        if (t.kids.length) { this.println("Directory not empty"); return; }
        if (t.sys) { this.println("Access denied"); return; }
        VFS.remove(t);
      },
      DATE: () => this.println("Current date is " + new Date(SimClock.now()).toDateString()),
      TIME: () => this.println("Current time is " + new Date(SimClock.now()).toLocaleTimeString("en-US")),
      ECHO: () => this.println(arg || "ECHO is on"),
      EDIT: () => { this.editor(arg); return "noprompt"; },
      HELP: () => {
        this.println("DIR CD TYPE COPY DEL REN MD RD CLS VER VOL MEM DATE TIME ECHO EDIT EXIT" +
          (this.opts.fullscreen ? " WIN" : ""));
        this.println("For everything else, there is Windows.");
      },
      WIN: () => {
        if (this.opts.onWin) { this.opts.onWin(); return "noprompt"; }
        this.println("Windows is already running.");
      },
      EXIT: () => {
        if (this.opts.onExit) { this.opts.onExit(); return "noprompt"; }
        this.println("You are already at the bottom of the stack.");
      },
      SMARTDRV: () => this.println("SMARTDrive is imaginary, and therefore infinitely fast."),
      FORMAT: () => this.println("WARNING: FORMAT would erase this museum exhibit.\nRefusing, on curatorial grounds."),
      SCANDISK: () => this.println("ScanDisk found 0 problems, which is suspicious but pleasant.")
    };
    const fn = C[cmd];
    if (fn) { if (fn() === "noprompt") return; }
    else this.println("Bad command or file name");
    done();
  }
  editor(arg){
    this.editMode = true;
    this._saveScreen = this.el.textContent;
    const t = arg ? this.resolve(arg) : null;
    this._editNode = t && t.type === "f" ? t : null;
    this._editArg = arg;
    this._editText = this._editNode && this._editNode.content && !String(this._editNode.content).startsWith("data:")
      ? String(this._editNode.content) : "";
    this.drawEditor();
  }
  drawEditor(){
    this.el.textContent = "";
    const bar = "  File: " + (this._editNode ? this._editNode.name : (this._editArg || "UNTITLED")) +
      "   —   MS-DOS Editor (simulated)   —   Esc=Exit  F2=Save";
    this.el.innerHTML = `<div style="background:#00a0a0;color:#000;padding:0 4px">${esc(bar)}</div>` +
      `<div style="background:#0000a8;color:#ffff55;min-height:60vh;padding:4px;white-space:pre-wrap">${esc(this._editText)}<span style="background:#ffff55;color:#0000a8">_</span></div>` +
      `<div style="background:#00a0a0;color:#000;padding:0 4px">  Type to edit. This editor is one screen deep, like patience in 1995.</div>`;
  }
  editorKey(e){
    if (e.key === "Escape") {
      this.editMode = false;
      this.el.innerHTML = "";
      this.el.textContent = this._saveScreen;
      this.println("");
      this.prompt();
      return;
    }
    if (e.key === "F2") {
      if (this._editNode) {
        this._editNode.content = this._editText;
        this._editNode.size = this._editText.length;
        VFS.changed(this._editNode.parent);
      } else if (this._editArg) {
        const n = VFS.create(this.cwd, this._editArg.toUpperCase(), "f", {content:this._editText});
        this._editNode = n;
      }
      return;
    }
    if (e.key === "Backspace") this._editText = this._editText.slice(0, -1);
    else if (e.key === "Enter") this._editText += "\n";
    else if (e.key.length === 1 && !e.ctrlKey) this._editText += e.key;
    this.drawEditor();
  }
}

/* ---------------- Boot Manager ---------------- */
const Boot = {
  desktopReady: false, safeMode: false, skipRequested: false,
  hideAll(){
    for (const id of ["bootpost","bootmenu","bootsplash","dosscreen","shutscreen"])
      $("#" + id).style.display = "none";
  },
  async start(){
    $("#desktop").style.opacity = "0";
    $("#taskbar").style.display = "none";
    const skip = e => { if (e.key === "Escape") this.skipRequested = true; };
    window.addEventListener("keydown", skip);
    await this.post();
    if (this.skipRequested) { window.removeEventListener("keydown", skip); return this.toDesktop(true); }
    // MSDOS.SYS BootGUI easter egg
    const msdosSys = VFS.get("C:\\MSDOS.SYS");
    const bootGui = !(msdosSys && /BootGUI\s*=\s*0/i.test(msdosSys.content || ""));
    const choice = await this.startingMoment();
    window.removeEventListener("keydown", skip);
    if (this.skipRequested) return this.toDesktop(true);
    if (choice === "safe") { this.safeMode = true; return this.toDesktop(true); }
    if (choice === "menu") {
      const opt = await this.bootMenu();
      if (opt === 3) { this.safeMode = true; return this.toDesktop(true); }
      if (opt === 4) {
        const gui = await this.stepByStep();
        if (!gui) return this.dosMode("Windows 95 is bypassing the graphical user interface.\nType WIN to start Windows.\n");
      }
      if (opt === 5) return this.dosMode("Windows 95 is bypassing your startup files.\nType WIN to start Windows.\n");
      if (opt === 6) { this.safeMode = true; return this.dosMode("Windows 95 is running in Safe mode command prompt only.\nType WIN to start Windows.\n"); }
      if (opt === 2) { /* logged */ }
    }
    if (!bootGui) return this.dosMode("BootGUI=0 — as you wished. MSDOS.SYS has been obeyed.\nType WIN to start Windows.\n");
    await this.splash();
    this.toDesktop(false);
  },
  post(){
    return new Promise(res => {
      const el = $("#bootpost");
      this.hideAll();
      el.style.display = "block";
      el.textContent = "";
      const lines = [
        "Museum BIOS v4.95  (C) 1995 Original Artwork Heavy Industries",
        "CPU : 486DX2-66 at 66 MHz",
        "Memory Test :     ",
        "",
        "Detecting IDE drives ...",
        "  Primary Master  : GENERIC IDE DISK TYPE46",
        "  Secondary Master: MUSEUM CD-ROM DRIVE 2X",
        "",
        "Keyboard ..... detected",
        "Mouse ........ detected on COM1",
        "",
        "Booting from drive C:"
      ];
      let i = 0;
      const step = () => {
        if (this.skipRequested) return res();
        if (i === 2) {
          // count RAM
          let k = 0;
          const cnt = setInterval(() => {
            if (this.skipRequested) { clearInterval(cnt); return res(); }
            k += 512;
            if (k >= 8192) {
              k = 8192; clearInterval(cnt);
              el.textContent = el.textContent.replace(/Memory Test :.*/, "Memory Test :  8192K OK");
              i++;
              setTimeout(step, 150);
            } else {
              el.textContent = el.textContent.replace(/Memory Test :.*/, "Memory Test :  " + k + "K");
            }
          }, 28);
          el.textContent += lines[i] + "\n";
          i++;
          return;
        }
        if (i < lines.length) {
          el.textContent += lines[i] + "\n";
          i++;
          setTimeout(step, i === 3 ? 60 : 130);
        } else setTimeout(res, 500);
      };
      step();
    });
  },
  startingMoment(){
    return new Promise(res => {
      const el = $("#bootpost");
      el.textContent = "\nStarting Windows 95...\n";
      el.appendChild(h("div", {style:{position:"fixed", bottom:"8px", left:"14px", color:"#555", fontSize:"12px"}},
        "(F8 for the startup menu, F5 for Safe mode, ESC to skip boot)"));
      let decided = false;
      const pick = (e, v) => { e.preventDefault(); decided = true; window.removeEventListener("keydown", kh); res(v); };
      const kh = e => {
        if (decided) return;
        if (e.key === "F8") pick(e, "menu");
        if (e.key === "F5") pick(e, "safe");
      };
      window.addEventListener("keydown", kh);
      setTimeout(() => {
        if (!decided) { decided = true; window.removeEventListener("keydown", kh); res("normal"); }
      }, 2100);
    });
  },
  bootMenu(){
    return new Promise(res => {
      const el = $("#bootmenu");
      this.hideAll();
      el.style.display = "block";
      let sel = 1;
      const opts = ["Normal", "Logged (\\BOOTLOG.TXT)", "Safe mode",
        "Step-by-step confirmation", "Command prompt only", "Safe mode command prompt only"];
      const draw = () => {
        el.textContent =
          "Microsoft Windows 95 Startup Menu\n" +
          "=================================\n\n" +
          opts.map((o, i) => "    " + (i+1) + ". " + o).join("\n") +
          "\n\nEnter a choice: " + sel + "\n\n\n\n" +
          "F5=Safe mode  Shift+F5=Command prompt  Shift+F8=Step-by-step confirmation [N]";
      };
      draw();
      const fin = n => { window.removeEventListener("keydown", kh); el.style.display = "none"; res(n); };
      const kh = e => {
        e.preventDefault();
        if (e.key === "ArrowDown") { sel = sel % 6 + 1; draw(); }
        if (e.key === "ArrowUp") { sel = (sel + 4) % 6 + 1; draw(); }
        if (/^[1-6]$/.test(e.key)) { sel = +e.key; draw(); }
        if (e.key === "F5") return fin(e.shiftKey ? 5 : 3);
        if (e.key === "F8" && e.shiftKey) return fin(4);
        if (e.key === "Enter") fin(sel);
      };
      window.addEventListener("keydown", kh);
    });
  },
  stepByStep(){
    // option 4: each boot stage asks before it runs; resolves with whether
    // the GUI question was answered Y
    return new Promise(res => {
      const el = $("#bootmenu");
      this.hideAll();
      el.style.display = "block";
      const qs = [
        "Process the system registry",
        "Create a startup log file (BOOTLOG.TXT)",
        "Process your startup device drivers (CONFIG.SYS)",
        "DEVICE=C:\\WINDOWS\\HIMEM.SYS",
        "DEVICE=C:\\WINDOWS\\IFSHLP.SYS",
        "Process your startup command file (AUTOEXEC.BAT)",
        "Load the Windows graphical user interface"
      ];
      let i = 0, out = "";
      const draw = () => { el.textContent = out + qs[i] + " [Enter=Y,Esc=N]?"; };
      draw();
      const kh = e => {
        if (e.key !== "Enter" && e.key !== "Escape") return;
        e.preventDefault();
        const yes = e.key === "Enter";
        out += qs[i] + " [Enter=Y,Esc=N]? " + (yes ? "Y" : "N") + "\n";
        if (i === qs.length - 1) {
          window.removeEventListener("keydown", kh);
          el.style.display = "none";
          return res(yes);
        }
        i++; draw();
      };
      window.addEventListener("keydown", kh);
    });
  },
  splash(){
    return new Promise(res => {
      const el = $("#bootsplash");
      this.hideAll();
      el.style.display = "flex";
      /* The real startup screen was LOGO.SYS: a 320x400, 256-colour bitmap
         that the VGA mode stretched to double width, with the last 20
         palette entries rotated in place to animate the bar along the
         bottom — the bitmap itself never changed. Same recipe here: one
         static 320x400 frame, dithered down like an 8-bit original, plus
         a 20-colour cycling bar. The four-pane mark is this museum's
         neutral placeholder, not the trademarked flag artwork. */
      const cv = $("#splashcv"), g = cv.getContext("2d");
      const W = 320, BARY = 390, BARH = 10;
      let seed = 95;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      // sky and clouds, painted smooth first
      const sky = g.createLinearGradient(0, 0, 0, BARY);
      sky.addColorStop(0, "#2545ac");
      sky.addColorStop(.45, "#5c88d4");
      sky.addColorStop(.78, "#3a62bc");
      sky.addColorStop(1, "#16256e");
      g.fillStyle = sky; g.fillRect(0, 0, W, BARY);
      const puff = (x, y, r, a) => {
        const gr = g.createRadialGradient(x, y - r*.2, r*.15, x, y, r);
        gr.addColorStop(0, `rgba(255,255,255,${a})`);
        gr.addColorStop(.65, `rgba(242,246,255,${a*.7})`);
        gr.addColorStop(1, "rgba(242,246,255,0)");
        g.fillStyle = gr;
        g.beginPath(); g.ellipse(x, y, r, r*.55, 0, 0, 7); g.fill();
      };
      const bank = (x, y, s, a) => {
        for (let i = 0; i < 7; i++)
          puff(x + (rnd()-.5)*s*1.6, y + (rnd()-.5)*s*.6, s*(.45+rnd()*.55), a*(.7+rnd()*.3));
      };
      // the bright mass sits behind the mark, wisps everywhere else
      bank(160, 205, 62, .95); bank(92, 160, 44, .85); bank(238, 172, 46, .85);
      bank(42, 84, 34, .6); bank(282, 66, 30, .55); bank(168, 48, 38, .5);
      bank(58, 296, 40, .5); bank(262, 312, 36, .45); bank(150, 352, 30, .3);
      // quantise with ordered dither, the way a 256-colour bitmap banded
      const img = g.getImageData(0, 0, W, BARY), d = img.data;
      const bayer = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5], step = 255/6;
      for (let i = 0; i < d.length; i += 4) {
        const px = (i >> 2) % W, py = (i >> 2) / W | 0;
        const t = (bayer[(py & 3)*4 + (px & 3)] + .5)/16 - .5;
        for (let c = 0; c < 3; c++)
          d[i+c] = Math.max(0, Math.min(255, Math.round(d[i+c]/step + t) * step));
      }
      g.putImageData(img, 0, 0);
      // mark and wordmark, drawn in 640-wide design space: the display
      // doubles every pixel horizontally, exactly like the real mode
      g.save();
      g.scale(.5, 1);
      const cols = ["#e04028", "#28a038", "#2858d8", "#f0c020"];
      const fx = 273, fy = 100, ps = 44, ph = 37, gap = 6;
      // trailing squares sweeping off to the left of the placeholder
      for (let i = 0; i < 13; i++) {
        const t = i/13, sz = 11 - t*8;
        g.fillStyle = cols[i % 4];
        g.fillRect(fx - 16 - i*13 - t*22, fy + 42 + Math.sin(i*.9)*9*(1-t*.5), sz, sz/1.2);
      }
      g.translate(fx, fy);
      g.transform(1, -.05, .1, 1, 0, 0); // the placeholder's light skew
      for (const [c, ix, iy] of [[cols[0],0,0],[cols[1],1,0],[cols[2],0,1],[cols[3],1,1]]) {
        g.fillStyle = c;
        g.fillRect(ix*(ps+gap), iy*(ph+gap), ps, ph);
        g.strokeStyle = "#000"; g.strokeRect(ix*(ps+gap)+.5, iy*(ph+gap)+.5, ps-1, ph-1);
      }
      g.restore();
      g.save();
      g.scale(.5, 1);
      const text = (s2, x, y) => {
        g.fillStyle = "rgba(8,16,72,.6)"; g.fillText(s2, x+3, y+3);
        g.fillStyle = "#fff"; g.fillText(s2, x, y);
      };
      g.font = "bold 54px Arial";
      const wx = 320 - g.measureText("Windows 95").width/2;
      g.font = "bold italic 22px Arial";
      const mw = g.measureText("Microsoft").width;
      text("Microsoft", wx + 2, 230);
      g.font = "11px Arial";
      text("®", wx + 6 + mw, 218);
      g.font = "bold 54px Arial";
      text("Windows 95", wx, 284);
      g.restore();
      // the bar: one gradient in 20 steps, rotated one entry at a time
      const pal = [];
      for (let i = 0; i < 20; i++) {
        const s2 = Math.sin(Math.PI * i / 20);
        pal.push(`rgb(${Math.round(8 + 48*s2*s2)},${Math.round(14 + 186*s2)},${Math.round(96 + 159*s2)})`);
      }
      let off = 0;
      const drawBar = () => {
        for (let j = 0; j < 20; j++) {
          g.fillStyle = pal[((j - off) % 20 + 20) % 20];
          g.fillRect(j*16, BARY, 16, BARH);
        }
      };
      drawBar();
      const cyc = setInterval(() => { off++; drawBar(); }, 90);
      let done = false;
      const finish = () => { if (done) return; done = true; clearInterval(cyc); res(); };
      const kh = e => { if (e.key === "Escape") { window.removeEventListener("keydown", kh); finish(); } };
      window.addEventListener("keydown", kh);
      setTimeout(() => { window.removeEventListener("keydown", kh); finish(); }, 4200);
    });
  },
  dosMode(banner){
    this.hideAll();
    const el = $("#dosscreen");
    el.style.display = "block";
    el.innerHTML = "";
    const termEl = h("div", {style:{outline:"none", minHeight:"90vh", whiteSpace:"pre-wrap"}});
    el.appendChild(termEl);
    termEl.tabIndex = 0;
    const term = new DosTerm(termEl, {fullscreen:true,
      onWin: async () => {
        el.style.display = "none";
        await this.splash();
        this.toDesktop(false);
      },
      onExit: () => { term.println("This is the bottom of the stack. Type WIN."); term.prompt(); }
    });
    if (banner) { term.el.textContent = ""; term.print(banner + "\n"); term.prompt(); }
    const kh = e => term.onKey(e);
    termEl.addEventListener("keydown", kh);
    termEl.focus();
    el.addEventListener("pointerdown", () => termEl.focus());
  },
  toDesktop(instant){
    this.hideAll();
    const dk = $("#desktop");
    $("#taskbar").style.display = "flex";
    if (this.safeMode) {
      document.body.classList.add("safemode");
      dk.classList.add("safemode");
      dk.style.backgroundImage = "";
      const corners = [["6px","6px"],["auto 6px","6px auto"]];
      [["left","top"],["right","top"],["left","bottom"],["right","bottom"]].forEach(([hx, vy]) => {
        const lbl = h("div", {class:"safelabel"}, "Safe Mode");
        lbl.style[hx] = "10px"; lbl.style[vy] = "8px";
        dk.appendChild(lbl);
      });
      Dlg.msg({title:"Desktop", icon:"warn", w:420,
        text:"Windows is running in safe mode.\n\nThis special diagnostic mode of Windows enables you to fix a problem which may be caused by your network or hardware settings. In this museum, it mostly proves the fence works. Restart to return to normal."});
    } else {
      Display.apply();
    }
    dk.style.transition = instant ? "none" : "opacity .8s";
    requestAnimationFrame(() => dk.style.opacity = "1");
    this.desktopReady = true;
    if (!instant && !this.safeMode) Snd.event("Start Windows");
    setTimeout(() => { if (!this.safeMode) Welcome.show(); }, instant ? 300 : 1200);
    setInterval(() => Errors.maybeRandomBsod(), 45000);
    ScreenSaver.arm();
  }
};

/* ---------------- Shutdown ---------------- */
const Shutdown = {
  dialog(){
    Snd.event("Question");
    $("#dimmer").style.display = "block";
    const win = Dlg.show({title:"Shut Down Windows", icon:"shutdown", w:380, h:10});
    const opts = [
      ["shutdown", "Shut down the computer?"],
      ["restart", "Restart the computer?"],
      ["dos", "Restart the computer in MS-DOS mode?"],
      ["logon", "Close all programs and log on as a different user?"]
    ];
    let choice = "shutdown";
    const list = h("div", {style:{padding:"4px 0"}});
    opts.forEach(([val, label], i) => {
      const r = h("input", {type:"radio", class:"w95", name:"shut"});
      r.checked = i === 0;
      r.addEventListener("change", () => choice = val);
      list.appendChild(h("label", {class:"w95l", style:{display:"flex", margin:"7px 0"}}, r, label));
    });
    const head = h("div", {style:{display:"flex", gap:"12px", padding:"12px 14px 0"}});
    const ic = h("div", {style:{width:"32px", height:"32px", flex:"0 0 32px"}});
    ic.innerHTML = Icons.shutdown();
    head.append(ic, h("div", {}, h("b", {}, "Are you sure you want to:"), list));
    const close = () => { $("#dimmer").style.display = "none"; win.close(true); };
    win.body.append(head,
      h("div", {class:"dlgbtns"},
        Dlg.btn("Yes", () => { win.close(true); this.go(choice); }, {default:true}),
        Dlg.btn("No", close),
        Dlg.btn("Help", () => { close(); HelpEngine.open("welcome"); })));
    sizeTo(win);
    const oc = win.close;
    win.close = f => { $("#dimmer").style.display = "none"; oc(f); };
  },
  go(choice){
    $("#dimmer").style.display = "none";
    if (choice === "logon") {
      Dlg.msg({title:"Log Off", icon:"info", text:"There is only one user in this museum, and it is you. Logging you straight back on."});
      return;
    }
    if (choice === "dos") {
      Snd.event("Exit Windows");
      this.wait(() => Boot.dosMode("Windows 95 has restarted in MS-DOS mode.\nType WIN to return to the graphical desktop.\n"));
      return;
    }
    Snd.event("Exit Windows");
    if (choice === "restart") this.wait(() => location.reload());
    else this.wait(() => this.safeScreen());
  },
  wait(then){
    Boot.hideAll();
    const el = $("#shutscreen");
    el.style.display = "flex";
    $(".msg", el).innerHTML = '<span style="color:#fff;font-family:Arial;font-weight:normal;font-size:16px">Please wait while your computer shuts down.</span>';
    setTimeout(then, 2600);
  },
  safeScreen(){
    const el = $("#shutscreen");
    $(".msg", el).textContent = "It's now safe to turn off\nyour computer.";
    $(".msg", el).style.whiteSpace = "pre-wrap";
    // faithful: it just sits there. (click quietly restarts, for museum visitors without a power switch)
    el.addEventListener("click", () => location.reload(), {once:true});
  },
  restart(){ this.wait(() => location.reload()); }
};

/* ---------------- global wiring & init ---------------- */
window.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("resize", () => {
  for (const w of WM.wins) if (w.isMax) { w.isMax = false; w.maximize(); }
});
SimClock.init();
VFS.init();
Desktop.init();
Taskbar.init();
Boot.start();
</script>
