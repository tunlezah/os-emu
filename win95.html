<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 95 — The OS Museum</title>
<meta name="description" content="A single-file, in-browser simulation of Microsoft Windows 95 RTM (August 1995). Nothing real runs — it just feels like it does.">
<style>
/* ==========================================================================
   WINDOWS 95 — single-file museum exhibit
   All artwork is original, drawn in code. No external resources.
   ========================================================================== */
:root{
  --teal:#008080; --face:#c0c0c0; --face-lt:#dfdfdf; --shadow:#808080;
  --dk:#0a0a0a; --hl:#ffffff; --title:#000080; --title-txt:#ffffff;
  --title-in:#808080; --title-in-txt:#c0c0c0; --sel:#000080; --sel-txt:#ffffff;
  --info:#ffffe1;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  background:#000;
  font-family:"Tahoma","MS Sans Serif","Segoe UI",Arial,sans-serif;
  font-size:11px; color:#000;
  -webkit-font-smoothing:none;
  user-select:none; -webkit-user-select:none;
  cursor:default;
}
#stage{position:fixed;inset:0;overflow:hidden;background:#000;}
img,svg{display:block;}
button,input,select,textarea{font-family:inherit;font-size:11px;}

/* ---------- bevel language ---------- */
.b-out{  /* raised window / button edge */
  background:var(--face);
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
}
.b-out-thin{
  background:var(--face);
  box-shadow:inset -1px -1px var(--shadow), inset 1px 1px var(--hl);
}
.b-in{   /* sunken well */
  background:#fff;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);
}
.b-in-thin{
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow);
}
.b-groove{
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             -1px -1px 0 var(--shadow), 1px 1px 0 var(--hl);
}
/* ---------- buttons ---------- */
.btn{
  background:var(--face); border:none; outline:none; position:relative;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  padding:4px 12px; min-width:75px; min-height:23px; color:#000;
}
.btn:active:not(:disabled), .btn.pressed{
  box-shadow:inset -1px -1px var(--face-lt), inset 1px 1px var(--dk),
             inset -2px -2px var(--hl), inset 2px 2px var(--shadow);
  padding:5px 11px 3px 13px;
}
.btn:focus-visible::after, .btn.deffocus::after{
  content:""; position:absolute; inset:3px; border:1px dotted #000; pointer-events:none;
}
.btn.default{
  box-shadow:0 0 0 1px #000, inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
}
.btn:disabled{color:var(--shadow); text-shadow:1px 1px 0 var(--hl);}
.tbtn{ /* toolbar button */
  background:var(--face); border:none; width:22px; height:22px;
  display:inline-flex; align-items:center; justify-content:center;
}
.tbtn:hover{box-shadow:inset -1px -1px var(--shadow), inset 1px 1px var(--hl);}
.tbtn:active, .tbtn.on{box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow);}
.tbtn:disabled{opacity:.45;}
.tbtn:disabled:hover{box-shadow:none;}

/* ---------- text fields ---------- */
.field, textarea.field, input.field, select.field{
  background:#fff; border:none; outline:none;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);
  padding:3px 5px; color:#000;
}
textarea.field{resize:none; font-family:"Courier New",monospace; font-size:13px;}
input.field{height:21px;}
select.field{padding:2px;}
.field:disabled{background:var(--face); color:var(--shadow);}
input[type=checkbox].w95, input[type=radio].w95{
  appearance:none; width:13px; height:13px; background:#fff; flex:0 0 13px;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);
  vertical-align:middle; position:relative; margin:0 4px 0 0;
}
input[type=radio].w95{border-radius:50%;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);}
input[type=checkbox].w95:checked::after{
  content:""; position:absolute; left:2px; top:2px; width:7px; height:5px;
  border-left:2px solid #000; border-bottom:2px solid #000; transform:rotate(-50deg);
}
input[type=radio].w95:checked::after{
  content:""; position:absolute; left:4px; top:4px; width:5px; height:5px;
  background:#000; border-radius:50%;
}
label.w95l{display:inline-flex; align-items:center; gap:2px;}

/* ---------- windows ---------- */
.win{
  position:absolute; background:var(--face); display:flex; flex-direction:column;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  padding:3px; min-width:120px; min-height:60px;
}
.win.maxed{padding:3px;}
.titlebar{
  height:18px; background:var(--title); color:var(--title-txt);
  display:flex; align-items:center; padding:1px 2px; gap:3px; flex:0 0 18px;
  font-weight:bold; overflow:hidden;
}
.win.inactive .titlebar{background:var(--title-in); color:var(--title-in-txt);}
.tb-icon{width:16px;height:16px;flex:0 0 16px;}
.tb-text{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:11px; padding-top:1px;}
.tb-btns{display:flex; gap:0; flex:0 0 auto; align-items:center;}
.tb-btn{
  width:16px; height:14px; background:var(--face); border:none; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  margin-left:0;
}
.tb-btn.closebtn{margin-left:2px;}
.tb-btn:active{
  box-shadow:inset -1px -1px var(--face-lt), inset 1px 1px var(--dk),
             inset -2px -2px var(--hl), inset 2px 2px var(--shadow);
}
.tb-btn svg{pointer-events:none;}
.menubar{
  display:flex; align-items:center; height:19px; flex:0 0 19px; padding:1px 0;
  background:var(--face);
}
.menubar .mtop{
  padding:2px 6px 3px; cursor:default;
}
.menubar .mtop.open, .menubar .mtop:hover.armed{background:var(--sel); color:var(--sel-txt);}
.menubar .mtop u{text-decoration:underline;}
.win-body{
  flex:1; position:relative; overflow:hidden; display:flex; flex-direction:column;
}
.statusbar{
  flex:0 0 20px; display:flex; gap:2px; padding-top:2px; background:var(--face);
}
.statusbar .cell{
  flex:1; box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow);
  padding:2px 6px; white-space:nowrap; overflow:hidden;
}
.statusbar .cell.fix{flex:0 0 auto; min-width:80px;}
.resizer{position:absolute; z-index:5;}
.rz-n{top:-1px;left:8px;right:8px;height:4px;cursor:n-resize;}
.rz-s{bottom:-1px;left:8px;right:8px;height:4px;cursor:s-resize;}
.rz-e{right:-1px;top:8px;bottom:8px;width:4px;cursor:e-resize;}
.rz-w{left:-1px;top:8px;bottom:8px;width:4px;cursor:w-resize;}
.rz-nw{left:-1px;top:-1px;width:8px;height:8px;cursor:nw-resize;}
.rz-ne{right:-1px;top:-1px;width:8px;height:8px;cursor:ne-resize;}
.rz-sw{left:-1px;bottom:-1px;width:8px;height:8px;cursor:sw-resize;}
.rz-se{right:-1px;bottom:-1px;width:8px;height:8px;cursor:se-resize;}
.zoomrect{position:fixed; border:2px dotted #dfdfdf; z-index:99999; pointer-events:none;}
.dragoutline{position:fixed; border:2px dotted #efefef; z-index:99998; pointer-events:none; mix-blend-mode:difference;}

/* ---------- menus / popups ---------- */
.popup{
  position:fixed; background:var(--face); z-index:60000; padding:2px;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  min-width:130px;
}
.popup .pi{
  display:flex; align-items:center; height:18px; padding:0 16px 0 2px;
  white-space:nowrap; position:relative;
}
.popup .pi.hilite{background:var(--sel); color:var(--sel-txt);}
.popup .pi.disabled{color:var(--shadow); text-shadow:1px 1px 0 var(--hl);}
.popup .pi.disabled.hilite{background:var(--sel); text-shadow:none;}
.popup .pi .ic{width:18px; flex:0 0 18px; display:flex; align-items:center; justify-content:center;}
.popup .pi .lbl{flex:1; padding-right:12px;}
.popup .pi .lbl u{text-decoration:underline;}
.popup .pi .lbl b{font-weight:bold;}
.popup .pi .shct{margin-left:auto; padding-left:14px;}
.popup .pi .sub{position:absolute; right:3px; top:5px;}
.popup .psep{height:1px; margin:3px 2px; background:var(--shadow); box-shadow:0 1px 0 var(--hl);}
.popup.bigicons .pi{height:32px;}
.popup.bigicons .pi .ic{width:36px; flex:0 0 36px;}
.chk{width:14px;display:inline-block;text-align:center;}

/* ---------- start menu ---------- */
#startmenu{
  position:fixed; left:2px; bottom:30px; z-index:60001; display:none;
  background:var(--face);
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  padding:3px;
}
#startmenu .smrow{display:flex;}
#startmenu .banner{
  width:22px; background:#00007b; position:relative; flex:0 0 22px;
}
#startmenu .banner span{
  position:absolute; bottom:6px; left:50%;
  transform:rotate(-90deg) translateY(-50%); transform-origin:0 0;
  white-space:nowrap; color:#c0c0c0; font-size:15px; letter-spacing:1px;
}
#startmenu .banner span b{color:#fff; font-weight:bold;}
#startmenu .smitems{flex:1; min-width:160px;}
.smi{display:flex; align-items:center; height:32px; padding:0 14px 0 3px; white-space:nowrap; position:relative;}
.smi .ic{width:38px; flex:0 0 38px; display:flex; align-items:center; justify-content:center;}
.smi.hilite{background:var(--sel); color:var(--sel-txt);}
.smi .lbl u{text-decoration:underline;}
.smi .sub{position:absolute; right:4px;}
.smsep{height:1px; margin:2px 1px; background:var(--shadow); box-shadow:0 1px 0 var(--hl);}

/* ---------- taskbar ---------- */
#taskbar{
  position:fixed; left:0; right:0; bottom:0; height:28px; z-index:50000;
  background:var(--face); display:flex; align-items:center; gap:3px;
  box-shadow:inset 0 1px var(--face-lt), inset 0 2px var(--hl);
  padding:2px 2px 2px 2px;
  transition:bottom .18s steps(6);
}
#taskbar.hidden-auto{bottom:-26px;}
#startbtn{
  flex:0 0 auto; height:22px; display:inline-flex; align-items:center; gap:4px;
  background:var(--face); border:none; padding:0 6px 0 3px; font-weight:bold; font-size:11px;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
}
#startbtn.open, #startbtn:active{
  box-shadow:inset -1px -1px var(--face-lt), inset 1px 1px var(--dk),
             inset -2px -2px var(--hl), inset 2px 2px var(--shadow);
}
#taskbtns{flex:1; display:flex; gap:3px; overflow:hidden; align-self:stretch; align-items:center;}
.taskbtn{
  flex:1 1 160px; max-width:160px; min-width:36px; height:22px;
  display:inline-flex; align-items:center; gap:4px; padding:0 4px;
  background:var(--face); border:none; font-size:11px; overflow:hidden;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
}
.taskbtn span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.taskbtn.active{
  font-weight:bold;
  background-image:repeating-conic-gradient(var(--hl) 0% 25%, var(--face) 0% 50%);
  background-size:2px 2px;
  box-shadow:inset -1px -1px var(--face-lt), inset 1px 1px var(--dk),
             inset -2px -2px var(--hl), inset 2px 2px var(--shadow);
}
#tray{
  flex:0 0 auto; height:22px; display:inline-flex; align-items:center; gap:6px;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow);
  padding:0 8px 0 6px;
}
#clock{font-size:11px; padding-top:1px;}
#trayvol{width:16px;height:16px;}

/* ---------- desktop ---------- */
#desktop{
  position:absolute; inset:0 0 28px 0; background:var(--teal); overflow:hidden;
}
#desktop.fullbleed{inset:0;}
.dicon{
  position:absolute; width:75px; text-align:center; padding-top:2px;
}
.dicon .img{width:32px; height:32px; margin:0 auto; position:relative;}
.dicon .txt{
  margin-top:4px; color:#fff; padding:1px 2px; display:inline-block; max-width:73px;
  overflow-wrap:break-word; line-height:1.15;
}
.dicon.sel .img{filter:brightness(.65) sepia(1) hue-rotate(190deg) saturate(3);}
.dicon.sel .txt{background:var(--sel); color:var(--sel-txt); outline:1px dotted #ffff7f;}
.dicon .txt input{
  font:inherit; text-align:center; border:1px solid #000; background:#fff; color:#000;
  width:70px; outline:none; padding:0;
}
/* icon views inside folders */
.fitem{display:inline-flex; flex-direction:column; align-items:center; width:75px; padding:4px 0; vertical-align:top; text-align:center;}
.fitem .img{width:32px;height:32px;position:relative;}
.fitem .txt{margin-top:3px; padding:1px 2px; max-width:72px; overflow-wrap:break-word; line-height:1.15;}
.fitem.sel .img{filter:brightness(.65) sepia(1) hue-rotate(190deg) saturate(3);}
.fitem.sel .txt{background:var(--sel); color:var(--sel-txt); outline:1px dotted #ffff7f;}
.fitem-s{display:flex; align-items:center; gap:4px; padding:1px 4px 1px 2px; white-space:nowrap;}
.fitem-s .img{width:16px;height:16px;position:relative;flex:0 0 16px;}
.fitem-s.sel .txt{background:var(--sel); color:var(--sel-txt); outline:1px dotted #ffff7f;}
.fview{flex:1; overflow:auto; background:#fff; position:relative;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);
  padding:4px;}
.fview.list{display:flex; flex-direction:column; flex-wrap:wrap; align-content:flex-start;}
table.details{border-collapse:collapse; width:100%;}
table.details th{
  background:var(--face); font-weight:normal; text-align:left; padding:2px 6px;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  position:sticky; top:0; cursor:default;
}
table.details td{padding:1px 6px; white-space:nowrap;}
table.details tr.sel td{background:var(--sel); color:var(--sel-txt);}
.shortcut-badge{
  position:absolute; left:0; bottom:0; width:11px; height:11px; background:#fff;
  border:1px solid #000;
}
.shortcut-badge::after{
  content:""; position:absolute; left:1px; bottom:1px;
  border-style:solid; border-width:0 0 7px 7px; border-color:transparent transparent #000 transparent;
  clip-path:polygon(0 100%, 100% 100%, 100% 30%, 55% 30%, 55% 0, 0 55%);
  background:#000; width:7px; height:7px; border:none;
  -webkit-clip-path:polygon(100% 20%, 45% 20%, 45% 0, 0 50%, 45% 100%, 45% 80%, 100% 80%);
  clip-path:polygon(100% 20%, 45% 20%, 45% 0, 0 50%, 45% 100%, 45% 80%, 100% 80%);
}
/* explorer tree */
.tree{overflow:auto; background:#fff; padding:2px;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);}
.tnode{white-space:nowrap;}
.trow{display:flex; align-items:center; height:17px; gap:2px;}
.trow .exp{width:16px; flex:0 0 16px; display:flex; align-items:center; justify-content:center;}
.trow .ticon{width:16px;height:16px;flex:0 0 16px;position:relative;}
.trow .tlbl{padding:0 3px;}
.trow.sel .tlbl{background:var(--sel); color:var(--sel-txt); outline:1px dotted #ffff7f;}
.tkids{margin-left:19px; border-left:1px dotted #808080;}
.expbox{width:9px;height:9px;background:#fff;border:1px solid #808080;
  display:flex;align-items:center;justify-content:center;font-size:9px;line-height:7px;font-family:monospace;}

/* ---------- dialog layout helpers ---------- */
.dlgpad{padding:12px;}
.dlgbtns{display:flex; justify-content:flex-end; gap:6px; padding:10px 12px 12px;}
.dlgbtns.center{justify-content:center;}
.groupbox{position:relative; border:none; margin-top:8px; padding:14px 10px 10px;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             -1px -1px 0 var(--shadow) inset, 1px 1px 0 var(--hl) inset;}
fieldset.groupbox{
  border:2px groove #fff; box-shadow:none; padding:8px 10px 10px; margin-top:4px;
}
fieldset.groupbox legend{padding:0 4px;}
/* tabs */
.tabs{display:flex; flex-direction:column; flex:1; min-height:0;}
.tabstrip{display:flex; padding:0 2px; position:relative; z-index:2; flex:0 0 auto;}
.tab{
  padding:3px 10px 4px; background:var(--face); position:relative; top:2px;
  box-shadow:inset -1px 0 var(--dk), inset 1px 1px var(--face-lt),
             inset -2px 0 var(--shadow), inset 2px 2px var(--hl);
  border-bottom:none; margin-right:0;
}
.tab.on{top:0; padding:4px 12px 7px; z-index:3; margin:0 -2px;
  box-shadow:inset -1px 0 var(--dk), inset 1px 1px var(--face-lt),
             inset -2px 0 var(--shadow), inset 2px 2px var(--hl);}
.tabpanel{
  flex:1; min-height:0; overflow:auto; position:relative; z-index:1; padding:12px;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
}
/* message boxes */
.msgbox-body{display:flex; gap:14px; padding:14px 16px 8px; align-items:flex-start;}
.msgbox-txt{padding-top:4px; max-width:360px; line-height:1.4; user-select:text;}

/* ---------- boot screens ---------- */
.fullscreen{position:fixed; inset:0; z-index:80000; display:none;}
#bootpost{background:#000; color:#aaa; font-family:"Courier New",monospace; font-size:14px; padding:10px 14px; line-height:1.35; white-space:pre-wrap;}
#bootpost .amikey{color:#fff;}
#bootmenu{background:#000; color:#c0c0c0; font-family:"Courier New",monospace; font-size:15px; padding:16px 24px; line-height:1.5; white-space:pre;}
#bootsplash{background:#000; display:none; align-items:center; justify-content:center;}
/* LOGO.SYS was 320x400 shown double-wide on a 4:3 screen; stretch, don't preserve */
#bootsplash canvas{width:min(100vw, calc(100vh * 4 / 3)); height:min(100vh, calc(100vw * 3 / 4)); image-rendering:pixelated;}
#dosscreen{background:#000; color:#c0c0c0; font-family:"Courier New",monospace; font-size:15px; padding:8px 10px; overflow:auto; white-space:pre-wrap; line-height:1.25;}
#shutscreen{background:#000; display:none; align-items:center; justify-content:center; text-align:center;}
#shutscreen .msg{color:#ffa000; font-size:clamp(18px,4vw,34px); font-family:"Courier New",monospace; font-weight:bold; text-shadow:0 0 8px rgba(255,160,0,.4); line-height:1.6;}
#bsod{background:#0000aa; color:#c0c0c0; font-family:"Courier New",monospace; font-size:15px; display:none; align-items:center; justify-content:center;}
#bsod .inner{max-width:640px; padding:20px; line-height:1.45; white-space:pre-wrap;}
#bsod .hdr{background:#c0c0c0; color:#0000aa; padding:0 8px; display:inline-block; font-weight:bold;}
#dimmer{position:fixed; inset:0; z-index:64000; display:none;
  background-image:repeating-conic-gradient(rgba(0,0,0,.85) 0% 25%, transparent 0% 50%);
  background-size:2px 2px;}
/* safe mode */
#desktop.safemode{background:#008080;}
body.safemode .win, body.safemode #taskbar, body.safemode #startmenu, body.safemode .popup{filter:saturate(.6);}
.safelabel{position:absolute; color:#fff; font-size:13px; font-weight:bold; z-index:1; pointer-events:none;}
/* cursors */
body.waitcursor, body.waitcursor *{cursor:wait !important;}
::selection{background:var(--sel); color:var(--sel-txt);}
.selectable, .selectable *{user-select:text; -webkit-user-select:text;}

/* marquee select */
#marquee{position:absolute; border:1px dotted #fff; display:none; z-index:9;}

/* scrollbars-ish (webkit) */
::-webkit-scrollbar{width:16px;height:16px;}
::-webkit-scrollbar-track{background:repeating-conic-gradient(#fff 0% 25%, var(--face) 0% 50%); background-size:2px 2px;}
::-webkit-scrollbar-thumb{background:var(--face);
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);}
::-webkit-scrollbar-button{background:var(--face); height:16px; width:16px;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);}
</style>
</head>
<body>
<div id="stage">
  <div id="desktop"><div id="marquee"></div></div>
  <div id="taskbar">
    <button id="startbtn"></button>
    <div id="taskbtns"></div>
    <div id="tray"><div id="trayvol"></div><span id="clock">12:00 AM</span></div>
  </div>
  <div id="startmenu"></div>

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "style" && typeof attrs[k] === "object") Object.assign(el.style, attrs[k]);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
    else if (k === "class") el.className = attrs[k];
    else if (k === "html") el.innerHTML = attrs[k];
    else el.setAttribute(k, attrs[k]);
  }
  for (const kid of kids) {
    if (kid == null) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
function esc(s){return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function accel(label){ // "&Open" -> Open with O underlined
  const i = label.indexOf("&");
  if (i < 0) return esc(label);
  return esc(label.slice(0,i)) + "<u>" + esc(label[i+1]) + "</u>" + esc(label.slice(i+2));
}
function clamp(v,a,b){return Math.max(a, Math.min(b, v));}
function fmtSize(n){
  if (n == null) return "";
  if (n < 1024) return n + " bytes";
  return Math.ceil(n/1024).toLocaleString("en-US") + "KB";
}
function fmtSizeShort(n){ return n==null ? "" : Math.max(1,Math.ceil(n/1024)) + "KB"; }

  d = new Date(d);

         hh+":"+String(d.getMinutes()).padStart(2,"0")+" "+ap;
}

    catch(e){ this.data = {}; }
  },
  get(k, def){ return (k in this.data) ? this.data[k] : def; },
  set(k, v){ this.data[k] = v; this.save(); },
  save(){
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){}

  },
  reset(){ try{ localStorage.removeItem(this.KEY); }catch(e){} this.data = {}; }
};

/* ---------------- Sound (Web Audio, all synthesized) ---------------- */
const Snd = {
  ctx: null, enabled: State.get("sndOn", true),
  vols: State.get("vols", {master:.7, wave:.8, midi:.8, cd:.8}),
  muted: State.get("muted", false),
  scheme: State.get("sndScheme", {}), // event -> recipe name ("(None)" disables)
  _nodes: {},
  ac(){
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.connect(this.ctx.destination);
      for (const ch of ["wave","midi","cd"]) {
        const g = this.ctx.createGain();
        g.connect(this.master);
        this._nodes[ch] = g;
      }
      this.applyVols();
    }
    if (this.ctx.state === "suspended") this.ctx.resume().catch(()=>{});
    return this.ctx;
  },
  applyVols(){
    if (!this.ctx) return;
    this.master.gain.value = this.muted ? 0 : this.vols.master;
    for (const ch of ["wave","midi","cd"]) this._nodes[ch].gain.value = this.vols[ch];
  },
  setVol(ch, v){ this.vols[ch] = v; State.set("vols", this.vols); this.applyVols(); },
  setMuted(m){ this.muted = m; State.set("muted", m); this.applyVols(); },

    if (!this.enabled) return;

    opts = opts || {};

    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = opts.type || "sine"; o.frequency.value = freq;
    if (opts.slide) o.frequency.linearRampToValueAtTime(opts.slide, t0 + dur);
    const peak = opts.gain != null ? opts.gain : .25;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + (opts.attack || .01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this._nodes[opts.ch || "wave"]);
    o.start(t0); o.stop(t0 + dur + .05);

  },

/* ---------------- Virtual File System ---------------- */
const FS_VERSION = 3;
const VFS = {
  drives: {}, _watchers: [],
  node(name, type, opts){
    opts = opts || {};
    return Object.assign({
      id: uid(), name, type, // 'd' folder, 'f' file
      kids: type === "d" ? [] : null,
      content: opts.content || null,
      size: opts.size != null ? opts.size : (opts.content ? opts.content.length : (type === "f" ? 4608 : null)),
      date: opts.date || D95(7,11,9,50),
      app: opts.app || null,          // shortcut/exe launch target (app id)
      icon: opts.icon || null,
      sys: !!opts.sys,                // undeletable system object
      hidden: !!opts.hidden,
      readonly: !!opts.readonly,
      parent: null
    });
  },
  addKid(parent, kid){ kid.parent = parent; parent.kids.push(kid); return kid; },
  ext(node){ const i = node.name.lastIndexOf("."); return i > 0 ? node.name.slice(i+1).toLowerCase() : ""; },
  isLnk(node){ return node.type === "f" && this.ext(node) === "lnk"; },
  displayName(node){
    if (node.type === "d" || !node.name.includes(".")) return node.name;
    const e = this.ext(node);
    if (["lnk","exe","com","bat"].includes(e)) return node.name.slice(0, -(e.length+1));
    return node.name;
  },
  typeName(node){
    if (node.type === "d") return "File Folder";
    const e = this.ext(node);
    return {txt:"Text Document", bmp:"Bitmap Image", doc:"WordPad Document", wri:"Write Document",
      exe:"Application", com:"MS-DOS Application", bat:"MS-DOS Batch File", lnk:"Shortcut",
      ini:"Configuration Settings", sys:"System file", ttf:"TrueType Font", hlp:"Help File",
      wav:"Wave Sound", mid:"MIDI Sequence", avi:"Video Clip", dll:"Application Extension",
      dat:"DAT File", inf:"Setup Information", cpl:"Control Panel extension"}[e] ||
      (e ? e.toUpperCase()+" File" : "File");
  },
  iconFor(node, resolveLnk){
    if (node.icon) return node.icon;
    if (node.type === "d") return "folder";
    const e = this.ext(node);
    if (e === "lnk" && resolveLnk !== false) {
      const app = Apps[node.app];
      return (app && app.icon) || "doc";
    }
    if (e === "exe" || e === "com") {
      const app = Apps[node.app];
      return (app && app.icon) || "msdos";
    }
    return {txt:"doc_text", log:"doc_text", bmp:"doc_bmp", doc:"doc_write", wri:"doc_write",
      bat:"doc_bat", sys:"doc_sys", ini:"doc_sys", inf:"doc_sys", dat:"doc_sys", dll:"doc_sys",
      hlp:"doc_hlp", wav:"sounds", mid:"sounds", avi:"mplayer", ttf:"fonts", cpl:"settings"}[e] || "doc";
  },
  _split(name, isFile){
    let base = name, ext = "";
    const di = name.lastIndexOf(".");
    if (di > 0 && isFile) { base = name.slice(0, di); ext = name.slice(di + 1); }
    const clean = s => s.toUpperCase().replace(/[^A-Z0-9$%'_@~!(){}^#&-]/g, "");
    return {base, ext, cb: clean(base), ce: clean(ext).slice(0, 3)};
  },
  _fits(name, isFile){
    const {base, ext, cb} = this._split(name, isFile);
    return cb.length <= 8 && cb.length === base.length && ext.length <= 3 && !/[a-z ]/.test(name);
  },
  shortName(node){
    if (!node.parent) return node.name;
    const {ext, cb, ce} = this._split(node.name, node.type === "f");
    if (this._fits(node.name, node.type === "f"))
      return ce ? cb.slice(0, 8) + "." + ce : cb.slice(0, 8);
    const sb = cb.slice(0, 6) || "FILE";
    // rank this node among earlier siblings needing the same prefix+ext alias — no recursion
    let rank = 1;
    for (const s of node.parent.kids) {
      if (s === node) continue;
      if (s.id >= node.id) continue;
      if (this._fits(s.name, s.type === "f")) continue;
      const ss = this._split(s.name, s.type === "f");
      if ((ss.cb.slice(0, 6) || "FILE") === sb && ss.ce === ce) rank++;

    return sb + "~" + rank + (ce ? "." + ce : "");

  path(node){
    const parts = [];
    let n = node;
    while (n) { parts.unshift(n.name); n = n.parent; }

  get(path){
    if (!path) return null;
    const parts = path.split("\\").filter(Boolean);
    if (!parts.length) return null;

    for (let i = 1; n && i < parts.length; i++) {
      n = (n.kids || []).find(k => k.name.toLowerCase() === parts[i].toLowerCase() ||
        (k.type === "f" && this.shortName(k).toLowerCase() === parts[i].toLowerCase()) ||

  uniqueName(parent, want){

/* simulated clock: it is always the autumn of 1995 */
const SimClock = {
  offset: 0,
  init(){
    const boot95 = new Date(1995, 8, 14, 9, 12, 0).getTime(); // Sept 14 1995, 9:12am
    const elapsed = State.get("clockElapsed", 0);
    this.offset = boot95 + elapsed - Date.now();
    setInterval(() => State.set("clockElapsed", this.now() - boot95), 30000);
  },
  now(){ return Date.now() + this.offset; },
  set(t){ this.offset = t - Date.now(); }
};

/* ---------------- Popup menus ---------------- */
const Popups = {
  stack: [],
  closeAll(){ while (this.stack.length) this.stack.pop().remove(); },
  closeFrom(level){ while (this.stack.length > level) this.stack.pop().remove(); }
};
window.addEventListener("pointerdown", e => {
  if (!e.target.closest(".popup") && !e.target.closest("#startmenu") && !e.target.closest("#startbtn") &&
      !e.target.closest(".menubar")) {
    Popups.closeAll(); StartMenu.close(); MenuBarCtl.closeAll();
  }
}, true);
function showPopup(items, x, y, opts){
  opts = opts || {};
  const level = opts.level || 0;
  Popups.closeFrom(level);
  const pop = h("div", {class:"popup" + (opts.big ? " bigicons" : "")});
  if (typeof items === "function") items = items();
  for (const it of items) {
    if (!it) continue;
    if (it.sep) { pop.appendChild(h("div", {class:"psep"})); continue; }
    const row = h("div", {class:"pi" + (it.disabled ? " disabled" : "")});
    const ic = h("span", {class:"ic"});
    if (it.icon) ic.appendChild(iconEl(it.icon, opts.big ? 24 : 16, it.lnk));
    else if (it.checked) ic.innerHTML = '<span class="chk">✓</span>';
    else if (it.radio) ic.innerHTML = '<span class="chk">●</span>';
    row.appendChild(ic);
    row.appendChild(h("span", {class:"lbl" + (it.bold ? " b" : ""), html: (it.bold?"<b>":"") + accel(it.label) + (it.bold?"</b>":"")}));
    if (it.shortcut) row.appendChild(h("span", {class:"shct"}, it.shortcut));
    if (it.submenu) row.appendChild(h("span", {class:"sub", html:"▸"}));
    row.addEventListener("pointerenter", () => {
      $$(".pi.hilite", pop).forEach(p => p.classList.remove("hilite"));
      row.classList.add("hilite");
      clearTimeout(pop._subT);
      pop._subT = setTimeout(() => {
        Popups.closeFrom(level + 1);
        if (it.submenu && !it.disabled) {
          const r = row.getBoundingClientRect();
          const sub = typeof it.submenu === "function" ? it.submenu() : it.submenu;
          showPopup(sub, r.right - 3, r.top - 3, Object.assign({}, opts, {level: level + 1, big:false}));
        }
      }, it.submenu ? 280 : 200);
    });
    row.addEventListener("pointerleave", () => row.classList.remove("hilite"));
    row.addEventListener("pointerup", e => {
      e.stopPropagation();
      if (it.disabled) return;
      if (it.submenu) return;
      Popups.closeAll(); StartMenu.close(); MenuBarCtl.closeAll();
      Snd.event("Menu command");
      if (it.action) it.action();
    });
    pop.appendChild(row);
  }
  document.body.appendChild(pop);
  const r = pop.getBoundingClientRect();
  let px = x, py = y;
  if (px + r.width > innerWidth) px = Math.max(0, (opts.level ? x - r.width - (opts.parentW || 0) + 6 : innerWidth - r.width - 2));
  if (py + r.height > innerHeight) py = Math.max(0, innerHeight - r.height - 2);
  pop.style.left = px + "px"; pop.style.top = py + "px";
  Popups.stack.push(pop);
  return pop;
}

/* ---------------- Menu bar controller ---------------- */
const MenuBarCtl = {
  open: null,
  closeAll(){
    if (this.open) { this.open.el.classList.remove("open"); this.open = null; }
    // popup closing handled by Popups
  },
  attach(win, defs){
    const bar = h("div", {class:"menubar"});
    for (const def of defs) {
      const el = h("span", {class:"mtop", html: accel(def.label)});
      const openIt = () => {
        Popups.closeAll();
        this.closeAll();
        el.classList.add("open");
        this.open = {el, bar};
        const r = el.getBoundingClientRect();
        const items = typeof def.items === "function" ? def.items() : def.items;
        showPopup(items, r.left, r.bottom);
      };
      el.addEventListener("pointerdown", e => {
        e.stopPropagation();
        win.focus();
        if (this.open && this.open.el === el) { this.closeAll(); Popups.closeAll(); }
        else openIt();
      });
      el.addEventListener("pointerenter", () => {
        if (this.open && this.open.bar === bar && this.open.el !== el) openIt();
      });
      bar.appendChild(el);
    }
    return bar;
  }
};

      {label:"&Restore", disabled:!win.isMax && !win.isMin, action:()=>win.restore()},
      {label:"&Move", disabled:win.isMax},
      {label:"&Size", disabled:win.isMax || o.resizable === false},
      {label:"Mi&nimize", disabled:o.minimizable === false, action:()=>win.minimize()},
      {label:"Ma&ximize", disabled:o.maximizable === false || win.isMax, action:()=>win.maximize()},
      {sep:true},
      {label:"&Close", bold:true, shortcut:"Alt+F4", action:()=>win.close()}
    ];
    tIcon.addEventListener("pointerdown", e => {
      e.stopPropagation(); win.focus();
      const r = tIcon.getBoundingClientRect();
      showPopup(sysMenu(), r.left, r.bottom + 2);
    });
    tIcon.addEventListener("dblclick", () => win.close());
    tb.addEventListener("contextmenu", e => {
      e.preventDefault(); e.stopPropagation();
      showPopup(sysMenu(), e.clientX, e.clientY);
    });
    // menubar
    if (o.menus) el.appendChild(win.menubar = MenuBarCtl.attach(win, o.menus));
    // body
    const body = h("div", {class:"win-body"});
    el.appendChild(body);
    win.body = body;
    // statusbar
    if (o.statusbar) {
      const sb = h("div", {class:"statusbar"});
      win.statusCells = o.statusbar.map(cell => {
        const c = h("div", {class:"cell" + (cell.fix ? " fix" : "")}, cell.text || "");
        if (cell.w) { c.style.minWidth = cell.w + "px"; c.style.flex = "0 0 auto"; }
        sb.appendChild(c); return c;
      });
      el.appendChild(sb);
    }
    // dragging (outline style, authentic)
    tb.addEventListener("pointerdown", e => {
      if (e.button !== 0 || win.isMax) return;
      win.focus();
      const sx = e.clientX, sy = e.clientY;
      const r = el.getBoundingClientRect();
      let outline = null, moved = false;
      const mm = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 4) return;
        moved = true;
        if (!outline) { outline = h("div", {class:"dragoutline"}); document.body.appendChild(outline); }
        Object.assign(outline.style, {
          left: clamp(r.left + dx, -r.width + 40, innerWidth - 40) + "px",
          top: clamp(r.top + dy, 0, innerHeight - 30) + "px",
          width: r.width + "px", height: r.height + "px"
        });
      };
      const mu = ev => {
        window.removeEventListener("pointermove", mm);
        window.removeEventListener("pointerup", mu);
        if (outline) {
          el.style.left = outline.style.left; el.style.top = outline.style.top;
          outline.remove();
        }
      };
      window.addEventListener("pointermove", mm);
      window.addEventListener("pointerup", mu);
    });
    tb.addEventListener("dblclick", e => {
      if (e.target.closest(".tb-btns") || e.target.closest(".tb-icon")) return;
      if (o.maximizable !== false) win.toggleMax();
    });
    el.addEventListener("pointerdown", () => win.focus(), true);
    // resizing
    if (o.resizable !== false) {
      for (const dir of ["n","s","e","w","nw","ne","sw","se"]) {
        const rz = h("div", {class:"resizer rz-" + dir});
        rz.addEventListener("pointerdown", e => {
          if (e.button !== 0 || win.isMax) return;
          e.stopPropagation(); win.focus();
          const sx = e.clientX, sy = e.clientY, r = el.getBoundingClientRect();
          let outline = h("div", {class:"dragoutline", style:{left:r.left+"px", top:r.top+"px", width:r.width+"px", height:r.height+"px"}});
          document.body.appendChild(outline);
          const minW = o.minW || 160, minH = o.minH || 80;
          const mm = ev => {
            const dx = ev.clientX - sx, dy = ev.clientY - sy;
            let L = r.left, T = r.top, W = r.width, H = r.height;
            if (dir.includes("e")) W = Math.max(minW, r.width + dx);
            if (dir.includes("s")) H = Math.max(minH, r.height + dy);
            if (dir.includes("w")) { W = Math.max(minW, r.width - dx); L = r.right - W; }
            if (dir.includes("n")) { H = Math.max(minH, r.height - dy); T = r.bottom - H; }
            Object.assign(outline.style, {left:L+"px", top:T+"px", width:W+"px", height:H+"px"});
          };
          const mu = () => {
            window.removeEventListener("pointermove", mm);
            window.removeEventListener("pointerup", mu);
            Object.assign(el.style, {left:outline.style.left, top:outline.style.top,
              width:outline.style.width, height:outline.style.height});
            outline.remove();
            if (win.onResize) win.onResize();
          };
          window.addEventListener("pointermove", mm);
          window.addEventListener("pointerup", mu);
        });
        el.appendChild(rz);
      }
    }
    // methods
    win.el = el;
    win.setTitle = t => { win.title = t; tTxt.textContent = t; Taskbar.updateWin(win); };
    win.setIcon = n => { win.iconName = n; tIcon.innerHTML = ""; tIcon.appendChild(iconEl(n,16)); Taskbar.updateWin(win); };
    win.setStatus = (t, i) => { if (win.statusCells && win.statusCells[i||0]) win.statusCells[i||0].textContent = t; };
    win.focus = () => {
      if (win.isMin) return win.restoreFromMin();
      if (this.active === win) return;
      if (this.active) this.active.el.classList.add("inactive");
      this.active = win;
      el.classList.remove("inactive");
      el.style.zIndex = ++this.z;
      Taskbar.setActive(win);
      if (win.onFocusCb) win.onFocusCb();
    };
    win.blur = () => { el.classList.add("inactive"); if (this.active === win) { this.active = null; Taskbar.setActive(null); } };
    win.minimize = () => {
      if (win.isMin || o.minimizable === false) return;
      Snd.event("Minimize");
      const from = el.getBoundingClientRect();
      win.isMin = true;
      el.style.display = "none";
      if (this.active === win) { this.active = null; }
      Taskbar.updateWin(win);
      Taskbar.setActive(null);
      const to = Taskbar.btnRect(win) || {left:innerWidth/2, top:innerHeight, width:120, height:20};
      zoomRects(from, to);
      this.focusTop();
    };
    win.restoreFromMin = () => {
      win.isMin = false;
      el.style.display = "flex";
      const to = el.getBoundingClientRect();
      const from = Taskbar.btnRect(win) || to;
      zoomRects(from, to);
      win.focus();
      Taskbar.updateWin(win);
    };
    win.maximize = () => {
      if (win.isMax) return;
      Snd.event("Maximize");
      win.prevBounds = {left:el.style.left, top:el.style.top, width:el.style.width, height:el.style.height};
      const a = this.desktopArea();
      Object.assign(el.style, {left:a.x-2+"px", top:a.y-2+"px", width:a.w+4+"px", height:a.h+4+"px"});
      win.isMax = true; el.classList.add("maxed");
      if (bMax) bMax.innerHTML = G.restore;
      if (win.onResize) win.onResize();
    };
    win.restore = () => {
      if (win.isMin) return win.restoreFromMin();
      if (!win.isMax) return;
      Object.assign(el.style, win.prevBounds);
      win.isMax = false; el.classList.remove("maxed");
      if (bMax) bMax.innerHTML = G.max;
      if (win.onResize) win.onResize();
    };
    win.toggleMax = () => win.isMax ? win.restore() : win.maximize();
    win.close = (force) => {
      if (!force && win.onClose && win.onClose() === false) return;
      const i = this.wins.indexOf(win);
      if (i >= 0) this.wins.splice(i,1);
      el.remove();
      if (!o.noTaskbar) Taskbar.removeWin(win);
      if (this.active === win) { this.active = null; this.focusTop(); }
      if (win.onClosed) win.onClosed();
    };
    this.wins.push(win);
    $("#desktop").appendChild(el);
    if (!o.noTaskbar) Taskbar.addWin(win);
    win.focus();
    return win;
  },
  focusTop(){
    const vis = this.wins.filter(w => !w.isMin);
    if (vis.length) {
      const top = vis.reduce((a,b) => (+a.el.style.zIndex > +b.el.style.zIndex ? a : b));
      top.focus();
    } else Taskbar.setActive(null);
  },
  findByApp(appId){ return this.wins.find(w => w.o.appId === appId); },
  cascadeAll(){
    let i = 0;
    for (const w of this.wins) {
      if (w.isMin) continue;
      if (w.isMax) w.restore();
      Object.assign(w.el.style, {left: 10 + i*24 + "px", top: 10 + i*22 + "px"});
      i++;
    }
  },
  tile(vertical){
    const vis = this.wins.filter(w => !w.isMin);
    if (!vis.length) return;
    const a = this.desktopArea();
    const n = vis.length;
    vis.forEach((w, i) => {
      if (w.isMax) w.restore();
      if (vertical) Object.assign(w.el.style, {left: a.w/n*i + "px", top:"0px", width: a.w/n + "px", height: a.h + "px"});
      else Object.assign(w.el.style, {left:"0px", top: a.h/n*i + "px", width: a.w + "px", height: a.h/n + "px"});
      if (w.onResize) w.onResize();
    });
  },
  minimizeAll(){ for (const w of this.wins.slice()) if (!w.isMin) w.minimize(); }
};
function zoomRects(from, to){
  const steps = 8, boxes = [];
  for (let i = 0; i < steps; i++) {
    const t = i / (steps - 1);
    const box = h("div", {class:"zoomrect", style:{
      left: from.left + (to.left - from.left) * t + "px",
      top: from.top + (to.top - from.top) * t + "px",
      width: from.width + (to.width - from.width) * t + "px",
      height: from.height + (to.height - from.height) * t + "px",
      display: "none"
    }});
    document.body.appendChild(box); boxes.push(box);
  }
  boxes.forEach((b, i) => {
    setTimeout(() => { b.style.display = "block"; setTimeout(() => b.remove(), 40); }, i * 18);
  });
}

/* ---------------- Dialog helpers ---------------- */
const Dlg = {
  modalCount: 0,
  btn(label, onclick, opts){
    opts = opts || {};
    const b = h("button", {class:"btn" + (opts.default ? " default" : "")}, label);
    if (onclick) b.addEventListener("click", onclick);
    if (opts.disabled) b.disabled = true;
    if (opts.w) b.style.minWidth = opts.w + "px";
    return b;
  },
  show(o){ // generic modal-ish dialog window
    const base = 65000 + (this.modalCount++) * 2;
    const shield = h("div", {style:{position:"fixed", inset:"0", zIndex: String(base)}});
    shield.addEventListener("pointerdown", e => {
      e.stopPropagation(); e.preventDefault();
      flashTitle(win);
    });
    $("#desktop").appendChild(shield);
    const win = WM.create(Object.assign({resizable:false, minimizable:false, maximizable:false,
      noTaskbar:true, center:true}, o));
    const raise = () => { win.el.style.zIndex = String(base + 1); };
    raise();
    const origFocus = win.focus;
    win.focus = () => { origFocus(); raise(); };
    let closed = false;
    const origClose = win.close;
    win.close = force => {
      if (!closed) { closed = true; this.modalCount--; shield.remove(); }
      origClose(force);
    };
    return win;
  },
  msg(o){ // message box; returns Promise of button label
    return new Promise(res => {
      Snd.event(o.sound || {error:"Critical Stop", warn:"Exclamation", info:"Asterisk", question:"Question"}[o.icon] || "Default sound");
      const win = this.show({title:o.title || "Windows", icon:o.winIcon || "winlogo", w:o.w || 360, h:10});
      const body = h("div", {class:"msgbox-body"});
      if (o.icon) {
        const ic = h("div", {style:{width:"32px", height:"32px", flex:"0 0 32px"}});
        ic.innerHTML = Icons["err_" + ({error:"x", warn:"warn", info:"info", question:"q"}[o.icon] || "info")]();
        body.appendChild(ic);
      }
      body.appendChild(h("div", {class:"msgbox-txt", html: o.html || esc(o.text || "").replace(/\n/g,"<br>")}));
      const btnRow = h("div", {class:"dlgbtns center"});
      const labels = o.buttons || ["OK"];
      labels.forEach((label, i) => {
        btnRow.appendChild(this.btn(label, () => { win.close(true); res(label); }, {default: i === 0}));
      });
      win.body.append(body, btnRow);
      // details section (for illegal-operation style boxes)
      if (o.details) {
        const det = h("pre", {class:"selectable", style:{display:"none", margin:"0 14px 12px", padding:"6px",
          background:"#fff", fontSize:"10px", fontFamily:"'Courier New',monospace", overflow:"auto",
          maxHeight:"120px", boxShadow:"inset -1px -1px #fff, inset 1px 1px #808080"}}, o.details);
        const db = this.btn("Details >>", () => {
          det.style.display = det.style.display === "none" ? "block" : "none";
          db.textContent = det.style.display === "none" ? "Details >>" : "Details <<";
          sizeTo(win);
        });
        btnRow.appendChild(db);
        win.body.appendChild(det);
      }
      sizeTo(win);
      const onKey = e => {
        if (e.key === "Enter") { win.close(true); res(labels[0]); cleanup(); }
        if (e.key === "Escape") { win.close(true); res(labels[labels.length-1]); cleanup(); }
      };
      const cleanup = () => window.removeEventListener("keydown", onKey);
      window.addEventListener("keydown", onKey);
      const oc = win.close;
      win.close = f => { cleanup(); oc(f); };
    });
  },
  input(title, prompt, initial){ // returns Promise<string|null>
    return new Promise(res => {
      const win = this.show({title, icon:"doc", w:340, h:10});
      const inp = h("input", {class:"field", style:{width:"100%"}, value: initial || ""});
      const done = v => { win.close(true); res(v); };
      win.body.append(
        h("div", {class:"dlgpad"}, h("div", {style:{marginBottom:"6px"}}, prompt), inp),
        h("div", {class:"dlgbtns"},
          this.btn("OK", () => done(inp.value), {default:true}),
          this.btn("Cancel", () => done(null)))
      );
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") done(inp.value);
        if (e.key === "Escape") done(null);
      });
      sizeTo(win);
      setTimeout(() => { inp.focus(); inp.select(); }, 30);
    });
  },
  propSheet(o){ // tabbed property sheet with OK/Cancel/Apply
    const win = this.show({title:o.title, icon:o.icon || "settings", w:o.w || 408, h:o.h || 445});
    const tabs = h("div", {class:"tabs", style:{padding:"8px 8px 0"}});
    const strip = h("div", {class:"tabstrip"});
    const panel = h("div", {class:"tabpanel"});
    const sheet = {win, panels:[], current:0, dirty:false, applyBtn:null,
      markDirty(){ this.dirty = true; if (this.applyBtn) this.applyBtn.disabled = false; }};
    o.tabs.forEach((t, i) => {
      const tab = h("div", {class:"tab" + (i === 0 ? " on" : "")}, t.label);
      tab.addEventListener("mousedown", () => {
        $$(".tab", strip).forEach(el => el.classList.remove("on"));
        tab.classList.add("on");
        sheet.current = i;
        panel.innerHTML = "";
        panel.appendChild(sheet.panels[i]);
        if (t.onShow) t.onShow(sheet.panels[i], sheet);
      });
      strip.appendChild(tab);
      const p = h("div", {style:{height:"100%", display:"flex", flexDirection:"column"}});
      t.build(p, sheet);
      sheet.panels.push(p);
    });
    panel.appendChild(sheet.panels[0]);
    tabs.append(strip, panel);
    const btns = h("div", {class:"dlgbtns"});
    const doApply = () => { if (o.onApply) o.onApply(sheet); sheet.dirty = false; if (sheet.applyBtn) sheet.applyBtn.disabled = true; };
    btns.append(
      this.btn("OK", () => { if (sheet.dirty || o.alwaysApply) doApply(); win.close(true); if (o.onOK) o.onOK(sheet); }, {default:true}),
      this.btn("Cancel", () => { win.close(true); if (o.onCancel) o.onCancel(sheet); })
    );
    if (o.onApply) {
      sheet.applyBtn = this.btn("Apply", doApply, {disabled:true});
      btns.appendChild(sheet.applyBtn);
    }
    win.body.append(tabs, btns);
    win.el.style.width = (o.w || 408) + "px";
    win.el.style.height = (o.h || 445) + "px";
    return sheet;
  }
};
function sizeTo(win){
  win.el.style.height = "auto";
  const r = win.el.getBoundingClientRect();
  win.el.style.height = Math.ceil(r.height) + "px";
  win.el.style.left = Math.max(2, (innerWidth - r.width)/2) + "px";
  win.el.style.top = Math.max(2, (innerHeight - r.height)/2.6) + "px";
}
function flashTitle(win){
  let n = 0;
  const t = setInterval(() => {
    win.el.classList.toggle("inactive");
    if (++n >= 6) { clearInterval(t); win.el.classList.remove("inactive"); }
  }, 60);
  Snd.event("Default sound");
}

    $("#trayvol").addEventListener("dblclick", () => Apps.volume.launch());
    $("#clock").addEventListener("dblclick", () => CPL.open("datetime"));

    $("#taskbar").addEventListener("contextmenu", e => {
      if (e.target.closest(".taskbtn") || e.target.closest("#startbtn")) return;
      e.preventDefault();
      showPopup([
        {label:"&Cascade", action:()=>WM.cascadeAll()},

        {label:"Tile &Vertically", action:()=>WM.tile(true)},
        {sep:true},
        {label:"&Minimize All Windows", action:()=>WM.minimizeAll()},

        {label:"P&roperties", action:()=>this.properties()}
      ], e.clientX, e.clientY - 10);
    });
    $("#startbtn").addEventListener("contextmenu", e => {
      e.preventDefault();
      showPopup([
        {label:"&Open", bold:true, action:()=>Shell.openPath("C:\\WINDOWS\\Start Menu")},
        {label:"&Explore", action:()=>Apps.explorer.launch("C:\\WINDOWS\\Start Menu")},
        {label:"&Find...", action:()=>Shell.findDialog("C:\\WINDOWS\\Start Menu")}

      e.preventDefault();
      showPopup([
        {label:"&Restore", disabled:!win.isMin && !win.isMax, action:()=>win.restore()},

  properties(){

/* ---------------- Alt+Tab switcher & global keys ---------------- */
const Switcher = {
  el: null, idx: 0, list: [],
  show(){
    this.list = WM.wins.filter(w => !w.o.noTaskbar);
    if (this.list.length < 1) return;
    this.idx = 1 % this.list.length;
    if (!this.el) {
      this.el = h("div", {class:"b-out", style:{position:"fixed", left:"50%", top:"40%", transform:"translate(-50%,-50%)",
        zIndex:"90000", padding:"12px", display:"none"}});
      document.body.appendChild(this.el);
    }
    this.render(); this.el.style.display = "block";
  },
  render(){
    this.el.innerHTML = "";
    const row = h("div", {style:{display:"flex", gap:"6px", marginBottom:"8px"}});
    this.list.forEach((w, i) => {
      const c = h("div", {style:{width:"44px", height:"44px", display:"flex", alignItems:"center",
        justifyContent:"center", outline: i === this.idx ? "2px solid #000080" : "none", padding:"4px"}});
      c.appendChild(iconEl(w.iconName, 32));
      row.appendChild(c);
    });
    this.el.append(row, h("div", {class:"b-in-thin", style:{padding:"3px 6px", background:"#c0c0c0"}},
      this.list[this.idx] ? this.list[this.idx].title : ""));
  },
  next(back){
    if (!this.list.length) return;
    this.idx = (this.idx + (back ? -1 : 1) + this.list.length) % this.list.length;
    this.render();
  },
  commit(){
    if (this.el) this.el.style.display = "none";
    const w = this.list[this.idx];
    if (w) { if (w.isMin) w.restoreFromMin(); else w.focus(); }
    this.list = [];
  },
  active(){ return this.el && this.el.style.display === "block"; }
};
window.addEventListener("keydown", e => {
  if (!Boot.desktopReady) return;
  if (e.altKey && e.key === "Tab") {
    e.preventDefault();
    if (Switcher.active()) Switcher.next(e.shiftKey);
    else Switcher.show();
    return;
  }
  if (e.ctrlKey && e.key === "Escape") { e.preventDefault(); StartMenu.toggle(); return; }
  if (e.ctrlKey && e.altKey && (e.key === "Delete" || e.key === "Backspace" || e.key.toLowerCase() === "d")) {
    e.preventDefault(); CloseProgram.show(); return;
  }
  if (e.altKey && e.key === "F4") {
    e.preventDefault();
    if (WM.active) WM.active.close(); else Shutdown.dialog();
    return;
  }
  if (e.key === "Escape") { Popups.closeAll(); StartMenu.close(); }
  if (e.key === "F1" && !e.ctrlKey && !e.altKey && !WM.active) HelpEngine.open();
});
window.addEventListener("keyup", e => {
  if (e.key === "Alt" && Switcher.active()) { e.preventDefault(); Switcher.commit(); }
});

/* ---------------- Drag & drop manager (custom, with copy plus-badge) ---------------- */
const DragMgr = {
  handlers: {}, hid: 0,
  register(el, handler){
    const id = "dz" + (++this.hid);
    el.dataset.drop = id;
    this.handlers[id] = handler;
    return id;
  },
  start(e, payload, iconName){
    const ghost = h("div", {style:{position:"fixed", zIndex:"99999", pointerEvents:"none",
      opacity:".6", left:e.clientX+4+"px", top:e.clientY+4+"px", display:"none"}});
    ghost.appendChild(iconEl(iconName || "doc", 32));
    const plus = h("div", {style:{position:"absolute", right:"-8px", bottom:"-6px", width:"11px", height:"11px",
      background:"#fff", border:"1px solid #000", display:"none", fontSize:"10px", lineHeight:"9px",
      textAlign:"center", fontWeight:"bold", color:"#000"}}, "+");
    ghost.appendChild(plus);
    document.body.appendChild(ghost);
    let started = false;
    const sx = e.clientX, sy = e.clientY;
    const mm = ev => {
      if (!started && Math.abs(ev.clientX-sx) + Math.abs(ev.clientY-sy) < 5) return;
      started = true;
      ghost.style.display = "block";
      ghost.style.left = ev.clientX+6+"px"; ghost.style.top = ev.clientY+2+"px";
      plus.style.display = ev.ctrlKey ? "block" : "none";
    };
    const mu = ev => {
      window.removeEventListener("pointermove", mm);
      window.removeEventListener("pointerup", mu);
      ghost.remove();
      if (!started) return;
      ghost.style.display = "none";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const dz = under && under.closest("[data-drop]");
      if (dz) {
        const hnd = this.handlers[dz.dataset.drop];
        if (hnd && (!hnd.accept || hnd.accept(payload)))
          hnd.drop(payload, ev.ctrlKey, {x:ev.clientX, y:ev.clientY});
      }
    };
    window.addEventListener("pointermove", mm);
    window.addEventListener("pointerup", mu);
  }
};

  items: State.get("recycle", []),
  save(){ State.set("recycle", this.items); Desktop.refreshIcons(); Shell.refreshSpecial("recycle"); },

  add(node){
    const path = VFS.path(node.parent ? node.parent : node);
    this.items.push({data: VFS.serializeNode(node), orig: path, deleted: SimClock.now(), id: uid()});
    this.save();
  },
  restore(id){
    const i = this.items.findIndex(x => x.id === id);
    if (i < 0) return;
    const it = this.items[i];
    let parent = VFS.get(it.orig);
    if (!parent || parent.type !== "d") parent = VFS.get("C:\\WINDOWS\\Desktop");
    const node = VFS.restoreNode(it.data);
    node.name = VFS.uniqueName(parent, node.name);

/* ---------------- Shell ---------------- */
const Shell = {
  recent: State.get("recent", []),
  clip: null, // {nodes:[paths], cut:bool}
  folderWins: new Map(), // path -> win (spatial mode)
  browseSingle: State.get("browseSingle", false),
  addRecent(node){
    const p = VFS.path(node);
    this.recent = [p].concat(this.recent.filter(x => x !== p)).slice(0, 10);
    State.set("recent", this.recent);
  },
  openNode(node, opts){
    opts = opts || {};
    if (!node) return;
    if (node.type === "d") return this.openFolder(node, opts);
    const e = VFS.ext(node);
    if (e === "lnk") {
      const app = Apps[node.app];
      if (app) return app.launch(node.arg);
      return Dlg.msg({title:"Problem with Shortcut", icon:"error",
        text:"The item this shortcut refers to has been changed or moved. The nearest match, nothing, has been opened instead."});
    }
    if (e === "exe" || e === "com") {
      const app = Apps[node.app];
      if (app) return app.launch();
      return Errors.illegalOp(VFS.displayName(node));
    }
    this.addRecent(node);
    if (e === "txt" || e === "log" || e === "ini" || e === "inf" || e === "bat" || e === "sys")
      return Apps.notepad.launch(node);
    if (e === "bmp") return Apps.paint.launch(node);
    if (e === "doc" || e === "wri") return Apps.wordpad.launch(node);
    if (e === "wav" || e === "mid" || e === "avi") return Apps.mplayer.launch(node);
    if (e === "hlp") return HelpEngine.open();
    if (e === "ttf" || e === "fon") return this.fontPreview(node);
    return Dlg.msg({title: VFS.displayName(node), icon:"warn", w:400,
      text:"Windows cannot open this file.\n\nTo open this file, Windows needs to know what program created it. This exhibit politely declines to guess.",
      buttons:["OK"]});
  },
  openPath(p, opts){ return this.openNode(VFS.get(p), opts); },
  /* ---- folder windows (spatial) ---- */
  openFolder(node, opts){
    opts = opts || {};
    const path = VFS.path(node);
    if (this.browseSingle && opts.fromWin && !opts.explorer) {
      opts.fromWin.navigate(node);
      return opts.fromWin;
    }
    const existing = this.folderWins.get(path.toLowerCase());
    if (existing && !existing._closed) { existing.win.focus(); return existing; }
    return this.makeFolderWindow({node});
  },
  specialWins: new Map(),
  refreshSpecial(kind){
    for (const [k, fw] of this.specialWins) if (!fw._closed && (k === kind || !kind)) fw.refresh();
    for (const [p, fw] of this.folderWins) if (!fw._closed) fw.refresh();
    Desktop.refreshIcons();
  },
  /* providers for special folders */
  provider(spec){
    if (spec.node) {
      const node = spec.node;
      return {
        kind:"node", node,
        title: () => node.parent ? node.name : diskTitle(node),
        icon: () => node.parent ? VFS.iconFor(node) : driveIcon(node),

    };

        .concat(State.get("printers", []).map((p,i) => ({id:"p"+i, name:p, icon:"printer", special:"printer:"+p, type:"Printer"})))
    };
    P.recycle = {
      kind:"recycle", title:()=>"Recycle Bin", icon:()=>RecycleBin.isEmpty() ? "recycle_empty" : "recycle_full",
      list: () => RecycleBin.items.map(it => ({
        id: it.id, name: it.data.n, icon: it.data.t === "d" ? "folder" : "doc",
        special:"rbitem:"+it.id, type: it.data.t === "d" ? "File Folder" : "File",

      }))
    };
    P.nethood = {
      kind:"nethood", title:()=>"Network Neighborhood", icon:()=>"nethood",
      list: () => [
        {id:"entire", name:"Entire Network", icon:"regional", special:"entirenet", type:"Network"},
        {id:"m1", name:"Bedroom486", icon:"computer", special:"netpc:Bedroom486", type:"Computer"},
        {id:"m2", name:"Den_pentium", icon:"computer", special:"netpc:Den_pentium", type:"Computer"}
      ]
    };

  },
  makeFolderWindow(spec, asExplorer){
    const fw = new FolderWin(spec, asExplorer);
    if (spec.node) this.folderWins.set(VFS.path(spec.node).toLowerCase(), fw);
    else this.specialWins.set(spec.special, fw);
    return fw;
  },
  openSpecial(special){
    const ex = this.specialWins.get(special);
    if (ex && !ex._closed) { ex.win.focus(); return ex; }

  openMyComputer(){ return this.openSpecial("mycomputer"); },

      text:"The device is not ready.", buttons:["Retry","Cancel"]}).then(r => {
        if (r === "Retry") setTimeout(() => this.driveAError(), 300);
      });
  },
  openItem(item, fromWin){
    if (item.node) {
      if (item.node.type === "d" || !item.node.parent) this.openFolder(item.node, {fromWin});
      else this.openNode(item.node);
      return;
    }
    const sp = item.special;
    if (!sp) return;
    if (sp === "driveA") return this.driveAError();
    if (sp === "controlpanel") return this.openControlPanel();
    if (sp === "printers") return this.openPrinters();
    if (sp === "addprinter") return CPL.addPrinterWizard();
    if (sp.startsWith("printer:")) return Dlg.msg({title:sp.slice(8), icon:"info", text:"0 document(s) in queue.\n\nThe printer is imaginary, but it is ready."});
    if (sp.startsWith("cpl:")) return CPL.open(sp.slice(4));

    if (sp === "entirenet") return Dlg.msg({title:"Entire Network", icon:"info", text:"The entire network consists of this room."});
    if (sp.startsWith("netpc:")) return this.openNetPc(sp.slice(6));

  /* ---- clipboard ops ---- */
  cutCopy(nodes, cut){ this.clip = {paths: nodes.map(n => VFS.path(n)), cut}; },
  canPaste(){ return this.clip && this.clip.paths.length > 0; },
  paste(destNode){
    if (!this.canPaste() || !destNode || destNode.type !== "d") return;
    for (const p of this.clip.paths) {
      const n = VFS.get(p);
      if (!n) continue;
      if (this.clip.cut) VFS.move(n, destNode);
      else VFS.copy(n, destNode);
    }
    if (this.clip.cut) this.clip = null;
  },
  /* ---- delete with recycle ---- */
  deleteNodes(nodes){
    nodes = nodes.filter(n => n && n.parent);

    if (sysHit) return Dlg.msg({title:"Error Deleting File", icon:"error",
      text:"Cannot delete " + VFS.displayName(sysHit) + ": This object is required by Windows and cannot be removed."});
    const doIt = () => {
      for (const n of nodes) { RecycleBin.add(n); VFS.remove(n); }
      RecycleBin.save();
    };
    if (!State.get("rbConfirm", true)) return doIt();
    const what = nodes.length === 1
      ? "'" + VFS.displayName(nodes[0]) + "'"
      : "these " + nodes.length + " items";
    Dlg.msg({title: nodes.length === 1 && nodes[0].type === "d" ? "Confirm Folder Delete" : "Confirm File Delete",
      icon:"question",

  createShortcut(node, destFolder){

  nodeContextMenu(node, opts){

      items.push({label:"&Print", action:() => Dlg.msg({title:"Print", icon:"info", text:"The document was sent to the imaginary printer, which printed it imaginarily."})});
    items.push({sep:true});

    items.push({label:"Cu&t", action:() => this.cutCopy(multi, true)});

      items.push({label:"&Paste", disabled:!this.canPaste(), action:() => this.paste(node)});

  propertiesDialog(node){
    const isDir = node.type === "d";
    const shortPath = () => {
      const parts = [];
      let n = node;
      while (n) { parts.unshift(n.parent ? VFS.shortName(n) : n.name); n = n.parent; }
      return parts.join("\\").replace("\\\\","\\");
    };
    const count = dir => {
      let f = 0, d = 0;
      const walk = x => { for (const k of x.kids || []) { if (k.type === "d") { d++; walk(k); } else f++; } };
      walk(dir); return {f, d};
    };
    Dlg.propSheet({title: VFS.displayName(node) + " Properties", icon: VFS.iconFor(node), w:380, h:445,
      tabs:[{label:"General", build:p => {
        const row = (a,b) => h("div", {style:{display:"flex", margin:"5px 0"}},
          h("div", {style:{width:"110px", color:"#000"}}, a), h("div", {class:"selectable"}, b));

        const head = h("div", {style:{display:"flex", alignItems:"center", gap:"12px"}});
        head.appendChild(iconEl(VFS.iconFor(node), 32, VFS.isLnk(node)));
        head.appendChild(h("div", {class:"b-in-thin", style:{flex:"1", padding:"3px 6px", background:"#fff"}}, VFS.displayName(node)));
        p.appendChild(head); p.appendChild(hr());
        p.appendChild(row("Type:", VFS.typeName(node)));
        p.appendChild(row("Location:", node.parent ? VFS.path(node.parent) : "Desktop"));
        if (isDir) {
          const c = count(node);
          let bytes = 0; const sum = x => { for (const k of x.kids || []) { if (k.type === "f") bytes += k.size || 0; else sum(k); } }; sum(node);
          p.appendChild(row("Size:", fmtSize(bytes) + " (" + bytes.toLocaleString("en-US") + " bytes)"));
          p.appendChild(row("Contains:", c.f + " Files, " + c.d + " Folders"));
        } else {
          p.appendChild(row("Size:", fmtSize(node.size) + " (" + (node.size||0).toLocaleString("en-US") + " bytes)"));
        }
        p.appendChild(hr());
        p.appendChild(row("MS-DOS name:", shortPath().split("\\").pop() || node.name));
        p.appendChild(row("Created:", fmtDate(node.date)));
        if (!isDir) p.appendChild(row("Modified:", fmtDate(node.date)));
        p.appendChild(hr());
        const attrs = h("div", {style:{display:"flex", gap:"16px", flexWrap:"wrap"}});
        for (const [label, on] of [["Read-only", node.readonly], ["Archive", !isDir], ["Hidden", node.hidden], ["System", node.sys]]) {
          const cb = h("input", {type:"checkbox", class:"w95"});
          cb.checked = !!on; cb.disabled = label === "System" || label === "Archive";
          if (label === "Read-only") cb.addEventListener("change", () => { node.readonly = cb.checked; VFS.persist(); });
          if (label === "Hidden") cb.addEventListener("change", () => { node.hidden = cb.checked; VFS.changed(node.parent); });
          attrs.appendChild(h("label", {class:"w95l"}, cb, label));
        }
        p.appendChild(h("div", {style:{display:"flex"}}, h("div", {style:{width:"110px"}}, "Attributes:"), attrs));
      }}]});
  }
};
function nodeItem(node){

    const body = this.win.body;

      split.appendChild(this.treeEl);
      this.buildTree();
    }
    this.viewEl = h("div", {class:"fview"});
    split.appendChild(this.viewEl);

    this.viewEl.addEventListener("pointerdown", e => {
      if (e.target === this.viewEl || e.target.closest("table") === null && e.target.classList.contains("fview")) {

      if (itemEl) { this.ctxItem(itemEl.dataset.iid, e.clientX, e.clientY); return; }
      this.ctxBackground(e.clientX, e.clientY);
    });
    if (this.provider.kind === "node") {
      DragMgr.register(this.viewEl, {
        accept: pl => pl && pl.nodes,
        drop: (pl, ctrl) => {
          const dest = this.provider.node;
          for (const p of pl.nodes) {
            const n = VFS.get(p);
            if (!n || VFS.contains(n, dest) || n.parent === dest) continue;
            if (ctrl) VFS.copy(n, dest); else VFS.move(n, dest);
          }
        }
      });
    }
  }
