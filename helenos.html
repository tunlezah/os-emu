<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HelenOS 0.14.1 &quot;Aladar&quot; — The OS Museum</title>
<meta name="description" content="An interactive, single-file homage to HelenOS: a portable microkernel multiserver operating system in which every filesystem, driver, network stack and the entire GUI runs as a separate userspace server. Watch the servers talk, then kill one and see what survives.">
<style>
/* ==========================================================================
   HelenOS 0.14.1 "Aladar" — a single-file exhibit for The OS Museum
   --------------------------------------------------------------------------
   Nothing here is emulated. This is a hand-built simulation whose purpose is
   to make the microkernel architecture VISIBLE: the tasks, the phones, the
   answerboxes, the message traffic, and what happens when a server dies.

   Palette taken from the real uspace/lib/ui/src/resource.c:
     window face      0xc8c8c8      button face      0xc8c8c8
     button lit       0xe8e8e8      highlight        0xffffff
     shadow           0x888888      frame shadow     0x444444
     title active     0x586ac4      title inactive   0xdddddd
     inactive text    0x585858      disabled text    0x969696
     entry bg         0xffffff      selection        0x0000ff
     scrollbar trough 0xe4e4e4      active trough    0x585858
   Desktop background 0x80c8ff  (uspace/srv/hid/display/display.c)
   ========================================================================== */

:root{
  --face:#c8c8c8; --face-lit:#e8e8e8; --hi:#ffffff; --sh:#888888;
  --frame-sh:#444444; --frame:#000000;
  --tbar-act:#586ac4; --tbar-act-fg:#ffffff;
  --tbar-inact:#dddddd; --tbar-inact-fg:#585858;
  --entry-bg:#ffffff; --entry-fg:#000000;
  --sel-bg:#0000ff; --sel-fg:#ffffff;
  --sbar:#e4e4e4; --sbar-act:#585858;
  --dis:#969696;
  --desk:#80c8ff;
  --ui: "DejaVu Sans", Verdana, Geneva, Tahoma, system-ui, sans-serif;
  --mono: "DejaVu Sans Mono", "Liberation Mono", Consolas, "Courier New", monospace;
  --exhibit:#1d2330; --exhibit-fg:#d7e2f2; --exhibit-accent:#59d3c0;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:#05070c; color:#000; font:13px/1.35 var(--ui);
  -webkit-font-smoothing:none; user-select:none;
  touch-action:manipulation;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:var(--sbar)}
::-webkit-scrollbar-thumb{background:var(--face);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh)}

/* ---------- generic bevels (the toolkit's signature) ---------- */
.bev-out{ background:var(--face); border:1px solid var(--frame);
  box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh); }
.bev-in{ background:var(--face); border:1px solid var(--frame);
  box-shadow: inset 1px 1px 0 var(--sh), inset -1px -1px 0 var(--hi); }
.bev-flat{ background:var(--face); border:1px solid var(--sh); }

/* ==========================================================================
   STAGE
   ========================================================================== */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070c}
.layer{position:absolute;inset:0;display:none}
.layer.on{display:block}

/* ==========================================================================
   ARCHITECTURE CHOOSER — the front door
   ========================================================================== */
#chooser{overflow:auto;background:
   radial-gradient(ellipse 70% 55% at 50% -10%, #16233c 0%, transparent 70%),
   linear-gradient(#080b13,#05070c);
   color:#d7e2f2; font-family:var(--ui); user-select:text}
.ch-wrap{max-width:1080px;margin:0 auto;padding:38px 26px 60px}
.ch-kick{font:600 11px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--exhibit-accent);margin-bottom:16px}
.ch-title{font-size:34px;font-weight:800;letter-spacing:-.02em;color:#fff;margin-bottom:6px}
.ch-title span{color:var(--exhibit-accent)}
.ch-sub{color:#94a3b8;max-width:760px;font-size:14px;line-height:1.6;margin-bottom:8px}
.ch-sub b{color:#e2e8f0;font-weight:600}
.ch-note{margin:18px 0 26px;padding:13px 15px;border:1px solid #223049;border-left:3px solid var(--exhibit-accent);
  background:#0d1421;border-radius:0 6px 6px 0;color:#9fb0c7;font-size:12.5px;line-height:1.6;max-width:860px}
.ch-note b{color:#cfe3f5}
.ch-h{font:600 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#64748b;margin:26px 0 12px}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.ch-card{border:1px solid #22304a;background:#0e1524;border-radius:8px;padding:13px 14px;cursor:pointer;
  transition:border-color .13s,background .13s,transform .13s;position:relative;text-align:left}
.ch-card:hover{border-color:var(--exhibit-accent);background:#121b2d;transform:translateY(-2px)}
.ch-card.sel{border-color:var(--exhibit-accent);background:#132234;box-shadow:0 0 0 1px var(--exhibit-accent)}
.ch-arch{font:700 15px var(--mono);color:#fff;letter-spacing:.02em}
.ch-mach{font-size:12px;color:#8fa3bd;margin-top:3px;line-height:1.45}
.ch-meta{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.ch-tag{font:600 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#7dd3c8;
  background:#12312e;border:1px solid #1d4a45;border-radius:3px;padding:3px 5px}
.ch-tag.b{color:#c4b5fd;background:#231d3a;border-color:#3b3163}
.ch-tag.c{color:#fbbf8f;background:#33241a;border-color:#5a3d28}
.ch-go{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ch-btn{background:var(--exhibit-accent);color:#04211d;border:0;border-radius:6px;padding:12px 26px;
  font:700 14px var(--ui);cursor:pointer}
.ch-btn:hover{filter:brightness(1.12)}
.ch-btn.alt{background:#1a2437;color:#cbd5e1;border:1px solid #2b3a55}
.ch-btn.alt:hover{background:#22304a}
.ch-boot-mode{display:flex;gap:14px;align-items:center;color:#94a3b8;font-size:12.5px;flex-wrap:wrap}
.ch-boot-mode label{display:flex;gap:6px;align-items:center;cursor:pointer}
.ch-foot{margin-top:34px;padding-top:18px;border-top:1px solid #1a2333;color:#5f7189;font-size:11.5px;line-height:1.7;max-width:880px}
.ch-foot a{color:#7dd3c8}

/* ==========================================================================
   BOOT
   ========================================================================== */
#boot{background:#000;color:#c8c8c8;font:13px/1.34 var(--mono);overflow:hidden;padding:8px 12px;white-space:pre-wrap;user-select:text}
#bootlog{height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#boot .fw{color:#6ea8ff}
#boot .k{color:#c8c8c8}
#boot .ok{color:#7ee787}
#boot .warn{color:#e3b341}
#boot .srv{color:#9fb6ff}
#boot .bar{color:#58a6ff}
#boot .dim{color:#5c6773}
#boot-skip{position:absolute;right:14px;bottom:10px;color:#4b5563;font:11px var(--mono)}

/* ==========================================================================
   MACHINE (running system)
   ========================================================================== */
#machine{background:#000}
#screens{position:absolute;inset:0;display:flex}
.seat{position:relative;flex:1 1 0;min-width:0;overflow:hidden;border-left:2px solid #000;display:flex;flex-direction:column}
.seat:first-child{border-left:0}
.seat-label{position:absolute;top:0;left:0;z-index:9;background:#000a;color:#9fe;font:10px var(--mono);padding:2px 7px;border-bottom-right-radius:4px;pointer-events:none}
.desk{position:relative;flex:1 1 auto;background:var(--desk);overflow:hidden}
.desk.dead{background:#000}

/* --- windows --- */
.win{position:absolute;background:var(--face);border:1px solid var(--frame);
  box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 2px 2px 0 #0004;
  display:flex;flex-direction:column;min-width:150px;min-height:70px}
.win.exhibit{box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 0 0 0 2px var(--exhibit-accent), 3px 3px 0 #0005}
.win.min{display:none}
.wtitle{height:22px;display:flex;align-items:center;background:var(--tbar-inact);color:var(--tbar-inact-fg);
  font-size:12px;font-weight:700;flex:0 0 auto;cursor:default;padding:0;margin:2px;user-select:none}
.win.act .wtitle{background:var(--tbar-act);color:var(--tbar-act-fg)}
.wsys{width:20px;height:18px;margin:0 1px 0 2px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wsys i{display:block;width:12px;height:2px;background:currentColor;box-shadow:0 4px 0 currentColor,0 -4px 0 currentColor}
.wsys:hover{background:#fff3}
.wcap{flex:1 1 auto;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px;cursor:move}
.wbtns{display:flex;gap:2px;margin-right:2px;flex:0 0 auto}
.wbtn{width:18px;height:18px;background:var(--face);border:1px solid var(--frame);
  box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh);
  color:#000;font:700 11px/16px var(--mono);text-align:center;cursor:pointer;padding:0}
.wbtn:active,.wbtn.down{box-shadow:inset 1px 1px 0 var(--sh),inset -1px -1px 0 var(--hi);background:var(--face)}
.wbtn svg{display:block;margin:2px auto}
.wbody{flex:1 1 auto;position:relative;overflow:hidden;margin:0 2px 2px;display:flex;flex-direction:column}
.wgrip{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;z-index:5}
.wedge{position:absolute;z-index:4}
.wedge.n{left:6px;right:6px;top:-2px;height:5px;cursor:ns-resize}
.wedge.s{left:6px;right:6px;bottom:-2px;height:5px;cursor:ns-resize}
.wedge.w{top:6px;bottom:6px;left:-2px;width:5px;cursor:ew-resize}
.wedge.e{top:6px;bottom:6px;right:-2px;width:5px;cursor:ew-resize}

/* --- menu bar / menus --- */
.mbar{display:flex;flex:0 0 auto;background:var(--face);height:20px;align-items:stretch;border-bottom:0}
.mbar>div{padding:2px 8px;cursor:pointer;font-size:12px;line-height:16px}
.mbar>div.open,.mbar>div:hover{background:var(--tbar-act);color:#fff}
.menu{position:absolute;z-index:9000;background:var(--face);border:1px solid var(--frame);
  box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh),2px 2px 0 #0004;padding:2px;min-width:150px}
.menu .mi{display:flex;gap:22px;justify-content:space-between;padding:3px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.menu .mi:hover,.menu .mi.hl{background:var(--tbar-act);color:#fff}
.menu .mi.dis{color:var(--dis)}
.menu .mi.dis:hover{background:transparent;color:var(--dis)}
.menu .mi .acc{color:#333}
.menu .mi:hover .acc{color:#dde}
.menu .msep{height:1px;background:var(--sh);border-bottom:1px solid var(--hi);margin:3px 2px}
.menu .mi u{text-decoration:underline}

/* --- toolkit widgets --- */
.hbtn{background:var(--face);border:1px solid var(--frame);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh);
  padding:3px 12px;font-size:12px;cursor:pointer;min-width:64px;color:#000}
.hbtn:hover{background:var(--face-lit)}
.hbtn:active{box-shadow:inset 1px 1px 0 var(--sh),inset -1px -1px 0 var(--hi)}
.hbtn:disabled{color:var(--dis);cursor:default}
.hbtn.sm{min-width:0;padding:2px 8px;font-size:11.5px}
.hbtn.dflt{box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh),0 0 0 1px #000}
.hentry{background:var(--entry-bg);color:var(--entry-fg);border:1px solid var(--frame);
  box-shadow:inset 1px 1px 0 var(--sh);padding:3px 5px;font-size:12px;outline:none;user-select:text}
.hentry::selection{background:var(--sel-bg);color:var(--sel-fg)}
.hlist{background:var(--entry-bg);border:1px solid var(--frame);box-shadow:inset 1px 1px 0 var(--sh);
  overflow:auto;font-size:12px;flex:1 1 auto}
.hlist .row{padding:2px 6px;cursor:default;white-space:nowrap;display:flex;gap:10px}
.hlist .row.sel{background:var(--sel-bg);color:var(--sel-fg)}
.hlist .row.sel .dimc{color:#bcd}
.hlist .dimc{color:#555}
.hcheck{display:flex;gap:6px;align-items:center;cursor:pointer;font-size:12px}
.hcheck i{width:13px;height:13px;background:var(--entry-bg);border:1px solid var(--frame);
  box-shadow:inset 1px 1px 0 var(--sh);display:block;position:relative;flex:0 0 auto}
.hcheck.on i:after{content:"";position:absolute;left:3px;top:0px;width:5px;height:9px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(42deg)}
.hradio i{border-radius:50%}
.hradio.on i:after{content:"";position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%;background:#000;border:0;transform:none}
.hgroup{border:1px solid var(--sh);border-top-color:var(--hi);padding:9px 10px 10px;margin-top:8px;position:relative}
.hgroup>legend{padding:0 5px;font-size:11.5px;font-weight:700}
.hbar{height:16px;background:var(--sbar);border:1px solid var(--frame);box-shadow:inset 1px 1px 0 var(--sh);position:relative}
.hbar>i{display:block;height:100%;background:var(--tbar-act)}
.tabset{display:flex;gap:2px;margin-bottom:-1px;position:relative;z-index:2}
.tabset>div{padding:3px 12px;font-size:12px;background:var(--face);border:1px solid var(--frame);
  border-bottom:0;box-shadow:inset 1px 1px 0 var(--hi);cursor:pointer}
.tabset>div.on{background:var(--face-lit);padding-bottom:4px;margin-top:-2px}
.tabbody{border:1px solid var(--frame);box-shadow:inset 1px 1px 0 var(--hi);background:var(--face);padding:9px;flex:1 1 auto;overflow:auto}

/* --- taskbar --- */
.taskbar{flex:0 0 auto;height:28px;display:flex;align-items:center;gap:3px;padding:2px;background:var(--face);
  border-top:1px solid var(--hi);box-shadow:0 -1px 0 var(--sh)}
.tb-start{background:var(--face);border:1px solid var(--frame);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh);
  padding:2px 12px;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tb-start.down{box-shadow:inset 1px 1px 0 var(--sh),inset -1px -1px 0 var(--hi)}
.tb-start .glyph{display:inline-block;width:12px;height:12px;background:
  linear-gradient(135deg,#586ac4 50%,#80c8ff 50%);border:1px solid #000}
.tb-wins{flex:1 1 auto;display:flex;gap:3px;overflow:hidden}
.tb-win{background:var(--face);border:1px solid var(--frame);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh);
  padding:2px 9px;font-size:11.5px;cursor:pointer;max-width:170px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:0 1 auto}
.tb-win.act{box-shadow:inset 1px 1px 0 var(--sh),inset -1px -1px 0 var(--hi);background:var(--face-lit);font-weight:700}
/* text-mode taskbar — 0.14.1 runs the taskbar on the console too */
.taskbar.textmode{font-family:var(--mono);font-size:13px;height:22px;background:#aaaaaa;border-top:1px solid #000;box-shadow:none}
.taskbar.textmode .tb-start{border:0;box-shadow:none;background:#aaaaaa;font-weight:700;padding:1px 8px}
.taskbar.textmode .tb-start.down,.taskbar.textmode .tb-start:hover{background:#000;color:#aaa}
.taskbar.textmode .tb-start .glyph{display:none}
.taskbar.textmode .tb-win{border:0;box-shadow:none;background:#aaaaaa;font-family:var(--mono);font-size:12.5px}
.taskbar.textmode .tb-win.act{background:#000;color:#aaa;font-weight:700}
.taskbar.textmode .tb-clock{border:0;box-shadow:none;background:#aaaaaa;font-size:13px}
.tb-clock{background:var(--face);border:1px solid var(--frame);box-shadow:inset 1px 1px 0 var(--sh),inset -1px -1px 0 var(--hi);
  padding:2px 9px;font:12px var(--mono);flex:0 0 auto}

/* --- text console --- */
.con{position:relative;flex:1 1 auto;min-height:0;background:#000;color:#c8c8c8;font-family:var(--mono);overflow:auto;padding:2px 4px;user-select:text}
.con pre{font:13px/1.18 var(--mono);white-space:pre-wrap;word-break:break-word;margin:0}
.con .cur{background:#c8c8c8;color:#000}
.con .hl{color:#fff;font-weight:700}
.con .warn{color:#e3b341}
.con .err{color:#f87171}
.con .ok{color:#7ee787}
.con .dim{color:#5c6773}
.con .lnk{color:#58a6ff}
.vcbar{flex:0 0 auto;height:20px;background:#0b0f16;color:#7d8899;
  font:11px var(--mono);display:flex;align-items:center;gap:10px;padding:0 8px;border-top:1px solid #1b2432}
.vcbar b{color:#9fe;font-weight:700}

/* --- terminal widget --- */
.term{position:absolute;inset:0;background:#000;color:#c8c8c8;overflow:auto;padding:3px 5px;user-select:text}
.term pre{font:12.5px/1.2 var(--mono);white-space:pre-wrap;word-break:break-word;margin:0}
.term .hl{color:#fff}
.term .err{color:#f87171}
.term .ok{color:#7ee787}
.term .warn{color:#e3b341}
.term .dim{color:#5c6773}
.term .lnk{color:#58a6ff}
.term .cur{background:#c8c8c8;color:#000}

/* --- toast / notifications (exhibit chrome) --- */
#toasts{position:absolute;right:10px;top:10px;z-index:12000;display:flex;flex-direction:column;gap:7px;width:328px;pointer-events:none}
.toast{background:#111826f2;border:1px solid #2b3a55;border-left:3px solid var(--exhibit-accent);color:#d7e2f2;
  padding:9px 11px;border-radius:0 5px 5px 0;font:12px/1.5 var(--ui);box-shadow:0 6px 20px #0007;pointer-events:auto}
.toast b{color:#fff}
.toast .mono{font-family:var(--mono)}
.toast.bad{border-left-color:#f87171}
.toast.good{border-left-color:#7ee787}
.toast .sub{color:#8fa3bd;font-size:11px;margin-top:4px;line-height:1.5}

/* --- exhibit window skins --- */
.ex-body{position:absolute;inset:0;background:var(--exhibit);color:var(--exhibit-fg);font:12px/1.5 var(--ui);overflow:auto;user-select:text}
.ex-body h3{font:700 12.5px var(--ui);color:#fff;margin:14px 12px 5px}
.ex-body h3:first-child{margin-top:12px}
.ex-body p{margin:0 12px 9px;color:#adbdd2}
.ex-body p b{color:#eaf2fb}
.ex-body code,.ex-body .m{font-family:var(--mono);color:var(--exhibit-accent);font-size:11.5px}
.ex-body ul{margin:0 12px 10px 28px;color:#adbdd2}
.ex-body li{margin-bottom:5px}
.ex-note{margin:0 12px 10px;padding:8px 10px;background:#0e141f;border-left:3px solid #3b4a66;border-radius:0 4px 4px 0;color:#93a5bd;font-size:11.5px}
.ex-warn{border-left-color:#e3b341}
.ex-hr{height:1px;background:#2a3648;margin:14px 12px}

/* ipc visualiser */
#ipcv-canvas{display:block;background:#0a0f18}
.ipcv-wrap{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--exhibit)}
.ipcv-tools{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:5px 6px;background:#151c29;border-bottom:1px solid #26324a;flex-wrap:wrap}
.ipcv-tools select,.ipcv-tools button{background:#1e293b;color:#cbd5e1;border:1px solid #33425e;border-radius:3px;
  padding:3px 8px;font:11.5px var(--ui);cursor:pointer}
.ipcv-tools button.on{background:var(--exhibit-accent);color:#04211d;border-color:var(--exhibit-accent);font-weight:700}
.ipcv-tools label{color:#8fa3bd;font-size:11px}
.ipcv-split{flex:1 1 auto;display:flex;min-height:0}
.ipcv-graph{flex:1 1 auto;min-width:0;position:relative;overflow:hidden}
.ipcv-log{flex:0 0 268px;border-left:1px solid #26324a;overflow:auto;background:#0b111b;font:10.5px/1.45 var(--mono);padding:3px 5px;user-select:text}
.ipcv-log .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8ea3bd}
.ipcv-log .l .f{color:#7dd3c8}
.ipcv-log .l .t{color:#c4b5fd}
.ipcv-log .l .m{color:#e2e8f0}
.ipcv-log .l.err .m{color:#f87171}
.ipcv-log .l .rc{color:#7ee787}
.ipcv-log .l.err .rc{color:#f87171}

/* guide layer */
#guide{position:absolute;right:0;top:0;bottom:0;width:372px;background:#0d1420f2;border-left:1px solid #26324a;
  z-index:11000;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;backdrop-filter:blur(3px)}
#guide.on{transform:none}
#guide header{flex:0 0 auto;padding:11px 13px;border-bottom:1px solid #26324a;display:flex;align-items:center;gap:9px}
#guide header h2{font:700 13px var(--ui);color:#fff;flex:1 1 auto}
#guide header button{background:#1e293b;border:1px solid #33425e;color:#cbd5e1;border-radius:3px;cursor:pointer;padding:3px 8px;font-size:11px}
#guide .gtabs{flex:0 0 auto;display:flex;gap:4px;padding:7px 9px 0;flex-wrap:wrap}
#guide .gtabs button{background:#151d2c;border:1px solid #26324a;border-bottom:0;color:#93a5bd;padding:4px 9px;
  font-size:11px;cursor:pointer;border-radius:4px 4px 0 0}
#guide .gtabs button.on{background:#0d1420;color:var(--exhibit-accent);border-color:#33425e;font-weight:700}
#guide .gbody{flex:1 1 auto;overflow:auto;border-top:1px solid #26324a}
#guidetab{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:10999;background:#0d1420ee;color:var(--exhibit-accent);

const REL = "0.14.1", CODENAME = "Aladar";
const COPY = "Copyright (c) 2001-2024 HelenOS project";
const RELDATE = "19 May 2024";

/* ==========================================================================
   MODULE 2 — THE TASK AND IPC KERNEL  (SPARTAN)
   --------------------------------------------------------------------------
   Everything below this line in the file is a client of what is in it.

   The kernel knows about tasks, threads, address spaces, scheduling and
   message passing.  It knows nothing about files, devices, networks, fonts,
   windows or the colour of a button.  That is the whole idea.

   HelenOS IPC uses a telephone metaphor and this module keeps it:
     * a task owns an ANSWERBOX, which is where incoming calls arrive;
     * a task places calls through a PHONE, connected to somebody else's
       answerbox;
     * phone 0 of every task is PHONE_NS, wired to the naming service;
     * when the callee dies, every phone connected to it is HUNG UP, and the
       caller's next call answers EHANGUP.  Nobody panics.

   Within a task there are THREADS, which the kernel schedules preemptively,
   and within a thread there are FIBRILS, which the userspace async framework
   schedules cooperatively.  They are fibrils.  Not fibers, not coroutines.
   ========================================================================== */
const Spartan = (() => {
  const tasks = new Map();
  let nextTid = 1, nextThreadId = 1, nextCallId = 1, nextPhid = 1;
  const listeners = new Set();
  let callDepth = 0, chainId = 0;
  let uptimeMs = 0;

  /* ---- the message bus.  The IPC visualiser is one more subscriber; the
     servers know nothing about it and must never know anything. ---------- */
  function emit(ev) { for (const fn of listeners) { try { fn(ev); } catch (e) { /* a bad tap must not break IPC */ } } }
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  function mkTask(spec) {
    const t = {
      tid: ++nextTid,
      name: spec.name,
      path: spec.path || null,
      kind: spec.kind || "app",          /* kernel | srv | drv | app */
      iface: spec.iface || null,         /* the interface its answerbox serves */
      answer: spec.answer || null,       /* (call) => {rc, ...}  — the answerbox */
      onDeath: spec.onDeath || null,
      phones: [],
      threads: [],
      fibrils: [],
      alive: true,
      resmem: spec.resmem || 0,
      virtmem: spec.virtmem || 0,
      ucycles: 0, kcycles: 0, calls: 0,
      startedAt: uptimeMs,
      args: spec.args || [],
      state: {},
      exitReason: null
    };
    tasks.set(t.tid, t);
    const nthr = spec.threads || 1;
    for (let i = 0; i < nthr; i++) addThread(t, i === 0 ? (spec.mainThread || t.name) : (spec.name + "-" + i));
    for (const f of (spec.fibrils || ["main"])) addFibril(t, f);
    emit({ kind: "task-start", tid: t.tid, name: t.name, t: uptimeMs });
    return t;
  }

  function addThread(t, name) {
    const th = { id: ++nextThreadId, name, state: "Sleeping", prio: 12 + irnd(0, 3), cpu: irnd(0, 1), ucycles: 0, kcycles: 0 };
    t.threads.push(th); return th;
  }
  function addFibril(t, name) {
    const f = { id: t.fibrils.length + 1, name, state: "ready" };
    t.fibrils.push(f); return f;
  }

  /* ---- phones ------------------------------------------------------- */
  function connect(fromTid, toTid, iface, label) {
    const from = tasks.get(fromTid), to = tasks.get(toTid);
    if (!from || !from.alive) return { rc: E.EINVAL, phone: null };
    if (!to || !to.alive) return { rc: E.ENOENT, phone: null };
    const ph = { phid: nextPhid++, owner: fromTid, callee: toTid, iface: iface || to.iface, label: label || to.name, hungup: false };
    from.phones.push(ph);
    emit({ kind: "connect", from: fromTid, to: toTid, iface: ph.iface, t: uptimeMs });
    return { rc: E.EOK, phone: ph };
  }
  function hangup(ph) {
    if (!ph || ph.hungup) return;
    ph.hungup = true;
    const from = tasks.get(ph.owner);
    if (from) from.phones = from.phones.filter(p => p !== ph);
    emit({ kind: "hangup", from: ph.owner, to: ph.callee, t: uptimeMs });
  }

  /* ---- the call itself ----------------------------------------------
     Every single interaction in this simulation goes through here.  If it
     does not go through here, it is not part of the system.               */
  function call(ph, method, args) {
    args = args || {};
    if (!ph) return { rc: E.EINVAL };
    const caller = tasks.get(ph.owner);
    const callee = tasks.get(ph.callee);
    const cid = nextCallId++;
    if (callDepth === 0) chainId++;
    const chain = chainId;

    if (!caller || !caller.alive) return { rc: E.EINVAL };
    if (ph.hungup || !callee || !callee.alive) {
      /* The classic multiserver failure: the phone is dead, the caller is not. */
      emit({
        kind: "call", id: cid, chain, depth: callDepth, t: uptimeMs,
        from: ph.owner, fromName: caller.name, to: ph.callee,
        toName: callee ? callee.name : "(gone)", iface: ph.iface, method,
        rc: E.EHANGUP, failed: true
      });
      ph.hungup = true;
      return { rc: E.EHANGUP };
    }
    if (callDepth > 24) return { rc: E.ELIMIT };

    callDepth++;
    let res;
    try {
      caller.calls++; callee.calls++;
      caller.ucycles += irnd(300, 1200);
      callee.kcycles += irnd(120, 400);
      callee.ucycles += irnd(600, 2600);
      const c = { method, args, callerTid: ph.owner, calleeTid: ph.callee, iface: ph.iface, chain, depth: callDepth };
      res = callee.answer ? callee.answer(c) : { rc: E.ENOTSUP };
      if (!res || typeof res !== "object") res = { rc: E.EOK };
    } catch (err) {
      /* A server that faults answers EPARTY and, in the real system, taskmon
         would collect a core dump.  It does not take the kernel with it. */
      res = { rc: E.EPARTY, _fault: String((err && err.message) || err) };
      setTimeout(() => Sim.serverFault(callee, res._fault), 0);
    } finally {
      callDepth--;
    }
    emit({
      kind: "call", id: cid, chain, depth: callDepth, t: uptimeMs,
      from: ph.owner, fromName: caller.name, to: ph.callee, toName: callee.name,
      iface: ph.iface, method, rc: res.rc, failed: res.rc !== E.EOK
    });
    return res;
  }

  /* ---- task lifetime -------------------------------------------------- */
  function kill(tid, reason) {
    const t = tasks.get(tid);
    if (!t || !t.alive) return E.ENOENT;
    if (t.kind === "kernel") return E.EPERM;   /* not a userspace task */
    t.alive = false;
    t.exitReason = reason || "killed";
    /* every phone this task owned is gone ... */
    for (const ph of t.phones.slice()) hangup(ph);
    t.phones = [];
    /* ... and every phone pointing at it is hung up, which is how its
       clients find out.  Nobody is notified in advance.  Nobody has to be. */
    for (const other of tasks.values()) {
      if (!other.alive) continue;
      for (const ph of other.phones.slice()) if (ph.callee === tid) hangup(ph);
    }
    if (t.onDeath) { try { t.onDeath(reason); } catch (e) { } }
    emit({ kind: "task-exit", tid, name: t.name, reason: t.exitReason, t: uptimeMs });
    tasks.delete(tid);
    return E.EOK;
  }

  function get(tid) { return tasks.get(tid); }
  function byName(name) { return Array.from(tasks.values()).filter(t => t.alive && t.name === name); }
  function first(name) { return byName(name)[0] || null; }
  function alive(name) { return !!first(name); }
  function list() { return Array.from(tasks.values()).filter(t => t.alive).sort((a, b) => a.tid - b.tid); }
  function tick(ms) {
    uptimeMs += ms;
    for (const t of tasks.values()) {
      if (!t.alive) continue;
      t.ucycles += irnd(0, t.kind === "app" ? 90000 : 12000);
      t.kcycles += irnd(0, 6000);
      for (const th of t.threads) { th.ucycles += irnd(0, 40000); th.kcycles += irnd(0, 3000); }
    }
  }
  function uptime() { return uptimeMs; }
  function reset() { tasks.clear(); nextTid = 1; nextThreadId = 1; nextCallId = 1; nextPhid = 1; uptimeMs = 0; }

  return { mkTask, addThread, addFibril, connect, hangup, call, kill, get, byName, first, alive, list, tick, uptime, subscribe, emit, reset };
})();

/* The kernel task.  It exists so that it can be listed, and so that anybody
   looking at the task list can see how small it is next to everything above
   it.  It has no answerbox: you do not call the kernel, you syscall it. */
let KERNEL_TASK = null;

/* ==========================================================================
   MODULE 3 — SERVER REGISTRY
   --------------------------------------------------------------------------
   Every service in this simulation registers here as an independent module
   with a declared interface, the way the real system's servers are separate
   programs.  Nothing below reaches into anything else's state: the only way
   in is a call through a phone.

   The design rule from the brief — "if a server module can be removed from
   the running simulation and only its own clients break" — is what this
   registry exists to make true.  Sim.selfTest() actually runs that check.
   ========================================================================== */
const Servers = (() => {
  const defs = new Map();
  function define(def) { defs.set(def.name, def); return def; }
  function get(name) { return defs.get(name); }
  function all() { return Array.from(defs.values()); }

  function spawn(name, args) {
    const def = defs.get(name);
    if (!def) return { rc: E.ENOENT, task: null };
    if (def.singleton !== false && Spartan.alive(name)) return { rc: E.EEXIST, task: Spartan.first(name) };
    const t = Spartan.mkTask({
      name: def.name, path: def.path, kind: def.kind || "srv", iface: def.iface,
      threads: def.threads || 1, fibrils: def.fibrils || ["main"],
      resmem: def.resmem || 64 * 1024, virtmem: def.virtmem || 512 * 1024,
      args: args || [],
      answer: c => (def.answer ? def.answer(t, c) : { rc: E.ENOTSUP }),
      onDeath: r => { if (def.onDeath) def.onDeath(t, r); }
    });
    /* Phone 0 of every task is PHONE_NS.  ns itself is the exception. */
    if (name !== "ns") {
      const ns = Spartan.first("ns");
      if (ns) Spartan.connect(t.tid, ns.tid, "INTERFACE_ANY", "ns");
    }
    if (def.start) {
      const rc = def.start(t, args || []);
      if (rc && rc !== E.EOK) { Spartan.kill(t.tid, "failed to start"); return { rc, task: null }; }
    }
    return { rc: E.EOK, task: t };
  }
  return { define, get, all, spawn };
})();

/* ---- convenience wrappers used by every client below -------------------- */
const Sys = {
  nsPhone(t) { return t.phones[0] || null; },

  /** service_register(): a server tells ns which interface it answers on. */
  serviceRegister(t, iface) {
    const ph = Sys.nsPhone(t);
    if (!ph) return E.EREFUSED;
    return Spartan.call(ph, "IPC_M_CONNECT_TO_ME", { iface, tid: t.tid }).rc;
  },

  /** service_connect_blocking(): ask ns for a phone to whoever serves iface. */
  connect(fromTid, iface, label) {
    const from = Spartan.get(fromTid);
    if (!from) return { rc: E.EINVAL, phone: null };
    const ph = Sys.nsPhone(from);
    if (!ph) return { rc: E.EREFUSED, phone: null };
    const r = Spartan.call(ph, "IPC_M_CONNECT_ME_TO", { iface });
    if (r.rc !== E.EOK) return { rc: r.rc, phone: null };
    return Spartan.connect(fromTid, r.tid, iface, label || r.name);
  },

  /** Cached phone: servers keep long-lived phones and re-dial when hung up. */
  phoneTo(t, iface, label) {
    if (!t || !t.alive) return null;
    t.state._ph = t.state._ph || {};
    const cur = t.state._ph[iface];
    if (cur && !cur.hungup) {
      const callee = Spartan.get(cur.callee);
      if (callee && callee.alive) return cur;
    }
    const r = Sys.connect(t.tid, iface, label);
    t.state._ph[iface] = r.phone;
    return r.phone;
  }
};

/* ==========================================================================
   MODULE 4 — ns, THE NAMING SERVICE
   ========================================================================== */
Servers.define({
  name: "ns", path: "/srv/ns", kind: "srv", iface: "INTERFACE_ANY",
  threads: 1, fibrils: ["ns-conn"], resmem: 48 * 1024, virtmem: 320 * 1024,
  blurb: "The naming service. Phone 0 of every task in the system is connected here; it is how a task finds anybody else at all.",
  start(t) { t.state.iface = new Map(); return E.EOK; },
  answer(t, c) {
    switch (c.method) {
      case "IPC_M_CONNECT_TO_ME": {           /* a server registering itself */
        if (t.state.iface.has(c.args.iface)) return { rc: E.EEXIST };
        t.state.iface.set(c.args.iface, c.args.tid);
        return { rc: E.EOK };
      }
      case "IPC_M_CONNECT_ME_TO": {           /* a client looking somebody up */
        const tid = t.state.iface.get(c.args.iface);
        const target = tid && Spartan.get(tid);
        if (!target || !target.alive) { t.state.iface.delete(c.args.iface); return { rc: E.ENOENT }; }
        return { rc: E.EOK, tid, name: target.name };
      }
      case "NS_PING": return { rc: E.EOK };
      default: return { rc: E.ENOTSUP };
    }
  }
});

/* ==========================================================================
   MODULE 5 — loc, THE LOCATION SERVICE
   --------------------------------------------------------------------------
   loc is not devfs.  It is a registry of *services* — a name, the server
   that provides it, and the categories it belongs to.  Block devices land in
   it, but so do terminals, keyboards, network links, the clock and the
   display server.  locfs later projects the whole thing into the filesystem
   as /loc, which is why a walk of /loc reads like an inventory of the
   machine.
   ========================================================================== */
Servers.define({
  name: "loc", path: "/srv/loc", kind: "srv", iface: "INTERFACE_LOC_SUPPLIER",
  threads: 2, fibrils: ["loc-supplier", "loc-consumer"], resmem: 88 * 1024, virtmem: 640 * 1024,
  blurb: "The location service. Servers register the services they provide here; clients look them up by name or by category.",
  start(t) {
    t.state.servers = new Map();          /* server name -> tid */
    t.state.svcs = new Map();             /* svc id -> record */
    t.state.cats = new Map();             /* category name -> Set(svc id) */
    t.state.nextId = 1;
    Sys.serviceRegister(t, "INTERFACE_LOC_SUPPLIER");
    Sys.serviceRegister(t, "INTERFACE_LOC_CONSUMER");
    return E.EOK;
  },
  answer(t, c) {
    const S = t.state;
    const live = r => { const o = Spartan.get(r.tid); return !!(o && o.alive); };
    switch (c.method) {
      case "LOC_SERVER_REGISTER":
        S.servers.set(c.args.name, c.args.tid); return { rc: E.EOK };
      case "LOC_SERVICE_REGISTER": {
        for (const r of S.svcs.values()) if (r.name === c.args.name && live(r)) return { rc: E.EEXIST };
        const id = S.nextId++;
        S.svcs.set(id, { id, name: c.args.name, server: c.args.server, tid: c.args.tid, iface: c.args.iface || null, cats: [] });
        return { rc: E.EOK, id };
      }
      case "LOC_SERVICE_UNREGISTER": S.svcs.delete(c.args.id); return { rc: E.EOK };
      case "LOC_SERVICE_ADD_TO_CAT": {
        const r = S.svcs.get(c.args.id); if (!r) return { rc: E.ENOENT };
        if (r.cats.indexOf(c.args.cat) < 0) r.cats.push(c.args.cat);
        if (!S.cats.has(c.args.cat)) S.cats.set(c.args.cat, new Set());
        S.cats.get(c.args.cat).add(c.args.id);
        return { rc: E.EOK };
      }
      case "LOC_SERVICE_GET_ID": {
        for (const r of S.svcs.values()) if (r.name === c.args.name && live(r)) return { rc: E.EOK, id: r.id, tid: r.tid, iface: r.iface };
        return { rc: E.ENOENT };
      }
      case "LOC_SERVICE_GET_NAME": {
        const r = S.svcs.get(c.args.id); return r ? { rc: E.EOK, name: r.name } : { rc: E.ENOENT };
      }
      case "LOC_SERVICE_GET_SERVER_NAME": {
        const r = S.svcs.get(c.args.id); return r ? { rc: E.EOK, name: r.server } : { rc: E.ENOENT };
      }
      case "LOC_GET_CATEGORIES": {
        const out = [];
        for (const [cat, set] of S.cats) {
          for (const id of set) { const r = S.svcs.get(id); if (r && live(r)) { out.push(cat); break; } }
        }
        return { rc: E.EOK, cats: out.sort() };
      }
      case "LOC_CATEGORY_GET_SVCS": {
        const set = S.cats.get(c.args.cat);
        if (!set) return { rc: E.ENOENT };
        const out = [];
        for (const id of set) { const r = S.svcs.get(id); if (r && live(r)) out.push({ id: r.id, name: r.name, server: r.server }); }
        out.sort((a, b) => a.name.localeCompare(b.name));
        return { rc: E.EOK, svcs: out };
      }
      case "LOC_GET_SERVICES": {
        const out = [];
        for (const r of S.svcs.values()) if (live(r)) out.push({ id: r.id, name: r.name, server: r.server, cats: r.cats.slice() });
        out.sort((a, b) => a.name.localeCompare(b.name));
        return { rc: E.EOK, svcs: out };
      }
      case "LOC_GET_NAMESPACES": {
        const ns = new Set();
        for (const r of S.svcs.values()) if (live(r) && r.name.indexOf("/") >= 0) ns.add(r.name.split("/")[0]);
        return { rc: E.EOK, namespaces: Array.from(ns).sort() };
      }
      default: return { rc: E.ENOTSUP };
    }
  }
});

/* Helpers every server uses to publish itself in loc. */
function locRegisterServer(t) {
  const ph = Sys.phoneTo(t, "INTERFACE_LOC_SUPPLIER", "loc");
  if (!ph) return E.EREFUSED;
  return Spartan.call(ph, "LOC_SERVER_REGISTER", { name: t.name, tid: t.tid }).rc;
}
function locRegisterService(t, name, cats, iface) {
  const ph = Sys.phoneTo(t, "INTERFACE_LOC_SUPPLIER", "loc");
  if (!ph) return E.EREFUSED;
  const r = Spartan.call(ph, "LOC_SERVICE_REGISTER", { name, server: t.name, tid: t.tid, iface: iface || null });
  if (r.rc !== E.EOK) return r.rc;
  for (const cat of (cats || [])) Spartan.call(ph, "LOC_SERVICE_ADD_TO_CAT", { id: r.id, cat });
  return E.EOK;
}
/** loc_service_connect(): look the service up, then dial its provider. */
function locConnect(fromTid, svcName, iface) {
  const from = Spartan.get(fromTid); if (!from) return { rc: E.EINVAL, phone: null };
  const lp = Sys.phoneTo(from, "INTERFACE_LOC_CONSUMER", "loc");
  if (!lp) return { rc: E.EREFUSED, phone: null };
  const r = Spartan.call(lp, "LOC_SERVICE_GET_ID", { name: svcName });
  if (r.rc !== E.EOK) return { rc: r.rc, phone: null };
  return Spartan.connect(fromTid, r.tid, iface || r.iface || "INTERFACE_ANY", svcName);
}

/* ==========================================================================
   MODULE 6 — MEDIA AND FILESYSTEM TREES
   --------------------------------------------------------------------------
   Media holds bytes.  It is deliberately NOT owned by any task: a ramdisk is
   physical memory handed over by the boot loader, and a disk is a disk.  Kill
   the server that manages it and the bytes are still there; that is why the
   files come back when you start the server again.

   tmpfs is the pointed exception: its tree lives inside the tmpfs task's own
   address space, so killing tmpfs really does lose /tmp.  The simulation
   keeps that difference because it is the honest one.
   ========================================================================== */
const FsTree = {
  dir(name) { return { k: "d", n: name, c: {}, mt: Date.now() }; },
  file(name, data) { return { k: "f", n: name, d: data == null ? "" : String(data), mt: Date.now() }; },
  size(n) { return n.k === "d" ? 0 : n.d.length; },
  split(p) { return String(p).split("/").filter(Boolean); },
  lookup(root, path) {
    let cur = root;
    for (const part of FsTree.split(path)) {
      if (!cur || cur.k !== "d") return null;
      if (part === "." || part === "..") continue;
      cur = cur.c[part];
      if (!cur) return null;
    }
    return cur || null;
  },
  parent(root, path) {
    const parts = FsTree.split(path);
    parts.pop();
    return FsTree.lookup(root, "/" + parts.join("/"));
  },
  base(path) { const p = FsTree.split(path); return p[p.length - 1] || ""; },
  mkdirp(root, path) {
    let cur = root;
    for (const part of FsTree.split(path)) {
      if (!cur.c[part]) cur.c[part] = FsTree.dir(part);
      cur = cur.c[part];
      if (cur.k !== "d") return null;
    }
    return cur;
  },
  put(root, path, data) {
    const parent = FsTree.mkdirp(root, "/" + FsTree.split(path).slice(0, -1).join("/"));
    if (!parent) return null;
    const nm = FsTree.base(path);
    const ex = parent.c[nm];
    if (ex && ex.k === "d") return null;
    parent.c[nm] = FsTree.file(nm, data);
    return parent.c[nm];
  },
  rm(root, path) {
    const parent = FsTree.parent(root, path);
    if (!parent) return E.ENOENT;
    const nm = FsTree.base(path);
    const n = parent.c[nm];
    if (!n) return E.ENOENT;
    if (n.k === "d" && Object.keys(n.c).length) return E.ENOTEMPTY;
    delete parent.c[nm];
    return E.EOK;
  },
  ls(n) {
    if (!n || n.k !== "d") return null;
    return Object.values(n.c).sort((a, b) => (a.k === b.k ? a.n.localeCompare(b.n) : a.k === "d" ? -1 : 1));
  },
  clone(n) {
    if (n.k === "f") return { k: "f", n: n.n, d: n.d, mt: n.mt };
    const d = FsTree.dir(n.n); for (const k in n.c) d.c[k] = FsTree.clone(n.c[k]); return d;
  }
};

function buildIso(arch) {
  /* What the installation CD looks like from the outside: read-only,
     ISO-9660, and served by a completely different filesystem server from
     the one serving the root. */
  const root = FsTree.dir("/");
  FsTree.put(root, "/boot/image.boot", "HelenOS/" + arch.karch + " boot image");
  FsTree.put(root, "/boot/grub/grub.cfg",
    "set timeout=0\nmenuentry \"HelenOS " + REL + "\" {\n    multiboot /boot/kernel.bin\n}\n");
  FsTree.put(root, "/README",
    "HelenOS " + REL + " (" + CODENAME + ") for " + arch.karch + "\n" +
    "\nThis volume is mounted read-only at /vol/cd by cdfs.\n" +
    "Kill cdfs and /vol/cd goes away while / carries on: they are two\nseparate programs serving two separate mount points.\n");
  FsTree.put(root, "/HelenOS.map", "0xffffffff80100000 T kernel_image_start\n0xffffffff80100040 T kinit\n");
  return root;
}

/* ==========================================================================
   MODULE 7 — BLOCK DEVICES
   --------------------------------------------------------------------------
   A block device server owns bytes and answers BD_READ_BLOCKS.  It has no
   idea what a file is.  The filesystem server above it has no idea what a
   disk controller is.  Neither of them is in the kernel.
   ========================================================================== */
function defineBd(spec) {
  Servers.define({
    name: spec.name, path: spec.path, kind: spec.kind || "srv", iface: "INTERFACE_BLOCK",
    threads: 1, fibrils: ["bd-conn"], resmem: spec.resmem || 96 * 1024, virtmem: 700 * 1024,
    blurb: spec.blurb,
    start(t, args) {
      t.state.svc = spec.svc;
      t.state.image = spec.image;
      t.state.bsize = spec.bsize || 512;
      t.state.nblocks = spec.nblocks || 8192;
      t.state.reads = 0; t.state.writes = 0;
      locRegisterServer(t);
      locRegisterService(t, spec.svc, spec.cats || [], "INTERFACE_BLOCK");
      return E.EOK;
    },
    answer(t, c) {
      switch (c.method) {
        case "BD_GET_BLOCK_SIZE": return { rc: E.EOK, bsize: t.state.bsize };
        case "BD_GET_NUM_BLOCKS": return { rc: E.EOK, nblocks: t.state.nblocks };
        case "BD_READ_BLOCKS": {
          const img = Media.images[t.state.image];
          if (!img) return { rc: E.ENXIO };
          t.state.reads++;
          return { rc: E.EOK, image: t.state.image };
        }
        case "BD_WRITE_BLOCKS": {
          const img = Media.images[t.state.image];
          if (!img) return { rc: E.ENXIO };
          if (spec.readonly) return { rc: E.ENOTSUP };
          t.state.writes++;
          return { rc: E.EOK };
        }
        case "BD_SYNC_CACHE": return { rc: E.EOK };
        case "BD_READ_TOC": return { rc: spec.cd ? E.EOK : E.ENOTSUP };
        case "BD_EJECT": return { rc: E.ENOTSUP };
        default: return { rc: E.ENOTSUP };
      }
    }
  });
}

/* ==========================================================================
   MODULE 8 — vfs, THE VIRTUAL FILESYSTEM SERVER
   --------------------------------------------------------------------------
   vfs owns the mount table and nothing else.  It cannot read a byte by
   itself; every lookup, read and write is a call to whichever filesystem
   server claimed that mount point.  Kill that server and vfs answers the
   client honestly instead of pretending.
   ========================================================================== */
Servers.define({
  name: "vfs", path: "/srv/vfs", kind: "srv", iface: "INTERFACE_VFS",
  threads: 2, fibrils: ["vfs-conn", "vfs-lookup"], resmem: 176 * 1024, virtmem: 1200 * 1024,
  blurb: "The virtual filesystem server. Holds the mount table and forwards every operation to the filesystem server that owns that mount point.",
  start(t) {
    t.state.fs = new Map();      /* fstype -> tid of the filesystem server */
    t.state.mounts = [];         /* { mp, fstype, svc, tid } */
    t.state.ops = 0;
    Sys.serviceRegister(t, "INTERFACE_VFS");
    return E.EOK;
  },
  answer(t, c) {
    const S = t.state;
    const norm = p => {
      p = String(p == null ? "/" : p);
      if (!p.startsWith("/")) p = "/" + p;
      const parts = [];
      for (const seg of p.split("/")) {
        if (!seg || seg === ".") continue;
        if (seg === "..") { parts.pop(); continue; }
        parts.push(seg);
      }
      return "/" + parts.join("/");
    };
    /* Longest-prefix match on the mount table, then a phone to that server. */
    const resolve = path => {
      path = norm(path);
      let best = null;
      for (const m of S.mounts) {
        if (path === m.mp || path.startsWith(m.mp === "/" ? "/" : m.mp + "/")) {
          if (!best || m.mp.length > best.mp.length) best = m;
        }
      }
      if (!best) return { rc: E.ENOENT };
      const fs = Spartan.get(best.tid);
      if (!fs || !fs.alive) {
        /* The filesystem server for this mount point is gone. */
        return { rc: E.EHANGUP, mount: best };
      }
      let ph = best.phone;
      if (!ph || ph.hungup) {
        const r = Spartan.connect(t.tid, best.tid, "INTERFACE_FS", best.fstype);
        if (r.rc !== E.EOK) return { rc: r.rc, mount: best };
        best.phone = ph = r.phone;
      }
      const rel = path.slice(best.mp === "/" ? 0 : best.mp.length) || "/";
      return { rc: E.EOK, mount: best, phone: ph, rel };
    };

    switch (c.method) {
      case "VFS_IN_REGISTER":
        S.fs.set(c.args.fstype, c.args.tid);
        return { rc: E.EOK };
      case "VFS_IN_FSTYPES":
        return { rc: E.EOK, types: Array.from(S.fs.keys()).filter(k => { const x = Spartan.get(S.fs.get(k)); return x && x.alive; }).sort() };
      case "VFS_IN_MOUNT": {
        const mp = norm(c.args.mp);
        const tid = S.fs.get(c.args.fstype);
        const fs = tid && Spartan.get(tid);
        if (!fs || !fs.alive) return { rc: E.ENOFS };
        if (S.mounts.some(m => m.mp === mp)) return { rc: E.EBUSY };
        const conn = Spartan.connect(t.tid, tid, "INTERFACE_FS", c.args.fstype);
        if (conn.rc !== E.EOK) return { rc: conn.rc };
        const r = Spartan.call(conn.phone, "VFS_OUT_MOUNTED", { svc: c.args.svc || "", mp });
        if (r.rc !== E.EOK) { Spartan.hangup(conn.phone); return { rc: r.rc }; }
        S.mounts.push({ mp, fstype: c.args.fstype, svc: c.args.svc || "", tid, phone: conn.phone });
        S.mounts.sort((a, b) => b.mp.length - a.mp.length);
        return { rc: E.EOK };
      }
      case "VFS_IN_UNMOUNT": {
        const mp = norm(c.args.mp);
        const i = S.mounts.findIndex(m => m.mp === mp);
        if (i < 0) return { rc: E.ENOENT };
        const m = S.mounts[i];
        if (m.phone && !m.phone.hungup) Spartan.call(m.phone, "VFS_OUT_UNMOUNTED", {});
        if (m.phone) Spartan.hangup(m.phone);
        S.mounts.splice(i, 1);
        return { rc: E.EOK };
      }
      case "VFS_IN_MOUNTS":
        return { rc: E.EOK, mounts: S.mounts.map(m => ({ mp: m.mp, fstype: m.fstype, svc: m.svc, tid: m.tid, live: !!(Spartan.get(m.tid) || {}).alive })) };
      case "VFS_IN_WALK": {
        S.ops++;
        const r = resolve(c.args.path);
        if (r.rc !== E.EOK) return { rc: r.rc };
        return Spartan.call(r.phone, "VFS_OUT_LOOKUP", { path: r.rel });
      }
      case "VFS_IN_READ": {
        S.ops++;
        const r = resolve(c.args.path);
        if (r.rc !== E.EOK) return { rc: r.rc };
        return Spartan.call(r.phone, "VFS_OUT_READ", { path: r.rel });
      }
      case "VFS_IN_WRITE": {
        S.ops++;
        const r = resolve(c.args.path);
        if (r.rc !== E.EOK) return { rc: r.rc };
        return Spartan.call(r.phone, "VFS_OUT_WRITE", { path: r.rel, data: c.args.data });
      }
      case "VFS_IN_LINK": {
        S.ops++;
        const r = resolve(c.args.path);
        if (r.rc !== E.EOK) return { rc: r.rc };
        return Spartan.call(r.phone, "VFS_OUT_LINK", { path: r.rel, kind: c.args.kind });
      }
      case "VFS_IN_UNLINK": {
        S.ops++;
        const r = resolve(c.args.path);
        if (r.rc !== E.EOK) return { rc: r.rc };
        return Spartan.call(r.phone, "VFS_OUT_DESTROY", { path: r.rel });
      }
      case "VFS_IN_RENAME": {
        S.ops++;
        const a = resolve(c.args.old), b = resolve(c.args.nw);
        if (a.rc !== E.EOK) return { rc: a.rc };
        if (b.rc !== E.EOK) return { rc: b.rc };
        if (a.mount !== b.mount) return { rc: E.EXDEV };
        return Spartan.call(a.phone, "VFS_OUT_LINK", { path: b.rel, kind: "rename", from: a.rel });
      }
      case "VFS_IN_STATFS": {
        const r = resolve(c.args.path);
        if (r.rc !== E.EOK) return { rc: r.rc };
        const s = Spartan.call(r.phone, "VFS_OUT_STATFS", { path: r.rel });
        if (s.rc !== E.EOK) return s;
        return { rc: E.EOK, fstype: r.mount.fstype, mp: r.mount.mp, svc: r.mount.svc, blocks: s.blocks, bfree: s.bfree, bsize: s.bsize };
      }
      default: return { rc: E.ENOTSUP };
    }
  }
});

/* ---- client-side wrapper: what libc's vfs_*() calls look like ---------- */
const VfsClient = {
  ph(t) { return Sys.phoneTo(t, "INTERFACE_VFS", "vfs"); },
  call(t, method, args) {
    const p = VfsClient.ph(t);
    if (!p) return { rc: E.EREFUSED };
    return Spartan.call(p, method, args || {});
  },
  stat(t, path) { return VfsClient.call(t, "VFS_IN_WALK", { path }); },
  read(t, path) { return VfsClient.call(t, "VFS_IN_READ", { path }); },
  write(t, path, data) { return VfsClient.call(t, "VFS_IN_WRITE", { path, data }); },
  create(t, path, kind) { return VfsClient.call(t, "VFS_IN_LINK", { path, kind: kind || "f" }); },
  unlink(t, path) { return VfsClient.call(t, "VFS_IN_UNLINK", { path }); },
  rename(t, o, n) { return VfsClient.call(t, "VFS_IN_RENAME", { old: o, nw: n }); },
  mounts(t) { return VfsClient.call(t, "VFS_IN_MOUNTS", {}); },
  statfs(t, path) { return VfsClient.call(t, "VFS_IN_STATFS", { path }); }
};

/* ==========================================================================
   MODULE 9 — THE FILESYSTEM SERVERS
   --------------------------------------------------------------------------
   Each of these is a separate program.  fat does not link ext4fs.  cdfs has
   never heard of tmpfs.  They share exactly one thing: the VFS_OUT protocol.
   ========================================================================== */
function defineFs(spec) {
  Servers.define({
    name: spec.name, path: spec.path, kind: "srv", iface: "INTERFACE_FS",
    threads: spec.threads || 1, fibrils: ["fs-conn", "fs-lookup"],
    resmem: spec.resmem || 128 * 1024, virtmem: 900 * 1024,
    fstype: spec.name, blurb: spec.blurb,
    start(t) {
      t.state.image = null;
      t.state.ownTree = spec.inMemory ? FsTree.dir("/") : null;
      t.state.mounted = false;
      t.state.svc = null;
      t.state.bd = null;
      t.state.lookups = 0;
      const ph = Sys.phoneTo(t, "INTERFACE_VFS", "vfs");
      if (!ph) return E.EREFUSED;
      return Spartan.call(ph, "VFS_IN_REGISTER", { fstype: spec.name, tid: t.tid }).rc;
    },
    answer(t, c) {
      const S = t.state;
      /* Where this server's bytes live. */
      const tree = () => spec.inMemory ? S.ownTree : (S.image ? Media.images[S.image] : null);
      /* Real block traffic, so the visualiser shows the true depth of the stack. */
      const touchDisk = (write) => {
        if (spec.inMemory || spec.synthetic) return E.EOK;
        if (!S.bd || S.bd.hungup) {
          if (!S.svc) return E.ENXIO;
          const r = locConnect(t.tid, S.svc, "INTERFACE_BLOCK");
          if (r.rc !== E.EOK) return r.rc;
          S.bd = r.phone;
        }
        const r = Spartan.call(S.bd, write ? "BD_WRITE_BLOCKS" : "BD_READ_BLOCKS", { svc: S.svc, ba: irnd(0, 4096), cnt: 1 });
        return r.rc;
      };

      switch (c.method) {
        case "VFS_OUT_MOUNTED": {
          if (spec.inMemory) { S.mounted = true; return { rc: E.EOK, index: 0 }; }
          if (spec.synthetic) { S.mounted = true; return { rc: E.EOK, index: 0 }; }
          S.svc = c.args.svc;
          const r = locConnect(t.tid, c.args.svc, "INTERFACE_BLOCK");
          if (r.rc !== E.EOK) return { rc: r.rc };
          S.bd = r.phone;
          const sb = Spartan.call(S.bd, "BD_READ_BLOCKS", { svc: c.args.svc, ba: 0, cnt: 1 });   /* superblock */
          if (sb.rc !== E.EOK) return { rc: sb.rc };
          if (!Media.images[sb.image]) return { rc: E.ENOTSUP };
          if (spec.magic && Media.images[sb.image]._fs && Media.images[sb.image]._fs !== spec.name)
            return { rc: E.ENOTSUP };   /* wrong filesystem on that device */
          S.image = sb.image;
          S.mounted = true;
          return { rc: E.EOK, index: 0 };
        }
        case "VFS_OUT_UNMOUNTED":
          S.mounted = false; if (S.bd) Spartan.hangup(S.bd); S.bd = null; S.image = null;
          return { rc: E.EOK };
        case "VFS_OUT_LOOKUP": {
          if (!S.mounted) return { rc: E.ENOENT };
          const rc = touchDisk(false); if (rc !== E.EOK) return { rc };
          S.lookups++;
          if (spec.synthetic) return spec.lookup(t, c.args.path);
          const n = FsTree.lookup(tree(), c.args.path);
          if (!n) return { rc: E.ENOENT };
          return { rc: E.EOK, kind: n.k, size: FsTree.size(n), name: n.n, mt: n.mt };
        }
        case "VFS_OUT_READ": {
          if (!S.mounted) return { rc: E.ENOENT };
          const rc = touchDisk(false); if (rc !== E.EOK) return { rc };
          if (spec.synthetic) return spec.read(t, c.args.path);
          const n = FsTree.lookup(tree(), c.args.path);
          if (!n) return { rc: E.ENOENT };
          if (n.k === "d") return { rc: E.EOK, kind: "d", entries: FsTree.ls(n).map(x => ({ name: x.n, kind: x.k, size: FsTree.size(x) })) };
          return { rc: E.EOK, kind: "f", data: n.d };
        }
        case "VFS_OUT_WRITE": {
          if (!S.mounted) return { rc: E.ENOENT };
          if (spec.readonly) return { rc: E.ENOTSUP };
          if (spec.synthetic) return { rc: E.ENOTSUP };
          const rc = touchDisk(true); if (rc !== E.EOK) return { rc };
          const n = FsTree.put(tree(), c.args.path, c.args.data);
          if (!n) return { rc: E.EISDIR };
          n._user = true;                     /* the visitor wrote this; keep it */
          State.dirty();
          return { rc: E.EOK };
        }
        case "VFS_OUT_LINK": {
          if (!S.mounted) return { rc: E.ENOENT };
          if (spec.readonly || spec.synthetic) return { rc: E.ENOTSUP };
          const rc = touchDisk(true); if (rc !== E.EOK) return { rc };
          const T = tree();
          if (c.args.kind === "rename") {
            const src = FsTree.lookup(T, c.args.from);
            if (!src) return { rc: E.ENOENT };
            const par = FsTree.mkdirp(T, "/" + FsTree.split(c.args.path).slice(0, -1).join("/"));
            if (!par) return { rc: E.ENOENT };
            const nm = FsTree.base(c.args.path);
            if (par.c[nm]) return { rc: E.EEXIST };
            FsTree.rm(T, c.args.from);
            src.n = nm; src._user = true; par.c[nm] = src;
            State.dirty();
            return { rc: E.EOK };
          }
          if (FsTree.lookup(T, c.args.path)) return { rc: E.EEXIST };
          if (c.args.kind === "d") { const dn = FsTree.mkdirp(T, c.args.path); if (dn) dn._user = true; }
          else { const fn = FsTree.put(T, c.args.path, ""); if (!fn) return { rc: E.EIO }; fn._user = true; }
          State.dirty();
          return { rc: E.EOK };
        }
        case "VFS_OUT_DESTROY": {
          if (!S.mounted) return { rc: E.ENOENT };
          if (spec.readonly || spec.synthetic) return { rc: E.ENOTSUP };
          const rc = touchDisk(true); if (rc !== E.EOK) return { rc };
          const r = FsTree.rm(tree(), c.args.path);
          if (r === E.EOK) State.dirty();
          return { rc: r };
        }
        case "VFS_OUT_STATFS": {
          if (!S.mounted) return { rc: E.ENOENT };
          const total = spec.blocks === undefined ? 32768 : spec.blocks;
          let used = 0;
          const walk = n => { if (!n) return; if (n.k === "f") { used += Math.ceil((n.d.length + 1) / 1024); return; } for (const k in n.c) walk(n.c[k]); };
          walk(tree());
          return { rc: E.EOK, blocks: total, bfree: Math.max(0, total - used), bsize: 1024 };
        }
        case "VFS_OUT_SYNC": return { rc: E.EOK };
        default: return { rc: E.ENOTSUP };
      }
    },
    onDeath(t) { if (spec.inMemory) t.state.ownTree = null; }
  });
}

defineFs({
  name: "ext4fs", path: "/srv/fs/ext4fs", magic: true, blocks: 65536, resmem: 208 * 1024,
  blurb: "The ext4 filesystem server. On the live image it serves the root filesystem, reading it out of the boot ramdisk through a block device server."
});
defineFs({ name: "fat", path: "/srv/fs/fat", magic: true, blocks: 32768, blurb: "FAT12/16/32 with long filenames. Started at boot, waiting for something to mount." });
defineFs({ name: "exfat", path: "/srv/fs/exfat", magic: true, blocks: 65536, blurb: "exFAT, with long filenames. Started at boot, waiting for something to mount." });
defineFs({ name: "mfs", path: "/srv/fs/mfs", magic: true, blocks: 16384, blurb: "The MINIX filesystem server." });

/* ---- locfs: the location service, projected into the namespace ---------- */
defineFs({
  name: "locfs", path: "/srv/fs/locfs", synthetic: true, readonly: true, blocks: 0,
  blurb: "Projects the location service registry into the filesystem as /loc. It stores nothing; every lookup is a call to loc.",
  lookup(t, path) {
    const v = locfsView(t);
    if (!v) return { rc: E.EHANGUP };
    const n = FsTree.lookup(v, path);
    if (!n) return { rc: E.ENOENT };
    return { rc: E.EOK, kind: n.k, size: FsTree.size(n), name: n.n, mt: n.mt };
  },
  read(t, path) {
    const v = locfsView(t);
    if (!v) return { rc: E.EHANGUP };
    const n = FsTree.lookup(v, path);
    if (!n) return { rc: E.ENOENT };
    if (n.k === "d") return { rc: E.EOK, kind: "d", entries: FsTree.ls(n).map(x => ({ name: x.n, kind: x.k, size: FsTree.size(x) })) };

  }
});
/* Build the /loc tree by asking loc.  Nothing is cached: if loc is gone,
   /loc is gone, and that is the correct answer. */
function locfsView(t) {
  const ph = Sys.phoneTo(t, "INTERFACE_LOC_CONSUMER", "loc");
  if (!ph) return null;
  const r = Spartan.call(ph, "LOC_GET_SERVICES", {});
  if (r.rc !== E.EOK) return null;
  const root = FsTree.dir("/");
  for (const s of r.svcs) {
    const parts = s.name.split("/");
    const leaf = parts.pop();
    const dir = parts.length ? FsTree.mkdirp(root, "/" + parts.join("/")) : root;
    dir.c[leaf] = FsTree.file(leaf, s.server + "\n");
  }
  const cats = Spartan.call(ph, "LOC_GET_CATEGORIES", {});
  if (cats.rc === E.EOK) {
    const cl = FsTree.mkdirp(root, "/class");
    for (const cat of cats.cats) {
      const cd = FsTree.mkdirp(cl, "/" + cat);
      const svcs = Spartan.call(ph, "LOC_CATEGORY_GET_SVCS", { cat });
      if (svcs.rc === E.EOK) for (const s of svcs.svcs) cd.c[s.name.replace(/\//g, ":")] = FsTree.file(s.name.replace(/\//g, ":"), s.server + "\n");
    }
  }
  return root;
}

/* Every driver is the same kind of object: a task with an answerbox. */
function defineDriver(name) {
  const info = DRV_INFO[name] || { desc: name + " driver" };
  Servers.define({
    name, path: "/drv/" + name + "/" + name, kind: "drv", iface: "INTERFACE_DDF_DRIVER",
    threads: 1, fibrils: ["ddf-driver"], resmem: 72 * 1024, virtmem: 560 * 1024,
    blurb: info.desc,
    start(t, args) {
      t.state.devpath = (args && args[0]) || ("hw/" + name);
      t.state.online = true;
      t.state.irqs = 0;
      const dm = Sys.phoneTo(t, "INTERFACE_DEVMAN_DRIVER", "devman");
      if (dm) Spartan.call(dm, "DEVMAN_DRIVER_REGISTER", { name, tid: t.tid });
      if (info.svc) {
        locRegisterServer(t);
        const svcName = "devices/\\" + t.state.devpath.replace(/\//g, "\\") + "\\" + info.svc[0];
        t.state.svcName = svcName;
        locRegisterService(t, svcName, info.svc[1], "INTERFACE_DDF_CLIENT");
        /* Block devices additionally publish a short bd/ name, the way the
           real system's block device services get referred to. */
        if (info.svc[1].indexOf("disk") >= 0) {
          /* One driver task, several functions — which is how a real disk
             controller with a hard disk and a CD-ROM on it looks. */
          t.state.bdName = "bd/" + info.svc[0];
          t.state.images = {};
          t.state.images[t.state.bdName] = "hd";
          locRegisterService(t, t.state.bdName, ["disk"], "INTERFACE_BLOCK");
          if (info.cdrom && Media.images.cd) {
            t.state.images["bd/cdrom0"] = "cd";
            locRegisterService(t, "bd/cdrom0", ["disk"], "INTERFACE_BLOCK");
            locRegisterService(t, "devices/\\" + t.state.devpath.replace(/\//g, "\\") + "\\ata-c1-d1", ["disk"], "INTERFACE_DDF_CLIENT");
          }
        }
      }
      return E.EOK;
    },
    answer(t, c) {
      if (!t.state.online) return { rc: E.ENXIO };
      switch (c.method) {
        case "DEV_IFACE_HANDLE": return { rc: E.EOK };
        case "BD_GET_BLOCK_SIZE": return { rc: E.EOK, bsize: 512 };
        case "BD_GET_NUM_BLOCKS": return { rc: E.EOK, nblocks: 262144 };
        case "BD_READ_BLOCKS": {
          const key = (t.state.images && t.state.images[c.args.svc]) || t.state.image || "hd";
          if (!Media.images[key]) return { rc: E.ENXIO };
          return { rc: E.EOK, image: key };
        }
        case "BD_WRITE_BLOCKS": {
          const key = (t.state.images && t.state.images[c.args.svc]) || t.state.image || "hd";
          if (!Media.images[key]) return { rc: E.ENXIO };
          if (key === "cd") return { rc: E.ENOTSUP };
          return { rc: E.EOK };
        }
        case "BD_SYNC_CACHE": return { rc: E.EOK };
        case "KBD_POLL": case "MOUSE_POLL": t.state.irqs++; return { rc: E.EOK };
        case "DDEV_GET_INFO": return { rc: E.EOK, w: 1024, h: 768, depth: 24 };
        case "DDEV_UPDATE": return { rc: E.EOK };
        case "NIC_SEND_FRAME": t.state.irqs++; return { rc: E.EOK };
        case "NIC_GET_ADDRESS": return { rc: E.EOK, mac: "52:54:00:12:34:56" };
        case "CLOCK_DEV_TIME_GET": return { rc: E.EOK, time: Date.now() };
        case "DEVMAN_OFFLINE": t.state.online = false; return { rc: E.EOK };
        case "DEVMAN_ONLINE": t.state.online = true; return { rc: E.EOK };
        default: return { rc: E.ENOTSUP };
      }
    }
  });
}
for (const d of DRV_ALL) defineDriver(d);

Servers.define({
  name: "devman", path: "/srv/devman", kind: "srv", iface: "INTERFACE_DEVMAN_DRIVER",
  threads: 2, fibrils: ["devman-driver", "devman-client"], resmem: 152 * 1024, virtmem: 1100 * 1024,
  blurb: "The device manager. Probes the device tree, scores the available drivers against each node's match ids, and starts the winner as a separate task.",
  start(t) {
    t.state.tree = [];          /* { path, name, drv, tid, state } */
    t.state.drivers = new Map();/* driver name -> tid */
    Sys.serviceRegister(t, "INTERFACE_DEVMAN_DRIVER");
    Sys.serviceRegister(t, "INTERFACE_DEVMAN_CLIENT");
    locRegisterServer(t);
    return E.EOK;
  },
  answer(t, c) {
    const S = t.state;
    switch (c.method) {
      case "DEVMAN_DRIVER_REGISTER":
        S.drivers.set(c.args.name, c.args.tid);
        for (const n of S.tree) if (n.drv === c.args.name) n.tid = c.args.tid;
        return { rc: E.EOK };
      case "DEVMAN_ADD_FUNCTION":
        S.tree.push({ path: c.args.path, name: c.args.name, drv: c.args.drv || null, tid: c.args.tid || null, state: "online" });
        return { rc: E.EOK };
      case "DEVMAN_GET_TREE": {
        const live = n => !n.tid || ((Spartan.get(n.tid) || {}).alive === true);
        return { rc: E.EOK, nodes: S.tree.map(n => ({ path: n.path, drv: n.drv, state: live(n) ? n.state : "not driven", tid: n.tid })) };
      }
      case "DEVMAN_LIST_DRV": {
        const out = [];
        for (const [name, tid] of S.drivers) {
          const d = Spartan.get(tid);
          out.push({ name, devs: S.tree.filter(n => n.drv === name).length, state: d && d.alive ? "running" : "not running" });
        }
        out.sort((a, b) => a.name.localeCompare(b.name));
        return { rc: E.EOK, drivers: out };
      }
      case "DEVMAN_LOAD_DRV": {
        const r = Servers.spawn(c.args.name, [c.args.path || ("hw/" + c.args.name)]);
        if (r.rc === E.EOK || r.rc === E.EEXIST) { for (const n of S.tree) if (n.drv === c.args.name) { n.tid = (r.task || {}).tid; n.state = "online"; } }
        return { rc: r.rc === E.EEXIST ? E.EOK : r.rc };
      }
      case "DEVMAN_UNLOAD_DRV": {
        const tid = S.drivers.get(c.args.name);
        if (!tid) return { rc: E.ENOENT };
        return { rc: Spartan.kill(tid, "unloaded by devctl") };
      }
      case "DEVMAN_ONLINE": case "DEVMAN_OFFLINE": {
        const n = S.tree.find(x => x.path === c.args.path);
        if (!n) return { rc: E.ENOENT };
        n.state = c.method === "DEVMAN_ONLINE" ? "online" : "offline";
        return { rc: E.EOK };
      }
      default: return { rc: E.ENOTSUP };
    }
  }
});

/* ==========================================================================
   MODULE 12 — THE LOG
   ========================================================================== */
const Log = {
  kernel: [],
  lines: [],
  push(from, level, msg) {
    const rec = { t: Spartan.uptime(), from, level: level || "note", msg };
    Log.lines.push(rec);
    if (Log.lines.length > 900) Log.lines.shift();
    return rec;
  },
  kpush(msg) {
    Log.kernel.push({ t: Spartan.uptime(), msg });
    if (Log.kernel.length > 600) Log.kernel.shift();
  },
  fmt(r) {
    const s = (r.t / 1000).toFixed(3);
    return "[" + padl(s, 9) + "] " + padr(r.from + ":", 12) + " " + (r.level === "error" ? "ERROR " : r.level === "warn" ? "WARN  " : r.level === "debug" ? "DEBUG " : "NOTE  ") + r.msg;
  }
};
/* Any server can log; it is one more IPC call, to logger. */
function slog(t, level, msg) {
  const ph = Sys.phoneTo(t, "INTERFACE_LOGGER_WRITER", "logger");
  if (ph) Spartan.call(ph, "LOGGER_WRITE", { from: t.name, level, msg });
  else Log.push(t.name, level, msg);
}

  name: "inet", path: "/srv/net/inetsrv", kind: "srv", iface: "INTERFACE_INET",
  threads: 2, fibrils: ["inet-conn", "inet-recv", "inet-ping"], resmem: 116 * 1024, virtmem: 820 * 1024,
  blurb: "The internet layer: addresses, routes, fragmentation, ICMP. Both IPv4 and IPv6. Everything above it dials it; it dials the link servers below.",
  start(t) {
    t.state.links = [];
    t.state.addrs = [
      { name: "lo/v4", addr: "127.0.0.1/8", link: "net/lo" },
      { name: "lo/v6", addr: "::1/128", link: "net/lo" }
    ];
    t.state.routes = [];
    Sys.serviceRegister(t, "INTERFACE_INET");
    Sys.serviceRegister(t, "INTERFACE_INETCFG");
    Sys.serviceRegister(t, "INTERFACE_INETPING");
    locRegisterServer(t);
    /* Attach to every iplink the location service knows about. */
    const lp = Sys.phoneTo(t, "INTERFACE_LOC_CONSUMER", "loc");
    if (lp) {
      const r = Spartan.call(lp, "LOC_CATEGORY_GET_SVCS", { cat: "iplink" });
      if (r.rc === E.EOK) for (const s of r.svcs) {
        const conn = locConnect(t.tid, s.name, "INTERFACE_IPLINK");
        if (conn.rc === E.EOK) t.state.links.push({ name: s.name, phone: conn.phone });
      }
    }
    return E.EOK;
  },
  answer(t, c) {
    const S = t.state;
    const link = name => S.links.find(l => l.name === name) || S.links.find(l => l.name !== "net/lo") || S.links[0];
    switch (c.method) {
      case "INETCFG_GET_ADDR_LIST": return { rc: E.EOK, addrs: S.addrs.slice() };
      case "INETCFG_GET_LINK_LIST": return { rc: E.EOK, links: S.links.map(l => ({ name: l.name, up: !l.phone.hungup })) };
      case "INETCFG_ADDR_CREATE":
        if (S.addrs.some(a => a.name === c.args.name)) return { rc: E.EEXIST };
        S.addrs.push({ name: c.args.name, addr: c.args.addr, link: c.args.link });
        return { rc: E.EOK };
      case "INETCFG_ADDR_DELETE":
        S.addrs = S.addrs.filter(a => a.name !== c.args.name); return { rc: E.EOK };
      case "INETCFG_GET_SROUTE_LIST": return { rc: E.EOK, routes: S.routes.slice() };
      case "INETCFG_SROUTE_CREATE": S.routes.push({ name: c.args.name, dest: c.args.dest, router: c.args.router }); return { rc: E.EOK };
      case "INETPING_SEND": {
        const dst = c.args.dest;
        if (dst === "127.0.0.1" || dst === "::1") {
          const l = S.links.find(x => x.name === "net/lo");
          if (!l) return { rc: E.ENXIO };
          const r = Spartan.call(l.phone, "IPLINK_SEND", { len: 64 });
          return r.rc === E.EOK ? { rc: E.EOK, rtt: 0.09 + Math.random() * 0.05 } : r;
        }
        const l = link();
        if (!l || l.phone.hungup) return { rc: E.EHANGUP };
        const r = Spartan.call(l.phone, "IPLINK_SEND", { len: 64 });
        if (r.rc !== E.EOK) return r;
        const base = NET.reachable[dst];
        if (base === undefined) return { rc: E.ETIMEOUT };
        return { rc: E.EOK, rtt: base + Math.random() * base * 0.3 };
      }
      case "INET_SEND": {
        const l = link();
        if (!l || l.phone.hungup) return { rc: E.EHANGUP };
        return Spartan.call(l.phone, "IPLINK_SEND", { len: c.args.len || 512 });
      }
      default: return { rc: E.ENOTSUP };
    }
  }
});

Servers.define({
  name: "dhcp", path: "/srv/net/dhcp", kind: "srv", iface: "INTERFACE_DHCP",
  resmem: 60 * 1024, virtmem: 420 * 1024,
  blurb: "The DHCP client, as its own task. (Its ancestor in older releases was called nconfsrv; the job is the same and the isolation is the same.)",
  start(t) { Sys.serviceRegister(t, "INTERFACE_DHCP"); return E.EOK; },
  answer(t, c) {
    if (c.method !== "DHCP_LINK_ADD") return { rc: E.ENOTSUP };
    const ip = Sys.phoneTo(t, "INTERFACE_INET", "inet");
    if (!ip) return { rc: E.EREFUSED };
    const a = Spartan.call(ip, "INETCFG_ADDR_CREATE", { name: "eth0/v4", addr: "10.0.2.15/24", link: c.args.link || "net/eth0" });
    Spartan.call(ip, "INETCFG_SROUTE_CREATE", { name: "default", dest: "0.0.0.0/0", router: "10.0.2.2" });
    return { rc: a.rc, addr: "10.0.2.15/24" };
  }
});

Servers.define({
  name: "tcp", path: "/srv/net/tcp", kind: "srv", iface: "INTERFACE_TCP",
  threads: 2, fibrils: ["tcp-conn", "tcp-timer"], resmem: 132 * 1024, virtmem: 940 * 1024,
  blurb: "The whole of TCP, in one ordinary userspace program. Retransmission timers and all.",
  start(t) { t.state.conns = []; Sys.serviceRegister(t, "INTERFACE_TCP"); return E.EOK; },
  answer(t, c) {
    if (c.method === "TCP_CONN_CREATE") {
      const ip = Sys.phoneTo(t, "INTERFACE_INET", "inet");
      if (!ip) return { rc: E.EREFUSED };
      const r = Spartan.call(ip, "INET_SEND", { len: 60 });
      if (r.rc !== E.EOK) return r;
      const id = t.state.conns.length + 1;
      t.state.conns.push({ id, peer: c.args.peer, port: c.args.port });
      return { rc: E.EOK, id };
    }
    if (c.method === "TCP_CONN_SEND" || c.method === "TCP_CONN_RECV") {
      const ip = Sys.phoneTo(t, "INTERFACE_INET", "inet");
      if (!ip) return { rc: E.EREFUSED };
      return Spartan.call(ip, "INET_SEND", { len: c.args.len || 512 });
    }
    if (c.method === "TCP_CONN_DESTROY") { t.state.conns = t.state.conns.filter(x => x.id !== c.args.id); return { rc: E.EOK }; }
    if (c.method === "TCP_LIST") return { rc: E.EOK, conns: t.state.conns.slice() };
    return { rc: E.ENOTSUP };
  }
});

Servers.define({
  name: "udp", path: "/srv/net/udp", kind: "srv", iface: "INTERFACE_UDP",
  resmem: 84 * 1024, virtmem: 600 * 1024,
  blurb: "UDP, separately. Killing udp does not disturb tcp, because they were never the same program.",
  start(t) { Sys.serviceRegister(t, "INTERFACE_UDP"); return E.EOK; },
  answer(t, c) {
    if (c.method === "UDP_ASSOC_SEND") {
      const ip = Sys.phoneTo(t, "INTERFACE_INET", "inet");
      if (!ip) return { rc: E.EREFUSED };
      return Spartan.call(ip, "INET_SEND", { len: c.args.len || 64 });
    }
    return { rc: E.ENOTSUP };
  }
});

Servers.define({
  name: "dnsrsrv", path: "/srv/net/dnsrsrv", kind: "srv", iface: "INTERFACE_DNSR",
  resmem: 58 * 1024, virtmem: 400 * 1024,
  blurb: "The DNS resolver. It asks udp, which asks inet, which asks a link server, which asks a driver. Five programs to look up one name — and any one of them can be replaced.",
  start(t) { t.state.server = "10.0.2.3"; Sys.serviceRegister(t, "INTERFACE_DNSR"); return E.EOK; },
  answer(t, c) {
    if (c.method === "DNSR_GET_SRVADDR") return { rc: E.EOK, addr: t.state.server };
    if (c.method === "DNSR_SET_SRVADDR") { t.state.server = c.args.addr; return { rc: E.EOK }; }
    if (c.method !== "DNSR_NAME2HOST") return { rc: E.ENOTSUP };
    const up = Sys.phoneTo(t, "INTERFACE_UDP", "udp");
    if (!up) return { rc: E.EREFUSED };
    const r = Spartan.call(up, "UDP_ASSOC_SEND", { len: 40 });
    if (r.rc !== E.EOK) return r;
    const name = String(c.args.name || "").toLowerCase();
    const addr = NET.hosts[name];
    if (!addr) return { rc: E.ENOENT };
    return { rc: E.EOK, addr, name };
  }
});

Servers.define({
  name: "slip", path: "/srv/net/slip", kind: "srv", iface: "INTERFACE_IPLINK",

  blurb: "IP over a serial line. Present, idle, harmless.",
