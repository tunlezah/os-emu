Cmds.define("ofw", {
  help: "prints the OpenFirmware device tree", syntax: "ofw [-v] [-p <path>]",
  run(sh, args) {
    if (Sim.arch.extra.indexOf("ofw") < 0) {
      sh.errl("Cannot spawn ofw (ENOENT)");
      sh.dim("ofw only ships on machines that have OpenFirmware: ppc32 and sparc64.");
      return;
    }
    const tree = OFW_TREE[Sim.arch.id] || OFW_TREE.sparc64;
    const verbose = args.indexOf("-v") >= 0;
    const pi = args.indexOf("-p");
    const start = pi >= 0 ? args[pi + 1] : "/";
    const walk = (path, depth) => {
      sh.out(path);
      if (verbose && OFW_PROPS[path]) for (const p of OFW_PROPS[path]) sh.out("    " + p);
      const kids = tree[path] || [];
      for (const k of kids) walk((path === "/" ? "/" : path + "/") + k, depth + 1);
    };
    if (!tree[start] && start !== "/") { sh.errl("ofw: node '" + start + "' not found"); return; }
    walk(start, 0);
  }
});

/* ==========================================================================
   MODULE 25 — FULL-SCREEN TEXT PROGRAMS
   --------------------------------------------------------------------------
   top, nav, edit and tetris.  Each is its own task; each takes the tty for
   as long as it runs and hands it back to bdsh when it exits.
   ========================================================================== */
function mkTextProg(sh, name, spec) {
  const task = Apps.spawnTask(name, "/app/" + name, "app");
  task.state.seat = sh.seat;
  const prog = {
    task, tty: sh.tty, sh, name,
    exit(msg) {
      sh.tty.endScreen();
      if (msg) sh.tty.print(msg);
      Spartan.kill(task.tid, "exited");
      sh.tty.prog = sh;
      sh.prompt(); sh.redraw();
      if (spec.onExit) spec.onExit();
    },
    onKey(ev) { if (spec.onKey) spec.onKey(prog, ev); }
  };
  sh.tty.prog = prog;
  if (spec.start) spec.start(prog);
  return prog;
}
function scrLine(s, cls) { return cls ? '<span class="' + cls + '">' + esc(s) + "</span>" : esc(s); }

/* ---------------------------- top -------------------------------------- */
Cmds.define("top", {
  help: "monitors which tasks consume the most resources",
  run(sh) {
    let mode = "t", timer = null, sortKey = "ucycles";
    const p = mkTextProg(sh, "top", {
      start(prog) {
        const draw = () => {
          if (sh.tty.prog !== prog) return;
          const W = 92;
          const L = [];
          const up = Math.floor(Spartan.uptime() / 1000);
          const tasks = Spartan.list();
          L.push(scrLine("top - " + Clock.text() + " up " + Math.floor(up / 3600) + "h " + Math.floor(up % 3600 / 60) + "m " + (up % 60) + "s", "hl"));
          L.push(scrLine("tasks: " + tasks.length + " total, " + tasks.filter(t => t.kind === "srv").length + " servers, " +
            tasks.filter(t => t.kind === "drv").length + " drivers, " + tasks.filter(t => t.kind === "app").length + " applications"));
          const thr = tasks.reduce((a, t) => a + t.threads.length, 0);
          L.push(scrLine("threads: " + thr + " total, " + irnd(1, 3) + " running, " + (thr - 2) + " sleeping"));
          for (let i = 0; i < Sim.arch.cpus; i++) L.push(scrLine("cpu" + i + " (" + padl(Sim.arch.mhz, 4) + " MHz): busy cycles: " + irnd(2, 9) + "%, idle cycles: " + irnd(90, 98) + "%"));
          const [m, ms] = binSuffix(Sim.arch.mem);
          const usedMem = tasks.reduce((a, t) => a + t.resmem, 0);
          const [u2, us2] = binSuffix(usedMem);
          L.push(scrLine("memory: " + m + " " + ms + " total, " + u2 + " " + us2 + " resident in userspace"));
          L.push("");
          if (mode === "t") {
            L.push('<span class="hl">' + esc(padr("[taskid]", 9) + padr("[thrds]", 8) + padr("[resident]", 11) + padr("[%virt]", 8) + padr("[%user]", 8) + padr("[%kern]", 8) + "[name]") + "</span>");
            const tot = Math.max(1, tasks.reduce((a, t) => a + t.ucycles, 0));
            const sorted = tasks.slice().sort((a, b) => b[sortKey] - a[sortKey]);
            for (const t of sorted.slice(0, 15)) {
              const [r, rs] = binSuffix(t.resmem);
              L.push(esc(padr(t.tid, 9) + padr(t.threads.length, 8) + padr(r + " " + rs, 11) +
                padr((t.virtmem / Sim.arch.mem * 100).toFixed(2), 8) +
                padr((t.ucycles / tot * 100).toFixed(2), 8) +
                padr((t.kcycles / tot * 100).toFixed(2), 8) + t.name));
            }
          } else if (mode === "i") {
            L.push('<span class="hl">' + esc(padr("[caller]", 10) + padr("[callee]", 10) + padr("[interface]", 30) + "[calls]") + "</span>");
            for (const t of tasks) for (const ph of t.phones) {
              const to = Spartan.get(ph.callee);
              L.push(esc(padr(t.name + "(" + t.tid + ")", 10 + t.name.length > 22 ? 24 : 22) + padr(to ? to.name : "?", 14) + padr(ph.iface || "", 30) + t.calls));
            }
          } else {
            L.push(scrLine("Operation modes:"));
            L.push(scrLine("  t .. tasks statistics"));
            L.push(scrLine("  i .. IPC statistics"));
            L.push(scrLine("  h .. toggle this help screen"));
            L.push(scrLine(""));
            L.push(scrLine("Other keys:"));
            L.push(scrLine("  s .. choose column to sort by"));
            L.push(scrLine("  k .. kill the task on the first line (exhibit convenience)"));
            L.push(scrLine("  q .. quit"));
          }
          L.push("");
          L.push(scrLine("t tasks   i IPC   h help   s sort   q quit", "dim"));
          sh.tty.setScreen(L);
        };
        draw();
        timer = setInterval(draw, 1000);
        prog.draw = draw;
      },
      onKey(prog, ev) {
        const k = ev.key.toLowerCase();
        if (k === "q") { clearInterval(timer); prog.exit(); return; }
        if (k === "t" || k === "i" || k === "h") { mode = k === "h" && mode === "h" ? "t" : k; prog.draw(); return; }
        if (k === "s") { sortKey = sortKey === "ucycles" ? "resmem" : sortKey === "resmem" ? "calls" : "ucycles"; prog.draw(); return; }
        if (k === "k") {
          const first = Spartan.list().slice().sort((a, b) => b[sortKey] - a[sortKey]).filter(x => x.kind !== "kernel" && x.tid !== prog.task.tid)[0];
          if (first) Sim.killFromUi(first);
          prog.draw(); return;
        }
      },
      onExit() { clearInterval(timer); }
    });
  }
});

/* ---------------------------- nav (Navigator) --------------------------- */
Cmds.define("nav", {
  help: "the Navigator file manager",
  run(sh) {
    const panels = [{ path: sh.cwd, sel: 0, entries: [] }, { path: "/app", sel: 0, entries: [] }];
    let act = 0, message = "";
    const refresh = (prog) => {
      for (const p of panels) {
        const r = VfsClient.read(prog.task, p.path);
        if (r.rc !== E.EOK) { p.entries = null; p.err = r.rc; continue; }
        p.err = 0;
        p.entries = [{ name: "..", kind: "d", size: 0 }].concat(r.entries);
        p.sel = clamp(p.sel, 0, p.entries.length - 1);
      }
    };
    const draw = (prog) => {
      const PW = 44, rows = 18;
      const L = [];
      L.push('<span class="hl">' + esc(padr(" File", PW * 2 + 1)) + "</span>");
      const head = (p, i) => (i === act ? "[" : " ") + padr((" " + p.path + " ").slice(0, PW - 2), PW - 2) + (i === act ? "]" : " ");
      L.push(esc(head(panels[0], 0) + " " + head(panels[1], 1)));
      for (let r = 0; r < rows; r++) {
        let html = "";
        for (let i = 0; i < 2; i++) {
          const p = panels[i];
          let cell = "", selected = false;
          if (p.entries === null) {
            if (r === 0) cell = "  <" + errName(p.err) + ": " + errText(p.err) + ">";
          } else {
            const top = clamp(p.sel - Math.floor(rows / 2), 0, Math.max(0, p.entries.length - rows));
            const e = p.entries[r + top];
            if (e) {
              const nm = (e.kind === "d" ? "/" : " ") + e.name;
              const sz = e.kind === "d" ? "<dir>" : String(e.size);
              cell = padr(nm.slice(0, PW - 10), PW - 10) + padl(sz, 8);
              selected = (i === act && (r + top) === p.sel);
            }
          }
          const txt = esc(padr(cell, PW));
          html += selected ? '<span class="cur">' + txt + "</span>" : txt;
          if (i === 0) html += " ";
        }
        L.push(html);
      }
      L.push("");
      L.push(scrLine(message || "Tab switch panel   Enter open   Ctrl-E edit   F7 new dir   F8 delete   Ctrl-Q quit", message ? "err" : "dim"));
      prog.tty.setScreen(L);
    };
    mkTextProg(sh, "nav", {
      start(prog) { refresh(prog); draw(prog); prog.refresh = () => { refresh(prog); draw(prog); }; prog.draw = () => draw(prog); },
      onKey(prog, ev) {
        const p = panels[act];
        message = "";
        if (ev.ctrlKey && (ev.key === "q" || ev.key === "Q")) { prog.exit(); return; }
        if (ev.key === "Tab") { act = 1 - act; prog.draw(); return; }
        if (!p.entries) { if (ev.key === "Enter") prog.refresh(); return; }
        if (ev.key === "ArrowUp") { p.sel = Math.max(0, p.sel - 1); prog.draw(); return; }
        if (ev.key === "ArrowDown") { p.sel = Math.min(p.entries.length - 1, p.sel + 1); prog.draw(); return; }
        if (ev.key === "Home") { p.sel = 0; prog.draw(); return; }
        if (ev.key === "End") { p.sel = p.entries.length - 1; prog.draw(); return; }
        if (ev.key === "Enter") {
          const e = p.entries[p.sel];
          if (!e) return;
          if (e.name === "..") { p.path = absPath(p.path, ".."); p.sel = 0; prog.refresh(); return; }
          const np = absPath(p.path, e.name);
          if (e.kind === "d") { p.path = np; p.sel = 0; prog.refresh(); return; }
          const r = VfsClient.read(prog.task, np);
          if (r.rc !== E.EOK) {
            message = "Navigator: cannot open " + np + " — " + errName(r.rc) + " (" + errText(r.rc) + ")";
            if (r.rc === E.EHANGUP) message += "   [the filesystem server for that mount point is not running]";
            prog.draw(); return;
          }
          /* show it */
          const L = [scrLine(" " + np, "hl"), ""];
          for (const line of String(r.data).split("\n").slice(0, 20)) L.push(esc(line.slice(0, 90)));
          L.push(""); L.push(scrLine("press any key to return", "dim"));
          prog.tty.setScreen(L);
          prog.viewing = true;
          return;
        }
        if (prog.viewing) { prog.viewing = false; prog.draw(); return; }
        if (ev.key === "F7") {
          const nm = "newdir" + irnd(1, 99);
          const r = VfsClient.create(prog.task, absPath(p.path, nm), "d");
          message = r.rc === E.EOK ? "Created " + nm : "Creating new directory failed: " + errName(r.rc);
          prog.refresh(); return;
        }
        if (ev.key === "F8" || ev.key === "Delete") {
          const e = p.entries[p.sel];
          if (!e || e.name === "..") return;
          const r = VfsClient.unlink(prog.task, absPath(p.path, e.name));
          message = r.rc === E.EOK ? "" : "Delete failed: " + errName(r.rc) + " (" + errText(r.rc) + ")";
          prog.refresh(); return;
        }
        if (ev.ctrlKey && (ev.key === "e" || ev.key === "E")) {
          const e = p.entries[p.sel];
          if (!e || e.kind === "d") return;
          const path = absPath(p.path, e.name);
          prog.exit();
          Cmds.get("edit").run(sh, [path]);
          return;
        }
      }
    });
  }
});

/* ---------------------------- edit -------------------------------------- */
Cmds.define("edit", {
  help: "the HelenOS text editor",
  run(sh, args) {
    let path = args[0] ? absPath(sh.cwd, args[0]) : null;
    let lines = [""], cy = 0, cx = 0, dirty = false, msg = "", top = 0;
    const ROWS = 19;
    mkTextProg(sh, "edit", {
      start(prog) {
        if (path) {
          const r = VfsClient.read(prog.task, path);
          if (r.rc === E.EOK && r.kind === "f") lines = String(r.data).split("\n");
          else if (r.rc === E.ENOENT) msg = "New file";
          else { msg = "Cannot open " + path + ": " + errName(r.rc) + " (" + errText(r.rc) + ")"; }
        }
        prog.draw = () => draw(prog);
        prog.draw();
      },
      onKey(prog, ev) {
        const k = ev.key;
        msg = "";
        if (ev.ctrlKey) {
          const c = k.toLowerCase();
          if (c === "q") {
            if (dirty) { msg = "Unsaved changes. Ctrl-Q again to discard."; dirty = false; prog.draw(); return; }
            prog.exit(); return;
          }
          if (c === "s") {
            if (!path) path = absPath(sh.cwd, "untitled.txt");
            const r = VfsClient.write(prog.task, path, lines.join("\n"));
            msg = r.rc === E.EOK ? "Saved " + path : "Save failed: " + errName(r.rc) + " (" + errText(r.rc) + ")";
            if (r.rc === E.EOK) dirty = false;
            prog.draw(); return;
          }
          if (c === "n") { lines = [""]; cy = cx = 0; path = null; dirty = false; prog.draw(); return; }
          if (c === "l") { msg = "Go to line: use the arrow keys, this is a small editor."; prog.draw(); return; }
          return;
        }
        if (k === "ArrowUp") { cy = Math.max(0, cy - 1); cx = Math.min(cx, lines[cy].length); }
        else if (k === "ArrowDown") { cy = Math.min(lines.length - 1, cy + 1); cx = Math.min(cx, lines[cy].length); }
        else if (k === "ArrowLeft") { if (cx > 0) cx--; else if (cy > 0) { cy--; cx = lines[cy].length; } }
        else if (k === "ArrowRight") { if (cx < lines[cy].length) cx++; else if (cy < lines.length - 1) { cy++; cx = 0; } }
        else if (k === "Home") cx = 0;
        else if (k === "End") cx = lines[cy].length;
        else if (k === "PageUp") cy = Math.max(0, cy - ROWS);
        else if (k === "PageDown") cy = Math.min(lines.length - 1, cy + ROWS);
        else if (k === "Enter") { const rest = lines[cy].slice(cx); lines[cy] = lines[cy].slice(0, cx); lines.splice(cy + 1, 0, rest); cy++; cx = 0; dirty = true; }
        else if (k === "Backspace") {
          if (cx > 0) { lines[cy] = lines[cy].slice(0, cx - 1) + lines[cy].slice(cx); cx--; dirty = true; }
          else if (cy > 0) { cx = lines[cy - 1].length; lines[cy - 1] += lines[cy]; lines.splice(cy, 1); cy--; dirty = true; }
        }
        else if (k === "Delete") { if (cx < lines[cy].length) { lines[cy] = lines[cy].slice(0, cx) + lines[cy].slice(cx + 1); dirty = true; } else if (cy < lines.length - 1) { lines[cy] += lines[cy + 1]; lines.splice(cy + 1, 1); dirty = true; } }
        else if (k === "Tab") { lines[cy] = lines[cy].slice(0, cx) + "    " + lines[cy].slice(cx); cx += 4; dirty = true; }
        else if (k.length === 1) { lines[cy] = lines[cy].slice(0, cx) + k + lines[cy].slice(cx); cx++; dirty = true; }
        else return;
        prog.draw();
      }
    });
    function draw(prog) {
      if (cy < top) top = cy;
      if (cy >= top + ROWS) top = cy - ROWS + 1;
      const L = [];
      L.push('<span class="hl">' + esc(padr(" File  Edit  Search", 60) + padl((path || "<untitled>") + (dirty ? " *" : ""), 30)) + "</span>");
      for (let i = 0; i < ROWS; i++) {
        const idx = top + i;
        if (idx >= lines.length) { L.push(scrLine("~", "dim")); continue; }
        const s = lines[idx];
        if (idx === cy) {
          L.push(esc(s.slice(0, cx)) + '<span class="cur">' + esc(s.slice(cx, cx + 1) || " ") + "</span>" + esc(s.slice(cx + 1)));
        } else L.push(esc(s));
      }
      L.push("");
      L.push(scrLine(msg || ("Line " + (cy + 1) + "/" + lines.length + " Col " + (cx + 1) + "    Ctrl-S save   Ctrl-N new   Ctrl-Q quit"), msg ? "warn" : "dim"));
      prog.tty.setScreen(L);
    }
  }
});

/* ---------------------------- tetris ------------------------------------ */
const TETROMINOES = [
  { c: "I", cells: [[[0, 1], [1, 1], [2, 1], [3, 1]], [[2, 0], [2, 1], [2, 2], [2, 3]]] },
  { c: "O", cells: [[[1, 0], [2, 0], [1, 1], [2, 1]]] },
  { c: "T", cells: [[[1, 0], [0, 1], [1, 1], [2, 1]], [[1, 0], [1, 1], [2, 1], [1, 2]], [[0, 1], [1, 1], [2, 1], [1, 2]], [[1, 0], [0, 1], [1, 1], [1, 2]]] },
  { c: "S", cells: [[[1, 0], [2, 0], [0, 1], [1, 1]], [[1, 0], [1, 1], [2, 1], [2, 2]]] },
  { c: "Z", cells: [[[0, 0], [1, 0], [1, 1], [2, 1]], [[2, 0], [1, 1], [2, 1], [1, 2]]] },
  { c: "J", cells: [[[0, 0], [0, 1], [1, 1], [2, 1]], [[1, 0], [2, 0], [1, 1], [1, 2]], [[0, 1], [1, 1], [2, 1], [2, 2]], [[1, 0], [1, 1], [0, 2], [1, 2]]] },
  { c: "L", cells: [[[2, 0], [0, 1], [1, 1], [2, 1]], [[1, 0], [1, 1], [1, 2], [2, 2]], [[0, 1], [1, 1], [2, 1], [0, 2]], [[0, 0], [1, 0], [1, 1], [1, 2]]] }
];
Cmds.define("tetris", {
  help: "the BSD tetris game, as shipped",
  run(sh) {
    const W = 10, H = 20;
    let well = Array.from({ length: H }, () => Array(W).fill(0));
    let piece = null, px = 3, py = 0, rot = 0, score = 0, lines = 0, level = 1;
    let over = false, paused = false, timer = null, next = irnd(0, 6);
    const hi = State.get("tetrisHigh", 0);
    const spawn = () => {
      piece = next; next = irnd(0, 6); rot = 0; px = 3; py = 0;
      if (collide(px, py, rot)) { over = true; if (score > State.get("tetrisHigh", 0)) State.set("tetrisHigh", score); }
    };
    const cells = (p, r) => { const t = TETROMINOES[p]; return t.cells[r % t.cells.length]; };
    const collide = (x, y, r) => cells(piece, r).some(([cx, cy]) => {
      const nx = x + cx, ny = y + cy;
      return nx < 0 || nx >= W || ny >= H || (ny >= 0 && well[ny][nx]);
    });
    const lock = () => {
      for (const [cx, cy] of cells(piece, rot)) { const ny = py + cy; if (ny >= 0) well[ny][px + cx] = piece + 1; }
      let cleared = 0;
      for (let y = H - 1; y >= 0; y--) if (well[y].every(v => v)) { well.splice(y, 1); well.unshift(Array(W).fill(0)); cleared++; y++; }
      if (cleared) { lines += cleared; score += [0, 40, 100, 300, 1200][cleared] * level; level = 1 + Math.floor(lines / 10); }
      spawn();
    };
    const step = (prog) => {
      if (over || paused) return;
      if (!collide(px, py + 1, rot)) py++; else lock();
      prog.draw();
    };
    mkTextProg(sh, "tetris", {
      start(prog) {
        spawn();
        prog.draw = () => draw(prog);
        prog.draw();
        timer = setInterval(() => { step(prog); if (timer) { clearInterval(timer); timer = setInterval(() => step(prog), Math.max(120, 600 - level * 45)); } }, 600);
      },
      onKey(prog, ev) {
        const k = ev.key;
        if (k === "q" || k === "Q") { clearInterval(timer); timer = null; prog.exit("Score: " + score); return; }
        if (over) { if (k === " " || k === "Enter") { well = Array.from({ length: H }, () => Array(W).fill(0)); score = 0; lines = 0; level = 1; over = false; spawn(); prog.draw(); } return; }
        if (k === "p" || k === "P") { paused = !paused; prog.draw(); return; }
        if (paused) return;
        if (k === "ArrowLeft" || k === "j") { if (!collide(px - 1, py, rot)) px--; }
        else if (k === "ArrowRight" || k === "l") { if (!collide(px + 1, py, rot)) px++; }
        else if (k === "ArrowUp" || k === "k") { const nr = (rot + 1) % TETROMINOES[piece].cells.length; if (!collide(px, py, nr)) rot = nr; }
        else if (k === "ArrowDown") { if (!collide(px, py + 1, rot)) { py++; score++; } }
        else if (k === " ") { while (!collide(px, py + 1, rot)) { py++; score += 2; } lock(); }
        else return;
        prog.draw();
      },
      onExit() { clearInterval(timer); timer = null; }
    });
    function draw(prog) {
      const grid = well.map(r => r.slice());
      if (!over && piece != null) for (const [cx, cy] of cells(piece, rot)) { const ny = py + cy; if (ny >= 0) grid[ny][px + cx] = piece + 1; }
      const L = [];
      L.push("");
      const high = Math.max(score, State.get("tetrisHigh", 0));
      for (let y = 0; y < H; y++) {
        let row = "        |";
        for (let x = 0; x < W; x++) row += grid[y][x] ? "[]" : "  ";
        row += "|";
        let side = "";
        if (y === 1) side = "   Score: " + score;
        if (y === 2) side = "   Level: " + level;
        if (y === 3) side = "   Lines: " + lines;
        if (y === 4) side = "   High:  " + high;
        if (y === 6) side = "   Next:";
        if (y >= 7 && y <= 9) {
          const nc = cells(next, 0);
          let s = "   ";
          for (let x = 0; x < 4; x++) s += nc.some(([a, b]) => a === x && b === (y - 7)) ? "[]" : "  ";
          side = s;
        }
        L.push(esc(row + side));
      }
      L.push(esc("        +" + "--".repeat(W) + "+"));
      L.push("");
      if (over) L.push(scrLine("        GAME OVER — press Space to play again, q to quit", "err"));
      else if (paused) L.push(scrLine("        PAUSED — press p to resume", "warn"));
      else L.push(scrLine("        arrows move/rotate  space drop  p pause  q quit", "dim"));
      L.push("");
      L.push(scrLine("        This is task " + prog.task.tid + ". Kill it from the Task Monitor and", "dim"));
      L.push(scrLine("        watch nothing else in the machine react.", "dim"));
      prog.tty.setScreen(L);
    }
  }
});

/* ==========================================================================
   MODULE 25b — THE DEMOS IN TEXT MODE
   --------------------------------------------------------------------------
   gfxdemo, uidemo and barber all run on the console as well as on the
   display server, because libui and libgfx have a text back end.  Same
   programs, same task ids, different bottom layer.  Run them from a shell on
   the text console and this is what you get.
   ========================================================================== */
function demoWantsConsole(sh, args) {
  if (args && (args.indexOf("-c") >= 0 || args.indexOf("console") >= 0 || args.indexOf("--console") >= 0)) return true;
  if (args && args.indexOf("ui") >= 0) return false;
  return !Spartan.first("display");     /* no display server: text mode it is */
}

/* ---- barber, in characters ---------------------------------------------- */
function barberText(sh) {
  let off = 0, timer = null;
  mkTextProg(sh, "barber", {
    start(prog) {
      const draw = () => {
        if (sh.tty.prog !== prog) return;
        const H = 15, W = 11;
        const L = [scrLine("  Barber Pole  (task " + prog.task.tid + ")", "hl"), ""];
        L.push(esc("        +" + "-".repeat(W) + "+"));
        for (let y = 0; y < H; y++) {
          let row = "";
          for (let x = 0; x < W; x++) {
            const v = ((x + y * 2 + Math.floor(off)) % 8);
            row += v < 3 ? "/" : v < 4 ? "|" : v < 7 ? "\\" : " ";
          }
          L.push(esc("        |" + row + "|"));
        }
        L.push(esc("        +" + "-".repeat(W) + "+"));
        L.push("");
        L.push(scrLine("  The same program the GUI runs. Only the back end changed.", "dim"));
        L.push(scrLine("  q to quit", "dim"));
        sh.tty.setScreen(L);
        off += 0.7;
      };
      draw();
      timer = setInterval(draw, 90);
      prog.draw = draw;
    },
    onKey(prog, ev) { if (ev.key === "q" || ev.key === "Q" || ev.key === "Escape") { clearInterval(timer); prog.exit(); } },
    onExit() { clearInterval(timer); }
  });
}

/* ---- gfxdemo, in characters --------------------------------------------- */
function gfxdemoText(sh) {
  let f = 0, scene = 0, timer = null;
  const SCENES = 4;
  const SHADES = " .:-=+*#%@";
  mkTextProg(sh, "gfxdemo", {
    start(prog) {
      const draw = () => {
        if (sh.tty.prog !== prog) return;
        const W = 74, H = 17;
        const L = [scrLine("GFX Demo — text mode (scene " + (scene + 1) + "/" + SCENES + ")", "hl"), ""];
        for (let y = 0; y < H; y++) {
          let row = "";
          for (let x = 0; x < W; x++) {
            let v;
            if (scene === 0) v = (Math.sin((x + f) / 5) + Math.cos((y - f) / 3)) / 2;
            else if (scene === 1) {
              const dx = x - W / 2, dy = (y - H / 2) * 2.1;
              v = Math.sin(Math.sqrt(dx * dx + dy * dy) / 2.4 - f / 4);
            } else if (scene === 2) {
              const dx = x - W / 2, dy = (y - H / 2) * 2.1;
              v = Math.sin(Math.atan2(dy, dx) * 5 + f / 5) * Math.cos(Math.sqrt(dx * dx + dy * dy) / 6);
            } else {
              v = Math.sin((x * y) / 40 + f / 6) * Math.cos((x - y) / 9 - f / 9);
            }
            row += SHADES[clamp(Math.round((v + 1) / 2 * (SHADES.length - 1)), 0, SHADES.length - 1)];
          }
          L.push(esc(row));
        }
        L.push("");
        L.push(scrLine("space next scene   q quit", "dim"));
        sh.tty.setScreen(L);
        f++;
      };
      draw();
      timer = setInterval(draw, 90);
      prog.draw = draw;
    },
    onKey(prog, ev) {
      if (ev.key === "q" || ev.key === "Q" || ev.key === "Escape") { clearInterval(timer); prog.exit(); return; }
      if (ev.key === " ") scene = (scene + 1) % SCENES;
    },
    onExit() { clearInterval(timer); }
  });
}

/* ---- uidemo, in characters ----------------------------------------------
   This is what libui looks like with its EGA back end underneath: the same
   widget set, drawn with box characters instead of pixels.                */
function uidemoText(sh) {
  let sel = 0, checks = [true, false], radio = 0, prog2 = 0, timer = null;
  const BTNS = ["OK", "Cancel", "Help"];
  mkTextProg(sh, "uidemo", {
    start(prog) {
      const draw = () => {
        if (sh.tty.prog !== prog) return;
        const W = 60;
        const L = [];
        const box = (t) => "│" + padr(t, W - 2) + "│";
        L.push(esc("┌" + "─".repeat(W - 2) + "┐"));
        L.push('<span class="hl">' + esc("│" + padr(" UI Demo (text mode)", W - 2) + "│") + "</span>");
        L.push(esc("├" + "─".repeat(W - 2) + "┤"));
        L.push(esc(box(" File  Edit")));
        L.push(esc(box("")));
        L.push(esc(box("  Push buttons:")));
        let brow = "   ";
        BTNS.forEach((b, i) => { brow += (i === sel ? "[" + b + "]" : " " + b + " ") + "  "; });
        L.push(esc(box(brow)));
        L.push(esc(box("")));
        L.push(esc(box("  Check boxes:")));
        L.push(esc(box("   [" + (checks[0] ? "x" : " ") + "] Enable the thing")));
        L.push(esc(box("   [" + (checks[1] ? "x" : " ") + "] Enable the other thing")));
        L.push(esc(box("")));
        L.push(esc(box("  Radio buttons:")));
        L.push(esc(box("   (" + (radio === 0 ? "*" : " ") + ") First     (" + (radio === 1 ? "*" : " ") + ") Second")));
        L.push(esc(box("")));
        L.push(esc(box("  Progress:")));
        const filled = Math.round(prog2 / 100 * 40);
        L.push(esc(box("   [" + "#".repeat(filled) + "-".repeat(40 - filled) + "]")));
        L.push(esc(box("")));
        L.push(esc(box("  Entry:  [" + padr("type anything", 34) + "]")));
        L.push(esc("└" + "─".repeat(W - 2) + "┘"));
        L.push("");
        L.push(scrLine("Tab/arrows move   space toggle   q quit", "dim"));
        L.push(scrLine("The same toolkit as the graphical UI Demo, on its EGA back end.", "dim"));
        sh.tty.setScreen(L);
        prog2 = (prog2 + 3) % 101;
      };
      draw();
      timer = setInterval(draw, 140);
      prog.draw = draw;
    },
    onKey(prog, ev) {
      if (ev.key === "q" || ev.key === "Q" || ev.key === "Escape") { clearInterval(timer); prog.exit(); return; }
      if (ev.key === "Tab" || ev.key === "ArrowRight") sel = (sel + 1) % BTNS.length;
      else if (ev.key === "ArrowLeft") sel = (sel + BTNS.length - 1) % BTNS.length;
      else if (ev.key === "ArrowDown") radio = 1;
      else if (ev.key === "ArrowUp") radio = 0;
      else if (ev.key === " ") checks[sel % 2] = !checks[sel % 2];
      prog.draw();
    },
    onExit() { clearInterval(timer); }
  });
}

/* ---------------------------- terminal ---------------------------------- */
Apps.define({
  name: "terminal", path: "/app/terminal", caption: "Terminal", w: 726, h: 440,
  start(t, w, opts) {
    const box = el("div", { class: "term" });
    const pre = el("pre");
    box.appendChild(pre);
    w.body.appendChild(box);
    const tty = mkTty({
      onRender: tt => {
        /* Full-screen programs get a fixed grid; the stream wraps. */
        pre.style.whiteSpace = tt.mode === "screen" ? "pre" : "pre-wrap";
        pre.innerHTML = tt.html();
        if (tt.mode !== "screen") box.scrollTop = box.scrollHeight;
      }
    });
    t.state.tty = tty;
    w.tty = tty;
    w.onFocusKey = ev => { if (tty.prog && tty.prog.onKey) tty.prog.onKey(ev); };
    box.addEventListener("mousedown", () => Screen.focus(w));
    /* getterm-style banner, then bdsh */
    tty.print("HelenOS release " + REL + " (" + CODENAME + ")");

Apps.define({
  name: "calculator", path: "/app/calculator", caption: "Calculator", w: 236, h: 258,
  style: { noMax: true, noResize: true },
  start(t, w) {
    let acc = 0, cur = "0", op = null, fresh = true;
    const disp = el("div", { class: "hentry", style: { textAlign: "right", fontFamily: "var(--mono)", fontSize: "17px", padding: "5px 7px", margin: "4px" } }, "0");
    const grid = el("div", { style: { display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: "3px", padding: "0 4px 4px" } });
    const upd = () => disp.textContent = cur;
    const digit = d => { if (fresh) { cur = d === "." ? "0." : d; fresh = false; } else if (!(d === "." && cur.includes("."))) cur += d; upd(); };
    const apply = () => {
      const v = parseFloat(cur);
      if (op === "+") acc += v; else if (op === "-") acc -= v; else if (op === "*") acc *= v;
      else if (op === "/") acc = v === 0 ? NaN : acc / v; else acc = v;
      cur = isNaN(acc) ? "Error" : String(Math.round(acc * 1e10) / 1e10);
      upd();
    };
    const keys = ["7", "8", "9", "/", "4", "5", "6", "*", "1", "2", "3", "-", "0", ".", "=", "+"];
    for (const k of keys) {
      const b = Ui.btn(k, () => {
        if (/[0-9.]/.test(k)) digit(k);
        else if (k === "=") { apply(); op = null; fresh = true; }
        else { apply(); op = k; fresh = true; }
      }, { small: true });
      b.style.minWidth = "0"; b.style.padding = "7px 0";
      grid.appendChild(b);
    }
    const top = el("div", { style: { display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: "3px", padding: "0 4px 3px" } });
    for (const k of ["C", "CE", "+/-", "%"]) {
      const b = Ui.btn(k, () => {
        if (k === "C") { acc = 0; cur = "0"; op = null; fresh = true; }
        else if (k === "CE") { cur = "0"; fresh = true; }
        else if (k === "+/-") cur = String(-parseFloat(cur));
        else cur = String(parseFloat(cur) / 100);
        upd();
      }, { small: true });
      b.style.minWidth = "0"; b.style.padding = "5px 0";
      top.appendChild(b);
    }
    const box = el("div", { style: { position: "absolute", inset: "0", background: "var(--face)", display: "flex", flexDirection: "column" } });
    box.appendChild(Ui.menubar(w, [
      { label: "~F~ile", items: [{ label: "E~x~it", accel: "Alt-F4", run: () => App.close(w) }] },
      {
        label: "~E~dit", items: [
          { label: "~C~opy", accel: "Ctrl-C", run: () => { const cb = Sys.phoneTo(t, "INTERFACE_CLIPBOARD", "clipboard"); if (cb) Spartan.call(cb, "CLIPBOARD_PUT_DATA", { data: cur }); } },
          { label: "~P~aste", accel: "Ctrl-V", run: () => { const cb = Sys.phoneTo(t, "INTERFACE_CLIPBOARD", "clipboard"); if (!cb) return; const r = Spartan.call(cb, "CLIPBOARD_GET_DATA", {}); if (r.rc === E.EOK && r.data) { cur = r.data; fresh = false; upd(); } } }
        ]
      }
    ]));
    box.append(disp, top, grid);
    w.body.appendChild(box);
    w.onFocusKey = ev => {
      if (/^[0-9.]$/.test(ev.key)) digit(ev.key);
      else if ("+-*/".includes(ev.key)) { apply(); op = ev.key; fresh = true; }
      else if (ev.key === "Enter" || ev.key === "=") { apply(); op = null; fresh = true; }
      else if (ev.key === "Escape") { acc = 0; cur = "0"; op = null; fresh = true; upd(); }
      else if (ev.key === "Backspace") { cur = cur.length > 1 ? cur.slice(0, -1) : "0"; upd(); }
    };
  }
});
Cmds.define("calculator", { help: "the calculator", run(sh) { Apps.launch("calculator", { seat: sh.seat }); } });

/* ---------------------------- gfxdemo ----------------------------------- */
Apps.define({
  name: "gfxdemo", path: "/app/gfxdemo", caption: "GFX Demo", w: 420, h: 320,
  start(t, w) {
    const cv = el("canvas", { style: { position: "absolute", inset: "0", width: "100%", height: "100%" } });
    w.body.appendChild(cv);
    let frame = 0, scene = 0, raf = null;
    const SCENES = 5;
    const draw = () => {
      if (!w.node || !Spartan.get(t.tid) || !Spartan.get(t.tid).alive) return;
      const W = cv.clientWidth, H = cv.clientHeight;
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
      const g = cv.getContext("2d");
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      const f = frame;
      if (scene === 0) {
        for (let i = 0; i < 40; i++) {
          g.fillStyle = "hsl(" + ((i * 9 + f) % 360) + ",65%,50%)";
          const s = 10 + i * 3;
          g.fillRect((W / 2 - s / 2) + Math.sin((f + i * 8) / 30) * 40, (H / 2 - s / 2) + Math.cos((f + i * 8) / 30) * 30, s, s);
        }
      } else if (scene === 1) {
        g.lineWidth = 2;
        for (let i = 0; i < 26; i++) {
          g.strokeStyle = "hsl(" + ((i * 12 + f * 2) % 360) + ",70%,55%)";
          g.beginPath(); g.arc(W / 2, H / 2, 8 + i * 7, f / 40 + i, f / 40 + i + 2.2); g.stroke();
        }
      } else if (scene === 2) {
        for (let y = 0; y < H; y += 4) {
          const t2 = Math.sin((y + f) / 22) * 0.5 + 0.5;
          g.fillStyle = "rgb(" + Math.round(t2 * 128) + "," + Math.round(t2 * 200) + "," + Math.round(120 + t2 * 135) + ")";
          g.fillRect(0, y, W, 4);
        }
        g.fillStyle = "#fff"; g.font = "bold 22px var(--mono), monospace"; g.textAlign = "center";
        g.fillText("HelenOS gfx", W / 2, H / 2 + Math.sin(f / 18) * 22);
      } else if (scene === 3) {
        const n = 9;
        for (let i = 0; i < n; i++) {
          const a = f / 30 + i * Math.PI * 2 / n;
          g.fillStyle = "hsl(" + ((i * 40 + f) % 360) + ",70%,55%)";
          g.beginPath();
          g.moveTo(W / 2 + Math.cos(a) * 90, H / 2 + Math.sin(a) * 70);
          g.lineTo(W / 2 + Math.cos(a + 2.1) * 60, H / 2 + Math.sin(a + 2.1) * 50);
          g.lineTo(W / 2 + Math.cos(a + 4.2) * 30, H / 2 + Math.sin(a + 4.2) * 25);
          g.closePath(); g.fill();
        }
      } else {
        g.strokeStyle = "#5eead4"; g.lineWidth = 1;
        for (let i = 0; i < 30; i++) {
          const k = (i + (f % 30) / 30);
          const s = Math.pow(1.16, k) * 4;
          g.globalAlpha = clamp(1 - k / 30, 0, 1);
          g.strokeRect(W / 2 - s, H / 2 - s * 0.72, s * 2, s * 1.44);
        }
        g.globalAlpha = 1;
      }
      g.fillStyle = "#ffffffb0"; g.font = "11px var(--mono), monospace"; g.textAlign = "left";
      g.fillText("scene " + (scene + 1) + "/" + SCENES + "  ·  click or press space", 8, H - 8);
      frame++;
      raf = requestAnimationFrame(draw);
    };
    cv.addEventListener("click", () => scene = (scene + 1) % SCENES);
    w.onFocusKey = ev => { if (ev.key === " ") scene = (scene + 1) % SCENES; };
    w.onClose = () => { cancelAnimationFrame(raf); return true; };
    draw();
  }
});
Cmds.define("gfxdemo", {
  help: "the graphics demo — runs in the GUI and on the console", syntax: "gfxdemo [ui|console]",
  run(sh, args) { if (demoWantsConsole(sh, args)) gfxdemoText(sh); else Apps.launch("gfxdemo", { seat: sh.seat }); }
});

Apps.define({
  name: "barber", path: "/app/barber", caption: "Barber Pole", w: 220, h: 260,
  style: { noMax: true },
  start(t, w) {
    const cv = el("canvas", { style: { position: "absolute", inset: "0", width: "100%", height: "100%" } });
    w.body.appendChild(cv);
    let off = 0, raf = null, last = performance.now();
    const draw = () => {
      const task = Spartan.get(t.tid);
      if (!w.node || !task || !task.alive) return;
      const W = cv.clientWidth, H = cv.clientHeight;
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
      const g = cv.getContext("2d");
      g.fillStyle = "#c8c8c8"; g.fillRect(0, 0, W, H);
      const bw = Math.min(70, W * 0.4), bx = (W - bw) / 2, by = 18, bh = H - 46;
      g.save();
      g.beginPath(); g.rect(bx, by, bw, bh); g.clip();
      g.fillStyle = "#fff"; g.fillRect(bx, by, bw, bh);
      g.lineWidth = 13;
      for (let i = -bh; i < bh + bw; i += 26) {
        g.strokeStyle = ((Math.floor(i / 26) % 2) === 0) ? "#c0392b" : "#2c5fa8";
        g.beginPath(); g.moveTo(bx - 10, by + i + (off % 26)); g.lineTo(bx + bw + 10, by + i + (off % 26) - bw - 20); g.stroke();
      }
      g.restore();
      g.strokeStyle = "#000"; g.lineWidth = 1; g.strokeRect(bx + .5, by + .5, bw, bh);
      g.fillStyle = "#888"; g.fillRect(bx - 6, by - 10, bw + 12, 10); g.fillRect(bx - 6, by + bh, bw + 12, 10);
      g.strokeRect(bx - 5.5, by - 9.5, bw + 11, 10); g.strokeRect(bx - 5.5, by + bh + .5, bw + 11, 10);
      g.fillStyle = "#000"; g.font = "11px sans-serif"; g.textAlign = "center";
      g.fillText("task " + t.tid + " — still turning", W / 2, H - 12);
      const now = performance.now();
      off += (now - last) * 0.045; last = now;
      raf = requestAnimationFrame(draw);
    };
    w.onClose = () => { cancelAnimationFrame(raf); return true; };
    draw();
  }
});
Cmds.define("barber", {
  help: "the barber pole animation demo — runs in the GUI and on the console", syntax: "barber [-c]",
  run(sh, args) { if (demoWantsConsole(sh, args)) barberText(sh); else Apps.launch("barber", { seat: sh.seat }); }
});

      H: ["11000110", "11000110", "11000110", "11111110", "11000110", "11000110", "11000110", "00000000"],
      e: ["00000000", "00000000", "01111100", "11000110", "11111110", "11000000", "01111110", "00000000"],

/* ---------------------------- display-cfg -------------------------------
   Multi-seat, added in 0.14.1: more than one person at one machine, each
   with their own keyboard, mouse and screen, and their own windows.
   ------------------------------------------------------------------------ */
Apps.define({
  name: "display-cfg", path: "/app/display-cfg", caption: "Display Configuration", w: 470, h: 330,
  singleton: true,
  start(t, w) {
    const box = el("div", { style: { position: "absolute", inset: "0", background: "var(--face)", display: "flex", flexDirection: "column", padding: "8px", gap: "8px" } });
    const tabs = el("div", { class: "tabset" });
    const body = el("div", { class: "tabbody" });
    const dp = () => Sys.phoneTo(t, "INTERFACE_DISPCFG", "display");
    const seats = Ui.list({ onSelect: () => refreshDevs() });
    const devs = Ui.list({});
    const avail = Ui.list({});
    let cur = null;

    function refresh() {
      const p = dp();
      if (!p) { seats.setRows(["(display server not running)"]); return; }
      const r = Spartan.call(p, "DISPCFG_GET_SEAT_LIST", {});
      if (r.rc !== E.EOK) { seats.setRows(["(" + errName(r.rc) + ")"]); return; }
      seats.setRows(r.seats, (row, s) => { row.textContent = s.name; });
      if (r.seats.length) { seats.select(Math.min(seats._sel == null ? 0 : seats._sel, r.seats.length - 1)); }
      refreshDevs();
    }
    function refreshDevs() {
      const p = dp(); if (!p) return;
      cur = seats.selected();
      if (!cur || !cur.name) { devs.setRows([]); return; }
      const r = Spartan.call(p, "DISPCFG_GET_ASGN_DEV_LIST", { seat: cur.name });
      devs.setRows(r.rc === E.EOK ? r.devs : [], (row, d) => { row.textContent = d.length > 44 ? "..." + d.slice(-42) : d; });
      /* the pool of devices the location service knows about */
      const lp = Sys.phoneTo(t, "INTERFACE_LOC_CONSUMER", "loc");
      const all = [];
      if (lp) for (const cat of ["keyboard", "mouse", "display-device"]) {
        const c = Spartan.call(lp, "LOC_CATEGORY_GET_SVCS", { cat });
        if (c.rc === E.EOK) for (const s of c.svcs) if (all.indexOf(s.name) < 0) all.push(s.name);
      }
      avail.setRows(all, (row, d) => { row.textContent = d.length > 44 ? "..." + d.slice(-42) : d; });
    }

    const seatPane = el("div", { class: "col", style: { height: "100%" } });
    const srow = el("div", { class: "row" });
    srow.append(
      Ui.btn("Add...", () => {
        const nm = ["Bob", "Carol", "Dave"][Spartan.first("display").state.seats.length - 1] || ("Seat" + irnd(2, 99));
        const p = dp(); if (!p) return;
        const r = Spartan.call(p, "DISPCFG_SEAT_CREATE", { name: nm });
        if (r.rc !== E.EOK) { Ui.msg(w, "Error", "Cannot create seat: " + errName(r.rc) + "\n" + errText(r.rc)); return; }
        Sim.seatCreated(r.id, nm);
        refresh();
      }, { small: true }),
      Ui.btn("Remove", () => {
        const s = seats.selected(); if (!s || !s.name) return;
        const p = dp(); if (!p) return;
        const r = Spartan.call(p, "DISPCFG_SEAT_DELETE", { name: s.name });
        if (r.rc !== E.EOK) Ui.msg(w, "Error", "Cannot delete seat: " + errName(r.rc) + "\n" + errText(r.rc));
        refresh();
      }, { small: true }));
    seatPane.append(el("div", null, "Seats:"), seats, srow);
    const devPane = el("div", { class: "col", style: { height: "100%" } });
    const drow = el("div", { class: "row" });
    drow.append(
      Ui.btn("Assign >>", () => {
        const d = avail.selected(), s = seats.selected();
        if (!d || !s) return;
        const p = dp(); if (!p) return;
        Spartan.call(p, "DISPCFG_DEV_ASSIGN", { dev: d, seat: s.name });
        refreshDevs();
      }, { small: true }),
      Ui.btn("Unassign", () => {
        const d = devs.selected(); if (!d) return;
        const p = dp(); if (!p) return;
        Spartan.call(p, "DISPCFG_DEV_UNASSIGN", { dev: d });
        refreshDevs();
      }, { small: true }));
    devPane.append(el("div", null, "Devices on this seat:"), devs, el("div", null, "All input and display devices:"), avail, drow);

    const bodies = [];
    const mkTab = (name, pane) => {
      const b = el("div", null, name);
      bodies.push({ b, pane });
      b.addEventListener("click", () => { bodies.forEach(x => x.b.classList.toggle("on", x.b === b)); body.innerHTML = ""; body.appendChild(pane); });
      tabs.appendChild(b);
    };
    mkTab("Seats", seatPane);
    mkTab("Devices", devPane);
    box.append(tabs, body);
    const foot = el("div", { class: "tiny", style: { color: "#333" } },
      "Give a second seat a keyboard, a mouse and a display device and the screen splits: two people, one machine, one display server.");
    box.appendChild(foot);
    w.body.appendChild(box);
    bodies[0].b.click();
    refresh();
  }
});

Apps.define({

  start(t, w) {
    const wrap = el("div", { class: "ex-body", style: { display: "flex", flexDirection: "column" } });
    const tools = el("div", { class: "ipcv-tools" });
    const filter = el("select");
    for (const o of [["all", "everything"], ["srv", "servers only"], ["drv", "drivers only"], ["app", "applications only"]])
      filter.appendChild(el("option", { value: o[0] }, o[1]));
    const info = el("span", { style: { color: "#8fa3bd", fontSize: "11px" } }, "");
    tools.append(el("label", null, "Show:"), filter, el("span", { style: { flex: "1 1 auto" } }), info);
    const scroll = el("div", { style: { flex: "1 1 auto", overflow: "auto", background: "#0b111b" } });
    const foot = el("div", { class: "ex-note", style: { margin: "0", borderRadius: "0", borderTop: "1px solid #2a3648" } },
      "Kill anything here. Nothing you kill can take the machine with it — that is the claim, and this is where you test it. Restarting a dead server is something you do; the system will not do it for you. The ",
      el("b", null, "source"), " column is the real line count for that component in the HelenOS tree.");

    const render = () => {

        el("th", null, "phones"), el("th", null, "resident"),
        el("th", { title: "Lines of C in the real HelenOS tree for this component" }, "source"),
        el("th", null, "")));
      for (const x of tasks) {
        const [r, rs] = binSuffix(x.resmem);
        const kill = el("button", { class: "hbtn sm" }, x.kind === "kernel" ? "—" : "Kill");
        kill.style.padding = "0 7px";
        if (x.kind === "kernel") { kill.disabled = true; kill.title = "The kernel is not a userspace task. You cannot kill it from here, and that is the one thing on this list you cannot kill."; }
        else kill.addEventListener("click", ev => { ev.stopPropagation(); Sim.killFromUi(x); });
        const loc = srcLines(x.name);
        const tr = el("tr", null,
          el("td", null, String(x.tid)),
          el("td", null, el("b", null, x.name)),

          el("td", null, String(x.fibrils.length)),
          el("td", null, String(x.phones.length)),

        if (x.kind === "kernel") {
          tr.style.background = "#e8e8e8";
          tr.title = "The kernel: scheduling, memory and IPC. It has no userspace address space, which is why there is no resident figure. Everything else on this list runs above it.";
        }

/* ---- The IPC visualiser ------------------------------------------------
   It subscribes to the kernel's message bus like any other tap.  No server
   anywhere in this file knows it exists, and that is the point: remove this
   window and the system behaves identically.
   ------------------------------------------------------------------------ */
Apps.define({
  name: "ipcvis", path: "(exhibit)", caption: "IPC Visualiser — exhibit instrument",
  w: 720, h: 440, exhibit: true, singleton: true,
  start(t, w) {
    const wrap = el("div", { class: "ipcv-wrap" });
    const tools = el("div", { class: "ipcv-tools" });
    const sel = el("select");
    const pauseBtn = el("button", null, "Pause");
    const clearBtn = el("button", null, "Clear");
    const trailBtn = el("button", { class: "on" }, "Trails");
    const counter = el("span", { style: { color: "#8fa3bd", fontSize: "11px", marginLeft: "auto" } }, "");
    tools.append(el("label", null, "Filter:"), sel, pauseBtn, clearBtn, trailBtn, counter);
    const split = el("div", { class: "ipcv-split" });
    const graphBox = el("div", { class: "ipcv-graph" });
    const cv = el("canvas", { id: "ipcv-canvas", style: { width: "100%", height: "100%" } });
    graphBox.appendChild(cv);
    const logBox = el("div", { class: "ipcv-log" });
    split.append(graphBox, logBox);
    wrap.append(tools, split);
    w.body.appendChild(wrap);

    let paused = false, trails = State.get("ipcTrails", true), filterTid = 0;
    trailBtn.classList.toggle("on", trails);
    let msgs = [], flights = [], nodes = new Map(), total = 0;
    const bandTop = [0, 0, 0, 0, 0];
    const LAYER = { kernel: 0, srv: 1, drv: 2, app: 3 };

    const unsub = Spartan.subscribe(ev => {
      if (paused) return;
      if (ev.kind === "call") {
        total++;
        if (filterTid && ev.from !== filterTid && ev.to !== filterTid) return;
        msgs.push(ev);
        if (msgs.length > 160) msgs.shift();
        flights.push({ from: ev.from, to: ev.to, t: 0, rc: ev.rc, method: ev.method });
        if (flights.length > 90) flights.shift();
        logLine(ev);
      } else if (ev.kind === "task-exit" || ev.kind === "task-start") {
        logEvent(ev);
      }
    });

    function logLine(ev) {
      const d = el("div", { class: "l" + (ev.failed ? " err" : "") });
      d.innerHTML = '<span class="f">' + esc(ev.fromName) + '</span> → <span class="t">' + esc(ev.toName) +
        '</span> <span class="m">' + esc(ev.method) + '</span> <span class="rc">' + esc(errName(ev.rc)) + "</span>";
      logBox.appendChild(d);
      while (logBox.children.length > 220) logBox.removeChild(logBox.firstChild);
      logBox.scrollTop = logBox.scrollHeight;
    }
    function logEvent(ev) {
      const d = el("div", { class: "l" + (ev.kind === "task-exit" ? " err" : "") });
      d.innerHTML = '<span class="m">' + (ev.kind === "task-exit" ? "task exit " : "task start ") + esc(ev.name) + " (" + ev.tid + ")" +
        (ev.reason ? " — " + esc(ev.reason) : "") + "</span>";
      logBox.appendChild(d);
      logBox.scrollTop = logBox.scrollHeight;
    }
    function refreshFilter() {
      const cur = sel.value;
      sel.innerHTML = "";
      sel.appendChild(el("option", { value: "0" }, "all tasks"));
      for (const x of Spartan.list()) sel.appendChild(el("option", { value: String(x.tid) }, x.name + " (" + x.tid + ")"));
      sel.value = cur && Spartan.get(parseInt(cur, 10)) ? cur : "0";
      filterTid = parseInt(sel.value, 10) || 0;
    }
    sel.addEventListener("change", () => { filterTid = parseInt(sel.value, 10) || 0; });
    pauseBtn.addEventListener("click", () => { paused = !paused; pauseBtn.textContent = paused ? "Resume" : "Pause"; pauseBtn.classList.toggle("on", paused); });
    clearBtn.addEventListener("click", () => { msgs = []; flights = []; logBox.innerHTML = ""; });
    trailBtn.addEventListener("click", () => { trails = !trails; trailBtn.classList.toggle("on", trails); State.set("ipcTrails", trails); });

    function layout() {
      const W = cv.width, H = cv.height;
      nodes = new Map();
      const groups = { 0: [], 1: [], 2: [], 3: [] };
      for (const x of Spartan.list()) groups[LAYER[x.kind] === undefined ? 1 : LAYER[x.kind]].push(x);
      const order = [3, 1, 2, 0];   /* apps at the top, kernel at the bottom */
      /* Each band wraps onto as many rows as it needs; a machine with sixty
         tasks is a normal machine here, and all sixty deserve to be drawn. */
      const perRow = Math.max(3, Math.floor(W / 76));
      const bandCounts = order.map(g => Math.max(1, Math.ceil(groups[g].length / perRow)));
      const totalRows = bandCounts.reduce((a, b) => a + b, 0);
      const rowH = Math.max(19, (H - 34) / Math.max(1, totalRows));
      let row = 0;
      order.forEach((g, gi) => {
        const arr = groups[g];
        const rowsHere = bandCounts[gi];
        bandTop[gi] = 26 + row * rowH;
        for (let r = 0; r < rowsHere; r++) {
          const slice = arr.slice(r * perRow, (r + 1) * perRow);
          const y = 26 + (row + r) * rowH + rowH / 2;
          const step = W / (slice.length + 1);
          slice.forEach((x, i) => nodes.set(x.tid, { x: step * (i + 1), y, task: x, g }));
        }
        row += rowsHere;
      });
      bandTop[4] = 26 + row * rowH;
    }
    function draw() {
      const tk = Spartan.get(t.tid);
      if (!tk || !tk.alive || !w.node) { unsub(); return; }
      const W = graphBox.clientWidth, H = graphBox.clientHeight;
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
      layout();
      const g = cv.getContext("2d");
      g.fillStyle = "#0a0f18"; g.fillRect(0, 0, W, H);
      const LB = ["applications", "servers", "drivers", "kernel"];
      g.font = "9px var(--mono), monospace"; g.textAlign = "left";
      for (let i = 0; i < 4; i++) {
        const y = bandTop[i];
        g.strokeStyle = "#141d2c"; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
        g.fillStyle = "#38465e"; g.fillText(LB[i], 4, y - 3);
      }
      /* standing phone connections */
      g.lineWidth = 1;
      for (const x of Spartan.list()) {
        const a = nodes.get(x.tid); if (!a) continue;
        for (const p of x.phones) {
          const b = nodes.get(p.callee); if (!b) continue;
          if (filterTid && x.tid !== filterTid && p.callee !== filterTid) continue;
          g.strokeStyle = "#182334";
          g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
        }
      }
      /* messages in flight */
      for (const f of flights) {
        const a = nodes.get(f.from), b = nodes.get(f.to);
        f.t += 0.055;
        if (!a || !b || f.t > 1.35) continue;
        const p = clamp(f.t, 0, 1);
        const x = a.x + (b.x - a.x) * p, y = a.y + (b.y - a.y) * p;
        if (trails) {
          g.strokeStyle = f.rc === 0 ? "rgba(94,234,212,0.30)" : "rgba(248,113,113,0.30)";
          g.lineWidth = 1.5;
          g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(x, y); g.stroke();
        }
        g.fillStyle = f.rc === 0 ? "#5eead4" : "#f87171";
        g.beginPath(); g.arc(x, y, 3.2, 0, 7); g.fill();
      }
      flights = flights.filter(f => f.t <= 1.35);
      /* the tasks themselves */
      g.textAlign = "center";
      for (const [tid, n] of nodes) {
        const x = n.task;
        const busy = flights.some(f => (f.from === tid || f.to === tid) && f.t < 1);
        g.fillStyle = x.kind === "kernel" ? "#3b4a66" : x.kind === "drv" ? "#8a5a2b" : x.kind === "app" ? "#3a5a86" : "#245c55";
        if (busy) g.fillStyle = x.kind === "kernel" ? "#5b6f96" : "#5eead4";
        const label = x.name;
        g.font = "9.5px var(--mono), monospace";
        const tw = Math.max(26, g.measureText(label).width + 10);
        g.beginPath();
        const rx = n.x - tw / 2, ry = n.y - 8;
        g.rect(rx, ry, tw, 16); g.fill();
        g.strokeStyle = busy ? "#a7f3e8" : "#1d2a3d"; g.lineWidth = 1; g.stroke();
        g.fillStyle = busy && x.kind !== "kernel" ? "#04211d" : "#dbe6f5";
        g.fillText(label, n.x, n.y + 3.5);
      }
      counter.textContent = total.toLocaleString() + " calls  ·  " + Spartan.list().length + " tasks";
      raf = requestAnimationFrame(draw);
    }

/* ==========================================================================
   MODULE 28 — STATE MANAGER
   --------------------------------------------------------------------------
   Everything the visitor can change is kept in one place and written to
   LocalStorage.  Nothing else in this file touches storage.
   ========================================================================== */
const State = (() => {
  const KEY = "helenos-exhibit-v1";
  let data = {};
  let saveTimer = null;
  function load() {
    try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }
    catch (e) { data = {}; }
    return data;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { }
  }
  function dirty() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { snapshotFiles(); save(); }, 600); }
  function get(k, dflt) { return data[k] === undefined ? dflt : data[k]; }
  function set(k, v) { data[k] = v; dirty(); }
  function reset() { data = {}; try { localStorage.removeItem(KEY); } catch (e) { } }

  /* Only what the visitor wrote is stored: /w (the writable tree) plus any
     file they created elsewhere on the root filesystem. */
  function snapshotFiles() {
    const img = Media.images.initrd;
    if (!img) return;
    const files = {}, dirs = [];
    const walk = (n, path) => {
      if (n.k === "f") { if (n._user) files[path] = n.d; return; }
      if (n._user && path) dirs.push(path);
      for (const k in n.c) walk(n.c[k], path + "/" + k);
    };
    walk(img, "");
    data.files = files;
    data.dirs = dirs;
    const d = Spartan.first("display");
    if (d) {
      data.windows = Array.from(d.state.wins.values())
        .filter(x => !x.exhibit || true)
        .map(x => {
          const tk = Spartan.get(x.tid);
          return tk ? { app: tk.name, x: x.x, y: x.y, w: x.w, h: x.h, seat: x.seat, min: x.min } : null;
        }).filter(Boolean);
      data.seats = d.state.seats.map(s => ({ id: s.id, name: s.name }));
    }
  }
  function restoreFiles() {
    const img = Media.images.initrd;
    if (!img) return;
    for (const p of (data.dirs || [])) { const d = FsTree.mkdirp(img, p); if (d) d._user = true; }
    for (const p in (data.files || {})) {
      const n = FsTree.put(img, p, data.files[p]);
      if (n) n._user = true;
    }
  }
  load();
  return { get, set, dirty, save, reset, load, restoreFiles, snapshotFiles, raw: () => data };
})();
