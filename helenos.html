/* ==========================================================================
   MODULE 14 — THE HUMAN INTERFACE SERVERS
   --------------------------------------------------------------------------
   input, output, console and display.  Not X11.  Not Wayland.  Not a port of
   anything: HelenOS's graphics stack starts at the framebuffer driver and
   ends at the widget, and every layer of it is a program in this list.
   ========================================================================== */

Servers.define({
  name: "input", path: "/srv/hid/input", kind: "srv", iface: "INTERFACE_INPUT",
  threads: 2, fibrils: ["input-kbd", "input-mouse"], resmem: 88 * 1024, virtmem: 600 * 1024,
  blurb: "Collects keystrokes and pointer movement from the keyboard and mouse drivers and hands them on. Kill it and the machine stops listening.",
  start(t, args) {
    t.state.kbd = []; t.state.mouse = []; t.state.svc = (args && args[0]) || "hid/input";
    const lp = Sys.phoneTo(t, "INTERFACE_LOC_CONSUMER", "loc");
    if (lp) {
      for (const cat of ["keyboard", "mouse"]) {
        const r = Spartan.call(lp, "LOC_CATEGORY_GET_SVCS", { cat });
        if (r.rc === E.EOK) for (const s of r.svcs) {
          const conn = locConnect(t.tid, s.name, "INTERFACE_DDF_CLIENT");
          if (conn.rc === E.EOK) t.state[cat === "keyboard" ? "kbd" : "mouse"].push({ name: s.name, phone: conn.phone });
        }
      }
    }
    locRegisterServer(t);
    locRegisterService(t, t.state.svc, [], "INTERFACE_INPUT");
    Sys.serviceRegister(t, "INTERFACE_INPUT");
    return E.EOK;
  },
  answer(t, c) {
    if (c.method === "INPUT_ACTIVATE") return { rc: E.EOK };
    if (c.method === "INPUT_POLL") {
      /* A real key press really does come up through a driver. */
      const d = t.state.kbd[0];
      if (d && !d.phone.hungup) Spartan.call(d.phone, "KBD_POLL", {});
      return { rc: E.EOK };
    }
    return { rc: E.ENOTSUP };
  },
  onDeath(t) { Sim.inputLost(); }
});

Servers.define({
  name: "output", path: "/srv/hid/output", kind: "srv", iface: "INTERFACE_OUTPUT",
  resmem: 76 * 1024, virtmem: 520 * 1024,
  blurb: "Owns the framebuffer or the EGA text buffer on behalf of everybody above it.",
  start(t, args) {
    t.state.svc = (args && args[0]) || "hid/output";
    const lp = Sys.phoneTo(t, "INTERFACE_LOC_CONSUMER", "loc");
    if (lp) {
      const r = Spartan.call(lp, "LOC_CATEGORY_GET_SVCS", { cat: "display-device" });
      if (r.rc === E.EOK && r.svcs.length) {
        const conn = locConnect(t.tid, r.svcs[0].name, "INTERFACE_DDF_CLIENT");
        if (conn.rc === E.EOK) { t.state.dev = conn.phone; t.state.devName = r.svcs[0].name; }
      }
    }
    locRegisterServer(t);
    locRegisterService(t, t.state.svc, [], "INTERFACE_OUTPUT");
    Sys.serviceRegister(t, "INTERFACE_OUTPUT");
    return E.EOK;
  },
  answer(t, c) {
    if (c.method === "OUTPUT_YIELD" || c.method === "OUTPUT_CLAIM") return { rc: E.EOK };
    if (c.method === "OUTPUT_UPDATE") {
      if (t.state.dev && !t.state.dev.hungup) return Spartan.call(t.state.dev, "DDEV_UPDATE", {});
      return { rc: E.EHANGUP };
    }
    if (c.method === "OUTPUT_GET_DIMENSIONS") return { rc: E.EOK, cols: 80, rows: 25 };
    return { rc: E.ENOTSUP };
  }
});

Servers.define({
  name: "console", path: "/srv/hid/console", kind: "srv", iface: "INTERFACE_CONSOLE",
  threads: 2, fibrils: ["con-input", "con-conn"], resmem: 104 * 1024, virtmem: 700 * 1024,
  blurb: "The text console server: six virtual consoles, switched with F1-F6, each published in the location service as term/vcN.",
  start(t, args) {
    t.state.vcs = [];
    for (let i = 0; i < 6; i++) t.state.vcs.push({ name: "term/vc" + i, lines: [], input: "", tid: null });
    t.state.active = 0;
    t.state.in = Sys.phoneTo(t, "INTERFACE_INPUT", "input");
    t.state.out = Sys.phoneTo(t, "INTERFACE_OUTPUT", "output");
    locRegisterServer(t);
    for (const vc of t.state.vcs) locRegisterService(t, vc.name, ["console"], "INTERFACE_CONSOLE");
    Sys.serviceRegister(t, "INTERFACE_CONSOLE");
    return E.EOK;
  },
  answer(t, c) {
    const S = t.state;
    switch (c.method) {
      case "CONSOLE_WRITE": {
        const vc = S.vcs[c.args.vc == null ? S.active : c.args.vc];
        if (!vc) return { rc: E.ENOENT };
        vc.lines.push(c.args.text);
        if (vc.lines.length > 500) vc.lines.shift();
        if (S.out && !S.out.hungup) Spartan.call(S.out, "OUTPUT_UPDATE", {});
        return { rc: E.EOK };
      }
      case "CONSOLE_READ": return { rc: E.EOK, text: "" };
      case "CONSOLE_GET_SIZE": return { rc: E.EOK, cols: 80, rows: 25 };
      case "CONSOLE_SET_VC": S.active = clamp(c.args.vc | 0, 0, S.vcs.length - 1); return { rc: E.EOK };
      case "CONSOLE_GET_VCS": return { rc: E.EOK, vcs: S.vcs.map(v => v.name) };
      default: return { rc: E.ENOTSUP };
    }
  }
});

/* ==========================================================================
   MODULE 15 — display, THE DISPLAY SERVER
   --------------------------------------------------------------------------
   Windows, seats, focus and stacking live here, in an ordinary task with a
   task id you can read off the task list.  Applications do not draw on the
   screen; they ask this program to, over a phone.  When this program dies,
   the screen goes away and the rest of the machine does not.
   ========================================================================== */
Servers.define({
  name: "display", path: "/srv/hid/display", kind: "srv", iface: "INTERFACE_DISPLAY",
  threads: 3, fibrils: ["disp-conn", "disp-input", "disp-render"], resmem: 264 * 1024, virtmem: 2100 * 1024,
  blurb: "The display server: windows, focus, stacking order, cursors and seats. Kill it and the GUI is gone while the system underneath keeps running.",
  start(t) {
    t.state.wins = new Map();
    t.state.nextWid = 1;
    t.state.z = 10;
    t.state.seats = [{ id: 1, name: "Alice", devices: [] }];
    t.state.focus = {};
    t.state.nextSeat = 2;
    t.state.in = Sys.phoneTo(t, "INTERFACE_INPUT", "input");
    t.state.out = Sys.phoneTo(t, "INTERFACE_OUTPUT", "output");
    Sys.serviceRegister(t, "INTERFACE_DISPLAY");
    Sys.serviceRegister(t, "INTERFACE_DISPCFG");
    Sys.serviceRegister(t, "INTERFACE_WNDMGT");
    locRegisterServer(t);
    locRegisterService(t, "hid/display", [], "INTERFACE_DISPLAY");
    /* Every input device the location service knows about starts out on
       the first seat, which is what a single-seat machine looks like. */
    const lp = Sys.phoneTo(t, "INTERFACE_LOC_CONSUMER", "loc");
    if (lp) for (const cat of ["keyboard", "mouse", "display-device"]) {
      const r = Spartan.call(lp, "LOC_CATEGORY_GET_SVCS", { cat });
      if (r.rc === E.EOK) for (const s of r.svcs) t.state.seats[0].devices.push(s.name);
    }
    return E.EOK;
  },
  answer(t, c) {
    const S = t.state;
    switch (c.method) {
      case "DISPLAY_GET_INFO": return { rc: E.EOK, w: Screen.width(), h: Screen.height(), seats: S.seats.length };
      case "DISPLAY_WINDOW_CREATE": {
        const wid = S.nextWid++;
        const seat = c.args.seat || S.seats[0].id;
        const w = {
          wid, tid: c.args.tid, caption: c.args.caption || "Window", seat,
          x: c.args.x, y: c.args.y, w: c.args.w || 400, h: c.args.h || 260,
          min: false, max: false, z: ++S.z, exhibit: !!c.args.exhibit,
          style: c.args.style || {}, node: null
        };
        S.wins.set(wid, w);
        Screen.createWindow(w);
        S.focus[seat] = wid;
        Screen.sync();
        return { rc: E.EOK, wid };
      }
      case "DISPLAY_WINDOW_DESTROY": {
        const w = S.wins.get(c.args.wid); if (!w) return { rc: E.ENOENT };
        Screen.destroyWindow(w); S.wins.delete(c.args.wid);
        if (S.focus[w.seat] === w.wid) S.focus[w.seat] = Screen.topWid(w.seat);
        Screen.sync();
        return { rc: E.EOK };
      }
      case "DISPLAY_WINDOW_SET_CAPTION": {
        const w = S.wins.get(c.args.wid); if (!w) return { rc: E.ENOENT };
        w.caption = c.args.caption; Screen.sync(); return { rc: E.EOK };
      }
      case "DISPLAY_WINDOW_MINIMIZE": {
        const w = S.wins.get(c.args.wid); if (!w) return { rc: E.ENOENT };
        w.min = true; if (S.focus[w.seat] === w.wid) S.focus[w.seat] = Screen.topWid(w.seat);
        Screen.sync(); return { rc: E.EOK };
      }
      case "DISPLAY_WINDOW_UNMINIMIZE": {
        const w = S.wins.get(c.args.wid); if (!w) return { rc: E.ENOENT };
        w.min = false; w.z = ++S.z; S.focus[w.seat] = w.wid; Screen.sync(); return { rc: E.EOK };
      }
      case "DISPLAY_WINDOW_MAXIMIZE": {
        const w = S.wins.get(c.args.wid); if (!w) return { rc: E.ENOENT };
        w.saved = { x: w.x, y: w.y, w: w.w, h: w.h }; w.max = true; Screen.sync(); return { rc: E.EOK };
      }
      case "DISPLAY_WINDOW_UNMAXIMIZE": {
        const w = S.wins.get(c.args.wid); if (!w) return { rc: E.ENOENT };
        w.max = false; if (w.saved) Object.assign(w, w.saved); Screen.sync(); return { rc: E.EOK };
      }
      case "DISPLAY_WINDOW_MOVE": {
        const w = S.wins.get(c.args.wid); if (!w) return { rc: E.ENOENT };
        w.x = c.args.x; w.y = c.args.y; Screen.place(w); return { rc: E.EOK };
      }
      case "DISPLAY_WINDOW_RESIZE": {
        const w = S.wins.get(c.args.wid); if (!w) return { rc: E.ENOENT };
        w.w = Math.max(160, c.args.w); w.h = Math.max(80, c.args.h); Screen.place(w); return { rc: E.EOK };
      }
      case "DISPLAY_WINDOW_FOCUS": {
        const w = S.wins.get(c.args.wid); if (!w) return { rc: E.ENOENT };
        w.min = false; w.z = ++S.z; S.focus[w.seat] = w.wid; Screen.sync(); return { rc: E.EOK };
      }
      case "DISPLAY_WINDOW_LIST":
        return {
          rc: E.EOK, wins: Array.from(S.wins.values())
            .filter(w => c.args.seat == null || w.seat === c.args.seat)
            .sort((a, b) => a.wid - b.wid)
            .map(w => ({ wid: w.wid, caption: w.caption, tid: w.tid, min: w.min, seat: w.seat, focus: S.focus[w.seat] === w.wid }))
        };
      /* ---- multi-seat configuration (DISPCFG), new in 0.14.1 ---- */
      case "DISPCFG_GET_SEAT_LIST": return { rc: E.EOK, seats: S.seats.map(s => ({ id: s.id, name: s.name })) };
      case "DISPCFG_SEAT_CREATE": {
        if (S.seats.some(s => s.name === c.args.name)) return { rc: E.EEXIST };
        if (S.seats.length >= 3) return { rc: E.ELIMIT };
        const s = { id: S.nextSeat++, name: c.args.name, devices: [] };
        S.seats.push(s); Screen.rebuild(); return { rc: E.EOK, id: s.id };
      }
      case "DISPCFG_SEAT_DELETE": {
        const i = S.seats.findIndex(s => s.name === c.args.name || s.id === c.args.id);
        if (i < 0) return { rc: E.ENOENT };
        if (S.seats.length === 1) return { rc: E.EBUSY };
        const gone = S.seats.splice(i, 1)[0];
        for (const w of Array.from(S.wins.values())) if (w.seat === gone.id) { Screen.destroyWindow(w); S.wins.delete(w.wid); const tk = Spartan.get(w.tid); if (tk) Spartan.kill(tk.tid, "seat removed"); }
        Screen.rebuild(); return { rc: E.EOK };
      }
      case "DISPCFG_DEV_ASSIGN": {
        const s = S.seats.find(x => x.name === c.args.seat || x.id === c.args.seatId);
        if (!s) return { rc: E.ENOENT };
        for (const o of S.seats) o.devices = o.devices.filter(d => d !== c.args.dev);
        s.devices.push(c.args.dev); return { rc: E.EOK };
      }
      case "DISPCFG_DEV_UNASSIGN": {
        for (const o of S.seats) o.devices = o.devices.filter(d => d !== c.args.dev);
        return { rc: E.EOK };
      }
      case "DISPCFG_GET_ASGN_DEV_LIST": {
        const s = S.seats.find(x => x.name === c.args.seat || x.id === c.args.seatId);
        return s ? { rc: E.EOK, devs: s.devices.slice() } : { rc: E.ENOENT };
      }
      default: return { rc: E.ENOTSUP };
    }
  },
  onDeath(t) {
    /* Every window belonged to this server.  They go.  So do the tasks that
       owned them, because their display phone just hung up and a UI program
       with no display has nothing left to do.  Everything else carries on. */
    for (const w of Array.from(t.state.wins.values())) {
      Screen.destroyWindow(w);
      const owner = Spartan.get(w.tid);
      if (owner && owner.alive) Spartan.kill(owner.tid, "display connection hung up");
    }
    t.state.wins.clear();
    Screen.rebuild();
  }
});

/* ==========================================================================
   MODULE 16 — THE SCREEN
   --------------------------------------------------------------------------
   The pixels.  This module is the framebuffer: it draws whatever the display
   server tells it to, and when there is no display server it draws the text
   console instead.  It holds no policy of its own.
   ========================================================================== */
const Screen = (() => {
  const host = () => $("#screens");
  let seatNodes = new Map();   /* seat id -> { root, desk, taskbar } */
  let conNode = null;
  let conTaskbar = null;
  let dragging = null;

  function disp() { return Spartan.first("display"); }
  function width() { return host().clientWidth || 1024; }
  function height() { return host().clientHeight || 700; }

  /* ---------------- structure ---------------- */
  function rebuild() {
    const h = host();
    h.innerHTML = "";
    seatNodes = new Map(); conNode = null;
    const d = disp();
    if (!d) { buildConsole(h); Console.draw(); return; }
    for (const s of d.state.seats) {
      const root = el("div", { class: "seat", "data-seat": s.id });
      const desk = el("div", { class: "desk" });
      root.appendChild(desk);
      if (d.state.seats.length > 1) root.appendChild(el("div", { class: "seat-label" }, "seat: " + s.name));
      const tbar = el("div", { class: "taskbar hidden" });
      root.appendChild(tbar);
      h.appendChild(root);
      seatNodes.set(s.id, { root, desk, taskbar: tbar, seat: s });
      desk.addEventListener("mousedown", ev => { if (ev.target === desk) Menu.closeAll(); });
    }
    /* re-parent any windows that already exist */
    for (const w of d.state.wins.values()) { w.node = null; createWindow(w); }
    sync();
  }

  function buildConsole(h) {
    const root = el("div", { class: "seat" });
    conNode = el("div", { class: "con" });
    root.appendChild(conNode);
    /* Since 0.14.1 the taskbar runs in text mode as well, drawn by the same
       toolkit through its EGA back end.  If a taskbar task is running on the
       console, here it is. */
    const tb = Spartan.list().find(t => t.name === "taskbar" && t.state && t.state.console);
    if (tb) {
      const bar = el("div", { class: "taskbar textmode" });
      const start = el("button", { class: "tb-start" }, "Start");
      start.addEventListener("mousedown", ev => { ev.preventDefault(); ev.stopPropagation(); StartMenu.toggleConsole(tb, start); });
      const mid = el("div", { class: "tb-wins" });
      for (let i = 0; i < 6; i++) {
        const b = el("button", { class: "tb-win" + (i === Console.active() ? " act" : "") }, "vc" + i);
        b.addEventListener("click", () => Console.switchTo(i));
        mid.appendChild(b);
      }
      const clk = el("div", { class: "tb-clock" }, Clock.text());
      bar.append(start, mid, clk);
      root.appendChild(bar);
      tb.state.clockNode = clk;
      conTaskbar = bar;
    } else conTaskbar = null;
    root.appendChild(el("div", { class: "vcbar" },
      el("span", null, "HelenOS text console"),
      el("span", { class: "sp", style: { flex: "1 1 auto" } }),
      el("b", { id: "vcbar-name" }, "vc0"),
      el("span", null, "F1-F6 switch console  ·  F12 kernel console")));
    h.appendChild(root);
  }

  /* ---------------- windows ---------------- */
  function createWindow(w) {
    const sn = seatNodes.get(w.seat) || seatNodes.values().next().value;
    if (!sn) return;
    const node = el("div", { class: "win" + (w.exhibit ? " exhibit" : ""), "data-wid": w.wid });
    const title = el("div", { class: "wtitle" });
    const sys = el("div", { class: "wsys", title: "System menu (F10)" }, el("i"));
    const cap = el("div", { class: "wcap" }, w.caption);
    const btns = el("div", { class: "wbtns" });
    const bmin = el("button", { class: "wbtn", title: "Minimise" }, "_");
    const bmax = el("button", { class: "wbtn", title: "Maximise" }, "^");
    const bcls = el("button", { class: "wbtn", title: "Close" }, "X");
    if (w.style.noMin !== true) btns.appendChild(bmin);
    if (w.style.noMax !== true) btns.appendChild(bmax);
    btns.appendChild(bcls);
    title.append(sys, cap, btns);
    /* Reuse the window's existing body node when the screen is rebuilt, so
       that an application's contents survive a seat change or a display
       server restart happening under it. */
    const body = w.body || el("div", { class: "wbody" });
    if (body.parentNode) body.parentNode.removeChild(body);
    node.append(title, body);
    if (w.style.noResize !== true) {
      node.append(el("div", { class: "wedge n" }), el("div", { class: "wedge s" }),
        el("div", { class: "wedge w" }), el("div", { class: "wedge e" }),
        el("div", { class: "wgrip" }));
    }
    w.node = node; w.body = body; w.capNode = cap;

    node.addEventListener("mousedown", () => focus(w), true);
    cap.addEventListener("mousedown", ev => beginDrag(ev, w, "move"));
    cap.addEventListener("dblclick", () => toggleMax(w));
    sys.addEventListener("mousedown", ev => { ev.stopPropagation(); ev.preventDefault(); sysMenu(w, sys); });
    bmin.addEventListener("click", ev => { ev.stopPropagation(); App.call(w, "DISPLAY_WINDOW_MINIMIZE", { wid: w.wid }); });
    bmax.addEventListener("click", ev => { ev.stopPropagation(); toggleMax(w); });
    bcls.addEventListener("click", ev => { ev.stopPropagation(); App.close(w); });
    for (const dir of ["n", "s", "w", "e"]) {
      const e2 = node.querySelector(".wedge." + dir);
      if (e2) e2.addEventListener("mousedown", ev => beginDrag(ev, w, dir));
    }
    const grip = node.querySelector(".wgrip");
    if (grip) grip.addEventListener("mousedown", ev => beginDrag(ev, w, "se"));

    sn.desk.appendChild(node);
    if (w.x == null || w.y == null) cascade(w, sn);
    place(w);
  }

  let cascadeN = 0;
  function cascade(w, sn) {
    const dw = sn.desk.clientWidth || 900, dh = sn.desk.clientHeight || 600;
    const stepX = 30, stepY = 28;
    const colsX = Math.max(1, Math.floor((dw - w.w - 40) / stepX));
    const colsY = Math.max(1, Math.floor((dh - w.h - 40) / stepY));
    const n = cascadeN++;
    w.x = clamp(20 + (n % Math.max(1, Math.min(colsX, colsY))) * stepX, 4, Math.max(4, dw - w.w - 8));
    w.y = clamp(16 + (n % Math.max(1, Math.min(colsX, colsY))) * stepY, 4, Math.max(4, dh - w.h - 8));
  }

  function place(w) {
    if (!w.node) return;
    const sn = seatNodes.get(w.seat); if (!sn) return;
    const dw = sn.desk.clientWidth, dh = sn.desk.clientHeight;
    if (w.max) {
      Object.assign(w.node.style, { left: "0px", top: "0px", width: dw + "px", height: dh + "px" });
    } else {
      /* A window cannot be wider than the seat it is on — which matters the
         moment a second seat halves the screen. */
      w.w = Math.min(w.w, Math.max(160, dw - 8));
      w.h = Math.min(w.h, Math.max(80, dh - 8));
      w.x = clamp(w.x, -w.w + 60, Math.max(0, dw - 40));
      w.y = clamp(w.y, 0, Math.max(0, dh - 24));
      Object.assign(w.node.style, { left: Math.round(w.x) + "px", top: Math.round(w.y) + "px", width: Math.round(w.w) + "px", height: Math.round(w.h) + "px" });
    }
    w.node.style.zIndex = String(w.z);
    if (w.onResize) { try { w.onResize(); } catch (e) { } }
  }

  function destroyWindow(w) {
    if (w.node && w.node.parentNode) w.node.parentNode.removeChild(w.node);
    w.node = null; w.body = null; w.capNode = null;
  }

  function focus(w) {
    const d = disp(); if (!d) return;
    if (d.state.focus[w.seat] === w.wid && !w.min) { sync(); return; }
    App.call(w, "DISPLAY_WINDOW_FOCUS", { wid: w.wid });
  }
  function toggleMax(w) {
    App.call(w, w.max ? "DISPLAY_WINDOW_UNMAXIMIZE" : "DISPLAY_WINDOW_MAXIMIZE", { wid: w.wid });
    place(w);
  }
  function topWid(seat) {
    const d = disp(); if (!d) return null;
    let best = null;
    for (const w of d.state.wins.values()) if (w.seat === seat && !w.min && (!best || w.z > best.z)) best = w;
    return best ? best.wid : null;
  }

  /* ---------------- dragging ---------------- */
  function beginDrag(ev, w, mode) {
    if (ev.button !== 0) return;
    if (w.max && mode === "move") return;
    ev.preventDefault();
    Menu.closeAll();
    focus(w);
    dragging = { w, mode, sx: ev.clientX, sy: ev.clientY, ox: w.x, oy: w.y, ow: w.w, oh: w.h };
    document.body.style.cursor = mode === "move" ? "move" : "";
  }
  window.addEventListener("mousemove", ev => {
    if (!dragging) return;
    const { w, mode } = dragging;
    const dx = ev.clientX - dragging.sx, dy = ev.clientY - dragging.sy;
    if (mode === "move") { w.x = dragging.ox + dx; w.y = dragging.oy + dy; }
    else {
      if (mode.indexOf("e") >= 0 || mode === "se") w.w = Math.max(w.style.minW || 180, dragging.ow + dx);
      if (mode.indexOf("s") >= 0 || mode === "se") w.h = Math.max(w.style.minH || 90, dragging.oh + dy);
      if (mode === "w") { const nw = Math.max(w.style.minW || 180, dragging.ow - dx); w.x = dragging.ox + (dragging.ow - nw); w.w = nw; }
      if (mode === "n") { const nh = Math.max(w.style.minH || 90, dragging.oh - dy); w.y = dragging.oy + (dragging.oh - nh); w.h = nh; }
    }
    place(w);
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    const { w, mode } = dragging;
    dragging = null; document.body.style.cursor = "";
    /* One call at the end of the gesture, the way a real client batches. */
    App.call(w, mode === "move" ? "DISPLAY_WINDOW_MOVE" : "DISPLAY_WINDOW_RESIZE",
      mode === "move" ? { wid: w.wid, x: w.x, y: w.y } : { wid: w.wid, w: w.w, h: w.h });
  });

  /* ---------------- system menu ---------------- */
  function sysMenu(w, anchor) {
    const r = anchor.getBoundingClientRect();
    Menu.open(r.left, r.bottom, [
      { label: "~R~estore", disabled: !w.max, run: () => toggleMax(w) },
      { label: "~M~inimise", run: () => App.call(w, "DISPLAY_WINDOW_MINIMIZE", { wid: w.wid }) },
      { label: "Ma~x~imise", disabled: w.max, run: () => toggleMax(w) },
      { sep: true },
      { label: "~C~lose", accel: "Alt-F4", run: () => App.close(w) }
    ]);
  }

  /* ---------------- taskbar + sync ---------------- */
  function sync() {
    const d = disp();
    if (!d) return;
    for (const [sid, sn] of seatNodes) {
      const tb = Spartan.list().find(t => t.name === "taskbar" && t.state && t.state.seat === sid);
      if (!tb) { sn.taskbar.classList.add("hidden"); sn.taskbar.innerHTML = ""; continue; }
      sn.taskbar.classList.remove("hidden");
      renderTaskbar(sn, tb);
    }
    for (const w of d.state.wins.values()) {
      if (!w.node) continue;
      w.node.classList.toggle("min", !!w.min);
      w.node.classList.toggle("act", d.state.focus[w.seat] === w.wid);
      if (w.capNode && w.capNode.textContent !== w.caption) w.capNode.textContent = w.caption;
      w.node.style.zIndex = String(w.z);
      place(w);
    }
  }

  function renderTaskbar(sn, tb) {
    const d = disp();
    const bar = sn.taskbar;
    bar.innerHTML = "";
    const start = el("button", { class: "tb-start" }, el("span", { class: "glyph" }), "Start");
    start.addEventListener("mousedown", ev => { ev.preventDefault(); ev.stopPropagation(); StartMenu.toggle(tb, start, sn.seat.id); });
    bar.appendChild(start);
    const wins = el("div", { class: "tb-wins" });
    const list = Spartan.call(Sys.phoneTo(tb, "INTERFACE_WNDMGT", "display"), "DISPLAY_WINDOW_LIST", { seat: sn.seat.id });
    if (list.rc === E.EOK) for (const wi of list.wins) {
      const b = el("button", { class: "tb-win" + (wi.focus && !wi.min ? " act" : ""), title: wi.caption }, wi.caption);
      b.addEventListener("click", () => {
        const w = d.state.wins.get(wi.wid);
        if (!w) return;
        if (!wi.min && d.state.focus[w.seat] === w.wid) App.call(w, "DISPLAY_WINDOW_MINIMIZE", { wid: w.wid });
        else App.call(w, "DISPLAY_WINDOW_UNMINIMIZE", { wid: w.wid });
      });
      wins.appendChild(b);
    }
    bar.appendChild(wins);
    const clk = el("div", { class: "tb-clock" }, Clock.text());
    clk.title = "HelenOS " + REL + " (" + CODENAME + ")";
    bar.appendChild(clk);
    tb.state.clockNode = clk;
  }

  return { rebuild, createWindow, destroyWindow, place, sync, focus, topWid, width, height, seatNodes: () => seatNodes, conNode: () => conNode, conTaskbar: () => conTaskbar, disp };
})();

const Clock = {
  text() {
    const d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }
};

/* ==========================================================================
   MODULE 17 — THE UI TOOLKIT
   --------------------------------------------------------------------------
   Buttons, menus, entries, checkboxes, lists, scrollbars, tabs and dialogs,
   drawn the way HelenOS's own libui draws them.  It owes nothing to X11,
   nothing to Motif and nothing to any Western desktop lineage; it was
   written for this system, from the framebuffer upward.
   ========================================================================== */
const Menu = (() => {
  let open = [];
  function closeAll() { for (const m of open) if (m.parentNode) m.parentNode.removeChild(m); open = []; document.querySelectorAll(".mbar>div.open").forEach(n => n.classList.remove("open")); }
  function accel(label) {
    const frag = document.createDocumentFragment();
    const parts = String(label).split("~");
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) frag.appendChild(el("u", null, parts[i]));
      else if (parts[i]) frag.appendChild(document.createTextNode(parts[i]));
    }
    return frag;
  }
  function build(items, onPick) {
    const m = el("div", { class: "menu" });
    for (const it of items) {
      if (it.sep) { m.appendChild(el("div", { class: "msep" })); continue; }
      const row = el("div", { class: "mi" + (it.disabled ? " dis" : "") });
      row.appendChild(el("span", null, accel(it.label)));
      row.appendChild(el("span", { class: "acc" }, it.accel || ""));
      if (!it.disabled) row.addEventListener("click", () => { closeAll(); if (it.run) it.run(); if (onPick) onPick(it); });
      m.appendChild(row);
    }
    return m;
  }
  /* Menus pop up ABOVE the bar when they do not fit below it — 0.14.1. */
  function place(m, x, y, upIfTight) {
    document.body.appendChild(m);
    const r = m.getBoundingClientRect();
    let nx = x, ny = y;
    if (nx + r.width > window.innerWidth - 4) nx = Math.max(4, window.innerWidth - r.width - 4);
    if (ny + r.height > window.innerHeight - 4) ny = upIfTight != null ? Math.max(4, upIfTight - r.height) : Math.max(4, window.innerHeight - r.height - 4);
    m.style.left = Math.round(nx) + "px"; m.style.top = Math.round(ny) + "px";
  }
  function openMenu(x, y, items, opts) {
    closeAll();
    const m = build(items, opts && opts.onPick);
    place(m, x, y, opts && opts.above);
    open.push(m);
    return m;
  }
  window.addEventListener("mousedown", ev => { if (!ev.target.closest(".menu") && !ev.target.closest(".mbar") && !ev.target.closest(".tb-start") && !ev.target.closest(".wsys")) closeAll(); }, true);
  return { open: openMenu, closeAll, accel, isOpen: () => open.length > 0 };
})();

const Ui = {
  btn(label, onclick, opts) {
    const b = el("button", { class: "hbtn" + (opts && opts.small ? " sm" : "") + (opts && opts.dflt ? " dflt" : "") }, label);
    if (onclick) b.addEventListener("click", onclick);
    if (opts && opts.title) b.title = opts.title;
    return b;
  },
  entry(value, opts) {
    const i = el("input", { class: "hentry", type: (opts && opts.type) || "text", value: value == null ? "" : value });
    if (opts && opts.placeholder) i.placeholder = opts.placeholder;
    if (opts && opts.width) i.style.width = opts.width;
    i.addEventListener("keydown", ev => ev.stopPropagation());
    return i;
  },
  check(label, on, onchange, radio) {
    const c = el("label", { class: "hcheck" + (radio ? " hradio" : "") + (on ? " on" : "") }, el("i"), el("span", null, label));
    c.addEventListener("click", () => { c.classList.toggle("on"); if (onchange) onchange(c.classList.contains("on")); });
    return c;
  },
  group(title, ...kids) { return el("fieldset", { class: "hgroup" }, el("legend", null, title), ...kids); },
  list(opts) {
    const l = el("div", { class: "hlist" });
    l.setRows = (rows, render) => {
      l.innerHTML = "";
      rows.forEach((r, i) => {
        const row = el("div", { class: "row" });
        if (render) render(row, r, i); else row.textContent = String(r);
        row.addEventListener("click", () => { l.select(i); if (opts && opts.onSelect) opts.onSelect(r, i); });
        row.addEventListener("dblclick", () => { if (opts && opts.onOpen) opts.onOpen(r, i); });
        l.appendChild(row);
      });
      l._rows = rows;
      if (l._sel != null) l.select(Math.min(l._sel, rows.length - 1));
    };
    l.select = i => {
      l._sel = i;
      Array.from(l.children).forEach((n, j) => n.classList.toggle("sel", j === i));
      const n = l.children[i]; if (n && n.scrollIntoView) n.scrollIntoView({ block: "nearest" });
    };
    l.selected = () => (l._rows || [])[l._sel];
    return l;
  },
  bar(pct) { const b = el("div", { class: "hbar" }, el("i", { style: { width: clamp(pct, 0, 100) + "%" } })); return b; },
  menubar(win, defs) {
    const bar = el("div", { class: "mbar" });
    defs.forEach(d => {
      const n = el("div", null, Menu.accel(d.label));
      n.addEventListener("mousedown", ev => {
        ev.preventDefault(); ev.stopPropagation();
        if (n.classList.contains("open")) { Menu.closeAll(); return; }
        Menu.closeAll(); n.classList.add("open");
        const r = n.getBoundingClientRect();
        Menu.open(r.left, r.bottom, d.items, { above: r.top });
      });
      n.addEventListener("mouseenter", () => {
        if (!Menu.isOpen()) return;
        Menu.closeAll(); n.classList.add("open");
        const r = n.getBoundingClientRect();
        Menu.open(r.left, r.bottom, d.items, { above: r.top });
      });
      bar.appendChild(n);
    });
    return bar;
  },
  /* modal-ish message dialog, drawn as a real window on the same display */
  msg(owner, caption, text, buttons) {
    const w = App.window({
      caption, w: Math.max(280, Math.min(460, 40 + text.length * 6)), h: 130,
      seat: owner ? owner.seat : null, task: owner ? Spartan.get(owner.tid) : null,
      style: { noMin: true, noMax: true, noResize: true }
    });
    if (!w) return null;
    const body = el("div", { class: "pad col", style: { position: "absolute", inset: "0", background: "var(--face)" } });
    body.appendChild(el("div", { style: { flex: "1 1 auto", whiteSpace: "pre-wrap" } }, text));
    const row = el("div", { class: "row", style: { justifyContent: "center", gap: "10px" } });
    (buttons || [{ label: "OK" }]).forEach((b, i) => {
      row.appendChild(Ui.btn(b.label, () => { App.close(w); if (b.run) b.run(); }, { dflt: i === 0 }));
    });
    body.appendChild(row);
    w.body.appendChild(body);
    return w;
  }
};

/* ==========================================================================
   MODULE 18 — THE APPLICATION FRAMEWORK
   --------------------------------------------------------------------------
   An application is a task like any other.  It gets a phone to the display
   server and asks for a window.  It has no privileged access to anything:
   if vfs is not answering, the file dialog fails; if display is not
   answering, the application exits.  That is the whole contract.
   ========================================================================== */
const Apps = (() => {
  const defs = new Map();
  function define(d) { defs.set(d.name, d); return d; }
  function get(n) { return defs.get(n); }
  function all() { return Array.from(defs.values()); }

  function spawnTask(name, path, kind) {
    const t = Spartan.mkTask({
      name, path, kind: kind || "app", threads: 1, fibrils: ["main", "ui-events"],
      resmem: irnd(120, 420) * 1024, virtmem: irnd(700, 2600) * 1024,
      answer: c => ({ rc: E.ENOTSUP })
    });
    const ns = Spartan.first("ns");
    if (ns) Spartan.connect(t.tid, ns.tid, "INTERFACE_ANY", "ns");
    return t;
  }

  /** Launch a program by name.  Programs marked terminal:true are text-mode
      programs and are launched the way the real start menu launches them:
      by starting a Terminal, which starts them. */
  function launch(name, opts) {
    opts = opts || {};
    const def = defs.get(name);
    if (!def) return { rc: E.ENOENT };
    if (def.terminal && !opts.inTty) {
      return launch("terminal", { seat: opts.seat, cmd: name, args: opts.args });
    }
    if (def.singleton && Spartan.alive(name)) {
      const d = Screen.disp();
      if (d) for (const w of d.state.wins.values()) if (w.tid === Spartan.first(name).tid) { App.call(w, "DISPLAY_WINDOW_UNMINIMIZE", { wid: w.wid }); return { rc: E.EOK }; }
    }
    const t = spawnTask(name, def.path || ("/app/" + name), "app");
    t.state.seat = opts.seat || 1;
    const w = App.window({
      caption: def.caption || name, w: def.w || 480, h: def.h || 320,
      task: t, seat: t.state.seat, style: def.style || {}, exhibit: !!def.exhibit,
      x: opts.x, y: opts.y
    });
    if (!w) { Spartan.kill(t.tid, "no display"); return { rc: E.EHANGUP }; }
    t.state.win = w;
    try { def.start(t, w, opts); }
    catch (err) { Sim.serverFault(t, String(err && err.message || err)); }
    Screen.sync();
    return { rc: E.EOK, task: t, win: w };
  }
  return { define, get, all, launch, spawnTask };
})();

const App = {
  /** Ask the display server for a window.  This is a real IPC call: if the
      display server is dead the application does not get a window. */
  window(o) {
    const d = Spartan.first("display");
    if (!d) return null;
    const t = o.task;
    if (!t) return null;
    const ph = Sys.phoneTo(t, "INTERFACE_DISPLAY", "display");
    if (!ph) return null;
    const r = Spartan.call(ph, "DISPLAY_WINDOW_CREATE", {
      tid: t.tid, caption: o.caption, w: o.w, h: o.h, x: o.x, y: o.y,
      seat: o.seat || t.state.seat || 1, style: o.style || {}, exhibit: !!o.exhibit
    });
    if (r.rc !== E.EOK) return null;
    return d.state.wins.get(r.wid);
  },
  call(w, method, args) {
    const d = Spartan.first("display");
    if (!d || !w) return { rc: E.EHANGUP };
    const t = Spartan.get(w.tid);
    if (!t || !t.alive) {
      /* orphaned window: the display server tidies it up */
      const r = d.answer({ method: "DISPLAY_WINDOW_DESTROY", args: { wid: w.wid } });
      Screen.sync(); return r;
    }
    const ph = Sys.phoneTo(t, "INTERFACE_DISPLAY", "display");
    if (!ph) return { rc: E.EHANGUP };
    const r = Spartan.call(ph, method, args);
    Screen.sync();
    return r;
  },
  close(w) {
    if (!w) return;
    if (w.onClose) { try { if (w.onClose() === false) return; } catch (e) { } }
    const t = Spartan.get(w.tid);
    App.call(w, "DISPLAY_WINDOW_DESTROY", { wid: w.wid });
    if (t && t.alive) {
      const d = Spartan.first("display");
      const others = d ? Array.from(d.state.wins.values()).filter(x => x.tid === t.tid) : [];
      if (!others.length) Spartan.kill(t.tid, "exited");
    }
    Screen.sync();
  },
  setCaption(w, cap) { App.call(w, "DISPLAY_WINDOW_SET_CAPTION", { wid: w.wid, caption: cap }); }
};

/* ==========================================================================
   MODULE 19 — TTY: THE CHARACTER SCREEN
   --------------------------------------------------------------------------
   Shared by the Terminal window and by the six virtual consoles, because in
   HelenOS they really are the same thing seen from two directions.
   ========================================================================== */
function mkTty(opts) {
  const tty = {
    cols: (opts && opts.cols) || 80,
    rows: (opts && opts.rows) || 25,
    lines: [],            /* HTML, already escaped */
    partial: "",
    mode: "stream",
    screen: null,
    cursor: true,
    prog: null,           /* the text program currently owning the tty */
    onRender: (opts && opts.onRender) || null,
    title: (opts && opts.title) || ""
  };
  tty.clear = () => { tty.lines = []; tty.partial = ""; tty.render(); };
  tty.write = s => {
    const parts = String(s).split("\n");
    tty.partial += parts[0];
    for (let i = 1; i < parts.length; i++) { tty.lines.push(tty.partial); tty.partial = parts[i]; }
    if (tty.lines.length > 900) tty.lines.splice(0, tty.lines.length - 900);
    tty.render();
  };
  tty.writeln = (s, cls) => tty.write(cls ? '<span class="' + cls + '">' + s + "</span>\n" : (s == null ? "" : s) + "\n");
  tty.print = (s, cls) => tty.writeln(esc(s == null ? "" : s), cls);
  tty.setScreen = lines => { tty.mode = "screen"; tty.screen = lines; tty.render(); };
  tty.endScreen = () => { tty.mode = "stream"; tty.screen = null; tty.render(); };
  tty.render = () => { if (tty.onRender) tty.onRender(tty); };
  tty.html = () => {
    if (tty.mode === "screen") return (tty.screen || []).join("\n");
    let out = tty.lines.join("\n");
    if (tty.lines.length) out += "\n";
    out += tty.partial;
    if (tty.cursor) out += '<span class="cur"> </span>';
    return out;
  };
  return tty;
}

/* ==========================================================================
   MODULE 20 — THE TEXT CONSOLE (what you get when there is no display server)
   ========================================================================== */
const Console = (() => {
  let ttys = [];
  let active = 0;
  let kernelMode = false;
  let kcon = null;

  function ensure() {
    const con = Spartan.first("console");
    if (!con) { ttys = []; return; }
    if (ttys.length === con.state.vcs.length) return;
    ttys = con.state.vcs.map((vc, i) => {
      const t = mkTty({ onRender: render, title: vc.name });
      t.vc = vc.name; t.idx = i;
      return t;
    });
  }
  function boot() {
    ensure();
    ttys.forEach((tty, i) => {
      if (tty.booted) return;
      tty.booted = true;
      const t = Apps.spawnTask("getterm", "/app/getterm", "app");
      t.state.vc = tty.vc;
      tty.gettermTid = t.tid;
      if (i === 0) {
        tty.print("HelenOS release " + REL + " (" + CODENAME + ")");
        tty.print("Running on " + Sim.arch.uarch + " (" + tty.vc + ")");
        tty.print(COPY);
        tty.print("");
      }
      Bdsh.attach(tty, { seat: 0, console: true });
    });
  }
  function render() { draw(); }
  function draw() {
    const node = Screen.conNode();
    if (!node) return;
    if (kernelMode) {
      node.innerHTML = "";
      node.appendChild(el("pre", null));
      node.firstChild.innerHTML = kcon.html();
      const nm = $("#vcbar-name"); if (nm) nm.textContent = "kconsole";
      node.scrollTop = node.scrollHeight;
      return;
    }
    ensure();
    const tty = ttys[active];
    if (!tty) { node.innerHTML = "<pre>no console server</pre>"; return; }
    node.innerHTML = "";
    const pre = el("pre");
    pre.style.whiteSpace = tty.mode === "screen" ? "pre" : "pre-wrap";
    pre.innerHTML = tty.html();
    node.appendChild(pre);
    const nm = $("#vcbar-name"); if (nm) nm.textContent = tty.vc.replace("term/", "");
    const bar = Screen.conTaskbar && Screen.conTaskbar();
    if (bar) {
      const btns = bar.querySelectorAll(".tb-win");
      btns.forEach((b, i) => b.classList.toggle("act", i === active));
      const clk = bar.querySelector(".tb-clock");
      if (clk) clk.textContent = Clock.text();
    }
    node.scrollTop = node.scrollHeight;
  }
  function switchTo(i) {
    ensure();
    if (i < 0 || i >= ttys.length) return;
    active = i; kernelMode = false;
    const con = Spartan.first("console");
    if (con) con.answer({ method: "CONSOLE_SET_VC", args: { vc: i } });
    draw();
  }
  function enterKernel() {
    if (!kcon) {
      kcon = mkTty({ onRender: draw });
      kcon.print("Kernel console ready (press any key to activate)");
      kcon.print("");
      kcon.write("kconsole> ");
    }
    kernelMode = true; draw();
  }
  function leaveKernel() { kernelMode = false; draw(); }
  function key(ev) {
    if (kernelMode) { Kconsole.key(kcon, ev); return; }
    ensure();
    const tty = ttys[active];
    if (!tty) return;
    if (tty.prog && tty.prog.onKey) tty.prog.onKey(ev);
  }
  return { boot, draw, switchTo, key, enterKernel, leaveKernel, isKernel: () => kernelMode, ttys: () => ttys, active: () => active };
})();

/* The kernel console.  It is inside the kernel, it is the only thing here
   that is, and it exists so that you can look at the machine when userspace
   has stopped being helpful. */
const Kconsole = (() => {
  const CMDS = ["help", "tasks", "threads", "ipc", "cpus", "physmem", "zones", "uptime", "version", "scheduler", "caches", "sysinfo", "kill", "reboot", "halt", "continue"];
  let buf = "";
  function key(tty, ev) {
    if (ev.key === "Enter") { tty.write("\n"); run(tty, buf.trim()); buf = ""; tty.write("kconsole> "); return; }
    if (ev.key === "Backspace") { if (buf) { buf = buf.slice(0, -1); tty.partial = tty.partial.slice(0, -1); tty.render(); } return; }
    if (ev.key.length === 1) { buf += ev.key; tty.write(esc(ev.key)); }
  }
  function run(tty, line) {
    const [cmd, ...args] = line.split(/\s+/);
    if (!cmd) return;
    switch (cmd) {
      case "help":
        tty.print("Available commands are:"); tty.print("");
        for (const c of CMDS) tty.print("  " + c);
        break;
      case "version":
        tty.print("SPARTAN kernel, release " + REL + " (" + CODENAME + ")");
        tty.print("Built for " + Sim.arch.karch);
        tty.print(COPY);
        break;
      case "tasks": {
        tty.print("[id    ] [name              ] [ctn] [ucycles ] [kcycles ] [threads] [calls] [callee");
        for (const t of Spartan.list()) {
          const [u, us] = ordSuffix(t.ucycles), [k, ks] = ordSuffix(t.kcycles);
          tty.print(padr(t.tid, 8) + padr(t.name, 20) + padr("1", 6) + padl(u + us, 9) + " " + padl(k + ks, 9) + " " + padl(t.threads.length, 8) + " " + padl(t.calls, 6));
        }
        break;
      }
      case "threads": {
        tty.print("[id    ] [name      ] [state ] [prio] [cpu ] [task           ]");
        for (const t of Spartan.list()) for (const th of t.threads)
          tty.print(padr(th.id, 8) + padr(th.name.slice(0, 10), 12) + padr(th.state, 8) + padl(th.prio, 5) + padl(th.cpu, 6) + "  " + t.name);
        break;
      }
      case "ipc": {
        tty.print("[caller] [callee]");
        for (const t of Spartan.list()) for (const p of t.phones) {
          const to = Spartan.get(p.callee);
          tty.print(padr(t.tid, 8) + padr(p.callee, 8) + " " + (to ? to.name : "?"));
        }
        break;
      }
      case "cpus": {
        for (let i = 0; i < Sim.arch.cpus; i++)
          tty.print("cpu" + i + ": " + Sim.arch.mhz + " MHz (" + Sim.arch.cpu + "), busy ticks: " + irnd(1000, 90000));
        break;
      }
      case "physmem": {
        const [m, s] = binSuffix(Sim.arch.mem);
        tty.print("Base                Size");
        tty.print("0x0000000000000000  " + m + " " + s);
        break;
      }
      case "zones": tty.print("[nr] [base addr] [frames  ] [flags ]"); tty.print("0    0x00000000  " + Math.round(Sim.arch.mem / 4096) + "     AR"); break;
      case "uptime": tty.print("Up " + (Spartan.uptime() / 1000).toFixed(2) + " seconds."); break;
      case "scheduler": tty.print("cpu0: nrdy: " + irnd(0, 3) + ", needs_relink: 0"); tty.print("\tq0: length 0\n\tq1: length " + irnd(0, 2)); break;
      case "caches": tty.print("[cache name    ] [size ] [full] [part] [objects]"); tty.print("call_t            96      2      1      " + irnd(20, 90)); break;
      case "sysinfo": tty.print("system.release = " + REL); tty.print("system.codename = " + CODENAME); tty.print("system.arch = " + Sim.arch.karch); break;
      case "kill": {
        const tid = parseInt(args[0], 10);
        tty.print(Spartan.kill(tid, "killed from kconsole") === E.EOK ? "Killed task " + tid : "No such task.");
        break;
      }
      case "continue": Console.leaveKernel(); return;
      case "reboot": Sim.reboot(); return;
      case "halt": tty.print("Halted."); break;
      default: tty.print("Unknown command '" + esc(cmd) + "'. Try help.");
    }
  }
  return { key };
})();

/* ==========================================================================
   MODULE 21 — THE START MENU  (0.14.1: editable, keyboard and mouse driven)
   ========================================================================== */
const StartMenu = (() => {
  function parseSif(text) {
    const out = [];
    const re = /<entry\s+([^>]*)>/g;
    let m;
    while ((m = re.exec(text))) {
      const attrs = {};
      const are = /(\w+)="([^"]*)"/g; let a;
      while ((a = are.exec(m[1]))) attrs[a[1]] = a[2];
      if (attrs.separator === "y") { out.push({ sep: true }); continue; }
      if (!attrs.caption) continue;
      out.push({ label: attrs.caption, cmd: attrs.cmd || "", terminal: attrs.terminal === "y" });
    }
    return out;
  }
  function entries(tb) {
    if (tb.state.menu) return tb.state.menu;
    /* The taskbar reads its own configuration file through vfs, like
       everything else that reads a file. */
    const r = VfsClient.read(tb, "/cfg/taskbar.sif");
    let list;
    if (r.rc === E.EOK && r.kind === "f") list = parseSif(r.data);
    else { list = parseSif(TASKBAR_SIF); Log.push("taskbar", "error", "Failed reading /cfg/taskbar.sif (" + errName(r.rc) + "), using built-in menu"); }
    /* The rest of the shipped menu, in the shipped order. */
    list.push({ sep: true });
    list.push({ label: "~D~isplay Configuration", cmd: "/app/display-cfg -d %d" });
    list.push({ label: "Taskba~r~ Configuration", cmd: "/app/taskbar-cfg -d %d" });
    list.push({ sep: true });
    list.push({ label: "Tas~k~ Monitor (top)", cmd: "/app/top", terminal: true });
    list.push({ label: "~F~disk Disk Editor", cmd: "/app/fdisk", terminal: true });
    list.push({ label: "Insta~l~l HelenOS to Disk", cmd: "/app/sysinst -d %d" });
    list.push({ sep: true });
    list.push({ label: "~A~bout HelenOS", cmd: "/app/aboutos -d %d" });
    list.push({ label: "~S~hut Down...", cmd: "/app/shutdown-dlg -d %d" });
    tb.state.menu = list;
    return list;
  }
  function toggle(tb, anchor, seat) {
    if (Menu.isOpen()) { Menu.closeAll(); return; }
    const items = entries(tb).map(e => {
      if (e.sep) return { sep: true };
      const bin = (e.cmd.split(/\s+/)[0] || "").replace("/app/", "");
      return {
        label: e.label,
        run: () => {
          /* Text-mode programs are started the way the real start menu starts
             them: by starting a Terminal, which starts them. */
          let r;
          if (bin === "bdsh") r = Apps.launch("terminal", { seat });
          else if (Apps.get(bin)) r = Apps.launch(bin, { seat });
          else if (Cmds.get(bin)) r = Apps.launch("terminal", { seat, cmd: bin });
          else r = { rc: E.ENOENT };
          if (r.rc !== E.EOK) Sim.toast("bad", "Cannot start " + bin, errName(r.rc) + " — " + errText(r.rc) + ". The taskbar is still running; so is everything else.");
        }
      };
    });
    /* An exhibit item, honestly labelled as one. */
    items.push({ sep: true });
    items.push({ label: "~I~PC Visualiser (exhibit)", run: () => Apps.launch("ipcvis", { seat }) });
    items.push({ label: "Exhibit ~G~uide", run: () => Guide.toggle(true) });
    const r = anchor.getBoundingClientRect();
    Menu.open(r.left, r.top - 4, items, { above: r.top });
  }
  /** The same menu, on the text console.  Programs land in the active
      virtual console, because that is where a text-mode taskbar can put
      them: there is no display server to give them a window. */
  function toggleConsole(tb, anchor) {
    if (Menu.isOpen()) { Menu.closeAll(); return; }
    const runInVc = bin => {
      const tty = Console.ttys()[Console.active()];
      if (!tty) return;
      const sh = tty.prog;
      if (!sh || !sh.cwd) { Sim.toast("bad", "This console is busy", "A program is already running on " + (tty.vc || "this console") + ". Press q or Ctrl-Q to leave it, or switch console with F1-F6."); return; }
      const c = Cmds.get(bin);
      if (!c) { Sim.toast("bad", "Cannot start " + bin, "ENOENT — No such entry."); return; }
      tty.partial = "";
      tty.write('<span class="hl">' + esc(sh.cwd) + " # </span>" + esc(bin) + "\n");
      c.run(sh, []);
      if (tty.prog === sh) { sh.prompt(); sh.redraw(); }
    };
    const items = entries(tb).map(e => {
      if (e.sep) return { sep: true };
      const bin = (e.cmd.split(/\s+/)[0] || "").replace("/app/", "");
      const textCapable = ["gfxdemo", "uidemo", "barber"];
      const gui = !!Apps.get(bin) && bin !== "terminal" && textCapable.indexOf(bin) < 0;
      return {
        label: e.label,
        disabled: gui,
        accel: gui ? "needs display" : "",
        run: () => runInVc(bin === "bdsh" || bin === "terminal" ? "help" : bin)
      };
    });
    items.push({ sep: true });
    items.push({ label: "Start the ~d~isplay server", run: () => Sim.restartServer("display") });
    items.push({ label: "Exhibit ~G~uide", run: () => Guide.toggle(true) });
    const r = anchor.getBoundingClientRect();
    Menu.open(r.left, r.top - 4, items, { above: r.top });
  }

  return { toggle, toggleConsole, parseSif, entries };
})();

/* ==========================================================================
   MODULE 22 — bdsh AND THE COMMAND REGISTRY
   --------------------------------------------------------------------------
   The Brain dead shell.  Its builtins are the ones bdsh actually has, and the
   external commands are the ones that actually live in /app.  There is no ps,
   no grep, no man, no sudo and no /etc, because HelenOS is not Unix and this
   exhibit is not going to pretend that it is.
   ========================================================================== */
function absPath(cwd, p) {
  if (!p) return cwd;
  let base = p.startsWith("/") ? "/" : cwd;
  const parts = base.split("/").filter(Boolean);
  for (const seg of p.split("/")) {
    if (!seg || seg === ".") continue;
    if (seg === "..") { parts.pop(); continue; }
    parts.push(seg);
  }
  return "/" + parts.join("/");
}

const Cmds = (() => {
  const reg = new Map();
  function define(name, spec) { reg.set(name, Object.assign({ name }, spec)); }
  function get(n) { return reg.get(n); }
  function names() { return Array.from(reg.keys()).sort(); }
  function builtins() { return names().filter(n => reg.get(n).builtin); }
  function externals() { return names().filter(n => !reg.get(n).builtin); }
  return { define, get, names, builtins, externals, reg };
})();

const Bdsh = (() => {
  function attach(tty, opts) {
    opts = opts || {};
    const task = Apps.spawnTask("bdsh", "/app/bdsh", "app");
    task.state.seat = opts.seat || 1;
    const sh = {
      task, tty, cwd: "/", line: "", pos: 0,
      hist: State.get("shellHistory", []).slice(), hidx: -1,
      seat: opts.seat || 1, win: opts.win || null, aliases: {}
    };
    sh.out = s => tty.print(s);
    sh.html = s => tty.writeln(s);
    sh.errl = s => tty.writeln(esc(s), "err");
    sh.warn = s => tty.writeln(esc(s), "warn");
    sh.ok = s => tty.writeln(esc(s), "ok");
    sh.dim = s => tty.writeln(esc(s), "dim");
    sh.prompt = () => { tty.write('<span class="hl">' + esc(sh.cwd) + " # </span>"); sh.line = ""; sh.pos = 0; };
    sh.redraw = () => {
      /* redraw the current input line in place */
      tty.partial = '<span class="hl">' + esc(sh.cwd) + " # </span>" + esc(sh.line.slice(0, sh.pos)) +
        '<span class="cur">' + esc(sh.line.slice(sh.pos, sh.pos + 1) || " ") + "</span>" + esc(sh.line.slice(sh.pos + 1));
      tty.cursor = false;
      tty.render();
      tty.cursor = true;
    };
    sh.onKey = ev => {
      const k = ev.key;
      if (ev.ctrlKey && (k === "c" || k === "C")) { tty.write("\n"); sh.prompt(); sh.redraw(); return; }
      if (k === "Enter") {
        tty.cursor = true;
        tty.partial = '<span class="hl">' + esc(sh.cwd) + " # </span>" + esc(sh.line);
        tty.write("\n");
        const line = sh.line; sh.line = ""; sh.pos = 0;
        if (line.trim()) { sh.hist.push(line); State.set("shellHistory", sh.hist.slice(-120)); }
        sh.hidx = -1;
        run(sh, line);
        if (tty.prog === sh) { sh.prompt(); sh.redraw(); }
        return;
      }
      if (k === "Backspace") { if (sh.pos > 0) { sh.line = sh.line.slice(0, sh.pos - 1) + sh.line.slice(sh.pos); sh.pos--; } sh.redraw(); return; }
      if (k === "Delete") { sh.line = sh.line.slice(0, sh.pos) + sh.line.slice(sh.pos + 1); sh.redraw(); return; }
      if (k === "ArrowLeft") { sh.pos = Math.max(0, sh.pos - 1); sh.redraw(); return; }
      if (k === "ArrowRight") { sh.pos = Math.min(sh.line.length, sh.pos + 1); sh.redraw(); return; }
      if (k === "Home") { sh.pos = 0; sh.redraw(); return; }
      if (k === "End") { sh.pos = sh.line.length; sh.redraw(); return; }
      if (k === "ArrowUp") { if (sh.hist.length) { sh.hidx = sh.hidx < 0 ? sh.hist.length - 1 : Math.max(0, sh.hidx - 1); sh.line = sh.hist[sh.hidx]; sh.pos = sh.line.length; sh.redraw(); } return; }
      if (k === "ArrowDown") { if (sh.hidx >= 0) { sh.hidx++; if (sh.hidx >= sh.hist.length) { sh.hidx = -1; sh.line = ""; } else sh.line = sh.hist[sh.hidx]; sh.pos = sh.line.length; sh.redraw(); } return; }
      if (k === "Tab") { complete(sh); return; }
      if (k.length === 1 && !ev.ctrlKey && !ev.altKey && !ev.metaKey) {
        sh.line = sh.line.slice(0, sh.pos) + k + sh.line.slice(sh.pos); sh.pos++; sh.redraw();
      }
    };
    tty.prog = sh;
    sh.prompt(); sh.redraw();
    return sh;
  }

  function complete(sh) {
    const parts = sh.line.slice(0, sh.pos).split(/\s+/);
    const frag = parts[parts.length - 1] || "";
    let pool;
    if (parts.length === 1) pool = Cmds.names();
    else {
      const dir = frag.includes("/") ? absPath(sh.cwd, frag.slice(0, frag.lastIndexOf("/") + 1)) : sh.cwd;
      const r = VfsClient.read(sh.task, dir);
      pool = (r.rc === E.EOK && r.entries) ? r.entries.map(e => (frag.includes("/") ? frag.slice(0, frag.lastIndexOf("/") + 1) : "") + e.name) : [];
    }
    const hits = pool.filter(x => x.startsWith(frag));
    if (!hits.length) return;
    if (hits.length === 1) {
      sh.line = sh.line.slice(0, sh.pos - frag.length) + hits[0] + sh.line.slice(sh.pos);
      sh.pos += hits[0].length - frag.length;
    } else {
      sh.tty.write("\n");
      sh.out(hits.join("  "));
      sh.prompt();
    }
    sh.redraw();
  }

  function run(sh, line) {
    line = line.trim();
    if (!line) return;
    for (const part of line.split("&&")) runOne(sh, part.trim());
  }
  function runOne(sh, line) {
    if (!line) return;
    const argv = line.match(/"[^"]*"|\S+/g).map(s => s.replace(/^"|"$/g, ""));
    let name = argv[0];
    if (sh.aliases[name]) { const ex = sh.aliases[name].split(/\s+/); argv.splice(0, 1, ...ex); name = argv[0]; }
    const cmd = Cmds.get(name);
    if (!cmd) {
      /* A server or a driver is just a program with a path.  Starting one is
         what you do after you have killed one, because nothing else will. */
      const def = Servers.all().find(d => d.path === name || d.name === name);
      if (def) { Sim.restartServer(def.name); sh.ok("Started " + def.path); return; }
      if (Apps.get(name)) { const r = Apps.launch(name, { seat: sh.seat }); if (r.rc !== E.EOK) sh.errl(name + ": " + errName(r.rc)); return; }
      /* bdsh looks in /app before it gives up — through vfs, of course. */
      const st = VfsClient.stat(sh.task, name.startsWith("/") ? name : "/app/" + name);
      if (st.rc === E.EOK) sh.errl("Cannot spawn " + name + " (this exhibit does not implement that program)");
      else if (st.rc === E.EHANGUP) sh.errl("Cannot spawn " + name + " (EHANGUP — the filesystem server for / is not running)");
      else sh.errl("Cannot spawn " + name + " (ENOENT)");
      return;
    }
    try { cmd.run(sh, argv.slice(1), argv); }
    catch (err) { sh.errl(name + ": " + String(err && err.message || err)); }
  }
  return { attach, run };
})();

/* ---------- helper: read/list through vfs, honestly reporting failures ---- */
function shStat(sh, path) { return VfsClient.stat(sh.task, path); }
function shFail(sh, what, rc) {
  if (rc === E.EHANGUP)
    sh.errl(what + ": " + errName(rc) + " (" + errText(rc) + ") — the server that owned that mount point is not running");
  else sh.errl(what + ": " + errName(rc) + " (" + errText(rc) + ")");
}

/* ==========================================================================
   BUILTINS  (uspace/app/bdsh/cmds/builtins + cmds/modules)
   ========================================================================== */
Cmds.define("help", {
  builtin: true, help: "shows help for commands",
  run(sh, args) {
    if (args[0] === "commands") {
      sh.out("");
      sh.out("  Bdsh commands:");
      sh.out("");
      const all = Cmds.names().filter(n => Cmds.get(n).builtin);
      for (let i = 0; i < all.length; i += 6) sh.out("  " + all.slice(i, i + 6).map(x => padr(x, 11)).join(""));
      sh.out("");
      sh.out("  Other commands live in /app.  Type 'ls /app' to see them.");
      sh.out("");
      return;
    }
    if (args[0]) {
      const c = Cmds.get(args[0]);
      if (!c) { sh.out("Invalid topic " + args[0]); return; }
      sh.out("");
      sh.out("  `" + args[0] + "' " + (c.help || "has no help text."));
      if (c.syntax) sh.out("  " + c.syntax);
      sh.out("");
      return;
    }
    for (const l of DOC_HELP.split("\n")) sh.out(l);
  }
});
Cmds.define("exit", {
  builtin: true, help: "exits the shell",
  run(sh) {
    sh.out("Leaving bdsh.");
    if (sh.win) App.close(sh.win);

Cmds.define("ls", {
  builtin: true, help: "lists files and directories", syntax: "ls [-u] [<path>]",

Cmds.define("rm", {
  builtin: true, help: "removes a file or directory", syntax: "rm [-r] <path>...",
  run(sh, args) {
    const rec = args.some(a => a === "-r" || a === "--recursive");
    const targets = args.filter(a => !a.startsWith("-"));
    if (!targets.length) { sh.errl("rm: no path given"); return; }

      const st = shStat(sh, p);
      if (st.rc !== E.EOK) { shFail(sh, "rm: " + p, st.rc); return; }

Cmds.define("cp", {

Cmds.define("stats", {
  help: "lists tasks, threads, CPUs and IPC connections",
  syntax: "stats [-t <task_id>] [-i <task_id>] [-at] [-ai] [-c] [-l] [-u]",
  run(sh, args) {
    const f = args[0];
    if (!f || f === "-a") {
      sh.out("[taskid] [thrds] [resident] [virtual] [ucycles] [kcycles] [name");
      for (const t of Spartan.list()) {
        const [r, rs] = binSuffix(t.resmem), [v, vs] = binSuffix(t.virtmem);
        const [u, us] = ordSuffix(t.ucycles), [k, ks] = ordSuffix(t.kcycles);
        sh.out(padr(t.tid, 8) + " " + padl(t.threads.length, 7) + " " + padl(r, 7) + rs + " " + padl(v, 6) + vs +
          " " + padl(u, 8) + us + " " + padl(k, 8) + ks + " " + t.name);
      }
      return;
    }
    if (f === "-at" || f === "--all-threads" || f === "-t") {
      const only = f === "-t" ? parseInt(args[1], 10) : null;
      sh.out("[taskid] [threadid] [state ] [prio] [cpu ] [ucycles] [kcycles]");
      for (const t of Spartan.list()) {
        if (only && t.tid !== only) continue;
        for (const th of t.threads) {
          const [u, us] = ordSuffix(th.ucycles), [k, ks] = ordSuffix(th.kcycles);
          sh.out(padr(t.tid, 8) + " " + padr(th.id, 10) + " " + padr(th.state, 8) + " " + padl(th.prio, 5) + " " + padl(th.cpu, 6) + " " + padl(u, 8) + us + " " + padl(k, 8) + ks);
        }
      }
      return;
    }
    if (f === "-ai" || f === "--all-ipccs" || f === "-i") {
      const only = f === "-i" ? parseInt(args[1], 10) : null;
      sh.out("[caller] [callee]");
      for (const t of Spartan.list()) {
        if (only && t.tid !== only) continue;
        for (const p of t.phones) sh.out(padr(t.tid, 8) + " " + padr(p.callee, 8));
      }
      return;
    }
    if (f === "-c" || f === "--cpus") {
      sh.out("[id] [MHz     ] [busy cycles] [idle cycles]");
      for (let i = 0; i < Sim.arch.cpus; i++) {
        const [b, bs] = ordSuffix(irnd(100000, 9000000)), [ic, is] = ordSuffix(irnd(1000000, 90000000));
        sh.out(padr(i, 4) + " " + padl(Sim.arch.mhz, 10) + " " + padl(b, 12) + bs + " " + padl(ic, 12) + is);
      }
      return;
    }
    if (f === "-l" || f === "--load") { sh.out("stats: Load average: " + [0, 1, 2].map(() => (Math.random() * 0.4).toFixed(2)).join(" ")); return; }
    if (f === "-u" || f === "--uptime") {
      const s = Math.floor(Spartan.uptime() / 1000);
      sh.out("stats: Up " + Math.floor(s / 86400) + " days, " + Math.floor(s % 86400 / 3600) + " hours, " + Math.floor(s % 3600 / 60) + " minutes, " + (s % 60) + " seconds");
      return;
    }
    if (f === "-d" || f === "--design") {
      sh.out("digraph HelenOS {");
      sh.out("\tlayout=sfdp");
      for (const t of Spartan.list()) sh.out("\ttask" + t.tid + ' [label="' + t.name + '"' + (t.kind === "kernel" ? " shape=invtrapezium fillcolor=gray" : t.kind === "drv" ? " fillcolor=orange" : "") + "]");
      for (const t of Spartan.list()) for (const p of t.phones) sh.out("\ttask" + t.tid + " -> task" + p.callee);
      sh.out("}");
      return;
    }
    sh.errl("stats: unknown option " + f);
  }
});

Cmds.define("loc", {
  help: "prints data from the location service", syntax: "loc [show-cat <category>]",
  run(sh, args) {
    const lp = Sys.phoneTo(sh.task, "INTERFACE_LOC_CONSUMER", "loc");
    if (!lp) { sh.errl("loc: cannot connect to the location service"); return; }
    const showCat = cat => {
      const r = Spartan.call(lp, "LOC_CATEGORY_GET_SVCS", { cat });
      sh.out(cat + ":");
      if (r.rc !== E.EOK) { sh.out("loc: Failed getting list of services in category " + cat + ", skipping."); return; }
      for (const s of r.svcs) sh.out("\t" + s.name + " : " + s.server);
    };
    if (args[0] === "show-cat") {
      if (!args[1]) { sh.out("Argument missing."); return; }
      showCat(args[1]); return;
    }
    const cats = Spartan.call(lp, "LOC_GET_CATEGORIES", {});
    if (cats.rc !== E.EOK) { shFail(sh, "loc", cats.rc); return; }
    for (const c of cats.cats) showCat(c);
  }
});

Cmds.define("devctl", {
  help: "device driver framework (DDF) administration",
  syntax: "devctl | devctl list-drv | devctl show-drv <name> | devctl online|offline <fun>",
  run(sh, args) {
    const dp = Sys.phoneTo(sh.task, "INTERFACE_DEVMAN_CLIENT", "devman");
    if (!dp) { sh.errl("devctl: Error resolving root function."); return; }
    if (!args.length) {
      const r = Spartan.call(dp, "DEVMAN_GET_TREE", {});
      if (r.rc !== E.EOK) { shFail(sh, "devctl", r.rc); return; }
      for (const n of r.nodes) {
        const depth = n.path.split("/").length - 1;
        sh.out("    ".repeat(depth) + n.path.split("/").pop() + (n.drv ? " : " + n.drv : "") + (n.state === "not driven" ? "  [not driven]" : ""));
      }
      return;
    }
    if (args[0] === "list-drv") {
      const r = Spartan.call(dp, "DEVMAN_LIST_DRV", {});
      if (r.rc !== E.EOK) { shFail(sh, "devctl", r.rc); return; }
      sh.out(padr("Driver", 18) + padr("Devs", 6) + "State");
      for (const d of r.drivers) sh.out(padr(d.name, 18) + padr(d.devs, 6) + d.state);
      return;
    }
    if (args[0] === "show-drv") {
      const r = Spartan.call(dp, "DEVMAN_LIST_DRV", {});
      const d = (r.drivers || []).find(x => x.name === args[1]);
      if (!d) { sh.out("Failed resolving driver '" + (args[1] || "") + "': ENOENT."); return; }
      sh.out("Driver: " + d.name);
      sh.out("State: " + d.state);
      sh.out("Attached devices:");
      const tr = Spartan.call(dp, "DEVMAN_GET_TREE", {});
      for (const n of (tr.nodes || [])) if (n.drv === d.name) sh.out("\t" + n.path);
      sh.out("Match IDs:");
      sh.out("\t10 " + d.name);
      return;
    }
    if (args[0] === "load-drv") { const r = Spartan.call(dp, "DEVMAN_LOAD_DRV", { name: args[1] }); if (r.rc !== E.EOK) sh.out("Failed loading driver '" + args[1] + "': " + errName(r.rc) + "."); return; }
    if (args[0] === "unload-drv") { const r = Spartan.call(dp, "DEVMAN_UNLOAD_DRV", { name: args[1] }); if (r.rc !== E.EOK) sh.out("Failed unloading driver '" + args[1] + "': " + errName(r.rc) + "."); return; }
    if (args[0] === "online" || args[0] === "offline") {
      const r = Spartan.call(dp, args[0] === "online" ? "DEVMAN_ONLINE" : "DEVMAN_OFFLINE", { path: args[1] });
      if (r.rc !== E.EOK) sh.out("devctl: Error resolving device function '" + args[1] + "' (" + errName(r.rc) + ")");
      return;
    }
    sh.out("syntax:"); sh.out("\tdevctl"); sh.out("\tdevctl list-drv"); sh.out("\tdevctl show-drv <driver-name>");
    sh.out("\tdevctl load-drv <driver-name>"); sh.out("\tdevctl unload-drv <driver-name>");
    sh.out("\tdevctl online <function>"); sh.out("\tdevctl offline <function>");
  }
});

Cmds.define("kill", {
  help: "kills a task by task id", syntax: "kill <task_id>",
  run(sh, args) {
    const tid = parseInt(args[0], 10);
    if (!tid) { sh.errl("Syntax: kill <task_id>"); return; }
    const t = Spartan.get(tid);
    if (!t || !t.alive) { sh.errl("kill: no such task " + tid); return; }
    const name = t.name;
    const rc = Spartan.kill(tid, "killed by kill(1)");
    if (rc !== E.EOK) { sh.errl("kill: " + errName(rc)); return; }
    Sim.announceDeath(name, tid, "kill");
    sh.ok("Task " + tid + " (" + name + ") killed.");
  }
});
Cmds.define("killall", {
  help: "kills tasks whose name matches a pattern", syntax: "killall <name>",
  run(sh, args) {
    if (!args[0]) { sh.errl("Syntax: killall <name>"); return; }

  }
});

Cmds.define("date", {
  help: "prints or sets the date and time",
  run(sh) {

    const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], mon = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    /* the clock really is a device, reached through a driver */

Cmds.define("vol", {
  help: "lists volumes known to the volume server",
  run(sh) {
    const vp = Sys.phoneTo(sh.task, "INTERFACE_VOL", "volsrv");
    if (!vp) { sh.errl("vol: cannot reach the volume server"); return; }
    const r = Spartan.call(vp, "VOL_GET_PARTS", {});

});

Cmds.define("ping", {
  help: "ICMP ping utility", syntax: "ping <host>",
  run(sh, args) {
    const host = args.find(a => !a.startsWith("-"));
    if (!host) { sh.errl("syntax: ping [-n <count>] <host-name-or-address>"); return; }
    let addr = host;
    if (!/^[0-9.]+$/.test(host)) {
      const dp = Sys.phoneTo(sh.task, "INTERFACE_DNSR", "dnsrsrv");
      if (!dp) { sh.errl("ping: DNS resolution failed (is dnsrsrv running?)"); return; }
      const r = Spartan.call(dp, "DNSR_NAME2HOST", { name: host });
      if (r.rc !== E.EOK) { sh.errl("ping: Host '" + host + "' not found (" + errName(r.rc) + ")."); return; }
      addr = r.addr;
    }
    const ip = Sys.phoneTo(sh.task, "INTERFACE_INETPING", "inet");
    if (!ip) { sh.errl("ping: cannot reach the internet service"); return; }
    let sent = 0, got = 0;
    for (let i = 0; i < 4; i++) {
      sent++;
      const r = Spartan.call(ip, "INETPING_SEND", { dest: addr, seq: i + 1 });
      if (r.rc === E.EOK) { got++; sh.out("64 bytes from " + addr + ": icmp_seq=" + (i + 1) + " time=" + r.rtt.toFixed(2) + " ms"); }
      else if (r.rc === E.ETIMEOUT) sh.warn("Request timed out.");
      else { sh.errl("ping: " + errName(r.rc) + " (" + errText(r.rc) + ")"); break; }
    }
    sh.out("");
    sh.out("--- " + host + " ping statistics ---");
    sh.out(sent + " packets transmitted, " + got + " received, " + Math.round((sent - got) / sent * 100) + "% packet loss");
  }
});

Cmds.define("disp", {
  help: "display configuration utility",
  syntax: "disp list-seat | create-seat <name> | delete-seat <name> | assign-dev <device> <seat> | unassign-dev <device> | list-dev <seat>",
  run(sh, args) {
    const dp = Sys.phoneTo(sh.task, "INTERFACE_DISPCFG", "display");
    if (!dp) { sh.errl("disp: Failed connecting to display configuration service."); return; }
    const cmd = args[0];
    if (!cmd) {
      sh.out("disp: Display configuration utility.");
      sh.out("Syntax:");
      sh.out("  disp list-seat");
      sh.out("  disp create-seat <name>");
      sh.out("  disp delete-seat <name>");
      sh.out("  disp assign-dev <device> <seat>");
      sh.out("  disp unassign-dev <device>");
      sh.out("  disp list-dev <seat>");
      return;
    }
    if (cmd === "list-seat") {
      const r = Spartan.call(dp, "DISPCFG_GET_SEAT_LIST", {});
      sh.out("Seat Name");
      for (const s of r.seats) sh.out(s.name);
      return;
    }
    if (cmd === "create-seat") {
      if (!args[1]) { sh.errl("disp: Missing arguments."); return; }
      const r = Spartan.call(dp, "DISPCFG_SEAT_CREATE", { name: args[1] });
      if (r.rc !== E.EOK) { sh.errl("disp: Failed creating seat '" + args[1] + "' (" + errName(r.rc) + ")"); return; }
      Sim.seatCreated(r.id, args[1]);
      sh.ok("Seat '" + args[1] + "' created.");
      return;
    }
    if (cmd === "delete-seat") {
      const r = Spartan.call(dp, "DISPCFG_SEAT_DELETE", { name: args[1] });
      if (r.rc !== E.EOK) { sh.errl("disp: Failed deleting seat '" + args[1] + "': " + errName(r.rc)); return; }
      sh.ok("Seat '" + args[1] + "' deleted.");
      return;
    }
    if (cmd === "assign-dev") {
      const r = Spartan.call(dp, "DISPCFG_DEV_ASSIGN", { dev: args[1], seat: args[2] });
      if (r.rc !== E.EOK) sh.errl("disp: Failed assigning device '" + args[1] + "' to seat '" + args[2] + "': " + errName(r.rc));
      return;
    }
    if (cmd === "unassign-dev") { Spartan.call(dp, "DISPCFG_DEV_UNASSIGN", { dev: args[1] }); return; }
    if (cmd === "list-dev") {
      const r = Spartan.call(dp, "DISPCFG_GET_ASGN_DEV_LIST", { seat: args[1] });
      if (r.rc !== E.EOK) { sh.errl("disp: Seat '" + args[1] + "' not found."); return; }
      sh.out("Device");
      for (const d of r.devs) sh.out(d);
      return;
    }
    sh.errl("disp: unknown command '" + cmd + "'");
  }
});

  "/": ['name: ""', 'device_type: "chassis"', 'model: "' + "SUNW,Ultra-5_10" + '"'],
