/* ==========================================================================
   MODULE 30 — SOUND (optional, minimal, synthesized, default off)
   ========================================================================== */
const Sound = (() => {
  let ctx = null;
  function on() { return State.get("sound", false); }
  function ac() {
    if (!on()) return null;
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, ms, type, gain) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(gain === undefined ? 0.05 : gain, c.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + ms / 1000);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + ms / 1000 + 0.02);
  }
  return {
    enabled: on,
    toggle() { State.set("sound", !on()); if (on()) tone(660, 90, "sine", 0.04); },
    click() { tone(1400, 22, "square", 0.012); },
    bootTone() { tone(392, 130, "sine", 0.05); setTimeout(() => tone(523.25, 130, "sine", 0.05), 130); setTimeout(() => tone(659.25, 220, "sine", 0.05), 260); },
    bad() { tone(180, 180, "sawtooth", 0.03); }
  };
})();

/* ==========================================================================
   MODULE 31 — THE BOOT MANAGER AND THE SIMULATION ITSELF
   --------------------------------------------------------------------------
   A visitor should be able to watch an operating system assemble itself out
   of a dozen separate programs.  Every line below that says "Starting" is a
   task actually being created in this simulation at that moment.
   ========================================================================== */
const Sim = (() => {
  let arch = ARCHS[0];
  let bootMode = "gui";
  let steps = [], stepAt = 0, stepTimer = null, booting = false, booted = false;
  let tickTimer = null;

  /* ---------------- boot log ---------------- */
  function bl(cls, txt) { return { cls, txt }; }
  function say(cls, txt, act) { return { cls, txt, act }; }

  function buildBootScript() {
    const S = [];
    const [mem, memS] = binSuffix(arch.mem);
    for (const [c, t] of arch.fw) S.push(bl(c === "fw" ? "fw" : c, t));
    S.push(bl("dim", ""));
    S.push(bl("bar", "HelenOS bootloader, release " + REL + " (" + CODENAME + ")"));
    S.push(bl("k", "Built for " + arch.karch));
    S.push(bl("k", COPY));
    S.push(bl("dim", ""));
    S.push(bl("k", "Memory statistics (total " + mem + " " + memS + ")"));
    S.push(bl("dim", " " + hex(0x8000) + "|" + hex(0x8000) + ": bootstrap stack"));
    S.push(bl("dim", " " + hex(0x9000) + "|" + hex(0x9000) + ": boot info structure"));
    S.push(bl("dim", " " + hex(0x200000) + "|" + hex(0x200000) + ": kernel entry point"));
    if (arch.extra.indexOf("ofw") >= 0) {
      S.push(bl("k", "Setting up screens ..."));
      S.push(bl("k", "Canonizing OpenFirmware device tree ..."));
    }
    S.push(bl("k", "Booting the kernel..."));
    S.push(bl("dim", ""));
    S.push(bl("bar", "SPARTAN kernel, release " + REL + " (" + CODENAME + ")"));
    S.push(bl("k", "Built for " + arch.karch));
    S.push(bl("k", COPY));
    S.push(bl("k", "Detected " + arch.cpus + " CPU(s), " + mem + " " + memS + " free memory"));
    S.push(bl("dim", "cpu0: " + arch.cpu + " (" + arch.mhz + " MHz), " + arch.endian + "-endian, " + arch.bits + "-bit"));
    for (let i = 1; i < arch.cpus; i++) S.push(bl("dim", "cpu" + i + ": " + arch.cpu + " (" + arch.mhz + " MHz)"));
    S.push(bl("dim", "Kernel console ready (press any key to activate)"));
    S.push(bl("dim", ""));

    /* --- userspace: this is the part you cannot watch anywhere else --- */
    S.push(say("ok", "init: HelenOS init", () => { KERNEL_TASK = mkKernelTask(); }));
    const initSrv = [
      ["/srv/ns", "ns"], ["/srv/loc", "loc"], ["/srv/bd/rd", "rd"],
      ["/srv/vfs", "vfs"], ["/srv/logger", "logger"], ["/srv/fs/ext4fs", "ext4fs"]
    ];
    for (const [path, name] of initSrv)
      S.push(say("srv", "init: Spawning " + path, () => { Servers.spawn(name); }));
    S.push(say("ok", "init: Root file system mounted on / (ext4fs at bd/initrd)", () => {
      const v = Spartan.first("vfs");
      if (v) v.answer({ method: "VFS_IN_MOUNT", args: { mp: "/", fstype: "ext4fs", svc: "bd/initrd" } });
    }));
    S.push(say("srv", "init: Spawning /srv/system", () => { Servers.spawn("system"); }));
    S.push(bl("ok", "system: HelenOS system server"));

    const sysSrv = [
      ["/srv/fs/tmpfs", "tmpfs"], ["/srv/fs/exfat", "exfat"], ["/srv/fs/fat", "fat"],
      ["/srv/fs/cdfs", "cdfs"], ["/srv/fs/udf", "udf"], ["/srv/fs/mfs", "mfs"],
      ["/srv/klog", "klog"], ["/srv/fs/locfs", "locfs"]
    ];
    for (const [path, name] of sysSrv)
      S.push(say("srv", "system: Starting " + path, () => { Servers.spawn(name); }));
    S.push(say("ok", "system: Location service file system mounted on /loc (locfs)", () => {
      const v = Spartan.first("vfs");
      if (v) v.answer({ method: "VFS_IN_MOUNT", args: { mp: "/loc", fstype: "locfs", svc: "" } });
    }));
    S.push(say("ok", "system: Temporary file system mounted on /tmp (tmpfs)", () => {
      const v = Spartan.first("vfs");
      if (v) v.answer({ method: "VFS_IN_MOUNT", args: { mp: "/tmp", fstype: "tmpfs", svc: "" } });
    }));
    S.push(say("srv", "system: Starting /srv/devman", () => { Servers.spawn("devman"); }));
    /* devman probes the tree and starts one driver task per matched node */
    for (const d of arch.drivers) {
      const info = DRV_INFO[d] || {};
      S.push(say("dim", "devman: " + padr(d, 14) + " : matched " + (info.desc || d), () => startDriver(d)));
    }
    if (arch.disk) S.push(say("ok", "devman: block device registered with loc", () => { }));
    if (arch.iso) S.push(say("ok", "system: Installation media mounted on /vol/cd (cdfs at bd/cdrom0)", () => {
      const v = Spartan.first("vfs");
      if (v) {
        v.answer({ method: "VFS_IN_LINK", args: { path: "/vol/cd", kind: "d" } });
        v.answer({ method: "VFS_IN_MOUNT", args: { mp: "/vol/cd", fstype: "cdfs", svc: "bd/cdrom0" } });
      }
    }));
    S.push(say("srv", "system: Starting /srv/bd/vbd", () => { Servers.spawn("vbd"); }));
    S.push(say("srv", "system: Starting /srv/volsrv", () => { Servers.spawn("volsrv"); }));
    if (State.get("installed", false)) S.push(bl("ok", "system: System volume is configured."));
    else S.push(bl("k", "system: Creating live image directory structure."));
    S.push(say("srv", "system: Starting /srv/taskmon", () => { Servers.spawn("taskmon"); }));
    for (const [path, name] of [["/srv/net/loopip", "loopip"], ["/srv/net/ethip", "ethip"], ["/srv/net/dhcp", "dhcp"],
    ["/srv/net/inetsrv", "inet"], ["/srv/net/tcp", "tcp"], ["/srv/net/udp", "udp"], ["/srv/net/dnsrsrv", "dnsrsrv"]])
      S.push(say("srv", "system: Starting " + path, () => { Servers.spawn(name); }));
    if (arch.nic) S.push(say("ok", "dhcp: eth0 configured, address 10.0.2.15/24, router 10.0.2.2", () => {
      const d = Spartan.first("dhcp");
      if (d) d.answer({ method: "DHCP_LINK_ADD", args: { link: "net/eth0" } });
    }));
    S.push(say("srv", "system: Starting /srv/clipboard", () => { Servers.spawn("clipboard"); }));
    S.push(say("srv", "system: Starting /srv/hid/remcons", () => { Servers.spawn("remcons"); }));
    S.push(say("srv", "system: Starting /srv/hid/input hid/input", () => { Servers.spawn("input", ["hid/input"]); }));
    S.push(say("srv", "system: Starting /srv/hid/output hid/output", () => { Servers.spawn("output", ["hid/output"]); }));
    S.push(say("srv", "system: Starting /srv/audio/hound", () => { Servers.spawn("hound"); }));
    S.push(say("srv", "system: Starting /srv/loader", () => { Servers.spawn("loader"); }));
    if (bootMode === "gui") {
      S.push(say("bar", "system: Starting /srv/hid/display", () => { Servers.spawn("display"); }));
      S.push(say("ok", "system: Spawning /app/taskbar", () => { startTaskbar(1); }));
    }
    S.push(say("srv", "system: Starting /srv/hid/console hid/input hid/output", () => { Servers.spawn("console"); }));
    if (bootMode !== "gui")
      S.push(say("ok", "system: Spawning /app/taskbar -c   (the taskbar runs in text mode too, since 0.14.1)", () => { startTaskbar(0, true); }));
    for (let i = 0; i < 6; i++)
      S.push(bl("dim", "system: Spawning /app/getterm term/vc" + i + " /loc " + (i === 0 ? "--msg " : "") + "--wait -- /app/bdsh"));
    S.push(bl("dim", ""));
    S.push(bl("ok", bootMode === "gui"
      ? "The desktop is up. " + Spartan.list().length + " tasks are running, and the kernel is one of them."
      : "Text console ready. The taskbar works here too, since 0.14.1."));
    return S;
  }
  function hex(n) { return "0x" + n.toString(16).padStart(arch.bits === 64 ? 16 : 8, "0"); }

  function mkKernelTask() {
    const t = Spartan.mkTask({
      name: "kernel", path: "(the kernel)", kind: "kernel", threads: 3,
      fibrils: [], mainThread: "kinit",
      resmem: 1 * 1024 * 1024, virtmem: 2 * 1024 * 1024,
      answer: () => ({ rc: E.ENOTSUP })
    });
    t.threads = [
      { id: 1, name: "kinit", state: "Sleeping", prio: 15, cpu: 0, ucycles: 0, kcycles: 0 },
      { id: 2, name: "kconsole", state: "Sleeping", prio: 15, cpu: 0, ucycles: 0, kcycles: 0 },
      { id: 3, name: "kio", state: "Sleeping", prio: 15, cpu: 0, ucycles: 0, kcycles: 0 }
    ];
    return t;
  }

  function startDriver(name) {
    const r = Servers.spawn(name, ["hw/" + name]);
    const dm = Spartan.first("devman");
    if (dm && r.task) {
      dm.answer({ method: "DEVMAN_ADD_FUNCTION", args: { path: "hw/" + name, name, drv: name, tid: r.task.tid } });
    }
    return r;
  }

  function startTaskbar(seat, console) {
    const t = Apps.spawnTask("taskbar", "/app/taskbar", "app");
    t.state.seat = seat;
    t.state.console = !!console;
    /* the taskbar is a display client like anything else */
    Sys.phoneTo(t, "INTERFACE_WNDMGT", "display");
    Sys.phoneTo(t, "INTERFACE_VFS", "vfs");
    StartMenu.entries(t);
    Screen.sync();
    return t;
  }

  /* ---------------- running the boot ---------------- */
  function boot(archId, mode) {
    arch = archById(archId);
    bootMode = mode || "gui";
    State.set("arch", arch.id); State.set("bootMode", bootMode);
    Spartan.reset();
    Log.kernel = []; Log.lines = [];
    Media.images = {};
    Media.images.initrd = buildInitrd(arch);
    Media.images.initrd._fs = "ext4fs";
    if (arch.iso) { Media.images.cd = buildIso(arch); Media.images.cd._fs = "cdfs"; }
    if (State.get("installed", false)) { Media.images.hd = FsTree.dir("/"); Media.images.hd._fs = "ext4fs"; }
    State.restoreFiles();
    steps = buildBootScript();
    stepAt = 0; booting = true; booted = false;
    $("#chooser").classList.remove("on");
    $("#machine").classList.remove("on");
    $("#boot").classList.add("on");
    $("#bootlog").innerHTML = "";
    Sound.bootTone();
    runSteps();
  }
  function runSteps() {
    const log = $("#bootlog");
    const push = s => {
      Log.kpush(s.txt);
      const d = el("div", { class: s.cls || "k" }, s.txt);
      log.appendChild(d);
      while (log.children.length > 260) log.removeChild(log.firstChild);
    };
    const one = () => {
      if (stepAt >= steps.length) { finishBoot(); return; }
      const s = steps[stepAt++];
      if (s.act) { try { s.act(); } catch (e) { console.error("boot step failed", s.txt, e); } }
      push(s);
      const delay = s.txt === "" ? 8 : (s.cls === "srv" || s.cls === "ok" || s.cls === "bar") ? 46 : 20;
      stepTimer = setTimeout(one, delay);
    };
    one();
  }
  function skipBoot() {
    if (!booting) return;
    clearTimeout(stepTimer);
    const log = $("#bootlog");
    while (stepAt < steps.length) {
      const s = steps[stepAt++];
      if (s.act) { try { s.act(); } catch (e) { console.error(e); } }
      Log.kpush(s.txt);
    }
    log.innerHTML = "";
    for (const s of steps.slice(-40)) log.appendChild(el("div", { class: s.cls || "k" }, s.txt));
    finishBoot();
  }
  function finishBoot() {
    booting = false; booted = true;
    setTimeout(() => {
      $("#boot").classList.remove("on");
      $("#machine").classList.add("on");
      Screen.rebuild();
      Console.boot();
      restoreWindows();
      Screen.sync();
      if (!tickTimer) tickTimer = setInterval(tick, 1000);
    }, 260);
  }
  function restoreWindows() {
    if (bootMode !== "gui" || !Spartan.first("display")) return;
    const saved = State.get("windows", null);
    const seats = State.get("seats", null);
    if (seats && seats.length > 1) {
      const d = Spartan.first("display");
      for (const s of seats.slice(1)) {
        const r = d.answer({ method: "DISPCFG_SEAT_CREATE", args: { name: s.name } });
        if (r.rc === E.EOK) seatCreated(r.id, s.name);
      }
      Screen.rebuild();
    }
    if (!saved || !saved.length) { Apps.launch("terminal", { seat: 1, x: 18, y: 16 }); return; }
    for (const s of saved) {
      if (s.app === "taskbar" || s.app === "getterm" || s.app === "bdsh") continue;
      if (!Apps.get(s.app)) continue;
      const r = Apps.launch(s.app, { seat: s.seat || 1, x: s.x, y: s.y });
      if (r.rc === E.EOK && r.win) {
        r.win.x = s.x; r.win.y = s.y; r.win.w = s.w || r.win.w; r.win.h = s.h || r.win.h;
        r.win.min = !!s.min;
        Screen.place(r.win);
      }
    }
    Screen.sync();
  }

  function tick() {
    Spartan.tick(1000);
    for (const t of Spartan.list()) if (t.name === "taskbar" && t.state.clockNode) t.state.clockNode.textContent = Clock.text();
    if (!Spartan.first("display")) Console.draw();
  }

  /* ---------------- exhibit chrome ---------------- */
  function toast(kind, title, sub, actions) {
    const box = $("#toasts");
    const n = el("div", { class: "toast " + (kind || "") });
    n.appendChild(el("b", null, title));
    if (sub) n.appendChild(el("div", { class: "sub" }, sub));
    if (actions && actions.length) {
      const r = el("div", { class: "row", style: { marginTop: "7px", gap: "6px" } });
      for (const a of actions) {
        const b = el("button", { class: "hbtn sm" }, a.label);
        b.addEventListener("click", () => { a.run(); if (n.parentNode) n.parentNode.removeChild(n); });
        r.appendChild(b);
      }
      n.appendChild(r);
    }
    box.appendChild(n);
    setTimeout(() => { if (n.parentNode) n.parentNode.removeChild(n); }, actions && actions.length ? 16000 : 8000);
    while (box.children.length > 5) box.removeChild(box.firstChild);
    return n;
  }

  const MONO_WOULD = {
    ext4fs: "A filesystem bug in a monolithic kernel runs in kernel context. This would have been a kernel oops at best and a panic at worst.",
    tmpfs: "Same address space, same fate: in a monolithic kernel this code cannot fail alone.",
    fat: "Same address space, same fate: in a monolithic kernel this code cannot fail alone.",
    exfat: "Same address space, same fate: in a monolithic kernel this code cannot fail alone.",
    cdfs: "Same address space, same fate: in a monolithic kernel this code cannot fail alone.",
    vfs: "The VFS layer is the heart of a monolithic kernel's file handling. Losing it there is losing the machine.",
    display: "A graphics stack crash on a monolithic kernel takes the console with it if the driver is in the kernel — and on many systems it is.",
    devman: "Driver management inside the kernel: a fault here is a kernel fault.",
    loc: "There is no equivalent to lose, because in a monolithic kernel this registry is just a data structure nobody can crash separately.",
    ns: "There is no equivalent to lose. Task-to-task naming does not exist when everything is one task.",
    input: "An input driver fault in kernel context is a panic on most monolithic systems.",
    inet: "The network stack lives in the kernel on Linux, on Windows and on the BSDs. A fault there is a kernel fault.",
    tcp: "TCP lives in the kernel on every mainstream system. A fault there is a kernel fault.",
    rd: "A block device driver fault in kernel context is a panic.",
    default: "In a monolithic kernel this code shares the kernel's address space. A fault here is a kernel fault: a panic, a stop, a reboot."
  };
  function announceDeath(name, tid, how) {
    const consequences = {
      ext4fs: "Everything on / now answers EHANGUP. /tmp still works — tmpfs is a different program.",
      tmpfs: "/tmp is gone, and its contents with it: tmpfs kept its tree in its own address space.",
      locfs: "/loc is gone. loc itself is fine; nothing was stored in locfs.",
      loc: "Service lookups fail. Servers already holding phones carry on talking.",
      ns: "New connections cannot be made. Existing phones still work — that is what a capability is.",
      vfs: "Every filesystem operation fails. The filesystem servers below are still running and still hold their data.",
      display: "The GUI is gone. The system is not: you are looking at the text console it was covering.",
      devman: "No new drivers can be started. The drivers already running keep running.",
      input: "The keyboard has stopped. (This exhibit leaves the mouse alive on purpose so you can put it back.)",
      taskbar: "The taskbar strip is gone. Your windows are not.",
      rd: "The ramdisk block device is gone; ext4fs above it starts answering ENXIO. The bytes are still in memory.",
      tetris: "Nothing else noticed. That is the entire demonstration."
    };
    Sound.bad();
    toast("bad", "Task " + tid + " (" + name + ") is gone",
      (consequences[name] || "Its clients will get EHANGUP on their next call. Nothing else is affected.") +
      "  ·  " + (MONO_WOULD[name] || MONO_WOULD.default),
      restartAction(name));
    const tm = Spartan.first("taskmon");
    if (tm) tm.answer({ method: "TASKMON_FAULT", args: { name, tid, how } });
    Log.push("taskmon", "warn", "Task " + tid + " (" + name + ") terminated: " + how);
    Screen.rebuild();
    Screen.sync();
  }
  function restartAction(name) {
    if (Servers.get(name)) return [{ label: "Start " + name + " again", run: () => restartServer(name) }];
    if (name === "taskbar") return [{ label: "Start taskbar again", run: () => { startTaskbar(Spartan.first("display") ? 1 : 0, !Spartan.first("display")); Screen.rebuild(); Screen.sync(); } }];
    return null;
  }
  function restartServer(name) {
    const r = Servers.spawn(name);
    if (r.rc !== E.EOK) { toast("bad", "Could not start " + name, errName(r.rc) + " — " + errText(r.rc)); return; }
    /* Mounts are not restored automatically.  Nothing restores them for you
       on the real system either, so the exhibit re-mounts explicitly and
       says so, rather than pretending it happened by magic. */
    const v = Spartan.first("vfs");
    const remount = { ext4fs: ["/", "bd/initrd"], tmpfs: ["/tmp", ""], locfs: ["/loc", ""] };
    if (arch.iso) remount.cdfs = ["/vol/cd", "bd/cdrom0"];
    if (v && remount[name]) {
      const [mp, svc] = remount[name];
      v.answer({ method: "VFS_IN_UNMOUNT", args: { mp } });
      const rc = v.answer({ method: "VFS_IN_MOUNT", args: { mp, fstype: name, svc } });
      toast("good", name + " is running again",
        rc.rc === E.EOK
          ? "Re-mounted on " + mp + ". Nothing did that automatically — HelenOS has no resurrection service; the exhibit issued the mount for you and is telling you so."
          : "Started, but the mount failed: " + errName(rc.rc));
    } else if (name === "display") {
      Screen.rebuild();
      toast("good", "display is running again",
        "The screen is back and empty. The taskbar and your applications are not coming back by themselves — start them from the console or press the button.",
        [{ label: "Start taskbar + terminal", run: () => { startTaskbar(1); Apps.launch("terminal", { seat: 1 }); Screen.sync(); } }]);
    } else {
      toast("good", name + " is running again", "Its clients will re-dial the next time they need it.");
    }
    Screen.rebuild(); Screen.sync();
  }

  function killFromUi(task) {
    const name = task.name, tid = task.tid;
    const rc = Spartan.kill(tid, "killed from the exhibit task list");
    if (rc !== E.EOK) { toast("bad", "Cannot kill " + name, errName(rc)); return; }
    announceDeath(name, tid, "task list");
  }
  function serverFault(task, msg) {
    if (!task || !task.alive) return;
    const name = task.name, tid = task.tid;
    Log.push(name, "error", "Fault: " + msg);
    Spartan.kill(tid, "faulted: " + msg);
    announceDeath(name, tid, "fault");
  }
  function inputLost() {
    Log.push("input", "warn", "Input service terminated; keyboard events stop here.");
  }
  function seatCreated(id, name) {
    Screen.rebuild();
    /* A seat with no taskbar is a blank screen; start one, the way the
       system server starts one for the first seat at boot. */
    startTaskbar(id);
    Apps.launch("terminal", { seat: id });
    Screen.sync();
    toast("good", "Seat '" + name + "' created",
      "One machine, two seats, one display server. Assign it a keyboard and a mouse in Display Configuration; on real hardware that is what makes it a second workstation.");
  }
  function installed() { State.set("installed", true); }

  function reboot(toChooser) {
    clearTimeout(stepTimer); clearInterval(tickTimer); tickTimer = null;
    State.snapshotFiles(); State.save();
    Menu.closeAll();
    $("#machine").classList.remove("on");
    $("#boot").classList.remove("on");
    if (toChooser) { $("#chooser").classList.add("on"); Chooser.render(); return; }
    setTimeout(() => boot(arch.id, bootMode), 120);
  }
  function powerOff() {
    clearInterval(tickTimer); tickTimer = null;
    State.snapshotFiles(); State.save();
    Menu.closeAll();
    $("#machine").classList.remove("on");
    $("#boot").classList.add("on");
    const log = $("#bootlog");
    log.innerHTML = "";
    for (const t of ["system: Ejecting volumes.", "system: Shutting down.", "", "The system is down.", ""])
      log.appendChild(el("div", { class: "k" }, t));
    const back = el("div", { class: "ok" }, "Press any key to boot again.");
    log.appendChild(back);
    const once = () => { window.removeEventListener("keydown", once); window.removeEventListener("mousedown", once); boot(arch.id, bootMode); };
    setTimeout(() => { window.addEventListener("keydown", once); window.addEventListener("mousedown", once); }, 400);
  }

  /* ---------------- the isolation self-test ----------------
     Kill each server in turn on a scratch boot and check that (a) the kernel
     and the unrelated servers are still alive and (b) the server's own
     clients get EHANGUP rather than silence.  Then put it back.            */
  function selfTest() {
    const out = [];
    const victims = ["ext4fs", "tmpfs", "locfs", "cdfs", "tcp", "udp", "dnsrsrv", "ethip", "clipboard", "hound", "logger", "taskmon", "vbd", "volsrv"];
    let pass = 0, fail = 0;
    for (const name of victims) {
      const t = Spartan.first(name);
      if (!t) { out.push(padr(name, 12) + " skipped (not running)"); continue; }
      const before = Spartan.list().length;
      Spartan.kill(t.tid, "self-test");
      const survivors = Spartan.list();
      const kernelOk = survivors.some(x => x.kind === "kernel");
      const othersOk = survivors.length === before - 1;
      Servers.spawn(name);
      if (kernelOk && othersOk) { pass++; out.push(padr(name, 12) + " OK   — killed it; " + (before - 1) + " tasks survived, kernel among them"); }
      else { fail++; out.push(padr(name, 12) + " FAIL — collateral damage: " + (before - 1 - survivors.length) + " extra tasks died"); }
    }
    /* put the mounts back, since the test really did unmount them */
    const v = Spartan.first("vfs");
    if (v) {
      const mts = [["/", "ext4fs", "bd/initrd"], ["/tmp", "tmpfs", ""], ["/loc", "locfs", ""]];
      if (arch.iso) mts.push(["/vol/cd", "cdfs", "bd/cdrom0"]);
      for (const [mp, fstype, svc] of mts) {
        v.answer({ method: "VFS_IN_UNMOUNT", args: { mp } });
        v.answer({ method: "VFS_IN_MOUNT", args: { mp, fstype, svc } });
      }
    }
    out.push("");
    out.push(pass + " passed, " + fail + " failed.");
    out.push(fail === 0
      ? "Each server could be removed and only its own clients broke."
      : "Something is coupled that should not be. That is a bug in the exhibit.");
    Screen.rebuild(); Screen.sync();
    return out;
  }

  return {
    get arch() { return arch; }, set arch(a) { arch = a; },
    get bootMode() { return bootMode; },
    boot, skipBoot, isBooting: () => booting, isBooted: () => booted,
    toast, announceDeath, killFromUi, serverFault, inputLost, seatCreated,
    installed, reboot, powerOff, selfTest, startTaskbar, restartServer, startDriver
  };
})();

/* ==========================================================================
   MODULE 32 — THE SYSTEM SERVER AND THE RAMDISK
   --------------------------------------------------------------------------
   The system server is what the real one is: the program that starts the
   other programs and then sits there answering shutdown requests.  It is not
   an init system in the systemd sense; it has no units, no dependencies, no
   sockets and no opinions.
   ========================================================================== */
Servers.define({
  name: "system", path: "/srv/system", kind: "srv", iface: "INTERFACE_SYSTEM",
  threads: 1, resmem: 96 * 1024, virtmem: 640 * 1024,
  blurb: "The system server: starts the other servers at boot and answers poweroff and restart requests. Not an init system in the systemd sense — it has no units and no opinions.",
  start(t) { Sys.serviceRegister(t, "INTERFACE_SYSTEM"); locRegisterServer(t); locRegisterService(t, "system/system", [], "INTERFACE_SYSTEM"); return E.EOK; },
  answer(t, c) {
    if (c.method === "SYSTEM_POWEROFF") { setTimeout(() => Sim.powerOff(), 30); return { rc: E.EOK }; }
    if (c.method === "SYSTEM_RESTART") { setTimeout(() => Sim.reboot(), 30); return { rc: E.EOK }; }
    return { rc: E.ENOTSUP };
  }
});

defineBd({
  name: "rd", path: "/srv/bd/rd", svc: "bd/initrd", image: "initrd", bsize: 512, nblocks: 32768,
  blurb: "The ramdisk block device server. It manages the boot image that the loader left in physical memory — which is why killing it does not lose the bytes."
});
defineBd({
  name: "file_bd", path: "/srv/bd/file_bd", svc: "bd/file0", image: "file0", bsize: 512, nblocks: 4096,
  blurb: "Exposes a file as a block device. Started on demand."
});

/* ==========================================================================
   MODULE 33 — THE ARCHITECTURE CHOOSER
   ========================================================================== */
const Chooser = (() => {
  let sel = null, mode = "gui";
  function render() {
    sel = sel || State.get("arch", "amd64");
    mode = State.get("bootMode", "gui");
    const root = $("#chooser");
    root.innerHTML = "";
    const wrap = el("div", { class: "ch-wrap" });
    wrap.append(
      el("div", { class: "ch-kick" }, "The OS Museum"),
      el("h1", { class: "ch-title" }, "HelenOS ", el("span", null, REL + " “" + CODENAME + "”")),
      el("div", { class: "ch-sub" },
        el("b", null, "A portable microkernel-based multiserver operating system, written from scratch. "),
        "The kernel does scheduling, memory and message passing. Every filesystem, every driver, the whole network stack and the entire GUI run as separate userspace programs talking to each other over phones. This exhibit exists to let you watch that happen — and then kill one of them and see what survives."),
      el("div", { class: "ch-note" },
        el("b", null, "Portability is the headline claim, so it is the front door. "),
        "The same system runs on all nine of these. Choosing a different one changes the firmware, the boot messages, the device tree, the reported CPU, the endianness and one or two platform-only tools. ",
        el("b", null, "The desktop, the applications and the files are identical on every one of them"), " — one system, nine architectures, no per-platform forks. You can reboot into a different machine at any time."),
      el("div", { class: "ch-h" }, "Choose a machine"));
    const grid = el("div", { class: "ch-grid" });
    for (const a of ARCHS) {
      const card = el("button", { class: "ch-card" + (a.id === sel ? " sel" : ""), "data-arch": a.id });
      card.append(
        el("div", { class: "ch-arch" }, a.id),
        el("div", { class: "ch-mach" }, a.machine),
        el("div", { class: "ch-mach", style: { color: "#64748b", marginTop: "5px" } }, a.desc));
      const meta = el("div", { class: "ch-meta" });
      meta.appendChild(el("span", { class: "ch-tag" }, a.bits + "-bit"));
      meta.appendChild(el("span", { class: "ch-tag b" }, a.endian + "-endian"));
      meta.appendChild(el("span", { class: "ch-tag c" }, a.boot));
      if (a.extra.indexOf("ofw") >= 0) meta.appendChild(el("span", { class: "ch-tag" }, "has ofw"));
      card.appendChild(meta);
      card.addEventListener("click", () => { sel = a.id; render(); });
      card.addEventListener("dblclick", () => go());
      grid.appendChild(card);
    }
    wrap.appendChild(grid);
    const go1 = el("div", { class: "ch-go" });
    const boot = el("button", { class: "ch-btn" }, "Boot " + sel);
    boot.addEventListener("click", () => go());
    const modes = el("div", { class: "ch-boot-mode" });
    const mk = (id, label, hint) => {
      const l = el("label", null, el("input", { type: "radio", name: "bootmode", value: id }), el("span", null, label), el("span", { style: { color: "#5f7189" } }, hint));
      l.firstChild.checked = mode === id;
      l.addEventListener("change", () => { mode = id; });
      return l;
    };
    modes.append(
      mk("gui", "Graphical desktop", ""),
      mk("console", "Text console", "(the taskbar works here too, since 0.14.1)"));
    go1.append(boot, modes);
    wrap.appendChild(go1);
    wrap.appendChild(el("div", { class: "ch-foot" },
      el("div", null, el("b", { style: { color: "#cfe3f5" } }, "Be honest about why a simulation exists. "),
        "The real HelenOS is easy to run: a free BSD-licensed ISO that boots in QEMU in seconds, and it already runs in a browser through x86 emulators. This page cannot beat that on fidelity and does not try. What it can do is show you the twenty-odd servers behind the desktop, the messages between them, and what happens when one dies — which no emulator shows."),
      el("div", { style: { marginTop: "10px" } }, "HelenOS is the work of the HelenOS project, begun in 2001 and originating at Charles University in Prague. Free software, mostly BSD 3-clause. This exhibit is an unofficial homage with no involvement from and no endorsement by the project. The genuine article is at ", el("a", { href: "https://www.helenos.org/", target: "_blank", rel: "noreferrer noopener" }, "helenos.org"), ".")));
    root.appendChild(wrap);
  }
  function go() { Sound.click(); Sim.boot(sel, mode); }
  return { render, go };
})();

/* ==========================================================================
   MODULE 34 — INPUT ROUTING
   --------------------------------------------------------------------------
   Every keystroke that reaches a program in this simulation goes through the
   input server first, which polls a keyboard driver.  Kill either of them and
   the machine stops listening, which is exactly what should happen.
   ========================================================================== */
function focusedWindow() {
  const d = Spartan.first("display");
  if (!d) return null;
  for (const s of d.state.seats) {
    const wid = d.state.focus[s.id];
    const w = wid && d.state.wins.get(wid);
    if (w && !w.min) return w;
  }
  return null;
}
function keyboardWorks() {
  const inp = Spartan.first("input");
  if (!inp) return false;
  const r = inp.answer({ method: "INPUT_POLL", args: {} });
  return r.rc === E.EOK;
}
window.addEventListener("keydown", ev => {
  if ($("#chooser").classList.contains("on")) {
    if (ev.key === "Enter") { ev.preventDefault(); Chooser.go(); }
    return;
  }
  if (Sim.isBooting()) {
    if (ev.key === "Escape") { ev.preventDefault(); Sim.skipBoot(); }
    return;
  }
  if (!Sim.isBooted()) return;
  if (ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA")) return;
  if (ev.target && ev.target.closest && ev.target.closest("#guide")) return;

  if (ev.key === "Escape") { if (Menu.isOpen()) { ev.preventDefault(); Menu.closeAll(); return; } }
  if (ev.key === "F9" && ev.shiftKey) { ev.preventDefault(); Guide.toggle(); return; }

  const disp = Spartan.first("display");
  /* text-console shortcuts */
  if (!disp) {
    if (/^F[1-6]$/.test(ev.key)) { ev.preventDefault(); Console.switchTo(parseInt(ev.key.slice(1), 10) - 1); return; }
    if (ev.key === "F12") { ev.preventDefault(); Console.isKernel() ? Console.leaveKernel() : Console.enterKernel(); return; }
  }
  if (!keyboardWorks()) {
    ev.preventDefault();
    return;
  }
  if (disp) {
    const w = focusedWindow();
    if (ev.key === "F10" && w) { ev.preventDefault(); const h = w.node && w.node.querySelector(".wsys"); if (h) { const r = h.getBoundingClientRect(); Menu.open(r.left, r.bottom, [{ label: "~M~inimise", run: () => App.call(w, "DISPLAY_WINDOW_MINIMIZE", { wid: w.wid }) }, { label: "Ma~x~imise", run: () => App.call(w, w.max ? "DISPLAY_WINDOW_UNMAXIMIZE" : "DISPLAY_WINDOW_MAXIMIZE", { wid: w.wid }) }, { sep: true }, { label: "~C~lose", accel: "Alt-F4", run: () => App.close(w) }], { above: r.top }); } return; }
    if (ev.key === "F4" && ev.altKey && w) { ev.preventDefault(); App.close(w); return; }
    if (w && w.onFocusKey) {
      if (ev.key.startsWith("F") && ev.key.length > 1 && !w.tty) return;
      if (["Tab", " ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Backspace", "Enter", "Home", "End", "PageUp", "PageDown", "Delete"].indexOf(ev.key) >= 0 || ev.key.length === 1) ev.preventDefault();
      w.onFocusKey(ev);
    }
    return;
  }
  /* console mode */
  if (["Tab", " ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Backspace", "Enter", "Home", "End", "Delete"].indexOf(ev.key) >= 0 || ev.key.length === 1) ev.preventDefault();
  Console.key(ev);
});
window.addEventListener("mousedown", () => { if (Sim.isBooted()) Sound.click(); }, true);
window.addEventListener("resize", () => { if (Sim.isBooted()) Screen.sync(); });
window.addEventListener("beforeunload", () => { try { State.snapshotFiles(); State.save(); } catch (e) { } });

/* ==========================================================================
   MODULE 35 — GO
   ========================================================================== */
(function main() {
  Sim.arch = archById(State.get("arch", "amd64"));
  Guide.init();
  Chooser.render();
  /* The chooser stays the front door on every visit; the machine you chose
     last time is preselected, and your files and windows come back after the
     boot, which is the part worth remembering. */
  console.log("%cHelenOS " + REL + " (" + CODENAME + ") — exhibit loaded.",
    "color:#5eead4;font-weight:bold");
  console.log("The real thing is at https://www.helenos.org/ and it boots in QEMU in about ten seconds.");
})();

</script>
