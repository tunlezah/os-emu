<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Windows for Workgroups 3.11</title>
<meta name="description" content="An interactive front-end simulation of Windows for Workgroups 3.11 on MS-DOS 6.22. Nothing real runs — a museum exhibit in the browser, in one file.">
<style>
/* ============================================================
   Windows for Workgroups 3.11 simulation — one file, all inline
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
body{
  font-family:"MS Sans Serif","Microsoft Sans Serif",Tahoma,Geneva,Verdana,sans-serif;
  font-size:11px;color:#000;cursor:default;
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;font-size:inherit;}
svg{pointer-events:none;}
img{-webkit-user-drag:none;}

/* ---- stage: fixed 800x600, scaled to fit --------------------- */
#viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
#stage{position:relative;width:800px;height:600px;overflow:hidden;background:#000;transform-origin:center center;}
.layer{position:absolute;inset:0;}
.hidden{display:none !important;}

/* ---- default (Windows Default) color scheme ------------------ */
#stage{
  --desktop:#c0c0c0;
  --face:#c0c0c0; --hilite:#ffffff; --shadow:#808080; --dkshadow:#000000;
  --atitle:#000080; --atitletext:#ffffff;
  --ititle:#ffffff; --ititletext:#000000;
  --abord:#c0c0c0; --ibord:#c0c0c0;
  --winbg:#ffffff; --wintext:#000000;
  --menubg:#ffffff; --menutext:#000000;
  --selbg:#000080; --seltext:#ffffff;
  --appws:#ffffff;
  --graytext:#808080;
}

/* ---- DOS full screens ---------------------------------------- */
.dos-screen{background:#000;color:#c0c0c0;overflow:hidden;}
.dos-screen pre{
  font-family:"Px437 IBM VGA8","Fixedsys","Lucida Console","Consolas",monospace;
  font-size:14px;line-height:16px;letter-spacing:0px;
  padding:2px 4px;white-space:pre-wrap;word-break:break-all;
  height:100%;overflow:hidden;color:#c0c0c0;background:#000;
}
.dos-screen .cur{display:inline-block;width:8px;background:#c0c0c0;animation:blink 1s steps(1) infinite;}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}

/* MS-DOS Editor (EDIT) */
.edit-ui{position:absolute;inset:0;display:flex;flex-direction:column;background:#0000a8;
  font-family:"Fixedsys","Lucida Console","Consolas",monospace;font-size:14px;line-height:16px;}
.edit-menubar{background:#c0c0c0;color:#000;padding:0 8px;flex:0 0 16px;display:flex;gap:16px;}
.edit-menubar span b{color:#000;}
.edit-title{background:#0000a8;color:#c0c0c0;text-align:center;flex:0 0 16px;}
.edit-title span{background:#c0c0c0;color:#000;padding:0 8px;}
.edit-body{flex:1;position:relative;border-left:8px solid #0000a8;border-right:8px solid #0000a8;}
.edit-body textarea{
  position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:none;
  background:#0000a8;color:#c0c0c0;caret-color:#fff;
  font-family:inherit;font-size:14px;line-height:16px;white-space:pre;overflow:auto;}
.edit-status{background:#c0c0c0;color:#000;flex:0 0 16px;padding:0 8px;display:flex;justify-content:space-between;}

/* ---- splash ---------------------------------------------------- */
#splash{background:#000;display:flex;align-items:center;justify-content:center;}
#splash .inner{text-align:center;color:#fff;font-family:Georgia,'Times New Roman',serif;}
#splash .brand{font-size:15px;letter-spacing:2px;color:#c0c0c0;font-family:Verdana,sans-serif;margin-bottom:18px;}
#splash h1{font-size:44px;font-weight:bold;font-style:italic;letter-spacing:1px;margin:10px 0 2px;}
#splash h2{font-size:26px;font-weight:normal;font-style:italic;margin-bottom:14px;}
#splash .ver{font-size:15px;font-family:Verdana,sans-serif;color:#fff;}
#splash .copy{font-size:11px;font-family:Verdana,sans-serif;color:#c0c0c0;margin-top:26px;line-height:15px;}

/* ---- desktop --------------------------------------------------- */
#winui{background:var(--desktop);}
#desktop{position:absolute;inset:0;overflow:hidden;}
#desktop.pat-dots{background-image:radial-gradient(#000 12%,transparent 13%);background-size:8px 8px;}
#desktop.pat-boxes{background-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);background-size:16px 16px;}
#desktop.pat-weave{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.35) 0 2px,transparent 2px 8px),repeating-linear-gradient(-45deg,rgba(0,0,0,.35) 0 2px,transparent 2px 8px);}
#desktop.pat-thatch{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 1px,transparent 1px 4px);}
#desktop.wall-tile,#desktop.wall-center{background-repeat:repeat;}
#desktop.wall-center{background-repeat:no-repeat;background-position:center;}

/* ---- window chrome --------------------------------------------- */
.win{position:absolute;display:flex;flex-direction:column;background:var(--face);
  border:1px solid #000;box-shadow:none;min-width:100px;min-height:40px;}
.win .frame{position:absolute;inset:0;pointer-events:none;border:3px solid var(--ibord);z-index:0;}
.win.active>.frame{border-color:var(--abord);}
.win .inner{position:absolute;inset:3px;border:1px solid #000;display:flex;flex-direction:column;background:var(--face);}
.win.dialog .inner{inset:2px;border:1px solid var(--face);}
.win.dialog{border:1px solid #000;}
.win.thin{min-height:0;}
/* corner resize notches */
.win .notch{position:absolute;background:#000;pointer-events:none;z-index:1;}

/* title bar */
.tb{flex:0 0 18px;height:18px;display:flex;align-items:stretch;background:var(--ititle);color:var(--ititletext);overflow:hidden;position:relative;z-index:2;}
.win.active>.inner>.tb{background:var(--atitle);color:var(--atitletext);}
.tb .ttl{flex:1;text-align:center;font-weight:bold;font-size:11px;line-height:18px;
  overflow:hidden;white-space:nowrap;text-overflow:clip;padding:0 2px;}
.tb .sysbox{flex:0 0 18px;background:var(--face);border-right:1px solid #000;position:relative;}
.tb .sysbox::after{content:'';position:absolute;left:2px;top:7px;width:13px;height:3px;
  background:#fff;border:1px solid #000;border-top-color:#808080;border-left-color:#808080;box-shadow:1px 1px 0 #808080;}
.tb .sysbox:active{background:#808080;}
.tbbtns{flex:0 0 auto;display:flex;}
.tbb{width:18px;height:18px;background:var(--face);border-left:1px solid #000;position:relative;}
.tbb:active{background:#808080;}
.tbb .tri{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%);}
.tbb.mn .tri{border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #000;margin-top:1px;}
.tbb.mx .tri{border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:6px solid #000;margin-top:-1px;}
.tbb.rs .tri{border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:5px solid #000;margin-top:-3px;}
.tbb.rs::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin-top:3px;
  border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #000;width:0;height:0;}

/* menubar */
.menubar{flex:0 0 18px;background:var(--menubg);color:var(--menutext);display:flex;align-items:stretch;
  border-bottom:1px solid #000;padding-left:1px;position:relative;z-index:2;}
.menubar .mi{padding:2px 7px 0 7px;line-height:15px;white-space:nowrap;}
.menubar .mi.open,.menubar .mi.hot{background:var(--selbg);color:var(--seltext);}
.menubar .mi u{text-decoration:underline;}

/* menu popup */
.menupop{position:absolute;background:var(--menubg);color:var(--menutext);border:1px solid #000;
  box-shadow:2px 2px 0 rgba(0,0,0,.5);z-index:6000;min-width:130px;padding:1px;}
.menupop .mrow{display:flex;justify-content:space-between;gap:24px;padding:2px 20px 2px 20px;line-height:13px;white-space:nowrap;position:relative;}
.menupop .mrow.sel{background:var(--selbg);color:var(--seltext);}
.menupop .mrow.dis{color:var(--graytext);}
.menupop .mrow.dis.sel{background:var(--selbg);color:var(--graytext);}
.menupop .mrow .chk{position:absolute;left:5px;top:1px;font-weight:bold;}
.menupop .msep{height:1px;background:#808080;margin:3px 1px;border-bottom:1px solid #fff;}
.menupop u{text-decoration:underline;}
.menupop .acc{margin-left:16px;}

/* window body */
.wbody{flex:1;position:relative;overflow:hidden;background:var(--winbg);color:var(--wintext);z-index:2;}
.wbody.gray{background:var(--face);}
.statusbar{flex:0 0 18px;background:var(--face);border-top:1px solid #808080;display:flex;z-index:2;
  font-size:11px;align-items:center;}
.statusbar .cell{border:1px solid;border-color:#808080 #fff #fff #808080;margin:1px 2px;padding:0 4px;flex:1;
  height:15px;line-height:13px;overflow:hidden;white-space:nowrap;}
.statusbar .cell.fix{flex:0 0 auto;}

/* resize handles */
.rh{position:absolute;z-index:5;}
.rh.n{top:-1px;left:8px;right:8px;height:4px;cursor:n-resize;}
.rh.s{bottom:-1px;left:8px;right:8px;height:4px;cursor:s-resize;}
.rh.e{right:-1px;top:8px;bottom:8px;width:4px;cursor:e-resize;}
.rh.w{left:-1px;top:8px;bottom:8px;width:4px;cursor:w-resize;}
.rh.ne{top:-1px;right:-1px;width:10px;height:10px;cursor:ne-resize;}
.rh.nw{top:-1px;left:-1px;width:10px;height:10px;cursor:nw-resize;}
.rh.se{bottom:-1px;right:-1px;width:10px;height:10px;cursor:se-resize;}
.rh.sw{bottom:-1px;left:-1px;width:10px;height:10px;cursor:sw-resize;}

/* XOR drag rectangle */
#dragrect{position:absolute;border:3px solid #fff;mix-blend-mode:difference;pointer-events:none;z-index:9000;}

/* ---- minimized desktop icons ----------------------------------- */
.deskicon{position:absolute;width:74px;text-align:center;z-index:10;}
.deskicon .ic{display:inline-block;width:32px;height:32px;}
.deskicon .lbl{margin-top:1px;font-size:11px;line-height:12px;color:#000;padding:0 2px;display:inline-block;max-width:74px;}
.deskicon.sel .lbl{background:var(--selbg);color:var(--seltext);}

/* ---- MDI ------------------------------------------------------- */
.mdiclient{position:absolute;inset:0;background:var(--appws);overflow:hidden;}
.mdiicon{position:absolute;width:74px;text-align:center;}
.mdiicon .lbl{margin-top:1px;font-size:11px;line-height:12px;padding:0 2px;display:inline-block;max-width:74px;}
.mdiicon.sel .lbl{background:var(--selbg);color:var(--seltext);}

/* ---- buttons ---------------------------------------------------- */
.btn{
  display:inline-block;min-width:70px;height:23px;padding:0 12px;
  background:var(--face);color:#000;text-align:center;line-height:21px;
  border:1px solid #000;border-radius:2px;position:relative;font-size:11px;
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #808080,inset 2px 2px 0 #fff,inset -2px -2px 0 #808080;
  white-space:nowrap;
}
.btn u{text-decoration:underline;}
.btn:active:not(.dis){box-shadow:inset 1px 1px 0 #808080;line-height:23px;}
.btn.def{outline:1px solid #000;outline-offset:0px;border-width:1px;box-shadow:0 0 0 1px #000,inset 1px 1px 0 #fff,inset -1px -1px 0 #808080,inset 2px 2px 0 #fff,inset -2px -2px 0 #808080;}
.btn.dis{color:#808080;text-shadow:1px 1px 0 #fff;}
.btn:focus{outline:none;}
.btn.focus .flbl{outline:1px dotted #000;}
.flbl{display:inline-block;padding:0 1px;}

/* text fields / lists */
.tf{height:20px;padding:1px 3px;background:var(--winbg);color:var(--wintext);border:1px solid;
  border-color:#808080 #fff #fff #808080;outline:none;box-shadow:inset 1px 1px 0 #000 ;width:100%;font-size:11px;}
textarea.tf{height:auto;resize:none;}
.listbox{background:var(--winbg);color:var(--wintext);border:1px solid;border-color:#808080 #fff #fff #808080;
  box-shadow:inset 1px 1px 0 #000;overflow-y:auto;overflow-x:hidden;font-size:11px;}
.listbox .li{padding:0 3px;line-height:14px;white-space:nowrap;}
.listbox .li.sel{background:var(--selbg);color:var(--seltext);}
select.tf{padding:0;}

/* custom checkbox / radio (3.1 style: X in a box) */
.cb{display:inline-flex;align-items:center;gap:5px;line-height:14px;}
.cb .box{width:13px;height:13px;background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;
  box-shadow:inset 1px 1px 0 #000;position:relative;flex:0 0 13px;}
.cb.on .box::after{content:'✕';position:absolute;left:1px;top:-2px;font-size:11px;font-weight:bold;color:#000;}
.cb .box.round{border-radius:50%;box-shadow:inset 1px 1px 0 #808080;border-color:#000 #fff #fff #000;}
.cb.on .box.round::after{content:'';left:3px;top:3px;width:5px;height:5px;background:#000;border-radius:50%;font-size:0;}
.cb u{text-decoration:underline;}
.cb.dis{color:#808080;}

/* group box */
.grpbox{border:1px solid;border-color:#808080 #fff #fff #808080;box-shadow:1px 1px 0 #fff,inset 1px 1px 0 #fff;
  position:relative;padding:12px 8px 8px;margin-top:6px;}
.grpbox>.cap{position:absolute;top:-7px;left:8px;background:var(--face);padding:0 3px;}

/* ---- dialogs / message boxes ------------------------------------ */
.msgbody{background:var(--winbg);padding:14px 12px 12px;display:flex;gap:14px;align-items:flex-start;min-height:50px;}
.msgbody .mtext{padding-top:2px;line-height:14px;max-width:330px;white-space:pre-wrap;}
.btnrow{background:var(--winbg);display:flex;justify-content:center;gap:8px;padding:4px 10px 12px;}
.dlgpad{padding:10px;background:var(--face);}

/* ---- Program Manager items -------------------------------------- */
.pmitems{position:absolute;inset:0;overflow:auto;background:var(--winbg);padding:6px 0;}
.pmitem{display:inline-block;width:72px;vertical-align:top;text-align:center;margin:4px 0;}
.pmitem .ic{display:inline-block;width:32px;height:32px;}
.pmitem .lbl{margin-top:3px;font-size:11px;line-height:12px;padding:0 2px;display:inline-block;max-width:70px;}
.pmitem.sel .lbl{background:var(--selbg);color:var(--seltext);}

/* ---- File Manager ------------------------------------------------ */
.wf-drivebar{flex:0 0 24px;background:var(--face);border-bottom:1px solid #808080;display:flex;align-items:center;padding:0 4px;gap:2px;z-index:2;}
.wf-drive{width:30px;height:18px;display:flex;align-items:center;justify-content:center;position:relative;}
.wf-drive.cur{outline:1px dotted #000;}
.wf-drive.act{border:1px solid;border-color:#808080 #fff #fff #808080;}
.wf-split{display:flex;position:absolute;inset:0;}
.wf-tree{flex:0 0 45%;overflow:auto;background:var(--winbg);border-right:2px solid #808080;padding:2px;}
.wf-list{flex:1;overflow:auto;background:var(--winbg);padding:2px;}
.wf-row{display:flex;align-items:center;gap:4px;white-space:nowrap;line-height:16px;padding-right:6px;}
.wf-row .nm{padding:0 2px;}
.wf-row.sel .nm{background:var(--selbg);color:var(--seltext);}
.wf-row .meta{color:var(--wintext);margin-left:8px;}
.wf-row.sel .meta{}
.wf-path{flex:0 0 18px;background:var(--face);display:flex;align-items:center;padding:0 6px;border-bottom:1px solid #808080;z-index:2;overflow:hidden;white-space:nowrap;}

/* ---- Control Panel ------------------------------------------------ */
.cpl-grid{position:absolute;inset:0;overflow:auto;background:var(--winbg);padding:8px 2px;}
.cpl-item{display:inline-block;width:86px;text-align:center;vertical-align:top;margin:6px 0;}
.cpl-item .lbl{margin-top:3px;display:inline-block;padding:0 2px;line-height:12px;}
.cpl-item.sel .lbl{background:var(--selbg);color:var(--seltext);}

/* ---- Calculator ---------------------------------------------------- */
.calc-pane{background:var(--face);position:absolute;inset:0;padding:6px;}
.calc-disp{background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px 0 #000;
  text-align:right;padding:2px 6px;font-size:13px;height:22px;margin-bottom:8px;overflow:hidden;}
.calc-grid{display:grid;gap:4px;}
.calc-btn{height:22px;min-width:0;padding:0;font-weight:bold;}
.calc-btn.red{color:#800000;}
.calc-btn.blue{color:#000080;}

/* ---- Notepad / text editors ---------------------------------------- */
.padta{position:absolute;inset:0;width:100%;height:100%;border:0;outline:none;resize:none;
  background:var(--winbg);color:var(--wintext);font-family:"Fixedsys","Lucida Console",monospace;font-size:13px;line-height:15px;padding:2px 3px;}
.padta.wrap{white-space:pre-wrap;}
.padta.nowrap{white-space:pre;overflow:auto;}

/* Write */
.write-ruler{flex:0 0 20px;background:var(--winbg);border-bottom:1px solid #808080;position:relative;overflow:hidden;z-index:2;
  background-image:repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 8px);background-size:8px 5px;background-position:8px 12px;background-repeat:repeat-x;}
.write-ruler::after{content:'1                2                3                4                5                6';
  position:absolute;left:8px;top:0;font-size:9px;letter-spacing:0;color:#000;font-family:"Lucida Console",monospace;}
.write-body{position:absolute;inset:0;overflow:auto;background:var(--winbg);}
.write-page{min-height:100%;padding:10px 24px;outline:none;font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:19px;
  -webkit-user-select:text;user-select:text;}
.write-page h1{font-size:20px;margin-bottom:8px;}

/* ---- Paintbrush ------------------------------------------------------ */
.pb-wrap{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--face);}
.pb-main{flex:1;display:flex;overflow:hidden;}
.pb-tools{flex:0 0 50px;background:var(--face);border-right:1px solid #808080;padding:2px;display:grid;grid-template-columns:1fr 1fr;gap:2px;align-content:start;}
.pb-tool{height:22px;background:var(--winbg);border:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:12px;}
.pb-tool.sel{background:var(--selbg);color:var(--seltext);}
.pb-canvas-wrap{flex:1;overflow:auto;background:#808080;padding:4px;}
.pb-canvas{background:#fff;border:1px solid #000;cursor:crosshair;}
.pb-pal{flex:0 0 34px;background:var(--face);border-top:1px solid #808080;display:flex;align-items:center;padding:2px 4px;gap:2px;}
.pb-cur{width:26px;height:26px;border:1px solid #000;background:#fff;position:relative;margin-right:6px;}
.pb-cur .fg{position:absolute;left:3px;top:3px;width:12px;height:12px;border:1px solid #000;}
.pb-cur .bg{position:absolute;right:3px;bottom:3px;width:12px;height:12px;border:1px solid #000;}
.pb-sw{width:13px;height:13px;border:1px solid #000;}
.pb-widths{display:flex;flex-direction:column;gap:3px;margin-left:8px;}

/* ---- Minesweeper ------------------------------------------------------ */
.mine-wrap{background:var(--face);padding:6px;position:absolute;inset:0;}
.mine-top{display:flex;justify-content:space-between;align-items:center;border:2px solid;border-color:#808080 #fff #fff #808080;padding:4px 5px;margin-bottom:6px;}
.mine-lcd{background:#000;color:#f00;font-family:"Lucida Console",monospace;font-size:18px;font-weight:bold;padding:0 2px;line-height:22px;letter-spacing:1px;}
.mine-face{width:26px;height:26px;min-width:0;padding:0;font-size:14px;line-height:22px;}
.mine-grid{border:3px solid;border-color:#808080 #fff #fff #808080;display:grid;background:var(--face);}
.mc{width:16px;height:16px;font-family:"Lucida Console",monospace;font-weight:bold;font-size:12px;line-height:14px;text-align:center;
  background:var(--face);border:2px outset #fff;}
.mc.open{border:1px solid #808080;border-width:0 0 1px 1px;background:var(--face);}
.mc.n1{color:#0000ff;}.mc.n2{color:#008000;}.mc.n3{color:#ff0000;}.mc.n4{color:#000080;}
.mc.n5{color:#800000;}.mc.n6{color:#008080;}.mc.n7{color:#000;}.mc.n8{color:#808080;}
.mc.boom{background:#f00;}

/* ---- Solitaire --------------------------------------------------------- */
.sol-table{position:absolute;inset:0;background:#008000;overflow:hidden;}
.card{position:absolute;width:71px;height:96px;background:#fff;border:1px solid #000;border-radius:5px;font-size:12px;}
.card .c-tl{position:absolute;left:3px;top:2px;text-align:center;line-height:11px;font-weight:bold;}
.card .c-br{position:absolute;right:3px;bottom:2px;text-align:center;line-height:11px;font-weight:bold;transform:rotate(180deg);}
.card .c-mid{position:absolute;inset:14px 6px;font-size:26px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;line-height:24px;}
.card.red{color:#f00;}
.card.back{background:#0000a8;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,rgba(255,255,255,.55) 0 1px,transparent 1px 7px);
  background-origin:border-box;border:1px solid #000;box-shadow:inset 0 0 0 3px #fff;}
.card .stackrank{position:absolute;left:3px;top:2px;font-weight:bold;line-height:11px;text-align:center;}
.sol-slot{position:absolute;width:71px;height:96px;border:1px solid #005000;border-radius:5px;color:#005800;
  display:flex;align-items:center;justify-content:center;font-size:30px;}

/* ---- Clock -------------------------------------------------------------- */
.clock-body{position:absolute;inset:0;background:var(--face);}
.clock-body canvas{position:absolute;inset:0;}

/* ---- Terminal / Chat ------------------------------------------------------ */
.term-body{position:absolute;inset:0;background:#fff;color:#000;overflow:auto;padding:2px 4px;
  font-family:"Fixedsys","Lucida Console",monospace;font-size:13px;line-height:15px;white-space:pre-wrap;word-break:break-all;}
.chat-split{position:absolute;inset:0;display:flex;flex-direction:column;}
.chat-pane{flex:1;overflow:auto;background:var(--winbg);padding:3px 5px;font-family:"Fixedsys","Lucida Console",monospace;font-size:13px;white-space:pre-wrap;}
.chat-pane.them{border-top:2px solid #808080;}
.chat-status{flex:0 0 18px;background:var(--face);border-top:1px solid #808080;padding:0 6px;line-height:17px;}

/* ---- WinHelp --------------------------------------------------------------- */
.help-btnbar{flex:0 0 26px;background:var(--face);border-bottom:1px solid #808080;display:flex;gap:2px;padding:2px 4px;z-index:2;}
.help-btnbar .btn{min-width:54px;height:20px;line-height:18px;padding:0 8px;}
.help-body{position:absolute;inset:0;overflow:auto;background:var(--winbg);padding:8px 12px;line-height:15px;}
.help-body h1{font-size:15px;margin-bottom:8px;}
.help-body h2{font-size:12px;margin:10px 0 4px;}
.help-body p{margin-bottom:8px;}
.help-body ul{margin:0 0 8px 20px;}
a.hjump{color:#008000;text-decoration:underline;font-weight:bold;cursor:pointer;}
a.hpop{color:#008000;text-decoration:none;border-bottom:1px dotted #008000;font-weight:bold;cursor:pointer;}
.help-popup{position:absolute;background:#ffffcc;border:1px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,.4);
  padding:8px 10px;max-width:280px;z-index:6500;line-height:14px;}

/* ---- misc apps --------------------------------------------------------------- */
.meter-canvas{position:absolute;inset:0;}
.about-box{display:flex;gap:12px;padding:12px;background:var(--winbg);}
.about-box .txt{line-height:15px;}
.credits-wrap{position:absolute;inset:0;background:#000080;overflow:hidden;color:#fff;text-align:center;}
.credits-roll{position:absolute;left:0;right:0;line-height:20px;font-size:13px;}
#bsod{background:#0000a8;color:#c0c0c0;display:flex;align-items:center;justify-content:center;}

#coolswitch{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:9500;

<noscript><p style="color:#0f0;font-family:monospace;padding:20px">This Windows for Workgroups 3.11 simulation requires JavaScript.</p></noscript>
<script>
"use strict";
/* ============================================================
   Windows for Workgroups 3.11 — front-end simulation.
   Nothing real runs: no OS, no network, no files. One HTML file.
   ============================================================ */

/* ================= Utilities ================= */
const U = {
  el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; },
  esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); },
  // parse "&File" -> {html:'<u>F</u>ile', key:'f', text:'File'}
  amp(label){
    let key=null, html='', text='';
    for(let i=0;i<label.length;i++){
      if(label[i]==='&' && i+1<label.length){
        if(label[i+1]==='&'){ html+='&amp;'; text+='&'; i++; }
        else { key=label[i+1].toLowerCase(); html+='<u>'+U.esc(label[i+1])+'</u>'; text+=label[i+1]; i++; }
      } else { html+=U.esc(label[i]); text+=label[i]; }
    }
    return {key, html, text};
  },
  pad(n,w,c){ n=String(n); while(n.length<w) n=(c||' ')+n; return n; },
  padr(s,w){ s=String(s); while(s.length<w) s+=' '; return s; },
  fmtN(n){ return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g,','); },
  rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); },
  pick(a){ return a[Math.floor(Math.random()*a.length)]; },
  clamp(v,a,b){ return v<a?a:(v>b?b:v); },
  now(){ return new Date(); },
  dosDate(d){ d=d||new Date(1993,10,8); return U.pad(d.getMonth()+1,2,'0')+'-'+U.pad(d.getDate(),2,'0')+'-'+String(d.getFullYear()).slice(2); },
  dosTime(d){ d=d||new Date(1993,10,8,3,11); let h=d.getHours(), ap=h>=12?'p':'a'; h=h%12; if(h===0)h=12;
    return U.pad(h,2)+':'+U.pad(d.getMinutes(),2,'0')+ap; },
};

/* ================= Persistent state ================= */
const S = {
  KEY:'wfw311.state',
  data:{},
  load(){ try{ const j=localStorage.getItem(S.KEY); S.data=j?JSON.parse(j):{}; }catch(e){ S.data={}; } },
  save(){ try{ localStorage.setItem(S.KEY, JSON.stringify(S.data)); }catch(e){} },
  get(k,d){ return (k in S.data)? S.data[k] : d; },
  set(k,v){ S.data[k]=v; S.save(); },
  del(k){ delete S.data[k]; S.save(); }
};
S.load();

/* ================= System Resources accounting ================= */
const Res = {
  used:0, warned:false,
  pct(){ return Math.round(Math.max(4, 93 - Res.used)); },
  use(n){
    Res.used+=n;
    if(Res.pct()<18 && !Res.warned && window.Dlg && WM.ready){
      Res.warned=true;
      setTimeout(()=>Dlg.msg(null,{title:'Program Manager', icon:'excl',
        text:'System Resources are dangerously low.\nClose one or more applications, and then try again.'}),200);
    }
    if(Res.pct()>30) Res.warned=false;
  },
  free(n){ Res.used=Math.max(0,Res.used-n); },
  memFree(){ return 14212 + (Res.used*-97) + U.rnd(-50,50); }
};

/* ================= Simulated clipboard ================= */
const Clip = {
  text:'',
  put(t){ Clip.text=String(t==null?'':t); if(Clip.onchange)Clip.onchange(); },
  get(){ return Clip.text; },
  onchange:null
};

/* ================= Sound (Web Audio, synthesized, default OFF) ============ */
const Snd = {
  ctx:null,
  on(){ return !!S.get('soundOn',false); },
  ac(){ if(!Snd.ctx){ try{ Snd.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } 
    if(Snd.ctx && Snd.ctx.state==='suspended') Snd.ctx.resume();
    return Snd.ctx; },
  tone(freq,dur,type,vol,when){
    const c=Snd.ac(); if(!c)return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.value=0.0001;
    const t0=c.currentTime+(when||0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  },
  play(name,force){
    if(!force && !Snd.on()) return;
    switch(name){
      case 'startup': // tada-style flourish
        [[523,0],[659,0.09],[784,0.18],[1047,0.3]].forEach(p=>Snd.tone(p[0],0.5,'triangle',0.14,p[1]));
        Snd.tone(262,0.7,'triangle',0.08,0.3);
        break;
      case 'ding': Snd.tone(880,0.35,'triangle',0.15); break;
      case 'chord': Snd.tone(392,0.4,'square',0.08); Snd.tone(494,0.4,'square',0.08); Snd.tone(587,0.4,'square',0.08); break;
      case 'chimes': [[1319,0],[1047,0.15],[880,0.3],[659,0.45]].forEach(p=>Snd.tone(p[0],0.4,'sine',0.12,p[1])); break;
      case 'exclam': Snd.tone(600,0.15,'square',0.12); Snd.tone(500,0.15,'square',0.12,0.13); break;
      case 'beep': Snd.tone(880,0.12,'square',0.1); break;
      case 'ring': for(let i=0;i<12;i++) Snd.tone(1500+((i%2)*400),0.05,'square',0.1,i*0.055); break;
      case 'printer': for(let i=0;i<24;i++) Snd.tone(U.rnd(1800,2600),0.02,'sawtooth',0.05,i*0.04); break;
      case 'modem':
        Snd.tone(1300,0.5,'sine',0.1,0); Snd.tone(2100,0.5,'sine',0.1,0.5);
        for(let i=0;i<20;i++) Snd.tone(U.rnd(400,3000),0.05,'sawtooth',0.05,1+i*0.06);
        break;
      case 'shuffle': for(let i=0;i<8;i++) Snd.tone(U.rnd(2000,4000),0.02,'square',0.04,i*0.03); break;
      case 'boom': Snd.tone(80,0.5,'sawtooth',0.25); Snd.tone(60,0.6,'square',0.2,0.05); break;
      case 'yay': [[523,0],[659,0.1],[784,0.2],[1047,0.3],[1319,0.4]].forEach(p=>Snd.tone(p[0],0.35,'triangle',0.12,p[1])); break;
    }
  }
};

/* ================= Pixel-art icon system ================= */
/* Palette letters -> 16-color VGA-ish palette */
const PAL = {
  K:'#000000', W:'#ffffff', R:'#ff0000', G:'#00ff00', B:'#0000ff',
  Y:'#ffff00', C:'#00ffff', M:'#ff00ff', g:'#808080', l:'#c0c0c0',
  r:'#800000', n:'#008000', b:'#000080', y:'#808000', c:'#008080', m:'#800080',
  o:'#ff8000', t:'#00c0c0', e:'#ffe0c0', d:'#404040'
};
function px(rows, scale, extraPal){
  scale=scale||2;
  const pal=extraPal?Object.assign({},PAL,extraPal):PAL;
  const h=rows.length, w=rows[0].length;
  let out='';
  for(let y=0;y<h;y++){
    const row=rows[y];
    let x=0;
    while(x<w){
      const ch=row[x];
      if(ch===' '|| ch==='.'){ x++; continue; }
      let run=1; while(x+run<w && row[x+run]===ch) run++;
      const col=pal[ch]||'#f0f';
      out+='<rect x="'+x+'" y="'+y+'" width="'+run+'" height="1" fill="'+col+'"/>';
      x+=run;
    }
  }
  return '<svg class="pix" viewBox="0 0 '+w+' '+h+'" width="'+(w*scale)+'" height="'+(h*scale)+'" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">'+out+'</svg>';
}

/* ================= Virtual File System (FAT flavor, 8.3) ================= */
const VFS = {
  drives:{},           // letter -> {label, serial, total, node}
  overlayKey:'wfw311.fsoverlay',

  init(){
    VFS.drives = {
      A: { label:'', serial:'', total:1457664, empty:true, node:VFS.dir() },
      C: { label:'MS-DOS_6', serial:'1A2F-3C41', total:127563776, node:VFS.dir() }
    };
    VFS.buildC();
    VFS.applyOverlay();
  },
  dir(){ return { d:true, c:{} }; },
  file(size, date, time, txt){ return { d:false, s:size, dt:date||'11-08-93', tm:time||'3:11a', txt:(txt!=null?txt:null) }; },

  // ---------- path helpers ----------
  norm(p){
    p=String(p||'').trim().toUpperCase().replace(/\//g,'\\');
    return p;
  },
  split(p){ // returns {drive, parts[]}
    p=VFS.norm(p);
    let drive='C';
    if(/^[A-Z]:/.test(p)){ drive=p[0]; p=p.slice(2); }
    const parts=p.split('\\').filter(x=>x.length);
    return {drive, parts};
  },
  resolve(p){ // -> {drive, parts, node} or null
    const {drive, parts}=VFS.split(p);
    const dr=VFS.drives[drive];
    if(!dr) return null;
    let node=dr.node;
    for(const part of parts){
      if(!node || !node.d) return null;
      node=node.c[part];
      if(!node) return null;
    }
    return node?{drive, parts, node}:null;
  },
  parentOf(p){
    const {drive, parts}=VFS.split(p);
    if(!parts.length) return null;
    const name=parts[parts.length-1];
    const par=VFS.resolve(drive+':\\'+parts.slice(0,-1).join('\\'));
    return par?{drive, name, parent:par.node, parts}:null;
  },
  join(dir,name){ dir=VFS.norm(dir); if(!/\\$/.test(dir))dir+='\\'; return dir+VFS.norm(name); },
  validName(n){ return /^[A-Z0-9_$~!#%&\-{}()@'`^]{1,8}(\.[A-Z0-9_$~!#%&\-{}()@'`^]{1,3})?$/.test(n); },
  list(p){ // -> sorted [{name,node}]
    const r=VFS.resolve(p);
    if(!r || !r.node.d) return null;
    const names=Object.keys(r.node.c).sort((a,b)=>{
      const A=r.node.c[a], B=r.node.c[b];
      if(A.d!==B.d) return A.d?-1:1;
      return a<b?-1:1;
    });
    return names.map(n=>({name:n, node:r.node.c[n]}));
  },
  freeBytes(drive){
    const dr=VFS.drives[drive]; if(!dr) return 0;
    let used=0;
    (function walk(n){ if(n.d){ for(const k in n.c) walk(n.c[k]); } else used+=(n.s||0); })(dr.node);
    return Math.max(0, dr.total-used-22188032);
  },
  mkdir(p){
    const {drive,parts}=VFS.split(p);
    if(!parts.length) return 'Invalid directory';
    const name=parts[parts.length-1];
    if(!VFS.validName(name)||name.includes('.')&&name.split('.')[0].length>8) return 'Invalid directory name';
    const par=VFS.resolve(drive+':\\'+parts.slice(0,-1).join('\\'));
    if(!par||!par.node.d) return 'Unable to create directory';
    if(par.node.c[name]) return 'Directory already exists';
    par.node.c[name]=VFS.dir();
    VFS.record('mkdir', drive+':\\'+parts.join('\\'));
    return null;
  },
  writeFile(p, txt, opts){
    const {drive,parts}=VFS.split(p);
    if(!parts.length) return 'Invalid path';
    const name=parts[parts.length-1];
    const par=VFS.resolve(drive+':\\'+parts.slice(0,-1).join('\\'));
    if(!par||!par.node.d) return 'Path not found';
    const d=new Date();
    const f=par.node.c[name];
    if(f&&f.d) return 'Access denied';
    par.node.c[name]=VFS.file((txt||'').length, U.dosDate(d), U.dosTime(d), txt||'');
    if(opts&&opts.bmp) par.node.c[name].bmp=opts.bmp;
    VFS.record('write', drive+':\\'+parts.join('\\'), {txt:txt||'', bmp:opts&&opts.bmp});
    return null;
  },
  del(p){
    const info=VFS.parentOf(p);
    if(!info||!info.parent.c[info.name]) return 'File not found';
    const n=info.parent.c[info.name];
    if(n.d && Object.keys(n.c).length) return 'Directory not empty';
    delete info.parent.c[info.name];
    VFS.record('del', info.drive+':\\'+info.parts.join('\\'));
    return null;
  },
  rename(p, newName){
    newName=VFS.norm(newName);
    if(!VFS.validName(newName)) return 'Invalid filename';
    const info=VFS.parentOf(p);
    if(!info||!info.parent.c[info.name]) return 'File not found';
    if(info.parent.c[newName]) return 'A file with that name already exists';
    info.parent.c[newName]=info.parent.c[info.name];
    delete info.parent.c[info.name];
    VFS.record('ren', info.drive+':\\'+info.parts.join('\\'), {to:newName});
    return null;
  },
  copy(src, dstDir, dstName){
    const s=VFS.resolve(src);
    if(!s||s.node.d) return 'Cannot copy';
    const d=VFS.resolve(dstDir);
    if(!d||!d.node.d) return 'Path not found';
    const name=VFS.norm(dstName||s.parts[s.parts.length-1]);
    d.node.c[name]={d:false, s:s.node.s, dt:s.node.dt, tm:s.node.tm, txt:s.node.txt, bmp:s.node.bmp};
    VFS.record('write', VFS.join(dstDir,name), {txt:s.node.txt||'', bmp:s.node.bmp});
    return null;
  },
  read(p){
    const r=VFS.resolve(p);
    if(!r||r.node.d) return null;
    return r.node.txt!=null ? r.node.txt : '';
  },
  // overlay persistence: user changes only
  record(op, path, extra){
    const ov=S.get('fsOverlay',[]);
    ov.push(Object.assign({op,path},extra||{}));
    if(ov.length>400) ov.splice(0, ov.length-400);
    S.set('fsOverlay', ov);
  },
  applyOverlay(){
    const ov=S.get('fsOverlay',[]);
    for(const e of ov){
      try{
        if(e.op==='mkdir'){ const info=VFS.parentOf(e.path); if(info&&!info.parent.c[info.name]) info.parent.c[info.name]=VFS.dir(); }
        else if(e.op==='write'){ const info=VFS.parentOf(e.path); if(info){ const d=new Date();
          info.parent.c[info.name]=VFS.file((e.txt||'').length, U.dosDate(d), U.dosTime(d), e.txt||''); if(e.bmp)info.parent.c[info.name].bmp=e.bmp; } }
        else if(e.op==='del'){ const info=VFS.parentOf(e.path); if(info) delete info.parent.c[info.name]; }
        else if(e.op==='ren'){ const info=VFS.parentOf(e.path); if(info&&info.parent.c[info.name]){ info.parent.c[e.to]=info.parent.c[info.name]; delete info.parent.c[info.name]; } }
      }catch(err){}
    }
  },

  // ---------- default disk contents ----------
  buildC(){
    const C=VFS.drives.C.node;
    const F=VFS.file, D=VFS.dir;
    const mk=(parent, name)=>{ parent.c[name]=D(); return parent.c[name]; };

    C.c['AUTOEXEC.BAT']=F(184,'11-08-93','3:11p', FSDATA.autoexec);
    C.c['CONFIG.SYS']=F(212,'11-08-93','3:11p', FSDATA.config);
    C.c['COMMAND.COM']=F(54619,'05-31-94','6:22a');
    C.c['WINA20.386']=F(9349,'05-31-94','6:22a');
    C.c['README.WRI']=F(8342,'11-08-93','3:11a', FSDATA.readme);

    const DOSD=mk(C,'DOS');

/* ================= Stage scaling ================= */
const Stage = {
  el:null, scale:1,
  init(){
    Stage.el=document.getElementById('stage');
    const fit=()=>{
      const vw=window.innerWidth, vh=window.innerHeight;
      Stage.scale=Math.min(vw/800, vh/600);
      Stage.el.style.transform='scale('+Stage.scale+')';
    };
    window.addEventListener('resize',fit); fit();
  },
  point(e){
    const r=Stage.el.getBoundingClientRect();
    return { x:(e.clientX-r.left)/Stage.scale, y:(e.clientY-r.top)/Stage.scale };
  }
};

/* ================= XOR outline drag ================= */
const Drag = {
  active:null,
  rectEl:null,
  init(){ Drag.rectEl=document.getElementById('dragrect');
    document.addEventListener('mousemove',Drag.move,true);
    document.addEventListener('mouseup',Drag.up,true);
  },
  start(e, opt){
    // opt: {x,y,w,h in stage coords, mode:'move'|'n'|'s'|... , minW,minH, clamp:{x,y,w,h}, onDone(x,y,w,h), live:bool}
    const p=Stage.point(e);
    Drag.active={opt, sx:p.x, sy:p.y, r:{x:opt.x,y:opt.y,w:opt.w,h:opt.h}};
    Drag.show(Drag.active.r);
    e.preventDefault();
  },
  show(r){
    const el=Drag.rectEl;
    el.classList.remove('hidden');
    el.style.left=r.x+'px'; el.style.top=r.y+'px';
    el.style.width=r.w+'px'; el.style.height=r.h+'px';
  },
  move(e){
    if(!Drag.active) return;
    const a=Drag.active, o=a.opt, p=Stage.point(e);
    let dx=p.x-a.sx, dy=p.y-a.sy;
    let {x,y,w,h}={x:o.x,y:o.y,w:o.w,h:o.h};
    const m=o.mode;
    if(m==='move'){ x+=dx; y+=dy; }
    else {
      if(m.includes('e')) w+=dx;
      if(m.includes('s')) h+=dy;
      if(m.includes('w')){ x+=dx; w-=dx; }
      if(m.includes('n')){ y+=dy; h-=dy; }
      const minW=o.minW||100, minH=o.minH||44;
      if(w<minW){ if(m.includes('w')) x-=minW-w; w=minW; }
      if(h<minH){ if(m.includes('n')) y-=minH-h; h=minH; }
    }
    if(o.clamp){
      const c=o.clamp;
      if(m==='move'){
        x=U.clamp(x, c.x-w+40, c.x+c.w-40);
        y=U.clamp(y, c.y, c.y+c.h-20);
      }
    }
    a.r={x,y,w,h};
    Drag.show(a.r);
    e.preventDefault();
  },
  up(e){
    if(!Drag.active) return;
    const a=Drag.active;
    Drag.active=null;
    Drag.rectEl.classList.add('hidden');
    a.opt.onDone(Math.round(a.r.x), Math.round(a.r.y), Math.round(a.r.w), Math.round(a.r.h));
  }
};

/* zoom rectangle animation (open/minimize flourish) */
function zoomRect(from, to, cb){
  const el=U.el('div'); el.id=''; el.style.cssText='position:absolute;border:2px solid #fff;mix-blend-mode:difference;pointer-events:none;z-index:9000;';
  Stage.el.appendChild(el);
  let i=0, steps=7;
  const t=setInterval(()=>{
    i++;
    const f=i/steps;
    el.style.left=(from.x+(to.x-from.x)*f)+'px';
    el.style.top=(from.y+(to.y-from.y)*f)+'px';
    el.style.width=(from.w+(to.w-from.w)*f)+'px';
    el.style.height=(from.h+(to.h-from.h)*f)+'px';
    if(i>=steps){ clearInterval(t); el.remove(); if(cb)cb(); }
  },16);
}

/* ================= Menus ================= */
const Menus = {
  state:null, // {win, defs, barEls, idx, popup, items, rows, sel}
  buildBar(win, defs){
    const bar=U.el('div','menubar');
    win.menuDefs=defs;
    defs.forEach((m,i)=>{
      const a=U.amp(m.label);
      const mi=U.el('span','mi', a.html);
      mi.dataset.idx=i; m._key=a.key;
      mi.addEventListener('mousedown',(e)=>{
        e.stopPropagation(); e.preventDefault();
        WM.focus(win);
        if(Menus.state && Menus.state.win===win && Menus.state.idx===i){ Menus.closeAll(); }
        else Menus.openBar(win,i,false);
      });
      mi.addEventListener('mouseenter',()=>{
        if(Menus.state && Menus.state.win===win && Menus.state.popup && Menus.state.idx!==i) Menus.openBar(win,i,false);
      });
      bar.appendChild(mi);
    });
    return bar;
  },
  openBar(win, idx, kb){
    Menus.closeAll(true);
    const defs=win.menuDefs; if(!defs||!defs[idx])return;
    const bar=win.menubar;
    const mi=bar.children[idx];
    mi.classList.add('open');
    const items=typeof defs[idx].items==='function'?defs[idx].items(win):defs[idx].items;
    // popup position: below menubar item, in stage coords
    const st=Stage.el.getBoundingClientRect();
    const r=mi.getBoundingClientRect();
    const x=(r.left-st.left)/Stage.scale, y=(r.bottom-st.top)/Stage.scale;
    const popup=Menus.buildPopup(items, win);
    Stage.el.appendChild(popup);
    popup.style.left=Math.min(x, 800-popup.offsetWidth-4)+'px';
    popup.style.top=Math.min(y, 600-popup.offsetHeight-4)+'px';
    Menus.state={win, defs, idx, popup, items, sel:kb?0:-1, bar};
    Menus.paintSel();
  },
  openPopupAt(items, x, y, win){
    Menus.closeAll(true);
    const popup=Menus.buildPopup(items, win);
    Stage.el.appendChild(popup);
    if(y+popup.offsetHeight>598) y=Math.max(2,y-popup.offsetHeight);
    if(x+popup.offsetWidth>798) x=Math.max(2,798-popup.offsetWidth);
    popup.style.left=x+'px'; popup.style.top=y+'px';
    Menus.state={win, defs:null, idx:-1, popup, items, sel:-1, bar:null};
  },
  buildPopup(items, win){
    const popup=U.el('div','menupop');
    popup.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();});
    const rows=[];
    items.forEach((it,i)=>{
      if(it.sep){ popup.appendChild(U.el('div','msep')); rows.push(null); return; }
      const a=U.amp(it.label); it._key=a.key;
      const dis=typeof it.dis==='function'?it.dis(win):!!it.dis;
      const chk=typeof it.chk==='function'?it.chk(win):!!it.chk;
      const row=U.el('div','mrow'+(dis?' dis':''));
      row.innerHTML='<span class="ml">'+(chk?'<span class="chk">✓</span>':'')+a.html+'</span>'+(it.k?'<span class="acc">'+U.esc(it.k)+'</span>':'');
      row.dataset.i=i;
      row.addEventListener('mouseenter',()=>{ Menus.state.sel=i; Menus.paintSel(); });
      row.addEventListener('mouseup',(e)=>{ e.stopPropagation(); Menus.exec(i); });
      popup.appendChild(row);
      rows.push(row);
    });
    popup._rows=rows;
    return popup;
  },
  paintSel(){
    const st=Menus.state; if(!st||!st.popup)return;
    st.popup._rows.forEach((r,i)=>{ if(r) r.classList.toggle('sel', i===st.sel); });
  },
  exec(i){
    const st=Menus.state; if(!st)return;
    const it=st.items[i];
    if(!it||it.sep)return;
    const dis=typeof it.dis==='function'?it.dis(st.win):!!it.dis;
    if(dis){ return; }
    const win=st.win;
    Menus.closeAll();
    if(it.f) setTimeout(()=>it.f(win),0);
  },
  closeAll(keep){
    if(Menus.state){
      if(Menus.state.popup) Menus.state.popup.remove();
      if(Menus.state.bar) [...Menus.state.bar.children].forEach(c=>c.classList.remove('open','hot'));
      Menus.state=null;
    }
    if(!keep) WM.altArm=false;
  },
  // keyboard while menu open
  handleKey(e){
    const st=Menus.state; if(!st) return false;
    const k=e.key;
    const n=st.items.length;
    const nextSel=(dir)=>{
      let s=st.sel;
      for(let t=0;t<n+1;t++){ s=(s+dir+n)%n; if(!st.items[s].sep) break; }
      st.sel=s; Menus.paintSel();
    };
    if(k==='Escape'){ Menus.closeAll(); return true; }
    if(k==='ArrowDown'){ nextSel(1); return true; }
    if(k==='ArrowUp'){ nextSel(-1); return true; }
    if(k==='ArrowRight'||k==='ArrowLeft'){
      if(st.defs){
        let i=st.idx+(k==='ArrowRight'?1:-1);
        i=(i+st.defs.length)%st.defs.length;
        Menus.openBar(st.win,i,true);
      }
      return true;
    }
    if(k==='Enter'){ if(st.sel>=0) Menus.exec(st.sel); else Menus.closeAll(); return true; }
    if(/^[a-z0-9]$/i.test(k)){
      const low=k.toLowerCase();
      for(let i=0;i<n;i++){ if(!st.items[i].sep && st.items[i]._key===low){ Menus.exec(i); return true; } }
      return true;
    }
    if(k==='Alt'){ Menus.closeAll(); return true; }
    return true; // swallow other keys while menu open
  },
  // Alt+letter on the active window's menubar
  tryAltLetter(win, letter){
    if(!win||!win.menuDefs) return false;
    const i=win.menuDefs.findIndex(m=>m._key===letter);
    if(i<0) return false;
    Menus.openBar(win, i, true);
    return true;
  }
};

/* ================= Window Manager ================= */
const WM = {
  windows:[], z:100, active:null, ready:false,
  desktop:null, modalStack:[],
  dosTask:null, // fullscreen DOS app pseudo-task
  altArm:false,

  init(){
    WM.desktop=document.getElementById('desktop');
    Drag.init();
    // global mouse handling: focus, modal enforcement, menu dismiss
    document.getElementById('winui').addEventListener('mousedown',(e)=>{
      if(Menus.state){ Menus.closeAll(); }
      HelpEngine.closePopup();
      const wel=e.target.closest('.win');
      const dicon=e.target.closest('.deskicon');
      if(WM.modalStack.length){
        const top=WM.modalStack[WM.modalStack.length-1];
        if(wel!==top.el && !top.el.contains(e.target)){
          // block: flash modal + beep
          e.stopPropagation(); e.preventDefault();
          WM.flash(top); Snd.play('beep');
          return;
        }
      }
      if(wel && wel._win){ WM.focus(wel._win); }
      else if(!dicon){ /* desktop click: deselect desk icons */ WM.deselIcons(); }
    }, true);
  },

  create(o){
    const win=new Win(o);
    WM.windows.push(win);
    Res.use(o.parent||o.dialog?1:2);
    WM.focus(win);
    WM.ready=true;
    return win;
  },
  topLevel(){ return WM.windows.filter(w=>!w.o.parent && !w.o.noTask && !w.closed); },
  focus(win){
    if(!win||win.closed) return;
    // modal discipline: cannot focus below top modal
    if(WM.modalStack.length){
      const top=WM.modalStack[WM.modalStack.length-1];
      if(win!==top && !WM.isOwnedBy(win, top)) { win=top; }
    }
    if(win.state==='min'){ win.restore(); return; }
    const prev=WM.active;
    WM.active=win;
    if(win.o.parent){
      win.o.parent.activeChild=win;
      WM.raiseChild(win);
      WM.raise(win.o.parent);
    } else {
      WM.raise(win);
    }
    WM.paintActive();
    if(win.o.onFocus) win.o.onFocus(win);
    if(prev!==win && win.focusEl){ try{ win.focusEl.focus({preventScroll:true}); }catch(e){} }
    // leaving fullscreen DOS task
    if(WM.dosTask && WM.dosTask.visible) WM.dosTask.hide();
  },
  isOwnedBy(win, owner){
    let w=win;
    while(w){ if(w===owner) return true; w=w.o.owner||w.o.parent; }
    return false;
  },
  raise(win){ win.el.style.zIndex=(++WM.z); },
  raiseChild(win){ win.el.style.zIndex=(++WM.z); },
  paintActive(){
    for(const w of WM.windows){
      if(w.closed) continue;
      let act=false;
      if(w===WM.active) act=true;
      else if(WM.active && WM.active.o.parent===w) act=true;          // container of active child
      else if(WM.active && WM.active.o.owner && WM.isOwnedBy(WM.active,w)) act=(w===WM.active);
      w.el.classList.toggle('active', act);
    }
  },
  flash(win){
    let n=0;
    const t=setInterval(()=>{
      win.el.classList.toggle('active');
      if(++n>=6){ clearInterval(t); win.el.classList.add('active'); }
    },60);
  },
  close(win){ win.close(); },
  remove(win){
    const i=WM.windows.indexOf(win);
    if(i>=0) WM.windows.splice(i,1);
    Res.free(win.o.parent||win.o.dialog?1:2);
    const mi=WM.modalStack.indexOf(win);
    if(mi>=0) WM.modalStack.splice(mi,1);
    if(WM.active===win){
      WM.active=null;
      // focus next: topmost remaining
      let best=null,bz=-1;
      for(const w of WM.windows){
        if(w.closed||w.state==='min'||w.o.parent) continue;
        const z=+w.el.style.zIndex||0;
        if(z>bz){bz=z;best=w;}
      }
      if(win.o.owner && !win.o.owner.closed) best=win.o.owner;
      if(win.o.parent && !win.o.parent.closed) best=win.o.parent;
      if(best) WM.focus(best); else WM.paintActive();
    }
  },
  deselIcons(){ document.querySelectorAll('.deskicon.sel,.mdiicon.sel').forEach(x=>x.classList.remove('sel')); },

  /* ---- desktop minimized icon slots ---- */
  iconSlot(){
    const used=new Set();
    for(const w of WM.windows){ if(w.iconEl && !w.o.parent) used.add(w.iconSlotIdx); }
    let i=0; while(used.has(i)) i++;
    return i;
  },
  cascade(){
    let n=0;
    for(const w of WM.windows){
      if(w.o.parent||w.closed||w.o.dialog) continue;
      if(w.state==='min') continue;
      if(w.state==='max') w.restore();
      w.setPos(20+n*24, 20+n*24);
      WM.raise(w);
      n++;
    }
  },
  tile(){
    const ws=WM.windows.filter(w=>!w.o.parent&&!w.closed&&!w.o.dialog&&w.state!=='min');
    if(!ws.length)return;
    const cols=Math.ceil(Math.sqrt(ws.length)), rows=Math.ceil(ws.length/cols);
    const cw=Math.floor(800/cols), ch=Math.floor(580/rows);
    ws.forEach((w,i)=>{
      if(w.state==='max') w.restore();
      const c=i%cols, r=Math.floor(i/cols);
      w.setPos(c*cw, r*ch); w.setSize(cw, ch);
    });
  },
  arrangeIcons(){
    let i=0;
    for(const w of WM.windows){
      if(w.iconEl && !w.o.parent){ w.iconSlotIdx=i; w.placeIcon(); i++; }
    }
  }
};

class Win {
  constructor(o){
    this.o=o;
    this.state='normal';
    this.closed=false;
    this.title=o.title||'';
    const el=this.el=U.el('div','win'+(o.dialog?' dialog':'')+(o.cls?' '+o.cls:''));
    el._win=this;
    this.x=o.x!=null?o.x:U.rnd(40,120); this.y=o.y!=null?o.y:U.rnd(30,90);
    this.w=o.w||400; this.h=o.h||300;

    el.appendChild(U.el('div','frame'));
    const inner=this.inner=U.el('div','inner');
    el.appendChild(inner);

    // title bar
    const tb=this.tb=U.el('div','tb');
    const sysbox=U.el('div','sysbox');
    sysbox.title='';
    let lastSys=0;
    sysbox.addEventListener('mousedown',(e)=>{
      e.stopPropagation();e.preventDefault();
      WM.focus(this);
      const now=Date.now();
      if(now-lastSys<400){ lastSys=0; Menus.closeAll(); this.sysClose(); return; }
      lastSys=now;
      this.openSysMenu();
    });
    tb.appendChild(sysbox);
    const ttl=this.ttlEl=U.el('div','ttl',U.esc(this.title));
    tb.appendChild(ttl);
    const btns=U.el('div','tbbtns');
    if(o.minimizable!==false && !o.dialog){
      const b=U.el('div','tbb mn','<div class="tri"></div>');
      b.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();WM.focus(this);});
      b.addEventListener('click',e=>{e.stopPropagation();this.minimize();});
      btns.appendChild(b);
    }
    if(o.maximizable!==false && !o.dialog){
      const b=this.maxBtn=U.el('div','tbb mx','<div class="tri"></div>');
      b.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();WM.focus(this);});
      b.addEventListener('click',e=>{e.stopPropagation(); this.state==='max'?this.restore():this.maximize();});
      btns.appendChild(b);
    }
    tb.appendChild(btns);
    inner.appendChild(tb);

    // title-bar drag (XOR outline)
    ttl.addEventListener('mousedown',(e)=>{
      e.preventDefault();
      WM.focus(this);
      if(this.state==='max') return;
      const space=this.space();
      Drag.start(e,{x:this.x,y:this.y,w:this.w,h:this.h,mode:'move',
        clamp:{x:0,y:0,w:space.w,h:space.h},
        onDone:(x,y)=>{ this.setPos(x,y); }});
    });
    ttl.addEventListener('dblclick',()=>{ if(o.maximizable!==false && !o.dialog){ this.state==='max'?this.restore():this.maximize(); } });

    // menubar
    if(o.menus){
      this.menubar=Menus.buildBar(this,o.menus);
      inner.appendChild(this.menubar);
    }
    // body
    const body=this.body=U.el('div','wbody'+(o.grayBody?' gray':''));
    inner.appendChild(body);
    // status bar
    if(o.status){
      this.statusbar=U.el('div','statusbar');
      this.statusCells=[];
      o.status.forEach(s=>{
        const c=U.el('div','cell'+(s.fix?' fix':''),'');
        if(s.w)c.style.flex='0 0 '+s.w+'px';
        this.statusbar.appendChild(c); this.statusCells.push(c);
      });
      inner.appendChild(this.statusbar);
    }

    // resize handles
    if(o.resizable!==false && !o.dialog){
      ['n','s','e','w','ne','nw','se','sw'].forEach(dir=>{
        const h=U.el('div','rh '+dir);
        h.addEventListener('mousedown',(e)=>{
          e.preventDefault();e.stopPropagation();
          WM.focus(this);
          if(this.state==='max')return;
          Drag.start(e,{x:this.x,y:this.y,w:this.w,h:this.h,mode:dir,
            minW:o.minW||120,minH:o.minH||60,
            onDone:(x,y,w2,h2)=>{ this.setPos(x,y); this.setSize(w2,h2); }});
        });
        el.appendChild(h);
      });
    }

    // container?
    if(o.mdi){
      this.mdiClient=U.el('div','mdiclient');
      body.appendChild(this.mdiClient);
      this.children=[];
    }
    // parent (MDI child)?
    if(o.parent){
      o.parent.children.push(this);
      o.parent.mdiClient.appendChild(el);
    } else {
      WM.desktop.appendChild(el);
    }

    this.applyGeom();
    if(o.modal){
      WM.modalStack.push(this);
    }
    // center over owner if dialog without explicit pos
    if(o.dialog && o.x==null){
      const ow=o.owner && !o.owner.closed ? o.owner : null;
      const bx=ow&&!ow.o.parent?ow.x:200, by=ow&&!ow.o.parent?ow.y:150, bw=ow?ow.w:400, bh=ow?ow.h:300;
      this.setPos(U.clamp(Math.round(bx+(bw-this.w)/2), 2, 798-this.w), U.clamp(Math.round(by+40), 2, 560-this.h));
    }
  }
  space(){ // available coordinate space (desktop or MDI client)
    if(this.o.parent){
      const c=this.o.parent.mdiClient;
      return {w:c.clientWidth, h:c.clientHeight};
    }
    return {w:800, h:600};
  }
  applyGeom(){
    this.el.style.left=this.x+'px'; this.el.style.top=this.y+'px';
    this.el.style.width=this.w+'px'; this.el.style.height=this.h+'px';
    if(this.o.onResize) this.o.onResize(this);
  }
  setPos(x,y){ this.x=x; this.y=y; this.applyGeom(); }
  setSize(w,h){ this.w=w; this.h=h; this.applyGeom(); }
  setTitle(t){ this.title=t; this.ttlEl.innerHTML=U.esc(t); }
  setStatus(i,txt){ if(this.statusCells&&this.statusCells[i]) this.statusCells[i].textContent=txt; }

  openSysMenu(){
    const items=[];
    const o=this.o;
    items.push({label:'&Restore', dis:this.state==='normal', f:()=>this.restore()});
    items.push({label:'&Move', dis:this.state==='max', f:()=>{}});
    items.push({label:'&Size', dis:o.resizable===false||this.state!=='normal', f:()=>{}});
    items.push({label:'Mi&nimize', dis:o.minimizable===false||o.dialog, f:()=>this.minimize()});
    items.push({label:'Ma&ximize', dis:o.maximizable===false||o.dialog||this.state==='max', f:()=>this.maximize()});
    items.push({sep:true});
    items.push({label:'&Close', k:o.parent?'Ctrl+F4':'Alt+F4', f:()=>this.sysClose()});
    if(!o.dialog && !o.parent){
      items.push({sep:true});
      items.push({label:'Switch &To...', k:'Ctrl+Esc', f:()=>TaskList.open()});
    }
    let x,y;
    if(this.state==='min' && this.iconEl){
      const st=Stage.el.getBoundingClientRect(), r=this.iconEl.getBoundingClientRect();
      x=(r.left-st.left)/Stage.scale; y=(r.top-st.top)/Stage.scale-4;
    } else {
      const st=Stage.el.getBoundingClientRect(), r=this.tb.getBoundingClientRect();
      x=(r.left-st.left)/Stage.scale; y=(r.bottom-st.top)/Stage.scale;
    }
    Menus.openPopupAt(items, x, y, this);
  }
  sysClose(){
    if(this.o.sysCloseOverride){ this.o.sysCloseOverride(this); return; }
    this.close();
  }
  close(){
    if(this.closed) return;
    if(this.o.onClose && this.o.onClose(this)===false) return;
    this.closed=true;
    if(this.iconEl){ this.iconEl.remove(); this.iconEl=null; }
    if(this.o.parent){
      const i=this.o.parent.children.indexOf(this);
      if(i>=0)this.o.parent.children.splice(i,1);
    }
    if(this.o.mdi && this.children){ [...this.children].forEach(c=>c.close()); }
    this.el.remove();
    WM.remove(this);
    if(this.o.onClosed) this.o.onClosed(this);
  }
  minimize(){
    if(this.state==='min') return;
    if(this.state==='max') this.restoreGeomOnly();
    this.preMin={x:this.x,y:this.y,w:this.w,h:this.h,state:this.state};
    this.state='min';
    Menus.closeAll();
    const iconHTML='<span class="ic">'+Icons.draw(this.o.icon||'doc')+'</span><br><span class="lbl">'+U.esc(this.o.iconLabel||this.title)+'</span>';
    if(this.o.parent){
      this.iconEl=U.el('div','mdiicon',iconHTML);
      this.o.parent.mdiClient.appendChild(this.iconEl);
      this.iconSlotIdx=this.o.parent.children.filter(c=>c.iconEl&&c!==this).length;
      this.placeIcon();
    } else {
      this.iconEl=U.el('div','deskicon',iconHTML);
      WM.desktop.appendChild(this.iconEl);
      this.iconSlotIdx=WM.iconSlot();
      this.placeIcon();
    }
    zoomRect(this.iconRect(this.preMin), this.iconRectSmall(), null);
    this.el.classList.add('hidden');
    this.hookIcon();
    // focus another window
    if(WM.active===this){ WM.active=null;
      const cands=WM.windows.filter(w=>!w.closed&&w.state!=='min'&&!w.o.parent);
      if(cands.length) WM.focus(cands[cands.length-1]);
    }
  }
  iconRect(g){ 
    if(this.o.parent){
      const st=Stage.el.getBoundingClientRect(), c=this.o.parent.mdiClient.getBoundingClientRect();
      const ox=(c.left-st.left)/Stage.scale, oy=(c.top-st.top)/Stage.scale;
      return {x:ox+g.x,y:oy+g.y,w:g.w,h:g.h};
    }
    return {x:g.x,y:g.y,w:g.w,h:g.h};
  }
  iconRectSmall(){
    const r=this.iconEl.getBoundingClientRect(), st=Stage.el.getBoundingClientRect();
    return {x:(r.left-st.left)/Stage.scale,y:(r.top-st.top)/Stage.scale,w:74,h:44};
  }
  placeIcon(){
    if(!this.iconEl)return;
    if(this.iconPos){ this.iconEl.style.left=this.iconPos.x+'px'; this.iconEl.style.top=this.iconPos.y+'px'; return; }
    const i=this.iconSlotIdx||0;
    if(this.o.parent){
      const ch=this.o.parent.mdiClient.clientHeight;
      this.iconEl.style.left=(6+i*80)+'px';
      this.iconEl.style.top=Math.max(4,(ch-50))+'px';
    } else {
      this.iconEl.style.left=(8+(i%9)*84)+'px';
      this.iconEl.style.top=(600-52-Math.floor(i/9)*56)+'px';
    }
  }
  hookIcon(){
    const ic=this.iconEl;
    let lastClick=0, moved=false;
    ic.addEventListener('mousedown',(e)=>{
      e.preventDefault(); e.stopPropagation();
      if(WM.modalStack.length){ WM.flash(WM.modalStack[WM.modalStack.length-1]); Snd.play('beep'); return; }
      WM.deselIcons();
      ic.classList.add('sel');
      moved=false;
      // drag icon (live)
      const start=Stage.point(e);
      const orig={x:parseInt(ic.style.left)||0, y:parseInt(ic.style.top)||0};
      const mm=(ev)=>{
        const p=Stage.point(ev);
        if(Math.abs(p.x-start.x)+Math.abs(p.y-start.y)>5) moved=true;
        if(moved){
          const nx=U.clamp(orig.x+p.x-start.x,0,726), ny=U.clamp(orig.y+p.y-start.y,0,556);
          ic.style.left=nx+'px'; ic.style.top=ny+'px';
          this.iconPos={x:nx,y:ny};
        }
      };
      const mu=(ev)=>{
        document.removeEventListener('mousemove',mm,true);
        document.removeEventListener('mouseup',mu,true);
        if(moved) return;
        const now=Date.now();
        if(now-lastClick<400){ lastClick=0; Menus.closeAll(); this.restore(); }
        else { lastClick=now; this.openSysMenu(); }
      };
      document.addEventListener('mousemove',mm,true);
      document.addEventListener('mouseup',mu,true);
    });
  }
  restore(){
    Menus.closeAll();
    if(this.state==='min'){
      const from=this.iconRectSmall();
      this.iconEl.remove(); this.iconEl=null;
      this.state=this.preMin.state==='max'?'normal':this.preMin.state;
      this.el.classList.remove('hidden');
      if(this.preMin.state==='max'){ this.maximize(); }
      else zoomRect(from, this.iconRect(this), null);
      WM.focus(this);
      return;
    }
    if(this.state==='max'){
      this.restoreGeomOnly();
      WM.focus(this);
    }
  }
  restoreGeomOnly(){
    this.state='normal';
    const g=this.preMax; 
    if(g){ this.x=g.x;this.y=g.y;this.w=g.w;this.h=g.h; }
    this.applyGeom();
    if(this.maxBtn){ this.maxBtn.classList.remove('rs'); this.maxBtn.classList.add('mx'); }
    if(this.o.parent) this.o.parent.setMdiMax(null);
  }
  maximize(){
    if(this.state==='max')return;
    this.preMax={x:this.x,y:this.y,w:this.w,h:this.h};
    this.state='max';
    const s=this.space();
    this.x=this.o.parent?0:0; this.y=0; this.w=s.w; this.h=s.h;
    this.applyGeom();
    if(this.maxBtn){ this.maxBtn.classList.remove('mx'); this.maxBtn.classList.add('rs'); }
    if(this.o.parent) this.o.parent.setMdiMax(this);
    WM.focus(this);
  }
  setMdiMax(child){ this.mdiMaxChild=child; }
}

/* ================= Message boxes & dialogs ================= */
const Dlg = {
  msg(owner, o, cb){
    const buttons=o.buttons||['OK'];
    const iconHTML=o.icon?('<span class="ic">'+Icons.draw('msg_'+o.icon)+'</span>'):'';
    const body=U.el('div');
    body.innerHTML='<div class="msgbody">'+iconHTML+'<div class="mtext">'+U.esc(o.text)+'</div></div>';
    const win=WM.create({
      title:o.title||'Windows', dialog:true, modal:o.modal||'app', owner:owner||undefined,
      noTask:true, w:o.w||Math.min(420, Math.max(220, (o.text||'').length*3+150)), h:10,
      resizable:false, minimizable:false, maximizable:false,
      onClose(){ if(cb&&!win._answered){win._answered=true; setTimeout(()=>cb(o.cancelIdx!=null?o.cancelIdx:buttons.length-1),0);} }
    });
    if(o.sound!==false) Snd.play(o.icon==='stop'?'chord':(o.icon==='excl'?'exclam':'ding'));
    const row=U.el('div','btnrow');
    const defIdx=o.def!=null?o.def:0;
    buttons.forEach((b,i)=>{
      const a=U.amp(b);
      const btn=U.el('span','btn'+(i===defIdx?' def':''),'<span class="flbl">'+a.html+'</span>');
      btn.tabIndex=0;
      btn.addEventListener('click',()=>{ win._answered=true; win.close(); if(cb)setTimeout(()=>cb(i),0); });
      row.appendChild(btn);
    });
    body.appendChild(row);
    win.body.appendChild(body);
    win.body.style.background='var(--winbg)';
    // size to content
    const wWidth=Math.max(o.w||0, Math.min(460, Math.max(230, row.scrollWidth+40, 160+(o.text||'').split('\n').reduce((m,l)=>Math.max(m,l.length),0)*5)));
    win.setSize(wWidth, body.offsetHeight+26);
    if(o.x==null&&owner==null){ win.setPos(Math.round((800-win.w)/2), Math.round((600-win.h)/2.3)); }
    else if(o.x==null){ win.setPos(U.clamp(Math.round((owner.o.parent?200:owner.x)+(owner.w-win.w)/2),2,798-win.w), U.clamp(owner.o.parent?180:owner.y+50,2,540)); }
    win.keyHandler=(e)=>{
      if(e.key==='Enter'){ const f=document.activeElement; 
        if(f&&f.classList&&f.classList.contains('btn')) f.click();
        else { win._answered=true; win.close(); if(cb)setTimeout(()=>cb(defIdx),0);} return true; }
      if(e.key==='Escape'){ win.close(); return true; }
      if(e.key==='Tab'){
        const bs=[...row.children]; const f=bs.indexOf(document.activeElement);
        const n=e.shiftKey?(f<=0?bs.length-1:f-1):(f+1)%bs.length;
        bs[n].focus(); e.preventDefault(); return true;
      }
      const low=e.key.toLowerCase();
      for(let i=0;i<buttons.length;i++){ const a=U.amp(buttons[i]); if(a.key===low){ win._answered=true; win.close(); if(cb)setTimeout(()=>cb(i),0); return true; } }
      return true;
    };
    setTimeout(()=>{ try{row.children[defIdx].focus();}catch(e){} },0);
    return win;
  },
  /* generic dialog: build(bodyEl, win); returns win */
  custom(o){
    const win=WM.create({
      title:o.title, dialog:true, modal:o.modal!==false?'app':null, owner:o.owner||undefined, noTask:true,
      w:o.w||320, h:o.h||200, x:o.x, y:o.y,
      resizable:false, minimizable:false, maximizable:false,
      onClose:o.onClose
    });
    win.body.style.background='var(--face)';
    const pad=U.el('div','dlgpad');
    pad.style.height='100%';
    win.body.appendChild(pad);
    if(o.build) o.build(pad, win);
    win.keyHandler=(e)=>{
      if(e.key==='Escape'){ if(o.onCancel)o.onCancel(win); win.close(); return true; }
      if(e.key==='Enter'){
        const f=document.activeElement;
        if(f&&f.classList&&f.classList.contains('btn')&&win.el.contains(f)){ f.click(); return true; }
        if(f&&f.tagName==='TEXTAREA') return false;
        const d=win.el.querySelector('.btn.def');
        if(d){ d.click(); return true; }
      }
      if(e.key==='Tab'){
        const foc=[...win.el.querySelectorAll('.btn,.tf,.listbox,.cb[tabindex]')].filter(x=>!x.classList.contains('dis')&&x.offsetParent);
        if(foc.length){
          let i=foc.indexOf(document.activeElement);
          i=e.shiftKey?(i<=0?foc.length-1:i-1):(i+1)%foc.length;
          foc[i].focus(); e.preventDefault();
        }
        return true;
      }
      if(e.altKey && /^[a-z0-9]$/i.test(e.key) && o.altKeys && o.altKeys[e.key.toLowerCase()]){ o.altKeys[e.key.toLowerCase()](win); return true; }
      return o.onKey?o.onKey(e,win):false;
    };
    return win;
  },
  /* helper controls */
  btn(label, opts){
    const a=U.amp(label);
    const b=U.el('span','btn'+(opts&&opts.def?' def':'')+(opts&&opts.dis?' dis':''),'<span class="flbl">'+a.html+'</span>');
    b.tabIndex=0;
    if(opts&&opts.w)b.style.minWidth=opts.w+'px';
    if(opts&&opts.f)b.addEventListener('click',()=>{ if(!b.classList.contains('dis')) opts.f(); });
    b.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); b.click(); } });
    return b;
  },
  check(label, on, f){
    const a=U.amp(label);
    const c=U.el('span','cb'+(on?' on':''),'<span class="box"></span><span>'+a.html+'</span>');
    c.tabIndex=0;
    c.addEventListener('click',()=>{ c.classList.toggle('on'); if(f)f(c.classList.contains('on')); });
    c.addEventListener('keydown',e=>{ if(e.key===' '){ e.preventDefault(); c.click(); } });
    c.isOn=()=>c.classList.contains('on');
    c.setOn=(v)=>c.classList.toggle('on',!!v);
    return c;
  },
  radio(group){ // group: [{label, value}], returns {el, value(), set(v), onchange}
    const wrap=U.el('div');
    const api={el:wrap, _v:null, onchange:null};
    group.forEach(g=>{
      const a=U.amp(g.label);
      const c=U.el('div','cb','<span class="box round"></span><span>'+a.html+'</span>');
      c.style.marginBottom='4px';
      c.tabIndex=0;
      c.dataset.v=g.value;
      c.addEventListener('click',()=>{ api.set(g.value); if(api.onchange)api.onchange(g.value); });
      c.addEventListener('keydown',e=>{ if(e.key===' '){e.preventDefault();c.click();} });
      wrap.appendChild(c);
    });
    api.value=()=>api._v;
    api.set=(v)=>{ api._v=v; [...wrap.children].forEach(c=>c.classList.toggle('on', c.dataset.v==v)); };
    return api;
  },
  list(items, opts){ // items: [{label, value}], opts {h, onSel, onDbl}
    const lb=U.el('div','listbox');
    lb.tabIndex=0;
    if(opts&&opts.h)lb.style.height=opts.h+'px';
    const api={el:lb, sel:-1, items:items.slice()};
    const paint=()=>{
      lb.innerHTML='';
      api.items.forEach((it,i)=>{
        const li=U.el('div','li'+(i===api.sel?' sel':''), U.esc(it.label));
        li.addEventListener('mousedown',e=>{e.preventDefault(); api.select(i); lb.focus();});
        li.addEventListener('dblclick',()=>{ if(opts&&opts.onDbl)opts.onDbl(api.items[i],i); });
        lb.appendChild(li);
      });
    };
    api.select=(i)=>{ api.sel=i; [...lb.children].forEach((c,j)=>c.classList.toggle('sel',j===i));
      if(lb.children[i]) lb.children[i].scrollIntoView({block:'nearest'});
      if(opts&&opts.onSel)opts.onSel(api.items[i],i); };
    api.value=()=>api.sel>=0?api.items[api.sel]:null;
    api.setItems=(its)=>{ api.items=its.slice(); api.sel=-1; paint(); };
    lb.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'&&api.sel<api.items.length-1){api.select(api.sel+1);e.preventDefault();}
      if(e.key==='ArrowUp'&&api.sel>0){api.select(api.sel-1);e.preventDefault();}
      if(e.key==='Enter'&&api.sel>=0&&opts&&opts.onDbl){opts.onDbl(api.items[api.sel],api.sel);e.preventDefault();}
    });
    paint();
    return api;
  },
  field(labelTxt, value, opts){
    const wrap=U.el('div');
    const a=U.amp(labelTxt);
    wrap.innerHTML='<div style="margin:6px 0 2px">'+a.html+'</div>';
    const inp=U.el('input','tf');
    inp.type=(opts&&opts.password)?'password':'text';
    inp.value=value||'';
    if(opts&&opts.w)inp.style.width=opts.w+'px';
    wrap.appendChild(inp);
    wrap.input=inp;
    return wrap;
  }
};

        row1.appendChild(Dlg.btn('&End Task',{w:82,f:()=>{
          const v=list.value(); if(!v)return;

        row2.appendChild(Dlg.btn('&Arrange Icons',{w:82,f:()=>{win.close();WM.arrangeIcons();}}));
        pad.appendChild(row2);
        if(tasks.length)list.select(0);
        setTimeout(()=>list.el.focus(),0);
      }
    });
    win.setPos(Math.round((800-win.w)/2), Math.round((600-win.h)/2.5));
    TaskList.win=win;
  },
  tasks(){
    const t=WM.topLevel().filter(w=>!w.o.dialog).map(w=>({name:w.o.taskName||w.title, win:w}));
    if(WM.dosTask) t.push({name:WM.dosTask.name, dos:true});
    return t;
  },
  switchTo(t){
    if(t.dos){ WM.dosTask.show(); return; }
    WM.focus(t.win);
  },
  endTask(t){
    if(t.dos){ WM.dosTask.end(); return; }
    if(t.win.o.appKey==='PROGMAN'){ PM.exitDialog(); return; }
    t.win.sysClose();
  }
};

/* ================= CoolSwitch (Alt+Tab) ================= */
const Cool = {
  active:false, idx:0, list:[],
  el:null,
  begin(dir){
    Cool.list=TaskList.tasks();
    if(!Cool.list.length) return;
    Cool.active=true;
    Cool.idx=0;
    Cool.step(dir);
  },
  step(dir){
    if(!Cool.list.length)return;
    Cool.idx=(Cool.idx+(dir||1)+Cool.list.length)%Cool.list.length;
    const t=Cool.list[Cool.idx];
    const el=document.getElementById('coolswitch');
    const icon=t.dos?'dosapp':(t.win.o.icon||'doc');
    el.innerHTML=Icons.draw(icon)+'<div class="nm">'+U.esc(t.name)+'</div>';
    el.classList.remove('hidden');
  },
  commit(){
    if(!Cool.active)return;
    Cool.active=false;
    document.getElementById('coolswitch').classList.add('hidden');
    const t=Cool.list[Cool.idx];
    if(t) TaskList.switchTo(t);
  },
  cancel(){
    Cool.active=false;
    document.getElementById('coolswitch').classList.add('hidden');
  }
};
