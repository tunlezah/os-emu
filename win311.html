/* ================= MS-DOS Editor (EDIT) ================= */
const Editor = {
  open(container, path, onExit, session){
    const name=path?path.split('\\').pop():'UNTITLED.TXT';
    let txt=path?(VFS.read(path)||''):'';
    txt=txt.replace(/\r\n/g,'\n');
    const ui=U.el('div','edit-ui');
    ui.innerHTML=
      '<div class="edit-menubar"><span><b>F</b>ile</span><span><b>E</b>dit</span><span><b>S</b>earch</span><span><b>O</b>ptions</span><span style="margin-left:auto"><b>H</b>elp</span></div>'+
      '<div class="edit-title"><span>'+U.esc(name)+'</span></div>'+
      '<div class="edit-body"></div>'+
      '<div class="edit-status"><span>MS-DOS Editor (simulated)   &lt;Ctrl+S=Save&gt;  &lt;Esc or Alt+F,X=Exit&gt;</span><span class="lc">Line:1 Col:1</span></div>';
    const ta=U.el('textarea');
    ta.value=txt;
    ui.querySelector('.edit-body').appendChild(ta);
    container.appendChild(ui);
    const lc=ui.querySelector('.lc');
    const upd=()=>{
      const p=ta.value.slice(0,ta.selectionStart);
      const line=p.split('\n').length, col=p.length-p.lastIndexOf('\n');
      lc.textContent='Line:'+line+' Col:'+col;
    };
    ta.addEventListener('keyup',upd); ta.addEventListener('click',upd);
    const save=()=>{
      if(path){ VFS.writeFile(path, ta.value.replace(/\n/g,'\r\n')); return true; }
      return false;
    };
    const exit=()=>{
      const dirty=(ta.value!==txt);
      const doExit=()=>{ ui.remove(); Editor.active=null; onExit(); };
      if(dirty && path){ save(); doExit(); }
      else doExit();
    };
    ta.addEventListener('keydown',(e)=>{
      e.stopPropagation();
      if(e.key==='Escape'){ e.preventDefault(); exit(); }
      else if(e.ctrlKey && e.key.toLowerCase()==='s'){ e.preventDefault(); save();
        lc.textContent='Saved'; setTimeout(upd,900); }
      else if(e.altKey && e.key.toLowerCase()==='f'){ e.preventDefault(); Editor.pendF=true; }
      else if(Editor.pendF && e.key.toLowerCase()==='x'){ e.preventDefault(); Editor.pendF=false; exit(); }
      else if(Editor.pendF && e.key.toLowerCase()==='s'){ e.preventDefault(); Editor.pendF=false; save(); }
      else Editor.pendF=false;
    });
    setTimeout(()=>ta.focus(),0);
    Editor.active=ui;
    return ui;
  },
  active:null, pendF:false
};

/* ================= DOS session (COMMAND.COM behavior) ================= */
class DosSession {
  constructor(pre, opts){
    this.pre=pre;               // <pre> element
    this.opts=opts||{};
    this.lines=[];
    this.input='';
    this.cwd={C:'\\'};          // per-drive cwd
    this.drive='C';
    this.history=S.get('dosHistory',[]);
    this.hIdx=this.history.length;
    this.acceptInput=false;
    this.pendingConfirm=null;   // {prompt, cb}
    this.render();
  }
  path(){ return this.drive+':'+this.cwd[this.drive]; }
  promptStr(){ let p=this.path(); if(p.length>3&&p.endsWith('\\'))p=p.slice(0,-1); return p+'>'; }
  print(t){
    (t==null?'':String(t)).split('\n').forEach(l=>this.lines.push(l));
    this.render();
  }
  clear(){ this.lines=[]; this.render(); }
  render(){
    const rows=Math.max(5,Math.floor((this.pre.parentElement.clientHeight-4)/16)-1);
    if(this.lines.length>300) this.lines=this.lines.slice(-300);
    const shown=this.lines.slice(-(rows-1));
    let html=shown.map(l=>U.esc(l)).join('\n');
    if(this.acceptInput){
      html+='\n'+U.esc(this.promptStr()+this.input)+'<span class="cur">&nbsp;</span>';
    } else if(this.pendingConfirm){
      html+='\n'+U.esc(this.pendingConfirm.prompt+this.input)+'<span class="cur">&nbsp;</span>';
    }
    this.pre.innerHTML=html;
  }
  prompt(){ this.acceptInput=true; this.render(); }
  key(e){
    if(Editor.active) return;      // editor owns keys
    const k=e.key;
    if(this.pendingConfirm){
      if(k.length===1){ this.input=k.toUpperCase(); this.render(); }
      else if(k==='Enter'){
        const ans=this.input; const pc=this.pendingConfirm;
        this.lines.push(pc.prompt+ans);
        this.pendingConfirm=null; this.input='';
        pc.cb(ans);
      }
      e.preventDefault(); return;
    }
    if(!this.acceptInput){ e.preventDefault(); return; }
    if(k.length===1 && !e.ctrlKey && !e.altKey && !e.metaKey){
      if(this.input.length<120) this.input+=k;
    }
    else if(k==='Backspace'){ this.input=this.input.slice(0,-1); }
    else if(k==='Escape'){ this.input=''; }
    else if(k==='F3'){ this.input=this.history[this.history.length-1]||this.input; }
    else if(k==='ArrowUp'){ if(this.hIdx>0){this.hIdx--; this.input=this.history[this.hIdx]||'';} }
    else if(k==='ArrowDown'){ if(this.hIdx<this.history.length){this.hIdx++; this.input=this.history[this.hIdx]||'';} }
    else if(k==='Enter'){
      const cmd=this.input;
      this.lines.push(this.promptStr()+cmd);
      this.input=''; this.acceptInput=false;
      if(cmd.trim()){
        this.history.push(cmd);
        if(this.history.length>50)this.history.shift();
        S.set('dosHistory',this.history);
        this.hIdx=this.history.length;
        this.exec(cmd);
      } else { this.prompt(); }
      e.preventDefault(); this.render(); return;
    }
    e.preventDefault();
    this.render();
  }
  resolveRel(p){
    p=VFS.norm(p);
    if(/^[A-Z]:/.test(p)){
      if(p.length===2) p+=this.cwd[p[0]]||'\\';
      else if(p[2]!=='\\') p=p.slice(0,2)+'\\'+((this.cwd[p[0]]||'\\')==='\\'?'':(this.cwd[p[0]]||'').replace(/^\\/,'')+'\\').replace(/\\\\/g,'\\')+p.slice(2);
      return VFS.norm(p);
    }
    if(p.startsWith('\\')) return this.drive+':'+p;
    // relative
    let base=this.drive+':'+this.cwd[this.drive];
    if(!base.endsWith('\\'))base+='\\';
    let full=base+p;
    // handle ..
    const {drive,parts}=VFS.split(full);
    const out=[];
    for(const part of parts){
      if(part==='..') out.pop();
      else if(part==='.') continue;
      else out.push(part);
    }
    return drive+':\\'+out.join('\\');
  }
  exec(raw){
    const t=raw.trim();
    const sp=t.split(/\s+/);
    const cmd=(sp[0]||'').toUpperCase().replace(/^C:\\DOS\\|^C:\\WINDOWS\\/,'');
    const arg=t.slice(sp[0]?sp[0].length:0).trim();
    const done=()=>{ this.print(''); this.prompt(); };
    const err=(m)=>{ this.print(m); done(); };
    switch(cmd){
      case '': done(); break;
      case 'CLS': this.clear(); this.prompt(); break;
      case 'VER': this.print('\nMS-DOS Version 6.22'); done(); break;
      case 'VOL': { const d=VFS.drives[this.drive];
        this.print(' Volume in drive '+this.drive+(d.label?' is '+d.label:' has no label'));
        this.print(' Volume Serial Number is '+d.serial); done(); break; }
      case 'DATE': this.print('Current date is '+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()]+' '+U.dosDate(new Date())); done(); break;
      case 'TIME': this.print('Current time is '+new Date().toLocaleTimeString()); done(); break;
      case 'ECHO': this.print(arg||'ECHO is on'); done(); break;
      case 'PATH': this.print('PATH=C:\\DOS;C:\\WINDOWS'); done(); break;
      case 'SET': this.print('COMSPEC=C:\\DOS\\COMMAND.COM\nPATH=C:\\DOS;C:\\WINDOWS\nPROMPT=$p$g\nTEMP=C:\\TEMP'); done(); break;
      case 'PROMPT': done(); break;
      case 'DIR': this.cmdDir(arg); done(); break;
      case 'CD': case 'CHDIR': this.cmdCd(arg); done(); break;
      case 'MD': case 'MKDIR': {
        if(!arg) err('Required parameter missing');
        else { const e2=VFS.mkdir(this.resolveRel(arg)); if(e2)this.print(e2); done(); }
        break; }
      case 'RD': case 'RMDIR': {
        if(!arg){ err('Required parameter missing'); break; }
        const p=this.resolveRel(arg); const r=VFS.resolve(p);
        if(!r||!r.node.d) this.print('Invalid directory');
        else if(Object.keys(r.node.c).length) this.print('Invalid path, not directory,\nor directory not empty');
        else VFS.del(p);
        done(); break; }
      case 'TYPE': {
        if(!arg){ err('Required parameter missing'); break; }
        const p=this.resolveRel(arg); const txt=VFS.read(p);
        const r=VFS.resolve(p);
        if(!r) this.print('File not found - '+VFS.norm(arg).split('\\').pop());
        else if(r.node.d) this.print('Access denied');
        else if(r.node.txt==null) this.print(String.fromCharCode(9787)+'▲◙♪'+'MZ'+String.fromCharCode(9786)+'... (binary file)');
        else this.print(txt.replace(/\r\n/g,'\n'));
        done(); break; }
      case 'DEL': case 'ERASE': this.cmdDel(arg); break;
      case 'REN': case 'RENAME': {
        const a=arg.split(/\s+/);
        if(a.length<2){ err('Required parameter missing'); break; }
        const e2=VFS.rename(this.resolveRel(a[0]), a[1]);
        if(e2)this.print(e2.indexOf('not')>=0?e2:'Duplicate file name or file not found');
        done(); break; }
      case 'COPY': {
        const a=arg.split(/\s+/);
        if(a.length<1||!a[0]){ err('Required parameter missing'); break; }
        const src=this.resolveRel(a[0]);
        const sR=VFS.resolve(src);
        if(!sR||sR.node.d){ this.print('File not found - '+a[0].toUpperCase()); this.print('        0 file(s) copied'); done(); break; }
        let dst=a[1]?this.resolveRel(a[1]):this.drive+':'+this.cwd[this.drive];
        const dR=VFS.resolve(dst);
        let e2;
        if(dR&&dR.node.d) e2=VFS.copy(src,dst);
        else { const info=VFS.parentOf(dst);
          e2=info?VFS.copy(src, dst.slice(0, dst.lastIndexOf('\\'))||(dst.slice(0,2)+'\\'), info.name):'Path not found'; }
        this.print(e2?e2:'        1 file(s) copied');
        done(); break; }
      case 'MEM': this.print(DOSDATA.mem()); done(); break;
      case 'CHKDSK': this.print(DOSDATA.chkdsk(this.drive)); done(); break;
      case 'SCANDISK': this.print('Microsoft ScanDisk-style checking is not required.\nDrive C has no errors. (This drive is imaginary,\nwhich helps.)'); done(); break;
      case 'DEFRAG': this.print('Optimizing drive C...\n\nDrive C is already 100% unfragmented.\nSimulated bits pack tightly.'); done(); break;
      case 'MEMMAKER': this.print('MemMaker frees conventional memory by moving\ndevice drivers into upper memory.\n\nThis simulated PC already has 605K free,\nwhich in 1994 terms is luxury. Enjoy it.'); done(); break;
      case 'LABEL': { if(arg){ VFS.drives[this.drive].label=VFS.norm(arg).slice(0,11); } 
        this.print('Volume label is now '+(VFS.drives[this.drive].label||'(none)')); done(); break; }
      case 'FORMAT': {
        const d=(arg.match(/^([A-Z]):/i)||[])[1];
        if(!d){ err('Required parameter missing'); break; }
        this.pendingConfirm={prompt:'\nWARNING, ALL DATA ON NON-REMOVABLE DISK\nDRIVE '+d.toUpperCase()+': WILL BE LOST!\nProceed with Format (Y/N)?', cb:(ans)=>{
          if(ans==='Y'){
            if(d.toUpperCase()==='A') this.print('\nInsert new diskette for drive A:\nand press ENTER when ready...\n\nNo disk in drive. Format terminated.\n');
            else this.print('\nFormat terminated. (The simulation clutches\nits imaginary data protectively.)\n');
          } else this.print('');
          this.prompt();
        }};
        this.input=''; this.render(); break; }
      case 'DELTREE': this.print('DELTREE is far too dangerous for a museum piece.\nCommand ignored.'); done(); break;
      case 'EDIT': {
        const p=arg?this.resolveRel(arg):null;
        if(p){ const r=VFS.resolve(p);
          if(r&&r.node.d){ err('Cannot edit a directory'); break; }
          if(!r){ const e3=VFS.writeFile(p,''); if(e3){ err(e3); break; } } }
        Editor.open(this.pre.parentElement, p, ()=>{ this.print(''); this.prompt(); }, this);
        break; }
      case 'QBASIC': this.print('QBasic requires 286K free conventional memory\nand a sense of adventure. Try EDIT instead.'); done(); break;
      case 'WIN': {
        if(this.opts.winCmd){ this.opts.winCmd(); }
        else { this.print('You are already running Microsoft Windows.\nType EXIT to close this MS-DOS Prompt and\nreturn to Program Manager.'); done(); }
        break; }
      case 'EXIT': {
        if(this.opts.onExit){ this.opts.onExit(); }
        else done();
        break; }
      case 'HELP': this.print(DOSDATA.help); done(); break;
      case 'SMARTDRV': this.print('SMARTDrive disk cache is already installed.\nCache size: 2,048K'); done(); break;
      case 'A:': case 'B:': {
        this.print('Not ready reading drive '+cmd[0]+'\nAbort, Retry, Fail?F');
        this.print('Current drive is no longer valid>C:');
        done(); break; }
      case 'C:': this.drive='C'; done(); break;
      default: {
        // try launching known DOS programs
        const base=cmd.replace(/\.(EXE|COM|BAT)$/,'');
        if(base==='WP'||base==='CAVERN'||base==='XD'){
          const titles={WP:'WordPro 6.0 for DOS', CAVERN:'CAVERN CRAWLER', XD:'XDir Gold 2.5'};
          if(this.opts.winCmd){ // at real DOS: run "fullscreen"
            FSApp.placeholder(titles[base], base, ()=>{ this.print(''); this.prompt(); }, this.pre.parentElement);
          } else {
            this.print('This MS-DOS Prompt window cannot run '+titles[base]+'.\nRun it from File Manager to use a full screen.');
            done();
          }
          break;
        }
        if(base==='GPF'){ this.print('Deliberately dividing by zero...'); done(); setTimeout(()=>Eggs.gpf('COMMAND'),400); break; }
        this.print('Bad command or file name');
        done();
      }
    }
  }
  cmdCd(arg){
    if(!arg){ this.print(this.drive+':'+this.cwd[this.drive]); return; }
    const p=this.resolveRel(arg);
    const r=VFS.resolve(p);
    if(!r||!r.node.d){ this.print('Invalid directory'); return; }
    const {drive,parts}=VFS.split(p);
    if(drive===this.drive) this.cwd[this.drive]='\\'+parts.join('\\');
    else { this.cwd[drive]='\\'+parts.join('\\'); }
  }
  glob(pattern){ // returns regex from DOS wildcard
    const rx=pattern.replace(/[.+^${}()|[\]]/g,'\\$&').replace(/\*/g,'[^.]*').replace(/\?/g,'.');
    return new RegExp('^'+rx+'$','i');
  }
  cmdDir(arg){
    let p=this.drive+':'+this.cwd[this.drive], filter=null;
    arg=(arg||'').replace(/\/\w+/g,'').trim();
    if(arg){
      const cand=this.resolveRel(arg);
      const r=VFS.resolve(cand);
      if(r&&r.node.d) p=cand;
      else if(arg.includes('*')||arg.includes('?')){
        const idx=arg.lastIndexOf('\\');
        if(idx>=0){ p=this.resolveRel(arg.slice(0,idx)||'\\'); filter=this.glob(arg.slice(idx+1)); }
        else filter=this.glob(arg);
      }
      else if(r&&!r.node.d){ p=cand.slice(0,cand.lastIndexOf('\\'))||cand.slice(0,2)+'\\'; filter=this.glob(arg.split('\\').pop()); }
      else { this.print('File not found'); return; }
    }
    const {drive}=VFS.split(p);
    const d=VFS.drives[drive];
    if(drive==='A'&&d.empty){ this.print('Not ready reading drive A\nAbort, Retry, Fail?F'); return; }
    const list=VFS.list(p);
    if(!list){ this.print('Invalid directory'); return; }
    this.print(' Volume in drive '+drive+(d.label?' is '+d.label:' has no label'));
    this.print(' Volume Serial Number is '+d.serial);
    let disp=VFS.norm(p); if(disp.length>3&&disp.endsWith('\\'))disp=disp.slice(0,-1);
    this.print(' Directory of '+disp+'\n');
    let files=0,dirs=0,bytes=0;
    const {parts}=VFS.split(p);
    if(parts.length){ this.print(U.padr('.',12)+' <DIR>     '+U.dosDate(new Date(1993,10,8))+'   3:11a');
      this.print(U.padr('..',12)+' <DIR>     '+U.dosDate(new Date(1993,10,8))+'   3:11a'); dirs+=2; }
    for(const {name,node} of list){
      if(filter && !node.d && !filter.test(name)) continue;
      if(filter && node.d) continue;
      const base=name.includes('.')?name.slice(0,name.lastIndexOf('.')):name;
      const ext=name.includes('.')?name.slice(name.lastIndexOf('.')+1):'';
      const nm=U.padr(base,8)+' '+U.padr(ext,3);
      if(node.d){ this.print(nm+' <DIR>     11-08-93   3:11a'); dirs++; }
      else { this.print(nm+U.pad(U.fmtN(node.s),10)+' '+node.dt+'  '+U.pad(node.tm,6)); files++; bytes+=node.s; }
    }
    this.print(U.pad(files+dirs,9)+' file(s)'+U.pad(U.fmtN(bytes),13)+' bytes');
    this.print(U.pad('',9)+'        '+U.pad(U.fmtN(VFS.freeBytes(drive)),13)+' bytes free');
  }
  cmdDel(arg){
    const done=()=>{ this.print(''); this.prompt(); };
    if(!arg){ this.print('Required parameter missing'); done(); return; }
    const p=this.resolveRel(arg);
    if(arg.endsWith('*.*')||arg==='*.*'){
      this.pendingConfirm={prompt:'All files in directory will be deleted!\nAre you sure (Y/N)?', cb:(ans)=>{
        if(ans==='Y'){
          const dir=p.slice(0,p.lastIndexOf('\\'))||p.slice(0,2)+'\\';
          const list=VFS.list(dir)||[];
          list.filter(x=>!x.node.d).forEach(x=>VFS.del(VFS.join(dir,x.name)));
        }
        this.print(''); this.prompt();
      }};
      this.render(); return;
    }
    if(arg.includes('*')||arg.includes('?')){
      const dir=p.includes('\\')?(p.slice(0,p.lastIndexOf('\\'))||p.slice(0,2)+'\\'):this.path();
      const rx=this.glob(p.split('\\').pop());
      const list=VFS.list(dir)||[];
      let n=0;
      list.filter(x=>!x.node.d&&rx.test(x.name)).forEach(x=>{VFS.del(VFS.join(dir,x.name));n++;});
      if(!n)this.print('File not found');
      done(); return;
    }
    const e2=VFS.del(p);
    if(e2)this.print(e2);
    done();
  }
}

const Boot = {
  session:null, skipping:false, postDone:false,
  el(){ return document.getElementById('boot'); },

  start(){
    Sys.set('boot');

      [30,''],
      [220,'80486DX2 CPU at 66MHz'],
      [120,'Memory Test :     0K'],
    ];
    let lines=[];
    const draw=(extra)=>{ pre.innerHTML=U.esc(lines.join('\n')+(extra||'')); };
    let i=0;
    const step=()=>{
      if(Boot.skipping)return;
      if(i<post.length){
        lines.push(post[i][1]);
        draw();
        i++;
        setTimeout(step, post[i-1][0]);
      } else {
        // memory count animation
        let k=0;

  },
  post2(lines,draw){

      [150,''],
      [260,'Detecting IDE Primary Master ... SIMUDISK 3130  (130MB)'],

      if(Boot.skipping)return;
      if(i<more.length){ lines.push(more[i][1]); draw(); i++; setTimeout(step,more[i-1][0]); }
      else Boot.dosStart(lines,draw);
    };
    step();
  },
  dosStart(lines,draw){
    if(Boot.skipping)return;
    lines.length=0;

  readyPrompt(){

    const auto=(VFS.read('C:\\AUTOEXEC.BAT')||'');

/* ================= Global keyboard routing ================= */
function accelMatch(spec, e){
  const parts=spec.split('+');
  const key=parts[parts.length-1];
  const ctrl=parts.includes('Ctrl'), alt=parts.includes('Alt'), shift=parts.includes('Shift');
  if(!!e.ctrlKey!==ctrl || !!e.altKey!==alt || !!e.shiftKey!==shift) return false;
  const map={'Del':'Delete','Esc':'Escape','Enter':'Enter','Backspace':'Backspace','Hyphen':'-'};
  const want=map[key]||key;
  if(/^F\d+$/.test(want)) return e.key===want;
  if(want.length===1) return e.key.toLowerCase()===want.toLowerCase();
  return e.key===want;
}
function findAccel(win, e){
  // walk this window and its MDI parent for matching menu accelerators
  let w=win;
  while(w){
    if(w.menuDefs){
      for(const m of w.menuDefs){
        const items=typeof m.items==='function'?m.items(w):m.items;
        for(const it of items){
          if(it.sep||!it.k||it.noAccel) continue;
          if(it.k==='Enter'||it.k==='Del'&&it.softDel) continue;
          if(accelMatch(it.k,e)){
            const dis=typeof it.dis==='function'?it.dis(w):!!it.dis;
            if(!dis) return {it, win:w};
            return {it:null, win:w};
          }
        }
      }
    }
    w=w.o.parent||null;
  }
  return null;
}

let altPending=false;
document.addEventListener('keydown',(e)=>{
  // --- special layers ---
  if(Sys.mode==='bsod'){ e.preventDefault(); Eggs.closeBsod(); return; }
  if(Saver.active){ e.preventDefault(); Saver.stop(); return; }
  Saver.poke();
  if(Sys.mode==='splash'){ e.preventDefault(); return; }
  if(Sys.mode==='boot'){
    if(Editor.active){ return; }
    if(FSApp.rawMode){ FSApp.key(e); return; }
    if(e.key==='Escape' && !Sys.winRunning && Boot.session==null){ e.preventDefault(); Boot.skipToWindows(); return; }
    if(e.key==='Escape' && !Sys.winRunning && Boot.session && !Boot.session.input){ e.preventDefault(); Boot.skipToWindows(); return; }
    if(Boot.session) Boot.session.key(e);
    else e.preventDefault();
    return;
  }
  if(Sys.mode==='fsdos'){ FSApp.key(e); return; }
  if(Sys.mode!=='win') return;

  // --- Windows mode ---
  if(e.key==='Alt' && !e.repeat){ altPending=true; }
  else if(e.key!=='Tab') altPending=false;

  // CoolSwitch
  if(e.altKey && e.key==='Tab'){
    e.preventDefault();
    altPending=false;
    if(!Cool.active) Cool.begin(e.shiftKey?-1:1);
    else Cool.step(e.shiftKey?-1:1);
    return;
  }
  if(Cool.active){
    if(e.key==='Escape'){ e.preventDefault(); Cool.cancel(); return; }
    e.preventDefault(); return;
  }

  // menus
  if(Menus.state){ if(Menus.handleKey(e)){ e.preventDefault(); } return; }

  const aw=WM.active;

  // dialog-local handler first
  if(aw && aw.keyHandler){ if(aw.keyHandler(e)){ e.preventDefault(); return; } }

  // system keys
  if(e.key==='Escape' && e.ctrlKey){ e.preventDefault(); TaskList.open(); return; }
  if(e.key==='Escape' && e.altKey){ e.preventDefault();
    const t=WM.topLevel().filter(w=>w.state!=='min');
    if(t.length>1){ const i=t.indexOf(aw&&aw.o.parent?aw.o.parent:aw); WM.focus(t[(i+1)%t.length]); }
    return; }
  if(e.altKey && e.key==='F4'){
    e.preventDefault();
    let top=aw; while(top&&top.o.parent)top=top.o.parent;
    if(top) top.sysClose();
    return; }
  if(e.ctrlKey && e.key==='F4'){
    e.preventDefault();
    if(aw && aw.o.parent) aw.close();
    return; }
  if((e.ctrlKey && e.key==='F6')||(e.ctrlKey&&e.key==='Tab')){
    e.preventDefault();
    let cont=aw; if(cont&&cont.o.parent)cont=cont.o.parent;
    if(cont&&cont.o.mdi&&cont.children.length){
      const kids=cont.children.filter(c=>!c.closed);
      const cur=kids.indexOf(aw);
      const nxt=kids[(cur+1)%kids.length];
      if(nxt) WM.focus(nxt);
    }
    return; }
  if(e.altKey && (e.key===' ')){
    e.preventDefault();
    let top=aw; while(top&&top.o.parent)top=top.o.parent;
    if(top) top.openSysMenu();
    return; }
  if(e.altKey && e.key==='-'){
    e.preventDefault();
    if(aw && aw.o.parent) aw.openSysMenu();
    return; }
  if(e.key==='F1' && !e.ctrlKey && !e.altKey){
    e.preventDefault();
    let top=aw; while(top&&top.o.parent)top=top.o.parent;
    HelpEngine.openFor(top?top.o.helpTopic:null);
    return; }
  // easter eggs
  if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='g'){ e.preventDefault(); Eggs.gpf(); return; }
  if(e.ctrlKey && e.altKey && e.key==='F10'){ e.preventDefault(); Eggs.bsod(); return; }

  // Alt+letter menubar
  if(e.altKey && /^[a-z]$/i.test(e.key)){
    let top=aw; while(top&&top.o.parent)top=top.o.parent;
    if(top && Menus.tryAltLetter(top, e.key.toLowerCase())){ e.preventDefault(); return; }
  }

  // menu accelerators
  if(aw && (e.ctrlKey||e.altKey||/^F\d+$/.test(e.key)||e.key==='Delete')){
    const hit=findAccel(aw,e);
    if(hit){ e.preventDefault(); if(hit.it&&hit.it.f) hit.it.f(hit.win); return; }
  }

  // app-level handler
  if(aw && aw.o.onKey){ if(aw.o.onKey(e,aw)){ e.preventDefault(); return; } }
  if(aw && aw.o.parent && aw.o.parent.o.onChildKey){ if(aw.o.parent.o.onChildKey(e,aw)){ e.preventDefault(); return; } }
},true);

document.addEventListener('keyup',(e)=>{
  if(e.key==='Alt'){
    if(Cool.active){ e.preventDefault(); Cool.commit(); altPending=false; return; }
    if(altPending && Sys.mode==='win' && !Menus.state){
      e.preventDefault();
      altPending=false;
      const aw=WM.active;
      let top=aw; while(top&&top.o.parent)top=top.o.parent;
      if(top&&top.menuDefs) Menus.openBar(top,0,true);
      return;
    }
    altPending=false;
  }
},true);

    const kids=PM.win.children.filter(c=>c.state!=='min');
    if(!kids.length)return;
    const cw=PM.win.mdiClient.clientWidth, ch=PM.win.mdiClient.clientHeight;
    const cols=Math.ceil(Math.sqrt(kids.length)), rows=Math.ceil(kids.length/cols);
    kids.forEach((c,i)=>{
      if(c.state==='max')c.restore();
      const col=i%cols, row=Math.floor(i/cols);
      c.setPos(Math.floor(col*cw/cols), Math.floor(row*ch/rows));
      c.setSize(Math.floor(cw/cols), Math.floor(ch/rows));
    });

    }
    S.set('pmSaveSettings',PM.saveSettings);
  }
};

/* ================= Application registry ================= */
const Apps = {
  reg:{}, single:{},
  add(key,def){ Apps.reg[key]=def; },
  iconFor(cmd){
    const d=Apps.reg[(cmd||'').toUpperCase()];
    return d?d.icon:'doc';
  },
  run(cmd, args, owner){
    cmd=(cmd||'').toUpperCase();
    const d=Apps.reg[cmd];
    if(!d){ Apps.notFound(cmd, owner); return null; }
    if(d.singleton){
      const w=Apps.single[cmd];
      if(w && !w.closed){ WM.focus(w); return w; }
    }
    const win=d.launch(args);
    if(d.singleton && win) Apps.single[cmd]=win;
    return win;
  },
  notFound(name, owner){
    Dlg.msg(owner||PM.win,{title:'Application Execution Error', icon:'excl',
      text:'Cannot find file \''+(name||'')+'\' (or one of its components).\nCheck to ensure the path and filename are correct and\nthat all required libraries are available.'});
  },
  runCommandLine(cl, owner){
    const sp=cl.trim().split(/\s+/);
    let name=(sp[0]||'').toUpperCase();
    const args=sp.slice(1).join(' ');
    // document path?
    if(/\.(TXT|INI|WRI|BMP|CRD|CAL|TRM|BAT|SYS|HLP|WPD|CFG)$/i.test(name)){
      Assoc.launch(name.includes('\\')?name:('C:\\'+name), owner); return;
    }
    const base=name.replace(/\.(EXE|COM|BAT|PIF)$/,'').split('\\').pop();
    const alias={COMMAND:'DOSPROMPT', DOSPRMPT:'DOSPROMPT', CLIPBRD:'CLIPBOOK', WINVER:'WINVER',
      PROGMAN:'PROGMAN', WIN:'WIN', EDIT:'EDIT', WP:'DOSAPP-WP', XD:'DOSAPP-XD', CAVERN:'DOSAPP-CAVERN'};
    const key=alias[base]||base;
    if(key==='PROGMAN'){ WM.focus(PM.win); return; }
    if(key==='WIN'){ Dlg.msg(owner,{title:'Windows', icon:'excl', text:'You are already running Microsoft Windows.'}); return; }
    if(key==='EDIT'){ FSApp.editFile(null,null); return; }
    if(key.startsWith('DOSAPP-')){ Apps.run('DOSAPP', key.slice(7), owner); return; }
    if(key==='GPF'){ Eggs.gpf('RUNME'); return; }
    if(key==='BSOD'||key==='ERROR'){ Eggs.bsod(); return; }
    if(key==='CREDITS'){ Eggs.credits(); return; }
    if(!Apps.reg[key]){ Apps.notFound(sp[0], owner); return; }
    Apps.run(key, args, owner);
  }
};

/* ================= File associations ================= */
const Assoc = {
  map(){ return Object.assign({
    TXT:'NOTEPAD', INI:'NOTEPAD', BAT:'NOTEPAD', SYS:'NOTEPAD', CFG:'NOTEPAD',
    WRI:'WRITE', WPD:'WRITE', BMP:'PBRUSH', CRD:'CARDFILE', CAL:'CALENDAR',
    TRM:'TERMINAL', HLP:'WINHELP', MID:'MPLAYER', WAV:'SOUNDREC'
  }, S.get('assocExtra',{})); },
  launch(path, owner){
    path=VFS.norm(path);
    const r=VFS.resolve(path);
    if(!r){ Apps.notFound(path.split('\\').pop(), owner); return; }
    const name=path.split('\\').pop();
    const ext=name.includes('.')?name.slice(name.lastIndexOf('.')+1):'';
    if(ext==='EXE'||ext==='COM'||ext==='PIF'){
      const base=name.replace(/\.(EXE|COM|PIF)$/,'');
      if(base==='WIN'){ Dlg.msg(owner,{title:'Windows',icon:'excl',text:'You are already running Microsoft Windows.'}); return; }
      if(base==='EDIT'||base==='QBASIC'){ hourglass(400); setTimeout(()=>FSApp.editFile(null,null),300); return; }
      if(['WP','XD','CAVERN'].includes(base)){ hourglass(400); setTimeout(()=>Apps.run('DOSAPP',base,owner),300); return; }
      if(Apps.reg[base]){ hourglass(400); setTimeout(()=>Apps.run(base,null,owner),200); return; }
      Dlg.msg(owner,{title:'File Manager',icon:'excl',
        text:'This MS-DOS-based application cannot run in this\nsimulation. It stares back blankly, as software did\nin 1993 when asked to do something unusual.'});
      return;
    }
    if(ext==='BAT'){ Apps.run('NOTEPAD', path, owner); return; }
    if(ext==='GRP'){ Dlg.msg(owner,{title:'File Manager',icon:'excl',text:'Program group files belong to Program Manager.\nOpening them directly voids the warranty.'}); return; }
    const app=Assoc.map()[ext];
    if(app==='WINHELP'){ HelpEngine.openFor('progman'); return; }
    if(app){ Apps.run(app, path, owner); return; }
    Dlg.msg(owner,{title:'File Manager', icon:'excl',
      text:'No application is associated with this file.\n\nChoose Associate from the File menu to create an\nassociation.'});
  }
};

/* ================= File Manager (WINFILE) ================= */
const WF = {
  win:null, childSeq:0,
  confirm(){ return S.get('wfConfirm',{del:true, deldir:true, replace:true, mouse:true, disk:true}); },
  open(){
    const win=WM.create({
      title:'File Manager', icon:'winfile', appKey:'WINFILE',
      x:50,y:36,w:560,h:400, mdi:true, minW:380, minH:220,
      helpTopic:'winfile',
      menus:WF.menus(),
      status:[{},{fix:true,w:220}],
      onChildKey(e,w){ return WF.childKey(e,w); },
      onClosed(){ WF.win=null; }
    });
    WF.win=win;
    win.mdiClient.style.top='0px';
    WF.newDriveWindow('C');
    WF.updateStatus();
    return win;
  },
  drives(){
    const list=[{letter:'A',icon:'sm_floppy'},{letter:'B',icon:'sm_floppy'},{letter:'C',icon:'sm_drive'}];
    Object.keys(VFS.drives).sort().forEach(d=>{
      if(!['A','B','C'].includes(d)) list.push({letter:d, icon:'sm_netdrive'});
    });
    return list;
  },
  activeChildState(){
    const c=WF.win && WF.win.activeChild;
    return c && !c.closed && c.wfState ? c : (WF.win?WF.win.children.find(k=>k.wfState&&!k.closed):null);
  },
  newDriveWindow(drive){
    const st={ drive, path:drive+':\\', sel:null, expanded:new Set([drive+':\\']),
      view:S.get('wfView','name'), split:'both', sort:'name' };
    const child=WM.create({
      title:drive+':\\*.* - ['+(VFS.drives[drive].label||'')+']',
      icon:'winfile', parent:WF.win, iconLabel:drive+':\\*.*',
      x:8+(WF.childSeq%4)*22, y:6+(WF.childSeq%4)*20, w:430, h:260, minW:220, minH:120,
      onFocus(w){ WF.updateStatus(); }
    });
    WF.childSeq++;
    child.wfState=st;
    child.body.style.background='var(--face)';
    // drive bar
    const db=U.el('div','wf-drivebar');
    child.body.appendChild(db);
    // split panes
    const split=U.el('div','wf-split');
    split.style.top='24px';
    const tree=U.el('div','wf-tree');
    const list=U.el('div','wf-list');
    split.appendChild(tree); split.appendChild(list);
    child.body.appendChild(split);
    child.wfEls={db,tree,list,split};
    WF.renderAll(child);
    return child;
  },
  renderAll(child){
    WF.renderDriveBar(child);
    WF.renderTree(child);
    WF.renderList(child);
    WF.updateTitle(child);
    WF.updateStatus();
  },
  updateTitle(child){
    const st=child.wfState;
    child.setTitle(st.path+(st.path.endsWith('\\')?'':'\\')+'*.*');
  },
  renderDriveBar(child){
    const st=child.wfState, db=child.wfEls.db;
    db.innerHTML='';
    WF.drives().forEach(d=>{
      const b=U.el('span','wf-drive'+(d.letter===st.drive?' cur':''),
        Icons.draw(d.icon,1)+'<span style="margin-left:2px">'+d.letter.toLowerCase()+'</span>');
      b.addEventListener('mousedown',e=>{e.preventDefault();});
      b.addEventListener('click',()=>WF.switchDrive(child,d.letter));
      db.appendChild(b);
    });
    const lbl=U.el('span','', '&nbsp; '+st.drive+': '+(VFS.drives[st.drive].label?'['+U.esc(VFS.drives[st.drive].label)+']':''));
    lbl.style.marginLeft='8px';
    db.appendChild(lbl);
  },
  switchDrive(child, letter){
    const st=child.wfState;
    if(letter==='A'||letter==='B'){
      const retry=()=>{
        Dlg.msg(WF.win,{title:'File Manager', icon:'stop',
          text:'There is no disk in drive '+letter+'.\nInsert a disk, and then try again.',
          buttons:['Retry','Cancel'], def:1},(a)=>{ if(a===0) retry(); });
      };
      retry(); return;
    }
    st.drive=letter; st.path=letter+':\\'; st.sel=null;
    st.expanded=new Set([letter+':\\']);
    WF.renderAll(child);
  },
  /* ---------- tree ---------- */
  renderTree(child){
    const st=child.wfState, tree=child.wfEls.tree;
    tree.innerHTML='';
    if(st.split==='dir'){ tree.style.display='none'; return; }
    tree.style.display='';
    child.wfEls.list.style.display=(st.split==='tree')?'none':'';
    const addRow=(path, name, depth)=>{
      const cur=VFS.norm(st.path).replace(/\\$/,'')===path.replace(/\\$/,'');
      const row=U.el('div','wf-row'+(cur?' sel':''));
      row.style.paddingLeft=(4+depth*14)+'px';
      row.innerHTML=Icons.draw(cur?'sm_folderopen':'sm_folder',1)+'<span class="nm">'+U.esc(name)+'</span>';
      row.addEventListener('mousedown',e=>{ e.preventDefault(); WM.focus(child); });
      row.addEventListener('click',()=>{ st.path=path; st.sel=null; WF.renderAll(child); });
      row.addEventListener('dblclick',()=>{
        if(st.expanded.has(path)) st.expanded.delete(path); else st.expanded.add(path);
        st.path=path; WF.renderAll(child);
      });
      tree.appendChild(row);
    };
    const walk=(path, depth)=>{
      const list=VFS.list(path)||[];
      for(const {name,node} of list){
        if(!node.d) continue;
        const p=VFS.join(path,name);
        addRow(p, name, depth);
        if(st.expanded.has(p)) walk(p, depth+1);
      }
    };
    addRow(st.drive+':\\', st.drive+':\\', 0);
    walk(st.drive+':\\', 1);
  },
  /* ---------- file list ---------- */
  fileIcon(name,node){
    if(node.d) return 'sm_folder';
    const ext=name.includes('.')?name.slice(name.lastIndexOf('.')+1):'';
    if(['EXE','COM','BAT','PIF'].includes(ext)) return 'sm_exe';
    if(['SYS','INI','DLL','DRV','386','FON','FOT','GRP'].includes(ext)) return 'sm_sys';
    return 'sm_doc';
  },
  sortList(st, arr){
    const key=st.sort;
    return arr.sort((a,b)=>{
      if(a.node.d!==b.node.d) return a.node.d?-1:1;
      if(key==='size') return (a.node.s||0)-(b.node.s||0);
      if(key==='date') return String(a.node.dt).localeCompare(String(b.node.dt));
      if(key==='type'){
        const ea=a.name.includes('.')?a.name.split('.').pop():'';
        const eb=b.name.includes('.')?b.name.split('.').pop():'';
        if(ea!==eb) return ea<eb?-1:1;
      }
      return a.name<b.name?-1:1;
    });
  },
  renderList(child){
    const st=child.wfState, list=child.wfEls.list;
    list.innerHTML='';
    if(st.split==='tree') return;
    const items=VFS.list(st.path);
    if(!items){ list.innerHTML='<div style="padding:6px">Directory not found.</div>'; return; }
    const rows=WF.sortList(st, items.slice());
    const {parts}=VFS.split(st.path);
    child.wfRows=[];
    if(parts.length){
      const up=U.el('div','wf-row');
      up.innerHTML=Icons.draw('sm_updir',1)+'<span class="nm">..</span>';
      up.addEventListener('dblclick',()=>WF.goUp(child));
      up.addEventListener('mousedown',e=>{e.preventDefault(); WM.focus(child); WF.select(child,null);});
      list.appendChild(up);
    }
    rows.forEach(({name,node})=>{
      const row=U.el('div','wf-row'+(st.sel===name?' sel':''));
      let meta='';
      if(st.view==='details'){
        meta='<span class="meta tt">'+(node.d?'&lt;DIR&gt;':U.pad(U.fmtN(node.s),9).replace(/ /g,'&nbsp;'))+'&nbsp;&nbsp;'+node.dt+'&nbsp;&nbsp;'+node.tm+'</span>';
      }
      row.innerHTML=Icons.draw(WF.fileIcon(name,node),1)+'<span class="nm">'+U.esc(name)+'</span>'+meta;
      row.addEventListener('mousedown',e=>{ e.preventDefault(); WM.focus(child); WF.select(child,name); });
      row.addEventListener('dblclick',()=>WF.openEntry(child,name,node));
      list.appendChild(row);
      child.wfRows.push({name,node,row});
    });
    WF.updateStatus();
  },
  select(child,name){
    child.wfState.sel=name;
    child.wfRows&&child.wfRows.forEach(r=>r.row.classList.toggle('sel', r.name===name));
    WF.updateStatus();
  },
  goUp(child){
    const st=child.wfState;
    const {drive,parts}=VFS.split(st.path);
    if(!parts.length)return;
    st.path=drive+':\\'+parts.slice(0,-1).join('\\');
    st.sel=null;
    WF.renderAll(child);
  },
  openEntry(child,name,node){
    const st=child.wfState;
    if(node.d){
      st.path=VFS.join(st.path,name);
      st.expanded.add(VFS.norm(st.path).replace(/\\$/,''));
      st.sel=null;
      WF.renderAll(child);
    } else {
      Assoc.launch(VFS.join(st.path,name), WF.win);
    }
  },
  childKey(e,child){
    if(!child.wfState) return false;
    const st=child.wfState;
    const rows=child.wfRows||[];
    const idx=rows.findIndex(r=>r.name===st.sel);
    if(e.key==='ArrowDown'){ const n=rows[Math.min(rows.length-1, idx+1)]; if(n)WF.select(child,n.name); return true; }
    if(e.key==='ArrowUp'){ const n=rows[Math.max(0, idx-1)]; if(n)WF.select(child,n.name); return true; }
    if(e.key==='Enter'){ const r=rows[idx]; if(r)WF.openEntry(child,r.name,r.node); return true; }
    if(e.key==='Backspace'){ WF.goUp(child); return true; }
    return false;
  },
  selInfo(){
    const c=WF.activeChildState();
    if(!c) return null;
    const st=c.wfState;
    if(!st.sel) return {child:c, st, path:null};
    return {child:c, st, path:VFS.join(st.path,st.sel), name:st.sel,
      node:(VFS.resolve(VFS.join(st.path,st.sel))||{}).node};
  },
  updateStatus(){
    if(!WF.win||WF.win.closed)return;
    const c=WF.activeChildState();
    if(!c){ WF.win.setStatus(0,''); WF.win.setStatus(1,''); return; }
    const st=c.wfState;
    const free=VFS.freeBytes(st.drive), total=VFS.drives[st.drive].total;
    WF.win.setStatus(0, st.drive+': '+U.fmtN(free)+' bytes free, '+U.fmtN(total)+' bytes total');
    const items=VFS.list(st.path)||[];
    const files=items.filter(x=>!x.node.d);
    const bytes=files.reduce((s,x)=>s+(x.node.s||0),0);
    WF.win.setStatus(1, 'Total '+files.length+' file(s) ('+U.fmtN(bytes)+' bytes)');
  },
  refresh(){
    if(!WF.win)return;
    WF.win.children.forEach(c=>{ if(c.wfState&&!c.closed) WF.renderAll(c); });
  },
  /* ---------- menus ---------- */
  menus(){
    const needSel=()=>{ const s=WF.selInfo(); return !(s&&s.path); };
    return [
      {label:'&File', items:()=>[
        {label:'&Open', k:'Enter', noAccel:true, f:()=>{ const s=WF.selInfo(); if(s&&s.path)WF.openEntry(s.child,s.name,s.node); }},
        {label:'&Move...', k:'F7', dis:needSel, f:()=>WF.moveCopy(false)},
        {label:'&Copy...', k:'F8', dis:needSel, f:()=>WF.moveCopy(true)},
        {label:'&Delete...', k:'Del', dis:needSel, f:()=>WF.deleteSel()},
        {label:'Re&name...', dis:needSel, f:()=>WF.renameSel()},
        {label:'Prop&erties...', k:'Alt+Enter', dis:needSel, f:()=>WF.propsSel()},
        {sep:true},
        {label:'&Run...', f:()=>PM.runDialog()},
        {label:'&Associate...', f:()=>WF.associate()},
        {sep:true},
        {label:'Create Director&y...', f:()=>WF.createDir()},
        {label:'Searc&h...', f:()=>WF.search()},
        {label:'Se&lect Files...', f:()=>WF.selectFiles()},
        {sep:true},
        {label:'E&xit', f:()=>WF.win.close()}
      ]},
      {label:'&Disk', items:()=>[
        {label:'&Copy Disk...', f:()=>WF.noDiskA('copy')},
        {label:'&Label Disk...', f:()=>WF.labelDisk()},
        {sep:true},
        {label:'&Format Disk...', f:()=>WF.formatDisk()},
        {label:'&Make System Disk...', f:()=>WF.noDiskA('sys')},
        {sep:true},
        {label:'Connect &Network Drive...', f:()=>Net.connectDriveDialog(WF.win,()=>WF.refresh())},
        {label:'&Disconnect Network Drive...', f:()=>Net.disconnectDriveDialog(WF.win,()=>WF.refresh())},
        {sep:true},
        {label:'Share &As...', f:()=>Net.shareAsDialog(WF.win)},
        {label:'S&top Sharing...', f:()=>Net.stopSharingDialog(WF.win)},
        {sep:true},
        {label:'&Select Drive...', f:()=>WF.selectDrive()}
      ]},
      {label:'&Tree', items:()=>[
        {label:'&Expand One Level', k:'+', noAccel:true, f:()=>WF.expandLevel(1)},
        {label:'Expand &Branch', k:'*', noAccel:true, f:()=>WF.expandLevel(9)},
        {label:'Expand &All', k:'Ctrl+*', noAccel:true, f:()=>WF.expandAll()},
        {label:'&Collapse Branch', k:'-', noAccel:true, f:()=>WF.collapse()},
        {sep:true},
        {label:'&Indicate Expandable Branches', chk:true, f:()=>{}}
      ]},
      {label:'&View', items:()=>{
        const c=WF.activeChildState(); const st=c?c.wfState:{};
        return [
          {label:'Tree and Director&y', chk:st.split==='both', f:()=>WF.setSplit('both')},
          {label:'Tr&ee Only', chk:st.split==='tree', f:()=>WF.setSplit('tree')},
          {label:'Directory &Only', chk:st.split==='dir', f:()=>WF.setSplit('dir')},
          {sep:true},
          {label:'&Name', chk:st.view==='name', f:()=>WF.setView('name')},
          {label:'&All File Details', chk:st.view==='details', f:()=>WF.setView('details')},
          {sep:true},
          {label:'Sort by &Name', chk:st.sort==='name', f:()=>WF.setSort('name')},
          {label:'Sort by &Type', chk:st.sort==='type', f:()=>WF.setSort('type')},
          {label:'Sort by Si&ze', chk:st.sort==='size', f:()=>WF.setSort('size')},
          {label:'Sort by &Date', chk:st.sort==='date', f:()=>WF.setSort('date')}
        ];
      }},
      {label:'&Options', items:()=>[
        {label:'&Confirmation...', f:()=>WF.confirmDialog()},
        {label:'&Font...', f:()=>Dlg.msg(WF.win,{title:'Font',icon:'info',text:'File Manager uses the classic tight listing font.\nIt is period-perfect already.'})},
        {sep:true},
        {label:'&Status Bar', chk:true, f:()=>{}},
        {label:'&Minimize on Use', chk:false, f:()=>{}},
        {label:'&Save Settings on Exit', chk:true, f:()=>{}}
      ]},
      {label:'&Window', items:()=>{
        const base=[
          {label:'&New Window', f:()=>{ const c=WF.activeChildState(); WF.newDriveWindow(c?c.wfState.drive:'C'); }},
          {label:'&Cascade', k:'Shift+F5', f:()=>WF.cascadeChildren()},
          {label:'&Tile', k:'Shift+F4', f:()=>WF.tileChildren()},
          {label:'Arrange &Icons', f:()=>{}},
          {label:'&Refresh', k:'F5', f:()=>WF.refresh()},
          {sep:true}
        ];
        WF.win.children.forEach((c,i)=>{
          base.push({label:'&'+(i+1)+' '+c.title, chk:WM.active===c, f:()=>WM.focus(c)});
        });
        return base;
      }},
      {label:'&Help', items:()=>[
        {label:'&Contents', f:()=>HelpEngine.openFor('winfile')},
        {label:'&Search for Help on...', f:()=>HelpEngine.searchDialog('winfile')},
        {sep:true},
        {label:'&About File Manager...', f:()=>Eggs.about(WF.win,'File Manager')}
      ]}
    ];
  },
  setSplit(v){ const c=WF.activeChildState(); if(c){ c.wfState.split=v; WF.renderAll(c); } },
  setView(v){ const c=WF.activeChildState(); if(c){ c.wfState.view=v; S.set('wfView',v); WF.renderList(c); } },
  setSort(v){ const c=WF.activeChildState(); if(c){ c.wfState.sort=v; WF.renderList(c); } },
  expandLevel(n){
    const c=WF.activeChildState(); if(!c)return;
    const st=c.wfState;
    const walk=(path,depth)=>{
      if(depth>n)return;
      st.expanded.add(path.replace(/\\$/,'')||path);
      (VFS.list(path)||[]).forEach(({name,node})=>{ if(node.d) walk(VFS.join(path,name),depth+1); });
    };
    walk(st.path,1);
    WF.renderTree(c);
  },
  expandAll(){ const c=WF.activeChildState(); if(!c)return;
    const st=c.wfState;
    const walk=(path)=>{ st.expanded.add(path.replace(/\\$/,'')||path);
      (VFS.list(path)||[]).forEach(({name,node})=>{ if(node.d) walk(VFS.join(path,name)); }); };
    walk(st.drive+':\\'); WF.renderTree(c); },
  collapse(){ const c=WF.activeChildState(); if(!c)return;
    c.wfState.expanded.delete(VFS.norm(c.wfState.path).replace(/\\$/,''));
    WF.renderTree(c); },
  cascadeChildren(){ let n=0; WF.win.children.forEach(c=>{ if(c.state==='min')return; if(c.state==='max')c.restore(); c.setPos(8+n*22,6+n*20); n++; WM.raiseChild(c); }); },
  tileChildren(){
    const kids=WF.win.children.filter(c=>c.state!=='min');
    if(!kids.length)return;
    const cw=WF.win.mdiClient.clientWidth, ch=WF.win.mdiClient.clientHeight;
    kids.forEach((c,i)=>{ if(c.state==='max')c.restore();
      c.setPos(0, Math.floor(i*ch/kids.length)); c.setSize(cw, Math.floor(ch/kids.length)); });
  },
  /* ---------- file ops ---------- */
  moveCopy(isCopy){
    const s=WF.selInfo(); if(!s||!s.path)return;
    Dlg.custom({
      title:(isCopy?'Copy':'Move'), w:380, h:130, owner:WF.win,
      build(pad,win){
        pad.innerHTML='<div style="margin-bottom:2px">Current Directory: '+U.esc(s.st.path)+'</div>'+
          '<div style="margin:6px 0 2px">'+(isCopy?'<u>F</u>rom: '+U.esc(s.name)+'&nbsp;&nbsp;<u>T</u>o:':'<u>F</u>rom: '+U.esc(s.name)+'&nbsp;&nbsp;<u>T</u>o:')+'</div>';
        const inp=U.el('input','tf'); inp.value=''; inp.style.width='240px';
        pad.appendChild(inp);
        const row=U.el('div'); row.style.cssText='position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;';
        row.appendChild(Dlg.btn('OK',{def:true,f:()=>{
          const dstRaw=inp.value.trim(); if(!dstRaw){win.close();return;}
          const dst=dstRaw.includes(':')||dstRaw.startsWith('\\')?VFS.norm(dstRaw):VFS.join(s.st.path,dstRaw);
          win.close();
          const dR=VFS.resolve(dst);
          let e2;
          if(dR&&dR.node.d){ e2=VFS.copy(s.path,dst); if(!e2&&!isCopy)VFS.del(s.path); }
          else {
            const dir=dst.slice(0,dst.lastIndexOf('\\'))||dst.slice(0,2)+'\\';
            const nm=dst.split('\\').pop();
            e2=VFS.copy(s.path,dir,nm); if(!e2&&!isCopy)VFS.del(s.path);
          }
          if(e2)Dlg.msg(WF.win,{title:'File Manager',icon:'stop',text:e2});
          WF.refresh();
        }}));
        row.appendChild(Dlg.btn('Cancel',{f:()=>win.close()}));
        row.appendChild(Dlg.btn('&Help',{f:()=>HelpEngine.openFor('winfile')}));
        pad.appendChild(row);
        pad.style.position='relative'; pad.style.paddingRight='100px';
        setTimeout(()=>inp.focus(),0);
      }
    });
  },
  deleteSel(){
    const s=WF.selInfo(); if(!s||!s.path)return;
    const doDel=()=>{
      const e2=VFS.del(s.path);
      if(e2)Dlg.msg(WF.win,{title:'File Manager',icon:'stop',text:e2+'\n'+s.path});
      s.st.sel=null;
      WF.refresh();
    };
    if(WF.confirm().del){
      Dlg.msg(WF.win,{title:'Delete', icon:'quest',
        text:'Delete '+s.path+'?', buttons:['Yes','No'], def:0},(a)=>{ if(a===0)doDel(); });
    } else doDel();
  },
  renameSel(){
    const s=WF.selInfo(); if(!s||!s.path)return;
    Dlg.custom({
      title:'Rename', w:360, h:130, owner:WF.win,
      build(pad,win){
        pad.innerHTML='<div>Current Directory: '+U.esc(s.st.path)+'</div><div style="margin:6px 0 2px"><u>F</u>rom: '+U.esc(s.name)+'&nbsp;&nbsp;<u>T</u>o:</div>';
        const inp=U.el('input','tf'); inp.style.width='220px';
        pad.appendChild(inp);
        const row=U.el('div'); row.style.cssText='position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;';
        row.appendChild(Dlg.btn('OK',{def:true,f:()=>{
          const nn=inp.value.trim(); win.close();

/* ================= common File Open/Save dialog ================= */
const FileDlg = {
  show(owner, o, cb){
    // o: {title, ext (e.g.'TXT' or ['TXT','INI']), save:bool, fname}
    const exts=Array.isArray(o.ext)?o.ext:(o.ext?[o.ext]:null);
    let dir=o.dir||'C:\\';
    let fileList, dirList, fname, pathLbl;
    const filt='*.'+(exts?exts[0].toLowerCase():'*');
    const refresh=()=>{
      pathLbl.textContent=dir.toLowerCase();
      const items=VFS.list(dir)||[];
      const files=items.filter(x=>!x.node.d && (!exts || exts.includes((x.name.split('.').pop()||''))))
        .map(x=>({label:x.name.toLowerCase(), value:x.name}));
      fileList.setItems(files);
      const dirs=[];
      const {parts}=VFS.split(dir);
      if(parts.length) dirs.push({label:'[..]', value:'..'});
      items.filter(x=>x.node.d).forEach(x=>dirs.push({label:'['+x.name.toLowerCase()+']', value:x.name}));
      dirList.setItems(dirs);
    };
    Dlg.custom({
      title:o.title||(o.save?'Save As':'Open'), w:400, h:250, owner,
      build(pad,win){
        pad.innerHTML='';
        const grid=U.el('div');
        grid.style.cssText='display:flex;gap:12px;';
        const left=U.el('div'); left.style.cssText='flex:1;';
        const right=U.el('div'); right.style.cssText='flex:1;';
        left.innerHTML='<div style="margin-bottom:2px">File <u>N</u>ame:</div>';
        fname=U.el('input','tf'); fname.value=o.fname||filt;
        left.appendChild(fname);
        left.appendChild(U.el('div','', '<div style="margin:6px 0 2px;visibility:hidden">.</div>'));
        fileList=Dlg.list([],{h:100,onSel(it){ fname.value=it.value; },
          onDbl(it){ win.close(); cb(VFS.join(dir,it.value)); }});
        left.appendChild(fileList.el);
        right.innerHTML='<div style="margin-bottom:2px"><u>D</u>irectories:</div>';
        pathLbl=U.el('div'); pathLbl.style.marginBottom='4px';
        right.appendChild(pathLbl);
        dirList=Dlg.list([],{h:100,onDbl(it){
          if(it.value==='..'){ const {drive,parts}=VFS.split(dir); dir=drive+':\\'+parts.slice(0,-1).join('\\'); }
          else dir=VFS.join(dir,it.value);
          refresh();
        }});
        right.appendChild(dirList.el);
        const drv=U.el('div','', '<div style="margin:6px 0 2px">Dri&ves:</div>');
        const sel=U.el('select','tf');
        Object.keys(VFS.drives).sort().forEach(d=>{
          if((d==='A'||d==='B')&&VFS.drives[d].empty)return;
          const op=U.el('option','',U.esc(d.toLowerCase()+': '+(VFS.drives[d].label||'').toLowerCase()));
          op.value=d; sel.appendChild(op);
        });
        sel.value='C';
        sel.addEventListener('change',()=>{ dir=sel.value+':\\'; refresh(); });
        drv.appendChild(sel);
        right.appendChild(drv);
        grid.appendChild(left); grid.appendChild(right);
        pad.appendChild(grid);
        const row=U.el('div'); row.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:10px;';
        row.appendChild(Dlg.btn('OK',{def:true,f:()=>{
          let v=fname.value.trim().toUpperCase();
          if(!v)return;
          if(v.includes('*')){ refresh(); return; }
          if(exts&&!v.includes('.')) v+='.'+exts[0];
          const full=v.includes(':')?v:VFS.join(dir,v);
          if(!o.save){
            const r=VFS.resolve(full);
            if(!r){ Dlg.msg(win,{title:o.title||'Open',icon:'excl',text:'Cannot find the '+full+' file.\n\nCheck that the correct path and filename are given.'}); return; }
          }
          win.close(); cb(full);
        }}));
        row.appendChild(Dlg.btn('Cancel',{f:()=>{win.close(); if(o.onCancel)o.onCancel();}}));
        pad.appendChild(row);
        refresh();
        setTimeout(()=>fname.focus(),0);
      }
    });
  }
};

/* ================= Notepad ================= */
const Notepad = {
  open(path){
    let txt=path?(VFS.read(path)||'').replace(/\r\n/g,'\n'):'';
    const name=()=>path?path.split('\\').pop():'(untitled)';
    const win=WM.create({
      title:'Notepad - '+name(), icon:'notepad', appKey:'NOTEPAD',
      w:440, h:300, helpTopic:'notepad',
      menus:[
        {label:'&File', items:()=>[
          {label:'&New', f:(w)=>{ path=null; ta.value=''; w.setTitle('Notepad - (untitled)'); }},
          {label:'&Open...', f:(w)=>FileDlg.show(w,{ext:['TXT','INI','BAT','SYS','CFG'],title:'Open'},p=>{
            path=p; ta.value=(VFS.read(p)||'').replace(/\r\n/g,'\n'); w.setTitle('Notepad - '+name()); })},
          {label:'&Save', f:(w)=>Notepad.save(w,ta,path,(p)=>{path=p;w.setTitle('Notepad - '+name());})},
          {label:'Save &As...', f:(w)=>Notepad.saveAs(w,ta,(p)=>{path=p;w.setTitle('Notepad - '+name());})},
          {sep:true},
          {label:'&Print', f:(w)=>Print.enqueue(name(), ta.value.length)},
          {label:'Page Se&tup...', f:(w)=>Dlg.msg(w,{title:'Page Setup',icon:'info',text:'Margins: 0.75in all around.\nHeader: &f    Footer: Page &p\n\n(Faithfully remembered, faithfully ignored.)'})},
          {label:'P&rint Setup...', f:(w)=>Print.setupDialog(w)},
          {sep:true},
          {label:'E&xit', f:(w)=>w.close()}
        ]},
        {label:'&Edit', items:()=>[
          {label:'&Undo', k:'Ctrl+Z', noAccel:true, f:()=>document.execCommand('undo')},
          {sep:true},
          {label:'Cu&t', k:'Ctrl+X', noAccel:true, f:()=>Notepad.clip(ta,'cut')},
          {label:'&Copy', k:'Ctrl+C', noAccel:true, f:()=>Notepad.clip(ta,'copy')},
          {label:'&Paste', k:'Ctrl+V', noAccel:true, f:()=>Notepad.clip(ta,'paste')},
          {label:'De&lete', k:'Del', noAccel:true, f:()=>Notepad.clip(ta,'del')},
          {sep:true},
          {label:'Select &All', f:()=>{ta.select();}},
          {label:'Time/&Date', k:'F5', f:()=>{
            const d=new Date();
            const stamp=U.dosTime(d).replace(/^0/,'')+'M '+U.dosDate(d);
            Notepad.insert(ta, stamp.replace('aM',' AM').replace('pM',' PM'));
          }},
          {sep:true},
          {label:'&Word Wrap', chk:()=>ta.classList.contains('wrap'), f:()=>{
            ta.classList.toggle('wrap'); ta.classList.toggle('nowrap');
          }}
        ]},
        {label:'&Search', items:()=>[
          {label:'&Find...', f:(w)=>Notepad.findDialog(w,ta)},
          {label:'Find &Next', k:'F3', f:()=>Notepad.findNext(ta)}
        ]},
        {label:'&Help', items:()=>[
          {label:'&Contents', f:()=>HelpEngine.openFor('notepad')},
          {sep:true},
          {label:'&About Notepad...', f:(w)=>Eggs.about(w,'Notepad')}
        ]}
      ]
    });
    const ta=U.el('textarea','padta wrap');
    ta.spellcheck=false;
    ta.value=txt;
    win.body.appendChild(ta);
    win.focusEl=ta;
    setTimeout(()=>ta.focus(),0);
    return win;
  },
  insert(ta, s){
    const st=ta.selectionStart, en=ta.selectionEnd;
    ta.value=ta.value.slice(0,st)+s+ta.value.slice(en);
    ta.selectionStart=ta.selectionEnd=st+s.length;
    ta.focus();
  },
  clip(ta, op){
    const st=ta.selectionStart, en=ta.selectionEnd;
    const sel=ta.value.slice(st,en);
    if(op==='copy'){ if(sel)Clip.put(sel); }
    else if(op==='cut'){ if(sel){Clip.put(sel); ta.value=ta.value.slice(0,st)+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=st;} }
    else if(op==='del'){ if(sel){ta.value=ta.value.slice(0,st)+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=st;} }
    else if(op==='paste'){ Notepad.insert(ta, Clip.get()); }
    ta.focus();
  },
  save(w,ta,path,cb){
    if(!path){ Notepad.saveAs(w,ta,cb); return; }
    const e2=VFS.writeFile(path, ta.value.replace(/\n/g,'\r\n'));
    if(e2)Dlg.msg(w,{title:'Notepad',icon:'stop',text:e2});
    else cb(path);
  },
  saveAs(w,ta,cb){
    FileDlg.show(w,{ext:['TXT','INI','BAT'],title:'Save As',save:true,fname:'UNTITLED.TXT'},(p)=>{
      const e2=VFS.writeFile(p, ta.value.replace(/\n/g,'\r\n'));
      if(e2)Dlg.msg(w,{title:'Notepad',icon:'stop',text:e2});
      else cb(p);
    });
  },
  lastFind:'',
  findDialog(w,ta){
    Dlg.custom({
      title:'Find', w:330, h:110, owner:w,
      build(pad,win){
        const f=Dlg.field('Fi&nd What:',Notepad.lastFind);
        f.input.style.width='170px'; pad.appendChild(f);
        const row=U.el('div'); row.style.cssText='position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;';
        row.appendChild(Dlg.btn('&Find Next',{def:true,f:()=>{
          Notepad.lastFind=f.input.value;
          Notepad.findNext(ta, win);
        }}));
        row.appendChild(Dlg.btn('Cancel',{f:()=>win.close()}));
        pad.appendChild(row);
        pad.style.position='relative'; pad.style.paddingRight='100px';
        setTimeout(()=>f.input.focus(),0);
      }
    });
  },
  findNext(ta, dlgWin){
    const q=Notepad.lastFind;
    if(!q)return;
    const from=ta.selectionEnd||0;
    let idx=ta.value.indexOf(q, from);
    if(idx<0) idx=ta.value.indexOf(q, 0);
    if(idx<0){ Dlg.msg(dlgWin||null,{title:'Notepad',icon:'info',text:'Cannot find "'+q+'"'}); return; }
    ta.focus();
    ta.setSelectionRange(idx, idx+q.length);
  }
};

const Calc = {
  open(){
    let sci=false;
    const win=WM.create({
      title:'Calculator', icon:'calc', appKey:'CALC',
      w:230, h:236, resizable:false, maximizable:false,
      menus:[
        {label:'&Edit', items:()=>[
          {label:'&Copy', k:'Ctrl+C', noAccel:true, f:()=>Clip.put(disp.textContent)},
          {label:'&Paste', k:'Ctrl+V', noAccel:true, f:()=>{ const v=parseFloat(Clip.get()); if(!isNaN(v)){cur=String(v); paint();} }}
        ]},
        {label:'&View', items:()=>[
          {label:'&Standard', chk:()=>!sci, f:(w)=>{ sci=false; build(w); }},
          {label:'S&cientific', chk:()=>sci, f:(w)=>{ sci=true; build(w); }}
        ]},
        {label:'&Help', items:()=>[
          {label:'&Contents', f:()=>HelpEngine.openFor('progman')},
          {sep:true},
          {label:'&About Calculator...', f:(w)=>Eggs.about(w,'Calculator')}
        ]}
      ],
      onKey(e){
        if(/^[0-9.]$/.test(e.key)){ press(e.key); return true; }
        if(['+','-','*','/'].includes(e.key)){ op(e.key); return true; }
        if(e.key==='Enter'||e.key==='='){ eq(); return true; }
        if(e.key==='Escape'){ clearAll(); return true; }
        if(e.key==='Backspace'){ cur=cur.length>1?cur.slice(0,-1):'0'; paint(); return true; }
        return false;
      }
    });
    let cur='0', acc=null, pend=null, fresh=true, mem=0;
    const pane=U.el('div','calc-pane');
    win.body.appendChild(pane);
    const disp=U.el('div','calc-disp','0');
    const grid=U.el('div','calc-grid');
    pane.appendChild(disp); pane.appendChild(grid);
    const paint=()=>{ disp.textContent=cur.length>18?parseFloat(cur).toExponential(10):cur; };
    const press=(d)=>{
      if(fresh){ cur=(d==='.')?'0.':d; fresh=false; }
      else { if(d==='.'&&cur.includes('.'))return; cur=(cur==='0'&&d!=='.')?d:cur+d; }
      paint();
    };
    const apply=()=>{
      const b=parseFloat(cur);
      if(acc===null){ acc=b; return; }
      switch(pend){
        case '+': acc+=b; break; case '-': acc-=b; break;
        case '*': acc*=b; break;
        case '/': if(b===0){ cur='Cannot divide by zero'; disp.textContent=cur; acc=null; pend=null; fresh=true; cur='0'; return; } acc/=b; break;
        case '^': acc=Math.pow(acc,b); break;
      }
      cur=String(+acc.toPrecision(12));
    };
    const op=(o)=>{ if(!fresh||acc===null){ apply(); } pend=o; fresh=true; paint(); };
    const eq=()=>{ if(pend){ apply(); pend=null; fresh=true; paint(); } };
    const clearAll=()=>{ cur='0'; acc=null; pend=null; fresh=true; paint(); };
    const un=(f)=>{ cur=String(+f(parseFloat(cur)).toPrecision(12)); fresh=true; paint(); };
    const build=(w)=>{
      grid.innerHTML='';
      const B=(label,cls,f)=>{ const b=U.el('span','btn calc-btn '+(cls||''),label); b.addEventListener('click',f); grid.appendChild(b); return b; };
      if(!sci){
        w.setSize(230,236);
        grid.style.gridTemplateColumns='repeat(5,1fr)';
        B('C','red',clearAll); B('CE','red',()=>{cur='0';fresh=true;paint();}); B('Back','red',()=>{cur=cur.length>1?cur.slice(0,-1):'0';paint();});
        B('MC','red',()=>mem=0); B('MR','red',()=>{cur=String(mem);fresh=true;paint();});
        B('7','blue',()=>press('7')); B('8','blue',()=>press('8')); B('9','blue',()=>press('9')); B('/','red',()=>op('/')); B('M+','red',()=>mem+=parseFloat(cur));
        B('4','blue',()=>press('4')); B('5','blue',()=>press('5')); B('6','blue',()=>press('6')); B('*','red',()=>op('*')); B('MS','red',()=>mem=parseFloat(cur));
        B('1','blue',()=>press('1')); B('2','blue',()=>press('2')); B('3','blue',()=>press('3')); B('-','red',()=>op('-')); B('1/x','blue',()=>un(v=>1/v));
        B('0','blue',()=>press('0')); B('+/-','blue',()=>un(v=>-v)); B('.','blue',()=>press('.')); B('+','red',()=>op('+')); B('=','red',eq);
        B('sqrt','blue',()=>un(Math.sqrt)); B('%','blue',()=>un(v=>v/100));
      } else {
        w.setSize(330,270);
        grid.style.gridTemplateColumns='repeat(6,1fr)';
        B('C','red',clearAll); B('CE','red',()=>{cur='0';fresh=true;paint();}); B('Back','red',()=>{cur=cur.length>1?cur.slice(0,-1):'0';paint();});
        B('sin','blue',()=>un(Math.sin)); B('cos','blue',()=>un(Math.cos)); B('tan','blue',()=>un(Math.tan));
        B('7','blue',()=>press('7')); B('8','blue',()=>press('8')); B('9','blue',()=>press('9')); B('/','red',()=>op('/'));
        B('ln','blue',()=>un(Math.log)); B('log','blue',()=>un(v=>Math.log10(v)));
        B('4','blue',()=>press('4')); B('5','blue',()=>press('5')); B('6','blue',()=>press('6')); B('*','red',()=>op('*'));
        B('x^y','blue',()=>op('^')); B('x^2','blue',()=>un(v=>v*v));
        B('1','blue',()=>press('1')); B('2','blue',()=>press('2')); B('3','blue',()=>press('3')); B('-','red',()=>op('-'));
        B('n!','blue',()=>un(v=>{let r=1;for(let i=2;i<=Math.min(170,Math.floor(v));i++)r*=i;return r;})); B('pi','blue',()=>{cur=String(Math.PI);fresh=true;paint();});
        B('0','blue',()=>press('0')); B('+/-','blue',()=>un(v=>-v)); B('.','blue',()=>press('.')); B('+','red',()=>op('+'));
        B('sqrt','blue',()=>un(Math.sqrt)); B('=','red',eq);
      }
    };
    build(win);
    return win;
  }
};

Apps.add('CLOCK',{name:'Clock', icon:'clock', launch(){
  let mode=S.get('clockMode','analog'), secs=true, dateOn=false;
  const win=WM.create({
    title:'Clock', icon:'clock', w:200, h:200, minW:120, minH:120,
    menus:[
      {label:'&Settings', items:()=>[
        {label:'&Analog', chk:()=>mode==='analog', f:()=>{mode='analog';S.set('clockMode',mode);}},
        {label:'&Digital', chk:()=>mode==='digital', f:()=>{mode='digital';S.set('clockMode',mode);}},
        {sep:true},
        {label:'&Seconds', chk:()=>secs, f:()=>secs=!secs},
        {label:'Da&te', chk:()=>dateOn, f:()=>dateOn=!dateOn},
        {sep:true},
        {label:'A&bout Clock...', f:(w)=>Eggs.about(w,'Clock')}
      ]}
    ],
    onClosed(){ clearInterval(t); }
  });
  const wrap=U.el('div','clock-body');
  const cv=U.el('canvas');
  wrap.appendChild(cv);
  win.body.appendChild(wrap);
  const draw=()=>{
    const W=wrap.clientWidth, H=wrap.clientHeight;
    if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
    const x=cv.getContext('2d');
    x.fillStyle='#c0c0c0'; x.fillRect(0,0,W,H);
    const now=new Date();
    if(mode==='digital'){
      x.fillStyle='#000';
      x.font='bold '+Math.max(14,Math.floor(W/8))+'px "Lucida Console",monospace';
      x.textAlign='center'; x.textBaseline='middle';
      let s=now.toLocaleTimeString([], secs?{}:{hour:'2-digit',minute:'2-digit'});
      x.fillText(s, W/2, H/2);
      if(dateOn){ x.font=Math.max(10,Math.floor(W/14))+'px sans-serif'; x.fillText(now.toLocaleDateString(), W/2, H/2+Math.floor(W/7)); }
      return;
    }
    const cx=W/2, cy=H/2, r=Math.min(W,H)/2-8;
    x.strokeStyle='#000'; x.fillStyle='#000';
    for(let i=0;i<12;i++){
      const a=i*Math.PI/6;
      const x1=cx+Math.sin(a)*(r-4), y1=cy-Math.cos(a)*(r-4);
      x.beginPath(); x.arc(x1,y1,i%3===0?2.5:1.2,0,7); x.fill();
    }
    const hand=(frac,len,wd,color)=>{
      const a=frac*2*Math.PI;
      x.strokeStyle=color; x.lineWidth=wd;
      x.beginPath(); x.moveTo(cx,cy);
      x.lineTo(cx+Math.sin(a)*len, cy-Math.cos(a)*len); x.stroke();
    };
    const h=now.getHours()%12, m=now.getMinutes(), s2=now.getSeconds();
    hand((h+m/60)/12, r*0.5, 3, '#000080');
    hand((m+s2/60)/60, r*0.75, 2, '#000080');
    if(secs) hand(s2/60, r*0.8, 1, '#800000');
    if(dateOn){ x.fillStyle='#000'; x.font='10px sans-serif'; x.textAlign='center'; x.fillText(now.toLocaleDateString(), cx, cy+r*0.45); }
  };
  const t=setInterval(draw, 500);
  win.o.onResize=draw;
  setTimeout(draw,0);
  return win;
}});

const PBrush = {
  open(path){
    const COLORS=['#000000','#808080','#800000','#808000','#008000','#008080','#000080','#800080',
      '#ffffff','#c0c0c0','#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff','#804000','#ffe0c0'];
    let tool='brush', fg='#000000', bg='#ffffff', width=2, drawing=false, sx=0, sy=0, snap=null;
    const name=()=>path?path.split('\\').pop():'(Untitled)';
    const win=WM.create({
      title:'Paintbrush - '+name(), icon:'pbrush', appKey:'PBRUSH',
      w:520, h:380, minW:340, minH:240,
      menus:[
        {label:'&File', items:()=>[
          {label:'&New', f:(w)=>{ path=null; ctx().fillStyle='#fff'; ctx().fillRect(0,0,cv.width,cv.height); w.setTitle('Paintbrush - (Untitled)'); }},
          {label:'&Open...', f:(w)=>FileDlg.show(w,{ext:['BMP'],title:'Open'},p=>{
            const r=VFS.resolve(p);
            if(r&&r.node.bmp){ const img=new Image(); img.onload=()=>{ ctx().fillStyle='#fff'; ctx().fillRect(0,0,cv.width,cv.height); ctx().drawImage(img,0,0); }; img.src=r.node.bmp; }
            else { ctx().fillStyle='#fff'; ctx().fillRect(0,0,cv.width,cv.height); PBrush.stockPattern(ctx(),cv,p); }
            path=p; w.setTitle('Paintbrush - '+name());
          })},
          {label:'&Save', f:(w)=>PBrush.save(w,cv,path,p=>{path=p;w.setTitle('Paintbrush - '+name());})},
          {label:'Save &As...', f:(w)=>PBrush.saveAs(w,cv,p=>{path=p;w.setTitle('Paintbrush - '+name());})},
          {sep:true},
          {label:'&Print...', f:()=>Print.enqueue(name(), 40000)},
          {sep:true},
          {label:'E&xit', f:(w)=>w.close()}
        ]},
        {label:'&Edit', items:()=>[
          {label:'&Undo', k:'Ctrl+Z', noAccel:true, f:()=>{ if(snap){ ctx().putImageData(snap,0,0); } }},
          {label:'&Copy', f:()=>Clip.put('[Paintbrush picture]')},
          {label:'&Paste', f:(w)=>Dlg.msg(w,{title:'Paintbrush',icon:'info',text:'The Clipboard contains: "'+Clip.get().slice(0,40)+'"\nPaintbrush politely declines to paint text.'})}
        ]},
        {label:'&View', items:()=>[
          {label:'&Zoom In', f:(w)=>Dlg.msg(w,{title:'Paintbrush',icon:'info',text:'Every pixel here is already two pixels.\nThat is quite enough zoom.'})},
          {label:'View &Picture', f:()=>{}}
        ]},
        {label:'&Options', items:()=>[
          {label:'&Image Attributes...', f:(w)=>Dlg.msg(w,{title:'Image Attributes',icon:'info',text:'Width: '+cv.width+' pels\nHeight: '+cv.height+' pels\nColors: 16 (in spirit)'})},
          {label:'&Brush Shapes...', f:()=>{}},
          {label:'&Edit Colors...', f:()=>{}}
        ]},
        {label:'&Help', items:()=>[
          {label:'&Contents', f:()=>HelpEngine.openFor('progman')},
          {sep:true},
          {label:'&About Paintbrush...', f:(w)=>Eggs.about(w,'Paintbrush')}
        ]}
      ]
    });
    const wrap=U.el('div','pb-wrap');
    const main=U.el('div','pb-main');
    const tools=U.el('div','pb-tools');
    const TOOLS=[['scissors','✂'],['spray','░'],['text','A'],['eraser','▭'],['roller','▮'],['brush','●'],
      ['line','∕'],['rect','□'],['frect','■'],['ellipse','○'],['fellipse','●'],['rrect','▢']];
    TOOLS.forEach(([t,glyph])=>{
      const b=U.el('div','pb-tool'+(t===tool?' sel':''),glyph);
      b.title=t;
      b.addEventListener('click',()=>{ tool=t; [...tools.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); });
      tools.appendChild(b);
    });
    const cwrap=U.el('div','pb-canvas-wrap');
    const cv=U.el('canvas','pb-canvas');
    cv.width=560; cv.height=380;
    cwrap.appendChild(cv);
    main.appendChild(tools); main.appendChild(cwrap);
    const pal=U.el('div','pb-pal');
    const cur=U.el('div','pb-cur','<div class="fg"></div><div class="bg"></div>');
    pal.appendChild(cur);
    const paintCur=()=>{ cur.querySelector('.fg').style.background=fg; cur.querySelector('.bg').style.background=bg; };
    COLORS.forEach(c=>{
      const sw=U.el('div','pb-sw'); sw.style.background=c;
      sw.addEventListener('mousedown',(e)=>{ e.preventDefault(); if(e.shiftKey){bg=c;}else{fg=c;} paintCur(); });
      sw.addEventListener('dblclick',()=>{ bg=c; paintCur(); });
      pal.appendChild(sw);
    });
    const widths=U.el('div','pb-widths');
    [1,2,4,8].forEach(w2=>{
      const d=U.el('div'); d.style.cssText='width:26px;height:'+Math.max(2,w2)+'px;background:#000;cursor:default;'+(w2===width?'outline:1px dotted #000;outline-offset:2px;':'');
      d.addEventListener('click',()=>{ width=w2; [...widths.children].forEach(x=>x.style.outline='none'); d.style.outline='1px dotted #000'; d.style.outlineOffset='2px'; });
      widths.appendChild(d);
    });
    pal.appendChild(widths);
    paintCur();
    wrap.appendChild(main); wrap.appendChild(pal);
    win.body.appendChild(wrap);
    const ctx=()=>cv.getContext('2d');
    const x0=ctx();
    x0.fillStyle='#fff'; x0.fillRect(0,0,cv.width,cv.height);
    if(path){ const r=VFS.resolve(path);
      if(r&&r.node.bmp){ const img=new Image(); img.onload=()=>x0.drawImage(img,0,0); img.src=r.node.bmp; }
      else PBrush.stockPattern(x0,cv,path); }
    const pos=(e)=>{
      const r=cv.getBoundingClientRect();
      return {x:(e.clientX-r.left)/Stage.scale/(r.width/Stage.scale/cv.width), y:(e.clientY-r.top)/Stage.scale/(r.height/Stage.scale/cv.height)};
    };
    cv.addEventListener('mousedown',(e)=>{
      e.preventDefault();
      const p=pos(e);
      drawing=true; sx=p.x; sy=p.y;
      snap=x0.getImageData(0,0,cv.width,cv.height);
      if(tool==='roller'){ PBrush.flood(x0,cv,Math.floor(p.x),Math.floor(p.y),fg); drawing=false; }
      if(tool==='text'){
        drawing=false;
        Dlg.custom({title:'Text', w:280, h:110, owner:win, build(pad,dw){
          const f=Dlg.field('Text:',''); f.input.style.width='150px'; pad.appendChild(f);
          const row=U.el('div'); row.style.cssText='position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;';
          row.appendChild(Dlg.btn('OK',{def:true,f:()=>{ x0.fillStyle=fg; x0.font='16px sans-serif'; x0.fillText(f.input.value,p.x,p.y); dw.close(); }}));
          row.appendChild(Dlg.btn('Cancel',{f:()=>dw.close()}));
          pad.appendChild(row); pad.style.position='relative'; pad.style.paddingRight='96px';
          setTimeout(()=>f.input.focus(),0);
        }});
      }
      if(tool==='brush'||tool==='eraser'||tool==='spray'){ dot(p, e); }
    });
    const dot=(p,e)=>{
      x0.fillStyle=(tool==='eraser')?bg:fg;
      if(tool==='spray'){
        for(let i=0;i<12;i++){
          const a=Math.random()*7, d=Math.random()*10;
          x0.fillRect(p.x+Math.cos(a)*d, p.y+Math.sin(a)*d, 1,1);
        }
      } else {
        const w2=tool==='eraser'?width*4:width;
        x0.fillRect(p.x-w2/2,p.y-w2/2,w2,w2);
      }
    };
    document.addEventListener('mousemove',(e)=>{
      if(!drawing)return;
      const p=pos(e);
      if(tool==='brush'||tool==='eraser'||tool==='spray'){
        // interpolate
        const steps=Math.max(1,Math.floor(Math.hypot(p.x-sx,p.y-sy)/2));
        for(let i=0;i<=steps;i++) dot({x:sx+(p.x-sx)*i/steps, y:sy+(p.y-sy)*i/steps},e);
        sx=p.x; sy=p.y;
      } else if(['line','rect','frect','ellipse','fellipse','rrect','scissors'].includes(tool)){
        x0.putImageData(snap,0,0);
        shape(p);
      }
    });
    const shape=(p)=>{
      x0.strokeStyle=fg; x0.fillStyle=fg; x0.lineWidth=width;
      const x=Math.min(sx,p.x), y=Math.min(sy,p.y), w2=Math.abs(p.x-sx), h2=Math.abs(p.y-sy);
      x0.beginPath();
      if(tool==='line'){ x0.moveTo(sx,sy); x0.lineTo(p.x,p.y); x0.stroke(); }
      else if(tool==='rect'){ x0.strokeRect(x,y,w2,h2); }
      else if(tool==='frect'){ x0.fillRect(x,y,w2,h2); }
      else if(tool==='rrect'){ x0.strokeRect(x,y,w2,h2); }
      else if(tool==='ellipse'||tool==='fellipse'){
        x0.ellipse(x+w2/2,y+h2/2,w2/2,h2/2,0,0,7);
        tool==='fellipse'?x0.fill():x0.stroke();
      }
      else if(tool==='scissors'){ x0.setLineDash([4,3]); x0.strokeRect(x,y,w2,h2); x0.setLineDash([]); }
    };
    document.addEventListener('mouseup',()=>{ drawing=false; });
    win.pbCanvas=cv;
    return win;
  },
  flood(x0,cv,px,py,color){
    const img=x0.getImageData(0,0,cv.width,cv.height);
    const d=img.data, W=cv.width, H=cv.height;
    const at=(x,y)=>{ const i=(y*W+x)*4; return d[i]+'|'+d[i+1]+'|'+d[i+2]; };
    const target=at(px,py);
    const c=document.createElement('canvas').getContext('2d');
    c.fillStyle=color; c.fillRect(0,0,1,1);
    const cd=c.getImageData(0,0,1,1).data;
    if(target===cd[0]+'|'+cd[1]+'|'+cd[2])return;
    const stack=[[px,py]];
    let guard=0;
    while(stack.length && guard++<400000){
      const [x,y]=stack.pop();
      if(x<0||y<0||x>=W||y>=H)continue;
      if(at(x,y)!==target)continue;
      const i=(y*W+x)*4;
      d[i]=cd[0];d[i+1]=cd[1];d[i+2]=cd[2];d[i+3]=255;
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    x0.putImageData(img,0,0);
  },
  stockPattern(x0,cv,path){
    // stock BMPs get a generated placeholder pattern
    const n=(path||'').split('\\').pop();
    x0.fillStyle='#fff'; x0.fillRect(0,0,cv.width,cv.height);
    let h=0; for(const ch of n) h=(h*31+ch.charCodeAt(0))&0xffff;
    const cols=['#800000','#008000','#000080','#808000','#008080','#800080'];
    x0.fillStyle=cols[h%cols.length];
    for(let y=0;y<cv.height;y+=16)for(let x=0;x<cv.width;x+=16)
      if(((x+y)/16 + (h%3))%2<1) x0.fillRect(x,y,8,8);
    x0.fillStyle='#000'; x0.font='12px sans-serif';
    x0.fillText(n+' (stock pattern, drawn on demand)', 10, cv.height-10);
  },
  save(w,cv,path,cb){
    if(!path){ PBrush.saveAs(w,cv,cb); return; }
    VFS.writeFile(path,'',{bmp:cv.toDataURL('image/png')});
    const r=VFS.resolve(path); if(r)r.node.s=U.rnd(30000,64000);
    cb(path);
  },
  saveAs(w,cv,cb){
    FileDlg.show(w,{ext:['BMP'],title:'Save As',save:true,fname:'UNTITLED.BMP'},(p)=>{
      VFS.writeFile(p,'',{bmp:cv.toDataURL('image/png')});
      const r=VFS.resolve(p); if(r)r.node.s=U.rnd(30000,64000);
      cb(p);
    });
  }
};

        {label:'&Communications...', f:(w)=>Dlg.msg(w,{title:'Communications',icon:'info',text:'Baud Rate: 2400\nData Bits: 8   Stop Bits: 1\nParity: None   Flow Control: Xon/Xoff\nConnector: COM2'})},
        {label:'Terminal &Emulation...', f:(w)=>Dlg.msg(w,{title:'Terminal Emulation',icon:'info',text:'DEC VT-100 (ANSI)'})}
      ]},
      {label:'&Phone', items:()=>[
        {label:'&Dial', f:()=>dial()},
        {label:'&Hangup', f:()=>hangup()}
      ]},
      {label:'&Help', items:()=>[{label:'&About Terminal...', f:(w)=>Eggs.about(w,'Terminal')}]}
    ],
    onKey(e){
      if(e.key.length===1 && !e.ctrlKey && !e.altKey){ typeCh(e.key); return true; }
      if(e.key==='Enter'){ lineIn(); return true; }
      if(e.key==='Backspace'){ if(inbuf){ inbuf=inbuf.slice(0,-1); body.textContent=body.textContent.slice(0,-1);} return true; }
      return false;
    }
  });
  const body=U.el('div','term-body');
  win.body.appendChild(body);
  let connected=false, inbuf='';
  const out=(t)=>{ body.textContent+=t; body.scrollTop=body.scrollHeight; };
  const typeCh=(c)=>{ inbuf+=c; out(c); };
  out('Terminal ready. Type AT commands, or choose Phone > Dial.\n\n');
  const dial=()=>{
    if(connected)return;
    out('ATDT5552283\n');
    Snd.play('modem');
    let i=0;
    const steps=['DIALING...','RINGING...','CARRIER 2400','CONNECT 2400\n'];
    const t=setInterval(()=>{
      out(steps[i]+'\n');
      if(++i>=steps.length){
        clearInterval(t);
        connected=true;
        setTimeout(()=>out(
'\n░▒▓ THE RUSTY DISKETTE BBS ▓▒░\n   2400 baud * Est. 1991 * Node 1 of 1\n\n   Welcome, traveler of the wires!\n\n   [M]essage bases   [F]ile areas\n   [D]oor games      [G]oodbye\n\n   Your choice? '),400);
      }
    },700);
  };
  const hangup=()=>{ if(connected){ out('\n+++\nATH0\nNO CARRIER\n'); connected=false; } else out('ATH0\nOK\n'); };
  const lineIn=()=>{
    const cmd=inbuf.trim().toUpperCase(); inbuf='';
    out('\n');
    if(!connected){
      if(cmd.startsWith('ATDT')||cmd==='ATD'){ dial(); }
      else if(cmd.startsWith('AT')) out('OK\n');
      else if(cmd) out('ERROR\n');
      return;
    }
    if(cmd==='M') out('\n-- MESSAGE BASES --\n 1. General Chatter (2,314 msgs)\n 2. Windows 3.11 Tips (askew but earnest)\n 3. For Sale: 486 parts\n\nYour choice? ');
    else if(cmd==='F') out('\n-- FILE AREAS --\n WOLF3D.ZIP     712K  Shareware sensation\n MAHJONG.ZIP    203K  Tile game, addictive\n SIMCGA.ZIP      44K  You do not need this\n\n(Downloads are simulated. Everything here is.)\nYour choice? ');
    else if(cmd==='D') out('\n-- DOOR GAMES --\n TradeWars-ish 2002 is down for maintenance\n since August. The SysOp is "looking into it."\n\nYour choice? ');
    else if(cmd==='G'){ out('\nThanks for calling THE RUSTY DISKETTE!\nNO CARRIER\n'); connected=false; }
    else out('Your choice? ');
  };
  return win;
}});

}});
