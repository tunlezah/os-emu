  }
  exec(c, v){ this.edit.focus(); document.execCommand(c, false, v); this.flush(); State.dirty(); }
  command(cmd){
    switch (cmd){
      case 'undo': this.exec('undo'); return true;
      case 'bold': this.exec('bold'); return true;
      case 'italic': this.exec('italic'); return true;
      case 'underline': this.exec('underline'); return true;
      case 'plain': this.exec('removeFormat'); return true;
      case 'sizeS': this.exec('fontSize', 2); return true;
      case 'sizeM': this.exec('fontSize', 3); return true;
      case 'sizeL': this.exec('fontSize', 5); return true;
      case 'alignL': this.exec('justifyLeft'); return true;
      case 'alignC': this.exec('justifyCenter'); return true;
      case 'alignR': this.exec('justifyRight'); return true;
      case 'alignJ': this.exec('justifyFull'); return true;
      case 'selectAll': this.selectAll(); return true;
      case 'clear': this.exec('delete'); return true;
      case 'cut': case 'copy': {
        if (!this.canCopy()) return true;
        const s = document.getSelection();
        const div = document.createElement('div');
        for (let i = 0; i < s.rangeCount; i++) div.appendChild(s.getRangeAt(i).cloneContents());
        Clip.set({ type: 'text', text: div.textContent, html: div.innerHTML, from: '“' + this.item.name + '” (LisaWrite)' });
        if (cmd === 'cut') this.exec('delete');
        return true;
      }
      case 'paste': {
        const c = Clip.c; if (!c) return true;
        this.edit.focus();
        if (c.type === 'text') this.exec('insertHTML', c.html || esc(c.text));
        else if (c.type === 'table') this.exec('insertHTML', tableHTML(c.rows));
        else if (c.type === 'picture') this.exec('insertHTML', '<div>' + c.svg + '</div><br>');
        this.layoutBreaks();
        return true;
      }
      case 'spell': this.spell(); return true;
      default: return false;
    }
  }
  spell(){
    const text = this.edit.textContent.toLowerCase();
    const typos = { 'teh': 'the', 'adn': 'and', 'recieve': 'receive', 'seperate': 'separate', 'wierd': 'weird' };
    const found = Object.keys(typos).filter(t => new RegExp('\\b' + t + '\\b').test(text));
    if (found.length){
      Dialogs.alert('LisaWrite has read the document carefully and would like to mention ' +
        (found.length === 1 ? 'one word' : found.length + ' words') + ' it does not recognize: ' +
        found.map(f => '“' + f + '” (perhaps “' + typos[f] + '”?)').join(', ') + '. No changes have been made — the document is yours.');
    } else {
      Dialogs.alert('LisaWrite has read the document from beginning to end and found no words it does not recognize. It offers its compliments on the typing.');
    }
  }
  menus(){
    return [
      { title: 'Search', items: [
        { label: 'Find…', cmd: 'find', key: 'F' },
        { sep: true },
        { label: 'Check Spelling…', cmd: 'spell' }
      ]},
      { title: 'Type Style', items: [
        { label: 'Plain Text', cmd: 'plain' },
        { label: 'Bold', cmd: 'bold', key: 'B' },
        { label: 'Italic', cmd: 'italic', key: 'I' },
        { label: 'Underline', cmd: 'underline', key: 'U' },
        { sep: true },
        { label: 'Small (10 point)', cmd: 'sizeS' },
        { label: 'Medium (12 point)', cmd: 'sizeM' },
        { label: 'Large (18 point)', cmd: 'sizeL' }
      ]},
      { title: 'Format', items: [
        { label: 'Flush Left', cmd: 'alignL' },
        { label: 'Centered', cmd: 'alignC' },
        { label: 'Flush Right', cmd: 'alignR' },
        { label: 'Justified', cmd: 'alignJ' }
      ]}
    ];
  }
  key(){ return false; }
  find(){
    const self = this;
    Dialogs.prompt('What should LisaWrite look for? It will select the first place the words appear.', { label: 'Find:' }).then(q => {
      if (!q) return;
      const idx = self.edit.textContent.toLowerCase().indexOf(q.toLowerCase());
      if (idx < 0){ Dialogs.alert('LisaWrite searched the whole document and did not find “' + esc(q) + '”. Perhaps it is spelled differently.'); return; }
      self.setCaret(idx, idx + q.length);
    });
  }
  /* caret helpers — so Soft Power can put the cursor back */
  textOffset(){
    const s = document.getSelection();
    if (!s || !s.anchorNode || !this.edit.contains(s.anchorNode)) return null;
    try {
      const r = s.getRangeAt(0);
      const pre = r.cloneRange();
      pre.selectNodeContents(this.edit);
      pre.setEnd(r.startContainer, r.startOffset);
      return pre.toString().length;
    } catch (e) { return null; }
  }
  setCaret(start, end){
    const walker = document.createTreeWalker(this.edit, NodeFilter.SHOW_TEXT);
    let pos = 0, sN = null, sO = 0, eN = null, eO = 0, node;
    end = end === undefined ? start : end;
    while ((node = walker.nextNode())){
      const len = node.textContent.length;
      if (!sN && pos + len >= start){ sN = node; sO = start - pos; }
      if (pos + len >= end){ eN = node; eO = end - pos; break; }
      pos += len;
    }
    if (sN){
      const r = document.createRange();
      r.setStart(sN, clamp(sO, 0, sN.textContent.length));
      r.setEnd(eN || sN, clamp(eO, 0, (eN || sN).textContent.length));
      const s = document.getSelection(); s.removeAllRanges(); s.addRange(r);
      this.edit.focus();
    }
  }
  getView(){ return { caret: this.textOffset() }; }
  setView(v){ if (v && v.caret != null) setTimeout(() => this.setCaret(v.caret), 80); }
});
// route the Find command
const _wrRun = Commands.run.bind(Commands);
Commands.run = function(cmd, arg){
  if (cmd === 'find' && Wins.active && Wins.active.tool && Wins.active.tool.find){ Wins.active.tool.find(); return; }
  _wrRun(cmd, arg);
};

/* ============================================================
   LisaCalc — the spreadsheet
   ============================================================ */
const CALC_COLS = 'ABCDEFGHIJKLMNOPQRST'.split('');
const CALC_ROWS = 40;
function refOf(col, row){ return CALC_COLS[col] + (row + 1); }
function parseRef(ref){
  const m = /^([A-T])([0-9]+)$/.exec(ref);
  return m ? { c: CALC_COLS.indexOf(m[1]), r: +m[2] - 1 } : null;
}
Tools.register('calc', {
  name: 'LisaCalc',
  rect: { x: 90, y: 36, w: 520, h: 300 },
  hasH: true,
  blank(){ return { cells: {}, fmt: {} }; }
}, class LisaCalc {
  constructor(item, win){
    this.item = item; this.win = win;
    this.sel = 'A1'; this.selEnd = null;
    const wrap = el(win.innerEl, 'div', 'lc-wrap');
    const entry = el(wrap, 'div', 'lc-entry');
    this.refEl = el(entry, 'div', 'lc-ref', 'A1');
    this.input = el(entry, 'input');
    this.scroll = el(wrap, 'div', 'lc-scroll');
    win.scrollEl = this.scroll;
    this.buildGrid();
    this.input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter'){ e.preventDefault(); this.commit(); this.move(0, 1); }
      else if (e.key === 'Tab'){ e.preventDefault(); this.commit(); this.move(1, 0); }
      else if (e.key === 'Escape'){ this.input.value = this.raw(this.sel); this.input.blur(); }
    });
    this.input.addEventListener('mousedown', e => e.stopPropagation());
    this.recalc();
    this.select('A1');
    this.scroll.addEventListener('scroll', () => win.syncScroll());
  }
  buildGrid(){
    let h = '<table class="grid" style="width:' + (26 + CALC_COLS.length * 56) + 'px"><thead><tr><th class="corner" style="width:26px"></th>';
    CALC_COLS.forEach(c => h += '<th style="width:56px">' + c + '</th>');
    h += '</tr></thead><tbody>';
    for (let r = 0; r < CALC_ROWS; r++){
      h += '<tr><th>' + (r + 1) + '</th>';
      for (let c = 0; c < CALC_COLS.length; c++) h += '<td data-ref="' + refOf(c, r) + '"></td>';
      h += '</tr>';
    }
    h += '</tbody></table>';
    this.scroll.innerHTML = h;
    this.scroll.addEventListener('mousedown', e => {
      const td = e.target.closest('td[data-ref]');
      if (!td) return;
      e.stopPropagation();
      if (e.shiftKey){ this.selEnd = td.dataset.ref; this.paint(); }
      else { this.commitIfEditing(); this.select(td.dataset.ref); }
    });
    this.scroll.addEventListener('dblclick', e => {
      const td = e.target.closest('td[data-ref]');
      if (td){ this.input.focus(); this.input.select(); }
    });
  }
  raw(ref){ return this.item.content.cells[ref] || ''; }
  commitIfEditing(){
    if (document.activeElement === this.input && this.input.value !== this.raw(this.sel)) this.commit();
  }
  commit(){
    const v = this.input.value.trim();
    const cells = this.item.content.cells;
    if (v === '') delete cells[this.sel]; else cells[this.sel] = v;
    this.recalc();
    State.dirty();
  }
  select(ref){
    this.sel = ref; this.selEnd = null;
    this.refEl.textContent = ref;
    this.input.value = this.raw(ref);
    this.paint();
    MenuBar.refresh();
  }
  move(dc, dr){
    const p = parseRef(this.sel);
    const c = clamp(p.c + dc, 0, CALC_COLS.length - 1), r = clamp(p.r + dr, 0, CALC_ROWS - 1);
    this.select(refOf(c, r));
  }
  rangeRefs(){
    if (!this.selEnd) return [[this.sel]];
    const a = parseRef(this.sel), b = parseRef(this.selEnd);
    const rows = [];
    for (let r = Math.min(a.r, b.r); r <= Math.max(a.r, b.r); r++){
      const row = [];
      for (let c = Math.min(a.c, b.c); c <= Math.max(a.c, b.c); c++) row.push(refOf(c, r));
      rows.push(row);
    }
    return rows;
  }
  paint(){
    this.scroll.querySelectorAll('.cellSel,.cellRange').forEach(x => x.classList.remove('cellSel', 'cellRange'));
    const td = this.scroll.querySelector('td[data-ref="' + this.sel + '"]');
    if (td) td.classList.add('cellSel');
    if (this.selEnd) this.rangeRefs().flat().forEach(r => {
      const t = this.scroll.querySelector('td[data-ref="' + r + '"]');
      if (t && r !== this.sel) t.classList.add('cellRange');
    });
  }
  value(ref, visiting){
    const raw = this.raw(ref);
    if (raw === '') return 0;
    if (/^-?[0-9.]+$/.test(raw)) return parseFloat(raw) || 0;
    if (raw[0] !== '=') return 0; // text counts for nothing, arithmetically
    if (visiting[ref]) { const e = new Error('circ'); e.circ = true; e.ref = ref; throw e; }
    visiting[ref] = true;
    try { return this.evalExpr(raw.slice(1), visiting); }
    finally { delete visiting[ref]; }
  }
  evalExpr(expr, visiting){
    if (!/^[A-Za-z0-9+\-*/(). ,:]*$/.test(expr)) throw new Error('bad');
    const self = this;
    let src = expr.toUpperCase()
      .replace(/\b(SUM|AVERAGE|COUNT|MIN|MAX)\(([A-T][0-9]+):([A-T][0-9]+)\)/g, 'FN("$1","$2","$3")');
    // rewrite bare cell references, leaving the quoted ones alone
    src = src.split('"').map((seg, i) => i % 2 ? seg : seg.replace(/\b([A-T][0-9]+)\b/g, 'V("$1")')).join('"');
    if (/[A-Z]/.test(src.replace(/"[^"]*"/g, '').replace(/FN|V/g, ''))) throw new Error('bad');
    const V = r => self.value(r, visiting);
    const FN = (fn, a, b) => {
      const pa = parseRef(a), pb = parseRef(b);
      const vals = [];
      for (let r = Math.min(pa.r, pb.r); r <= Math.max(pa.r, pb.r); r++)
        for (let c = Math.min(pa.c, pb.c); c <= Math.max(pa.c, pb.c); c++)
          vals.push(self.value(refOf(c, r), visiting));
      if (fn === 'SUM') return vals.reduce((s, v) => s + v, 0);
      if (fn === 'AVERAGE') return vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : 0;
      if (fn === 'COUNT') return vals.length;
      if (fn === 'MIN') return Math.min.apply(null, vals);
      return Math.max.apply(null, vals);
    };
    const out = new Function('V', 'FN', 'return (' + src + ');')(V, FN);
    if (typeof out !== 'number' || !isFinite(out)) throw new Error('bad');
    return out;
  }
  display(ref){
    const raw = this.raw(ref);
    if (raw === '') return { text: '', num: false };
    if (/^-?[0-9.]+$/.test(raw)) return { text: this.fmtNum(ref, parseFloat(raw)), num: true };
    if (raw[0] === '='){
      try { return { text: this.fmtNum(ref, this.value(ref, {})), num: true }; }
      catch (e) { return { text: e.circ ? 'CIRCULAR' : '???', num: false, err: true, circ: e.circ }; }
    }
    return { text: raw, num: false };
  }
  fmtNum(ref, v){
    const f = (this.item.content.fmt || {})[ref];
    const round2 = x => (Math.round(x * 100) / 100).toFixed(2);
    if (f === '$') return '$' + Number(round2(v)).toLocaleString('en-US', { minimumFractionDigits: 2 });
    if (f === '%') return round2(v * 100) + '%';
    return String(Math.round(v * 10000) / 10000);
  }
  recalc(){
    let circWarned = false;
    for (let r = 0; r < CALC_ROWS; r++) for (let c = 0; c < CALC_COLS.length; c++){
      const ref = refOf(c, r);
      const td = this.scroll.querySelector('td[data-ref="' + ref + '"]');
      if (!td) continue;
      const d = this.display(ref);
      td.textContent = d.text;
      td.classList.toggle('num', !!d.num);
      if (d.circ && !circWarned && !this._circShown){
        circWarned = true; this._circShown = true;
        Dialogs.alert('The formula in cell ' + ref + ' refers, by way of other cells, back to its own cell. LisaCalc went around the circle once, grew dizzy, and stopped. Perhaps one of the cells could refer somewhere else.');
        setTimeout(() => { this._circShown = false; }, 100);
      }
    }
    this.win.syncScroll();
  }
  flush(){ /* cells are edited in place */ }
  refresh(){ this.recalc(); this.select(this.sel); }
  canUndo(){ return false; }
  canCopy(){ return true; }
  canPaste(c){ return !!c && (c.type === 'table' || c.type === 'text'); }
  selectAll(){ this.selEnd = refOf(CALC_COLS.length - 1, CALC_ROWS - 1); const s = this.sel; this.sel = 'A1'; this.paint(); this.sel = s; }
  command(cmd){
    switch (cmd){
      case 'copy': case 'cut': {
        const rows = this.rangeRefs().map(row => row.map(ref => this.display(ref).text));
        Clip.set({ type: 'table', rows, from: '“' + this.item.name + '” (LisaCalc)' });
        if (cmd === 'cut'){ this.rangeRefs().flat().forEach(ref => delete this.item.content.cells[ref]); this.recalc(); State.dirty(); }
        return true;
      }
      case 'paste': {
        const c = Clip.c; if (!c) return true;
        const p = parseRef(this.sel);
        const rows = c.type === 'table' ? c.rows : String(c.text || '').split('\n').map(l => [l]);
        rows.forEach((row, dr) => row.forEach((v, dc) => {
          if (p.r + dr < CALC_ROWS && p.c + dc < CALC_COLS.length){
            const ref = refOf(p.c + dc, p.r + dr);
            const s = String(v).replace(/[$,]/g, '');
            this.item.content.cells[ref] = s;
          }
        }));
        this.recalc(); State.dirty();
        return true;
      }
      case 'clear': this.rangeRefs().flat().forEach(ref => delete this.item.content.cells[ref]); this.recalc(); State.dirty(); return true;
      case 'selectAll': this.selectAll(); return true;
      case 'fmtPlain': case 'fmtDollar': case 'fmtPct': {
        const f = cmd === 'fmtDollar' ? '$' : cmd === 'fmtPct' ? '%' : null;
        const fmt = this.item.content.fmt = this.item.content.fmt || {};
        this.rangeRefs().flat().forEach(ref => { if (f) fmt[ref] = f; else delete fmt[ref]; });
        this.recalc(); State.dirty();
        return true;
      }
      default: return false;
    }
  }
  menus(){
    return [
      { title: 'Calculate', items: [
        { label: 'Calculate Now', cmd: 'recalcNow' },
        { sep: true },
        { label: 'About Formulas…', cmd: 'calcHelp' }
      ]},
      { title: 'Format', items: [
        { label: 'Plain Numbers', cmd: 'fmtPlain' },
        { label: 'Dollars and Cents', cmd: 'fmtDollar' },
        { label: 'Percent', cmd: 'fmtPct' }
      ]}
    ];
  }
  key(e){
    if (document.activeElement === this.input) return true;
    if (e.key.startsWith('Arrow')){
      this.commitIfEditing();
      if (e.key === 'ArrowUp') this.move(0, -1);
      if (e.key === 'ArrowDown') this.move(0, 1);
      if (e.key === 'ArrowLeft') this.move(-1, 0);
      if (e.key === 'ArrowRight') this.move(1, 0);
      return true;
    }
    if (e.key === 'Enter'){ this.input.focus(); return true; }
    if (e.key.length === 1 && !e.metaKey && !e.ctrlKey){
      this.input.value = e.key;
      this.input.focus();
      setTimeout(() => this.input.setSelectionRange(1, 1), 0);
      return true;
    }
    if (e.key === 'Backspace' || e.key === 'Delete'){ this.command('clear'); return true; }
    return false;
  }
  getView(){ return { sel: this.sel }; }
  setView(v){ if (v && v.sel && parseRef(v.sel)) this.select(v.sel); }
});
// two small LisaCalc commands that need Dialogs
const _calcRun = Commands.run.bind(Commands);
Commands.run = function(cmd, arg){
  const t = Wins.active && Wins.active.tool;
  if (cmd === 'recalcNow' && t && t.recalc){ t.recalc(); Dialogs.note('LisaCalc has recalculated everything.', 1000); return; }
  if (cmd === 'calcHelp'){
    Dialogs.alert('A cell may hold words, a number, or a formula. Formulas begin with an equals sign — for example, =B2*1.06 or =SUM(A1:A8). LisaCalc also understands AVERAGE, COUNT, MIN and MAX, and it recalculates the moment anything changes.');
    return;
  }
  _calcRun(cmd, arg);
};

/* ============================================================
   LisaGraph — business graphs from a little grid
   ============================================================ */
function graphSVG(rows, type, W, H){
  const data = rows.filter(r => r[0] !== '' || r[1] !== '').map(r => [String(r[0]), parseFloat(r[1]) || 0]);
  if (!data.length) return '<svg width="' + W + '" height="' + H + '"><text x="16" y="30" font-size="10">Type labels and amounts at the left, and a graph will appear here.</text></svg>';
  const padL = 34, padB = 30, padT = 14, padR = 10;
  const cw = W - padL - padR, ch = H - padT - padB;
  const max = Math.max.apply(null, data.map(d => d[1]).concat([1]));
  const min = Math.min.apply(null, data.map(d => d[1]).concat([0]));
  const span = (max - min) || 1;
  const y = v => padT + ch - ((v - min) / span) * ch;
  const pats = ['p50', 'p25', 'pd', 'ph', 'p75', 'pv', 'p12', 'pb'];
  let s = '';
  if (type === 'pie'){
    const cx = W / 2, cy = H / 2 - 4, R = Math.min(cw, ch) / 2;
    const total = data.reduce((t, d) => t + Math.max(0, d[1]), 0) || 1;
    let a = -Math.PI / 2;
    data.forEach((d, i) => {
      const frac = Math.max(0, d[1]) / total;
      const a2 = a + frac * Math.PI * 2;
      const x1 = cx + R * Math.cos(a), y1 = cy + R * Math.sin(a);
      const x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
      const large = frac > 0.5 ? 1 : 0;
      s += '<path d="M' + cx + ' ' + cy + ' L' + x1 + ' ' + y1 + ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 + ' Z" fill="' + patFill(pats[i % pats.length]) + '" stroke="#000"/>';
      const mid = (a + a2) / 2;
      if (frac > 0.04) s += '<text x="' + (cx + (R + 11) * Math.cos(mid)) + '" y="' + (cy + (R + 11) * Math.sin(mid)) + '" font-size="8" text-anchor="middle">' + esc(d[0]) + '</text>';
      a = a2;
    });
  } else {
    // axes
    s += '<path d="M' + padL + ' ' + padT + ' V' + (padT + ch) + ' H' + (padL + cw) + '" fill="none" stroke="#000"/>';
    for (let t = 0; t <= 4; t++){
      const v = min + span * t / 4;
      const yy = y(v);
      s += '<path d="M' + (padL - 3) + ' ' + yy + ' h3" stroke="#000"/>' +
           '<text x="' + (padL - 5) + '" y="' + (yy + 3) + '" font-size="8" text-anchor="end">' + (Math.round(v * 10) / 10) + '</text>';
    }
    const n = data.length;
    const step = cw / n;
    data.forEach((d, i) => {
      const x0 = padL + i * step;
      s += '<text x="' + (x0 + step / 2) + '" y="' + (padT + ch + 11) + '" font-size="8" text-anchor="middle">' + esc(d[0].slice(0, 8)) + '</text>';
      if (type === 'bar'){
        const bw = Math.max(6, step * 0.55);
        const yy = y(d[1]);
        const base = y(Math.max(0, min));
        s += '<rect x="' + (x0 + (step - bw) / 2) + '" y="' + Math.min(yy, base) + '" width="' + bw + '" height="' + Math.max(1, Math.abs(base - yy)) + '" fill="' + patFill('p50') + '" stroke="#000"/>';
      } else if (type === 'scatter'){
        s += '<rect x="' + (x0 + step / 2 - 2.5) + '" y="' + (y(d[1]) - 2.5) + '" width="5" height="5" fill="#000"/>';
      }
    });
    if (type === 'line'){
      const ptsS = data.map((d, i) => (padL + i * step + step / 2) + ',' + y(d[1])).join(' ');
      s += '<polyline points="' + ptsS + '" fill="none" stroke="#000" stroke-width="1.4"/>';
      data.forEach((d, i) => {
        s += '<rect x="' + (padL + i * step + step / 2 - 2) + '" y="' + (y(d[1]) - 2) + '" width="4" height="4" fill="#fff" stroke="#000"/>';
      });
    }
  }
  return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' + s + '</svg>';
}

/* ============================================================
   LisaProject — schedules, critical path emphasized
   ============================================================ */
function projectCompute(tasks){
  const n = tasks.length;
  const es = new Array(n).fill(0), ef = new Array(n).fill(0);
  for (let pass = 0; pass < n + 1; pass++){
    for (let i = 0; i < n; i++){

        const j = a - 1;

      });

Tools.register('calcda', {
  name: 'the Calculator',
  rect: { x: 290, y: 50, w: 150, h: 210 },
  blank(){ return {}; }
}, class TheCalculator {
  constructor(item, win){
    this.item = item; this.win = win;
    this.acc = null; this.op = null; this.cur = '0'; this.fresh = true;
    const wrap = el(win.innerEl, 'div', 'ca-wrap');
    this.disp = el(wrap, 'div', 'ca-disp', '0');
    const keys = el(wrap, 'div', 'ca-keys');
    'C ± ÷ ×;7 8 9 −;4 5 6 +;1 2 3 =;0 .'.split(';').forEach(row => {
      row.split(' ').forEach(k => {
        const b = el(keys, 'div', 'ca-key', k);
        if (k === '0') b.style.gridColumn = 'span 2';
        if (k === '=') b.style.gridRow = 'span 2';
        b.addEventListener('mousedown', e => { e.stopPropagation(); this.press(k); });
      });
    });
  }
  show(){ this.disp.textContent = this.cur.length > 12 ? Number(this.cur).toPrecision(8) : this.cur; }
  press(k){
    Sound.click();
    if (/[0-9]/.test(k)){
      if (this.fresh){ this.cur = k; this.fresh = false; }
      else this.cur = this.cur === '0' ? k : this.cur + k;
    } else if (k === '.'){
      if (this.fresh){ this.cur = '0.'; this.fresh = false; }
      else if (this.cur.indexOf('.') < 0) this.cur += '.';
    } else if (k === 'C'){
      this.acc = null; this.op = null; this.cur = '0'; this.fresh = true;
    } else if (k === '±'){
      this.cur = this.cur.startsWith('-') ? this.cur.slice(1) : (this.cur === '0' ? '0' : '-' + this.cur);
    } else if (k === '='){
      this.apply(); this.op = null;
    } else {
      this.apply(); this.op = k; this.fresh = true;
    }
    this.show();
  }
  apply(){
    const v = parseFloat(this.cur) || 0;
    if (this.acc === null || !this.op){ this.acc = v; this.fresh = true; return; }
    let r = this.acc;
    if (this.op === '+') r += v;
    if (this.op === '−') r -= v;
    if (this.op === '×') r *= v;
    if (this.op === '÷') r = v === 0 ? 0 : r / v;
    this.acc = r; this.cur = String(Math.round(r * 1e8) / 1e8); this.fresh = true;
  }
  key(e){
    const map = { '*': '×', '/': '÷', '-': '−', '+': '+', 'Enter': '=', '=': '=', 'Escape': 'C', '.': '.' };
    if (/^[0-9]$/.test(e.key)){ this.press(e.key); return true; }
    if (map[e.key]){ this.press(map[e.key]); return true; }
    return false;
  }
  flush(){} refresh(){}
  canCopy(){ return true; } canPaste(){ return false; }
  command(cmd){
    if (cmd === 'copy'){ Clip.set({ type: 'text', text: this.disp.textContent, html: esc(this.disp.textContent), from: 'the Calculator' }); return true; }
    return false;
  }
  menus(){ return []; }
  getView(){ return {}; } setView(){}
});

      const tests = [
        { n: 'processor', g: '<svg width="30" height="26"><rect x="5" y="6" width="20" height="14" fill="#fff" stroke="#000"/><path d="M8 6V2M13 6V2M18 6V2M23 6V2M8 24v-4M13 24v-4M18 24v-4M23 24v-4" stroke="#000"/></svg>' },
        { n: 'memory', g: '<svg width="30" height="26"><rect x="3" y="4" width="10" height="8" fill="#fff" stroke="#000"/><rect x="17" y="4" width="10" height="8" fill="#fff" stroke="#000"/><rect x="3" y="15" width="10" height="8" fill="#fff" stroke="#000"/><rect x="17" y="15" width="10" height="8" fill="#fff" stroke="#000"/></svg>' },
        { n: 'i/o', g: '<svg width="30" height="26"><rect x="4" y="8" width="14" height="10" fill="#fff" stroke="#000"/><path d="M18 11h8M18 15h8" stroke="#000"/><circle cx="10" cy="13" r="2.5" fill="none" stroke="#000"/></svg>' },
        { n: 'drives', g: '<svg width="30" height="26"><rect x="3" y="7" width="24" height="12" rx="1" fill="#fff" stroke="#000"/><path d="M3 15h24" stroke="#000"/><rect x="20" y="16" width="3" height="1.5" fill="#000"/></svg>' }
      ];
      const els = tests.map(t => {
        const b = el(rowIcons, 'div', 'postIcon');
        hel(b, 'div', null, t.g);
        el(b, 'div', 'tick', '✓');
        return b;
      });
      const status = el(wrap, 'div', null, 'The Lisa is checking itself over…');
      status.style.fontSize = '10px';
      el(ov, 'div', 'postHint', 'Hold the space bar for other startup choices  ·  ESC hurries things along');
      this._env = false; this._skip = false;
      let i = 0;
      const step = () => {
        if (!this.isOn){ resolve(); return; }
        if (i < els.length){
          els[i].classList.add('ok');
          Sound.click();
          status.textContent = 'Testing the ' + tests[i].n + '… it passes.';
          i++;
          setTimeout(step, this._skip ? 40 : 460);
        } else {
          status.innerHTML = 'Starting up from&nbsp; ' + iconSVG({ kind: 'profile' }, 32, 21) + ' &nbsp;the ProFile…';
          Sound.hum(true);
          setTimeout(() => {
            if (this._env) this.environments(resolve);
            else { this.office(); resolve(); }
          }, this._skip ? 100 : 700);
        }
      };
      setTimeout(step, this._skip ? 40 : 500);
    });
  },
  environments(resolve){
    const ov = qs('#overlay');
    ov.innerHTML = '';
    const w = el(ov, 'div', 'envWin');
    hel(w, 'div', 'dtxt', '<b>Environments</b><br>The Lisa can start up in one of two worlds. Please choose, and then press Start.');
    const row = el(w, 'div', 'envChoice');
    let choice = 'office';
    const mkEnv = (id, label, glyph) => {
      const e = hel(row, 'div', 'envItem' + (id === 'office' ? ' sel' : ''), glyph + '<div style="margin-top:5px">' + label + '</div>');
      e.addEventListener('mousedown', () => {
        row.querySelectorAll('.envItem').forEach(x => x.classList.remove('sel'));
        e.classList.add('sel');
        choice = id;
      });
      e.addEventListener('dblclick', () => start());
      return e;
    };
    mkEnv('office', 'the Office System', iconSVG({ kind: 'tool', tool: 'write' }, 50, 32));
    mkEnv('workshop', 'the Workshop', '<svg width="50" height="32" viewBox="0 0 42 27"><rect x="6" y="3" width="30" height="18" fill="#fff" stroke="#000"/><path d="M10 8h14M10 12h10M10 16h6" stroke="#000"/><path d="M28 14l6 6M31 11l3 3" stroke="#000" stroke-width="2"/></svg>');
    const btns = el(w, 'div', 'dbtns');
    const off = el(btns, 'button', 'lbtn', 'Power Off');
    const startB = el(btns, 'button', 'lbtn def', 'Start');
    const start = () => {
      if (choice === 'office'){ this.office(); resolve(); }
      else this.workshop(resolve);
    };
    startB.onclick = start;
    off.onclick = () => { resolve(); this.shutdown(true); };
    this._envKey = ev => { if (ev.key === 'Enter') start(); };
  },
  workshop(resolve){
    const ov = qs('#overlay');
    ov.innerHTML = '';
    const scr = el(ov, 'div', 'wksp');
    const base = 'the Lisa Workshop — Version 3.0\n' +
      'Copyright 1983 — for people who make the Office, not use it.\n\n' +
      'FILE-MGR?  EDIT?  SYSTEM-MGR?  DEBUG?  RUN?  QUIT?\n\n> ';
    scr.textContent = base;
    let mode = 'top';
    this._wkKey = ev => {
      const k = ev.key.toUpperCase();
      if (mode === 'quit'){
        if (k === 'Y'){ this._wkKey = null; this.environments(resolve); return; }
        scr.textContent += k + '\nStaying, then. The Workshop approves of second thoughts.\n\n> ';
        mode = 'top';
        return;
      }
      if (k.length !== 1) return;
      scr.textContent += k + '\n';
      if (k === 'F') scr.textContent += 'FILE-MGR:  List? Copy? Backup? Prefix? Quit?\n  The catalog, briefly:  OFFICE.SYS   LISAWRITE.OBJ   LISACALC.OBJ\n  LISADRAW.OBJ   SHELL.WORKSHOP   PASLIB.OBJ   (and 214 more)\n\n> ';
      else if (k === 'E') scr.textContent += 'EDIT: The mouse sleeps down here; the Workshop editor is keys all the way.\n  (It sends its regards to the Office upstairs.)\n\n> ';
      else if (k === 'S') scr.textContent += 'SYSTEM-MGR:  Time? Memory? Volumes?\n  788K contiguous free. The ProFile spins contentedly at 3600 rpm.\n\n> ';
      else if (k === 'D') scr.textContent += 'DEBUG: LisaBug is awake and pretending it was not napping.\n  NMI vector polished daily.\n\n> ';
      else if (k === 'R') scr.textContent += 'RUN: Nothing to run just now — the Office System lives upstairs.\n  (Q, then Y, will take you back toward it.)\n\n> ';
      else if (k === 'Q'){ scr.textContent += 'Leave the Workshop? (Y to leave, anything else to stay) '; mode = 'quit'; }
      else scr.textContent += 'The Workshop knows F, E, S, D, R and Q. It is a simple place.\n\n> ';
      scr.scrollTop = scr.scrollHeight;
    };
  },
  office(){
    this._wkKey = null; this._envKey = null;
    const ov = qs('#overlay');
    ov.style.display = 'none';
    ov.innerHTML = '';
    Desk.renderAll();
    restoreWindows();
    MenuBar.refresh();
    if (G.flags.abrupt){
      G.flags.abrupt = false;
      State.dirty();
      Dialogs.alert('The Lisa was not switched off properly last time — the power simply vanished. No matter: your work had already been kept safe, and the desktop is exactly as you left it.');
    } else if (G.firstBoot){
      G.firstBoot = false;
      State.dirty();
      Dialogs.ask('Good morning, and welcome to the Lisa Office System. If this machine is new to you — and in ' + simNow().getFullYear() + ', it is new to nearly everyone — LisaGuide would be glad to show you around. It is the sheet at the upper left of the desktop.',
        [{ label: 'Explore on My Own', value: false }, { label: 'Open LisaGuide', value: true, def: true }]).then(v => {
          if (v){
            const g = Object.values(FS).find(i => i.kind === 'guide');
            if (g) Desk.openDoc(g);
          }
        });
    }
  },
  async shutdown(quick){
    if (this.busy && !quick) return;
    this.busy = true;
    MenuBar.close();
    const ov = qs('#overlay');
    if (!quick){
      const docWins = Wins.list.filter(w => w.kind === 'doc');
      const n = Dialogs.narrate('The Lisa is putting your work away. There is no need to do anything.');
      await sleep(700);
      for (const w of docWins){
        n.set('Saving “' + esc(w.item.name) + '” and remembering where you were…');
        w.persist();
        await sleep(480);
        w.el.style.display = 'none';
        Sound.click();
      }
      Wins.list.forEach(w => w.persist());
      n.set('The desktop will be remembered exactly as it looks now. Good night.');
      G.activeId = Wins.active && Wins.active.item ? Wins.active.item.id : null;
      G.powered = false;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(G)); } catch (e) {}
      await sleep(900);
      n.close();
    } else {
      G.powered = false;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(G)); } catch (e) {}
    }
    Sound.hum(false);
    Sound.powerClick();
    qs('#dark').style.opacity = '1';
    qs('#led').classList.remove('on');
    ov.style.display = 'none'; ov.innerHTML = '';
    await sleep(650);
    // clear the stage for the next power-on
    Wins.list.concat(Wins.parked).forEach(w => { w.el.remove(); });
    Wins.list = []; Wins.parked = []; Wins.active = null;
    Desk.sel = null;
    qs('#desktop').querySelectorAll('.icon').forEach(x => x.remove());
    Dialogs.layer.innerHTML = ''; Dialogs.openCount = 0; Dialogs.layer.style.display = 'none';
    this.isOn = false;
    this.busy = false;
  }
};

function restoreWindows(){
  const opens = Object.values(FS).filter(i => i.openState === 'open');
  opens.sort((a, b) => ((a.win && a.win.z) || 0) - ((b.win && b.win.z) || 0));
  opens.forEach(it => {
    try {
      if (it.kind === 'doc' || it.kind === 'guide') Desk.createDocWindow(it);
      else if (it.kind === 'clip') Clip.open();
      else if (['folder', 'profile', 'diskette', 'waste'].indexOf(it.kind) >= 0) Desk.openContainer(it);
    } catch (e) { it.openState = null; }
  });
  const act = G.activeId ? Wins.byItem(G.activeId) : null;
  if (act) Wins.activate(act);
  Desk.renderAll();
}

/* waste windows render their note, not a plain grid */
const _rcOrig = Desk.renderContainer.bind(Desk);
Desk.renderContainer = function(cid){
  const it = itemById(cid);
  if (it && it.kind === 'waste'){
    const w = Wins.byItem(cid);
    if (w && w.icHost) this.renderWaste(w);
    return;
  }
  _rcOrig(cid);
};

/* ============================================================
   Screen scaling — 720×364 through non-square pixels
   ============================================================ */
function layoutMachine(){
  const PA = (G && G.prefs.squarePixels) ? 1.0 : 1.5;
  const availW = window.innerWidth - 24, availH = window.innerHeight - 24;
  const chromeW = 52, chromeH = 52 + 46;
  let sx = Math.min((availW - chromeW) / 720, (availH - chromeH) / (364 * PA));
  sx = Math.max(0.4, sx);
  const sy = sx * PA;
  const clip = qs('#stageClip');
  clip.style.width = (720 * sx) + 'px';
  clip.style.height = (364 * sy) + 'px';
  stage.style.transform = 'scale(' + sx + ',' + sy + ')';
  const m = qs('#machine');
  const mw = 720 * sx + chromeW;
  const mh = 364 * sy + chromeH;
  m.style.width = mw + 'px';
  m.style.left = Math.max(4, (window.innerWidth - mw) / 2) + 'px';
  m.style.top = Math.max(4, (window.innerHeight - mh) / 2) + 'px';
}
function applyPrefs(){
  const base = (G.prefs.contrast || 0) * 0.09;
  qs('#dim').style.opacity = String(Math.min(0.85, base + (idleDimmed ? 0.55 : 0)));
}

/* ---- idle dimming, to preserve the tube ---- */
let lastActivity = Date.now(), idleDimmed = false;
function poke(){
  lastActivity = Date.now();
  if (idleDimmed){ idleDimmed = false; applyPrefs(); }
}
setInterval(() => {
  if (Power.isOn && !idleDimmed && Date.now() - lastActivity > 5 * 60 * 1000){
    idleDimmed = true; applyPrefs();
  }
}, 10000);

/* ============================================================
   The hidden signature
   ============================================================ */
let eggBuf = '';
function showCredits(){
  const c = qs('#credits');
  c.style.display = 'flex';
  c.innerHTML = '<div class="card">For the late nights, the early mice, and the diskettes<br>that never quite fit —<br><br>' +
    'the Office Systems crew signs its work:<br>' +
    '<b>A.&nbsp;Fontaine · R.&nbsp;Delgado · M.&nbsp;Okabe · S.&nbsp;Whitfield · “Doc”&nbsp;Ives</b><br>' +
    'and the night shift, who kept the ProFile spinning.<br><br>' +
    '<span style="font-size:11px">— Cupertino, January 1983.<br>You found the hidden signature. The Twiggy drives salute you.</span></div>';
  c.addEventListener('mousedown', () => { c.style.display = 'none'; c.innerHTML = ''; }, { once: true });
}

/* ============================================================
   Global input wiring
   ============================================================ */
qs('#menubar').addEventListener('mousedown', e => { e.preventDefault(); MenuBar.begin(e); });
qs('#desktop').addEventListener('mousedown', e => {
  if (e.target === qs('#desktop')) Desk.select(null);
});
qs('#powerBtn').addEventListener('click', () => Power.press());
['mousemove', 'mousedown', 'keydown', 'wheel'].forEach(ev => window.addEventListener(ev, poke, true));
window.addEventListener('resize', layoutMachine);
document.addEventListener('dragstart', e => e.preventDefault());

document.addEventListener('keydown', e => {
  // credits card: any key dismisses
  const cr = qs('#credits');
  if (cr.style.display === 'flex'){ cr.style.display = 'none'; cr.innerHTML = ''; return; }
  if (!Power.isOn) return;
  // overlay worlds (environments / workshop)
  if (qs('#overlay').style.display === 'block'){
    if (e.key === 'Escape') Power._skip = true;
    if (e.key === ' ' || e.key.toLowerCase() === 'e') Power._env = true;
    if (Power._wkKey) Power._wkKey(e);
    else if (Power._envKey) Power._envKey(e);
    e.preventDefault();
    return;
  }
  // dialogs take the keyboard
  if (Dialogs.openCount){
    const top = Dialogs.layer.lastElementChild;
    if (top && top._key) top._key(e);
    return;
  }
  const ae = document.activeElement;
  const inField = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
  // Apple-key equivalents
  if ((e.metaKey || e.ctrlKey) && !e.altKey){
    const map = { s: 'saveContinue', d: 'duplicate', o: 'open', p: 'print', x: 'cut', c: 'copy', v: 'paste', a: 'selectAll', z: 'undo', b: 'bold', i: 'italic', u: 'underline', f: 'find' };
    const cmd = map[e.key.toLowerCase()];
    if (cmd && !inField){ e.preventDefault(); Commands.run(cmd); return; }
    if (cmd && inField && ['s', 'd', 'o', 'p'].indexOf(e.key.toLowerCase()) >= 0){ e.preventDefault(); Commands.run(cmd); return; }
  }
  if (inField) return;
  // the hidden signature: type the word old Lisa hands whisper
  if (/^[a-z]$/i.test(e.key)){
    eggBuf = (eggBuf + e.key.toLowerCase()).slice(-6);
    if (eggBuf === 'twiggy'){ eggBuf = ''; showCredits(); return; }
  }
  // renaming with Enter on a selected icon
  if (e.key === 'Enter' && Desk.sel && !Wins.active){
    const it = itemById(Desk.sel);
    const ic = stage.querySelector('.icon[data-id="' + Desk.sel + '"] .lbl');
    if (it && ic && Desk.canRename(it)){ Desk.beginRename(it, ic); e.preventDefault(); return; }
  }
  // hand the key to the active tool
  const w = Wins.active;
  if (w && w.tool && w.tool.key){
    if (w.tool.key(e)) e.preventDefault();
    else if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) e.preventDefault();
  }
});

/* ============================================================
   Start
   ============================================================ */
function init(){
  installPatterns();
  const saved = State.load();
  if (saved && saved.items && saved.items.profile){
    G = saved;
    FS = G.items;
    Clip.c = G.clip || null;
    if (G.powered) G.flags.abrupt = true;   // the browser vanished mid-session
    G.powered = false;
  } else {
    buildWorld();
  }
  hel(qs('#dark'), 'div', null,
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2c2c2c;font-size:12px;letter-spacing:1px">the screen is dark — press the power button, below right</div>');
  layoutMachine();
  applyPrefs();
  MenuBar.refresh();
}
init();
</script>
