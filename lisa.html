<!DOCTYPE html>
<html lang="en">
<head>

<title>Apple Lisa — Office System 3.1 (7/7) — a simulation</title>
<style>
/* ============================================================
   THE OS MUSEUM — Apple Lisa Office System 3.1 (7/7), 1984
   A single-file, front-end-only simulation. Nothing real runs.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#141210;font-family:Verdana,Geneva,'DejaVu Sans',sans-serif}
body{user-select:none;-webkit-user-select:none}

/* ---- the machine (bezel, power switch) ---- */
#machine{position:absolute;background:linear-gradient(175deg,#d9d0be 0%,#cbc1ac 70%,#bdb29c 100%);
  border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.18);
  padding:16px 16px 0 16px}
#screenBox{position:relative;background:#111;border-radius:7px;padding:10px;box-shadow:inset 0 0 22px #000,0 0 0 1px #8f866f}
#stageClip{position:relative;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:720px;height:364px;transform-origin:0 0;background:#fff;
  cursor:default;font-size:11px;line-height:1.3;color:#000}
#stage.busy, #stage.busy *{cursor:wait !important}
#dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:5}
#dark{position:absolute;inset:0;background:#000;opacity:1;transition:opacity .6s;pointer-events:none;z-index:6}
#frontPanel{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
#badge{font:italic bold 16px Georgia,'Times New Roman',serif;color:#6f6452;letter-spacing:2px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
#modelTag{font-size:9px;color:#8a7f6a;margin-left:10px;letter-spacing:1px}
#powerWrap{display:flex;align-items:center;gap:12px}
#powerHint{font-size:9px;color:#8a7f6a}
#led{width:9px;height:9px;border-radius:50%;background:#4a4438;box-shadow:inset 0 1px 2px #000}
#led.on{background:#8fe89a;box-shadow:0 0 9px #8fe89a,inset 0 0 2px #2c7}
#powerBtn{width:50px;height:22px;border-radius:5px;background:linear-gradient(#efe7d6,#bfb49c);
  border:1px solid #8d8471;box-shadow:0 2px 0 #857b66;cursor:pointer;outline:none}
#powerBtn:active{transform:translateY(1px);box-shadow:0 1px 0 #857b66}

/* ---- 1-bit vocabulary: checkerboards & dithers ---- */
.chk50{background:repeating-conic-gradient(#000 0% 25%,#fff 0% 50%);background-size:2px 2px}
.chk25{background:#fff repeating-conic-gradient(#000 0% 25%,transparent 0% 100%);background-size:2px 2px}
.chkShadow{background:repeating-conic-gradient(#000 0% 25%,transparent 0% 50%);background-size:2px 2px}
.dith{color:transparent !important;background:repeating-conic-gradient(#000 0% 25%,#fff 0% 50%);
  background-size:2px 2px;-webkit-background-clip:text;background-clip:text}

/* ---- menu bar & menus ---- */
#menubar{position:absolute;left:0;top:0;right:0;height:17px;background:#fff;border-bottom:1px solid #000;

.mtitle{padding:2px 11px 0 11px;white-space:nowrap}
.mtitle.open{background:#000;color:#fff}

.mi{padding:2px 16px 2px 14px;white-space:nowrap;display:flex;justify-content:space-between;gap:22px;align-items:center}
.mi.hl{background:#000;color:#fff}
.mi.hl .ap path{fill:#fff}
.mi.check::before{content:'✓';position:absolute;margin-left:-11px;font-size:9px}
.mkey{display:flex;align-items:center;gap:2px;font-size:10px}
.msep{border-top:1px dashed #000;margin:3px 1px}
.ap{vertical-align:-1px}

/* ---- windows: the Lisa folder-tab chrome ---- */
.lwin{position:absolute}

/* ---- overlays: boot, shutdown, environments, workshop ---- */

/* ---- LisaWrite ---- */

.lc-entry{flex:0 0 auto;height:18px;border-bottom:1px solid #000;display:flex;align-items:center;font-size:10px;background:#fff}

/* ---- LisaGraph ---- */

<script>
'use strict';
/* ============================================================
   Utilities
   ============================================================ */
const qs = s => document.querySelector(s);
const stage = qs('#stage');
function el(parent, tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
function hel(parent, tag, cls, markup){
  const n = el(parent, tag, cls);
  n.innerHTML = markup;
  return n;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function uid(){ G.seq = (G.seq || 0) + 1; return 'i' + G.seq.toString(36) + Date.now().toString(36).slice(-4); }
function pt(e){
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / (r.width / 720), y: (e.clientY - r.top) / (r.height / 364) };
}
/* Generic drag helper: begins on an existing mousedown event. */
function drag(e, opts){
  const start = pt(e);
  let moved = false;
  function mm(ev){
    const p = pt(ev);
    const dx = p.x - start.x, dy = p.y - start.y;
    if (!moved && Math.abs(dx) + Math.abs(dy) > 3){ moved = true; if (opts.begin) opts.begin(p); }
    if (moved && opts.move) opts.move(dx, dy, p, ev);
    ev.preventDefault();
  }
  function mu(ev){
    document.removeEventListener('mousemove', mm, true);
    document.removeEventListener('mouseup', mu, true);
    if (opts.up) opts.up(moved, pt(ev), ev);
  }
  document.addEventListener('mousemove', mm, true);
  document.addEventListener('mouseup', mu, true);
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---- the simulated 1984 clock ---- */
function simNow(){ return new Date(Date.now() + (G.simOffset || 0)); }
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtDate(d){ return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function fmtTime(d){
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
}
function fmtDateTime(d){ return fmtDate(d) + '  ' + fmtTime(d); }

/* ============================================================
   Global state
   ============================================================ */
const STORAGE_KEY = 'osmuseum.lisa77.v1';
let G = null;   // whole persisted world
let FS = null;  // shortcut to G.items

const State = {
  timer: null,
  dirty(){
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.save(), 400);
  },
  save(){
    if (!G) return;
    try {
      // capture live window geometry/view before writing
      Wins.list.forEach(w => w.persist && w.persist());
      G.clip = Clip.c;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(G));
    } catch (e) { /* storage may be unavailable; the Lisa forgives */ }
  },
  load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  },
  reset(){
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }
};

/* ============================================================
   Sound Manager — everything synthesized, nothing sampled
   ============================================================ */
const Sound = {
  ctx: null, humNodes: null,
  ac(){
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  vol(){ return [0, 0.12, 0.24, 0.4][(G && G.prefs.volume) || 0] || 0; },
  tone(freq, dur, type, gain){
    const v = this.vol(); if (!v) return;
    const c = this.ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(v * (gain || 1), c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  },
  noise(dur, gain, freq){
    const v = this.vol(); if (!v) return;
    const c = this.ac(); if (!c) return;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 2000; f.Q.value = 0.6;
    const g = c.createGain(); g.gain.value = v * (gain || 0.7);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  },
  beep(){ this.tone(880, 0.14, 'square', 0.8); },
  click(){ this.noise(0.03, 0.5, 3500); },
  powerClick(){ this.noise(0.05, 0.9, 900); },
  tear(){ this.noise(0.22, 0.9, 1600); setTimeout(() => this.noise(0.1, 0.5, 900), 60); },
  insertS(){ this.noise(0.08, 0.7, 1200); setTimeout(() => this.tone(220, 0.08, 'square', 0.4), 120); },
  ejectS(){ this.tone(180, 0.07, 'square', 0.4); setTimeout(() => this.noise(0.09, 0.7, 1000), 80); },
  hum(on){
    if (on){
      if (this.humNodes || !G || !G.prefs.hum) return;
      const v = this.vol(); if (!v) return;
      const c = this.ac(); if (!c) return;
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = 58;
      const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 117;
      const g = c.createGain(); g.gain.value = 0;
      g.gain.linearRampToValueAtTime(v * 0.08, c.currentTime + 1.2);
      o.connect(g); o2.connect(g); g.connect(c.destination);
      o.start(); o2.start();
      this.humNodes = { o, o2, g };
    } else if (this.humNodes){
      const h = this.humNodes, c = this.ctx;
      try {
        h.g.gain.linearRampToValueAtTime(0.0001, c.currentTime + 0.4);
        setTimeout(() => { try { h.o.stop(); h.o2.stop(); } catch (e) {} }, 500);
      } catch (e) {}
      this.humNodes = null;
    }
  }
};

/* ============================================================
   Dialog Manager — every message in the Lisa's courteous voice
   ============================================================ */
const Dialogs = {
  layer: qs('#dialoglayer'),
  openCount: 0,
  build(){
    this.layer.style.display = 'block';
    this.openCount++;
    const d = el(this.layer, 'div', 'dlg');
    return d;
  },
  dismiss(d){
    d.remove();
    this.openCount--;
    if (this.openCount <= 0){ this.openCount = 0; this.layer.style.display = 'none'; }
    MenuBar.refresh();
  },
  /* buttons: [{label, value, def, cancel}] */
  ask(text, buttons){
    Sound.beep();
    return new Promise(resolve => {
      const d = this.build();
      hel(d, 'div', 'dtxt', text);
      const row = el(d, 'div', 'dbtns');
      let defBtn = null, cancelVal;
      buttons.forEach(b => {
        const btn = el(row, 'button', 'lbtn' + (b.def ? ' def' : ''), b.label);
        if (b.def) defBtn = btn;
        if (b.cancel) cancelVal = b.value;
        btn.onclick = () => { this.dismiss(d); resolve(b.value); };
      });
      d._key = (ev) => {
        if (ev.key === 'Enter' && defBtn){ defBtn.click(); return true; }
        if (ev.key === 'Escape' && cancelVal !== undefined){ this.dismiss(d); resolve(cancelVal); return true; }
        return false;
      };
      if (defBtn) defBtn.focus();
    });
  },
  alert(text, label){
    return this.ask(text, [{ label: label || 'OK', value: true, def: true }]);
  },
  /* A text-entry dialog. Resolves to the string, or null if declined. */
  prompt(text, opts){
    opts = opts || {};
    Sound.beep();
    return new Promise(resolve => {
      const d = this.build();
      hel(d, 'div', 'dtxt', text);
      const row = el(d, 'div', 'drow');
      if (opts.label) el(row, 'span', null, opts.label);
      const inp = el(row, 'input');
      inp.type = opts.password ? 'password' : 'text';
      inp.value = opts.value || '';
      const btns = el(d, 'div', 'dbtns');
      const cancel = el(btns, 'button', 'lbtn', opts.cancelLabel || 'Cancel');
      const ok = el(btns, 'button', 'lbtn def', opts.okLabel || 'OK');
      const done = v => { this.dismiss(d); resolve(v); };
      cancel.onclick = () => done(null);
      ok.onclick = () => done(inp.value);
      inp.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') ok.click();
        if (ev.key === 'Escape') cancel.click();
        ev.stopPropagation();
      });
      setTimeout(() => { inp.focus(); inp.select(); }, 30);
    });
  },
  /* Transient narration, no buttons. Returns a handle with close(). */
  narrate(text){
    this.layer.style.display = 'block';
    this.openCount++;
    const d = el(this.layer, 'div', 'dlg');
    hel(d, 'div', 'dtxt', text);
    return {
      set: t => { d.firstChild.innerHTML = t; },
      close: () => this.dismiss(d)
    };
  },
  note(text, ms){
    const n = hel(stage, 'div', 'note', text);
    setTimeout(() => n.remove(), ms || 1200);
  },
  /* fully custom dialog; builder(d, done) */
  custom(builder){
    Sound.beep();
    return new Promise(resolve => {
      const d = this.build();
      builder(d, v => { this.dismiss(d); resolve(v); });
    });
  }
};

/* ============================================================
   Menu System — press, hold, drag, release. Never sticky.
   ============================================================ */
const MenuBar = {
  bar: qs('#menubar'),
  layer: qs('#menulayer'),
  trees: [],
  openIdx: -1,
  menuEl: null,
  hlItem: null,
  tracking: false,

  refresh(){
    let trees;
    const w = Wins.active;
    if (w && w.menus) trees = w.menus();
    else trees = Desk.desktopMenus();
    this.trees = trees;
    this.bar.innerHTML = '';
    trees.forEach((t, i) => {
      const m = el(this.bar, 'span', 'mtitle', t.title);
      m.dataset.idx = i;
    });
  },

  begin(e){
    const t = e.target.closest('.mtitle');
    if (!t) return false;
    if (!Power.isOn || Dialogs.openCount) return true;
    this.tracking = true;
    this.open(+t.dataset.idx);
    const mm = ev => this.track(ev);
    const mu = ev => {
      document.removeEventListener('mousemove', mm, true);
      document.removeEventListener('mouseup', mu, true);
      this.finish(ev);
    };
    document.addEventListener('mousemove', mm, true);
    document.addEventListener('mouseup', mu, true);
    return true;
  },

  open(idx){
    if (this.openIdx === idx) return;
    this.close();
    this.openIdx = idx;
    const tree = this.trees[idx];
    if (!tree) return;
    const titles = this.bar.querySelectorAll('.mtitle');
    titles[idx].classList.add('open');
    this.layer.style.display = 'block';
    const m = el(this.layer, 'div', 'menu');
    let left = 2;
    const tEl = titles[idx];
    left = tEl.offsetLeft;
    m.style.left = Math.min(left, 718 - 170) + 'px';
    m.style.top = '17px';
    tree.items.forEach(it => {
      if (it.sep){ el(m, 'div', 'msep'); return; }
      const row = el(m, 'div', 'mi');
      row._item = it;
      const lab = el(row, 'span', null, it.label);
      if (it.checked) row.classList.add('check');
      if (it.key) hel(row, 'span', 'mkey', APPLE_GLYPH + '<span>' + it.key + '</span>');
      const enabled = (it.enabled === undefined) ? true : (typeof it.enabled === 'function' ? it.enabled() : it.enabled);
      if (!enabled){ row.classList.add('dis'); lab.classList.add('dith'); row._dis = true; }
    });
    // keep on screen
    const rect = m.getBoundingClientRect(), srect = stage.getBoundingClientRect();
    const wLogical = rect.width / (srect.width / 720);
    if (parseFloat(m.style.left) + wLogical > 716) m.style.left = (716 - wLogical) + 'px';
    this.menuEl = m;
  },

  close(){
    this.bar.querySelectorAll('.mtitle.open').forEach(x => x.classList.remove('open'));
    this.layer.innerHTML = '';
    this.layer.style.display = 'none';
    this.openIdx = -1; this.menuEl = null; this.hlItem = null;
  },

  track(ev){
    const elAt = document.elementFromPoint(ev.clientX, ev.clientY);
    if (!elAt) return;
    const title = elAt.closest && elAt.closest('.mtitle');
    if (title){ this.open(+title.dataset.idx); this.setHl(null); return; }
    const mi = elAt.closest && elAt.closest('.mi');
    this.setHl(mi && !mi._dis ? mi : null);
  },

  setHl(mi){
    if (this.hlItem === mi) return;
    if (this.hlItem) this.hlItem.classList.remove('hl');
    this.hlItem = mi;
    if (mi) mi.classList.add('hl');
  },

  finish(ev){
    this.tracking = false;
    const mi = this.hlItem;
    if (mi && mi._item && mi._item.cmd){
      // authentic blink before the menu closes
      const item = mi._item;
      let n = 0;
      const iv = setInterval(() => {
        mi.classList.toggle('hl');
        if (++n >= 4){
          clearInterval(iv);
          this.close();
          Commands.run(item.cmd, item.arg);
        }
      }, 45);
    } else {
      this.close();
    }
  }
};

/* ============================================================
   Window Manager — folder tabs, patterned shadows, no close box
   ============================================================ */
const Wins = {
  list: [],
  parked: [],   // set-aside windows, hidden but alive
  active: null,
  zTop: 100,

  add(w){
    this.list.push(w);
    this.activate(w);
  },
  activate(w){
    if (this.active === w){ MenuBar.refresh(); return; }
    if (this.active) this.active.el.classList.add('inactive');
    this.active = w;
    if (w){
      w.el.classList.remove('inactive');
      w.el.style.zIndex = ++this.zTop;
      if (this.zTop > 400) this.renumber();
    }
    MenuBar.refresh();
    State.dirty();
  },
  renumber(){
    const sorted = this.list.slice().sort((a, b) => (+a.el.style.zIndex) - (+b.el.style.zIndex));
    this.zTop = 100;
    sorted.forEach(w => w.el.style.zIndex = ++this.zTop);
  },
  remove(w){
    const i = this.list.indexOf(w);
    if (i >= 0) this.list.splice(i, 1);
    if (this.active === w){
      this.active = null;
      // activate the topmost remaining window
      let top = null;
      this.list.forEach(x => { if (!x.hidden && (!top || +x.el.style.zIndex > +top.el.style.zIndex)) top = x; });
      if (top) this.activate(top); else MenuBar.refresh();
    }
  },
  byItem(id){
    return this.list.find(w => w.item && w.item.id === id) ||
           this.parked.find(w => w.item && w.item.id === id) || null;
  }
};

class LisaWindow {
  /* opts: {item, kind:'doc'|'container'|'special', rect, hasV, hasH, grow} */
  constructor(opts){

    el(w, 'div', 'frame');

    this.innerEl = el(this.bodyEl, 'div', 'inner');
    if (opts.hasV !== false){ w.classList.add('hasV'); this.makeScroll('v'); }
    if (opts.hasH){ w.classList.add('hasH'); this.makeScroll('h'); }
    if (opts.grow !== false){
      const g = hel(w, 'div', 'grow',
        '<svg width="11" height="11" viewBox="0 0 11 11"><rect x="0.5" y="0.5" width="7" height="7" fill="#fff" stroke="#000"/><rect x="3.5" y="3.5" width="7" height="7" fill="#fff" stroke="#000"/></svg>');
      g.addEventListener('mousedown', e => {
        e.stopPropagation();
        Wins.activate(this);
        const r0 = Object.assign({}, this.rect);
        drag(e, {
          move: (dx, dy) => {
            this.rect.w = clamp(r0.w + dx, this.minW || 170, 716);
            this.rect.h = clamp(r0.h + dy, this.minH || 100, 345);
            this.applyRect();
            if (this.onResize) this.onResize();
          },
          up: () => { State.dirty(); if (this.onResize) this.onResize(); }
        });
      });
    }
    tab.addEventListener('mousedown', e => {
      e.stopPropagation();
      Wins.activate(this);
      const r0 = Object.assign({}, this.rect);
      drag(e, {
        move: (dx, dy) => {
          this.rect.x = clamp(r0.x + dx, -this.rect.w + 60, 700);
          this.rect.y = clamp(r0.y + dy, 17, 350);
          this.applyRect();
        },
        up: () => State.dirty()
      });
    });
    w.addEventListener('mousedown', () => { if (Wins.active !== this) Wins.activate(this); }, true);
    this.applyRect();
    Wins.add(w && this);
  }

  makeScroll(axis){
    const isV = axis === 'v';
    const sb = el(this.el, 'div', isV ? 'sbV' : 'sbH');
    const a1 = hel(sb, 'div', 'sbArr', isV
      ? '<svg width="9" height="9"><path d="M4.5 1 L8 7 L1 7 Z" fill="#fff" stroke="#000"/></svg>'
      : '<svg width="9" height="9"><path d="M1 4.5 L7 1 L7 8 Z" fill="#fff" stroke="#000"/></svg>');
    const a2 = hel(sb, 'div', 'sbArr', isV
      ? '<svg width="9" height="9"><path d="M4.5 8 L8 2 L1 2 Z" fill="#fff" stroke="#000"/></svg>'
      : '<svg width="9" height="9"><path d="M8 4.5 L2 1 L2 8 Z" fill="#fff" stroke="#000"/></svg>');
    if (isV){ a1.style.top = '0'; a1.style.borderBottom = '1px solid #000'; a2.style.bottom = '0'; a2.style.borderTop = '1px solid #000'; }
    else { a1.style.left = '0'; a1.style.borderRight = '1px solid #000'; a2.style.right = '0'; a2.style.borderLeft = '1px solid #000'; }
    const track = el(sb, 'div', 'sbTrack');
    const thumb = el(track, 'div', 'sbThumb');
    const self = this;
    const S = isV ? (this._sv = {}) : (this._sh = {});
    S.sb = sb; S.track = track; S.thumb = thumb; S.isV = isV;
    function target(){ return self.scrollEl || self.innerEl; }
    function metrics(){
      const t = target();
      const view = isV ? t.clientHeight : t.clientWidth;
      const full = isV ? t.scrollHeight : t.scrollWidth;
      const pos = isV ? t.scrollTop : t.scrollLeft;
      return { view, full, pos, max: Math.max(0, full - view) };
    }
    S.sync = function(){
      const m = metrics();
      const tl = isV ? track.clientHeight : track.clientWidth;
      if (m.max <= 0){ thumb.style.display = 'none'; return; }
      thumb.style.display = 'block';
      const th = Math.max(14, tl * m.view / m.full);
      const off = (tl - th) * (m.pos / m.max);
      if (isV){ thumb.style.height = th + 'px'; thumb.style.top = off + 'px'; }
      else { thumb.style.width = th + 'px'; thumb.style.left = off + 'px'; }
    };
    function scrollBy(d){
      const t = target();
      if (isV) t.scrollTop += d; else t.scrollLeft += d;
      S.sync();
      if (self.onScroll) self.onScroll();
      State.dirty();
    }
    a1.addEventListener('mousedown', e => { e.stopPropagation(); scrollBy(-24); });
    a2.addEventListener('mousedown', e => { e.stopPropagation(); scrollBy(24); });
    track.addEventListener('mousedown', e => {
      e.stopPropagation();
      if (e.target === thumb){
        const m0 = metrics();
        const tl = isV ? track.clientHeight : track.clientWidth;
        const th = isV ? thumb.clientHeight : thumb.clientWidth;
        drag(e, {
          move: (dx, dy) => {
            const dpix = isV ? dy : dx;
            const t = target();
            const npos = clamp(m0.pos + dpix * (m0.max / Math.max(1, tl - th)), 0, m0.max);
            if (isV) t.scrollTop = npos; else t.scrollLeft = npos;
            S.sync();
            if (self.onScroll) self.onScroll();
          },
          up: () => State.dirty()
        });
      } else {
        const m = metrics();
        scrollBy((isV ? (e.offsetY < parseFloat(thumb.style.top || 0) ? -1 : 1) : (e.offsetX < parseFloat(thumb.style.left || 0) ? -1 : 1)) * m.view * 0.8);
      }
    });
    this.bodyEl.addEventListener('wheel', e => {
      e.preventDefault();
      if (isV && !e.shiftKey) scrollBy(e.deltaY > 0 ? 24 : -24);
    }, { passive: false });
  }

  syncScroll(){
    if (this._sv) this._sv.sync();
    if (this._sh) this._sh.sync();
  }

  applyRect(){
    const r = this.rect;
    this.el.style.left = r.x + 'px'; this.el.style.top = r.y + 'px';
    this.el.style.width = r.w + 'px'; this.el.style.height = r.h + 'px';
    this.syncScroll();
  }

  setTitle(t){ this.nameEl.textContent = t; }

  hide(){
    this.hidden = true; this.el.style.display = 'none';
    Wins.remove(this);
    if (Wins.parked.indexOf(this) < 0) Wins.parked.push(this);
  }
  show(){
    this.hidden = false; this.el.style.display = 'block';
    const p = Wins.parked.indexOf(this);
    if (p >= 0) Wins.parked.splice(p, 1);
    if (Wins.list.indexOf(this) < 0) Wins.list.push(this);
    Wins.activate(this);
    this.syncScroll();
  }
  destroy(){
    if (this.tool && this.tool.destroy) this.tool.destroy();
    Wins.remove(this);
    const p = Wins.parked.indexOf(this);
    if (p >= 0) Wins.parked.splice(p, 1);
    this.el.remove();
  }

  persist(){
    if (!this.item) return;
    const it = this.item;
    it.win = it.win || {};
    Object.assign(it.win, this.rect);
    it.win.z = +this.el.style.zIndex || 100;
    const sc = this.scrollEl || this.innerEl;
    it.win.sx = sc.scrollLeft; it.win.sy = sc.scrollTop;
    if (this.tool && this.tool.getView) it.win.view = this.tool.getView();
    if (this.tool && this.tool.flush) this.tool.flush();
  }
  restoreScroll(){
    const it = this.item;
    if (!it || !it.win) return;
    const sc = this.scrollEl || this.innerEl;
    if (it.win.sx) sc.scrollLeft = it.win.sx;
    if (it.win.sy) sc.scrollTop = it.win.sy;
    this.syncScroll();
  }
}
/* ============================================================
   Document model & filing
   ============================================================ */
function itemById(id){ return FS[id] || null; }
function childrenOf(cid){ return Object.values(FS).filter(i => i.parent === cid); }
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
function computeSizeK(item){
  if (item.kind === 'folder') return childrenOf(item.id).reduce((s, c) => s + computeSizeK(c), 1);
  return Math.max(1, Math.round(JSON.stringify(item.content || {}).length / 400));
}
function diskOf(item){
  let it = item;
  while (it && it.parent && it.parent !== 'desktop'){ it = itemById(it.parent); }
  if (it && (it.kind === 'diskette')) return it.id;
  if (it && it.kind === 'profile') return 'profile';
  return 'profile'; // the desktop belongs to the ProFile's world
}
function isDescendant(maybeChild, ancestorId){
  let p = maybeChild.parent;
  while (p && p !== 'desktop'){
    if (p === ancestorId) return true;
    const it = itemById(p); p = it ? it.parent : null;
  }
  return false;
}
function whereLabel(item){
  const names = [];
  let p = item.parent;
  while (p){
    if (p === 'desktop'){ names.push('the desktop'); break; }
    const it = itemById(p); if (!it) break;
    names.push('“' + it.name + '”');
    p = it.parent;
  }
  return names.join(', inside ') || 'the desktop';
}
function uniqueName(base, cid){
  const names = childrenOf(cid).map(i => i.name);
  if (names.indexOf(base) < 0) return base;
  let n = 2;
  while (names.indexOf(base + ' ' + n) >= 0) n++;
  return base + ' ' + n;
}
function kindLabel(item){
  switch (item.kind){
    case 'doc': return Tools.defs[item.tool].name + ' document';
    case 'guide': return 'guided introduction';
    case 'pad': return 'stationery pad (' + Tools.defs[item.tool].name + ')';
    case 'tool': return 'tool';
    case 'folder': return 'folder';
    case 'folderpad': return 'pad of empty folders';
    case 'profile': return 'ProFile hard disk';
    case 'diskette': return 'diskette';
    case 'waste': return 'wastebasket';
    case 'clip': return 'clipboard';
    default: return item.kind;
  }
}

/* ============================================================
   The Clipboard — visible on the desktop, openable like a window
   ============================================================ */
const Clip = {
  c: null,
  set(c){
    this.c = c;
    G.clip = c;
    const w = Wins.byItem('clipicon');
    if (w) this.renderInto(w);
    Desk.renderContainer('desktop');
    State.dirty();
  },
  describe(){
    const c = this.c;
    if (!c) return 'The Clipboard is empty. Whatever you cut or copy next will be kept here.';
    const kind = c.type === 'text' ? 'some text' : c.type === 'table' ? 'a table of values' : 'a picture';
    return 'The Clipboard is holding ' + kind + ', taken from ' + (c.from || 'a document') + '. It will stay here until you cut or copy something else.';
  },
  renderInto(w){
    const host = w.innerEl;
    host.innerHTML = '';
    const wrap = el(host, 'div', 'cb-wrap');
    el(wrap, 'div', null, this.describe());
    if (this.c){
      const prev = el(wrap, 'div', 'cb-prev');
      const c = this.c;
      if (c.type === 'text') prev.innerHTML = c.html || esc(c.text);
      else if (c.type === 'table') prev.innerHTML = tableHTML(c.rows);
      else if (c.type === 'picture') prev.innerHTML = c.svg;
    }
  },
  open(){
    let w = Wins.byItem('clipicon');
    if (w){ w.show(); return; }
    const item = itemById('clipicon');
    w = new LisaWindow({ item, kind: 'special', rect: item.win || { x: 180, y: 90, w: 330, h: 200 } });
    w.menus = () => Desk.desktopMenus();
    this.renderInto(w);
    item.openState = 'open';
    Desk.renderContainer('desktop');
    MenuBar.refresh();
  }
};
function tableHTML(rows){
  return '<table>' + rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</table>';
}

/* ============================================================
   Desktop Manager
   ============================================================ */
const Desk = {
  sel: null,

  select(id){
    if (this.sel === id) return;
    this.sel = id;
    stage.querySelectorAll('.icon.selected').forEach(x => x.classList.remove('selected'));
    if (id){
      const ic = stage.querySelector('.icon[data-id="' + id + '"]');
      if (ic) ic.classList.add('selected');
    }
    MenuBar.refresh();
  },

  hostFor(cid){
    if (cid === 'desktop') return qs('#desktop');
    const w = Wins.byItem(cid);
    return (w && w.kind === 'container') ? w.icHost : null;
  },

  renderContainer(cid){
    const host = this.hostFor(cid);
    if (!host) return;
    host.querySelectorAll('.icon').forEach(x => x.remove());
    let maxX = 0, maxY = 0;
    childrenOf(cid).forEach(it => {
      const ic = this.makeIcon(it);
      host.appendChild(ic);
      maxX = Math.max(maxX, it.pos.x + 70); maxY = Math.max(maxY, it.pos.y + 50);
    });
    if (cid !== 'desktop'){
      host.style.width = Math.max(maxX, 300) + 'px';
      host.style.height = Math.max(maxY, 120) + 'px';
      const w = Wins.byItem(cid);
      if (w) w.syncScroll();
    }
  },
  renderAll(){
    this.renderContainer('desktop');
    Wins.list.forEach(w => { if (w.kind === 'container') this.renderContainer(w.item.id); });
  },

  makeIcon(item){
    const ic = el(null, 'div', 'icon');
    ic.dataset.id = item.id;
    ic.style.left = item.pos.x + 'px';
    ic.style.top = item.pos.y + 'px';
    hel(ic, 'div', null, iconSVG(item));
    const lbl = el(ic, 'div', 'lbl', item.name);
    if (item.openState) ic.classList.add('ghost');
    if (this.sel === item.id) ic.classList.add('selected');
    ic.addEventListener('mousedown', e => {
      e.stopPropagation();
      if (Dialogs.openCount) return;
      const wasSel = this.sel === item.id;
      this.select(item.id);
      // click on the name of a selected icon begins renaming
      if (wasSel && e.target === lbl && this.canRename(item)){
        this.beginRename(item, lbl);
        return;
      }
      this.dragIcon(e, item, ic);
    });
    ic.addEventListener('dblclick', e => {
      e.stopPropagation();
      if (Dialogs.openCount) return;
      this.openItem(item);
    });
    return ic;
  },

  canRename(item){
    return ['doc', 'pad', 'folder', 'diskette', 'guide'].indexOf(item.kind) >= 0;
  },

  beginRename(item, lbl){
    lbl.textContent = '';
    const inp = el(lbl, 'input');
    inp.value = item.name;
    lbl.style.pointerEvents = 'auto';
    const commit = () => {
      const v = inp.value.trim();
      if (v) { item.name = v; item.modified = simNow().toISOString(); }
      const w = Wins.byItem(item.id);
      if (w) w.setTitle(item.name);
      this.renderContainer(item.parent);
      MenuBar.refresh();
      State.dirty();
    };
    inp.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter') inp.blur();
      if (ev.key === 'Escape'){ inp.value = item.name; inp.blur(); }
    });
    inp.addEventListener('blur', commit);
    inp.addEventListener('mousedown', ev => ev.stopPropagation());
    setTimeout(() => { inp.focus(); inp.select(); }, 20);
  },

  dragIcon(e, item, ic){
    let ghost = null;
    const self = this;
    drag(e, {
      begin(){
        ghost = ic.cloneNode(true);
        ghost.id = 'dragGhost';
        ghost.classList.remove('selected');
        stage.appendChild(ghost);
      },
      move(dx, dy, p){
        ghost.style.left = (p.x - 33) + 'px';
        ghost.style.top = (p.y - 18) + 'px';
      },
      up(moved, p, ev){
        if (!ghost) return;
        ghost.remove();
        const target = self.dropTarget(ev, item);
        if (!target) return;
        self.handleDrop(item, target, p);
      }
    });
  },

  dropTarget(ev, item){
    const elAt = document.elementFromPoint(ev.clientX, ev.clientY);
    if (!elAt || !elAt.closest) return null;
    const icEl = elAt.closest('.icon');
    if (icEl && icEl.dataset.id !== item.id){
      const t = itemById(icEl.dataset.id);
      if (t && ['folder', 'profile', 'diskette', 'waste', 'clip'].indexOf(t.kind) >= 0)
        return { kind: 'item', item: t };
    }
    const winEl = elAt.closest('.lwin');
    if (winEl){
      const w = Wins.list.find(x => x.el === winEl);
      if (w && w.kind === 'container') return { kind: 'container', id: w.item.id, win: w };
      return null;
    }
    if (elAt.closest('#desktop')) return { kind: 'container', id: 'desktop' };
    return null;
  },

  handleDrop(item, target, p){
    if (target.kind === 'item'){
      const t = target.item;
      if (t.kind === 'waste'){ this.discard(item); return; }
      if (t.kind === 'clip'){
        Dialogs.alert('The Clipboard holds only what you cut or copy from within a document. To put “' + esc(item.name) + '” somewhere, please drag it to a folder or a disk instead.');
        return;
      }
      if (['profile', 'diskette', 'folder'].indexOf(t.kind) >= 0){
        this.moveTo(item, t.id, null);
      }
      return;
    }
    // container drop with a position
    let pos = null;
    if (target.id === 'desktop'){
      pos = { x: clamp(p.x - 33, 0, 650), y: clamp(p.y - 17 - 18, 0, 300) };
    } else if (target.win){
      const host = target.win.icHost;
      const r = host.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      const k = sr.width / 720, kv = sr.height / 364;
      pos = { x: clamp((p.x - (r.left - sr.left) / k) - 33, 0, 2000), y: clamp((p.y - (r.top - sr.top) / kv) - 18, 0, 2000) };
    }
    this.moveTo(item, target.id, pos);
  },

  moveTo(item, cid, pos){
    if (cid === item.id || (itemById(cid) && isDescendant(itemById(cid), item.id))){
      Dialogs.alert('A folder cannot be placed inside itself, however neatly it might seem to fit.');
      return;
    }
    if (['profile', 'diskette', 'waste', 'clip', 'tool', 'folderpad'].indexOf(item.kind) >= 0 && cid !== 'desktop' && item.kind !== 'tool'){
      // disks and desk furniture stay on the desktop
      if (item.kind !== 'tool'){
        if (pos && item.parent === 'desktop'){ item.pos = pos; this.renderContainer('desktop'); State.dirty(); return; }
        Dialogs.alert('“' + esc(item.name) + '” prefers to remain on the desktop, where it can be reached at any time.');
        return;
      }
    }
    const srcDisk = diskOf(item), dstDisk = cid === 'desktop' ? 'profile' : diskOf(itemById(cid) || { parent: cid });
    if (srcDisk !== dstDisk){
      // moving between disks copies, as it did on the Lisa
      this.copyBetweenDisks(item, cid, pos);
      return;
    }
    const oldParent = item.parent;
    item.parent = cid;
    item.pos = pos || this.findFreeSlot(cid);
    if (item.home && cid !== 'desktop') item.home = null;
    this.renderContainer(oldParent);
    this.renderContainer(cid);
    State.dirty();
  },

  copyBetweenDisks(item, cid, pos){
    const destDiskItem = cid === 'desktop' ? itemById('profile') : itemById(diskOf(itemById(cid)));
    const capacity = destDiskItem && destDiskItem.kind === 'diskette' ? 400 : 5120;
    const used = usedK(destDiskItem ? destDiskItem.id : 'profile');
    const need = computeSizeK(item);
    if (used + need > capacity){
      Dialogs.alert('There is not enough room on “' + esc(destDiskItem.name) + '” for “' + esc(item.name) + '”. The diskette holds 400K, and ' + used + 'K of it is already in use. You might discard something first, or use a fresh diskette.');
      return;
    }
    const n = Dialogs.narrate('The Lisa is copying “' + esc(item.name) + '” — one moment, please…');
    setTimeout(() => {
      const copy = this.cloneItem(item, cid);
      copy.pos = pos || this.findFreeSlot(cid);
      n.close();
      this.renderContainer(cid);
      State.dirty();
    }, 700);
  },

  cloneItem(item, cid, nameOverride){
    const copy = deepCopy(item);
    copy.id = uid();
    copy.parent = cid;
    copy.name = nameOverride || uniqueName(item.name, cid);
    copy.openState = null; copy.home = null; copy.win = null;
    copy.created = simNow().toISOString(); copy.modified = copy.created;
    FS[copy.id] = copy;
    if (item.kind === 'folder'){
      childrenOf(item.id).forEach(c => {
        const cc = this.cloneItem(c, copy.id, c.name);
        cc.pos = Object.assign({}, c.pos);
      });
    }
    return copy;
  },

  findFreeSlot(cid){
    const kids = childrenOf(cid);
    const taken = {};
    kids.forEach(k => { taken[Math.round(k.pos.x / 72) + ',' + Math.round(k.pos.y / 48)] = 1; });
    const cols = cid === 'desktop' ? 8 : 5;
    for (let row = 0; row < 12; row++)
      for (let col = 0; col < cols; col++)
        if (!taken[col + ',' + row]) return { x: 10 + col * 72, y: 8 + row * 48 };
    return { x: 10, y: 8 };
  },

  /* set-aside icons wait along the bottom of the desktop, as they did */
  findAsideSlot(){
    const kids = childrenOf('desktop');
    for (let row = 6; row >= 0; row--){
      for (let col = 0; col < 8; col++){
        const x = 10 + col * 72, y = 8 + row * 48;
        if (!kids.some(k => Math.abs(k.pos.x - x) < 60 && Math.abs(k.pos.y - y) < 40))
          return { x, y };
      }
    }
    return this.findFreeSlot('desktop');
  },

  straighten(cid){
    const kids = childrenOf(cid).sort((a, b) => a.name.localeCompare(b.name));
    const cols = cid === 'desktop' ? 8 : 5;
    kids.forEach((k, i) => {
      if (cid === 'desktop' && ['profile', 'waste', 'clip', 'diskette'].indexOf(k.kind) >= 0) return;
      k.pos = { x: 10 + (i % cols) * 72, y: 8 + Math.floor(i / cols) * 48 };
    });
    this.renderContainer(cid);
    State.dirty();
  },

  /* ---------- opening things ---------- */
  openItem(item){
    switch (item.kind){
      case 'doc': case 'guide': this.openDoc(item); break;
      case 'pad': this.tearPad(item); break;
      case 'folderpad': this.tearFolder(item); break;
      case 'folder': case 'profile': case 'diskette': case 'waste': this.openContainer(item); break;
      case 'clip': Clip.open(); break;
      case 'tool':
        Dialogs.alert('“' + esc(item.name) + '” is a tool, and tools are never opened directly. To begin a document, tear a sheet from one of the stationery pads — double-click the pad, and a fresh sheet will appear beside it, ready to be named and opened.');
        break;
    }
  },

  openContainer(item){
    let w = Wins.byItem(item.id);
    if (w){ w.show(); return; }
    const defRect = { x: 60 + (Wins.list.length % 5) * 22, y: 40 + (Wins.list.length % 5) * 16, w: 380, h: 220 };
    w = new LisaWindow({ item, kind: 'container', rect: item.win || defRect });
    w.menus = () => this.desktopMenus();
    w.icHost = el(w.innerEl, 'div');
    w.icHost.style.position = 'relative';
    if (item.kind === 'waste') this.renderWaste(w);
    else this.renderContainer(item.id);
    item.openState = 'open';
    w.innerEl.addEventListener('mousedown', e => {
      if (e.target === w.innerEl || e.target === w.icHost) this.select(null);
    });
    this.renderContainer(item.parent);
    w.restoreScroll();
    MenuBar.refresh();
  },

  renderWaste(w){
    const item = itemById('waste');
    w.icHost.innerHTML = '';
    const kids = childrenOf('waste');
    if (!kids.length){
      const msg = el(w.icHost, 'div', null, 'The Wastebasket is empty.');
      msg.style.cssText = 'padding:14px;font-size:10px';
    } else {
      const note = el(w.icHost, 'div', null, 'Whatever is here may still be rescued — drag it out. It will be gone for good when something else is discarded.');
      note.style.cssText = 'padding:6px 10px;font-size:9px;border-bottom:1px dashed #000';
      kids.forEach(k => { const ic = this.makeIcon(k); ic.style.top = (k.pos.y + 34) + 'px'; w.icHost.appendChild(ic); });
    }
    w.icHost.style.width = '300px'; w.icHost.style.height = '130px';
  },

  discard(item){
    if (item.openState){
      Dialogs.alert('“' + esc(item.name) + '” is open at the moment. Please put it away first; the Lisa would not like to discard something you are still working on.');
      return;
    }
    if (['profile', 'waste', 'clip'].indexOf(item.kind) >= 0){
      Dialogs.alert('The Lisa needs “' + esc(item.name) + '” and would rather not throw it away.');
      return;
    }
    const prior = childrenOf('waste');
    prior.forEach(p => { deleteItemDeep(p); });
    const oldParent = item.parent;
    item.parent = 'waste';
    item.pos = { x: 10, y: 8 };
    item.home = null;
    this.renderContainer(oldParent);
    const w = Wins.byItem('waste');
    if (w) this.renderWaste(w);
    Sound.click();
    if (!G.flags.wasteExplained){
      G.flags.wasteExplained = true;
      Dialogs.alert('“' + esc(item.name) + '” has been placed in the Wastebasket. It will wait there patiently, and you may take it back at any time — until the next thing is discarded, when the Wastebasket will quietly make room.');
    }
    State.dirty();
  },

  /* ---------- stationery ---------- */
  tearPad(pad){
    const cid = pad.parent;
    const doc = {
      id: uid(), kind: 'doc', tool: pad.tool, parent: cid,
      pos: this.findFreeSlot(cid),
      name: uniqueName('Untitled', cid),
      content: pad.template ? deepCopy(pad.template) : Tools.defs[pad.tool].blank(),
      created: simNow().toISOString(), modified: simNow().toISOString(),
      openState: null, home: null, win: null
    };
    FS[doc.id] = doc;
    Sound.tear();
    // the tear: a little sheet flies from the pad to the new icon
    const host = this.hostFor(cid);
    if (host){
      const bit = hel(host, 'div', 'tearBit', iconSVG({ kind: 'doc', tool: pad.tool }));
      bit.style.left = pad.pos.x + 12 + 'px'; bit.style.top = pad.pos.y + 'px';
      requestAnimationFrame(() => {
        bit.style.transform = 'translate(' + (doc.pos.x - pad.pos.x) + 'px,' + (doc.pos.y - pad.pos.y) + 'px) rotate(8deg)';
      });
      setTimeout(() => {
        bit.remove();
        this.renderContainer(cid);
        this.select(doc.id);
        const ic = stage.querySelector('.icon[data-id="' + doc.id + '"]');
        if (ic) this.beginRename(doc, ic.querySelector('.lbl'));
      }, 340);
    } else {
      this.renderContainer(cid);
    }
    State.dirty();
    return doc;
  },

  tearFolder(padItem){
    const cid = padItem.parent;
    const f = {
      id: uid(), kind: 'folder', tool: null, parent: cid,
      pos: this.findFreeSlot(cid), name: uniqueName('Empty Folder', cid),
      created: simNow().toISOString(), modified: simNow().toISOString(),
      openState: null, home: null, win: null
    };
    FS[f.id] = f;
    Sound.tear();
    this.renderContainer(cid);
    this.select(f.id);
    const ic = stage.querySelector('.icon[data-id="' + f.id + '"]');
    if (ic) this.beginRename(f, ic.querySelector('.lbl'));
    State.dirty();
  },

  /* ---------- documents ---------- */
  async openDoc(item){
    const existing = Wins.byItem(item.id);
    if (existing){ existing.show(); item.openState = 'open'; this.renderAll(); return; }
    if (item.password){
      let tries = 0, ok = false;
      while (tries < 3){
        const p = await Dialogs.prompt('“' + esc(item.name) + '” is protected by a password. Please type it, and the document will open.', { password: true, label: 'Password:' });
        if (p === null) return;
        if (p === item.password){ ok = true; break; }
        tries++;
        if (tries < 3) await Dialogs.alert('That is not quite the password this document remembers. Please try again.');
      }
      if (!ok){
        await Dialogs.alert('The password still does not match. The document will keep itself closed for now; perhaps the password will come to mind later.');
        return;
      }
    }
    this.createDocWindow(item, true);
  },

  createDocWindow(item, activate){
    const def = Tools.defs[item.tool];
    const n = Wins.list.length % 6;
    const rect = item.win && item.win.w ? { x: item.win.x, y: item.win.y, w: item.win.w, h: item.win.h }
      : { x: def.rect.x + n * 14, y: def.rect.y + n * 10, w: def.rect.w, h: def.rect.h };
    const w = new LisaWindow({ item, kind: 'doc', rect, hasV: def.hasV !== false, hasH: !!def.hasH, grow: def.grow !== false });
    item._saved = deepCopy(item.content);
    w.tool = Tools.make(item, w);
    w.menus = () => Tools.menus(item, w);
    w.onResize = () => { if (w.tool.layout) w.tool.layout(); w.syncScroll(); };
    item.openState = 'open';
    if (item.win && item.win.view && w.tool.setView) w.tool.setView(item.win.view);
    w.restoreScroll();
    this.renderAll();
    MenuBar.refresh();
    State.dirty();
    return w;
  },

  setAside(w){
    if (!w || w.kind !== 'doc' && w.kind !== 'container' && w.kind !== 'special') return;
    const item = w.item;
    if (w.kind === 'doc'){
      w.persist();
      w.hide();
      item.openState = 'aside';
      if (item.parent !== 'desktop'){
        item.home = item.parent;
        item.parent = 'desktop';
        item.pos = this.findAsideSlot();
      }
    } else {
      // containers and the clipboard simply close
      w.persist();
      w.destroy();
      item.openState = null;
    }
    this.renderAll();
    State.dirty();
  },

  setAsideEverything(){
    Wins.list.slice().forEach(w => this.setAside(w));
  },

  saveContinue(w){
    const item = w.item;
    if (w.tool && w.tool.flush) w.tool.flush();
    item._saved = deepCopy(item.content);
    item.modified = simNow().toISOString();
    Dialogs.note('Saving “' + esc(item.name) + '”…', 800);
    State.save();
  },

  savePutAway(w){
    const item = w.item;
    if (w.kind === 'doc'){
      if (w.tool && w.tool.flush) w.tool.flush();
      item.modified = simNow().toISOString();
    }
    w.persist();
    w.destroy();
    item.openState = null;
    if (item.home){ item.parent = item.home; item.home = null; item.pos = this.findFreeSlot(item.parent); }
    this.renderAll();
    State.save();
  },

  async revert(w){
    const item = w.item;
    const v = await Dialogs.ask('Should “' + esc(item.name) + '” go back to the way it was when it was last saved? The changes made since then would be gently forgotten.',
      [{ label: 'Keep Working', value: false, cancel: true }, { label: 'Revert', value: true, def: true }]);
    if (!v) return;
    item.content = deepCopy(item._saved || item.content);
    if (w.tool && w.tool.refresh) w.tool.refresh();
    State.dirty();
  },

  duplicate(item){
    if (!item) return;
    if (['profile', 'waste', 'clip', 'diskette'].indexOf(item.kind) >= 0){
      Dialogs.alert('The Lisa can duplicate documents, folders and pads, but “' + esc(item.name) + '” is one of a kind.');
      return;
    }
    const copy = this.cloneItem(item, item.parent);
    copy.pos = this.findFreeSlot(item.parent);
    this.renderContainer(item.parent);
    this.select(copy.id);
    State.dirty();
  },

  makePad(item){
    if (!item || item.kind !== 'doc'){
      Dialogs.alert('To make a stationery pad, first select a document. The pad will then tear off sheets already set up just like it.');
      return;
    }
    const w = Wins.byItem(item.id);
    if (w && w.tool && w.tool.flush) w.tool.flush();
    const pad = {
      id: uid(), kind: 'pad', tool: item.tool, parent: item.parent,
      pos: this.findFreeSlot(item.parent),
      name: uniqueName(item.name + ' Pad', item.parent),
      template: deepCopy(item.content),
      created: simNow().toISOString(), modified: simNow().toISOString(),
      openState: null, home: null, win: null
    };
    FS[pad.id] = pad;
    this.renderContainer(item.parent);
    this.select(pad.id);
    Dialogs.alert('A stationery pad has been made from “' + esc(item.name) + '”. Every sheet torn from it will begin exactly as that document is now.');
    State.dirty();
  },

  /* ---------- menus ---------- */
  desktopMenus(){
    const sel = this.sel ? itemById(this.sel) : null;
    const name = sel ? '“' + sel.name + '”' : '';
    const anyOpen = Wins.list.length > 0;
    const diskette = Object.values(FS).find(i => i.kind === 'diskette');
    const activeContainer = Wins.active && (Wins.active.kind === 'container' || Wins.active.kind === 'special') ? Wins.active : null;
    return [
      { title: 'File/Print', items: [
        { label: 'Set Aside Everything', cmd: 'setAsideAll', enabled: anyOpen },
        { label: activeContainer ? 'Set Aside ' + '“' + activeContainer.item.name + '”' : 'Set Aside', cmd: 'setAside', enabled: !!activeContainer },
        { sep: true },
        { label: sel ? 'Open ' + name : 'Open', cmd: 'open', enabled: !!sel, key: 'O' },
        { label: 'Duplicate', cmd: 'duplicate', enabled: !!sel, key: 'D' },
        { label: 'Make Stationery Pad', cmd: 'makePad', enabled: !!sel && sel.kind === 'doc' },
        { label: 'Tear Off Stationery', cmd: 'tearOff', enabled: !!sel && (sel.kind === 'pad' || sel.kind === 'folderpad') },
        { sep: true },
        { label: sel ? 'Attributes of ' + name + '…' : 'Attributes…', cmd: 'attributes', enabled: !!sel },
        { label: sel ? 'Print ' + name + '…' : 'Print…', cmd: 'print', enabled: !!sel && sel.kind === 'doc' },
        { sep: true },
        { label: 'Save & Put Away', cmd: 'savePutAway', enabled: !!sel && sel.openState === 'aside' }
      ]},
      { title: 'Edit', items: [
        { label: 'Undo Last Change', cmd: 'undo', enabled: false, key: 'Z' },
        { sep: true },
        { label: 'Cut', cmd: 'cut', enabled: false, key: 'X' },
        { label: 'Copy', cmd: 'copy', enabled: false, key: 'C' },
        { label: 'Paste', cmd: 'paste', enabled: false, key: 'V' },
        { label: 'Clear', cmd: 'clear', enabled: false },
        { sep: true },
        { label: 'Select All Icons', cmd: 'selectAll', enabled: false, key: 'A' }
      ]},
      { title: 'Housekeeping', items: [
        { label: 'Straighten Up Icons', cmd: 'straighten' },
        { label: 'Empty the Wastebasket', cmd: 'emptyWaste' },
        { sep: true },
        { label: 'Insert a Diskette', cmd: 'insertDisk', enabled: !diskette },
        { label: 'Put Away the Diskette', cmd: 'ejectDisk', enabled: !!diskette },
        { label: 'Repair the Diskette…', cmd: 'repairDisk', enabled: !!diskette },
        { sep: true },
        { label: 'Erase the ProFile…', cmd: 'eraseProfile' }
      ]}
    ];
  }
};

function deleteItemDeep(item){
  childrenOf(item.id).forEach(c => deleteItemDeep(c));
  const w = Wins.byItem(item.id);
  if (w) w.destroy();
  delete FS[item.id];
}
function usedK(diskId){
  let sum = diskId === 'profile' ? 1180 : 12; // the system keeps a little for itself
  const walk = cid => childrenOf(cid).forEach(c => {
    if (c.kind === 'folder') walk(c.id); else sum += computeSizeK(c);
  });
  walk(diskId);
  // desktop items belong to the ProFile
  if (diskId === 'profile') childrenOf('desktop').forEach(c => {
    if (['profile','waste','clip','diskette'].indexOf(c.kind) < 0) sum += computeSizeK(c);
  });
  return sum;
}

/* ============================================================
   Attributes — never “Get Info”
   ============================================================ */
function showAttributes(item){
  Dialogs.custom((d, done) => {
    const created = item.created ? fmtDateTime(new Date(item.created)) : 'June 14, 1983  9:04 AM';
    const modified = item.modified ? fmtDateTime(new Date(item.modified)) : created;
    let sizeLine;
    if (item.kind === 'profile') sizeLine = usedK('profile') + 'K in use of 5,120K. A full five megabytes — the ProFile mentions this to everyone.';
    else if (item.kind === 'diskette') sizeLine = usedK(item.id) + 'K in use of 400K.';
    else if (item.kind === 'waste') sizeLine = 'The Wastebasket never quite fills up. Contents may settle during shipping.';
    else if (item.kind === 'clip') sizeLine = Clip.c ? 'Holding one thing, carefully.' : 'Empty at the moment.';
    else sizeLine = computeSizeK(item) + 'K on the disk.';
    let rows =
      '<div class="dtxt"><b>' + esc(item.name) + '</b><br><br>' +
      'Kind: ' + esc(kindLabel(item)) + '<br>' +
      'Size: ' + sizeLine + '<br>' +
      'Where: ' + esc(whereLabel(item)) + '<br>' +
      'Created: ' + esc(created) + '<br>' +
      'Last changed: ' + esc(modified) + '</div>';
    hel(d, 'div', null, rows);
    let pw = null;
    if (item.kind === 'doc'){
      pw = hel(d, 'div', 'drow', '<span class="chkbox' + (item.password ? ' on' : '') + '"><span class="bx"></span><span>Protect this document with a password</span></span>');
      pw.querySelector('.chkbox').addEventListener('click', async ev => {
        const box = ev.currentTarget;
        if (item.password){
          item.password = null; box.classList.remove('on');
          State.dirty();
        } else {
          const p = await Dialogs.prompt('Please choose a password for “' + esc(item.name) + '”. The document will ask for it, politely but firmly, whenever it is opened.', { password: true, label: 'Password:' });
          if (p){ item.password = p; box.classList.add('on'); State.dirty(); }
        }
      });
    }
    const btns = el(d, 'div', 'dbtns');
    const ok = el(btns, 'button', 'lbtn def', 'OK');
    ok.onclick = () => done(true);
    d._key = ev => { if (ev.key === 'Enter'){ ok.click(); return true; } return false; };
  });
}

/* ============================================================
   Printing, diskettes, erasing — narrated politely
   ============================================================ */
function printItem(item){
  const n = Dialogs.narrate('The Lisa is preparing “' + esc(item.name) + '” for the printer…');
  setTimeout(() => n.set('Printing “' + esc(item.name) + '” — page 1 of 1…'), 1100);
  setTimeout(() => {
    n.close();
    Dialogs.alert('“' + esc(item.name) + '” has been printed. The Lisa hopes it looks as handsome on paper as it does on the screen.');
  }, 2400);
}

function insertDiskette(){
  if (Object.values(FS).find(i => i.kind === 'diskette')){
    Dialogs.alert('A diskette is already in the drive. The Lisa has only the one drive, and it is spoken for.');
    return;
  }
  Sound.insertS();
  G.insertCount = (G.insertCount || 0) + 1;
  const proceed = () => {
    const d = {
      id: uid(), kind: 'diskette', tool: null, parent: 'desktop',
      pos: { x: 576, y: 8 }, name: 'Office Diskette',
      created: simNow().toISOString(), modified: simNow().toISOString(),
      openState: null, home: null, win: null
    };
    FS[d.id] = d;
    Desk.renderContainer('desktop');
    State.dirty();
  };
  if (G.insertCount === 2 && !G.flags.repairShown){
    G.flags.repairShown = true;
    Dialogs.ask('The diskette needs minor repairs. Do you want to repair it? (Its faded stripes suggest it once passed through the Twiggy drive of a Lisa 1 — it has led an interesting life.)',
      [{ label: 'Eject It', value: false }, { label: 'Repair It', value: true, def: true }]).then(v => {
        if (!v){ Sound.ejectS(); return; }
        const n = Dialogs.narrate('The Lisa is repairing the diskette. This will take only a moment, and the diskette will be grateful…');
        setTimeout(() => { n.close(); proceed(); }, 1800);
      });
  } else {
    proceed();
  }
}

function ejectDiskette(){
  const d = Object.values(FS).find(i => i.kind === 'diskette');
  if (!d) return;
  const openChild = Object.values(FS).find(i => i.openState && diskOf(i) === d.id);
  if (openChild){
    Dialogs.alert('A document from the diskette is still open. Please put it away first, so the diskette may leave with everything it arrived with.');
    return;
  }
  const w = Wins.byItem(d.id);
  if (w) w.destroy();
  deleteItemDeep(d);
  Sound.ejectS();
  Desk.renderContainer('desktop');
  Dialogs.note('The diskette has been put away.', 1300);
  State.dirty();
}

function repairDiskette(){
  const n = Dialogs.narrate('The Lisa is looking the diskette over…');
  setTimeout(() => {
    n.close();
    Dialogs.alert('The diskette appears to be in fine health. No repairs are needed today.');
  }, 1400);
}

async function eraseProfile(){
  const v1 = await Dialogs.ask('You are asking the Lisa to erase the ProFile. Every document, every folder, every stationery pad — the entire office — would be gone, permanently and completely. This is not a small thing.',
    [{ label: 'Keep Everything', value: false, def: true, cancel: true }, { label: 'Continue…', value: true }]);
  if (!v1) return;
  const v2 = await Dialogs.ask('The Lisa asks once more, to be quite certain: erase the ProFile and lose everything on it?',
    [{ label: 'Keep Everything', value: false, def: true, cancel: true }, { label: 'Erase the ProFile', value: true }]);
  if (!v2) return;
  const n = Dialogs.narrate('The Lisa is erasing the ProFile. It was a pleasure keeping your things…');
  Sound.hum(false);
  setTimeout(() => {
    State.reset();
    location.reload();
  }, 2200);
}

/* ============================================================
   Command dispatch
   ============================================================ */
const Commands = {
  run(cmd, arg){
    const w = Wins.active;
    // give the active tool first refusal
    if (w && w.tool && w.tool.command && w.tool.command(cmd, arg)) { State.dirty(); return; }
    const sel = Desk.sel ? itemById(Desk.sel) : null;
    switch (cmd){
      case 'open': if (sel) Desk.openItem(sel); break;
      case 'setAside': if (w) Desk.setAside(w); break;
      case 'setAsideAll': Desk.setAsideEverything(); break;
      case 'saveContinue': if (w && w.kind === 'doc') Desk.saveContinue(w); break;
      case 'savePutAway':
        if (w && (w.kind === 'doc' || w.kind === 'container' || w.kind === 'special')) Desk.savePutAway(w);
        else if (sel && sel.openState === 'aside'){
          // an aside icon put away from the desktop
          const hw = Wins.byItem(sel.id);
          if (hw) { Desk.savePutAway(hw); }
          else { sel.openState = null; if (sel.home){ sel.parent = sel.home; sel.home = null; sel.pos = Desk.findFreeSlot(sel.parent); } Desk.renderAll(); State.dirty(); }
        }
        break;
      case 'revert': if (w && w.kind === 'doc') Desk.revert(w); break;
      case 'duplicate': if (sel) Desk.duplicate(sel); break;
      case 'makePad': if (w && w.kind === 'doc') Desk.makePad(w.item); else Desk.makePad(sel); break;
      case 'tearOff': if (sel && sel.kind === 'pad') Desk.tearPad(sel); else if (sel && sel.kind === 'folderpad') Desk.tearFolder(sel); break;
      case 'attributes': showAttributes(w && w.kind === 'doc' ? w.item : (sel || itemById('profile'))); break;
      case 'print': printItem(w && w.kind === 'doc' ? w.item : sel); break;
      case 'straighten': Desk.straighten(Wins.active && Wins.active.kind === 'container' ? Wins.active.item.id : 'desktop'); break;
      case 'insertDisk': insertDiskette(); break;
      case 'ejectDisk': ejectDiskette(); break;
      case 'repairDisk': repairDiskette(); break;
      case 'emptyWaste':
        Dialogs.alert('The Lisa’s Wastebasket empties itself: whatever rests inside is kept until the next thing is discarded, and then it quietly makes room. There is nothing you need to do — which is, the Lisa feels, how housekeeping ought to work.');
        break;
      case 'eraseProfile': eraseProfile(); break;
      case 'paste':
        if (Clip.c) Dialogs.alert('The Clipboard is holding something, but it can only be pasted into an open document.');
        break;
      default: break;
    }
  }
};
/* ============================================================
   The tool framework — tools are invisible plumbing
   ============================================================ */
const Tools = {
  defs: {},
  impls: {},
  register(id, def, impl){ this.defs[id] = def; this.impls[id] = impl; },
  make(item, win){ return new (this.impls[item.tool])(item, win); },
  menus(item, win){
    const t = win.tool || {};
    const trees = [];
    trees.push({ title: 'File/Print', items: [
      { label: 'Set Aside Everything', cmd: 'setAsideAll' },
      { label: 'Set Aside “' + item.name + '”', cmd: 'setAside' },
      { sep: true },
      { label: 'Save & Continue', cmd: 'saveContinue', key: 'S', enabled: item.kind === 'doc' },
      { label: 'Save & Put Away', cmd: 'savePutAway' },
      { label: 'Revert to Previous Version', cmd: 'revert', enabled: item.kind === 'doc' },
      { sep: true },
      { label: 'Format for the Printer…', cmd: 'print' },
      { label: 'Print As Is…', cmd: 'print', key: 'P' },
      { sep: true },
      { label: 'Attributes of “' + item.name + '”…', cmd: 'attributes' }
    ]});
    trees.push({ title: 'Edit', items: [
      { label: 'Undo Last Change', cmd: 'undo', key: 'Z', enabled: () => !!(t.canUndo && t.canUndo()) },
      { sep: true },
      { label: 'Cut', cmd: 'cut', key: 'X', enabled: () => !!(t.canCopy && t.canCopy()) },
      { label: 'Copy', cmd: 'copy', key: 'C', enabled: () => !!(t.canCopy && t.canCopy()) },
      { label: 'Paste', cmd: 'paste', key: 'V', enabled: () => !!(t.canPaste && t.canPaste(Clip.c)) },
      { label: 'Clear', cmd: 'clear', enabled: () => !!(t.canCopy && t.canCopy()) },
      { sep: true },
      { label: 'Select All', cmd: 'selectAll', key: 'A', enabled: () => !!t.selectAll }
    ]});
    (t.menus ? t.menus() : []).forEach(x => trees.push(x));
    return trees;
  }
};

/* ============================================================
   LisaWrite — WYSIWYG proportional text, 1983
   ============================================================ */
Tools.register('write', {
  name: 'LisaWrite',
  rect: { x: 64, y: 34, w: 470, h: 305 },
  blank(){ return { html: '', mL: 34, mR: 34, tabs: [120, 220] }; }
}, class LisaWrite {
  constructor(item, win){
    this.item = item; this.win = win;
    const c = item.content;
    const wrap = el(win.innerEl, 'div');
    wrap.style.cssText = 'display:flex;flex-direction:column;height:100%';
    this.ruler = el(wrap, 'div', 'wr-ruler');
    this.scroll = el(wrap, 'div', 'wr-scroll');
    win.scrollEl = this.scroll;
    this.page = el(this.scroll, 'div', 'wr-page');
    this.edit = el(this.page, 'div', 'wr-edit');
    this.edit.contentEditable = 'true';
    this.edit.spellcheck = false;
    this.edit.innerHTML = c.html || '';
    this.breaks = el(this.page, 'div');
    this.edit.addEventListener('input', () => { this.layoutBreaks(); State.dirty(); });
    this.edit.addEventListener('mousedown', e => e.stopPropagation());
    this.edit.addEventListener('keydown', e => {
      e.stopPropagation();
      if ((e.metaKey || e.ctrlKey)){
        const k = e.key.toLowerCase();
        const map = { b: 'bold', i: 'italic', u: 'underline', z: 'undo', x: 'cut', c: 'copy', v: 'paste', a: 'selectAll', s: 'saveContinue' };
        if (map[k]){ e.preventDefault(); Commands.run(map[k]); return; }
      }
      if (e.key === 'Tab'){
        e.preventDefault();
        document.execCommand('insertHTML', false, '  ');
      }
    });
    this.buildRuler();
    this.applyMargins();
    setTimeout(() => this.layoutBreaks(), 50);
    win.onResize = () => { this.buildRuler(); this.layoutBreaks(); win.syncScroll(); };
  }
  buildRuler(){
    const c = this.item.content, r = this.ruler;
    r.innerHTML = '';
    el(r, 'div', 'ticks');
    const w = this.win.rect.w - 20;
    for (let i = 0; i * 72 < w; i++){
      const n = el(r, 'span', 'num', String(i));
      n.style.left = (i * 72 + 2) + 'px';
    }
    const mL = el(r, 'div', 'wr-mark mL'); mL.style.left = c.mL + 'px';
    const mR = el(r, 'div', 'wr-mark mR'); mR.style.left = (w - c.mR) + 'px';
    const self = this;
    mL.addEventListener('mousedown', e => {
      e.stopPropagation();
      const v0 = c.mL;
      drag(e, { move(dx){ c.mL = clamp(v0 + dx, 4, 160); mL.style.left = c.mL + 'px'; self.applyMargins(); }, up(){ State.dirty(); } });
    });
    mR.addEventListener('mousedown', e => {
      e.stopPropagation();
      const v0 = c.mR;
      drag(e, { move(dx){ c.mR = clamp(v0 - dx, 4, 160); mR.style.left = (w - c.mR) + 'px'; self.applyMargins(); }, up(){ State.dirty(); } });
    });
    (c.tabs || []).forEach((tx, i) => {
      const t = el(r, 'div', 'wr-tab', '⊥');
      t.style.left = tx + 'px';
      t.title = 'Click to remove this tab stop';
      t.addEventListener('mousedown', e => {
        e.stopPropagation();
        c.tabs.splice(i, 1);
        self.buildRuler(); State.dirty();
      });
    });
    r.addEventListener('mousedown', e => {
      if (e.target !== r && !e.target.classList.contains('ticks') && !e.target.classList.contains('num')) return;
      e.stopPropagation();
      const p = pt(e);
      const rr = r.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      const x = p.x - (rr.left - sr.left) / (sr.width / 720);
      c.tabs = c.tabs || [];
      c.tabs.push(Math.round(x));
      c.tabs.sort((a, b) => a - b);
      self.buildRuler(); State.dirty();
    });
  }
  applyMargins(){
    const c = this.item.content;
    this.edit.style.paddingLeft = c.mL + 'px';
    this.edit.style.paddingRight = c.mR + 'px';
  }
  layoutBreaks(){
    this.breaks.innerHTML = '';
    const pageH = 264;
    const h = this.edit.scrollHeight;
    for (let i = 1; i * pageH < h; i++){
      const b = el(this.breaks, 'div', 'wr-break');
      b.style.top = (i * pageH) + 'px';
      hel(b, 'span', null, 'page ' + i + ' ends');
    }
    this.win.syncScroll();
  }
  flush(){ this.item.content.html = this.edit.innerHTML; }
  refresh(){ this.edit.innerHTML = this.item.content.html || ''; this.applyMargins(); this.layoutBreaks(); }
  canUndo(){ return true; }
  canCopy(){

  }
  canPaste(c){ return !!c; }
  selectAll(){
    const r = document.createRange();
    r.selectNodeContents(this.edit);
