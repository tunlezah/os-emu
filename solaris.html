    { pid: 131, ppid: 1, cmd: "/usr/sbin/inetd -s", stime: "09:12", tty: "?", time: "0:00" },
    { pid: 141, ppid: 1, cmd: "/usr/lib/nfs/statd", stime: "09:12", tty: "?", time: "0:00" },
    { pid: 156, ppid: 1, cmd: "/usr/sbin/syslogd", stime: "09:12", tty: "?", time: "0:00" },
    { pid: 168, ppid: 1, cmd: "/usr/sbin/cron", stime: "09:12", tty: "?", time: "0:00" },
    { pid: 174, ppid: 1, cmd: "/usr/lib/autofs/automountd", stime: "09:12", tty: "?", time: "0:00" },
    { pid: 187, ppid: 1, cmd: "/usr/lib/sendmail -bd -q15m", stime: "09:12", tty: "?", time: "0:00" },
    { pid: 201, ppid: 1, cmd: "/usr/lib/lpsched", stime: "09:12", tty: "?", time: "0:00" },
    { pid: 214, ppid: 1, cmd: "/usr/sbin/vold", stime: "09:12", tty: "?", time: "0:00" },
    { pid: 226, ppid: 1, cmd: "/usr/lib/inet/xntpd", stime: "09:12", tty: "?", time: "0:00" },
    { pid: 281, ppid: 1, cmd: "/usr/dt/bin/dtlogin -daemon", stime: "09:12", tty: "?", time: "0:02" },
    { pid: 284, ppid: 281, cmd: "/usr/openwin/bin/Xsun :0 -nobanner -dev /dev/fb0 defclass PseudoColor",
      stime: "09:12", tty: "?", time: "1:47" },
    { pid: 297, ppid: 281, cmd: "/usr/dt/bin/dtsession", stime: "09:14", tty: "?", time: "0:09" },
    { pid: 301, ppid: 297, cmd: "/usr/dt/bin/ttsession -s", stime: "09:14", tty: "?", time: "0:01" },
    { pid: 304, ppid: 297, cmd: "/usr/dt/bin/dtwm", stime: "09:14", tty: "?", time: "0:22" },
    { pid: 312, ppid: 297, cmd: "/usr/dt/bin/dtexec -open 0 -ttprocid ...", stime: "09:14", tty: "?", time: "0:00" }
  ];
  function table() {
    const rows = BASE.slice();
    for (const w of Wm.all()) {
      const app = Apps.get(w.appId);
      rows.push({ pid: pid(w.id), ppid: 297, tty: "?", stime: "09:" + pad2(15 + (pid(w.id) % 40)),
        time: "0:0" + (pid(w.id) % 9), cmd: (app && app.exec ? app.exec : w.appId) +
          (w.state && w.state.path ? " " + w.state.path : "") });
    }
    rows.push({ pid: 921, ppid: 297, tty: "pts/4", stime: "09:31", time: "0:00", cmd: "/bin/ksh" });
    return rows.sort((a, b) => a.pid - b.pid);
  }
  return { table, pid };
})();

const Shell = (() => {

/* ==========================================================================
   MODULE 16 — INPUT ROUTING
   --------------------------------------------------------------------------
   Every keystroke that reaches a program goes through here, so that dtwm can
   take its accelerators first, exactly as a window manager does.
   ========================================================================== */
const Keys = (() => {
  function editable(t) {
    return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
  }
  function init() {
    window.addEventListener("keydown", e => {
      if (e.target && e.target.closest && (e.target.closest("#guide") || e.target.closest(".ovl"))) return;
      const w = Wm.focusedWin();
      /* dtwm accelerators */
      if (e.altKey && /^F(3|4|5|7|8|9|10)$/.test(e.key) && w) {
        e.preventDefault();
        if (e.key === "F4") Wm.close(w);
        else if (e.key === "F9") Wm.minimize(w);
        else if (e.key === "F10") Wm.toggleMax(w);
        else if (e.key === "F3") Wm.lower(w);
        else if (e.key === "F5") Wm.restore(w);
        return;
      }
      if (e.ctrlKey && e.altKey && /^[1-8]$/.test(e.key)) { e.preventDefault();
        Session.switchTo(+e.key - 1); return; }
      if (editable(e.target)) return;
      if (w && w.api && w.api.key) { if (w.api.key(e) !== false) e.preventDefault(); }
    });
  }
  return { init, editable };
})();

        renderVi(); return; }
      switch (K) {
        case "h": case "ArrowLeft": vi.c = Math.max(0, vi.c - 1); break;
        case "l": case "ArrowRight": vi.c = Math.min(L().length, vi.c + 1); break;
        case "j": case "ArrowDown": dn(); break;
        case "k": case "ArrowUp": up(); break;
        case "0": case "Home": vi.c = 0; break;
        case "$": case "End": vi.c = Math.max(0, L().length - 1); break;
        case "G": vi.r = vi.lines.length - 1; vi.c = 0; break;
        case "i": vi.ins = true; break;
        case "a": vi.ins = true; vi.c = Math.min(L().length, vi.c + 1); break;
        case "A": vi.ins = true; vi.c = L().length; break;
        case "I": vi.ins = true; vi.c = 0; break;
        case "o": vi.lines.splice(vi.r + 1, 0, ""); vi.r++; vi.c = 0; vi.ins = true; vi.dirty = true; break;
        case "O": vi.lines.splice(vi.r, 0, ""); vi.c = 0; vi.ins = true; vi.dirty = true; break;
        case "x": { const l = L(); vi.lines[vi.r] = l.slice(0, vi.c) + l.slice(vi.c + 1); vi.dirty = true; break; }
        case "d": vi.pending = "d"; break;
        case ":": vi.cmd = ""; break;
        case "PageDown": vi.r = Math.min(vi.lines.length - 1, vi.r + rows - 2); break;
        case "PageUp": vi.r = Math.max(0, vi.r - rows + 2); break;
        case "Escape": break;
        default: if (K.length === 1 && !"hjkl".includes(K)) vi.msg = ""; break;

    }
    function runEx(cmd) {
      const c = cmd.trim();
      const save = p => { const path = p || vi.path;
        if (!path) { vi.msg = "E32: No file name"; return false; }
        VFS.put(path, vi.lines.join("\n") + "\n", sh.cwd);
        vi.path = VFS.norm(path, sh.cwd); vi.dirty = false;
        vi.msg = '"' + vi.path + '" ' + vi.lines.length + " lines, " +
          (vi.lines.join("\n").length + 1) + " characters";
        Bus.emit("dtwmrc-maybe", vi.path);
        return true; };
      const quit = () => { mode = "shell"; vi = null; outln(); prompt(); };
      if (/^w$/.test(c)) save();
      else if (/^w\s+\S+$/.test(c)) save(c.split(/\s+/)[1]);
      else if (/^wq$|^x$/.test(c)) { if (save()) quit(); }
      else if (/^q!$/.test(c)) quit();

      else if (/^\d+$/.test(c)) { vi.r = clamp(+c - 1, 0, vi.lines.length - 1); }

    /* ---- shell key handling ------------------------------------------ */
    async function submit() {
      const line = input;
      out(line + "\n");
      input = ""; cursor = 0; histIdx = -1;
      mode = "busy"; render();
      let res;
      try { res = await sh.exec(line); } catch (err) { res = String(err); }
      if (mode === "pager" || mode === "vi") return;
      mode = "shell";
      if (res !== null && res !== undefined && res !== "") out(String(res) + (String(res).endsWith("\n") ? "" : "\n"));
      prompt();
    }
    function key(e) {
      if (mode === "vi") { viKey(e); return true; }
      if (mode === "pager") {
        if (e.key === "q" || e.key === "Escape") { mode = "shell"; pager = null; outln(); prompt(); }
        else if (e.key === " " || e.key === "PageDown") { pager.at += rows - 1;
          if (pager.at >= pager.lines.length) { mode = "shell"; pager = null; outln(); prompt(); } else render(); }
        else if (e.key === "Enter") { pager.at += 1;
          if (pager.at >= pager.lines.length) { mode = "shell"; pager = null; outln(); prompt(); } else render(); }
        else if (e.key === "b" || e.key === "PageUp") { pager.at = Math.max(0, pager.at - rows + 1); render(); }
        return true;
      }
      if (mode === "busy") { if (e.key === "c" && e.ctrlKey) { mode = "shell"; outln("^C"); prompt(); } return true; }
      const K = e.key;
      if (K === "Enter") { submit(); return true; }
      if (K === "Backspace") { if (cursor > 0) { input = input.slice(0, cursor - 1) + input.slice(cursor); cursor--; } }
      else if (K === "Delete") input = input.slice(0, cursor) + input.slice(cursor + 1);
      else if (K === "ArrowLeft") cursor = Math.max(0, cursor - 1);
      else if (K === "ArrowRight") cursor = Math.min(input.length, cursor + 1);
      else if (K === "Home" || (e.ctrlKey && K === "a")) cursor = 0;
      else if (K === "End" || (e.ctrlKey && K === "e")) cursor = input.length;
      else if (e.ctrlKey && K === "u") { input = ""; cursor = 0; }
      else if (e.ctrlKey && K === "l") { buf.length = 0; prompt(); return true; }
      else if (e.ctrlKey && K === "c") { out(input + "^C\n"); input = ""; cursor = 0; prompt(); return true; }
      else if (e.ctrlKey && K === "d") { if (!input) { out("\n"); Wm.close(win); return true; } }
      else if (K === "ArrowUp") { if (sh.hist.length) {
          histIdx = histIdx < 0 ? sh.hist.length - 1 : Math.max(0, histIdx - 1);
          input = sh.hist[histIdx] || ""; cursor = input.length; } }
      else if (K === "ArrowDown") { if (histIdx >= 0) { histIdx++;

            cursor += c.length - frag.length; } }

        input = input.slice(0, cursor) + K + input.slice(cursor); cursor++; Sound.key();
      } else return true;
      render();
      return true;
    }
    term.addEventListener("mousedown", () => Wm.focus(win));
    term.addEventListener("contextmenu", e => { e.preventDefault();
      Mw.popup([
        { label: "New Terminal", run: () => Exec.run("/usr/dt/bin/dtterm") },
        { label: "Clear", run: () => { buf.length = 0; prompt(); } },
        { sep: true },
        { label: "Help on dtterm", run: () => Help.open("Dtterm", "overview") }
      ], e.clientX, e.clientY); });

    /* first paint */
    setTimeout(() => { measure(); if (!buf.length) {
      if (st.cmd) { outln("$ " + st.cmd); sh.exec(st.cmd).then(r => {
        if (r) outln(String(r).replace(/\n$/, "")); prompt(); }); }
      else { outln("Last login: Mon Jul 21 09:14:22 from :0"); outln(); prompt(); }
    } else render(); }, 20);

    return {
      key: key,
      resized: () => { measure(); render(); },
      focused: () => { },
      state: () => ({ cwd: sh.cwd, buf: buf.slice(-120), input: input })
    };
  }
  Apps.register({
    id: "dtterm", title: "Terminal", icon: "dtterm", exec: "/usr/dt/bin/dtterm",
    w: 80 * CELL[0] + 16, h: 24 * CELL[1] + 40, minw: 260, minh: 140, cell: CELL,
    build: build,
    save: w => (w.api && w.api.state ? w.api.state() : {}),
    open: () => ({})
  });
})();

        { sep: true },

      { label: "Selected", mnem: "S", items: () => [

        { label: "By Tree", check: view === "tree", run: () => { view = "tree"; refresh(); } },
        { sep: true },
        { label: "Show Hidden Files", check: hidden, run: () => { hidden = !hidden; refresh(); } },
        { label: "Refresh", run: refresh }] },
      { label: "Help", mnem: "H", right: true, items: () => [

        { label: "Tasks", run: () => Help.open("Dtfile", "tasks") },
        { label: "On Item", run: () => Help.onItem() }] }
    ]);

    const upBtn = Mw.btn("Up", () => go(dir.replace(/\/[^/]*$/, "") || "/"), { w: 44 });
    const homeBtn = Mw.btn("Home", () => go("/export/home/" + Sys.user), { w: 52 });
    const top = el("div", { class: "rowf", style: { padding: "5px 6px", gap: "6px" } },

    win.cl.append(bar, el("div", { class: "m-etch-h", style: { margin: "0" } }), top, scroll, status);

    function go(p) {
      const t = VFS.norm(p, dir);

      if (!n) { Mw.error("File Manager", t + "\n\nis not a folder that exists."); pathField.value = dir; return; }
      if (n.t !== "d") { Dt.open(t, n); pathField.value = dir; return; }
      dir = t; sel = []; refresh();
      Session.persist();
    }
    function open(name) {
      const p = dir + (dir === "/" ? "" : "/") + name;
      const n = VFS.lookup(p, "/");
      if (!n) return;

        row("Name", p.split("/").pop()),
        row("Folder", p.replace(/\/[^/]*$/, "") || "/"),
        row("Type", Dt.typeName(p, n)),
        row("Size", VFS.size(n) + " bytes"),
        row("Owner", (n.own || "root") + " (" + (n.grp || "sys") + ")"),
        row("Permissions", n.t === "d" ? "drwxr-xr-x" : (n.mode || "-rw-r--r--")),
        row("Modified", fmtDate(new Date(n.mt || VFS.T0))),
        el("div", { class: "m-etch-h" }),
        el("div", { style: { whiteSpace: "pre-wrap", fontSize: "11px" } }, Dt.describe(p, n)));

        buttons: [{ label: "OK", def: true }, { label: "Help", close: false,

    }

        el("div", { style: { flex: "1 1 auto", wordBreak: "break-all" } }, v));
    }

    function entries() {
      let e = VFS.ls(dir, "/") || [];
      if (!hidden) e = e.filter(x => x.name[0] !== ".");
      e.sort((a, b) => (VFS.isDir(b.node) ? 1 : 0) - (VFS.isDir(a.node) ? 1 : 0) ||
        a.name.localeCompare(b.name));

            { label: "Print", run: () => Printers.print(selPaths()) },
            trashMode ? { label: "Put Back", run: () => { sel.forEach(x => Trash.putBack(x)); sel = []; refresh(); } }
              : { label: "Put in Trash", run: () => { selPaths().forEach(p => Trash.put(p)); sel = []; refresh(); } },
            { sep: true },

        DnD.draggable(ic, () => {

            icon: Dt.iconName(dir + "/" + name, node), label: name };
        });
        if (VFS.isDir(node)) DnD.target(ic, {
          accept: p => p.kind === "files" && !p.paths.includes(dir + "/" + name),

        if (!hidden) kids = kids.filter(x => x.name[0] !== ".");
        kids.sort((a, b) => (VFS.isDir(b.node) ? 1 : 0) - (VFS.isDir(a.node) ? 1 : 0) ||
          a.name.localeCompare(b.name));

        { sep: true },

        { label: "Refresh", run: refresh }

      state: () => ({ dir: dir, view: view, hidden: hidden, trash: trashMode })

    id: "dtfile", title: "File Manager", icon: "dtfile", exec: "/usr/dt/bin/dtfile",
    w: 620, h: 430, minw: 300, minh: 200, build: build,
    save: w => (w.api && w.api.state ? w.api.state() : {}),
    open: a => ({ dir: a })

  const DSET = new Set(DICT);

  function build(win, st) {
    st = st || {};
    let path = st.path ? VFS.norm(st.path, "/") : null;
    let dirty = false;
    let wrap = st.wrap !== false;
    const ta = el("div", { class: "dtxt", contenteditable: "true", spellcheck: "false" });
    const scroll = Mw.scrolled(ta, { h: !wrap });
    scroll.style.flex = "1 1 auto";
    scroll.style.background = "var(--tbg)";
    const status = el("div", { class: "fm-status" }, el("span"), el("span"));

    function setText(t) { ta.textContent = t; }
    function getText() { return ta.innerText.replace(/ /g, " ").replace(/\n$/, "") + "\n"; }
    function title() {
      win.setTitle((path ? path.split("/").pop() : "(UNTITLED)") + (dirty ? " (modified)" : "") +
        " - Text Editor");
      $$("span", status)[0].textContent = path || "(no file)";
      $$("span", status)[1].textContent = (dirty ? "modified" : "") +
        "   " + getText().split("\n").length + " lines";
    }
    function load(p) {
      const n = VFS.lookup(p, "/");
      if (!n || n.t !== "f") { Mw.error("Text Editor", "Cannot open\n\n    " + p); return; }
      path = p; setText(n.d); dirty = false; title(); Session.persist();
    }
    function save(p) {
      p = p || path;
      if (!p) { saveAs(); return; }
      VFS.put(p, getText(), "/");
      path = p; dirty = false; title();
      /* dtwmrc and .dtprofile are read by the desktop, so saving them means
         something.  That is the point of a configuration file. */
      if (/\.dt\/dtwmrc$/.test(p)) {
        Mw.info("Text Editor", "Saved " + p + ".\n\nPick \"Restart Workspace Manager\" from the\n" +
          "Workspace menu to make dtwm re-read it.", { w: 420 });
      }

    }
    function saveAs() {
      Mw.fileSelect({ title: "Save As", dir: path ? path.replace(/\/[^/]*$/, "") : "/export/home/" + Sys.user,
        file: path || "", selLabel: "Enter file name", app: win, onok: v => { if (v) save(VFS.norm(v, "/")); } });
    }
    function maybeDiscard(then) {
      if (!dirty) { then(); return; }
      Mw.ask("Text Editor", "This document has been modified.\nSave the changes first?",
        () => { save(); then(); }, () => then(), { yes: "Save", no: "Discard" });
    }
    function spell() {
      const words = getText().toLowerCase().match(/[a-z][a-z'-]*/g) || [];
      const bad = [];
      for (const w of words) {
        const base = w.replace(/'s$/, "").replace(/s$/, "");
        if (DSET.has(w) || DSET.has(base) || w.length < 3) continue;
        if (!bad.includes(w)) bad.push(w);
      }
      const lst = Mw.list(bad.length ? bad.map(b => ({ label: b })) : [{ label: "(no misspelled words found)" }]);
      lst.style.height = "170px";
      const body = el("div", { class: "colf", style: { gap: "6px" } },
        Mw.lab("Misspelled words"), lst,

          "Sun added the spell checker to dtpad; the base CDE 1.2 editor did not\nhave one. " +
          "It called /usr/bin/spell, whose dictionary was famously\nunimpressed by proper nouns."));

        buttons: [{ label: "OK", def: true }] });
    }
    const bar = Mw.menubar([
      { label: "File", mnem: "F", items: () => [
        { label: "New", mnem: "N", run: () => maybeDiscard(() => { path = null; setText(""); dirty = false; title(); }) },
        { label: "Open...", mnem: "O", run: () => maybeDiscard(() => Mw.fileSelect({ title: "Open a File",
            dir: path ? path.replace(/\/[^/]*$/, "") : "/export/home/" + Sys.user, app: win,
            onok: v => v && load(VFS.norm(v, "/")) })) },
        { label: "Include...", run: () => Mw.fileSelect({ title: "Include a File",
            dir: "/export/home/" + Sys.user, app: win, onok: v => { const n = VFS.lookup(v, "/");
              if (n && n.t === "f") { ta.textContent = getText() + n.d; dirty = true; title(); } } }) },
        { sep: true },
        { label: "Save", mnem: "S", run: () => save() },
        { label: "Save As...", mnem: "A", run: saveAs },
        { sep: true },
        { label: "Print...", mnem: "P", run: () => { if (path) Printers.print([path]);
            else Mw.error("Print", "Save the document first."); } },
        { sep: true },
        { label: "Close", mnem: "C", acc: "Alt+F4", run: () => Wm.close(win) }] },
      { label: "Edit", mnem: "E", items: () => [
        { label: "Undo", acc: "Ctrl+Z", run: () => document.execCommand("undo") },
        { sep: true },
        { label: "Cut", acc: "Shift+Del", run: () => document.execCommand("cut") },
        { label: "Copy", acc: "Ctrl+Ins", run: () => document.execCommand("copy") },
        { label: "Paste", acc: "Shift+Ins", run: () => document.execCommand("paste") },
        { sep: true },
        { label: "Select All", acc: "Ctrl+/", run: () => { const r = document.createRange();
            r.selectNodeContents(ta); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }] },
      { label: "Format", mnem: "r", items: () => [
        { label: "Wrap To Fit", check: wrap, run: () => { wrap = !wrap;
            ta.style.whiteSpace = wrap ? "pre-wrap" : "pre"; } },
        { label: "Paragraph...", dis: true },
        { label: "All...", dis: true }] },
      { label: "Options", mnem: "O", items: () => [
        { label: "Overstrike", dis: true },
        { label: "Word Wrap", check: wrap, run: () => { wrap = !wrap;
            ta.style.whiteSpace = wrap ? "pre-wrap" : "pre"; } },
        { sep: true },
        { label: "Spell...", mnem: "S", run: spell }] },
      { label: "Help", mnem: "H", right: true, items: () => [
        { label: "Overview", run: () => Help.open("Dtpad", "overview") },
        { label: "Tasks", run: () => Help.open("Dtpad", "tasks") }] }
    ]);
    win.cl.append(bar, el("div", { class: "m-etch-h", style: { margin: "0" } }), scroll, status);
    ta.addEventListener("input", () => { if (!dirty) { dirty = true; title(); } });
    ta.addEventListener("keydown", e => { Sound.key();
      if (e.ctrlKey && e.key === "s") { e.preventDefault(); save(); } });
    ta.style.whiteSpace = wrap ? "pre-wrap" : "pre";
    DnD.target(ta, { accept: p => p.kind === "files",
      drop: p => { DnD.note("ToolTalk: Edit(" + p.paths[0] + ")  ->  dtpad (this window)");
        maybeDiscard(() => load(p.paths[0])); } });

    if (path) load(path); else { setText(st.text || ""); title(); }
    if (st.caret) { }
    return {
      canClose: () => { if (!dirty) return true;
        Mw.ask("Text Editor", "This document has been modified.\nSave before closing?",
          () => { save(); Wm.close(win, true); }, () => Wm.close(win, true), { yes: "Save", no: "Discard" });
        return false; },
      resized: () => scroll.layout && scroll.layout(),
      state: () => ({ path: path, text: path ? undefined : getText(), wrap: wrap })
    };
  }
  Apps.register({
    id: "dtpad", title: "Text Editor", icon: "dtpad", exec: "/usr/dt/bin/dtpad",
    w: 560, h: 420, minw: 280, minh: 180, build: build,
    save: w => (w.api && w.api.state ? w.api.state() : {}),
    open: a => ({ path: a })
  });
})();

  function flags() { return State.get("mailflags", {}); }

      .filter(m => !m.del);
  }
  function markRead(id) { const f = flags(); f["r" + id] = true; State.set("mailflags", f); Bus.emit("mail"); }
  function del(id) { const f = flags(); f["d" + id] = true; State.set("mailflags", f); Bus.emit("mail"); }
  function unread() { return messages().filter(m => !m.read).length; }
  function sent() { return State.get("mailsent", []); }
  function send(msg) { const s = sent(); s.push(msg); State.set("mailsent", s); Bus.emit("mail"); }
  let pendingAttach = null;

    setTimeout(() => Bus.emit("mailcompose", paths), 60); }
  function takeAttach() { const p = pendingAttach; pendingAttach = null; return p; }
  return { messages, markRead, del, unread, send, sent, composeWith, takeAttach, SEED };

(function () {
  function build(win, st) {

    function rows() { return folder === "Inbox" ? Mail.messages()
      : Mail.sent().map((m, i) => Object.assign({}, m, { id: 1000 + i, read: true, from: m.to, date: m.date })); }
    function compose(prefill) {
      const to = Mw.field((prefill && prefill.to) || "", { w: 340 });
      const subj = Mw.field((prefill && prefill.subject) || "", { w: 340 });
      const txt = el("div", { class: "dtxt", contenteditable: "true", spellcheck: "false",

      const attachBox = el("div", { class: "rowf", style: { flexWrap: "wrap", gap: "6px", minHeight: "20px" } });
      const attachments = [];
      function addAttach(p) {
        if (attachments.includes(p)) return;
        attachments.push(p);
        const n = VFS.lookup(p, "/");
        attachBox.appendChild(el("div", { class: "m-out", style: { padding: "2px 5px", display: "flex",
          alignItems: "center", gap: "4px", background: "var(--bg)" } },

      }
      const body = el("div", { class: "colf", style: { gap: "5px" } },
        el("div", { class: "rowf" }, el("div", { style: { width: "60px" } }, "To"), to),
        el("div", { class: "rowf" }, el("div", { style: { width: "60px" } }, "Subject"), subj),
        el("div", { class: "m-etch-h" }),
        txt,
        el("div", { class: "rowf" }, el("div", { style: { width: "78px", font: "var(--uib)" } },
          "Attachments"), attachBox));
      const d = Mw.dialog({ title: "Compose Message", w: 520, h: 430, body: body, app: win,
        buttons: [
          { label: "Send", def: true, mnem: "S", run: () => {
              Mail.send({ to: to.value || "(nobody)", subject: subj.value || "(no subject)",
                body: txt.innerText, date: MON[Clock.now().getMonth()] + " " + Clock.now().getDate(),
                attach: attachments.slice() });
              DnD.note("ToolTalk: dtmail Send(" + (to.value || "(nobody)") + ")");
              Mw.info("Mailer", "Message queued for delivery.\n\n(Nothing leaves this machine; there is no\n" +

          { label: "Close", mnem: "C" }] });
      DnD.target(txt, { accept: p => p.kind === "files", drop: p => p.paths.forEach(addAttach) });
      DnD.target(attachBox, { accept: p => p.kind === "files", drop: p => p.paths.forEach(addAttach) });
      const pend = Mail.takeAttach();
      if (pend) pend.forEach(addAttach);
      if (prefill && prefill.attach) prefill.attach.forEach(addAttach);
      return d;
    }
    const bar = Mw.menubar([
      { label: "Mailbox", mnem: "M", items: () => [
        { label: "Check For New Mail", mnem: "C", run: () => { Panel.busyFor(900);
            setTimeout(() => Mw.info("Mailer", "No new mail.", { w: 300 }), 900); } },
        { sep: true },
        { label: "Inbox", check: folder === "Inbox", run: () => { folder = "Inbox"; selId = null; refresh(); } },
        { label: "Sent Messages", check: folder === "Sent", run: () => { folder = "Sent"; selId = null; refresh(); } },
        { sep: true },
        { label: "Close", acc: "Alt+F4", run: () => Wm.close(win) }] },
      { label: "Message", mnem: "s", items: () => [
        { label: "Compose New...", mnem: "N", run: () => compose() },
        { label: "Reply to Sender", dis: selId === null, run: () => { const m = rows().find(r => r.id === selId);
            if (m) compose({ to: m.addr, subject: "Re: " + m.subject,

        { label: "Forward", dis: selId === null, run: () => { const m = rows().find(r => r.id === selId);
            if (m) compose({ subject: "Fwd: " + m.subject, body: (m.body || "") }); } },
        { sep: true },

            if (m) { const p = "/tmp/dtmail." + m.id + ".txt";

        { label: "Save As Text...", dis: selId === null, run: () => { const m = rows().find(r => r.id === selId);

              v => { VFS.put(v, "From: " + m.from + "\nSubject: " + m.subject + "\n\n" + m.body, "/");
                Mw.info("Mailer", "Saved " + v); }); } },

    function refresh() {

  Apps.register({
    id: "dtmail", title: "Mailer", icon: "dtmail", exec: "/usr/dt/bin/dtmail",

  });
})();

   MODULE 21 — dtcm, THE CALENDAR MANAGER

const Cal = (() => {

  ];
  function all() { return SEED.concat(State.get("appts", [])); }
  function on(dstr) { return all().filter(a => a.d === dstr).sort((a, b) => a.t.localeCompare(b.t)); }
  function add(a) { const u = State.get("appts", []); u.push(a); State.set("appts", u); Bus.emit("cal"); }
  function remove(a) {

    if (i >= 0) { u.splice(i, 1); State.set("appts", u); Bus.emit("cal"); return true; }

(function () {

    function step(d) {
      const n = new Date(cur);
      if (view === "day") n.setDate(n.getDate() + d);
      else if (view === "week") n.setDate(n.getDate() + 7 * d);

        setTimeout(() => sc.layout(), 0);
      }
      win.setTitle("Calendar - " + Sys.user + "@" + Sys.host);
      $$("span", status)[0].textContent = "/var/spool/calendar/callog." + Sys.user;
      $$("span", status)[1].textContent = Cal.all().length + " appointments";

  }

/* ==========================================================================
   MODULE 22 — dtcalc, THE CALCULATOR
   --------------------------------------------------------------------------
   CDE's calculator had four modes -- Basic, Financial, Logical and
   Scientific -- and a display that was, correctly for the era, a fixed
   number of digits in a sunken box.
   ========================================================================== */
(function () {
  function build(win, st) {
    st = st || {};
    let acc = st.acc === undefined ? 0 : st.acc;
    let disp = st.disp || "0";
    let pending = st.pending || null, fresh = true;
    let mode = st.mode || "Basic";
    let mem = st.mem || 0;
    let base = st.base || 10;
    const out = el("div", { class: "m-in", style: { background: "#b6c4a8", color: "#000",
      font: "bold 18px 'DejaVu Sans Mono',monospace", textAlign: "right", padding: "5px 8px",
      margin: "6px", minHeight: "28px", overflow: "hidden" } });
    const modeLab = el("div", { style: { fontSize: "10px", padding: "0 8px" } });
    const keys = el("div", { style: { padding: "0 6px 6px" } });
    function show() {
      out.textContent = disp;
      modeLab.textContent = mode + (base !== 10 ? "   base " + base : "") + (mem ? "   M" : "");
    }
    function num(v) {
      if (fresh) { disp = ""; fresh = false; }
      if (v === "." && disp.includes(".")) return;
      disp = (disp === "0" && v !== ".") ? String(v) : disp + v;
      show();
    }
    function val() { return base === 10 ? parseFloat(disp) || 0 : parseInt(disp, base) || 0; }
    function put(n) {
      if (base === 10) disp = String(Math.round(n * 1e10) / 1e10);
      else disp = (n < 0 ? "-" : "") + Math.abs(Math.trunc(n)).toString(base).toUpperCase();
      fresh = true; show();
    }
    function op(o) {
      if (pending) equals();
      else acc = val();
      pending = o; fresh = true; show();
    }
    function equals() {
      const b = val();
      if (pending === "+") acc = acc + b;
      else if (pending === "-") acc = acc - b;
      else if (pending === "*") acc = acc * b;
      else if (pending === "/") acc = b === 0 ? NaN : acc / b;
      else if (pending === "^") acc = Math.pow(acc, b);
      else if (pending === "and") acc = (acc | 0) & (b | 0);
      else if (pending === "or") acc = (acc | 0) | (b | 0);
      else if (pending === "xor") acc = (acc | 0) ^ (b | 0);
      else if (pending === "<<") acc = (acc | 0) << (b | 0);
      else if (pending === ">>") acc = (acc | 0) >> (b | 0);
      else acc = b;
      pending = null;
      if (isNaN(acc)) { disp = "Error"; fresh = true; show(); Sound.bell(true); acc = 0; return; }
      put(acc);
    }
    function fn(f) {
      const v = val();
      const r = { sin: Math.sin(v), cos: Math.cos(v), tan: Math.tan(v), ln: Math.log(v),
        log: Math.log10(v), sqrt: Math.sqrt(v), sq: v * v, inv: 1 / v, neg: -v,
        exp: Math.exp(v), fact: (() => { let n = Math.round(v), p = 1; if (n > 170) return Infinity;
          for (let i = 2; i <= n; i++) p *= i; return p; })() }[f];
      put(r);
    }
    const LAYOUTS = {
      Basic: [["7", "8", "9", "/", "C"], ["4", "5", "6", "*", "%"],
        ["1", "2", "3", "-", "1/x"], ["0", ".", "=", "+", "+/-"]],
      Scientific: [["sin", "cos", "tan", "ln", "C"], ["7", "8", "9", "/", "log"],
        ["4", "5", "6", "*", "sqrt"], ["1", "2", "3", "-", "x^2"],
        ["0", ".", "=", "+", "x!"], ["EE", "pi", "e", "y^x", "1/x"]],
      Financial: [["7", "8", "9", "/", "C"], ["4", "5", "6", "*", "Term"],
        ["1", "2", "3", "-", "i%"], ["0", ".", "=", "+", "PV"]],
      Logical: [["D", "E", "F", "and", "C"], ["A", "B", "C ", "or", "xor"],
        ["7", "8", "9", "<<", "not"], ["4", "5", "6", ">>", "Hex"],
        ["1", "2", "3", "-", "Dec"], ["0", ".", "=", "+", "Bin"]]
    };
    function render() {
      keys.innerHTML = "";
      for (const row of LAYOUTS[mode]) {
        const r = el("div", { style: { display: "flex", gap: "3px", marginBottom: "3px" } });
        for (const k of row) {
          const b = Mw.btn(k, () => press(k.trim()), { w: 40 });
          b.style.flex = "1 1 0";
          r.appendChild(b);
        }
        keys.appendChild(r);
      }
      show();
    }
    function press(k) {
      if (/^[0-9.]$/.test(k)) return num(k);
      if (/^[A-F]$/.test(k) && base === 16) return num(k);
      switch (k) {
        case "C": disp = "0"; acc = 0; pending = null; fresh = true; show(); break;
        case "=": equals(); break;
        case "+": case "-": case "*": case "/": op(k); break;
        case "and": case "or": case "xor": case "<<": case ">>": op(k); break;
        case "y^x": op("^"); break;
        case "%": put(val() / 100); break;
        case "1/x": fn("inv"); break;
        case "+/-": fn("neg"); break;
        case "sqrt": fn("sqrt"); break;
        case "x^2": fn("sq"); break;
        case "x!": fn("fact"); break;
        case "sin": case "cos": case "tan": case "ln": case "log": fn(k); break;
        case "pi": put(Math.PI); break;
        case "e": put(Math.E); break;
        case "EE": num("e"); break;
        case "not": put(~(val() | 0)); break;
        case "Hex": base = 16; put(val()); break;
        case "Dec": base = 10; put(val()); break;
        case "Bin": base = 2; put(val()); break;
        case "Term": case "i%": case "PV": Mw.info("Calculator",
          "The financial keys need the register set, which the exhibit\n" +
          "does not implement.  The mode is here because CDE had it.", { w: 420 }); break;
      }
    }
    const bar = Mw.menubar([
      { label: "Option", mnem: "O", items: () => ["Basic", "Financial", "Logical", "Scientific"].map(m =>
        ({ label: m, check: mode === m, run: () => { mode = m; if (m !== "Logical") base = 10; render(); } })) },
      { label: "Memory", mnem: "M", items: () => [
        { label: "Store", run: () => { mem = val(); show(); } },
        { label: "Recall", run: () => put(mem) },
        { label: "Clear", run: () => { mem = 0; show(); } }] },
      { label: "Help", mnem: "H", right: true, items: () => [

          "#e8c33c", "#e2842e", "#c9402a", "#8f1616"];

      g.fillStyle = "#fff"; g.font = "11px Helvetica";
      g.fillText("case 3  dz (mm)  min -1.902  max 0.000", 8, h - 8);
    } else if (kind === "testpattern") {
      const cols = ["#ffffff", "#ffff00", "#00ffff", "#00ff00", "#ff00ff", "#ff0000", "#0000ff", "#000000"];
      const bw = w / 8;

      for (let i = 0; i < 16; i++) { const v = Math.round(i * 255 / 15);
        g.fillStyle = "rgb(" + v + "," + v + "," + v + ")";

      lab.textContent = opts.fmt ? opts.fmt(v) : String(v);

      place(); onchange(v);

    trough.addEventListener("mousedown", e => { pick(e);
      const mm = ev => pick(ev);
      const mu = () => { window.removeEventListener("mousemove", mm); window.removeEventListener("mouseup", mu); };

/* ==========================================================================
   MODULE 29 — dtksh, THE DESKTOP KORNSHELL
   --------------------------------------------------------------------------
   The most surprising thing in the whole environment.  dtksh is ksh-93 with
   Xlib, Xt, Motif and ToolTalk bound in as shell builtins, so a shell script
   can put up a real Motif dialog with no compiler anywhere in sight.  It
   shipped on every CDE system on Earth and almost nobody remembers it.

   The interpreter below is genuine as far as it goes: it reads the script
   out of the filesystem, parses the widget-creation calls, the resource
   settings and the callbacks, and builds the dialog those calls describe.
   Change ~/hello.ds in the Text Editor and run it again -- the dialog
   changes.  It understands a useful subset of the builtins, not all of them.
   ========================================================================== */
const Dtksh = (() => {
  function run(path, src) {
    Wm.open("dtksh", { state: { path: path, src: src } });
  }
  function parse(src) {
    const out = { top: { props: {} }, widgets: [], order: [], funcs: {}, callbacks: {}, errors: [] };
    /* join continuations */
    const text = String(src).replace(/\\\s*\n\s*/g, " ");
    const lines = text.split("\n");
    let fn = null, depth = 0;
    for (let raw of lines) {
      let line = raw.replace(/^\s+/, "");
      if (fn) {
        if (/^\}/.test(line)) { fn = null; continue; }
        out.funcs[fn].push(line);
        continue;
      }
      if (/^#/.test(line) || !line) continue;
      const fm = /^([A-Za-z_][\w]*)\s*\(\)\s*\{/.exec(line);
      if (fm) { fn = fm[1]; out.funcs[fn] = []; continue; }
      const props = s => {
        const o = {};
        const re = /([A-Za-z_]+):\s*("([^"]*)"|'([^']*)'|\S+)/g;
        let m;
        while ((m = re.exec(s))) o[m[1]] = m[3] !== undefined ? m[3] : (m[4] !== undefined ? m[4] : m[2]);
        return o;
      };
      let m;
      if ((m = /^XtInitialize\s+(\w+)\s+(\S+)\s+(\S+)/.exec(line))) {
        out.top.var = m[1]; out.top.name = m[2]; out.top.cls = m[3];
        out.vars = out.vars || {};
        continue;
      }
      if ((m = /^XmCreate(\w+)\s+(\w+)\s+\$(\w+)\s+(\S+)\s*(.*)$/.exec(line))) {
        const w = { type: m[1], var: m[2], parent: m[3], name: m[4], props: props(m[5]),
          managed: false, cbs: [] };
        out.widgets.push(w); out.order.push(w.var);
        continue;
      }
      if ((m = /^XtSetValues\s+\$(\w+)\s*(.*)$/.exec(line))) {
        const t = out.widgets.find(w => w.var === m[1]);
        const p = props(m[2]);
        if (t) Object.assign(t.props, p);
        else if (m[1] === out.top.var) Object.assign(out.top.props, p);
        continue;
      }
      if ((m = /^XtManageChild\s+\$(\w+)/.exec(line))) {
        const t = out.widgets.find(w => w.var === m[1]); if (t) t.managed = true;
        continue;
      }
      if ((m = /^XtAddCallback\s+\$(\w+)\s+(\w+)\s+'([^']*)'/.exec(line))) {
        const t = out.widgets.find(w => w.var === m[1]);
        if (t) t.cbs.push({ name: m[2], body: m[3] });
        continue;
      }
      if (/^(XtRealizeWidget|XtMainLoop|XtUnmanageChild|XFlush|XtDestroyWidget)/.test(line)) continue;
      if (/^(XmCreate|Xt|Xm|ttdt_|tt_)/.test(line)) out.errors.push(line);
    }
    return out;
  }
  return { run, parse };
})();

(function () {
  function build(win, st) {
    st = st || {};
    const path = st.path || ("/export/home/" + Sys.user + "/hello.ds");
    const node = VFS.lookup(path, "/");

    const prog = Dtksh.parse(src);

    const work = el("div", { class: "colf grow", style: { padding: "18px 20px", gap: "8px" } });

      justifyContent: "space-between" } });
    const widgets = {};

      for (let line of String(bodyText).split(/;|\n/)) {
        line = line.trim();

        if ((m = /^XtSetValues\s+\$(\w+)\s*(.*)$/.exec(line))) {
          const re = /([A-Za-z_]+):\s*("([^"]*)"|'([^']*)'|\S+)/g;

            const k = mm[1], v = mm[3] !== undefined ? mm[3] : (mm[4] !== undefined ? mm[4] : mm[2]);
            const el2 = widgets[m[1]];

            if (el2 && k === "labelString") el2.textContent = v;
          }
          continue;
        }
        if (/^exit\b/.test(line)) { Wm.close(win, true); return; }
        if (/^ttdt_send_notice\b/.test(line)) {
          DnD.note("ToolTalk: " + line.split(/\s+/)[1] + "  (sent by a shell script)");
          continue;
        }
        if (/^print\b/.test(line) || /^echo\b/.test(line)) continue;
        if (prog.funcs[line.split(/\s+/)[0]]) { exec(prog.funcs[line.split(/\s+/)[0]].join("\n")); continue; }
      }

      if (w.type === "Form" || w.type === "RowColumn" || w.type === "BulletinBoard") continue;

      let node2 = null, bottom = !!w.props.bottomAttachment;

      else if (w.type === "PushButton") {
        node2 = Mw.btn(lbl, () => { for (const cb of w.cbs) exec(cb.body); }, { w: 90 });
      } else if (w.type === "TextField" || w.type === "Text") node2 = Mw.field(w.props.value || "", { w: 200 });
      else if (w.type === "ToggleButton") node2 = Mw.tog(lbl, w.props.set === "true", () => { });
      else if (w.type === "Separator") node2 = el("div", { class: "m-etch-h" });
      else if (w.type === "ScrolledText") node2 = el("div", { class: "dtxt",
        style: { minHeight: "60px" } }, w.props.value || "");
      else node2 = el("div", { class: "m-lab" }, "[" + w.type + " " + w.name + "]");
      widgets[w.var] = node2;
      (bottom && w.type === "PushButton" ? btnRow : work).appendChild(node2);
    }
    if (!prog.widgets.length) {
      work.appendChild(el("div", { class: "m-lab" },
        "This script does not create any widgets that dtksh would show."));
    }
    if (prog.errors.length) {
      work.appendChild(el("div", { class: "m-etch-h" }));
      work.appendChild(el("div", { style: { fontSize: "11px", color: "#5a2a00" } },
        "dtksh: " + prog.errors.length + " builtin call(s) this exhibit does not implement:\n" +
        prog.errors.slice(0, 4).map(e => "  " + e.slice(0, 60)).join("\n")));
    }
    const foot = el("div", { style: { fontSize: "10px", padding: "4px 8px", color: "#333",
      borderTop: "1px solid var(--bs)" } },
      "Built by dtksh from " + path.replace("/export/home/" + Sys.user, "~") +
      " -- " + prog.widgets.length + " widgets, " + Object.keys(prog.funcs).length + " shell function(s)");
    body.append(work, el("div", { class: "m-etch-h", style: { margin: "0" } }), btnRow, foot);
    win.cl.appendChild(body);
    return { state: () => ({ path: path }) };
  }
  Apps.register({
    id: "dtksh", title: "dtksh", icon: "dtksh", exec: "/usr/dt/bin/dtksh",
    w: 340, h: 200, minw: 200, minh: 120, build: build,
    save: w => (w.api && w.api.state ? w.api.state() : {}),
    open: a => ({ path: a })
  });
})();

/* ==========================================================================
   MODULE 31 — THE OPENWINDOWS DESKSET, RUNNING INSIDE CDE
   --------------------------------------------------------------------------
   This is the only place OPEN LOOK appears in the desktop itself, and it is
   where Solaris really put it: legacy applications launched from the
   OpenWindows folder in Application Manager.

   Note what happens to the frame.  dtwm draws it, so an XView program gets
   a Motif title bar with a Motif window menu -- and then the inside of the
   window is beige, the buttons are oval, the scrollbar elevator is on the
   LEFT, and the menus have pushpins.  Two design languages, one window, and
   Sun shipped it that way on purpose so that nobody's decade of habits
   stopped working on the Monday morning.
   ========================================================================== */
(function () {
  function pin(pinned) {
    const p = el("div", { class: "olpin", title: pinned ? "Pinned" : "Click to pin this menu up" });
    const c = el("canvas", { width: 15, height: 15 });
    const g = c.getContext("2d");
    g.strokeStyle = "#3a3a32"; g.fillStyle = "#b3afa3"; g.lineWidth = 1;
    if (pinned) { g.fillRect(6, 2, 3, 11); g.strokeRect(6.5, 2.5, 2, 10);
      g.fillRect(3, 2, 9, 3); g.strokeRect(3.5, 2.5, 8, 2); }
    else { g.fillRect(2, 6, 11, 3); g.strokeRect(2.5, 6.5, 10, 2);
      g.fillRect(10, 3, 3, 9); g.strokeRect(10.5, 3.5, 2, 8); }
    p.appendChild(c);
    return p;
  }
  function olmenu(items, x, y, title) {
    const m = el("div", { class: "olmenu" });
    let pinned = false;
    const hdr = el("div", { style: { display: "flex", alignItems: "center", gap: "5px",
      borderBottom: "1px solid #8c887d", paddingBottom: "2px", marginBottom: "2px" } });
    const pn = pin(false);
    pn.addEventListener("click", e => { e.stopPropagation(); pinned = !pinned;
      pn.replaceWith(pin(pinned)); });
    hdr.append(pn, el("span", { style: { fontSize: "11px", fontWeight: "bold" } }, title || "Menu"));
    m.appendChild(hdr);
    for (const it of items) {
      const r = el("div", { class: "oli" }, it.label);
      r.addEventListener("click", () => { it.run && it.run(); if (!pinned) m.remove(); });
      m.appendChild(r);
    }
    const sr = $("#stage").getBoundingClientRect(), sc = sr.width / 1152;
    m.style.left = Math.round((x - sr.left) / sc) + "px";
    m.style.top = Math.round((y - sr.top) / sc) + "px";
    $("#stage").appendChild(m);
    const off = e => { if (pinned) return; if (m.contains(e.target)) return; m.remove();
      document.removeEventListener("mousedown", off, true); };
    setTimeout(() => document.addEventListener("mousedown", off, true), 40);
    return m;
  }
  function olbtn(label, fn) {
    const b = el("div", { class: "olbtn" }, label);
    b.addEventListener("click", fn);

  }
  /* the OPEN LOOK scrollbar: elevator on the LEFT of the pane, with the
     cable above and below it and the anchors at the ends */
  function olScroll(content) {
    const pane = el("div", { class: "olpane" });
    const sb = el("div", { class: "olsb" });
    const vp = el("div", { style: { flex: "1 1 auto", overflow: "hidden", position: "relative" } });
    const inner = el("div", { style: { position: "absolute", left: "0", right: "0", top: "0" } }, content);
    vp.appendChild(inner);
    const top = el("div", { class: "olcable", style: { flex: "0 0 6px" } });
    const elev = el("div", { class: "olelev" });
    const cable = el("div", { class: "olcable" });
    sb.append(top, elev, cable);
    pane.append(sb, vp);
    let off = 0;
    function layout() {
      const max = Math.max(0, inner.scrollHeight - vp.clientHeight);
      off = clamp(off, 0, max);
      inner.style.top = (-off) + "px";
      const tr = sb.clientHeight - 34;
      elev.style.marginTop = "0px";
      top.style.flex = "0 0 " + Math.round(max ? off / max * tr : 0) + "px";
    }
    vp.addEventListener("wheel", e => { off += e.deltaY > 0 ? 40 : -40; layout(); });
    elev.addEventListener("mousedown", e => {
      e.preventDefault();
      const sc = $("#stage").getBoundingClientRect().width / 1152;
      const y0 = e.clientY, o0 = off;
      const max = Math.max(0, inner.scrollHeight - vp.clientHeight);
      const tr = Math.max(1, sb.clientHeight - 34);
      const mm = ev => { off = o0 + (ev.clientY - y0) / sc / tr * max; layout(); };
      const mu = () => { window.removeEventListener("mousemove", mm); window.removeEventListener("mouseup", mu); };
      window.addEventListener("mousemove", mm); window.addEventListener("mouseup", mu);
    });
    pane.layout = layout;
    setTimeout(layout, 20);
    return pane;
  }

  /* ---- textedit ----------------------------------------------------- */
  Apps.register({
    id: "owtextedit", title: "Text Editor (OpenWindows)", icon: "ow",
    exec: "/usr/openwin/bin/textedit", w: 470, h: 340, minw: 260, minh: 160,
    open: a => ({ path: a }),
    save: w => (w.api && w.api.state ? w.api.state() : {}),
    build: (win, st) => {
      st = st || {};

      const body = el("div", { class: "ol" });

      else txt.textContent = st.text ||
        "This is textedit, from OpenWindows 3.6.\n\n" +
        "Look at the left edge of this pane: the scrollbar elevator is\n" +
        "over there, where OPEN LOOK put it, and it is still there in\n" +
        "1997 because Sun did not go back and change the DeskSet.\n\n" +
        "The buttons above are oval.  Press one of the menu buttons and\n" +
        "the menu has a pushpin in the corner: click the pin and the\n" +
        "menu stays up while you work.  Motif has nothing like it and\n" +
        "CDE has nothing like it, and people who had used SunView since\n" +
        "1986 missed it for years.\n\n" +
        "The frame around this window is Motif, drawn by dtwm.  That is\n" +
        "not a mistake in the exhibit; that is what it looked like.\n";
      const pane = olScroll(txt);
      const hdr = el("div", { class: "olhdr" });
      hdr.append(
        olbtn("File", e => olmenu([
          { label: "Load File...", run: () => Mw.prompt("textedit: Load File", "File:",
              "/export/home/" + Sys.user + "/README.CDE", v => { const n = VFS.lookup(v, "/");
                if (n && n.t === "f") { path = VFS.norm(v, "/"); txt.textContent = n.d;
                  win.setTitle("textedit: " + path); } else Mw.error("textedit", "Cannot load " + v); }) },
          { label: "Save Current File", run: () => { if (path) { VFS.put(path, txt.innerText, "/");
              Mw.info("textedit", "Saved " + path); } else Mw.error("textedit", "No file loaded."); } },
          { label: "Store as New File...", run: () => Mw.prompt("textedit: Store", "File:",

          { label: "Select Line at Number...", run: () => { } },

        ], e.clientX, e.clientY, "View")),
        olbtn("Edit", e => olmenu([

        ], e.clientX, e.clientY, "Edit")),

  /* ---- perfmeter ---------------------------------------------------- */
  Apps.register({
    id: "owperfmeter", title: "perfmeter", icon: "perfmeter", exec: "/usr/openwin/bin/perfmeter",
    w: 230, h: 110, minw: 150, minh: 80, save: () => ({}),
    build: (win, st) => {
      const body = el("div", { class: "ol", style: { padding: "3px" } });
      const cv = el("canvas", { width: 210, height: 60, style: "border:1px solid #8c887d;background:#1a2018" });
      const lab = el("div", { style: { fontSize: "10px", padding: "2px" } }, "cpu   0.0%");
      body.append(cv, lab);
      win.cl.appendChild(body);
      const hist = new Array(70).fill(0.1);
      const g = cv.getContext("2d");
      let mode = "cpu";
      body.addEventListener("contextmenu", e => { e.preventDefault();
        olmenu(["cpu", "pkts", "page", "swap", "intr", "disk", "cntxt", "load", "colls", "errs"]
          .map(m => ({ label: m, run: () => { mode = m; } })), e.clientX, e.clientY, "Perfmeter"); });
      const iv = setInterval(() => {
        if (!cv.isConnected) { clearInterval(iv); return; }
        const load = mode === "cpu" ? 0.12 + Math.abs(Math.sin(Date.now() / 3100)) * 0.5 +
          Math.random() * 0.12 : Math.random() * 0.4;
        hist.push(clamp(load, 0, 1)); hist.shift();
        g.fillStyle = "#1a2018"; g.fillRect(0, 0, 210, 60);
        g.strokeStyle = "#3c4a38";
        for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, i * 15); g.lineTo(210, i * 15); g.stroke(); }
        g.strokeStyle = "#7dff5a"; g.beginPath();
        hist.forEach((v, i) => { const x = i * 3, y = 60 - v * 58;
          i ? g.lineTo(x, y) : g.moveTo(x, y); });
        g.stroke();
        lab.textContent = padr(mode, 6) + (hist[hist.length - 1] * 100).toFixed(1) + "%";
      }, 380);
      return { closed: () => clearInterval(iv), state: () => ({}) };
    }
  });

  /* ---- clock -------------------------------------------------------- */
  Apps.register({
    id: "owclock", title: "clock", icon: "clock", exec: "/usr/openwin/bin/clock",
    w: 140, h: 165, minw: 90, minh: 110, save: () => ({}),
    build: (win, st) => {
      const body = el("div", { class: "ol", style: { alignItems: "center", padding: "4px" } });
      const cv = el("canvas", { width: 120, height: 120 });
      const dl = el("div", { style: { fontSize: "10px" } });
      body.append(cv, dl);
      win.cl.appendChild(body);
      const g = cv.getContext("2d");
      function draw() {
        const d = Clock.now();
        g.clearRect(0, 0, 120, 120);
        g.save(); g.translate(60, 58);
        g.fillStyle = "#fffff0"; g.beginPath(); g.arc(0, 0, 50, 0, 7); g.fill();
        g.strokeStyle = "#3a3a32"; g.lineWidth = 2; g.stroke();
        for (let i = 0; i < 12; i++) { const t = i * Math.PI / 6;
          g.fillStyle = "#3a3a32";
          g.fillRect(Math.sin(t) * 43 - 1.5, -Math.cos(t) * 43 - 1.5, 3, 3); }
        const hh = (d.getHours() % 12) / 12 * 6.283 + d.getMinutes() / 60 * 0.5236;
        const mm = d.getMinutes() / 60 * 6.283, ss = d.getSeconds() / 60 * 6.283;
        g.lineWidth = 3.4; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.sin(hh) * 26, -Math.cos(hh) * 26); g.stroke();
        g.lineWidth = 2.4; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.sin(mm) * 38, -Math.cos(mm) * 38); g.stroke();
        g.strokeStyle = "#7f2020"; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, 0);
        g.lineTo(Math.sin(ss) * 42, -Math.cos(ss) * 42); g.stroke();
        g.restore();
        dl.textContent = DAY[d.getDay()] + " " + MON[d.getMonth()] + " " + d.getDate();
      }
      draw();
      const iv = setInterval(() => { if (!cv.isConnected) { clearInterval(iv); return; } draw(); }, 1000);
      body.addEventListener("contextmenu", e => { e.preventDefault();
        olmenu([{ label: "Analog", run: draw }, { label: "Digital", run: () => Mw.info("clock",
          "The OPEN LOOK clock had analog and digital faces and an alarm,\nall on a pinned menu.") },
          { label: "Properties...", run: () => { } }], e.clientX, e.clientY, "Clock"); });
      return { closed: () => clearInterval(iv), state: () => ({}) };
    }
  });

  /* ---- filemgr ------------------------------------------------------ */
  Apps.register({
    id: "owfilemgr", title: "filemgr", icon: "ow", exec: "/usr/openwin/bin/filemgr",
    w: 420, h: 320, minw: 240, minh: 160,
    save: w => (w.api && w.api.state ? w.api.state() : {}),
    build: (win, st) => {
      st = st || {};
      let dir = st.dir || ("/export/home/" + Sys.user);
      const body = el("div", { class: "ol" });
      const listing = el("div", { style: { padding: "4px", fontSize: "11px" } });
      const pane = olScroll(listing);
      const pathF = el("input", { value: dir, style: "font:11px 'Lucida Sans',Verdana,sans-serif;" +
        "border:1px inset #8c887d;background:#fffff0;padding:1px 3px;flex:1 1 auto" });
      const hdr = el("div", { class: "olhdr" },
        olbtn("File", e => olmenu([{ label: "Open", run: () => { } },
          { label: "Print One", run: () => { } }, { label: "Properties...", run: () => { } }],
          e.clientX, e.clientY, "File")),
        olbtn("View", e => olmenu([{ label: "Icon by Name", run: () => { } },
          { label: "List by Name", run: () => { } }], e.clientX, e.clientY, "View")),
        olbtn("Goto", () => refresh()), pathF);
      body.append(hdr, pane);
      win.cl.appendChild(body);
      pathF.addEventListener("keydown", e => { if (e.key === "Enter") { dir = pathF.value; refresh(); } });
      function refresh() {
        dir = VFS.norm(pathF.value, dir); pathF.value = dir;
        listing.innerHTML = "";
        const ents = VFS.ls(dir, "/") || [];
        listing.appendChild(el("div", { style: { display: "flex", gap: "6px", cursor: "default" } },
          el("span", null, ".."), el("span", { style: { color: "#5a5a52" } }, "parent")));
        for (const e of ents) {
          const r = el("div", { style: { display: "flex", gap: "6px", cursor: "default", padding: "1px 0" } },
            Dt.iconEl(dir + "/" + e.name, e.node, 16),
            el("span", { style: { width: "170px" } }, e.name),
            el("span", { style: { color: "#5a5a52" } }, VFS.isDir(e.node) ? "folder" : VFS.size(e.node) + " b"));
          r.addEventListener("dblclick", () => { if (VFS.isDir(e.node)) { dir = dir + "/" + e.name;
            pathF.value = dir; refresh(); } else Dt.open(dir + "/" + e.name, e.node); });
          listing.appendChild(r);
        }
        listing.appendChild(el("div", { style: { marginTop: "8px", color: "#5a5a52", fontSize: "10px" } },
          "filemgr from OpenWindows 3.6.  The Binder, not the CDE action\n" +
          "database, decides what an icon looks like here -- two file-type\n" +
          "databases on one machine, which is the four-vendors problem in\n" +
          "miniature.  This window borrows CDE's for want of a second one."));
        win.setTitle("filemgr: " + dir);
        pane.layout();
      }
      refresh();
      return { resized: () => pane.layout(), state: () => ({ dir: dir }) };
    }
  });

  /* ---- snapshot ----------------------------------------------------- */
  Apps.register({
    id: "owsnapshot", title: "snapshot", icon: "snapshot", exec: "/usr/openwin/bin/snapshot",
    w: 280, h: 160, minw: 200, minh: 120, save: () => ({}),
    build: (win, st) => {
      const body = el("div", { class: "ol", style: { padding: "8px", gap: "6px" } });
      const info = el("div", { style: { fontSize: "11px" } }, "Snap Type:  Window");
      body.append(info,
        el("div", { style: { display: "flex", gap: "6px" } },
          olbtn("Snap", () => { info.textContent = "Snapping in 3 seconds...";
            setTimeout(() => { info.textContent = "Snapped.  Save with Store as New File.";
              VFS.put("/export/home/" + Sys.user + "/snapshot.xwd",
                "XWD 1 testpattern 384 240\n", "/");
              Mw.info("snapshot", "Written to ~/snapshot.xwd.\n\nOpen it in the CDE Image Viewer -- an OPEN LOOK\n" +
                "program's output, read by a CDE program.  This part of the\ntransition really did just work.",
                { w: 460, h: 230 }); }, 1200); }),
          olbtn("View", () => Exec.run("/usr/dt/bin/sdtimage /export/home/" + Sys.user + "/snapshot.xwd")),
          olbtn("Print", () => Printers.print(["/export/home/" + Sys.user + "/snapshot.xwd"]))),
        el("div", { style: { fontSize: "10px", color: "#4a4a42", marginTop: "4px" } },
          "snapshot wrote XWD files.  sdtimage reads them."));
      win.cl.appendChild(body);
      return { state: () => ({}) };
    }
  });
  window.__olmenu = olmenu;
})();

/* ==========================================================================
   MODULE 32 — THE HELP SYSTEM
   --------------------------------------------------------------------------
   CDE's help was not a stub bolted on at the end.  It was a hypertext
   format of its own, a shared widget every application linked against, and
   a topic tree with real cross-links; every program's Help menu opened the
   same viewer at the right page.  Treating it as a first-class application
   is not a courtesy to CDE, it is a description of it.

   The topics below are original, written for this exhibit.  Link syntax:
   [[Volume:topic|label]].
   ========================================================================== */
const Help = (() => {
  const V = {};
  function vol(id, title, topics, tree) { V[id] = { id: id, title: title, topics: topics, tree: tree }; }

  vol("Intromgr", "Introducing the Desktop", {
    intro: ["Introducing the Desktop",
      ["p", "This is the Common Desktop Environment, version 1.2, as shipped with Solaris 2.6. It is the desktop that Hewlett-Packard, IBM, Sun and Novell agreed to build together in 1993, and by 1997 it runs on essentially every commercial Unix workstation."],
      ["p", "Four things are worth ten minutes of your time, in this order:"],
      ["ul", "The strip along the bottom of the screen is the [[Dtwm:frontpanel|Front Panel]]. The little arrows above the icons open subpanels.",
        "The four buttons in the middle of it are [[Intromgr:workspaces|workspaces]]. A window can appear on any number of them.",
        "[[Intromgr:sessions|Session save and restore]] genuinely works. Log out, log back in, and everything is where you left it.",
        "[[Dtfile:datatypes|Actions and datatypes]] are one registry that decides what every file looks like and what opening it does."],
      ["p", "Right-click the backdrop for the [[Dtwm:rootmenu|Workspace menu]], which holds everything else."],
      ["note", "If you have just been moved off OpenWindows, read [[Openwin:transition|Moving from OpenWindows]] first. It is shorter than this and it will save you an argument about the mouse."]],
    frontpanel: ["The Front Panel",
      ["p", "The Front Panel is docked at the bottom centre of the screen. Left to right it holds a clock, the date, the File Manager, the Text Editor, the Mailer, the workspace switch, a printer, Style Manager, Application Manager, Help Manager and the Trash Can."],
      ["h", "Subpanels"],
      ["p", "Most controls have a small arrow tab above them. Click the arrow and a subpanel slides up with related items in it -- and there is more in the subpanels than there is on the panel itself. The Personal Applications subpanel above the Text Editor is where the Calculator, the Icon Editor and the browser live."],
      ["h", "Installing your own icons"],
      ["p", "Open [[Dtappmgr:overview|Application Manager]], find an icon, and drag it onto the Install Icon area at the bottom of any open subpanel. It stays there. From the subpanel's own menu (button 3 on the item) you can Copy To Main Panel, which promotes it onto the panel itself."],
      ["h", "Getting it out of the way"],
      ["p", "Click either end handle to roll the panel down to a tab. Click the tab to bring it back. Button 3 on a handle offers the same thing and a reset."],
      ["note", "The busy light beside the workspace buttons blinks while the desktop is starting something. On a loaded workstation in 1997 you watched it for a while."]],
    workspaces: ["Workspaces",
      ["p", "There are four workspaces by default, named One, Two, Three and Four. The 2x2 block of buttons in the middle of the Front Panel switches between them, and each workspace keeps its own [[Dtstyle:backdrop|backdrop]]."],
      ["h", "Occupancy, not location"],
      ["p", "A window does not live on one workspace. It has an occupancy set. Open the window menu -- the button at the top left of the frame -- and there is Occupy Workspace, which takes a checklist, and Occupy All Workspaces, which makes the window follow you everywhere."],
      ["p", "Occupy All Workspaces is the right answer for a clock and the wrong answer for nine terminals. That distinction is the entire user interface."],
      ["h", "Renaming, adding, removing"],
      ["p", "Button 3 on a workspace button offers Rename, Add and Delete. Rename them after what you actually do; people did."],
      ["p", "Keyboard: Ctrl+Alt+1 through Ctrl+Alt+8 switch workspaces directly."]],
    sessions: ["Sessions",
      ["p", "The session manager, dtsession, records every running application, its geometry, which workspaces it occupies and its own internal state, and puts it all back at your next login."],
      ["h", "Two sessions"],
      ["ul", "The CURRENT session is written every time you log out with Save current session ticked. You come back to whatever you left.",
        "The HOME session is one you save deliberately, from the Workspace menu or [[Dtstyle:startup|Style Manager's Startup panel]]. It is a known-good arrangement you can return to after an afternoon of scattering windows."],
      ["p", "Both are readable text under ~/.dt/sessions. Look at dt.session in the Text Editor: it is a list of clients with their geometry and their workspace occupancy, and editing it by hand was, for a while, the only way to fix a session that would not come back right."],
      ["note", "Try it. Open five programs, scatter them across the four workspaces, put one of them on all four, log out with Save current session ticked, and log back in."]],
    help: ["Using Help",
      ["p", "Every application's Help menu opens this viewer at that application's own volume. The Help Manager (the last-but-one control on the Front Panel) lists every volume installed on the machine."],
      ["p", "On Item Help turns the pointer into a question mark; click a window and you get the help for that program. It is on the Help menu of most applications and in the Help subpanel."],
      ["p", "Underlined blue text is a hyperlink. The Back button walks the trail you came by."]]
  }, ["intro", "frontpanel", "workspaces", "sessions", "help"]);

  vol("Dtwm", "Workspace Manager", {
    overview: ["dtwm, the Workspace Manager",
      ["p", "dtwm is CDE's window manager. Hewlett-Packard contributed it, and it is a descendant of mwm, the Motif window manager -- which is why every frame here is a Motif frame."],
      ["h", "The frame"],
      ["ul", "Top left: the window menu button. Click it for the menu; double-click it to close the window.",
        "Centre: the title, in bold, centred. Drag it to move the window; double-click it to maximise.",
        "Top right: minimise (the small square) and maximise (the large one).",
        "Edges and corners: resize handles. Motif shows an outline and a geometry box while you drag."],
      ["h", "Minimising"],
      ["p", "A minimised window becomes an icon on the desktop, not an entry in a list along one edge. Double-click the icon to bring the window back; drag it to move it. This was configurable -- dtwm could put them in an icon box instead -- and the default was the desktop."],
      ["p", "Accelerators: Alt+F4 close, Alt+F9 minimise, Alt+F10 maximise, Alt+F3 lower, Alt+F7 move, Alt+F8 resize."]],
    frontpanel: ["Front Panel", ["p", "See [[Intromgr:frontpanel|The Front Panel]] in Introducing the Desktop."]],
    windowmenu: ["The window menu",
      ["p", "Restore, Move, Size, Minimize, Maximize and Lower are the ordinary Motif items. The three below the separator are CDE's:"],
      ["ul", "Occupy Workspace... opens a checklist of workspaces for this window.",
        "Occupy All Workspaces puts it on every one.",
        "Unoccupy Workspace removes it from the one you are looking at."],
      ["p", "Move and Size put you in a mode where the pointer drives an outline and a click commits. That is Motif's f.move and f.resize, and it is mildly disorienting the first time."]],
    rootmenu: ["The Workspace menu",
      ["p", "Press button 3 on the backdrop. The menu holds Programs, Tools, Windows and Workspace submenus, Refresh, the Front Panel toggle, Restart Workspace Manager and Log out."],
      ["p", "This menu is not built into the window manager. It is parsed out of ~/.dt/dtwmrc, and you can edit it: open the file in the [[Dtpad:overview|Text Editor]] (there is a Customize Workspace Menu item in the Desktop Tools subpanel), change it, save it, and pick Restart Workspace Manager. Your windows stay where they are and the menu changes."],
      ["p", "See [[Dtwm:dtwmrc|the dtwmrc file]] for the syntax."]],
    dtwmrc: ["~/.dt/dtwmrc",
      ["p", "A dtwm configuration file is a list of Menu, Buttons and Keys blocks. A menu looks like this:"],
      ["pre", "Menu DtRootMenu\n{\n  \"Workspace Menu\"   f.title\n   no-label          f.separator\n  \"Programs\"         f.menu     ProgramsMenu\n  \"Refresh\"          f.refresh\n  \"Log out...\"       f.action   ExitSession\n}"],
      ["p", "The left column is the label, the middle is a function, and the right is the argument. f.action names an action from the [[Dtfile:datatypes|action database]], which is how the window manager launches programs without knowing anything about them."],
      ["p", "The system copy lives in /usr/dt/config/C/sys.dtwmrc. Copy it, do not edit it in place."],
      ["note", "This exhibit really parses the DtRootMenu block out of your file. Add an item with f.action Dtterm and it appears on the Workspace menu after a restart."]]
  }, ["overview", "windowmenu", "rootmenu", "dtwmrc", "frontpanel"]);

  vol("Dtfile", "File Manager", {
    overview: ["dtfile, the File Manager",
      ["p", "IBM contributed the File Manager. It shows a folder as icons or as a tree, and every icon in it comes out of the action and datatype database -- the File Manager itself does not know what any file type is."],
      ["ul", "Double-click a folder to open it; double-click a file to run its default action.",
        "Button 3 on an icon gives Open, an Actions submenu built from the datatype, Print, Put in Trash and Properties.",
        "Shift-click or Ctrl-click extends the selection. If you have turned on the OPEN LOOK compatibility switch in [[Dtstyle:mouse|Style Manager's Mouse panel]], button 2 extends it as well.",
        "Drag icons anywhere: onto a folder to move them, onto the printer to print, onto the Trash Can, onto the Mailer to attach them."],
      ["p", "View -> By Tree shows the hierarchy instead of the icons. View -> Show Hidden Files is how you get at ~/.dt."]],
    tasks: ["Common tasks",
      ["ul", "Make a folder: File -> New Folder.",
        "Rename: select, then Selected -> Rename.",
        "Move or copy: drag with the mouse, or Selected -> Move to / Copy to.",
        "Delete: Selected -> Put in Trash. Nothing actually leaves the disk until you shred it.",
        "Open a terminal in this folder: File -> Open Terminal Here."]],
    datatypes: ["Actions and datatypes",
      ["p", "One database decides three things about every file: what icon it gets, what its name means to the desktop, and what happens when you open it. It is assembled at login from /usr/dt/appconfig/types/C (the system's) and ~/.dt/types (yours, which wins)."],
      ["p", "A file type needs three stanzas:"],
      ["pre", "DATA_ATTRIBUTES TEXTFILE\n{\n  ACTIONS       Open,Print\n  ICON          Dtdata\n  DESCRIPTION   This file contains plain text.\n}\n\nDATA_CRITERIA TEXTFILE1\n{\n  DATA_ATTRIBUTES_NAME TEXTFILE\n  MODE          f\n  NAME_PATTERN  *.txt\n}\n\nACTION Open\n{\n  LABEL         Open\n  TYPE          MAP\n  MAP_ACTION    Dtpad\n}"],
      ["p", "DATA_ATTRIBUTES says what it looks like and what it can do. DATA_CRITERIA says how the desktop recognises it -- by name pattern, by permissions, or by content at an offset. ACTION says what to run."],
      ["p", "This is the most powerful thing in CDE and the most tedious to write, because a wrong field produces no error message at all: just an icon that does not change. Which is exactly why Sun shipped [[Dtcreate:overview|Create Action]]."],
      ["note", "Try it: there are .mdl files in ~/Projects with no datatype. Register them with Create Action and watch the icon change in this window without anything being restarted."]],
    trash: ["The Trash Can",
      ["p", "Put in Trash moves a file to ~/.dt/Trash. It is still on the disk, and Put Back returns it to where it came from. Shred is the only thing that deletes."],
      ["p", "The Front Panel's Trash Can control shows whether the can has anything in it, and you can drop files straight onto it."]]
  }, ["overview", "tasks", "datatypes", "trash"]);

  vol("Dtstyle", "Style Manager", {
    overview: ["dtstyle, the Style Manager",
      ["p", "Nine items: Color, Font, Backdrop, Keyboard, Mouse, Audio, Screen, Window and Startup. Every one of them writes X resources into ~/.dt, which is why using this program and hand-editing that directory are the same act performed two ways."],
      ["p", "The two that define the period are [[Dtstyle:color|Color]] and [[Dtstyle:backdrop|Backdrop]]. The two worth knowing about are [[Dtstyle:mouse|Mouse]] and [[Dtstyle:startup|Startup]]."]],
    color: ["Color",
      ["p", "A palette is eight colours. CDE derives every shadow, select and foreground colour from them at run time rather than storing them, which is why one click recolours the window frames, the Front Panel, the menus, the text areas and the backdrop tiles all at once."],
      ["p", "Palettes are files in /usr/dt/palettes. Sun shipped OpenWindows-flavoured ones as well, for people who had just been moved off the old desktop and wanted their beige back."],
      ["p", "Number Of Colors To Use mattered a great deal on an 8-bit framebuffer, where the desktop and the applications were competing for 256 entries in one colormap. Choosing High Color and then starting an image viewer was how you got a screen full of the wrong colours."]],
    font: ["Font",
      ["p", "Seven interface sizes, applied to every application at once because they are X resources rather than per-program settings. Solaris 2.6 added TrueType support to the X server, which is why this release looked better than 2.5."]],
    backdrop: ["Backdrop",
      ["p", "Each workspace keeps its own backdrop, so switching workspaces changes the wallpaper. A CDE backdrop is a two-colour tile drawn in the current palette's colours -- not a photograph -- so changing the palette changes every backdrop with it."],
      ["p", "This is why the CDE look is so recognisable: at 8 bits per pixel, a tiled two-colour pattern costs two colormap entries and a photograph costs all of them."]],
    keyboard: ["Keyboard", ["p", "Auto-repeat and the key click volume. The click was a real sound made by the workstation's own speaker, driven by the X server."]],
    mouse: ["Mouse",
      ["p", "Handedness, double-click time, acceleration and threshold. And then two switches that are Sun's own, not CDE's:"],
      ["ul", "Button2 extends the selection -- the old OPEN LOOK ADJUST.",
        "Button3 activates cascade menus."],
      ["p", "In OPEN LOOK the three buttons were SELECT, ADJUST and MENU, and the middle one extended whatever you had selected. Motif uses button 2 for dragging, so a decade of muscle memory stopped working on the day the machine was upgraded. Sun knew this would be the single most complained-about change in the whole migration and put the switches in their Motif library, off by default."],
      ["note", "It is worth pausing on that. A vendor shipped a compatibility switch, in a widget library, for a mouse habit. That is what taking your own installed base seriously looks like."]],

  /* ---- rendering ---------------------------------------------------- */
  function linkify(txt, onlink) {
    const out = [];
    let last = 0;
    const re = /\[\[([A-Za-z0-9_]+):([A-Za-z0-9_]+)\|([^\]]+)\]\]/g;
    let m;
    while ((m = re.exec(txt))) {
      if (m.index > last) out.push(document.createTextNode(txt.slice(last, m.index)));
      const a = el("a", null, m[3]);
      const v = m[1], t = m[2];
      a.addEventListener("click", e => { e.preventDefault(); onlink(v, t); });
      out.push(a);
      last = m.index + m[0].length;
    }
    if (last < txt.length) out.push(document.createTextNode(txt.slice(last)));
    return out;
  }
  function renderTopic(volId, topicId, into, onlink) {
    const v = V[volId];
    into.innerHTML = "";
    if (!v) { into.appendChild(el("h1", null, "Help volume not found")); return; }
    const t = v.topics[topicId] || v.topics[v.tree[0]];
    if (!t) { into.appendChild(el("h1", null, "Topic not found")); return; }
    into.appendChild(el("h1", null, t[0]));
    for (let i = 1; i < t.length; i++) {
      const [kind, ...rest] = t[i];
      if (kind === "p") into.appendChild(el("p", null, ...linkify(rest[0], onlink)));
      else if (kind === "h") into.appendChild(el("h2", null, rest[0]));
      else if (kind === "pre") into.appendChild(el("pre", { style: "background:#e4e4e4;border:1px solid #999;" +
        "padding:6px 8px;overflow:auto;font:12px 'DejaVu Sans Mono',monospace" }, rest[0]));
      else if (kind === "note") into.appendChild(el("div", { class: "hnote" }, ...linkify(rest[0], onlink)));
      else if (kind === "ul") into.appendChild(el("ul", null,
        ...rest.map(r => el("li", null, ...linkify(r, onlink)))));
    }
    into.appendChild(el("p", { style: "margin-top:18px;font-size:11px;color:#555" },
      "Help volume: " + volId + "   topic: " + topicId));
  }
  function open(volId, topicId) {
    const ex = Wm.byApp("dthelpview")[0];
    if (ex) { if (ex.min) Wm.restore(ex);
      if (!ex.occ.includes(Session.currentIndex())) Wm.setOcc(ex, ex.occ.concat([Session.currentIndex()]));
      Wm.raise(ex); Wm.focus(ex); ex.api.goTo(volId, topicId); return ex; }
    return Wm.open("dthelpview", { state: { volume: volId, topic: topicId } });
  }
  let onItem = false;
  function startOnItem() {
    onItem = true;
    $("#stage").style.cursor = "help";
    Mw.info("On Item Help", "Click on a window to see the help for that program.", { w: 380, h: 160 });
  }
  function handleOnItem(ev) {
    if (!onItem) return false;
    onItem = false;
    $("#stage").style.cursor = "";
    const w = ev.target.closest ? ev.target.closest(".win") : null;
    let appId = null;
    for (const x of Wm.all()) if (x.el === w) appId = x.appId;
    const MAPV = { dtterm: "Dtterm", dtfile: "Dtfile", dtpad: "Dtpad", dtmail: "Dtmail", dtcm: "Dtcm",
      dtcalc: "Dtcalc", dticon: "Dticon", dtprintinfo: "Dtprintinfo", sdtimage: "SDtimage",
      dtstyle: "Dtstyle", dtappmgr: "Dtappmgr", dthelpview: "Help4Help", dtcreate: "Dtcreate",
      dtksh: "Dtksh", hotjava: "Intromgr", owtextedit: "Openwin", owperfmeter: "Openwin",
      owclock: "Openwin", owfilemgr: "Openwin", owsnapshot: "Openwin" };
    if (appId && MAPV[appId]) open(MAPV[appId], appId === "dthelpview" ? "using" :
      (appId === "hotjava" ? "intro" : (appId.startsWith("ow") ? "transition" : "overview")));
    else if (ev.target.closest("#fp")) open("Dtwm", "frontpanel");
    else open("Intromgr", "intro");
    return true;
  }
  return { V, renderTopic, open, onItem: startOnItem, handleOnItem, volumes: () => Object.keys(V) };
})();

(function () {

            const hits = [];
            for (const vk of Help.volumes()) for (const tk in Help.V[vk].topics) {
              const t = Help.V[vk].topics[tk];

            }

    win.cl.append(bar, el("div", { class: "m-etch-h", style: { margin: "0" } }), top,

    function back() { if (!hist.length) return; const h = hist.pop(); volId = h.v; topicId = h.t; render(true); }
    function goTo(v, t) {

          el("div", { class: "hnote" }, "CDE's help system had its own hypertext markup, its own " +
            "compiler and a widget every application linked against. It is one of the four or five " +
            "things CDE did that modern desktops do worse, or not at all."));
        $$("span", status)[0].textContent = "/usr/dt/appconfig/help/C";
        $$("span", status)[1].textContent = Help.volumes().length + " volumes";
      } else {

        win.setTitle("Help - " + v.title);

        for (const t of v.tree) {

            el("span", null, v.topics[t][0]));
          r.addEventListener("click", () => { if (volId) hist.push({ v: volId, t: topicId });
            topicId = t; render(); });
          tree.appendChild(r);

      }
      docWrap.vp.scrollTop = 0;
      treeWrap.layout && treeWrap.layout();
      docWrap.layout && docWrap.layout();
      Session.persist();
    }
    render();

      goTo: goTo,
      resized: () => { treeWrap.layout(); docWrap.layout(); },
      state: () => ({ volume: volId, topic: topicId })

/* ==========================================================================
   MODULE 33 — dtlogin, dtsession AND THE WORKSPACE MENU
   --------------------------------------------------------------------------
   The login screen is where the Sun hook lives: Options -> Sessions offers
   the Common Desktop Environment or the OpenWindows Desktop.  The new world
   and the old, on the same screen, in 1997.
   ========================================================================== */
const Sess = (() => {
  let deskMode = "cde";

  /* ---- the login screen --------------------------------------------- */
  function vendorMark(size) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    const r = size * 0.34, cx = size / 2, cy = size / 2;
    g.strokeStyle = "#4a3b78"; g.lineWidth = Math.max(2, size * 0.075);
    g.lineJoin = "miter";
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r * 0.3, cy + Math.sin(a) * r * 0.3);
      g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      g.lineTo(cx + Math.cos(a + Math.PI / 2) * r, cy + Math.sin(a + Math.PI / 2) * r);
      g.stroke();
    }
    return el("img", { src: c.toDataURL(), width: size, height: size, alt: "",
      title: "original placeholder mark, standing where a vendor logo would sit" });
  }

  function login(user, type) {

    VFS.mkdirp("/export/home/" + user + "/.dt/types", "/");
    VFS.mkdirp("/export/home/" + user + "/.dt/sessions/current", "/");
    VFS.mkdirp("/export/home/" + user + "/.dt/icons", "/");
    $("#login").style.display = "none";
    Dt.reload();
    /* a new session starts on a clear screen, whichever desktop it is */
    Wm.all().slice().forEach(w => Wm.close(w, true));
    $("#wins").innerHTML = ""; $("#icons").innerHTML = "";
    $$("#stage > .ol, #stage > div[data-transient]").forEach(n => n.remove());
