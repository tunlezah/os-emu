<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solaris 2.6 / CDE 1.2 — The OS Museum</title>
<meta name="description" content="An interactive, single-file simulation of the Common Desktop Environment 1.2 as shipped with Solaris 2.6 on a SPARC workstation, July 1997. Front Panel, subpanels, four workspaces, and a session that really does come back.">
<style>
/* ==========================================================================
   Solaris 2.6 / CDE 1.2 — a single-file exhibit for The OS Museum
   --------------------------------------------------------------------------
   Everything here is original and generated in code.  No external fonts,
   images, scripts or stylesheets; no network access of any kind.  Runs from
   file:// with LocalStorage for persistence.

   Motif's visual language needs no artwork at all: every bevel is a two-tone
   border, every etched separator is a light line beside a dark one, and
   nothing is round.  That is why this file has a CSS budget of a few hundred
   lines and can spend the rest on behaviour.
   ========================================================================== */

/* ---- museum chrome (this is the museum talking, not Solaris) ---------- */
:root{
  --mus-bg:#0a0c11; --mus-panel:#12151f; --mus-fg:#e8ecf5; --mus-dim:#94a0b8;
  --mus-edge:#242c40; --mus-accent:#9b8cff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--mus-bg)}
body{font:13px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--mus-fg);-webkit-user-select:none;user-select:none}

.mus-rail{position:fixed;left:0;right:0;top:0;height:34px;z-index:900;display:flex;align-items:center;
  gap:7px;padding:0 10px;background:var(--mus-panel);border-bottom:1px solid var(--mus-edge)}
.mus-rail .brand{font:600 12px/1 inherit;letter-spacing:.02em;white-space:nowrap}
.mus-rail .brand span{color:var(--mus-accent);font-weight:400;margin-left:8px;
  font:11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase}
.mus-rail .spacer{flex:1 1 auto}
.mus-btn{background:#1a2032;border:1px solid var(--mus-edge);color:var(--mus-dim);border-radius:4px;
  font:11px/1 inherit;padding:6px 9px;cursor:pointer;white-space:nowrap}
.mus-btn:hover{color:var(--mus-fg);border-color:var(--mus-accent)}
.mus-btn.on{background:var(--mus-accent);border-color:var(--mus-accent);color:#120a2a;font-weight:700}
.mus-btn.warn:hover{border-color:#ff8f8f;color:#ffd7d7}
.mus-rail a.mus-btn{text-decoration:none;display:inline-block}
@media (max-width:900px){ .mus-rail .hideable{display:none} }

/* ---- the screen ------------------------------------------------------- */
#viewport{position:fixed;left:0;right:0;top:34px;bottom:0;background:#04050a;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1152px;height:900px;flex:0 0 auto;transform-origin:center center;
  background:#000;overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.85);
  /* CDE palette — rewritten by the theme engine from the current palette */
  --bg:#aeb2c3; --ts:#dcdfe8; --bs:#5f6474; --sel:#989db0; --fg:#000000;
  --fp:#aeb2c3; --fpts:#dcdfe8; --fpbs:#5f6474;
  --wfa:#8f9ab8; --wfats:#c3cbe0; --wfabs:#4e5673; --wfaf:#000;
  --wfi:#9ea2b2; --wfits:#cbcedb; --wfibs:#565b6a; --wfif:#000;
  --tbg:#f2f2f2; --tfg:#000000; --sbg:#3f4a63; --sfg:#ffffff;
  --bd1:#666d84; --bd2:#7c8399;
  --ui:12px Helvetica,Arial,"Nimbus Sans","Liberation Sans",sans-serif;
  --uib:bold 12px Helvetica,Arial,"Nimbus Sans","Liberation Sans",sans-serif;
  --mono:12px/15px "DejaVu Sans Mono","Liberation Mono",Menlo,Consolas,"Courier New",monospace;
  font:var(--ui);color:var(--fg);cursor:default
}
#stage.mono{filter:grayscale(1)}
#stage canvas{image-rendering:pixelated}
#stage.busywait, #stage.busywait *{cursor:wait !important}

/* the root window: a tiled two-colour backdrop, exactly as CDE drew them */
#root{position:absolute;inset:0;background-color:var(--bd1);background-repeat:repeat}

/* ---- Motif primitives ------------------------------------------------- */
.m-out{border:2px solid;border-color:var(--ts) var(--bs) var(--bs) var(--ts)}
.m-in{border:2px solid;border-color:var(--bs) var(--ts) var(--ts) var(--bs)}
.m-out1{border:1px solid;border-color:var(--ts) var(--bs) var(--bs) var(--ts)}
.m-in1{border:1px solid;border-color:var(--bs) var(--ts) var(--ts) var(--bs)}
.m-flat{background:var(--bg)}
.m-etch-h{height:2px;border-top:1px solid var(--bs);border-bottom:1px solid var(--ts);margin:3px 0}
.m-etch-v{width:2px;border-left:1px solid var(--bs);border-right:1px solid var(--ts)}

.m-btn{display:inline-flex;align-items:center;justify-content:center;min-width:60px;padding:3px 11px;
  background:var(--bg);color:var(--fg);font:var(--ui);border:2px solid;
  border-color:var(--ts) var(--bs) var(--bs) var(--ts);cursor:pointer;text-align:center;
  line-height:15px;white-space:nowrap}
.m-btn:active,.m-btn.armed{border-color:var(--bs) var(--ts) var(--ts) var(--bs);background:var(--sel)}
.m-btn.def{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--bs)}
.m-btn.dis{color:#7a7a7a;cursor:default}
.m-btn.dis:active{border-color:var(--ts) var(--bs) var(--bs) var(--ts);background:var(--bg)}
.m-btn.sm{min-width:0;padding:2px 7px;font-size:11px}

/* Motif toggles are squares; Motif radios are diamonds.  This is not a
   stylistic flourish — it is how you tell one from the other. */
.m-tog{display:flex;align-items:center;gap:7px;cursor:pointer;padding:2px 3px}
.m-tog .box{width:13px;height:13px;flex:0 0 auto;background:var(--bg);border:2px solid;
  border-color:var(--ts) var(--bs) var(--bs) var(--ts)}
.m-tog.on .box{border-color:var(--bs) var(--ts) var(--ts) var(--bs);background:var(--sbg)}
.m-tog .dia{width:15px;height:15px;flex:0 0 auto;position:relative}
.m-tog .dia i{position:absolute;inset:1px;background:var(--bg);transform:rotate(45deg);
  border:2px solid;border-color:var(--ts) var(--bs) var(--bs) var(--ts)}
.m-tog.on .dia i{border-color:var(--bs) var(--ts) var(--ts) var(--bs);background:var(--sbg)}
.m-tog.dis{color:#7a7a7a;cursor:default}

.m-lab{font:var(--ui);padding:2px 0}
.m-labb{font:var(--uib);padding:2px 0}
.m-field{background:var(--tbg);color:var(--tfg);font:var(--ui);border:2px solid;
  border-color:var(--bs) var(--ts) var(--ts) var(--bs);padding:2px 4px;outline:none;
  -webkit-user-select:text;user-select:text}
.m-field:focus{box-shadow:inset 0 0 0 1px var(--sbg)}
.m-frame{background:var(--bg);border:2px solid;border-color:var(--bs) var(--ts) var(--ts) var(--bs)}
.m-group{border:2px solid;border-color:var(--bs) var(--ts) var(--ts) var(--bs);padding:7px;position:relative;margin-top:8px}
.m-group>.gl{position:absolute;top:-9px;left:7px;background:var(--bg);padding:0 4px;font:var(--uib)}

/* option menu (Motif's drop-down button, with the tell-tale bar on the left) */
.m-opt{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:2px solid;
  border-color:var(--ts) var(--bs) var(--bs) var(--ts);padding:2px 8px 2px 3px;cursor:pointer;font:var(--ui)}
.m-opt .grip{width:14px;height:16px;background:var(--bg);border:2px solid;
  border-color:var(--ts) var(--bs) var(--bs) var(--ts);flex:0 0 auto}
.m-opt .val{min-width:60px}

/* lists */
.m-list{background:var(--tbg);color:var(--tfg);border:2px solid;
  border-color:var(--bs) var(--ts) var(--ts) var(--bs);overflow:hidden;position:relative}
.m-list .row{padding:1px 5px;font:var(--ui);white-space:pre;cursor:default;line-height:16px}
.m-list .row.sel{background:var(--sbg);color:var(--sfg)}
.m-list .row.mono{font:var(--mono)}

/* Motif scrollbars: trough sunken, slider raised, an arrow at each end, and
   on the right where Motif put them. */
.m-sc{position:relative;overflow:hidden}
.m-sc>.vp{position:absolute;left:0;top:0;overflow:hidden}
.m-sc>.sbv{position:absolute;right:0;top:0;width:16px;background:var(--sel);
  border:2px solid;border-color:var(--bs) var(--ts) var(--ts) var(--bs)}
.m-sc>.sbh{position:absolute;left:0;bottom:0;height:16px;background:var(--sel);
  border:2px solid;border-color:var(--bs) var(--ts) var(--ts) var(--bs)}
.m-sc .arw{position:absolute;width:12px;height:12px;cursor:pointer}
.m-sc .arw svg{display:block}
.m-sc .thumb{position:absolute;background:var(--bg);border:2px solid;
  border-color:var(--ts) var(--bs) var(--bs) var(--ts);cursor:pointer}

/* ---- menus ------------------------------------------------------------ */
.m-menubar{display:flex;align-items:stretch;background:var(--bg);padding:1px 2px;flex:0 0 auto}
.m-menubar>.mb{padding:3px 9px;font:var(--ui);cursor:pointer;border:2px solid transparent;line-height:15px}
.m-menubar>.mb.open{border-color:var(--ts) var(--bs) var(--bs) var(--ts)}
.m-menubar>.mb.right{margin-left:auto}
.m-menu{position:absolute;z-index:700;background:var(--bg);border:2px solid;
  border-color:var(--ts) var(--bs) var(--bs) var(--ts);padding:2px;min-width:130px;
  box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.m-menu .mi{display:flex;align-items:center;gap:12px;padding:3px 8px 3px 8px;font:var(--ui);
  cursor:pointer;white-space:nowrap;border:2px solid transparent;line-height:15px}
.m-menu .mi:hover{border-color:var(--ts) var(--bs) var(--bs) var(--ts)}
.m-menu .mi.dis{color:#7a7a7a}
.m-menu .mi.dis:hover{border-color:transparent}
.m-menu .mi .lbl{flex:1 1 auto}
.m-menu .mi .acc{color:#3a3a3a;font-size:11px}
.m-menu .mi .csc{width:0;height:0;border:5px solid transparent;border-left-color:var(--fg);margin-left:6px}
.m-menu .mi .chk{width:11px;height:11px;flex:0 0 auto;border:2px solid;
  border-color:var(--ts) var(--bs) var(--bs) var(--ts);background:var(--bg)}
.m-menu .mi .chk.on{border-color:var(--bs) var(--ts) var(--ts) var(--bs);background:var(--sbg)}
.m-menu .sep{height:2px;border-top:1px solid var(--bs);border-bottom:1px solid var(--ts);margin:3px 4px}
.m-menu .ttl{font:var(--uib);padding:2px 8px 4px;text-align:center}
.m-menu u{text-decoration:underline}

/* ---- window frames (dtwm) --------------------------------------------- */
.win{position:absolute;background:var(--wfi);border:2px solid;
  border-color:var(--wfits) var(--wfibs) var(--wfibs) var(--wfits);display:flex;flex-direction:column}
.win.act{background:var(--wfa);border-color:var(--wfats) var(--wfabs) var(--wfabs) var(--wfats)}
.win .fr{position:relative;flex:1 1 auto;display:flex;flex-direction:column;margin:3px}
.win .tb{display:flex;align-items:stretch;height:23px;flex:0 0 auto;background:var(--wfi);
  border:2px solid;border-color:var(--wfits) var(--wfibs) var(--wfibs) var(--wfits)}
.win.act .tb{background:var(--wfa);border-color:var(--wfats) var(--wfabs) var(--wfabs) var(--wfats)}
.win .tb .tbtn{width:19px;flex:0 0 auto;margin:1px;background:inherit;border:2px solid;
  border-color:var(--wfits) var(--wfibs) var(--wfibs) var(--wfits);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.win.act .tb .tbtn{border-color:var(--wfats) var(--wfabs) var(--wfabs) var(--wfats)}
.win .tb .tbtn:active{border-color:var(--wfibs) var(--wfits) var(--wfits) var(--wfibs)}
.win .tb .ttl{flex:1 1 auto;display:flex;align-items:center;justify-content:center;font:var(--uib);
  color:var(--wfif);overflow:hidden;white-space:nowrap;cursor:default;padding:0 6px}
.win.act .tb .ttl{color:var(--wfaf)}
.win .cl{flex:1 1 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
.win .rz{position:absolute;z-index:5}
.win .rz.n{left:14px;right:14px;top:-2px;height:6px;cursor:n-resize}
.win .rz.s{left:14px;right:14px;bottom:-2px;height:6px;cursor:s-resize}
.win .rz.w{top:14px;bottom:14px;left:-2px;width:6px;cursor:w-resize}
.win .rz.e{top:14px;bottom:14px;right:-2px;width:6px;cursor:e-resize}
.win .rz.nw{left:-2px;top:-2px;width:18px;height:18px;cursor:nw-resize}
.win .rz.ne{right:-2px;top:-2px;width:18px;height:18px;cursor:ne-resize}
.win .rz.sw{left:-2px;bottom:-2px;width:18px;height:18px;cursor:sw-resize}
.win .rz.se{right:-2px;bottom:-2px;width:18px;height:18px;cursor:se-resize}
.win.dial .rz{display:none}
#rubber{position:absolute;border:2px dashed #fff;mix-blend-mode:difference;z-index:800;display:none;pointer-events:none}

/* minimised windows become icons on the desktop, not entries in a taskbar */
.dicon{position:absolute;width:74px;padding:2px;background:var(--bg);border:2px solid;
  border-color:var(--ts) var(--bs) var(--bs) var(--ts);text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.dicon .lb{font:11px Helvetica,Arial,sans-serif;line-height:14px;max-width:70px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.dicon.sel{background:var(--sbg);color:var(--sfg)}

/* ---- Front Panel ------------------------------------------------------ */
#fp{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:400;display:flex;
  flex-direction:column;align-items:center}
#fp.rolled .fp-main{display:none}
.fp-main{background:var(--fp);border:2px solid;border-color:var(--fpts) var(--fpbs) var(--fpbs) var(--fpts);
  display:flex;align-items:stretch;padding:1px}
.fp-hand{width:14px;background:var(--fp);border:2px solid;
  border-color:var(--fpts) var(--fpbs) var(--fpbs) var(--fpts);margin:1px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.fp-hand i{width:4px;height:26px;border-left:1px solid var(--fpbs);border-right:1px solid var(--fpts)}
.fp-col{display:flex;flex-direction:column;align-items:center;width:52px}
.fp-arw{height:12px;width:34px;margin:1px auto 0;background:var(--fp);border:2px solid;
  border-color:var(--fpts) var(--fpbs) var(--fpbs) var(--fpts);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.fp-arw.blank{border-color:transparent;background:transparent;cursor:default}
.fp-arw:active{border-color:var(--fpbs) var(--fpts) var(--fpts) var(--fpbs)}
.fp-ctl{width:48px;height:48px;margin:1px;background:var(--fp);border:2px solid transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.fp-ctl:hover{border-color:var(--fpts) var(--fpbs) var(--fpbs) var(--fpts)}
.fp-ctl:active,.fp-ctl.armed{border-color:var(--fpbs) var(--fpts) var(--fpts) var(--fpbs)}
.fp-ctl.dz{border-color:var(--fpbs) var(--fpts) var(--fpts) var(--fpbs);background:var(--sel)}
.fp-switch{display:flex;align-items:stretch;background:var(--fp);border:2px solid;
  border-color:var(--fpbs) var(--fpts) var(--fpts) var(--fpbs);margin:1px 3px;padding:2px;gap:2px}
.fp-swcol{display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.fp-swbtn{width:26px;height:26px;background:var(--fp);border:2px solid;
  border-color:var(--fpts) var(--fpbs) var(--fpbs) var(--fpts);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.fp-swbtn:active{border-color:var(--fpbs) var(--fpts) var(--fpts) var(--fpbs)}
.fp-ws{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.fp-wsb{min-width:52px;height:26px;background:var(--fp);border:2px solid;
  border-color:var(--fpts) var(--fpbs) var(--fpbs) var(--fpts);cursor:pointer;font:11px Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;padding:0 3px}
.fp-wsb.cur{border-color:var(--fpbs) var(--fpts) var(--fpts) var(--fpbs);background:var(--sel);font-weight:700}
.fp-busy{width:26px;height:12px;background:#3d4436;border:2px solid;
  border-color:var(--fpbs) var(--fpts) var(--fpts) var(--fpbs)}
.fp-busy.on{background:#7dff5a}
.fp-sub{position:absolute;bottom:100%;background:var(--fp);border:2px solid;
  border-color:var(--fpts) var(--fpbs) var(--fpbs) var(--fpts);padding:3px;z-index:410;min-width:170px;
  box-shadow:2px -2px 0 rgba(0,0,0,.25)}
.fp-sub .sti{font:var(--uib);text-align:center;padding:1px 0 4px}
.fp-sub .row{display:flex;align-items:center;gap:8px;padding:3px 5px;cursor:pointer;
  border:2px solid transparent;font:var(--ui)}
.fp-sub .row:hover{border-color:var(--fpts) var(--fpbs) var(--fpbs) var(--fpts)}
.fp-sub .instz{margin-top:3px;border:2px solid;border-color:var(--fpbs) var(--fpts) var(--fpts) var(--fpbs);
  padding:5px;text-align:center;font:11px Helvetica,Arial,sans-serif;color:#333}
.fp-sub .instz.hot{background:var(--sel);color:var(--fg)}
.fp-tab{background:var(--fp);border:2px solid;border-color:var(--fpts) var(--fpbs) var(--fpbs) var(--fpts);
  padding:1px 22px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ---- drag ghost ------------------------------------------------------- */
#dragghost{position:absolute;z-index:950;pointer-events:none;display:none;opacity:.85}
.dropok{outline:2px solid #ffff00;outline-offset:-2px}

/* ---- terminal --------------------------------------------------------- */
.term{background:#f2f2f2;color:#000;font:var(--mono);padding:2px 4px;overflow:hidden;
  white-space:pre-wrap;word-break:break-word;flex:1 1 auto;-webkit-user-select:text;user-select:text}
.term.rev{background:#000;color:#e8e8e8}
.term .cur{background:#000;color:#f2f2f2}
.term.rev .cur{background:#e8e8e8;color:#000}

/* ---- login (dtlogin) -------------------------------------------------- */
#login{position:absolute;inset:0;z-index:600;background:#3a4a63;display:flex;
  align-items:center;justify-content:center;flex-direction:column}
#login .lbox{width:430px;background:var(--bg);border:2px solid;
  border-color:var(--ts) var(--bs) var(--bs) var(--ts);padding:0}
#login .lhead{padding:14px 16px 8px;display:flex;align-items:center;gap:14px}
#login .ltitle{font:bold 15px Helvetica,Arial,sans-serif}
#login .lsub{font:11px Helvetica,Arial,sans-serif;color:#2a2a2a}
#login .lbody{padding:6px 22px 16px}
#login .lrow{display:flex;align-items:center;gap:10px;margin:8px 0}
#login .lrow label{width:88px;text-align:right;font:var(--ui)}
#login .lrow input{flex:1 1 auto}
#login .lbtns{display:flex;gap:10px;justify-content:center;padding:10px 0 4px}
#login .lmsg{min-height:16px;text-align:center;font:11px Helvetica,Arial,sans-serif;color:#5a0000}
#login .lhint{width:430px;margin-top:14px;font:11px/1.5 Helvetica,Arial,sans-serif;color:#d7dbe6;
  background:#2c3a50;border:1px solid #55607a;padding:9px 12px}
#login .lhint b{color:#fff}
#login .lhint code{font:11px ui-monospace,Menlo,Consolas,monospace;color:#ffe58f}

/* ---- guide layer (separable; nothing in the simulation calls into it) -- */
#guide{position:fixed;right:0;top:34px;bottom:0;width:392px;z-index:920;background:#0c111ceb;
  border-left:1px solid var(--mus-edge);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .18s ease;backdrop-filter:blur(2px)}
#guide.on{transform:none}
#guide header{flex:0 0 auto;padding:10px 12px;border-bottom:1px solid var(--mus-edge);display:flex;
  align-items:center;gap:9px}
#guide header h2{font:700 13px inherit;flex:1 1 auto}
#guide .gtabs{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:4px;padding:7px 8px 0}
#guide .gtabs button{background:#141a28;border:1px solid var(--mus-edge);border-bottom:0;color:#93a2bb;
  padding:4px 8px;font:11px inherit;cursor:pointer;border-radius:3px 3px 0 0}
#guide .gtabs button.on{background:#0c111c;color:var(--mus-accent);font-weight:700;border-color:#39435f}
#guide .gbody{flex:1 1 auto;overflow:auto;border-top:1px solid var(--mus-edge);padding:12px 14px 40px;
  font:13px/1.55 inherit;color:#cfd6e4}
#guide .gbody h3{font:700 13px inherit;color:#fff;margin:16px 0 6px}
#guide .gbody h3:first-child{margin-top:0}
#guide .gbody p{margin:0 0 9px}
#guide .gbody ul,#guide .gbody ol{margin:0 0 10px 18px}
#guide .gbody li{margin-bottom:5px}
#guide .gbody b{color:#fff}
#guide .gbody code{font:12px ui-monospace,Menlo,Consolas,monospace;color:#ffd98a;
  background:#1a2030;padding:1px 4px;border-radius:3px}
#guide .gbody a{color:var(--mus-accent)}
#guide .note{border-left:3px solid var(--mus-accent);background:#151b2b;padding:8px 10px;margin:0 0 10px}
#guide .warn{border-left:3px solid #ff9d6e;background:#221a16;padding:8px 10px;margin:0 0 10px}
#guide .gbody table{border-collapse:collapse;width:100%;margin:0 0 10px;font-size:12px}

const $  = (s, r) => (r || document).querySelector(s);

  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pad2 = n => String(n).padStart(2, "0");
const padr = (s, n) => { s = String(s); return s.length >= n ? s : s + " ".repeat(n - s.length); };
const padl = (s, n) => { s = String(s); return s.length >= n ? s : " ".repeat(n - s.length) + s; };
const irnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const uid = (() => { let n = 1000; return p => (p || "id") + (++n); })();
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONF = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYF = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function fmtDate(d) { return DAY[d.getDay()] + " " + MON[d.getMonth()] + " " + padl(d.getDate(), 2) + " " +
  pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()) + " " + d.getFullYear(); }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function hex(n) { return "#" + n.map(c => pad2(clamp(Math.round(c), 0, 255).toString(16))).join(""); }
function unhex(s) { s = s.replace("#", ""); return [0, 2, 4].map(i => parseInt(s.substr(i, 2), 16)); }
/* Motif derives the shadow colours from the background rather than storing
   them.  Bright backgrounds get a darkened top shadow; dark ones a lightened
   bottom shadow.  These are the ratios Motif's XmGetColors uses. */
function shadows(bgHex) {
  const c = unhex(bgHex), lum = (c[0] * 299 + c[1] * 587 + c[2] * 114) / 1000;
  const mul = (f, cap) => hex(c.map(x => cap ? Math.min(255, x * f) : x * f));
  let ts, bs, sel;
  if (lum > 228) { ts = mul(0.9); bs = mul(0.55); }
  else if (lum < 26) { ts = "#7a7a7a"; bs = "#2a2a2a"; }
  else { ts = mul(1.5, true); bs = mul(0.55); }
  sel = mul(0.85);
  return { ts, bs, sel, fg: lum > 140 ? "#000000" : "#ffffff" };

/* ==========================================================================
   MODULE 1 — STATE MANAGER
   --------------------------------------------------------------------------
   One key in LocalStorage, one module that touches it.  Everything the
   visitor can change lands here: both saved sessions, Style Manager
   settings, Front Panel customisation, created files, registered
   datatypes, mail and calendar state.
   ========================================================================== */
const State = (() => {
  const KEY = "solaris26-cde-exhibit-v1";
  let data = {};
  let timer = null;
  function load() {
    try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { data = {}; }
    return data;
  }
  function flush() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { } }
  function dirty() { clearTimeout(timer); timer = setTimeout(flush, 400); }
  function get(k, d) { return data[k] === undefined ? d : data[k]; }
  function set(k, v) { data[k] = v; dirty(); return v; }

    { n: "NoBackdrop", size: 8, draw: () => { } },
    { n: "Background", size: 8, draw: (g, s, a, b) => { g.fillStyle = b; g.fillRect(0, 0, s, s); } },

  const tileCache = new Map();
  function tile(name, bg, fg) {

    set("--uib", "bold " + fs + "px Helvetica,Arial,'Nimbus Sans','Liberation Sans',sans-serif");
    set("--mono", fs + "px/" + (fs + 3) + "px 'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace");

  return { PALETTES, BACKDROPS, apply, applyBackdrop, palette, tile, swatch };
})();

/* ==========================================================================
   MODULE 3 — A TINY MESSAGE BUS
   --------------------------------------------------------------------------
   The theme engine, the guide layer and the applications never call each
   other directly.  That is what makes the guide layer removable.
   ========================================================================== */
const Bus = (() => {
  const subs = {};
  return {
    on(ev, fn) { (subs[ev] = subs[ev] || []).push(fn); return () => { subs[ev] = subs[ev].filter(f => f !== fn); }; },
    emit(ev, arg) { for (const f of (subs[ev] || []).slice()) { try { f(arg); } catch (e) { console.warn(ev, e); } } }
  };
})();

/* ==========================================================================
   MODULE 4 — THE ICON SET
   --------------------------------------------------------------------------
   Original artwork in the CDE idiom: chunky, flat, a thin dark outline, a
   limited palette and a slight bevel.  Everything is drawn on a canvas at
   run time; there is not one image file in this exhibit.  Icon sizes follow
   CDE's own conventions — 16 (tiny), 32 (medium), 48 (large).
   ========================================================================== */

  const C = {
    k: "#000000", w: "#ffffff", g1: "#d0d0d0", g2: "#9a9a9a", g3: "#5c5c5c", g4: "#333333",

    ye: "#c9a534", or: "#b6702c", re: "#963030", ta: "#c9b48a", t2: "#a08c62", pu: "#6a4f96",
    sc: "#e8e8d8", pa: "#efe7cf"

    if (fill) { g.fillStyle = fill; g.fillRect(x, y, w, h); }

    g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(x, y + h - 1, w, 1); g.fillRect(x + w - 1, y, 1, h);
    g.strokeStyle = C.k; g.strokeRect(x + .5, y + .5, w - 1, h - 1);

    g.closePath();

    g.fillStyle = C.b2; g.fillRect(15, 15, 10, 10); g.fillStyle = C.re; g.fillRect(10, 20, 5, 5);

/* ==========================================================================
   MODULE 5 — THE VIRTUAL FILESYSTEM
   --------------------------------------------------------------------------
   System V Release 4 layout, which is the whole point of the exhibit's
   pairing with the SunOS 4.1.4 wing next door: /kernel/genunix rather than
   /vmunix, /export/home rather than /home, /usr/ucb kept around for BSD
   compatibility, and CDE living in /usr/dt.
   ========================================================================== */
const VFS = (() => {
  const T0 = Date.UTC(1997, 6, 18, 9, 14, 0);
  function dir(own, grp, mode) { return { t: "d", c: {}, own: own || "root", grp: grp || "sys",
    mode: mode || "drwxr-xr-x", mt: T0 }; }
  function file(d, own, grp, mode) { return { t: "f", d: d === undefined ? "" : d, own: own || "root",
    grp: grp || "sys", mode: mode || "-rw-r--r--", mt: T0 }; }
  function link(to) { return { t: "l", to: to, own: "root", grp: "root", mode: "lrwxrwxrwx", mt: T0 }; }

  const root = dir();
  function norm(p, cwd) {
    if (!p) p = ".";
    p = String(p).replace(/^~(?=$|\/)/, "/export/home/" + (Sys ? Sys.user : "kmartin"));
    let parts = (p[0] === "/" ? p : (cwd || "/") + "/" + p).split("/");
    const out = [];
    for (const s of parts) { if (!s || s === ".") continue; if (s === "..") out.pop(); else out.push(s); }
    return "/" + out.join("/");
  }
  function lookup(p, cwd, follow) {
    const path = norm(p, cwd);
    if (path === "/") return root;
    let n = root, hops = 0;
    const parts = path.slice(1).split("/");
    for (let i = 0; i < parts.length; i++) {
      if (!n || n.t === "f") return null;
      if (n.t === "l") { const t = lookup(n.to, "/"); if (!t || ++hops > 8) return null; n = t; i--; continue; }
      n = n.c[parts[i]];
      if (n && n.t === "l" && (follow !== false || i < parts.length - 1)) {
        const t = lookup(n.to, "/"); if (++hops > 8) return null; n = t;
      }
    }
    return n || null;
  }
  function parentOf(p, cwd) { const path = norm(p, cwd); const i = path.lastIndexOf("/");
    return { dir: lookup(path.slice(0, i) || "/", "/"), name: path.slice(i + 1), path: path }; }
  function mkdirp(p, cwd, own) {
    const path = norm(p, cwd);
    let n = root;
    for (const s of path.slice(1).split("/")) {
      if (!s) continue;
      if (!n.c[s]) { n.c[s] = dir(own || (Sys ? Sys.user : "root"), "staff", "drwxr-xr-x"); n.c[s].user = true; }
      n = n.c[s]; if (n.t === "l") n = lookup(n.to, "/");
      if (!n || n.t === "f") return null;
    }
    return n;
  }
  function put(p, data, cwd, opts) {
    const { dir: d, name } = parentOf(p, cwd);
    if (!d || d.t !== "d") return null;
    const ex = d.c[name];
    if (ex && ex.t === "d") return null;
    const n = ex || file(data, (opts && opts.own) || (Sys ? Sys.user : "root"), (opts && opts.grp) || "staff",
      (opts && opts.mode) || "-rw-r--r--");
    n.d = data; n.mt = Date.now();
    if (opts && opts.own) n.own = opts.own;
    if (opts && opts.mode) n.mode = opts.mode;
    if (opts && opts.user !== false) n.user = true;
    d.c[name] = n;
    Bus.emit("fs", { path: norm(p, cwd), op: ex ? "write" : "create" });
    return n;
  }
  function mkdir(p, cwd) { const r = mkdirp(p, cwd); if (r) Bus.emit("fs", { path: norm(p, cwd), op: "mkdir" }); return r; }
  function rm(p, cwd) {
    const { dir: d, name, path } = parentOf(p, cwd);
    if (!d || !d.c[name]) return false;
    delete d.c[name];
    Bus.emit("fs", { path: path, op: "unlink" });
    return true;
  }
  function mv(from, to, cwd) {
    const a = parentOf(from, cwd);
    if (!a.dir || !a.dir.c[a.name]) return false;
    const node = a.dir.c[a.name];
    let tp = norm(to, cwd), tn = lookup(tp, "/");
    if (tn && tn.t === "d") tp = tp.replace(/\/$/, "") + "/" + a.name;
    const b = parentOf(tp, "/");
    if (!b.dir || b.dir.t !== "d") return false;
    delete a.dir.c[a.name];
    b.dir.c[b.name] = node; node.user = true;
    Bus.emit("fs", { path: tp, op: "rename", from: a.path });
    return true;
  }
  function cp(from, to, cwd) {
    const n = lookup(from, cwd);
    if (!n) return false;
    const clone = o => o.t === "d"
      ? Object.assign({}, o, { c: Object.fromEntries(Object.entries(o.c).map(([k, v]) => [k, clone(v)])), user: true })
      : Object.assign({}, o, { user: true });
    let tp = norm(to, cwd), tn = lookup(tp, "/");
    if (tn && tn.t === "d") tp = tp.replace(/\/$/, "") + "/" + norm(from, cwd).split("/").pop();
    const b = parentOf(tp, "/");
    if (!b.dir || b.dir.t !== "d") return false;
    b.dir.c[b.name] = clone(n);
    Bus.emit("fs", { path: tp, op: "create" });
    return true;
  }
  function ls(p, cwd) {
    const n = lookup(p, cwd);
    if (!n || n.t !== "d") return null;
    return Object.keys(n.c).sort((a, b) => a.localeCompare(b)).map(k => ({ name: k, node: n.c[k] }));
  }
  function size(n) { return n.t === "d" ? 512 : (n.t === "l" ? (n.to || "").length : (n.d || "").length); }
  function isDir(n) { return n && n.t === "d"; }

  /* ---- populate an SVR4 machine -------------------------------------- */
  function build(spec, base) {
    for (const k in spec) {
      const v = spec[k];
      const p = (base || "") + "/" + k;
      if (typeof v === "string") { const q = parentOf(p, "/"); q.dir.c[q.name] = file(v); }

      else { const d = mkdirp(p, "/"); d.user = false; build(v, p); }
    }
  }
  const L = to => ({ __link: to });
  return { root, norm, lookup, mkdirp, mkdir, put, rm, mv, cp, ls, size, isDir, parentOf, build, L, file, dir, link,
    T0 };
})();

/* ==========================================================================
   MODULE 6 — THE SESSION MANAGER AND THE WORKSPACE MODEL
   --------------------------------------------------------------------------
   This module was written before a single application existed, and that
   ordering is the whole architectural argument of the exhibit.  Session save
   and restore is CDE's real machinery; it cannot be bolted on afterwards
   without turning into a facade that loses state.  So:

     *  a workspace is a named thing with its own backdrop;
     *  a window's home is an OCCUPANCY SET, never a single workspace;
     *  every application must hand over its internal state on demand and
        take it back on restore, as a condition of being registered at all.

   dtsession itself keeps no knowledge of any particular application.  It
   asks a provider (dtwm, in Module 10) for the window list, and it asks the
   application registry to rebuild each one.  Nothing here imports an app.
   ========================================================================== */
const Session = (() => {
  const DEFAULT_WS = ["One", "Two", "Three", "Four"];
  const DEFAULT_BD = ["Corrugation", "Ndeble", "Wave", "SandDollar"];
  let ws = [], cur = 0, provider = null;

  function setProvider(p) { provider = p; }
  function workspaces() { return ws; }
  function currentWs() { return ws[cur] || ws[0]; }
  function currentIndex() { return cur; }
  function names() { return ws.map(w => w.name); }

  function init(spec) {
    ws = (spec && spec.ws) ? spec.ws.map(w => ({ name: w.name, backdrop: w.backdrop }))
      : DEFAULT_WS.map((n, i) => ({ name: n, backdrop: DEFAULT_BD[i] }));
    cur = clamp((spec && spec.cur) || 0, 0, ws.length - 1);
  }
  function switchTo(i) {
    if (i < 0 || i >= ws.length || i === cur) { if (i === cur) Bus.emit("wschange", cur); return; }
    cur = i;
    Theme.applyBackdrop();
    Bus.emit("wschange", cur);
    persist();
  }
  function add(name) {
    if (ws.length >= 8) return null;
    let n = 1, nm = name;
    if (!nm) { do { nm = "ws" + n++; } while (ws.some(w => w.name === nm)); }
    ws.push({ name: nm, backdrop: DEFAULT_BD[(ws.length) % DEFAULT_BD.length] });
    Bus.emit("wslist"); persist();
    return ws.length - 1;
  }
  function remove(i) {
    if (ws.length <= 1 || i < 0 || i >= ws.length) return false;
    ws.splice(i, 1);
    if (provider) provider.workspaceRemoved(i, ws.length);
    if (cur >= ws.length) cur = ws.length - 1;
    Theme.applyBackdrop();
    Bus.emit("wslist"); Bus.emit("wschange", cur); persist();
    return true;
  }
  function rename(i, name) {
    if (!ws[i] || !name) return false;
    ws[i].name = name.slice(0, 14);
    Bus.emit("wslist"); persist();
    return true;
  }
  function setBackdrop(i, bd) {
    if (!ws[i]) return;
    ws[i].backdrop = bd;
    if (i === cur) Theme.applyBackdrop();
    Bus.emit("wslist"); persist();
  }

  /* ---- serialisation ------------------------------------------------- */
  function snapshot() {
    return {
      ws: ws.map(w => ({ name: w.name, backdrop: w.backdrop })),
      cur: cur,
      clients: provider ? provider.serialise() : [],
      style: Style ? Style.snapshot() : {},
      panel: Panel ? Panel.snapshot() : {},
      stamp: Date.now()
    };
  }
  function restore(snap, opts) {
    if (!snap) return false;
    init(snap);
    if (snap.style && Style) Style.load(snap.style);
    if (snap.panel && Panel) Panel.load(snap.panel);
    Theme.apply();
    Bus.emit("wslist");
    if (provider) provider.deserialise(snap.clients || [], opts || {});
    Bus.emit("wschange", cur);
    return true;
  }
  /* CDE writes the session out as files under ~/.dt/sessions/<slot>/.  This
     writes a readable equivalent so that you can go and look at it in the
     Text Editor, which is exactly the kind of thing CDE let you do. */
  function writeSessionFiles(slot, snap) {
    const dir = "/export/home/" + Sys.user + "/.dt/sessions/" + slot;
    VFS.mkdirp(dir, "/");
    let out = "! dt.session -- written by dtsession " + Sys.cde + "\n" +
      "! " + fmtDate(new Date()) + "\n" +
      "! This file is read at login.  Editing it by hand is supported and\n" +
      "! was, for a while, the only way to fix a session that would not come\n" +
      "! back the way you wanted it.\n!\n" +
      "*workspaceCount:\t" + snap.ws.length + "\n" +
      "*workspaceList:\t" + snap.ws.map(w => w.name).join(" ") + "\n" +
      "*currentWorkspace:\t" + (snap.ws[snap.cur] || { name: "One" }).name + "\n" +
      "*clientCount:\t" + snap.clients.length + "\n!\n";
    snap.clients.forEach((c, i) => {
      const app = Apps.get(c.app);
      out += "*" + i + "*commandString:\t" + ((app && app.exec) || c.app) + "\n";
      out += "*" + i + "*geometry:\t" + c.w + "x" + c.h + "+" + c.x + "+" + c.y + "\n";
      out += "*" + i + "*workspaceOccupancy:\t" + c.occ.map(k => (snap.ws[k] || {}).name || k).join(" ") + "\n";
      if (c.min) out += "*" + i + "*iconic:\tTrue\n";
      out += "*" + i + "*windowTitle:\t" + (c.title || "") + "\n!\n";
    });
    VFS.put(dir + "/dt.session", out, "/", { own: Sys.user, user: false });
    VFS.put(dir + "/dt.resources",
      "! dt.resources -- Style Manager settings for this session.\n" +
      "*palette:\t" + State.get("palette", "Default") + ".dp\n" +
      "*backdrop:\t" + snap.ws.map(w => w.backdrop).join(" ") + "\n" +
      "Dtwm*keyboardFocusPolicy:\t" + (State.get("focusFollows", false) ? "pointer" : "explicit") + "\n" +
      "*enableBtn1Transfer:\t" + (State.get("btn2Adjust", false) ? "button2_transfer" : "button2_adjust") + "\n",
      "/", { own: Sys.user, user: false });
  }
  function save(slot) {
    const snap = snapshot();
    State.set("session_" + slot, snap);
    writeSessionFiles(slot, snap);
    State.flush();
    return snap;
  }
  function load(slot) { return State.get("session_" + slot, null); }
  function has(slot) { return !!load(slot); }
  function persist() { if (Sys.loggedIn) State.set("session_current", snapshot()); }

/* ==========================================================================
   MODULE 7 — THE APPLICATION REGISTRY
   --------------------------------------------------------------------------
   The structural test the exhibit set itself: adding an application should
   mean implementing the session interface and registering a datatype, and
   nothing else.  So the registry refuses to accept an application that

   anywhere in the session code, and the guide layer runs a self-test that
   proves it.

/* ==========================================================================
   MODULE 9 — THE ACTION AND DATATYPE REGISTRY
   --------------------------------------------------------------------------
   One registry, consulted by everything.  The File Manager gets its icons
   from here; double-clicking a file runs whatever this database says its
   first action is; the shell's dtaction command comes here; Create Action
   writes into it.  The files are real text files in the virtual filesystem,
   in CDE's own syntax, at CDE's own paths -- /usr/dt/appconfig/types/C for
   the system's and ~/.dt/types for yours -- and they are genuinely parsed.

    Dtterm: "dtterm", DtfileB: "dtfile", DtTrsh: "trash", Dtactn: "action", Dtimag: "image",
    Dtcore: "core", Dtaudio: "audio", Dtmail: "dtmail", Dtcm: "dtcm", Dtcalc: "dtcalc",
    Dtprint: "printer", Dtstyle: "dtstyle", Dtappmgr: "dtappmgr", Dthelp: "dthelp",

      while (i < lines.length && !/^\s*\{/.test(lines[i])) { if (/^\s*(DATA_|ACTION)/.test(lines[i])) break; i++; }
      if (!/^\s*\{/.test(lines[i] || "")) continue;
      i++;
      const rec = { name: name, src: src };
      while (i < lines.length && !/^\s*\}/.test(lines[i])) {
        const f = /^\s*([A-Z_0-9]+)\s+(.*?)\s*$/.exec(lines[i]);
        if (f) rec[f[1]] = f[2];
        i++;
      }
      i++;
      if (kind === "DATA_ATTRIBUTES") out.attrs.push(rec);
      else if (kind === "DATA_CRITERIA") out.criteria.push(rec);
      else out.actions.push(rec);
    }
    return out;
  }

  function loadDir(path, tag) {
    const ents = VFS.ls(path, "/") || [];
    for (const e of ents) {
      if (e.node.t !== "f" || !/\.dt$/.test(e.name)) continue;
      const p = parse(e.node.d, tag + ":" + e.name);
      for (const a of p.attrs) attrs[a.name] = a;
      for (const c of p.criteria) criteria.push(c);
      for (const a of p.actions) actions[a.name] = a;
    }
  }
  function reload() {
    attrs = {}; criteria = []; actions = {};
    /* the user's own database wins, so it is read first */
    loadDir("/export/home/" + Sys.user + "/.dt/types", "user");
    loadDir("/usr/dt/appconfig/types/C", "system");
    Bus.emit("dtreload");
  }

  const globRe = g => new RegExp("^" + String(g).replace(/[.+^${}()|[\]\\]/g, "\\$&")
    .replace(/\*/g, ".*").replace(/\?/g, ".") + "$");

  function match(path, node) {
    if (!node) return null;
    const base = path.split("/").pop();
    for (const c of criteria) {
      const a = attrs[c.DATA_ATTRIBUTES_NAME];
      if (!a) continue;
      const mode = c.MODE || "";
      if (mode === "d" && node.t !== "d") continue;
      if (mode === "f" && node.t !== "f") continue;
      if (mode === "&x" && !/x/.test(node.mode || "")) continue;
      if (c.NAME_PATTERN && !globRe(c.NAME_PATTERN).test(base)) continue;
      if (c.PATH_PATTERN && !globRe(c.PATH_PATTERN).test(path)) continue;
      if (c.CONTENT) {
        const cm = /^(\d+)\s+(string|byte)\s+(.*)$/.exec(c.CONTENT);
        if (cm && node.t === "f") {
          const off = parseInt(cm[1], 10);
          if (String(node.d || "").substr(off, cm[3].length) !== cm[3]) continue;
        }
      }
      return { attr: a, crit: c, type: a.name };
    }
    if (node.t === "d") return { attr: attrs.DT_FOLDER || { ICON: "DtdirB", ACTIONS: "OpenInPlace" },
      crit: null, type: "DT_FOLDER" };
    return null;
  }
  function typeName(path, node) { const m = match(path, node); return m ? m.type : (node && node.t === "d" ? "DT_FOLDER" : "DT_UNKNOWN"); }
  function describe(path, node) {
    const m = match(path, node);
    if (m && m.attr.DESCRIPTION) return m.attr.DESCRIPTION;
    return node && node.t === "d" ? "This is a folder." :
      "The desktop does not have a datatype for this file.  Create Action will\nregister one for you, or you can write it into ~/.dt/types by hand.";
  }
  function iconName(path, node) {
    const m = match(path, node);
    if (!m) return node && node.t === "d" ? "folder" : "doc";
    const ic = m.attr.ICON || "";
    if (ic.startsWith("user:")) return ic;
    if (ICONMAP[ic]) return ICONMAP[ic];
    if (Icons.has(ic)) return ic;               /* a painter named directly, e.g. by dtcreate */
    return node.t === "d" ? "folder" : "doc";
  }
  function iconEl(path, node, size) {
    const n = iconName(path, node);
    if (n.startsWith("user:")) return UserIcons.img(n.slice(5), size);
    return Icons.img(n, size);
  }
  function actionsFor(path, node) {
    const m = match(path, node);
    const names = m && m.attr.ACTIONS ? m.attr.ACTIONS.split(/\s*,\s*/) : [];
    return names.filter(n => n).map(n => ({ name: n, def: actions[n] || null,
      label: (actions[n] && actions[n].LABEL) || n }));
  }
  function defaultAction(path, node) { const a = actionsFor(path, node); return a.length ? a[0] : null; }
  function runAction(name, args, opts) {
    const a = actions[name];
    if (!a) { Mw.error("Action Not Found",
      "There is no action named\n\n    " + name + "\n\nin the action database.  Actions are defined in\n" +
      "/usr/dt/appconfig/types/C and ~/.dt/types."); return false; }
    if ((a.TYPE || "COMMAND").toUpperCase() === "MAP") return runAction(a.MAP_ACTION, args, opts);
    let cmd = a.EXEC_STRING || "";
    const arg = (args && args[0]) || "";
    cmd = cmd.replace(/%\(File\)Arg_1%/g, arg).replace(/%Arg_1%/g, arg)
      .replace(/%\(File\)Args%/g, (args || []).join(" ")).replace(/%Args%/g, (args || []).join(" "));
    cmd = cmd.trim();
    if (!cmd) return false;
    return Exec.run(cmd, Object.assign({ action: name, windowType: a.WINDOW_TYPE }, opts || {}));
  }
  function open(path, node, opts) {
    node = node || VFS.lookup(path, "/");
    if (!node) return false;
    if (node.t === "d") { Exec.run("/usr/dt/bin/dtfile -dir " + path, opts); return true; }
    const d = defaultAction(path, node);
    if (!d) {
      Mw.error("Cannot Open", "There is no action registered for\n\n    " + path.split("/").pop() +
        "\n\nThe desktop does not know what this file is, so double-clicking it\n" +
        "cannot do anything.  Use Create Action (in Application Manager,\n" +
        "Desktop_Apps) to register the file type, its icon and what opening\nit should do.", { w: 470, h: 240 });
      return false;
    }
    return runAction(d.name, [path], opts);
  }
  /* Create Action writes real .dt files.  This is what it writes. */
  function writeUserType(o) {
    const dir = "/export/home/" + Sys.user + "/.dt/types";
    VFS.mkdirp(dir, "/");
    const N = o.typeName;
    let s = "###########################################################\n" +
      "# " + N.toLowerCase() + ".dt -- written by Create Action (dtcreate)\n" +
      "# " + fmtDate(new Date()) + "\n" +
      "###########################################################\n\n" +
      "ACTION " + o.actionName + "\n{\n" +
      "  LABEL         " + (o.label || o.actionName) + "\n" +
      "  TYPE          COMMAND\n" +
      "  EXEC_STRING   " + o.exec + "\n" +
      "  ICON          " + o.icon + "\n" +
      "  WINDOW_TYPE   " + (o.windowType || "NO_STDIO") + "\n" +
      "  DESCRIPTION   " + (o.actionDesc || ("Runs the " + o.actionName + " action.")) + "\n}\n\n" +
      "DATA_ATTRIBUTES " + N + "\n{\n" +
      "  ACTIONS       " + o.actionName + ",Print\n" +
      "  ICON          " + o.icon + "\n" +
      "  DESCRIPTION   " + (o.typeDesc || ("This file is of type " + N + ".")) + "\n}\n\n" +
      "DATA_CRITERIA " + N + "1\n{\n" +
      "  DATA_ATTRIBUTES_NAME " + N + "\n" +
      "  MODE          f\n" +
      "  NAME_PATTERN  " + o.pattern + "\n}\n";
    VFS.put(dir + "/" + N.toLowerCase() + ".dt", s, "/", { own: Sys.user });
    /* CDE also dropped an action icon into the user's home folder, which is
       how the new action showed up in the File Manager. */
    VFS.put("/export/home/" + Sys.user + "/" + o.actionName,
      "#!/bin/sh\n# Desktop action file created by dtcreate.\n# Double-clicking this runs the " +
      o.actionName + " action.\nexec /usr/dt/bin/dtaction " + o.actionName + ' "$@"\n',
      "/", { own: Sys.user, mode: "-rwxr-xr-x" });
    reload();
    return s;
  }
  return { reload, parse, match, typeName, describe, iconName, iconEl, actionsFor, defaultAction,
    runAction, open, writeUserType, ICONMAP,
    allActions: () => actions, allTypes: () => attrs, allCriteria: () => criteria };
})();

/* ==========================================================================
   MODULE 9b — USER-DRAWN ICONS (dticon writes these; the registry reads them)
   ========================================================================== */
const UserIcons = (() => {
  function store() { return State.get("usericons", {}); }
  function save(name, def) {
    const s = store(); s[name] = def; State.set("usericons", s);
    /* CDE kept icons as XPM/XBM under ~/.dt/icons; so does this. */
    VFS.put("/export/home/" + Sys.user + "/.dt/icons/" + name + ".m.pm",
      "/* XPM */\n/* " + def.w + "x" + def.h + ", " + def.pal.length + " colours, drawn in dticon */\n" +
      "static char * " + name + "[] = {\n\"" + def.w + " " + def.h + " " + def.pal.length + " 1\",\n" +
      def.pal.map((c, i) => '"' + String.fromCharCode(97 + i) + '\tc ' + (c || "None") + '"').join(",\n") +
      ",\n" + def.px.map(row => '"' + row.map(v => String.fromCharCode(97 + v)).join("") + '"').join(",\n") +
      "};\n", "/", { own: Sys.user });
    Bus.emit("usericons");
  }
  function get(name) { return store()[name] || null; }
  function url(name, size) {
    const d = get(name);
    const c = document.createElement("canvas"); c.width = c.height = size;
    const g = c.getContext("2d");
    if (!d) { g.fillStyle = "#888"; g.fillRect(0, 0, size, size); return c.toDataURL(); }
    const k = size / d.w;
    for (let y = 0; y < d.h; y++) for (let x = 0; x < d.w; x++) {
      const col = d.pal[d.px[y][x]];
      if (!col || col === "None") continue;
      g.fillStyle = col; g.fillRect(Math.floor(x * k), Math.floor(y * k), Math.ceil(k), Math.ceil(k));
    }
    return c.toDataURL();
  }
  function img(name, size) {
    return el("img", { src: url(name, size), width: size, height: size, alt: "", draggable: "false" });
  }
  return { save, get, url, img, names: () => Object.keys(store()) };
})();

/* ==========================================================================
   MODULE 10 — Exec: THE ONE PLACE PROGRAMS GET STARTED
   --------------------------------------------------------------------------
   The shell, the Front Panel, the Workspace menu, Application Manager, the
   action database and a double-click in the File Manager all come through
   here.  Nothing else opens a window.
   ========================================================================== */
const Exec = (() => {
  function argv(cmd) {
    const out = []; let cur = "", q = null;
    for (const ch of String(cmd)) {
      if (q) { if (ch === q) q = null; else cur += ch; }
      else if (ch === '"' || ch === "'") q = ch;
      else if (/\s/.test(ch)) { if (cur) { out.push(cur); cur = ""; } }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }
  /* command basename -> application id, plus how its flags become state */
  const PROG = {
    dtterm:  (a) => ["dtterm", { cmd: flag(a, "-e") }],
    dtfile:  (a) => ["dtfile", a.includes("-trash") ? { trash: true }
                     : { dir: flag(a, "-dir") || a[0] || "~" }],
    dtpad:   (a) => ["dtpad", { path: pos(a) }],
    dtmail:  () => ["dtmail", {}],
    dtcm:    () => ["dtcm", {}],
    dtcalc:  () => ["dtcalc", {}],
    dticon:  (a) => ["dticon", { path: pos(a) }],
    dtprintinfo: () => ["dtprintinfo", {}],
    sdtimage: (a) => ["sdtimage", { path: pos(a) }],
    dtstyle: (a) => ["dtstyle", { item: flag(a, "-item") }],
    dtappmgr: (a) => ["dtappmgr", { dir: flag(a, "-dir") }],
    dthelpview: (a) => ["dthelpview", { volume: flag(a, "-helpVolume"), topic: flag(a, "-locationId") }],
    dtcreate: () => ["dtcreate", {}],
    dtksh:   (a) => ["dtksh", { path: pos(a) }],
    hotjava: (a) => ["hotjava", { url: pos(a) }],
    dtcmclock: () => ["dtclock", {}],
    /* the OpenWindows DeskSet, still installed, still OPEN LOOK */
    textedit: (a) => ["owtextedit", { path: pos(a) }],
    perfmeter: () => ["owperfmeter", {}],
    clock:   () => ["owclock", {}],
    filemgr: () => ["owfilemgr", {}],
    cmdtool: () => ["dtterm", { ol: true }],
    snapshot: () => ["owsnapshot", {}]
  };
  const flag = (a, f) => { const i = a.indexOf(f); return i >= 0 ? a[i + 1] : null; };
  const pos = a => { for (let i = 1; i < a.length; i++) if (a[i][0] !== "-" && a[i - 1][0] !== "-") return a[i];
    for (let i = 1; i < a.length; i++) if (a[i][0] !== "-") return a[i]; return null; };

  function run(cmd, opts) {
    opts = opts || {};
    const a = argv(cmd);
    if (!a.length) return false;
    const base = a[0].split("/").pop();
    const p = PROG[base];
    if (!p) {
      /* Not a desktop program.  An action with WINDOW_TYPE PERM_TERMINAL gets
         a terminal to run in, which is exactly what CDE did. */
      if (opts.windowType === "PERM_TERMINAL" || opts.terminal)
        return !!Wm.open("dtterm", { state: { cmd: cmd }, occ: opts.occ });
      Mw.error("Cannot Execute", "Command not found:\n\n    " + a[0] +
        "\n\nThe action database asked for a program that is not installed.");
      return false;
    }
    const [id, state] = p(a);
    if (opts.slow) Panel.busyFor(opts.slow);
    return !!Wm.open(id, { state: Object.assign(state || {}, opts.state || {}), occ: opts.occ,
      x: opts.x, y: opts.y });
  }
  return { run, argv, PROG };
})();

/* ==========================================================================
   MODULE 11 — THE DRAG-AND-DROP BROKER
   --------------------------------------------------------------------------
   Historical accuracy, since it is worth getting right: the dragging itself
   was Motif's drag-and-drop protocol, and ToolTalk was the message service
   underneath that let one application ask another to do something with the
   thing that had been dropped.  Sun wrote the ToolTalk half and contributed
   it to CDE, and it is why dropping a file on the printer, the mailer or the
   trash all work without any of those programs knowing about each other.

   Every drop in this exhibit goes through this broker and is logged as a
   message; the guide layer can show you the log.
   ========================================================================== */
const DnD = (() => {
  const targets = [];
  const log = [];
  let drag = null;

  function note(msg) {
    log.push({ t: new Date(), m: msg });
    if (log.length > 60) log.shift();
    Bus.emit("ttmsg", msg);
  }
  function target(node, spec) {
    const t = { node: node, spec: spec };
    targets.push(t);
    node._ddt = t;
    return () => { const i = targets.indexOf(t); if (i >= 0) targets.splice(i, 1); };
  }
  function ghostFor(payload) {
    const g = $("#dragghost");
    g.innerHTML = "";
    if (payload.kind === "files" && payload.paths.length > 1) {
      g.appendChild(el("div", { class: "m-out", style: { background: "var(--bg)", padding: "3px 6px",
        font: "var(--ui)" } }, payload.paths.length + " items"));
    } else if (payload.icon) {
      g.appendChild(payload.icon.startsWith("user:") ? UserIcons.img(payload.icon.slice(5), 32)
        : Icons.img(payload.icon, 32));
    } else g.appendChild(Icons.img("doc", 32));
    return g;
  }
  function start(ev, payload) {
    ev.preventDefault();
    const g = ghostFor(payload);
    const sr = $("#stage").getBoundingClientRect(), sc = sr.width / 1152;
    g.style.display = "block";
    drag = { payload: payload, over: null };
    const move = e => {
      g.style.left = ((e.clientX - sr.left) / sc - 16) + "px";
      g.style.top = ((e.clientY - sr.top) / sc - 16) + "px";
      const under = document.elementFromPoint(e.clientX, e.clientY);
      let t = null, n = under;
      while (n && n !== document.body) { if (n._ddt) { t = n._ddt; break; } n = n.parentElement; }
      if (t && t.spec.accept && !t.spec.accept(payload)) t = null;
      if (drag.over !== t) {
        if (drag.over) drag.over.node.classList.remove("dropok");
        drag.over = t;
        if (t) t.node.classList.add("dropok");
      }
    };
    const up = e => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      g.style.display = "none";
      if (drag.over) {
        drag.over.node.classList.remove("dropok");
        try { drag.over.spec.drop(payload, e); } catch (err) { console.warn(err); }
      } else if (payload.kind === "files" && drag.free !== false) {
        Bus.emit("dropdesk", { payload: payload, ev: e });
      }
      drag = null;
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    move(ev);
  }
  /* a helper for the common case: press-and-move on an icon starts a drag */
  function draggable(node, payloadFn) {
    node.addEventListener("mousedown", e => {
      if (e.button !== 0 && e.button !== 1) return;
      const x0 = e.clientX, y0 = e.clientY;
      const mm = ev => {
        if (Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 5) return;
        window.removeEventListener("mousemove", mm); window.removeEventListener("mouseup", mu);
        start(ev, payloadFn());
      };
      const mu = () => { window.removeEventListener("mousemove", mm); window.removeEventListener("mouseup", mu); };
      window.addEventListener("mousemove", mm); window.addEventListener("mouseup", mu);
    });
  }
  return { target, start, draggable, note, log };
})();

/* ==========================================================================
   MODULE 12 — dtwm, THE WINDOW MANAGER
   --------------------------------------------------------------------------
   Hewlett-Packard's contribution to the treaty.  Motif frames with the
   window menu button at top left, a centred title, minimise and maximise at
   top right, resize handles at the corners and edges, an outline and a
   geometry box while you drag, and windows that minimise to an icon on the
   desktop rather than to a list along one edge.

   The important part is not the chrome: it is that a window's home is an
   occupancy set.  Occupy Workspace takes a checklist.  Occupy All
   Workspaces means the window follows you everywhere, which is the correct
   answer for a clock and the wrong answer for nine terminals.
   ========================================================================== */
const Wm = (() => {
  const wins = [];
  let focused = null, idc = 0;
  const layer = () => $("#wins");
  const iconLayer = () => $("#icons");

  /* ---- frame construction -------------------------------------------- */
  function menuBtnGlyph() {
    return el("div", { style: { width: "11px", height: "3px", background: "currentColor",
      boxShadow: "0 0 0 1px rgba(0,0,0,.35)" } });
  }
  function minGlyph() { return el("div", { class: "m-out1", style: { width: "7px", height: "7px",
    background: "var(--wfa)" } }); }
  function maxGlyph() { return el("div", { class: "m-out1", style: { width: "12px", height: "11px",
    background: "var(--wfa)" } }); }

  function open(appId, o) {
    o = o || {};
    const app = Apps.get(appId);
    if (!app) { console.warn("no such application", appId); return null; }
    if (app.single) {
      const ex = wins.find(w => w.appId === appId && !w.dialog);
      if (ex) { if (!ex.occ.includes(Session.currentIndex())) { ex.occ.push(Session.currentIndex()); }
        if (ex.min) restore(ex); raise(ex); focus(ex); return ex; }
    }
    const w = {
      id: "w" + (++idc), appId: appId, app: app, dialog: false,
      w: o.w || app.w, h: o.h || app.h,
      occ: (o.occ && o.occ.length ? o.occ.slice() : [Session.currentIndex()]),
      min: false, title: app.title, state: o.state || {}, ix: 0, iy: 0
    };
    const n = wins.filter(x => !x.dialog).length;
    w.x = o.x !== undefined ? o.x : clamp(60 + (n % 7) * 34, 0, 1152 - w.w);
    w.y = o.y !== undefined ? o.y : clamp(40 + (n % 7) * 28, 0, 900 - w.h);
    buildFrame(w);
    wins.push(w);
    layer().appendChild(w.el);
    w.api = app.build(w, w.state) || {};
    if (o.min) minimize(w, true);
    applyGeom(w);
    updateVisibility();
    raise(w); focus(w);
    Bus.emit("winlist");
    Session.persist();
    return w;
  }

  function buildFrame(w) {
    const menuBtn = el("div", { class: "tbtn" }, menuBtnGlyph());
    const minBtn = el("div", { class: "tbtn" }, minGlyph());
    const maxBtn = el("div", { class: "tbtn" }, maxGlyph());
    const ttl = el("div", { class: "ttl" }, w.title);
    const tb = el("div", { class: "tb" }, menuBtn, ttl,
      w.dialog ? null : minBtn, w.dialog ? null : maxBtn);
    const cl = el("div", { class: "cl" });
    const fr = el("div", { class: "fr" }, tb, cl);
    const e = el("div", { class: "win" + (w.dialog ? " dial" : "") }, fr);
    if (!w.dialog) for (const d of ["n", "s", "w", "e", "nw", "ne", "sw", "se"])
      e.appendChild(el("div", { class: "rz " + d, "data-d": d }));
    w.el = e; w.cl = cl; w.tb = tb; w.ttlEl = ttl;
    w.setTitle = t => { w.title = t; ttl.textContent = t; if (w.icon) $(".lb", w.icon).textContent = t; };

    menuBtn.addEventListener("mousedown", ev => { ev.stopPropagation(); ev.preventDefault();
      const r = menuBtn.getBoundingClientRect(); focus(w); windowMenu(w, r.left, r.bottom); });
    menuBtn.addEventListener("dblclick", ev => { ev.stopPropagation(); close(w); });
    minBtn.addEventListener("click", ev => { ev.stopPropagation(); minimize(w); });
    maxBtn.addEventListener("click", ev => { ev.stopPropagation(); toggleMax(w); });
    e.addEventListener("mousedown", ev => {
      if (State.get("raiseOnClick", true) !== false) { raise(w); }
      focus(w);
    }, true);
    e.addEventListener("mouseenter", () => { if (State.get("focusFollows", false)) focus(w); });
    e.addEventListener("contextmenu", ev => {
      if (ev.target.closest(".cl")) return;
      ev.preventDefault(); windowMenu(w, ev.clientX, ev.clientY);
    });
    tb.addEventListener("mousedown", ev => {
      if (ev.target.closest(".tbtn")) return;
      if (ev.button !== 0) return;
      startMove(w, ev);
    });
    tb.addEventListener("dblclick", ev => { if (!ev.target.closest(".tbtn")) toggleMax(w); });
    for (const h of $$(".rz", e)) h.addEventListener("mousedown", ev => {
      if (ev.button !== 0) return; startResize(w, ev, h.dataset.d); });
  }

  function applyGeom(w) {
    w.el.style.left = Math.round(w.x) + "px"; w.el.style.top = Math.round(w.y) + "px";
    w.el.style.width = Math.round(w.w) + "px"; w.el.style.height = Math.round(w.h) + "px";
    if (w.api && w.api.resized) try { w.api.resized(); } catch (e) { }
  }

  /* ---- interactive move and resize, with Motif's outline and geometry box */
  function fbox(text) {
    let b = $("#geomfb");
    if (!b) { b = el("div", { id: "geomfb", class: "m-out", style: { position: "absolute",
      left: "50%", top: "50%", transform: "translate(-50%,-50%)", background: "var(--bg)",
      padding: "6px 14px", font: "var(--uib)", zIndex: "820" } }); $("#stage").appendChild(b); }
    b.textContent = text; b.style.display = "block";
    return b;
  }
  function fboxOff() { const b = $("#geomfb"); if (b) b.style.display = "none"; }
  function rubber(x, y, ww, hh, on) {
    const r = $("#rubber");
    if (!on) { r.style.display = "none"; return; }
    r.style.display = "block";

    else if (c.live === "date") { const cv = el("canvas", { width: 40, height: 40 });
      ctl.appendChild(cv); ctl._date = cv; }
    else ctl.appendChild(Icons.img(id === "trash" && Trash.count() ? "trashfull" : c.icon, 40));
    ctl.addEventListener("click", () => { Sound.click();
      if (openSub && openSub.id !== id) closeSub();
      if (c.click) c.click(); else if (c.exec) launch(c.exec, { slow: c.slow }); });
    ctl.addEventListener("contextmenu", e => { e.preventDefault();
      Mw.popup([
        { label: "Help", run: () => Help.open("Dtwm", "frontpanel") },
        { label: "Add Subpanel", dis: !!sub, run: () => { conf().subs[id] = { title: c.label,
            items: [{ label: c.label, icon: c.icon, exec: c.exec }] }; persist(); render(); } },
        { label: "Delete Subpanel", dis: !sub, run: () => { delete conf().subs[id]; persist(); render(); } }
      ], e.clientX, e.clientY); });
    if (c.drop) {
      DnD.target(ctl, {
        accept: p => p.kind === "files",
        drop: p => doDrop(c.drop, p)
      });
    }
    if (sub) {
      arw.addEventListener("click", e => { e.stopPropagation(); toggleSub(id, col); });
      ctl.addEventListener("dblclick", () => toggleSub(id, col));
    }
    col.append(arw, ctl);
    return col;
  }
  function doDrop(kind, p) {
    const paths = p.paths || [];
    if (!paths.length) return;
    if (kind === "print") {
      DnD.note("ToolTalk: Print(" + paths.join(", ") + ")  ->  dtprintinfo");
      Printers.print(paths); busyFor(1200);
    } else if (kind === "trash") {
      DnD.note("ToolTalk: Dt Move_To_Trash(" + paths.join(", ") + ")  ->  dtfile");
      paths.forEach(pp => Trash.put(pp)); render();
    } else if (kind === "mail") {
      DnD.note("ToolTalk: Compose(attachment=" + paths.join(", ") + ")  ->  dtmail");
      Mail.composeWith(paths);
    } else if (kind === "edit") {
      DnD.note("ToolTalk: Edit(" + paths[0] + ")  ->  dtpad");
      Exec.run("/usr/dt/bin/dtpad " + paths[0]);
    } else if (kind === "file") {
      DnD.note("ToolTalk: Display(" + paths[0] + ")  ->  dtfile");
      const n = VFS.lookup(paths[0], "/");
      Exec.run("/usr/dt/bin/dtfile -dir " + (VFS.isDir(n) ? paths[0] : paths[0].replace(/\/[^/]*$/, "")));
    }
  }
  function toggleSub(id, col) {
    if (openSub && openSub.id === id) { closeSub(); return; }
    closeSub();
    const s = conf().subs[id];
    if (!s) return;
    const box = el("div", { class: "fp-sub" });
    box.appendChild(el("div", { class: "sti" }, s.title));
    s.items.forEach((it, idx) => {
      const row = el("div", { class: "row" },
        it.icon && it.icon.startsWith("user:") ? UserIcons.img(it.icon.slice(5), 24) : Icons.img(it.icon || "doc", 24),
        el("span", null, it.label));
      row.addEventListener("click", () => { closeSub(); Sound.click();
        if (it.act === "ReloadActions") { Dt.reload();
          Mw.info("Reload Actions", "The action and datatype databases have been re-read from\n" +
            "/usr/dt/appconfig/types/C and ~/.dt/types.", { w: 430 }); }
        else if (it.act === "OnItemHelp") Help.onItem();
        else if (it.exec) launch(it.exec, { slow: /dtappmgr/.test(it.exec) ? 2200 : 0 }); });
      row.addEventListener("contextmenu", e => { e.preventDefault();
        Mw.popup([
          { label: "Copy To Main Panel", run: () => promote(id, idx) },
          { label: "Delete", run: () => { s.items.splice(idx, 1); persist(); closeSub(); } }
        ], e.clientX, e.clientY); });
      box.appendChild(row);
    });
    const dz = el("div", { class: "instz" }, "Install Icon");
    DnD.target(dz, {
      accept: p => p.kind === "appicon" || p.kind === "files",
      drop: p => {
        const it = p.kind === "appicon"
          ? { label: p.label, icon: p.icon, exec: p.exec }
          : { label: p.paths[0].split("/").pop(), icon: Dt.iconName(p.paths[0], VFS.lookup(p.paths[0], "/")),
              exec: "/usr/dt/bin/dtaction Open " + p.paths[0] };
        if (p.kind === "files") it.exec = null, it.path = p.paths[0];
        s.items.push(it);
        persist();
        DnD.note("Front Panel: installed '" + it.label + "' into the " + s.title + " subpanel");
        closeSub(); toggleSub(id, col);
      }
    });
    box.appendChild(dz);
    col.appendChild(box);
    /* keep the subpanel on screen */
    openSub = { id: id, box: box };
    const r = box.getBoundingClientRect(), sr = $("#stage").getBoundingClientRect();
    if (r.right > sr.right - 4) box.style.right = "0px";
    if (r.left < sr.left + 4) box.style.left = "0px";
  }
  function closeSub() { if (openSub) { openSub.box.remove(); openSub = null; } }

  function switchNode() {
    const box = el("div", { class: "fp-switch" });
    const lock = el("div", { class: "fp-swbtn", title: "Lock" }, Icons.img("lock", 20));
    lock.addEventListener("click", () => Sess.lock());
    const exit = el("div", { class: "fp-swbtn", title: "Exit" }, Icons.img("exit", 20));
    exit.addEventListener("click", () => Sess.logoutDialog());
    const busy = el("div", { class: "fp-busy" + (busyOn ? " on" : ""), title: "Busy light" });
    const grid = el("div", { class: "fp-ws" });
    Session.workspaces().forEach((ws, i) => {
      const b = el("div", { class: "fp-wsb" + (i === Session.currentIndex() ? " cur" : "") }, ws.name);
      b.addEventListener("click", () => { Sound.click(); Session.switchTo(i); });
      b.addEventListener("contextmenu", e => { e.preventDefault();
        Mw.popup([
          { label: "Rename Workspace...", run: () => Mw.prompt("Rename Workspace",
              "Workspace name:", ws.name, v => Session.rename(i, v)) },
          { label: "Add Workspace", run: () => Session.add() },
          { label: "Delete Workspace", dis: Session.workspaces().length < 2,
            run: () => Session.remove(i) },
          { sep: true },
          { label: "Backdrop...", run: () => Exec.run("/usr/dt/bin/dtstyle -item Backdrop") }
        ], e.clientX, e.clientY); });
      grid.appendChild(b);
    });
    if (Session.workspaces().length > 4) grid.style.gridTemplateColumns = "1fr 1fr 1fr";
    box.append(el("div", { class: "fp-swcol" }, lock, exit), grid,
      el("div", { class: "fp-swcol", style: { justifyContent: "flex-start" } }, busy));
    return box;
  }

  function handle(side) {
    const h = el("div", { class: "fp-hand", title: "Minimize Front Panel" }, el("i"));
    h.addEventListener("click", () => { rolled = true; render(); });
    h.addEventListener("contextmenu", e => { e.preventDefault();
      Mw.popup([
        { label: "Minimize Front Panel", run: () => { rolled = true; render(); } },
        { label: "Reset Front Panel to defaults", run: () => Mw.ask("Front Panel",
            "Discard your Front Panel customisation and go back to the\nshipped layout?",
            () => { load(DEFAULT); render(); }) },
        { sep: true },
        { label: "Help", run: () => Help.open("Dtwm", "frontpanel") }
      ], e.clientX, e.clientY); });
    return h;
  }

  function render() {
    const fp = $("#fp");
    fp.innerHTML = "";
    fp.classList.toggle("rolled", rolled);
    if (rolled) {
      const tab = el("div", { class: "fp-tab", title: "Restore Front Panel" },
        el("div", { style: { width: "0", height: "0", borderLeft: "6px solid transparent",
          borderRight: "6px solid transparent", borderTop: "7px solid var(--fg)" } }));
      tab.addEventListener("click", () => { rolled = false; render(); });
      fp.appendChild(tab);
      return;
    }
    const main = el("div", { class: "fp-main" });
    main.appendChild(handle("l"));
    for (const id of conf().controls) {
      if (id === "SWITCH") { main.appendChild(switchNode()); continue; }
      const n = ctlNode(id);
      if (n) main.appendChild(n);
    }
    main.appendChild(handle("r"));
    fp.appendChild(main);
    tick();
  }
  function promote(subId, idx) {
    const s = conf().subs[subId];
    const it = s.items[idx];
    if (!it) return;
    const nid = "u" + Math.random().toString(36).slice(2, 7);
    CTL[nid] = { icon: it.icon || "doc", label: it.label, exec: it.exec };
    const at = conf().controls.indexOf(subId);
    conf().controls.splice(at + 1, 0, nid);
    conf().custom = conf().custom || {};
    conf().custom[nid] = { icon: it.icon || "doc", label: it.label, exec: it.exec };
    persist(); closeSub(); render();
  }
  function rehydrateCustom() {
    const cc = conf().custom || {};
    for (const k in cc) CTL[k] = { icon: cc[k].icon, label: cc[k].label, exec: cc[k].exec };
  }

  /* live clock and date faces */
  function tick() {
    const d = Clock.now();
    $$("#fp .fp-ctl").forEach(c => {
      if (c._clock) {
        const g = c._clock.getContext("2d");
        g.clearRect(0, 0, 40, 40);
        g.save(); g.translate(20, 20);
        g.fillStyle = "#efe7cf"; g.beginPath(); g.arc(0, 0, 17, 0, 7); g.fill();
        g.strokeStyle = "#000"; g.lineWidth = 1.4; g.stroke();
        for (let i = 0; i < 12; i++) { const t = i * Math.PI / 6;
          g.fillStyle = "#000"; g.fillRect(Math.sin(t) * 14 - 1, -Math.cos(t) * 14 - 1, 2, 2); }
        const hh = (d.getHours() % 12) / 12 * Math.PI * 2 + d.getMinutes() / 60 * Math.PI / 6;
        const mm = d.getMinutes() / 60 * Math.PI * 2;
        const ss = d.getSeconds() / 60 * Math.PI * 2;
        g.lineWidth = 2.2; g.beginPath(); g.moveTo(0, 0);
        g.lineTo(Math.sin(hh) * 8, -Math.cos(hh) * 8); g.stroke();
        g.lineWidth = 1.6; g.beginPath(); g.moveTo(0, 0);
        g.lineTo(Math.sin(mm) * 12, -Math.cos(mm) * 12); g.stroke();
        g.strokeStyle = "#7f0000"; g.lineWidth = 1; g.beginPath(); g.moveTo(0, 0);
        g.lineTo(Math.sin(ss) * 13, -Math.cos(ss) * 13); g.stroke();
        g.restore();
      }
      if (c._date) {
        const g = c._date.getContext("2d");
        g.clearRect(0, 0, 40, 40);
        g.fillStyle = "#efe7cf"; g.fillRect(2, 3, 36, 34);
        g.strokeStyle = "#000"; g.strokeRect(2.5, 3.5, 35, 33);
        g.fillStyle = "#7f0000"; g.fillRect(3, 4, 34, 10);
        g.fillStyle = "#fff"; g.font = "bold 8px Helvetica"; g.textAlign = "center";
        g.fillText(MON[d.getMonth()].toUpperCase(), 20, 12);
        g.fillStyle = "#000"; g.font = "bold 17px Helvetica";
        g.fillText(String(d.getDate()), 20, 32);
        g.textAlign = "left";
      }
    });
    const b = $("#fp .fp-busy");
    if (b) b.classList.toggle("on", busyOn && (Math.floor(Date.now() / 220) % 2 === 0));
  }
  Bus.on("wschange", () => { const cur = Session.currentIndex();
    $$("#fp .fp-wsb").forEach((b, i) => b.classList.toggle("cur", i === cur)); });
  Bus.on("wslist", render);
  Bus.on("theme", () => { render(); });
  Bus.on("trash", render);
  /* CDE subpanels stay posted until you click the arrow again, pick an item,
     or click the backdrop.  That is not laziness: it is the reason you can
     drag an icon out of Application Manager and drop it into one. */

  return { render, snapshot, load, busyFor, launch, tick, conf, rehydrateCustom, DEFAULT, closeSub };
})();

/* The exhibit's clock reads July 1997 and runs at real speed. */
const Clock = (() => {
  const BASE = new Date(1997, 6, 21, 9, 14, 5);
  const t0 = Date.now();
  return { now: () => new Date(BASE.getTime() + (Date.now() - t0)), base: BASE };
})();

/* Optional, minimal, synthesized, and off by default -- as the brief asks.
   Style Manager's Audio panel really does control these. */
const Sound = (() => {
  let ctx = null;
  const on = () => State.get("sound", false);
  function ac() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { ctx = false; } } return ctx || null; }
  function beep(f, ms, vol, type) {
    if (!on()) return;
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "square"; o.frequency.value = f;
    const v = (State.get("bellVolume", 60) / 100) * (vol === undefined ? 0.06 : vol);
    g.gain.setValueAtTime(v, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + ms / 1000);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + ms / 1000);
  }
  return {
    bell: hard => { if (State.get("bellOn", true)) beep(hard ? 620 : 880, hard ? 170 : 110, 0.07); },
    click: () => { if (State.get("keyclick", false)) beep(2200, 8, 0.02, "square"); },
    key: () => { if (State.get("keyclick", false)) beep(1800, 6, 0.015, "square"); },
    test: () => { const s = State.get("sound", false); State.set("sound", true);
      beep(880, 140, 0.08); setTimeout(() => State.set("sound", s), 200); }
  };
})();

/* The Trash Can.  CDE kept it in ~/.dt/Trash, and "shredding" was the only
   way anything actually left. */
const Trash = (() => {
  const DIR = () => "/export/home/" + Sys.user + "/.dt/Trash";
  function log() { return State.get("trashlog", []); }
  function put(path) {
    const n = VFS.lookup(path, "/");
    if (!n) return false;
    VFS.mkdirp(DIR(), "/");
    const base = path.split("/").pop();
    let name = base, i = 1;
    while (VFS.lookup(DIR() + "/" + name, "/")) name = base + "." + (i++);
    VFS.mv(path, DIR() + "/" + name, "/");
    const l = log(); l.push({ from: path, name: name, t: Date.now() }); State.set("trashlog", l);
    Bus.emit("trash");
    return true;
  }
  function putBack(name) {
    const l = log(), rec = l.find(r => r.name === name);
    if (!rec) return false;
    VFS.mkdirp(rec.from.replace(/\/[^/]*$/, ""), "/");
    VFS.mv(DIR() + "/" + name, rec.from, "/");
    State.set("trashlog", l.filter(r => r !== rec));
    Bus.emit("trash");
    return true;
  }
  function shred(names) {
    const l = log();
    for (const n of names) { VFS.rm(DIR() + "/" + n, "/"); }
    State.set("trashlog", l.filter(r => !names.includes(r.name)));
    Bus.emit("trash");
  }
  function list() { return (VFS.ls(DIR(), "/") || []); }
  function count() { return list().length; }
  return { put, putBack, shred, list, count, DIR };
})();

/* Print queues, so that dropping a file on the printer does something. */
const Printers = (() => {
  const P = [
    { name: "lp-eng2", desc: "HP LaserJet 5Si, 2nd floor east", def: true, up: true },
    { name: "laser3", desc: "Apple LaserWriter 16/600, model shop", def: false, up: true },
    { name: "plot1", desc: "HP DesignJet 650C, plot room", def: false, up: false }
  ];
  let jobs = [], seq = 431;
  function print(paths, printer) {
    const pr = printer || P.find(x => x.def).name;
    for (const p of paths) {
      const n = VFS.lookup(p, "/");
      jobs.push({ id: pr + "-" + (++seq), file: p.split("/").pop(), printer: pr,
        size: n ? VFS.size(n) : 0, owner: Sys.user, t: Date.now(), left: 3 + Math.floor(Math.random() * 4) });
    }
    Bus.emit("printjobs");
    Mw.info("Print", paths.length === 1
      ? "Printing " + paths[0].split("/").pop() + " on " + pr + "."
      : paths.length + " files sent to " + pr + ".", { w: 380 });
  }
  setInterval(() => {
    if (!jobs.length) return;
    let changed = false;
    for (const j of jobs) { if (j.printer === "plot1") continue; j.left--; changed = true; }
    const before = jobs.length;
    jobs = jobs.filter(j => j.left > 0);
    if (changed || jobs.length !== before) Bus.emit("printjobs");
  }, 2000);
  return { printers: P, print, jobs: () => jobs,
    cancel: id => { jobs = jobs.filter(j => j.id !== id); Bus.emit("printjobs"); } };
})();

/* ==========================================================================
   MODULE 15 — THE SHELL AND THE COMMAND REGISTRY
   --------------------------------------------------------------------------
   Korn shell on System V Release 4.  The userland reflects it: ps -ef, not
   ps aux; df -k; SVR4 packaging with pkginfo and pkgadd; /kernel/genunix.
   And /usr/ucb is present, because every one of Sun's customers had arrived
   from SunOS 4 with a decade of habits -- so ps aux fails with the SVR4
   usage message and /usr/ucb/ps aux prints exactly what they expected.
   That transitional arrangement is the single most Solaris-2 thing there is.
   ========================================================================== */
const Procs = (() => {
  let next = 300;
  const map = new Map();
  function pid(key) { if (!map.has(key)) map.set(key, next += 1 + Math.floor(Math.random() * 3)); return map.get(key); }
  const BASE = [
    { pid: 0, ppid: 0, cmd: "sched", stime: "09:12", tty: "?", time: "0:11" },
    { pid: 1, ppid: 0, cmd: "/etc/init -", stime: "09:12", tty: "?", time: "0:01" },
