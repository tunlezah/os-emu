  /* ---- the Workspace (root) menu, parsed from ~/.dt/dtwmrc ----------- */
  let rootMenu = null;
  function parseDtwmrc() {
    const n = VFS.lookup("/export/home/" + Sys.user + "/.dt/dtwmrc", "/");
    const src = n && n.t === "f" ? n.d : DTWMRC;
    const menus = {};
    const re = /Menu\s+(\w+)\s*\{([^}]*)\}/g;
    let m;
    while ((m = re.exec(src))) {
      const items = [];
      for (const line of m[2].split("\n")) {
        const t = line.trim();
        if (!t || /^#/.test(t)) continue;
        const im = /^(?:"([^"]*)"|(\S+))\s+(f\.\w+)\s*(\S+)?/.exec(t);
        if (!im) continue;
        items.push({ label: im[1] !== undefined ? im[1] : im[2], fn: im[3], arg: im[4] || null });
      }
      menus[m[1]] = items;
    }
    return menus;
  }
  const FN = {
    "f.title": () => null,
    "f.separator": () => ({ sep: true }),
    "f.refresh": () => ({ label: "Refresh", run: () => { Theme.apply(); Panel.render();
      Wm.updateVisibility(); } }),
    "f.restart": () => ({ label: "Restart Workspace Manager...", run: () => restartWm() }),
    "f.toggle_frontpanel": () => ({ label: "Minimize/Restore Front Panel",
      run: () => { const fp = $("#fp"); fp.classList.toggle("rolled"); Panel.render();
        if (fp.classList.contains("rolled")) fp.classList.add("rolled"); } }),
    "f.circle_up": () => ({ label: "Shuffle Up", run: () => { const ws = Wm.all()
      .filter(w => Wm.visible(w) && !w.min); if (ws.length) Wm.raise(ws[0]); } }),
    "f.circle_down": () => ({ label: "Shuffle Down", run: () => { const ws = Wm.all()
      .filter(w => Wm.visible(w) && !w.min); if (ws.length) Wm.lower(ws[ws.length - 1]); } }),
    "f.restore_all": () => ({ label: "Restore All Icons",
      run: () => Wm.all().filter(w => w.min).forEach(w => Wm.restore(w)) })
  };
  const ACTIONS = {
    ExitSession: () => logoutDialog(),
    AddWorkspace: () => Session.add(),
    DeleteWorkspace: () => { if (Session.workspaces().length < 2) {
        Mw.error("Workspace", "A desktop must have at least one workspace."); return; }
      Mw.ask("Delete Workspace", "Delete the workspace \"" + Session.currentWs().name +
        "\"?\n\nWindows that occupy only this workspace will move to another one.",
        () => Session.remove(Session.currentIndex())); },
    RenameWorkspace: () => Mw.prompt("Rename Workspace", "Workspace name:",
      Session.currentWs().name, v => Session.rename(Session.currentIndex(), v)),
    SaveHomeSession: () => saveHome(),
    HomeSession: () => returnHome(),
    ReloadActions: () => { Dt.reload(); Mw.info("Reload Actions",
      "The action and datatype databases have been re-read.", { w: 400 }); },
    OnItemHelp: () => Help.onItem()
  };
  function menuItems(menus, name, depth) {
    const src = menus[name] || [];
    const out = [];
    for (const it of src) {
      if (it.fn === "f.title") { out.push({ title: it.label }); continue; }
      if (it.fn === "f.separator") { out.push({ sep: true }); continue; }
      if (it.fn === "f.menu") {
        out.push({ label: it.label, items: () => menuItems(menus, it.arg, (depth || 0) + 1) });
        continue;
      }
      if (it.fn === "f.action") {
        const a = it.arg;
        out.push({ label: it.label, run: () => {
          if (ACTIONS[a]) return ACTIONS[a]();
          if (Dt.allActions()[a]) return Dt.runAction(a, []);
          Mw.error("Workspace Manager", "dtwm: no action named " + a +
            "\n\nf.action names an action from the database.  This one is not\nin it."); } });
        continue;
      }
      if (FN[it.fn]) { const r = FN[it.fn](); if (r) out.push(Object.assign(r, { label: it.label || r.label })); continue; }
      out.push({ label: it.label + "   [" + it.fn + " unimplemented]", dis: true });
    }
    return out;
  }
  function installRootMenu() {
    const menus = parseDtwmrc();
    rootMenu = () => menuItems(menus, "DtRootMenu", 0);
    const root = $("#root");
    root.oncontextmenu = e => {
      e.preventDefault();
      if (deskMode !== "cde") return;
      Mw.popup(rootMenu(), e.clientX, e.clientY, {});
    };
    root.onmousedown = e => {
      if (e.button === 0) { Mw.closeMenus(); Panel.closeSub(); }
      if (Help.handleOnItem(e)) return;
    };
    Bus.emit("rootmenu");
  }
  function restartWm() {
    Mw.ask("Restart Workspace Manager",

        Panel.busyFor(1400);
        setTimeout(() => {
          installRootMenu();

        }, 1400);
      }, null, { yes: "Restart", no: "Cancel" });

          borderRadius: "50%", color: "#00007f", font: "bold 26px Helvetica", display: "flex",
          alignItems: "center", justifyContent: "center" } }, "?"),
        el("div", { style: { lineHeight: "1.5" } },

        Session.has("home") ? "A home session is saved." :
          "No home session has been saved yet; Save Home Session is on the\nWorkspace menu."));

  function doLogout(saveCur) {
    Session.save("current");
    State.set("startupMode", saveCur ? "current" : "home");

    Panel.busyFor(1100);

})();

  const TABS = [
    { id: "treaty", label: "The treaty", build: x => {

  function selfTest() {
    const L = [];
    const apps = Apps.all();
    L.push("applications registered: " + apps.length);
    let bad = apps.filter(a => typeof a.build !== "function" || typeof a.save !== "function");
    L.push((bad.length ? "FAIL" : "PASS") + "  every application implements build() and save()" +
      (bad.length ? " — missing: " + bad.map(a => a.id).join(", ") : ""));
    let threw = false;
    try { Apps.register({ id: "__selftest_bad", build: () => ({}) }); } catch (e) { threw = true; }
    L.push((threw ? "PASS" : "FAIL") + "  the registry refuses an application with no save()");
    L.push("");
    const before = Session.snapshot();
    L.push("session snapshot: " + before.clients.length + " client(s), " +
      before.ws.length + " workspace(s), current = " + (before.ws[before.cur] || {}).name);
    let json = null;
    try { json = JSON.stringify(before); L.push("PASS  snapshot is JSON-serialisable (" +
      json.length + " bytes)"); } catch (e) { L.push("FAIL  snapshot not serialisable: " + e.message); }
    const shape = before.clients.every(k => k.app && typeof k.x === "number" &&
      typeof k.y === "number" && Array.isArray(k.occ) && k.state !== undefined);
    L.push((shape ? "PASS" : "FAIL") + "  every client carries app, geometry, occupancy and state");
    if (before.clients.length) {
      Session.restore(JSON.parse(json), { selftest: true });
      const after = Session.snapshot();
      const key = s => s.clients.map(k => k.app + "@" + k.x + "," + k.y + " " + k.w + "x" + k.h +
        " ws[" + k.occ.join("") + "]" + (k.min ? " min" : "")).join(" | ");
      const same = key(before) === key(after);
      L.push((same ? "PASS" : "FAIL") + "  round trip: snapshot -> close everything -> restore -> snapshot");
      if (!same) { L.push("  before: " + key(before)); L.push("  after:  " + key(after)); }
      Panel.render();
    } else {
      L.push("SKIP  round trip needs at least one open window — open something and run it again");
    }
    L.push("");
    L.push("datatypes: " + Object.keys(Dt.allTypes()).length + ", criteria: " + Dt.allCriteria().length +
      ", actions: " + Object.keys(Dt.allActions()).length);
    L.push("icons drawn in code: " + Icons.names().length + " painters, " +
      Theme.BACKDROPS.length + " backdrop tiles, " + Theme.PALETTES.length + " palettes");
    return L;
  }

  let cur = "treaty", built = false;
  function render() {
    const tabs = $("#guideTabs"), body = $("#guideBody");
    tabs.innerHTML = "";
    for (const t of TABS) {
      const btn = el("button", { class: cur === t.id ? "on" : "" }, t.label);
      btn.addEventListener("click", () => { cur = t.id; State.set("guideTab", cur); render(); });
      tabs.appendChild(btn);
    }
    body.innerHTML = "";
    (TABS.find(t => t.id === cur) || TABS[0]).build(body);
    body.scrollTop = 0;
    built = true;
  }
  function toggle(force) {
    const g = $("#guide");
    const on = force === undefined ? !g.classList.contains("on") : !!force;
    g.classList.toggle("on", on);
    $("#btnGuide").classList.toggle("on", on);
    State.set("guideOpen", on);
    if (on) { cur = State.get("guideTab", "treaty"); render(); }
  }
  function init() {
    $("#btnGuide").addEventListener("click", () => toggle());
    $("#guideClose").addEventListener("click", () => toggle(false));
    toggle(State.get("guideOpen", true));
  }
  return { init, toggle, render, selfTest };
})();

/* ==========================================================================
   MODULE 35 — PERSISTENCE OF WHAT THE VISITOR MADE
   --------------------------------------------------------------------------
   Only what the visitor created is stored.  Everything shipped on the disk
   is rebuilt from code at every start, so the LocalStorage entry stays small
   and a partial reset is always possible.
   ========================================================================== */
const Persist = (() => {
  let timer = null;
  function snapshotFiles() {
    const files = {}, dirs = [];
    (function walk(n, path) {
      if (n.t === "f") { if (n.user) files[path] = n.d; return; }
      if (n.t === "l") return;
      if (n.user && path) dirs.push(path);
      for (const k in n.c) walk(n.c[k], path + "/" + k);
    })(VFS.root, "");
    State.set("userfiles", files);
    State.set("userdirs", dirs);
  }
  function restoreFiles() {
    for (const d of State.get("userdirs", [])) { const n = VFS.mkdirp(d, "/"); if (n) n.user = true; }
    const f = State.get("userfiles", {});
    for (const p in f) { const n = VFS.put(p, f[p], "/"); if (n) n.user = true; }
  }
  function init() {
    Bus.on("fs", () => { clearTimeout(timer); timer = setTimeout(snapshotFiles, 500); });
  }
  return { init, snapshotFiles, restoreFiles };
})();

    ["Print services started.", 70],
    ["volume management starting.", 90],
    ["The system is ready.", 200],
    ["", 60],
    ["sparc7 console login: ", 260],
    ["dtlogin: starting X server on :0", 500]
  ];
  function boot(fast) {
    const scr = el("div", { style: { position: "absolute", inset: "0", zIndex: "640",
      background: "#000", color: "#d8d8d8", font: "var(--mono)", padding: "12px 14px",
      whiteSpace: "pre-wrap", overflow: "hidden", cursor: "pointer" } });
    $("#stage").appendChild(scr);
    let i = 0, done = false;
    function finish() {
      if (done) return;
      done = true;
      scr.remove();
      Sess.showLogin("");
    }
    scr.addEventListener("click", finish);
    const esc = e => { if (e.key === "Escape" || e.key === "Enter") {
      window.removeEventListener("keydown", esc); finish(); } };
    window.addEventListener("keydown", esc);
    if (fast) { finish(); return; }
    function step() {
      if (done) return;
      if (i >= BOOT.length) { finish(); return; }
      const [line, wait] = BOOT[i++];
      scr.textContent += line + "\n";
      setTimeout(step, wait);
    }
    scr.textContent = "";
    step();
  }

  /* the Image Viewer's synthetic images, as files on the disk */
  function extraFiles() {
    VFS.put("/export/home/" + DISK_USER + "/Projects/case3-contour.xwd",
      "XWD 1 contour 360 260\n(An X window dump.  This exhibit generates the image from this\n" +
      "descriptor rather than storing a picture, because the whole page\ncontains no image files.)\n",
      "/", { user: false });
    VFS.put("/usr/dt/appconfig/icons/C/testpattern.xwd", "XWD 1 testpattern 384 240\n", "/", { user: false });
    VFS.put("/usr/dt/appconfig/icons/C/vendormark.xwd", "XWD 1 mark 300 220\n", "/", { user: false });
  }

  /* a previous user's home session, so that Return To Home Session has
     something to return to on the very first visit -- and so that the
     workspaces are not called One, Two, Three and Four */
  function seedHomeSession() {
    if (State.get("session_home", null)) return;
    State.set("session_home", {
      ws: [{ name: "Layout", backdrop: "Ndeble" }, { name: "Solve", backdrop: "Corrugation" },
        { name: "Mail", backdrop: "Wave" }, { name: "Scratch", backdrop: "Skinny" }],
      cur: 0,
      clients: [
        { app: "dtfile", x: 24, y: 40, w: 620, h: 400, occ: [0], min: false,
          title: "kmartin - File Manager", state: { dir: "/export/home/" + DISK_USER + "/Projects",
            view: "icons", hidden: false, trash: false } },
        { app: "dtpad", x: 470, y: 300, w: 560, h: 420, occ: [0], min: false,
          title: "case3-notes.txt - Text Editor",
          state: { path: "/export/home/" + DISK_USER + "/Projects/case3-notes.txt", wrap: true } },
        { app: "dtterm", x: 30, y: 470, w: 576, h: 400, occ: [1], min: false, title: "Terminal",
          state: { cwd: "/export/home/" + DISK_USER + "/Projects", buf: [], input: "" } },
        { app: "dtterm", x: 470, y: 60, w: 576, h: 400, occ: [1], min: false, title: "Terminal",
          state: { cwd: "/proj/shared", buf: [], input: "" } },
        { app: "dtmail", x: 60, y: 60, w: 640, h: 500, occ: [2], min: false, title: "Mailer",
          state: { folder: "Inbox", sel: 1 } },
        { app: "dtcm", x: 300, y: 330, w: 660, h: 480, occ: [2], min: false, title: "Calendar",
          state: { view: "month", date: new Date(1997, 6, 21).toISOString() } },
        { app: "dtcalc", x: 830, y: 560, w: 250, h: 300, occ: [3], min: false, title: "Calculator",
          state: {} },
        { app: "owclock", x: 990, y: 30, w: 140, h: 165, occ: [0, 1, 2, 3], min: false,
          title: "clock", state: {} }
      ],
      style: {}, panel: null, stamp: Date.now()
    });
  }

  function about() {
    const card = el("div", { class: "card" },
      el("h2", null, "Solaris 2.6 and CDE 1.2 — about this exhibit"),
      el("p", null, "An interactive re-creation of the Common Desktop Environment 1.2 as Sun " +
        "shipped it with Solaris 2.6 in July 1997, on an Ultra 1 workstation. One HTML file, no " +
        "external resources, works from ", el("code", null, "file://"), "."),
      el("h3", null, "Simulation, not emulation"),
      el("p", null, "Nothing real runs. There is no SPARC processor here, no Motif library and no X " +
        "server. Every behaviour — the window manager, the shell, the datatype registry, the dtksh " +
        "interpreter, the help system — is written from scratch to behave like the original."),
      el("h3", null, "Artwork"),
      el("p", null, "All of it is generated in code at run time: the icon set in the CDE idiom, the " +
        "two-colour backdrop tiles, the clock faces, the images in the Image Viewer. There is not one " +
        "image file in this page. Where a vendor logo would sit there is an original placeholder mark."),
      el("h3", null, "What is stored"),
      el("p", null, "LocalStorage holds your current session and your home session, Style Manager " +
        "settings, Front Panel customisation, files and folders you created, datatypes you registered, " +
        "icons you drew, and mail and calendar state. Nothing leaves your browser."),
      el("h3", null, "Standing"),
      el("p", null, "CDE is the work of the COSE alliance — Hewlett-Packard, IBM, Sun Microsystems and " +
        "Novell — and was open-sourced by The Open Group in 2012 as ", el("code", null, "cdesktopenv"),
        ", where it is still maintained. Solaris and OpenWindows are Sun's, now Oracle's. This is an " +
        "unofficial homage with no involvement from or endorsement by any of them; all product names " +
        "and trademarks belong to their owners."),
      el("div", { class: "row" },
        (() => { const b = el("button", { class: "mus-btn" }, "Close");
          b.addEventListener("click", () => ov.remove()); return b; })()));
    const ov = el("div", { class: "ovl" }, card);
    ov.addEventListener("click", e => { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }
  function resetDialog() {
    const card = el("div", { class: "card" },
      el("h2", null, "Reset the exhibit"),
      el("p", null, "This clears everything stored in your browser for this page: both saved " +
        "sessions, Style Manager settings, Front Panel customisation, files and folders you made, " +
        "datatypes you registered, icons you drew, and the mail and calendar state."),
      el("p", null, "The machine goes back to how it was on the morning of 21 July 1997."),
      el("div", { class: "row" },
        (() => { const b = el("button", { class: "mus-btn" }, "Cancel");
          b.addEventListener("click", () => ov.remove()); return b; })(),
        (() => { const b = el("button", { class: "mus-btn warn" }, "Erase everything and reload");
          b.addEventListener("click", () => { State.reset(); location.reload(); }); return b; })()));
    const ov = el("div", { class: "ovl" }, card);
    ov.addEventListener("click", e => { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }

  function chrome() {
    $("#btnSound").classList.toggle("on", State.get("sound", false));
    $("#btnSound").addEventListener("click", () => {
      const v = !State.get("sound", false);
      State.set("sound", v);
      $("#btnSound").classList.toggle("on", v);
      if (v) Sound.test();
    });
    $("#btnMono").classList.toggle("on", State.get("monoScreen", false));
    $("#btnMono").addEventListener("click", () => {
      const v = !State.get("monoScreen", false);
      State.set("monoScreen", v);
      $("#btnMono").classList.toggle("on", v);
      Theme.apply();
    });
    $("#btnWs").addEventListener("click", ev => {
      const r = ev.currentTarget.getBoundingClientRect();
      const items = Session.workspaces().map((w, i) => ({
        label: w.name + (i === Session.currentIndex() ? "   (current)" : ""),
        run: () => Session.switchTo(i) }));
      items.push({ sep: true });
      items.push({ label: "Add Workspace", run: () => Session.add() });
      items.push({ label: "Rename current...", run: () => Mw.prompt("Rename Workspace",
        "Workspace name:", Session.currentWs().name, v => Session.rename(Session.currentIndex(), v)) });
      Mw.popup(items, r.left, r.bottom, { title: "Workspaces" });
    });
    $("#btnAbout").addEventListener("click", about);
    $("#btnReset").addEventListener("click", resetDialog);
    window.addEventListener("keydown", e => {
      if (e.key === "F9" && e.shiftKey) { e.preventDefault(); Guide.toggle(); }
    });
  }

  function scale() {
    const vp = $("#viewport"), st = $("#stage");
    const k = Math.min(vp.clientWidth / 1152, vp.clientHeight / 900);
    st.style.transform = "scale(" + k + ")";
  }

  function init() {
    Disk.init();
    extraFiles();
    Persist.restoreFiles();
    Persist.init();
    seedHomeSession();
    Session.init(State.get("session_current", null));
    Theme.apply();
    Keys.init();
    Guide.init();
    chrome();
    scale();
    window.addEventListener("resize", scale);
    /* the Front Panel's clock and date faces, and the busy light's blink */
    setInterval(() => Panel.tick(), 220);
    /* dropping a file on the backdrop is not a no-op: dtwm asked what to do */
    Bus.on("dropdesk", d => {
      const p = d.payload.paths[0];
      if (!p) return;
      Mw.popup([
        { label: "Open", run: () => Dt.open(p) },
        { label: "Open Folder", run: () => Exec.run("/usr/dt/bin/dtfile -dir " +
            p.replace(/\/[^/]*$/, "")) },
        { label: "Print", run: () => Printers.print([p]) },
        { sep: true },
        { label: "Put in Trash", run: () => Trash.put(p) }
      ], d.ev.clientX, d.ev.clientY, { title: p.split("/").pop() });
    });
    boot(State.get("booted", false));
    State.set("booted", true);
    window.addEventListener("beforeunload", () => { if (Sys.loggedIn) Session.save("current"); });
  }
  return { init, boot, about, scale };
})();

let __started = false;
function __start() { if (__started) return; __started = true; Sim.init(); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", __start);
else __start();
</script>
