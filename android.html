const Guide={
  tab:'welcome', seen:{},
  TABS:[['welcome','Welcome'],['thesis','The thesis'],['device','The device'],['keyboard','No keyboard'],['notify','Notifications'],['intents','Intents & Back'],['sync','Sync'],['home','Home & widgets'],['market','The Market'],['honest','Honest limits'],['easter','Easter eggs'],['pair','The iPhone, paired'],['colophon','Colophon']],
  FIRST:{ /* one-time museum toasts for moments that deserve a label */
    shade:'<b>Three notifications, none of which interrupted anything.</b> The competing phone at this moment threw a modal alert over your work and kept no record. Every phone on Earth now does it this way. <span class="gbtn" data-act="tab:notify">Why it mattered</span>',
    chooser:'<b>“Complete action using…”</b> Two applications declared they handle this. Neither knows the other exists; the registry resolved it at runtime. <span class="gbtn" data-act="tab:intents">Intents</span>',
    share:'<b>The share chooser.</b> Every entry is an application that declared, in an intent filter, that it accepts a picture. Install one more and count again. <span class="gbtn" data-act="tab:intents">How</span>',
    crossback:'<b>Back crossed an application boundary.</b> One hardware key, one stack, spanning applications. The other platform had a back button inside each app, if it had one at all.',
    slideopen:'<b>This is why the phone is shaped like this.</b> There is no software keyboard in Android 1.0, so the hardware one is not optional — and the phone is as thick as it is because of it. <span class="gbtn" data-act="tab:keyboard">More</span>',
    trackball:'<b>The trackball.</b> Roll it: focus moves, in orange. Click it: select. In a text field, one click moves the cursor one character — try doing that with a finger on a 3.2-inch screen.',
    lowspace:'<b>Low on space.</b> 256 MB of flash, about 74 MB of it yours, applications install only to internal storage. This notification is a permanent feature of owning this phone. <span class="gbtn" data-act="tab:honest">Honest limits</span>',
    installed:'<b>Installed.</b> Nothing else on the phone was told. Now share a picture — <span class="gbtn" data-act="share">Share one</span> — and see who turns up.',
    compass:'<b>Compass mode.</b> The magnetometer turns the panorama as you turn the handset. This was a launch demonstration in 2008. <span class="gbtn" data-act="desk:sensors">Turn it</span>',
    keyguard:'<b>“Press Menu to unlock.”</b> No swipe. The Menu key is the unlock in 1.0; the pattern lock is in Settings → Security & location.',
    ota:'<b>A system update.</b> The first ever over-the-air Android update, RC30, went out in early November 2008 to fix a serious mistake in the release firmware. <span class="gbtn" data-act="tab:honest">The story</span>',
    signedin:null, mapsintent:'<b>An address became a map</b> without Gmail or the Browser knowing which application draws maps. They asked for VIEW on a location; Maps had declared it could.',
    incomingcall:'<b>The one legitimate interruption.</b> A call takes the whole screen; everything else on this phone is a notification.',
    nojack:'<b>No 3.5 mm jack.</b> The G1 used a proprietary combined port and shipped with an adapter, which was widely and correctly regarded as a mistake. <span class="gbtn" data-act="desk:box">Find the adapter</span>',
    notegg:null, caret:null
  },
  init(){ this.seen=State.get('seen',{}); const t=$id('gtabs'); t.innerHTML=''; this.TABS.forEach(([id,label])=>{ const b=el('button',id===this.tab?'on':''); b.textContent=label; b.dataset.tab=id; b.onclick=()=>{ this.tab=id; this.render(); }; t.appendChild(b); }); $id('btnGuide').onclick=()=>this.toggle(); $id('guideclose').onclick=()=>{ $id('guide').classList.remove('open'); Display.layout(); }; $id('gbody').addEventListener('click',e=>{ const a=e.target.closest('[data-act]'); if(a){ this.act(a.dataset.act); return; } const x=e.target.closest('[data-tab]'); if(x){ this.tab=x.dataset.tab; this.render(); } }); },
  toggle(){ const g=$id('guide'); if(g.classList.contains('open')){ g.classList.remove('open'); Display.layout(); } else this.open(); },
  open(){ $id('guide').classList.add('open'); this.render(); Display.layout(); },
  openTab(id){ this.tab=id; this.open(); },
  mark(key){ const first=!this.seen[key]; this.seen[key]=(this.seen[key]||0)+1; State.set('seen',this.seen); if(first && this.FIRST[key]) setTimeout(()=>MToast.show(this.FIRST[key],9000),350); if(this.tab==='easter'&&$id('guide').classList.contains('open')) this.render(); },
  render(){ for(const b of $id('gtabs').children) b.classList.toggle('on',b.dataset.tab===this.tab); const body=$id('gbody'); body.scrollTop=0; body.innerHTML=this.html(this.tab); },
  act(a){
    if(a.startsWith('tab:')){ this.openTab(a.slice(4)); return; }
    if(a.startsWith('desk:')){ Desk.open(a.slice(5)); return; }
    if(a.startsWith('app:')){ if(!this.ready()) return; Intents.start({pkg:a.slice(4)}); return; }
    switch(a){
      case 'slide': Device.slide(!Device.kbdOpen); break;
      case 'sms': Museum.incomingText(); break;
      case 'call': Museum.incomingCall(); break;
      case 'im': if(this.ready()) Registry.broadcast('TALK_INCOMING',{}); break;
      case 'chain': if(this.ready()){ Registry.broadcast('SMS_RECEIVED',{addr:'555-0126',text:'Read this and tell me it is wrong: http://dailystandard.example/tech/g1-review — then find me at Gallery Nine, 555-0126'}); MToast.show('<b>A text arrived.</b> Pull the shade down, tap it, tap the link, follow the address into Maps, tap the phone number — then press Back four times.',10000); } break;
      case 'share': if(this.ready()) Intents.start({action:'VIEW',data:'content://images/'}); MToast.show('Long-press a picture → Share, or open one and press Menu → Share.'); break;
      case 'market': if(this.ready()) Intents.start({action:'VIEW',data:'market://details?id=mk.postcard'}); break;
      case 'sideload': Desk.open('apk'); break;
      case 'lowspace': Storage.consume('sys.misc',Math.max(0,Storage.freeKB()-Storage.LOW_KB+1500),false); MToast.show('The museum just filled the phone with cache. Watch the status bar.'); break;
      case 'freespace': Storage.release('sys.misc',Math.max(0,(Storage.used['sys.misc']||0)-7700)); Storage.release('sys.browser.cache'); Storage.release('sys.maps.cache'); MToast.show('Caches cleared. The notification withdraws — until next time.'); break;
      case 'web': WebSide.open(); break;
      case 'webmail': WebSide.open(); WebSide.tab='mail'; WebSide.render(); WebSide.compose(); break;
      case 'streetview': if(this.ready()) Intents.start({action:'VIEW',data:'geo:0,0?q=Harbor+Cafe'}); MToast.show('Tap the bubble → Street View → Compass mode.'); break;
      case 'shade': Notif.openShade(); break;
      case 'wallpaper': if(this.ready()) Intents.start({action:'SET_WALLPAPER'}); break;
      case 'alarm1': if(this.ready()){ const n=new Date(Date.now()+60000); Content.insert('alarms',{hour:n.getHours(),min:n.getMinutes(),on:true,days:'Once',label:'Museum test alarm',ring:'Harbor'}); AToast.show('Alarm set for 1 minute from now.'); } break;
      case 'ota': if(this.ready()){ if(Sys.settings.build==='TC4-RC29') Scheduler.ota(); else MToast.show('Already updated to RC30. Settings → About phone → Build number.'); } break;
      case 'lock': Sys.screenOff(); setTimeout(()=>Sys.wake(),900); break;
      case 'reset': Museum.confirmReset(); break;
      case 'scale': Display.cycleScale(); break;
      case 'settings': if(this.ready()) Intents.start({action:'SETTINGS_ABOUT'}); break;
      case 'storage': if(this.ready()) Intents.start({action:'SETTINGS_STORAGE'}); break;
    }
  },
  ready(){ if(!Sys.powered){ MToast.show('The phone is off. Press the End key.'); return false; } if(!Sys.on) Sys.wake(); if(Keyguard.on){ Keyguard.hide(); } if(!Sync.account){ MToast.show('Finish the setup wizard first — sign in with the account on the sticky note. It needs the keyboard. <span class="gbtn" data-act="slide">Slide it open</span>'); return false; } return true; },
  found(k){ return this.seen[k]?'✓ ':'○ '; },
  html(id){
    const A=(act,label)=>'<span class="gact" data-act="'+act+'">'+label+'</span>';
    const X=(tab,label)=>'<span class="xref" data-tab="'+tab+'">'+label+'</span>';
    switch(id){
    case 'welcome': return '<h3>Android 1.0 on the T-Mobile G1 — October 2008</h3>'
      +'<p>This is the first release of Android, recreated in one web page, on the only phone that ever ran it. The HTC Dream, sold in the United States as the T-Mobile G1 from 22 October 2008, was the entire installed base of Android 1.0: 1.1 in February 2009 was a minor update to the same phone, and no second handset arrived until 1.5 in April. So the question of which hardware to show has an unusually easy answer.</p>'
      +'<div class="pull">Side by side in a shop in late 2008 there was no contest. This is the phone nobody was choosing. And nearly every structural decision inside it is how every phone on Earth now works — including the pretty one.</div>'
      +'<p><b>Three things to do first.</b></p><ul><li>Tap a text field. The cursor blinks. Nothing can be typed. '+A('slide','Slide the phone open')+' and type. '+X('keyboard','Why')+'</li><li>Pull the status bar down. Notifications sit there, patiently. '+A('sms','Send yourself a text')+' — it will not interrupt you. '+X('notify','Why that mattered')+'</li><li>Share a picture and count the applications offered. Then '+A('sideload','install one more')+' and count again. '+X('intents','How that works')+'</li></ul>'
      +'<p><b>The desk.</b> The box the phone came in ('+A('desk:box','open it')+'), a sticky note with the donor\'s account, the sensors, and the '+A('web','web side of the account')+' — mail, contacts and calendar as they are on the server, which the phone keeps in step with over the air.</p>'
      +'<p><b>Controls.</b> Click the six keys and the trackball on the drawn handset, or use your keyboard: arrows roll the trackball, Enter clicks it, Escape is Back, Home is Home, F1 is Menu, and Tab slides the keyboard. Letters type only when the slide is open. The phone is drawn at its true 320 × 480 pixels at an integer scale when your window allows; '+A('scale','cycle the scale')+'.</p>'
      +'<p>The guide is a separable layer; the phone underneath does not know it exists. Start with '+X('thesis','the thesis')+'.</p>';
    case 'thesis': return '<h3>The phone that lost the demo and won the market</h3>'
      +'<p>If this collection holds the iPhone OS 1.0 exhibit, these two are a matched pair, and the comparison is the point of building this one. They arrived fifteen months apart and disagreed about almost everything — not cosmetically, but architecturally.</p>'
      +'<p>The iPhone was a <b>product</b>. The G1 was a <b>platform with a phone attached</b>, and it looked like it: heavier, thicker, uglier, slower, visually inconsistent, and shipped with a catalogue of a few dozen free applications. It sold roughly a million units over its life, which the iPhone had managed in a weekend.</p>'
      +'<p>And nearly every architectural bet Android made in 2008 either won outright or was subsequently adopted by its competitor:</p>'
      +'<ul><li><b>Notifications.</b> A pull-down shade of persistent, dismissible notifications, on day one. The competitor had modal alerts that interrupted you and kept no record; push arrived mid-2009 and a notification centre in 2011. '+X('notify','See it')+'</li>'
      +'<li><b>Intents.</b> Any application declares what content it handles; any other hands content off without knowing who takes it. Still the sharpest structural difference between the two platforms. '+X('intents','See it')+'</li>'
      +'<li><b>The Back button.</b> One hardware key traversing a system-wide stack across application boundaries.</li>'
      +'<li><b>Background services and real multitasking</b>, from launch. Music keeps playing; the mail keeps arriving.</li>'
      +'<li><b>Sync with no cable.</b> Sign in and mail, contacts and calendar arrive over the air. The competitor needed a computer, a cable and a desktop application. '+X('sync','See it')+'</li>'
      +'<li><b>Home screen widgets</b>, roughly twelve years before the other platform had them. '+X('home','See it')+'</li>'
      +'<li><b>Open source and open licensing</b>, so anyone could ship a device — which, by 2010, everyone did.</li></ul>'
      +'<div class="pull">So the exhibit is not “the scrappy underdog was secretly better.” It is more interesting than that: <b>the thing that looked worse was structured better, and structure is what compounded.</b></div>'
      +'<p>The other half of being fair is '+X('honest','the list of what was genuinely bad')+', which is long, and includes a security embarrassment.</p>';
    case 'device': return '<h3>The device — drawn whole, because the best moments are physical</h3>'
      +'<p>A 3.2-inch HVGA capacitive touchscreen, <b>320 × 480 pixels at 180 ppi</b>. The exhibit draws exactly those pixels and scales the whole handset by an integer when your window allows, so the pixels stay honest. Below the screen: six physical controls — <b>Call</b>, the long <b>Menu</b> key, <b>End/Power</b>, <b>Home</b>, <b>Back</b>, and the <b>trackball</b> between them — then the forward-angled <b>chin</b>, which everyone remembers and nobody could explain.</p>'
      +'<p><b>The slide.</b> The screen swings up and across on an arc, the keyboard appears, and you turn the phone: the display re-lays itself out in landscape. It is the only way to get landscape on most of this phone — the accelerometer is there, but 1.0 does not use it to rotate the screen. '+A('slide','Slide it')+' '+X('keyboard','Why it is there at all')+'</p>'
      +'<p><b>The trackball.</b> Drag it to roll, click to select, use the wheel to scroll. It is the single most-missed control from this era and it has vanished from phones entirely. Roll it over a list and the focus turns <em>orange</em>; put the cursor in a text field and it moves one character per click, which a finger on a 3.2-inch screen cannot do.</p>'
      +'<p><b>The port.</b> There is no 3.5 mm headphone jack. The G1 used a proprietary combined port and shipped with an adapter, which was widely and correctly regarded as a mistake. Plug headphones in without it and they do not fit; the adapter is somewhere in the box. '+A('desk:box','The box')+'</p>'
      +'<p><b>Sensors.</b> An accelerometer and a compass, both used at launch — Street View\'s compass mode turns the panorama as you turn the handset. '+A('desk:sensors','Turn it')+' '+A('streetview','Open Street View')+'</p>'
      +'<p><b>Also on the frame:</b> a volume rocker on the left edge (the exhibit\'s sound volume follows it, and zero is silent mode); a camera key on the right edge, the only shutter there is; End is also Power — hold it for the power menu, press it for the screen.</p>'
      +'<p>Everything is drawn in code, in the idiom of the original. No manufacturer\'s or carrier\'s marks appear; neutral placeholders sit where they sat.</p>';
    case 'keyboard': return '<h3>There is no on-screen keyboard. None.</h3>'
      +'<p>Not a bad one. Not a small one. <b>Android 1.0 has no software keyboard at all.</b> Tap any text field with the phone closed and the cursor blinks, and there is nothing to summon. The software keyboard arrived with 1.5 “Cupcake” in April 2009, six months later.</p>'
      +'<p>So: '+A('slide','slide the phone open')+' — watch the screen swing out on its arc and the display turn — and type on the keys that appear. With the slide open, your own keyboard types into the phone too; the drawn keys light as you press them.</p>'
      +'<div class="pull">This is why the G1 is shaped the way it is, why it is as thick as it is, and why every Android device for the following two years came with a hardware keyboard — until the software one was good enough to make them unnecessary.</div>'
      +'<p>Notice what happens when you slide open <em>mid-sentence</em>, which is what everyone did constantly: the activity is torn down and rebuilt in the new orientation, the screen blinks, and — if the application saved its state — your text survives. Slide it shut and it all happens again in reverse.</p>'
      +'<p>The first place this bites is the setup wizard: the phone cannot be used without signing in, and signing in means typing, and typing means opening the slide. In 2008 the very first thing a new owner did was discover the shape of the phone.</p>'
      +'<p>The layout here is five rows in the idiom of the original — numbers, letters, a DEL key, SHIFT, ENTER, two ALT keys — drawn from scratch. Search, Menu and the trackball are all elsewhere; there are no arrow keys, because that is what the ball is for.</p>';
    case 'notify': return '<h3>The notification shade — the headline demonstration</h3>'
      +'<p>A status bar across the top: notification icons accumulate on the <b>left</b>, and the signal, data type, battery and clock sit on the <b>right</b>. When a notification arrives its text <em>tickers</em> through the bar for a moment. Pull the bar down and every notification is there — ongoing ones first, then the latest — each tappable to jump to the relevant screen, each dismissible, with a Clear button for all of them.</p>'
      +'<p>'+A('sms','Send a text')+' '+A('im','Receive an IM')+' '+A('webmail','Mail yourself from the web')+' '+A('shade','Pull the shade down')+'</p>'
      +'<div class="vs"><div class="a"><h5>Android 1.0, October 2008</h5>Persistent. Queued. Dismissible. Tappable. Nothing is modal. Any application can post one through a system service, and nothing about the posting application is special-cased.</div><div class="b"><h5>iPhone OS, the same month</h5>An arriving text throws a modal alert across whatever you are doing. Close it and nothing remains but a badge. No history, no queue, no shade. Push notifications arrived in mid-2009; a notification centre — a shade — in 2011.</div></div>'
      +'<p>Android\'s model won so completely that its competitor eventually built essentially the same thing, and today <b>every phone on Earth</b> uses it: the pull-down, the list, the dismiss, the tap-to-jump.</p>'
      +'<p>The exhibit\'s notifications are real notifications. New mail, texts, IMs, missed calls, downloads, installs, calendar reminders, a low-storage warning and a system update all arrive through the same service; there is one code path and it does not know who is calling.</p>'
      +'<p>One thing genuinely interrupts: '+A('call','an incoming call')+'. That is deliberate, and it is still true.</p>';
    case 'intents': return '<h3>Intents, activities, and one Back key</h3>'
      +'<p>This is the foundational module of the exhibit and it was built first, before any screen existed, because it is what makes the thing a system rather than a set of screens.</p>'
      +'<p><b>Activities live on a stack.</b> Launching a screen pushes; Back pops. The stack spans applications: open a link in a message and the browser\'s screen sits on top of the message; follow an address into Maps and Maps sits on top of the browser; tap a phone number and the dialer sits on top of Maps. Press Back four times and you walk back out through <b>four applications</b> as though they were one. '+A('chain','Set the chain up')+'</p>'
      +'<p><b>Intents.</b> An application does not call another application. It declares what it wants done and to what — <em>view this address</em>, <em>send this picture</em> — and a registry resolves that at runtime against every application that has declared, in an <b>intent filter</b>, that it can. One match starts directly. Several produce the dialog every Android user knows: <b>“Complete action using…”</b>, with a checkbox to make one the default (clear it later in Settings → Applications → Manage applications).</p>'
      +'<p>Try it: the maps link in a message is claimed by both the Browser and Maps, so you are asked. Sharing a picture from Pictures or the Camera offers <b>four</b> applications — Gmail, Email, Messaging, and the Postcard-style receivers are yet to come. '+A('share','Share a picture')+'</p>'
      +'<div class="pull"><b>The payoff.</b> Install an application that declares it accepts pictures — from the '+A('market','Market')+', or the '+A('sideload','package on the desk')+' — and it appears in the share chooser <em>immediately</em>, without any other part of the phone knowing it exists. Then uninstall it and it is gone again.</div>'
      +'<p><b>The structural rule of this build:</b> no application module references another by name. If Gmail wants a map drawn, it asks the system for something that can VIEW a location. The Colophon reports the self-test that enforces it.</p>'
      +'<p>The other platform had none of this in 2008: applications could not hand content to each other at all, and each application had its own back button inside its own navigation bar, if it had one. A share sheet with extensions arrived there in 2014.</p>';
    case 'sync': return '<h3>Sync with no cable</h3>'
      +'<p>First run asks for an account. Sign in and mail, contacts and calendar arrive over the air — no cable, no desktop software, no sync button anywhere on the phone. From then on the phone and the server reconcile continuously in both directions.</p>'
      +'<p>The exhibit gives the server a face: the '+A('web','web side')+', a 2008 desktop browser window on the desk showing the same account. Compose a message there and it lands in Gmail on the phone with a notification a few seconds later. Add a contact on the phone and it appears in the web window. Star, archive, delete — either side; the other follows. The engine is last-writer-wins by modification time, which is also roughly how the real one worked.</p>'
      +'<p>'+A('webmail','Send mail from the web to the phone')+' '+A('app:org.museum.contacts','Add a contact on the phone')+'</p>'
      +'<div class="vs"><div class="a"><h5>The G1</h5>Account on the phone. Data arrives over the air, continuously, in the background, to any application that has a sync adapter. The cable in the box is for charging and for mounting the SD card.</div><div class="b"><h5>The iPhone, same date</h5>A computer running iTunes, a USB cable, and a manual sync for contacts, calendar, music and — until MobileMe — mail settings. Activation itself required the cable.</div></div>'
      +'<p>The account here belongs to the phone\'s donor; the museum wiped the handset but left the account alive, which is why signing in brings back someone else\'s Sunday lunch — and one reminder that has been waiting since 2008.</p>';
    case 'home': return '<h3>Home screen, widgets, the drawer</h3>'
      +'<p><b>Wallpaper</b>, customisable from day one (Menu → Wallpaper, or set a picture from Pictures). <b>Three panels</b>, swiped horizontally, dots at the bottom. <b>Widgets placed directly on the home screen</b> — the launch set was a search bar, an analogue clock, a calendar, a music control and a picture frame, and all five are here and live: the clock ticks, the calendar shows your next event, the music widget drives the player, the frame shows a picture you pick.</p>'
      +'<p>The <b>app drawer</b> is the tab at the bottom: pull it up and the application grid slides over the wallpaper. This is not a flat grid of every application filling the home screen; the distinction from the competing platform was deliberate, and it is visible.</p>'
      +'<p><b>Long-press</b> an empty space to add shortcuts, widgets, folders and wallpapers. Long-press an item to pick it up and drag it; the drawer tab turns into a <b>trash</b> target while you drag. Drag to the edge to change panel. Folders open in place; tap a folder\'s title to rename it.</p>'
      +'<p>The <b>Menu key</b> opens a contextual grid of commands at the bottom of every screen — an Android convention for years. It was deprecated in 2011 for good reasons: nothing on screen told you a menu existed, so features hid in it, and people never found them. The action bar that replaced it put the commands where you could see them.</p>'
      +'<p>Widgets are provided by applications and hosted by the launcher generically; the launcher knows none of them by name. Third-party widgets were not yet open to developers — that is 1.5 — which the Market\'s Weather Glance complains about.</p>'
      +'<p>'+A('wallpaper','Change the wallpaper')+' '+A('app:org.museum.home','Go home')+'</p>';
    case 'market': return '<h3>Android Market — browsed in full in about ninety seconds</h3>'
      +'<p><b>Free applications only.</b> Paid application support did not arrive until early 2009. The catalogue at launch was a few dozen titles — the exhibit has forty-odd, all original, all fictional, and it is honest about how sparse it felt: scroll to the bottom of a category and the Market tells you that is the whole category.</p>'
      +'<p>Installing shows the <b>permissions</b> the application asked for — a 1.0 idea that every platform now copies — then a download notification, then an “installed” notification. Installs consume internal storage, and there is not much of it: install a few and the '+X('honest','low-storage notification')+' arrives. Try installing the 7.4 MB dictionary when it does.</p>'
      +'<p>Two applications in the catalogue declare that they accept pictures — <b>Postcard</b> and <b>Photo Effects</b>. Install either and it appears in every share chooser on the phone, immediately. '+A('market','Open Postcard in the Market')+' '+X('intents','Why')+'</p>'
      +'<p>There was also a way around the Market from day one: <b>Unknown sources</b> in Settings → Applications lets you install a package from a memory card, and the phone warns you before it does. '+A('sideload','The package on the desk')+'</p>'
      +'<p>Uninstall from the Market\'s My downloads tab, or from Settings → Applications → Manage applications, where each application shows its size — and a “Clear defaults” button for any it has been made the default for.</p>';
    case 'honest': return '<h3>Honest limitations</h3>'
      +'<p>This exhibit needs a substantial list, and the honesty is part of the argument.</p>'
      +'<div class="absent"><b>No software keyboard.</b> None at all. '+X('keyboard','Slide')+'</div>'
      +'<div class="absent"><b>No multi-touch and no pinch-to-zoom.</b> The G1\'s hardware was capable; Android 1.0 did not expose it, and zooming — in the Browser, in Maps, in Pictures — was done with on-screen plus and minus buttons that appear when you touch the screen. The reasons discussed at the time were partly technical and partly commercial; the debate is noted here without adjudication.</div>'
      +'<div class="absent"><b>No video recording.</b> 3.2 megapixels, autofocus, no flash, stills only. Video came with 1.5. Press Menu in the Camera and count the options.</div>'
      +'<div class="absent"><b>No stereo Bluetooth</b> (A2DP), and <b>no headphone jack</b> without an adapter.</div>'
      +'<div class="absent"><b>192 MB of RAM and 256 MB of internal storage</b>, with applications installed only to internal storage — about 74 MB of it available. Running out of space was a permanent, ambient condition of owning this phone, and the low-storage notification is a recurring feature of the exhibit rather than a one-off: it arrives when you install, browse, or pan a map too far, and withdraws when you clear a cache. '+A('lowspace','Fill the phone')+' '+A('freespace','Clear caches')+' '+A('storage','Storage settings')+'</div>'
      +'<div class="absent"><b>It was slow</b>, with visible jank in scrolling and application launches. Not smoothed out here: flings drop frames, launches show a blank window with a title bar for a beat, and background applications get killed to make room and are slowly rebuilt when you return.</div>'
      +'<div class="absent"><b>The visual design was inconsistent</b> — icons of varying quality and style, spacing that did not always agree with itself, and a general sense of having been assembled by engineers. That is accurate and it has not been tidied.</div>'
      +'<div class="absent"><b>The Market was nearly empty</b>, and there was no way to pay for anything.</div>'
      +'<div class="absent"><b>Battery life was poor</b>, and the phone was thick and heavy. The exhibit\'s battery drains while you visit; the charger is in the box.</div>'
      +'<div class="absent"><b>A genuine security embarrassment.</b> Shortly after launch it emerged that a debugging shell had been left active in the shipping firmware, such that text typed on the home screen could be executed with high privileges. It was patched quickly — the RC30 over-the-air update in early November 2008, the first Android OTA ever, which the exhibit '+A('ota','offers you')+' and which changes the build number in About phone from TC4-RC29 to TC4-RC30. It is recorded here as a historical fact with no technical detail whatsoever: the point is that a first release from a large company shipped with a serious mistake in it, not how the mistake worked.</div>'
      +'<p>Also absent, and correct for 1.0: no on-screen rotation from the accelerometer, no notification actions or grouping, no copy-and-paste from web pages, no Exchange, no voice search, no tethering, and nothing hidden behind the version number in About phone — that tradition began two releases later.</p>';
    case 'easter': return '<h3>Easter eggs — what you have found</h3>'
      +'<p>The exhibit keeps a list. Ticks are yours.</p><ul>'
      +'<li>'+this.found('slideopen')+'<b>Sliding the keyboard open mid-sentence</b>, which is what everyone did constantly.</li>'
      +'<li>'+this.found('caret')+'<b>Placing the cursor with the trackball</b>, and how quickly it becomes the preferred way.</li>'
      +'<li>'+this.found('crossback')+'<b>Back through an application boundary</b> — walk out through three or four applications from deep inside a chain. '+A('chain','Set it up')+'</li>'
      +'<li>'+this.found('installed')+'<b>A share chooser that grows an entry</b> after a new application is installed. '+this.found('postcard')+'…and a postcard sent from it.</li>'
      +'<li>'+this.found('lowspace')+'<b>The low-storage notification</b>, arriving at the least convenient moment.</li>'
      +'<li>'+this.found('adapter')+'<b>The headphone adapter</b>, findable in the fiction; '+this.found('nojack')+'a note about the port.</li>'
      +'<li>'+this.found('compass')+'<b>Street View\'s compass mode.</b></li>'
      +'<li>'+this.found('ghost')+'<b>A notification left in the shade from a previous owner</b> — a reminder set on 22 October 2008 that synced down with the account and fired.</li>'
      +'<li>'+this.found('marketend')+'<b>The Market, browsed in full</b> in about ninety seconds.</li>'
      +'<li>'+this.found('notegg')+'<b>Nothing in About phone.</b> The tap-the-version-number tradition had not started yet; tap it seven times anyway.</li>'
      +'<li>'+this.found('ota')+'<b>The first over-the-air update</b>, RC30, offered a few minutes after setup.</li>'
      +'<li>'+this.found('keyguard')+'<b>“Press Menu to unlock.”</b> Let the screen time out, or press End.</li>'
      +'<li>'+this.found('incomingcall')+'<b>The one interruption</b>: an incoming call.</li>'
      +'<li>'+this.found('shot')+'<b>A photograph</b>, taken with the camera key or the trackball, because there is no on-screen shutter.</li>'
      +'</ul>';
    case 'pair': return '<h3>The iPhone, paired</h3>'
      +'<p>The museum\'s iPhone OS 1.0 exhibit is the other half of this argument. Its thesis is that the iPhone <em>deleted the intermediary</em> — you touch the content itself, and everything else follows from the physicality. This exhibit\'s thesis is that the G1 <em>built the structure</em> — and structure compounds. Both are true, and the two phones disagreed about almost everything in between.</p>'
      +'<table><tr><th>October 2008</th><th>T-Mobile G1</th><th>iPhone (OS 2.1)</th></tr>'
      +'<tr><td>Notifications</td><td>Shade: persistent, queued, dismissible</td><td>Modal alert; badge; no history</td></tr>'
      +'<tr><td>Between apps</td><td>Intents, chooser, share everywhere</td><td>None; each app an island</td></tr>'
      +'<tr><td>Back</td><td>One hardware key, system-wide stack</td><td>Per-app button in the nav bar</td></tr>'
      +'<tr><td>Multitasking</td><td>Background services from launch</td><td>One app at a time until 2010</td></tr>'
      +'<tr><td>Sync</td><td>Over the air, no cable, continuous</td><td>iTunes over USB</td></tr>'
      +'<tr><td>Widgets</td><td>Five at launch, on the home screen</td><td>2020</td></tr>'
      +'<tr><td>Keyboard</td><td>Hardware only; slide to type</td><td>Software only; the best there was</td></tr>'
      +'<tr><td>Multi-touch</td><td>Not exposed; zoom buttons</td><td>Pinch, everywhere</td></tr>'
      +'<tr><td>Applications</td><td>Market, a few dozen, all free</td><td>App Store, thousands, paid</td></tr>'
      +'<tr><td>Cursor</td><td>Trackball, one character per click</td><td>Finger, magnifying loupe</td></tr>'
      +'<tr><td>Looks</td><td>Assembled</td><td>Designed</td></tr>'
      +'<tr><td>Units sold</td><td>About a million, lifetime</td><td>About a million, opening weekend</td></tr></table>'
      +'<p>Every row in the left column except the keyboard and the trackball is how phones work now, on both platforms. Every row in the right column except the last three was adopted, eventually, by the left. The phone that lost the demo won the market; the phone that won the market became, structurally, the phone that lost the demo. That is the whole exhibit.</p>';
    case 'colophon': return '<h3>Colophon</h3>'
      +'<p>One HTML file. All CSS and JavaScript inline; no external resources, no web fonts, no images, no network requests. Works from a file on disk. LocalStorage holds the account and its synced data, the home screen, installed applications, messages, photographs, browser history, notifications, settings — including the keyboard slide — and a factory data reset in Settings → SD card & phone storage clears it with the confirmations the original had.</p>'
      +'<p><b>Modules, in build order:</b> the intent registry and activity stack; the notification service; the device shell; the display layer; home screen and launcher; the widget framework; the application framework and the applications; the sync engine; the input model; the storage model; the guide layer; the sound manager; the state manager.</p>'
      +'<p><b>Structural self-test:</b> <span id="structtest">running…</span></p>'
      +'<p><b>Artwork.</b> All original, drawn in code: the handset in the idiom of the original, icons of deliberately varying style, wallpapers, the map of Port Ellery, the panoramas, every photograph on the SD card, every album cover. No Google application icons, no Android robot, no Google, HTC or T-Mobile marks, no HTC industrial design. Android 1.0 used the Droid typeface family; it is not fetched — a local humanist sans stack stands in.</p>'
      +'<p><b>Vocabulary.</b> Android Market, not Google Play. Browser, not Chrome. Activities, intents, widgets, the notification shade, the app drawer, the options menu, the trackball.</p>'
      +'<p><b>Sound.</b> Synthesized: notification pips, the keyboard click, the trackball tick, the shutter, lock and unlock, a ringtone, an alarm, and a small sequencer for the Music application. Off by default; the rail toggles it and the drawn volume rocker sets the level.</p>'
      +'<p>'+A('reset','Factory data reset')+' — returns the exhibit to a fresh, unset-up phone. The SD card and the account on the server survive, as they would have.</p>';
    }
    return '';
  }
};

/* ==========================================================================
   THE MUSEUM — wiring, boot, the rail, the battery, the reset.
   ========================================================================== */
const Museum={
  startedAt:Date.now(),
  init(){
    State.load(); Sound.init(); Sys.init(); Storage.init(); Wallpapers.init(); Content.init();
    if(!State.get('seeded',false)){ Seed.sdCard(); Seed.phone(); State.set('seeded',true); }
    Sync.init(); Registry.defaults=State.get('intentDefaults',{});
    Device.init(); Display.init(); Stack.init(); Keyguard.init(); Notif.init(); Input.keydownSetup();
    Launcher.register(); Installer.restore();
    const homeComp=Registry.component('org.museum.home/Home'); Stack.setLauncher(new homeComp.create({action:'MAIN'},homeComp));
    Guide.init(); Desk.init(); WebSide.init();
    /* the rail */
    $id('btnSound').onclick=()=>{ Sound.set(!Sound.on); $id('btnSound').textContent='Sound: '+(Sound.on?'on':'off'); $id('btnSound').classList.toggle('on',Sound.on); if(Sound.on) Sound.ensure(); };
    $id('btnSound').textContent='Sound: '+(Sound.on?'on':'off'); $id('btnSound').classList.toggle('on',Sound.on);
    $id('btnSMS').onclick=()=>this.incomingText(); $id('btnCall').onclick=()=>this.incomingCall(); $id('btnScale').onclick=()=>Display.cycleScale(); $id('btnReset').onclick=()=>this.confirmReset();
    $id('btnScale').textContent='Scale: '+(Display.scaleMode==='auto'?'auto':Display.scaleMode==='fit'?'fit':Display.scaleMode+'×');
    /* battery: drains while you visit; charges from the box */
    Device.battery=State.get('battery',76);
    setInterval(()=>{ if(!Sys.powered) return; if(Desk.charging){ Device.battery=Math.min(100,Device.battery+1); } else if(Math.random()<0.45) Device.battery=Math.max(1,Device.battery-1); State.set('battery',Device.battery); Notif.renderRight(); if(Device.battery===15&&!Desk.charging&&!this._lowBatt){ this._lowBatt=true; Dialog.show({title:'Battery low',message:'15% remaining or less.\nPlease connect charger.',buttons:[{label:'OK'}]}); } if(Device.battery>20) this._lowBatt=false; },45000);
    setInterval(()=>Notif.renderRight(),15000);
    /* the ghost in the shade: the previous owner's reminder fires once the account has synced */
    Registry.get('system').receivers['NOTIFICATION_POSTED']=x=>{ if(x.id==='cal.e_ghost') Guide.mark('ghost'); };
    Boot.run();
    if(!State.get('welcomed')){ State.set('welcomed',true); setTimeout(()=>{ Guide.open(); },1200); }
    this.structuralTest();
  },
  incomingText(){ if(!Guide.ready()) return; const opts=[['555-0126','Lena Voss','Look at this: http://dailystandard.example/city/ferry — Pier 2 at six? Call me if not, 555-0126'],['555-0142','Marcus Bell','Running late. Harbor Cafe: http://maps.example/?q=Harbor+Cafe'],['555-0107','Bea Halloran','Sunday. One o\'clock. Bring the phone.'],['555-0155','Kenji Sato','did you find the trackball cursor trick yet'],['42200','Transit Alerts','Line 7 now terminates at Central after 22:00. Timetable: http://transit.example/timetable']]; const o=pick(opts); Registry.broadcast('SMS_RECEIVED',{addr:o[0],text:o[2]}); },
  incomingCall(){ if(!Guide.ready()) return; if(Sys.inCall){ MToast.show('Already on a call.'); return; } const c=pick(Content.query('contacts',c=>c.phones.length)); Intents.start({action:'INCOMING_CALL',extras:{name:c?c.name:'Unknown',num:c?c.phones[0].num:'555-0000'}}); },
  confirmReset(){ if(!confirm('Factory data reset?\n\nThis erases the account on the phone, applications, messages, settings and the home screen — as the original\'s "Erase everything" did. The SD card (pictures, music) and the account on the server survive.')) return; this.factoryReset(); },
  factoryReset(){ const keep={web:State.get('web',null),sound:State.get('sound',false),scaleMode:State.get('scaleMode','auto'),images:Content.all('images'),audio:Content.all('audio'),sdUsed:State.get('sdUsed',0)}; State.eraseAll(); const empty=Content.empty(); empty.images=keep.images; empty.audio=keep.audio; State.data={web:keep.web,sound:keep.sound,scaleMode:keep.scaleMode,content:empty,seeded:true,sdUsed:keep.sdUsed,welcomed:true}; State.save(); location.reload(); },
  /* the structural test: no application module references another by name */
  structuralTest(){
    try{
      const src=Array.from(document.scripts).map(s=>s.textContent).join('\n');
      const sections=src.split('/* ---------- ').slice(1);
      const problems=[];
      sections.forEach(sec=>{ sec=sec.split('/* ====')[0]; const own=(/const PKG='([^']+)'/.exec(sec)||[])[1]; const title=sec.slice(0,sec.indexOf(' ----------')).trim(); if(!own) return; const refs=[...new Set((sec.match(/org\.museum\.[a-z]+/g)||[]))].filter(r=>r!==own&&!['org.museum.home','org.museum.setup','org.museum.packageinstaller'].includes(r)); if(refs.length) problems.push(title+' → '+refs.join(', ')); });
      const ok=!problems.length; this.structResult=ok?'passed — '+sections.filter(s=>/const PKG=/.test(s)).length+' application modules, none references another by name. Communication goes through the intent registry, the content providers, and broadcasts.':'FAILED: '+problems.join('; ');
      const s=$id('structtest'); if(s) s.textContent=this.structResult; if(!ok) console.warn('Structural test',problems);
    }catch(e){ this.structResult='could not run ('+e.message+')'; }
    const orig=Guide.html.bind(Guide); Guide.html=id=>{ const h=orig(id); return id==='colophon'?h.replace('running…',esc(this.structResult)):h; };
  }
};
document.addEventListener('DOMContentLoaded',()=>Museum.init());
</script>
