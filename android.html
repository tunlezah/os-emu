    return n.id;
  },
  cancel(id){ const i=this.list.findIndex(x=>x.id===id); if(i<0) return; this.list.splice(i,1); this.save(); this.renderIcons(); this.renderShade(); },
  cancelPkg(pkg){ this.list=this.list.filter(n=>n.pkg!==pkg); this.save(); this.renderIcons(); this.renderShade(); },
  cancelAll(){ this.list=this.list.filter(n=>n.ongoing); this.save(); this.renderIcons(); this.renderShade(); if(!this.list.length) this.close(); },
  get(id){ return this.list.find(n=>n.id===id); },
  tick(n){ clearTimeout(this._ticker); this.ticker.innerHTML='<span class="ti">'+n.icon+'</span>'+esc(n.ticker); this.ticker.classList.add('show'); this._ticker=setTimeout(()=>this.ticker.classList.remove('show'),3200); },
  renderIcons(){
    const ic=this.icons; Array.from(ic.children).forEach(c=>{ if(c!==this.ticker) c.remove(); });
    const vis=this.list.slice().sort((a,b)=>(b.ongoing?1:0)-(a.ongoing?1:0) || b.when-a.when);
    const max=Math.floor((Display.W-140)/27);
    vis.slice(0,max).forEach(n=>{ const d=el('div','ni',n.icon); d.title=n.title; ic.appendChild(d); });
    if(vis.length>max) ic.appendChild(el('div','ni',ICON.st.more));
  },
  renderRight(){
    const s=Sys.settings; const parts=[];
    if(Sync.syncing) parts.push(ICON.st.sync);
    if(Sound.vol===0) parts.push(ICON.st.silent);
    if(Device.headphones) parts.push(ICON.st.headset);
    if(s.airplane) parts.push(ICON.st.airplane); else { parts.push(s.wifi? ICON.st.wifi: ICON.st.data3g); parts.push(ICON.st.signal); }
    parts.push(ICON.st.battery(Device.battery));
    parts.push('<span class="clock">'+fmtClockShort()+'</span>');
    this.right.innerHTML=parts.join('');
  },
  renderShade(){
    const L=this.listEl; L.innerHTML='';
    const ongoing=this.list.filter(n=>n.ongoing).sort((a,b)=>b.when-a.when), latest=this.list.filter(n=>!n.ongoing).sort((a,b)=>b.when-a.when);
    const inner=el('div','inner');
    const row=n=>{ const d=el('div','ni f'); d.innerHTML='<div class="ic">'+n.icon+'</div><div class="tx"><b>'+esc(n.title)+'</b><span>'+esc(n.text||'')+'</span></div><div class="when">'+esc(fmtShort(n.when))+'</div>';
      d.onclick=()=>{ this.close(); if(n.autoCancel!==false && !n.ongoing) this.cancel(n.id); Registry.broadcast('NOTIFICATION_CLICKED',{id:n.id}); if(n.intent) setTimeout(()=>Intents.start(n.intent,null),60); };
      return d; };
    if(ongoing.length){ inner.appendChild(el('div','sect','Ongoing')); ongoing.forEach(n=>inner.appendChild(row(n))); }
    if(latest.length){ inner.appendChild(el('div','sect','Latest notifications')); latest.forEach(n=>inner.appendChild(row(n))); }
    if(!this.list.length) inner.appendChild(el('div','none','No notifications'));
    L.appendChild(inner);
    $id('shadeClear').style.display=latest.length?'':'none';
    $id('shadeCarrier').textContent=Sys.settings.airplane?'Radio off':'Carrier';
  },
  openShade(){ if(this.open) return; if(!Sys.on || Keyguard.on) return; this.open=true; this.shade.classList.remove('drag'); this.shade.style.transform=''; this.shade.classList.add('open'); Menu.close(); this.renderShade(); Guide.mark('shade'); Input.setContext('shade'); },
  close(){ if(!this.open) return; this.open=false; this.shade.classList.remove('drag'); this.shade.style.transform=''; this.shade.classList.remove('open'); Input.setContext(null); },
  toggle(){ this.open?this.close():this.openShade(); },
  dragSetup(){
    const sb=this.sb, sh=this.shade, H=()=>Display.H-25;
    let dragging=false,startY=0,startOpen=false,moved=false;
    const down=(e)=>{ if(!Sys.on||Keyguard.on) return; dragging=true; moved=false; startY=Display.toLogical(e).y; startOpen=this.open; sh.classList.add('drag'); e.preventDefault(); };
    const move=(e)=>{ if(!dragging) return; const y=Display.toLogical(e).y; const dy=y-startY; if(Math.abs(dy)>4) moved=true;
      const base=startOpen?0:-(H()+26); const ty=clamp(base+dy,-(H()+26),0); sh.style.transform='translateY('+ty+'px)'; if(!startOpen && dy>4){ sh.classList.add('open'); } };
    const up=(e)=>{ if(!dragging) return; dragging=false; sh.classList.remove('drag'); const y=Display.toLogical(e).y; const dy=y-startY;
      if(!moved){ startOpen? this.close(): this.openShade(); sh.style.transform=''; return; }
      const openNow = startOpen ? dy>-H()*0.35 : dy>H()*0.25;
      sh.style.transform=''; if(openNow){ this.open=false; this.openShade(); } else { this.open=true; this.close(); } };

};

/* ==========================================================================
   MODULE 4 — DISPLAY LAYER. 320 × 480, 180 ppi, integer-scaled when it fits.
   Orientation is a display property with two triggers: the keyboard slide,
   and an activity that asks for landscape. There is no accelerometer
   rotation in 1.0; the sensor is there, the software does not use it for this.
   ========================================================================== */
const Display={
  W:320,H:480, orientation:'portrait', scaleMode:'auto', scale:1, fullscreen:false,
  init(){ this.lcd=$id('lcd'); this.stage=$id('stage'); this.handset=$id('handset'); this.scaleMode=State.get('scaleMode','auto'); this.layout(); window.addEventListener('resize',()=>this.layout()); },
  toLogical(e){ const r=this.lcd.getBoundingClientRect(); const s=r.width/this.W||1; return {x:(e.clientX-r.left)/s, y:(e.clientY-r.top)/s}; },
  setOrientation(o,instant){
    if(o===this.orientation) return;
    this.orientation=o; const land=o==='landscape';
    this.W=land?480:320; this.H=land?320:480;
    /* 1.0 destroyed and recreated the activity on rotation; the screen blinks */
    this.lcd.classList.add('dim'); setTimeout(()=>this.lcd.classList.remove('dim'), instant?0:260);
    this.lcd.classList.toggle('land',land); this.handset.classList.toggle('land',land);
    this.layout();
    Notif.renderIcons(); Notif.close(); Menu.close();
    const act=Stack.current(); if(act) setTimeout(()=>{ try{ act.onLayout(); }catch(e){} },30);
    Registry.broadcast('CONFIGURATION_CHANGED',{orientation:o});
  },
  /* what orientation should we be in given the keyboard and the top activity? */
  wanted(act){ if(act && act.orientation==='landscape') return 'landscape'; if(act && act.orientation==='portrait') return 'portrait'; return Device.kbdOpen?'landscape':'portrait'; },
  applyActivity(act){ this.setOrientation(this.wanted(act)); const fs=!!(act && act.fullscreen); this.fullscreen=fs; this.lcd.classList.toggle('nosb',fs); },
  cycleScale(){ const modes=['auto','1','2','fit']; this.scaleMode=modes[(modes.indexOf(this.scaleMode)+1)%modes.length]; State.set('scaleMode',this.scaleMode); this.layout(); $id('btnScale').textContent='Scale: '+(this.scaleMode==='auto'?'auto':this.scaleMode==='fit'?'fit':this.scaleMode+'×'); },
  layout(){
    const land=this.orientation==='landscape', open=Device.kbdOpen;
    let visW,visH,tx=0,ty=0;
    if(!land){ visW=373; visH=669; tx=98; }
    else if(open){ visW=669; visH=564; tx=0; ty=0; }
    else { visW=669; visH=373; ty=-98; }
    const guideW=$id('guide').classList.contains('open')? Math.min(440,window.innerWidth*0.92):0;
    const availW=window.innerWidth-guideW-28, availH=window.innerHeight-34-28;
    const fit=Math.min(availW/visW, availH/visH);
    let s;
    if(this.scaleMode==='1') s=1; else if(this.scaleMode==='2') s=2; else if(this.scaleMode==='fit') s=clamp(fit,0.4,3);

    this.scale=s;
    this.stage.style.transform='scale('+s.toFixed(3)+') translate('+(tx-guideW/(2*s)).toFixed(1)+'px,'+ty+'px)';
    const dpr=window.devicePixelRatio||1; const eff=(s*dpr);
    $id('scalenote').innerHTML='panel 320×480 · 3.2″ · 180 ppi · shown at '+s.toFixed(2)+'× ('+(Number.isInteger(eff)?'integer, ':'')+eff.toFixed(2)+' device px per pixel)<br>'+(Device.kbdOpen?'keyboard open · landscape':'keyboard closed · portrait');
  }
};

/* ==========================================================================
   MODULE 3 — DEVICE SHELL. The slide, the trackball, six controls, the
   rocker, the camera key, the sensors, and a port that is not a headphone jack.
   ========================================================================== */
const KB_ROWS=[
  [['1','!'],['2','?'],['3','"'],['4',"'"],['5',':'],['6',';'],['7','-'],['8','+'],['9','('],['0',')']],
  [['q','~'],['w','['],['e',']'],['r','{'],['t','}'],['y','<'],['u','>'],['i','='],['o','_'],['p','|']],
  [['a','`'],['s','\\'],['d','*'],['f','/'],['g','&'],['h','#'],['j','%'],['k','$'],['l','^'],['DEL','',1,'fn']],
  [['SHIFT','',2,'fn'],['z',''],['x',''],['c',''],['v',''],['b',''],['n',''],['m',''],[',','<'],['.','>'],['ENTER','',2,'fn']],
  [['ALT','',2,'fn'],['@',''],['SPACE','',5,'fn'],['/','?'],['ALT','',2,'fn']]
];
const Device={
  kbdOpen:false, sliding:false, battery:76, heading:0, pitch:0, roll:0, headphones:false, adapterFound:false,
  shift:false, alt:false, sensorListeners:[],
  init(){
    this.kbdOpen=!!State.get('kbdOpen',false); this.adapterFound=!!State.get('adapterFound',false); this.headphones=!!State.get('headphones',false);
    this.heading=State.get('heading',20); this.pitch=State.get('pitch',0);
    $id('port').classList.toggle('plugged',this.headphones);
    this.buildKeyboard();
    const hs=$id('handset'); if(this.kbdOpen){ hs.classList.add('open'); }
    /* six controls */
    const press=(id,fn,long)=>{ const b=$id(id); let t=null,fired=false; b.addEventListener('pointerdown',e=>{ e.preventDefault(); b.classList.add('down'); fired=false; Sys.activity(); if(long) t=setTimeout(()=>{ fired=true; long(); },700); });
      const up=()=>{ if(!b.classList.contains('down')) return; b.classList.remove('down'); clearTimeout(t); if(!fired) fn(); }; b.addEventListener('pointerup',up); b.addEventListener('pointerleave',()=>{ b.classList.remove('down'); clearTimeout(t); }); };
    press('hkCall',()=>Sys.key('call'));
    press('hkMenu',()=>Sys.key('menu'),()=>Sys.key('menu-long'));
    press('hkEnd',()=>Sys.key('end'),()=>Sys.key('end-long'));
    press('hkHome',()=>Sys.key('home'),()=>Sys.key('home-long'));
    press('hkBack',()=>Sys.key('back'));
    this.trackballSetup();
    $id('volUp').onclick=()=>Sys.volume(1); $id('volDn').onclick=()=>Sys.volume(-1);
    $id('camkey').onclick=()=>Sys.key('camera');
    $id('port').onclick=()=>{ Guide.openTab('easter'); MToast.show('<b>Not a headphone jack.</b> The G1 had a proprietary combined port. Headphones need the adapter that shipped in the box — the box is on the desk.'); };
    $id('btnSlide').onclick=()=>this.slide(!this.kbdOpen);
    $id('btnSlide').textContent=this.kbdOpen?'Slide closed':'Slide open';
    /* real sensors, if this is a phone and the visitor allows it */
    window.addEventListener('deviceorientation',e=>{ if(!this.useRealSensors) return; if(e.alpha!=null) this.setSensors((360-e.alpha)%360, e.beta||0, e.gamma||0); });
  },
  buildKeyboard(){
    const k=$id('kbd'); k.innerHTML='';
    KB_ROWS.forEach(row=>{ const r=el('div','row'); row.forEach(([main,alt,span,cls])=>{ const b=el('div','k'+(cls?' '+cls:'')+(span?' w'+span:'')); b.dataset.k=main; b.dataset.alt=alt||'';
      b.innerHTML=(main==='SPACE'?'':main==='DEL'?'⌫':main==='ENTER'?'↵':main==='SHIFT'?'⇧':esc(main))+(alt?'<span class="alt">'+esc(alt)+'</span>':'');
      b.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); b.classList.add('down'); this.pressKey(main,alt); setTimeout(()=>b.classList.remove('down'),120); });
      r.appendChild(b); }); k.appendChild(r); });
  },
  /* a key on the drawn keyboard, or a key from the visitor's real one */
  pressKey(main,alt){
    if(!this.kbdOpen) return;   /* keys under a closed slide cannot be pressed */
    Sys.activity(); Sound.key();
    if(main==='SHIFT'){ this.shift=!this.shift; this.lightMods(); return; }
    if(main==='ALT'){ this.alt=!this.alt; this.lightMods(); return; }
    let ch=null;
    if(main==='DEL') Input.key('DEL');
    else if(main==='ENTER') Input.key('ENTER');
    else if(main==='SPACE') Input.key(' ');
    else { ch=main; if(this.alt && alt) ch=alt; else if(this.shift) ch=main.toUpperCase(); Input.key(ch); }
    this.shift=false; this.alt=false; this.lightMods();
  },
  lightMods(){ $$('#kbd .k').forEach(b=>{ if(b.dataset.k==='SHIFT') b.classList.toggle('lit',this.shift); if(b.dataset.k==='ALT') b.classList.toggle('lit',this.alt); }); },
  flashKey(ch){ const b=$$('#kbd .k').find(x=>x.dataset.k===ch||x.dataset.alt===ch||x.dataset.k===ch.toLowerCase()); if(b){ b.classList.add('down'); setTimeout(()=>b.classList.remove('down'),110); } },
  /* the slide. open: the face swings out along an arc, then the visitor turns
     the phone; close: turn back, then slide shut. it clicks. */
  slide(open,instant){
    if(this.sliding || open===this.kbdOpen) return;
    this.sliding=true; this.kbdOpen=open; State.set('kbdOpen',open);
    const hs=$id('handset'), face=$id('face');
    $id('btnSlide').textContent=open?'Slide closed':'Slide open';
    Guide.mark(open?'slideopen':'slideclose');
    if(instant){ hs.classList.toggle('open',open); Display.applyActivity(Stack.current()); this.sliding=false; return; }
    if(open){
      face.classList.add('arc'); hs.classList.add('open');
      setTimeout(()=>{ face.classList.remove('arc'); Sound.noise(0.03,0.9,600); Display.applyActivity(Stack.current()); Display.layout(); },420);
      setTimeout(()=>{ this.sliding=false; Registry.broadcast('KEYBOARD_SLIDE',{open:true}); },900);
    } else {
      /* turn back first (unless something forces landscape), then shut */
      Display.applyActivity(Stack.current());
      setTimeout(()=>{ face.classList.add('arcback'); hs.classList.remove('open'); Display.layout(); },380);
      setTimeout(()=>{ face.classList.remove('arcback'); Sound.noise(0.03,0.9,500); this.sliding=false; Registry.broadcast('KEYBOARD_SLIDE',{open:false}); },800);
    }
  },
  /* the trackball: drag to roll, click to select, wheel to scroll */
  trackballSetup(){
    const tb=$id('trackball'), ball=tb.querySelector('.ball'); let down=false, sx=0, sy=0, ax=0, ay=0, moved=false, pid=null;
    const STEP=13;
    tb.addEventListener('pointerdown',e=>{ e.preventDefault(); down=true; moved=false; pid=e.pointerId; sx=e.clientX; sy=e.clientY; ax=ay=0; tb.setPointerCapture(pid); ball.classList.add('glow'); Sys.activity(); });

      while(Math.abs(ax)>=STEP||Math.abs(ay)>=STEP){ if(Math.abs(ax)>=Math.abs(ay)){ this.tb(ax>0?'right':'left'); ax-= Math.sign(ax)*STEP; ay*=0.5; } else { this.tb(ay>0?'down':'up'); ay-=Math.sign(ay)*STEP; ax*=0.5; } moved=true; } });
    const up=e=>{ if(!down) return; down=false; ball.classList.remove('glow'); try{ tb.releasePointerCapture(pid); }catch(x){} if(!moved) this.tb('click'); };
    tb.addEventListener('pointerup',up); tb.addEventListener('pointercancel',up);
    tb.addEventListener('wheel',e=>{ e.preventDefault(); Sys.activity(); const n=Math.min(3,Math.ceil(Math.abs(e.deltaY)/40)); for(let i=0;i<n;i++) this.tb(e.deltaY>0?'down':'up'); },{passive:false});
  },
  tb(dir){ Sound.tock(); Guide.mark('trackball'); Input.trackball(dir); },
  setSensors(h,p,r){ this.heading=((h%360)+360)%360; this.pitch=clamp(p,-90,90); this.roll=clamp(r==null?this.roll:r,-90,90); State.set('heading',this.heading); State.set('pitch',this.pitch); this.sensorListeners.forEach(f=>{ try{ f(this.heading,this.pitch,this.roll); }catch(e){} }); },
  onSensors(f){ this.sensorListeners.push(f); return ()=>{ const i=this.sensorListeners.indexOf(f); if(i>=0) this.sensorListeners.splice(i,1); }; },
  plugHeadphones(){ if(!this.adapterFound){ MToast.show('<b>The plug does not fit.</b> There is no 3.5 mm jack on this phone — only a proprietary combined port. The adapter shipped in the box. Find it.'); Guide.mark('nojack'); return false; }
    this.headphones=!this.headphones; State.set('headphones',this.headphones); $id('port').classList.toggle('plugged',this.headphones); Notif.renderRight(); Registry.broadcast('HEADSET_PLUG',{plugged:this.headphones});
    MToast.show(this.headphones?'<b>Headphones connected</b> — through the adapter. The status bar shows a headset.':'Headphones unplugged.'); return true; },
  findAdapter(){ if(this.adapterFound) return; this.adapterFound=true; State.set('adapterFound',true); Guide.mark('adapter'); MToast.show('<b>Found it:</b> a short ExtUSB-to-3.5 mm adapter, under the manual. Now the headphones can be plugged in — through the dongle.'); Desk.render(); }
};

/* ==========================================================================
   MODULE 9 — INPUT MODEL. Physical keyboard only. Trackball focus traversal.
   Touch without multi-touch. There is no software keyboard to summon.
   ========================================================================== */
const Input={
  focused:null, touchMode:true, context:null, lastHint:0,
  setContext(c){ this.context=c; this.focusEl=null; },
  /* --- EditText --- */
  makeEdit(o){
    o=o||{}; const e=el('div','et'+(o.multiline?'':' one')+(o.cls?' '+o.cls:'')); e.tabIndex=-1;
    const m={el:e,value:o.value||'',caret:(o.value||'').length,hint:o.hint||'',multiline:!!o.multiline,onChange:o.onChange,onEnter:o.onEnter,password:!!o.password,numeric:!!o.numeric,maxLen:o.maxLen||4000};
    e._et=m; m.render=()=>this.renderEdit(m); m.set=v=>{ m.value=v; m.caret=v.length; m.render(); if(m.onChange) m.onChange(v); }; m.focus=()=>this.focusEdit(m); m.render();

      if(!Device.kbdOpen) this.noKeyboardHint(); });
    return e;
  },
  renderEdit(m){
    const e=m.el; const v=m.password? '•'.repeat(m.value.length): m.value; const c=clamp(m.caret,0,v.length);
    if(!v.length) e.innerHTML='<i class="caret"></i><span class="hint">'+esc(m.hint)+'</span>';
    else e.innerHTML=esc(v.slice(0,c))+'<i class="caret"></i>'+esc(v.slice(c));

    const draw=(err)=>{ ctx.clearRect(0,0,240,240); if(Sys.settings.patternVisible||onDone){ ctx.lineWidth=8; ctx.lineCap='round'; ctx.strokeStyle=err?'rgba(220,60,60,.8)':'rgba(120,200,80,.75)'; if(path.length){ ctx.beginPath(); path.forEach((i,k)=>{ const p=pts[i]; k?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }); if(cur&&down) ctx.lineTo(cur.x,cur.y); ctx.stroke(); } }
      pts.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(p.x,p.y,path.includes(i)?14:10,0,7); ctx.fillStyle=path.includes(i)?(err?'#d44':'#8fd56a'):'rgba(255,255,255,.85)'; ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.stroke(); }); };
    const local=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*240,y:(e.clientY-r.top)/r.height*240}; };
    const hit=p=>pts.findIndex(q=>Math.hypot(q.x-p.x,q.y-p.y)<26);
    cv.addEventListener('pointerdown',e=>{ e.preventDefault(); down=true; path=[]; cur=local(e); const h=hit(cur); if(h>=0) path.push(h); cv.setPointerCapture(e.pointerId); draw(); });
    cv.addEventListener('pointermove',e=>{ if(!down) return; cur=local(e); const h=hit(cur); if(h>=0 && !path.includes(h)){ path.push(h); Sound.tock(); } draw(); });
    cv.addEventListener('pointerup',e=>{ if(!down) return; down=false; if(onDone){ onDone(path.slice(), ()=>{ path=[]; draw(); }); draw(); return; }
      if(path.length && expect && path.join(',')===expect.join(',')){ draw(); setTimeout(()=>this.hide(),150); } else { draw(true); const m=this.el.querySelector('.msg'); if(m) m.textContent=path.length<4?'Connect at least 4 dots. Try again.':'Try again'; setTimeout(()=>{ path=[]; draw(); },900); } });
    draw();
  }
};

/* ==========================================================================
   CONTENT PROVIDERS — shared data that applications reach through the system,
   never through each other. Observers, exactly as the real ContentResolver.
   ========================================================================== */
const Content={
  data:null, obs:{},
  init(){ this.data=State.get('content',null)||this.empty(); for(const k in this.empty()) if(!this.data[k]) this.data[k]=[]; },
  empty(){ return {contacts:[],events:[],mails:[],threads:[],images:[],audio:[],bookmarks:[],history:[],calls:[],talk:[],alarms:[],downloads:[]}; },
  save(){ State.set('content',this.data); },
  query(name,fn){ const a=(this.data[name]||[]).filter(x=>!x.deleted); return fn? a.filter(fn): a; },
  all(name){ return this.data[name]||[]; },
  get(name,id){ return (this.data[name]||[]).find(x=>x.id===id&&!x.deleted); },
  insert(name,obj,quiet){ obj.id=obj.id||uid(name); obj.mtime=Date.now(); if(!('created' in obj)) obj.created=Date.now(); this.data[name].push(obj); this.save(); if(!quiet) this.notify(name); return obj; },
  update(name,id,patch,quiet){ const o=(this.data[name]||[]).find(x=>x.id===id); if(!o) return null; Object.assign(o,patch); o.mtime=Date.now(); this.save(); if(!quiet) this.notify(name); return o; },
  remove(name,id){ const a=this.data[name]||[]; const i=a.findIndex(x=>x.id===id); if(i<0) return; if(Sync.synced.includes(name)){ a[i].deleted=true; a[i].mtime=Date.now(); } else a.splice(i,1); this.save(); this.notify(name); },
  replaceAll(name,arr){ this.data[name]=arr; this.save(); this.notify(name); },
  notify(name){ (this.obs[name]||[]).slice().forEach(o=>{ try{ o.cb(); }catch(e){ console.error(e); } }); Registry.broadcast('CONTENT_CHANGED',{name}); },
  observe(name,cb,owner){ (this.obs[name]=this.obs[name]||[]).push({cb,owner}); },
  unobserve(name,cb){ const a=this.obs[name]; if(!a) return; const i=a.findIndex(o=>o.cb===cb); if(i>=0) a.splice(i,1); },
  /* wipe for a factory data reset */
  wipe(){ this.data=this.empty(); this.save(); }
};

const Media={

      ctx.fillStyle='#f6d090'; ctx.beginPath(); ctx.arc(w*.7,h*.5,h*.07,0,7); ctx.fill();
      ctx.fillStyle='#0d1018'; ctx.fillRect(w*.25,h*.5,w*.5,h*.12); ctx.fillRect(w*.35,h*.42,w*.3,h*.09); ctx.fillRect(w*.55,h*.36,w*.05,h*.07);
      ctx.fillStyle='#ffe9a0'; for(let i=0;i<9;i++) ctx.fillRect(w*(.37+i*.03),h*.45,w*.012,h*.02);
      ctx.strokeStyle='rgba(255,200,120,.35)'; for(let i=0;i<30;i++){ const y=h*.64+r()*h*.34; ctx.beginPath(); ctx.moveTo(w*.3+r()*w*.4,y); ctx.lineTo(w*.3+r()*w*.4,y); ctx.stroke(); } }
    else if(scene==='receipt'){ ctx.fillStyle='#6b4a2e'; ctx.fillRect(0,0,w,h); ctx.strokeStyle='rgba(0,0,0,.18)'; for(let i=0;i<20;i++){ ctx.beginPath(); ctx.moveTo(0,i*h/20+r()*6); ctx.lineTo(w,i*h/20+r()*6); ctx.stroke(); }
      ctx.translate(w/2,h/2); ctx.rotate(-0.08); ctx.fillStyle='#f6f4ea'; ctx.fillRect(-w*.3,-h*.42,w*.6,h*.84); ctx.fillStyle='#777'; for(let i=0;i<16;i++){ ctx.fillRect(-w*.26,-h*.36+i*h*.045,w*(.15+r()*.3),h*.012); } ctx.fillStyle='#333'; ctx.fillRect(-w*.26,-h*.36+16*h*.045,w*.42,h*.02); }

/* ==========================================================================
   MODULE 8 — SYNC ENGINE. An account, and a web side it reconciles with,
   continuously, over the air. There is no sync button anywhere.
   ========================================================================== */
const Sync={
  account:null, web:null, syncing:false, synced:['mails','contacts','events'], _t:null, initial:false, lastSync:0,
  init(){ this.account=State.get('account',null); this.web=State.get('web',null)||Seed.web(); if(!State.get('web',null)) this.save(); },
  save(){ State.set('web',this.web); },
  signIn(user,onProgress,onDone){
    this.account={user:user.includes('@')?user:user+'@gmail.example', since:Date.now()}; State.set('account',this.account);
    this.initial=true; const steps=['contacts','events','mails']; let i=0;
    const next=()=>{ if(i>=steps.length){ this.initial=false; this.lastSync=Date.now(); this.start(); Scheduler.start(true); onDone&&onDone(); Registry.broadcast('ACCOUNT_ADDED',{}); return; } const name=steps[i++]; onProgress&&onProgress(name,i,steps.length); this.pulse(); this.reconcile(name,true); setTimeout(next,rnd(900,2000)); };
    setTimeout(next,600);
  },
  signOut(){ this.account=null; State.set('account',null); this.stop(); },
  start(){ this.stop(); this._t=setInterval(()=>this.tick(),4500); },
  stop(){ clearInterval(this._t); this._t=null; },
  enabled(name){ const s=Sys.settings; if(!this.account||!s.autoSync||s.airplane) return false; if(name==='mails') return s.syncGmail; if(name==='events') return s.syncCalendar; if(name==='contacts') return s.syncContacts; return true; },
  tick(){ let changed=false; for(const n of this.synced){ if(this.enabled(n)) changed=this.reconcile(n,false)||changed; } if(changed){ this.pulse(); this.lastSync=Date.now(); } },
  pulse(){ this.syncing=true; Notif.renderRight(); WebSide.syncState(true); clearTimeout(this._p); this._p=setTimeout(()=>{ this.syncing=false; Notif.renderRight(); WebSide.syncState(false); },1600); },
  /* last writer wins, by modification time, in both directions */
  reconcile(name,initial){
    const dev=Content.all(name), web=this.web[name]; let changed=false; const newOnDevice=[];
    for(const w of web){ const d=dev.find(x=>x.id===w.id);
      if(!d){ dev.push(JSON.parse(JSON.stringify(w))); changed=true; if(!initial && !w.deleted) newOnDevice.push(w); }
      else if((w.mtime||0)>(d.mtime||0)){ Object.assign(d,JSON.parse(JSON.stringify(w))); changed=true; }
      else if((d.mtime||0)>(w.mtime||0)){ Object.assign(w,JSON.parse(JSON.stringify(d))); this.save(); changed=true; WebSide.dirty=true; } }
    for(const d of dev){ if(!web.find(x=>x.id===d.id)){ web.push(JSON.parse(JSON.stringify(d))); this.save(); changed=true; WebSide.dirty=true; } }
    if(changed){ Content.save(); Content.notify(name); WebSide.render(); }
    if(newOnDevice.length) Registry.broadcast('SYNC_NEW_'+name.toUpperCase(),{items:newOnDevice});
    return changed;
  },
  /* the web side edits — from the desk window */
  webInsert(name,obj){ obj.id=obj.id||uid(name); obj.mtime=Date.now(); obj.created=obj.created||Date.now(); this.web[name].push(obj); this.save(); WebSide.render(); return obj; },
  webUpdate(name,id,patch){ const o=this.web[name].find(x=>x.id===id); if(!o) return; Object.assign(o,patch); o.mtime=Date.now(); this.save(); WebSide.render(); },
  webRemove(name,id){ this.webUpdate(name,id,{deleted:true}); }
};

      {id:'m_bea1',conv:'cv_lunch',from:'Bea Halloran',fromEmail:'bea.h@example.org',subject:'Sunday lunch?',body:'Hello love,\n\nSunday at one? Your brother is bringing the baby. Bring the phone, I want to see this keyboard thing.\n\nMum x\n\nP.S. call me, 555-0107',when:A(9),read:true},
      {id:'m_tomasz1',conv:'cv_adapter',from:'Tomasz Wiśniewski',fromEmail:'tomasz@example.org',subject:'Re: adapter',body:'> Where did you put the headphone adapter?\n\nIn the box, under the manual, wrapped in the little bag it came in. Don\'t lose it — they are twenty dollars and nobody stocks them. Honestly, a phone with no headphone jack. In 2008.\n\nT.',when:A(20),read:true},
      {id:'m_transit',conv:'cv_transit',from:'Port Ellery Transit',fromEmail:'info@transit.example',subject:'Autumn timetable changes — Lines 4 and 7',body:'From next Monday, Line 4 runs every 12 minutes at peak and Line 7 terminates at Central Station after 22:00.\n\nThe full timetable: http://transit.example/timetable\n\nPort Ellery Transit',when:A(30),read:true},
      {id:'m_lena1',conv:'cv_lake',from:'Lena Voss',fromEmail:'lena.voss@example.org',subject:'Photos from the lake',body:'Here is the good one from Saturday. The light was ridiculous.\n\nL.',when:A(46),read:true,attachments:[{imageId:'img_lake',name:'lake_oct.jpg',kb:412}]},
      {id:'m_rafael1',conv:'cv_gallery',from:'Rafael Ortiz',fromEmail:'r.ortiz@example.org',subject:'Opening tonight — 7pm',body:'Gallery Nine, 9 Pier Walk. Doors at seven, wine at seven-oh-one.\n\nMap: http://maps.example/?q=Gallery+Nine\n\nR.',when:A(1.8),read:false},
      {id:'m_kenji1',conv:'cv_trackball',from:'Kenji Sato',fromEmail:'kenji.sato@example.org',subject:'the trackball',body:'ok I was wrong about the trackball. two days in and I place the cursor with it without thinking. touching the screen to move a cursor by one character is hopeless; rolling the ball one click is exact.\n\nthe keyboard I am still deciding about. everyone slides it open halfway through a sentence.\n\nk',when:A(60),read:true},
      {id:'m_feld',conv:'cv_dentist',from:'Feld Dental',fromEmail:'reception@feld-dental.example',subject:'Appointment reminder',body:'This is a reminder of your appointment with Dr Feld tomorrow at 10:00. Please arrive ten minutes early.\n\n220 Harbor Road. Call 555-0160 to reschedule.',when:A(14),read:true},
      {id:'m_spam',conv:'cv_spam',from:'RingtoneWorld',fromEmail:'offers@ringtoneworld.example',subject:'EXCLUSIVE: 500 polyphonic ringtones for your new handset!!',body:'Congratulations on your new mobile device! Click here to download 500 polyphonic ringtones. Only $9.99/week.',when:A(70),read:false},
      {id:'m_owen1',conv:'cv_draft',from:'Owen Park',fromEmail:'owen.park@example.org',subject:'Draft of the review — comments by Friday?',body:'Attached below in the body because the desk can\'t open attachments on this thing yet.\n\n---\nTHE PHONE THAT ISN\'T PRETTY\n\nIt is thicker than the other one. It is heavier. It is, to be blunt, uglier, and the software looks as if it was assembled rather than designed: the icons don\'t agree with each other about what an icon is, and the spacing has moods.\n\nAnd yet. The pull-down shade with your messages sitting in it patiently. The way one Back key walks you out of a link in a message, through the browser, back to the message. Sign in and your mail and calendar simply arrive. None of these are things you notice in a shop. All of them are things you notice on a Tuesday.\n\nMy suspicion is that we are reviewing the wrong thing. We are reviewing a phone. This is a platform with a phone attached.\n---\n\nO.',when:A(50),read:true},
      {id:'m_marcus2',conv:'cv_review',from:'Marcus Bell',fromEmail:'marcus.bell@example.org',subject:'Re: That article about your new phone',body:'Also the shop had exactly one of these and about forty of the other one. Make of that what you will.',when:A(2.9),read:false}
    ].map(m=>Object.assign({to:'me',starred:false,labels:['Inbox'],archived:false,mtime:m.when,created:m.when},m));
    mails.find(m=>m.id==='m_lena1').starred=true;
    const events=[
      {id:'e_dentist',title:'Dentist — Dr Feld',start:AT(1,10,0),end:AT(1,10,45),where:'220 Harbor Road',desc:'Arrive ten minutes early.',reminderMin:60},
      {id:'e_gallery',title:'Gallery Nine opening',start:AT(0,19,0),end:AT(0,21,30),where:'9 Pier Walk',desc:'Rafael\'s show. Wine at 7:01.',reminderMin:30},
      {id:'e_lunch',title:'Sunday lunch at Mum\'s',start:(()=>{ const d=new Date(); const off=(7-d.getDay())%7||7; return AT(off,13,0); })(),end:(()=>{ const d=new Date(); const off=(7-d.getDay())%7||7; return AT(off,15,30); })(),where:'3 Larch Avenue',desc:'Bring the phone.',reminderMin:120},
      {id:'e_coffee',title:'Coffee with Marcus',start:AT(2,9,30),end:AT(2,10,15),where:'Harbor Cafe',desc:'',reminderMin:15},
      {id:'e_bike',title:'Collect bike from Sunny\'s',start:AT(3,17,30),end:AT(3,18,0),where:'41 Mill Street',desc:'',reminderMin:null},
      {id:'e_ferry',title:'Ferry to the island — day trip',start:AT(5,0,0),end:AT(6,0,0),allDay:true,where:'Pier 2',desc:'',reminderMin:null},
      {id:'e_ghost',title:'Back up the photos before selling this phone',start:new Date(2008,9,22,9,0).getTime(),end:new Date(2008,9,22,9,30).getTime(),where:'',desc:'Also: adapter is in the box.',reminderMin:10,ghost:true,reminded:false}
    ].map(e=>Object.assign({allDay:false,mtime:A(100),created:A(3000)},e));
    return {mails,contacts,events};

   MODULE 7 — APPLICATION FRAMEWORK: shared view helpers, then the applications.
   Rule of the build: an application module may use the framework (Activity,
   Intents, Notif, Content, Dialog, Menu, UI, ICON, Sound, Storage, Sys) and
   nothing that belongs to another application. Not even its name.
   ========================================================================== */
const UI={
  list(parent){ const sc=el('div','scroll'); const inner=el('div','inner lv'); sc.appendChild(inner); parent.appendChild(sc); Scroll.attach(sc); return inner; },
  item(o){ const li=el('div','li f'+(o.cls?' '+o.cls:'')); li.innerHTML=(o.icon?'<div class="ic'+(o.small?' sm':'')+'">'+o.icon+'</div>':'')+'<div class="tx"><span class="t1">'+esc(o.title)+'</span>'+(o.sub!=null?'<span class="t2">'+(o.subHtml?o.sub:esc(o.sub))+'</span>':'')+'</div>'+(o.right!=null?'<span class="rt">'+esc(o.right)+'</span>':'')+(o.check!=null?'<div class="chk'+(o.check?' on':'')+'"></div>':''); if(o.onClick) li.onclick=e=>{ if(li.closest('.scroll')&&li.closest('.scroll')._scrolling) return; o.onClick(e); }; if(o.onLong) UI.longPress(li,o.onLong); return li; },
  pref(o){ const p=el('div','pref f'+(o.off?' off':'')); p.innerHTML='<div class="tx"><div class="t1">'+esc(o.title)+'</div>'+(o.sub!=null?'<div class="t2">'+esc(o.sub)+'</div>':'')+'</div>'+(o.check!=null?'<div class="chk'+(o.check?' on':'')+'"></div>':'')+(o.radio!=null?'<div class="rad'+(o.radio?' on':'')+'"></div>':''); if(o.onClick) p.onclick=()=>{ if(p.closest('.scroll')&&p.closest('.scroll')._scrolling) return; o.onClick(); }; return p; },
  sect(text,blue){ return el('div','sect'+(blue?' blue':''),esc(text)); },
  button(label,onClick,cls){ const b=el('button','abtn f'+(cls?' '+cls:'')); b.textContent=label; b.onclick=onClick; return b; },
  empty(text){ return el('div','empty',esc(text)); },
  longPress(elm,fn,ms){ let t=null,moved=false,sx=0,sy=0; elm.addEventListener('pointerdown',e=>{ moved=false; sx=e.clientX; sy=e.clientY; t=setTimeout(()=>{ t=null; elm._longFired=true; fn(e); setTimeout(()=>elm._longFired=false,300); },ms||550); }); elm.addEventListener('pointermove',e=>{ if(Math.hypot(e.clientX-sx,e.clientY-sy)>8&&t){ clearTimeout(t); t=null; } }); const c=()=>{ if(t){ clearTimeout(t); t=null; } }; elm.addEventListener('pointerup',c); elm.addEventListener('pointerleave',c); elm.addEventListener('click',e=>{ if(elm._longFired){ e.stopPropagation(); e.preventDefault(); } },true); },
  tabs(parent,tabs,cur,onChange){ const t=el('div','tabs'); tabs.forEach((tb,i)=>{ const d=el('div','tab f'+(i===cur?' on':'')); d.innerHTML=(tb.icon||'')+'<span>'+esc(tb.label)+'</span>'; d.onclick=()=>{ t.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); d.classList.add('on'); onChange(i); }; t.appendChild(d); }); parent.appendChild(t); return t; },
  avatar(name){ const h=hashStr(name||'?')%360; return '<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="4" fill="hsl('+h+',35%,55%)"/><circle cx="24" cy="18" r="8" fill="rgba(255,255,255,.85)"/><path d="M8 44c2-12 30-12 32 0z" fill="rgba(255,255,255,.85)"/></svg>'; },
  stars(n){ let s=''; for(let i=1;i<=5;i++) s+= n>=i?'★': n>=i-0.5?'⯨':'☆'; return s; }
};

        [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']].forEach(([k,l])=>{ const bb=el('b','f',esc(k)+(l?'<i>'+l+'</i>':'')); bb.onclick=()=>this.press(k); pad.appendChild(bb); });

/* ---------- Calculator: a basic panel, and the advanced panel a swipe to the left ---------- */
(function(){
  const PKG='org.museum.calc';
  function evaluate(expr){ const s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'PI').replace(/√/g,'sqrt'); const toks=s.match(/\d+\.?\d*|[a-z]+|PI|[()+\-*\/^!]/gi); if(!toks) return ''; const out=[],ops=[]; const prec={'+':1,'-':1,'*':2,'/':2,'^':3,'!':4,'u-':4}; const fn={sin:x=>Math.sin(x*Math.PI/180),cos:x=>Math.cos(x*Math.PI/180),tan:x=>Math.tan(x*Math.PI/180),ln:Math.log,log:Math.log10,sqrt:Math.sqrt};
    let prev=null; toks.forEach(t=>{ if(/^\d/.test(t)) out.push(parseFloat(t)); else if(t==='PI') out.push(Math.PI); else if(t==='e') out.push(Math.E); else if(fn[t]) ops.push(t); else if(t==='('){ ops.push(t); } else if(t===')'){ while(ops.length&&ops[ops.length-1]!=='(') out.push(ops.pop()); ops.pop(); if(ops.length&&fn[ops[ops.length-1]]) out.push(ops.pop()); } else { let op=t; if(t==='-'&&(prev===null||/[(+\-*\/^]/.test(prev))) op='u-'; while(ops.length&&ops[ops.length-1]!=='('&&!fn[ops[ops.length-1]]&&(prec[ops[ops.length-1]]>prec[op]||(prec[ops[ops.length-1]]===prec[op]&&op!=='^'&&op!=='u-'))) out.push(ops.pop()); ops.push(op); } prev=t; });
    while(ops.length) out.push(ops.pop());
    const st=[]; for(const t of out){ if(typeof t==='number') st.push(t); else if(fn[t]) st.push(fn[t](st.pop())); else if(t==='u-') st.push(-st.pop()); else if(t==='!'){ const n=st.pop(); let f=1; for(let i=2;i<=n;i++) f*=i; st.push(f); } else { const b=st.pop(), a=st.pop(); st.push(t==='+'?a+b:t==='-'?a-b:t==='*'?a*b:t==='/'?a/b:Math.pow(a,b)); } }
    const r=st.pop(); if(r==null||!isFinite(r)) return 'Error'; return String(Math.round(r*1e10)/1e10); }
  class Calc extends Activity{
    onCreate(){ this.comp.noTitle=true; this.root.classList.add('dark'); this.expr=this.state.expr||''; this.hist=[]; const c=el('div','calc'); this.root.appendChild(c); c.innerHTML='<div class="disp"></div><div class="pads"><div class="pad basic"></div><div class="pad adv"></div></div>'; this.c=c; this.disp=c.querySelector('.disp');
      const basic=['7','8','9','÷','4','5','6','×','1','2','3','−','.','0','=','+']; const bp=c.querySelector('.pad.basic'); basic.forEach(k=>{ const b=el('b','f'+(k==='='?' eq':/[÷×−+]/.test(k)?' op':''),k); b.onclick=()=>this.key(k); bp.appendChild(b); }); const clr=el('b','f op','CLEAR'); clr.style.gridColumn='span 4'; clr.onclick=()=>this.key('CLEAR'); UI.longPress(clr,()=>{ this.expr=''; this.show(); }); bp.insertBefore(clr,bp.firstChild);
      const adv=['sin','cos','tan','ln','log','!','π','e','^','(',')','√']; const ap=c.querySelector('.pad.adv'); adv.forEach(k=>{ const b=el('b','f op',k); b.onclick=()=>this.key(k); ap.appendChild(b); });
      let sx=0; c.querySelector('.pads').addEventListener('pointerdown',e=>{ sx=Display.toLogical(e).x; }); c.querySelector('.pads').addEventListener('pointerup',e=>{ const dx=Display.toLogical(e).x-sx; if(dx<-50) c.classList.add('advanced'); else if(dx>50) c.classList.remove('advanced'); });
      this.show(); }
    onSaveState(){ return {expr:this.expr}; }
    key(k){ Sys.activity(); if(k==='CLEAR'){ this.expr=this.expr.slice(0,-1); } else if(k==='='){ if(this.expr){ const r=evaluate(this.expr); this.hist.push(this.expr+' = '+r); this.expr=r==='Error'?'':r; if(r==='Error') AToast.show('Error'); } } else { if(/^[a-z√]+$/.test(k)&&k!=='e') this.expr+=k+'('; else this.expr+=k; } this.show(); Guide.mark('calc'); }
    show(){ this.disp.textContent=this.expr||'0'; this.disp.style.fontSize=this.expr.length>12?'24px':'38px'; }
    onKey(k){ const map={'*':'×','/':'÷','-':'−','ENTER':'=','DEL':'CLEAR'}; if(/^[0-9.+()^!]$/.test(k)) this.key(k); else if(map[k]) this.key(map[k]); else return false; return true; }
    onMenu(){ return [{label:this.c.classList.contains('advanced')?'Basic panel':'Advanced panel',icon:ICON.m.switch,onClick:()=>this.c.classList.toggle('advanced')},{label:'Clear history',icon:ICON.m.clear,onClick:()=>{ this.hist=[]; AToast.show('History cleared'); }},{label:'History',icon:ICON.m.agenda,onClick:()=>Dialog.alert('History',this.hist.join('\n')||'Nothing yet.')}]; }
  }
  Registry.register({pkg:PKG,label:'Calculator',icon:ICON.app.calculator,system:true,sizeKB:200,perms:[],activities:[{name:'Calc',create:Calc,launcher:true,noTitle:true,dark:true,filters:[{action:['MAIN'],category:['LAUNCHER']}]}]});
})();

      B.innerHTML='<p>The magnetometer and the accelerometer. Turn the handset with the dial; tilt it with the sliders. Street View\'s compass mode and the Bubble Level read these.</p><div class="sens"><svg viewBox="0 0 120 120" id="cmpDial"><circle cx="60" cy="60" r="56" fill="#1a1f27" stroke="#3a4250" stroke-width="2"/><g fill="#9aa3ad" font-size="10" font-family="monospace" text-anchor="middle"><text x="60" y="16">N</text><text x="108" y="64">E</text><text x="60" y="112">S</text><text x="12" y="64">W</text></g><g id="cmpNeedle" transform="rotate('+Device.heading+' 60 60)"><path d="M60 14L66 60H54z" fill="#ffa733"/><path d="M60 106L54 60h12z" fill="#6a7280"/></g><circle cx="60" cy="60" r="4" fill="#e9ecef"/></svg><div class="sl"><label>Heading: <span id="hdgVal">'+Math.round(Device.heading)+'</span>°</label><input type="range" id="hdgRange" min="0" max="359" value="'+Math.round(Device.heading)+'"><label>Pitch (tilt forward/back): <span id="pitchVal">'+Math.round(Device.pitch)+'</span>°</label><input type="range" id="pitchRange" min="-60" max="60" value="'+Math.round(Device.pitch)+'"><label>Roll (tilt left/right): <span id="rollVal">'+Math.round(Device.roll)+'</span>°</label><input type="range" id="rollRange" min="-60" max="60" value="'+Math.round(Device.roll)+'"></div></div><p style="margin-top:8px"><span class="mus-act" id="realSens">Use this device\'s own sensors</span> <span style="font-size:12px;color:var(--mus-dim)">(on a phone or tablet)</span></p>';
      const upd=()=>{ $id('cmpNeedle').setAttribute('transform','rotate('+Device.heading+' 60 60)'); $id('hdgVal').textContent=Math.round(Device.heading); $id('pitchVal').textContent=Math.round(Device.pitch); $id('rollVal').textContent=Math.round(Device.roll); $id('hdgRange').value=Math.round(Device.heading); $id('pitchRange').value=Math.round(Device.pitch); $id('rollRange').value=Math.round(Device.roll); };
      $id('hdgRange').oninput=e=>{ Device.useRealSensors=false; Device.setSensors(+e.target.value,Device.pitch,Device.roll); upd(); }; $id('pitchRange').oninput=e=>{ Device.useRealSensors=false; Device.setSensors(Device.heading,+e.target.value,Device.roll); upd(); }; $id('rollRange').oninput=e=>{ Device.useRealSensors=false; Device.setSensors(Device.heading,Device.pitch,+e.target.value); upd(); };
      const dial=$id('cmpDial'); let dragging=false; const ang=e=>{ const r=dial.getBoundingClientRect(); const x=e.clientX-(r.left+r.width/2), y=e.clientY-(r.top+r.height/2); return ((Math.atan2(x,-y)*180/Math.PI)+360)%360; }; dial.addEventListener('pointerdown',e=>{ dragging=true; dial.setPointerCapture(e.pointerId); Device.useRealSensors=false; Device.setSensors(ang(e),Device.pitch,Device.roll); upd(); }); dial.addEventListener('pointermove',e=>{ if(dragging){ Device.setSensors(ang(e),Device.pitch,Device.roll); upd(); } }); dial.addEventListener('pointerup',()=>dragging=false);
      $id('realSens').onclick=()=>{ const go=()=>{ Device.useRealSensors=true; MToast.show('Listening to this device\'s orientation sensors. Turn it, and the exhibit\'s handset turns with it.'); }; if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function') DeviceOrientationEvent.requestPermission().then(s=>{ if(s==='granted') go(); else MToast.show('Permission not granted; use the dial.'); }).catch(()=>MToast.show('Not available here; use the dial.')); else if(window.DeviceOrientationEvent) go(); else MToast.show('No orientation sensors on this machine. The dial will do.'); };
      if(this._sensUnsub) this._sensUnsub(); this._sensUnsub=Device.onSensors(()=>{ if($id('cmpNeedle')) upd(); });
    } else {
      const inst=Installer.isInstalled('mk.postcard');
      B.innerHTML='<p>A second memory card, loose in the box, with a single file on it: <b>Postcard.apk</b> — an application package, not from the Market.</p><p style="font-size:12px;color:var(--mus-dim)">Installing it requires <b>Unknown sources</b> in Settings → Applications, and the phone will say so. Once installed, it appears in the share chooser for pictures — and nothing else on the phone was told.</p>';
      const d=el('div','obj'); d.innerHTML='<svg viewBox="0 0 48 48"><path d="M16 8h14l6 6v26H16z" fill="#7a2a2a" stroke="#311"/><rect x="20" y="30" width="10" height="6" fill="#ccc"/></svg><div class="t"><b>Postcard.apk</b><span>'+(inst?'Installed. Open Pictures, pick one, Menu → Share.':'920 KB · tap to install')+'</span></div>'; d.onclick=()=>{ if(inst){ MToast.show('Already installed. Share a picture and count the entries in the chooser.'); return; } Intents.start({action:'INSTALL_PACKAGE',data:'file:///sdcard/mk.postcard.apk'}); }; B.appendChild(d);
    }
  }
};

/* ==========================================================================
