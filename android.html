<title>Android 1.0 on the T-Mobile G1 (2008) — The OS Museum</title>
<meta name="description" content="A single-file, in-browser homage to Android 1.0 as it shipped on the HTC Dream / T-Mobile G1 in October 2008: a slide-out keyboard because there is no on-screen one, a trackball, a notification shade, intents and a cross-application Back stack, over-the-air sync, home screen widgets and a nearly empty Market. Built for The OS Museum.">

/* ==========================================================================
   Android 1.0 — the operating system that shipped on the HTC Dream, sold in
   the United States as the T-Mobile G1 from 22 October 2008. A single-file
   exhibit for The OS Museum.
   --------------------------------------------------------------------------
   THE HARDWARE CHOICE. The most common device running Android 1.0 was also
   the only device running Android 1.0. The G1 was the entire installed base
   until 1.5 "Cupcake" reached a second handset in April 2009.

   THE THESIS. The phone that lost the demo and won the market. Side by side
   with the iPhone in late 2008 there was no contest: heavier, thicker, slower,
   uglier, inconsistent, a few dozen free applications. And nearly every
   architectural bet inside it — a notification shade, intents, a system-wide
   Back stack, background services, sync with no cable, widgets, open
   licensing — either won outright or was later adopted by its competitor.
   So the two foundations are built first, in this order: MODULE 1 is the
   intent registry and activity stack, MODULE 2 is the notification service.
   No application module here references another by name; if two of them
   need to talk, they go through the registry, exactly as the real system
   requires. A structural test at the bottom of the file checks it.

   ARTWORK. All original, drawn in code. No Google application icons, no
   Android robot, no Google, HTC or T-Mobile marks, no HTC industrial design.
   The handset shell is drawn from scratch in the same idiom — a slab, a
   slide, a trackball, a forward-angled chin — and a neutral placeholder sits
   wherever a logo would. Android 1.0 used the Droid typeface family; it is
   not fetched. The stack starts with Droid Sans if the machine has it and
   falls through humanist sans faces of similar proportion.

   THE PERIOD VOCABULARY IS DELIBERATE. Android Market, not Google Play.
   Browser, not Chrome. Activities, intents, widgets, the notification shade,
   the app drawer, the trackball, the options menu.
   ========================================================================== */

:root{
  --mus-bg:#0b0d10; --mus-panel:#15181d; --mus-edge:#262b33;
  --mus-fg:#e9ecef; --mus-dim:#9aa3ad; --mus-faint:#5c6570;
  --mus-accent:#ffa733;                 /* the Mobile wing, warmed to the 1.0 focus orange */
  --mus-accent2:#9ccc65;
  --mus-warn:#ff8f8f;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  /* Droid Sans was the system typeface; resolve it locally, fetch nothing.
     Open Sans and Noto Sans are by the same designer and share its bones. */
  --droid:"Droid Sans","Open Sans","Noto Sans","Segoe UI","Trebuchet MS","DejaVu Sans",Verdana,sans-serif;
  --droidmono:"Droid Sans Mono","Noto Sans Mono","DejaVu Sans Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#07080a;
  background-image:
    radial-gradient(ellipse 70% 55% at 50% -10%, rgba(255,160,60,.07), transparent 70%),
    radial-gradient(ellipse 90% 60% at 50% 120%, rgba(18,20,26,.9), transparent 70%);
  color:var(--mus-fg); font-family:var(--sans);
  user-select:none;-webkit-user-select:none; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
button{font-family:inherit}

/* ================= museum rail (not part of the phone) ================= */
#musrail{
  position:fixed;left:0;right:0;top:0;height:34px;z-index:600;
  display:flex;align-items:center;gap:6px;padding:0 10px;
  background:linear-gradient(#181b21,#0e1014);
  border-bottom:1px solid var(--mus-edge);
  font:12px var(--mono);
}
#musrail .brand{color:var(--mus-faint);letter-spacing:.14em;text-transform:uppercase;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#musrail .brand b{color:var(--mus-dim);font-weight:600}
#musrail .spacer{flex:1}
.mbtn{
  background:#1b1f27;border:1px solid var(--mus-edge);color:var(--mus-dim);
  border-radius:4px;font:600 11px var(--mono);padding:5px 9px;cursor:pointer;
  text-decoration:none;white-space:nowrap;
}
.mbtn:hover{color:var(--mus-fg);border-color:var(--mus-accent)}
.mbtn.on{background:var(--mus-accent);border-color:var(--mus-accent);color:#2a1600;font-weight:700}
.mbtn.warn:hover{border-color:#ff8f8f;color:#ffd7d7}
@media (max-width:1100px){ #musrail .hideable{display:none} }

/* ================= the room ================= */
#room{position:fixed;inset:34px 0 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#room::before{content:"";position:fixed;left:0;right:0;bottom:0;height:140px;z-index:0;
  background:linear-gradient(180deg, transparent, rgba(22,20,18,.55) 55%, rgba(12,12,14,.9));pointer-events:none}
#stage{position:relative;z-index:1;transform:scale(var(--s,1));transform-origin:center center;transition:transform .25s ease}

/* ================= the handset =================
   Drawn in logical pixels; the whole stage is scaled uniformly. Everything is
   built in the portrait frame. Opening the keyboard slides the FACE to the
   right in that frame, and the visitor then turns the phone: the HANDSET
   wrapper rotates -90°, and the LCD counter-rotates so the content is upright.
   Both rotations are multiples of 90°, so pointer maths stays axis-aligned. */
#handset{
  position:relative;
  width:569px;height:669px;         /* footprint incl. slide travel + body thickness */
  transform:rotate(0deg);
  transition:transform .48s cubic-bezier(.4,.05,.2,1);
}
#handset.land{transform:rotate(-90deg)}
/* the lower body: keyboard, camera key, thickness */
#base{
  position:absolute;left:5px;top:5px;width:368px;height:664px;border-radius:26px 26px 30px 30px;
  background:linear-gradient(180deg,#2f2f31,#1b1b1d 60%,#141416);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 18px 40px rgba(0,0,0,.6);
}
#base .plate{position:absolute;left:0;top:46px;width:200px;height:480px;
  background:linear-gradient(90deg,#1a1a1c,#232326 40%,#1c1c1e);
  border-right:1px solid rgba(255,255,255,.05)}
/* keyboard, laid out in its natural landscape frame and rotated into the body */
#kbdwrap{position:absolute;left:0;top:46px;width:200px;height:480px;overflow:visible}
#kbd{position:absolute;left:-140px;top:142px;width:480px;height:196px;transform:rotate(90deg);
  padding:8px 10px 6px;display:grid;grid-template-rows:repeat(5,1fr);gap:4px}
#kbd .row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
#kbd .k{
  position:relative;border-radius:5px;border:1px solid #111;cursor:pointer;
  background:linear-gradient(#5a5b60,#3c3d42 55%,#2f3034);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 2px 1px rgba(0,0,0,.6);
  color:#e9e9ec;font:600 13px/1 var(--droid);display:flex;align-items:center;justify-content:center;
  text-transform:uppercase;
}
#kbd .k .alt{position:absolute;right:3px;top:2px;font:600 8px/1 var(--droid);color:#f0b350;text-transform:none}
#kbd .k.fn{background:linear-gradient(#3f4045,#2a2b2f);font-size:10px;color:#cfd2d6;letter-spacing:.04em}
#kbd .k.w2{grid-column:span 2}#kbd .k.w3{grid-column:span 3}#kbd .k.w5{grid-column:span 5}
#kbd .k.down,#kbd .k:active{background:linear-gradient(#ffb04a,#e07d00);color:#2a1600;box-shadow:none}
#kbd .k.lit{box-shadow:0 0 0 1px #f0b350, 0 0 6px #f0b350}
/* the front: bezel, glass, six controls, angled chin */
#face{
  position:absolute;left:0;top:0;width:368px;height:664px;border-radius:24px 24px 28px 28px;
  background:linear-gradient(165deg,#3a3a3e,#232326 40%,#1c1c1f 70%,#26262a);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.6), 6px 8px 26px rgba(0,0,0,.55);
  transform:translateX(0);
  transition:transform .42s cubic-bezier(.3,.9,.3,1.02);
}
#handset.open #face{transform:translateX(196px)}
#face.arc{animation:arc .42s cubic-bezier(.3,.9,.3,1.02)}
@keyframes arc{0%{transform:translateX(0)}45%{transform:translateX(90px) translateY(-10px)}100%{transform:translateX(196px)}}
#face.arcback{animation:arcback .42s cubic-bezier(.3,.9,.3,1.02)}
@keyframes arcback{0%{transform:translateX(196px)}55%{transform:translateX(90px) translateY(-10px)}100%{transform:translateX(0)}}
#earpiece{position:absolute;left:50%;top:18px;width:58px;height:7px;margin-left:-29px;border-radius:4px;
  background:repeating-linear-gradient(90deg,#0a0a0b 0 2px,#2c2c30 2px 4px);box-shadow:inset 0 1px 2px #000}
#sensorled{position:absolute;left:290px;top:19px;width:8px;height:5px;border-radius:2px;background:#101012;box-shadow:inset 0 0 2px #000}
#facemark{position:absolute;left:24px;top:14px;width:52px;height:14px;border-radius:3px;
  background:linear-gradient(90deg,#3c3c40,#4a4a4f);opacity:.75}   /* neutral placeholder where a carrier mark sat */
#facemark::after{content:"";position:absolute;left:6px;top:4px;width:40px;height:6px;border-radius:2px;background:#6d6d73}
/* the glass */
#screen{
  position:absolute;left:24px;top:46px;width:320px;height:480px;overflow:hidden;background:#000;
  box-shadow:0 0 0 2px #0b0b0c, 0 0 0 3px #38383c, inset 0 0 12px rgba(0,0,0,.9);
}
#lcd{
  position:absolute;left:0;top:0;width:320px;height:480px;background:#000;overflow:hidden;
  font-family:var(--droid);font-size:14px;color:#000;
  transform-origin:center center;
}
#lcd.land{left:-80px;top:80px;width:480px;height:320px;transform:rotate(90deg)}
#lcd *{cursor:default}
#lcd.dim::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:none;z-index:400}
#screenoff{position:absolute;inset:0;background:#000;z-index:390;display:none}
#screenoff.on{display:block}
/* controls under the screen */
#controls{position:absolute;left:0;top:530px;width:368px;height:96px}
.hk{
  position:absolute;border:1px solid #0e0e10;border-radius:6px;cursor:pointer;
  background:linear-gradient(#4b4b50,#333338 60%,#2a2a2e);
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset, 0 2px 2px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;color:#d9d9dd;
}
.hk:active,.hk.down{background:linear-gradient(#2a2a2e,#3a3a3f);box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
.hk svg{width:22px;height:22px;display:block}
#hkCall{left:36px;top:6px;width:64px;height:30px}
#hkCall svg{color:#79c46a}
#hkMenu{left:118px;top:6px;width:132px;height:30px;font:700 11px var(--droid);letter-spacing:.2em;color:#cfd0d4}
#hkEnd{left:268px;top:6px;width:64px;height:30px}
#hkEnd svg{color:#d9605a}
#hkHome{left:36px;top:48px;width:96px;height:32px}
#hkBack{left:236px;top:48px;width:96px;height:32px}
#trackball{position:absolute;left:158px;top:40px;width:52px;height:52px;border-radius:50%;cursor:grab;
  background:radial-gradient(circle at 50% 50%,#0a0a0b 40%,#2a2a2e 41%,#1a1a1c 60%,#3a3a3e 62%,#1c1c1f)}
#trackball:active{cursor:grabbing}
#trackball .ball{position:absolute;left:8px;top:8px;width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f2f2f4,#a9a9ae 45%,#5b5b60 80%,#333);
  box-shadow:inset -2px -3px 6px rgba(0,0,0,.6), 0 0 0 1px #000;
  transition:box-shadow .2s}
#trackball .ball.glow{box-shadow:inset -2px -3px 6px rgba(0,0,0,.6),0 0 0 1px #000,0 0 10px #fff}
#trackball .ball::after{content:"";position:absolute;left:12px;top:9px;width:9px;height:6px;border-radius:50%;background:rgba(255,255,255,.65)}
/* forward-angled chin */
#chin{position:absolute;left:0;bottom:0;width:368px;height:44px;border-radius:0 0 28px 28px;
  background:linear-gradient(#232326,#151517);transform-origin:50% 0;transform:perspective(500px) rotateX(-22deg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
#port{position:absolute;left:50%;bottom:6px;width:38px;height:9px;margin-left:-19px;border-radius:3px;background:#050506;box-shadow:inset 0 0 3px #000}
#port.plugged::after{content:"";position:absolute;left:-2px;top:-2px;width:42px;height:13px;border-radius:3px;background:linear-gradient(#a8a8ad,#6e6e73)}
#chinmark{position:absolute;right:26px;bottom:14px;width:34px;height:8px;border-radius:2px;background:#2f2f33;opacity:.7}   /* neutral placeholder where a maker's mark sat */
/* side keys */
#rocker{position:absolute;left:-3px;top:150px;width:8px;height:96px;border-radius:3px;background:linear-gradient(90deg,#4a4a4f,#2a2a2e)}
#rocker b{position:absolute;left:0;width:8px;height:44px;cursor:pointer;border-radius:3px}
#rocker b:hover{background:rgba(255,255,255,.15)}
#volUp{top:2px}#volDn{bottom:2px}
#camkey{position:absolute;left:364px;top:595px;width:7px;height:34px;border-radius:3px;background:linear-gradient(90deg,#2a2a2e,#4a4a4f);cursor:pointer}
#camkey:hover{background:#6a6a70}
.keylabel{position:absolute;font:600 8px var(--mono);color:#6f6f76;letter-spacing:.08em;pointer-events:none}

/* ================= the screen framework (Android 1.0 look) ================= */
#lcd .sb{ /* status bar */
  position:absolute;left:0;top:0;right:0;height:25px;z-index:300;
  background:linear-gradient(#3a3a3a,#0d0d0d 55%,#000);
  color:#fff;font:700 13px var(--droid);display:flex;align-items:center;
  border-bottom:1px solid #2a2a2a;cursor:pointer;
}
#lcd .sb .nicons{flex:1;display:flex;align-items:center;gap:2px;padding-left:4px;overflow:hidden;height:25px;position:relative}
#lcd .sb .nicons .ni{width:25px;height:25px;display:flex;align-items:center;justify-content:center;flex:none}
#lcd .sb .nicons .ni svg{width:20px;height:20px}
#lcd .sb .ticker{position:absolute;left:0;top:0;height:25px;line-height:25px;padding-left:4px;font:400 13px/25px var(--droid);
  white-space:nowrap;background:linear-gradient(#3a3a3a,#0d0d0d 55%,#000);width:100%;transform:translateY(25px);transition:transform .25s}
#lcd .sb .ticker.show{transform:none}
#lcd .sb .ticker .ti{display:inline-block;width:20px;height:20px;vertical-align:-5px;margin-right:6px}
#lcd .sb .ticker .ti svg{width:20px;height:20px}
#lcd .sb .right{display:flex;align-items:center;gap:3px;padding-right:4px;flex:none}
#lcd .sb .right svg{width:20px;height:20px;display:block}
#lcd .sb .clock{font:700 13px var(--droid);margin-left:2px;letter-spacing:.01em}
#lcd.nosb .sb{display:none}
#acts{position:absolute;left:0;top:25px;right:0;bottom:0;overflow:hidden;background:#000}
#lcd.nosb #acts{top:0}
#overlays{position:absolute;inset:0;pointer-events:none;z-index:320}
#overlays>*{pointer-events:auto}

/* activity root */
.act{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;color:#000;overflow:hidden;font-family:var(--droid)}
.act.dark{background:#000;color:#fff}
.tb{ /* title bar */
  flex:none;height:25px;display:flex;align-items:center;padding:0 8px;
  background:linear-gradient(#6a6a6a,#4c4c4c 55%,#404040);border-bottom:1px solid #2a2a2a;
  color:#fff;font:600 15px/25px var(--droid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 -1px 0 rgba(0,0,0,.5);
}
.tb .r{margin-left:auto;font:400 12px var(--droid);color:#ddd}
.body{flex:1;position:relative;overflow:hidden}
.scroll{position:absolute;inset:0;overflow:hidden}          /* our own scroller, deliberately janky */
.scroll>.inner{position:relative;min-height:100%}
/* the "starting window" a launching activity shows before it has drawn */
.startwin{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column}
.startwin.dark{background:#000}

/* list view */
.lv{list-style:none}
.li{position:relative;min-height:48px;display:flex;align-items:center;gap:10px;padding:6px 8px;
  border-bottom:1px solid #d6d6d6;font:400 17px/1.25 var(--droid);color:#000;cursor:pointer}
.li.h2{min-height:60px}
.li .ic{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center}
.li .ic svg{width:44px;height:44px}
.li .ic.sm{width:32px;height:32px}.li .ic.sm svg{width:28px;height:28px}
.li .tx{flex:1;min-width:0}
.li .t1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{display:block;font-size:13px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.li .rt{flex:none;font-size:12px;color:#666;align-self:flex-start;padding-top:4px}
.li.sel,.li.focused,.f.focused{background:linear-gradient(#ffb646,#ff8f00);color:#000}
.li.focused .t2,.li.sel .t2{color:#3a2600}
.li:active{background:linear-gradient(#ffb646,#ff8f00)}
.li.dim{opacity:.6}
.dark .li{color:#fff;border-bottom-color:#333}.dark .li .t2{color:#aaa}.dark .li .rt{color:#999}
.sect{ /* list section header (the beveled one) */
  height:22px;line-height:22px;padding:0 8px;font:700 12px/22px var(--droid);color:#fff;
  background:linear-gradient(#6f6f6f,#4b4b4b);border-top:1px solid #8a8a8a;border-bottom:1px solid #2f2f2f;text-transform:none}
.sect.blue{background:linear-gradient(#6e8fbf,#4a6a9a)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#666;font:15px var(--droid);text-align:center;padding:20px}

/* buttons, fields, checks (1.0 widgets) */
.abtn{
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:6px;
  border:1px solid #6b6b6b;background:linear-gradient(#fdfdfd,#d5d5d5 60%,#c4c4c4);
  color:#000;font:700 15px var(--droid);cursor:pointer;text-shadow:0 1px 0 rgba(255,255,255,.6);
  box-shadow:0 1px 1px rgba(0,0,0,.35);
}
.abtn:active,.abtn.focused{background:linear-gradient(#ffb646,#ff8f00);border-color:#b25a00}
.abtn.sm{min-height:34px;font-size:13px;padding:0 10px}
.abtn:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:6px;padding:6px;border-top:1px solid #bbb;background:linear-gradient(#e6e6e6,#cfcfcf)}
.btnrow .abtn{flex:1}
.et{ /* EditText — a field that shows a caret but has nothing to summon */
  position:relative;min-height:44px;border:1px solid #777;border-radius:6px;background:#fff;
  padding:10px 8px;font:400 17px/1.3 var(--droid);color:#000;white-space:pre-wrap;word-break:break-word;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.18);cursor:text;overflow:hidden}
.et.one{white-space:nowrap;overflow:hidden}
.et.focused{border-color:#ff9000;box-shadow:inset 0 2px 3px rgba(0,0,0,.18),0 0 0 2px rgba(255,144,0,.55)}
.et .hint{color:#8a8a8a}
.et .caret{display:inline-block;width:2px;height:1.1em;background:#000;vertical-align:-3px;margin:0 -1px;opacity:0}
.et.focused .caret{animation:blink 1.06s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.et .selword{background:#ffcf80}
.chk{width:26px;height:26px;border:1px solid #777;border-radius:4px;background:linear-gradient(#fff,#ddd);flex:none;position:relative}
.chk.on::after{content:"";position:absolute;left:8px;top:2px;width:7px;height:14px;border:solid #3a9d23;border-width:0 3px 3px 0;transform:rotate(40deg)}
.rad{width:26px;height:26px;border:1px solid #777;border-radius:50%;background:linear-gradient(#fff,#ddd);flex:none;position:relative}
.rad.on::after{content:"";position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:50%;background:#3a9d23}
.pref{min-height:56px;border-bottom:1px solid #d6d6d6;display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}
.pref .tx{flex:1;min-width:0}.pref .t1{font:400 17px var(--droid)}.pref .t2{font:400 13px var(--droid);color:#555;margin-top:1px}
.pref.focused{background:linear-gradient(#ffb646,#ff8f00)}
.pref.off{opacity:.45}

/* tabs (TabWidget) */
.tabs{flex:none;display:flex;background:linear-gradient(#3b3b3b,#1e1e1e);border-bottom:2px solid #8a8a8a;height:62px}
.tabs .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:#bbb;font:600 12px var(--droid);border-right:1px solid #000;cursor:pointer;
  background:linear-gradient(#4a4a4a,#2a2a2a)}
.tabs .tab svg{width:26px;height:26px}
.tabs .tab.on{background:linear-gradient(#fff,#dcdcdc);color:#000;border-bottom:none}
.tabs .tab.focused{background:linear-gradient(#ffb646,#ff8f00);color:#000}

/* dialogs (dark 1.0 alert) */
.dlgwrap{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:14px;z-index:340}
.dlg{width:100%;max-width:300px;max-height:92%;display:flex;flex-direction:column;border-radius:6px;overflow:hidden;
  border:1px solid #111;box-shadow:0 8px 30px rgba(0,0,0,.7);background:#2c2c2c;color:#fff;font-family:var(--droid)}
.dlg .dt{flex:none;background:linear-gradient(#6a6a6a,#4a4a4a);padding:8px 12px;font:700 17px var(--droid);border-bottom:2px solid #8f8f8f;display:flex;align-items:center;gap:8px}
.dlg .dt svg{width:26px;height:26px}
.dlg .dm{padding:12px;font:400 15px/1.35 var(--droid);color:#eee}
.dlg .dm p{margin:0 0 10px}.dlg .dm p:last-child{margin:0}
.dlg .dlist{flex:1;overflow:hidden;position:relative;min-height:0}
.dlg .dlist .li{color:#fff;border-bottom-color:#1a1a1a;background:#3a3a3a;min-height:50px}
.dlg .dlist .li.focused,.dlg .dlist .li:active{background:linear-gradient(#ffb646,#ff8f00);color:#000}
.dlg .dlist .li .t2{color:#bbb}
.dlg .dchk{display:flex;align-items:center;gap:10px;padding:10px 12px;font:400 14px var(--droid);border-top:1px solid #444;cursor:pointer}
.dlg .dbtns{flex:none;display:flex;gap:6px;padding:8px;background:#2c2c2c;border-top:1px solid #444}
.dlg .dbtns .abtn{flex:1;font-size:15px}
.dlg .det{margin:6px 12px}
.dlg .dprog{margin:6px 12px 12px;height:14px;border:1px solid #777;border-radius:3px;background:#111;overflow:hidden}
.dlg .dprog i{display:block;height:100%;background:linear-gradient(#ffc766,#ff9000)}
.dlg .dprog.ind i{width:30%;animation:ind 1.1s linear infinite}
@keyframes ind{0%{margin-left:-30%}100%{margin-left:100%}}

/* options menu (Menu key) */
#optmenu{position:absolute;left:0;right:0;bottom:0;z-index:335;
  background:linear-gradient(#f2f2f2,#d8d8d8);border-top:1px solid #8c8c8c;box-shadow:0 -4px 14px rgba(0,0,0,.5);
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:1px;
  transform:translateY(100%);transition:transform .18s ease-out}
#optmenu.open{transform:none}
#optmenu .mi{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(#f7f7f7,#dedede);border:1px solid #bdbdbd;color:#000;font:600 12px var(--droid);cursor:pointer;text-align:center;padding:2px}
#optmenu .mi svg{width:30px;height:30px}
#optmenu .mi.focused,#optmenu .mi:active{background:linear-gradient(#ffb646,#ff8f00)}
#optmenu .mi.off{opacity:.4;pointer-events:none}

/* android toast */
.atoast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);max-width:88%;z-index:350;
  background:rgba(60,60,60,.94);color:#fff;border:1px solid #222;border-radius:8px;padding:10px 14px;
  font:400 14px/1.3 var(--droid);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.6);
  opacity:0;transition:opacity .2s;pointer-events:none}
.atoast.show{opacity:1}

/* the notification shade */
#shade{position:absolute;left:0;right:0;top:25px;bottom:0;z-index:330;transform:translateY(calc(-100% - 26px));
  background:#fff;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(0,0,0,.6);
  transition:transform .22s cubic-bezier(.2,.7,.3,1)}
#shade.open{transform:none}
#shade.drag{transition:none}
#shade .head{flex:none;height:32px;display:flex;align-items:center;padding:0 8px;background:linear-gradient(#3c3c3c,#161616);color:#fff;font:700 13px var(--droid)}
#shade .head .abtn{margin-left:auto;min-height:24px;font-size:12px;padding:0 8px;border-radius:4px}
#shade .list{flex:1;position:relative;overflow:hidden;background:#fff}
#shade .ni{display:flex;align-items:center;gap:8px;min-height:64px;padding:6px 8px;border-bottom:1px solid #d5d5d5;cursor:pointer;background:#fff}
#shade .ni:active,#shade .ni.focused{background:linear-gradient(#ffb646,#ff8f00)}
#shade .ni .ic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
#shade .ni .ic svg{width:36px;height:36px}
#shade .ni .tx{flex:1;min-width:0;color:#000;font:400 13px/1.3 var(--droid)}
#shade .ni .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shade .ni .tx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444}
#shade .ni .when{flex:none;font:400 12px var(--droid);color:#666;align-self:flex-start;padding-top:2px}
#shade .none{padding:22px 10px;text-align:center;color:#666;font:14px var(--droid)}
#shade .handle{flex:none;height:26px;background:linear-gradient(#4c4c4c,#1c1c1c);border-top:1px solid #6a6a6a;display:flex;align-items:center;justify-content:center;cursor:grab}
#shade .handle i{width:34px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,#9a9a9a 0 2px,#4c4c4c 2px 4px)}

/* volume overlay */
#volpanel{position:absolute;left:14px;right:14px;top:60px;z-index:345;border-radius:6px;background:#2c2c2c;border:1px solid #111;color:#fff;
  padding:10px 12px;font:700 15px var(--droid);display:none;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#volpanel.show{display:block}
#volpanel .bar{margin-top:8px;height:16px;border:1px solid #777;border-radius:3px;background:#111;overflow:hidden}
#volpanel .bar i{display:block;height:100%;background:linear-gradient(#ffc766,#ff9000)}

/* keyguard */
#keyguard{position:absolute;inset:0;z-index:380;display:none;background:#123;color:#fff;font-family:var(--droid);overflow:hidden}
#keyguard.on{display:block}
#keyguard .wall{position:absolute;inset:0;filter:brightness(.7)}
#keyguard .kg{position:absolute;left:0;right:0;top:0;padding:14px 12px;text-shadow:0 1px 2px #000}
#keyguard .kg .time{font:700 44px/1 var(--droid)}
#keyguard .kg .date{font:400 15px var(--droid);margin-top:6px}
#keyguard .kg .car{font:400 13px var(--droid);margin-top:4px;color:#cfd6dd}
#keyguard .instr{position:absolute;left:0;right:0;bottom:56px;text-align:center;font:400 16px var(--droid);text-shadow:0 1px 2px #000}
#keyguard .emerg{position:absolute;left:12px;right:12px;bottom:10px;height:36px}
#keyguard .emerg .abtn{width:100%;min-height:36px;font-size:14px}
#keyguard canvas{position:absolute;left:0;right:0;bottom:60px;margin:0 auto;display:block}
#keyguard .msg{position:absolute;left:0;right:0;top:110px;text-align:center;font:400 14px var(--droid);text-shadow:0 1px 2px #000}

/* boot / shutdown */
#bootscr{position:absolute;inset:0;background:#000;z-index:385;display:none;color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#bootscr.on{display:flex}
#bootscr .mark{width:74px;height:74px;border-radius:14px;border:3px solid #6a6a70;position:relative}
#bootscr .mark::after{content:"";position:absolute;left:20px;top:20px;width:28px;height:28px;border-radius:50%;background:#6a6a70}
#bootscr .word{font:700 34px var(--droid);letter-spacing:.06em;color:#8a8a8f;position:relative;overflow:hidden}
#bootscr .word.shine{background:linear-gradient(90deg,#8a8a8f 30%,#fff 50%,#8a8a8f 70%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.7s linear infinite}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
#bootscr .sub{font:12px var(--droid);color:#555;letter-spacing:.2em;text-transform:uppercase}
#bootscr .prog{width:180px;height:10px;border:1px solid #555;border-radius:3px;overflow:hidden}
#bootscr .prog i{display:block;height:100%;width:0;background:#c9c9cc}

/* ================= home screen (Launcher) ================= */
#homeroot{background:#000;color:#fff}
.wall{position:absolute;inset:0;background-size:cover;background-position:center}
.panels{position:absolute;left:0;top:0;right:0;bottom:30px;overflow:hidden}
.pstrip{position:absolute;top:0;bottom:0;left:0;display:flex;transition:transform .28s cubic-bezier(.2,.7,.3,1)}
.pstrip.drag{transition:none}
.panel{position:relative;flex:none;height:100%}
.cell{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;cursor:pointer}
.cell .icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.cell .icon svg{width:48px;height:48px}
.cell .lbl{margin-top:3px;font:400 12px/1.15 var(--droid);color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.cell.focused .icon{background:rgba(255,150,0,.55);border-radius:8px}
.cell.folder .icon{background:linear-gradient(#e6e6e6,#b5b5b5);border-radius:6px;border:1px solid #444}
.cell.folder .icon svg{width:36px;height:36px}
.cell.drag{opacity:.85;transform:scale(1.08);z-index:5;pointer-events:none}
.cell.ghost{opacity:.35}
.widget{position:absolute;overflow:hidden}
.widget.focused{outline:2px solid #ff9000}
.drawerhandle{position:absolute;left:0;right:0;bottom:0;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#8b8b8b,#5b5b5b 55%,#4a4a4a);border-top:1px solid #a5a5a5;border-radius:6px 6px 0 0;margin:0 22%}
.drawerhandle i{width:40px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#d0d0d0 0 3px,#5b5b5b 3px 6px)}
.drawerhandle.trash{background:linear-gradient(#e26060,#a02020)}
.drawerhandle.trash i{display:none}
.drawerhandle.trash::after{content:"Remove";color:#fff;font:700 12px var(--droid)}
.drawer{position:absolute;left:0;right:0;bottom:30px;top:0;background:rgba(20,20,20,.92);transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.7,.3,1);overflow:hidden}
.drawer.open{transform:none}
.drawer.drag{transition:none}
.drawer .grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px 20px}
.drawer .cell{position:relative;height:88px;width:100%}
.dots{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.folderwin{position:absolute;left:8px;right:8px;top:40px;background:#f0f0f0;border:1px solid #444;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.6);color:#000;z-index:6}
.folderwin .ft{background:linear-gradient(#ddd,#bbb);padding:6px 10px;font:700 14px var(--droid);border-bottom:1px solid #999;border-radius:6px 6px 0 0;display:flex}
.folderwin .ft i{margin-left:auto;font-style:normal;cursor:pointer;color:#600}
.folderwin .grid{display:grid;grid-template-columns:repeat(4,1fr);padding:6px 2px}
.folderwin .cell{position:relative;height:84px}
.folderwin .cell .lbl{color:#000;text-shadow:none}

/* widgets */
.w-search{display:flex;align-items:center;gap:6px;padding:0 6px}
.w-search .box{flex:1;height:44px;border:1px solid #666;border-radius:8px;background:linear-gradient(#fff,#e8e8e8);display:flex;align-items:center;padding:0 10px;color:#000;font:400 17px var(--droid);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.w-search .box .ph{width:36px;height:12px;border-radius:2px;background:linear-gradient(90deg,#6c8fd8,#e0533a 33%,#f3b400 66%,#4aa64f);opacity:.85;margin-right:8px;flex:none}  /* neutral placeholder where a logo sat */
.w-search .box .q{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-height:22px}
.w-search .box .q.hint{color:#999}
.w-search .go{width:44px;height:44px;border-radius:8px;border:1px solid #666;background:linear-gradient(#f4f4f4,#cfcfcf);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.w-search .go svg{width:26px;height:26px}
.w-clock{display:flex;align-items:center;justify-content:center}
.w-clock svg{filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.w-cal{margin:4px;background:#fff;border:1px solid #333;border-radius:4px;color:#000;overflow:hidden;box-shadow:0 3px 6px rgba(0,0,0,.5);display:flex;flex-direction:column}
.w-cal .top{background:linear-gradient(#5b8bd0,#3a67a8);color:#fff;padding:3px 8px;font:700 13px var(--droid);display:flex;gap:6px;align-items:baseline}
.w-cal .top .day{font-size:24px}
.w-cal .ev{padding:4px 8px;font:400 12px/1.3 var(--droid);flex:1;overflow:hidden}
.w-cal .ev b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-cal .ev .none{color:#777}
.w-music{margin:4px 6px;background:linear-gradient(#4e4e4e,#242424);border:1px solid #111;border-radius:6px;display:flex;align-items:center;gap:6px;padding:4px 6px;color:#fff;box-shadow:0 3px 6px rgba(0,0,0,.5)}
.w-music .art{width:56px;height:56px;flex:none;border:1px solid #000}
.w-music .tx{flex:1;min-width:0;font:400 12px/1.25 var(--droid)}
.w-music .tx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-music .tx span{display:block;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-music .ctl{display:flex;gap:2px}
.w-music .ctl b{width:34px;height:34px;border-radius:4px;border:1px solid #111;background:linear-gradient(#6a6a6a,#3a3a3a);display:flex;align-items:center;justify-content:center;cursor:pointer}
.w-music .ctl b svg{width:20px;height:20px}
.w-frame{margin:6px;background:#fff;padding:5px 5px 12px;border:1px solid #333;box-shadow:0 4px 8px rgba(0,0,0,.6);transform:rotate(-2deg)}
.w-frame .img{width:100%;height:100%;background:#333 center/cover}
.w-frame .pick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#666;font:12px var(--droid);text-align:center}

/* ================= apps ================= */
/* dialer */
.dial{display:flex;flex-direction:column;height:100%;background:#000;color:#fff}
.dial .num{flex:none;height:72px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font:400 34px var(--droid);letter-spacing:.02em;background:linear-gradient(#2a2a2a,#111);border-bottom:1px solid #333;white-space:nowrap;overflow:hidden}
.dial .num .hint{font-size:15px;color:#777}
.dial .pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px}
.dial .pad b{border:1px solid #111;border-radius:5px;background:linear-gradient(#444,#262626);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 26px/1 var(--droid);cursor:pointer;color:#fff}
.dial .pad b i{font:400 9px var(--droid);letter-spacing:.2em;color:#aaa;margin-top:2px;font-style:normal}
.dial .pad b:active,.dial .pad b.focused{background:linear-gradient(#ffb646,#ff8f00);color:#000}
.dial .bar{flex:none;display:flex;gap:4px;padding:4px}
.dial .bar b{flex:1;height:52px;border:1px solid #111;border-radius:5px;background:linear-gradient(#444,#262626);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dial .bar b svg{width:28px;height:28px}
.dial .bar b.call{background:linear-gradient(#5fb84f,#2e7a22)}
.incall{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,#2f3a48,#0a0d12 70%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:18px 12px}
.incall .who{font:700 24px var(--droid);margin-top:14px}
.incall .n2{font:400 15px var(--droid);color:#bcc;margin-top:4px}
.incall .st{font:400 16px var(--droid);color:#8fd;margin-top:14px}
.incall .av{width:96px;height:96px;border-radius:8px;border:2px solid #555;background:linear-gradient(#777,#333);display:flex;align-items:center;justify-content:center}
.incall .av svg{width:64px;height:64px}
.incall .acts{margin-top:auto;width:100%;display:flex;gap:6px}
.incall .acts .abtn{flex:1;min-height:52px}
.incall .acts .abtn.red{background:linear-gradient(#e8746a,#b12a1e);color:#fff;text-shadow:none}
.incall .acts .abtn.green{background:linear-gradient(#7fd56a,#2e8a20);color:#fff;text-shadow:none}
/* messaging bubbles */
.msgs{padding:6px}
.bub{max-width:86%;margin:4px 0;padding:8px 10px;border:1px solid #999;border-radius:6px;background:linear-gradient(#fff,#e9e9e9);font:400 15px/1.3 var(--droid);color:#000;position:relative}
.bub.me{margin-left:auto;background:linear-gradient(#e8f0d9,#c8dcb0)}
.bub .meta{display:block;font-size:11px;color:#666;margin-top:3px}
.bub a,.lnk{color:#1a48c4;text-decoration:underline;cursor:pointer}
.bub img{max-width:100%;display:block;border:1px solid #666;margin:4px 0}
.compose{flex:none;display:flex;gap:6px;padding:6px;border-top:1px solid #aaa;background:linear-gradient(#ececec,#d8d8d8);align-items:flex-end}
.compose .et{flex:1;min-height:44px}
/* gmail */
.gm-conv{background:#fff}
.gm-h{padding:8px 10px;border-bottom:1px solid #ccc;background:linear-gradient(#f6f6f6,#e6e6e6)}
.gm-h b{font:700 17px/1.25 var(--droid);display:block}
.gm-h span{font:400 12px var(--droid);color:#555}
.gm-m{padding:8px 10px;border-bottom:1px solid #ddd;font:400 14px/1.4 var(--droid)}
.gm-m .from{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.gm-m .from b{font-size:14px}.gm-m .from span{font-size:11px;color:#666;margin-left:auto}
.gm-m p{margin:0 0 8px}
.gm-att{display:inline-flex;align-items:center;gap:6px;border:1px solid #999;border-radius:4px;padding:4px 8px;background:#f0f0f0;cursor:pointer;font-size:13px;margin:4px 0}
.gm-att img{width:40px;height:30px;border:1px solid #777}
.unread .t1{font-weight:700}
.li .star{width:24px;height:24px;flex:none;cursor:pointer}
.li .star svg{width:24px;height:24px}
.lbl-tag{display:inline-block;font-size:11px;padding:0 5px;border-radius:3px;background:#ddd;color:#333;margin-right:4px}
/* browser */
.brw{display:flex;flex-direction:column;height:100%;background:#fff}
.brw .url{flex:none;display:none;gap:4px;padding:4px;background:linear-gradient(#e8e8e8,#cfcfcf);border-bottom:1px solid #999;align-items:center}
.brw .url.show{display:flex}
.brw .url .et{flex:1;min-height:36px;padding:6px 8px;font-size:15px}
.brw .url .abtn{min-height:36px}
.brw .vp{flex:1;position:relative;overflow:hidden;background:#fff;touch-action:none}
.brw .pg{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;color:#000;font:400 15px/1.45 "Times New Roman",Times,serif}
.brw .prog{position:absolute;left:0;right:0;top:0;height:4px;background:#ddd;z-index:3;display:none}
.brw .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4aa,#27a);transition:width .3s}
.brw .zoom{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:2px;z-index:4;opacity:0;transition:opacity .25s;pointer-events:none}
.brw .zoom.show{opacity:1;pointer-events:auto}
.brw .zoom b{width:64px;height:38px;background:linear-gradient(rgba(240,240,240,.95),rgba(190,190,190,.95));border:1px solid #555;display:flex;align-items:center;justify-content:center;font:700 20px var(--droid);cursor:pointer;color:#111}
.brw .zoom b:first-child{border-radius:6px 0 0 6px}.brw .zoom b:last-child{border-radius:0 6px 6px 0}
.brw .zoom b.mid{font-size:13px}
/* the pages themselves, in 2008 web idiom */
.pg .site{width:100%}
.pg h1,.pg h2,.pg h3{font-family:Georgia,"Times New Roman",serif}
.pg a{color:#0b3fbf;text-decoration:underline;cursor:pointer}
.pg .masthead{background:#1a2a44;color:#fff;padding:10px 14px;font:700 26px Georgia,serif;border-bottom:4px solid #c8a23a}
.pg .navbar{background:#e8e2cc;padding:5px 12px;font:700 12px Verdana,sans-serif;border-bottom:1px solid #b6ad8e}
.pg .navbar a{margin-right:12px;color:#1a2a44}
.pg .cols{display:flex;gap:14px;padding:10px 14px}
.pg .cols .main{flex:2}.pg .cols .side{flex:1;background:#f4f1e6;padding:8px;border:1px solid #d9d2b8;font-size:12px}
.pg .story h2{font-size:22px;margin:0 0 4px}.pg .story .by{font:italic 12px Georgia,serif;color:#666;margin-bottom:8px}
.pg .story p{margin:0 0 10px}
.pg .ad{background:#fff3b0;border:1px dashed #c9a800;padding:6px;text-align:center;font:700 11px Verdana,sans-serif;margin:8px 0}
.pg table{border-collapse:collapse;width:100%;font:12px Verdana,sans-serif}
.pg td,.pg th{border:1px solid #999;padding:3px 5px;text-align:left}
.pg th{background:#dde}
.pg .portal{padding:30px 20px;text-align:center;font-family:Arial,sans-serif}
.pg .portal .logo{font:700 44px Arial,sans-serif;letter-spacing:-1px;color:#333}
.pg .portal .logo i{color:#e8901a;font-style:normal}
.pg .portal .sbox{margin:14px auto;width:80%;height:30px;border:1px solid #888;background:#fff;text-align:left;padding:5px 8px;font:14px Arial,sans-serif;color:#999;cursor:text}
.pg .portal .links a{margin:0 8px;font-size:13px}
.pg .res{padding:10px 14px;font-family:Arial,sans-serif}
.pg .res .r{margin-bottom:12px}.pg .res .r a{font-size:16px}.pg .res .r .u{color:#0a7a2a;font-size:11px}.pg .res .r p{font-size:12px;color:#333;margin:2px 0}
.pg .err{padding:40px 20px;font-family:Arial,sans-serif;color:#333}
.pg .err h2{font-size:20px;color:#900;margin-bottom:8px}
.pg .plain{padding:12px 14px;font-family:Verdana,sans-serif;font-size:13px}
.pg .plain h1{font-size:22px;margin-bottom:8px}.pg .plain p{margin-bottom:8px}
.pg .plain pre{background:#f4f4f4;border:1px solid #ccc;padding:6px;font:11px monospace;overflow:hidden}
.pg .wapish{font:14px monospace;padding:10px}
.pg .box{border:1px solid #aaa;background:#f7f7f7;padding:8px;margin:8px 0;font-size:13px}
/* maps */
.maps{position:relative;height:100%;background:#e9e5d8;overflow:hidden}
.maps canvas{position:absolute;left:0;top:0;cursor:grab}
.maps .search{position:absolute;left:6px;right:6px;top:6px;display:flex;gap:4px;z-index:3}
.maps .search .et{flex:1;min-height:38px;padding:7px 8px;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.maps .search .abtn{min-height:38px}
.maps .zoom{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:2px;z-index:4}
.maps .zoom b{width:64px;height:38px;background:linear-gradient(rgba(240,240,240,.95),rgba(190,190,190,.95));border:1px solid #555;display:flex;align-items:center;justify-content:center;font:700 20px var(--droid);cursor:pointer;color:#111}
.maps .zoom b:first-child{border-radius:6px 0 0 6px}.maps .zoom b:last-child{border-radius:0 6px 6px 0}
.maps .bubble{position:absolute;z-index:5;background:#fff;border:1px solid #333;border-radius:6px;padding:6px 8px;font:400 13px var(--droid);box-shadow:0 3px 8px rgba(0,0,0,.5);cursor:pointer;max-width:200px}
.maps .bubble b{display:block;font-size:14px}
.maps .bubble::after{content:"";position:absolute;left:14px;bottom:-9px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.maps .mode{position:absolute;right:6px;top:52px;z-index:3;background:rgba(255,255,255,.9);border:1px solid #333;border-radius:4px;padding:2px 6px;font:700 11px var(--droid)}
.sv{position:absolute;inset:0;background:#000;cursor:grab}
.sv canvas{position:absolute;left:0;top:0}
.sv .hud{position:absolute;left:6px;top:6px;right:6px;display:flex;gap:6px;align-items:center;z-index:3;color:#fff;font:700 12px var(--droid);text-shadow:0 1px 2px #000}
.sv .hud .cmp{margin-left:auto;background:rgba(0,0,0,.55);border:1px solid #888;border-radius:4px;padding:3px 7px;cursor:pointer}
.sv .hud .cmp.on{background:linear-gradient(#ffb646,#ff8f00);color:#000;border-color:#a55}
/* market */
.mk-head{flex:none;background:linear-gradient(#c5e07a,#7fb13a);border-bottom:1px solid #4a6e1c;padding:6px 8px;display:flex;align-items:center;gap:8px}
.mk-head .ph{width:28px;height:28px;border-radius:6px;background:linear-gradient(#fff,#cfe4a5);border:1px solid #4a6e1c;flex:none}
.mk-head b{font:700 16px var(--droid);color:#1f3608}
.mk-head .abtn{margin-left:auto;min-height:30px;font-size:12px}
.mk-cats{display:flex;border-bottom:1px solid #999;background:linear-gradient(#f0f0f0,#d8d8d8)}
.mk-cats b{flex:1;text-align:center;padding:8px 0;font:700 13px var(--droid);border-right:1px solid #aaa;cursor:pointer}
.mk-cats b.on{background:#fff}
.mk-feat{display:flex;gap:6px;overflow:hidden;padding:6px;background:#f4f4f4;border-bottom:1px solid #ccc}
.mk-feat .fi{flex:none;width:76px;text-align:center;font:400 11px/1.2 var(--droid);cursor:pointer}
.mk-feat .fi .ic{width:48px;height:48px;margin:0 auto 3px}
.mk-feat .fi .ic svg{width:48px;height:48px}
.mk-det{padding:10px}
.mk-det .top{display:flex;gap:10px;align-items:flex-start}
.mk-det .top .ic{width:64px;height:64px;flex:none}.mk-det .top .ic svg{width:64px;height:64px}
.mk-det .top b{font:700 18px var(--droid);display:block}
.mk-det .top span{font:400 13px var(--droid);color:#555;display:block}
.mk-det .stars{color:#e6a400;font-size:14px;letter-spacing:1px}
.mk-det .desc{margin:10px 0;font:400 14px/1.4 var(--droid)}
.mk-det .perm{background:#f0f0f0;border:1px solid #bbb;padding:6px 8px;font:12px/1.35 var(--droid);margin:8px 0}
.mk-det .perm b{display:block;font-size:12px;margin-bottom:2px}
.mk-det .cmt{border-top:1px solid #ddd;padding:6px 0;font:400 13px/1.35 var(--droid)}
.mk-det .cmt b{font-size:12px;color:#555}
.mk-price{display:inline-block;background:#3a7a1c;color:#fff;font:700 12px var(--droid);padding:1px 6px;border-radius:3px}
/* camera */
.cam{position:absolute;inset:0;background:#000;overflow:hidden}
.cam canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.cam .focus{position:absolute;left:50%;top:50%;width:90px;height:70px;margin:-35px 0 0 -45px;border:2px solid rgba(255,255,255,.85);border-radius:3px;opacity:0;transition:border-color .15s}
.cam .focus.show{opacity:1}.cam .focus.ok{border-color:#59e05a}
.cam .hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font:400 12px var(--droid);text-shadow:0 1px 2px #000}
.cam .strip{position:absolute;right:6px;top:6px;width:64px;height:48px;border:2px solid #fff;background:#333 center/cover;cursor:pointer;box-shadow:0 2px 6px #000}
.cam .review{position:absolute;inset:0;background:#000;display:flex;flex-direction:column}
.cam .review img{flex:1;min-height:0;object-fit:contain;width:100%}
.cam .review .btnrow{background:linear-gradient(#333,#111);border-top-color:#444}
.cam .review .btnrow .abtn{font-size:13px;padding:0 6px}
/* pictures */
.pics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.pics-grid .th{aspect-ratio:1/1;background:#333 center/cover;border:1px solid #111;cursor:pointer}
.pics-grid .th.focused{outline:3px solid #ff9000}
.pics-view{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pics-view img{max-width:100%;max-height:100%;transform-origin:center;transition:transform .15s}
.pics-view .zoom{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:2px;opacity:0;transition:opacity .25s}
.pics-view .zoom.show{opacity:1}
.pics-view .zoom b{width:64px;height:38px;background:linear-gradient(rgba(240,240,240,.95),rgba(190,190,190,.95));border:1px solid #555;display:flex;align-items:center;justify-content:center;font:700 20px var(--droid);cursor:pointer;color:#111}
.pics-view .zoom b:first-child{border-radius:6px 0 0 6px}.pics-view .zoom b:last-child{border-radius:0 6px 6px 0}
.pics-view .cap{position:absolute;left:0;right:0;top:0;padding:4px 8px;color:#fff;font:400 12px var(--droid);background:rgba(0,0,0,.5)}
/* music */
.np{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column}
.np .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
.np .art canvas{max-width:100%;max-height:100%;border:1px solid #333}
.np .info{flex:none;padding:6px 10px;font:400 13px var(--droid);color:#bbb;background:linear-gradient(#222,#000)}
.np .info b{display:block;color:#fff;font-size:16px}
.np .seek{flex:none;display:flex;align-items:center;gap:8px;padding:4px 10px;font:400 12px var(--droid);color:#bbb}
.np .seek .bar{flex:1;height:8px;border:1px solid #666;background:#222;border-radius:4px;overflow:hidden}
.np .seek .bar i{display:block;height:100%;background:#ff9000}
.np .ctl{flex:none;display:flex;gap:4px;padding:6px}
.np .ctl b{flex:1;height:54px;border:1px solid #111;border-radius:5px;background:linear-gradient(#4a4a4a,#262626);display:flex;align-items:center;justify-content:center;cursor:pointer}
.np .ctl b svg{width:30px;height:30px}
.np .ctl b.on{background:linear-gradient(#ffb646,#ff8f00)}
/* youtube */
.yt-player{position:absolute;inset:0;background:#000;display:flex;flex-direction:column}
.yt-player canvas{flex:1;min-height:0;width:100%}
.yt-player .ctl{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(40,40,40,.95);color:#fff;font:400 12px var(--droid)}
.yt-player .ctl .bar{flex:1;height:8px;border:1px solid #666;background:#222;border-radius:4px;overflow:hidden}
.yt-player .ctl .bar i{display:block;height:100%;background:#d33}
.yt-player .ctl b{width:40px;height:34px;border:1px solid #111;border-radius:4px;background:linear-gradient(#5a5a5a,#2a2a2a);display:flex;align-items:center;justify-content:center;cursor:pointer}
.yt-player .ctl b svg{width:20px;height:20px}
.yt-th{width:96px;height:72px;flex:none;border:1px solid #333;background:#222;position:relative;overflow:hidden}
.yt-th canvas{width:100%;height:100%;display:block}
.yt-th .dur{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.75);color:#fff;font:700 10px var(--droid);padding:0 3px}
/* calendar */
.cal-month{display:flex;flex-direction:column;height:100%;background:#fff}
.cal-month .mh{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:4px;background:linear-gradient(#e8e8e8,#cfcfcf);border-bottom:1px solid #999;font:700 16px var(--droid)}
.cal-month .mh b{cursor:pointer;padding:0 10px;font-size:20px}
.cal-month .dow{flex:none;display:grid;grid-template-columns:repeat(7,1fr);background:#ddd;font:700 11px var(--droid);text-align:center;padding:2px 0;border-bottom:1px solid #999}
.cal-month .grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr}
.cal-month .d{border-right:1px solid #ccc;border-bottom:1px solid #ccc;padding:2px;font:400 12px var(--droid);position:relative;cursor:pointer;overflow:hidden}
.cal-month .d.other{background:#f2f2f2;color:#999}
.cal-month .d.today{background:#fff5cc}
.cal-month .d.sel{outline:2px solid #ff9000;outline-offset:-2px}
.cal-month .d i{display:block;height:4px;margin-top:2px;background:#5b8bd0;border-radius:2px}
.cal-agenda .li .t1{white-space:normal}
.cal-day{position:relative}
.cal-day .hr{height:40px;border-bottom:1px solid #ddd;display:flex;font:400 11px var(--droid);color:#666}
.cal-day .hr span{width:44px;flex:none;padding:2px 4px;border-right:1px solid #ddd;text-align:right}
.cal-day .ev{position:absolute;left:48px;right:6px;background:linear-gradient(#8fb4e6,#5b8bd0);border:1px solid #2f5a9a;border-radius:3px;color:#fff;font:400 12px var(--droid);padding:2px 5px;overflow:hidden;cursor:pointer}
.form{padding:8px;display:flex;flex-direction:column;gap:8px}
.form label{font:700 12px var(--droid);color:#333}
.form .row{display:flex;gap:6px;align-items:center}
.form .row .abtn{flex:1}
/* alarm */
.alarm-alert{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#3a3a44,#0a0a0f 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.alarm-alert .t{font:700 60px var(--droid)}
.alarm-alert .l{font:400 16px var(--droid);color:#bbb}
.alarm-alert .btnrow{background:none;border:none;width:100%;padding:0 12px;margin-top:20px}
.tpick{display:flex;justify-content:center;gap:10px;padding:14px}
.tpick .col{display:flex;flex-direction:column;align-items:center;gap:4px}
.tpick .col b{width:64px;height:40px;border:1px solid #666;border-radius:5px;background:linear-gradient(#f4f4f4,#cfcfcf);display:flex;align-items:center;justify-content:center;font:700 22px var(--droid);cursor:pointer}
.tpick .col .v{width:64px;height:52px;border:1px solid #777;background:#fff;display:flex;align-items:center;justify-content:center;font:400 30px var(--droid)}
/* calculator */
.calc{display:flex;flex-direction:column;height:100%;background:#000;color:#fff}
.calc .disp{flex:none;height:76px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font:400 38px var(--droid);background:linear-gradient(#2a2a2a,#111);border-bottom:1px solid #333;white-space:nowrap;overflow:hidden}
.calc .pads{flex:1;position:relative;overflow:hidden}
.calc .pad{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px;transition:transform .25s}
.calc .pad.adv{transform:translateX(100%);grid-template-columns:repeat(3,1fr)}
.calc.advanced .pad.basic{transform:translateX(-100%)}.calc.advanced .pad.adv{transform:none}
.calc .pad b{border:1px solid #111;border-radius:5px;background:linear-gradient(#444,#262626);display:flex;align-items:center;justify-content:center;font:700 24px var(--droid);cursor:pointer}
.calc .pad b.op{background:linear-gradient(#5a6a80,#2c3646)}
.calc .pad b.eq{background:linear-gradient(#ffb646,#ff8f00);color:#000}
.calc .pad b:active,.calc .pad b.focused{background:linear-gradient(#ffb646,#ff8f00);color:#000}
.calc .pad.adv b{font-size:16px}
/* settings misc */
.about p{padding:10px 12px;border-bottom:1px solid #ddd;font:400 15px/1.35 var(--droid)}
.about p b{display:block;font-size:17px}
.about p span{color:#555;font-size:14px}
.storage{padding:10px 12px;font:400 15px/1.5 var(--droid)}
.storage .bar{height:18px;border:1px solid #666;border-radius:3px;background:#eee;overflow:hidden;margin:4px 0 12px}
.storage .bar i{display:block;height:100%;background:linear-gradient(#8fb4e6,#5b8bd0)}
.storage .bar i.low{background:linear-gradient(#e89a6a,#c0432a)}
/* setup wizard */
.setup{display:flex;flex-direction:column;height:100%;background:#fff;color:#000}
.setup .hero{flex:none;background:linear-gradient(#e6f0d6,#c9dcb0);border-bottom:1px solid #8aa070;padding:16px 14px;text-align:center}
.setup .hero .mark{width:80px;height:80px;margin:0 auto 10px;border-radius:16px;border:3px solid #58703a;position:relative;background:#fff}
.setup .hero .mark::after{content:"";position:absolute;left:22px;top:22px;width:30px;height:30px;border-radius:50%;background:#58703a}
.setup .hero h1{font:700 22px var(--droid);margin:0 0 4px}
.setup .hero p{font:400 14px var(--droid);color:#333}
.setup .content{flex:1;overflow:hidden;position:relative}
#lcd.land .setup .hero{padding:6px 14px}
#lcd.land .setup .hero .mark{display:none}
#lcd.land .setup .hero h1{font-size:17px;margin:0}
#lcd.land .setup .hero p{font-size:12px}
.setup .form{padding:12px}
.setup .form .lbl{font:700 13px var(--droid);margin-top:6px}
.setup .form p{font:400 13px/1.4 var(--droid);color:#333}
.setup .progress{height:14px;border:1px solid #777;border-radius:3px;background:#eee;overflow:hidden;margin:8px 0}
.setup .progress i{display:block;height:100%;width:0;background:linear-gradient(#8fd56a,#2e8a20);transition:width .5s}
/* talk */
.talk .st{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid #333}
.talk .st.on{background:#4caf50}.talk .st.away{background:#ffb300}.talk .st.busy{background:#d33}.talk .st.off{background:#999}
/* generic installed apps */
.genapp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;font:400 14px/1.4 var(--droid);color:#333;background:#fafafa}
.genapp .ic svg{width:80px;height:80px}
.genapp h2{font:700 20px var(--droid);color:#000}
.postcard{position:absolute;inset:0;background:#e6dcc4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}
.postcard .card{background:#fff;padding:8px 8px 30px;border:1px solid #999;box-shadow:0 6px 16px rgba(0,0,0,.4);transform:rotate(-2deg);max-width:100%}
.postcard .card img{display:block;max-width:100%;max-height:220px}
.postcard .card i{display:block;text-align:center;font:italic 14px Georgia,serif;color:#555;margin-top:8px}

/* ================= desk (museum objects around the phone) ================= */
#desk{position:fixed;left:10px;bottom:10px;z-index:590;width:min(340px,92vw);
  background:linear-gradient(#13161b,#0d0f13);border:1px solid var(--mus-edge);border-radius:8px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);display:none;flex-direction:column;overflow:hidden;font:13px/1.5 var(--sans);color:#c7cede}
#desk.open{display:flex}
#desk header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--mus-edge)}
#desk header h3{font:700 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mus-accent);flex:1}
#desk header button,#webside header button{background:#1b1f27;border:1px solid var(--mus-edge);color:var(--mus-dim);border-radius:4px;font:600 11px var(--mono);padding:4px 8px;cursor:pointer}
#desk .tabs2{display:flex;gap:4px;padding:8px 10px 0}
#desk .tabs2 button{background:#161b28;border:1px solid var(--mus-edge);color:var(--mus-dim);border-radius:16px;font:600 11px var(--mono);padding:4px 10px;cursor:pointer}
#desk .tabs2 button.on{background:var(--mus-accent);border-color:var(--mus-accent);color:#2a1600}
#desk .dbody{padding:10px 12px 12px;max-height:46vh;overflow:auto}
#desk .dbody p{margin:0 0 8px}
#desk .dbody b{color:#fff}
#desk .obj{display:flex;gap:10px;align-items:center;background:#181c24;border:1px solid var(--mus-edge);border-radius:6px;padding:8px;margin:6px 0;cursor:pointer}
#desk .obj:hover{border-color:var(--mus-accent)}
#desk .obj svg{width:44px;height:44px;flex:none}
#desk .obj .t{flex:1}
#desk .obj .t b{display:block;font-size:13px}
#desk .obj .t span{font-size:12px;color:var(--mus-dim)}
#desk .note{background:#f6e27a;color:#3a3000;font:14px/1.4 "Comic Sans MS","Segoe Print","Bradley Hand",cursive;padding:12px 14px;border-radius:2px;transform:rotate(-1.5deg);box-shadow:0 4px 12px rgba(0,0,0,.5);margin:8px 4px}
#desk .sens{display:flex;gap:14px;align-items:center}
#desk .sens svg{width:120px;height:120px;cursor:grab;flex:none}
#desk .sens .sl{flex:1}
#desk .sens label{display:block;font:11px var(--mono);color:var(--mus-dim);margin-top:8px}
#desk .sens input{width:100%}
.mus-act{display:inline-block;background:#1b2436;border:1px solid var(--mus-accent);color:#ffe0b3;border-radius:6px;padding:5px 10px;margin:2px 6px 6px 0;font:600 12px var(--mono);cursor:pointer}
.mus-act:hover{background:var(--mus-accent);color:#2a1600}

/* the web side: a 2008 desktop browser window, on the desk */
#webside{position:fixed;left:10px;top:44px;z-index:585;width:min(440px,94vw);max-height:calc(100vh - 60px);
  background:#ece9d8;border:1px solid #6a6a6a;border-radius:6px 6px 0 0;box-shadow:0 16px 50px rgba(0,0,0,.7);display:none;flex-direction:column;overflow:hidden;color:#000;font:13px/1.4 Tahoma,Verdana,Arial,sans-serif}
#webside.open{display:flex}
#webside header{display:flex;align-items:center;gap:8px;padding:5px 8px;background:linear-gradient(#5a7fc0,#2b5399);color:#fff;font:700 12px Tahoma,sans-serif}
#webside header span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#webside header button{background:#c9d4ea;border:1px solid #1f3f7a;color:#000;font:700 11px Tahoma,sans-serif;padding:2px 7px}
#webside .addr{display:flex;gap:6px;align-items:center;padding:4px 8px;background:#ece9d8;border-bottom:1px solid #aaa;font-size:11px}
#webside .addr .u{flex:1;background:#fff;border:1px solid #7a7a7a;padding:2px 6px;color:#333;font:11px Tahoma,sans-serif}
#webside .wtabs{display:flex;gap:2px;padding:6px 8px 0;background:#d9e3f5;border-bottom:1px solid #8aa}
#webside .wtabs b{padding:4px 12px;border:1px solid #8aa;border-bottom:none;background:#c5d3ea;cursor:pointer;font-weight:400;font-size:12px}
#webside .wtabs b.on{background:#fff;font-weight:700}
#webside .wbody{background:#fff;overflow:auto;padding:8px;min-height:120px;max-height:36vh}
#webside .wrow{display:flex;gap:6px;align-items:center;padding:5px 4px;border-bottom:1px solid #e3e3e3;cursor:pointer;font-size:12px}
#webside .wrow.unread{font-weight:700}
#webside .wrow .wst{width:14px;flex:none;color:#c90;cursor:pointer}
#webside .wrow .wf{width:110px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#webside .wrow .ws{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#webside .wrow .wd{flex:none;color:#666;font-size:11px}

<script>
"use strict";
/* ==========================================================================
   MODULE 0 — small utilities
   ========================================================================== */
const $id = s => document.getElementById(s);
const $$  = (s,r)=> Array.from((r||document).querySelectorAll(s));
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const pad2  = n => String(n).padStart(2,"0");
const esc   = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd   = (a,b)=> a + Math.random()*(b-a);
const pick  = a => a[Math.floor(Math.random()*a.length)];
const el = (tag,cls,html)=>{ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };
let _uid=1; const uid = p => (p||'id')+'_'+(Date.now().toString(36))+'_'+(_uid++);
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAYS3=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_MS=86400000;
function use24(){ return (typeof Sys!=='undefined' && Sys.settings && Sys.settings.use24); }
function fmtClock(d){ d=d||new Date(); if(use24()) return pad2(d.getHours())+':'+pad2(d.getMinutes()); let h=d.getHours(); const m=pad2(d.getMinutes()); const ap=h<12?'AM':'PM'; h=h%12; if(h===0)h=12; return h+':'+m+' '+ap; }
function fmtClockShort(d){ d=d||new Date(); if(use24()) return pad2(d.getHours())+':'+pad2(d.getMinutes()); let h=d.getHours(); const m=pad2(d.getMinutes()); h=h%12; if(h===0)h=12; return h+':'+m; }
function fmtDate(d){ d=new Date(d); return DAYS3[d.getDay()]+', '+MON3[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function fmtShort(t){ const d=new Date(t), n=new Date(); if(d.toDateString()===n.toDateString()) return fmtClock(d); if(d.getFullYear()!==n.getFullYear()) return MON3[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); return MON3[d.getMonth()]+' '+d.getDate(); }
function dayStart(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function seeded(seed){ let s=(seed*9301+49297)%233280; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); }
function linkify(text){
  /* URLs, phone numbers, geo and mailto — Android's Linkify did the same. links dispatch intents. */
  let h=esc(text);
  h=h.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g,'<span class="lnk" data-uri="$1">$1</span>');
  h=h.replace(/(geo:[-0-9.,]+(?:\?q=[^\s<]+)?)/g,'<span class="lnk" data-uri="$1">$1</span>');
  h=h.replace(/\b(\d{3}[-.\s]\d{3}[-.\s]\d{4})\b/g,'<span class="lnk" data-uri="tel:$1">$1</span>');
  h=h.replace(/\b([a-z0-9._-]+@[a-z0-9.-]+\.[a-z]{2,})\b/gi,'<span class="lnk" data-uri="mailto:$1">$1</span>');
  return h;
}
/* every .lnk anywhere on the screen fires a VIEW intent — nobody needs to know who handles it */
document.addEventListener('click',e=>{
  const l=e.target.closest && e.target.closest('.lnk[data-uri]'); if(!l) return;
  e.stopPropagation(); Intents.start({action:'VIEW',data:l.dataset.uri});
},true);

/* ==========================================================================
   MODULE 13 — STATE MANAGER (LocalStorage). Kept up top so everything can use it.
   ========================================================================== */
const LSP="osmuseum.android10.";
const State={
  data:{},
  load(){ try{ const raw=localStorage.getItem(LSP+"state"); this.data = raw?JSON.parse(raw):{}; }catch(e){ this.data={}; } return this.data; },
  save(){ try{ localStorage.setItem(LSP+"state", JSON.stringify(this.data)); }catch(e){ /* full — the storage model has consequences too */ } },
  get(k,def){ return (k in this.data)? this.data[k] : def; },
  set(k,v){ this.data[k]=v; this.soon(); },
  _t:null,
  soon(){ clearTimeout(this._t); this._t=setTimeout(()=>this.save(),350); },
  eraseAll(){ try{ localStorage.removeItem(LSP+"state"); }catch(e){} this.data={}; }
};

/* ==========================================================================
   MODULE 12 — SOUND MANAGER (synthesized; toggleable; the rocker sets volume)
   ========================================================================== */
const Sound={
  ctx:null, on:false, vol:5, /* 0..7 ringer volume, 0 = silent mode */
  init(){ this.on=!!State.get('sound',false); this.vol=State.get('ringerVol',5); },
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  audible(){ return this.on && this.vol>0; },
  gain(){ return 0.05+0.13*(this.vol/7); },
  set(v){ this.on=v; State.set('sound',v); },
  setVol(v){ this.vol=clamp(v,0,7); State.set('ringerVol',this.vol); },
  tone(freq,dur,type,vol,slideTo,when){
    if(!this.audible()) return; const c=this.ensure(); if(!c) return;
    const t=c.currentTime+(when||0), o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    const v=(vol||1)*this.gain();
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.03);
  },
  noise(dur,vol,hp){
    if(!this.audible()) return; const c=this.ensure(); if(!c) return;
    const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s=c.createBufferSource(); s.buffer=b; const g=c.createGain(); g.gain.value=(vol||1)*this.gain()*1.6;
    const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||1200;
    s.connect(f).connect(g).connect(c.destination); s.start();
  },
  key(){ this.tone(1800,0.018,'square',0.35); },       /* the keyboard click */
  tock(){ this.tone(900,0.02,'square',0.3); },          /* trackball tick */
  lock(){ this.tone(520,0.07,'sine',0.7,300); },
  unlock(){ this.tone(300,0.08,'sine',0.7,620); },
  shutter(){ this.noise(0.04,1.1,1500); setTimeout(()=>this.noise(0.06,0.8,900),70); },
  focus(){ this.tone(1500,0.05,'sine',0.5); this.tone(1500,0.05,'sine',0.5,null,0.09); },
  notify(){ /* the 1.0 notification tone: a short two-note pip */ this.tone(1244,0.09,'sine',0.9); this.tone(1661,0.14,'sine',0.9,null,0.1); },
  sent(){ this.tone(700,0.07,'sine',0.7,1100); },
  ring(){ /* a period ringtone: eight notes of marimba-ish triangle, repeats via caller */
    if(!this.audible()) return; const seq=[659,784,880,784,659,587,659,0]; seq.forEach((f,i)=>{ if(f) this.tone(f,0.16,'triangle',0.9,null,i*0.19); });
  },
  alarm(){ if(!this.audible()) return; [0,0.25,0.5].forEach(t=>this.tone(1046,0.12,'square',0.5,null,t)); },
  dtmf(k){
    const row={'1':697,'2':697,'3':697,'4':770,'5':770,'6':770,'7':852,'8':852,'9':852,'*':941,'0':941,'#':941};
    const col={'1':1209,'2':1336,'3':1477,'4':1209,'5':1336,'6':1477,'7':1209,'8':1336,'9':1477,'*':1209,'0':1336,'#':1477};
    if(!(k in row))return; this.tone(row[k],0.12,'sine',0.5); this.tone(col[k],0.12,'sine',0.5);
  },
  /* a tiny sequencer for Music — per-track seed, bass + lead, stops when asked */
  _seq:null,
  playSeq(seed){ this.stopSeq(); if(!this.audible()) return; const r=seeded(seed); const scale=[0,2,4,7,9,12,14,16]; const base=[196,220,247,262][Math.floor(r()*4)];
    let step=0; const bpm=92+Math.floor(r()*40); const tick=()=>{ if(!this.audible()){ this.stopSeq(); return; }
      const c=this.ensure(); if(!c) return; const t=c.currentTime;
      if(step%2===0) this.tone(base/2*(step%8===0?1:(r()<.3?1.5:1)),0.22,'triangle',0.7);
      if(r()<.8) this.tone(base*Math.pow(2,scale[Math.floor(r()*scale.length)]/12),0.16,'square',0.25);
      if(step%4===2) this.noise(0.03,0.5,3000);
      step++; };
    this._seq=setInterval(tick, 60000/bpm/2); tick(); },
  stopSeq(){ if(this._seq){ clearInterval(this._seq); this._seq=null; } }
};

/* ==========================================================================
   MODULE 10 — STORAGE MODEL. 256 MB of flash, about 74 MB of it available to
   applications and their data, and applications install only to internal
   storage. Running out is a permanent, ambient condition of owning this phone.
   ========================================================================== */
const Storage={
  TOTAL_KB: 74*1024,            /* what the 1.0 data partition left for you */
  LOW_KB: 12*1024,              /* the threshold below which the system complains */
  SD_TOTAL_KB: 968*1024,        /* the microSD card in the box */
  used:{},                      /* bucket -> KB (per package, caches, etc.) */
  sdUsed:0,
  init(){ this.used=State.get('storageUsed',null)||this.defaults(); this.sdUsed=State.get('sdUsed',140*1024); },
  defaults(){ return { 'sys.dalvik-cache':16200, 'sys.gmail':5100, 'sys.browser.cache':2400, 'sys.maps.cache':6800, 'sys.market':900, 'sys.messaging':1100, 'sys.contacts':2300, 'sys.calendar':1400, 'sys.talk':600, 'sys.youtube':400, 'sys.music':500, 'sys.settings':300, 'sys.misc':7700 }; },
  save(){ State.set('storageUsed',this.used); State.set('sdUsed',this.sdUsed); },
  usedKB(){ let s=0; for(const k in this.used) s+=this.used[k]; return s; },
  freeKB(){ return Math.max(0,this.TOTAL_KB-this.usedKB()); },
  isLow(){ return this.freeKB()<this.LOW_KB; },
  fmt(kb){ return kb>=1024? (kb/1024).toFixed(kb>=10240?0:1)+'MB' : Math.round(kb)+'KB'; },
  canFit(kb){ return this.freeKB()>=kb+1024; },
  /* consume returns false (and does nothing) if it will not fit */
  consume(bucket,kb,silent){ if(kb>0 && !this.canFit(kb)) return false; this.used[bucket]=(this.used[bucket]||0)+kb; this.save(); this.check(silent); return true; },
  release(bucket,kb){ if(kb==null) delete this.used[bucket]; else this.used[bucket]=Math.max(0,(this.used[bucket]||0)-kb); this.save(); this.check(); },
  sdConsume(kb){ this.sdUsed+=kb; this.save(); },
  _lowPosted:false,
  check(silent){
    if(this.isLow()){
      if(!this._lowPosted){
        this._lowPosted=true;
        Notif.post({ id:'sys.lowspace', pkg:'system', icon:ICON.st.lowspace, ticker:'Low on space', title:'Low on space', text:'Phone storage space is getting low.', ongoing:true, intent:{action:'MANAGE_APPS'} });
        Guide.mark('lowspace');
      }
    } else if(this._lowPosted){ this._lowPosted=false; Notif.cancel('sys.lowspace'); }
  }
};

/* ==========================================================================
   MODULE 1 — INTENT REGISTRY AND ACTIVITY STACK.
   Built first, because it is what makes this a system rather than screens.

const Registry={
  pkgs:{},                       /* pkg -> record */
  defaults: {},                  /* action|type-or-scheme -> component id */
  listeners:[],
  register(rec){

  unregister(pkg){ const rec=this.pkgs[pkg]; if(!rec) return; delete this.pkgs[pkg];

    State.set('intentDefaults',this.defaults); this.listeners.forEach(f=>f('remove',rec)); },
  onChange(f){ this.listeners.push(f); },
  get(pkg){ return this.pkgs[pkg]; },
  component(id){ const [pkg,name]=id.split('/'); const r=this.pkgs[pkg]; return r && r.activities.find(a=>a.name===name); },

  launcherApps(){ const out=[]; for(const p in this.pkgs) this.pkgs[p].activities.forEach(a=>{ if(a.launcher) out.push(a); }); return out.sort((a,b)=>a.label.localeCompare(b.label)); },
  widgets(){ const out=[]; for(const p in this.pkgs) out.push(...this.pkgs[p].widgets); return out; },
  /* --- resolution --- */

/* The activity: a screen with a lifecycle. Applications subclass this. */
class Activity{
  constructor(intent,comp){ this.intent=intent||{}; this.comp=comp; this.pkg=comp.pkg; this.root=el('div','act'); this.root.dataset.pkg=comp.pkg; this.title=comp.label; this.state={}; this.dead=false; this.result=null; this.reqCode=null; this.caller=null; this.observers=[]; this.timers=[]; }
  onCreate(saved){}   onResume(){}   onPause(){}   onDestroy(){}
  onSaveState(){ return this.state; }
  onBack(){ return false; }           /* return true to consume */
  onMenu(){ return []; }              /* [{label, icon, onClick, disabled}] */
  onKey(key,mods){ return false; }    /* physical keyboard, when no field took it */
  onTrackball(dir){ return false; }   /* 'up' 'down' 'left' 'right' 'click' — false = default focus traversal */
  onResult(code,result){}
  onNewIntent(intent){}
  onLayout(){}                        /* orientation changed and this activity is on top */
  get orientation(){ return this.comp.orientation||null; }   /* 'landscape' forces it */
  get fullscreen(){ return !!this.comp.fullscreen; }
  finish(result){ Stack.finish(this,result); }
  setTitle(t){ this.title=t; const tb=this.root.querySelector('.tb'); if(tb){ const r=tb.querySelector('.r'); tb.textContent=t; if(r) tb.appendChild(r); } }
  startActivity(intent){ return Intents.start(intent,this); }
  startActivityForResult(intent,code){ return Intents.start(intent,this,code); }
  setResult(r){ this.result=r; }
  observe(name,cb){ Content.observe(name,cb,this); this.observers.push([name,cb]); }
  every(ms,fn){ const t=setInterval(fn,ms); this.timers.push(t); return t; }
  later(ms,fn){ const t=setTimeout(fn,ms); this.timers.push(t); return t; }
  _teardown(){ this.observers.forEach(([n,cb])=>Content.unobserve(n,cb)); this.observers=[]; this.timers.forEach(clearTimeout); this.timers.forEach(clearInterval); this.timers=[]; }
  /* helpers every screen uses */
  titlebar(text,right){ const tb=el('div','tb'); tb.textContent=text||this.title; if(right){ const r=el('span','r',right); tb.appendChild(r); } this.root.appendChild(tb); return tb; }
  bodyEl(cls){ const b=el('div','body'+(cls?' '+cls:'')); this.root.appendChild(b); return b; }
}

/* Tasks and the back stack. A task is a stack of activities that may belong to
   different applications: open a link in a message and the browser's screen

const Stack={

  starting:null,
  init(){ this.el=$id('acts'); },
  top(){ return this.cur && this.cur.acts[this.cur.acts.length-1] || null; },
  current(){ const t=this.top(); return t || this.launcher; },

  /* start a resolved component */

        const top=task.acts[task.acts.length-1]; if(top.comp===comp){ const prev=this.top(); if(prev&&prev!==top) this.pause(prev); this.bringToFront(task); top.onNewIntent(intent); this.show(top,false); return top; } }

  pause(act){ if(!act||act.paused) return; act.paused=true; try{ act.onPause(); }catch(e){} },

  showHome(){ this.el.innerHTML=''; Display.applyActivity(this.launcher); this.el.appendChild(this.launcher.root); this.resume(this.launcher); Menu.close(); Input.refocus(this.launcher); try{ this.launcher.onLayout(); }catch(e){} },

/* Intents: implicit resolution, the chooser, defaults. */
const Intents={
  /* launch a package by name the way the system does: through its launcher activity */
  launch(pkg){ if(Stack.resumeTask(pkg)) return Stack.top(); const c=Registry.launcherApps().find(a=>a.pkg===pkg); if(!c){ AToast.show('Application not found.'); return null; } return Stack.start(c,{action:'MAIN',category:'LAUNCHER'},null,null); },
  start(intent,from,reqCode){
    intent=Object.assign({},intent); if(intent.pkg && !intent.action) return this.launch(intent.pkg); if(!intent.action) intent.action='VIEW';
    /* an implicit start from the foreground joins the caller's task; an explicit null caller (a notification) starts fresh */
    if(from===undefined) from=Stack.top();
    if(from && from.root && !from.root.isConnected && from!==Stack.launcher) from=Stack.current();
    if(intent.action==='CHOOSER'){ const inner=intent.target; const m=Registry.resolve(inner); return this.chooser(m,inner,from,reqCode,intent.title||'Share via',true); }
    const matches=Registry.resolve(intent);
    if(!matches.length){ AToast.show('No application can perform this action.'); return null; }
    if(matches.length===1) return Stack.start(matches[0],intent,from,reqCode);
    const def=Registry.defaults[Registry.defaultKey(intent)];
    if(def){ const c=matches.find(m=>m.id===def); if(c) return Stack.start(c,intent,from,reqCode); }
    return this.chooser(matches,intent,from,reqCode,'Complete action using',false);
  },
  /* the "Complete action using…" dialog falls out of the registry for free */
  chooser(matches,intent,from,reqCode,title,isShare){
    if(!matches.length){ AToast.show('No application can perform this action.'); return null; }
    if(matches.length===1 && isShare) return Stack.start(matches[0],intent,from,reqCode);
    Guide.mark(isShare?'share':'chooser');
    const appLabel=m=>{ const r=Registry.get(m.pkg); return (r&&r.label)||m.label; };
    matches=matches.slice().sort((a,b)=>appLabel(a).localeCompare(appLabel(b)));
    Dialog.show({ title, items:matches.map(m=>({label:appLabel(m),icon:(Registry.get(m.pkg)||m).icon,value:m})), checkbox: isShare?null:{label:'Use by default for this action.',checked:false},
      onItem:(it,chk)=>{ if(chk) Registry.setDefault(intent,it.value.id); Stack.start(it.value,intent,from,reqCode); } });
    return null;
  },
  send(text,subject,from){ return this.start({action:'CHOOSER',title:'Share via',target:{action:'SEND',type:'text/plain',extras:{text,subject}}},from); },
  sendImage(imageId,from){ return this.start({action:'CHOOSER',title:'Share picture via',target:{action:'SEND',type:'image/jpeg',extras:{image:imageId}}},from); }

/* ==========================================================================

   modal. Any application can post one through this service, and nothing
   about the posting application is special-cased.

const Notif={

  init(){
    this.list=State.get('notifs',[]);
    this.sb=$id('statusbar'); this.icons=$id('sbIcons'); this.ticker=$id('sbTicker'); this.right=$id('sbRight');
    this.shade=$id('shade'); this.listEl=$id('shadeList');
    $id('shadeClear').onclick=()=>{ this.cancelAll(); };
    this.renderIcons(); this.renderShade(); this.renderRight();

  save(){ State.set('notifs',this.list); },

    this.save(); this.renderIcons(); this.renderShade();
    if(n.ticker && !(existed && n.quiet)) this.tick(n);
    if(n.sound!==false && !(existed && n.quiet)) Sound.notify();
