<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeXTSTEP 3.3</title>
<meta name="description" content="An interactive front-end simulation of NeXTSTEP 3.3. Nothing real runs — a museum exhibit in the browser, in one file.">
<style>
/* ============================================================
   NeXTSTEP 3.3 simulation — Display PostScript grey language
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
  font-size:12px;
  background:#000;
  cursor:default;
  -webkit-user-select:none;user-select:none;
  color:#000;
}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;}
#screen{position:absolute;inset:0;background:#575757;overflow:hidden;}

/* ---- the NeXT chisel ---------------------------------------- */
.rz{border-style:solid;border-width:2px;border-color:#fff #4d4d4d #4d4d4d #fff;background:#a8a8a8;}
.sz{border-style:solid;border-width:2px;border-color:#4d4d4d #fff #fff #4d4d4d;background:#a8a8a8;}
.rz1{border-style:solid;border-width:1px;border-color:#fff #4d4d4d #4d4d4d #fff;}
.sz1{border-style:solid;border-width:1px;border-color:#4d4d4d #fff #fff #4d4d4d;}

/* ---- buttons -------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:68px;height:24px;padding:0 10px;
  border-style:solid;border-width:2px;border-color:#fff #4d4d4d #4d4d4d #fff;
  background:#a8a8a8;font:12px Helvetica,Arial,sans-serif;color:#000;
  cursor:default;white-space:nowrap;
}
.btn:active,.btn.pressed{border-color:#4d4d4d #fff #fff #4d4d4d;background:#909090;}
.btn.default .ret{margin-left:8px;font-size:11px;color:#333;}
.btn[disabled],.btn.disabled{color:#666;pointer-events:none;}
.btn.sq{min-width:24px;padding:0;}

/* ---- text fields ---------------------------------------------- */
.tf{
  height:21px;padding:2px 4px;background:#fff;color:#000;
  border-style:solid;border-width:2px;border-color:#4d4d4d #fff #fff #4d4d4d;
  font:12px Helvetica,Arial,sans-serif;outline:none;width:100%;
}
.tf:focus{background:#fff;}
label.fl{font-size:12px;color:#000;}

/* ---- windows --------------------------------------------------- */
.win{
  position:absolute;background:#a8a8a8;
  border:1px solid #000;
  box-shadow:6px 6px 0 rgba(0,0,0,.45);
  display:flex;flex-direction:column;
}
.win.nofocuslook{}
.win .tb{
  height:21px;flex:0 0 21px;background:#6f6f6f;color:#fff;
  display:flex;align-items:center;
  border-bottom:1px solid #000;
  border-top:1px solid #b5b5b5;
  padding:0 3px;position:relative;
}
.win.key .tb{background:#000;border-top:1px solid #4a4a4a;}
.win .tb .ttl{
  flex:1;text-align:center;font-weight:bold;font-size:12px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;
}
.tbbtn{
  width:15px;height:15px;flex:0 0 15px;
  border-style:solid;border-width:1px;border-color:#d9d9d9 #3d3d3d #3d3d3d #d9d9d9;
  background:#a8a8a8;position:relative;
}
.tbbtn:active{border-color:#3d3d3d #d9d9d9 #d9d9d9 #3d3d3d;background:#8a8a8a;}
.tbbtn.mini::after{ /* miniaturize: small sunken bar/dot */
  content:'';position:absolute;left:3px;right:3px;top:5px;height:3px;
  border:1px solid;border-color:#3d3d3d #d9d9d9 #d9d9d9 #3d3d3d;background:#a8a8a8;
}
.tbbtn.close::before,.tbbtn.close::after{
  content:'';position:absolute;left:2px;top:6px;width:9px;height:1.6px;background:#222;
  box-shadow:0 1px 0 rgba(255,255,255,.5);
}
.tbbtn.close::before{transform:rotate(45deg);}
.tbbtn.close::after{transform:rotate(-45deg);}
.tbbtn.dirty::before,.tbbtn.dirty::after{background:#555;height:1.4px;}
.win .cnt{flex:1;position:relative;overflow:hidden;background:#a8a8a8;
  border-left:1px solid #c9c9c9;border-right:1px solid #494949;}
.win .rbar{
  height:9px;flex:0 0 9px;display:flex;background:#a8a8a8;
  border-top:1px solid #000;
}
.win .rbar>div{
  border-style:solid;border-width:1px;border-color:#e2e2e2 #3d3d3d #3d3d3d #e2e2e2;
  background:#a8a8a8;
}
.win .rbar .rl,.win .rbar .rr{width:30px;flex:0 0 30px;cursor:nwse-resize;}
.win .rbar .rl{cursor:nesw-resize;}
.win .rbar .rm{flex:1;margin:0 2px;cursor:ns-resize;}
.win.nores .rbar{display:none;}
.win.panelw .tb{height:17px;flex-basis:17px;}
.win.panelw .tb .ttl{font-weight:normal;font-size:11px;}

/* ---- miniwindows ------------------------------------------------ */
#miniwins{position:absolute;left:2px;bottom:2px;right:80px;height:66px;
  display:flex;align-items:flex-end;gap:4px;pointer-events:none;z-index:4000;}
.miniwin{
  width:64px;height:64px;pointer-events:auto;position:relative;
  border-style:solid;border-width:2px;border-color:#fff #4d4d4d #4d4d4d #fff;
  background:#a8a8a8;display:flex;flex-direction:column;align-items:center;
  box-shadow:3px 3px 0 rgba(0,0,0,.4);
}
.miniwin .mwicon{flex:1;display:flex;align-items:center;justify-content:center;padding-top:3px;}
.miniwin .mwttl{font-size:9px;width:58px;text-align:center;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding-bottom:2px;}

/* ---- menus ------------------------------------------------------- */
.menu{
  position:absolute;background:#a8a8a8;border:1px solid #000;
  box-shadow:6px 6px 0 rgba(0,0,0,.45);width:170px;z-index:6000;
}
.menu .mtitle{
  height:20px;background:#000;color:#fff;font-weight:bold;font-size:12px;
  line-height:19px;padding:0 7px;position:relative;
  border-bottom:1px solid #000;
}
.menu .mtitle .mclose{
  position:absolute;right:2px;top:2px;width:15px;height:15px;
  border:1px solid;border-color:#d9d9d9 #3d3d3d #3d3d3d #d9d9d9;background:#a8a8a8;
}
.menu .mtitle .mclose::before,.menu .mtitle .mclose::after{
  content:'';position:absolute;left:2px;top:6px;width:9px;height:1.5px;background:#222;}
.menu .mtitle .mclose::before{transform:rotate(45deg);}
.menu .mtitle .mclose::after{transform:rotate(-45deg);}
.menu .mi{
  height:21px;line-height:17px;padding:1px 7px;display:flex;align-items:center;
  border-style:solid;border-width:1px;border-color:#c9c9c9 #7a7a7a #7a7a7a #c9c9c9;
  background:#a8a8a8;font-size:12px;position:relative;
}
.menu .mi .lbl{flex:1;overflow:hidden;white-space:nowrap;}
.menu .mi .keq{color:#222;margin-left:8px;font-size:11px;}
.menu .mi .sub{
  width:0;height:0;margin-left:8px;
  border-top:5px solid transparent;border-bottom:5px solid transparent;
  border-left:8px solid #3a3a3a;
}
.menu .mi:hover{background:#b9b9b9;}
.menu .mi.open,.menu .mi:active{
  border-color:#4d4d4d #fff #fff #4d4d4d;background:#8f8f8f;color:#fff;
}
.menu .mi.open .sub{border-left-color:#eee;}
.menu .mi.open .keq{color:#eee;}
.menu .mi.disabled{color:#6e6e6e;pointer-events:none;}

/* ---- dock --------------------------------------------------------- */
#dock{position:absolute;top:0;right:0;width:70px;z-index:5000;
  display:flex;flex-direction:column;align-items:center;padding:3px 3px;gap:0;}
.dtile{
  width:64px;height:64px;position:relative;flex:0 0 64px;
  border-style:solid;border-width:2px;border-color:#fff #4d4d4d #4d4d4d #fff;
  background:#a8a8a8;display:flex;align-items:center;justify-content:center;
}
.dtile .dots{ /* the "not running" three-dots badge */
  position:absolute;left:7px;bottom:7px;width:4px;height:4px;
  background:#000;border-radius:50%;
  box-shadow:7px 0 0 #000,14px 0 0 #000,0 -1px 0 rgba(255,255,255,.35),
    7px -1px 0 rgba(255,255,255,.35),14px -1px 0 rgba(255,255,255,.35);
  font-size:0;
}
.dtile.dragover{background:#c8c8c8;}

/* ---- scrollers (LEFT side, arrows grouped at bottom) --------------- */
.sv{position:absolute;inset:0;display:flex;}
.scroller{
  width:19px;flex:0 0 19px;background:#6a6a6a;position:relative;
  border-right:1px solid #000;display:flex;flex-direction:column;
}
.scroller .strack{flex:1;position:relative;background:#6a6a6a;
  background-image:repeating-conic-gradient(#6f6f6f 0 25%,#646464 0 50%);
  background-size:2px 2px;}
.sknob{
  position:absolute;left:1px;right:1px;min-height:18px;
  border-style:solid;border-width:1px;border-color:#e0e0e0 #3d3d3d #3d3d3d #e0e0e0;
  background:#a8a8a8;
}
.sknob::after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;
  margin:-4px 0 0 -4px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#8a8a8a 70%);
  border:1px solid #555;}
.sbtns{flex:0 0 36px;display:flex;flex-direction:column;}
.sbtn{
  flex:1;position:relative;
  border-style:solid;border-width:1px;border-color:#e0e0e0 #3d3d3d #3d3d3d #e0e0e0;
  background:#a8a8a8;
}
.sbtn:active{border-color:#3d3d3d #e0e0e0 #e0e0e0 #3d3d3d;background:#8f8f8f;}
.sbtn::after{content:'';position:absolute;left:50%;top:50%;width:0;height:0;margin:-4px 0 0 -5px;
  border-left:5px solid transparent;border-right:5px solid transparent;}
.sbtn.up::after{border-bottom:8px solid #333;}
.sbtn.dn::after{border-top:8px solid #333;margin-top:-3px;}
.svc{flex:1;position:relative;overflow:hidden;background:#fff;}
.svc .svinner{position:absolute;left:0;top:0;right:0;}
.sv.gray .svc{background:#a8a8a8;}

/* ---- browser (Miller columns) --------------------------------------- */
.browser{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;
  background:#a8a8a8;display:flex;
  border-style:solid;border-width:2px;border-color:#4d4d4d #fff #fff #4d4d4d;}
.bcol{width:170px;flex:0 0 170px;position:relative;border-right:1px solid #000;background:#fff;}
.brow{height:18px;line-height:18px;padding:0 4px 0 4px;display:flex;align-items:center;
  white-space:nowrap;overflow:hidden;background:#fff;font-size:12px;}
.brow .bico{width:16px;flex:0 0 16px;margin-right:3px;display:flex;align-items:center;}
.brow .bname{flex:1;overflow:hidden;text-overflow:ellipsis;}
.brow .barr{width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;
  border-left:7px solid #444;margin-left:4px;}
.brow.sel{background:#7d7d7d;color:#fff;}
.brow.sel .barr{border-left-color:#fff;}

/* ---- shelf & path row ------------------------------------------------- */
.shelf{
  height:76px;background:#a8a8a8;display:flex;align-items:center;gap:2px;padding:2px 4px;
  border-style:solid;border-width:2px;border-color:#4d4d4d #fff #fff #4d4d4d;
  overflow:hidden;
}
.shelfslot{width:68px;height:68px;flex:0 0 68px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;}
.shelfslot.filled:hover{background:#b5b5b5;}
.shelfslot .slbl{font-size:10px;max-width:64px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.pathrow{height:76px;display:flex;align-items:center;padding:2px 6px;gap:6px;overflow:hidden;
  background:#a8a8a8;}
.pathitem{width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;}
.pathitem .plbl{font-size:10px;max-width:62px;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;}
.pathitem.cur .plbl{font-weight:bold;}

/* ---- icon view / list view ------------------------------------------- */
.iconview{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:8px;}
.ivitem{width:76px;display:flex;flex-direction:column;align-items:center;padding:3px 0;}
.ivitem .ivlbl{font-size:11px;max-width:74px;text-align:center;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding:0 2px;}
.ivitem.sel .ivlbl{background:#3a3a3a;color:#fff;}
.listview{font-size:12px;}
.lvrow{height:17px;line-height:17px;display:flex;padding:0 6px;white-space:nowrap;}
.lvrow.hdr{font-weight:bold;border-bottom:1px solid #777;background:#a8a8a8;
  position:sticky;top:0;}
.lvrow.sel{background:#7d7d7d;color:#fff;}
.lvrow .c1{flex:1;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;}
.lvrow .c2{width:70px;flex:0 0 70px;text-align:right;}
.lvrow .c3{width:110px;flex:0 0 110px;text-align:right;padding-right:4px;}

/* ---- alert / attention panels ----------------------------------------- */
.alertbody{display:flex;padding:14px 16px 10px 14px;gap:14px;}
.alertbody .aicon{flex:0 0 52px;}
.alertbody .amsg .m1{font-weight:bold;font-size:13px;margin-bottom:8px;}
.alertbody .amsg .m2{font-size:12px;line-height:1.35;}
.alertbtns{display:flex;justify-content:flex-end;gap:10px;padding:6px 14px 12px;}

/* ---- boot & login ------------------------------------------------------ */
#bootscreen{
  position:absolute;inset:0;background:#000;color:#d8d8d8;z-index:11000;
  font:13px 'Ohlfs','Lucida Console',Monaco,monospace;
  padding:18px 22px;white-space:pre-wrap;overflow:hidden;
}
#bootscreen .rom{color:#9f9f9f;}
#loginback{position:absolute;inset:0;background:#575757;z-index:10500;}
.shake{animation:lshake .42s linear;}
@keyframes lshake{
  0%{transform:translateX(0)}12%{transform:translateX(-22px)}
  30%{transform:translateX(20px)}48%{transform:translateX(-14px)}
  64%{transform:translateX(10px)}80%{transform:translateX(-6px)}
  100%{transform:translateX(0)}
}

/* ---- terminal ----------------------------------------------------------- */
.termtext{
  font:12px 'Ohlfs','Lucida Console',Monaco,monospace;color:#000;background:#fff;
  padding:2px 4px;white-space:pre-wrap;word-break:break-all;line-height:1.25;
  min-height:100%;
}
.termtext .cursor{background:#000;color:#fff;}

/* ---- misc ---------------------------------------------------------------- */
.popup{ /* NeXT pop-up list button */
  display:inline-flex;align-items:center;height:22px;padding:0 8px;min-width:120px;
  border-style:solid;border-width:2px;border-color:#fff #4d4d4d #4d4d4d #fff;
  background:#a8a8a8;position:relative;
}
.popup .pv{flex:1;}
.popup .pmark{width:12px;height:8px;margin-left:8px;
  border-style:solid;border-width:1px;border-color:#e0e0e0 #3d3d3d #3d3d3d #e0e0e0;
  background:#a8a8a8;}
.popuplist{position:absolute;background:#a8a8a8;border:1px solid #000;z-index:7000;
  box-shadow:5px 5px 0 rgba(0,0,0,.45);}
.popuplist .pli{height:20px;line-height:20px;padding:0 10px;white-space:nowrap;}
.popuplist .pli:hover{background:#7d7d7d;color:#fff;}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;}
.chk .box{width:14px;height:14px;background:#fff;display:inline-flex;align-items:center;
  justify-content:center;border-style:solid;border-width:2px;
  border-color:#4d4d4d #fff #fff #4d4d4d;font-size:11px;font-weight:bold;color:#000;}
.hsep{height:0;border-top:1px solid #7a7a7a;border-bottom:1px solid #d8d8d8;margin:6px 0;}
.dragghost{position:absolute;z-index:9500;pointer-events:none;opacity:.85;
  display:flex;flex-direction:column;align-items:center;}
.dragghost .badge{position:absolute;right:-6px;bottom:8px;width:16px;height:16px;
  background:#fff;border:1px solid #000;border-radius:50%;color:#000;font-weight:bold;
  font-size:13px;line-height:14px;text-align:center;}
#saver{position:absolute;inset:0;z-index:12000;background:#000;}
#saver canvas{position:absolute;inset:0;}
.helpcursor,.helpcursor *{cursor:help !important;}
::selection{background:#7d7d7d;color:#fff;}
.mono{font-family:'Ohlfs','Lucida Console',Monaco,monospace;}
</style>
</head>
<body>
<div id="screen">
  <div id="desktop"></div>
  <div id="miniwins"></div>
  <div id="dock" style="display:none"></div>
</div>
<div id="saver" style="display:none"><canvas id="saverc"></canvas></div>
<div id="bootscreen"></div>
<noscript><p style="color:#ccc;font-family:monospace;padding:20px">This NeXTSTEP 3.3 simulation requires JavaScript.</p></noscript>
<script>
'use strict';
/* =====================================================================
   Core utilities
   ===================================================================== */
const $=s=>document.querySelector(s);
function el(tag,cls,parent,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!=null)e.textContent=text;
  if(parent)parent.appendChild(e);
  return e;
}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function fmtSize(n){
  if(n>=1048576)return (n/1048576).toFixed(1)+' MB';
  if(n>=1024)return Math.round(n/1024)+' KB';
  return n+' bytes';
}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){
  d=new Date(d);
  return MONTHS[d.getMonth()]+' '+d.getDate()+' '+d.getFullYear();
}
function isCmd(ev){return ev.metaKey||ev.altKey;}

/* =====================================================================
   StateManager — LocalStorage persistence
   ===================================================================== */
const State={
  KEY:'nextstep33-sim',
  data:null,
  load(){
    try{this.data=JSON.parse(localStorage.getItem(this.KEY))||{};}
    catch(e){this.data={};}
    return this.data;
  },
  get(k,dflt){
    if(!this.data)this.load();
    return (k in this.data)?this.data[k]:dflt;
  },
  set(k,v){
    if(!this.data)this.load();
    this.data[k]=v;
    this.flush();
  },
  flush(){
    try{localStorage.setItem(this.KEY,JSON.stringify(this.data));}catch(e){}
  },
  reset(){this.data={};try{localStorage.removeItem(this.KEY);}catch(e){}}
};
State.load();

/* =====================================================================
   SoundManager — synthesized system beep & tones (Web Audio)
   ===================================================================== */
const Sound={
  ctx:null,
  enabled:State.get('beepOn',true),
  volume:State.get('beepVol',0.5),
  ac(){
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC)this.ctx=new AC();
    }
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
    return this.ctx;
  },
  beep(){ // the low wooden "basso"-style system thunk
    if(!this.enabled)return;
    this.tone([[98,0,.28],[65,0,.3]],.28,'triangle');
  },
  tone(partials,dur,type){
    const ctx=this.ac();if(!ctx)return;
    const t=ctx.currentTime;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(this.volume*.6+.001,t+.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    g.connect(ctx.destination);
    partials.forEach(p=>{
      const o=ctx.createOscillator();
      o.type=type||'sine';o.frequency.value=p[0];
      o.connect(g);o.start(t+p[1]);o.stop(t+dur+.02);
    });
  },
  play(name){ // SoundPlayer tones
    if(name==='Basso')this.beep();
    else if(name==='Frog')this.tone([[220,0,.1],[180,.06,.12]],.22,'square');
    else if(name==='Pop')this.tone([[520,0,.05]],.09,'sine');
    else if(name==='Bell')this.tone([[880,0,.5],[1318,0,.4]],.6,'sine');
    else this.beep();
  }
};

/* =====================================================================
   Icons — all artwork generated in code (inline SVG)
   ===================================================================== */
const Icons={
  /* returns an element containing a 3D-looking icon tile */
  make(name,size){
    size=size||48;
    const d=el('div');
    d.style.width=d.style.height=size+'px';
    d.style.flex='0 0 '+size+'px';
    d.innerHTML=this.svg(name,size);
    const s=d.firstChild;
    if(s){s.setAttribute('width',size);s.setAttribute('height',size);}
    return d;
  },
  svg(name,size){
    const b=this.art[name]||this.art.file;
    return '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">'+b()+'</svg>';
  },
  tile(inner){ // classic app tile: beveled grey square
    return '<rect x="1" y="1" width="46" height="46" fill="#a8a8a8"/>'+
      '<path d="M1 1h46v2H3v42H1z" fill="#e6e6e6"/>'+
      '<path d="M47 1v46H1v-2h44V1z" fill="#4c4c4c"/>'+
      '<rect x="1" y="1" width="46" height="46" fill="none" stroke="#000" stroke-width="1"/>'+inner;
  },
  art:{
    /* ------ system ------- */
    computer(){ // NeXT-flavored dark slab workstation (original artwork)
      return Icons.tile(
        '<g><rect x="10" y="8" width="28" height="26" fill="#1a1a1a" stroke="#000"/>'+
        '<rect x="12" y="10" width="24" height="18" fill="#3c4148"/>'+
        '<rect x="13" y="11" width="22" height="16" fill="#5b6672"/>'+
        '<rect x="14" y="12" width="9" height="6" fill="#8f9aa6" opacity=".8"/>'+
        '<rect x="12" y="30" width="24" height="2" fill="#0c0c0c"/>'+
        '<rect x="8" y="36" width="32" height="5" fill="#222" stroke="#000"/>'+
        '<rect x="10" y="37" width="18" height="2" fill="#444"/></g>');
    },
    recycler(){ // black-hole style swirl, drawn originally

/* map file node -> icon name */
function iconFor(node){
  if(!node)return 'file';
  if(node.icon)return node.icon;
  if(node.type==='app')return appIconName(node.name);
  if(node.type==='dir'){
    if(node.name==='me'&&node.parent&&!node.parent.parent)return 'home';
    return 'folder';
  }
  const n=node.name.toLowerCase();
  if(n.endsWith('.rtf')||n.endsWith('.rtfd'))return 'rtf';
  if(n.endsWith('.tiff')||n.endsWith('.tif'))return 'tiff';
  if(n.endsWith('.eps')||n.endsWith('.ps'))return 'eps';
  if(n.endsWith('.nib'))return 'nib';
  if(n.endsWith('.snd'))return 'sound';
  return 'file';
}
function appIconName(appFile){
  const m={'Edit.app':'edit','Mail.app':'mail','Preview.app':'preview','Terminal.app':'terminal',
    'Preferences.app':'preferences','Librarian.app':'librarian','Webster.app':'webster',
    'PrintManager.app':'printer','InterfaceBuilder.app':'ib','ProjectBuilder.app':'pb',
    'BackSpace.app':'backspace','Scene.app':'scene','Console.app':'console'};
  return m[appFile]||'app';
}

/* =====================================================================
   WindowServer analog — windows, key window, miniwindows, resize bar
   ===================================================================== */
const WS={
  wins:[],zTop:100,keyWin:null,
  desktop(){return $('#desktop');},
  create(o){
    const w=new NXWin(o);
    this.wins.push(w);
    this.makeKey(w);
    return w;
  },
  makeKey(w){
    if(this.keyWin===w&&w)return;
    if(this.keyWin)this.keyWin.el.classList.remove('key');
    this.keyWin=w;
    if(w){
      w.el.classList.add('key');
      w.el.style.zIndex=++this.zTop;
      if(w.app)Apps.activate(w.app,true);
      if(w.onKey)w.onKey();
    }
  },
  removed(w){
    const i=this.wins.indexOf(w);
    if(i>=0)this.wins.splice(i,1);
    if(this.keyWin===w){
      this.keyWin=null;
      /* pass key to app's topmost remaining window */
      const cands=this.wins.filter(x=>!x.mini&&x.el.style.display!=='none');
      cands.sort((a,b)=>(+b.el.style.zIndex||0)-(+a.el.style.zIndex||0));
      if(cands[0])this.makeKey(cands[0]);
    }
  },
  closeAll(){
    [...this.wins].forEach(w=>w.close()); /* non-silent: onClose cleanups run */
    this.wins=[];this.keyWin=null;
    $('#miniwins').innerHTML='';
  }
};

class NXWin{
  constructor(o){
    this.o=o=o||{};
    this.app=o.app||null;
    this.mini=false;
    this.persistKey=o.persistKey||null;
    const e=this.el=el('div','win'+(o.panel?' panelw':'')+(o.resizable===false?' nores':''));
    e.style.width=(o.width||420)+'px';
    e.style.height=(o.height||300)+'px';
    /* restore persisted frame */
    const pos=this.persistKey?(State.get('winpos',{})[this.persistKey]):null;
    const sw=window.innerWidth,sh=window.innerHeight;
    let x=(o.x!=null)?o.x:Math.round((sw-(o.width||420))/2)+((WS.wins.length%5)*22-40);
    let y=(o.y!=null)?o.y:Math.round((sh-(o.height||300))/2.4)+((WS.wins.length%5)*20-30);
    if(pos){x=pos.x;y=pos.y;if(pos.w)e.style.width=pos.w+'px';if(pos.h)e.style.height=pos.h+'px';}
    e.style.left=clamp(x,-200,sw-60)+'px';
    e.style.top=clamp(y,0,sh-40)+'px';

    /* title bar */
    const tb=this.tb=el('div','tb',e);
    if(o.miniaturizable!==false){
      const mb=el('div','tbbtn mini',tb);
      mb.addEventListener('click',ev=>{ev.stopPropagation();this.miniaturize();});
    } else el('div','',tb).style.width='15px';
    this.ttl=el('div','ttl',tb,o.title||'Untitled');
    if(o.closable!==false){
      const cb=this.closeBtn=el('div','tbbtn close',tb);
      cb.addEventListener('click',ev=>{ev.stopPropagation();this.requestClose();});
    } else el('div','',tb).style.width='15px';

    /* content */
    this.cnt=el('div','cnt',e);

    /* resize bar */
    if(o.resizable!==false){
      const rb=el('div','rbar',e);
      const rl=el('div','rl',rb),rm=el('div','rm',rb),rr=el('div','rr',rb);
      this.bindResize(rl,'l');this.bindResize(rm,'m');this.bindResize(rr,'r');
    }

    /* dragging & key behavior */
    tb.addEventListener('mousedown',ev=>this.dragStart(ev));
    e.addEventListener('mousedown',ev=>{
      if(!isCmd(ev)||ev.target!==tb)WS.makeKey(this);
    });
    tb.addEventListener('dblclick',ev=>{if(ev.target===tb||ev.target===this.ttl)this.miniaturize();});

    WS.desktop().appendChild(e);
    e.style.zIndex=++WS.zTop;
    if(this.app)this.app.windows.push(this);
  }
  setTitle(t){this.ttl.textContent=t;}
  frame(){
    return {x:parseInt(this.el.style.left),y:parseInt(this.el.style.top),
      w:this.el.offsetWidth,h:this.el.offsetHeight};
  }
  saveFrame(){
    if(!this.persistKey)return;
    const all=State.get('winpos',{});
    const f=this.frame();
    all[this.persistKey]={x:f.x,y:f.y,w:f.w,h:f.h};
    State.set('winpos',all);
  }
  dragStart(ev){
    if(ev.target.classList.contains('tbbtn'))return;
    const cmdDrag=isCmd(ev); /* Command-drag: move without focusing */
    if(!cmdDrag)WS.makeKey(this);
    const f=this.frame(),sx=ev.clientX,sy=ev.clientY;
    const mv=e2=>{
      this.el.style.left=(f.x+e2.clientX-sx)+'px';
      this.el.style.top=clamp(f.y+e2.clientY-sy,0,window.innerHeight-24)+'px';
    };
    const up=()=>{document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);this.saveFrame();};
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
    ev.preventDefault();
  }
  bindResize(handle,mode){
    handle.addEventListener('mousedown',ev=>{
      ev.stopPropagation();ev.preventDefault();
      WS.makeKey(this);
      const f=this.frame(),sx=ev.clientX,sy=ev.clientY;
      const minW=this.o.minWidth||160,minH=this.o.minHeight||100;
      const mv=e2=>{
        const dx=e2.clientX-sx,dy=e2.clientY-sy;
        let w=f.w,h=f.h,x=f.x;
        if(mode!=='m')h=Math.max(minH,f.h+dy);else h=Math.max(minH,f.h+dy);
        if(mode==='r')w=Math.max(minW,f.w+dx);
        if(mode==='l'){w=Math.max(minW,f.w-dx);x=f.x+(f.w-w);}
        this.el.style.width=w+'px';this.el.style.height=h+'px';this.el.style.left=x+'px';
        if(this.onResize)this.onResize();
      };
      const up=()=>{document.removeEventListener('mousemove',mv);
        document.removeEventListener('mouseup',up);this.saveFrame();
        if(this.onResize)this.onResize();};
      document.addEventListener('mousemove',mv);
      document.addEventListener('mouseup',up);
    });
  }
  requestClose(){
    if(this.o.onCloseRequest){this.o.onCloseRequest(this);return;}
    this.close();
  }
  close(silent){
    if(this.mini&&this.mw){this.mw.remove();this.mw=null;}
    this.el.remove();
    if(this.app){
      const i=this.app.windows.indexOf(this);
      if(i>=0)this.app.windows.splice(i,1);
    }
    WS.removed(this);
    if(!silent&&this.o.onClose)this.o.onClose(this);
  }
  miniaturize(){
    if(this.mini)return;
    this.mini=true;
    this.el.style.display='none';
    if(WS.keyWin===this){WS.keyWin=null;WS.removed(this);WS.wins.push(this);}
    const mw=this.mw=el('div','miniwin',$('#miniwins'));
    const ic=el('div','mwicon',mw);
    ic.appendChild(Icons.make(this.o.miniIcon||(this.app?this.app.icon:'app'),34));
    el('div','mwttl',mw,this.ttl.textContent);
    mw.addEventListener('dblclick',()=>this.deminiaturize());
    Sound.enabled&&Sound.tone([[300,0,.06]],.08,'sine');
  }
  deminiaturize(){
    if(!this.mini)return;
    this.mini=false;
    if(this.mw){this.mw.remove();this.mw=null;}
    this.el.style.display='';
    WS.makeKey(this);
  }
  center(){
    const sw=window.innerWidth,sh=window.innerHeight;
    this.el.style.left=Math.round((sw-this.el.offsetWidth)/2)+'px';
    this.el.style.top=Math.round((sh-this.el.offsetHeight)/2.6)+'px';
  }
  setHidden(h){
    this.el.style.display=(h||this.mini)?'none':'';
    if(this.mw)this.mw.style.display=h?'none':'';
  }
}

   Attention panels — the NeXT alert layout

function nxAlert(o){ /* {title,msg,info,buttons:['OK'],def:0,icon} -> Promise(label) */
  return new Promise(res=>{
    const w=WS.create({title:o.title||'Alert',width:o.width||400,height:10,
      resizable:false,miniaturizable:false,closable:false,panel:false,app:o.app||null});
    const body=el('div','alertbody',w.cnt);
    const ai=el('div','aicon',body);
    ai.appendChild(Icons.make(o.icon||(o.app?o.app.icon:'app'),48));
    const am=el('div','amsg',body);
    el('div','m1',am,o.msg||'');
    if(o.info)el('div','m2',am,o.info);
    const bb=el('div','alertbtns',w.cnt);
    const btns=o.buttons||['OK'];
    const defIdx=(o.def!=null)?o.def:btns.length-1;
    const done=lbl=>{document.removeEventListener('keydown',onkey,true);w.close(true);res(lbl);};
    btns.forEach((b,i)=>{
      const btn=el('div','btn'+(i===defIdx?' default':''),bb,b);
      if(i===defIdx)el('span','ret',btn,'⏎');
      btn.addEventListener('click',()=>done(b));
    });
    const onkey=ev=>{
      if(ev.key==='Enter'){ev.stopPropagation();ev.preventDefault();done(btns[defIdx]);}
      if(ev.key==='Escape'&&btns.length>1){ev.stopPropagation();done(btns[0]);}
    };
    document.addEventListener('keydown',onkey,true);
    /* size to content */
    w.el.style.height='auto';
    w.center();
    w.el.style.zIndex=WS.zTop+500;
    Sound.beep();
  });
}
/* =====================================================================
   Widgets — ScrollView (scroller on the LEFT, arrows grouped at bottom),
   pop-up lists, checkboxes, drag & drop
   ===================================================================== */
function makeScrollView(parent,opts){
  opts=opts||{};
  const root=el('div','sv'+(opts.gray?' gray':''),parent);
  const sc=el('div','scroller',root);
  const track=el('div','strack',sc);
  const knob=el('div','sknob',track);
  const btns=el('div','sbtns',sc);
  const up=el('div','sbtn up',btns);
  const dn=el('div','sbtn dn',btns);
  const svc=el('div','svc',root);
  const inner=el('div','svinner',svc);
  let y=0;
  function maxY(){return Math.max(0,inner.offsetHeight-svc.offsetHeight);}
  function refresh(){
    const mh=maxY(),vh=svc.offsetHeight,ch=inner.offsetHeight||1;
    const th=track.offsetHeight;
    if(mh<=0){knob.style.display='none';y=0;inner.style.top='0px';return;}
    knob.style.display='';
    const kh=clamp(Math.round(th*vh/ch),18,th);
    knob.style.height=kh+'px';
    y=clamp(y,0,mh);
    knob.style.top=Math.round((th-kh)*(y/mh))+'px';
    inner.style.top=(-y)+'px';
  }
  function scrollTo(ny){y=clamp(ny,0,maxY());refresh();}
  svc.addEventListener('wheel',ev=>{ev.preventDefault();scrollTo(y+ev.deltaY);},{passive:false});
  sc.addEventListener('wheel',ev=>{ev.preventDefault();scrollTo(y+ev.deltaY);},{passive:false});
  function hold(btn,d){
    let iv=null;
    btn.addEventListener('mousedown',ev=>{
      ev.preventDefault();scrollTo(y+d);
      iv=setInterval(()=>scrollTo(y+d),60);
      const up2=()=>{clearInterval(iv);document.removeEventListener('mouseup',up2);};
      document.addEventListener('mouseup',up2);
    });
  }
  hold(up,-18);hold(dn,18);
  knob.addEventListener('mousedown',ev=>{
    ev.preventDefault();ev.stopPropagation();
    const sy=ev.clientY,oy=y;
    const th=track.offsetHeight,kh=knob.offsetHeight,mh=maxY();
    const mv=e2=>{
      if(th-kh<=0)return;
      scrollTo(oy+(e2.clientY-sy)*mh/(th-kh));
    };
    const up2=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up2);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up2);
  });
  track.addEventListener('mousedown',ev=>{
    if(ev.target!==track)return;
    scrollTo(y+(ev.offsetY<knob.offsetTop?-1:1)*svc.offsetHeight*.9);
  });
  const sv={root,content:inner,viewport:svc,refresh,scrollTo,
    scrollToBottom(){scrollTo(1e9);},get y(){return y;}};
  return sv;
}

function makePopup(items,value,onChange){
  const p=el('div','popup');
  const pv=el('div','pv',p,value||items[0]);
  el('div','pmark',p);
  p.addEventListener('mousedown',ev=>{
    ev.stopPropagation();ev.preventDefault();
    const list=el('div','popuplist',document.body);
    items.forEach(it=>{
      const li=el('div','pli',list,it);
      li.addEventListener('mouseup',()=>{
        pv.textContent=it;cleanup();
        if(onChange)onChange(it);
      });
    });
    const r=p.getBoundingClientRect();
    list.style.left=r.left+'px';
    const idx=Math.max(0,items.indexOf(pv.textContent));
    list.style.top=Math.max(2,r.top-idx*20-1)+'px';
    list.style.minWidth=r.width+'px';
    function cleanup(){list.remove();document.removeEventListener('mousedown',out,true);}
    function out(e2){if(!list.contains(e2.target))cleanup();}
    setTimeout(()=>document.addEventListener('mousedown',out,true),0);
  });
  p.setValue=v=>{pv.textContent=v;};
  p.getValue=()=>pv.textContent;
  return p;
}

function makeChk(label,val,onChange){
  const c=el('label','chk');
  const box=el('span','box',c,val?'✓':'');
  el('span','',c,label);
  c.addEventListener('click',ev=>{
    ev.preventDefault();
    val=!val;box.textContent=val?'✓':'';
    if(onChange)onChange(val);
  });
  c.setVal=v=>{val=v;box.textContent=v?'✓':'';};
  c.getVal=()=>val;
  return c;
}

/* =====================================================================
   Drag & drop manager (files, dock tiles, shelf) with copy badge
   ===================================================================== */
const DnD={
  ghost:null,payload:null,copyMode:false,moved:false,
  /* call on mousedown */
  start(ev,o){ /* o={icon,label,payload,onEnd,copyAllowed} */
    if(ev.button!==0)return;
    const sx=ev.clientX,sy=ev.clientY;
    let started=false;
    const mv=e2=>{
      if(!started){
        if(Math.abs(e2.clientX-sx)+Math.abs(e2.clientY-sy)<5)return;
        started=true;this.moved=true;
        this.payload=o.payload;
        const g=this.ghost=el('div','dragghost',document.body);
        g.appendChild(Icons.make(o.icon||'file',48));
        if(o.label){const l=el('div','',g,o.label);l.style.cssText='font-size:10px;background:transparent;';}
        this.badge=el('div','badge',g,'+');
        this.badge.style.display='none';
      }
      this.copyMode=!!(e2.altKey&&o.copyAllowed!==false);
      this.badge.style.display=this.copyMode?'':'none';
      this.ghost.style.left=(e2.clientX-24)+'px';
      this.ghost.style.top=(e2.clientY-24)+'px';
      const t=this.targetAt(e2);
      if(t!==this.curTarget){
        if(this.curTarget&&this.curTarget.__drop.leave)this.curTarget.__drop.leave(this.curTarget);
        this.curTarget=t;
        if(t&&t.__drop.over)t.__drop.over(t,this.payload);
      }
    };
    const up=e2=>{
      document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);
      if(started){
        const t=this.targetAt(e2);
        if(this.curTarget&&this.curTarget.__drop.leave)this.curTarget.__drop.leave(this.curTarget);
        this.ghost.remove();this.ghost=null;
        if(t&&t.__drop.drop)t.__drop.drop(this.payload,{copy:this.copyMode,ev:e2,el:t});
        else if(o.onMiss)o.onMiss(e2);
        this.payload=null;this.curTarget=null;
        if(o.onEnd)o.onEnd(true);
      } else if(o.onEnd)o.onEnd(false);
    };
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  },
  targetAt(ev){
    if(this.ghost)this.ghost.style.display='none';
    let e2=document.elementFromPoint(ev.clientX,ev.clientY);
    if(this.ghost)this.ghost.style.display='';
    while(e2){
      if(e2.__drop&&(!e2.__drop.accepts||e2.__drop.accepts(this.payload)))return e2;
      e2=e2.parentElement;
    }
    return null;
  }
};

    const back=el('div','btn',bar,'Backtrack');

    const tocC=el('div','',split);

    const tocSv=makeScrollView(tocC);

    this.bodySv=bodySv;this.tocSv=tocSv;

  show(name,noPush){
    const t=this.TOPICS.find(x=>x[0]===name);

    this.body.textContent=t[1];
    for(const k in this.tocRows)this.tocRows[k].classList.toggle('sel',k===name);
    if(this.idxPopup)this.idxPopup.setValue(name);
    this.bodySv.scrollTo(0);this.bodySv.refresh();
  },
  /* --- help cursor mode --- */
  armed:false,
  armCursor(){
    if(this.armed)return;
    this.armed=true;
    document.body.classList.add('helpcursor');
    const h=ev=>{
      ev.stopPropagation();ev.preventDefault();
      document.body.classList.remove('helpcursor');
      document.removeEventListener('click',h,true);
      this.armed=false;
      let e2=ev.target,txt=null;
      while(e2&&e2!==document.body){
        if(e2.dataset&&e2.dataset.help){txt=e2.dataset.help;break;}
        e2=e2.parentElement;
      }
      nxAlert({title:'Help',icon:'help',msg:txt?'About this control':'No help available',
        info:txt||'There is no help for that element, but most of the screen responds to the help cursor. Try a title-bar button, the Dock, or the Shelf.',
        buttons:['OK']});
    };
    document.addEventListener('click',h,true);
  }
};
/* =====================================================================
   Menu System — vertical menus, attached submenus, tear-offs
   ===================================================================== */
class MenuPanel{
  /* opts: {title, items, main, transient, parentPanel, parentRow, app} */
  constructor(opts){
    this.o=opts;
    this.torn=false;
    this.subPanel=null;
    this.app=opts.app;
    const e=this.el=el('div','menu',document.body);
    if(opts.width)e.style.width=opts.width+'px';
    this.titleEl=el('div','mtitle',e,opts.title);
    this.titleEl.dataset.help='This is a menu. Drag a submenu by its title to tear it off as a persistent panel.';
    this.titleEl.addEventListener('mousedown',ev=>this.titleDrag(ev));
    this.body=el('div','',e);
    this.renderItems(opts.items);
    e.style.left=(opts.x||0)+'px';
    e.style.top=(opts.y||0)+'px';
    e.style.zIndex=6000+(opts.transient?500:0);
  }
  renderItems(items){
    this.body.innerHTML='';
    this.rows=[];
    items.forEach(it=>{
      const row=el('div','mi'+(this.itemDisabled(it)?' disabled':''),this.body);
      el('div','lbl',row,it.label);
      if(it.submenu)el('div','sub',row);
      else if(it.key)el('div','keq',row,it.key);
      row.__item=it;
      this.rows.push(row);
      row.addEventListener('mousedown',ev=>ev.stopPropagation());
      row.addEventListener('click',ev=>{
        ev.stopPropagation();
        if(this.itemDisabled(it))return;
        if(it.submenu){
          if(this.subPanel&&this.subPanel.o.parentRow===row)this.closeSub();
          else this.openSub(it,row);
        } else {
          Menus.closeTransient();
          this.closeSubChainUp();
          if(it.action)it.action();
        }
      });
    });
  }
  itemDisabled(it){
    return typeof it.disabled==='function'?it.disabled():!!it.disabled;
  }
  openSub(it,row){
    this.closeSub();
    const items=(typeof it.submenu==='function')?it.submenu():it.submenu;
    const r=this.el.getBoundingClientRect();
    this.subPanel=new MenuPanel({
      title:it.label,items:items,parentPanel:this,parentRow:row,
      transient:this.o.transient,app:this.app,
      x:r.right+1,y:r.top
    });
    row.classList.add('open');
    Menus.register(this.subPanel);
  }
  closeSub(){
    if(this.subPanel){
      if(!this.subPanel.torn)this.subPanel.destroy();
      else this.subPanel.detachFromParent();
      this.subPanel=null;
    }
    this.rows&&this.rows.forEach(r=>r.classList.remove('open'));
  }
  /* close attached submenus all the way up after an action */
  closeSubChainUp(){
    let p=this;
    while(p){
      p.closeSub&&p.closeSub();
      p=p.o.parentPanel;
    }
  }
  detachFromParent(){
    if(this.o.parentRow)this.o.parentRow.classList.remove('open');
    this.o.parentPanel=null;this.o.parentRow=null;
  }
  titleDrag(ev){
    ev.preventDefault();
    const sx=ev.clientX,sy=ev.clientY;
    const r=this.el.getBoundingClientRect();
    let dragging=false;
    const mv=e2=>{
      if(!dragging&&Math.abs(e2.clientX-sx)+Math.abs(e2.clientY-sy)<4)return;
      dragging=true;
      if(this.o.parentPanel&&!this.torn)this.tearOff();
      this.closeSub();
      this.el.style.left=(r.left+e2.clientX-sx)+'px';
      this.el.style.top=clamp(r.top+e2.clientY-sy,0,window.innerHeight-24)+'px';
    };
    const up=()=>{
      document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);
      if(dragging&&this.o.main&&this.app)
        Menus.saveMainPos(this.app,this.el.offsetLeft,this.el.offsetTop);
    };
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  }
  tearOff(){
    this.torn=true;
    if(this.o.parentPanel){
      if(this.o.parentRow)this.o.parentRow.classList.remove('open');
      if(this.o.parentPanel.subPanel===this)this.o.parentPanel.subPanel=null;
      this.o.parentPanel=null;this.o.parentRow=null;
    }
    this.o.transient=false;
    const cb=el('div','mclose',this.titleEl);
    cb.addEventListener('mousedown',ev=>ev.stopPropagation());
    cb.addEventListener('click',ev=>{ev.stopPropagation();this.destroy();});
    Menus.addTorn(this);
  }
  setVisible(v){this.el.style.display=v?'':'none';}
  destroy(){
    this.closeSub();
    this.el.remove();
    Menus.unregister(this);
  }
}

const Menus={
  mainPanel:null,panels:[],torn:[],transientRoot:null,
  activeApp:null,suspended:false,
  register(p){this.panels.push(p);},
  unregister(p){
    let i=this.panels.indexOf(p);if(i>=0)this.panels.splice(i,1);
    i=this.torn.indexOf(p);if(i>=0)this.torn.splice(i,1);
  },
  addTorn(p){if(this.torn.indexOf(p)<0)this.torn.push(p);},
  mainPos(app){
    const all=State.get('menupos',{});
    return all[app.name]||{x:6,y:6};
  },
  saveMainPos(app,x,y){
    const all=State.get('menupos',{});
    all[app.name]={x:x,y:y};
    State.set('menupos',all);
  },
  setApp(app){
    if(this.suspended)return;
    this.activeApp=app;
    if(this.mainPanel){this.mainPanel.destroy();this.mainPanel=null;}
    this.closeTransient();
    if(!app){this.torn.forEach(t=>t.setVisible(false));return;}
    const pos=this.mainPos(app);
    this.mainPanel=new MenuPanel({
      title:app.name,items:app.menuTree(),main:true,app:app,x:pos.x,y:pos.y
    });
    this.register(this.mainPanel);
    /* torn panels belong to their app */
    this.torn.forEach(t=>t.setVisible(t.app===app));
  },
  refresh(){ /* re-render main menu (e.g. Windows submenu changed) */
    if(this.activeApp)this.setApp(this.activeApp);
  },
  closeTransient(){
    if(this.transientRoot){this.transientRoot.destroy();this.transientRoot=null;}
  },
  hideAll(){
    this.suspended=true;
    if(this.mainPanel){this.mainPanel.destroy();this.mainPanel=null;}
    this.closeTransient();
    this.torn.forEach(t=>t.setVisible(false));
  },
  showAll(){
    this.suspended=false;
    if(this.activeApp)this.setApp(this.activeApp);
  },
  summonAt(x,y){ /* right-click copy of the main menu */
    this.closeTransient();
    if(!this.activeApp)return;
    const p=new MenuPanel({
      title:this.activeApp.name,items:this.activeApp.menuTree(),
      transient:true,app:this.activeApp,
      x:Math.min(x,window.innerWidth-180),y:Math.min(y,window.innerHeight-100)
    });
    this.transientRoot=p;this.register(p);
  },
  findByKey(items,ch){
    for(const it of items){
      if(it.key===ch&&it.action)return it;
      if(it.submenu){
        const items2=(typeof it.submenu==='function')?it.submenu():it.submenu;
        const f=this.findByKey(items2,ch);
        if(f)return f;
      }
    }
    return null;
  },
  init(){
    document.addEventListener('contextmenu',ev=>{
      if(!Session.user)return;
      ev.preventDefault();
      this.summonAt(ev.clientX,ev.clientY);
    });
    document.addEventListener('mousedown',ev=>{
      /* clicking outside closes transient + attached (untorn) submenus */
      let e2=ev.target,insideMenu=false;
      while(e2){if(e2.classList&&e2.classList.contains('menu')){insideMenu=true;break;}e2=e2.parentElement;}
      if(!insideMenu){
        this.closeTransient();
        if(this.mainPanel)this.mainPanel.closeSub();
        this.torn.forEach(t=>t.closeSub());
      }
    },true);
    document.addEventListener('keydown',ev=>{
      if(!Session.user)return;
      if(!isCmd(ev))return;
      const ch=ev.key.toLowerCase();
      if(ch==='?'||(ev.shiftKey&&ch==='/')){ev.preventDefault();Help.armCursor();return;}
      if(ch.length!==1)return;
      if(!this.activeApp)return;
      const it=this.findByKey(this.activeApp.menuTree(),ch);
      if(it&&!(typeof it.disabled==='function'?it.disabled():it.disabled)){
        ev.preventDefault();ev.stopPropagation();
        it.action();
      }
    });
  }
};
/* =====================================================================
   Application framework — apps register menus and windows
   ===================================================================== */
class NXApp{
  constructor(o){
    this.name=o.name;this.icon=o.icon;this.bundle=o.bundle;
    this.version=o.version||'3.3';
    this.credits=o.credits||'A faithful front-end simulation.\nNothing you see here actually runs.';
    this.windows=[];this.running=false;this.hidden=false;
    Apps.register(this);
  }
  menuTree(){return [];}
  onLaunch(){}
  launch(arg){
    if(this.running){this.makeActive();if(arg&&this.onOpen)this.onOpen(arg);return;}
    this.running=true;this.hidden=false;
    this.onLaunch(arg);
    this.makeActive();
    Dock.render();
  }
  makeActive(){
    if(this.hidden)this.unhide();
    Apps.activate(this);
    const vis=this.windows.filter(w=>!w.mini);
    if(vis.length){
      vis.sort((a,b)=>(+b.el.style.zIndex||0)-(+a.el.style.zIndex||0));
      WS.makeKey(vis[0]);
    }
  }
  hide(){
    if(!this.running)return;
    this.hidden=true;
    this.windows.forEach(w=>w.setHidden(true));
    const next=Apps.list.find(a=>a.running&&!a.hidden)||Workspace;
    Apps.activate(next);
    const vis=next.windows.filter(w=>!w.mini&&w.el.style.display!=='none');
    if(vis.length)WS.makeKey(vis[0]);
  }
  unhide(){
    this.hidden=false;
    this.windows.forEach(w=>w.setHidden(false));
  }
  quit(){
    [...this.windows].forEach(w=>w.close(true));
    this.windows=[];this.running=false;this.hidden=false;
    if(this.onQuit)this.onQuit();
    Dock.render();
    if(Apps.current===this)Workspace.makeActive();
  }
  infoPanel(){
    const w=WS.create({title:'Info',width:400,height:10,resizable:false,app:this,panel:false});
    const b=el('div','',w.cnt);
    b.style.cssText='display:flex;flex-direction:column;align-items:center;padding:18px 20px 14px;gap:6px;';
    b.appendChild(Icons.make(this.icon,64));
    const t=el('div','',b,this.name);
    t.style.cssText='font-size:20px;font-weight:bold;margin-top:4px;';
    el('div','',b,'Release '+this.version);
    const c=el('div','',b);
    c.style.cssText='font-size:11px;color:#333;text-align:center;white-space:pre-wrap;margin-top:6px;line-height:1.4;';
    c.textContent=this.credits;
    const f=el('div','',b,'NeXTSTEP is a museum piece here — a simulation in a single file.');
    f.style.cssText='font-size:10px;color:#555;margin-top:8px;';
    w.el.style.height='auto';w.center();
  }
  /* ---- standard submenus ---- */
  stdInfo(extra){
    const items=[
      {label:'Info Panel...',action:()=>this.infoPanel()},
      {label:'Help...',key:'?',action:()=>Help.open()}
    ];
    return {label:'Info',submenu:(extra?items.concat(extra):items)};
  }
  stdEdit(){
    return {label:'Edit',submenu:[
      {label:'Cut',key:'x',action:()=>document.execCommand('cut')},
      {label:'Copy',key:'c',action:()=>document.execCommand('copy')},
      {label:'Paste',key:'v',action:()=>document.execCommand('paste')},
      {label:'Delete',action:()=>document.execCommand('delete')},
      {label:'Select All',key:'a',action:()=>document.execCommand('selectAll')},
      {label:'Find',submenu:[
        {label:'Find Panel...',key:'f',action:()=>{if(this.findPanel)this.findPanel();else Sound.beep();}},
        {label:'Find Next',action:()=>Sound.beep()},
        {label:'Find Previous',action:()=>Sound.beep()}
      ]}
    ]};
  }
  stdWindows(){
    return {label:'Windows',submenu:()=>{
      const items=this.windows.map(w=>({label:w.ttl.textContent,action:()=>{w.deminiaturize();WS.makeKey(w);}}));
      items.push({label:'Miniaturize Window',key:'m',action:()=>{if(WS.keyWin)WS.keyWin.miniaturize();}});
      items.push({label:'Close Window',key:'w',action:()=>{if(WS.keyWin&&WS.keyWin.o.closable!==false)WS.keyWin.requestClose();}});
      items.push({label:'Arrange in Front',action:()=>{this.windows.forEach(w=>{if(!w.mini)w.el.style.zIndex=++WS.zTop;});}});
      return items;
    }};
  }
  stdServices(){
    return {label:'Services',submenu:[
      {label:'Define in Webster',action:()=>Services.defineInWebster()},
      {label:'Mail Selection',action:()=>Services.mailSelection()},
      {label:'Open in Workspace',action:()=>Services.openInWorkspace()}
    ]};
  }
  stdHideQuit(){
    return [
      {label:'Hide',key:'h',action:()=>this.hide()},
      {label:'Quit',key:'q',action:()=>{
        if(this===Workspace)Boot.logoutPanel();
        else this.quit();
      }}
    ];
  }
}

const Apps={
  list:[],current:null,byName:{},
  register(a){this.list.push(a);this.byName[a.name]=a;},
  activate(app){
    if(this.current===app)return;
    this.current=app;
    Menus.setApp(app);
    Dock.render();
  },
  byBundle(b){return this.list.find(a=>a.bundle===b)||null;},
  launchBundle(bundle,arg){
    const a=this.byBundle(bundle);
    if(a){a.launch(arg);return true;}
    return false;
  }
};

/* =====================================================================
   Dock — application tiles down the RIGHT edge
   ===================================================================== */
const Dock={
  el:null,
  DEFAULT:['Mail.app','Edit.app','Terminal.app','Preferences.app'],
  items(){return State.get('dock',this.DEFAULT.slice());},
  setItems(v){State.set('dock',v);},
  init(){
    this.el=$('#dock');
    this.el.style.display='';
    this.render();
  },
  render(){
    if(!this.el)return;
    this.el.innerHTML='';
    /* top: the workstation tile — Workspace itself */
    const top=this.tile('computer','Workspace');
    top.dataset.help='The Dock. Double-click a tile to launch its application. Tiles marked with three dots are not running.';
    top.addEventListener('dblclick',()=>Workspace.makeActive());
    top.addEventListener('click',()=>{if(Workspace.running)Workspace.makeActive();});
    this.el.appendChild(top);
    /* app tiles */
    this.items().forEach(bundle=>{
      const app=Apps.byBundle(bundle);
      const t=this.tile(app?app.icon:appIconName(bundle),bundle);
      if(!app||!app.running)el('div','dots',t,'. . .');
      t.addEventListener('dblclick',()=>Apps.launchBundle(bundle));
      t.addEventListener('click',()=>{const a=Apps.byBundle(bundle);if(a&&a.running)a.makeActive();});
      t.addEventListener('mousedown',ev=>{
        DnD.start(ev,{icon:app?app.icon:appIconName(bundle),
          payload:{type:'docktile',bundle:bundle},
          onMiss:()=>{ /* dragged off the Dock: remove */
            const items=this.items().filter(x=>x!==bundle);
            this.setItems(items);this.render();
          }});
      });
      t.__drop={
        accepts:p=>p&&(p.type==='docktile'||(p.type==='file'&&p.node.type==='app')),
        over(tl){tl.classList.add('dragover');},
        leave(tl){tl.classList.remove('dragover');},
        drop:(p,info)=>{
          info.el.classList.remove('dragover');
          this.insertAt(p,bundle);
        }
      };
      this.el.appendChild(t);
    });
    /* bottom: the Recycler */
    const rec=this.tile('recycler','Recycler');
    rec.style.marginTop='6px';
    rec.dataset.help='The Recycler. Drag files here to discard them; nothing is lost until you choose Empty Recycler.';
    rec.addEventListener('dblclick',()=>Workspace.openRecycler());
    rec.__drop={
      accepts:p=>p&&p.type==='file',
      over(tl){tl.classList.add('dragover');},
      leave(tl){tl.classList.remove('dragover');},
      drop:(p,info)=>{
        info.el.classList.remove('dragover');
        Workspace.recycle(p.node);
      }
    };
    this.el.appendChild(rec);
    /* dock background accepts app drops (append) */
    this.el.__drop={
      accepts:p=>p&&((p.type==='file'&&p.node.type==='app')||p.type==='docktile'),
      drop:p=>this.insertAt(p,null)
    };
  },
  insertAt(p,beforeBundle){
    let items=this.items();
    let bundle=(p.type==='docktile')?p.bundle:p.node.name;
    items=items.filter(x=>x!==bundle);
    if(beforeBundle&&beforeBundle!==bundle){
      const i=items.indexOf(beforeBundle);
      items.splice(i<0?items.length:i,0,bundle);
    } else items.push(bundle);
    this.setItems(items);this.render();
  },
  tile(icon,title){
    const t=el('div','dtile');
    t.title='';
    t.appendChild(Icons.make(icon,58));
    return t;
  }
};

/* =====================================================================
   Services broker — carry a selection between applications
   ===================================================================== */
const Services={
  provider:null, /* app may set Services.provider=()=>text */
  getSelection(){
    if(this.provider){
      const t=this.provider();
      if(t)return t;
    }
    const s=window.getSelection();
    return s?String(s).trim():'';
  },
  defineInWebster(){
    const t=this.getSelection();
    if(!t){Sound.beep();return;}
    Apps.byName['Webster'].launch();
    Apps.byName['Webster'].lookup(t.split(/\s+/)[0]);
  },
  mailSelection(){
    const t=this.getSelection();
    if(!t){Sound.beep();return;}
    Apps.byName['Mail'].launch();
    Apps.byName['Mail'].composeWith(t);
  },
  openInWorkspace(){
    const t=this.getSelection();
    const n=t&&VFS.resolve(t.trim());
    if(n)Workspace.revealNode(n);
    else Sound.beep();
  }
};

    const esc=ev=>{if(ev.key==='Escape')finish();};
    document.addEventListener('keydown',esc);
    const finish=()=>{
      if(this.skipped)return;
      this.skipped=true;
      clearTimeout(this.timer);
      document.removeEventListener('keydown',esc);
      this.showLogin();
    };
    const stepKernel=()=>{
      if(ki<this.KERNEL.length){
        krnEl.textContent+=this.KERNEL[ki++]+'\n';
        this.timer=setTimeout(stepKernel,40+Math.random()*170);
      } else this.timer=setTimeout(finish,650);
    };
    const stepRom=()=>{
      if(ri<this.ROM.length){
        romEl.textContent+=this.ROM[ri++]+'\n';
        this.timer=setTimeout(stepRom,90+Math.random()*160);
      } else this.timer=setTimeout(()=>{krnEl.textContent='\n';stepKernel();},600);
    };
    stepRom();
  },
  /* ---------------- loginwindow ---------------- */
  showLogin(){
    $('#bootscreen').style.display='none';
    let lb=$('#loginback');
    if(!lb){lb=el('div','',document.body);lb.id='loginback';}
    lb.style.display='';
    lb.innerHTML='';
    const panel=el('div','rz',lb);
    panel.style.cssText='position:absolute;left:50%;top:44%;width:380px;transform:translate(-50%,-50%);padding:0 0 14px;';
    const inner=el('div','',panel);
    inner.style.cssText='display:flex;flex-direction:column;align-items:center;padding:18px 26px 4px;';
    /* recreated-in-style mark: original artwork, no Rand cube */
    const logo=el('div','',inner);
    logo.innerHTML='<svg width="180" height="64" viewBox="0 0 180 64">'+
      '<rect x="4" y="4" width="56" height="56" fill="#111" stroke="#000"/>'+
      '<g stroke="#9aa4b0" fill="none" stroke-width="1.5">'+
      '<path d="M14 24 L38 18 L48 28 L24 35 Z"/><path d="M14 24 L24 35 L24 50 L14 40 Z"/>'+
      '<path d="M24 35 L48 28 L48 43 L24 50 Z"/></g>'+
      '<text x="68" y="30" font-family="Helvetica" font-size="17" font-weight="bold" fill="#111">NeXTSTEP</text>'+
      '<text x="68" y="46" font-family="Helvetica" font-size="11" fill="#333">Release 3.3</text></svg>';
    const form=el('div','',inner);
    form.style.cssText='display:grid;grid-template-columns:70px 190px;gap:10px 8px;align-items:center;margin-top:14px;';
    el('label','fl',form,'Name:');
    const name=el('input','tf',form);
    el('label','fl',form,'Password:');
    const pass=el('input','tf',form);pass.type='password';
    name.value=State.get('lastLogin','me');
    const tryLogin=()=>{
      const u=name.value.trim();
      if(u==='me'||(u==='root'&&(pass.value===''||pass.value==='root'))){
        State.set('lastLogin',u);
        this.loggedIn(u);
      } else {
        panel.classList.remove('shake');
        void panel.offsetWidth; /* restart animation */
        panel.classList.add('shake');
        Sound.beep();
        pass.value='';name.select();
      }
    };
    name.addEventListener('keydown',ev=>{if(ev.key==='Enter')pass.focus();});
    pass.addEventListener('keydown',ev=>{if(ev.key==='Enter')tryLogin();});
    /* loginwindow menu: power / restart */
    const row=el('div','',inner);
    row.style.cssText='display:flex;gap:10px;margin-top:16px;align-self:flex-end;';
    const rst=el('div','btn',row,'Restart');
    const pwr=el('div','btn',row,'Power Off');
    rst.addEventListener('click',()=>this.confirmPower(true));
    pwr.addEventListener('click',()=>this.confirmPower(false));
    const hint=el('div','',lb,'demo accounts —  me (any password)   ·   root (password "root")');
    hint.style.cssText='position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#9a9a9a;font-size:11px;';
    setTimeout(()=>name.focus(),50);
    name.select();
  },
  confirmPower(restart){
    Menus.hideAll();Menus.showAll(); /* no-op guard */
    nxAlert({title:restart?'Restart':'Power',icon:'computer',
      msg:restart?'Do you really want to restart the computer?':'Do you really want to turn the computer off?',
      info:restart?'The system will be restarted.':'All processes will be stopped and the power turned off.',
      buttons:['Cancel',restart?'Restart':'Power Off'],def:1}).then(r=>{
        if(r==='Cancel')return;
        if(restart){ $('#loginback')&&($('#loginback').style.display='none');this.start(); }
        else this.powerOff();
      });
  },
  powerOff(){
    const lb=$('#loginback');if(lb)lb.style.display='none';
    const bs=$('#bootscreen');
    bs.style.display='';
    bs.innerHTML='';
    setTimeout(()=>{
      bs.textContent='\n\nSystem halted.\n\nIt is now safe to turn off your computer.\n\n\n';
      const s=el('div','',bs,'(press any key to power back on)');
      s.style.cssText='color:#444;font-size:11px;';
      const k=()=>{document.removeEventListener('keydown',k);Boot.start();};
      setTimeout(()=>document.addEventListener('keydown',k),400);
    },900);
  },
  loggedIn(user){
    Session.user=user;
    const lb=$('#loginback');if(lb)lb.style.display='none';
    $('#bootscreen').style.display='none';
    Dock.init();
    Menus.showAll();
    Workspace.launch();
    Saver.armIdle();
    logMsg('loginwindow: login by user '+user);
  },
  logoutPanel(){
    nxAlert({title:'Log Out',icon:'computer',app:Workspace,
      msg:'Are you sure you want to log out?',
      info:'Any simulated work has been saved automatically.',
      buttons:['Cancel','Log Out'],def:1}).then(r=>{
        if(r==='Log Out')this.logout();
      });
  },
  logout(){
    Saver.stop();Saver.disarm();
    Apps.list.forEach(a=>{if(a.running&&a!==Workspace)a.quit();});
    Workspace.running=false;Workspace.hidden=false;
    Workspace.viewer=null;Workspace.recWin=null;
    WS.closeAll();
    Workspace.windows=[];
    Menus.hideAll();
    Menus.torn.slice().forEach(t=>t.destroy());
    $('#dock').style.display='none';
    $('#miniwins').innerHTML='';
    Session.user=null;
    this.showLogin();
  }
};

/* system log helper (feeds /private/adm/messages & Console) */
const SysLog={lines:null,
  init(){
    if(this.lines)return;
    const d=new Date();
    const stamp=off=>{
      const t=new Date(d.getTime()-off*1000);
      return MONTHS[t.getMonth()]+' '+String(t.getDate()).padStart(2)+' '+
        String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+
        String(t.getSeconds()).padStart(2,'0')+' localhost ';
    };
    this.lines=[];
    let off=Boot.KERNEL.length*2+30;
    Boot.KERNEL.forEach(l=>{this.lines.push(stamp(off)+'mach: '+l);off-=2;});
  },
  add(m){
    this.init();
    const t=new Date();
    this.lines.push(MONTHS[t.getMonth()]+' '+String(t.getDate()).padStart(2)+' '+
      String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+
      String(t.getSeconds()).padStart(2,'0')+' localhost '+m);
    if(Consol.win&&Consol.body){Consol.append(this.lines[this.lines.length-1]);}
  },
  text(){this.init();return this.lines.join('\n')+'\n';}
};
function logMsg(m){SysLog.add(m);}
function fileContent(node){
  if(!node)return '';
  if(node.content==='__SYSLOG__')return SysLog.text();
  if(node.content==='__CUBE_MEMORIAL__')return '(a TIFF image — open it in Preview)';
  return node.content||'';
}

/* =====================================================================
   NMI mini-monitor — Easter egg
   ===================================================================== */
const NMI={
  open(){
    const w=WS.create({title:'NMI monitor',width:460,height:220,resizable:false,
      miniaturizable:false,panel:true});
    w.cnt.style.background='#8f8f8f';
    const out=el('div','mono',w.cnt);
    out.style.cssText='position:absolute;inset:6px;font-size:12px;white-space:pre-wrap;overflow:hidden;';
    out.textContent='NMI interrupt: entering mini-monitor\n'+
      'backtrace: _WindowServer + 0x1f2  _mach_msg_trap + 0x14\n'+
      'type "help" for commands\n\nnmi> ';
    const inp=el('input','',w.cnt);
    inp.style.cssText='position:absolute;left:6px;right:6px;bottom:6px;background:transparent;border:none;outline:none;font:12px monospace;color:#000;';
    inp.addEventListener('keydown',ev=>{
      if(ev.key!=='Enter')return;
      const c=inp.value.trim();inp.value='';
      out.textContent+=c+'\n';
      if(c==='continue'||c==='c'){w.close();return;}
      if(c==='reboot'){w.close();Boot.logout&&null;Boot.start();return;}
      if(c==='help')out.textContent+='  continue   resume normal operation\n  reboot     restart the machine\n  help       this text\n';
      else if(c)out.textContent+='nmi: unknown command "'+c+'"\n';
      out.textContent+='nmi> ';
    });
    setTimeout(()=>inp.focus(),50);
    w.center();
  }
};
/* =====================================================================
   Workspace Manager — File Viewer, Shelf, browser, Inspector, Recycler
   ===================================================================== */
class WorkspaceApp extends NXApp{
  constructor(){
    super({name:'Workspace',icon:'computer',bundle:null,version:'3.3 (v355)',
      credits:'Workspace Manager\nFile viewing, the Shelf, the Dock and the Recycler.\nAn original recreation in the spirit of 1995.'});
    this.viewMode=State.get('fvView','Browser');
    this.dir=null;this.sel=null;
    this.renameTimer=null;
  }
  menuTree(){
    return [
      this.stdInfo(),
      {label:'File',submenu:[
        {label:'Open',key:'o',action:()=>{if(this.sel)this.openNode(this.sel);else Sound.beep();}},
        {label:'New Folder',key:'n',action:()=>this.newFolder()},
        {label:'Duplicate',key:'d',action:()=>this.duplicate()},
        {label:'Compress',action:()=>this.compress()},
        {label:'Destroy',action:()=>this.destroy()},
        {label:'Empty Recycler',action:()=>this.emptyRecycler()}
      ]},
      {label:'View',submenu:[
        {label:'Browser',action:()=>this.setView('Browser')},
        {label:'Icon',action:()=>this.setView('Icon')},
        {label:'Listing',action:()=>this.setView('Listing')}
      ]},
      {label:'Tools',submenu:[
        {label:'Inspector...',key:'i',action:()=>this.openInspector()},
        {label:'Console...',action:()=>Consol.open()},
        {label:'Processes...',action:()=>this.processesPanel()}
      ]},
      this.stdWindows(),
      this.stdServices(),
      {label:'Hide',key:'h',action:()=>this.hide()},
      {label:'Log Out',action:()=>Boot.logoutPanel()}
    ];
  }
  onLaunch(){
    this.dir=VFS.resolve('/me');
    this.sel=null;
    this.makeViewer();
  }
  quit(){ /* Workspace never quits — log out instead */
    Boot.logoutPanel();
  }
  /* ------------------------------------------------ File Viewer */
  makeViewer(){
    const w=this.viewer=WS.create({app:this,title:'File Viewer  —  /me',
      width:660,height:480,minWidth:520,minHeight:360,persistKey:'fileviewer',x:70,y:60,
      onCloseRequest:()=>{w.miniaturize();}});
    w.onResize=()=>this.refreshView();
    const c=w.cnt;
    this.shelfEl=el('div','shelf',c);
    this.shelfEl.dataset.help='The Shelf. Drag folders or files you use often here to keep them handy. Drag them off to remove them.';
    this.pathEl=el('div','pathrow',c);
    this.pathEl.dataset.help='The icon path shows where you are on the disk. Click an icon to jump back to that folder.';
    this.pathEl.style.cssText+='border-bottom:1px solid #000;';
    this.viewC=el('div','',c);
    this.viewC.style.cssText='position:absolute;left:0;right:0;top:154px;bottom:0;';
    this.renderShelf();
    this.refreshView();
  }
  setView(v){
    this.viewMode=v;State.set('fvView',v);
    this.refreshView();
  }
  navigate(dir,sel){
    this.dir=dir;this.sel=sel||null;
    this.refreshView();
    if(Inspector.win)Inspector.show(this.sel||this.dir);
  }
  select(node){
    this.sel=node;
    if(node&&(node.type==='dir'))this.dir=node;
    else if(node)this.dir=node.parent;
    this.refreshView();
    if(Inspector.win)Inspector.show(node||this.dir);
  }
  refreshView(){
    if(!this.viewer)return;
    const target=this.sel||this.dir;
    this.viewer.setTitle('File Viewer  —  '+(VFS.pathOf(target)||'/'));
    this.renderPath();
    if(this.viewMode==='Browser')this.renderBrowser();
    else if(this.viewMode==='Icon')this.renderIcons();
    else this.renderListing();
  }
  /* ---- shelf ---- */
  shelfPaths(){return State.get('shelf',['/me']);}
  renderShelf(){
    const sh=this.shelfEl;sh.innerHTML='';
    const paths=this.shelfPaths();
    paths.forEach((p,i)=>{
      const n=VFS.resolve(p);
      const slot=el('div','shelfslot'+(n?' filled':''),sh);
      if(!n)return;
      slot.appendChild(Icons.make(iconFor(n),44));
      el('div','slbl',slot,n.name||'/');
      slot.addEventListener('dblclick',()=>this.openNode(n));
      slot.addEventListener('click',()=>{ if(n.type==='dir')this.navigate(n); else this.select(n); });
      slot.addEventListener('mousedown',ev=>{
        DnD.start(ev,{icon:iconFor(n),label:n.name,payload:{type:'file',node:n,fromShelf:i},
          onMiss:()=>{ /* dragged off shelf: remove */
            const ps=this.shelfPaths();ps.splice(i,1);State.set('shelf',ps);this.renderShelf();
          }});
      });
    });
    /* a few empty slots for looks; whole shelf is one drop target */
    for(let i=paths.length;i<8;i++)el('div','shelfslot',sh);
    sh.__drop={
      accepts:p=>p&&p.type==='file',
      over(e2){e2.style.background='#b8b8b8';},
      leave(e2){e2.style.background='';},
      drop:(p,info)=>{
        info.el.style.background='';
        const ps=this.shelfPaths();
        const path=VFS.pathOf(p.node);
        if(p.fromShelf!=null)return;
        if(ps.indexOf(path)<0){ps.push(path);State.set('shelf',ps);this.renderShelf();}
      }
    };
  }
  /* ---- icon path row ---- */
  renderPath(){
    const pe=this.pathEl;pe.innerHTML='';
    const chain=[];
    let n=this.sel||this.dir;
    while(n){chain.unshift(n);n=n.parent;}
    chain.forEach((node,i)=>{
      const it=el('div','pathitem'+(i===chain.length-1?' cur':''),pe);
      it.appendChild(Icons.make(node.parent?iconFor(node):'computer',44));
      el('div','plbl',it,node.parent?node.name:'localhost');
      it.addEventListener('click',()=>{
        if(node.type==='dir')this.navigate(node);
        else this.select(node);
      });
      this.makeFileDraggable(it,node);
    });
  }
  /* ---- browser (Miller columns) ---- */
  renderBrowser(){
    this.viewC.innerHTML='';
    const br=el('div','browser',this.viewC);
    br.style.cssText+='scrollbar-width:thin;';
    /* chain of dirs from root to this.dir */
    const chain=[];let n=this.dir;
    while(n){chain.unshift(n);n=n.parent;}
    chain.forEach((dirNode,ci)=>{
      const nextInChain=chain[ci+1]||null;
      this.makeColumn(br,dirNode,nextInChain,ci===chain.length-1?this.sel:null);
    });
    /* if selection is a leaf shown in last dir column, no extra column */
    br.scrollLeft=br.scrollWidth;
    this.browserEl=br;
  }
  makeColumn(br,dirNode,openChild,selLeaf){
    const col=el('div','bcol',br);
    const sv=makeScrollView(col);
    const items=VFS.list(dirNode);
    items.forEach(node=>{
      const row=el('div','brow',sv.content);
      const ic=el('div','bico',row);
      ic.appendChild(Icons.make(iconFor(node),14));
      el('div','bname',row,node.name);
      if(node.type==='dir')el('div','barr',row);
      if(node===openChild||node===selLeaf)row.classList.add('sel');
      row.addEventListener('click',()=>{
        const already=(this.sel===node)||(this.sel==null&&this.dir===node);
        if(already){ /* slow second click = rename */
          this.armRename(row.querySelector('.bname'),node);return;
        }
        if(node.type==='dir'){this.dir=node;this.sel=null;}
        else {this.dir=node.parent;this.sel=node;}
        this.refreshView();
        if(Inspector.win)Inspector.show(node);
      });
      row.addEventListener('dblclick',()=>this.openNode(node));
      this.makeFileDraggable(row,node);
      if(node.type==='dir'||node.type==='app'){
        row.__drop={
          accepts:p=>p&&p.type==='file'&&p.node!==node&&node.type==='dir',
          over(r){r.style.background='#c8c8c8';},
          leave(r){r.style.background='';},
          drop:(p,info)=>{info.el.style.background='';this.dropFile(p,node);}
        };
      }
    });
    setTimeout(()=>sv.refresh(),0);
    /* column background = drop into that dir */
    col.__drop={
      accepts:p=>p&&p.type==='file'&&p.node.parent!==dirNode&&!VFS.isAncestor(p.node,dirNode),
      drop:p=>this.dropFile(p,dirNode)
    };
    return col;
  }
  /* ---- icon view ---- */
  renderIcons(){
    this.viewC.innerHTML='';
    const wrap=el('div','sz1',this.viewC);
    wrap.style.cssText='position:absolute;inset:0;background:#fff;';
    const sv=makeScrollView(wrap);
    const iv=el('div','iconview',sv.content);
    iv.style.background='#fff';
    VFS.list(this.dir).forEach(node=>{
      const it=el('div','ivitem'+(node===this.sel?' sel':''),iv);
      it.appendChild(Icons.make(iconFor(node),48));
      el('div','ivlbl',it,node.name);
      it.addEventListener('click',()=>{
        if(this.sel===node){this.armRename(it.querySelector('.ivlbl'),node);return;}
        this.sel=node;this.refreshView();
        if(Inspector.win)Inspector.show(node);
      });
      it.addEventListener('dblclick',()=>this.openNode(node));
      this.makeFileDraggable(it,node);
      if(node.type==='dir')it.__drop={
        accepts:p=>p&&p.type==='file'&&p.node!==node,
        over(r){r.style.background='#ddd';},leave(r){r.style.background='';},
        drop:(p,info)=>{info.el.style.background='';this.dropFile(p,node);}
      };
    });
    setTimeout(()=>sv.refresh(),0);
  }
  /* ---- listing view ---- */
  renderListing(){
    this.viewC.innerHTML='';
    const wrap=el('div','sz1',this.viewC);
    wrap.style.cssText='position:absolute;inset:0;background:#fff;';
    const sv=makeScrollView(wrap);
    const lv=el('div','listview',sv.content);
    const hdr=el('div','lvrow hdr',lv);
    el('div','c1',hdr,'Name');el('div','c2',hdr,'Size');el('div','c3',hdr,'Last Modified');
    VFS.list(this.dir).forEach(node=>{
      const r=el('div','lvrow'+(node===this.sel?' sel':''),lv);
      const c1=el('div','c1',r);
      c1.appendChild(Icons.make(iconFor(node),14));
      el('span','',c1,node.name);
      el('div','c2',r,node.type==='file'?fmtSize(node.size):'--');
      el('div','c3',r,fmtDate(node.date));
      r.addEventListener('click',()=>{
        if(this.sel===node){this.armRename(r.querySelector('.c1 span'),node);return;}
        this.sel=node;this.refreshView();
        if(Inspector.win)Inspector.show(node);
      });
      r.addEventListener('dblclick',()=>this.openNode(node));
      this.makeFileDraggable(r,node);
    });
    setTimeout(()=>sv.refresh(),0);
  }
  /* ---- drag / drop / rename ---- */
  makeFileDraggable(el2,node){
    if(!node.parent)return;
    el2.addEventListener('mousedown',ev=>{
      if(ev.detail>1)return;
      DnD.start(ev,{icon:iconFor(node),label:node.name,payload:{type:'file',node:node}});
    });
  }
  dropFile(p,destDir){
    if(destDir.type!=='dir'){Sound.beep();return;}
    if(p.copy)VFS.copy(p.node,destDir);
    else VFS.move(p.node,destDir);
    logMsg('Workspace: '+(p.copy?'copied ':'moved ')+p.node.name+' to '+VFS.pathOf(destDir));
    this.refreshView();
  }
  armRename(labelEl,node){
    if(this.renameTimer)clearTimeout(this.renameTimer);
    this.renameTimer=setTimeout(()=>this.startRename(labelEl,node),520);
  }
  startRename(labelEl,node){
    if(!node.parent)return;
    const inp=document.createElement('input');
    inp.className='tf';
    inp.style.cssText='height:16px;font-size:11px;padding:0 2px;width:120px;';
    inp.value=node.name;
    labelEl.textContent='';
    labelEl.appendChild(inp);
    inp.focus();inp.select();
    const finish=ok=>{
      const v=inp.value.trim();
      inp.remove();
      if(ok&&v&&v!==node.name)VFS.rename(node,v);
      this.refreshView();
    };
    inp.addEventListener('keydown',ev=>{
      ev.stopPropagation();
      if(ev.key==='Enter')finish(true);
      if(ev.key==='Escape')finish(false);
    });
    inp.addEventListener('blur',()=>finish(true));
    inp.addEventListener('mousedown',ev=>ev.stopPropagation());
  }
  /* ---- open ---- */
  openNode(node){
    if(this.renameTimer){clearTimeout(this.renameTimer);this.renameTimer=null;}
    if(node.type==='dir'){this.navigate(node);return;}
    if(node.type==='app'){
      if(!Apps.launchBundle(node.name))
        nxAlert({app:this,title:'Workspace',msg:'Cannot launch '+node.name,
          info:'This application is present on the disk but is not part of the simulation. Try one of the tiles in the Dock, or the applications in /NextApps.',buttons:['OK']});
      return;
    }
    const n=node.name.toLowerCase();
    if(n.endsWith('.rtf')||n.endsWith('.rtfd')||n==='.cshrc'||n.endsWith('.txt')||node.name==='README'||n==='messages'||n.endsWith('.table')||n==='passwd'||n==='motd'||n==='hostconfig'){
      Apps.byName['Edit'].launch({openNode:node});return;
    }
    if(n.endsWith('.tiff')||n.endsWith('.tif')||n.endsWith('.eps')||n.endsWith('.ps')){
      Apps.byName['Preview'].launch({openNode:node});return;
    }
    if(n.endsWith('.snd')){SoundPlayer.open(node);return;}
    /* default: peek in Edit if it has content, else alert */
    if(node.content){Apps.byName['Edit'].launch({openNode:node});return;}
    nxAlert({app:this,title:'Workspace',msg:'No application is bound to "'+node.name+'".',
      info:'Use the Inspector’s Tools view to see application bindings.',buttons:['OK']});
  }
  revealNode(node){
    this.makeActive();
    if(node.type==='dir')this.navigate(node);
    else{this.dir=node.parent;this.sel=node;this.refreshView();}
  }
  /* ---- file ops ---- */
  newFolder(){
    const d=VFS.mkdir(this.dir,'NewFolder');
    this.sel=d;this.refreshView();
    logMsg('Workspace: created folder '+VFS.pathOf(d));
  }
  duplicate(){
    if(!this.sel){Sound.beep();return;}
    const c=VFS.copy(this.sel,this.sel.parent);
    this.sel=c;this.refreshView();
  }
  compress(){
    if(!this.sel){Sound.beep();return;}
    const n=this.sel;
    const z=VFS.createFile(n.parent,n.name+'.compressed','');
    z.size=Math.max(64,Math.round(n.size*0.38));
    VFS.save();
    this.refreshView();
    logMsg('Workspace: compressed '+n.name);
  }
  destroy(){
    if(!this.sel){Sound.beep();return;}
    const n=this.sel;
    nxAlert({app:this,title:'Destroy',icon:'computer',
      msg:'Destroy "'+n.name+'"?',
      info:'The selected item will be destroyed immediately. It will NOT be placed in the Recycler and cannot be recovered. Are you certain?',
      buttons:['Cancel','Destroy'],def:0}).then(r=>{
        if(r==='Destroy'){
          VFS.remove(n);
          this.sel=null;this.refreshView();
          logMsg('Workspace: destroyed '+n.name);
        }
      });
  }
  recycler(){return VFS.resolve('/me/.recycler');}
  recycle(node){
    if(!node.parent)return;
    VFS.move(node,this.recycler());
    this.refreshView();
    if(this.recWin)this.renderRecycler();
    logMsg('Workspace: '+node.name+' moved to Recycler');
  }
  openRecycler(){
    this.makeActive();
    if(this.recWin){this.recWin.deminiaturize();WS.makeKey(this.recWin);this.renderRecycler();return;}
    const w=this.recWin=WS.create({app:this,title:'Recycler',width:420,height:260,
      persistKey:'recycler',miniIcon:'recycler',onClose:()=>{this.recWin=null;}});
    this.renderRecycler();
    w.onResize=()=>this.renderRecycler();
  }
  renderRecycler(){
    const w=this.recWin;if(!w)return;
    w.cnt.innerHTML='';
    const sv=makeScrollView(w.cnt);
    const iv=el('div','iconview',sv.content);
    const items=VFS.list(this.recycler());
    if(!items.length){
      const e2=el('div','',iv,'The Recycler is empty.');
      e2.style.cssText='padding:20px;color:#555;';
    }
    items.forEach(node=>{
      const it=el('div','ivitem',iv);
      it.appendChild(Icons.make(iconFor(node),48));
      el('div','ivlbl',it,node.name);
      this.makeFileDraggable(it,node);
    });
    setTimeout(()=>sv.refresh(),0);
  }
  emptyRecycler(){
    const items=VFS.list(this.recycler(),true);
    if(!items.length){Sound.beep();return;}
    nxAlert({app:this,title:'Empty Recycler',icon:'recycler',
      msg:'Empty the Recycler?',
      info:items.length+' item'+(items.length>1?'s':'')+' will be destroyed. This cannot be undone.',
      buttons:['Cancel','Empty'],def:1}).then(r=>{
        if(r==='Empty'){
          items.forEach(n=>VFS.remove(n));
          if(this.recWin)this.renderRecycler();
          logMsg('Workspace: Recycler emptied');
        }
      });
  }
  processesPanel(){
    const w=WS.create({app:this,title:'Processes',width:300,height:240,persistKey:'procs'});
    const sv=makeScrollView(w.cnt);
    const list=el('div','listview',sv.content);
    ['Workspace','WindowServer','netinfod','lookupd','pbs','syslogd']
      .concat(Apps.list.filter(a=>a.running&&a!==this).map(a=>a.name))
      .forEach(nm=>{
        const r=el('div','lvrow',list);
        el('div','c1',r,nm);
        el('div','c2',r,String(50+((nm.length*137)%400)));
      });
    setTimeout(()=>sv.refresh(),0);
  }
  openInspector(){Inspector.open(this.sel||this.dir);}
}

  show(node){

  },
  render(){
    const b=this.body,n=this.node;b.innerHTML='';
    if(!n){el('div','',b,'No selection').style.cssText='padding:16px;color:#555;';return;}
    const head=el('div','',b);
    head.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #999;';
    head.appendChild(Icons.make(iconFor(n),48));
