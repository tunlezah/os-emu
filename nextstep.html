    el('div','',hh,n.name||'/').style.fontWeight='bold';
    const p=el('div','',hh,VFS.pathOf(n.parent)||'/');
    p.style.cssText='font-size:10px;color:#444;max-width:160px;overflow:hidden;text-overflow:ellipsis;';
    const pane=el('div','',b);
    pane.style.cssText='padding:10px 12px;font-size:12px;line-height:1.7;overflow:auto;height:calc(100% - 70px);';
    if(this.mode==='Attributes'){
      const rows=[
        ['Type',n.type==='app'?'Application':(n.type==='dir'?'Folder':this.kindOf(n))],
        ['Size',n.type==='file'?fmtSize(n.size):VFS.list(n,true).length+' items'],
        ['Owner',n.owner],['Group',n.group],
        ['Modified',fmtDate(n.date)],
        ['Permissions',(n.type==='file'?'-':'d')+n.perms]
      ];
      rows.forEach(r=>{
        const d=el('div','',pane);
        d.innerHTML='<b style="display:inline-block;width:92px">'+r[0]+':</b>'+r[1];
      });
    } else if(this.mode==='Contents'){
      if(n.type==='app'||n.type==='dir'){
        el('div','',pane,(n.type==='app'?'This application is a bundle — a folder that behaves as a single file:':'Folder contents:')).style.marginBottom='6px';
        VFS.list(n,true).forEach(c=>{
          const r=el('div','',pane,'   '+c.name+(c.type!=='file'?'/':''));
          r.style.cssText='font-family:monospace;font-size:11px;line-height:1.5;';
        });
        if(!VFS.list(n,true).length)el('div','',pane,'(empty)');
      } else if(n.content){
        const pre=el('div','',pane,fileContent(n).slice(0,900));
        pre.style.cssText='white-space:pre-wrap;font-size:11px;background:#fff;padding:6px;border:1px solid #888;';
      } else {
        el('div','',pane,'No preview available for this file. ('+this.kindOf(n)+')');
      }
    } else if(this.mode==='Tools'){
      el('div','',pane,'Default application for this file type:').style.marginBottom='8px';
      const app=this.boundApp(n);
      const d=el('div','',pane);
      d.style.cssText='display:flex;align-items:center;gap:8px;';
      d.appendChild(Icons.make(app[1],32));
      el('div','',d,app[0]);
      el('div','',pane,'Double-clicking the file in the File Viewer opens it with this application.').style.cssText='margin-top:10px;font-size:11px;color:#333;';
    } else { /* Access Control */
      el('div','',pane,'UNIX permissions').style.marginBottom='6px';
      const grid=el('div','',pane);
      grid.style.cssText='display:grid;grid-template-columns:70px repeat(3,52px);gap:4px 6px;align-items:center;';
      el('div','',grid,'');['Read','Write','Execute'].forEach(h=>{
        const d=el('div','',grid,h);d.style.cssText='font-size:10px;font-weight:bold;';
      });
      const who=['Owner','Group','World'];
      who.forEach((wh,wi)=>{
        el('div','',grid,wh).style.fontSize='11px';
        for(let i=0;i<3;i++){
          const idx=wi*3+i;
          const on=n.perms[idx]!=='-';
          const c=makeChk('',on,v=>{
            const chars=n.perms.split('');
            chars[idx]=v?'rwx'[i]:'-';
            n.perms=chars.join('');VFS.save();
          });
          grid.appendChild(c);
        }
      });
      el('div','',pane,'Owner: '+n.owner+'    Group: '+n.group).style.cssText='margin-top:12px;font-size:11px;';
    }
  },
  kindOf(n){
    const x=n.name.toLowerCase();
    if(x.endsWith('.rtf'))return 'Rich Text (RTF) document';
    if(x.endsWith('.rtfd'))return 'Rich Text with graphics (RTFD)';
    if(x.endsWith('.tiff')||x.endsWith('.tif'))return 'TIFF image';
    if(x.endsWith('.eps'))return 'Encapsulated PostScript';
    if(x.endsWith('.ps'))return 'PostScript document';
    if(x.endsWith('.snd'))return 'Sound';
    if(x.endsWith('.nib'))return 'Interface Builder archive';
    return 'Plain file';
  },
  boundApp(n){
    const x=n.name.toLowerCase();
    if(n.type==='app')return ['Workspace','computer'];
    if(x.endsWith('.tiff')||x.endsWith('.tif')||x.endsWith('.eps')||x.endsWith('.ps'))return ['Preview','preview'];
    if(x.endsWith('.snd'))return ['SoundPlayer','sound'];
    if(x.endsWith('.nib'))return ['InterfaceBuilder','ib'];
    return ['Edit','edit'];
  }
};

class TermSession{
  constructor(win){
    this.win=win;
    this.fontSize=12;
    this.cwd=VFS.resolve(Session.user==='root'?'/root':'/me')||VFS.root;
    this.buf='';
    this.line='';
    this.history=State.get('termHistory',[]);
    this.hIdx=this.history.length;
    this.sv=makeScrollView(win.cnt);
    this.out=el('div','termtext',this.sv.content);
    win.onResize=()=>this.sv.refresh();
    this.print('NeXTSTEP Release 3.3 (localhost)\nCopyright-era workstation — simulated shell.\n');
    this.motd();
    this.prompt();
  }
  motd(){this.print('Type "help" for available commands.\n\n');}
  ps1(){return Session.host+(Session.user==='root'?'# ':'> ');}
  prompt(){this.print(this.ps1());this.render();}
  print(s){this.buf+=s;this.render();}
  render(){
    this.out.innerHTML='';
    this.out.appendChild(document.createTextNode(this.buf+this.line));
    const cur=el('span','cursor',this.out,' ');
    this.sv.refresh();this.sv.scrollToBottom();
    this.win.setTitle('Terminal — '+(VFS.pathOf(this.cwd)||'/'));
  }
  clear(){this.buf='';this.prompt();}
  interrupt(){this.print(this.line+'^C\n');this.line='';this.prompt();}
  key(ev){
    if(ev.ctrlKey){
      if(ev.key==='c'){ev.preventDefault();this.interrupt();return;}
      if(ev.key==='l'){ev.preventDefault();this.clear();return;}
      if(ev.key==='u'){ev.preventDefault();this.line='';this.render();return;}
      return;
    }
    if(ev.key==='Enter'){
      ev.preventDefault();
      const cmd=this.line;
      this.buf+=this.line+'\n';this.line='';
      this.run(cmd.trim());
      return;
    }
    if(ev.key==='Backspace'){ev.preventDefault();this.line=this.line.slice(0,-1);this.render();return;}
    if(ev.key==='ArrowUp'){ev.preventDefault();
      if(this.hIdx>0){this.hIdx--;this.line=this.history[this.hIdx]||'';this.render();}return;}
    if(ev.key==='ArrowDown'){ev.preventDefault();
      if(this.hIdx<this.history.length){this.hIdx++;this.line=this.history[this.hIdx]||'';this.render();}return;}
    if(ev.key==='Tab'){ev.preventDefault();this.complete();return;}
    if(ev.key.length===1){ev.preventDefault();this.line+=ev.key;this.render();}
  }
  complete(){
    const parts=this.line.split(/\s+/);
    const last=parts[parts.length-1]||'';
    const names=Object.keys(this.cwd.children||{}).filter(n=>n.indexOf(last)===0);
    if(names.length===1){
      parts[parts.length-1]=names[0];
      this.line=parts.join(' ');this.render();
    } else Sound.beep();
  }
  resolve(p){
    if(!p)return this.cwd;
    if(p==='~')p=Session.user==='root'?'/root':'/me';
    if(p.indexOf('~/')===0)p=(Session.user==='root'?'/root':'/me')+p.slice(1);
    return VFS.resolve(p,this.cwd);
  }
  run(cmdline){
    if(cmdline){
      this.history.push(cmdline);
      if(this.history.length>200)this.history=this.history.slice(-200);
      State.set('termHistory',this.history);
    }
    this.hIdx=this.history.length;
    if(cmdline)this.exec(cmdline);
    this.prompt();
  }
  exec(cmdline){
    const argv=cmdline.split(/\s+/);
    const cmd=argv[0],args=argv.slice(1);
    const flags=args.filter(a=>a[0]==='-').join('');
    const files=args.filter(a=>a[0]!=='-');
    const P=s=>this.print(s);
    const C=TermCommands;
    if(C[cmd])C[cmd](this,args,flags,files);
    else if(cmd==='exit'||cmd==='logout')this.win.close();
    else P(cmd+': Command not found.\n');
  }
}

const TermCommands={
  help(t){t.print(
    'Simulated commands:\n'+
    '  ls cd pwd cat more cp mv rm mkdir touch echo date whoami hostname\n'+
    '  ps w uname hostinfo df du history clear man gdb cc open banner\n'+
    '  exit/logout close this window.  This is an exhibit: nothing real runs.\n');},
  ls(t,args,flags,files){
    const long=flags.indexOf('l')>=0,all=flags.indexOf('a')>=0;
    const dir=files.length?t.resolve(files[0]):t.cwd;
    if(!dir){t.print('ls: '+files[0]+' not found\n');return;}
    if(dir.type==='file'){t.print(dir.name+'\n');return;}
    const items=VFS.list(dir,all);
    if(long){
      t.print('total '+items.length+'\n');
      items.forEach(n=>{
        const tchar=n.type==='file'?'-':'d';
        const d=new Date(n.date);
        t.print(tchar+n.perms+'  1 '+n.owner.padEnd(8)+' '+n.group.padEnd(8)+
          String(n.size).padStart(9)+' '+MONTHS[d.getMonth()]+' '+String(d.getDate()).padStart(2)+
          '  '+d.getFullYear()+' '+n.name+(n.type==='dir'?'/':'')+'\n');
      });
    } else {
      let out='';
      items.forEach((n,i)=>{out+=(n.name+(n.type!=='file'&&flags.indexOf('F')>=0?'/':'')).padEnd(24);
        if((i+1)%3===0)out+='\n';});
      t.print(out+(out.endsWith('\n')?'':'\n'));
    }
  },
  cd(t,args,flags,files){
    const target=files.length?t.resolve(files[0]):t.resolve('~');
    if(!target||target.type==='file')t.print(files[0]+': No such directory.\n');
    else t.cwd=target;
  },
  pwd(t){t.print((VFS.pathOf(t.cwd)||'/')+'\n');},
  cat(t,args,flags,files){
    if(!files.length){t.print('usage: cat file ...\n');return;}
    files.forEach(f=>{
      const n=t.resolve(f);
      if(!n)t.print('cat: '+f+': No such file or directory\n');
      else if(n.type!=='file')t.print('cat: '+f+': Is a directory\n');
      else t.print(fileContent(n)||('cat: '+f+': binary file — '+fmtSize(n.size)+'\n'));
    });
    t.print('\n');
  },
  more(t,a,f2,files){TermCommands.cat(t,a,f2,files);},
  cp(t,args,flags,files){
    if(files.length<2){t.print('usage: cp f1 f2\n');return;}
    const src=t.resolve(files[0]),dst=t.resolve(files[1]);
    if(!src){t.print('cp: '+files[0]+': No such file\n');return;}
    if(dst&&dst.type==='dir')VFS.copy(src,dst);
    else{const c=VFS.copy(src,t.cwd);VFS.rename(c,files[1].split('/').pop());}
    Workspace.refreshView&&Workspace.refreshView();
  },
  mv(t,args,flags,files){
    if(files.length<2){t.print('usage: mv f1 f2\n');return;}
    const src=t.resolve(files[0]),dst=t.resolve(files[1]);
    if(!src){t.print('mv: '+files[0]+': No such file\n');return;}
    if(dst&&dst.type==='dir')VFS.move(src,dst);
    else VFS.rename(src,files[1].split('/').pop());
    Workspace.refreshView&&Workspace.refreshView();
  },
  rm(t,args,flags,files){
    files.forEach(f=>{
      const n=t.resolve(f);
      if(!n){t.print('rm: '+f+': No such file\n');return;}
      if(n.type!=='file'&&flags.indexOf('r')<0){t.print('rm: '+f+': is a directory\n');return;}
      VFS.remove(n);
    });
    Workspace.refreshView&&Workspace.refreshView();
  },
  mkdir(t,args,flags,files){
    files.forEach(f=>VFS.mkdir(t.cwd,f));
    Workspace.refreshView&&Workspace.refreshView();
  },
  touch(t,args,flags,files){
    files.forEach(f=>VFS.createFile(t.cwd,f,''));
    Workspace.refreshView&&Workspace.refreshView();
  },
  echo(t,args){t.print(args.join(' ')+'\n');},
  date(t){t.print(new Date().toString()+'\n');},
  whoami(t){t.print(Session.user+'\n');},
  hostname(t){t.print('localhost\n');},
  history(t){const st=Math.max(0,t.history.length-20);
    t.history.slice(-20).forEach((h,i)=>t.print(String(st+i+1).padStart(6)+'  '+h+'\n'));},
  clear(t){t.clear();},
  uname(t,args,flags){
    if(flags.indexOf('a')>=0)t.print('NeXT localhost 3.3 NeXT-3.3.0: Wed Oct 25 1994; root(rcbuilder) m68k\n');
    else t.print('NeXT\n');
  },
  hostinfo(t){t.print(
    'Mach kernel version:\n\t NeXT Mach 3.3: Wed Oct 25 1994; root(rcbuilder)\n'+
    'Kernel configured for a single processor only.\n'+
    '1 processor is physically available.\n'+
    'Processor type: MC680x0 (68040)\n'+
    'Processor speed: 25 MHz\n'+
    'Primary memory available: 32.00 megabytes.\n'+
    'Default processor set: 62 tasks, 84 threads, 1 processors\n');},
  df(t){t.print(
    'Filesystem    kbytes     used    avail  capacity  Mounted on\n'+
    '/dev/sd0a    1006862   812371   93810      90%    /\n'+
    '/dev/fd0        1345        0    1345       0%    /media\n');},
  du(t){t.print('Use df for the whole disk; du in this exhibit only says:\n'+
    VFS.list(t.cwd).map(n=>String(Math.ceil(n.size/1024)).padStart(8)+'  ./'+n.name).join('\n')+'\n');},
  ps(t,args){
    const aux=args.join('').indexOf('aux')>=0||args.join('').indexOf('-aux')>=0;
    const rows=[
      ['root','1','0.0','init'],['root','52','0.1','kern_loader'],
      ['root','58','0.0','nmserver'],['root','61','0.2','netinfod local (master)'],
      ['root','64','0.0','lookupd'],['root','66','0.0','syslogd'],
      ['root','72','0.0','portmap'],['root','88','0.0','sendmail: accepting connections'],
      ['root','93','0.0','cron'],['root','101','4.2','WindowServer'],
      ['root','104','0.0','pbs'],['root','107','0.0','npd'],
      [Session.user,'112','1.1','Workspace'],[Session.user,'109','0.0','loginwindow console'],
      [Session.user,'131','0.0','-csh (csh)'],[Session.user,'142','0.0','ps '+(args.join(' ')||'')]
    ];
    Apps.list.filter(a=>a.running&&a.bundle).forEach((a,i)=>rows.splice(14,0,[Session.user,String(150+i*3),'0.4',a.name]));
    if(aux){
      t.print('USER       PID %CPU %MEM   VSZ  RSS TT  STAT  TIME COMMAND\n');
      rows.forEach(r=>t.print(r[0].padEnd(9)+r[1].padStart(5)+r[2].padStart(5)+'  1.2  1.4M 420K co  S    0:0'+
        (r[1]%7)+' '+r[3]+'\n'));
    } else {
      t.print('   PID TT  STAT  TIME COMMAND\n');
      rows.slice(12).forEach(r=>t.print(r[1].padStart(6)+' co  S    0:00 '+r[3]+'\n'));
    }
  },
  w(t){t.print(
    ' '+new Date().toTimeString().slice(0,8)+'  up 2 days,  3:14,  2 users,  load average: 0.12, 0.09, 0.02\n'+
    'USER     TTY  FROM     LOGIN@   IDLE   WHAT\n'+
    (Session.user+'').padEnd(9)+'co   -        9:02am     -    Workspace\n'+
    (Session.user+'').padEnd(9)+'p0   -        9:03am     -    w\n');},
  gdb(t,args){t.print(
    'GDB 3.95 (NeXT Computer), Copyright-era debugger.\n'+
    'Reading symbols from '+(args[0]||'a.out')+'...'+(args[0]?'done.\n':'no such file.\n')+
    '(gdb) run\nThe program made it exactly nowhere: this is a museum exhibit.\n'+
    '(gdb) quit\n');},
  cc(t,args){t.print(args.length?('cc: warning: this exhibit compiles nothing; try ProjectBuilder\'s Build button\n'):'cc: no input files\n');},
  make(t){t.print('make: *** No targets specified.  This machine builds character, not objects.  Stop.\n');},
  banner(t,args){
    const s=(args.join(' ')||'NeXT').slice(0,8).toUpperCase();
    t.print('\n'+s.split('').map(ch=>' '+ch.repeat(6)).join('\n')+'\n\n');
  },
  open(t,args,flags,files){
    if(!files.length){t.print('usage: open file\n');return;}
    const n=t.resolve(files[0]);
    if(!n){t.print('open: '+files[0]+': No such file\n');return;}
    Workspace.openNode(n);
  },
  nmi(t){t.print('entering NMI mini-monitor...\n');NMI.open();},
  man(t,args){
    const pages={
      ls:'LS(1)\n\nNAME\n     ls - list contents of directory\n\nSYNOPSIS\n     ls [ -aFl ] [ name ... ]\n\nDESCRIPTION\n     For each directory argument, ls lists the contents; for each file\n     argument, ls repeats its name.  The output is sorted alphabetically.\n     -l   List in long format, giving mode, owner, size and modification time.\n     -a   List all entries, including those beginning with a dot.\n     -F   Mark directories with a trailing slash.',
      cat:'CAT(1)\n\nNAME\n     cat - concatenate and print\n\nSYNOPSIS\n     cat file ...\n\nDESCRIPTION\n     cat reads each file in sequence and writes it on the standard output.\n     On this workstation the standard output is, of course, simulated.',
      ps:'PS(1)\n\nNAME\n     ps - process status\n\nSYNOPSIS\n     ps [ aux ]\n\nDESCRIPTION\n     ps prints information about processes.  With aux, every process on the\n     system appears, including WindowServer, netinfod and the pasteboard\n     server pbs — the cast that makes the desktop feel alive.',
      csh:'CSH(1)\n\nNAME\n     csh - a shell with C-like syntax\n\nDESCRIPTION\n     Csh is a command interpreter.  It offers history (arrow keys here),\n     filename completion (Tab), and the prompt you are looking at.',
      man:'MAN(1)\n\nNAME\n     man - display reference pages\n\nSYNOPSIS\n     man title\n\nDESCRIPTION\n     man locates and prints the named page.  Pages available in this\n     exhibit: ls, cat, ps, csh, man.'
    };
    const p=pages[args[0]];
    if(!args.length)t.print('usage: man title\n');
    else if(p)t.print(p+'\n\n');
    else t.print('No manual entry for '+args[0]+'.\n');
  }
};
/* =====================================================================
   File panels (Open / Save) — shared by applications
   ===================================================================== */
function filePanel(o){ /* {app,save,defaultName,startDir} -> Promise({dir,name,node}|null) */
  return new Promise(res=>{
    const w=WS.create({app:o.app,title:o.save?'Save':'Open',width:340,height:380,
      resizable:false,miniaturizable:false});
    let dir=o.startDir||VFS.resolve('/me');
    const crumbs=el('div','',w.cnt);
    crumbs.style.cssText='height:22px;line-height:22px;padding:0 8px;border-bottom:1px solid #777;font-size:11px;overflow:hidden;white-space:nowrap;';
    const listC=el('div','',w.cnt);
    listC.style.cssText='position:absolute;left:6px;right:6px;top:26px;bottom:'+(o.save?'96px':'56px')+';border:1px solid #000;';
    let nameInp=null;
    if(o.save){
      const nr=el('div','',w.cnt);
      nr.style.cssText='position:absolute;left:10px;right:10px;bottom:52px;display:flex;align-items:center;gap:6px;';
      el('label','fl',nr,'Name:');
      nameInp=el('input','tf',nr);
      nameInp.value=o.defaultName||'Untitled.rtf';
    }
    const bb=el('div','',w.cnt);
    bb.style.cssText='position:absolute;right:10px;bottom:12px;display:flex;gap:10px;';
    const cancel=el('div','btn',bb,'Cancel');
    const okb=el('div','btn default',bb,o.save?'Save':'Open');
    el('span','ret',okb,'⏎');
    let sel=null;
    function render(){
      listC.innerHTML='';
      const sv=makeScrollView(listC);
      if(dir.parent){
        const up=el('div','brow',sv.content);
        el('div','bname',up,'..');
        up.addEventListener('dblclick',()=>{dir=dir.parent;sel=null;render();});
        up.addEventListener('click',()=>{});
      }
      VFS.list(dir).forEach(n=>{
        const r=el('div','brow',sv.content);
        const ic=el('div','bico',r);ic.appendChild(Icons.make(iconFor(n),14));
        el('div','bname',r,n.name);
        if(n.type==='dir')el('div','barr',r);
        r.addEventListener('click',()=>{
          sel=n;
          [...sv.content.children].forEach(c=>c.classList.remove('sel'));
          r.classList.add('sel');
          if(nameInp&&n.type==='file')nameInp.value=n.name;
        });
        r.addEventListener('dblclick',()=>{
          if(n.type==='dir'){dir=n;sel=null;render();}
          else done(n);
        });
      });
      crumbs.textContent=VFS.pathOf(dir)||'/';
      setTimeout(()=>sv.refresh(),0);
    }
    function done(n){
      w.close(true);
      if(o.save)res({dir:dir,name:(nameInp.value.trim()||'Untitled.rtf'),node:null});
      else res({dir:dir,node:n||sel});
    }
    cancel.addEventListener('click',()=>{w.close(true);res(null);});
    okb.addEventListener('click',()=>{
      if(o.save)done(null);
      else if(sel&&sel.type==='dir'){dir=sel;sel=null;render();}
      else if(sel)done(sel);
      else Sound.beep();
    });
    render();
    w.center();
  });
}

function printPanel(app,docName,getText){

    '<rect x="2" y="2" width="70" height="92" fill="#fff" stroke="#000"/>'+
    '<rect x="4" y="4" width="66" height="88" fill="none" stroke="#bbb"/>'+
    '<g stroke="#999"><path d="M10 16h54M10 22h54M10 28h44M10 38h54M10 44h54M10 50h50M10 60h54M10 66h34"/></g></svg>';
  const f=el('div','',b);
  f.style.cssText='flex:1;display:flex;flex-direction:column;gap:9px;font-size:12px;';
  const r1=el('div','',f);r1.style.cssText='display:flex;align-items:center;gap:8px;';
  el('label','fl',r1,'Printer:');
  r1.appendChild(makePopup(['Local_Laser_400dpi','ACC_2nd_Floor','NeXT_Color'],'Local_Laser_400dpi'));
  const r2=el('div','',f);r2.style.cssText='display:flex;align-items:center;gap:8px;';
  el('label','fl',r2,'Copies:');
  const cp=el('input','tf',r2);cp.value='1';cp.style.width='46px';
  el('label','fl',r2,'Pages:');
  r2.appendChild(makePopup(['All','From 1 to 1'],'All'));
  const r3=el('div','',f);r3.style.cssText='display:flex;align-items:center;gap:8px;';
  el('label','fl',r3,'Resolution:');
  r3.appendChild(makePopup(['400 dpi','300 dpi'],'400 dpi'));
  const bb=el('div','alertbtns',w.cnt);
  const mk=t=>el('div','btn',bb,t);
  const cancel=mk('Cancel'),save=mk('Save...'),preview=mk('Preview'),print=el('div','btn default',bb,'Print');
  el('span','ret',print,'⏎');
  cancel.addEventListener('click',()=>w.close());
  save.addEventListener('click',()=>{
    w.close();
    filePanel({app:app,save:true,defaultName:(docName||'Document').replace(/\.\w+$/,'')+'.ps',
      startDir:VFS.resolve('/me')}).then(r=>{
        if(!r)return;
        VFS.createFile(r.dir,r.name,'%!PS-Adobe-2.0\n%%Title: '+docName+'\n%%Creator: '+app.name+
          '\n%%Pages: 1\n\n% simulated PostScript output\nshowpage\n%%EOF\n');
        Workspace.refreshView();
        logMsg(app.name+': wrote PostScript to '+r.name);
      });
  });
  preview.addEventListener('click',()=>{
    w.close();
    Apps.byName['Preview'].launch({previewText:{name:docName,text:getText?getText():''}});
  });
  print.addEventListener('click',()=>{
    w.close();
    const job={doc:docName||'Untitled',owner:Session.user||'me',status:'printing'};
    PrintQueue.push(job);
    setTimeout(()=>{job.status='done';
      const pm=Apps.byName['PrintManager'];
      if(pm&&pm.running&&pm.render)pm.render();},4000);
    const pm=Apps.byName['PrintManager'];
    if(pm&&pm.running&&pm.render)pm.render();
    logMsg('npd: spooled "'+docName+'" to Local_Laser_400dpi');
    nxAlert({app:app,title:'Print',icon:'printer',msg:'Printing "'+docName+'".',
      info:'The document was spooled to Local_Laser_400dpi. In 1995 you would now hear the laser printer warming up. Open PrintManager to watch the queue.',buttons:['OK']});
  });
  w.el.style.height='auto';w.center();
}

class EditApp extends NXApp{
  constructor(){
    super({name:'Edit',icon:'edit',bundle:'Edit.app',version:'3.3 (v423)',
      credits:'Edit\nRich and plain text, the developer\'s companion.\nRTF simulation — formatting is skin deep here.'});
    this.untitled=1;
  }
  menuTree(){
    return [
      this.stdInfo(),
      {label:'Document',submenu:[
        {label:'Open...',key:'o',action:()=>this.openDoc()},
        {label:'New',key:'n',action:()=>this.newDoc()},
        {label:'Save',key:'s',action:()=>this.saveDoc(false)},
        {label:'Save As...',action:()=>this.saveDoc(true)},
        {label:'Revert to Saved',action:()=>this.revert()},
        {label:'Close',action:()=>{if(WS.keyWin)WS.keyWin.requestClose();}}
      ]},
      this.stdEdit(),
      {label:'Format',submenu:[
        {label:'Font',submenu:[
          {label:'Bold',key:'b',action:()=>document.execCommand('bold')},
          {label:'Italic',key:'i',action:()=>document.execCommand('italic')},
          {label:'Underline',key:'u',action:()=>document.execCommand('underline')},
          {label:'Larger',action:()=>document.execCommand('increaseFontSize')},
          {label:'Smaller',action:()=>document.execCommand('decreaseFontSize')}
        ]},
        {label:'Text',submenu:[
          {label:'Align Left',action:()=>document.execCommand('justifyLeft')},
          {label:'Center',action:()=>document.execCommand('justifyCenter')},
          {label:'Align Right',action:()=>document.execCommand('justifyRight')}
        ]},
        {label:'Page Layout...',action:()=>Sound.beep()}
      ]},
      this.stdWindows(),
      this.stdServices(),
      {label:'Print...',key:'p',action:()=>this.print()}
    ].concat(this.stdHideQuit());
  }
  onLaunch(arg){
    if(arg&&arg.openNode)this.openNode(arg.openNode);
    else this.newDoc();
  }
  onOpen(arg){
    if(arg&&arg.openNode)this.openNode(arg.openNode);
  }
  docWin(){
    const w=WS.keyWin;
    return (w&&w.__edit&&w.app===this)?w:this.windows.find(x=>x.__edit)||null;
  }
  newDoc(node){
    const title=node?node.name:('Untitled-'+(this.untitled++));
    const w=WS.create({app:this,title:title+'  —  '+(node?VFS.pathOf(node.parent):'/me'),
      width:560,height:420,minWidth:300,minHeight:180,
      onCloseRequest:win=>this.confirmClose(win)});
    w.__edit={node:node||null,dirty:false,name:title};
    const sv=makeScrollView(w.cnt);
    const ed=el('div','',sv.content);
    ed.contentEditable='true';
    ed.style.cssText='min-height:360px;background:#fff;padding:10px 14px;font:13px Helvetica,Arial,sans-serif;line-height:1.4;outline:none;white-space:pre-wrap;';
    ed.addEventListener('input',()=>{w.__edit.dirty=true;sv.refresh();});
    w.__edit.ed=ed;w.__edit.sv=sv;
    if(node)ed.textContent=fileContent(node);
    w.onResize=()=>sv.refresh();
    setTimeout(()=>{sv.refresh();ed.focus();},0);
    return w;
  }
  openNode(node){
    const existing=this.windows.find(w=>w.__edit&&w.__edit.node===node);
    if(existing){existing.deminiaturize();WS.makeKey(existing);return;}
    this.newDoc(node);
  }
  openDoc(){
    filePanel({app:this,startDir:VFS.resolve('/me/Documents')||VFS.resolve('/me')}).then(r=>{
      if(!r||!r.node)return;
      if(r.node.type!=='file'){Sound.beep();return;}
      this.openNode(r.node);
    });
  }
  saveDoc(saveAs){
    const w=this.docWin();if(!w){Sound.beep();return;}
    const e2=w.__edit;
    if(!e2.node||saveAs){
      filePanel({app:this,save:true,defaultName:e2.name.endsWith('.rtf')?e2.name:e2.name+'.rtf',
        startDir:VFS.resolve('/me/Documents')||VFS.resolve('/me')}).then(r=>{
          if(!r)return;
          e2.node=VFS.createFile(r.dir,r.name,e2.ed.innerText,{overwrite:true});
          e2.name=e2.node.name;e2.dirty=false;
          w.setTitle(e2.name+'  —  '+VFS.pathOf(r.dir));
          Workspace.refreshView();
        });
    } else {
      e2.node.content=e2.ed.innerText;
      e2.node.size=e2.node.content.length;
      e2.node.date=Date.now();
      VFS.save();e2.dirty=false;
      logMsg('Edit: saved '+e2.node.name);
    }
  }
  revert(){
    const w=this.docWin();if(!w||!w.__edit.node){Sound.beep();return;}
    w.__edit.ed.textContent=fileContent(w.__edit.node);
    w.__edit.dirty=false;
  }
  confirmClose(w){
    if(!w.__edit||!w.__edit.dirty){w.close();return;}
    nxAlert({app:this,title:'Close',msg:'"'+w.__edit.name+'" has unsaved changes.',
      info:'Save them before closing?',buttons:['Don’t Save','Cancel','Save'],def:2}).then(r=>{
        if(r==='Cancel')return;
        if(r==='Save')this.saveDoc(false);
        w.close();
      });
  }
  findPanel(){
    if(this.findWin){WS.makeKey(this.findWin);return;}
    const w=this.findWin=WS.create({app:this,title:'Find',width:360,height:10,resizable:false,
      panel:true,onClose:()=>{this.findWin=null;}});
    const b=el('div','',w.cnt);
    b.style.cssText='display:flex;flex-direction:column;gap:8px;padding:12px 14px;';
    const r1=el('div','',b);r1.style.cssText='display:flex;align-items:center;gap:8px;';
    el('label','fl',r1,'Find:');
    const q=el('input','tf',r1);
    const r2=el('div','',b);r2.style.cssText='display:flex;justify-content:flex-end;gap:8px;';
    const prev=el('div','btn',r2,'Previous');
    const nxt=el('div','btn default',r2,'Next');el('span','ret',nxt,'⏎');
    const doFind=back=>{
      const dw=this.docWin();if(!dw){Sound.beep();return;}
      dw.__edit.ed.focus();
      if(window.find){if(!window.find(q.value,false,back,true))Sound.beep();}
      else Sound.beep();
    };
    nxt.addEventListener('click',()=>doFind(false));
    prev.addEventListener('click',()=>doFind(true));
    q.addEventListener('keydown',ev=>{if(ev.key==='Enter')doFind(false);});
    w.el.style.height='auto';
    setTimeout(()=>q.focus(),50);
  }
  print(){
    const w=this.docWin();
    printPanel(this,w?w.__edit.name:'Untitled',()=>w?w.__edit.ed.innerText:'');
  }
}

        subject:sub.value||'(no subject)',date:fmtDate(Date.now()),att:false,body:ed.innerText});

  }
  lipService(parent){
    const w=WS.create({app:this,title:'Lip Service',width:280,height:10,resizable:false,panel:true});
    const b=el('div','',w.cnt);
    b.style.cssText='display:flex;flex-direction:column;gap:10px;padding:12px 14px;align-items:center;';
    const meter=el('div','sz',b);

    const bar=el('div','',meter);

    lbl.style.fontSize='11px';
    const row=el('div','',b);row.style.cssText='display:flex;gap:8px;';
    const stop=el('div','btn',row,'Stop');

      bar.style.width=(8+Math.random()*80)+'%';

    },120);

      clearInterval(iv);w.close();

        info:'A '+((Date.now()-t0)/1000).toFixed(1)+'-second sound was (symbolically) placed in your message.',buttons:['OK']});
    };
    stop.addEventListener('click',()=>done(true));
    cancel.addEventListener('click',()=>done(false));

  }

class PreviewApp extends NXApp{
  constructor(){
    super({name:'Preview',icon:'preview',bundle:'Preview.app',version:'3.3 (v41)',
      credits:'Preview\nTIFF and PostScript on Display PostScript.\nEvery image here is drawn by code at view time.'});
  }
  menuTree(){
    return [
      this.stdInfo(),
      {label:'Document',submenu:[
        {label:'Open...',key:'o',action:()=>this.openDoc()},
        {label:'Close',action:()=>{if(WS.keyWin)WS.keyWin.requestClose();}}
      ]},
      this.stdEdit(),
      this.stdWindows(),
      this.stdServices(),
      {label:'Print...',key:'p',action:()=>{
        const w=WS.keyWin;
        printPanel(this,w?w.ttl.textContent:'Image',()=>'');
      }}
    ].concat(this.stdHideQuit());
  }
  onLaunch(arg){this.onOpen(arg||{});}
  onOpen(arg){
    if(arg&&arg.openNode)this.show(arg.openNode);
    else if(arg&&arg.previewText)this.showText(arg.previewText);
    else if(!this.windows.length)this.show(VFS.resolve('/NextLibrary/Images/Backgrounds.tiff'));
  }
  openDoc(){
    filePanel({app:this,startDir:VFS.resolve('/me/Documents')||VFS.root}).then(r=>{
      if(r&&r.node&&r.node.type==='file')this.show(r.node);
    });
  }
  show(node){
    const w=WS.create({app:this,title:node.name,width:460,height:400,minWidth:240,minHeight:200});
    const sv=makeScrollView(w.cnt,{gray:true});
    const cv=document.createElement('canvas');
    cv.width=400;cv.height=320;
    cv.style.cssText='display:block;margin:12px;background:#fff;border:1px solid #000;';
    sv.content.appendChild(cv);
    this.paint(cv,node);
    w.onResize=()=>sv.refresh();
    setTimeout(()=>sv.refresh(),0);
  }
  showText(pt){
    const w=WS.create({app:this,title:pt.name+' (page preview)',width:440,height:520,minWidth:280,minHeight:280});
    const sv=makeScrollView(w.cnt,{gray:true});
    const page=el('div','',sv.content);
    page.style.cssText='width:380px;min-height:490px;margin:14px;background:#fff;border:1px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.3);padding:26px 30px;font:11px Helvetica;white-space:pre-wrap;line-height:1.4;';
    page.textContent=pt.text||'(empty page)';
    setTimeout(()=>sv.refresh(),0);
    w.onResize=()=>sv.refresh();
  }
  paint(cv,node){
    const g=cv.getContext('2d'),W=cv.width,H=cv.height;
    const name=node.name.toLowerCase();
    g.fillStyle='#fff';g.fillRect(0,0,W,H);
    if(node.content==='__CUBE_MEMORIAL__'){
      g.fillStyle='#101010';g.fillRect(0,0,W,H);
      g.strokeStyle='#8f98a5';g.lineWidth=2;
      const cx=W/2,cy=H/2-16,s=70;
      /* an original cube, drawn with reverence */
      g.beginPath();
      g.moveTo(cx-s,cy-10);g.lineTo(cx+20,cy-s+4);g.lineTo(cx+s,cy-24);g.lineTo(cx+8,cy+18);g.closePath();
      g.moveTo(cx-s,cy-10);g.lineTo(cx-s+16,cy+58);g.lineTo(cx+22,cy+86);g.lineTo(cx+8,cy+18);
      g.moveTo(cx+8,cy+18);g.lineTo(cx+s,cy-24);g.lineTo(cx+s-6,cy+46);g.lineTo(cx+22,cy+86);
      g.stroke();
      g.fillStyle='#666';g.font='11px Helvetica';
      g.textAlign='center';
      g.fillText('in loving memory of the cube',cx,H-28);
      g.fillStyle='#3a3a3a';g.font='9px Helvetica';
      g.fillText('1988 — one foot, dead on, magnesium',cx,H-14);
      return;
    }
    if(name.indexOf('poster')>=0||name.endsWith('.eps')||name.endsWith('.ps')){
      /* PostScript-flavored poster */
      g.fillStyle='#e9e4d5';g.fillRect(0,0,W,H);
      for(let i=0;i<7;i++){
        g.strokeStyle='#'+['b23a3a','2c6e9f','2c7a3f','8a6d2b','555555'][i%5];
        g.lineWidth=2;
        g.beginPath();
        g.moveTo(30,40+i*38);
        g.bezierCurveTo(W/3,10+i*40,2*W/3,70+i*36,W-30,30+i*38);
        g.stroke();
      }
      g.fillStyle='#111';g.font='bold 26px Times';
      g.fillText('object',36,H-60);
      g.font='italic 18px Times';
      g.fillText('oriented, 1994',36,H-36);
      return;
    }
    if(name.indexOf('rendering')>=0){
      g.fillStyle='#0e1420';g.fillRect(0,0,W,H);
      g.strokeStyle='#25e0c0';g.lineWidth=1;
      for(let i=0;i<14;i++){
        const y=H*0.55+i*i*1.05;
        g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();
      }
      for(let i=-8;i<=8;i++){
        g.beginPath();g.moveTo(W/2+i*8,H*0.55);g.lineTo(W/2+i*46,H);g.stroke();
      }
      g.strokeStyle='#e0d040';
      g.strokeRect(W/2-60,H*0.24,120,86);
      g.beginPath();g.moveTo(W/2-60,H*0.24);g.lineTo(W/2-28,H*0.14);g.lineTo(W/2+92,H*0.14);
      g.lineTo(W/2+60,H*0.24);g.moveTo(W/2+92,H*0.14);g.lineTo(W/2+92,H*0.14+86);g.lineTo(W/2+60,H*0.24+86);
      g.stroke();
      return;
    }
    /* generic sample image */
    const grad=g.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#7fa3c0');grad.addColorStop(1,'#cfd8df');
    g.fillStyle=grad;g.fillRect(0,0,W,H);
    g.fillStyle='#3f7a4f';
    g.beginPath();g.moveTo(0,H*.78);
    for(let x=0;x<=W;x+=20)g.lineTo(x,H*.78-Math.sin(x/47)*22-((x*x)%37));
    g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();
    g.fillStyle='#f4ce4a';g.beginPath();g.arc(W*.78,H*.22,26,0,7);g.fill();
    g.fillStyle='rgba(255,255,255,.85)';
    [[60,50,90],[190,80,120],[300,40,70]].forEach(c=>{
      g.beginPath();g.ellipse(c[0],c[1],c[2]/2,14,0,0,7);g.fill();
    });
  }
}

class WebsterApp extends NXApp{
  constructor(){

      credits:'Digital Webster\nDictionary and thesaurus, indexed for instant lookup.\nThis exhibit carries a small original word set.'});

    this.modePopup=makePopup(['Dictionary','Thesaurus'],'Dictionary',()=>this.lookup(this.cur||''));

    if(!this.main)this.makeMain();

    const h=el('div','',b);
    h.innerHTML='<span style="font-size:22px;font-weight:bold">'+word+'</span>'+

        ill.style.cssText='margin-top:14px;border:1px solid #999;width:150px;height:100px;display:flex;align-items:center;justify-content:center;background:#f4f2ea;';
        ill.appendChild(Icons.make(word==='cube'?'neXTcube':(word==='dock'?'computer':'app'),64));

      }
    }
    this.sv.refresh();this.sv.scrollTo(0);
  }

    this.body=el('div','',this.bodySv.content);
    this.body.style.cssText='background:#fff;min-height:100%;padding:12px 16px;font-size:12px;line-height:1.5;white-space:pre-wrap;';
    this.target=null;
    w.onResize=()=>{this.resSv.refresh();this.bodySv.refresh();};
    this.search();
  }
  renderShelfSel(shelf){
    [...shelf.children].forEach(b=>{
      b.style.outline=(b.__book===this.target)?'2px solid #fff':'';
    });
    this.hint.textContent=this.target==null?'(all books)':'(in: '+LIBRARIAN_BOOKS[this.target].title+')';
  }
  search(){
    const q=(this.q.value||'').toLowerCase();
    const res=[];
    LIBRARIAN_BOOKS.forEach((bk,bi)=>{
      if(this.target!=null&&bi!==this.target)return;
      bk.docs.forEach(d=>{
        if(!q||d[0].toLowerCase().indexOf(q)>=0||d[1].toLowerCase().indexOf(q)>=0)
          res.push({book:bk,doc:d});
      });
    });
    this.resSv.content.innerHTML='';
    res.forEach(r=>{
      const row=el('div','brow',this.resSv.content);
      el('div','bname',row,r.doc[0]);
      row.addEventListener('click',()=>{
        [...this.resSv.content.children].forEach(c=>c.classList.remove('sel'));
        row.classList.add('sel');
        this.body.textContent=r.doc[0]+'\n— '+r.book.title+'\n\n'+r.doc[1];
        this.bodySv.refresh();this.bodySv.scrollTo(0);
      });
    });
    if(!res.length)el('div','',this.resSv.content,'  no matches').style.cssText='padding:8px;color:#555;font-size:11px;';
    this.body.textContent=res.length?'Select a result at left.':'No documents matched "'+this.q.value+'".';
    setTimeout(()=>{this.resSv.refresh();this.bodySv.refresh();},0);
  }
}

const SoundPlayer={
  win:null,
  open(node){
    if(this.win){WS.makeKey(this.win);if(node)this.popup.setValue(this.match(node));return;}
    const w=this.win=WS.create({app:Apps.current||Workspace,title:'SoundPlayer',width:300,height:10,
      resizable:false,panel:true,onClose:()=>{this.win=null;}});
    const b=el('div','',w.cnt);
    b.style.cssText='display:flex;flex-direction:column;gap:10px;padding:14px;';
    const r1=el('div','',b);r1.style.cssText='display:flex;align-items:center;gap:8px;';
    el('label','fl',r1,'Sound:');
    this.popup=makePopup(['Basso','Frog','Pop','Bell'],node?this.match(node):'Basso');
    r1.appendChild(this.popup);
    const r2=el('div','',b);r2.style.cssText='display:flex;justify-content:flex-end;gap:8px;';
    const play=el('div','btn default',r2,'Play');el('span','ret',play,'⏎');

    play.addEventListener('click',()=>Sound.play(this.popup.getValue()));
    stop.addEventListener('click',()=>{});
    w.el.style.height='auto';w.center();

  match(node){
    const n=node.name.toLowerCase();
    if(n.indexOf('frog')>=0)return 'Frog';
    if(n.indexOf('pop')>=0)return 'Pop';
    if(n.indexOf('bell')>=0)return 'Bell';
    return 'Basso';
  }
};

class IBApp extends NXApp{
  constructor(){
    super({name:'InterfaceBuilder',icon:'ib',bundle:'InterfaceBuilder.app',version:'3.3 (v3.3)',
      credits:'Interface Builder\nDrag objects from the Palette onto your window,\ninspect them, then Test Interface. The NeXT mystique, distilled.'});

  }
  menuTree(){

      this.stdInfo(),
      {label:'Document',submenu:[
        {label:'New',key:'n',action:()=>this.newCanvas()},
        {label:'Save',key:'s',action:()=>this.saveNib()},
        {label:'Test Interface',key:'r',action:()=>this.toggleTest()}
      ]},
      this.stdEdit(),
      {label:'Tools',submenu:[

  onLaunch(){

  PALETTE(){return ['Button','Text Field','Label','Switch','Slider','Box'];}
  makePalette(){
    const w=this.palWin=WS.create({app:this,title:'Palettes',width:230,height:200,resizable:false,
      panel:true,x:window.innerWidth-330,y:40,persistKey:'ibpal',closable:false});

    grid.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding:10px;';
    this.PALETTE().forEach(kind=>{
      const cell=el('div','',grid);
      cell.style.cssText='width:96px;height:44px;display:flex;align-items:center;justify-content:center;background:#b5b5b5;border:1px dotted #666;';
      cell.appendChild(this.renderCtl({kind:kind,title:kind},true));
      cell.dataset.help='Interface Builder palette. Drag an object onto your window to add it.';
      cell.addEventListener('mousedown',ev=>{
        DnD.start(ev,{icon:'nib',label:kind,payload:{type:'ibctl',kind:kind}});
      });
    });
  }
  makeInspector(){
    const w=this.inspWin=WS.create({app:this,title:'Button Inspector',width:240,height:220,
      resizable:false,panel:true,x:window.innerWidth-330,y:280,persistKey:'ibinsp',closable:false});
    this.inspBody=el('div','',w.cnt);
    this.inspBody.style.cssText='padding:12px 14px;font-size:12px;';
    this.renderInspector();
  }
  renderInspector(){
    const b=this.inspBody;if(!b)return;
    b.innerHTML='';
    if(!this.selCtl){
      el('div','',b,'No object selected.').style.color='#555';
      el('div','',b,'Click an object on the canvas, or drag a new one from the Palette.').style.cssText='margin-top:8px;font-size:11px;color:#555;line-height:1.4;';
      if(this.inspWin)this.inspWin.setTitle('Inspector');
      return;
    }
    const c=this.selCtl;
    if(this.inspWin)this.inspWin.setTitle(c.kind+' Inspector');
    const r=el('div','',b);
    r.style.cssText='display:flex;flex-direction:column;gap:8px;';
    el('label','fl',r,'Title:');
    const t=el('input','tf',r);
    t.value=c.title;
    t.addEventListener('input',()=>{
      c.title=t.value;
      this.refreshCtl(c);
    });
    el('label','fl',r,'Tag:');
    const tag=el('input','tf',r);tag.value='0';
    const en=makeChk('Enabled',true,()=>{});
    r.appendChild(en);
    const del=el('div','btn',r,'Remove Object');
    del.addEventListener('click',()=>{
      c.el.remove();
      this.ctls=this.ctls.filter(x=>x!==c);
      this.selCtl=null;this.renderInspector();
    });
  }
  newCanvas(){
    this.ctls=[];
    const w=this.canvasWin=WS.create({app:this,title:'MyWindow — Untitled.nib',width:420,height:320,
      minWidth:260,minHeight:180,x:180,y:160});
    const cv=this.canvas=el('div','',w.cnt);
    cv.style.cssText='position:absolute;inset:0;background:#a8a8a8;';
    cv.dataset.help='An Interface Builder design window. Drop palette objects here, drag them around, then choose Document, Test Interface.';
    cv.__drop={
      accepts:p=>p&&p.type==='ibctl',
      drop:(p,info)=>{
        const r=cv.getBoundingClientRect();
        this.addCtl(p.kind,info.ev.clientX-r.left-40,info.ev.clientY-r.top-12);
      }
    };
    cv.addEventListener('mousedown',ev=>{
      if(ev.target===cv&&!this.testing){this.selCtl=null;this.refreshSel();this.renderInspector();}
    });
  }
  addCtl(kind,x,y){
    const c={kind:kind,title:kind==='Text Field'?'':kind,x:Math.max(2,x),y:Math.max(2,y)};
    this.ctls.push(c);
    c.el=this.renderCtl(c,false);
    c.el.style.position='absolute';
    c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';
    this.canvas.appendChild(c.el);
    this.bindCtl(c);
    this.selCtl=c;this.refreshSel();this.renderInspector();
  }
  renderCtl(c,mini){
    let e;
    if(c.kind==='Button'){
      e=el('div','btn',null,c.title||'Button');
      if(mini){e.style.minWidth='58px';e.style.height='20px';e.style.fontSize='10px';}
    } else if(c.kind==='Text Field'){
      e=el('input','tf');e.value=c.title||'';
      e.style.width=mini?'80px':'120px';
      if(mini)e.style.height='17px';
      e.readOnly=true;
    } else if(c.kind==='Label'){
      e=el('div','',null,c.title||'Label');
      e.style.cssText='font-size:'+(mini?'11':'12')+'px;padding:2px;';
    } else if(c.kind==='Switch'){
      e=el('div','');
      e.style.cssText='display:flex;align-items:center;gap:4px;'+(mini?'transform:scale(.85);':'');
      const bx=el('span','box',e,'✓');
      bx.className='box';
      bx.style.cssText='width:14px;height:14px;background:#fff;display:inline-flex;align-items:center;justify-content:center;border:2px solid;border-color:#4d4d4d #fff #fff #4d4d4d;font-size:11px;';
      el('span','',e,c.title||'Switch').style.fontSize='11px';
    } else if(c.kind==='Slider'){
      e=el('div','sz');
      e.style.cssText+='width:'+(mini?'70':'110')+'px;height:14px;position:relative;background:#8e8e8e;';
      const kn=el('div','rz1',e);
      kn.style.cssText+='position:absolute;left:40%;top:0;width:12px;height:10px;background:#c9c9c9;';
    } else { /* Box */
      e=el('div','');
      e.style.cssText='width:'+(mini?'80px':'140px')+';height:'+(mini?'30px':'80px')+';border:1px solid #666;position:relative;';
      const t=el('div','',e,c.title||'Box');
      t.style.cssText='position:absolute;top:-8px;left:8px;background:#a8a8a8;padding:0 4px;font-size:10px;';
    }
    if(mini)e.style.pointerEvents='none';
    return e;
  }
  refreshCtl(c){
    const sel=this.selCtl===c;
    const ne=this.renderCtl(c,false);
    ne.style.position='absolute';
    ne.style.left=c.el.style.left;ne.style.top=c.el.style.top;
    c.el.replaceWith(ne);
    c.el=ne;
    this.bindCtl(c);
    if(sel)this.refreshSel();
  }
  bindCtl(c){
    c.el.addEventListener('mousedown',ev=>{
      if(this.testing)return;
      ev.stopPropagation();ev.preventDefault();
      WS.makeKey(this.canvasWin);
      this.selCtl=c;this.refreshSel();this.renderInspector();
      const sx=ev.clientX,sy=ev.clientY,ox=c.el.offsetLeft,oy=c.el.offsetTop;
      const mv=e2=>{
        c.el.style.left=Math.max(0,ox+e2.clientX-sx)+'px';
        c.el.style.top=Math.max(0,oy+e2.clientY-sy)+'px';
      };
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);
      document.addEventListener('mouseup',up);
    });
    c.el.addEventListener('click',ev=>{
      if(this.testing){
        if(c.kind==='Button')Sound.tone([[440,0,.05]],.08,'square');
        if(c.kind==='Switch'){
          const bx=c.el.querySelector('.box');
          if(bx)bx.textContent=bx.textContent==='✓'?'':'✓';
        }
      }
    });
  }
  refreshSel(){
    this.ctls.forEach(c=>{
      c.el.style.outline=(c===this.selCtl&&!this.testing)?'1px dashed #222':'';
    });
  }
  toggleTest(){
    if(!this.canvasWin){Sound.beep();return;}
    this.testing=!this.testing;
    this.canvasWin.setTitle(this.testing?'MyWindow — TEST MODE (Command-r ends)':'MyWindow — Untitled.nib');
    this.ctls.forEach(c=>{
      const inp=c.el.querySelector&&c.el.tagName==='INPUT'?c.el:null;
      if(c.kind==='Text Field')c.el.readOnly=!this.testing;
    });
    this.refreshSel();
    if(this.testing)
      logMsg('InterfaceBuilder: test interface started');
  }
  saveNib(){
    const home=VFS.resolve('/me');
    VFS.createFile(home,'Untitled.nib','/* Interface Builder archive — '+this.ctls.length+' objects */',{overwrite:true});
    Workspace.refreshView();
    nxAlert({app:this,title:'InterfaceBuilder',msg:'Saved Untitled.nib in /me.',
      info:this.ctls.length+' object'+(this.ctls.length===1?'':'s')+' archived (symbolically).',buttons:['OK']});
  }
}

class PBApp extends NXApp{
  constructor(){
    super({name:'ProjectBuilder',icon:'pb',bundle:'ProjectBuilder.app',version:'3.3 (v3.3)',
      credits:'Project Builder\nOne project, one Build button, one triumphant log.'});
    this.building=false;
  }
  menuTree(){
    return [
      this.stdInfo(),
      {label:'Project',submenu:[
        {label:'Build',key:'b',action:()=>this.build()},
        {label:'Run',key:'r',action:()=>this.runApp()},
        {label:'Clean',action:()=>{this.log('rm -rf obj/*\nCleaned.\n',true);}}
      ]},
      this.stdEdit(),
      this.stdWindows(),
      this.stdServices()
    ].concat(this.stdHideQuit());
  }
  FILES(){
    return {
      'Classes':{'MyApp.h':'#import <appkit/appkit.h>\n\n@interface MyApp : Object\n{\n    id  window;\n    id  button;\n}\n- appDidInit:sender;\n- hello:sender;\n@end\n',
                 'MyApp.m':'#import "MyApp.h"\n\n@implementation MyApp\n\n- appDidInit:sender\n{\n    [window makeKeyAndOrderFront:self];\n    return self;\n}\n\n- hello:sender\n{\n    printf("Hello, object world!\\n");\n    return self;\n}\n\n@end\n'},
      'Other Sources':{'MyApp_main.m':'#import <appkit/appkit.h>\n\nvoid main(int argc, char *argv[]) {\n    [Application new];\n    [NXApp run];\n    [NXApp free];\n    exit(0);\n}\n'},
      'Interfaces':{'MyApp.nib':'(Interface Builder archive — open it with IB)'},
      'Supporting Files':{'Makefile':'# Generated by ProjectBuilder\nNAME = MyApp\ninclude $(MAKEFILEDIR)/app.make\n','PB.project':'{\n  PROJECTNAME = MyApp;\n  PROJECTVERSION = 3.3;\n  LANGUAGE = English;\n}'}
    };
  }
  onLaunch(){
    const w=this.main=WS.create({app:this,title:'ProjectBuilder — MyApp',width:640,height:460,
      minWidth:500,minHeight:340,persistKey:'pb',onCloseRequest:win=>win.miniaturize()});
    const bar=el('div','',w.cnt);
    bar.style.cssText='height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #000;';
    const bb=el('div','btn',bar,'Build');
    const rb=el('div','btn',bar,'Run');
    const db=el('div','btn',bar,'Debug');
    bb.style.fontWeight='bold';
    bb.addEventListener('click',()=>this.build());
    rb.addEventListener('click',()=>this.runApp());
    db.addEventListener('click',()=>this.log('gdb MyApp\n(gdb) The debugger is next door, in Terminal.\n',true));
    const split=el('div','',w.cnt);
    split.style.cssText='position:absolute;left:0;right:0;top:36px;bottom:150px;display:flex;';
    const catC=el('div','',split);
    catC.style.cssText='width:150px;flex:0 0 150px;border-right:1px solid #000;position:relative;';
    const catSv=makeScrollView(catC);
    const fileC=el('div','',split);
    fileC.style.cssText='width:170px;flex:0 0 170px;border-right:1px solid #000;position:relative;';
    this.fileSv=makeScrollView(fileC);
    const srcC=el('div','',split);
    srcC.style.cssText='flex:1;position:relative;';
    this.srcSv=makeScrollView(srcC);
    this.srcEl=el('div','mono',this.srcSv.content);
    this.srcEl.style.cssText='background:#fff;min-height:100%;padding:6px 10px;font-size:11px;white-space:pre;line-height:1.4;';
    const files=this.FILES();
    Object.keys(files).forEach(cat=>{
      const r=el('div','brow',catSv.content);
      el('div','bname',r,cat);el('div','barr',r);
      r.addEventListener('click',()=>{
        [...catSv.content.children].forEach(c=>c.classList.remove('sel'));
        r.classList.add('sel');
        this.showCat(cat);
      });
    });
    /* build log */
    const logC=el('div','',w.cnt);
    logC.style.cssText='position:absolute;left:0;right:0;bottom:0;height:150px;border-top:1px solid #000;';
    const logHdr=el('div','',logC,' Build output');
    logHdr.style.cssText='height:18px;line-height:18px;font-size:10px;font-weight:bold;background:#8f8f8f;border-bottom:1px solid #555;';
    const logBody=el('div','',logC);
    logBody.style.cssText='position:absolute;left:0;right:0;top:18px;bottom:0;';
    this.logSv=makeScrollView(logBody);
    this.logEl=el('div','mono',this.logSv.content);
    this.logEl.style.cssText='background:#fff;min-height:100%;padding:4px 8px;font-size:11px;white-space:pre-wrap;line-height:1.35;';
    this.log('Project MyApp — 5 files.  Press Build.\n',true);
    w.onResize=()=>{catSv.refresh();this.fileSv.refresh();this.srcSv.refresh();this.logSv.refresh();};
    this.showCat('Classes');
    setTimeout(()=>{catSv.refresh();},0);
  }
  showCat(cat){
    const files=this.FILES()[cat];
    this.fileSv.content.innerHTML='';
    Object.keys(files).forEach(fn=>{
      const r=el('div','brow',this.fileSv.content);
      const ic=el('div','bico',r);ic.appendChild(Icons.make(fn.endsWith('.nib')?'nib':'file',14));
      el('div','bname',r,fn);
      r.addEventListener('click',()=>{
        [...this.fileSv.content.children].forEach(c=>c.classList.remove('sel'));
        r.classList.add('sel');
        this.srcEl.textContent=files[fn];
        this.srcSv.refresh();this.srcSv.scrollTo(0);
      });
    });
    setTimeout(()=>this.fileSv.refresh(),0);
  }
  log(s,replace){
    if(!this.logEl)return;
    if(replace)this.logEl.textContent=s;
    else this.logEl.textContent+=s;
    this.logSv.refresh();this.logSv.scrollToBottom();
  }
  build(){
    if(this.building){Sound.beep();return;}
    this.building=true;
    const lines=[
      'make',
      'Making all in .',
      '    cc -g -O -Wall -arch m68k -c MyApp_main.m -o obj/MyApp_main.o',
      '    cc -g -O -Wall -arch m68k -c MyApp.m -o obj/MyApp.o',
      'MyApp.m: In function `-hello:\':',
      'MyApp.m:14: warning: printf where NXLogError was fashionable',
      '    cc -g -O -Wall -arch m68k -c MyApp.h -precomp',
      '    nib2obj MyApp.nib > obj/MyApp_nib.o   (archiving interface)',
      '    cc -o MyApp.app/MyApp obj/MyApp_main.o obj/MyApp.o obj/MyApp_nib.o -lNeXT_s -lsys_s',
      '    strip MyApp.app/MyApp',
      'installing resources into MyApp.app',
      '',
      'Build succeeded.  MyApp.app is ready — press Run.'
    ];
    this.log('',true);
    let i=0;
    const step=()=>{
      if(i<lines.length){
        this.log(lines[i++]+'\n');
        setTimeout(step,120+Math.random()*280);
      } else {
        this.building=false;
        this.built=true;
        logMsg('ProjectBuilder: build of MyApp succeeded');
      }
    };
    step();
  }
  runApp(){
    if(!this.built){
      this.log('MyApp has not been built yet.  Press Build first.\n');
      return;
    }
    const w=WS.create({app:this,title:'MyApp',width:280,height:160,resizable:false});
    const b=el('div','',w.cnt);
    b.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;';
    el('div','',b,'Hello, object world!').style.cssText='font-size:14px;font-weight:bold;';
    const btn=el('div','btn default',b,'Hello');
    el('span','ret',btn,'⏎');
    btn.addEventListener('click',()=>{
      Sound.tone([[520,0,.07],[780,.06,.07]],.16,'sine');
      logMsg('MyApp: Hello, object world!');
    });
  }
}
/* =====================================================================
   Saver engine — full-screen canvas modes (BackSpace)
   ===================================================================== */
const Saver={
  running:false,raf:null,idleTimer:null,armed:false,
  mode(){return State.get('saverMode','Space');},
  idleMinutes(){return State.get('saverIdle',3);},
  start(){
    if(this.running)return;
    this.running=true;
    const sv=$('#saver');
    sv.style.display='';
    const cv=$('#saverc');
    cv.width=window.innerWidth;cv.height=window.innerHeight;
    const g=cv.getContext('2d');
    const W=cv.width,H=cv.height;
    let state;
    const mode=this.mode();
    if(mode==='Space'){
      state=Array.from({length:180},()=>({
        x:(Math.random()-0.5)*W,y:(Math.random()-0.5)*H,z:Math.random()*W
      }));
    } else {
      state={x:W/2,y:H/2,vx:2.2,vy:1.7};
    }
    const step=()=>{
      if(!this.running)return;
      if(mode==='Space'){
        g.fillStyle='#000';g.fillRect(0,0,W,H);
        g.fillStyle='#fff';
        state.forEach(s=>{
          s.z-=4;
          if(s.z<=1){s.x=(Math.random()-0.5)*W;s.y=(Math.random()-0.5)*H;s.z=W;}
          const k=200/s.z;
          const x=W/2+s.x*k,y=H/2+s.y*k;
          const r=Math.max(0.4,2.4-s.z/(W/2.4));
          if(x>=0&&x<W&&y>=0&&y<H){g.beginPath();g.arc(x,y,r,0,7);g.fill();}
        });
      } else {
        g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,0,W,H);
        state.x+=state.vx;state.y+=state.vy;
        if(state.x<40||state.x>W-40)state.vx*=-1;
        if(state.y<40||state.y>H-40)state.vy*=-1;
        g.save();
        g.translate(state.x,state.y);
        const t=Date.now()/900;
        g.strokeStyle='#9aa4b0';g.lineWidth=2;
        g.rotate(Math.sin(t)*.35);
        g.strokeRect(-30,-30,60,60);
        g.strokeRect(-18,-42,60,60);
        g.beginPath();
        g.moveTo(-30,-30);g.lineTo(-18,-42);g.moveTo(30,-30);g.lineTo(42,-42);
        g.moveTo(30,30);g.lineTo(42,18);g.moveTo(-30,30);g.lineTo(-18,18);
        g.stroke();
        g.restore();
      }
      this.raf=requestAnimationFrame(step);
    };
    g.fillStyle='#000';g.fillRect(0,0,W,H);
    step();
    const stop=()=>this.stop();
    sv.addEventListener('mousedown',stop,{once:true});
    sv.addEventListener('mousemove',stop,{once:true});
    this._keyStop=ev=>{ev.stopPropagation();ev.preventDefault();this.stop();};
    document.addEventListener('keydown',this._keyStop,true);
  },
  stop(){
    if(!this.running)return;
    this.running=false;
    cancelAnimationFrame(this.raf);
    $('#saver').style.display='none';
    if(this._keyStop){document.removeEventListener('keydown',this._keyStop,true);this._keyStop=null;}
    this.resetIdle();
  },
  armIdle(){
    if(this.armed)return;
    this.armed=true;
    const reset=()=>this.resetIdle();
    ['mousemove','mousedown','keydown'].forEach(e2=>document.addEventListener(e2,reset,true));
    this.resetIdle();
  },
  disarm(){
    this.armed=false;
    if(this.idleTimer)clearTimeout(this.idleTimer);
  },
  resetIdle(){
    if(this.idleTimer)clearTimeout(this.idleTimer);
    if(!this.armed||this.running)return;
    this.idleTimer=setTimeout(()=>{
      if(Session.user&&!this.running)this.start();
    },this.idleMinutes()*60000);
  }
};

/* =====================================================================
   BackSpace — the screen saver application
   ===================================================================== */
class BackSpaceApp extends NXApp{
  constructor(){
    super({name:'BackSpace',icon:'backspace',bundle:'BackSpace.app',version:'3.3 (v27)',
      credits:'BackSpace\nSaving phosphor since the Cube.\nModes drawn live on a canvas; no two runs alike.'});
  }
  menuTree(){
    return [this.stdInfo(),this.stdWindows(),this.stdServices()].concat(this.stdHideQuit());
  }
  onLaunch(){
    const w=this.main=WS.create({app:this,title:'BackSpace',width:340,height:10,resizable:false,
      persistKey:'backspace',onCloseRequest:win=>win.miniaturize()});
    const b=el('div','',w.cnt);
    b.style.cssText='display:flex;flex-direction:column;gap:12px;padding:14px 16px;';
    const r1=el('div','',b);r1.style.cssText='display:flex;align-items:center;gap:8px;';
    el('label','fl',r1,'Module:');
    r1.appendChild(makePopup(['Space','Bouncing Cube'],Saver.mode(),v=>State.set('saverMode',v)));
    const r2=el('div','',b);r2.style.cssText='display:flex;align-items:center;gap:8px;';
    el('label','fl',r2,'Start after idle:');
    r2.appendChild(makePopup(['1 minute','3 minutes','5 minutes','never'],
      Saver.idleMinutes()===1?'1 minute':Saver.idleMinutes()===5?'5 minutes':(State.get('saverIdle',3)===9999?'never':'3 minutes'),
      v=>{State.set('saverIdle',v==='never'?9999:parseInt(v));Saver.resetIdle();}));
    const r3=el('div','',b);r3.style.cssText='display:flex;justify-content:flex-end;gap:8px;';
    const tryB=el('div','btn default',r3,'Try Now');el('span','ret',tryB,'⏎');
    tryB.addEventListener('click',()=>Saver.start());
    w.el.style.height='auto';
  }
}

/* =====================================================================
   Scene — canvas demo in the NeXT demo spirit
   ===================================================================== */
class SceneApp extends NXApp{
  constructor(){
    super({name:'Scene',icon:'scene',bundle:'Scene.app',version:'3.3 (v12)',
      credits:'Scene\nA wireframe object, spinning forever in Display-PostScript black.'});
    this.raf=null;
  }
  menuTree(){
    return [this.stdInfo(),this.stdWindows(),this.stdServices()].concat(this.stdHideQuit());
  }
  onQuit(){if(this.raf)cancelAnimationFrame(this.raf);}
  onLaunch(){
    const w=this.main=WS.create({app:this,title:'Scene — icosahedron',width:420,height:380,
      minWidth:260,minHeight:220,persistKey:'scene'});
    const cv=document.createElement('canvas');
    cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;background:#000;';
    w.cnt.appendChild(cv);
    const fit=()=>{cv.width=w.cnt.offsetWidth;cv.height=w.cnt.offsetHeight;};
    fit();w.onResize=fit;
    const g=cv.getContext('2d');
    /* icosahedron vertices */
    const F=(1+Math.sqrt(5))/2;
    const V=[[-1,F,0],[1,F,0],[-1,-F,0],[1,-F,0],[0,-1,F],[0,1,F],[0,-1,-F],[0,1,-F],[F,0,-1],[F,0,1],[-F,0,-1],[-F,0,1]];
    const E=[];
    for(let i=0;i<V.length;i++)for(let j=i+1;j<V.length;j++){
      const d=Math.hypot(V[i][0]-V[j][0],V[i][1]-V[j][1],V[i][2]-V[j][2]);
      if(Math.abs(d-2)<0.01)E.push([i,j]);
    }
    let a=0,b=0;
    const step=()=>{
      if(!this.running){return;}
      a+=0.011;b+=0.007;
      const W2=cv.width,H2=cv.height,S=Math.min(W2,H2)/5.2;
      g.fillStyle='#000';g.fillRect(0,0,W2,H2);
      const P=V.map(v=>{
        let x=v[0],y=v[1],z=v[2];
        let x1=x*Math.cos(a)-z*Math.sin(a),z1=x*Math.sin(a)+z*Math.cos(a);
        let y1=y*Math.cos(b)-z1*Math.sin(b),z2=y*Math.sin(b)+z1*Math.cos(b);
        const k=3.4/(3.4+z2/F);
        return [W2/2+x1*S*k,H2/2+y1*S*k,z2];
      });
      E.forEach(e2=>{
        const p1=P[e2[0]],p2=P[e2[1]];
        const depth=(p1[2]+p2[2])/2;
        const shade=Math.round(150+depth*36);
        g.strokeStyle='rgb('+Math.max(50,Math.min(255,shade))+','+Math.max(60,Math.min(255,shade+30))+','+Math.max(70,Math.min(255,shade+40))+')';
        g.lineWidth=1.4;
        g.beginPath();g.moveTo(p1[0],p1[1]);g.lineTo(p2[0],p2[1]);g.stroke();
      });
      g.fillStyle='#4a5560';g.font='10px monospace';
      g.fillText('Scene: 12 vertices, 30 edges, 60 Hz — objects all the way down',10,H2-10);
      this.raf=requestAnimationFrame(step);
    };
    step();
  }
}

/* =====================================================================
   Bootstrap
   ===================================================================== */
let Workspace;
window.addEventListener('load',()=>{
  VFS.init();
  SysLog.init();
  Workspace=new WorkspaceApp();
  new TerminalApp();new EditApp();new MailApp();new PreviewApp();
  new PreferencesApp();new LibrarianApp();new WebsterApp();new PrintManagerApp();
  new IBApp();new PBApp();new BackSpaceApp();new SceneApp();
  Menus.init();
  const shade=State.get('desktopShade',null);
  if(shade)$('#screen').style.background=shade;
  /* wire bundle names in other folders */
  document.addEventListener('keydown',ev=>{
    /* Command-i — Inspector, when Workspace is active */
    if(isCmd(ev)&&ev.key==='i'&&Apps.current===Workspace){
      ev.preventDefault();Workspace.openInspector();
    }
  });
  window.addEventListener('resize',()=>{
    WS.wins.forEach(w=>{if(w.onResize)w.onResize();});
  });
  Boot.start();
});
