      "\r\n*----> Task List <----*\r\n" + Ps.list().map(x => String(x.pid).padStart(4) + " " + x.image).join("\r\n") +
      "\r\n\r\nState Dump for Thread Id 0x" + (p.pid * 10).toString(16) + "\r\n\r\neax=" + hex8(e.address || 0) + " ebx=00000000 ecx=" + hex8(addr) + "\r\n\r\n" +
      "function: <nosymbols>\r\n        " + hex8(addr) + " 8902             mov     [edx],eax            ds:" + hex8(e.address || 0) + "=????????\r\n" +
      (e.message && !/^exception/.test(e.message) ? "\r\n(" + e.message + ")\r\n" : "");
    log.size = log.content.length;
    Session.token = prev;
    VFS.changed(log.parent);
  },
  notify(p, e, addr){
    Snd.event("Critical Stop");
    Dlg.msg({title:"Dr. Watson for Windows NT", icon:"error", w:400,
      text:"An application error has occurred\nand an application error log is being generated.\n\n" + p.image +
        "\n\nException: " + (e.code === STATUS.ACCESS_VIOLATION ? "access violation" : "unknown") + " (0x" + hex8(e.code) + "), Address: 0x" + hex8(addr)})
      .then(() => Guide.note("drwatson"));
  }
};

/* ##########################################################################
   THE INSTRUMENTATION PANEL — the executive's first client. It reads the
   KTrace bus, the process table and the SRM counters, and draws the
   user/kernel boundary with win32k.sys where NT 4.0 put it.
   (Exhibit layer: this is the museum looking in, not part of Windows NT.)
   ########################################################################## */
const KPanel = {
  open: false, mode351: false,
  toggle(){ this.open ? this.hide() : this.show(); },
  show(){
    this.open = true;
    let el = $("#kpanel");
    el.style.display = "flex";
    this.render();
    if (!this._unsub) this._unsub = KTrace.on(ev => this.flash(ev));
    clearInterval(this._t);
    this._t = setInterval(() => this.refreshLive(), 1000);
  },
  hide(){ this.open = false; $("#kpanel").style.display = "none"; clearInterval(this._t); },
  box(id, title, sub, cls){ return `<div class="kbox ${cls || ""}" id="kb-${id}"><b>${title}</b>${sub ? "<span>" + sub + "</span>" : ""}<i class="kcount" id="kc-${id}"></i></div>`; },
  render(){
    const el = $("#kpanel");
    const vid = Video.dll();
    el.innerHTML = `
      <div class="kp-head"><div><div class="kp-kick">Exhibit instrument · not part of Windows NT</div><h2>The user/kernel boundary</h2></div><button class="kp-x" id="kp-close">×</button></div>
      <div class="kp-body">
        <div class="kp-diagram ${this.mode351 ? "nt351" : ""}">
          <div class="kp-ring kp-user"><div class="kp-ringlbl">USER MODE &nbsp;·&nbsp; ring 3 &nbsp;·&nbsp; every box is a separate address space</div>
            <div class="kp-row">
              <div class="kbox kprocs" id="kb-PS"><b>Applications</b><div id="kp-plist"></div><i class="kcount" id="kc-PS"></i></div>
              <div class="kp-col">
                <div class="kbox" id="kb-CSRSS"><b>Win32 subsystem</b><span>csrss.exe</span>
                  <div class="kghost" id="kp-ghost"><b>USER + GDI</b><span>window manager, graphics, display driver</span><em>Here in NT 3.51 — a protected process.</em></div></div>
                ${this.box("OS2", "OS/2 subsystem", "os2ss.exe · 1.x character apps")}
                ${this.box("PSX", "POSIX subsystem", "psxss.exe · FIPS 151-2")}
              </div>
              <div class="kp-col">
                ${this.box("LSA", "Security subsystem", "winlogon.exe · lsass.exe")}
                ${this.box("SVC", "Services", "services.exe · spoolss.exe")}
                ${this.box("NTVDM", "NTVDM / WOW", "ntvdm.exe · 16-bit, no hardware")}
              </div>
            </div>
          </div>
          <div class="kp-line"><span>system call boundary</span><span id="kp-calls"></span></div>
          <div class="kp-ring kp-kernel"><div class="kp-ringlbl">KERNEL MODE &nbsp;·&nbsp; ring 0 &nbsp;·&nbsp; one address space, shared by everything here</div>
            <div class="kp-row">
              <div class="kp-col kp-exec"><div class="kp-sub">Executive (ntoskrnl.exe)</div>
                <div class="kp-grid">
                  ${this.box("IO", "I/O Manager", "NTFS · FAT · CDFS · drivers")}
                  ${this.box("SRM", "Security Reference Monitor", "every open is checked here")}
                  ${this.box("OB", "Object Manager", "")}
                  ${this.box("PS2", "Process Manager", "")}
                  ${this.box("MM", "Virtual Memory Manager", "page tables per process")}
                  ${this.box("CM", "Configuration Manager", "the registry")}
                  ${this.box("ELF", "Event logging", "")}
                  ${this.box("LPC", "Local Procedure Call", "")}
                </div>
              </div>
              <div class="kp-col">
                <div class="kbox kwin32k" id="kb-WIN32K"><b>win32k.sys</b><span>Window Manager + GDI — moved here in 4.0</span>
                  <div class="kdrv" id="kb-DRV"><b>${vid}</b><span>display driver — also kernel mode now</span></div><i class="kcount" id="kc-WIN32K"></i></div>
                ${this.box("KE", "Kernel", "scheduler · interrupts · " + Ke.cpus() + " CPU" + (Ke.cpus() > 1 ? "s" : ""))}
                ${this.box("HAL", "HAL", HW.get().arch === "alpha" ? "hal.dll · Alpha" : "hal.dll · x86")}
              </div>
            </div>
          </div>
        </div>
        <div class="kp-side">
          <div class="kp-stats" id="kp-stats"></div>
          <div class="kp-btns">
            <button id="kp-351">${this.mode351 ? "Back to the 4.0 layout" : "Show the NT 3.51 layout"}</button>
            <button id="kp-fault" class="danger">Fault the display driver</button>
          </div>
          <div class="kp-note" id="kp-note">${this.mode351 ? this.note351() : this.note40()}</div>
          <div class="kp-log" id="kp-log"></div>
        </div>
      </div>`;
    $("#kp-close").onclick = () => this.hide();
    $("#kp-351").onclick = () => { this.mode351 = !this.mode351; this.render(); };
    $("#kp-fault").onclick = () => this.fault();
    this.refreshLive();
  },
  note40(){ return "<b>NT 4.0.</b> To make the Windows 95 shell fast, the window manager, GDI and the display driver moved out of the Win32 subsystem process and into the kernel, as <code>win32k.sys</code>. Every window you open now costs a cheap system call instead of an LPC round trip to csrss.exe. The price: a display driver bug runs with the same privileges as the kernel — and takes the machine down."; },
  note351(){ return "<b>NT 3.51.</b> USER and GDI ran inside csrss.exe, a user-mode process with its own address space. A faulty display driver could corrupt only that process; it could not scribble on the kernel, the file system cache or anyone else's memory. (Losing csrss was still fatal to the session — STOP 0xC000021A — but the damage was contained and diagnosable.) Graphics paid for that with a context switch on every call."; },
  fault(){
    if (this.mode351) {
      const g = $("#kp-ghost");
      g.classList.add("kfault");
      $("#kp-note").innerHTML = "<b>In NT 3.51:</b> the faulting driver's code lives inside csrss.exe. Its bad pointer hits a page that process does not own; the processor raises an exception <em>in user mode</em>, and the kernel's own data is untouched. That is containment. In 4.0 the same instruction executes at ring 0.";
      setTimeout(() => g.classList.remove("kfault"), 3000);
      return;
    }
    if (!Session.token && Winlogon.state !== "sas") return;
    if (!confirm("Simulate a bug in the display driver " + Video.dll() + "?\n\nIt runs inside win32k.sys, in kernel mode. The whole machine will stop with a blue screen. (Nothing real is harmed; you will reboot.)")) return;
    $("#kb-DRV").classList.add("kfault");
    $("#kb-WIN32K").classList.add("kfault");
    setTimeout(() => { this.hide(); Bugcheck.crash(0x1E, {driver: Video.dll(), addr: 0xa0f41c2a, base: 0xa0f30000}); }, 900);
  },
  flash(ev){
    if (!this.open) return;
    const map = {SRM:"SRM", IO:"IO", PS:"PS2", MM:"MM", CM:"CM", WIN32K:"WIN32K", ELF:"ELF", KE:"KE"};
    const id = map[ev.component];
    const b = id && document.getElementById("kb-" + id);
    if (b) { b.classList.remove("kflash"); void b.offsetWidth; b.classList.add("kflash"); }
    if (ev.component === "WIN32K") { const u = $("#kb-PS"); if (u) { u.classList.remove("kflash"); void u.offsetWidth; u.classList.add("kflash"); } }
    const log = $("#kp-log");
    if (log) {
      log.insertBefore(h("div", {class: /DENY/.test(ev.text) ? "deny" : ""}, ev.component.padEnd(7) + ev.text), log.firstChild);
      while (log.children.length > 14) log.lastChild.remove();
    }
  },
  refreshLive(){
    if (!this.open) return;
    const pl = $("#kp-plist");
    if (pl) pl.innerHTML = Ps.list().filter(p => !p.system && p.pid).map(p => `<div class="kproc${p.hung ? " hung" : ""}">${esc(p.image)} <small>pid ${p.pid}${p.arch === "x86" && HW.get().arch === "alpha" ? " · FX!32" : ""}</small></div>`).join("") || "<div class='kproc'>(log on to start some)</div>";
    const t = Mm.totals();
    const calls = Object.values(KTrace.counts).reduce((a, b) => a + b, 0);
    $("#kp-calls").textContent = commas(calls) + " crossings so far";
    $("#kp-stats").innerHTML =
      `<div><b>${Ps.list().length}</b> processes</div><div><b>${commas(Se.stats.checks)}</b> access checks</div>` +
      `<div><b>${commas(Se.stats.denied)}</b> denied</div><div><b>${commas(t.commitK)}K</b> committed</div>` +
      `<div><b>${Ke.last ? Math.round(Ke.last.total) : 0}%</b> CPU</div><div><b>${commas(KTrace.counts.WIN32K || 0)}</b> win32k calls</div>`;
  }
};

/* ---------------- Sound (Web Audio, all synthesized) ---------------- */
const Snd = {
  ctx: null, enabled: State.get("sndOn", true),
  vols: State.get("vols", {master:.7, wave:.8, midi:.8, cd:.8}),
  muted: State.get("muted", false),
  scheme: State.get("sndScheme", {}), // event -> recipe name ("(None)" disables)
  _nodes: {},
  reloadUser(){ this.enabled = State.get("sndOn", true); this.vols = State.get("vols", {master:.7, wave:.8, midi:.8, cd:.8}); this.muted = State.get("muted", false); this.scheme = State.get("sndScheme", {}); this.applyVols(); },
  ac(){
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.connect(this.ctx.destination);
      for (const ch of ["wave","midi","cd"]) {
        const g = this.ctx.createGain();
        g.connect(this.master);
        this._nodes[ch] = g;
      }
      this.applyVols();
    }
    if (this.ctx.state === "suspended") this.ctx.resume().catch(()=>{});
    return this.ctx;
  },
  applyVols(){
    if (!this.ctx) return;
    this.master.gain.value = this.muted ? 0 : this.vols.master;
    for (const ch of ["wave","midi","cd"]) this._nodes[ch].gain.value = this.vols[ch];
  },
  setVol(ch, v){ this.vols[ch] = v; State.set("vols", this.vols); this.applyVols(); },
  setMuted(m){ this.muted = m; State.set("muted", m); this.applyVols(); },
  tone(freq, dur, opts){
    if (!this.enabled) return;
    const ctx = this.ac(); if (!ctx) return;
    opts = opts || {};
    const t0 = ctx.currentTime + (opts.when || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = opts.type || "sine"; o.frequency.value = freq;
    if (opts.slide) o.frequency.linearRampToValueAtTime(opts.slide, t0 + dur);
    const peak = opts.gain != null ? opts.gain : .25;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + (opts.attack || .01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this._nodes[opts.ch || "wave"]);
    o.start(t0); o.stop(t0 + dur + .05);
    return o;
  },
  noise(dur, opts){
    if (!this.enabled) return;
    const ctx = this.ac(); if (!ctx) return;
    opts = opts || {};
    const t0 = ctx.currentTime + (opts.when || 0);
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.value = opts.gain != null ? opts.gain : .2;
    let node = src;
    if (opts.filter) {
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = opts.filter;
      src.connect(f); node = f;
    }
    node.connect(g); g.connect(this._nodes[opts.ch || "wave"]);
    src.start(t0);
  },
  recipes: {
    "Ambient Startup": s => { // dreamy stacked chord, spirit-of-95 (original)
      const N = [261.63, 392.0, 523.25, 659.25, 783.99, 1046.5];
      N.forEach((f, i) => {
        s.tone(f, 3.2 - i*.15, {when: i*.22, gain:.11, attack:.4, type:"sine", ch:"midi"});
        s.tone(f*2.001, 2.2, {when: i*.22+.1, gain:.03, attack:.6, type:"triangle", ch:"midi"});
      });
      s.tone(65.4, 3.6, {gain:.10, attack:.8, type:"sine", ch:"midi"});
    },
    "Ambient Shutdown": s => {
      const N = [783.99, 659.25, 523.25, 392.0];
      N.forEach((f,i)=> s.tone(f, 1.6, {when:i*.28, gain:.12, attack:.15, ch:"midi"}));
      s.tone(130.8, 2.4, {when:.3, gain:.08, attack:.6, ch:"midi"});
    },
    "Ding": s => s.tone(880, .6, {gain:.22, type:"sine"}),
    "Chord": s => { s.tone(392, .5, {gain:.16, type:"square"}); s.tone(466.2, .5, {gain:.12, type:"square"}); },
    "Asterisk": s => { s.tone(660, .25, {gain:.2}); s.tone(880, .35, {when:.12, gain:.18}); },
    "Exclamation": s => { s.tone(740, .18, {gain:.22, type:"square"}); s.tone(740, .3, {when:.2, gain:.18, type:"square"}); },
    "Question": s => { s.tone(587, .2, {gain:.2}); s.tone(784, .3, {when:.15, gain:.18}); },
    "Menu Pop": s => s.tone(1200, .03, {gain:.06, type:"square"}),
    "Click": s => s.noise(.03, {gain:.12, filter:3000}),
    "Recycle Crunch": s => { s.noise(.28, {gain:.3, filter:900}); s.noise(.2, {when:.12, gain:.25, filter:500}); },
    "Tada": s => { s.tone(523.25, .3, {gain:.2, type:"triangle"}); s.tone(783.99, .7, {when:.18, gain:.22, type:"triangle"}); },
    "Maximize": s => s.tone(300, .08, {gain:.1, slide:500, type:"triangle"}),
    "Minimize": s => s.tone(500, .08, {gain:.1, slide:300, type:"triangle"}),
    "(None)": () => {}
  },
  defaultScheme: {
    "Start Windows": "Ambient Startup", "Exit Windows": "Ambient Shutdown",
    "Default sound": "Ding", "Critical Stop": "Chord", "Asterisk": "Asterisk",
    "Exclamation": "Exclamation", "Question": "Question",
    "Empty Recycle Bin": "Recycle Crunch", "Menu command": "Menu Pop",
    "Maximize": "Maximize", "Minimize": "Minimize", "Program error": "Chord"
  },
  event(name){
    const recipe = this.scheme[name] !== undefined ? this.scheme[name] : this.defaultScheme[name];
    if (recipe && this.recipes[recipe]) this.recipes[recipe](this);
  },
  playRecipe(name){ if (this.recipes[name]) this.recipes[name](this); },
  modem(){
    if (!this.enabled) return;

/* ---------------- Popup menus ---------------- */
const Popups = {
  stack: [],
  closeAll(){ while (this.stack.length) this.stack.pop().remove(); },
  closeFrom(level){ while (this.stack.length > level) this.stack.pop().remove(); }
};
window.addEventListener("pointerdown", e => {
  if (!e.target.closest(".popup") && !e.target.closest("#startmenu") && !e.target.closest("#startbtn") &&
      !e.target.closest(".menubar")) {
    Popups.closeAll(); StartMenu.close(); MenuBarCtl.closeAll();
  }
}, true);
function showPopup(items, x, y, opts){
  opts = opts || {};
  const level = opts.level || 0;
  Popups.closeFrom(level);
  const pop = h("div", {class:"popup" + (opts.big ? " bigicons" : "")});
  if (typeof items === "function") items = items();
  for (const it of items) {
    if (!it) continue;
    if (it.sep) { pop.appendChild(h("div", {class:"psep"})); continue; }
    const row = h("div", {class:"pi" + (it.disabled ? " disabled" : "")});
    const ic = h("span", {class:"ic"});
    if (it.icon) ic.appendChild(iconEl(it.icon, opts.big ? 24 : 16, it.lnk));
    else if (it.checked) ic.innerHTML = '<span class="chk">✓</span>';
    else if (it.radio) ic.innerHTML = '<span class="chk">●</span>';
    row.appendChild(ic);
    row.appendChild(h("span", {class:"lbl" + (it.bold ? " b" : ""), html: (it.bold?"<b>":"") + accel(it.label) + (it.bold?"</b>":"")}));
    if (it.shortcut) row.appendChild(h("span", {class:"shct"}, it.shortcut));
    if (it.submenu) row.appendChild(h("span", {class:"sub", html:"▸"}));
    row.addEventListener("pointerenter", () => {
      $$(".pi.hilite", pop).forEach(p => p.classList.remove("hilite"));
      row.classList.add("hilite");
      clearTimeout(pop._subT);
      pop._subT = setTimeout(() => {
        Popups.closeFrom(level + 1);
        if (it.submenu && !it.disabled) {
          const r = row.getBoundingClientRect();
          const sub = typeof it.submenu === "function" ? it.submenu() : it.submenu;
          showPopup(sub, r.right - 3, r.top - 3, Object.assign({}, opts, {level: level + 1, big:false}));
        }
      }, it.submenu ? 280 : 200);
    });
    row.addEventListener("pointerleave", () => row.classList.remove("hilite"));
    row.addEventListener("pointerup", e => {
      e.stopPropagation();
      if (it.disabled) return;
      if (it.submenu) return;
      Popups.closeAll(); StartMenu.close(); MenuBarCtl.closeAll();
      Snd.event("Menu command");
      if (it.action) it.action();
    });
    pop.appendChild(row);
  }
  document.body.appendChild(pop);
  const r = pop.getBoundingClientRect();
  let px = x, py = y;
  if (px + r.width > innerWidth) px = Math.max(0, (opts.level ? x - r.width - (opts.parentW || 0) + 6 : innerWidth - r.width - 2));
  if (py + r.height > innerHeight) py = Math.max(0, innerHeight - r.height - 2);
  pop.style.left = px + "px"; pop.style.top = py + "px";
  Popups.stack.push(pop);
  return pop;
}

/* ---------------- Menu bar controller ---------------- */
const MenuBarCtl = {
  open: null,
  closeAll(){
    if (this.open) { this.open.el.classList.remove("open"); this.open = null; }
    // popup closing handled by Popups
  },
  attach(win, defs){
    const bar = h("div", {class:"menubar"});
    for (const def of defs) {
      const el = h("span", {class:"mtop", html: accel(def.label)});
      const openIt = () => {
        Popups.closeAll();
        this.closeAll();
        el.classList.add("open");
        this.open = {el, bar};
        const r = el.getBoundingClientRect();
        const items = typeof def.items === "function" ? def.items() : def.items;
        showPopup(items, r.left, r.bottom);
      };
      el.addEventListener("pointerdown", e => {
        e.stopPropagation();
        win.focus();
        if (this.open && this.open.el === el) { this.closeAll(); Popups.closeAll(); }
        else openIt();
      });
      el.addEventListener("pointerenter", () => {
        if (this.open && this.open.bar === bar && this.open.el !== el) openIt();
      });
      bar.appendChild(el);
    }
    return bar;
  }
};

/* ---------------- Window Manager ---------------- */
const WM = {
  wins: [], z: 100, active: null, cascade: 0,
  desktopArea(){
    const tb = $("#taskbar");
    const hidden = tb.classList.contains("hidden-auto");

  },
  create(o){
    const win = {
      id: uid(), title: o.title || "", iconName: o.icon || "winlogo",
      isMin: false, isMax: false, o,
      onClose: o.onClose, onKey: o.onKey, onResize: o.onResize, onFocusCb: o.onFocus,
      proc: o.proc || Ps.current || Shell.proc()
    };
    if (win.proc) win.proc.windows.add(win);
    KTrace.emit("WIN32K", "NtUserCreateWindowEx \"" + (o.title || "") + "\" (" + (win.proc ? win.proc.image : "?") + ")");
    const area = this.desktopArea();
    let w = Math.min(o.w || 440, innerWidth - 8), ht = Math.min(o.h || 320, area.h - 8);
    let x = o.x != null ? o.x : 30 + (this.cascade % 8) * 24;
    let y = o.y != null ? o.y : 26 + (this.cascade % 8) * 22;
    if (o.center) { x = Math.max(2, (innerWidth - w)/2); y = Math.max(2, (area.h - ht)/2.4); }
    this.cascade++;
    const el = h("div", {class:"win", style:{left:x+"px", top:y+"px", width:w+"px", height:ht+"px"}});
    el.style.zIndex = ++this.z;
    // titlebar
    const tIcon = h("span", {class:"tb-icon"});
    tIcon.appendChild(iconEl(win.iconName, 16));
    const tTxt = h("span", {class:"tb-text"}, win.title);
    const btns = h("span", {class:"tb-btns"});
    const svgGlyph = p => `<svg width="10" height="9" viewBox="0 0 10 9">${p}</svg>`;
    const G = {
      min: svgGlyph('<rect x="1" y="7" width="6" height="2" fill="#000"/>'),
      max: svgGlyph('<rect x="0.5" y="0.5" width="9" height="8" fill="none" stroke="#000"/><rect x="0" y="0" width="10" height="2" fill="#000"/>'),
      restore: svgGlyph('<rect x="2.5" y="0.5" width="7" height="5" fill="none" stroke="#000"/><rect x="2" y="0" width="8" height="2" fill="#000"/><rect x="0.5" y="3.5" width="7" height="5" fill="#c0c0c0" stroke="#000"/><rect x="0" y="3" width="8" height="2" fill="#000"/>'),
      close: svgGlyph('<path d="M1 1 L8 8 M2 1 L9 8 M8 1 L1 8 M9 1 L2 8" stroke="#000"/>')
    };
    let bMin, bMax, bClose;
    if (o.minimizable !== false) {
      bMin = h("button", {class:"tb-btn", html:G.min, onclick:e=>{e.stopPropagation(); win.minimize();}});
      btns.appendChild(bMin);
    }
    if (o.maximizable !== false) {
      bMax = h("button", {class:"tb-btn", html:G.max, onclick:e=>{e.stopPropagation(); win.toggleMax();}});
      btns.appendChild(bMax);
    }
    bClose = h("button", {class:"tb-btn closebtn", html:G.close, onclick:e=>{e.stopPropagation(); win.close();}});
    btns.appendChild(bClose);
    btns.addEventListener("pointerdown", e => e.stopPropagation());
    const tb = h("div", {class:"titlebar"}, tIcon, tTxt, btns);
    el.appendChild(tb);
    // system menu
    const sysMenu = () => [
      {label:"&Restore", disabled:!win.isMax && !win.isMin, action:()=>win.restore()},
      {label:"&Move", disabled:win.isMax},
      {label:"&Size", disabled:win.isMax || o.resizable === false},
      {label:"Mi&nimize", disabled:o.minimizable === false, action:()=>win.minimize()},
      {label:"Ma&ximize", disabled:o.maximizable === false || win.isMax, action:()=>win.maximize()},
      {sep:true},
      {label:"&Close", bold:true, shortcut:"Alt+F4", action:()=>win.close()}
    ];
    tIcon.addEventListener("pointerdown", e => {
      e.stopPropagation(); win.focus();
      const r = tIcon.getBoundingClientRect();
      showPopup(sysMenu(), r.left, r.bottom + 2);
    });
    tIcon.addEventListener("dblclick", () => win.close());
    tb.addEventListener("contextmenu", e => {
      e.preventDefault(); e.stopPropagation();
      showPopup(sysMenu(), e.clientX, e.clientY);
    });
    // menubar
    if (o.menus) el.appendChild(win.menubar = MenuBarCtl.attach(win, o.menus));
    // body
    const body = h("div", {class:"win-body"});
    el.appendChild(body);
    win.body = body;
    // statusbar
    if (o.statusbar) {
      const sb = h("div", {class:"statusbar"});
      win.statusCells = o.statusbar.map(cell => {
        const c = h("div", {class:"cell" + (cell.fix ? " fix" : "")}, cell.text || "");
        if (cell.w) { c.style.minWidth = cell.w + "px"; c.style.flex = "0 0 auto"; }
        sb.appendChild(c); return c;
      });
      el.appendChild(sb);
    }
    // dragging (outline style, authentic)
    tb.addEventListener("pointerdown", e => {
      if (e.button !== 0 || win.isMax) return;
      win.focus();
      const sx = e.clientX, sy = e.clientY;
      const r = el.getBoundingClientRect();
      let outline = null, moved = false;
      const mm = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 4) return;
        moved = true;
        if (!outline) { outline = h("div", {class:"dragoutline"}); document.body.appendChild(outline); }
        Object.assign(outline.style, {
          left: clamp(r.left + dx, -r.width + 40, innerWidth - 40) + "px",
          top: clamp(r.top + dy, 0, innerHeight - 30) + "px",
          width: r.width + "px", height: r.height + "px"
        });
      };
      const mu = ev => {
        window.removeEventListener("pointermove", mm);
        window.removeEventListener("pointerup", mu);
        if (outline) {
          el.style.left = outline.style.left; el.style.top = outline.style.top;
          outline.remove();
        }
      };
      window.addEventListener("pointermove", mm);
      window.addEventListener("pointerup", mu);
    });
    tb.addEventListener("dblclick", e => {
      if (e.target.closest(".tb-btns") || e.target.closest(".tb-icon")) return;
      if (o.maximizable !== false) win.toggleMax();
    });
    el.addEventListener("pointerdown", () => win.focus(), true);
    // resizing
    if (o.resizable !== false) {
      for (const dir of ["n","s","e","w","nw","ne","sw","se"]) {
        const rz = h("div", {class:"resizer rz-" + dir});
        rz.addEventListener("pointerdown", e => {
          if (e.button !== 0 || win.isMax) return;
          e.stopPropagation(); win.focus();
          const sx = e.clientX, sy = e.clientY, r = el.getBoundingClientRect();
          let outline = h("div", {class:"dragoutline", style:{left:r.left+"px", top:r.top+"px", width:r.width+"px", height:r.height+"px"}});
          document.body.appendChild(outline);
          const minW = o.minW || 160, minH = o.minH || 80;
          const mm = ev => {
            const dx = ev.clientX - sx, dy = ev.clientY - sy;
            let L = r.left, T = r.top, W = r.width, H = r.height;
            if (dir.includes("e")) W = Math.max(minW, r.width + dx);
            if (dir.includes("s")) H = Math.max(minH, r.height + dy);
            if (dir.includes("w")) { W = Math.max(minW, r.width - dx); L = r.right - W; }
            if (dir.includes("n")) { H = Math.max(minH, r.height - dy); T = r.bottom - H; }
            Object.assign(outline.style, {left:L+"px", top:T+"px", width:W+"px", height:H+"px"});
          };
          const mu = () => {
            window.removeEventListener("pointermove", mm);
            window.removeEventListener("pointerup", mu);
            Object.assign(el.style, {left:outline.style.left, top:outline.style.top,
              width:outline.style.width, height:outline.style.height});
            outline.remove();
            if (win.onResize) win.onResize();
          };
          window.addEventListener("pointermove", mm);
          window.addEventListener("pointerup", mu);
        });
        el.appendChild(rz);
      }
    }
    // methods
    win.el = el;
    win.setTitle = t => { win.title = t; tTxt.textContent = t; Taskbar.updateWin(win); };
    win.setIcon = n => { win.iconName = n; tIcon.innerHTML = ""; tIcon.appendChild(iconEl(n,16)); Taskbar.updateWin(win); };
    win.setStatus = (t, i) => { if (win.statusCells && win.statusCells[i||0]) win.statusCells[i||0].textContent = t; };
    win.focus = () => {
      if (win.isMin) return win.restoreFromMin();
      if (this.active === win) return;
      if (this.active) this.active.el.classList.add("inactive");
      this.active = win;
      Ps.foreground = win.proc;
      el.classList.remove("inactive");
      el.style.zIndex = ++this.z;
      Taskbar.setActive(win);
      if (win.onFocusCb) win.onFocusCb();
    };
    win.blur = () => { el.classList.add("inactive"); if (this.active === win) { this.active = null; Taskbar.setActive(null); } };

      win.isMin = true;
      el.style.display = "none";
      if (this.active === win) { this.active = null; }
      Taskbar.updateWin(win);
      Taskbar.setActive(null);
      const to = Taskbar.btnRect(win) || {left:innerWidth/2, top:innerHeight, width:120, height:20};
      zoomRects(from, to);
      this.focusTop();
    };
    win.restoreFromMin = () => {
      win.isMin = false;
      el.style.display = "flex";
      const to = el.getBoundingClientRect();
      const from = Taskbar.btnRect(win) || to;
      zoomRects(from, to);
      win.focus();
      Taskbar.updateWin(win);
    };
    win.maximize = () => {
      if (win.isMax) return;
      Snd.event("Maximize");
      win.prevBounds = {left:el.style.left, top:el.style.top, width:el.style.width, height:el.style.height};
      const a = this.desktopArea();
      Object.assign(el.style, {left:a.x-2+"px", top:a.y-2+"px", width:a.w+4+"px", height:a.h+4+"px"});
      win.isMax = true; el.classList.add("maxed");
      if (bMax) bMax.innerHTML = G.restore;
      if (win.onResize) win.onResize();
    };
    win.restore = () => {
      if (win.isMin) return win.restoreFromMin();
      if (!win.isMax) return;
      Object.assign(el.style, win.prevBounds);
      win.isMax = false; el.classList.remove("maxed");
      if (bMax) bMax.innerHTML = G.max;
      if (win.onResize) win.onResize();
    };
    win.toggleMax = () => win.isMax ? win.restore() : win.maximize();
    win.close = (force) => {
      if (!force && win.onClose && win.onClose() === false) return;
      const i = this.wins.indexOf(win);
      if (i >= 0) this.wins.splice(i,1);
      el.remove();
      if (!o.noTaskbar) Taskbar.removeWin(win);
      if (this.active === win) { this.active = null; this.focusTop(); }
      if (win.onClosed) win.onClosed();
      KTrace.emit("WIN32K", "NtUserDestroyWindow \"" + win.title + "\"");
      const p = win.proc;
      if (p) {
        p.windows.delete(win);
        if (p.alive && !p.windows.size && !p.persistent) setTimeout(() => { if (p.alive && !p.windows.size) Ps.terminate(p, 0); }, 0);
      }
    };
    this.wins.push(win);
    $("#desktop").appendChild(el);
    if (!o.noTaskbar) Taskbar.addWin(win);
    win.focus();
    return win;
  },
  focusTop(){
    const vis = this.wins.filter(w => !w.isMin);
    if (vis.length) {
      const top = vis.reduce((a,b) => (+a.el.style.zIndex > +b.el.style.zIndex ? a : b));
      top.focus();
    } else Taskbar.setActive(null);
  },
  findByApp(appId){ return this.wins.find(w => w.o.appId === appId); },
  cascadeAll(){
    let i = 0;
    for (const w of this.wins) {
      if (w.isMin) continue;
      if (w.isMax) w.restore();
      Object.assign(w.el.style, {left: 10 + i*24 + "px", top: 10 + i*22 + "px"});
      i++;
    }
  },
  tile(vertical){
    const vis = this.wins.filter(w => !w.isMin);
    if (!vis.length) return;
    const a = this.desktopArea();
    const n = vis.length;
    vis.forEach((w, i) => {
      if (w.isMax) w.restore();
      if (vertical) Object.assign(w.el.style, {left: a.w/n*i + "px", top:"0px", width: a.w/n + "px", height: a.h + "px"});
      else Object.assign(w.el.style, {left:"0px", top: a.h/n*i + "px", width: a.w + "px", height: a.h/n + "px"});
      if (w.onResize) w.onResize();
    });
  },
  minimizeAll(){ for (const w of this.wins.slice()) if (!w.isMin) w.minimize(); }
};
function zoomRects(from, to){
  const steps = 8, boxes = [];
  for (let i = 0; i < steps; i++) {
    const t = i / (steps - 1);
    const box = h("div", {class:"zoomrect", style:{
      left: from.left + (to.left - from.left) * t + "px",
      top: from.top + (to.top - from.top) * t + "px",
      width: from.width + (to.width - from.width) * t + "px",
      height: from.height + (to.height - from.height) * t + "px",
      display: "none"
    }});
    document.body.appendChild(box); boxes.push(box);
  }
  boxes.forEach((b, i) => {
    setTimeout(() => { b.style.display = "block"; setTimeout(() => b.remove(), 40); }, i * 18);
  });
}

/* ---------------- Dialog helpers ---------------- */
const Dlg = {
  modalCount: 0,
  btn(label, onclick, opts){
    opts = opts || {};
    const b = h("button", {class:"btn" + (opts.default ? " default" : "")}, label);
    if (onclick) b.addEventListener("click", onclick);
    if (opts.disabled) b.disabled = true;
    if (opts.w) b.style.minWidth = opts.w + "px";
    return b;
  },
  show(o){ // generic modal-ish dialog window
    const base = 65000 + (this.modalCount++) * 2;
    const shield = h("div", {style:{position:"fixed", inset:"0", zIndex: String(base)}});
    shield.addEventListener("pointerdown", e => {
      e.stopPropagation(); e.preventDefault();
      flashTitle(win);
    });
    $("#desktop").appendChild(shield);
    const win = WM.create(Object.assign({resizable:false, minimizable:false, maximizable:false,
      noTaskbar:true, center:true}, o));
    const raise = () => { win.el.style.zIndex = String(base + 1); };
    raise();
    const origFocus = win.focus;
    win.focus = () => { origFocus(); raise(); };
    let closed = false;
    const origClose = win.close;
    win.close = force => {
      if (!closed) { closed = true; this.modalCount--; shield.remove(); }
      origClose(force);
    };
    return win;
  },
  msg(o){ // message box; returns Promise of button label
    return new Promise(res => {
      Snd.event(o.sound || {error:"Critical Stop", warn:"Exclamation", info:"Asterisk", question:"Question"}[o.icon] || "Default sound");
      const win = this.show({title:o.title || "Windows", icon:o.winIcon || "winlogo", w:o.w || 360, h:10});
      const body = h("div", {class:"msgbox-body"});
      if (o.icon) {
        const ic = h("div", {style:{width:"32px", height:"32px", flex:"0 0 32px"}});
        ic.innerHTML = Icons["err_" + ({error:"x", warn:"warn", info:"info", question:"q"}[o.icon] || "info")]();
        body.appendChild(ic);
      }
      body.appendChild(h("div", {class:"msgbox-txt", html: o.html || esc(o.text || "").replace(/\n/g,"<br>")}));
      const btnRow = h("div", {class:"dlgbtns center"});
      const labels = o.buttons || ["OK"];
      labels.forEach((label, i) => {
        btnRow.appendChild(this.btn(label, () => { win.close(true); res(label); }, {default: i === 0}));
      });
      win.body.append(body, btnRow);
      // details section (for illegal-operation style boxes)
      if (o.details) {
        const det = h("pre", {class:"selectable", style:{display:"none", margin:"0 14px 12px", padding:"6px",
          background:"#fff", fontSize:"10px", fontFamily:"'Courier New',monospace", overflow:"auto",
          maxHeight:"120px", boxShadow:"inset -1px -1px #fff, inset 1px 1px #808080"}}, o.details);
        const db = this.btn("Details >>", () => {
          det.style.display = det.style.display === "none" ? "block" : "none";
          db.textContent = det.style.display === "none" ? "Details >>" : "Details <<";
          sizeTo(win);
        });
        btnRow.appendChild(db);
        win.body.appendChild(det);
      }
      sizeTo(win);
      const onKey = e => {
        if (e.key === "Enter") { win.close(true); res(labels[0]); cleanup(); }
        if (e.key === "Escape") { win.close(true); res(labels[labels.length-1]); cleanup(); }
      };
      const cleanup = () => window.removeEventListener("keydown", onKey);
      window.addEventListener("keydown", onKey);
      const oc = win.close;
      win.close = f => { cleanup(); oc(f); };
    });
  },
  input(title, prompt, initial){ // returns Promise<string|null>
    return new Promise(res => {
      const win = this.show({title, icon:"doc", w:340, h:10});
      const inp = h("input", {class:"field", style:{width:"100%"}, value: initial || ""});
      const done = v => { win.close(true); res(v); };
      win.body.append(
        h("div", {class:"dlgpad"}, h("div", {style:{marginBottom:"6px"}}, prompt), inp),
        h("div", {class:"dlgbtns"},
          this.btn("OK", () => done(inp.value), {default:true}),
          this.btn("Cancel", () => done(null)))
      );
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") done(inp.value);
        if (e.key === "Escape") done(null);
      });
      sizeTo(win);
      setTimeout(() => { inp.focus(); inp.select(); }, 30);
    });
  },
  propSheet(o){ // tabbed property sheet with OK/Cancel/Apply
    const win = this.show({title:o.title, icon:o.icon || "settings", w:o.w || 408, h:o.h || 445});
    const tabs = h("div", {class:"tabs", style:{padding:"8px 8px 0"}});
    const strip = h("div", {class:"tabstrip"});
    const panel = h("div", {class:"tabpanel"});
    const sheet = {win, panels:[], current:0, dirty:false, applyBtn:null,
      markDirty(){ this.dirty = true; if (this.applyBtn) this.applyBtn.disabled = false; }};
    o.tabs.forEach((t, i) => {
      const tab = h("div", {class:"tab" + (i === 0 ? " on" : "")}, t.label);
      tab.addEventListener("mousedown", () => {
        $$(".tab", strip).forEach(el => el.classList.remove("on"));
        tab.classList.add("on");
        sheet.current = i;
        panel.innerHTML = "";
        panel.appendChild(sheet.panels[i]);
        if (t.onShow) t.onShow(sheet.panels[i], sheet);
      });
      strip.appendChild(tab);
      const p = h("div", {style:{height:"100%", display:"flex", flexDirection:"column"}});
      t.build(p, sheet);
      sheet.panels.push(p);
    });
    panel.appendChild(sheet.panels[0]);
    tabs.append(strip, panel);
    const btns = h("div", {class:"dlgbtns"});
    const doApply = () => { if (o.onApply) o.onApply(sheet); sheet.dirty = false; if (sheet.applyBtn) sheet.applyBtn.disabled = true; };
    btns.append(
      this.btn("OK", () => { if (sheet.dirty || o.alwaysApply) doApply(); win.close(true); if (o.onOK) o.onOK(sheet); }, {default:true}),
      this.btn("Cancel", () => { win.close(true); if (o.onCancel) o.onCancel(sheet); })
    );
    if (o.onApply) {
      sheet.applyBtn = this.btn("Apply", doApply, {disabled:true});
      btns.appendChild(sheet.applyBtn);
    }
    win.body.append(tabs, btns);
    win.el.style.width = (o.w || 408) + "px";
    win.el.style.height = (o.h || 445) + "px";
    return sheet;
  }
};
function sizeTo(win){
  win.el.style.height = "auto";
  const r = win.el.getBoundingClientRect();
  win.el.style.height = Math.ceil(r.height) + "px";
  win.el.style.left = Math.max(2, (innerWidth - r.width)/2) + "px";
  win.el.style.top = Math.max(2, (innerHeight - r.height)/2.6) + "px";
}
function flashTitle(win){
  let n = 0;
  const t = setInterval(() => {
    win.el.classList.toggle("inactive");
    if (++n >= 6) { clearInterval(t); win.el.classList.remove("inactive"); }
  }, 60);
  Snd.event("Default sound");
}

/* ---------------- Start Menu ---------------- */
const StartMenu = {
  el: $("#startmenu"),
  isOpen(){ return this.el.style.display === "block"; },
  toggle(){ this.isOpen() ? this.close() : this.open(); },
  close(){
    this.el.style.display = "none";
    $("#startbtn").classList.remove("open");
    Popups.closeFrom(0);
  },
  open(){
    Popups.closeAll();
    this.build();
    this.el.style.display = "block";
    $("#taskbar").classList.remove("hidden-auto");
    $("#startbtn").classList.add("open");
  },
  /* the user's own items, a separator, then the (Common) items every user gets */
  mergedItems(userNode, commonNode){
    const mine = this.folderItems(userNode, true), common = this.folderItems(commonNode, true, true);
    if (!mine.length && !common.length) return [{label:"(Empty)", disabled:true}];
    return mine.concat(mine.length && common.length ? [{sep:true}] : [], common);
  },
  folderItems(node, raw, isCommon){ // start-menu items from a VFS folder
    if (!node) return raw ? [] : [{label:"(Empty)", disabled:true}];
    if (!Io.access(node, A.R)) return raw ? [] : [{label:"(Empty)", disabled:true}];
    const items = [];
    for (const k of VFS.sorted(node)) {
      if (k.hidden) continue;
      if (k.type === "d") {
        items.push({label: k.name.replace(/&/g,"&&") + (isCommon ? " (Common)" : ""), icon:"programs",
          submenu: () => this.folderItems(k)});
      } else {
        items.push({label: VFS.displayName(k).replace(/&/g,"&&"), icon: VFS.iconFor(k), lnk: VFS.isLnk(k),
          action: () => Shell.openNode(k)});
      }
    }
    if (!items.length && !raw) items.push({label:"(Empty)", disabled:true});
    return items;
  },
  build(){
    this.el.innerHTML = "";
    const row = h("div", {class:"smrow"});
    const banner = h("div", {class:"banner"});
    banner.appendChild(h("span", {html:"<b>Windows</b> NT " + (Edition.isServer() ? "Server" : "Workstation")}));
    const items = h("div", {class:"smitems"});
    const mkItem = (label, icon, opts) => {
      opts = opts || {};
      const it = h("div", {class:"smi"});
      const ic = h("span", {class:"ic"});
      ic.appendChild(iconEl(icon, 32));
      it.append(ic, h("span", {class:"lbl", html: accel(label)}));
      if (opts.submenu) it.appendChild(h("span", {class:"sub", html:"▸"}));
      it.addEventListener("pointerenter", () => {
        $$(".smi.hilite", items).forEach(x => x.classList.remove("hilite"));
        it.classList.add("hilite");
        clearTimeout(this._subT);
        this._subT = setTimeout(() => {
          Popups.closeFrom(0);
          if (opts.submenu) {
            const r = it.getBoundingClientRect();
            showPopup(opts.submenu, r.right - 2, r.top, {level:0});
          }
        }, opts.submenu ? 300 : 250);
      });
      it.addEventListener("pointerleave", () => it.classList.remove("hilite"));
      if (opts.action) it.addEventListener("pointerup", () => { this.close(); Snd.event("Menu command"); opts.action(); });
      items.appendChild(it);
      return it;
    };
    const progNode = VFS.get(Profiles.dir() + "\\Start Menu\\Programs");
    const commonProg = VFS.get("C:\\WINNT\\Profiles\\All Users\\Start Menu\\Programs");
    const userTop = VFS.get(Profiles.dir() + "\\Start Menu"), commonTop = VFS.get("C:\\WINNT\\Profiles\\All Users\\Start Menu");
    /* loose shortcuts placed directly in a Start Menu folder appear above Programs */
    for (const top of [userTop, commonTop]) for (const k of top ? VFS.sorted(top) : []) {
      if (k.type === "d" || k.hidden) continue;
      mkItem(VFS.displayName(k).replace(/&/g, "&&"), VFS.iconFor(k), {action: () => Shell.openNode(k)});
    }
    if (items.children.length) items.appendChild(h("div", {class:"smsep"}));
    mkItem("&Programs", "programs", {submenu: () => this.mergedItems(progNode, commonProg)});
    const recents = Shell.recent.length
      ? Shell.recent.map(p => {
          const n = VFS.get(p);
          return n ? {label: VFS.displayName(n), icon: VFS.iconFor(n), action: () => Shell.openNode(n)} : null;
        }).filter(Boolean)
      : [{label:"(Empty)", disabled:true}];
    mkItem("&Documents", "documents", {submenu: recents});
    mkItem("&Settings", "settings", {submenu: [
      {label:"&Control Panel", icon:"controlpanel", action:()=>Shell.openControlPanel()},
      {label:"&Printers", icon:"printer", action:()=>Shell.openPrinters()},
      {label:"&Taskbar...", icon:"settings", action:()=>Taskbar.properties()}
    ]});
    mkItem("&Find", "find", {submenu: [
      {label:"&Files or Folders...", icon:"find", action:()=>Shell.findDialog()},
      {label:"&Computer...", icon:"nethood", action:()=>Shell.findComputer()}
    ]});
    mkItem("&Help", "help", {action:()=>HelpEngine.open()});
    mkItem("&Run...", "run", {action:()=>Shell.runDialog()});
    const sep = h("div", {class:"smsep"});
    items.appendChild(sep);
    mkItem("Sh&ut Down...", "shutdown", {action:()=>Shutdown.dialog()});
    row.append(banner, items);
    this.el.appendChild(row);
  }
};

/* ---------------- Alt+Tab switcher & global keys ---------------- */
const Switcher = {
  el: null, idx: 0, list: [],
  show(){
    this.list = WM.wins.filter(w => !w.o.noTaskbar);
    if (this.list.length < 1) return;
    this.idx = 1 % this.list.length;
    if (!this.el) {
      this.el = h("div", {class:"b-out", style:{position:"fixed", left:"50%", top:"40%", transform:"translate(-50%,-50%)",
        zIndex:"90000", padding:"12px", display:"none"}});
      document.body.appendChild(this.el);
    }
    this.render(); this.el.style.display = "block";
  },
  render(){
    this.el.innerHTML = "";
    const row = h("div", {style:{display:"flex", gap:"6px", marginBottom:"8px"}});
    this.list.forEach((w, i) => {
      const c = h("div", {style:{width:"44px", height:"44px", display:"flex", alignItems:"center",
        justifyContent:"center", outline: i === this.idx ? "2px solid #000080" : "none", padding:"4px"}});
      c.appendChild(iconEl(w.iconName, 32));
      row.appendChild(c);
    });
    this.el.append(row, h("div", {class:"b-in-thin", style:{padding:"3px 6px", background:"#c0c0c0"}},
      this.list[this.idx] ? this.list[this.idx].title : ""));
  },
  next(back){
    if (!this.list.length) return;
    this.idx = (this.idx + (back ? -1 : 1) + this.list.length) % this.list.length;
    this.render();
  },
  commit(){
    if (this.el) this.el.style.display = "none";
    const w = this.list[this.idx];
    if (w) { if (w.isMin) w.restoreFromMin(); else w.focus(); }
    this.list = [];
  },
  active(){ return this.el && this.el.style.display === "block"; }
};
window.addEventListener("keydown", e => {
  if (!Winlogon.desktopReady()) return;
  if (e.altKey && e.key === "Tab") {
    e.preventDefault();
    if (Switcher.active()) Switcher.next(e.shiftKey);
    else Switcher.show();
    return;
  }
  if (e.ctrlKey && e.key === "Escape") { e.preventDefault(); StartMenu.toggle(); return; }
  if (e.altKey && e.key === "F4") {
    e.preventDefault();
    if (WM.active) WM.active.close(); else Shutdown.dialog();
    return;
  }
  if (e.key === "Escape") { Popups.closeAll(); StartMenu.close(); }
  if (e.key === "F1" && !e.ctrlKey && !e.altKey && !WM.active) Exec.start("help");
});
window.addEventListener("keyup", e => {
  if (e.key === "Alt" && Switcher.active()) { e.preventDefault(); Switcher.commit(); }
});


/* ---------------- Drag & drop manager (custom, with copy plus-badge) ---------------- */
const DragMgr = {
  handlers: {}, hid: 0,
  register(el, handler){
    const id = "dz" + (++this.hid);
    el.dataset.drop = id;
    this.handlers[id] = handler;
    return id;
  },
  start(e, payload, iconName){
    const ghost = h("div", {style:{position:"fixed", zIndex:"99999", pointerEvents:"none",
      opacity:".6", left:e.clientX+4+"px", top:e.clientY+4+"px", display:"none"}});
    ghost.appendChild(iconEl(iconName || "doc", 32));
    const plus = h("div", {style:{position:"absolute", right:"-8px", bottom:"-6px", width:"11px", height:"11px",
      background:"#fff", border:"1px solid #000", display:"none", fontSize:"10px", lineHeight:"9px",
      textAlign:"center", fontWeight:"bold", color:"#000"}}, "+");
    ghost.appendChild(plus);
    document.body.appendChild(ghost);
    let started = false;
    const sx = e.clientX, sy = e.clientY;
    const mm = ev => {
      if (!started && Math.abs(ev.clientX-sx) + Math.abs(ev.clientY-sy) < 5) return;
      started = true;
      ghost.style.display = "block";
      ghost.style.left = ev.clientX+6+"px"; ghost.style.top = ev.clientY+2+"px";
      plus.style.display = ev.ctrlKey ? "block" : "none";
    };
    const mu = ev => {
      window.removeEventListener("pointermove", mm);
      window.removeEventListener("pointerup", mu);
      ghost.remove();
      if (!started) return;
      ghost.style.display = "none";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const dz = under && under.closest("[data-drop]");
      if (dz) {
        const hnd = this.handlers[dz.dataset.drop];
        if (hnd && (!hnd.accept || hnd.accept(payload)))
          hnd.drop(payload, ev.ctrlKey, {x:ev.clientX, y:ev.clientY});
      }
    };
    window.addEventListener("pointermove", mm);
    window.addEventListener("pointerup", mu);
  }
};

/* ---------------- Recycle Bin ---------------- */
const RecycleBin = {
  items: [],
  reloadUser(){ this.items = State.get("recycle", []); },
  save(){ State.set("recycle", this.items); Desktop.refreshIcons(); Shell.refreshSpecial("recycle"); },
  isEmpty(){ return this.items.length === 0; },
  add(node){
    const path = VFS.path(node.parent ? node.parent : node);
    this.items.push({data: VFS.serializeNode(node), orig: path, deleted: SimClock.now(), id: uid()});
    this.save();
  },
  restore(id){
    const i = this.items.findIndex(x => x.id === id);
    if (i < 0) return;
    const it = this.items[i];
    let parent = VFS.get(it.orig);
    if (!parent || parent.type !== "d") parent = Profiles.desktop();
    const node = VFS.restoreNode(it.data);
    node.name = VFS.uniqueName(parent, node.name);
    VFS.addKid(parent, node);
    this.items.splice(i,1);
    VFS.changed(parent);
    this.save();
  },
  empty(){
    if (!this.items.length) return;
    Dlg.msg({title:"Confirm Multiple File Delete", icon:"question",
      text:"Are you sure you want to delete these " + this.items.length + " items?",
      buttons:["Yes","No"]}).then(r => {
        if (r === "Yes") { this.items = []; this.save(); Snd.event("Empty Recycle Bin"); }
      });
  },
  properties(){
    let pct = State.get("rbPct", 10);
    Dlg.propSheet({title:"Recycle Bin Properties", icon:"recycle_empty", w:380, h:420,
      tabs:[{label:"Global", build:(p, sheet) => {

        sl.addEventListener("input", () => { pct = +sl.value; val.textContent = pct + "%"; sheet.markDirty(); });
        const cb = h("input", {type:"checkbox", class:"w95"});

            "Use one setting for all drives:"),

            sl, val, h("div", {style:{textAlign:"center", color:"#404040"}}, "(percent of each drive)")),
          h("label", {class:"w95l", style:{display:"flex", marginTop:"14px"}}, cb,
            "Display delete confirmation dialog box"));
        sheet.getRB = () => ({pct, confirm: cb.checked});

/* ---------------- Shell ---------------- */
const Shell = {
  recent: [],
  reloadUser(){ this.recent = State.get("recent", []); this.browseSingle = State.get("browseSingle", false); },
  /* the shell's own process: explorer.exe, running as the logged-on user */
  proc(){ return Ps.list().find(p => p.image === "explorer.exe") || null; },
  clip: null, // {nodes:[paths], cut:bool}
  folderWins: new Map(), // path -> win (spatial mode)
  browseSingle: false,
  addRecent(node){
    const p = VFS.path(node);
    this.recent = [p].concat(this.recent.filter(x => x !== p)).slice(0, 10);
    State.set("recent", this.recent);
  },
  /* every open from the shell is an open through the I/O manager, checked by the SRM */
  openNode(node, opts){
    opts = opts || {};
    if (!node) return;
    if (node.type === "d") return this.openFolder(node, opts);
    const e = VFS.ext(node);
    if (!Io.access(node, e === "lnk" ? A.R : (e === "exe" || e === "com" || e === "bat" || e === "cmd" || e === "scr" || node.bin) ? A.X | A.R : A.R))
      return Io.deniedBox(node, VFS.displayName(node));
    if (e === "lnk") {
      if (node.app && Apps[node.app]) return Exec.start(node.app, node.arg);
      if (node.app && /^(saver|psx):/.test(node.app)) return Exec.runImage(node);
      return Dlg.msg({title:"Problem with Shortcut", icon:"error",
        text:"The item '" + VFS.displayName(node) + "' that this shortcut refers to has been changed or moved, so this shortcut will no longer work properly."});
    }
    if (e === "exe" || e === "com" || e === "scr" || node.bin) return Exec.runImage(node);
    if (e === "bat" || e === "cmd") return Exec.start("cmd", {script: VFS.path(node)});
    this.addRecent(node);
    if (e === "txt" || e === "log" || e === "ini" || e === "inf" || e === "sys" || e === "nt" || !e)
      return Exec.start("notepad", node);
    if (e === "bmp") return Exec.start("paint", node);
    if (e === "doc" || e === "wri") return Exec.start("wordpad", node);
    if (e === "wav" || e === "mid" || e === "avi") return Exec.start("mplayer", node);
    if (e === "htm" || e === "html") return Exec.start("iexplore", "file:" + VFS.path(node));
    if (e === "hlp") return Exec.start("help");
    if (e === "ttf" || e === "fon") return this.fontPreview(node);
    return Dlg.msg({title: VFS.displayName(node), icon:"warn", w:400,
      text:"There is no application associated with \"" + VFS.displayName(node) + "\".\n\nRun the Explorer and choose Options from the View menu to create an association.",
      buttons:["OK"]});
  },
  openPath(p, opts){ return this.openNode(VFS.get(p), opts); },
  /* ---- folder windows (spatial) ---- */
  openFolder(node, opts){

  openMyComputer(){ return this.openSpecial("mycomputer"); },
  openControlPanel(){ return this.openSpecial("controlpanel"); },
  openPrinters(){ return this.openSpecial("printers"); },
  openRecycle(){ return this.openSpecial("recycle"); },

  driveAError(){
    Snd.event("Critical Stop");
    Dlg.msg({title:"A:\\ is not accessible", icon:"error",
      text:"The device is not ready.", buttons:["Retry","Cancel"]}).then(r => {

  openItem(item, fromWin){

  /* ---- clipboard ops ---- */
  cutCopy(nodes, cut){ this.clip = {paths: nodes.map(n => VFS.path(n)), cut}; },
  canPaste(){ return this.clip && this.clip.paths.length > 0; },
  paste(destNode){
    if (!this.canPaste() || !destNode || destNode.type !== "d") return;
    this.transfer(this.clip.paths.map(p => VFS.get(p)).filter(Boolean), destNode, this.clip.cut);
    if (this.clip.cut) this.clip = null;
  },
  /* copy and move, both through the access checks: read the source, add to the
     destination, and (for a move) delete the original */
  transfer(nodes, dest, move){
    if (!Io.access(dest, A.W)) { Io.deniedBox(dest, move ? "Error Moving File" : "Error Copying File"); return false; }
    for (const n of nodes) {
      if (n === dest || VFS.contains(n, dest)) continue;
      if (!Io.access(n, A.R)) { Io.deniedBox(n, move ? "Error Moving File" : "Error Copying File"); return false; }
      if (move) {
        if (n.sys) { this.sharingViolation(n, "move"); return false; }
        if (!Io.canDelete(n)) { Io.deniedBox(n, "Error Moving File"); return false; }
        if (n.parent !== dest) VFS.move(n, dest);
      } else VFS.copy(n, dest, n.parent === dest);
    }
    return true;
  },
  sharingViolation(n, verb){
    Snd.event("Critical Stop");
    return Dlg.msg({title:"Error " + (verb === "move" ? "Moving" : verb === "rename" ? "Renaming" : "Deleting") + " File", icon:"error", w:400,
      text:"Cannot " + (verb || "delete") + " " + VFS.displayName(n) + ": There has been a sharing violation.\n\nThe source or destination file may be in use."});
  },
  /* ---- delete with recycle ---- */
  deleteNodes(nodes){
    nodes = nodes.filter(n => n && n.parent);
    if (!nodes.length) return;
    const sysHit = nodes.find(n => n.sys);
    if (sysHit) return this.sharingViolation(sysHit, "delete");
    const denied = nodes.find(n => !Io.canDelete(n));
    if (denied) { Snd.event("Critical Stop"); return Dlg.msg({title:"Error Deleting File", icon:"error", w:380,
      text:"Cannot delete " + VFS.displayName(denied) + ": " + (Io.lastErr || "Access is denied.") + "\n\nMake sure the disk is not full or write-protected and that the file is not currently in use."}); }
    if (nodes.some(n => VFS.volOf(n).remote)) {
      return Dlg.msg({title:"Confirm File Delete", icon:"question", text:"Are you sure you want to delete " + (nodes.length === 1 ? "'" + VFS.displayName(nodes[0]) + "'" : "these " + nodes.length + " items") + "?\n\nFiles on network drives are not sent to the Recycle Bin.", buttons:["Yes","No"]})
        .then(r => { if (r === "Yes") for (const n of nodes) VFS.remove(n); });
    }
    const doIt = () => {
      for (const n of nodes) { RecycleBin.add(n); VFS.remove(n); }
      RecycleBin.save();
    };
    if (!State.get("rbConfirm", true)) return doIt();
    const what = nodes.length === 1
      ? "'" + VFS.displayName(nodes[0]) + "'"
      : "these " + nodes.length + " items";
    Dlg.msg({title: nodes.length === 1 && nodes[0].type === "d" ? "Confirm Folder Delete" : "Confirm File Delete",

      text:"Are you sure you want to send " + what + " to the Recycle Bin?",
      buttons:["Yes","No"]}).then(r => { if (r === "Yes") doIt(); });
  },
  createShortcut(node, destFolder){
    const dest = destFolder || node.parent;
    const app = node.app || (node.type === "d" ? null : null);
    const s = VFS.create(dest, "Shortcut to " + VFS.displayName(node) + ".lnk", "f",
      {app: node.app || "openpath", size:368});
    if (!node.app) { s.app = "openpath"; s.arg = VFS.path(node); s.icon = VFS.iconFor(node); }
    VFS.changed(dest);
    return s;
  },
  sendToMenu(nodes){

      {sep:true},

  propertiesDialog(node, startTab){
    if (!node.parent && !node.remote && /^[A-Z]:$/.test(node.name)) return this.driveProps(node.name, startTab);
    const isDir = node.type === "d";
    const vol = VFS.volOf(node);
    const ntfs = vol.fs === "NTFS";
    /* reading the attributes needs Read; changing them needs Write */
    if (!Io.access(node, A.R) && !Io.access(node, A.P) && !Io.access(node, A.O)) {

        const head = h("div", {style:{display:"flex", alignItems:"center", gap:"12px"}});

        head.appendChild(h("div", {class:"b-in-thin", style:{flex:"1", padding:"3px 6px", background:"#fff"}}, VFS.displayName(node)));
        p.appendChild(head); p.appendChild(hr());
        p.appendChild(row("Type:", VFS.typeName(node)));
        p.appendChild(row("Location:", node.parent ? VFS.path(node.parent) : ""));
        if (isDir) {
          const c = count(node);
          let bytes = 0; const sum = x => { for (const k of x.kids || []) { if (k.type === "f") bytes += k.size || 0; else sum(k); } }; sum(node);
          p.appendChild(row("Size:", fmtSize(bytes) + " (" + bytes.toLocaleString("en-US") + " bytes)"));
          p.appendChild(row("Contains:", c.f + " Files, " + c.d + " Folders"));
        } else {
          p.appendChild(row("Size:", fmtSize(node.size) + " (" + (node.size||0).toLocaleString("en-US") + " bytes)"));
          if (node.compressed) p.appendChild(row("Compressed Size:", fmtSize(Math.round((node.size||0) * .55)) + " (" + Math.round((node.size||0) * .55).toLocaleString("en-US") + " bytes)"));
        }
        p.appendChild(hr());
        p.appendChild(row("MS-DOS name:", shortPath().split("\\").pop() || node.name));
        p.appendChild(row("Created:", fmtDate(node.date)));
        if (!isDir) p.appendChild(row("Modified:", fmtDate(node.date)));
        p.appendChild(row("Accessed:", ntDate(SimClock.now())));
        p.appendChild(hr());
        const attrs = h("div", {style:{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"4px 16px"}});
        const list = [["Read-only", "readonly"], ["Archive", null], ["Hidden", "hidden"], ["System", "sys"]];
        if (ntfs) list.push(["Compressed", "compressed"]);
        const boxes = {};
        for (const [label, key] of list) {
          const cb = h("input", {type:"checkbox", class:"w95"});
          cb.checked = key ? !!node[key] : !isDir; cb.disabled = !key || key === "sys";
          if (key) cb.addEventListener("change", () => sheet.markDirty());
          boxes[key || label] = cb;
          attrs.appendChild(h("label", {class:"w95l"}, cb, label));
        }
        p.appendChild(h("div", {style:{display:"flex"}}, h("div", {style:{width:"110px"}}, "Attributes:"), attrs));
        sheet.applyAttrs = () => {
          const changes = {readonly: boxes.readonly.checked, hidden: boxes.hidden.checked, compressed: boxes.compressed ? boxes.compressed.checked : node.compressed};
          if (changes.readonly === !!node.readonly && changes.hidden === !!node.hidden && changes.compressed === !!node.compressed) return;
          if (!Io.access(node, A.W, {ignoreRO:true})) { Io.deniedBox(node, "Error Applying Attributes"); return; }
          node.readonly = changes.readonly; node.hidden = changes.hidden;
          if (changes.compressed !== !!node.compressed) {
            const apply = deep => { node.compressed = changes.compressed; if (deep && isDir) { const w = x => { for (const k of x.kids || []) { k.compressed = changes.compressed; w(k); } }; w(node); } VFS.changed(node.parent || node); };
            if (isDir) Dlg.msg({title:"Confirm Attribute Changes", icon:"question", text:"Do you want to apply this change to all subfolders as well?", buttons:["Yes","No"]}).then(r => apply(r === "Yes"));
            else apply(false);
            Guide.note("compress");
          }
          VFS.changed(node.parent || node);
        };
      }}];
    if (isDir && !vol.remote && vol.fs !== "CDFS") tabs.push({label:"Sharing", build:(p, sheet) => SecurityUI.sharingTab(p, sheet, node)});
    if (ntfs) tabs.push({label:"Security", onShow:() => Guide.note("securitytab"), build:(p, sheet) => SecurityUI.securityTab(p, sheet, node)});
    const sheet = Dlg.propSheet({title: VFS.displayName(node) + " Properties", icon: VFS.iconFor(node), w:380, h:460,
      tabs, onApply: sh => { if (sh.applyAttrs) sh.applyAttrs(); if (sh.applyShare) sh.applyShare(); }});
    if (startTab) {
      const idx = tabs.findIndex(t => t.label === startTab);
      if (idx > 0) $$(".tab", sheet.win.el)[idx].dispatchEvent(new MouseEvent("mousedown"));
    }
    return sheet;
  }
};
