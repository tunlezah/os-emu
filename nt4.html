<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows NT 4.0 — The OS Museum</title>
<meta name="description" content="A single-file, in-browser simulation of Microsoft Windows NT 4.0 Workstation and Server at Service Pack 3 (1997): the Windows 95 face on the NT kernel. Nothing real runs.">
<style>
/* ==========================================================================
   WINDOWS NT 4.0 — single-file museum exhibit. The shell styles below are the Windows 95 exhibit's, unchanged: the face is the same.
   All artwork is original, drawn in code. No external resources.
   ========================================================================== */
:root{
  --teal:#008080; --face:#c0c0c0; --face-lt:#dfdfdf; --shadow:#808080;
  --dk:#0a0a0a; --hl:#ffffff; --title:#000080; --title-txt:#ffffff;
  --title-in:#808080; --title-in-txt:#c0c0c0; --sel:#000080; --sel-txt:#ffffff;
  --info:#ffffe1;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  background:#000;
  font-family:"MS Sans Serif","Microsoft Sans Serif",Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:11px; color:#000;
  -webkit-font-smoothing:none;
  user-select:none; -webkit-user-select:none;
  cursor:default;
}
#stage{position:fixed;inset:0;overflow:hidden;background:#000;}
img,svg{display:block;}
button,input,select,textarea{font-family:inherit;font-size:11px;}

/* ---------- bevel language ---------- */
.b-out{  /* raised window / button edge */
  background:var(--face);
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
}
.b-out-thin{
  background:var(--face);
  box-shadow:inset -1px -1px var(--shadow), inset 1px 1px var(--hl);
}
.b-in{   /* sunken well */
  background:#fff;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);
}
.b-in-thin{
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow);
}
.b-groove{
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             -1px -1px 0 var(--shadow), 1px 1px 0 var(--hl);
}
/* ---------- buttons ---------- */
.btn{
  background:var(--face); border:none; outline:none; position:relative;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  padding:4px 12px; min-width:75px; min-height:23px; color:#000;
}
.btn:active:not(:disabled), .btn.pressed{
  box-shadow:inset -1px -1px var(--face-lt), inset 1px 1px var(--dk),
             inset -2px -2px var(--hl), inset 2px 2px var(--shadow);
  padding:5px 11px 3px 13px;
}
.btn:focus-visible::after, .btn.deffocus::after{
  content:""; position:absolute; inset:3px; border:1px dotted #000; pointer-events:none;
}
.btn.default{
  box-shadow:0 0 0 1px #000, inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
}
.btn:disabled{color:var(--shadow); text-shadow:1px 1px 0 var(--hl);}
.tbtn{ /* toolbar button */
  background:var(--face); border:none; width:22px; height:22px;
  display:inline-flex; align-items:center; justify-content:center;
}
.tbtn:hover{box-shadow:inset -1px -1px var(--shadow), inset 1px 1px var(--hl);}
.tbtn:active, .tbtn.on{box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow);}
.tbtn:disabled{opacity:.45;}
.tbtn:disabled:hover{box-shadow:none;}

/* ---------- text fields ---------- */
.field, textarea.field, input.field, select.field{
  background:#fff; border:none; outline:none;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);
  padding:3px 5px; color:#000;
}
textarea.field{resize:none; font-family:"Courier New",monospace; font-size:13px;}
input.field{height:21px;}
select.field{padding:2px;}
.field:disabled{background:var(--face); color:var(--shadow);}
input[type=checkbox].w95, input[type=radio].w95{
  appearance:none; width:13px; height:13px; background:#fff; flex:0 0 13px;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);
  vertical-align:middle; position:relative; margin:0 4px 0 0;
}
input[type=radio].w95{border-radius:50%;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);}
input[type=checkbox].w95:checked::after{
  content:""; position:absolute; left:2px; top:2px; width:7px; height:5px;
  border-left:2px solid #000; border-bottom:2px solid #000; transform:rotate(-50deg);
}
input[type=radio].w95:checked::after{
  content:""; position:absolute; left:4px; top:4px; width:5px; height:5px;
  background:#000; border-radius:50%;
}
label.w95l{display:inline-flex; align-items:center; gap:2px;}

/* ---------- windows ---------- */
.win{
  position:absolute; background:var(--face); display:flex; flex-direction:column;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  padding:3px; min-width:120px; min-height:60px;
}
.win.maxed{padding:3px;}
.titlebar{
  height:18px; background:var(--title); color:var(--title-txt);
  display:flex; align-items:center; padding:1px 2px; gap:3px; flex:0 0 18px;
  font-weight:bold; overflow:hidden;
}
.win.inactive .titlebar{background:var(--title-in); color:var(--title-in-txt);}
.tb-icon{width:16px;height:16px;flex:0 0 16px;}
.tb-text{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:11px; padding-top:1px;}
.tb-btns{display:flex; gap:0; flex:0 0 auto; align-items:center;}
.tb-btn{
  width:16px; height:14px; background:var(--face); border:none; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  margin-left:0;
}
.tb-btn.closebtn{margin-left:2px;}
.tb-btn:active{
  box-shadow:inset -1px -1px var(--face-lt), inset 1px 1px var(--dk),
             inset -2px -2px var(--hl), inset 2px 2px var(--shadow);
}
.tb-btn svg{pointer-events:none;}
.menubar{
  display:flex; align-items:center; height:19px; flex:0 0 19px; padding:1px 0;
  background:var(--face);
}
.menubar .mtop{
  padding:2px 6px 3px; cursor:default;
}
.menubar .mtop.open, .menubar .mtop:hover.armed{background:var(--sel); color:var(--sel-txt);}
.menubar .mtop u{text-decoration:underline;}
.win-body{
  flex:1; position:relative; overflow:hidden; display:flex; flex-direction:column;
}
.statusbar{
  flex:0 0 20px; display:flex; gap:2px; padding-top:2px; background:var(--face);
}
.statusbar .cell{
  flex:1; box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow);
  padding:2px 6px; white-space:nowrap; overflow:hidden;
}
.statusbar .cell.fix{flex:0 0 auto; min-width:80px;}
.resizer{position:absolute; z-index:5;}
.rz-n{top:-1px;left:8px;right:8px;height:4px;cursor:n-resize;}
.rz-s{bottom:-1px;left:8px;right:8px;height:4px;cursor:s-resize;}
.rz-e{right:-1px;top:8px;bottom:8px;width:4px;cursor:e-resize;}
.rz-w{left:-1px;top:8px;bottom:8px;width:4px;cursor:w-resize;}
.rz-nw{left:-1px;top:-1px;width:8px;height:8px;cursor:nw-resize;}
.rz-ne{right:-1px;top:-1px;width:8px;height:8px;cursor:ne-resize;}
.rz-sw{left:-1px;bottom:-1px;width:8px;height:8px;cursor:sw-resize;}
.rz-se{right:-1px;bottom:-1px;width:8px;height:8px;cursor:se-resize;}
.zoomrect{position:fixed; border:2px dotted #dfdfdf; z-index:99999; pointer-events:none;}
.dragoutline{position:fixed; border:2px dotted #efefef; z-index:99998; pointer-events:none; mix-blend-mode:difference;}

/* ---------- menus / popups ---------- */
.popup{
  position:fixed; background:var(--face); z-index:60000; padding:2px;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  min-width:130px;
}
.popup .pi{
  display:flex; align-items:center; height:18px; padding:0 16px 0 2px;
  white-space:nowrap; position:relative;
}
.popup .pi.hilite{background:var(--sel); color:var(--sel-txt);}
.popup .pi.disabled{color:var(--shadow); text-shadow:1px 1px 0 var(--hl);}
.popup .pi.disabled.hilite{background:var(--sel); text-shadow:none;}
.popup .pi .ic{width:18px; flex:0 0 18px; display:flex; align-items:center; justify-content:center;}
.popup .pi .lbl{flex:1; padding-right:12px;}
.popup .pi .lbl u{text-decoration:underline;}
.popup .pi .lbl b{font-weight:bold;}
.popup .pi .shct{margin-left:auto; padding-left:14px;}
.popup .pi .sub{position:absolute; right:3px; top:5px;}
.popup .psep{height:1px; margin:3px 2px; background:var(--shadow); box-shadow:0 1px 0 var(--hl);}
.popup.bigicons .pi{height:32px;}
.popup.bigicons .pi .ic{width:36px; flex:0 0 36px;}
.chk{width:14px;display:inline-block;text-align:center;}

/* ---------- start menu ---------- */
#startmenu{
  position:fixed; left:2px; bottom:30px; z-index:60001; display:none;
  background:var(--face);
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  padding:3px;
}
#startmenu .smrow{display:flex;}
#startmenu .banner{
  width:22px; background:#00007b; position:relative; flex:0 0 22px;
}
#startmenu .banner span{
  position:absolute; bottom:6px; left:50%;
  transform:rotate(-90deg) translateY(-50%); transform-origin:0 0;
  white-space:nowrap; color:#c0c0c0; font-size:15px; letter-spacing:1px;
}
#startmenu .banner span b{color:#fff; font-weight:bold;}
#startmenu .smitems{flex:1; min-width:160px;}
.smi{display:flex; align-items:center; height:32px; padding:0 14px 0 3px; white-space:nowrap; position:relative;}
.smi .ic{width:38px; flex:0 0 38px; display:flex; align-items:center; justify-content:center;}
.smi.hilite{background:var(--sel); color:var(--sel-txt);}
.smi .lbl u{text-decoration:underline;}
.smi .sub{position:absolute; right:4px;}
.smsep{height:1px; margin:2px 1px; background:var(--shadow); box-shadow:0 1px 0 var(--hl);}

/* ---------- taskbar ---------- */
#taskbar{
  position:fixed; left:0; right:0; bottom:0; height:28px; z-index:50000;
  background:var(--face); display:flex; align-items:center; gap:3px;
  box-shadow:inset 0 1px var(--face-lt), inset 0 2px var(--hl);
  padding:2px 2px 2px 2px;
  transition:bottom .18s steps(6);
}
#taskbar.hidden-auto{bottom:-26px;}
#startbtn{
  flex:0 0 auto; height:22px; display:inline-flex; align-items:center; gap:4px;
  background:var(--face); border:none; padding:0 6px 0 3px; font-weight:bold; font-size:11px;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
}
#startbtn.open, #startbtn:active{
  box-shadow:inset -1px -1px var(--face-lt), inset 1px 1px var(--dk),
             inset -2px -2px var(--hl), inset 2px 2px var(--shadow);
}
#taskbtns{flex:1; display:flex; gap:3px; overflow:hidden; align-self:stretch; align-items:center;}
.taskbtn{
  flex:1 1 160px; max-width:160px; min-width:36px; height:22px;
  display:inline-flex; align-items:center; gap:4px; padding:0 4px;
  background:var(--face); border:none; font-size:11px; overflow:hidden;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
}
.taskbtn span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.taskbtn.active{
  font-weight:bold;
  background-image:repeating-conic-gradient(var(--hl) 0% 25%, var(--face) 0% 50%);
  background-size:2px 2px;
  box-shadow:inset -1px -1px var(--face-lt), inset 1px 1px var(--dk),
             inset -2px -2px var(--hl), inset 2px 2px var(--shadow);
}
#tray{
  flex:0 0 auto; height:22px; display:inline-flex; align-items:center; gap:6px;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow);
  padding:0 8px 0 6px;
}
#clock{font-size:11px; padding-top:1px;}
#trayvol{width:16px;height:16px;}

/* ---------- desktop ---------- */
#desktop{
  position:absolute; inset:0 0 28px 0; background:var(--teal); overflow:hidden;
}
#desktop.fullbleed{inset:0;}
.dicon{
  position:absolute; width:75px; text-align:center; padding-top:2px;
}
.dicon .img{width:32px; height:32px; margin:0 auto; position:relative;}
.dicon .txt{
  margin-top:4px; color:#fff; padding:1px 2px; display:inline-block; max-width:73px;
  overflow-wrap:break-word; line-height:1.15;
}
.dicon.sel .img{filter:brightness(.65) sepia(1) hue-rotate(190deg) saturate(3);}
.dicon.sel .txt{background:var(--sel); color:var(--sel-txt); outline:1px dotted #ffff7f;}
.dicon .txt input{
  font:inherit; text-align:center; border:1px solid #000; background:#fff; color:#000;
  width:70px; outline:none; padding:0;
}
/* icon views inside folders */
.fitem{display:inline-flex; flex-direction:column; align-items:center; width:75px; padding:4px 0; vertical-align:top; text-align:center;}
.fitem .img{width:32px;height:32px;position:relative;}
.fitem .txt{margin-top:3px; padding:1px 2px; max-width:72px; overflow-wrap:break-word; line-height:1.15;}
.fitem.sel .img{filter:brightness(.65) sepia(1) hue-rotate(190deg) saturate(3);}
.fitem.sel .txt{background:var(--sel); color:var(--sel-txt); outline:1px dotted #ffff7f;}
.fitem-s{display:flex; align-items:center; gap:4px; padding:1px 4px 1px 2px; white-space:nowrap;}
.fitem-s .img{width:16px;height:16px;position:relative;flex:0 0 16px;}
.fitem-s.sel .txt{background:var(--sel); color:var(--sel-txt); outline:1px dotted #ffff7f;}
.fview{flex:1; overflow:auto; background:#fff; position:relative;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);
  padding:4px;}
.fview.list{display:flex; flex-direction:column; flex-wrap:wrap; align-content:flex-start;}
table.details{border-collapse:collapse; width:100%;}
table.details th{
  background:var(--face); font-weight:normal; text-align:left; padding:2px 6px;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
  position:sticky; top:0; cursor:default;
}
table.details td{padding:1px 6px; white-space:nowrap;}
table.details tr.sel td{background:var(--sel); color:var(--sel-txt);}
.shortcut-badge{
  position:absolute; left:0; bottom:0; width:11px; height:11px; background:#fff;
  border:1px solid #000;
}
.shortcut-badge::after{
  content:""; position:absolute; left:1px; bottom:1px;
  border-style:solid; border-width:0 0 7px 7px; border-color:transparent transparent #000 transparent;
  clip-path:polygon(0 100%, 100% 100%, 100% 30%, 55% 30%, 55% 0, 0 55%);
  background:#000; width:7px; height:7px; border:none;
  -webkit-clip-path:polygon(100% 20%, 45% 20%, 45% 0, 0 50%, 45% 100%, 45% 80%, 100% 80%);
  clip-path:polygon(100% 20%, 45% 20%, 45% 0, 0 50%, 45% 100%, 45% 80%, 100% 80%);
}
/* explorer tree */
.tree{overflow:auto; background:#fff; padding:2px;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             inset -2px -2px var(--face-lt), inset 2px 2px var(--dk);}
.tnode{white-space:nowrap;}
.trow{display:flex; align-items:center; height:17px; gap:2px;}
.trow .exp{width:16px; flex:0 0 16px; display:flex; align-items:center; justify-content:center;}
.trow .ticon{width:16px;height:16px;flex:0 0 16px;position:relative;}
.trow .tlbl{padding:0 3px;}
.trow.sel .tlbl{background:var(--sel); color:var(--sel-txt); outline:1px dotted #ffff7f;}
.tkids{margin-left:19px; border-left:1px dotted #808080;}
.expbox{width:9px;height:9px;background:#fff;border:1px solid #808080;
  display:flex;align-items:center;justify-content:center;font-size:9px;line-height:7px;font-family:monospace;}

/* ---------- dialog layout helpers ---------- */
.dlgpad{padding:12px;}
.dlgbtns{display:flex; justify-content:flex-end; gap:6px; padding:10px 12px 12px;}
.dlgbtns.center{justify-content:center;}
.groupbox{position:relative; border:none; margin-top:8px; padding:14px 10px 10px;
  box-shadow:inset -1px -1px var(--hl), inset 1px 1px var(--shadow),
             -1px -1px 0 var(--shadow) inset, 1px 1px 0 var(--hl) inset;}
fieldset.groupbox{
  border:2px groove #fff; box-shadow:none; padding:8px 10px 10px; margin-top:4px;
}
fieldset.groupbox legend{padding:0 4px;}
/* tabs */
.tabs{display:flex; flex-direction:column; flex:1; min-height:0;}
.tabstrip{display:flex; padding:0 2px; position:relative; z-index:2; flex:0 0 auto;}
.tab{
  padding:3px 10px 4px; background:var(--face); position:relative; top:2px;
  box-shadow:inset -1px 0 var(--dk), inset 1px 1px var(--face-lt),
             inset -2px 0 var(--shadow), inset 2px 2px var(--hl);
  border-bottom:none; margin-right:0;
}
.tab.on{top:0; padding:4px 12px 7px; z-index:3; margin:0 -2px;
  box-shadow:inset -1px 0 var(--dk), inset 1px 1px var(--face-lt),
             inset -2px 0 var(--shadow), inset 2px 2px var(--hl);}
.tabpanel{
  flex:1; min-height:0; overflow:auto; position:relative; z-index:1; padding:12px;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);
}
/* message boxes */
.msgbox-body{display:flex; gap:14px; padding:14px 16px 8px; align-items:flex-start;}
.msgbox-txt{padding-top:4px; max-width:360px; line-height:1.4; user-select:text;}

/* ---------- boot screens ---------- */
.fullscreen{position:fixed; inset:0; z-index:80000; display:none;}
#bootpost{background:#000; color:#aaa; font-family:"Courier New",monospace; font-size:14px; padding:10px 14px; line-height:1.35; white-space:pre-wrap;}
#bootpost .amikey{color:#fff;}
#bootmenu{background:#000; color:#c0c0c0; font-family:"Courier New",monospace; font-size:15px; padding:16px 24px; line-height:1.5; white-space:pre;}
#bootsplash{background:#000; display:none; align-items:center; justify-content:center;}
/* LOGO.SYS was 320x400 shown double-wide on a 4:3 screen; stretch, don't preserve */
#bootsplash canvas{width:min(100vw, calc(100vh * 4 / 3)); height:min(100vh, calc(100vw * 3 / 4)); image-rendering:pixelated;}
#dosscreen{background:#000; color:#c0c0c0; font-family:"Courier New",monospace; font-size:15px; padding:8px 10px; overflow:auto; white-space:pre-wrap; line-height:1.25;}
#shutscreen{background:#000; display:none; align-items:center; justify-content:center; text-align:center;}
#shutscreen .msg{color:#ffa000; font-size:clamp(18px,4vw,34px); font-family:"Courier New",monospace; font-weight:bold; text-shadow:0 0 8px rgba(255,160,0,.4); line-height:1.6;}
#bsod{background:#0000aa; color:#c0c0c0; font-family:"Courier New",monospace; font-size:15px; display:none; align-items:center; justify-content:center;}
#bsod .inner{max-width:640px; padding:20px; line-height:1.45; white-space:pre-wrap;}
#bsod .hdr{background:#c0c0c0; color:#0000aa; padding:0 8px; display:inline-block; font-weight:bold;}
#dimmer{position:fixed; inset:0; z-index:64000; display:none;
  background-image:repeating-conic-gradient(rgba(0,0,0,.85) 0% 25%, transparent 0% 50%);
  background-size:2px 2px;}
/* safe mode */
#desktop.safemode{background:#008080;}
body.safemode .win, body.safemode #taskbar, body.safemode #startmenu, body.safemode .popup{filter:saturate(.6);}
.safelabel{position:absolute; color:#fff; font-size:13px; font-weight:bold; z-index:1; pointer-events:none;}
/* cursors */
body.waitcursor, body.waitcursor *{cursor:wait !important;}
::selection{background:var(--sel); color:var(--sel-txt);}
.selectable, .selectable *{user-select:text; -webkit-user-select:text;}

/* marquee select */
#marquee{position:absolute; border:1px dotted #fff; display:none; z-index:9;}

/* scrollbars-ish (webkit) */
::-webkit-scrollbar{width:16px;height:16px;}
::-webkit-scrollbar-track{background:repeating-conic-gradient(#fff 0% 25%, var(--face) 0% 50%); background-size:2px 2px;}
::-webkit-scrollbar-thumb{background:var(--face);
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);}
::-webkit-scrollbar-button{background:var(--face); height:16px; width:16px;
  box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--face-lt),
             inset -2px -2px var(--shadow), inset 2px 2px var(--hl);}
/* ==========================================================================
   NT ADDITIONS — text-mode screens, Winlogon's desktop, the console, the
   kernel panel, the exhibit tab and guide.
   ========================================================================== */
.textscreen{position:fixed; inset:0; z-index:85000; display:none; white-space:pre; overflow:hidden;

     talking, not Windows NT. Delete #extab, #exmenu, #guide and the Guide/Exhibit
     modules and the simulation runs unchanged. -->
<div id="extab"><b id="extab-guide">Exhibit guide</b><b id="extab-kernel">Kernel</b><b id="extab-sas">Ctrl+Alt+Del</b><b id="extab-machine">Machine</b></div>

<script>
"use strict";
/* ==========================================================================
   Windows NT 4.0 Workstation / Server, Service Pack 3 — museum exhibit.
   Module order is the argument: the Executive first (processes, address
   spaces, scheduler, tokens, the Security Reference Monitor, the SAM, the
   registry, the event log), then the filesystem, then the blue screen and
   the instrumentation panel, and only then the shell — which is the Windows
   95 exhibit's own Explorer, window manager and applications, sitting on
   top of all that without knowing it.
     1 utils + state      2 executive       3 SAM, domain, LSA   4 registry
     5 filesystem (NTFS/FAT/remote)        6 bugcheck, Dr. Watson, kernel panel
     7 sound, icons       8 shared shell (window manager, taskbar, Explorer,
       desktop) + the Security tab         9 applications (shared + NT)
    10 NT administrative tools            11 Control Panel   12 cmd.exe,
       NTVDM/WOW, OS/2, POSIX             13 Server variant  14 hardware
       variants, FX!32  15 screensavers    16 boot, Winlogon, setup
    17 guide layer (separable)            18 init
   Everything is a simulation; nothing real runs.
   ========================================================================== */

/* ---------------- tiny utils ---------------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "style" && typeof attrs[k] === "object") Object.assign(el.style, attrs[k]);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
    else if (k === "class") el.className = attrs[k];
    else if (k === "html") el.innerHTML = attrs[k];
    else el.setAttribute(k, attrs[k]);
  }
  for (const kid of kids) {
    if (kid == null) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
function esc(s){return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function accel(label){ // "&Open" -> Open with O underlined
  const i = label.indexOf("&");
  if (i < 0) return esc(label);
  return esc(label.slice(0,i)) + "<u>" + esc(label[i+1]) + "</u>" + esc(label.slice(i+2));
}
function clamp(v,a,b){return Math.max(a, Math.min(b, v));}
function fmtSize(n){
  if (n == null) return "";
  if (n < 1024) return n + " bytes";
  return Math.ceil(n/1024).toLocaleString("en-US") + "KB";
}
function fmtSizeShort(n){ return n==null ? "" : Math.max(1,Math.ceil(n/1024)) + "KB"; }
function fmtDate(d){
  d = new Date(d);
  let hh = d.getHours(), ap = hh >= 12 ? "PM" : "AM";
  hh = hh % 12 || 12;
  return (d.getMonth()+1)+"/"+d.getDate()+"/"+String(d.getFullYear()).slice(2)+" "+
         hh+":"+String(d.getMinutes()).padStart(2,"0")+" "+ap;
}
const D95 = (m,d,hh,mm) => new Date(1995, m-1, d, hh||9, mm||30).getTime(); // mid-1995 stamps
let uidc = 0; const uid = () => "u" + (++uidc);

const D96 = (m,d,hh,mm) => new Date(1996, m-1, d, hh||9, mm||30).getTime();
const D97 = (m,d,hh,mm) => new Date(1997, m-1, d, hh||9, mm||30).getTime();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hex8 = n => (n >>> 0).toString(16).padStart(8, "0");
const commas = n => Math.round(n).toLocaleString("en-US");
function rndInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }

/* ==========================================================================
   STATE MANAGER — one LocalStorage record, split the way NT splits it:
   the machine (HKLM, the SAM, the volumes, the event logs) and one bucket
   per user SID (that user's HKCU and profile settings). `State` always
   points at the logged-on user's bucket, so code written for the Windows 95
   exhibit's single-user State becomes per-user without knowing it.
   ========================================================================== */
const Store = {
  KEY: "nt4sim.v1",
  data: null,
  load(){
    try { this.data = JSON.parse(localStorage.getItem(this.KEY)) || null; } catch(e){ this.data = null; }
    if (!this.data || typeof this.data !== "object") this.data = {};
    this.data.machine = this.data.machine || {};
    this.data.users = this.data.users || {};
  },
  save(){
    clearTimeout(this._t);
    this._t = setTimeout(() => this.flush(), 200);
  },
  flush(){
    clearTimeout(this._t);
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){}
  },
  wipe(){ try { localStorage.removeItem(this.KEY); } catch(e){} this.data = {machine:{}, users:{}}; }
};
Store.load();
window.addEventListener("beforeunload", () => Store.flush());
const MState = {
  get(k, def){ const m = Store.data.machine; return (k in m) ? m[k] : def; },
  set(k, v){ Store.data.machine[k] = v; Store.save(); },
  del(k){ delete Store.data.machine[k]; Store.save(); }
};
const State = {
  sid: ".DEFAULT",
  bucket(){ const u = Store.data.users; return u[this.sid] || (u[this.sid] = {}); },
  get(k, def){ const b = this.bucket(); return (k in b) ? b[k] : def; },
  set(k, v){ this.bucket()[k] = v; Store.save(); },
  forSid(sid){ return Store.data.users[sid] || (Store.data.users[sid] = {}); }
};


/* ##########################################################################
   THE EXECUTIVE
   Built first, on purpose. Everything after this point — the Explorer shell
   borrowed from the Windows 95 exhibit, the applets, the games — is a client
   of what is defined here: processes with their own address spaces, a
   preemptive priority scheduler, tokens, access control lists, the Security
   Reference Monitor, the SAM, the event log and the registry.
   ########################################################################## */

/* ---------------- KTrace: the bus the instrumentation panel listens to ---- */
const KTrace = {
  subs: new Set(),
  counts: {},           // component -> number of calls crossing into kernel mode
  ring: [],
  emit(component, text, mode){
    this.counts[component] = (this.counts[component] || 0) + 1;
    const ev = {t: performance.now(), component, text, mode: mode || "k"};
    this.ring.push(ev); if (this.ring.length > 200) this.ring.shift();
    for (const f of this.subs) { try { f(ev); } catch(e){} }
  },
  on(f){ this.subs.add(f); return () => this.subs.delete(f); }
};

/* ---------------- Hardware & variant ------------------------------------ */
const HW = {
  defaults: {arch:"x86", cpus:1, ramMB:32, sp:"SP3", video:"S3 Trio64", installed:true},
  get(){ return Object.assign({}, this.defaults, MState.get("hw", {})); },
  set(patch){ MState.set("hw", Object.assign(this.get(), patch)); },
  cpuName(){
    const hw = this.get();
    return hw.arch === "alpha" ? "Digital Alpha 21164 (EV5) 500 MHz" : "Intel Pentium 166 MHz";
  },
  build(){ return 1381; },
  spText(){
    const sp = this.get().sp;
    return sp === "RTM" ? "" : sp === "SP6a" ? "Service Pack 6" : "Service Pack 3";
  },
  ieVersion(){ const sp = this.get().sp; return sp === "RTM" ? "2.0" : sp === "SP6a" ? "4.01" : "3.02"; },
  directX(){ const sp = this.get().sp; return sp === "RTM" ? "2" : "3"; }
};

/* the simulated clock: it is a Tuesday in the autumn of 1997 */
const SimClock = {
  offset: 0,
  base(){ return new Date(1997, 9, 14, 8, 52, 0).getTime(); },
  init(){
    const elapsed = MState.get("clockElapsed", 0);
    this.offset = this.base() + elapsed - Date.now();
    setInterval(() => MState.set("clockElapsed", this.now() - this.base()), 30000);
  },
  now(){ return Date.now() + this.offset; },
  set(t){ this.offset = t - Date.now(); }
};
SimClock.init();
function ntDate(t){
  const d = new Date(t);
  return (d.getMonth()+1) + "/" + d.getDate() + "/" + String(d.getFullYear()).slice(2);
}
function ntTime(t, secs){
  const d = new Date(t);
  let hh = d.getHours(), ap = hh >= 12 ? "PM" : "AM"; hh = hh % 12 || 12;
  return hh + ":" + String(d.getMinutes()).padStart(2,"0") + (secs ? ":" + String(d.getSeconds()).padStart(2,"0") : "") + " " + ap;
}

/* ---------------- Security identifiers ---------------------------------- */
const SID = {
  EVERYONE:"S-1-1-0", CREATOR_OWNER:"S-1-3-0", NETWORK:"S-1-5-2", INTERACTIVE:"S-1-5-4",
  AUTH_USERS:"S-1-5-11", SYSTEM:"S-1-5-18",
  ADMINS:"S-1-5-32-544", USERS:"S-1-5-32-545", GUESTS:"S-1-5-32-546", POWER:"S-1-5-32-547",
  ACCOUNT_OPS:"S-1-5-32-548", SERVER_OPS:"S-1-5-32-549", PRINT_OPS:"S-1-5-32-550",
  BACKUP_OPS:"S-1-5-32-551", REPLICATOR:"S-1-5-32-552"
};
const WELLKNOWN = {
  [SID.EVERYONE]:"Everyone", [SID.CREATOR_OWNER]:"CREATOR OWNER", [SID.NETWORK]:"NETWORK",
  [SID.INTERACTIVE]:"INTERACTIVE", [SID.AUTH_USERS]:"Authenticated Users", [SID.SYSTEM]:"SYSTEM",
  [SID.ADMINS]:"Administrators", [SID.USERS]:"Users", [SID.GUESTS]:"Guests", [SID.POWER]:"Power Users",
  [SID.ACCOUNT_OPS]:"Account Operators", [SID.SERVER_OPS]:"Server Operators", [SID.PRINT_OPS]:"Print Operators",
  [SID.BACKUP_OPS]:"Backup Operators", [SID.REPLICATOR]:"Replicator"
};
/* access bits — the six "Special Access" letters of the NT 4.0 ACL editor */
const A = {R:1, W:2, X:4, D:8, P:16, O:32, ALL:63};
const ACCESS_NAMES = {R:"Read", W:"Write", X:"Execute", D:"Delete", P:"Change Permissions", O:"Take Ownership"};
function maskLetters(m){
  if (m == null) return "Not Specified";
  if (m === A.ALL) return "All";
  if (m === 0) return "None";
  return ["R","W","X","D","P","O"].filter(k => m & A[k]).join("");
}
/* the "Type of Access" presets */
const FILE_PRESETS = [
  ["No Access", 0, null, true], ["Read", A.R|A.X], ["Change", A.R|A.W|A.X|A.D], ["Full Control", A.ALL]
];
const DIR_PRESETS = [ // [name, dir mask, file mask, deny?]
  ["No Access", 0, 0, true], ["List", A.R|A.X, null], ["Read", A.R|A.X, A.R|A.X],
  ["Add", A.W|A.X, null], ["Add & Read", A.R|A.W|A.X, A.R|A.X],
  ["Change", A.R|A.W|A.X|A.D, A.R|A.W|A.X|A.D], ["Full Control", A.ALL, A.ALL]
];
const KEY_PRESETS = [["Read", A.R], ["Full Control", A.ALL]];

/* ---------------- Security descriptors ---------------------------------- */
const SD = {
  /* ace: {t:'A'|'D', sid, m:mask, fm:fileMask|undefined (directories only)} */
  make(owner, aces, sacl){ return {owner, dacl: aces ? aces.map(a => Object.assign({}, a)) : null, sacl: sacl || []}; },
  clone(sd){ return sd ? JSON.parse(JSON.stringify(sd)) : null; },
  /* NT 4.0 inheritance: computed once at create time, copied, never re-evaluated */
  inherit(parentSd, isDir, creatorTok){
    if (!parentSd) return null;
    const ownerSid = creatorTok ? Se.defaultOwner(creatorTok) : SID.ADMINS;
    const dacl = [];
    for (const ace of parentSd.dacl || []) {
      const sid = ace.sid === SID.CREATOR_OWNER && !isDir ? ownerSid : ace.sid;
      if (isDir) dacl.push({t:ace.t, sid: ace.sid, m: ace.sid === SID.CREATOR_OWNER ? 0 : ace.m, fm: ace.fm});
      else if (ace.fm != null) dacl.push({t:ace.t, sid, m: ace.fm});
    }
    return {owner: ownerSid, dacl: parentSd.dacl ? dacl : null,
      sacl: (parentSd.sacl || []).map(s => Object.assign({}, s))};
  },
  describe(sd, isDir){
    if (!sd) return "(no security: FAT volume)";
    if (!sd.dacl) return "Everyone: Full Control (no DACL)";
    return sd.dacl.map(a => Se.nameOf(a.sid) + ": " + (a.t === "D" ? "No Access" :
      "(" + maskLetters(a.m) + ")" + (isDir ? "(" + maskLetters(a.fm) + ")" : ""))).join("\n");
  }
};

/* ---------------- Se: tokens and the Security Reference Monitor ---------- */
const Se = {
  stats: {checks:0, denied:0},
  /* the machine SID is minted at setup and is the prefix of every local account */
  machineSid(){
    let s = MState.get("machineSid");
    if (!s) { s = "S-1-5-21-" + [rndInt(1e8,2e9), rndInt(1e8,2e9), rndInt(1e8,2e9)].join("-"); MState.set("machineSid", s); }
    return s;
  },
  domainSid: "S-1-5-21-1170256211-1956321347-2083497201",
  nameOf(sid){
    if (WELLKNOWN[sid]) return WELLKNOWN[sid];
    const acct = Sam.bySid(sid);
    if (acct) return acct.name;
    if (sid && sid.startsWith(this.domainSid)) {
      const d = Domain.bySid(sid);
      if (d) return Domain.name() + "\\" + d.name;
    }
    return "Account Unknown";
  },
  qualified(sid){
    if (WELLKNOWN[sid]) return WELLKNOWN[sid];
    const acct = Sam.bySid(sid);
    if (acct) return Sam.authority() + "\\" + acct.name;
    return this.nameOf(sid);
  },
  /* token: the thing every check is made against */
  makeToken(o){
    const t = {user:o.user, userName:o.userName, domain:o.domain, groups:new Set(o.groups),
      privs:new Set(o.privs || []), logon: SimClock.now(), id: uid(), system: !!o.system};
    t.groups.add(o.user);
    return t;
  },
  systemToken: null,
  isAdmin(tok){ return !!tok && (tok.system || tok.groups.has(SID.ADMINS)); },
  defaultOwner(tok){ return this.isAdmin(tok) && !tok.system ? SID.ADMINS : (tok ? tok.user : SID.ADMINS); },
  hasPriv(tok, p){ return !!tok && (tok.system || tok.privs.has(p)); },
  /* the one function every object open goes through */
  accessCheck(tok, sd, desired, obj){
    this.stats.checks++;
    obj = obj || {};
    let granted = 0, deniedBits = 0;
    if (!tok) tok = this.systemToken;
    if (!sd || !sd.dacl) granted = A.ALL;
    else {
      for (const ace of sd.dacl) {
        if (!tok.groups.has(ace.sid)) continue;
        if (ace.t === "D") { deniedBits |= (ace.m || A.ALL); continue; }
      }
      for (const ace of sd.dacl) {
        if (ace.t === "A" && tok.groups.has(ace.sid)) granted |= (ace.m & ~deniedBits);
      }
    }
    if (sd && sd.owner && tok.groups.has(sd.owner)) granted |= A.P;        // owner may always change the DACL
    if (this.hasPriv(tok, "SeTakeOwnershipPrivilege")) granted |= A.O;
    if (obj.backup && this.hasPriv(tok, "SeBackupPrivilege")) granted |= A.R | A.X;
    if (tok.system) granted = A.ALL;
    const ok = (granted & desired) === desired;
    if (!ok) this.stats.denied++;
    KTrace.emit("SRM", (ok ? "GRANT " : "DENY  ") + "[" + maskLetters(desired) + "] " +
      (obj.name || "object") + "  for " + (tok.userName || Se.nameOf(tok.user)));
    if (sd && sd.sacl && sd.sacl.length && Policy.audit("object", ok)) {
      const hit = sd.sacl.find(s => tok.groups.has(s.sid) && ((ok ? s.success : s.failure) & desired));
      if (hit) EventLog.write("Security", ok ? "Success Audit" : "Failure Audit", "Security", 560, "Object Access",
        tok.userName, "Object Open:\n\tObject Server:\tSecurity\n\tObject Type:\t" + (obj.type || "File") +
        "\n\tObject Name:\t" + (obj.name || "") + "\n\tPrimary User Name:\t" + tok.userName +
        "\n\tPrimary Domain:\t" + tok.domain + "\n\tAccesses:\t" + maskLetters(desired));
    }
    return {ok, granted};
  }
};

/* ---------------- Mm: physical memory and per-process address spaces ---- */
class NtException extends Error {
  constructor(code, address, verb, text){
    super(text || ("exception 0x" + hex8(code)));
    this.code = code; this.address = address; this.verb = verb;
  }
}
const STATUS = {ACCESS_VIOLATION:0xC0000005, ILLEGAL_INSTRUCTION:0xC000001D, PRIV_INSTRUCTION:0xC0000096,
  INT_DIVIDE_BY_ZERO:0xC0000094, STACK_OVERFLOW:0xC00000FD, ACCESS_DENIED:0xC0000022};
const Mm = {
  PAGE: 4096,
  init(){
    this.ramMB = HW.get().ramMB;
    this.frames = this.ramMB * 256;
    this.kernelFrames = Math.round(this.frames * 0.18);
    this.cacheFrames = Math.round(this.frames * 0.12);
    this.pagefileMB = MState.get("pagefileMB", this.ramMB + 11);
    this.peakCommit = 0;
    /* ntdll.dll and kernel32.dll: one set of physical frames, mapped read-only into every process */
    this.sharedFrames = 240;
  },
  space(pid){
    return {pid, pt:new Map(), commit:0, private:0};
  },
  /* map `pages` pages at `base` (a virtual address) with protection */
  map(space, base, pages, prot, tag){
    for (let i = 0; i < pages; i++)
      space.pt.set((base >>> 12) + i, {prot, tag, data:null});
    if (tag !== "shared") { space.commit += pages; space.private += pages; }
  },
  unmap(space){ space.pt.clear(); space.commit = 0; space.private = 0; },
  /* a user-mode memory reference, translated through the *caller's own* page table */
  translate(proc, va, write){
    va = va >>> 0;
    if (va >= 0x80000000) throw new NtException(STATUS.ACCESS_VIOLATION, va, write ? "written" : "read");
    const pte = proc.space.pt.get(va >>> 12);
    if (!pte) throw new NtException(STATUS.ACCESS_VIOLATION, va, write ? "written" : "read");
    if (write && pte.prot === "r") throw new NtException(STATUS.ACCESS_VIOLATION, va, "written");
    return pte;
  },
  write(proc, va, value){
    const pte = this.translate(proc, va, true);
    pte.data = pte.data || {};
    pte.data[va & 0xfff] = value;
    KTrace.emit("MM", "write " + proc.image + " @0x" + hex8(va));
  },
  read(proc, va){
    const pte = this.translate(proc, va, false);
    return pte.data ? pte.data[va & 0xfff] : 0;
  },
  totals(){
    let priv = 0;
    for (const p of Ps.list()) priv += p.space.private;
    const used = this.kernelFrames + this.sharedFrames + this.cacheFrames + priv;
    const totalK = this.frames * 4;
    const commitK = (priv + this.sharedFrames + Math.round(this.kernelFrames * 0.6)) * 4;
    this.peakCommit = Math.max(this.peakCommit, commitK);
    const availK = Math.max(1024, (this.frames - used) * 4);
    return {totalK, availK, cacheK: this.cacheFrames * 4, commitK, limitK: totalK + this.pagefileMB * 1024 - 4096,
      peakK: this.peakCommit, kernelK: this.kernelFrames * 4, pagedK: Math.round(this.kernelFrames * 2.6),
      nonpagedK: Math.round(this.kernelFrames * 1.4)};
  }
};

/* ---------------- Ps: processes ----------------------------------------- */
const PRIO = {Idle:4, Normal:8, High:13, Realtime:24};
const Ps = {
  procs: new Map(), nextPid: 2, current: null, foreground: null,
  list(){ return [...this.procs.values()].filter(p => p.alive); },
  get(pid){ return this.procs.get(pid); },
  /* create a process: a fresh address space, a token, a thread, a handle table */
  create(o){
    const pid = o.pid != null ? o.pid : (this.nextPid += 4 + (this.nextPid < 100 ? 4 : 0));
    const p = {
      pid, image: o.image, title: o.title || o.image, kind: o.kind || "win32", system: !!o.system,
      critical: !!o.critical, token: o.token || Session.token || Se.systemToken, parent: o.parent || null,
      prio: o.prio || "Normal", alive: true, hung: false, created: performance.now(),
      cpuTime: o.cpuTime || 0, kernelFrac: o.kernelFrac != null ? o.kernelFrac : 0.25,
      threads: (o.threads || [{demand: o.demand != null ? o.demand : 0.004}]).map((t, i) => ({
        id: pid * 10 + i, rel: t.rel || 0, demand: t.demand, granted: 0, name: t.name || "", cpu: -1})),
      handles: o.handles || rndInt(18, 60), timers: new Set(), rafs: new Set(), windows: new Set(),
      onKill: [], burst: 0, cpuPct: 0, arch: o.arch || "native", hidden: !!o.hidden, sub: o.sub || null,
      space: Mm.space(pid), wsK: 0, peakK: 0, faults: 0, appId: o.appId || null
    };
    /* the address space: image at 0x00400000, heap, stack, the shared system DLLs */
    const imgPages = Math.max(4, Math.round((o.imageK || 96) / 4));
    const heapPages = Math.max(8, Math.round((o.memK || 900) / 4) - imgPages - 64);
    Mm.map(p.space, 0x00400000, imgPages, "rx", "image");
    Mm.map(p.space, 0x00130000, heapPages, "rw", "heap");
    Mm.map(p.space, 0x00030000, 64, "rw", "stack");
    Mm.map(p.space, 0x77f00000, Mm.sharedFrames, "r", "shared");
    p.heapBase = 0x00130000; p.heapPages = heapPages;
    this.procs.set(pid, p);
    KTrace.emit("PS", "NtCreateProcess " + p.image + " pid " + pid);
    if (Policy.audit("process", true) && !p.system && Session.token)
      EventLog.write("Security", "Success Audit", "Security", 592, "Detailed Tracking", Session.userName(),
        "A new process has been created:\n\tNew Process ID:\t" + pid + "\n\tImage File Name:\t" + p.image);
    return p;
  },
  /* run `fn` in the context of process `p` — windows, timers and listeners it
     creates become that process's, and a fault inside it is that process's alone */
  run(p, fn){
    const prev = this.current;
    this.current = p;
    try { return fn(); }
    catch(e){ this.fault(p, e); }
    finally { this.current = prev; }
  },
  bind(p, f){
    return function(...args){
      if (!p.alive) return;
      if (p.hung && !Ps._pumpAnyway) return;
      const prev = Ps.current;
      Ps.current = p;
      try { return f.apply(this, args); }
      catch(e){ Ps.fault(p, e); }
      finally { Ps.current = prev; }
    };
  },
  /* an unhandled exception terminates exactly one process */
  fault(p, e){
    if (!p || !p.alive) { console.error(e); return; }
    if (p.system && p.critical) return Bugcheck.crash(0xC000021A, {procName:p.image});
    if (!(e instanceof NtException)) {
      console.warn("[" + p.image + "]", e);
      e = new NtException(STATUS.ACCESS_VIOLATION, 0x00400000 + rndInt(0x1000, 0x2fff), "read", String(e && e.message || e));
    }
    p.faults++;
    const addr = 0x00400000 + rndInt(0x1000, 0xfff0);
    KTrace.emit("PS", "EXCEPTION 0x" + hex8(e.code) + " in " + p.image + " — terminating pid " + p.pid);
    const user = p.token ? p.token.userName : "SYSTEM";
    EventLog.write("Application", "Information", "DrWatson", 4097, "None", "N/A",
      "The application, " + p.image.toLowerCase() + ", generated an application error The error occurred on " +
      ntDate(SimClock.now()) + " @ " + ntTime(SimClock.now(), true) + " The exception generated was " + hex8(e.code) +
      " at address " + hex8(addr) + " (<nosymbols>)");
    DrWatson.record(p, e, addr);
    this.terminate(p, e.code);
    DrWatson.notify(p, e, addr);
  },
  terminate(p, code){
    if (!p || !p.alive) return;
    if (p.critical) return Bugcheck.crash(0xC000021A, {procName:p.image});
    p.alive = false;
    p.exitCode = code || 0;
    for (const id of p.timers) { clearTimeout(id); clearInterval(id); }
    for (const id of p.rafs) cancelAnimationFrame(id);
    for (const w of [...p.windows]) { try { w.close(true); } catch(e){} }
    for (const f of p.onKill) { try { f(); } catch(e){} }
    Mm.unmap(p.space);
    this.procs.delete(p.pid);
    KTrace.emit("PS", "NtTerminateProcess pid " + p.pid + " (" + p.image + ") exit 0x" + hex8(code || 0));
    for (const c of this.list()) if (c.parent === p && c.kind === "wowapp") this.terminate(c, code);
    if (this.foreground === p) this.foreground = null;
  },
  byImage(img){ return this.list().find(p => p.image.toLowerCase() === img.toLowerCase()); },
  workingSetK(p){
    let n = 0; for (const [, pte] of p.space.pt) if (pte.tag !== "shared") n++;
    return Math.round((n + Mm.sharedFrames * 0.5) * 4 * (p.hidden ? 0.5 : 1));
  }
};

/* process-scoped execution: timers, frames and listeners belong to the process
   that was running when they were created, and die with it */
(function hookContext(){
  const _st = window.setTimeout.bind(window), _si = window.setInterval.bind(window);
  const _raf = window.requestAnimationFrame.bind(window);
  window.setTimeout = function(f, t, ...a){
    const p = Ps.current;
    if (!p || typeof f !== "function") return _st(f, t, ...a);
    const id = _st(Ps.bind(p, (...x) => { p.timers.delete(id); return f(...x); }), t, ...a);
    p.timers.add(id); return id;
  };
  window.setInterval = function(f, t, ...a){
    const p = Ps.current;
    if (!p || typeof f !== "function") return _si(f, t, ...a);
    const id = _si(Ps.bind(p, f), t, ...a);
    p.timers.add(id); return id;
  };
  window.requestAnimationFrame = function(f){
    const p = Ps.current;
    if (!p) return _raf(f);
    const id = _raf(Ps.bind(p, (...x) => { p.rafs.delete(id); return f(...x); }));
    p.rafs.add(id); return id;
  };
  const wrapped = new WeakMap();
  const _add = EventTarget.prototype.addEventListener, _rem = EventTarget.prototype.removeEventListener;
  EventTarget.prototype.addEventListener = function(type, fn, opts){
    const p = Ps.current;
    if (p && typeof fn === "function") {
      let m = wrapped.get(fn);
      if (!m) { m = new Map(); wrapped.set(fn, m); }
      let w = m.get(p.pid);
      if (!w) { w = Ps.bind(p, fn); m.set(p.pid, w); }
      return _add.call(this, type, w, opts);
    }
    return _add.call(this, type, fn, opts);
  };
  EventTarget.prototype.removeEventListener = function(type, fn, opts){
    const m = typeof fn === "function" && wrapped.get(fn);
    if (m) for (const w of m.values()) _rem.call(this, type, w, opts);
    return _rem.call(this, type, fn, opts);
  };
})();

/* ---------------- Ke: the preemptive priority scheduler ----------------- */
const Ke = {
  hist: [], perCpuHist: [], kernHist: [], memHist: [], interval: 1000, paused: false,
  cpus(){
    const hw = HW.get();
    return Math.min(hw.cpus, Edition.maxCpus());
  },
  quantumBoost(){ return [1, 2, 3][Reg.getVal("HKLM\\SYSTEM\\CurrentControlSet\\Control\\PriorityControl", "Win32PrioritySeparation", 2)] || 3; },
  basePrio(p, t){
    const b = PRIO[p.prio] || 8;
    if (p.prio === "Realtime") return clamp(b + (t.rel || 0), 16, 31);
    return clamp(b + (t.rel || 0), 1, 15);
  },
  tick(){
    const C = this.cpus();
    const threads = [];
    for (const p of Ps.list()) {
      p.burst *= 0.6;
      for (const t of p.threads) {
        let d = typeof t.demand === "function" ? t.demand(p) : t.demand;
        if (p.hung && t === p.threads[0]) d = 1;          // a hung message loop spins
        d = clamp((d || 0) + (t === p.threads[0] ? p.burst : 0), 0, 1);
        t.want = d; t.granted = 0;
        if (d > 0) threads.push({p, t, prio: this.basePrio(p, t),
          w: p === Ps.foreground ? this.quantumBoost() : 1});
      }
    }
    threads.sort((a, b) => b.prio - a.prio);
    let avail = C;
    let i = 0;
    while (i < threads.length && avail > 1e-6) {
      let j = i; while (j < threads.length && threads[j].prio === threads[i].prio) j++;
      const level = threads.slice(i, j);
      /* water-fill this priority level, weighting by quantum (the foreground boost) */
      let pool = level.slice(), left = avail;
      while (pool.length && left > 1e-6) {
        const W = pool.reduce((s, x) => s + x.w, 0);
        let used = 0; const next = [];
        for (const x of pool) {
          const share = left * x.w / W;
          const room = Math.min(x.t.want, 1) - x.t.granted;
          const g = Math.min(share, room);
          x.t.granted += g; used += g;
          if (x.t.granted < Math.min(x.t.want, 1) - 1e-6) next.push(x);
        }
        left -= used;
        if (used < 1e-6) break;
        pool = next;
      }
      avail = left;
      i = j;
    }
    /* the balance-set manager: starving threads get a priority-15 quantum now and then */
    for (const x of threads) if (x.t.granted < 0.01 && x.t.want > 0 && avail <= 1e-6) x.t.granted = Math.min(x.t.want, 0.015);
    /* account, and lay threads onto processors */
    const per = Array(C).fill(0), perK = Array(C).fill(0);
    let kern = 0;
    const order = threads.slice().sort((a, b) => b.t.granted - a.t.granted);
    for (const x of order) {
      let g = x.t.granted;
      while (g > 1e-6) {
        let k = 0; for (let c = 1; c < C; c++) if (per[c] < per[k]) k = c;
        const take = Math.min(g, 1 - per[k]); if (take <= 1e-6) break;
        per[k] += take; perK[k] += take * x.p.kernelFrac; g -= take; x.t.cpu = k;
      }
    }
    for (const p of Ps.list()) {
      const g = p.threads.reduce((s, t) => s + t.granted, 0);
      p.cpuPct = g / C * 100;
      p.cpuTime += g * this.interval / 1000;
      kern += g * p.kernelFrac;
      p.wsK = Ps.workingSetK(p); p.peakK = Math.max(p.peakK, p.wsK);
    }
    const idle = Ps.get(0);
    if (idle) { idle.cpuPct = Math.max(0, 100 - per.reduce((a,b)=>a+b,0) / C * 100); idle.cpuTime += (C - per.reduce((a,b)=>a+b,0)); }
    const total = per.reduce((a, b) => a + b, 0) / C * 100;
    this.hist.push(total); this.kernHist.push(kern / C * 100);
    this.perCpuHist.push(per.map(x => x * 100));
    this.memHist.push(Mm.totals().commitK);
    for (const a of [this.hist, this.kernHist, this.perCpuHist, this.memHist]) if (a.length > 120) a.shift();
    this.last = {total, per: per.map(x => x * 100), perK: perK.map(x => x * 100)};
    for (const f of this.subs) { try { f(); } catch(e){} }
  },
  subs: new Set(),
  start(){
    if (this._t) return;
    const run = () => { if (!this.paused) this.tick(); };
    const prev = Ps.current; Ps.current = null;
    this._t = setInterval(run, this.interval);
    Ps.current = prev;
  }
};

window.addEventListener("keydown", () => { if (Ps.foreground) Ps.foreground.burst += 0.03; }, true);

    ["SeRemoteShutdownPrivilege", "Force shutdown from a remote system"],

  ],
  defaultRights(server){
    const all = [SID.ADMINS, SID.POWER, SID.USERS, SID.BACKUP_OPS, SID.GUESTS, SID.EVERYONE];
    return {
      SeNetworkLogonRight: [SID.ADMINS, SID.POWER, SID.EVERYONE],

      SeShutdownPrivilege: server ? [SID.ADMINS, SID.ACCOUNT_OPS, SID.BACKUP_OPS, SID.PRINT_OPS, SID.SERVER_OPS]
        : [SID.ADMINS, SID.POWER, SID.USERS, SID.BACKUP_OPS, SID.EVERYONE],
      SeRemoteShutdownPrivilege: [SID.ADMINS, ...(server ? [SID.SERVER_OPS] : [SID.POWER])],
      SeSystemtimePrivilege: [SID.ADMINS, SID.POWER],
      SeTakeOwnershipPrivilege: [SID.ADMINS],
      SeBackupPrivilege: [SID.ADMINS, SID.BACKUP_OPS],
      SeRestorePrivilege: [SID.ADMINS, SID.BACKUP_OPS],
      SeSecurityPrivilege: [SID.ADMINS],
      SeLoadDriverPrivilege: [SID.ADMINS],

    };
  },
  rights(){ return MState.get("rights") || this.defaultRights(Edition.isServer()); },
  setRights(r){ MState.set("rights", r); },
  privsFor(groups){
    const r = this.rights(), out = [];
    for (const k in r) if (r[k].some(s => groups.has(s))) out.push(k);
    return out;
  },
  account(){ return Object.assign({minLen:0, maxAge:42, lockout:false, lockAfter:5, history:0},
    MState.get("acctPolicy", {})); },
  /* audit policy: category -> {s:bool, f:bool}; off by default, as shipped */
  auditPol(){ return MState.get("auditPol", {on:false}); },
  audit(cat, success){
    const p = this.auditPol();
    if (!p.on) return false;
    const c = p[cat]; return !!c && (success ? c.s : c.f);
  }
};

        {sid:SID.GUESTS, name:"Guests", desc:"Users granted guest access to the computer/domain", members:[ms+"-501"], builtin:true},
        {sid:SID.POWER, name:"Power Users", desc:"Members can share directories and printers", members:[], builtin:true},
        {sid:SID.REPLICATOR, name:"Replicator", desc:"Supports file replication in a domain", members:[], builtin:true},
        {sid:SID.USERS, name:"Users", desc:"Ordinary users", members:[ms+"-1000", ms+"-1001", ms+"-1002"], builtin:true},

      ]
    };
  },
  users(){ return this.db().users; },
  groups(){ return this.db().groups; },
  byName(name){
    name = String(name || "").toLowerCase();
    return this.users().find(u => u.name.toLowerCase() === name) || null;
  },
  bySid(sid){
    const u = this.users().find(x => x.sid === sid);
    if (u) return u;
    const g = this.groups().find(x => x.sid === sid);
    if (g) return g;
    if (!Edition.isDC()) {
      const lu = this.localDb().users.find(x => x.sid === sid) || this.localDb().groups.find(x => x.sid === sid);
      if (lu) return lu;
    }
    return null;
  },
  groupByName(name){ name = name.toLowerCase(); return this.groups().find(g => g.name.toLowerCase() === name) || null; },
  /* every local group the SID belongs to, directly or through a domain global group */
  localGroupsOf(sids){
    const out = new Set();
    const db = Edition.isDC() ? Domain.db() : this.localDb();
    for (const g of db.groups) if (g.members.some(m => sids.has(m))) out.add(g.sid);
    return out;
  },
  addUser(o){
    const db = this.db();
    if (this.byName(o.name)) return "exists";
    const rid = db.nextRid++;
    const u = Object.assign({sid: this.prefix() + "-" + rid, rid, full:"", desc:"", pw:"", disabled:false,
      mustChange:false, cannotChange:false, neverExpires:false, locked:false, bad:0, profile:"", script:"", home:"",
      created: SimClock.now()}, o);
    db.users.push(u);
    const users = db.groups.find(g => g.sid === SID.USERS);
    if (users && !Edition.isDC()) users.members.push(u.sid);
    if (Edition.isDC()) { const du = db.globals.find(g => g.rid === 513); if (du) du.members.push(u.sid); }
    this.save();
    EventLog.write("Security", "Success Audit", "Security", 624, "Account Management", Session.userName(),
      "User Account Created:\n\tNew Account Name:\t" + u.name + "\n\tNew Domain:\t" + this.authority() +
      "\n\tNew Account ID:\t" + u.sid + "\n\tCaller User Name:\t" + Session.userName());
    return u;
  },
  deleteUser(u){
    const db = this.db();
    db.users = db.users.filter(x => x !== u);
    for (const g of db.groups) g.members = g.members.filter(m => m !== u.sid);
    if (db.globals) for (const g of db.globals) g.members = g.members.filter(m => m !== u.sid);
    this.save();
    EventLog.write("Security", "Success Audit", "Security", 630, "Account Management", Session.userName(),
      "User Account Deleted:\n\tTarget Account Name:\t" + u.name + "\n\tTarget Account ID:\t" + u.sid);
  },
  addGroup(name, desc){
    const db = this.db();
    const g = {sid: this.prefix() + "-" + (db.nextRid++), name, desc: desc || "", members: [], builtin:false};
    db.groups.push(g); this.save(); return g;
  },
  setPassword(u, pw){
    u.pw = pw; u.mustChange = false; this.save();
    EventLog.write("Security", "Success Audit", "Security", 628, "Account Management", Session.userName(),
      "User Account password set:\n\tTarget Account Name:\t" + u.name);
  }
};

/* ---------------- Session: the logged-on user (LSA + Winlogon state) --- */
const Session = {
  token: null, acct: null, domain: null, profile: null, locked: false, logonTime: 0,
  userName(){ return this.acct ? this.acct.name : "SYSTEM"; },
  qualified(){ return this.acct ? this.domain + "\\" + this.acct.name : "NT AUTHORITY\\SYSTEM"; },
  isAdmin(){ return Se.isAdmin(this.token); },
  /* LsaLogonUser: authenticate against the right account database, build the token */
  authenticate(name, pw, domain){
    domain = (domain || Net.computerName()).toUpperCase();
    let acct, auth, dbSave;
    const local = domain === Net.computerName().toUpperCase() && !Edition.isDC();
    if (local) { acct = Sam.byName(name); auth = Net.computerName(); dbSave = () => Sam.save(); }
    else if (domain === Domain.name() && (Edition.isDC() || Net.memberOf() === Domain.name())) {
      acct = Domain.byName(name); auth = Domain.name(); dbSave = () => Domain.save();
    } else if (domain === "ACQUISITIONS" && Net.memberOf() === Domain.name()) {
      return {err:"The system could not log you on. The trusted domain controller for ACQUISITIONS could not be contacted (it is a 1997 ISDN line, and it is down)."};
    } else return {err:"The system could not log you on. The domain " + domain + " is not available."};
    const fail = (msg, sub) => {
      if (Policy.audit("logon", false))
        EventLog.write("Security", "Failure Audit", "Security", 529, "Logon/Logoff", "SYSTEM",
          "Logon Failure:\n\tReason:\t\t" + (sub || "Unknown user name or bad password") + "\n\tUser Name:\t" + name +
          "\n\tDomain:\t\t" + domain + "\n\tLogon Type:\t2\n\tLogon Process:\tUser32\n\tAuthentication Package:\tMICROSOFT_AUTHENTICATION_PACKAGE_V1_0");
      return {err: msg};
    };
    if (!acct || acct.pw !== pw) {
      if (acct) {
        acct.bad = (acct.bad || 0) + 1;
        const pol = Policy.account();
        if (pol.lockout && acct.bad >= pol.lockAfter) acct.locked = true;
        dbSave();
      }
      return fail("The system could not log you on. Make sure your User name and domain are correct, then type your password again. Letters in passwords must be typed using the correct case. Make sure that Caps Lock is not accidentally on.");
    }
    if (acct.disabled) return fail("Your account has been disabled. Please see your system administrator.", "Account currently disabled");
    if (acct.locked) return fail("Unable to log you on because your account has been locked out, please contact your administrator.", "Account locked out");
    /* build the token: user, global groups, local groups, well-known groups, privileges */
    const sids = new Set([acct.sid, SID.EVERYONE, SID.INTERACTIVE]);
    if (HW.get().sp !== "RTM") sids.add(SID.AUTH_USERS);                 // new in SP3
    if (!local) for (const g of Domain.globalsOf(acct.sid)) sids.add(g);
    for (const g of Sam.localGroupsOf(sids)) sids.add(g);
    if (!local && !Edition.isDC()) {               // domain users on a member: Domain Admins ⊂ local Administrators
      if (sids.has(Se.domainSid + "-512")) sids.add(SID.ADMINS);
      if (sids.has(Se.domainSid + "-513")) sids.add(SID.USERS);
      if (sids.has(Se.domainSid + "-514")) sids.add(SID.GUESTS);
    }
    const privs = Policy.privsFor(sids);
    if (!privs.includes("SeInteractiveLogonRight"))
      return fail("The local policy of this system does not permit you to logon interactively.", "The user has not been granted the requested logon type at this machine");
    acct.bad = 0; acct.lastLogon = SimClock.now(); dbSave();
    const tok = Se.makeToken({user: acct.sid, userName: acct.name, domain: auth, groups: [...sids], privs});
    return {tok, acct, domain: auth, local};
  }
};


/* ---------------- Cm: the configuration manager (the registry) ---------- */
/* Hives: HKLM\SOFTWARE and HKLM\SYSTEM persist with the machine; HKLM\HARDWARE
   is rebuilt by NTDETECT at every boot; HKU\<SID> is the user's NTUSER.DAT and
   travels with the profile. Keys carry security descriptors like files do. */
const Reg = {
  ROOTS: ["HKEY_LOCAL_MACHINE", "HKEY_CURRENT_USER", "HKEY_USERS", "HKEY_CLASSES_ROOT", "HKEY_CURRENT_CONFIG"],
  ABBR: {HKLM:"HKEY_LOCAL_MACHINE", HKCU:"HKEY_CURRENT_USER", HKU:"HKEY_USERS", HKCR:"HKEY_CLASSES_ROOT", HKCC:"HKEY_CURRENT_CONFIG"},
  watchers: [],
  K(name, vals, kids, sd){
    const k = {n:name, v:{}, k:{}};
    if (sd) k.sd = sd;
    for (const vn in vals || {}) k.v[vn.toLowerCase()] = [vn].concat(vals[vn]);
    for (const c of kids || []) k.k[c.n.toLowerCase()] = c;
    return k;
  },
  stdSd(){ return SD.make(SID.ADMINS, [{t:"A", sid:SID.ADMINS, m:A.ALL}, {t:"A", sid:SID.SYSTEM, m:A.ALL},
    {t:"A", sid:SID.CREATOR_OWNER, m:A.ALL}, {t:"A", sid:SID.EVERYONE, m:A.R}]); },
  machine(){
    if (!this._m) {
      this._m = MState.get("reg");
      if (!this._m) { this._m = this.buildMachine(); this.persist(); }
    }
    return this._m;
  },
  persist(){ MState.set("reg", this._m); },
  userHive(sid){
    const b = State.forSid(sid);
    if (!b.ntuser) b.ntuser = this.buildUser(sid);
    return b.ntuser;
  },
  hardware(){ if (!this._hw) { this._hw = {n:"HARDWARE", v:{}, k:{}}; this._hw = this.buildHardware(); } return this._hw; },
  /* resolve "HKLM\SYSTEM\CurrentControlSet\..." to a key object */
  split(path){
    let parts = path.split("\\").filter(Boolean);
    let root = this.ABBR[parts[0].toUpperCase()] || parts[0].toUpperCase();
    parts = parts.slice(1);
    if (root === "HKEY_CURRENT_USER") { root = "HKEY_USERS"; parts.unshift(Session.token ? Session.token.user : ".DEFAULT"); }
    if (root === "HKEY_CLASSES_ROOT") { root = "HKEY_LOCAL_MACHINE"; parts = ["SOFTWARE", "Classes"].concat(parts); }
    if (root === "HKEY_CURRENT_CONFIG") { root = "HKEY_LOCAL_MACHINE"; parts = ["SYSTEM", "CurrentControlSet", "Hardware Profiles", "Current"].concat(parts); }
    if (root === "HKEY_LOCAL_MACHINE" && parts[0] && parts[0].toUpperCase() === "SYSTEM" && parts[1] && parts[1].toLowerCase() === "currentcontrolset")
      parts[1] = "ControlSet00" + this.currentSet();
    if (parts[0] && parts[0].toUpperCase() === "SYSTEM" && parts[1] && /^currentcontrolset$/i.test(parts[1])) parts[1] = "ControlSet001";
    if (root === "HKEY_LOCAL_MACHINE" && parts.length >= 4 && parts[0].toUpperCase() === "SYSTEM" && /^hardware profiles$/i.test(parts[2]) && /^current$/i.test(parts[3]))
      parts[3] = "0001";
    return {root, parts};
  },
  currentSet(){
    const sel = this.machine().k.system && this.machine().k.system.k.select;
    return sel && sel.v.current ? sel.v.current[2] : 1;
  },
  rootKey(root){
    if (root === "HKEY_LOCAL_MACHINE") {
      const m = this.machine();
      return {n:"HKEY_LOCAL_MACHINE", v:{}, k:{hardware:this.hardware(), sam:m.k.sam, security:m.k.security, software:m.k.software, system:m.k.system}, sd:this.stdSd()};
    }
    if (root === "HKEY_USERS") {
      const kids = {".default": this.userHive(".DEFAULT")};
      if (Session.token) kids[Session.token.user.toLowerCase()] = this.userHive(Session.token.user);
      return {n:"HKEY_USERS", v:{}, k:kids, sd:this.stdSd()};
    }
    return null;
  },
  /* walk to a key, collecting the nearest security descriptor on the way */
  walk(path){
    const {root, parts} = this.split(path);
    let k = this.rootKey(root);
    let sd = k && k.sd;
    for (const p of parts) {
      if (!k) return null;
      k = k.k[p.toLowerCase()];
      if (k && k.sd) sd = k.sd;
    }
    return k ? {key:k, sd} : null;
  },
  open(path, tok, want){
    const w = this.walk(path);
    if (!w) return null;
    if (tok) {
      const r = Se.accessCheck(tok, w.sd, want || A.R, {name: path, type:"Key"});
      if (!r.ok) return {denied:true};
    }
    KTrace.emit("CM", "NtOpenKey " + path);
    return w.key;
  },
  getVal(path, name, def){
    const w = this.walk(path);
    if (!w) return def;
    const v = w.key.v[String(name).toLowerCase()];
    return v ? v[2] : def;
  },
  getRaw(path, name){
    const w = this.walk(path);
    return w ? w.key.v[String(name).toLowerCase()] || null : null;
  },
  /* the checked write path used by both editors; returns true or an error string */
  setVal(path, name, type, data, tok){
    const w = this.walk(path);
    if (!w) return "The system cannot find the file specified.";
    if (tok && !Se.accessCheck(tok, w.sd, A.W, {name: path + "\\" + name, type:"Key"}).ok) return "Access is denied.";
    w.key.v[String(name).toLowerCase()] = [name, type, data];
    KTrace.emit("CM", "NtSetValueKey " + path + " : " + name);
    this.commit(path, name);

/* ---------------- Io: the checked paths — nothing bypasses these --------- */
const Io = {
  lastErr: null,
  /* returns true, or false with Io.lastErr set */
  access(node, want, opts){
    opts = opts || {};

    if (!node) { this.lastErr = "The system cannot find the file specified."; return false; }
    const vol = VFS.volOf(node);
    if (vol.notReady) { this.lastErr = "The device is not ready."; return false; }
    if (vol.fs === "CDFS" && (want & (A.W | A.D | A.P | A.O))) { this.lastErr = "The media is write protected."; return false; }
    if (node.readonly && node.type === "f" && (want & (A.W | A.D)) && !opts.ignoreRO) { this.lastErr = "Access is denied."; return false; }
    if (vol.remote && !Remote.canReach(node)) { this.lastErr = Remote.lastErr; return false; }
    if (vol.fs !== "NTFS") { KTrace.emit("IO", "IRP_MJ_CREATE " + VFS.path(node) + " (FAT: no security)"); return true; }
    KTrace.emit("IO", "IRP_MJ_CREATE " + VFS.path(node) + " → NTFS → SRM");
    const r = Se.accessCheck(Session.token, VFS.sdOf(node), want,
      {name: VFS.path(node), type: node.type === "d" ? "Directory" : "File", backup: opts.backup});

    this.lastErr = err; return false;
  },
  read(node){
    if (!this.access(node, A.R)) return null;

  },
  write(node, content){
    if (!this.access(node, A.W)) return false;

/* ---------------- Volume operations: convert, compact, chkdsk ------------ */
const Volume = {
  /* FAT → NTFS, one way: every file gets the default descriptor */
  convertNow(letter){
    const v = VFS.vols[letter];
    if (!v || v.fs !== "FAT") return false;
    v.fs = "NTFS";
    const root = VFS.drives[letter];
    root.sd = SD.make(SID.ADMINS, [{t:"A", sid:SID.EVERYONE, m:A.ALL, fm:A.ALL}]);
    const walk = n => { for (const k of n.kids || []) { k.sd = SD.make(SID.ADMINS, [{t:"A", sid:SID.EVERYONE, m:A.ALL, fm: k.type === "d" ? A.ALL : undefined}]); if (k.kids) walk(k); } };
    walk(root);
    MState.set("vols", Object.assign(MState.get("vols", {}), {[letter[0]]: "NTFS"}));
    VFS.persist();
    return true;
  },
  usedK(node){
    let t = 0;
    const walk = n => { for (const k of n.kids || []) { if (k.type === "f") t += Math.ceil((k.size || 0) * (k.compressed ? 0.55 : 1) / 1024); else walk(k); } };
    walk(node); return t;
  },
  info(letter){
    const v = VFS.vols[letter]; if (!v) return null;
    const root = VFS.drives[letter];
    const totalK = v.sizeMB * 1024;
    const used = letter === "C:" ? 412 * 1024 + this.usedK(root) : (letter === "D:" ? 88 * 1024 + this.usedK(root) : totalK);
    return {fs: v.fs, label: v.label, totalK, usedK: Math.min(totalK, used), freeK: Math.max(0, totalK - used), serial: v.serial};
  }
};

  _cache: new Map(),
  root(host, share){

      [0xfc8a8000, "Msfs.SYS"], [0xfc6e8000, "Npfs.SYS"], [0xfe9d0000, "NDIS.SYS"], [0xa0000000, "win32k.sys"],
      [0xa0f30000, Video.dll()], [0xfe960000, "El59x.SYS"], [0xfe948000, "TDI.SYS"], [0xfe8f0000, "tcpip.sys"],
      [0xfe8d0000, "netbt.sys"], [0xfe898000, "afd.sys"], [0xfe8b8000, "nwlnkipx.sys"], [0xfe6e0000, "Fastfat.SYS"]
    ];
    return base;
  },
  crash(code, info){
    if (this.dead) return;
    this.dead = true;
    info = info || {};
    Ke.paused = true;
    ScreenSaver.stop();
    KTrace.emit("KE", "KeBugCheckEx(0x" + hex8(code) + ")");
    const hw = HW.get();
    const params = info.params || (code === 0x1E ? [0xC0000005, info.addr || 0xa0f41c2a, 0, 0]
      : code === 0x0A ? [0, 0x1c, 0, 0x8013c2a5] : code === 0x50 ? [0xe1a3f000, 0, 0x8013a2f1, 0] : [0, 0, 0, 0]);
    const p = params.map(x => "0x" + hex8(x).toUpperCase()).join(",");
    const name = BUGCHECKS[code] || "UNKNOWN_BUGCHECK";
    let text = "";
    if (code === 0xC000021A) {
      text = "*** STOP: 0xC000021A (0xE10FA390,0xC0000005,0x00000000,0x00000000)\n" +
        "Unknown Hard Error\n\nThe " + (info.procName || "csrss.exe") + " system process terminated unexpectedly.\n";
    } else {
      text = "*** STOP: 0x" + hex8(code).toUpperCase() + " (" + p + ")\n" + name;
      if (info.driver) text += "*** Address " + hex8(info.addr) + " has base at " + hex8(info.base) + " - " + info.driver;
      text += "\n";
    }
    text += "\nCPUID:" + (hw.arch === "alpha" ? "Alpha 21164 (EV5)" : "GenuineIntel 5.2.c") + " irql:1f SYSVER 0xf0000565\n\n";
    text += "Dll Base DateStmp - Name               Dll Base DateStmp - Name\n";
    const mods = this.modules();
    for (let i = 0; i < mods.length; i += 2) {
      const cell = m => m ? hex8(m[0]) + " " + hex8(0x31ec6c00 + (m[0] >>> 12 & 0xffff)) + " - " + m[1].padEnd(18) : "";
      text += cell(mods[i]) + " " + cell(mods[i + 1]) + "\n";
    }
    text += "\nAddress  dword dump   Build [1381]                            - Name\n";
    const st = [[0xfec2fcd0, info.addr || 0x8013c2a5, info.driver || "ntoskrnl.exe"], [0xfec2fd04, 0xa0012e44, "win32k.sys"],
      [0xfec2fd38, 0x8013c2a5, "ntoskrnl.exe"], [0xfec2fd70, 0xa000c1f8, "win32k.sys"], [0xfec2fdb0, 0x80140b41, "ntoskrnl.exe"]];
    for (const [a, v, n] of st) text += hex8(a) + " " + hex8(v) + " " + hex8(v) + " 00000000 00000000 " + hex8(a + 0x3c) + " 8013c2a5 - " + n + "\n";
    text += "\nRestart and set the recovery options in the system control panel\nor the /CRASHDEBUG system start option. If this message reappears,\ncontact your system administrator or technical support group.\n";
    const el = TextScreen.make("bsodscreen", "#0000a8", "#fff", 80, 50);
    el.style.zIndex = "99990";
    el.textContent = text;
    $("#logondesk").style.display = "none";
    MState.set("lastBugcheck", {code, params, t: SimClock.now(), driver: info.driver || null});
    Store.flush();
    Guide.note(info.driver ? "bsod-driver" : "bsod");
    const dump = Reg.getVal("HKLM\\SYSTEM\\CurrentControlSet\\Control\\CrashControl", "CrashDumpEnabled", 1);
    const auto = Reg.getVal("HKLM\\SYSTEM\\CurrentControlSet\\Control\\CrashControl", "AutoReboot", 0);
    (async () => {
      await sleep(1500);
      if (dump) {
        el.textContent += "\nBeginning dump of physical memory\nDumping physical memory to disk:  ";
        const base = el.textContent;
        for (let i = 0; i <= 100; i += 5) { el.textContent = base + String(i).padStart(3); await sleep(110); }
        el.textContent = base + "100\nPhysical memory dump complete. Contact your system administrator or\ntechnical support group.\n";
      }
      if (auto) { await sleep(2500); this.reboot(); return; }
      el.appendChild(h("div", {class:"bsodreset"}, "[ The machine has stopped. Nothing in it is running — not the mouse pointer, not the clock. Press the reset button: click here or press any key. ]"));
      await sleep(400);
      await Boot.waitKey(0);
      this.reboot();
    })();
  },
  reboot(){
    this.dead = false;
    TextScreen.hide("bsodscreen");
    for (const w of WM.wins.slice()) { try { w.close(true); } catch(e){} }
    Session.token = null; Session.acct = null; State.sid = ".DEFAULT";
    $("#taskbar").style.display = "none";
    Desktop.refreshIcons && Desktop._inited && Desktop.refreshIcons();
    Ke.paused = false;
    MState.set("pendingCrashEvent", true);
    Boot.start();
  },
  logPrevious(){
    if (!MState.get("pendingCrashEvent")) return;
    MState.del("pendingCrashEvent");
    const b = MState.get("lastBugcheck");
    EventLog.write("System", "Error", "EventLog", 6008, "None", "N/A", "The previous system shutdown at " + ntTime(b ? b.t : SimClock.now()) + " on " + ntDate(b ? b.t : SimClock.now()) + " was unexpected.");
    if (b) EventLog.write("System", "Information", "Save Dump", 1001, "None", "N/A",
      "The computer has rebooted from a bugcheck. The bugcheck was: 0x" + hex8(b.code) + " (" + b.params.map(x => "0x" + hex8(x)).join(", ") + "). A full dump was saved in: C:\\WINNT\\MEMORY.DMP.");
    const n = VFS.get("C:\\WINNT\\MEMORY.DMP");
    if (n) { n.size = HW.get().ramMB * 1048576; n.hidden = false; n.date = SimClock.now(); VFS.changed(n.parent); }
  }
};

const DrWatson = {

    const log = VFS.get("C:\\WINNT\\drwtsn32.log") || VFS.create(VFS.get("C:\\WINNT"), "drwtsn32.log", "f", {content:""});
    const prev = Session.token; Session.token = Se.systemToken;
    log.content = (log.content || "") + "\r\nMicrosoft (R) Windows NT (TM) Version 4.00 DrWtsn32\r\nCopyright (C) 1985-1996 Microsoft Corp. All rights reserved.\r\n\r\n" +
      "Application exception occurred:\r\n        App: " + p.image + " (pid=" + p.pid + ")\r\n        When: " + ntDate(SimClock.now()) + " @ " + ntTime(SimClock.now(), true) + "\r\n" +
      "        Exception number: " + hex8(e.code) + " (" + (e.code === STATUS.ACCESS_VIOLATION ? "access violation" : "exception") + ")\r\n\r\n" +
      "*----> System Information <----*\r\n        Computer Name: " + Net.computerName() + "\r\n        User Name: " + (p.token ? p.token.userName : "SYSTEM") +
