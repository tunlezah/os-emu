  /* the token is built; now the profile, the shell, and the user's own desktop */
  async completeLogon(r){
    this.state = "busy";
    this.showDesk();
    Session.token = r.tok; Session.acct = r.acct; Session.domain = r.domain; Session.logonTime = SimClock.now();
    State.sid = r.tok.user;
    /* two accounts with one name (local Administrator, MUSEUM\Administrator) get two profiles */
    let dir = r.acct.name;
    const owner = Profiles.ownerOf(dir);
    if (owner && owner !== r.tok.user) dir = r.acct.name + "." + r.domain;
    Session.profileDir = dir;
    const isNew = !Profiles.exists(Session.profileDir);
    const d = this.dialog({title:"Logon", w:380, banner:true});
    const msg = h("div", {style:{padding:"18px", textAlign:"center"}}, isNew ? "Please wait while the system creates your profile." : "Loading your personal settings...");
    d.body.appendChild(msg); d.place();
    await sleep(isNew ? 1500 : 700);
    if (isNew) Profiles.create(Session.profileDir, r.tok.user);
    Roaming.load();
    if (Policy.audit("logon", true))
      EventLog.write("Security", "Success Audit", "Security", 528, "Logon/Logoff", r.acct.name,
        "Successful Logon:\n\tUser Name:\t" + r.acct.name + "\n\tDomain:\t\t" + r.domain + "\n\tLogon ID:\t\t(0x0," + r.tok.id + ")\n\tLogon Type:\t2\n\tLogon Process:\tUser32\n\tAuthentication Package:\tMICROSOFT_AUTHENTICATION_PACKAGE_V1_0\n\tWorkstation Name:\t" + Net.computerName());
    Reg.saveLastKnownGood();                  // a successful logon is what "good" means
    d.close();
    this.hideDesk();
    this.state = "desktop";
    this.startShell();
    Snd.event("Start Windows");
    if (r.acct.name !== "Administrator" || isNew) setTimeout(() => Welcome.maybe(isNew), 900);
    setTimeout(() => this.runLogonScript(r), 400);
    setTimeout(() => this.runStartup(), 1200);
  },
  /* explorer.exe: the shell, started as the user, from the registry's Shell value */
  startShell(){
    for (const fn of [Shell, Taskbar, RecycleBin, Snd]) if (fn.reloadUser) fn.reloadUser();
    Remote.restoreMappings();
    Display.apply();
    const shellName = Reg.getVal("HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon", "Shell", "Explorer.exe").toLowerCase();
    if (/progman/.test(shellName)) {
      $("#taskbar").style.display = "none";
      Desktop.refreshIcons();
      Guide.note("progman");
      return Exec.start("progman", {asShell:true});
    }
    const p = Ps.create({image:"explorer.exe", title:"Explorer", memK:2380, imageK:236, appId:"explorer", demand:0.003});
    p.persistent = true;
    p.onKill.push(() => { $("#taskbar").style.display = "none"; StartMenu.close(); Desktop.refreshIcons(); });
    Ps.create({image:"nddeagnt.exe", title:"nddeagnt", memK:600, imageK:12, demand:0}).persistent = true;
    Ps.run(p, () => {
      $("#taskbar").style.display = "";
      Taskbar.init();
      Desktop.init();
      Desktop.ensureBriefcase();
      Desktop.refreshIcons();
      $("#startbtn").style.display = "";
    });
  },
  runStartup(){
    for (const dir of [Profiles.dir() + "\\Start Menu\\Programs\\Startup", "C:\\WINNT\\Profiles\\All Users\\Start Menu\\Programs\\Startup"]) {
      const n = VFS.get(dir);
      if (n && Io.access(n, A.R)) for (const k of n.kids || []) if (k.type === "f") Shell.openNode(k);
    }
  },
  runLogonScript(r){
    if (!r.acct.script) return;
    const script = Domain.db().netlogon[r.acct.script];
    if (!script || r.local) return;
    Exec.start("cmd", {script:"\\\\MUSEUM-PDC\\NETLOGON\\" + r.acct.script, title:"\\\\MUSEUM-PDC\\NETLOGON\\" + r.acct.script, autoClose:true});
  },
  /* Ctrl+Alt+Del on a logged-on desktop: not a task list — a security dialog */
  securityDialog(){

        Dlg.btn("Shut Down...", () => { d.close(); close(); this.shutdownDialog(false); }),
        Dlg.btn("Change Password...", () => { d.close(); this._sec = null; desk.classList.remove("dimmed"); this.changePasswordDialog(null, false); }),

  lock(){

  unlockDialog(){
    this.showDesk();
    const d = this.dialog({title:"Unlock Workstation", w:440, banner:true});
    const user = h("input", {class:"field", style:{flex:"1"}, value: Session.userName()});
    const pw = h("input", {class:"field", type:"password", style:{flex:"1"}});
    const row = (l, f) => h("div", {style:{display:"flex", gap:"8px", alignItems:"center", margin:"7px 0"}}, h("span", {style:{width:"76px"}}, l), f);

      }
      /* someone else: only an administrator, and unlocking forcibly logs the owner off */
      const r = Session.authenticate(name, pw.value, Session.domain === Net.computerName() ? Net.computerName() : Session.domain);
      if (r.err || !r.tok.groups.has(SID.ADMINS)) {
        Snd.event("Critical Stop");
        return this.message("Unlock Workstation", "This workstation is locked.\n\nOnly " + Session.qualified() + " or an administrator can unlock this computer.", () => this.lock());
      }
      d.close();

      c.body.append(h("div", {style:{padding:"16px", lineHeight:"1.5"}}, "This workstation is locked by " + Session.qualified() + ".\n\nIf you continue, " + Session.userName() + " will be logged off and any unsaved data will be lost. Do you want to continue?"),
        h("div", {class:"dlgbtns center"}, Dlg.btn("Yes", () => { c.close(); this.logoff(true); }, {default:true}), Dlg.btn("No", () => { c.close(); this.lock(); })));
      c.place();
    };
    d.body.append(h("div", {style:{padding:"14px 18px 4px"}}, h("div", {style:{marginBottom:"8px"}}, "This workstation is in use and has been locked. Only " + Session.qualified() + " or an administrator can unlock this computer."),
        row("User name:", user), row("Password:", pw)),
      h("div", {class:"dlgbtns"}, Dlg.btn("OK", go, {default:true}), Dlg.btn("Cancel", () => { d.close(); this.lock(); })));

  },
  confirmLogoff(){
    Dlg.msg({title:"Logoff Windows NT", icon:"question", text:"This will end your Windows NT session.\n\nAre you sure you want to log off?", buttons:["OK","Cancel"]})
      .then(b => { if (b === "OK") this.logoff(); });
  },
  shutdownDialog(beforeLogon){
    if (beforeLogon) {
      this.showDesk();
      const d = this.dialog({title:"Shutdown Computer", w:380});
      const r1 = h("input", {type:"radio", class:"w95", name:"sd0"}), r2 = h("input", {type:"radio", class:"w95", name:"sd0"});
      r1.checked = true;
      d.body.append(h("div", {style:{padding:"14px 18px"}}, h("div", {style:{marginBottom:"8px"}}, "Are you sure you want to:"),
          h("label", {class:"w95l", style:{display:"flex", margin:"5px 0"}}, r1, "Shut down the computer?"),
          h("label", {class:"w95l", style:{display:"flex", margin:"5px 0"}}, r2, "Shut down and Restart?")),
        h("div", {class:"dlgbtns"}, Dlg.btn("Yes", () => { d.close(); Shutdown.go(r2.checked); }, {default:true}), Dlg.btn("No", () => { d.close(); this.logonDialog(); })));
      d.place();

    if (!Se.hasPriv(Session.token, "SeShutdownPrivilege"))
      return Dlg.msg({title:"Shut Down Windows", icon:"error", text:"You do not have the proper privilege level to Shutdown the system.\n\n(Close all programs and log on as a different user is still available.)"}).then(() => this.confirmLogoff());
    const win = Dlg.show({title:"Shut Down Windows", icon:"shutdown", w:380, h:10});
    const opts = [["Shut down the computer?", "shut"], ["Restart the computer?", "restart"], ["Close all programs and log on as a different user?", "logoff"]];
    const radios = opts.map(([l, v], i) => { const r = h("input", {type:"radio", class:"w95", name:"sdx"}); r.value = v; if (!i) r.checked = true; return r; });
    const row = h("div", {style:{display:"flex", gap:"14px", padding:"14px 16px 6px"}});
    const ic = h("div", {style:{width:"32px", flex:"0 0 32px"}}); ic.appendChild(iconEl("shutdown", 32));
    row.append(ic, h("div", {}, h("div", {style:{marginBottom:"8px"}}, "Are you sure you want to:"),
      ...opts.map((o, i) => h("label", {class:"w95l", style:{display:"flex", margin:"5px 0"}}, radios[i], o[0]))));
    win.body.append(row, h("div", {class:"dlgbtns"},
      Dlg.btn("Yes", () => {
        const v = radios.find(r => r.checked).value;

    sizeTo(win);

  /* end every process the user owns, save the profile, back to Ctrl+Alt+Delete */
  async logoff(forced, then){
    this.state = "busy";
    ScreenSaver.stop();
    Snd.event("Exit Windows");
    for (const w of WM.wins.slice()) { try { w.close(true); } catch(e){} }
    for (const p of Ps.list()) if (!p.system && p.pid !== 0) Ps.terminate(p, 0);
    Popups.closeAll(); StartMenu.close();
    $("#taskbar").style.display = "none";
    if (Policy.audit("logon", true)) EventLog.write("Security", "Success Audit", "Security", 538, "Logon/Logoff", Session.userName(),

/* the SAS hook, registered before anything else can listen */
window.addEventListener("keydown", e => {
  const k = e.key;
  const sas = e.ctrlKey && e.altKey && (k === "Delete" || k === "End" || k === "Backspace" || k === "Del");
  if (!sas) return;
  e.preventDefault(); e.stopImmediatePropagation();
  KTrace.emit("WIN32K", "Secure Attention Sequence → winlogon.exe (no application was told)");
  Winlogon.onSAS();
}, true);

/* roaming profiles: a domain user's profile lives on \\MUSEUM-PDC\Profiles and follows them */
const Roaming = {
  applies(){ return Session.acct && Session.acct.profile && Session.domain === Domain.name(); },
  load(){
    if (!this.applies()) return;
    const saved = Domain.db().profiles[Session.acct.name];
    const local = Profiles.node(Session.profileDir);
    if (saved && local) {
      for (const sub of ["Desktop", "Personal", "Favorites"]) {
        const dst = local.kids.find(k => k.name === sub);
        if (!dst || !saved[sub]) continue;
        dst.kids = []; for (const o of saved[sub]) VFS.addKid(dst, VFS.restoreNode(o));
      }
      VFS.changed(local);
      State.set("roamedFrom", "\\\\MUSEUM-PDC\\Profiles\\" + Session.acct.name);
    } else if (local && !saved) {
      const dt = local.kids.find(k => k.name === "Desktop");
      if (dt && !dt.kids.some(k => k.name === "Roaming profile.txt"))
        VFS.addKid(dt, VFS.node("Roaming profile.txt", "f", {content:"This desktop belongs to the MUSEUM domain account " + Session.acct.name + ".\r\n\r\nIts profile path is " + Session.acct.profile + ".\r\nWhen you log off, Desktop, Personal and Favorites are copied back to the server;\r\nlog on at any NT machine in the domain and they come with you.\r\n\r\nTry it: put something on this desktop, log off, join another machine... or\r\njust log back on here and watch it come back from the server copy.\r\n", sd: VFS.sdOf(dt) ? Object.assign(SD.clone(VFS.sdOf(dt)), {dacl: VFS.sdOf(dt).dacl.map(a => ({t:a.t, sid:a.sid, m:a.fm != null ? a.fm : a.m}))}) : undefined}));
    }
  },
  save(){
    if (!this.applies()) return;
    const local = Profiles.node(Session.profileDir);
    if (!local) return;
    const out = {};
    for (const sub of ["Desktop", "Personal", "Favorites"]) {
      const n = local.kids.find(k => k.name === sub);
      if (n) out[sub] = n.kids.map(k => VFS.serializeNode(k));
    }
    const db = Domain.db(); db.profiles[Session.acct.name] = out; Domain.save();
  }
};

/* ---------------- Shutdown ---------------- */
const Shutdown = {
  async go(restart){
    const wasDesktop = !!Session.token;
    if (wasDesktop) await Winlogon.logoff(false, () => {});
    Winlogon.state = "busy";
    Winlogon.showDesk();
    const d = Winlogon.dialog({title:"Shutdown Computer", w:380});
    d.body.appendChild(h("div", {style:{padding:"18px", textAlign:"center"}}, "Please wait while the system writes unsaved data to the disk."));
    d.place();
    if (Policy.audit("system", true)) EventLog.write("Security", "Success Audit", "Security", 513, "System Event", "SYSTEM", "Windows NT is shutting down. All logon sessions will be terminated by this shutdown.");
    Store.flush();
    await sleep(1600);
    d.close();
    Ke.paused = true;
    if (restart) { Ke.paused = false; return Boot.start(); }
    /* no power management: NT 4.0 cannot switch the machine off */
    const d2 = Winlogon.dialog({title:"Shutdown Computer", w:360});
    const row = h("div", {style:{display:"flex", gap:"14px", alignItems:"center", padding:"18px"}});
    const ic = h("div", {style:{width:"32px", height:"32px", flex:"0 0 32px"}}); ic.innerHTML = Icons.err_info();
    row.append(ic, h("div", {}, "It is now safe to turn off your computer."));
    d2.body.append(row, h("div", {class:"dlgbtns center"}, Dlg.btn("Restart", () => { d2.close(); Ke.paused = false; Boot.start(); }, {default:true})));
    d2.place();
    Guide.note("safetooff");
  },
  restart(){ return this.go(true); }
};
