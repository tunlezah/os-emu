      "once the bytes were in RAM, an entire graphical networked system assembled itself out of " +
      "half a dozen separate programs in about the time it takes to read this sentence.");
    this.note(b, el("b", null, "So the exhibit offers you both. "), "At the door there is a " +
      "\"floppy in real time\" switch. Leave it off and the load phase is compressed, which is " +
      "also historically fair — people made bootable CD versions of this disk almost immediately " +
      "for exactly that reason. Turn it on and you get the wait, the seeking, and a much better " +
      "sense of why the second number impressed people so much.");
    this.k(b, "The second clock");
    this.p(b, "There is a second stopwatch worth having: cold boot to a rendered web page. That " +
      "was the demo's real party trick, and it is the one that sold it. It keeps running past the " +
      "desktop and stops when Voyager finishes painting http://127.1/.");
    this.k(b, "What the loader really printed");
    this.p(b, "These strings are still legible in the first six sectors of the archived image:");
    b.appendChild(el("pre", { style: "font:11px/1.5 var(--mono);color:#9fe8d8;background:#101a20;padding:8px;border-radius:4px" },
      "Demodisk Loader v1.5\nOS cksum bad\nFloppy read failed\nOS start failed\n 00%\n" +
      " Dan Hildebrand creator of demodisk "));
    this.p(b, "The percentage counter is why anybody remembers the load as bearable. The last " +
      "line is a memorial: Dan Hildebrand wrote the architecture paper this exhibit quotes for " +
      "the kernel's size, and he died in 1998, the year before the disk shipped.");
  },

  page_messages(b) {
    this.h(b, "One primitive, and everything else is a process");
    this.p(b, "The QNX 4 microkernel does four things: it passes messages, it delivers messages " +
      "to other nodes, it schedules, and it dispatches interrupts. Fourteen kernel calls. " +
      "Hildebrand's 1992 paper puts the code at ", el("b", null, "roughly 7K"),
      " and observes that the kernel and the interrupt handlers together fit inside an 8K on-chip " +
      "cache — which is not a bragging point, it is the performance argument.");
    this.note(b, el("b", null, "A number to be careful with. "), "The figure often quoted for this " +
      "kernel is twelve kilobytes. The museum went looking for it and could not source it. What " +
      "primary documents do say: QNX's own 1992 architecture paper says the QNX 4 microkernel is " +
      "\"roughly 7K of code\" and \"less than 7K in size\", and describes the 1982 kernel as " +
      "\"approximately 10K\". Wikipedia's history section mentions a 44 KB kernel for the QNX 2 " +
      "era. So this exhibit shows " + U.n(K.KERNEL_CODE) + " bytes and names its source, rather " +
      "than printing a rounder number that would look better on a poster.");
    this.k(b, "The three calls");
    b.appendChild(el("pre", { style: "font:11px/1.6 var(--mono);color:#9fe8d8;background:#101a20;padding:9px;border-radius:4px" },
      "Send(pid, smsg, rmsg, smsg_len, rmsg_len);   /* blocks              */\n" +
      "pid = Receive(0, msg, msg_len);              /* 0 = from anybody    */\n" +
      "Reply(pid, reply, reply_len);                /* never blocks        */"));
    this.p(b, "And the blocked states, which are the interesting part and which the process list " +
      "shows live:");
    b.appendChild(el("table", null,
      el("tr", null, el("th", null, "State"), el("th", null, "Means")),
      el("tr", null, el("td", null, "SEND"), el("td", null, "I sent, and the receiver has not Receive()d it yet")),
      el("tr", null, el("td", null, "REPLY"), el("td", null, "It has my message and has not answered")),
      el("tr", null, el("td", null, "RECV"), el("td", null, "I am waiting for work. Where a healthy server lives")),
      el("tr", null, el("td", null, "READY"), el("td", null, "I could use the CPU right now")),
      el("tr", null, el("td", null, "WAIT / HELD / SEM / DEAD"), el("td", null, "waiting on a child or a timer; stopped by a signal; waiting on a semaphore; a zombie"))));
    this.k(b, "Why this makes a whole operating system possible");
    this.p(b, "Because a server is just a program that reads a message and answers it, the " +
      "boundary between the operating system and an application disappears. The filesystem, the " +
      "device manager, the network manager, the TCP/IP stack and the entire windowing system are " +
      "ordinary processes with pids, priorities and states. There are no private interfaces they " +
      "have and you do not. Writing a new OS service means writing a program.");
    this.quote(b, "\"System processes are practically no different from any user-written program " +
      "— they have no private or hidden interfaces that are unavailable to user processes.\" " +
      "— QNX 4.25 System Architecture");
    this.k(b, "Priority inheritance");
    this.p(b, "A server usually runs above its clients. If a low-priority client sends to it, the " +
      "request gets handled at the server's higher priority — the client is effectively " +
      "turbocharged, which is fine if the server is quick. Do it the other way round and you get " +
      "priority inversion: a high-priority client stuck behind everything in the middle. QNX 4's " +
      "answer is ", el("b", null, "client-driven priority"), ": a server sets ",
      this.c("_PPF_PRIORITY_FLOAT"), " and runs at the priority of whoever is talking to it. " +
      "Fsys, Dev, Net, Socket and Photon all do it here. Watch the pri column while a file opens.");
    this.try_(b, el("b", null, "Try: "), "open a terminal, run ", this.c("chain"),
      " after any file operation, and the kernel will print the conversation it just saw — " +
      "including who was REPLY-blocked on whom.");
  },

  page_tracer(b) {
    this.h(b, "Watching an operating system talk to itself");
    this.p(b, "This is why the exhibit is a simulation and not an emulator. An emulator would run " +
      "the real bytes and show you a screen. It could not show you this.");
    this.p(b, "The tracer taps the kernel's message layer. It sees exactly four things — a Send, " +
      "a Receive, a Reply, a Trigger — and reconstructs the conversation from the blocking states " +
      "alone. No server in this exhibit reports to it, contains a hook for it, or knows it " +
      "exists; removing the tracer removes nothing else.");
    this.k(b, "Two chains worth watching");
    this.p(b, el("b", null, "Opening a file."), " In the File Browser, expand a directory:");
    b.appendChild(el("pre", { style: "font:11px/1.6 var(--mono);color:#9fe8d8;background:#101a20;padding:9px;border-radius:4px" },
      "fbrowse  --Send-->  Fsys        readdir(\"/xip\")\n" +
      "                    Fsys  --Send-->  Fsys.floppy   read 1 block at 33\n" +
      "                    Fsys  <--Reply--                512 bytes\n" +
      "fbrowse  <--Reply--  Fsys       17 entries"));
    this.p(b, el("b", null, "Loading a page."), " In Voyager, press Home:");
    b.appendChild(el("pre", { style: "font:11px/1.6 var(--mono);color:#9fe8d8;background:#101a20;padding:9px;border-radius:4px" },
      "voyager  --Send-->  Socket      connect 127.1:80\n" +
      "voyager  --Send-->  httpd       GET / HTTP/1.0\n" +
      "                    httpd  --Send-->  Fsys        open(\"/usr/httpd/index.html\")\n" +
      "                                      Fsys  --Send-->  Fsys.floppy\n" +
      "                    httpd  <--Reply--  Fsys       4 600 bytes\n" +
      "voyager  <--Reply--  httpd      200 OK"));
    this.p(b, "Six processes, five conversations, one page. In a monolithic system every one of " +
      "those layers is a function call inside one address space and you cannot see any of it " +
      "without a debugger and the source. Here it is a list you can read while it happens.");
    this.note(b, el("b", null, "GUI traffic is off by default. "), "Turn it on and you will see " +
      "Photon steering input events and draw events to and from Pg.vga4. It is real and it is " +
      "also a firehose, which is itself the honest answer to \"does message passing cost " +
      "anything\": yes, and here is the bill.");
  },

  page_photon(b) {
    this.h(b, "Photon is not a display server with clients");
    this.p(b, "It looks superficially like X11 — a server process, applications talking to it — " +
      "and architecturally it is something else. Photon holds a three-dimensional ",
      el("b", null, "event space"), ". At the back is the root region. At the front is you. " +
      "Processes put ", el("b", null, "regions"), " into the space between, and events travel " +
      "through it: draw events outwards, towards the graphics driver's region at the very front; " +
      "input events inwards, towards the root.");
    this.p(b, "Each region carries two bitmasks:");
    b.appendChild(el("table", null,
      el("tr", null, el("th", null, "sensitive"), el("th", null, "opaque"), el("th", null, "Behaviour")),
      el("tr", null, el("td", null, "no"), el("td", null, "no"), el("td", null, "the event passes straight through, unremarked")),
      el("tr", null, el("td", null, "no"), el("td", null, "yes"), el("td", null, "an ordinary window, clipping the draw events of what is behind it")),
      el("tr", null, el("td", null, "yes"), el("td", null, "no"), el("td", null, "a logger. This exhibit's tracer is one")),
      el("tr", null, el("td", null, "yes"), el("td", null, "yes"), el("td", null, "an event filter: absorb pen strokes, do handwriting recognition, emit keystrokes"))));
    this.p(b, "That last row is the part that is hard to do in any other windowing system, and it " +
      "is where the model earns itself. Clipping falls out of it too: a draw event carries a list " +
      "of rectangles, and every opaque region it crosses cuts pieces out of that list. What " +
      "arrives at the graphics driver is exactly the visible part, already reduced to ",
      el("b", null, "tiles"), ".");
    this.quote(b, "\"Ironically, for the Photon microkernel itself, 'windows' do not exist. Nor can " +
      "the Photon microkernel 'draw' anything, or manage a pen, mouse, or keyboard.\" — QNX 4.25 " +
      "System Architecture");
    this.k(b, "Which is why you can kill it");
    this.p(b, "Photon is a process. So is the window manager, so is the graphics driver, so is " +
      "the font server, so is the input driver. Each one can be slain and started again, and each " +
      "one takes something different with it. ", this.bt("Try it", () => PWM.launch("fault")),
      " — or in a terminal, ", this.c("slay pwm"), " for a desktop with no chrome and working " +
      "applications, then ", this.c("pwm"), " to get it back.");
    this.k(b, "What the desktop looked like");
    this.p(b, "The window frame is a four-pixel grey band with a one-pixel darker inner edge, and " +
      "a nineteen-pixel title bar: teal when focused, grey when not. Widget bevels are ",
      el("b", null, "one"), " pixel — white top and left, grey bottom and right — which is why " +
      "Photon does not look like Windows 95 even at a glance. The palette in this exhibit is " +
      "sampled from archived screenshots of the real disk under the Pg.vga4 driver: face " +
      this.c("#c6c6c6").textContent + ", shadow #8c8c8c, desktop #5a5a5a, title #007b6b.");
    this.note(b, el("b", null, "One honest wrinkle. "), "In the archived captures a third title-bar " +
      "colour appears — navy, #0000a5 — on one window in each multi-window shot. Teal is what the " +
      "clearly-focused window shows in the single-window captures, so teal is what this exhibit " +
      "uses for focus and grey for everything else. If you have a better explanation for the navy " +
      "one, the museum would like to hear it.");
  },

  page_voyager(b) {
    this.h(b, "The browser was the headline act");
    this.p(b, "Voyager rendered HTML 3.2 with tables and ran JavaScript, in 1999, on a 386 with " +
      "eight megabytes of RAM, from a floppy that also carried the operating system. The sleeve " +
      "describes it as \"a highly functional and fully customizable browser that can be scaled " +
      "down for even the smallest systems\", which is marketing for: we took things out until it " +
      "fitted, and you can too.");
    this.p(b, "The detail people forget is that the disk was also a web ", el("b", null, "server"),
      ". Voyager's home page came from ", this.c("http://127.1/"), " — the machine serving itself " +
      "out of ", this.c("/usr/httpd"), ", through the TCP/IP stack, over loopback. The workspace " +
      "menu's Towers of Hanoi entry was not a program: it was ",
      this.c("voyager -u http://127.1/hanoi/game.html"), ".");
    this.k(b, "Now the unhappy part");
    this.p(b, "A 1999 browser meeting the 2026 web is not a happy story, and it is worth being " +
      "precise about why. It is not that pages look wrong. It is that no page arrives at all.");
    this.ul(b, [
      "Voyager has no TLS. In 1999 almost nothing needed it; the code to do it — certificate " +
      "store, RSA, cipher negotiation, a trust root — would be larger than this entire operating " +
      "system.",
      "The modern web is HTTPS-only in practice. Plain HTTP redirects, and HSTS makes the " +
      "redirect permanent and unskippable.",
      "So the failure is at the front door, before HTML, CSS or JavaScript get a vote. Type a " +
      "2026 address into the Site: field and watch: 301, then \"unknown protocol: https\".",
      "This is exactly the wall KolibriOS's WebView hits today, for exactly the same reason. It " +
      "is not a comment on either browser's quality."
    ]);
    this.try_(b, el("b", null, "Try: "), "the Hotlist button has a bookmark called \"A web page " +
      "from 2026\". It goes precisely as far as it can.");
    this.k(b, "And a bookmark from the other direction");
    this.p(b, "There is also a hotlist entry for a 1999 opinion piece explaining that the future " +
      "of computing is thin clients and that local storage will look as quaint as paper tape. It " +
      "is an invented page, but the position was not: it was everywhere that year. Read it beside " +
      "the fact that the operating system on this floppy went the other way entirely — into " +
      "places with no screen at all — and ended up in your car.");
  },

  page_fleet(b) {
    this.h(b, "The network is a bus");
    this.p(b, "Under FLEET a process can talk to a process, a file or a device on another node " +
      "with no special syntax, because a remote resource is addressed exactly like a local one, " +
      "through the same message-passing layer. QNX 4 spelled it with a node-number prefix: ",
      this.c("//2/etc/hosts"), ".");
    this.p(b, "There is nothing to mount, nothing to export, no client to install, no protocol to " +
      "choose and no daemon to start. The prefix tree says that a path beginning ", this.c("//2"),
      " belongs to Net; Net relays the identical message to the identical filesystem manager on " +
      "the other machine; the reply comes back the same way. The application is never told.");
    this.k(b, "Which means this works");
    b.appendChild(el("pre", { style: "font:11px/1.6 var(--mono);color:#9fe8d8;background:#101a20;padding:9px;border-radius:4px" },
      "# ls //2/\n" +
      "# cat //2/etc/motd\n" +
      "# on -n 3 sin              # list node 3's processes\n" +
      "# on -n 3 cc -c big.c      # compile on the idle machine\n" +
      "# sin vcs                  # the virtual circuits this created"));
    this.p(b, "That last command is worth running. A virtual circuit is created for you the first " +
      "time a process addresses another node, it carries a VID that looks like an ordinary local " +
      "pid to both ends, and Proc polls it; if the cable comes out, the circuit is dismantled " +
      "after a few failed polls and everything blocked on it is made READY with an error. ",
      this.bt("Pull a cable", () => PWM.launch("fleet")), " and watch it happen.");
    this.note(b, "FLEET stood for Fault-tolerant networking, Load balancing on the fly, Efficient " +
      "performance, Extensible architecture and Transparent distributed processing. The first two " +
      "came from running several cards at once: traffic spread across them, and a failure " +
      "re-routed without the application knowing. This idea arrived commercially in the 1980s and " +
      "most systems still cannot do it.");
  },

  page_fault(b) {
    this.h(b, "Kill a driver, keep the machine");
    this.p(b, "This is the same demonstration that anchors the HelenOS exhibit, and it belongs " +
      "here too — with the difference that QNX shipped it into infusion pumps and rail " +
      "interlockings rather than into a paper.");
    this.ul(b, [
      el("span", null, el("b", null, "Kill a driver"), " and its device stops while the rest of " +
        "the machine carries on. Start it again and the device comes back."),
      el("span", null, el("b", null, "Kill Photon"), " and the GUI vanishes while the system is " +
        "demonstrably alive underneath — you land on /dev/con1, where ", this.c("sin"),
        " lists the thirty-odd processes that did not care."),
      el("span", null, el("b", null, "Kill Fsys"), " and file operations fail cleanly, with an " +
        "error return, rather than panicking the machine."),
      el("span", null, el("b", null, "Kill pwm"), " and the title bars, taskbar and menu go, and " +
        "the applications keep running in naked windows, because the window manager's regions " +
        "were only ever behind theirs.")
    ]);
    this.k(b, "What a monolithic kernel would have done instead");
    this.p(b, "In a monolithic system all of that code runs in kernel space. A null dereference " +
      "in the filesystem is not an error return, it is the machine stopping — and in 1999, on a " +
      "consumer desktop, it was a blue screen. That is the claim, and it is a fair one.");
    this.k(b, "And the genuine trade-off");
    this.p(b, "Message passing costs context switches. Every conversation the tracer shows you is " +
      "at least two of them plus a copy between address spaces, where a monolithic kernel would " +
      "have made a function call. That is exactly the objection monolithic designs have raised " +
      "since the 1980s, and Mach is the standard cautionary tale of getting it wrong.");
    this.p(b, "QNX's answer was not to deny the cost but to make the primitive cheap enough that " +
      "it stops mattering: a kernel small enough to live in cache, a Send() to an already-waiting " +
      "receiver that hands the CPU over without passing through the scheduler at all, one copy, " +
      "and multipart messages so that a header and a payload need not be assembled in a buffer " +
      "first. Whether the trade is worth it depends on what you are building. If what you are " +
      "building is a brake controller, it is not a close call.");
    this.note(b, el("b", null, "No resurrection service. "), "QNX 4 has nothing that restarts a " +
      "dead driver for you, and this exhibit has not invented one. In real products that job " +
      "belongs to the application — and the only reason it ", el("i", null, "can"), " belong to " +
      "the application is that a dead driver is an ordinary process you can start again.");
  },

  page_realtime(b) {
    this.h(b, "\"Hard realtime\" does not mean fast");
    this.p(b, "Most visitors will assume it means quick. It means the ", el("b", null, "worst case " +
      "is bounded"), " and you can say what the bound is. A system that answers in ten " +
      "microseconds on average and three milliseconds once an hour is not a real-time system. A " +
      "system that always answers within one millisecond is, even on a 33 MHz 386.");
    this.k(b, "The three things that make it possible");
    this.ul(b, [
      el("span", null, el("b", null, "Priority-driven preemptive scheduling."), " 32 priorities. " +
        "The highest-priority READY process runs, full stop. Same-priority processes share the " +
        "CPU by FIFO, round-robin (a 50 ms timeslice) or adaptive scheduling, per process."),
      el("span", null, el("b", null, "Bounded interrupt latency."), " QNX leaves interrupts " +
        "enabled almost all the time. The published figures for QNX 4 are 3.3 µs on a 166 MHz " +
        "Pentium, 4.4 µs on a 100 MHz Pentium, 5.6 µs on a 100 MHz 486DX4 and 22.5 µs on a " +
        "33 MHz 386EX; scheduling latency — interrupt handler to the first instruction of the " +
        "driver process — is 4.7, 6.7, 11.1 and 74.2 µs respectively."),
      el("span", null, el("b", null, "Priority inheritance."), " Without it a high-priority client " +
        "waiting on a low-priority server can be blocked by everything in between. That is " +
        "priority inversion, and it is why a Mars rover once kept resetting itself.")
    ]);
    this.p(b, "The demonstration puts a priority-30 task with a 1 ms deadline next to as much " +
      "priority-10 load as you care to add. ", this.bt("Open it", () => PWM.launch("latency")),
      " and press \"+ 4 more\" until you are bored. The histogram will not move, because nothing " +
      "below priority 30 is permitted to matter.");
    this.note(b, el("b", null, "What that window is and is not. "), "It is a model, driven by QNX's " +
      "own published latency figures for the processors in the dropdown. It is not a measurement " +
      "of the machine you are sitting at, and a web page could not make one — your browser cannot " +
      "see an interrupt. What is faithful is the structure of the guarantee, not the microseconds.");
    this.p(b, "This is what a nuclear plant, an infusion pump and an airbag controller are all " +
      "buying, and it is why QNX's safety certifications — ISO 26262 ASIL D, IEC 61508 SIL 3, " +
      "IEC 62304 Class C — are the part of the product that actually costs money.");
  },

  page_manifest(b) {
    this.h(b, "Add up the numbers yourself");
    this.p(b, "The disk manifest is one of the two instruments this exhibit exists for. ",
      this.bt("Open it", () => PWM.launch("manifest")));
    this.p(b, "There are three honest answers to \"what was on it\", and the window gives all " +
      "three. The first is measured, from the image itself:");
    b.appendChild(el("table", null,
      el("tr", null, el("th", null, "Boot sector, block 0"), el("td", null, U.n(BOOTSECT_BYTES) + " B")),
      el("tr", null, el("th", null, "Demodisk Loader v1.5, blocks 1–5"), el("td", null, U.n(LOADER_BYTES) + " B")),
      el("tr", null, el("th", null, "Compressed OS image, blocks 6–2879"), el("td", null, U.n(PAYLOAD_BYTES) + " B")),
      el("tr", null, el("th", null, "Free space"), el("td", null, "0 B")),
      el("tr", null, el("th", null, "Total"), el("td", null, U.n(FLOPPY_BYTES) + " B"))));
    this.note(b, el("b", null, "So the expected easter egg is not there, and the truth is better. "),
      "You might expect a manifest that sums to something under 1 474 560 with the remainder shown " +
      "as free space. It does not: every sector on the archived image carries data. Entropy over " +
      "the whole image is " + IMG_ENTROPY.toFixed(3) + " bits per byte; not one of the 2880 " +
      "sectors is all zero; and the ZIP of the image is " + U.n(ZIP_BYTES) + " bytes, or " +
      (ZIP_BYTES / FLOPPY_BYTES * 100).toFixed(1) + "% of the original. An image that will not " +
      "compress is already compressed. They filled it, and then they packed it.");
    this.p(b, "The second answer — what those sectors unpack into — is a ",
      el("b", null, "reconstruction"), ", and the window says so on every row. Filenames marked " +
      "\"seen\" are visible by name in archived screenshots of the running disk (Pg.flat, " +
      "Pg.vga4, Pg.vga4flat, cool, destaller and dialer are all legible in one File Browser " +
      "capture) or in the disk's own pwm.menu. The sizes are not measurements and are not " +
      "presented as any.");
    this.p(b, "The third answer is about this page. ", this.bt("Weigh it", () => PWM.launch("manifest")),
      " Whatever the number is, it is displayed prominently and without excuses, because in an " +
      "exhibit about what fits on a floppy that is the most honest possible label.");
    this.k(b, "The shape of the disk");
    this.p(b, "Add the browser and the shared C library together and you have most of it. Add the " +
      "kernel and you have under a tenth. The operating system was never the big part — which is " +
      "the actual moral of the whole disk.");
  },

  page_shell(b) {
    this.h(b, "The disk shipped without a shell on the menu");
    this.p(b, "This is one of the exhibit's favourite facts. The workspace menu had nine items " +
      "and not one of them was a terminal:");
    b.appendChild(el("pre", { style: "font:11px/1.55 var(--mono);color:#9fe8d8;background:#101a20;padding:9px;border-radius:4px" },
      "=QNX Workspace Menu\n" +
      "Dial the Internet     D   dialer\n" +
      "Voyager Web Browser   V   voyager -x0 -y0 -h412 -w628\n" +
      "Towers of Hanoi       T   voyager ... -u http://127.1/hanoi/game.html\n" +
      "File Browser          F   fbrowse\n" +
      "Notepad               N   note\n" +
      "QNX is Cool!          Q   cool\n" +
      "Configure Display     C   pdisplay\n" +
      "Remove Extensions     R   destaller\n" +
      "Shutdown              S   reboot"));
    this.p(b, "That file is real, it lives at ", this.c("/usr/httpd/.photon/pwm/pwm.menu"),
      ", and the disk lets you edit and save it — which is where the 1999 community went to work. " +
      "The recipe is in the Extending it live tab and it works in this exhibit.");
    this.k(b, "What the terminal here is, then");
    this.p(b, "Museum furniture, marked as such: it sits below a separator in the workspace menu, " +
      "under \"Museum instruments\". The commands in it are a real mixture, and worth knowing " +
      "apart:");
    b.appendChild(el("table", null,
      el("tr", null, el("th", null, "Command"), el("th", null, "Provenance")),
      el("tr", null, el("td", null, "ls cd cat grep wc ps df kill uname"), el("td", null, "POSIX. QNX 4 is POSIX-certified and this half is meant to feel ordinary")),

};

/* ==========================================================================
   MODULE 41 — STATE
   --------------------------------------------------------------------------
   LocalStorage, and a reset styled as re-imaging the floppy. Note what is
   NOT persisted: nothing the real disk would not have kept either. The demo
   wrote nothing back to the medium, so everything here that survives a reload
   is the museum's convenience and is labelled as such at the door.
   ========================================================================== */
const State = {
  KEY: "osmuseum.qnx.v1",
  d: {
    variant: "net", mode: "vga4", sound: false, floppySound: true, realtime: false,
    guide: false, guideTab: "start", best: null, bestPage: null,
    files: {}, bookmarks: null, history: [], wins: [], net: null, wp: false, installed: [],
    tracerGui: false, seen: false
  },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) Object.assign(this.d, JSON.parse(raw));
    } catch (e) { /* private browsing, or a browser that says no */ }
    return this.d;
  },
  save() {
    try {
      this.d.wp = Machine.wp;
      this.d.sound = Sound.on; this.d.floppySound = Sound.floppyOn;
      this.d.guide = Guide.open_; this.d.guideTab = Guide.tab;
      /* only a running machine may overwrite what a running machine produced:
         a save from the front door must not wipe the last session's state    */
      if (Boot.bootAt) {
        this.d.files = FS.overlay();
        this.d.net = Net.up ? { ip: Net.ip, mask: Net.mask, gw: Net.gw, dns: Net.dns,
          media: Net.media, hostname: Net.hostname } : null;
        /* merge rather than replace: closing a window should not forget
           where it was, and neither should rebooting                       */
        const keep = (this.d.wins || []).slice();
        for (const w of PWM.wins) {
          const rec = { app: w.app.name, x: w.x, y: w.y, w: w.w, h: w.h, min: w.min };
          const i = keep.findIndex(x => x.app === rec.app);
          if (i >= 0) keep[i] = rec; else keep.push(rec);
        }
        this.d.wins = keep.slice(-24);
        this.d.installed = Extensions.installed.slice();
      }
      localStorage.setItem(this.KEY, JSON.stringify(this.d));
    } catch (e) { /* nothing to be done, and nothing important lost */ }
  },
  applyFiles() {
    if (this.d.files) FS.applyOverlay(this.d.files);
    if (this.d.installed) {
      Extensions.installed = this.d.installed.slice();
      for (const f of Extensions.installed) {
        const c = Extensions.catalogue.find(x => x.f === f);
        FS.nodes.set("/tmp_ram/" + f, { t: "f", size: (c && c.b) || 40000, text: null,
          mtime: Date.now(), ro: false, kind: "pkg" });
      }
    }
  },
  bookmarks() {
    if (!this.d.bookmarks) this.d.bookmarks = Web.bookmarks.slice();
    return this.d.bookmarks;
  },
  addBookmark(t, u) {
    const bm = this.bookmarks();
    if (!bm.some(x => x.u === u)) bm.unshift({ t: t, u: u });
    this.save();
  },
  pushHistory(u, t) {
    this.d.history = (this.d.history || []).filter(h => h.u !== u);
    this.d.history.unshift({ u: u, t: t, at: Date.now() });
    if (this.d.history.length > 40) this.d.history.length = 40;
  },
  best(ms, kind) {
    const k = kind === "page" ? "bestPage" : "best";
    if (this.d[k] === null || ms < this.d[k]) { this.d[k] = ms; this.save(); return true; }
    return false;
  },
  reimage() {
    try { localStorage.removeItem(this.KEY); } catch (e) { }
    location.reload();
  },
  restoreNet() {
    const n = this.d.net;
    if (!n) return;
    Object.assign(Net, { ip: n.ip, mask: n.mask, gw: n.gw, dns: n.dns, media: n.media,
      hostname: n.hostname, up: true });
    Net.nodes[0].ip = n.ip;
    if (n.media === "ppp") Modem.state = "up";
  }
};

/* ==========================================================================
   MODULE 42 — THE BOOT MANAGER
   --------------------------------------------------------------------------
   Floppy noise, the loader's percentage, then QNX 4 coming up one process at
   a time — because that is literally what is happening. Two stopwatches: to
   a usable desktop, and to a rendered web page. ESC skips.
   ========================================================================== */
const Boot = {
  t0: 0, tDesk: 0, tPage: 0, skipped: false, running: false, bootAt: 0,
  el: null, variant: "net", realtime: false, timer: null,

  line(text, cls) {
    const log = $("#bootlog");
    log.appendChild(el("div", { class: cls || null, text: text }));
    while (log.children.length > 27) log.removeChild(log.firstChild);
  },
  clock() {
    const w = $("#watch");
    const ms = (this.tDesk || (U.now() - this.t0));
    const pg = this.tPage ? (this.tPage) : (this.tDesk ? (U.now() - this.t0) : 0);
    w.innerHTML = "";
    w.appendChild(el("div", { class: "lbl" }, "cold boot to desktop"));
    w.appendChild(el("div", null, el("b", null, (ms / 1000).toFixed(3) + " s")));
    if (this.tDesk) {
      w.appendChild(el("div", { class: "lbl", style: "margin-top:3px" }, "to a rendered page"));
      w.appendChild(el("div", null, el("s", null, this.tPage ? (this.tPage / 1000).toFixed(3) + " s" : (pg / 1000).toFixed(3) + " s")));
    }
    if (State.d.best !== null)
      w.appendChild(el("div", { class: "lbl", style: "margin-top:3px" },
        "session best " + (State.d.best / 1000).toFixed(3) + " s"));
  },
  upSeconds() { return this.bootAt ? (Date.now() - this.bootAt) / 1000 : 0; },

  async start(opts) {
    opts = opts || {};
    this.variant = opts.variant || State.d.variant || "net";
    this.realtime = !!opts.realtime;
    Machine.floppyRealtime = this.realtime;
    Machine.wp = !!opts.wp;
    Sound.floppyOn = opts.floppySound !== false;
    Sound.on = !!opts.sound;
    State.d.variant = this.variant;
    this.skipped = false; this.tDesk = 0; this.tPage = 0; this.bootAt = 0;
    Console.leave();
    Watch.unmount();
    Menu.close();
    PWM.wins.slice().forEach(w => PWM.destroy(w, true));
    $("#wins").innerHTML = "";
    /* anything else that was parked on the desktop — the shutdown notice, the
       stopwatch — goes with it                                             */
    for (const kid of Array.from($("#desk").children)) if (kid.id !== "wins") kid.remove();
    Ph.reset(); Tracer.clear(); Machine.reset(); NodeFS.reset();
    $("#desk").classList.remove("dead", "nodrv");
    $("#bootlog").innerHTML = "";
    $("#door").style.display = "none";
    this.show("boot");
    this.t0 = U.now();
    this.running = true;
    this.timer = setInterval(() => this.clock(), 47);
    Sound.resume();
    try { await this.sequence(); } catch (e) { console.error(e); }
  },
  show(which) {
    for (const id of ["boot", "machine"]) $("#" + id).classList.toggle("on", id === which);
  },
  wait(ms) {
    if (this.skipped) return Promise.resolve();
    return new Promise(r => setTimeout(r, ms));
  },

  async sequence() {
    const L = (t, c) => this.line(t, c);
    const bar = el("div", { id: "bootbar" }, el("i"));
    const fill = bar.querySelector("i");
    L("Booting from A:", "dim");
    await this.wait(160);
    /* the loader. This part is verbatim: the strings are in the image.      */
    L(" Demodisk Loader v1.5", "hi");
    L(" Dan Hildebrand creator of demodisk ", "dim");
    $("#bootlog").appendChild(bar);
    bar.style.display = "block";
    const total = this.realtime ? 44000 : 3200;
    const t1 = U.now();
    await new Promise(res => {
      const iv = setInterval(() => {
        const f = this.skipped ? 1 : U.clamp((U.now() - t1) / total, 0, 1);
        fill.style.width = (f * 100) + "%";
        const pct = Math.floor(f * 100);
        const log = $("#bootlog");
        const last = log.lastChild;
        if (last && last.dataset && last.dataset.pct) last.textContent = " " + U.pad(pct, 2, "0") + "%";
        else { const d = el("div", { class: "ld", text: " " + U.pad(pct, 2, "0") + "%" }); d.dataset.pct = "1"; log.appendChild(d); }
        Machine.seek(2 + (pct % 5));
        if (f >= 1) { clearInterval(iv); res(); }
      }, this.realtime ? 260 : 90);
    });
    bar.style.display = "none";
    L("", "dim");
    L("Loaded " + U.n(FLOPPY_BYTES) + " bytes, checksum ok", "ok");
    await this.wait(140);

    /* from here the boot log is a reconstruction, and the guide says so     */
    L("", "dim");
    L("QNX 4.25  (c) 1982,1999 QNX Software Systems Ltd.", "hi");
    L("Microkernel: 7168 bytes, 14 kernel calls, message passing + scheduling", "tealt");
    await this.wait(this.realtime ? 260 : 90);
    Sys.boot(this.variant);
    State.restoreNet();
    const steps = [
      ["Proc", "process manager: prefix tree, spawn, VC integrity"],
      ["Fsys", "filesystem manager"],
      ["Fsys.floppy", "block driver: fd0, 1.44M, 2 heads, 80 tracks, 18 sectors"],
      ["mount", "/dev/fd0 mounted on /"],
      ["Dev", "device manager"],
      ["Dev.ansi", "4 virtual consoles on /dev/con1..4"],
      [this.variant === "modem" ? "Dev.ser" : "Dev.pty", this.variant === "modem"
        ? "16550A at 0x3f8 irq 4 — modem found on /dev/ser1"
        : "32 pseudo-terminals"],
      ["Net", "FLEET: network manager, node 1"],
      [this.variant === "modem" ? "pppd" : "Net.ether2100",
        this.variant === "modem" ? "PPP with pap and chap"
          : "NE2000 at 0x300 irq 3 — 00:60:8c:1a:2b:3c"],
      ["Socket", "TCP/IP"],
      ["Photon", "graphical microkernel: event space up, root region 640x480"],
      ["Pg.vga4", "graphics driver: 640x480, 4-bit, 16 colours"],
      ["Input", "PS/2 mouse and 101-key keyboard as regions at the front"],
      ["phfont", "font server: latin1.pfr — Dutch, Swiss, Courier"],
      ["pwm", "window manager"],
      ["httpd", "web server on port 80, root /usr/httpd"]
    ];
    for (const [name, note] of steps) {
      const p = K.byName(name, 1);
      const pid = p ? p.pid : "-";
      L(U.padr(name, 15) + U.pad(pid, 4) + "  " + note, name === "mount" ? "dim" : "srv");
      Machine.seek(3);
      await this.wait(this.realtime ? 150 : 52);
    }
    L("", "dim");
    if (this.variant === "net") {
      L("Net: probing for a supported card...", "dim");
      await this.wait(this.realtime ? 420 : 150);
      L("Net.ether2100: NE2000 found, port 0x300, irq 3", "ok");
      L("Socket: en1 up, 10.0.0.14 netmask 255.255.255.0 gw 10.0.0.1", "ok");
      Net.ip = "10.0.0.14"; Net.mask = "255.255.255.0"; Net.gw = "10.0.0.1";
      Net.dns = "10.0.0.1"; Net.media = "ether"; Net.up = true;
      Net.nodes[0].ip = Net.ip;
      L("Net: nodes seen on this segment: //1/ //2/ //3/", "ok");
    } else {
      L("Dev.ser: modem on /dev/ser1 — dial when ready (Dial the Internet)", "warn");
      L("Socket: no interface configured. http://127.1/ works regardless.", "dim");
    }
    await this.wait(this.realtime ? 300 : 110);
    L("", "dim");
    L("Photon: starting the desktop", "tealt");
    await this.wait(this.realtime ? 240 : 90);

    /* the desktop is usable: stop the first clock */
    this.tDesk = U.now() - this.t0;
    const isBest = State.best(this.tDesk);
    this.bootAt = Date.now();
    this.show("machine");
    PWM.start();
    Photon_regions();
    await PWM.loadMenu();
    this.clock();
    /* and Voyager, on the disk's own home page, from the disk's own server  */
    const vy = await PWM.launch("voyager", { url: "http://127.1/", geom: { x: 0, y: 0, w: 628, h: 412 } });
    this.tPage = U.now() - this.t0;
    State.best(this.tPage, "page");
    this.running = false;
    clearInterval(this.timer);
    Watch.mount(isBest);
    if (!State.d.seen) {
      State.d.seen = true;
      Guide.open("start");
      State.save();
    }
    State.save();
  },

  skip() {
    if (!this.running) return;
    this.skipped = true;
    Toast.show("Skipping the load. The disk did not have that option.");
  },
  again() {
    Watch.unmount();
    this.start({ variant: this.variant, realtime: this.realtime, wp: Machine.wp,
      sound: Sound.on, floppySound: Sound.floppyOn });
  },
  shutdown() {
    Toast.hide();
    Watch.unmount();
    Console.leave();
    PWM.wins.slice().forEach(w => PWM.destroy(w, true));
    $("#desk").classList.add("dead");
    $("#taskbar").style.display = "none";
    const box = el("div", { style: "position:absolute;inset:0;background:#000;color:#c8c8c8;font:13px/17px var(--mono);padding:12px;z-index:9000" },
      el("div", null, "Shutting down..."),
      el("div", { style: "color:#4be08a;margin-top:8px" }, "Processes terminated. Filesystems synced. Nothing was written to the floppy."),
      el("div", { style: "margin-top:14px;color:#7fd0ff" }, "It is now safe to remove the disk and give it to somebody else."),
      el("div", { style: "margin-top:20px" },
        el("button", { class: "pbtn", style: "background:#16232a;color:#a8f0e0;border:1px solid #2b4a45",
          onclick: () => Boot.again() }, "Insert it again")));
    $("#desk").appendChild(box);
    for (const p of K.list()) if (!p.persistent) K.kill(p.pid);
  }
};

/* ==========================================================================
   MODULE 43 — THE STOPWATCH, AFTER THE BOOT
   --------------------------------------------------------------------------
   It freezes when the desktop is usable and stays on screen, with the session
   best beside it and a button that starts the whole thing again. Visitors
   press that button repeatedly, and that is the exhibit working.
   ========================================================================== */
const Watch = {
  el: null, big: false,
  mount(isBest) {
    this.unmount();
    const wrap = el("div", { style: "position:absolute;right:4px;bottom:27px;z-index:8500;" +
      "background:#0b1216ee;border:1px solid #2b4a45;color:#c9d8de;font:10px/14px var(--mono);" +
      "padding:2px 5px;display:flex;align-items:center;gap:7px;cursor:pointer",
      title: "Cold boot to a usable desktop, and to a rendered page. Click for detail." });
    const num = (lbl, v, col) => el("span", null,
      el("span", { style: "color:#5d7280", text: lbl + " " }),
      el("span", { style: "color:" + col + ";font-weight:700", text: v }));
    wrap.appendChild(num("boot", (Boot.tDesk / 1000).toFixed(3) + "s", "#39c9b0"));
    wrap.appendChild(num("page", (Boot.tPage / 1000).toFixed(3) + "s", "#f0c14b"));
    if (State.d.best !== null)
      wrap.appendChild(num("best", (State.d.best / 1000).toFixed(3) + "s", isBest ? "#5fe0a8" : "#9fb6be"));
    const again = el("button", { style: "background:#16232a;border:1px solid #2b4a45;color:#a8f0e0;" +
      "border-radius:3px;padding:0 5px;cursor:pointer;font:10px/14px var(--ui)" }, "boot again");
    again.addEventListener("click", ev => { ev.stopPropagation(); Boot.again(); });
    const x = el("button", { style: "background:none;border:0;color:#5d7280;cursor:pointer;font:11px/12px var(--ui);padding:0 2px" }, "×");
    x.addEventListener("click", ev => { ev.stopPropagation(); Watch.unmount(); });
    wrap.appendChild(again); wrap.appendChild(x);
    wrap.addEventListener("click", () => Guide.open("clock"));
    $("#desk").appendChild(wrap);
    this.el = wrap;
  },
  unmount() { if (this.el && this.el.parentNode) this.el.parentNode.removeChild(this.el); this.el = null; }
};

   --------------------------------------------------------------------------
   There really were two disks, and they really did differ, so the choice is
   the exhibit's first honest statement rather than a menu for its own sake.
   ========================================================================== */
const Door = {

        tags: ["Net.ether2100", "Net.ether509", "netcfg", "//2/ works at once"] },

/* ==========================================================================
   MODULE 45 — INPUT ROUTING
   --------------------------------------------------------------------------
   A click on the desktop is injected by Input, travels inwards through the
   event space, and is collected by the first region sensitive to pointer
   events. That is a real message chain and the tracer sees it — which is why
   GUI traffic is a separate switch in there: it is a firehose, and being able
   to see the firehose is itself the honest answer to "what does message
   passing cost?".
   ========================================================================== */
const Input = {
  install() {
    const desk = $("#desk");
    desk.addEventListener("mousedown", ev => {
      Sound.resume();
      if (ev.target.closest(".win") || ev.target.closest("#taskbar") || ev.target.closest(".pop")) return;
      Menu.close();
      this.inject("ptr press", Display.pt(ev));
    });
    desk.addEventListener("contextmenu", ev => {
      ev.preventDefault();
      if (ev.target.closest(".win")) return;
      PWM.workspaceMenu($("#tb-logo"));
    });
    window.addEventListener("keydown", ev => {
      if (ev.key === "Escape") {
        if (Boot.running) { Boot.skip(); return; }
        if (Menu.cur) { Menu.close(); return; }
      }
      if (ev.key === "F1" && !ev.ctrlKey) { ev.preventDefault(); Guide.toggle(); return; }
      /* Ctrl-Alt-1..4 reached a text console on the real machine            */
      if (ev.ctrlKey && ev.altKey && /^[1-4]$/.test(ev.key)) {
        ev.preventDefault();
        if (!Console.layer) Console.enter(); else Console.leave();
        return;
      }
      const t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable ||
        t.classList.contains("pt-scr"))) return;
      if (ev.key.length === 1 || ev.key === "Enter" || ev.key === "Backspace")
        this.inject("key " + ev.key, { x: 0, y: 0 });
    });
    /* the clock in the taskbar, and the pwm menu */
    $("#tb-logo").addEventListener("click", () => { Sound.click(); PWM.workspaceMenu($("#tb-logo")); });
    $("#tb-logo").appendChild(Icons.mark(40));
    $("#tb-clock").addEventListener("click", () => PWM.launch("clock"));
    setInterval(() => { if (PWM.chrome) PWM.paintTaskbar(); }, 20000);
    this.tray();
  },
  async inject(kind, at) {
    const inp = K.byName("Input"), ph = K.byName("Photon");
    if (!inp || !ph) return;
    await K.Send(inp.pid, ph.pid, {
      code: 0x0116, ph: "input", kind: kind, at: at,
      what: kind + " at " + Math.round(at.x) + "," + Math.round(at.y), len: 32
    }).catch(() => { });
  },
  tray() {
    const host = $("#tb-right");
    host.innerHTML = "";
    const tab = el("div", { class: "bv", style: "width:20px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer",
      title: "The write-protect tab. It does something." });
    const paintTab = () => {
      tab.innerHTML = "";
      tab.appendChild(Icons.tab(Machine.wp));
      tab.title = Machine.wp
        ? "Write-protect tab OPEN — Fsys.floppy answers EROFS. Click to close it."
        : "Write-protect tab closed — writes go to the RAM image. Click to open it.";
    };
    paintTab();
    tab.addEventListener("click", () => {
      Machine.wp = !Machine.wp;
      paintTab(); State.save();
      Toast.show(Machine.wp
        ? "Write-protect tab open. Try saving something: the error comes back from the block driver, through Fsys, to the application."
        : "Write-protect tab closed. Writes land in the RAM image — never on the real floppy, which is how the real disk behaved too.");
    });
    const snd = el("div", { class: "bv", style: "width:20px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer" });
    const paintSnd = () => {
      snd.innerHTML = "";
      snd.appendChild(U.ico(Sound.on
        ? '<path d="M2 5h2l3-3v9L4 8H2z" fill="#000"/><path d="M9 4.5a4 4 0 010 5" stroke="#000" fill="none"/>'
        : '<path d="M2 5h2l3-3v9L4 8H2z" fill="#000"/><path d="M9 4l4 4M13 4l-4 4" stroke="#ff1010" fill="none"/>',
        { w: 14, h: 14 }));
      snd.title = Sound.on ? "Sound on. Click to mute." : "Sound off (the floppy still seeks during a boot). Click to enable.";
    };
    paintSnd();
    snd.addEventListener("click", () => { Sound.on = !Sound.on; Sound.resume(); paintSnd(); Sound.click(); State.save(); });
    const notes = el("div", { class: "bv", style: "padding:0 5px;height:18px;display:flex;align-items:center;cursor:pointer;font:10px var(--ui)",
      title: "The museum's notes (F1)" }, "notes");
    notes.addEventListener("click", () => Guide.toggle());
    host.appendChild(tab); host.appendChild(snd); host.appendChild(notes);
  }
};

/* ==========================================================================
   MODULE 46 — GO
   ========================================================================== */
(function main() {
  State.load();
  Sound.on = !!State.d.sound;
  Sound.floppyOn = State.d.floppySound !== false;
  Machine.wp = !!State.d.wp;
  Door.sel.variant = State.d.variant || "net";
  Door.sel.sound = Sound.on;
  Door.sel.floppy = Sound.floppyOn;
  Door.sel.wp = Machine.wp;
  Guide.tab = State.d.guideTab || "start";
  FS.build(Door.sel.variant);
  State.applyFiles();
  Tracer.start();
  Display.setMode(SCR_W, SCR_H);
  Input.install();
  $("#g-toggle").addEventListener("click", () => Guide.toggle());
  if (State.d.guide) Guide.toggle(true);
  Door.build();
  Display.fit();
  /* the taskbar clock, and a periodic save                                  */
  setInterval(() => { if (!Boot.running) State.save(); }, 20000);
  window.addEventListener("beforeunload", () => State.save());
})();
</script>
