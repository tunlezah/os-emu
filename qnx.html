<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QNX 4 &mdash; The Incredible 1.44M Demo (1999) &mdash; The OS Museum</title>
<meta name="description" content="An interactive, single-file homage to QNX Software Systems' 1999 demo floppy: a hard-realtime microkernel, the Photon microGUI, a TCP/IP stack, a web server and the Voyager browser, on one 1.44 MB disk. Watch the processes send messages to each other, then kill the GUI and find the machine still running underneath.">
<style>
/* ==========================================================================
   QNX 4.25 / "THE INCREDIBLE 1.44M DEMO", Demo Disk version 4.05 (1999)
   A single-file exhibit for The OS Museum.
   --------------------------------------------------------------------------
   Nothing here is emulated. This is a hand-built simulation whose purpose is
   to make one idea visible: that a microkernel plus a team of ordinary
   processes, talking only by synchronous messages, was small enough in 1999
   to carry an operating system, a windowing system, a TCP/IP stack, a web
   SERVER and a graphical web BROWSER on a single 1,474,560-byte floppy.

   Palette measured from archived screenshots of the real disk running under
   the Pg.vga4 driver (640x480, 4-bit, 16 colours):
     window / widget face   #c6c6c6      browser surround   #bdbdbd
     highlight              #ffffff      shadow             #8c8c8c
     deep shadow / desktop  #5a5a5a      outline            #000000
     title bar, focused     #007b6b      list selection     #0000a5
     link / tree selection  #1010ff      warning            #ff1010
   The 16-colour set uses 0x10 rather than 0x00 in the bright channels
   (#ffff10, #10ff10, #10ffff, #ff10ff, #8400b5) exactly as the captures do.
   Photon's bevel is ONE pixel: white top and left, #8c8c8c bottom and right.
   It is not Windows' two-pixel double bevel, and it should not look like it.
   The window frame is a four-pixel #8c8c8c band with a one-pixel #5a5a5a
   inner edge; the title bar is nineteen pixels tall.
   ========================================================================== */

:root{
  --face:#c6c6c6; --face2:#bdbdbd; --hi:#ffffff; --sh:#8c8c8c; --dk:#5a5a5a;
  --ink:#000000; --teal:#007b6b; --navy:#0000a5; --blue:#1010ff;
  --yel:#ffff10; --red:#ff1010; --grn:#10ff10; --cyn:#10ffff; --mag:#ff10ff;
  --pur:#8400b5; --desk:#5a5a5a;
  --ui:"Helvetica Neue",Helvetica,Arial,"DejaVu Sans",sans-serif;
  --mono:"DejaVu Sans Mono","Liberation Mono","Courier New",monospace;
  --ex:#141a20; --ex-fg:#d6e2e8; --ex-ac:#39c9b0; --ex-ac2:#f0c14b;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05080a}
body{font:12px/1.3 var(--ui);color:#000;user-select:none;-webkit-font-smoothing:none;
  -moz-osx-font-smoothing:grayscale;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0}
img{display:block}

/* ---------- Photon's one-pixel bevel, the toolkit's whole signature ------- */
.bv{background:var(--face);border-top:1px solid var(--hi);border-left:1px solid var(--hi);
    border-right:1px solid var(--sh);border-bottom:1px solid var(--sh)}
.bv-in{background:var(--face);border-top:1px solid var(--sh);border-left:1px solid var(--sh);
    border-right:1px solid var(--hi);border-bottom:1px solid var(--hi)}
.bv-flat{background:var(--face);border:1px solid var(--sh)}
.field{background:#fff;border-top:1px solid var(--sh);border-left:1px solid var(--sh);
    border-right:1px solid var(--hi);border-bottom:1px solid var(--hi);color:#000}

/* ==========================================================================
   STAGE — the whole exhibit lives in one fixed viewport
   ========================================================================== */
#stagewrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,#101a20 0%,#05080a 70%)}
#clip{position:relative;overflow:hidden;box-shadow:0 0 0 1px #000,0 10px 46px #000a}
#screen{position:absolute;top:0;left:0;transform-origin:0 0;background:var(--desk);
  width:640px;height:480px;overflow:hidden}
#scalenote{position:fixed;left:9px;bottom:6px;font:9px/11px var(--mono);color:#3d4c55;
  letter-spacing:.02em;z-index:60;pointer-events:none}
.layer{position:absolute;inset:0;display:none}
.layer.on{display:block}

/* ==========================================================================
   THE FRONT DOOR — which disk, which screen, how patient are you
   ========================================================================== */
#door{position:fixed;inset:0;overflow:auto;z-index:40;user-select:text;
  background:linear-gradient(#0a1015,#05080a);color:var(--ex-fg);font-family:var(--ui)}
.dw{max-width:1060px;margin:0 auto;padding:36px 24px 64px}
.d-kick{font:600 10.5px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;
  color:var(--ex-ac);margin-bottom:14px}
.d-title{font-size:33px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.08}
.d-title i{font-style:normal;color:var(--ex-ac2)}
.d-sub{color:#8fa3ad;font-size:14px;line-height:1.62;max-width:780px;margin-top:12px}
.d-sub b{color:#e4edf2;font-weight:600}
.d-label{font:600 10.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;
  color:#61757f;margin:30px 0 11px}
.d-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:11px}
.d-card{border:1px solid #1e2b33;background:#0c1418;border-radius:7px;padding:13px 14px;
  cursor:pointer;text-align:left;transition:border-color .12s,background .12s,transform .12s}
.d-card:hover{border-color:var(--ex-ac);background:#0f1a20;transform:translateY(-2px)}
.d-card.sel{border-color:var(--ex-ac);background:#102229;box-shadow:0 0 0 1px var(--ex-ac)}
.d-cn{font:700 14px var(--mono);color:#fff}
.d-cd{font-size:12px;color:#87a0ab;margin-top:4px;line-height:1.5}
.d-tags{margin-top:9px;display:flex;gap:5px;flex-wrap:wrap}
.d-tag{font:600 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:#7fd8c8;background:#11302c;border:1px solid #1d4a44;border-radius:3px;padding:3px 5px}
.d-tag.b{color:#c9b8fb;background:#211d38;border-color:#3a3163}
.d-tag.c{color:#f2c78f;background:#31241a;border-color:#583d28}
.d-opts{display:flex;flex-wrap:wrap;gap:11px 26px;margin-top:14px;color:#93a7b1;font-size:12.5px}
.d-opts label{display:flex;gap:7px;align-items:center;cursor:pointer}
.d-go{margin-top:30px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.d-btn{background:var(--ex-ac);color:#04211d;border-radius:6px;padding:12px 28px;
  font:700 14px var(--ui);cursor:pointer}
.d-btn:hover{filter:brightness(1.13)}
.d-btn.alt{background:#16232a;color:#c4d4dc;border:1px solid #27383f}
.d-btn.alt:hover{background:#1d2f37}
.d-note{margin:20px 0 0;padding:12px 15px;border:1px solid #1d2b33;border-left:3px solid var(--ex-ac2);
  background:#0c1418;border-radius:0 6px 6px 0;color:#93a7b1;font-size:12.5px;line-height:1.62;max-width:880px}
.d-note b{color:#dbe7ec}
.d-foot{margin-top:34px;padding-top:17px;border-top:1px solid #17232a;color:#5a6d77;
  font-size:11.5px;line-height:1.72;max-width:900px}
.d-foot a{color:#7fd8c8}
.d-label2{color:#93a7b1;font-size:12.5px;line-height:1.6;margin-bottom:8px;max-width:820px}

/* the disk label, drawn in CSS, original artwork in the spirit of the real one */
.dsk{width:230px;height:150px;border-radius:4px;background:#f4f2ee;border:1px solid #cfcbc2;
  padding:11px 12px;position:relative;overflow:hidden;flex:0 0 auto}
.dsk .m{font:800 15px/1.02 var(--ui);letter-spacing:-.01em;color:#1b3a5c}
.dsk .m i{font-style:normal;color:#6fae2f;font-size:21px}
.dsk .m s{text-decoration:none;color:#111}
.dsk .bar{margin-top:8px;background:#111;color:#fff;border-radius:9px;text-align:center;
  font:600 7.5px/14px var(--ui);letter-spacing:.18em;text-transform:uppercase}
.dsk .v{margin-top:7px;font:600 9.5px/1.45 var(--ui);color:#222}
.dsk .v span{font-weight:400;color:#555}
.dsk .mk{position:absolute;right:10px;top:9px;font:800 12px/1 var(--ui);color:#111;letter-spacing:-.06em}
.dsk .mk b{font-size:6px;vertical-align:super;font-weight:700;letter-spacing:0}

/* ==========================================================================
   BOOT — the loader, then QNX 4 starting one process at a time
   ========================================================================== */
#boot{background:#000;color:#c8c8c8;font:13px/15px var(--mono);overflow:hidden;
  padding:6px 8px;white-space:pre;user-select:text}
#bootlog{height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start}
#boot .ld{color:#d8d8d8}
#boot .ok{color:#4be08a}
#boot .warn{color:#e8d34b}
#boot .err{color:#ff5c5c}
#boot .srv{color:#7fd0ff}
#boot .dim{color:#5e6a72}
#boot .hi{color:#fff;font-weight:700}
#boot .tealt{color:#38c9b4}
#bootskip{position:absolute;right:9px;bottom:6px;color:#4a545c;font:11px var(--mono)}
#bootbar{margin:3px 0 4px;height:9px;border:1px solid #333;display:none;max-width:520px}
#bootbar i{display:block;height:100%;background:#38c9b4;width:0}

/* the stopwatch, which is the point of the boot screen */
#watch{position:absolute;right:8px;top:6px;font:11px/1.35 var(--mono);color:#9ab;
  text-align:right;background:#0009;padding:4px 6px;border:1px solid #223;pointer-events:none}
#watch b{color:#38c9b4;font-size:15px;font-weight:700;letter-spacing:-.02em}
#watch s{text-decoration:none;color:#f0c14b}
#watch .lbl{color:#5e6a72;font-size:9px;letter-spacing:.1em;text-transform:uppercase}

/* ==========================================================================
   PHOTON — desktop, window frames, the taskbar, the workspace menu
   ========================================================================== */
#desk{position:absolute;inset:0;background:var(--desk);overflow:hidden}
#desk.dead{background:#000}
#wins{position:absolute;inset:0}
#taskbar{position:absolute;left:0;right:0;bottom:0;height:24px;background:var(--face);
  border-top:1px solid var(--hi);display:flex;align-items:center;gap:2px;padding:2px 3px;z-index:9000}
#tb-logo{width:44px;height:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  cursor:pointer}
#tb-tasks{flex:1 1 auto;display:flex;gap:3px;overflow:hidden;align-items:center}
.tb-btn{height:18px;min-width:60px;max-width:154px;flex:1 1 0;display:flex;align-items:center;
  gap:4px;padding:0 4px;font:11px/1 var(--ui);cursor:pointer;overflow:hidden;white-space:nowrap}
.tb-btn span{overflow:hidden;text-overflow:clip;white-space:nowrap}
.tb-btn.act{border-top-color:var(--sh);border-left-color:var(--sh);
  border-right-color:var(--hi);border-bottom-color:var(--hi);background:#b8b8b8}
#tb-clock{flex:0 0 auto;padding:0 6px;height:18px;display:flex;align-items:center;
  font:11px/1 var(--mono);cursor:pointer}
#tb-right{flex:0 0 auto;display:flex;gap:3px;align-items:center}

.win{position:absolute;background:var(--sh);border:4px solid var(--sh);
  box-shadow:inset 0 0 0 1px var(--dk);display:flex;flex-direction:column;overflow:hidden}
.win.min{display:none!important}
.win-tt{height:19px;flex:0 0 auto;background:var(--sh);color:#fff;display:flex;align-items:center;
  border-bottom:1px solid var(--dk);position:relative;cursor:default;padding:0 1px}
.win.act>.win-tt{background:var(--teal)}
.win-tt .cap{flex:1 1 auto;text-align:center;font:700 11px/1 var(--ui);overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;padding:0 4px;letter-spacing:.04em;
  text-shadow:1px 1px 0 #0006;pointer-events:none}
.tbtn{width:15px;height:15px;flex:0 0 auto;border-radius:50%;background:var(--face);
  border-top:1px solid var(--hi);border-left:1px solid var(--hi);
  border-right:1px solid var(--dk);border-bottom:1px solid var(--dk);
  display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0 1px}
.tbtn:active{border-top-color:var(--dk);border-left-color:var(--dk);
  border-right-color:var(--hi);border-bottom-color:var(--hi)}
.tbtn svg{display:block}
.win-body{flex:1 1 auto;background:var(--face);position:relative;overflow:hidden;
  display:flex;flex-direction:column}
.win-rz{position:absolute;width:9px;height:9px;right:-4px;bottom:-4px;cursor:nwse-resize;z-index:5}
.win-rz-r{position:absolute;top:14px;bottom:6px;right:-4px;width:5px;cursor:ew-resize}
.win-rz-b{position:absolute;left:6px;right:6px;bottom:-4px;height:5px;cursor:ns-resize}

/* menus */
.mbar{flex:0 0 auto;height:19px;background:var(--face);display:flex;align-items:stretch;
  border-bottom:1px solid var(--sh)}
.mbar>div{padding:0 9px;display:flex;align-items:center;font:11px/1 var(--ui);cursor:pointer}
.mbar>div.on,.mbar>div:hover{background:var(--navy);color:#fff}
.mbar .mnem{text-decoration:underline}
.pop{position:absolute;z-index:9500;background:var(--face);
  border-top:1px solid var(--hi);border-left:1px solid var(--hi);
  border-right:1px solid var(--dk);border-bottom:1px solid var(--dk);
  padding:2px 0;min-width:118px;box-shadow:2px 2px 0 #0004}
.pop .it{padding:2px 16px 2px 10px;font:11px/14px var(--ui);white-space:nowrap;cursor:pointer;
  display:flex;justify-content:space-between;gap:18px}
.pop .it:hover{background:var(--navy);color:#fff}
.pop .it.dis{color:var(--sh);pointer-events:none}
.pop .it .k{color:#555}
.pop .it:hover .k{color:#cfd}
.pop .sep{height:1px;background:var(--sh);margin:3px 2px;border-bottom:1px solid var(--hi)}
.pop .hd{padding:3px 10px 4px;font:700 11px/13px var(--ui);border-bottom:1px solid var(--sh);
  margin-bottom:2px;background:var(--face)}

/* widgets */
.pbtn{padding:2px 12px;min-height:19px;font:11px/13px var(--ui);cursor:pointer;
  background:var(--face);border-top:1px solid var(--hi);border-left:1px solid var(--hi);
  border-right:1px solid var(--sh);border-bottom:1px solid var(--sh);color:#000;
  display:inline-flex;align-items:center;justify-content:center;gap:5px}
.pbtn:active,.pbtn.dn{border-top-color:var(--sh);border-left-color:var(--sh);
  border-right-color:var(--hi);border-bottom-color:var(--hi)}
.pbtn[disabled]{color:var(--sh);pointer-events:none}
.pbtn.dflt{box-shadow:0 0 0 1px var(--dk)}
.ptxt{background:#fff;border-top:1px solid var(--sh);border-left:1px solid var(--sh);
  border-right:1px solid var(--hi);border-bottom:1px solid var(--hi);
  padding:1px 3px;font:11px/15px var(--ui);color:#000;min-height:17px;width:100%;
  user-select:text;outline:0}
.ptxt:focus{box-shadow:inset 0 0 0 1px var(--navy)}
.pchk{display:inline-flex;align-items:center;gap:5px;font:11px/13px var(--ui);cursor:pointer}
.pchk i{width:11px;height:11px;flex:0 0 auto;background:var(--face);
  border-top:1px solid var(--sh);border-left:1px solid var(--sh);
  border-right:1px solid var(--hi);border-bottom:1px solid var(--hi);
  display:flex;align-items:center;justify-content:center;font-style:normal;
  font:700 9px/9px var(--mono);color:#000}
.prad i{border-radius:50%}
.pgrp{border:1px solid var(--sh);box-shadow:inset -1px -1px 0 var(--hi),1px 1px 0 var(--hi);
  margin:8px 4px 4px;padding:9px 8px 8px;position:relative}
.pgrp>.lg{position:absolute;top:-7px;left:7px;background:var(--face);padding:0 4px;
  font:11px/13px var(--ui)}
.psel{background:var(--face);border-top:1px solid var(--hi);border-left:1px solid var(--hi);
  border-right:1px solid var(--sh);border-bottom:1px solid var(--sh);
  padding:1px 18px 1px 4px;font:11px/15px var(--ui);position:relative;cursor:pointer;
  min-height:19px;display:flex;align-items:center}
.psel::after{content:"";position:absolute;right:4px;top:50%;margin-top:-2px;
  border:4px solid transparent;border-top-color:#000}
.plist{background:#fff;border-top:1px solid var(--sh);border-left:1px solid var(--sh);
  border-right:1px solid var(--hi);border-bottom:1px solid var(--hi);overflow:auto;
  font:11px/15px var(--ui)}
.plist .row{padding:0 4px;white-space:nowrap;cursor:pointer;display:flex;gap:6px}
.plist .row.sel{background:var(--navy);color:#fff}
.ptab{display:flex;gap:2px;padding:0 4px;margin-bottom:-1px;position:relative;z-index:2}
.ptab>div{padding:2px 12px 3px;font:11px/13px var(--ui);cursor:pointer;background:var(--face);
  border-top:1px solid var(--hi);border-left:1px solid var(--hi);border-right:1px solid var(--sh);
  border-bottom:1px solid var(--sh)}
.ptab>div.on{background:var(--face);border-bottom-color:var(--face);font-weight:700;
  padding-bottom:4px;margin-top:-1px}
.psep{height:1px;background:var(--sh);border-bottom:1px solid var(--hi);margin:5px 4px}
.pdiv{width:1px;background:var(--sh);border-right:1px solid var(--hi);margin:2px 3px}
.hdr{display:flex;flex:0 0 auto;font:700 11px/15px var(--ui);background:var(--face)}
.hdr>div{padding:1px 4px;overflow:hidden;white-space:nowrap;
  border-top:1px solid var(--hi);border-left:1px solid var(--hi);
  border-right:1px solid var(--sh);border-bottom:1px solid var(--sh);text-align:center}
.mono{font-family:var(--mono)}
.scr::-webkit-scrollbar{width:14px;height:14px}
.scr::-webkit-scrollbar-track{background:var(--face2)}
.scr::-webkit-scrollbar-thumb{background:var(--face);border-top:1px solid var(--hi);
  border-left:1px solid var(--hi);border-right:1px solid var(--sh);border-bottom:1px solid var(--sh)}
.scr{scrollbar-color:var(--face) var(--face2);scrollbar-width:thin}

/* ==========================================================================
   APPLICATION-SPECIFIC LOOKS
   ========================================================================== */
/* Voyager: round toolbar buttons with labels underneath, then the Site: field */
.vy-tools{flex:0 0 auto;background:var(--face2);border-bottom:1px solid var(--sh);
  display:flex;align-items:flex-start;padding:3px 5px 1px;gap:1px}
.vy-tool{width:52px;flex:0 0 auto;text-align:center;cursor:pointer;padding-bottom:1px}
.vy-tool .k{width:34px;height:34px;margin:0 auto;border-radius:50%;background:var(--face);
  border-top:1px solid var(--hi);border-left:1px solid var(--hi);
  border-right:1px solid var(--dk);border-bottom:1px solid var(--dk);
  display:flex;align-items:center;justify-content:center;box-shadow:inset -2px -2px 3px #0002}
.vy-tool.dis .k{opacity:.55}
.vy-tool.dis{color:var(--sh)}
.vy-tool:not(.dis):active .k{border-top-color:var(--dk);border-left-color:var(--dk);
  border-right-color:var(--hi);border-bottom-color:var(--hi)}
.vy-tool .t{font:10px/12px var(--ui);margin-top:1px}
.vy-mark{margin-left:auto;align-self:center;padding:0 4px 8px 0}
.vy-site{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:2px 5px;
  background:var(--face);border-bottom:1px solid var(--sh)}
.vy-site .lb{font:11px/15px var(--ui)}
.vy-page{flex:1 1 auto;overflow:auto;background:var(--face2);padding:6px;user-select:text}
.vy-canvas{background:#fff;min-height:100%;padding:9px 11px;font:13px/1.42 var(--ui);color:#000;
  border:1px solid var(--sh)}
.vy-status{flex:0 0 auto;height:16px;display:flex;gap:2px;font:10px/14px var(--ui);
  background:var(--face);border-top:1px solid var(--sh)}
.vy-status>div{padding:0 4px;overflow:hidden;white-space:nowrap;
  border-top:1px solid var(--hi);border-left:1px solid var(--hi);
  border-right:1px solid var(--sh);border-bottom:1px solid var(--sh)}
.vy-status>div:first-child{flex:1 1 auto}
.vy-status>div:nth-child(2){width:90px;flex:0 0 auto}

/* the rendered page: an original period style, not a copy of anyone's HTML */
.vp h1{font:800 20px/1.2 var(--ui);color:var(--pur);margin:2px 0 8px;text-align:center}
.vp h2{font:700 15px/1.25 var(--ui);margin:12px 0 5px}
.vp h3{font:700 13px/1.25 var(--ui);margin:10px 0 4px}
.vp p{margin:6px 0}
.vp ul{margin:6px 0 6px 20px}
.vp li{margin:2px 0}
.vp a{color:#0000c0;text-decoration:underline;cursor:pointer}
.vp a:visited{color:#339900}
.vp a.hot{color:#6699cc}
.vp hr{border:0;border-top:1px solid var(--sh);margin:9px 0}
.vp .band{background:var(--yel);padding:4px 8px;margin:0 0 10px;display:flex;align-items:center;
  gap:10px;border:1px solid #c0c000}
.vp .band b{font:700 13px/1 var(--ui)}
.vp .kick{font:800 26px/1.02 var(--ui);color:#7a7a7a;letter-spacing:-.02em}
.vp .kick i{font-style:normal;color:#000;display:block;font-size:31px}
.vp .bl{list-style:none;margin:8px 0 8px 4px}
.vp .bl li{padding-left:14px;position:relative;margin:4px 0}
.vp .bl li::before{content:"";position:absolute;left:0;top:4px;border:5px solid transparent;
  border-left-color:var(--yel);border-left-width:7px}
.vp table{border-collapse:collapse;margin:8px 0;font-size:12px}
.vp td,.vp th{border:1px solid var(--sh);padding:3px 6px;text-align:left;vertical-align:top}
.vp th{background:var(--face);font-weight:700}
.vp .tealbar{background:var(--teal);color:#fff;padding:3px 7px;font:700 13px/1.3 var(--ui)}
.vp .box{border:1px solid var(--sh);padding:7px 9px;margin:8px 0;background:#f4f4f4}

        <div id="tb-clock" class="bv-in"></div>

    </div>
  </div></div>

<button id="g-toggle">Museum notes</button>
<script>
"use strict";
/* ==========================================================================
   MODULE 0 — CONSTANTS AND SMALL UTILITIES
   --------------------------------------------------------------------------
   Numbers that came off the archived disk image are marked VERIFIED in the
   manifest; numbers we had to reconstruct are marked as such, everywhere,
   without exception. An exhibit about what fits on a floppy has no business
   being vague about bytes.
   ========================================================================== */
const FLOPPY_BYTES   = 1474560;          /* 2880 x 512, a 3.5" HD floppy      */
const IMG_SECTORS    = 2880;
const BOOTSECT_BYTES = 512;              /* block 0: BPB + Demodisk Loader    */
const LOADER_BYTES   = 2560;             /* blocks 1-5, measured by entropy   */
const PAYLOAD_BYTES  = FLOPPY_BYTES - BOOTSECT_BYTES - LOADER_BYTES; /* 1471488 */
const IMG_ENTROPY    = 7.993;            /* bits/byte over the whole image    */
const ZIP_BYTES      = 1451302;          /* the archive.org zip of the image  */
const SELF_BYTES_BAKED = +"/*SZ*/0402374";

const SCR_W = 640, SCR_H = 480;

const U = {
  $(s, r) { return (r || document).querySelector(s); },
  $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); },
  el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (attrs[k] === null || attrs[k] === undefined) continue;
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "style") n.setAttribute("style", attrs[k]);
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    for (const kid of kids.flat(9)) {
      if (kid === null || kid === undefined || kid === false) continue;
      n.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
    }
    return n;
  },
  /* an inline SVG icon, because no exhibit may load a file */
  ico(paths, o) {
    o = o || {};
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("width", o.w || 16); s.setAttribute("height", o.h || o.w || 16);
    s.setAttribute("viewBox", o.vb || "0 0 16 16");
    s.innerHTML = paths;
    return s;
  },
  n(v) { return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); },
  size(b) {
    if (b < 1024) return b + " B";
    if (b < 1024 * 1024) return (b / 1024).toFixed(b < 10240 ? 2 : 1) + " KB";
    return (b / 1048576).toFixed(2) + " MB";
  },
  kb(b) { return Math.round(b / 1024) + "k"; },
  pad(s, n, c) { s = String(s); c = c || " "; while (s.length < n) s = c + s; return s; },
  padr(s, n, c) { s = String(s); c = c || " "; while (s.length < n) s = s + c; return s; },
  ms(v) { return (v / 1000).toFixed(3) + "s"; },
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  },
  /* a deterministic generator: the exhibit must look the same twice */
  rng(seed) {
    let s = seed >>> 0 || 0x1a2b3c4d;
    return function () { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  },
  now() { return performance.now(); },
  /* QNX 4 dates in fbrowse are shown "Dec 31 19:00" style */
  fdate(t) {
    const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const d = new Date(t);
    return M[d.getMonth()] + " " + U.pad(d.getDate(), 2) + " " +
      U.pad(d.getHours(), 2, "0") + ":" + U.pad(d.getMinutes(), 2, "0");
  },
  hhmm(t) {
    const d = new Date(t);
    return U.pad(d.getHours(), 2, "0") + ":" + U.pad(d.getMinutes(), 2, "0");
  }
};
const $ = U.$, $$ = U.$$, el = U.el;
/* the toolkit clicks. One listener, at the top, rather than a hundred        */
document.addEventListener("mousedown", ev => {
  const t = ev.target;
  if (t && t.closest && (t.closest(".pbtn") || t.closest(".tbtn") || t.closest(".vy-tool") ||
    t.closest(".tb-btn"))) Sound.click();
}, true);

/* --- how big is this page? the one measurement an emulator cannot make --- */
const Exhibit = {
  _b: null, _how: "",
  bytes() {
    if (this._b !== null) return this._b;
    try {
      const nav = performance.getEntriesByType("navigation")[0];
      if (nav && nav.decodedBodySize > 8192) {
        this._how = "measured over the wire, decoded";
        return (this._b = nav.decodedBodySize);
      }
    } catch (e) { /* file:// has no navigation timing worth having */ }
    if (SELF_BYTES_BAKED > 8192) {
      this._how = "exact, as written to disk";
      return (this._b = SELF_BYTES_BAKED);
    }
    const s = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    this._how = "estimated from the live document";
    try { return (this._b = new Blob([s]).size); } catch (e) { return (this._b = s.length); }
  },
  how() { this.bytes(); return this._how; },
  ratio() { return FLOPPY_BYTES / this.bytes(); }
};

/* ==========================================================================
   MODULE 1 — THE MICROKERNEL
   --------------------------------------------------------------------------
   QNX 4's kernel does four things and nothing else: message passing, proxies
   and signals; low-level network message delivery; process scheduling; and
   first-level interrupt dispatch. Fourteen kernel calls. Dan Hildebrand's
   1992 architecture paper puts the whole thing at "roughly 7K of code" and
   notes that it fits, with the interrupt handlers, inside an 8K on-chip
   cache. Everything below this module is an ordinary process.

   The primitives are synchronous, and the blocking states are the interesting
   part, so they are modelled properly:
       Send()     -> SEND-blocked  until the receiver Receive()s
                  -> REPLY-blocked until the receiver Reply()s
       Receive()  -> RECV-blocked  until a message arrives
       Reply()    -> never blocks
   State names are the ones sin(1) prints: READY SEND REPLY RECV WAIT HELD
   DEAD SIGBL SEM.
   ========================================================================== */
const K = {
  procs: new Map(),        /* pid -> process */
  names: new Map(),        /* "node,name" -> pid, for qnx_name_attach()      */
  nextPid: 1,
  ticks: 0,
  running: false,
  clockTick: 0,
  taps: [],                /* the tracer taps here. no server knows about it */
  msgSeq: 0,
  stats: { sends: 0, recvs: 0, replies: 0, trigs: 0, switches: 0, bytes: 0 },

  KERNEL_CODE: 7 * 1024,   /* Hildebrand 1992: "roughly 7K of code"          */
  KERNEL_CALLS: 14,

  reset() {
    this.procs.clear(); this.names.clear();
    this.nextPid = 1; this.ticks = 0; this.msgSeq = 0;
    this.stats = { sends: 0, recvs: 0, replies: 0, trigs: 0, switches: 0, bytes: 0 };
  },

  /* --- the process table ------------------------------------------------- */
  create(o) {
    const p = {
      pid: o.pid || this.nextPid++,
      name: o.name,                     /* as sin(1) prints it               */
      node: o.node === undefined ? 1 : o.node,
      prio: o.prio === undefined ? 10 : o.prio,
      basePrio: o.prio === undefined ? 10 : o.prio,
      sched: o.sched || "o",            /* f FIFO, r round-robin, o adaptive */
      /* a process with a Receive() loop begins life blocked in it          */
      state: o.onMsg ? "RECV" : "READY",
      blk: 0,                           /* pid we are blocked on             */
      code: o.code || 4096,             /* CODE column in sin                */
      data: o.data || 4096,             /* DATA column                       */
      sys: !!o.sys,
      kind: o.kind || "app",            /* kernel|manager|driver|gui|app     */
      parent: o.parent || 1,
      sid: o.sid === undefined ? 1 : o.sid,
      onMsg: o.onMsg || null,           /* Receive() handler                 */
      onProxy: o.onProxy || null,
      onSignal: o.onSignal || null,
      onDeath: o.onDeath || null,       /* called when slain                 */
      queue: [],                        /* messages waiting to be Receive()d */
      pending: new Map(),               /* msgid -> resolver, REPLY-blocked  */
      proxies: [],
      cpu: 0, msgs: 0, born: Date.now(),
      flags: o.flags || "",
      floats: !!o.floats,               /* _PPF_PRIORITY_FLOAT               */
      persistent: !!o.persistent,       /* Proc and the kernel cannot be slain */
      desc: o.desc || "",
      exe: o.exe || o.name
    };
    if (this.nextPid <= p.pid) this.nextPid = p.pid + 1;
    this.procs.set(p.pid, p);
    this.emit({ op: "SPAWN", from: p.parent, to: p.pid, note: p.name });
    Registry.notify();
    return p;
  },
  get(pid) { return this.procs.get(pid); },
  byName(name, node) {
    node = node === undefined ? 1 : node;
    const pid = this.names.get(node + "," + name);
    return pid ? this.procs.get(pid) : null;
  },
  nameAttach(pid, name) {
    const p = this.get(pid); if (!p) return -1;
    this.names.set(p.node + "," + name, pid);
    return 0;
  },
  nameLocate(name, node) {
    node = node === undefined ? 1 : node;
    const p = this.byName(name, node);
    if (!p) return 0;
    if (node !== 1) VC.create(node, p.pid);
    return p.pid;
  },
  list() {
    return Array.from(this.procs.values()).sort((a, b) => a.pid - b.pid);
  },

  /* --- taps: the tracer, and anything else that wants to watch ----------- */
  tap(fn) { this.taps.push(fn); return () => { this.taps = this.taps.filter(f => f !== fn); }; },
  emit(ev) {
    ev.seq = ++this.msgSeq;
    ev.t = U.now();
    for (const f of this.taps) { try { f(ev); } catch (e) { /* a tap must never break the kernel */ } }
  },

  /* --- Send(): synchronous, and it blocks, which is the whole point ------ */
  Send(fromPid, toPid, msg) {
    const from = this.get(fromPid), to = this.get(toPid);
    if (!to || to.state === "DEAD") {
      /* what a client sees when its server is gone: the VC is dismantled    */
      this.emit({ op: "FAIL", from: fromPid, to: toPid, note: "ESRCH — no such process" });
      return Promise.reject({ errno: "ESRCH", msg: "Send to a process that is not there" });
    }
    this.stats.sends++;
    this.stats.bytes += (msg && msg.len) || 64;
    const code = (msg && msg.code) || 0x0100;
    if (from) { from.state = "SEND"; from.blk = toPid; }
    this.emit({
      op: "SEND", from: fromPid, to: toPid, code: code,
      note: (msg && msg.what) || this.codeName(code), len: (msg && msg.len) || 64
    });
    Registry.notify();
    return new Promise((resolve, reject) => {
      to.queue.push({ from: fromPid, msg: msg, resolve: resolve, reject: reject, code: code });
      this.pump(to);
    });
  },

  /* the server side of the loop: Receive(), work, Reply() ----------------- */
  pump(to) {
    if (to.busy || to.state === "DEAD" || !to.queue.length) return;
    const job = to.queue.shift();
    const from = this.get(job.from);
    to.busy = true; to.msgs++;
    /* client-driven priority: the server runs at the client's priority so a
       low-priority client cannot make a high-priority server hold the CPU   */
    let restore = null;
    if (to.floats && from && from.prio > to.prio) { restore = to.prio; to.prio = from.prio; }
    if (from && from.state === "SEND") { from.state = "REPLY"; from.blk = to.pid; }
    to.state = "READY";
    this.stats.recvs++; this.stats.switches++;
    this.emit({
      op: "RECV", from: job.from, to: to.pid, code: job.code,
      note: (job.msg && job.msg.what) || this.codeName(job.code)
    });
    Registry.notify();
    const finish = (rep, isErr) => {
      to.busy = false;
      if (restore !== null) to.prio = restore;
      this.stats.replies++;
      if (to.state !== "DEAD") to.state = to.queue.length ? "READY" : "RECV";
      if (from && from.state === "REPLY") { from.state = "READY"; from.blk = 0; }
      this.emit({
        op: isErr ? "SIG" : "REPLY", from: to.pid, to: job.from, code: job.code,
        note: isErr ? String(rep && rep.errno || rep) : ((rep && rep.what) || "status 0"),
        len: (rep && rep.len) || 32
      });
      Registry.notify();
      if (isErr) job.reject(rep); else job.resolve(rep);
      this.pump(to);
    };
    let out;
    try {
      out = to.onMsg ? to.onMsg(job.msg, job.from, to) : { ok: true };
    } catch (e) { finish(e, true); return; }
    if (out && typeof out.then === "function") out.then(r => finish(r, false), e => finish(e, true));
    else finish(out, false);
  },

  /* --- proxies: a fixed message, no blocking, triggered by anyone -------- */
  proxyAttach(pid, note) {
    const p = this.get(pid); if (!p) return 0;
    const px = { pid: this.nextPid++, owner: pid, note: note || "proxy", queued: 0 };
    p.proxies.push(px);
    return px.pid;
  },
  Trigger(fromPid, proxyPid) {
    for (const p of this.procs.values()) {
      const px = p.proxies.find(x => x.pid === proxyPid);
      if (!px) continue;
      px.queued++;
      this.stats.trigs++;
      this.emit({ op: "TRIG", from: fromPid, to: p.pid, note: px.note + " (proxy " + proxyPid + ")" });
      if (p.onProxy) { try { p.onProxy(px); } catch (e) { } }
      return 0;
    }
    return -1;
  },

  /* --- signals: kill(), and slay(1) which is how a QNX person spells it -- */
  signal(fromPid, toPid, sig) {
    const p = this.get(toPid);
    if (!p) return -1;
    this.emit({ op: "SIG", from: fromPid, to: toPid, note: sig });
    if (sig === "SIGSTOP") { p.state = "HELD"; Registry.notify(); return 0; }
    if (sig === "SIGCONT") { if (p.state === "HELD") p.state = "RECV"; Registry.notify(); return 0; }
    if (p.persistent && (sig === "SIGTERM" || sig === "SIGKILL")) {
      this.emit({ op: "FAIL", from: fromPid, to: toPid, note: "protected by qnx_pflags() — signal ignored" });
      return -2;
    }
    if (sig === "SIGTERM" || sig === "SIGKILL") { this.kill(toPid); return 0; }
    if (p.onSignal) try { p.onSignal(sig); } catch (e) { }
    return 0;
  },

  kill(pid) {
    const p = this.get(pid); if (!p) return;
    p.state = "DEAD";
    /* everyone Send-blocked or Reply-blocked on this process is released with
       an error: this is what "fails cleanly rather than panicking" means     */
    for (const q of p.queue) q.reject({ errno: "ESRCH", msg: p.name + " died holding the message" });
    p.queue.length = 0;
    for (const other of this.procs.values()) {
      if (other.blk === pid && (other.state === "SEND" || other.state === "REPLY")) {
        other.state = "READY"; other.blk = 0;
      }
    }
    if (p.onDeath) { try { p.onDeath(); } catch (e) { } }
    for (const [k, v] of Array.from(this.names.entries())) if (v === pid) this.names.delete(k);
    this.procs.delete(pid);
    this.emit({ op: "DEATH", from: 1, to: pid, note: p.name + " terminated" });
    Registry.notify();
  },

  codeName(code) {
    if (code < 0x0100) return "Proc msg 0x" + code.toString(16);
    if (code < 0x0200) return "I/O msg 0x" + code.toString(16);
    if (code < 0x0300) return "Fsys msg 0x" + code.toString(16);
    if (code < 0x0400) return "Dev msg 0x" + code.toString(16);
    if (code < 0x0500) return "Net msg 0x" + code.toString(16);
    return "msg 0x" + code.toString(16);
  },
  /* the reserved ranges are real: sysarch, "Reserved message codes"        */
  RANGES: [
    [0x0000, 0x00ff, "Process Manager"],
    [0x0100, 0x01ff, "I/O (common to all I/O servers)"],
    [0x0200, 0x02ff, "Filesystem Manager"],
    [0x0300, 0x03ff, "Device Manager"],
    [0x0400, 0x04ff, "Network Manager"],
    [0x0500, 0x0fff, "reserved for future QNX system processes"]
  ]
};

/* Message codes this simulation actually uses, inside QNX's own ranges.     */
const MSG = {
  PROC_SPAWN: 0x0011, PROC_NAME_ATTACH: 0x0021, PROC_NAME_LOCATE: 0x0022,
  PROC_VC_CREATE: 0x0031, PROC_SEGMENT: 0x0041, PROC_SIGNAL: 0x0051,
  IO_OPEN: 0x0101, IO_READ: 0x0102, IO_WRITE: 0x0103, IO_CLOSE: 0x0104,
  IO_STAT: 0x0105, IO_LSEEK: 0x0106, IO_READDIR: 0x0107, IO_CHMOD: 0x0108,
  FSYS_BLOCK_READ: 0x0201, FSYS_BLOCK_WRITE: 0x0202, FSYS_MOUNT: 0x0203,
  FSYS_DFREE: 0x0204,
  DEV_TCGETATTR: 0x0301, DEV_TCSETATTR: 0x0302, DEV_INSERT: 0x0303,
  DEV_READ: 0x0304, DEV_WRITE: 0x0305,
  NET_TX: 0x0401, NET_RX: 0x0402, NET_VC: 0x0403, NET_ARP: 0x0404
};

/* ==========================================================================
   MODULE 2 — PROCESS REGISTRY
   --------------------------------------------------------------------------
   Every service below registers here and nowhere else. Nothing in this file
   reaches into another process's state: it sends it a message. The structural
   test for the whole exhibit is that a process module can be deleted from the
   running simulation and only its own clients break.
   ========================================================================== */
const Registry = {
  subs: [],
  dirty: false,
  sub(fn) { this.subs.push(fn); return () => { this.subs = this.subs.filter(f => f !== fn); }; },
  notify() {
    if (this.dirty) return;
    this.dirty = true;
    requestAnimationFrame(() => {
      this.dirty = false;
      for (const f of this.subs) { try { f(); } catch (e) { } }
    });
  }
};

/* ==========================================================================
   MODULE 3 — VIRTUAL CIRCUITS (what makes //2/ work)
   --------------------------------------------------------------------------
   A VC binds a local VID to a remote pid. To the process at either end the
   VID looks exactly like an ordinary local process, which is the entire trick
   of transparent distributed processing: there is no network Send().
   ========================================================================== */
const VC = {
  list: [],
  create(node, remotePid, label) {
    const found = this.list.find(v => v.node === node && v.remote === remotePid);
    if (found) { found.stamp = Date.now(); return found; }
    const v = {
      vid: K.nextPid++, node: node, remote: remotePid, stamp: Date.now(),
      label: label || ("node " + node), bytes: 0, ok: true
    };
    this.list.push(v);
    K.emit({ op: "VC", from: 1, to: v.vid, note: "virtual circuit to //" + node + "/ pid " + remotePid });
    return v;
  },
  dismantle(node) {
    const gone = this.list.filter(v => v.node === node);
    this.list = this.list.filter(v => v.node !== node);
    for (const v of gone) K.emit({ op: "VC", from: 1, to: v.vid, note: "VC to node " + node + " dismantled" });
    return gone.length;
  },
  reset() { this.list.length = 0; }
};

/* ==========================================================================
   MODULE 4 — THE MESSAGE TRACER (a tap, nothing more)
   --------------------------------------------------------------------------
   This module knows nothing about filesystems, browsers or drivers. It sees
   the same four things the kernel sees — who sent, who received, who replied,
   who triggered — and reconstructs the conversation from the blocking states
   alone. No server in this file has a line of code that reports to it.
   ========================================================================== */
const Tracer = {
  log: [],            /* the raw event stream, newest last                   */
  chains: new Map(),  /* chain id -> {label, root, hops[], t0, t1, done}     */
  curChain: new Map(),/* pid -> chain id it is currently serving             */
  pend: new Map(),    /* "from>to" -> chain id, for the matching RECV        */
  nextChain: 1,
  cap: 900,
  paused: false,
  filter: null,       /* a pid, or null for everything                       */
  views: [],
  recent: [],         /* chain ids, newest first, for the chain viewer       */

  start() { K.tap(ev => this.take(ev)); },

  take(ev) {
    if (this.paused) return;
    const key = ev.from + ">" + ev.to;
    let chain = null;
    if (ev.op === "SEND") {
      chain = this.curChain.get(ev.from);
      if (chain === undefined) {
        chain = this.nextChain++;
        const p = K.get(ev.from);
        this.chains.set(chain, {
          id: chain, label: ev.note || "message", root: ev.from,
          rootName: p ? p.name : ("pid " + ev.from), hops: [], t0: ev.t, t1: ev.t, done: false
        });
        this.recent.unshift(chain);
        if (this.recent.length > 40) {
          const drop = this.recent.pop(); this.chains.delete(drop);
        }
      }
      this.pend.set(key, chain);
      const c = this.chains.get(chain);
      if (c) {
        c.hops.push({ op: "SEND", from: ev.from, to: ev.to, note: ev.note, t: ev.t, code: ev.code });
        c.t1 = ev.t;
      }
    } else if (ev.op === "RECV") {
      chain = this.pend.get(key);
      if (chain !== undefined) this.curChain.set(ev.to, chain);
      const c = this.chains.get(chain);
      if (c) { c.hops.push({ op: "RECV", from: ev.from, to: ev.to, note: ev.note, t: ev.t }); c.t1 = ev.t; }
    } else if (ev.op === "REPLY" || ev.op === "FAIL") {
      chain = this.curChain.get(ev.from);
      this.curChain.delete(ev.from);
      this.pend.delete(ev.to + ">" + ev.from);
      const c = this.chains.get(chain);
      if (c) {
        c.hops.push({ op: ev.op, from: ev.from, to: ev.to, note: ev.note, t: ev.t });
        c.t1 = ev.t;
        if (c.root === ev.to) c.done = true;
      }
    } else {
      chain = this.curChain.get(ev.from);
    }
    ev.chain = chain === undefined ? null : chain;
    this.log.push(ev);
    if (this.log.length > this.cap) this.log.splice(0, this.log.length - this.cap);
    for (const v of this.views) { try { v(ev); } catch (e) { } }
  },

  clear() { this.log.length = 0; this.chains.clear(); this.recent.length = 0; },
  lastChain() {
    for (const id of this.recent) { const c = this.chains.get(id); if (c && c.hops.length > 2) return c; }
    return this.chains.get(this.recent[0]) || null;
  },
  view(fn) { this.views.push(fn); return () => { this.views = this.views.filter(f => f !== fn); }; }
};

const FS = {
  nodes: new Map(),
  T0: Date.UTC(1999, 11, 31, 19, 0, 0),

  dir(p, size, mt) { this.nodes.set(p, { t: "d", size: size || 512, mtime: mt || this.T0 }); },
  file(p, size, text, opt) {
    opt = opt || {};

      t: "f", size: text !== null && text !== undefined ? Math.max(size || 0, text.length) : (size || 0),
      text: text === undefined ? null : text, mtime: opt.mtime || this.T0,
      exe: !!opt.exe, ro: opt.ro !== false, kind: opt.kind || "data"
    });
  },
  chr(p, note) { this.nodes.set(p, { t: "c", size: 0, mtime: this.T0, note: note || "" }); },

  build(variant) {

    this.dir("/Resources", 1024);
    this.dir("/dev", 8);
    this.dir("/etc", 1024);
    this.dir("/tmp", 1024);
    this.dir("/usr", 420);
    this.dir("/xip", 63);
    this.dir("/tmp_ram", 0);
    this.dir("/etc/config");
    this.dir("/usr/httpd");
    this.dir("/usr/httpd/images");
    this.dir("/usr/httpd/hanoi");
    this.dir("/usr/httpd/.photon");
    this.dir("/usr/httpd/.photon/pwm");


    for (const m of DISK.modules) {

      if (m.p.indexOf("/boot/") === 0) continue;

    this.file("/usr/httpd/Dns.html", 7800, null, { kind: "data" });
    this.file("/usr/httpd/hanoi/game.html", 11000, null, { kind: "data" });
    this.file("/usr/httpd/images/disk.gif", 5200, null, { kind: "data" });
    this.file("/Resources/latin1.pfr", 52000, null, { kind: "data" });

    /* /dev is Dev's namespace, mounted into the path space like everything else */

    this.chr("/dev/con3", "virtual console 3"); this.chr("/dev/con4", "virtual console 4");
    this.chr("/dev/ser1", "COM1, 8250/16550");
    this.chr("/dev/ser2", "COM2, 8250/16550");
    this.chr("/dev/null", ""); this.chr("/dev/zero", "");

  },

  norm(p, cwd) {
    p = String(p || "");
    if (p[0] !== "/") p = (cwd || "/") + (cwd && cwd !== "/" ? "/" : "") + p;
    const parts = [];
    for (const seg of p.split("/")) {
      if (!seg || seg === ".") continue;
      if (seg === "..") { parts.pop(); continue; }
      parts.push(seg);
    }
    return "/" + parts.join("/");
  },
  get(p) { return this.nodes.get(this.norm(p)) || null; },
  isDir(p) { const n = this.get(p); return !!n && n.t === "d"; },
  ls(p) {
    p = this.norm(p);
    const pre = p === "/" ? "/" : p + "/";
    const out = [];
    for (const [k, v] of this.nodes) {
      if (k === p || k.indexOf(pre) !== 0) continue;
      if (k.slice(pre.length).indexOf("/") >= 0) continue;
      out.push({ path: k, name: k.slice(pre.length), node: v });
    }
    /* byte order, not locale order: Resources comes before dev, exactly as
       the archived File Browser screenshot shows it                        */
    out.sort((a, b) => (a.node.t === b.node.t
      ? (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)
      : a.node.t === "d" ? -1 : 1));
    return out;
  },
  /* a file with no stored text is a binary: say so rather than invent one   */
  read(p) {
    const n = this.get(p);
    if (!n) return { err: "ENOENT" };
    if (n.t === "d") return { err: "EISDIR" };
    if (n.text === null || n.text === undefined) {
      return {
        bin: true, size: n.size, text:
          "This file is " + U.n(n.size) + " bytes of " +
          (n.exe ? "QNX 4 x86 executable" : "binary data") + ".\n\n" +
          "The museum has no copy of its contents to show you, and inventing\n" +
          "one would be worse than saying so. What is real is the name, the\n" +
          "role, and — for everything in /xip — that it ran in place, out of\n" +
          "the image the loader unpacked into RAM.\n"
      };
    }
    return { text: n.text, size: n.text.length };
  },
  write(p, text) {
    p = this.norm(p);
    const n = this.nodes.get(p);
    if (n && n.ro) return { err: "EROFS" };
    const par = p.slice(0, p.lastIndexOf("/")) || "/";
    if (!this.isDir(par)) return { err: "ENOENT" };
    this.nodes.set(p, { t: "f", size: text.length, text: text, mtime: Date.now(), ro: false, kind: "data" });
    State.save();
    return { size: text.length };
  },
  mkdir(p) {
    p = this.norm(p);
    if (this.nodes.has(p)) return { err: "EEXIST" };
    const par = p.slice(0, p.lastIndexOf("/")) || "/";
    if (!this.isDir(par)) return { err: "ENOENT" };
    this.nodes.set(p, { t: "d", size: 512, mtime: Date.now() });
    State.save(); return { ok: 1 };
  },
  unlink(p) {
    p = this.norm(p);
    const n = this.nodes.get(p);
    if (!n) return { err: "ENOENT" };
    if (n.ro) return { err: "EROFS" };
    if (n.t === "d" && this.ls(p).length) return { err: "ENOTEMPTY" };
    this.nodes.delete(p); State.save(); return { ok: 1 };
  },
  used() {
    let b = 0;
    for (const [, v] of this.nodes) if (v.t === "f") b += v.size;
    return b;
  },
  /* what a writable file looks like after a reload                         */
  overlay() {
    const o = {};
    for (const [k, v] of this.nodes) if (v.t === "f" && !v.ro && v.text !== null) o[k] = v.text;
    return o;
  },
  applyOverlay(o) {
    for (const k in o) {
      const n = this.nodes.get(k);
      this.nodes.set(k, { t: "f", size: o[k].length, text: o[k], mtime: (n && n.mtime) || Date.now(), ro: false, kind: "data" });
    }
  }
};
