const FBrowse = {
  async paint(w) {
    const tv = w.tv;
    tv.innerHTML = "";
    const rows = [];
    const add = async (path, depth) => {
      const entries = await IO.readdir(w.pid, path).catch(() => []);
      for (const e of entries) {
        const isDir = e.node.t === "d";
        rows.push({ path: e.path, name: e.name, node: e.node, depth: depth, dir: isDir });
        if (isDir && w.st.open[e.path]) await add(e.path, depth + 1);
      }
    };
    rows.push({ path: "/", name: "/", node: FS.get("/"), depth: 0, dir: true });
    if (w.st.open["/"]) await add("/", 1);
    if (w.st.open["//2"]) {
      rows.push({ path: "//2", name: "//2/  (node 2, over the network)", node: { t: "d", size: 0, mtime: Date.now() }, depth: 0, dir: true });
      const ents = await IO.readdir(w.pid, "//2/").catch(() => []);
      for (const e of ents) rows.push({ path: "//2" + e.path, name: e.name, node: e.node, depth: 1, dir: e.node.t === "d" });
    }
    for (const r of rows) {
      const row = el("div", { class: "r" + (w.st.sel === r.path ? " sel" : "") });
      for (let i = 0; i < r.depth; i++) row.appendChild(el("div", { class: "sp" }));
      if (r.dir) {
        const tw = el("div", { class: "tw", text: w.st.open[r.path] ? "−" : "+" });
        tw.addEventListener("click", ev => {
          ev.stopPropagation();
          w.st.open[r.path] = !w.st.open[r.path];
          Sound.click(); this.paint(w);
        });
        row.appendChild(tw);
      } else row.appendChild(el("div", { class: "sp" }));
      row.appendChild(Icons.appIcon(r.dir ? "folder" : (r.node.t === "c" ? "gear" : (r.node.exe ? "app" : "note"))));
      row.appendChild(el("div", { class: "nm", text: " " + r.name }));
      row.appendChild(el("div", { class: "sz", text: r.dir ? this.dsize(r.node.size) : this.fsize(r.node.size) }));
      row.appendChild(el("div", { class: "dt", text: U.fdate(r.node.mtime) }));
      row.addEventListener("click", () => { w.st.sel = r.path; this.paint(w); });
      row.addEventListener("dblclick", () => { w.st.sel = r.path; this.openSel(w); });
      tv.appendChild(row);
    }
    w.st.rows = rows;
  },
  dsize(s) { return s >= 1024 ? Math.round(s / 1024) + "k" : String(s); },
  fsize(s) { return s >= 1024 ? Math.round(s / 1024) + "k" : String(s); },
  openSel(w) {
    const p = w.st.sel;
    const n = FS.get(p);
    if (!n) return;
    if (n.t === "d") { w.st.open[p] = !w.st.open[p]; this.paint(w); return; }
    if (/\.html?$/.test(p)) {
      const url = p.indexOf("/usr/httpd") === 0 ? "http://127.1" + p.slice(10) : null;
      if (url) { PWM.launch("voyager", { url: url }); return; }
    }
    PWM.launch("note", { path: p });
  },
  async mkdir(w) {
    const base = FS.isDir(w.st.sel) ? w.st.sel : w.st.sel.replace(/\/[^\/]*$/, "");
    const name = await Dialog.prompt("New Folder", "Create a directory in " + base + ":", "newdir");
    if (!name) return;
    const r = FS.mkdir(FS.norm(base + "/" + name));
    if (r.err) Dialog.alert("File Browser", r.err + ": cannot create " + name);
    this.paint(w);
  },
  async rm(w) {
    if (!(await Dialog.confirm("File Browser", "Delete " + w.st.sel + "?"))) return;
    const r = FS.unlink(w.st.sel);
    if (r.err) Dialog.alert("File Browser",
      r.err === "EROFS" ? "That file came off the disk image. It is not yours to delete."
        : r.err + ": cannot delete");
    this.paint(w);
  }
};

/* ==========================================================================
   MODULE 21 — DIALOGS
   --------------------------------------------------------------------------
   A Photon dialog is a window like any other: a region, in the same event
   space, owned by the same process. It is modal only because the application
   chooses to ignore everything else until it answers.
   ========================================================================== */
const Dialog = {
  open(title, bodyFn, buttons, opt) {
    opt = opt || {};
    return new Promise(resolve => {
      const w = Math.min(opt.w || 320, SCR_W - 20), h = opt.h || 140;
      const x = Math.round((SCR_W - w) / 2), y = Math.round((SCR_H - 24 - h) / 2);
      const tt = el("div", { class: "win-tt" },
        el("div", { class: "tbtn" }, U.ico('<path d="M4 6l4 5 4-5z" fill="#000"/>', { w: 13, h: 13 })),
        el("div", { class: "cap", text: title }),
        el("div", { class: "tbtn", onclick: () => done(null) },
          U.ico('<path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="#000" stroke-width="1.6" fill="none"/>', { w: 13, h: 13 })));
      const body = el("div", { class: "win-body" });
      const box = el("div", { class: "win act", style: "left:" + x + "px;top:" + y + "px;width:" + w +
        "px;height:" + h + "px;z-index:9700" }, tt, body);
      const content = el("div", { class: "pad grow", style: "font:11px/15px var(--ui)" });
      const row = el("div", { class: "flexrow", style: "justify-content:flex-end;padding:5px 7px;gap:7px" });
      body.appendChild(content); body.appendChild(row);
      const done = v => { if (box.parentNode) box.parentNode.removeChild(box); resolve(v); };
      const api = { content: content, done: done, box: box };
      if (bodyFn) bodyFn(api);
      for (const b of buttons) {
        row.appendChild(el("button", { class: "pbtn" + (b.dflt ? " dflt" : ""),
          onclick: () => { Sound.click(); done(b.v === undefined ? b.t : (typeof b.v === "function" ? b.v(api) : b.v)); } }, b.t));
      }
      $("#wins").appendChild(box);
      const f = content.querySelector("input");
      if (f) { f.focus(); f.select(); }
      box.addEventListener("keydown", ev => {
        if (ev.key === "Escape") { ev.stopPropagation(); done(null); }
        if (ev.key === "Enter") {
          const d = buttons.find(b => b.dflt);
          if (d) { ev.stopPropagation(); done(d.v === undefined ? d.t : (typeof d.v === "function" ? d.v(api) : d.v)); }
        }
      });
    });
  },
  alert(title, msg) {
    Sound.bell();
    return this.open(title, api => api.content.appendChild(el("div", { text: msg })),
      [{ t: "Ok", dflt: 1, v: true }]);
  },
  confirm(title, msg) {
    return this.open(title, api => api.content.appendChild(el("div", { text: msg })),
      [{ t: "Ok", dflt: 1, v: true }, { t: "Cancel", v: false }]);
  },
  prompt(title, msg, def) {
    return this.open(title, api => {
      api.content.appendChild(el("div", { text: msg, style: "margin-bottom:6px" }));
      api.content.appendChild(el("input", { class: "ptxt", value: def || "" }));
    }, [{ t: "Ok", dflt: 1, v: api => api.content.querySelector("input").value }, { t: "Cancel", v: null }],
      { h: 132 });
  }
};

const Note = {
  retitle(w) {
    const p = w.st.path;
    w.setTitle((w.st.dirty ? "* " : "") + (p ? "//0" + p : "untitled") );
  },
  async load(w, path, text) {
    if (path === null) { w.ta.textContent = text || ""; w.st.path = null; w.st.dirty = false; this.retitle(w); return; }
    try {
      const r = await IO.slurp(w.pid, path);
      w.ta.textContent = r.text || "";
      w.st.path = path; w.st.dirty = false;
      this.retitle(w);
    } catch (e) {
      w.ta.textContent = "";
      Dialog.alert("Note Pad", (e.errno || "error") + ": " + path);
    }
  },
  async viewSource(w, url) {
    w.st.path = null; w.st.dirty = false;
    const page = Web.get(url);
    const src = "<!-- " + url + " -->\n" +
      "<html>\n<head>\n<title>" + (page ? page.title : "Document") + "</title>\n</head>\n" +
      "<body bgcolor=\"#FFFFFF\" link=\"#6699CC\" vlink=\"#339900\">\n" +
      "<!--\n" +
      "  Voyager's View Source shows you the document it was given. This\n" +
      "  exhibit builds its pages as objects rather than as text, so what you\n" +
      "  are reading is a faithful skeleton rather than the exact bytes: the\n" +
      "  museum will not pretend to a byte it does not have.\n" +
      "-->\n" +
      "<table border=0 cellpadding=7 cellspacing=0 width=\"100%\">\n" +
      "<tr><td bgcolor=\"#FFFF00\"><b>Build a more reliable world</b></td></tr>\n" +
      "</table>\n" +
      "<h2>" + (page ? page.title : "") + "</h2>\n" +

  async find(w, again) {
    const q = again ? this._q : await Dialog.prompt("Find", "Find what?", this._q || "");
    if (!q) return;
    this._q = q;
    const i = w.ta.textContent.indexOf(q);

};

const Dialer = {
  async dial(w, number, say) {
    const ser = K.byName("Dev.ser");
    if (!ser) { say("Dev.ser is not running. Nothing to dial with."); return; }
    Modem.state = "dialing";
    const send = async (s, note) => {
      const dev = K.byName("Dev");
      if (!dev) return;
      await K.Send(w.pid, dev.pid, {
        code: MSG.IO_WRITE, path: "/dev/ser1", text: s, what: note || ("write \"" + s.replace(/\r/g, "") + "\" to /dev/ser1")
      }).catch(() => { });
    };
    say("ATZ"); await send("ATZ\r"); await this.wait(320); say("OK");
    say("ATDT" + number); Sound.dtmf(number.replace(/\D/g, "").slice(0, 11));
    await send("ATDT" + number + "\r");
    await this.wait(1400);
    say("RINGING");
    await this.wait(900);
    Modem.state = "handshake";
    say("CARRIER 33600"); Sound.handshake();
    await this.wait(2600);
    say("PROTOCOL: LAP-M");
    say("CONNECT 33600/ARQ/V34/LAPM/V42BIS");
    await this.wait(600);
    const ppp = K.byName("pppd");
    if (ppp) {
      say("pppd: LCP up");
      await K.Send(w.pid, ppp.pid, { code: MSG.NET_TX, what: "LCP ConfReq", len: 44 }).catch(() => { });
      say("pppd: CHAP authentication ok");
      await K.Send(w.pid, ppp.pid, { code: MSG.NET_TX, what: "CHAP response", len: 52 }).catch(() => { });
      say("pppd: IPCP up, local 198.53.144.87");
    }
    Net.ip = "198.53.144.87"; Net.mask = "255.255.255.0"; Net.gw = "198.53.144.1";
    Net.dns = "198.53.144.1"; Net.media = "ppp"; Net.up = true; Modem.state = "up";
    Net.nodes[0].ip = Net.ip;
    say("Connected. 198.53.144.87");
    Toast.show("PPP is up. Voyager can leave 127.1 now.");
    State.save();
  },
  hangup(w, say) {
    Modem.state = "idle"; Net.up = false; Net.media = "none"; Net.ip = "0.0.0.0";
    say("ATH0"); say("NO CARRIER");
    Toast.show("Hung up. Whoever was waiting for the phone can have it back.");
  },
  wait(ms) { return new Promise(r => setTimeout(r, ms)); }
};

/* ==========================================================================
   MODULE 25 — cool: "QNX is Cool!", the Vector Animation window
   --------------------------------------------------------------------------
   Contemporary write-ups all mention the same thing about this toy: you could
   open several of them and they all kept running smoothly. That was the
   point. Each one is a process at priority 10 doing floating-point work in a
   loop, and the machine stayed responsive because the scheduler is
   preemptive and priority-driven, not because the toy was polite.
   ========================================================================== */
defApp("cool", {
  title: "Vector Animation", w: 316, h: 232, exe: "cool", icon: "cool",
  code: 19000, data: 14000, single: false, help: "realtime",
  desc: "\"QNX is Cool!\" — vector text, rotating, forever. Open four of them and watch the latency demonstration keep its deadline anyway.",
  init(w) {
    const cv = el("canvas", { width: 300, height: 190, style: "display:block;width:100%;height:100%;background:#000;image-rendering:pixelated" });
    w.body.appendChild(el("div", { class: "grow", style: "background:#000;overflow:hidden" }, cv));
    const st = { t: 0, cv: cv };
    w.st = st;
    /* a five-segment stroke alphabet, only the letters this demo needs      */
    const G = {
      Q: [[1,0,3,0],[3,0,4,2.5],[4,2.5,3,5],[3,5,1,5],[1,5,0,2.5],[0,2.5,1,0],[2.6,3.4,4.4,5.6]],
      N: [[0,5,0,0],[0,0,4,5],[4,5,4,0]],
      X: [[0,0,4,5],[4,0,0,5]],
      I: [[2,0,2,5],[0.6,0,3.4,0],[0.6,5,3.4,5]],
      S: [[4,0.7,1,0],[1,0,0,1.4],[0,1.4,1.2,2.4],[1.2,2.4,3,2.7],[3,2.7,4,3.7],[4,3.7,3,5],[3,5,0,4.3]],
      C: [[4,0.6,1,0],[1,0,0,2.5],[0,2.5,1,5],[1,5,4,4.4]],
      O: [[1,0,3,0],[3,0,4,2.5],[4,2.5,3,5],[3,5,1,5],[1,5,0,2.5],[0,2.5,1,0]],
      L: [[0,0,0,5],[0,5,4,5]],
      "!": [[2,0,2,3.4],[2,4.4,2,5]],
      " ": []
    };
    const COL = ["#ffff10", "#ff1010", "#10ff10", "#10ffff", "#ff10ff", "#1010ff", "#8400b5", "#ffffff"];
    const text = "QNX IS COOL!";
    const size = () => {
      const r = cv.getBoundingClientRect();
      const W = Math.max(80, Math.round(r.width)), H = Math.max(60, Math.round(r.height));
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    };
    const draw = () => {
      if (!w.el.parentNode) return;
      const p = K.get(w.pid);
      if (!p || p.state === "DEAD") return;
      size();
      const g = cv.getContext("2d");
      const W = cv.width, H = cv.height;
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      st.t += 0.028;
      p.cpu += 1;
      const cx = W / 2, cy = H / 2;
      const n = text.length;
      /* one swing for the whole line, so it stays readable, with a wave down
         the letters and a slow pulse in size. Stroked, because in 1999 this
         was a vector demo and vectors are what it drew.                     */
      const swing = 0.62 * Math.sin(st.t * 0.55);
      const sc = Math.min(W / 78, H / 15) * (1 + 0.10 * Math.sin(st.t * 0.9));
      const step = sc * 5.25;
      g.lineWidth = Math.max(1.4, sc * 0.42); g.lineCap = "round"; g.lineJoin = "round";
      for (let i = 0; i < n; i++) {
        const segs = G[text[i]] || [];
        if (!segs.length) continue;
        const ox = cx + (i - (n - 1) / 2) * step;
        const oy = cy + Math.sin(st.t * 1.15 + i * 0.6) * (H * 0.13);
        g.strokeStyle = COL[i % COL.length];
        g.beginPath();
        for (const seg of segs) {
          const pt = (x, y) => {
            const X = (x - 2) * sc, Y = (y - 2.5) * sc;
            return [ox + X - Y * Math.sin(swing) * 0.5, oy + Y * Math.cos(swing * 0.6)];
          };
          const a = pt(seg[0], seg[1]), bb = pt(seg[2], seg[3]);
          g.moveTo(a[0], a[1]); g.lineTo(bb[0], bb[1]);
        }
        g.stroke();
      }
      /* the stars, which the original had too */
      g.lineWidth = 1.4;
      g.strokeStyle = "#ffff10";
      for (let k = 0; k < 3; k++) {
        const ang = st.t * (0.7 + k * 0.4) + k * 2.1;
        const sx = cx + Math.cos(ang) * (W * 0.34), sy = cy + Math.sin(ang * 1.3) * (H * 0.32);
        g.beginPath();
        for (let q = 0; q <= 5; q++) {
          const t1 = ang + q * Math.PI * 4 / 5;
          const px = sx + Math.cos(t1) * 7, py = sy + Math.sin(t1) * 7;
          if (q === 0) g.moveTo(px, py); else g.lineTo(px, py);
        }
        g.stroke();
      }
      st.raf = requestAnimationFrame(draw);
    };
    st.raf = requestAnimationFrame(draw);
    w.timers = [];
    /* the animation draws through Photon like everything else, but at a
       polite rate: one traced draw event a second, not sixty              */
    const tick = setInterval(async () => {
      const ph = K.byName("Photon");
      if (!ph || !w.el.parentNode) return;
      await K.Send(w.pid, ph.pid, {
        code: 0x0115, ph: "draw", id: w.region, rect: { x: w.x, y: w.y, w: w.w, h: w.h },
        what: "PhBlit(" + w.w + "x" + w.h + ")", len: 96
      }).catch(() => { });
    }, 1000);
    w.timers.push(tick);
  },
  onClose(w) { if (w.st && w.st.raf) cancelAnimationFrame(w.st.raf); }
});

const PDisplay = {
  async apply(m) {
    const want = m.drv === "vga4" ? "Pg.vga4" : "Pg.flat";
    const have = K.byName("Pg.vga4") || K.byName("Pg.flat");
    if (!have) { Toast.show("There is no graphics driver running to replace."); return; }
    if (have.name !== want) {
      Toast.show("Replacing the graphics driver: slay " + have.name + ", then start " + want + ".");
      K.kill(have.pid);
      Ph.dropRegion((Ph.regions.find(r => r.name === have.name) || {}).id);
      Sys.spawn({
        name: want, node: 1, prio: 16, sched: "r", sys: true, kind: "driver",
        code: want === "Pg.flat" ? 38000 : 26000, data: 12000,
        desc: "the graphics driver. A region at the very front of the event space, sensitive to draw events.",
        onMsg: (msg) => { Ph.frames++; Ph.tiles += (msg && msg.tiles) || 1; return { what: "blitted" }; }
      });
      Photon_regions();
    }
    $("#desk").classList.remove("nodrv");
    Display.setMode(m.W, m.H);
    if (K.byName("Photon", 1)) Photon_regions();
    for (const w of PWM.wins) {
      w.x = Math.min(w.x, m.W - 60); w.y = Math.min(w.y, m.H - 60);
      w.w = Math.min(w.w, m.W); w.h = Math.min(w.h, m.H - 24);
      PWM.place(w);
    }
    State.save();
    Toast.show(m.res + ", " + m.d + ". Photon never stopped; only the driver changed.");
  }
};

/* ==========================================================================
   MODULE 27 — EXTENSIONS, AND THE DOOR THEY LEFT OPEN
   --------------------------------------------------------------------------
   Version 4.05 let you extend the running system over the web. Three
   packages were ever published: telnet.qnxde, game1.qnxde and utils1.qnxde.
   The installer copies the file into /tmp_ram, asks Continue or Cancel, and
   — whichever you press — rebuilds the workspace menu from pwm.menu.

   That last detail is the door. pwm.menu is a text file the disk lets you
   edit, and the menu is rebuilt on every install and every removal. So: put
   any command line you like into the menu, install or remove anything, and
   the menu now has your command on it. That is how people got a shell on a
   disk that shipped without one, and it is reproduced here faithfully.
   ========================================================================== */
const Extensions = {

defApp("clock", {
  title: "Clock", w: 132, h: 132, exe: "pwmclock", icon: "gear",
  code: 14000, data: 8000, resize: false, single: true,
  desc: "the clock from the utilities extension. \"Want to turn your old 386 into a wall clock?\"",
  init(w) {
    const cv = el("canvas", { width: 116, height: 96, style: "display:block;margin:4px auto" });
    const dig = el("div", { class: "mono", style: "text-align:center;font-size:13px" });
    w.body.appendChild(cv); w.body.appendChild(dig);
    const draw = () => {
      const g = cv.getContext("2d"), d = new Date();
      g.clearRect(0, 0, 116, 96);
      g.strokeStyle = "#000"; g.fillStyle = "#c6c6c6";
      g.beginPath(); g.arc(58, 47, 42, 0, 7); g.fill(); g.stroke();
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6;
        g.beginPath();
        g.moveTo(58 + Math.sin(a) * 36, 47 - Math.cos(a) * 36);
        g.lineTo(58 + Math.sin(a) * 40, 47 - Math.cos(a) * 40);
        g.stroke();
      }
      const hand = (a, len, wid, col) => {
        g.strokeStyle = col; g.lineWidth = wid;
        g.beginPath(); g.moveTo(58, 47);
        g.lineTo(58 + Math.sin(a) * len, 47 - Math.cos(a) * len); g.stroke();
        g.lineWidth = 1;
      };
      const h = d.getHours() % 12, m = d.getMinutes(), s = d.getSeconds();
      hand((h + m / 60) * Math.PI / 6, 22, 3, "#000");
      hand(m * Math.PI / 30, 32, 2, "#000");
      hand(s * Math.PI / 30, 34, 1, "#ff1010");
      dig.textContent = U.pad(d.getHours(), 2, "0") + ":" + U.pad(d.getMinutes(), 2, "0") + ":" + U.pad(d.getSeconds(), 2, "0");
    };
    draw();
    w.timers = [setInterval(draw, 1000)];
  }
});

/* ==========================================================================
   MODULE 30 — THE SHELL AND THE COMMAND REGISTRY
   --------------------------------------------------------------------------
   POSIX-flavoured, because QNX 4 is POSIX-certified and the userland is meant
   to be familiar: ls, cd, cat, grep, wc, ps, df, uname, kill, pipes and
   redirection all behave. What is NOT Unix is sitting right beside them:

     sin      QNX 4's own process report, with a format string
     slay     kill by name, and it is spelled slay
     on       run a command on another node: on -n 2 sin
     pidin    Neutrino's process tool, provided here and labelled as such
     use      print a program's built-in usage message

   Every file command below sends a message to Fsys and waits for the reply.
   Nothing reads the file tree directly. That is why the tracer works.
   ========================================================================== */
const Shell = {
  cmds: {},
  def(name, o) { this.cmds[name] = Object.assign({ name: name }, o); },

  async run(line, io) {
    line = String(line || "").trim();
    if (!line) return;
    io.hist = io.hist || [];
    /* redirection first, then pipes: enough shell to be honest             */
    let redir = null;
    const rm = /\s*>\s*(\S+)\s*$/.exec(line);
    if (rm) { redir = rm[1]; line = line.slice(0, rm.index); }
    const stages = line.split("|").map(s => s.trim()).filter(Boolean);
    let feed = null, out = "";
    for (const stage of stages) {
      const r = await this.one(stage, io, feed);
      out = r === undefined ? "" : String(r);
      feed = out;
    }
    if (redir) {
      try {
        await IO.spit(io.pid, FS.norm(redir, io.cwd), out.replace(/\n$/, "") + "\n");
        io.write("");
      } catch (e) { io.write((e.errno || "error") + ": cannot write " + redir + "\n"); }
      return;
    }
    if (out) io.write(out.slice(-1) === "\n" ? out : out + "\n");
  },

  async one(stage, io, stdin) {
    const argv = stage.match(/"[^"]*"|'[^']*'|\S+/g) || [];
    const argv2 = argv.map(a => a.replace(/^["']|["']$/g, ""));
    const name = argv2[0];
    /* on -n N cmd ... : the FLEET command. Runs elsewhere, prints here.    */
    if (name === "on") {
      let i = 1, node = 1;
      while (i < argv2.length) {
        if (argv2[i] === "-n") { node = +argv2[++i]; i++; }
        else if (/^-n\d+$/.test(argv2[i])) { node = +argv2[i].slice(2); i++; }
        else if (argv2[i] === "-f") { node = +argv2[++i]; i++; }
        else break;
      }
      const rest = argv2.slice(i);
      if (!rest.length) return "on: usage: on -n node command\n";
      const nd = Net.nodeOf(node);
      if (!nd || !nd.up) return "on: node " + node + " is not answering\n";
      const sub = Object.create(io);
      sub.node = node;
      return await this.one(rest.join(" "), sub, stdin);
    }
    const c = this.cmds[name];
    if (!c) {
      if (FS.get(FS.norm(name, io.cwd)) && FS.get(FS.norm(name, io.cwd)).exe)
        return name + ": on this disk that is a Photon program. Try the workspace menu.\n";
      return "ksh: " + name + ": not found\n";
    }
    try {
      const r = await c.fn(argv2.slice(1), io, stdin);
      return r === undefined ? "" : r;
    } catch (e) {
      return (e && (e.errno || e.message) || String(e)) + "\n";
    }
  },
  /* a command running "on" another node sees that node's path space. This is
     the whole of what `on -n 2 ls /bin` means: same program, same argument,
     different machine — and no syntax anywhere to say so.                  */
  path(io, p) {
    if (!p) p = io.cwd;
    if (p.indexOf("//") === 0) return p;
    const abs = FS.norm(p, io.cwd);
    return (io.node && io.node !== 1) ? "//" + io.node + abs : abs;
  },
  complete(part, io) {
    const names = Object.keys(this.cmds).filter(n => n.indexOf(part) === 0);
    if (names.length === 1) return names[0] + " ";
    const dir = part.replace(/[^\/]*$/, "") || io.cwd;
    const base = part.replace(/.*\//, "");
    const ents = FS.ls(FS.norm(dir, io.cwd)).filter(e => e.name.indexOf(base) === 0);
    if (ents.length === 1) return part.replace(/[^\/]*$/, "") + ents[0].name + (ents[0].node.t === "d" ? "/" : " ");
    return null;
  }
};

/* --- the POSIX half ------------------------------------------------------ */
Shell.def("help", { d: "what this shell knows", fn(a) {
  const groups = {
    "POSIX": ["ls", "cd", "pwd", "cat", "more", "head", "tail", "wc", "grep", "echo", "cp", "mv",
      "rm", "mkdir", "touch", "date", "df", "env", "id", "hostname", "uname", "ps", "kill",
      "sleep", "clear", "which", "history", "exit"],
    "QNX's own": ["sin", "slay", "on", "nid", "use", "pidin", "netpoll", "mount", "umount", "fullpath"],
    "network": ["ping", "netstat", "ifconfig", "route", "nslookup"],
    "museum": ["tracer", "manifest", "latency", "chain", "kernel", "regions", "prefix", "exhibit"]
  };
  let s = "";
  for (const g in groups) s += U.padr(g + ":", 12) + groups[g].join(" ") + "\n\n";
  return s + "Try:  sin  |  pidin  |  slay Photon  |  ls //2/  |  on -n 2 sin  |  chain\n";
} });

Shell.def("ls", { d: "list directory contents", async fn(a, io) {
  const long = a.indexOf("-l") >= 0;
  const all = a.indexOf("-a") >= 0;
  const args = a.filter(x => x[0] !== "-");
  const path = Shell.path(io, args[0]);
  let ents;
  try { ents = await IO.readdir(io.pid, path); }
  catch (e) {
    try {
      const st = await IO.stat(io.pid, path);
      return (long ? this.line({ name: path, node: st }) : path) + "\n";
    } catch (e2) { return "ls: " + path + ": " + (e2.errno || "ENOENT") + "\n"; }
  }
  if (!long) {
    const names = ents.map(e => e.name + (e.node.t === "d" ? "/" : e.node.exe ? "*" : ""));
    let s = "", w = 0;
    for (const n of names) w = Math.max(w, n.length + 2);
    const cols = Math.max(1, Math.floor(78 / w));
    names.forEach((n, i) => { s += U.padr(n, w); if ((i + 1) % cols === 0) s += "\n"; });
    return s.replace(/\s+$/, "") + "\n";
  }
  return ents.map(e => Shell.cmds.ls.line(e)).join("\n") + "\n";
}, line(e) {
  const n = e.node;
  const mode = (n.t === "d" ? "d" : n.t === "c" ? "c" : "-") +
    (n.t === "d" || n.exe ? "rwxr-xr-x" : n.ro ? "r--r--r--" : "rw-r--r--");
  return mode + "  1 root  root  " + U.pad(n.size, 8) + " " + U.fdate(n.mtime) + " " + e.name;
} });

Shell.def("cd", { d: "change directory", async fn(a, io) {
  const abs = FS.norm(a[0] || "/", io.cwd);
  try {
    const st = await IO.stat(io.pid, Shell.path(io, abs));
    if (st.t !== "d") return "cd: " + abs + ": not a directory\n";
  }
  catch (e) { return "cd: " + abs + ": " + (e.errno || "ENOENT") + "\n"; }
  io.cwd = abs; return "";
} });
Shell.def("pwd", { d: "print working directory", fn(a, io) { return io.cwd + "\n"; } });

Shell.def("cat", { d: "concatenate and print", async fn(a, io, stdin) {
  if (!a.length) return stdin || "";
  let out = "";
  for (const f of a) {
    const p = Shell.path(io, f);
    try { const r = await IO.slurp(io.pid, p); out += r.text || ""; }
    catch (e) { out += "cat: " + p + ": " + (e.errno || "ENOENT") + "\n"; }
  }

} });
Shell.def("more", { d: "page a file", async fn(a, io, stdin) {
  const t = a.length ? await Shell.cmds.cat.fn(a, io) : (stdin || "");
  const lines = String(t).split("\n");
  return lines.slice(0, 40).join("\n") + (lines.length > 40 ? "\n--More--(" + lines.length + " lines; this pager does not paginate)\n" : "\n");
} });
Shell.def("head", { d: "first lines", async fn(a, io, stdin) {
  let n = 10; const files = [];
  for (let i = 0; i < a.length; i++) { if (/^-(\d+)$/.test(a[i])) n = +RegExp.$1; else if (a[i] === "-n") n = +a[++i]; else files.push(a[i]); }
  const t = files.length ? await Shell.cmds.cat.fn(files, io) : (stdin || "");
  return String(t).split("\n").slice(0, n).join("\n") + "\n";
} });
Shell.def("tail", { d: "last lines", async fn(a, io, stdin) {
  let n = 10; const files = [];
  for (let i = 0; i < a.length; i++) { if (/^-(\d+)$/.test(a[i])) n = +RegExp.$1; else if (a[i] === "-n") n = +a[++i]; else files.push(a[i]); }
  const t = files.length ? await Shell.cmds.cat.fn(files, io) : (stdin || "");
  const L = String(t).replace(/\n$/, "").split("\n");
  return L.slice(Math.max(0, L.length - n)).join("\n") + "\n";
} });
Shell.def("wc", { d: "count lines, words, bytes", async fn(a, io, stdin) {
  const files = a.filter(x => x[0] !== "-");
  const t = files.length ? await Shell.cmds.cat.fn(files, io) : (stdin || "");
  const s = String(t);
  const lines = s ? s.replace(/\n$/, "").split("\n").length : 0;
  const words = s.split(/\s+/).filter(Boolean).length;
  return U.pad(lines, 7) + U.pad(words, 8) + U.pad(s.length, 8) + (files.length ? " " + files.join(" ") : "") + "\n";

Shell.def("grep", { d: "search for a pattern", async fn(a, io, stdin) {
  const flags = a.filter(x => x[0] === "-");
  const rest = a.filter(x => x[0] !== "-");
  const pat = rest.shift();
  if (!pat) return "usage: grep [-i] [-v] pattern [file ...]\n";
  const re = new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, m => m === "*" || m === "." || m === "^" || m === "$" ? m : "\\" + m),
    flags.indexOf("-i") >= 0 ? "i" : "");
  const inv = flags.indexOf("-v") >= 0;
  const t = rest.length ? await Shell.cmds.cat.fn(rest, io) : (stdin || "");
  const out = String(t).split("\n").filter(l => re.test(l) !== inv);
  return out.join("\n") + (out.length ? "\n" : "");

    catch (e) { return "touch: " + f + ": " + (e.errno || "error") + "\n"; }
  }
  return "";
} });

function procRows(node) {
  return K.list().filter(p => p.node === node);
}
Shell.def("sin", { d: "QNX 4's system information report", async fn(a, io) {
  const node = io.node || (a.indexOf("-n") >= 0 ? +a[a.indexOf("-n") + 1] : Net.node);
  let sub = a.filter(x => x[0] !== "-" && !/^\d+$/.test(x))[0] || "";
  if (node !== Net.node) {
    const nd = Net.nodeOf(node);
    if (!nd || !nd.up) return "sin: node " + node + ": EHOSTDOWN\n";
    const net = K.byName("Net");
    if (net) await K.Send(io.pid, net.pid, {
      code: MSG.NET_VC, node: node, owner: "Proc", what: "sin: read process table on node " + node, len: 64
    }).catch(() => { });
  }
  const rows = procRows(node);
  if (!rows.length) return "sin: no processes on node " + node + "\n";
  if (sub.indexOf("ve") === 0) {
    return "Node " + node + ":\n" +
      U.padr("PROGRAM", 20) + U.padr("VERSION", 12) + "DATE\n" +
      rows.filter(p => p.sys).map(p => U.padr(p.name, 20) + U.padr("4.25", 12) + "Sep 15 1999").join("\n") + "\n";
  }
  if (sub.indexOf("in") === 0) {
    const kb = rows.reduce((s, p) => s + p.code + p.data, 0);
    return "Node " + node + "  " + (Net.nodeOf(node) || {}).name + "\n" +
      "  Processor:      " + Machine.cpu + "\n" +
      "  Memory:         " + U.size(Machine.ram) + " total, " + U.size(kb) + " in processes\n" +
      "  Processes:      " + rows.length + "\n" +
      "  Kernel:         " + U.n(K.KERNEL_CODE) + " bytes of code, " + K.KERNEL_CALLS + " kernel calls\n" +
      "  Ticks:          10 ms; timeslice 50 ms\n";
  }
  if (sub.indexOf("na") === 0) {
    let s = U.padr("NAME", 20) + U.pad("PID", 6) + "  NODE\n";
    for (const [k, v] of K.names) {
      const nn = k.split(",");
      if (+nn[0] !== node) continue;
      s += U.padr(nn[1], 20) + U.pad(v, 6) + "  " + nn[0] + "\n";
    }
    return s;
  }
  if (sub.indexOf("pr") === 0) {
    const rows2 = [];
    for (const p of K.list()) {
      if (p.node !== node) continue;
      for (const px of p.proxies) rows2.push([px.pid, p.name, px.queued, px.note]);
    }
    if (!rows2.length) return "sin proxies: none attached on node " + node + "\n";
    return U.padr("PROXY", 8) + U.padr("OWNER", 16) + U.pad("SENT", 7) + "  WHAT IT IS\n" +
      rows2.map(r => U.padr(r[0], 8) + U.padr(r[1], 16) + U.pad(r[2], 7) + "  " + r[3]).join("\n") +
      "\n\nA proxy is a canned message with no sender waiting for a reply. An interrupt\n" +
      "handler cannot Send(), because Send() blocks; it triggers a proxy instead.\n";
  }
  if (sub.indexOf("vc") === 0) {
    if (!VC.list.length) return "sin vcs: no virtual circuits. Nothing has talked to another node yet.\n";
    return U.padr("VID", 7) + U.padr("NODE", 7) + U.padr("REMOTE PID", 12) + U.padr("BYTES", 9) + "SERVER\n" +
      VC.list.map(v => U.padr(v.vid, 7) + U.padr(v.node, 7) + U.padr(v.remote, 12) +
        U.padr(v.bytes, 9) + (v.label || "")).join("\n") + "\n";
  }
  if (sub.indexOf("fr") === 0) {
    const kb = rows.reduce((s, p) => s + p.code + p.data, 0);
    return "free memory: " + U.size(Machine.ram - kb) + " of " + U.size(Machine.ram) + "\n";
  }
  /* the default report: sin format sinbpm                                   */
  let s = U.pad("SID", 4) + U.pad("PID", 5) + "  " + U.padr("PROGRAM", 17) +
    U.padr("STATE", 7) + U.pad("BLK", 5) + U.pad("PRI", 5) + U.pad("CODE", 7) + U.pad("DATA", 7) + "\n";
  for (const p of rows) {
    s += U.pad(p.sid, 4) + U.pad(p.pid, 5) + "  " + U.padr(p.name, 17) +
      U.padr(p.state, 7) + U.pad(p.blk || "", 5) + U.pad(p.prio + p.sched, 5) +
      U.pad(U.kb(p.code), 7) + U.pad(U.kb(p.data), 7) + "\n";
  }
  const tot = rows.reduce((x, p) => x + p.code + p.data, 0);
  s += "\n" + rows.length + " processes on node " + node + ", " + U.size(tot) + " of code and data.\n";
  s += "The kernel is not in this list. It is " + U.n(K.KERNEL_CODE) + " bytes inside Proc32,\n" +
    "it is never scheduled, and it has " + K.KERNEL_CALLS + " entry points.\n";
  return s;
} });

Shell.def("pidin", { d: "Neutrino's process report (see the note it prints)", async fn(a, io) {
  const node = io.node || Net.node;
  const rows = procRows(node);
  let s = U.pad("pid", 8) + U.pad("tid", 4) + " " + U.padr("name", 26) +
    U.pad("prio", 5) + " " + U.padr("STATE", 12) + "Blocked\n";
  for (const p of rows) {
    s += U.pad(p.pid, 8) + U.pad(1, 4) + " " + U.padr((p.sys ? "/boot/sys/" : "/xip/") + p.name, 26) +
      U.pad(p.prio + p.sched, 5) + " " + U.padr(p.state, 12) + (p.blk ? String(p.blk) : "") + "\n";
  }
  s += "\n" + U.pad("-", 8) + U.pad("-", 4) + " " + U.padr("(the microkernel)", 26) +
    U.pad("--", 5) + " " + U.padr("NOT SCHEDULED", 15) + U.n(K.KERNEL_CODE) + " bytes of code\n";
  s += "\nNote: pidin is QNX Neutrino's tool, not QNX 4's. On the disk you are looking at,\n" +
    "the command is `sin`. pidin is here because it is the one every QNX programmer\n" +
    "since 2001 types first, and the museum would rather answer than be pedantic.\n";
  return s;
} });

Shell.def("slay", { d: "kill a process BY NAME. Not kill. slay.", async fn(a, io) {
  const flags = a.filter(x => x[0] === "-");
  const names = a.filter(x => x[0] !== "-");
  if (!names.length) return "usage: slay [-f] [-h] [-u] [-n nid] [-P prio] process_name\n";
  let node = io.node || Net.node;
  const ni = a.indexOf("-n"); if (ni >= 0) node = +a[ni + 1];
  let out = "";
  for (const n of names) {
    if (/^\d+$/.test(n)) { out += "slay: " + n + ": slay takes names, not pids. Use kill for a pid.\n"; continue; }
    const matches = K.list().filter(p => p.node === node && p.name === n);
    if (!matches.length) { out += "slay: " + n + ": no such process on node " + node + "\n"; continue; }
    if (matches.length > 1 && flags.indexOf("-f") < 0)
      out += "slay: " + matches.length + " processes named " + n + " — using -f semantics here\n";
    for (const p of matches) {
      if (flags.indexOf("-h") >= 0) { K.signal(io.pid, p.pid, "SIGSTOP"); out += "slay: held " + p.name + " (" + p.pid + ")\n"; continue; }
      if (flags.indexOf("-u") >= 0) { K.signal(io.pid, p.pid, "SIGCONT"); out += "slay: continued " + p.name + "\n"; continue; }
      const r = K.signal(io.pid, p.pid, "SIGTERM");
      if (r === -2) { out += "slay: " + p.name + ": protected. Proc and the kernel are not optional.\n"; continue; }
      out += "slay: " + p.name + " (" + p.pid + ") terminated\n";
      out += Fault.consequence(p) || "";
    }
  }
  return out;
} });

Shell.def("kill", { d: "send a signal to a pid", fn(a, io) {
  let sig = "SIGTERM", args = a.slice();
  if (args[0] && args[0][0] === "-") { sig = args.shift().slice(1); if (/^\d+$/.test(sig)) sig = { "9": "SIGKILL", "15": "SIGTERM", "19": "SIGSTOP", "18": "SIGCONT" }[sig] || "SIGTERM"; if (!/^SIG/.test(sig)) sig = "SIG" + sig.toUpperCase(); }
  if (!args.length) return "usage: kill [-signal] pid\n";
  let out = "";
  for (const s of args) {
    const p = K.get(+s);
    if (!p) { out += "kill: " + s + ": no such process\n"; continue; }
    const r = K.signal(io.pid, p.pid, sig);
    if (r === -2) out += "kill: " + p.name + ": cannot be killed\n";
    else { out += ""; out += Fault.consequence(p) || ""; }
  }
  return out;
} });

Shell.def("ps", { d: "POSIX process list", fn(a, io) {

  return s + "\nps is here because POSIX says so. A QNX person would have typed sin.\n";

Shell.def("ping", { d: "send ICMP echo requests", async fn(a, io) {
  const host = a.filter(x => x[0] !== "-")[0];
  if (!host) return "usage: ping host\n";
  const sock = K.byName("Socket");
  if (!sock) return "ping: Socket is not running. Nothing to ask.\n";
  const known = { "127.1": "127.0.0.1", "localhost": "127.0.0.1", "demo": Net.ip,
    "node2": "10.0.0.2", "fileserver": "10.0.0.2", "node3": "10.0.0.3", "plc": "10.0.0.3" };
  const ip = known[host] || (/^\d+\.\d+/.test(host) ? host : null);
  const loop = ip === "127.0.0.1";
  if (!loop && !Net.up) return "ping: no route to host (the interface is not configured)\n";
  if (!ip) return "ping: unknown host " + host + "\n";
  let out = "PING " + host + " (" + ip + "): 56 data bytes\n";
  for (let i = 0; i < 4; i++) {
    await K.Send(io.pid, sock.pid, {
      code: MSG.NET_TX, what: "ICMP echo request seq " + i + " to " + ip, len: 84, loop: loop
    }).catch(() => { });
    const t = loop ? 0.18 + i * 0.02 : (Net.media === "ppp" ? 148 + i * 9 : 0.9 + i * 0.1);
    out += "64 bytes from " + ip + ": icmp_seq=" + i + " ttl=255 time=" + t.toFixed(1) + " ms\n";
  }
  out += "\n--- " + host + " ping statistics ---\n4 packets transmitted, 4 packets received, 0% packet loss\n";
  return out;
} });

  const t = { "127.1": "127.0.0.1", "localhost": "127.0.0.1", "node2": "10.0.0.2", "node3": "10.0.0.3" };
  return "Server:  " + (Net.dns || "none") + "\n\n" +

/* ==========================================================================
   MODULE 31 — pterm AND THE TEXT CONSOLE
   --------------------------------------------------------------------------
   Two front ends, one shell. pterm is a Photon application talking to a
   pseudo-terminal; the console is what you get on /dev/con1 when there is no
   Photon at all, which is the state the machine is in after you slay it.
   Neither one is on the real disk's menu — see the museum notes — and both
   run the same command registry.
   ========================================================================== */
function makeTTY(host, opts) {
  opts = opts || {};
  const scr = el("div", { class: "pt-scr scr" });
  host.appendChild(scr);
  const io = {
    cwd: "/", pid: opts.pid || 1, hist: [], hi: -1, node: 1, busy: false,
    write(t) { io.emit(t); },
    clear() { scr.innerHTML = ""; },
    exit() { if (opts.onExit) opts.onExit(); }
  };
  let line = "", curLine = null;
  const emit = (t, cls) => {
    const d = el("span", { class: cls || null, text: t });
    scr.appendChild(d);
    scr.scrollTop = scr.scrollHeight;
  };
  io.emit = emit;
  const prompt = () => {
    curLine = el("div");
    const p = el("span", { class: "g", text: (io.node !== 1 ? "//" + io.node : "") + io.cwd + " # " });
    const txt = el("span");
    const cur = el("span", { class: "pt-cur", text: " " });
    curLine.appendChild(p); curLine.appendChild(txt); curLine.appendChild(cur);
    scr.appendChild(curLine);
    scr.scrollTop = scr.scrollHeight;
    return { txt: txt, cur: cur };
  };
  let ui = null;
  const redraw = () => { if (ui) ui.txt.textContent = line; };
  const submit = async () => {
    const l = line;
    if (ui) { ui.cur.className = ""; ui.cur.textContent = ""; }
    line = ""; ui = null;
    if (l.trim()) io.hist.push(l);
    io.hi = io.hist.length;
    io.busy = true;
    await Shell.run(l, io);
    io.busy = false;
    ui = prompt();
  };
  const key = async ev => {
    if (io.busy) return;
    if (ev.key === "Enter") { ev.preventDefault(); await submit(); return; }
    if (ev.key === "Backspace") { ev.preventDefault(); line = line.slice(0, -1); redraw(); return; }
    if (ev.key === "Tab") {
      ev.preventDefault();
      const parts = line.split(/\s+/);
      const c = Shell.complete(parts[parts.length - 1] || "", io);
      if (c) { parts[parts.length - 1] = c; line = parts.join(" "); redraw(); }
      return;
    }
    if (ev.key === "ArrowUp") { ev.preventDefault(); if (io.hi > 0) { io.hi--; line = io.hist[io.hi] || ""; redraw(); } return; }
    if (ev.key === "ArrowDown") { ev.preventDefault(); if (io.hi < io.hist.length - 1) { io.hi++; line = io.hist[io.hi] || ""; } else { io.hi = io.hist.length; line = ""; } redraw(); return; }
    if (ev.key === "l" && ev.ctrlKey) { ev.preventDefault(); io.clear(); ui = prompt(); return; }
    if (ev.key === "c" && ev.ctrlKey) { ev.preventDefault(); emit("^C\n"); line = ""; ui = prompt(); return; }
    if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey) { ev.preventDefault(); line += ev.key; redraw(); }
  };
  io.key = key;
  io.start = banner => { if (banner) emit(banner); ui = prompt(); };
  io.focusEl = scr;
  scr.setAttribute("tabindex", "0");
  scr.addEventListener("keydown", key);
  scr.addEventListener("mousedown", () => setTimeout(() => scr.focus(), 0));
  return io;
}

const Console = {
  layer: null, io: null,

/* the two driver regions that sit at the very front of the event space: the
   graphics driver's, which is sensitive to draw events, and the input
   driver's, which injects them inwards. Put back whenever Photon starts.   */
function Photon_regions() {
  Ph.prune();
  /* there is one graphics region and one input region, and they belong to
     whichever driver is running now                                        */
  Ph.regions = Ph.regions.filter(r => r.kind !== "driver");
  const pg = K.byName("Pg.vga4", 1) || K.byName("Pg.flat", 1);
  const inp = K.byName("Input", 1);
  if (pg) Ph.addRegion({ name: pg.name, owner: pg.pid, x: 0, y: 0, w: Display.w, h: Display.h,
    z: 9999, sens: ["draw"], opaque: [], kind: "driver" });
  if (inp) Ph.addRegion({ name: "Input", owner: inp.pid, x: 0, y: 0, w: Display.w, h: Display.h,
    z: 9998, sens: [], opaque: [], kind: "driver" });
}

/* starting a system process again, from the shell ------------------------- */

/* ==========================================================================
   MODULE 32 — FAULT ISOLATION
   --------------------------------------------------------------------------
   The whole argument, in one table: what actually stops when each process
   dies. No triumphalism. A monolithic kernel is not stupid for putting these
   in one address space — it is faster, and message passing costs context
   switches, which is precisely the objection that has been made since 1985.
   What it buys is written here, and what it costs is written here too.
   ========================================================================== */
const Fault = {
  notes: {
    "Fsys": "File operations now fail. Every open() gets ESRCH because nothing owns the / prefix " +
      "any more — cleanly, with an error return, not a panic. Notepad will say so; Voyager will " +
      "still serve pages it has cached; the clock keeps ticking.",
    "Fsys.floppy": "Fsys is still there, and still willing, but it has no block driver to ask. " +
      "Reads fail one level lower down and the error comes back up the same way.",
    "Dev": "/dev is unowned. Terminals stop; the machine does not.",
    "Dev.ser": "The serial port is gone. If you were dialled up, that is the end of the call.",
    "Dev.ansi": "The text consoles are gone. Under Photon you will not notice until you need one.",
    "Photon": "The GUI is gone: every window, the taskbar, the menu. Nothing else went with it. " +
      "You are now on /dev/con1, where you can see what survived and start it again.",
    "pwm": "Title bars, the taskbar and the workspace menu are gone. The applications are not: " +
      "they had their own regions, and pwm's were only behind them.",
    "Pg.vga4": "Nothing can be drawn. Photon still has its event space and still steers events, " +
      "but no region at the front is sensitive to draw events any more, so they die there.",
    "Pg.flat": "Nothing can be drawn. The event space is intact and empty of eyes.",
    "Input": "On the real machine the mouse and the keyboard have just stopped.",
    "phfont": "Text stops being rendered by the font server. In this simulation the browser " +
      "keeps drawing, which is a place the exhibit cannot be honest with pixels; the process " +
      "really is gone from the table.",
    "Socket": "TCP/IP is gone. Voyager cannot reach anything off this machine and says so. " +
      "http://127.1/ also stops, because that path goes through the stack too.",
    "httpd": "The web server is gone. http://127.1/ gives ECONNREFUSED. The browser is fine.",
    "Net": "FLEET is gone. //2/ and //3/ stop resolving and their virtual circuits are " +
      "dismantled. Local messages are untouched: they never went near Net.",
    "Net.ether2100": "The card driver is gone. Net has nothing to hand frames to.",
    "Net.ether509": "The card driver is gone. Net has nothing to hand frames to.",
    "Proc": "Proc cannot be killed. It shares its file with the microkernel and holds the " +
      "prefix tree; the signal is refused by qnx_pflags(), exactly as a real server protects itself."
  },
  monolith: {
    "Fsys": "In a monolithic kernel this code runs in kernel space. A null dereference here is " +
      "not an error return, it is the machine stopping.",
    "Fsys.floppy": "A driver bug in kernel space is a kernel bug. That is the whole difference.",
    "Photon": "A display server crash on a 1999 monolithic desktop usually took your session " +
      "with it, and often more.",
    "Socket": "A fault in an in-kernel network stack is a kernel fault. Ask anyone who ran a " +
      "1999 server on the open internet.",
    "Net": "Same again: in-kernel networking means in-kernel faults."
  },
  consequence(p) {
    const n = this.notes[p.name];
    if (!n) return "";
    Toast.show(p.name + ": " + n.split(". ")[0] + ".", 6500);
    if (p.name === "Pg.vga4" || p.name === "Pg.flat") $("#desk").classList.add("nodrv");
    if (p.name === "Input") setTimeout(() => Toast.show(
      "Museum note: your pointer still works. That is the one thing this exhibit will not " +
      "simulate faithfully, because you would have no way back. Start Input again when you like.", 9000), 1200);
    return "  → " + n + "\n";
  },
  slayPid(pid) {
    const p = K.get(pid);
    if (!p) return;
    const r = K.signal(1, pid, "SIGTERM");
    if (r === -2) { Toast.show(p.name + " refused the signal. Proc protects itself with qnx_pflags()."); return; }
    this.consequence(p);
  }
};

/* ==========================================================================
   MODULE 33 — THE MESSAGE TRACER WINDOW
   ========================================================================== */
defApp("tracer", {
  title: "Message tracer", w: 566, h: 330, exe: "phtrace", icon: "wire", single: true,
  code: 0, data: 0, minw: 360, minh: 180, help: "tracer",
  desc: "a museum instrument. It taps the kernel's message layer and nothing else: no server in this simulation has a line of code that reports to it.",
  init(w) {
    const wrap = el("div", { class: "tr-wrap grow" });
    const body = el("div", { class: "tr-body scr" });
    const chain = el("div", { class: "tr-chain scr" });
    let showGui = false, follow = true, filter = null;
    const head = el("div", { class: "tr-head" },
      el("button", { class: "on", onclick: e => { Tracer.paused = !Tracer.paused; e.target.classList.toggle("on", !Tracer.paused); e.target.textContent = Tracer.paused ? "Paused" : "Running"; } }, "Running"),
      el("button", { onclick: () => { Tracer.clear(); body.innerHTML = ""; } }, "Clear"),
      el("button", { onclick: e => { showGui = !showGui; e.target.classList.toggle("on", showGui); } }, "GUI traffic"),
      el("button", { class: "on", onclick: e => { follow = !follow; e.target.classList.toggle("on", follow); } }, "Follow"),
      el("div", { class: "grow" }),
      el("button", { onclick: () => Guide.open("tracer") }, "What am I looking at?"));
    const sel = el("select", { class: "psel", style: "background:#16232a;color:#cfe0e6;border:1px solid #27383f;min-width:120px",
      onchange: e => { filter = e.target.value ? +e.target.value : null; } });
    const fillSel = () => {
      const v = sel.value;
      sel.innerHTML = "";
      sel.appendChild(el("option", { value: "" }, "every process"));
      for (const p of K.list()) sel.appendChild(el("option", { value: String(p.pid) },
        (p.node !== 1 ? "//" + p.node + " " : "") + p.name));
      sel.value = v;
    };
    fillSel();
    head.insertBefore(sel, head.children[3]);
    wrap.appendChild(head); wrap.appendChild(body); wrap.appendChild(chain);
    w.body.appendChild(wrap);
    const isGui = ev => {
      const a = K.get(ev.from), b = K.get(ev.to);
      return (a && (a.kind === "gui" || a.kind === "driver" && /^Pg|Input/.test(a.name))) ||
        (b && (b.kind === "gui" || b.kind === "driver" && /^Pg|Input/.test(b.name)));
    };
    const row = ev => {
      if (!showGui && isGui(ev)) return;
      if (filter && ev.from !== filter && ev.to !== filter) return;
      const a = K.get(ev.from), b = K.get(ev.to);
      const d = el("div", { class: "tr-l new" },
        el("span", { class: "tr-t", text: (ev.t / 1000).toFixed(3) }),
        el("span", { class: "tr-op " + ev.op, text: ev.op }),
        el("span", { class: "tr-a", text: a ? a.name : ("pid " + ev.from) }),
        el("span", { class: "tr-ar", text: ev.op === "REPLY" ? "←" : "→" }),
        el("span", { class: "tr-b", text: b ? b.name : ("pid " + ev.to) }),
        el("span", { class: "tr-m", text: ev.note || "" }));
      body.appendChild(d);
      while (body.children.length > 220) body.removeChild(body.firstChild);
      if (follow) body.scrollTop = body.scrollHeight;
      if (ev.op === "SPAWN" || ev.op === "DEATH") fillSel();
    };
    for (const ev of Tracer.log.slice(-90)) row(ev);
    const un = Tracer.view(row);
    const paintChain = () => {
      const c = Tracer.lastChain();
      chain.innerHTML = "";
      if (!c) { chain.appendChild(el("div", { class: "dim", text: "No conversation yet. Open a file, or load a page." })); return; }
      chain.appendChild(el("div", null, el("b", null, "last chain: "), c.label,
        el("span", { class: "st", text: "  " + c.hops.length + " hops, " + (c.t1 - c.t0).toFixed(2) + " ms" })));
      let depth = 0;
      for (const h of c.hops) {
        const a = K.get(h.from), b = K.get(h.to);
        if (h.op === "SEND") {
          chain.appendChild(el("div", { class: "tr-hop" },
            el("span", { class: "i", text: "  ".repeat(depth) + "└" }),
            el("span", { class: "n", text: (a ? a.name : h.from) + " → " + (b ? b.name : h.to) }),
            el("span", { class: "i", text: h.note || "" })));
          depth++;
        } else if (h.op !== "RECV") {
          depth = Math.max(0, depth - 1);
          chain.appendChild(el("div", { class: "tr-hop" },
            el("span", { class: "i", text: "  ".repeat(depth) + "↳" }),
            el("span", { class: "n", style: "color:#5fe0a8", text: "Reply" }),
            el("span", { class: "i", text: (h.note || "") })));
        }
      }
    };
    paintChain();
    w.timers = [setInterval(paintChain, 900)];
    w.app.onClose = () => un();
  }
});

/* ==========================================================================

  bar(host, name, bytes, max, col, note) {

/* ==========================================================================
   MODULE 36 — THE REALTIME LATENCY DEMONSTRATION
   --------------------------------------------------------------------------
   "Hard realtime" does not mean fast. It means the worst case is bounded and
   you can prove it. The demonstration is a priority-30 task with a 1 ms
   deadline, running while the machine is deliberately loaded, and a histogram
   of where its response times actually land.

   Be clear about what this is: a MODEL, driven by QNX's own published latency
   figures for the era's processors, not a measurement of your machine. A web
   page cannot measure interrupt latency; pretending otherwise would be the
   one dishonest thing in this exhibit.
   ========================================================================== */
const Latency = {
  /* published QNX 4 figures: interrupt latency Til, scheduling latency Tsl */
  cpus: [
    { n: "166 MHz Pentium", til: 3.3, tsl: 4.7 },
    { n: "100 MHz Pentium", til: 4.4, tsl: 6.7 },
    { n: "100 MHz 486DX4", til: 5.6, tsl: 11.1 },
    { n: "33 MHz 386EX", til: 22.5, tsl: 74.2 }
  ],
  cpu: 0, deadlineUs: 1000, running: false, bins: null, worst: 0, n: 0, misses: 0,
  loadProcs: [],

  reset() {
    this.bins = new Array(28).fill(0);
    this.worst = 0; this.n = 0; this.misses = 0; this.span = 40;
  },
  span: 40,                 /* microseconds across the whole histogram      */
  binOf(us) {
    return U.clamp(Math.floor(us / (this.span / 28)), 0, 27);
  },
  /* keep the chart around the data rather than around the deadline: with a
     1 ms budget and a 26 us worst case, a deadline-scaled axis would put
     every sample in the first bin and hide the only interesting thing.     */
  rescale() {
    const want = Math.max(20, this.worst * 1.45);
    if (want > this.span * 1.02 || want < this.span * 0.55) {
      this.span = Math.ceil(want / 10) * 10;
      const old = this.bins.slice();
      this.bins = new Array(28).fill(0);
      /* the old counts no longer have a home; start the picture again      */
      this.n = old.reduce((a, b) => a + b, 0) ? this.n : this.n;
      this.bins[0] = 0;
      return true;
    }
    return false;
  },
  /* one response: interrupt latency, then scheduling latency, then whatever
     higher-priority work is genuinely in front of us. Lower priorities
     cannot contribute, and that is the entire guarantee.                   */
  sample(rnd) {
    const c = this.cpus[this.cpu];
    const jitter = 0.35 + rnd() * 0.55;
    let us = c.til * jitter + c.tsl * (0.7 + rnd() * 0.5);
    /* every process at a HIGHER priority than 30 could delay us. There are
       normally only Proc (31) and the odd driver.                          */
    const higher = K.list().filter(p => p.node === 1 && p.prio > 30 && p.state !== "RECV");
    us += higher.length * (c.tsl * 0.6);
    /* one in fifty, a longer path through the kernel: cache miss, a bigger
       message, a stacked interrupt                                        */
    if (rnd() < 0.02) us += c.tsl * (1.5 + rnd() * 2);
    return us;
  },
  tick(rnd, count) {
    for (let i = 0; i < count; i++) {
      const us = this.sample(rnd);
      this.n++;
      if (us > this.worst) { this.worst = us; if (this.rescale()) { } }
      this.bins[this.binOf(us)]++;
      if (us > this.deadlineUs) this.misses++;
    }
  },
  addLoad() {
    const p = Sys.spawn({
      name: "hog" + (this.loadProcs.length + 1), node: 1, prio: 10, sched: "o", kind: "app",
      code: 12000, data: 220000,
      desc: "a deliberately greedy process at priority 10. It cannot touch the deadline task, and that is the point.",
      onMsg: () => ({ what: "still hogging" })
    });
    this.loadProcs.push(p);
    return p;
  },
  clearLoad() {
    for (const p of this.loadProcs) if (K.get(p.pid)) K.kill(p.pid);
    this.loadProcs.length = 0;
  }
};
