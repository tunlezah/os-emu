/* ==========================================================================
   MODULE 7 — THE PREFIX TREE AND THE I/O CLIENT LIBRARY
   --------------------------------------------------------------------------
   In QNX 4 there is no system call for open(). The C library looks the path
   up in a prefix tree that Proc hands out, works out which process owns that
   part of the path space, and then sends that process an ordinary message.
   Everything follows from this: /dev belongs to Dev, /xip to Fsys, and //2/
   belongs to Net, which is why a remote path needs no new syntax and no
   configuration. The prefix table below is the whole of it.
   ========================================================================== */
const Prefix = {
  table: [],                      /* {prefix, owner} — longest match wins    */
  add(prefix, owner) {
    this.table = this.table.filter(e => e.prefix !== prefix);
    this.table.push({ prefix: prefix, owner: owner });
    this.table.sort((a, b) => b.prefix.length - a.prefix.length);
  },
  drop(owner) { this.table = this.table.filter(e => e.owner !== owner); },
  resolve(path) {
    /* //N/... is a node-qualified path. It is not a mount, it is not a URL,
       and it does not need to be enabled: it is the same message, addressed
       to a process on another node.                                        */
    const m = /^\/\/(\d+)(\/.*)?$/.exec(path);
    if (m) {
      const node = +m[1];
      const rest = m[2] || "/";
      if (node === Net.node) return this.resolve(rest);
      return { node: node, path: rest, owner: "Net", remote: this.resolveOn(node, rest) };
    }
    for (const e of this.table) {
      if (path === e.prefix || path.indexOf(e.prefix === "/" ? "/" : e.prefix + "/") === 0)
        return { node: Net.node, path: path, owner: e.owner };
    }
    return { node: Net.node, path: path, owner: "Fsys" };
  },
  resolveOn(node, path) { return path.indexOf("/dev") === 0 ? "Dev" : "Fsys"; }
};

const IO = {
  fds: new Map(), nextFd: 3,

  /* every one of these is a Send() to a process. that is the exhibit.       */
  async open(clientPid, path, mode) {
    const r = Prefix.resolve(path);
    const srv = Net.serverFor(r);
    if (!srv) throw { errno: "ENOENT", msg: "no manager owns " + path };
    const rep = await K.Send(clientPid, srv.pid, {
      code: MSG.IO_OPEN, what: "open(\"" + path + "\")", len: 96 + path.length,
      path: r.path, node: r.node, mode: mode || "r"
    });
    if (rep && rep.err) throw { errno: rep.err, msg: rep.err + ": " + path };
    const fd = this.nextFd++;
    this.fds.set(fd, { path: r.path, node: r.node, srv: srv.pid, pos: 0, mode: mode || "r", size: rep.size });
    return fd;
  },
  async read(clientPid, fd) {
    const f = this.fds.get(fd); if (!f) throw { errno: "EBADF" };
    const rep = await K.Send(clientPid, f.srv, {
      code: MSG.IO_READ, what: "read(" + fd + ", " + U.n(f.size || 0) + ")", len: 32,
      path: f.path, node: f.node
    });
    return rep;
  },
  async write(clientPid, fd, text) {
    const f = this.fds.get(fd); if (!f) throw { errno: "EBADF" };
    const rep = await K.Send(clientPid, f.srv, {
      code: MSG.IO_WRITE, what: "write(" + fd + ", " + text.length + " bytes)",
      len: text.length + 32, path: f.path, node: f.node, text: text
    });
    if (rep && rep.err) throw { errno: rep.err };
    return rep;
  },
  close(clientPid, fd) { this.fds.delete(fd); return 0; },

  /* the two convenience wrappers the applications actually use             */
  async slurp(clientPid, path) {
    const fd = await this.open(clientPid, path, "r");
    const r = await this.read(clientPid, fd);
    this.close(clientPid, fd);
    return r;
  },
  async spit(clientPid, path, text) {
    const fd = await this.open(clientPid, path, "w");
    const r = await this.write(clientPid, fd, text);
    this.close(clientPid, fd);
    return r;
  },
  async readdir(clientPid, path) {
    const r = Prefix.resolve(path);
    const srv = Net.serverFor(r);
    if (!srv) throw { errno: "ENOENT" };
    const rep = await K.Send(clientPid, srv.pid, {
      code: MSG.IO_READDIR, what: "readdir(\"" + path + "\")", len: 96, path: r.path, node: r.node
    });
    if (rep && rep.err) throw { errno: rep.err };
    return rep.entries;
  },
  async stat(clientPid, path) {
    const r = Prefix.resolve(path);
    const srv = Net.serverFor(r);
    if (!srv) throw { errno: "ENOENT" };
    const rep = await K.Send(clientPid, srv.pid, {
      code: MSG.IO_STAT, what: "stat(\"" + path + "\")", len: 96, path: r.path, node: r.node
    });
    if (rep && rep.err) throw { errno: rep.err };
    return rep;
  },
  async dfree(clientPid) {
    const srv = K.byName("Fsys");
    if (!srv) throw { errno: "ENOSYS", msg: "Fsys is not running" };
    return await K.Send(clientPid, srv.pid, { code: MSG.FSYS_DFREE, what: "dfree()", len: 24 });
  }
};

/* ==========================================================================
   MODULE 8 — FLEET: NODES, AND WHY //2/ NEEDS NO EXPLANATION
   --------------------------------------------------------------------------
   Fault-tolerant networking, Load balancing on the fly, Efficient
   performance, Extensible architecture, Transparent distributed processing.
   That is what the F, L, E, E and T stood for in QNX's own literature, and
   the last one is the one that matters here: network messaging is not a layer
   on top of local messaging, it is the same primitive with a node number in
   front of it. There is no network Send().

   In this simulation the other nodes' processes are in the same process table
   as ours, with a different node number. That is not a shortcut — it is the
   architecture. The only thing Net adds is the wire, and the wire only adds
   latency.
   ========================================================================== */
const Net = {
  node: 1,
  hostname: "demo",
  nodes: [
    { nid: 1, name: "demo", ip: "10.0.0.14", mac: "00:60:8c:1a:2b:3c",
      card: "NE2000", desc: "this machine — the floppy you just booted", up: true },
    { nid: 2, name: "fileserver", ip: "10.0.0.2", mac: "00:60:8c:07:41:9a",
      card: "3C509", desc: "a QNX 4 box with a real hard disk", up: true },
    { nid: 3, name: "plc", ip: "10.0.0.3", mac: "00:60:8c:11:0d:54",
      card: "NE2000", desc: "a cell controller. no screen, no keyboard, no complaints", up: true }
  ],
  ip: "0.0.0.0", mask: "255.255.255.0", gw: "", dns: "",
  up: false, media: "none", txPkts: 0, rxPkts: 0, txBytes: 0, rxBytes: 0,

  nodeOf(nid) { return this.nodes.find(n => n.nid === nid); },

  /* find the process that owns a resolved path, local or remote            */
  serverFor(r) {
    if (r.node === this.node) return K.byName(r.owner, this.node);
    const nd = this.nodeOf(r.node);
    if (!nd || !nd.up) return null;
    const net = K.byName("Net", this.node);
    if (!net) return null;
    const target = K.byName(r.remote || "Fsys", r.node);
    if (!target) return null;
    VC.create(r.node, target.pid, r.remote);
    /* the client sends to the VID; Net relays. We return Net, and Net's
       message handler forwards to the process on the other node.           */
    return net;
  },

  reset() {
    this.node = 1; this.ip = "0.0.0.0"; this.up = false; this.media = "none";
    this.txPkts = this.rxPkts = this.txBytes = this.rxBytes = 0;
    for (const n of this.nodes) n.up = true;
  }
};

/* ==========================================================================
   MODULE 9 — THE SYSTEM PROCESSES
   --------------------------------------------------------------------------
   Every entry here is an ordinary process. None of them is privileged, none
   of them is in the kernel, and every one of them can be slain from the
   terminal. What breaks when you do is the exhibit's argument.
   ========================================================================== */
const Sys = {
  P: {},                               /* name -> process, for convenience  */
  variant: "net",

  spawn(o) {
    /* starting something that is already there is not an error and must not
       make a second one: Proc would have refused, and so does this          */
    const already = K.byName(o.name, o.node === undefined ? 1 : o.node);
    if (already) return already;
    const p = K.create(o);
    K.nameAttach(p.pid, o.name);
    this.P[(o.node && o.node !== 1 ? o.node + ":" : "") + o.name] = p;
    if (o.prefix) for (const pre of [].concat(o.prefix)) Prefix.add(pre, o.name);
    if (o.onDeath0) p.onDeath = o.onDeath0;
    return p;
  },

  /* ---- Proc: process creation, prefixes, VC integrity ------------------- */
  makeProc(node) {
    return this.spawn({
      pid: node === 1 ? 1 : undefined, name: "Proc", node: node, prio: 31, sched: "f",
      sys: true, kind: "manager", code: 132000, data: 34000, persistent: true,
      flags: "-S---------------------------FiI",
      desc: "process manager: spawn, prefixes, virtual-circuit integrity. shares its file with the microkernel.",
      onMsg: (m) => {
        if (!m) return { ok: 1 };
        if (m.code === MSG.PROC_SPAWN) return { pid: m.pid || 0, what: "spawned " + (m.prog || "?") };
        if (m.code === MSG.PROC_NAME_LOCATE) {
          const p = K.byName(m.name, m.node || node);
          return p ? { pid: p.pid, what: "pid " + p.pid } : { err: "ESRCH" };
        }
        return { ok: 1, what: "status 0" };
      }
    });
  },

  /* ---- Fsys and its block driver ---------------------------------------- */
  makeFsys(node) {
    const flop = this.spawn({
      name: "Fsys.floppy", node: node, prio: 22, sched: "r", sys: true, kind: "driver",
      code: 21000, data: 12000, prefix: null,
      desc: "block driver for /dev/fd0. Knows about heads, tracks and sectors; knows nothing about files.",
      onMsg: (m) => {
        if (Machine.wp && m && m.code === MSG.FSYS_BLOCK_WRITE)
          return { err: "EROFS", what: "write protected" };
        Machine.seek(m && m.blocks || 1);
        return new Promise(res => setTimeout(() => res({
          what: (m && m.blocks || 1) + " block" + ((m && m.blocks) > 1 ? "s" : "") + " at " +
            ((m && m.lba) || 0), len: ((m && m.blocks) || 1) * 512
        }), Machine.floppyRealtime ? 24 : 2));
      }
    });
    return this.spawn({
      name: "Fsys", node: node, prio: 21, sched: "r", sys: true, kind: "manager",
      code: 96000, data: 41000, floats: true, prefix: ["/"],
      desc: "the filesystem manager. Turns I/O messages into block-driver messages. Not in the kernel.",
      onMsg: async (m, from, me) => {
        if (!m) return { ok: 1 };
        /* each node's Fsys holds its own tree, in its own address space     */
        const V = NodeFS.of(node);
        const path = m.path;
        if (m.code === MSG.IO_OPEN) {
          const n = V.get(path);
          if (!n && m.mode !== "w") return { err: "ENOENT" };
          if (n && n.t === "d" && m.mode !== "r") return { err: "EISDIR" };
          if (!n && Machine.wp) return { err: "EROFS", what: "the write-protect tab is open" };
          /* a real open reads the directory blocks off the medium           */
          await K.Send(me.pid, flop.pid, {
            code: MSG.FSYS_BLOCK_READ, what: "read dir blocks for " + path,
            blocks: 1, lba: 33 + (path.length % 97), len: 40
          });
          return { size: n ? n.size : 0, what: "fd, " + U.n(n ? n.size : 0) + " bytes" };
        }
        if (m.code === MSG.IO_READ) {
          const n = V.get(path);
          if (!n) return { err: "ENOENT" };
          const blocks = Math.max(1, Math.ceil((n.size || 512) / 512));
          await K.Send(me.pid, flop.pid, {
            code: MSG.FSYS_BLOCK_READ, what: "read " + blocks + " blocks",
            blocks: Math.min(blocks, 64), lba: 100 + (path.length % 512), len: 40
          });
          const r = V.read(path);
          return { text: r.text, bin: r.bin, size: r.size, what: U.n(r.size || 0) + " bytes" };
        }
        if (m.code === MSG.IO_WRITE) {
          if (Machine.wp) return { err: "EROFS", what: "the write-protect tab is open" };
          const w = V.write(path, m.text);
          if (w.err) return { err: w.err };
          await K.Send(me.pid, flop.pid, {
            code: MSG.FSYS_BLOCK_WRITE, what: "write " + Math.ceil(m.text.length / 512) + " blocks",
            blocks: Math.ceil(m.text.length / 512), lba: 800, len: m.text.length
          });
          return { size: w.size, what: U.n(w.size) + " bytes written" };
        }
        if (m.code === MSG.IO_READDIR) {
          if (!V.isDir(path)) return { err: "ENOTDIR" };
          await K.Send(me.pid, flop.pid, {
            code: MSG.FSYS_BLOCK_READ, what: "read directory " + path, blocks: 1, lba: 33, len: 40
          });
          return { entries: V.ls(path), what: V.ls(path).length + " entries" };
        }
        if (m.code === MSG.IO_STAT) {
          const n = V.get(path);
          return n ? { t: n.t, size: n.size, mtime: n.mtime, what: n.t + ", " + U.n(n.size) } : { err: "ENOENT" };
        }
        if (m.code === MSG.FSYS_DFREE) {
          const used = V.used();
          return { total: FLOPPY_BYTES, used: used, free: Math.max(0, FLOPPY_BYTES - used),
            what: U.kb(used) + " used" };
        }
        return { ok: 1 };
      },
      onDeath0: () => { Prefix.drop("Fsys"); }
    });
  },

  /* ---- Dev and the character drivers ------------------------------------ */
  makeDev(node) {
    const ansi = this.spawn({
      name: "Dev.ansi", node: node, prio: 21, sched: "r", sys: true, kind: "driver",
      code: 24000, data: 18000,
      desc: "console driver. Four virtual consoles; Ctrl-Alt-1..4 switches them on the real thing.",
      onMsg: () => ({ what: "ok" })
    });
    const ser = this.spawn({
      name: "Dev.ser", node: node, prio: 22, sched: "r", sys: true, kind: "driver",
      code: 17000, data: 9000,
      desc: "8250/16550 serial driver. One byte per transmit interrupt; triggers a proxy only when the buffer empties.",
      onMsg: (m) => {
        Modem.rx(m);
        /* the interrupt handler fed the last byte out. It cannot Send() —
           that would block — so it triggers a proxy instead, which is the
           example QNX's own architecture manual gives for proxies.          */
        if (ser && ser.txProxy) K.Trigger(0, ser.txProxy);
        return { what: "ok" };
      }
    });
    ser.txProxy = K.proxyAttach(ser.pid, "tx buffer empty (from the interrupt handler)");
    this.spawn({
      name: "Dev.pty", node: node, prio: 20, sched: "r", sys: true, kind: "driver",
      code: 9000, data: 7000, desc: "pseudo-terminals. pterm talks to one of these.",
      onMsg: () => ({ what: "ok" })
    });
    return this.spawn({
      name: "Dev", node: node, prio: 24, sched: "r", sys: true, kind: "manager",
      code: 47000, data: 22000, floats: true, prefix: ["/dev"],
      desc: "the device manager. Owns /dev; the drivers own the hardware.",
      onMsg: async (m, from, me) => {
        if (!m) return { ok: 1 };
        const V = NodeFS.of(node);
        const p = m.path || "";
        if (m.code === MSG.IO_OPEN) {
          const n = V.get(p);
          if (!n) return { err: "ENOENT" };
          return { size: 0, what: p };
        }
        if (m.code === MSG.IO_READDIR) {
          if (!V.isDir(p)) return { err: "ENOTDIR" };
          return { entries: V.ls(p), what: V.ls(p).length + " entries" };
        }
        if (m.code === MSG.IO_STAT) {
          const n = V.get(p);
          return n ? { t: n.t, size: n.size, mtime: n.mtime, what: (n.t === "c" ? "character device" : n.t) } : { err: "ENOENT" };
        }
        if (m.code === MSG.IO_WRITE || m.code === MSG.DEV_WRITE) {
          const drv = /ser/.test(p) ? ser : ansi;
          await K.Send(me.pid, drv.pid, {
            code: MSG.DEV_WRITE, what: "to " + p + ": " + JSON.stringify((m.text || "").slice(0, 18)),
            len: (m.text || "").length + 24, text: m.text
          });
          return { size: (m.text || "").length, what: "ok" };
        }
        if (m.code === MSG.IO_READ) return { text: "", size: 0, what: "0 bytes" };
        return { ok: 1 };
      },
      onDeath0: () => { Prefix.drop("Dev"); }
    });
  },

  /* ---- Net, its card driver, and the TCP/IP stack ----------------------- */
  makeNet(node) {
    const drvName = this.variant === "modem" ? null :
      (node === 2 ? "Net.ether509" : "Net.ether2100");
    let drv = null;
    if (drvName) {
      drv = this.spawn({
        name: drvName, node: node, prio: 25, sched: "r", sys: true, kind: "driver",
        code: 22000, data: 14000,
        desc: "network card driver. Packetisation, sequencing and retransmission live here, not in Net.",
        onMsg: (m) => {
          Net.txPkts++; Net.txBytes += (m && m.len) || 64;
          return new Promise(res => setTimeout(() => {
            Net.rxPkts++; res({ what: "frame away, " + ((m && m.len) || 64) + " bytes" });
          }, 1));
        }
      });
    }
    const net = this.spawn({
      name: "Net", node: node, prio: 24, sched: "r", sys: true, kind: "manager",
      code: 58000, data: 26000, floats: true,
      desc: "FLEET. Relays Send/Receive/Reply to other nodes over virtual circuits. Can be started and stopped at will.",
      onMsg: async (m, from, me) => {
        if (!m) return { ok: 1 };
        /* a message for a resource on another node: relay it, and let the
           tracer see both halves of the conversation                        */
        if (m.node && m.node !== node) {
          const nd = Net.nodeOf(m.node);
          if (!nd || !nd.up) return { err: "EHOSTDOWN", what: "node " + m.node + " is not answering" };
          const target = K.byName(m.owner || (String(m.path).indexOf("/dev") === 0 ? "Dev" : "Fsys"), m.node);
          if (!target) return { err: "ESRCH", what: "no such manager on node " + m.node };
          if (drv) await K.Send(me.pid, drv.pid, {
            code: MSG.NET_TX, what: "VC packet to node " + m.node, len: (m.len || 64)
          });
          const rep = await K.Send(me.pid, target.pid, m);
          const v = VC.list.find(x => x.node === m.node);
          if (v) v.bytes += (m.len || 64) + ((rep && rep.len) || 32);
          return rep;
        }
        return { ok: 1, what: "status 0" };
      },
      onDeath0: () => { VC.reset(); }
    });
    return net;
  },

  makeSocket(node) {
    return this.spawn({
      name: "Socket", node: node, prio: 20, sched: "r", sys: true, kind: "manager",
      code: 186000, data: 74000, floats: true,
      desc: "the TCP/IP stack. In QNX 4 this is a process with a socket API, not a subsystem inside a kernel. Kill it and only the things that were using the network stop.",
      onMsg: async (m, from, me) => {
        if (!m) return { ok: 1 };
        if (m.code === MSG.NET_TX) {
          if (!Net.up) return { err: "ENETDOWN", what: "no interface configured" };
          const drv = K.byName(Net.media === "ppp" ? "Dev.ser" : (K.byName("Net.ether2100") ? "Net.ether2100" : "Net.ether509"), node);
          if (!drv) return { err: "ENETDOWN", what: "no driver" };
          await K.Send(me.pid, drv.pid, {
            code: MSG.NET_TX, what: (m.what || "segment"), len: m.len || 512
          });
          return { what: "ACK " + (m.len || 512) + " bytes" };
        }
        if (m.code === MSG.NET_ARP) return { what: "who-has " + m.ip };
        return { ok: 1 };
      }
    });
  },

  /* ---- httpd: the Voyager Web Server, all 34K of it -------------------- */
  makeHttpd(node) {
    return this.spawn({
      name: "httpd", node: node, prio: 10, sched: "o", kind: "app",
      code: 34000, data: 18000,
      desc: "the Voyager Web Server. Serves /usr/httpd. The box copy: \"our tiny web server allows even a diskless embedded system to generate dynamic HTML in real time.\"",
      onMsg: async (m, from, me) => {
        if (!m || !m.url) return { ok: 1 };
        const u = String(m.url);
        let path = "/usr/httpd" + (u === "/" ? "/index.html" : u);
        if (/\/$/.test(path)) path += "index.html";
        try {
          const r = await IO.slurp(me.pid, path);
          const page = Web.local(u);
          return { status: 200, body: page, len: (page && page.bytes) || r.size || 512,
            what: "200 OK, " + U.n((page && page.bytes) || r.size || 0) + " bytes" };
        } catch (e) {
          const page = Web.local(u);
          if (page) return { status: 200, body: page, len: page.bytes, what: "200 OK (generated)" };
          return { status: 404, what: "404 Not Found: " + u };
        }
      }
    });
  },

  /* ---- Photon: the graphical microkernel -------------------------------- */
  makePhoton(node) {
    const ph = this.spawn({
      name: "Photon", node: node, prio: 15, sched: "r", sys: true, kind: "gui",
      code: 118000, data: 62000, floats: true, prefix: ["/dev/photon"],
      desc: "the graphical microkernel. It has no idea what a window is. It holds a three-dimensional event space, and it clips and steers events through the regions that other processes put there.",
      onMsg: (m, from, me) => {
        if (!m) return { ok: 1 };
        if (m.ph === "region") {
          Ph.addRegion(m.region);
          return { what: "region " + m.region.id + " at depth " + m.region.z };
        }
        if (m.ph === "unregion") { Ph.dropRegion(m.id); return { what: "region " + m.id + " removed" }; }
        if (m.ph === "draw") {
          const tiles = Ph.clip(m.id, m.rect);
          const drv = K.byName("Pg.vga4", node) || K.byName("Pg.flat", node);
          if (!drv) return { err: "ENODEV", what: "no graphics driver has a region in front" };
          return K.Send(me.pid, drv.pid, {
            code: 0x0110, what: "draw event, " + tiles + " tile" + (tiles === 1 ? "" : "s"),
            len: 64 + tiles * 16, tiles: tiles
          }).then(() => ({ what: tiles + " tiles drawn" }));
        }
        if (m.ph === "input") {
          const target = Ph.steer(m.at);
          if (!target) return { what: "no sensitive region — event reached the root" };
          const owner = K.get(target.owner);
          if (!owner) return { what: "region owner is gone" };
          return K.Send(me.pid, owner.pid, {
            code: 0x0111, what: m.kind + " -> " + target.name, len: 40, ev: m
          }).then(() => ({ what: "delivered to " + target.name }));
        }
        return { ok: 1 };
      },
      onDeath0: () => {
        /* every one of these had a region in Photon's event space and a
           connection to it. With the space gone they have nothing to talk
           to, so they exit — which is exactly what a Photon application
           does when it gets EHANGUP from the server.                       */
        for (const name of ["pwm", "phfont", "Pg.vga4", "Pg.flat", "Input"]) {
          const q = K.byName(name, node);
          if (q) K.kill(q.pid);
        }
        Ph.collapse();
      }
    });
    this.spawn({
      name: "Pg.vga4", node: node, prio: 16, sched: "r", sys: true, kind: "driver",
      code: 26000, data: 11000,
      desc: "the graphics driver. A region at the very front of the event space, sensitive to draw events. Photon's own documentation says to imagine it coated in phosphor.",
      onMsg: (m) => { Ph.frames++; Ph.tiles += (m && m.tiles) || 1; return { what: "blitted" }; }
    });
    this.spawn({
      name: "Input", node: node, prio: 17, sched: "r", sys: true, kind: "driver",
      code: 31000, data: 9000,
      desc: "mouse and keyboard. Puts a region at the front of the event space and injects events inwards, towards the root.",
      onMsg: () => ({ what: "ok" })
    });
    this.spawn({
      name: "phfont", node: node, prio: 12, sched: "o", kind: "manager",
      code: 44000, data: 21000,
      desc: "the font server. Renders Dutch, Swiss and Courier from latin1.pfr at any point size. Kill it and the text stops, not the machine.",
      onMsg: (m) => ({ what: "extent " + ((m && m.text || "").length * 6) + "px" })
    });
    this.spawn({
      name: "pwm", node: node, prio: 12, sched: "o", kind: "gui",
      code: 62000, data: 28000,
      desc: "the Photon Window Manager. Filters events with regions placed BEHIND the application's own, and draws title bars and gadgets on them. Entirely optional: an embedded system just leaves it out.",
      onMsg: () => ({ what: "ok" }),
      onDeath0: () => { PWM.stripChrome(); }
    });
    return ph;
  },

  /* ---- the other two nodes ---------------------------------------------- */
  makeRemote(nid) {
    this.makeProc(nid);
    this.makeFsys(nid);
    this.makeDev(nid);
    this.makeNet(nid);
    if (nid === 2) {
      this.spawn({ name: "Fsys.eide", node: nid, prio: 22, sched: "r", sys: true, kind: "driver",
        code: 38000, data: 16000, desc: "EIDE driver. There is a real hard disk on this node." });
      this.spawn({ name: "inetd", node: nid, prio: 10, kind: "app", code: 22000, data: 9000,
        desc: "the internet super-server" });
      this.spawn({ name: "nfsd", node: nid, prio: 10, kind: "app", code: 61000, data: 24000,
        desc: "NFS, for the machines that are not QNX" });
      this.spawn({ name: "ksh", node: nid, prio: 10, kind: "app", code: 154000, data: 38000,
        desc: "somebody is logged in on node 2" });
    } else {
      this.spawn({ name: "Dev.par", node: nid, prio: 22, sched: "r", sys: true, kind: "driver",
        code: 11000, data: 6000, desc: "parallel port" });
      this.spawn({ name: "cellctl", node: nid, prio: 26, sched: "f", kind: "app",
        code: 44000, data: 96000, floats: true,
        desc: "the reason this node exists. Priority 26, FIFO, and it has a deadline." });
      this.spawn({ name: "iolog", node: nid, prio: 8, kind: "app", code: 12000, data: 220000,
        desc: "writes the cell's I/O history to node 2's disk, over //2/" });
    }
    /* give each remote node's file tree something to find                   */
  },

  /* ---- assemble the machine, in the order the boot log shows ------------ */
  boot(variant) {
    this.P = {};
    Prefix.table.length = 0;
    K.reset(); VC.reset(); Net.reset();
    this.variant = variant;
    FS.build(variant);
    State.applyFiles();
    this.makeProc(1);
    this.makeFsys(1);
    this.makeDev(1);
    this.makeNet(1);
    this.makeSocket(1);
    if (variant === "modem") {
      this.spawn({ name: "pppd", node: 1, prio: 20, sched: "r", sys: true, kind: "manager",
        code: 41000, data: 19000,
        desc: "PPP, with pap and chap, exactly as the sleeve promised.",
        onMsg: () => ({ what: "ok" }) });
    }
    this.makeHttpd(1);
    this.makePhoton(1);
    this.makeRemote(2);
    this.makeRemote(3);
    /* remote nodes get their own copies of the interesting paths            */
    Registry.notify();
  }
};

/* ==========================================================================
   MODULE 10 — THE MACHINE: floppy, write-protect tab, and the modem
   ========================================================================== */
const Machine = {
  wp: false,                 /* the write-protect tab. It does something.    */
  floppyRealtime: false,
  seeks: 0, steps: 0,
  ram: 8 * 1024 * 1024,      /* "minimum 8M*" — the sleeve's own footnote    */
  cpu: "Pentium 166",
  seek(blocks) {
    this.seeks++; this.steps += Math.max(1, Math.min(6, blocks));
    Sound.floppy(blocks);
  },
  /* 8 MB, minus the image the loader unpacked, minus every process's code and
     data, minus what the extensions took. The sleeve warned about this.     */
  ramLeft() {
    let used = 0;
    for (const p of K.list()) if (p.node === 1) used += p.code + p.data;
    for (const [k, v] of FS.nodes) if (v.kind === "pkg") used += v.size;
    return this.ram - used - 512 * 1024;
  },
  reset() { this.seeks = 0; this.steps = 0; }
};

const Modem = {
  state: "idle",            /* idle|dialing|handshake|up                     */
  number: "1-613-591-0931",
  isp: "QNX Demo Access",
  bytes: 0,
  rx(m) { this.bytes += (m && m.text ? m.text.length : 0); },
  reset() { this.state = "idle"; this.bytes = 0; }
};

/* ==========================================================================
   MODULE 11 — THE PHOTON EVENT SPACE
   --------------------------------------------------------------------------
   The root region is at the back. The user is at the front. Everything in
   between is a rectangle owned by some process, with two bitmasks:

       sensitive  — I want to be told when this kind of event crosses me
       opaque     — I modify this kind of event as it crosses me

   Four combinations, and every windowing behaviour you know falls out of
   them. Not sensitive + opaque is an ordinary window clipping the draw
   events of the windows behind it. Sensitive + opaque is an event filter: a
   region can absorb pen events, run handwriting recognition on them, and
   emit keystrokes instead. Sensitive + transparent is a logger, and this
   simulation's tracer is one.

   Draw events travel outwards, towards the graphics driver's region at the
   front. Input events travel inwards, towards the root. Both are clipped by
   whatever they cross. That is the whole model.
   ========================================================================== */
const Ph = {
  regions: [],           /* back (z=0, the root) to front                    */
  frames: 0, tiles: 0, events: 0,
  nextId: 1,

  reset() { this.regions = []; this.frames = this.tiles = this.events = 0; this.nextId = 1; }, 

  root() {
    return { id: 0, name: "root", owner: 0, x: 0, y: 0, w: Display.w, h: Display.h, z: 0,
      sens: ["draw"], opaque: [], kind: "root" };
  },
  /* Photon notices when a region's owner is gone — the connection breaks —
     and takes the region out of the space. Nothing else has to tidy up.    */
  prune() {
    const before = this.regions.length;
    this.regions = this.regions.filter(r => !r.owner || K.get(r.owner));
    return before - this.regions.length;
  },
  addRegion(r) {
    this.prune();
    r.id = r.id || this.nextId++;
    this.regions = this.regions.filter(x => x.id !== r.id);
    this.regions.push(r);
    this.regions.sort((a, b) => a.z - b.z);
    return r.id;
  },
  dropRegion(id) { this.regions = this.regions.filter(r => r.id !== id); },
  get(id) { return this.regions.find(r => r.id === id) || null; },

  /* how many tiles is a draw event cut into by the regions in front of it?  */
  clip(id, rect) {
    this.prune();
    const me = this.get(id);
    if (!me) return 1;
    let tiles = 1;
    for (const r of this.regions) {
      if (r.z <= me.z || r.opaque.indexOf("draw") < 0) continue;
      if (r.x > me.x + me.w || r.x + r.w < me.x || r.y > me.y + me.h || r.y + r.h < me.y) continue;
      /* a rectangle overlapping a corner leaves two tiles, an edge leaves
         one, a bite out of the middle leaves four. Approximate honestly.    */
      const insideX = r.x > me.x && r.x + r.w < me.x + me.w;
      const insideY = r.y > me.y && r.y + r.h < me.y + me.h;
      tiles += insideX && insideY ? 3 : insideX || insideY ? 2 : 1;
    }
    this.events++;
    return Math.min(tiles, 24);
  },

  /* an input event travels inwards until a sensitive region collects it     */
  steer(at) {
    this.prune();
    for (let i = this.regions.length - 1; i >= 0; i--) {
      const r = this.regions[i];
      if (r.sens.indexOf("ptr") < 0) continue;
      if (at.x >= r.x && at.x <= r.x + r.w && at.y >= r.y && at.y <= r.y + r.h) return r;
    }
    return null;
  },

  /* Photon has died. Regions do not outlive the space that held them.       */
  collapse() {
    this.regions = [];
    PWM.photonDied();
  },

  /* how deep is the stack of regions between the root and the user?         */
  depth() { return this.regions.length; }
};

/* ==========================================================================
   MODULE 12 — pwm: THE PHOTON WINDOW MANAGER, AND THE APPLICATION FRAME
   --------------------------------------------------------------------------
   Everything visible below is drawn by pwm, which is a process, which is
   optional. Kill it and the windows are still there — just naked, with no
   title bars, no taskbar and no menu, because those were regions pwm had
   placed behind the applications' own. Kill Photon instead and there is
   nothing left to place regions in.
   ========================================================================== */
const APPS = {};
function defApp(name, def) { APPS[name] = Object.assign({ name: name }, def); }

const PWM = {
  wins: [], zTop: 100, focus: null, alive: false, chrome: true,
  menuEl: null, popEl: null,

  /* ---- lifecycle -------------------------------------------------------- */
  start() {
    this.alive = true; this.chrome = true;
    $("#desk").classList.remove("dead");
    $("#taskbar").style.display = "";
    this.paintTaskbar();
  },
  stripChrome() {
    /* pwm has died. The applications have not. */
    this.chrome = false;
    $("#taskbar").style.display = "none";
    for (const w of this.wins) {
      w.el.classList.add("nochrome");
      w.tt.style.display = "none";
      w.el.style.borderColor = "#000";
    }
    Toast.show("pwm is gone. The windows are still running — they just have nothing drawing their frames.");
  },
  photonDied() {
    this.alive = false;
    for (const w of this.wins.slice()) {
      const pid = w.pid;
      this.destroy(w, true);
      if (K.get(pid)) K.kill(pid);
    }
    $("#taskbar").style.display = "none";
    $("#desk").classList.add("dead");
    Console.enter();
  },

  /* ---- open an application ---------------------------------------------- */
  async launch(name, arg) {
    const app = APPS[name];
    if (!app) { Toast.show("pwm: " + name + ": not found"); return null; }
    if (!K.byName("Photon") && !app.textmode) {
      Toast.show(name + ": cannot connect to Photon — there is no event space to put a region in");
      return null;
    }
    if (app.single) {
      const found = this.wins.find(w => w.app.name === name);
      if (found) { this.raise(found); if (app.reinit) app.reinit(found, arg); return found; }
    }
    const p = K.create({
      name: app.exe || name, prio: app.prio || 10, sched: "o", kind: app.kind || "app",
      code: app.code || 40000, data: app.data || 20000, parent: 1,
      desc: app.desc || "", floats: false,
      onMsg: (m) => {
        if (m && m.code === 0x0111 && m.ev) { /* an input event from Photon  */ }
        return { what: "ok" };
      }
    });
    const w = this.create(app, p, arg);
    /* tell Photon about the region. This is a real message.                 */
    const ph = K.byName("Photon");
    if (ph) {
      /* the client does not touch the event space: it describes a region and
         sends it to Photon, which is the only process that owns the space   */
      const desc = {
        id: Ph.nextId++, name: app.exe || name, owner: p.pid,
        x: w.x, y: w.y, w: w.w, h: w.h, z: this.zTop,
        sens: ["ptr", "key"], opaque: ["draw", "ptr"], kind: "app"
      };
      w.region = desc.id;
      K.Send(p.pid, ph.pid, {
        code: 0x0112, ph: "region", region: desc,
        what: "PhRegionOpen(" + (app.exe || name) + ")", len: 72
      }).catch(() => { });
    }
    if (app.init) { try { await app.init(w, arg); } catch (e) { console.error(e); } }
    this.raise(w);
    this.paintTaskbar();
    return w;
  },

  create(app, proc, arg) {
    const n = this.wins.length;
    const w = {
      id: "w" + proc.pid, app: app, pid: proc.pid, st: {},
      x: app.x !== undefined ? app.x : U.clamp(28 + n * 17, 0, Display.w - (app.w || 400)),
      y: app.y !== undefined ? app.y : U.clamp(16 + n * 14, 0, Display.h - (app.h || 300) - 24),
      w: app.w || 400, h: app.h || 300,
      title: app.title || app.name, min: false, max: false, region: 0
    };
    /* where you last left this window. The real disk remembered nothing, so
       this is museum furniture — but it is the only kind of persistence a
       desktop arrangement can have.                                        */
    const saved = (State.d.wins || []).find(x => x.app === app.name);
    if (saved && app.resize !== false) {
      w.x = U.clamp(saved.x, 0, Display.w - 60); w.y = U.clamp(saved.y, 0, Display.h - 60);
      w.w = U.clamp(saved.w, app.minw || 180, Display.w);
      w.h = U.clamp(saved.h, app.minh || 90, Display.h - 24);
    }
    const tt = el("div", { class: "win-tt" });
    const sysb = el("div", { class: "tbtn", title: "Window menu" },
      U.ico('<path d="M4 6l4 5 4-5z" fill="#000"/>', { w: 13, h: 13, vb: "0 0 16 16" }));
    const cap = el("div", { class: "cap", text: w.title });
    const right = el("div", { class: "flexrow", style: "gap:0" });
    const bMin = el("div", { class: "tbtn", title: "Minimise" },
      U.ico('<rect x="3" y="7" width="7" height="2" fill="#000"/>', { w: 13, h: 13 }));
    const bMax = el("div", { class: "tbtn", title: "Maximise" },
      U.ico('<rect x="3" y="3" width="8" height="8" fill="none" stroke="#000"/>', { w: 13, h: 13 }));
    const bCls = el("div", { class: "tbtn", title: "Close" },
      U.ico('<path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="#000" stroke-width="1.6" fill="none"/>', { w: 13, h: 13 }));
    if (app.help) right.appendChild(el("div", { class: "tbtn", title: "Help",
      onclick: () => Guide.open(app.help) }, U.ico('<text x="8" y="11" font-size="10" font-family="Helvetica" text-anchor="middle" fill="#000">?</text>', { w: 13, h: 13 })));
    if (app.resize !== false) { right.appendChild(bMin); right.appendChild(bMax); }
    else right.appendChild(bMin);
    right.appendChild(bCls);
    tt.appendChild(sysb); tt.appendChild(cap); tt.appendChild(right);
    const body = el("div", { class: "win-body" });
    const elw = el("div", { class: "win", id: w.id }, tt, body,
      app.resize === false ? null : el("div", { class: "win-rz" }),
      app.resize === false ? null : el("div", { class: "win-rz-r" }),
      app.resize === false ? null : el("div", { class: "win-rz-b" }));
    elw.style.left = w.x + "px"; elw.style.top = w.y + "px";
    elw.style.width = w.w + "px"; elw.style.height = w.h + "px";
    w.el = elw; w.tt = tt; w.body = body; w.cap = cap;
    w.setTitle = (t) => { w.title = t; cap.textContent = t; PWM.paintTaskbar(); };
    w.close = () => PWM.destroy(w);
    $("#wins").appendChild(elw);
    this.wins.push(w);

    bCls.addEventListener("click", e => { e.stopPropagation(); this.destroy(w); });
    bMin.addEventListener("click", e => { e.stopPropagation(); this.minimise(w); });
    bMax.addEventListener("click", e => { e.stopPropagation(); this.maximise(w); });
    sysb.addEventListener("click", e => { e.stopPropagation(); this.winMenu(w, sysb); });
    elw.addEventListener("mousedown", () => this.raise(w), true);
    this.dragify(w, tt);
    if (app.resize !== false) {
      this.resizify(w, elw.querySelector(".win-rz"), 1, 1);
      this.resizify(w, elw.querySelector(".win-rz-r"), 1, 0);
      this.resizify(w, elw.querySelector(".win-rz-b"), 0, 1);
    }
    return w;
  },

  destroy(w, quiet) {
    if (!w) return;
    const ph = K.byName("Photon");
    if (ph && w.region) K.Send(1, ph.pid, {
      code: 0x0113, ph: "unregion", id: w.region, what: "PhRegionClose()", len: 24
    }).catch(() => { });
    Ph.dropRegion(w.region);
    if (w.app.onClose) { try { w.app.onClose(w); } catch (e) { } }
    if (w.timers) for (const t of w.timers) clearInterval(t);
    if (w.el.parentNode) w.el.parentNode.removeChild(w.el);
    this.wins = this.wins.filter(x => x !== w);
    if (K.get(w.pid) && !quiet) K.kill(w.pid);
    if (this.focus === w) this.focus = null;
    const top = this.wins.filter(x => !x.min).sort((a, b) => (+a.el.style.zIndex) - (+b.el.style.zIndex)).pop();
    if (top) this.raise(top); else this.paintTaskbar();
    /* a window went away, so everything it covered has to redraw. Those draw
       events are the interesting ones: they are the ones that get clipped
       into several tiles on the way to the driver.                         */
    for (const x of this.wins) { x._lastDraw = 0; this.expose(x); }
  },

  raise(w) {
    if (!w || w.min) return;
    w.el.style.zIndex = ++this.zTop;
    const r = Ph.get(w.region); if (r) { r.z = this.zTop; Ph.regions.sort((a, b) => a.z - b.z); }
    for (const x of this.wins) x.el.classList.toggle("act", x === w);
    this.focus = w;
    this.paintTaskbar();
    this.expose(w);
    if (w.app.onFocus) try { w.app.onFocus(w); } catch (e) { }
  },
  minimise(w) { w.min = true; w.el.classList.add("min"); if (this.focus === w) this.focus = null; this.paintTaskbar(); },
  restore(w) { w.min = false; w.el.classList.remove("min"); this.raise(w); },
  maximise(w) {
    if (w.max) {
      Object.assign(w, w.pre);
      w.max = false;
    } else {
      w.pre = { x: w.x, y: w.y, w: w.w, h: w.h };
      w.x = 0; w.y = 0; w.w = SCR_W; w.h = SCR_H - 24; w.max = true;
    }
    this.place(w);
  },
  place(w) {
    w.el.style.left = w.x + "px"; w.el.style.top = w.y + "px";
    w.el.style.width = w.w + "px"; w.el.style.height = w.h + "px";
    const r = Ph.get(w.region);
    if (r) { r.x = w.x; r.y = w.y; r.w = w.w; r.h = w.h; }
    if (w.app.onResize) try { w.app.onResize(w); } catch (e) { }
    this.expose(w);
  },
  /* a real expose: the application emits a draw event, Photon clips it into
     tiles against every opaque region in front, and the graphics driver
     receives what is left. Throttled, because sixty of these a second would
     drown the tracer — which is itself the answer to "what does it cost".  */
  expose(w) {
    if (!w || !K.get(w.pid)) return;
    const now = U.now();
    if (w._lastDraw && now - w._lastDraw < 160) return;
    w._lastDraw = now;
    const ph = K.byName("Photon");
    if (!ph || !w.region) return;
    K.Send(w.pid, ph.pid, {
      code: 0x0115, ph: "draw", id: w.region, rect: { x: w.x, y: w.y, w: w.w, h: w.h },
      what: "PhDrawExpose(" + w.w + "x" + w.h + ")", len: 88
    }).catch(() => { });
  },

  dragify(w, handle) {
    handle.addEventListener("mousedown", ev => {
      if (ev.target.closest(".tbtn")) return;
      ev.preventDefault();
      this.raise(w);
      const p0 = Display.pt(ev), x0 = w.x, y0 = w.y;
      const move = e => {
        const p = Display.pt(e);
        w.x = U.clamp(Math.round(x0 + p.x - p0.x), -(w.w - 60), SCR_W - 40);
        w.y = U.clamp(Math.round(y0 + p.y - p0.y), 0, SCR_H - 40);
        this.place(w);
      };
      const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); Sound.click(); };
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    });
  },
  resizify(w, handle, hx, hy) {
    if (!handle) return;
    handle.addEventListener("mousedown", ev => {
      ev.preventDefault(); ev.stopPropagation();
      this.raise(w);
      const p0 = Display.pt(ev), w0 = w.w, h0 = w.h;
      const move = e => {
        const p = Display.pt(e);
        if (hx) w.w = U.clamp(Math.round(w0 + p.x - p0.x), w.app.minw || 180, SCR_W);
        if (hy) w.h = U.clamp(Math.round(h0 + p.y - p0.y), w.app.minh || 90, SCR_H - 24);
        this.place(w);
      };
      const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    });
  },

  winMenu(w, anchor) {
    const items = [
      { t: "Restore", d: !w.max, f: () => this.maximise(w) },
      { t: "Move", d: true },
      { t: "Size", d: w.app.resize === false, f: () => { } },
      { t: "Minimise", f: () => this.minimise(w) },
      { t: "Maximise", d: w.max, f: () => this.maximise(w) },
      { sep: 1 },
      { t: "Front", f: () => this.raise(w) },
      { t: "Back", f: () => { w.el.style.zIndex = 99; } },
      { sep: 1 },
      { t: "Close", k: "Alt+F4", f: () => this.destroy(w) },
      { sep: 1 },
      { t: "slay " + (K.get(w.pid) ? K.get(w.pid).name : "?"), k: "SIGTERM",
        f: () => Fault.slayPid(w.pid) }
    ];
    Menu.pop(items, anchor);
  },

  /* ---- the taskbar, as pwm draws it ------------------------------------- */
  paintTaskbar() {
    if (!this.chrome) return;
    const host = $("#tb-tasks");
    host.innerHTML = "";
    for (const w of this.wins) {
      const b = el("div", { class: "tb-btn bv" + (this.focus === w ? " act" : ""), title: w.title,
        onclick: () => { if (w.min) this.restore(w); else if (this.focus === w) this.minimise(w); else this.raise(w); } },
        Icons.appIcon(w.app.icon || "app"), el("span", { text: w.title }));
      host.appendChild(b);
    }
    const clk = $("#tb-clock");
    clk.textContent = U.hhmm(Date.now());
  },

  /* ---- the workspace menu, parsed out of pwm.menu ----------------------- */
  menuSpec: [],
  async loadMenu() {
    try {
      const r = await IO.slurp(K.byName("pwm") ? K.byName("pwm").pid : 1,
        "/usr/httpd/.photon/pwm/pwm.menu");
      this.menuSpec = this.parseMenu(r.text || "");
    } catch (e) {
      this.menuSpec = this.parseMenu(Sys.variant === "modem" ? PWM_MENU_MODEM : PWM_MENU_NET);
    }
    return this.menuSpec;
  },
  parseMenu(txt) {
    const out = [];
    for (const raw of String(txt).split("\n")) {
      const line = raw.replace(/\s+$/, "");
      if (!line) continue;
      if (line[0] === "=") { out.push({ head: line.slice(1) }); continue; }
      if (line === "-") { out.push({ sep: 1 }); continue; }
      const f = line.split("\t").filter(s => s !== "");
      if (f.length === 1) { out.push({ label: f[0], cmd: "" }); continue; }
      const label = f[0];
      const cmd = f.length >= 3 ? f.slice(2).join(" ") : f[1];
      const mn = f.length >= 3 ? f[1].trim() : "";
      out.push({ label: label, mnem: mn, cmd: cmd });
    }
    return out;
  },
  async workspaceMenu(anchor) {
    const spec = await this.loadMenu();
    const items = [];
    for (const s of spec) {
      if (s.head) { items.push({ head: s.head }); continue; }
      if (s.sep) { items.push({ sep: 1 }); continue; }
      items.push({
        t: s.label, mnem: s.mnem,
        f: () => Launch.run(s.cmd, s.label)
      });
    }
    items.push({ sep: 1 });
    items.push({ head: "Museum instruments" });
    items.push({ t: "Terminal (pterm)", f: () => PWM.launch("pterm") });
    items.push({ t: "Message tracer", f: () => PWM.launch("tracer") });
    items.push({ t: "Disk manifest", f: () => PWM.launch("manifest") });
    items.push({ t: "Process list (sin)", f: () => PWM.launch("sinwin") });
    items.push({ t: "Realtime latency", f: () => PWM.launch("latency") });
    items.push({ t: "FLEET: the network", f: () => PWM.launch("fleet") });
    items.push({ t: "Fault isolation", f: () => PWM.launch("fault") });
    items.push({ t: "History of QNX", f: () => PWM.launch("history") });
    items.push({ sep: 1 });
    items.push({ t: "Museum notes", f: () => Guide.toggle(true) });
    Menu.pop(items, anchor, { up: true });
  }
};

/* ---- popup menus, one implementation for every menu in the exhibit ------ */
const Menu = {
  cur: null,
  close() { if (this.cur && this.cur.parentNode) this.cur.parentNode.removeChild(this.cur); this.cur = null; },
  pop(items, anchor, opt) {
    opt = opt || {};
    this.close();
    const m = el("div", { class: "pop" });
    for (const it of items) {
      if (it.sep) { m.appendChild(el("div", { class: "sep" })); continue; }
      if (it.head) { m.appendChild(el("div", { class: "hd", text: it.head })); continue; }
      let label = it.t;
      const row = el("div", { class: "it" + (it.d ? " dis" : "") });
      if (it.mnem && label.toUpperCase().indexOf(it.mnem.toUpperCase()) >= 0) {
        const i = label.toUpperCase().indexOf(it.mnem.toUpperCase());
        row.appendChild(el("span", null, label.slice(0, i),
          el("span", { class: "mnem", style: "text-decoration:underline", text: label[i] }),
          label.slice(i + 1)));
      } else row.appendChild(el("span", { text: label }));
      if (it.k) row.appendChild(el("span", { class: "k", text: it.k }));
      if (!it.d) row.addEventListener("click", () => { this.close(); Sound.click(); if (it.f) it.f(); });
      m.appendChild(row);
    }
    $("#screen").appendChild(m);
    const r = anchor.getBoundingClientRect(), sc = Display.rect();
    let x = Math.round((r.left - sc.left) / Display.scale);
    let y = Math.round((r.bottom - sc.top) / Display.scale);
    if (opt.up) y = Math.round((r.top - sc.top) / Display.scale) - m.offsetHeight;
    x = U.clamp(x, 0, SCR_W - m.offsetWidth);
    y = U.clamp(y, 0, SCR_H - m.offsetHeight);
    m.style.left = x + "px"; m.style.top = y + "px";
    this.cur = m;
    setTimeout(() => {
      const off = ev => {
        if (m.contains(ev.target)) return;
        window.removeEventListener("mousedown", off, true); Menu.close();
      };
      window.addEventListener("mousedown", off, true);
    }, 0);
    return m;
  },
  /* a menu bar, as every Photon application has                            */
  bar(defs) {
    const bar = el("div", { class: "mbar" });
    for (const d of defs) {
      const b = el("div", null, el("span", { html: d.label.replace(/&(.)/, '<span class="mnem">$1</span>') }));
      b.addEventListener("click", () => {
        const items = typeof d.items === "function" ? d.items() : d.items;
        Menu.pop(items, b);
      });
      bar.appendChild(b);
    }
    return bar;
  }
};

/* ==========================================================================
   MODULE 13 — ARTWORK
   --------------------------------------------------------------------------
   Everything drawn in this exhibit is drawn here, in code, from scratch. The
   real QNX wordmark was a piece of custom lettering; this is not it and does
   not try to be. Where the disk showed a logo, this shows a plain geometric
   placeholder with the product name set in an ordinary sans, which is the
   museum's convention for a mark it will not reproduce.
   ========================================================================== */
const Icons = {
  mark(w) {
    w = w || 40;
    return U.ico(
      '<rect x="0.5" y="0.5" width="39" height="15" rx="3" fill="none" stroke="#000"/>' +
      '<text x="20" y="12" font-family="Helvetica,Arial,sans-serif" font-size="10.5" ' +
      'font-weight="700" text-anchor="middle" fill="#000" letter-spacing="1.2">QNX</text>',
      { w: w, h: Math.round(w * 0.4), vb: "0 0 40 16" });
  },
  markLight(w) {
    w = w || 46;
    return U.ico(
      '<rect x="0.5" y="0.5" width="45" height="17" rx="3" fill="none" stroke="#0d3f38"/>' +
      '<text x="23" y="13.5" font-family="Helvetica,Arial,sans-serif" font-size="11" ' +
      'font-weight="700" text-anchor="middle" fill="#0d3f38" letter-spacing="1.4">QNX</text>',
      { w: w, h: Math.round(w * 0.39), vb: "0 0 46 18" });
  },
  appIcon(kind) {
    const P = {
      voyager: '<rect x="1" y="1" width="11" height="11" fill="#fff" stroke="#000"/>' +
               '<text x="6.5" y="10" font-family="Helvetica" font-size="9" font-weight="700" text-anchor="middle" fill="#0000a5">V</text>',
      note:    '<rect x="1.5" y="0.5" width="10" height="12" fill="#fff" stroke="#000"/>' +
               '<path d="M3 3h7M3 5h7M3 7h5M3 9h6" stroke="#5a5a5a"/>',
      folder:  '<path d="M1 3h4l1 1.5h6V11H1z" fill="#ffff10" stroke="#000"/>',
      term:    '<rect x="1" y="1" width="11" height="11" fill="#000" stroke="#000"/>' +
               '<path d="M3 4l2 2-2 2M6.5 8.5h3.5" stroke="#10ff10"/>',
      cool:    '<rect x="1" y="1" width="11" height="11" fill="#000"/>' +
               '<path d="M2.5 8l2-3 2 3 2-4 2 4" stroke="#10ffff" fill="none"/>',
      net:     '<circle cx="6.5" cy="6.5" r="5" fill="none" stroke="#000"/>' +
               '<path d="M1.5 6.5h10M6.5 1.5c2.5 2 2.5 8 0 10M6.5 1.5c-2.5 2-2.5 8 0 10" stroke="#000" fill="none"/>',
      gear:    '<circle cx="6.5" cy="6.5" r="3" fill="none" stroke="#000"/>' +
               '<path d="M6.5 1v2M6.5 10v2M1 6.5h2M10 6.5h2M2.8 2.8l1.4 1.4M8.8 8.8l1.4 1.4M10.2 2.8L8.8 4.2M4.2 8.8L2.8 10.2" stroke="#000"/>',
      phone:   '<path d="M2 2c3 0 3 2 2 3s2 4 3 3 3-1 3 2-6 1-8-8z" fill="#000"/>',
      chart:   '<rect x="1" y="1" width="11" height="11" fill="#fff" stroke="#000"/>' +
               '<path d="M3 10V6M6 10V3M9 10V7" stroke="#0000a5" stroke-width="1.6"/>',
      disk:    '<rect x="1.5" y="1" width="10" height="11" fill="#5a5a5a" stroke="#000"/>' +
               '<rect x="3.5" y="2" width="6" height="4" fill="#fff"/>' +
               '<rect x="4.5" y="8" width="4" height="3" fill="#c6c6c6"/>',
      wire:    '<circle cx="3" cy="3" r="1.8" fill="#0000a5"/><circle cx="10" cy="6.5" r="1.8" fill="#007b6b"/>' +
               '<circle cx="3.5" cy="10" r="1.8" fill="#ff1010"/><path d="M3 3l7 3.5-6.5 3.5" stroke="#000" fill="none"/>',

/* ==========================================================================
   MODULE 14 — DISPLAY: 640x480, scaled to fit, integer where possible
   ========================================================================== */
const Display = {
  scale: 1, w: SCR_W, h: SCR_H,
  setMode(w, h) {
    this.w = w; this.h = h;
    const s = $("#screen");
    s.style.width = w + "px"; s.style.height = h + "px";
    this.fit();
  },
  fit() {
    const availW = window.innerWidth - (Guide.open_ ? 400 : 8) - 12;
    const availH = window.innerHeight - 26;
    const f = Math.min(availW / this.w, availH / this.h);
    let sc;
    if (f >= 2) sc = Math.floor(f);
    else if (f >= 1) sc = 1;
    else sc = Math.max(0.4, Math.floor(f * 100) / 100);
    this.scale = sc;
    const s = $("#screen"), c = $("#clip");
    s.style.transform = "scale(" + sc + ")";
    c.style.width = Math.round(this.w * sc) + "px";
    c.style.height = Math.round(this.h * sc) + "px";
    $("#scalenote").textContent = this.w + " × " + this.h +
      (sc === 1 ? " at 1:1" : sc > 1 ? " at " + sc + ":1" :
        " scaled to " + Math.round(sc * 100) + "% — below 1:1 the raster is interpolated");
    $("#stagewrap").style.paddingRight = Guide.open_ ? "392px" : "0";
  },
  rect() { return $("#screen").getBoundingClientRect(); },
  pt(ev) {
    const r = this.rect();
    return { x: (ev.clientX - r.left) / this.scale, y: (ev.clientY - r.top) / this.scale };
  }
};
window.addEventListener("resize", () => Display.fit());

   MODULE 15 — a one-line notice, bottom centre, the museum's voice

const Toast = {
  t: null,
  show(msg, ms) {
    const n = $("#toast");
    n.textContent = msg; n.classList.add("on");
    clearTimeout(this.t);
    this.t = setTimeout(() => n.classList.remove("on"), ms || 4600);
  },

};

/* ==========================================================================
   MODULE 16 — SOUND: synthesized, toggleable, and off except the floppy
   --------------------------------------------------------------------------
   Half the memory of this disk is the noise the drive made while it read it,
   so the floppy is on by default during the boot and nothing else is.
   ========================================================================== */
const Sound = {
  ctx: null, on: false, floppyOn: true, last: 0,
  init() {
    if (this.ctx) return this.ctx;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
    return this.ctx;
  },
  resume() { const c = this.init(); if (c && c.state === "suspended") c.resume(); },
  noise(dur, freq, q, gain, type) {
    const c = this.init(); if (!c) return;
    const n = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = type || "bandpass";
    f.frequency.value = freq; f.Q.value = q || 6;
    const g = c.createGain(); g.gain.value = gain === undefined ? 0.14 : gain;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start();
  },
  tone(freq, dur, gain, type) {
    const c = this.init(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(gain === undefined ? 0.05 : gain, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur + 0.02);
  },
  floppy(blocks) {
    if (!this.floppyOn) return;
    const t = U.now(); if (t - this.last < 42) return; this.last = t;
    /* the step is a click at the head; the seek is the whirr behind it       */
    this.noise(0.045, 1750 + Math.random() * 500, 9, 0.075);
    if ((blocks || 1) > 3) this.noise(0.13, 480, 2.2, 0.045, "lowpass");
  },
  click() { if (this.on) this.noise(0.014, 2600, 12, 0.045); },
  bell() { if (this.on) { this.tone(880, 0.09, 0.06); setTimeout(() => this.tone(1180, 0.07, 0.05), 60); } },
  /* a V.34 handshake is a duet: two tone pairs, then the scramble           */
  handshake() {
    if (!this.on) return;
    const seq = [[2100, .55, .035, "sine"], [1300, .3, .03, "sine"], [980, .25, .03, "sine"],
      [1650, .2, .025, "sine"], [2250, .18, .02, "sine"]];
    let t = 0;
    for (const [f, d, g, ty] of seq) { setTimeout(() => this.tone(f, d, g, ty), t * 1000); t += d * 0.8; }
    setTimeout(() => { for (let i = 0; i < 22; i++) setTimeout(() => this.noise(0.06, 700 + Math.random() * 2200, 4, 0.02), i * 55); }, t * 1000);
  },
  dtmf(digits) {
    if (!this.on) return;
    const R = { "1": [697, 1209], "2": [697, 1336], "3": [697, 1477], "4": [770, 1209], "5": [770, 1336],
      "6": [770, 1477], "7": [852, 1209], "8": [852, 1336], "9": [852, 1477], "0": [941, 1336] };
    let i = 0;
    for (const ch of String(digits)) {
      const p = R[ch]; if (!p) continue;
      setTimeout(() => { this.tone(p[0], 0.09, 0.03, "sine"); this.tone(p[1], 0.09, 0.03, "sine"); }, i * 130);
      i++;
    }
  }
};

/* ==========================================================================
   MODULE 17 — LAUNCH: pwm.menu command lines, run as written
   --------------------------------------------------------------------------
   The menu file's third field is a real command line with real switches. The
   Towers of Hanoi entry is not a Hanoi program: it is the browser, pointed at
   a page on the machine's own web server. That is the joke and the argument
   at the same time.
   ========================================================================== */
const Launch = {
  map: {
    voyager: "voyager", netcfg: "netcfg", dialer: "dialer", fbrowse: "fbrowse",
    note: "note", cool: "cool", destaller: "destaller", pdisplay: "pdisplay",
    pterm: "pterm", pfm: "fbrowse", pwmclock: "clock", ksh: "pterm"
  },
  parse(cmd) {
    const argv = String(cmd || "").trim().split(/\s+/).filter(Boolean);
    if (!argv.length) return null;
    const prog = argv[0].replace(/^.*\//, "");
    const o = { prog: prog, argv: argv, url: null, geom: {} };
    for (let i = 1; i < argv.length; i++) {
      const a = argv[i];
      if (a === "-u") o.url = argv[++i];
      else if (/^-u./.test(a)) o.url = a.slice(2);
      else if (/^-x(-?\d+)$/.test(a)) o.geom.x = +RegExp.$1;
      else if (/^-y(-?\d+)$/.test(a)) o.geom.y = +RegExp.$1;
      else if (/^-w(\d+)$/.test(a)) o.geom.w = +RegExp.$1;
      else if (/^-h(\d+)$/.test(a)) o.geom.h = +RegExp.$1;
      else if (a === "-c") o.compact = true;
    }
    return o;
  },
  run(cmd, label) {
    const o = this.parse(cmd);
    if (!o) return;
    if (o.prog === "reboot" || o.prog === "shutdown") { Boot.shutdown(); return; }
    const app = this.map[o.prog];
    if (!app) {
      Toast.show("pwm: " + o.prog + ": no such program on this disk");
      return;
    }
    return PWM.launch(app, o);
  }
};

/* ==========================================================================
   MODULE 18 — THE WEB, SUCH AS IT IS
   --------------------------------------------------------------------------
   Every page here is original, written for this exhibit in the visual idiom
   of 1999: tables for layout, one weight of one sans, a yellow band, and a
   link colour that has not been fashionable since. The demo disk's own home
   page came off its own web server at http://127.1/, which is the detail
   people forget: the floppy was serving the pages it was browsing.

   The pages are DOM builders rather than strings so that the browser can
   report a byte count for each one and the tracer can watch it fetched.
   ========================================================================== */
const Web = {
  pages: {},
  def(url, o) { this.pages[url] = o; },
  norm(u) {
    u = String(u || "").trim();
    if (!u) return "";
    if (!/^[a-z]+:\/\//i.test(u)) u = "http://" + u;
    u = u.replace(/^http:\/\/127\.1(?=[\/:]|$)/i, "http://127.1");
    if (!/^https?:\/\/[^\/]+\//.test(u)) u += "/";
    return u;
  },
  local(path) {
    const u = "http://127.1" + (path === "/" ? "/" : path);
    return this.pages[u] || null;
  },
  get(u) { return this.pages[this.norm(u)] || null; },
  isLocal(u) { return /^http:\/\/127\.1\//.test(this.norm(u)); },
  host(u) { const m = /^https?:\/\/([^\/]+)/.exec(this.norm(u)); return m ? m[1] : ""; },
  bookmarks: [
    { t: "The Incredible 1.44M Demo", u: "http://127.1/" },
    { t: "Towers of Hanoi", u: "http://127.1/hanoi/game.html" },
    { t: "How we did it", u: "http://127.1/howwedidit.html" },
    { t: "Server status (generated)", u: "http://127.1/status.html" },
    { t: "QNX Software Systems", u: "http://www.qnx.com/" },
    { t: "The Network Computer arrives", u: "http://www.thinfuture.example/nc.html" },
    { t: "WebCrawler-ish search", u: "http://search.example/" },
    { t: "A web page from 2026", u: "http://www.modernweb.example/" }
  ]
};

Web.def("http://127.1/hanoi/game.html", {
  title: "The Towers of Hanoi", bytes: 11040,
  build(vy) {
    const COL = ["#ff1010", "#10ff10", "#1010ff", "#ffff10", "#ff10ff", "#10ffff", "#8400b5", "#007b6b"];
    const st = { n: 7, pegs: [[], [], []], sel: -1, moves: 0, solving: null };
    const msg = el("div", { class: "ptxt", style: "height:40px;font-family:var(--ui);font-size:12px" },
      "Select a piece to move.");
    const board = el("div", { style: "position:relative;height:150px;margin:12px 0" });
    const say = t => { msg.textContent = t; };
    const reset = () => {
      st.pegs = [[], [], []]; st.sel = -1; st.moves = 0;
      for (let i = st.n; i >= 1; i--) st.pegs[0].push(i);
      say("Select a piece to move."); draw();
    };
    const draw = () => {
      board.innerHTML = "";
      const pw = 168;
      for (let p = 0; p < 3; p++) {
        const px = 26 + p * pw;
        const peg = el("div", { style: "position:absolute;left:" + (px + 74) + "px;top:6px;width:9px;" +
          "height:120px;background:#000;cursor:pointer" });
        peg.addEventListener("click", () => tap(p));
        board.appendChild(peg);
        const base = el("div", { style: "position:absolute;left:" + px + "px;top:126px;width:157px;" +
          "height:5px;background:#5a5a5a" });
        board.appendChild(base);
        st.pegs[p].forEach((d, i) => {
          const wpx = 26 + d * 17;
          const disk = el("div", {
            style: "position:absolute;left:" + Math.round(px + 78.5 - wpx / 2) + "px;top:" + (114 - i * 15) +
              "px;width:" + wpx + "px;height:13px;background:" + COL[(d - 1) % COL.length] +
              ";border:1px solid #000;cursor:pointer" +
              (st.sel === p && i === st.pegs[p].length - 1 ? ";box-shadow:0 0 0 2px #000" : "")
          });
          disk.addEventListener("click", e => { e.stopPropagation(); tap(p); });
          disk.addEventListener("mouseenter", () => vy && vy.status("Link: javascript:clicked(" + (p + 1) + "," + (i + 1) + ")"));
          disk.addEventListener("mouseleave", () => vy && vy.status("Document: Done"));
          board.appendChild(disk);
        });
      }
      const done = st.pegs[2].length === st.n;
      if (done) say("Solved in " + st.moves + " moves. The minimum is " + (Math.pow(2, st.n) - 1) + ".");
    };
    const tap = p => {
      if (st.solving) return;
      if (st.sel < 0) {
        if (!st.pegs[p].length) { say("There is nothing on that peg."); return; }
        st.sel = p; say("Now select where it goes."); draw(); return;
      }
      if (st.sel === p) { st.sel = -1; say("Select a piece to move."); draw(); return; }
      const from = st.pegs[st.sel], to = st.pegs[p];
      const d = from[from.length - 1];
      if (to.length && to[to.length - 1] < d) { say("You cannot put a larger disk on a smaller one."); st.sel = -1; draw(); return; }
      from.pop(); to.push(d); st.moves++; st.sel = -1;
      say("Move " + st.moves + ".");
      Sound.click(); draw();
    };
    const solve = () => {
      if (st.solving) { clearInterval(st.solving); st.solving = null; say("Stopped."); return; }
      const seq = [];
      const rec = (n, a, b, c) => { if (!n) return; rec(n - 1, a, c, b); seq.push([a, b]); rec(n - 1, c, b, a); };
      reset(); rec(st.n, 0, 2, 1);
      let i = 0;
      st.solving = setInterval(() => {
        if (i >= seq.length) { clearInterval(st.solving); st.solving = null; draw(); return; }
        const [a, b] = seq[i++];
        st.pegs[b].push(st.pegs[a].pop()); st.moves++;
        say("Solving: move " + st.moves + " of " + seq.length);
        draw();
      }, 190);
    };
    const sel = el("select", { class: "psel", style: "width:52px",
      onchange: e => { st.n = +e.target.value; reset(); } },
      ...[3, 4, 5, 6, 7, 8].map(v => el("option", { value: v, selected: v === 7 ? "1" : null }, String(v))));
    reset();
    const page = pageWrap(
      el("h1", null, "The Towers of Hanoi"),
      el("p", { style: "text-align:center;font-weight:700" }, "(Implemented in JavaScript)"),
      board, msg,
      el("div", { style: "display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px" },
        el("span", null, "Disks:"), sel,
        el("button", { class: "pbtn", onclick: reset }, "Start the Game Over"),
        el("button", { class: "pbtn", onclick: solve }, "Solve It!")),
      el("hr"),
      el("p", { class: "cnote" },
        "Museum note: the real disk's workspace menu entry for this was not a program. It was " +
        "\"voyager -x0 -y0 -h412 -w628 -u http://127.1/hanoi/game.html\" — the browser, aimed at " +
        "the machine's own web server. The heading, the subtitle, the Disks selector and both " +
        "button labels are the ones in the archived screenshot. The code under them is ours."),
      el("p", { style: "text-align:center" }, A("Back to the demo", "http://127.1/")));
    if (page.querySelector) { /* keep the DOM alive across redraws */ }
    return page;
  }
});

const Voyager = {
  images: true, js: true, cache: 8192,

  async go(w, url, noPush) {
    const st = w.st, vy = w.vy;
    url = Web.norm(url);
    vy.setSite(url);
    st.loading = true;
    const host = Web.host(url);
    const me = K.get(w.pid);
    if (!me) return;

    /* --- no TLS. This is the whole 1999-meets-2026 problem in one branch - */
    if (/^https:/i.test(url)) {
      st.loading = false;
      this.render(w, this.errPage("Unknown protocol: https",
        "Voyager speaks HTTP. It does not speak HTTPS, because in 1999 almost nothing did and the " +
        "code to do it would not have fitted on the disk anyway.",
        [
          "TLS needs a certificate store, RSA, and a cipher suite negotiation. Together that is " +
          "bigger than this entire operating system.",
          "The modern web is HTTPS-only. Browsers refuse plain HTTP; servers redirect it; " +
          "HSTS makes the redirect permanent and unskippable.",
          "So a 1999 browser on today's web does not render pages badly. It never gets a page at all."
        ]), "Unknown protocol");
      w.setTitle("Unknown protocol: https");
      return;
    }
    vy.status("Looking up " + host + "…");
    const sock = K.byName("Socket");
    if (!sock) {
      st.loading = false;
      this.render(w, this.errPage("No TCP/IP stack",
        "Socket is not running. Somebody slew it.",
        ["The browser is fine. The window is fine. Photon is fine. There is simply no process " +
         "willing to accept a connect() message, so the browser gets ESRCH and stops.",
         "Start it again from the terminal: Socket &"]), "ESRCH");
      return;
    }
    const local = Web.isLocal(url);
    if (!local && !Net.up) {
      st.loading = false;
      this.render(w, this.errPage("The network is not configured",
        "There is no address on this machine yet.",
        [Sys.variant === "modem"
          ? "Open the Internet Dialer from the workspace menu and dial. That is what the modem disk was for."
          : "Open \"Join the Internet\" from the workspace menu, take an address, and try again.",
         "Meanwhile http://127.1/ works, because the machine is serving itself."]), "ENETDOWN");
      return;
    }
    try {
      if (local) {
        /* loopback: through the stack, then to the server process           */
        await K.Send(me.pid, sock.pid, {
          code: MSG.NET_TX, what: "connect 127.1:80 (loopback)", len: 60, loop: true
        }).catch(() => { });
        const httpd = K.byName("httpd");
        if (!httpd) throw { errno: "ECONNREFUSED", msg: "nothing is listening on port 80" };
        vy.status("Connected to 127.1 — requesting document…");
        const path = url.replace(/^http:\/\/127\.1/, "") || "/";
        const rep = await K.Send(me.pid, httpd.pid, {
          code: 0x0114, url: path, what: "GET " + path + " HTTP/1.0", len: 120 + path.length
        });
        if (rep.status === 404) throw { errno: "404", msg: "Not Found: " + path };
        this.paint(w, url, rep.body, noPush);
        return;
      }
      /* off the machine: a name lookup, then a request, then a card driver  */
      await K.Send(me.pid, sock.pid, { code: MSG.NET_ARP, what: "gethostbyname(\"" + host + "\")", ip: host, len: 48 });
      const page = Web.get(url);
      if (!page) {
        const known = Object.keys(Web.pages).some(u => Web.host(u) === host);
        throw known ? { errno: "404", msg: "Not Found: " + url }
          : { errno: "EHOSTNOTFOUND", msg: host + ": host not found" };
      }
      vy.status("Contacting " + host + "…");
      await K.Send(me.pid, sock.pid, {
        code: MSG.NET_TX, what: "GET " + url.replace(/^https?:\/\/[^\/]+/, "") + " HTTP/1.0",
        len: 220
      });
      await K.Send(me.pid, sock.pid, {
        code: MSG.NET_TX, what: "receive " + U.n(page.bytes) + " bytes of document", len: page.bytes
      });
      if (page.redirect) {
        vy.status("301 — following to " + page.redirect);
        this.paint(w, url, page, noPush);
        setTimeout(() => this.go(w, page.redirect), 900);
        return;
      }
      this.paint(w, url, page, noPush);
    } catch (e) {
      st.loading = false;
      const msg = (e && e.msg) || String(e);
      if (/host not found/.test(msg)) {
        this.render(w, this.errPage("Host not found: " + host,
          "Dns could not resolve that name.",
          ["This exhibit's web is three pages wide. Try the Hotlist button, or http://127.1/.",
           "On the real disk the failure looked much like this, and the cause was usually /etc/resolv.conf."]), "EHOSTNOTFOUND");
      } else {
        this.render(w, this.errPage(msg, "The request did not complete.",
          ["Errors here are ordinary message failures: a Send() to a process that is not there, " +
           "or a Reply() that says no. Nothing crashed."]), (e && e.errno) || "error");
      }
    }
  },

  paint(w, url, page, noPush) {
    const st = w.st;
    st.loading = false;
    if (!noPush) {
      if (st.at < st.hist.length - 1) st.hist.length = st.at + 1;
      if (st.hist[st.at] !== url) { st.hist.push(url); st.at = st.hist.length - 1; }
    }
    this.buttons(w);
    const node = page && page.build ? page.build(w.vy) : el("div", { class: "vp" }, "Empty document.");
    this.render(w, node, "Document: Done", page);
    w.setTitle(page && page.title ? page.title : "QNX Demo Disk");
    State.pushHistory(url, page && page.title);
    if (page && /disk/.test(String(page.title || ""))) w.vy.status("Image: http://127.1/images/disk.gif");
  },
  render(w, node, status, page) {
    if (!page && status && status !== "Document: Done") w.setTitle(String(status).slice(0, 40));
    const canvas = el("div", { class: "vy-canvas" }, node);
    w.page.innerHTML = "";
    w.page.appendChild(canvas);
    w.page.scrollTop = 0;
    this.applyFont(w);
    w.vy.status(status || "Document: Done");
    w.vy.enc(page && page.dynamic ? "Generated" : "No encoding");
  },
  applyFont(w) {
    const sizes = [13, 14, 16, 11];
    const c = w.page.querySelector(".vy-canvas");
    if (c) c.style.fontSize = sizes[w.st.font] + "px";
  },
  buttons(w) {
    const st = w.st;
    st.bBack.classList.toggle("dis", st.at <= 0);
    st.bFwd.classList.toggle("dis", st.at >= st.hist.length - 1);
  },
  back(w) { const st = w.st; if (st.at > 0) { st.at--; this.go(w, st.hist[st.at], true); this.buttons(w); } },
  fwd(w) { const st = w.st; if (st.at < st.hist.length - 1) { st.at++; this.go(w, st.hist[st.at], true); this.buttons(w); } },

  errPage(title, sub, bullets) {
    return el("div", { class: "vp" },
      el("div", { class: "err404" },
        el("h2", { style: "margin:0 0 4px" }, title),
        el("p", { style: "margin:0" }, sub)),
      el("ul", null, ...bullets.map(b => el("li", null, b))),
      el("p", null, A("Back to the demo", "http://127.1/")));
  },
  hotlist(w, anchor) {
    const items = [{ head: "Hotlist" }];
    for (const b of State.bookmarks()) items.push({ t: b.t, f: () => this.go(w, b.u) });
    items.push({ sep: 1 });
    items.push({ t: "Add this page", f: () => this.addHot(w) });
    Menu.pop(items, anchor);
  },
  addHot(w) {
    const u = w.st.hist[w.st.at];
    if (!u) return;
    State.addBookmark(w.title || u, u);
    Toast.show("Added to the hotlist: " + (w.title || u));
  },
  viewSource(w) {
    const u = w.st.hist[w.st.at] || "";
    PWM.launch("note", { source: u });
  },
  config(w) { PWM.launch("wwwconf"); }
};
