<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmigaOS 3.1 — Workbench 3.1</title>
<meta name="description" content="A single-file, in-browser simulation of AmigaOS 3.1 / Workbench 3.1. Hold the right mouse button for menus. Nothing real runs.">
<style>
/* ============================================================
   AmigaOS 3.1 / Workbench 3.1 — self-contained simulation
   No external resources. Works from file://.
   The four Workbench colours are CSS variables so the Palette
   preferences editor can change them live.
   ============================================================ */
:root{
  --c0:#aaaaaa;   /* 0: grey  — background        */
  --c1:#000000;   /* 1: black — text/detail       */
  --c2:#ffffff;   /* 2: white — bright/bevel      */
  --c3:#6688bb;   /* 3: blue  — fill/selection    */
  --tz:"Topaz","TopazPlus","PxPlus IBM VGA8","Px437 IBM VGA8","Lucida Console","Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#000;
  font-family:var(--tz);
  font-size:14px;
  color:var(--c1);
  user-select:none;
  -webkit-user-select:none;
  cursor:default;
  overflow:hidden;
}
/* PAL-ish stage: wide and slightly squat, centred, letterboxed */
#stage{
  position:absolute;
  inset:0;
  margin:auto;
  background:#000;
  overflow:hidden;
}
b,strong{font-weight:bold}
.tz{font-family:var(--tz)}

/* ---------- bevels (light from top-left) ---------- */
.bev-out{border-style:solid;border-width:2px;border-color:var(--c2) var(--c1) var(--c1) var(--c2)}
.bev-in {border-style:solid;border-width:2px;border-color:var(--c1) var(--c2) var(--c2) var(--c1)}

/* ============================================================
   SCREENS — full-size, stack like a deck, drag down to reveal
   ============================================================ */
.screen{
  position:absolute;
  left:0;right:0;
  height:100%;
  background:var(--c0);
  overflow:hidden;
  box-shadow:0 -2px 0 #000;
}
.screen .sbody{
  position:absolute;
  left:0;right:0;top:22px;bottom:0;
  overflow:hidden;
}
/* screen title bar */
.stitle{
  position:absolute;
  left:0;right:0;top:0;
  height:22px;
  background:var(--c0);
  color:var(--c1);
  border-bottom:2px solid var(--c1);
  display:flex;
  align-items:stretch;
  white-space:nowrap;
  overflow:hidden;
  z-index:50;
}
.screen.active > .stitle{background:var(--c2);color:var(--c1)}
.stitle .stxt{
  flex:1;
  padding:3px 8px 0 8px;
  font-size:14px;
  overflow:hidden;
  text-overflow:clip;
}
.stitle .smem{padding:3px 10px 0 0;font-size:14px}
/* screen depth gadget, far right */
.sdepth{
  width:24px;
  border-left:2px solid var(--c1);
  position:relative;
  flex:none;
  background:inherit;
}
.sdepth:active{filter:invert(1)}
.gadget-depth-art{position:absolute;inset:0}

/* ============================================================
   WINDOWS — Intuition chrome
   ============================================================ */
.win{
  position:absolute;
  background:var(--c0);
  border:2px solid;
  border-color:var(--c2) var(--c1) var(--c1) var(--c2);
  box-shadow:1px 1px 0 rgba(0,0,0,.4);
  display:flex;
  flex-direction:column;
  min-width:120px;
  min-height:60px;
}
.wtitle{
  height:20px;
  flex:none;
  display:flex;
  align-items:stretch;
  background:var(--c0);
  color:var(--c1);
  border-bottom:2px solid var(--c1);
  overflow:hidden;
}
.win.active > .wtitle{background:var(--c3);color:var(--c2)}
.wtitle .wtxt{
  flex:1;
  padding:2px 6px 0 4px;
  font-size:14px;
  overflow:hidden;
  white-space:nowrap;
  cursor:default;
}
/* gadgets */
.gad{
  width:22px;
  flex:none;
  position:relative;
  cursor:default;
}
.gad svg{position:absolute;inset:0;width:100%;height:100%}
.gclose{border-right:2px solid var(--c1)}
.gzoom,.gdepth{border-left:2px solid var(--c1)}
.gad:active{filter:invert(1)}
.wbody{
  flex:1;
  position:relative;
  overflow:hidden;
  background:var(--c0);
}
.wbody.scrollable{overflow:auto;scrollbar-width:thin}
/* sizing gadget bottom-right */
.gsize{
  position:absolute;
  right:0;bottom:0;
  width:18px;height:18px;
  cursor:nwse-resize;
  z-index:5;
}
.gsize svg{width:100%;height:100%}
/* window border right/bottom thick zone for authentic feel */
.win.hasresize .wbody{margin-right:0}

/* ============================================================
   MENUS — right mouse button strip in the screen title bar
   ============================================================ */
.menustrip{
  position:absolute;
  left:0;right:0;top:0;
  height:22px;
  background:var(--c2);
  color:var(--c1);
  border-bottom:2px solid var(--c1);
  display:none;
  z-index:400;
  white-space:nowrap;
}
.menustrip.open{display:block}
.mtitle{
  display:inline-block;
  padding:3px 12px 0 12px;
  height:20px;
  font-size:14px;
}
.mtitle.hot{background:var(--c1);color:var(--c2)}
.mpanel{
  position:absolute;
  top:22px;
  background:var(--c2);
  color:var(--c1);
  border:2px solid var(--c1);
  min-width:180px;
  z-index:401;
  padding:0;
}
.mitem{
  padding:3px 26px 3px 10px;
  font-size:14px;
  position:relative;
  white-space:nowrap;
}
.mitem .amk{float:right;margin-left:18px}
.mitem.hot{background:var(--c1);color:var(--c2)}
.mitem.ghost{color:var(--c2);text-shadow:1px 1px 0 #888;pointer-events:auto}
.mitem.checked::before{content:"✓";position:absolute;left:1px;top:3px;font-size:12px}
.msep{border-top:1px solid var(--c1);margin:2px 0}
.msub{position:absolute;left:100%;top:-2px;background:var(--c2);border:2px solid var(--c1);min-width:120px;display:none}
.mitem.hassub::after{content:"»";position:absolute;right:6px}
.mitem.hassub.hot > .msub{display:block}
/* Amiga key glyph */
.amk{font-size:12px}
.amk::before{content:"";display:inline-block;width:13px;height:11px;margin-right:3px;vertical-align:-1px;
  background:
    linear-gradient(135deg,transparent 46%,currentColor 46%,currentColor 54%,transparent 54%),
    linear-gradient(45deg,transparent 46%,currentColor 46%,currentColor 54%,transparent 54%);
  border:1.5px solid currentColor;border-radius:2px}

/* ============================================================
   ICONS — two-state, snapshot, drag
   ============================================================ */
.icon{
  position:absolute;
  width:90px;
  text-align:center;
  z-index:1;
}
.icon .iimg{
  display:inline-block;
  width:56px;height:42px;
  position:relative;
}
.icon .iimg svg{width:100%;height:100%}
.icon .ilbl{
  display:inline-block;
  font-size:13px;
  padding:0 2px;
  color:var(--icontext,var(--c1));
  max-width:100px;
  overflow:hidden;
  white-space:nowrap;
  line-height:15px;
}
.icon.sel .ilbl{background:var(--c1);color:var(--c2)}
.icon.sel .iimg{filter:invert(1) hue-rotate(180deg)}
.icon.ghosted{opacity:.5}
/* drag ghost */
#dragghost{position:fixed;pointer-events:none;z-index:900;opacity:.6;display:none}
/* rubber band */
#rubber{
  position:absolute;
  border:1px dashed var(--c1);
  background:transparent;
  display:none;
  z-index:200;
  pointer-events:none;
}
/* icon view-by-name rows */
.listrow{font-size:13px;padding:1px 6px;white-space:pre}
.listrow.sel{background:var(--c3);color:var(--c2)}

/* ============================================================
   REQUESTERS
   ============================================================ */
.req .wbody{padding:12px 14px}
.reqtext{font-size:14px;margin-bottom:14px;white-space:pre-wrap;line-height:1.5}
.reqbtns{display:flex;gap:14px;justify-content:space-between}
.btn{
  display:inline-block;
  background:var(--c0);
  color:var(--c1);
  border:2px solid;
  border-color:var(--c2) var(--c1) var(--c1) var(--c2);
  padding:3px 14px;
  font:14px var(--tz);
  cursor:default;
  white-space:nowrap;
}
.btn:active{border-color:var(--c1) var(--c2) var(--c2) var(--c1);background:var(--c3);color:var(--c2)}
/* string gadget (text input) */
.sgad{
  background:var(--c0);
  border:2px solid;
  border-color:var(--c1) var(--c2) var(--c2) var(--c1);
  font:14px var(--tz);
  color:var(--c1);
  padding:2px 5px;
  outline:none;
}
.sgad:focus{background:var(--c2)}
select.sgad,textarea.sgad{cursor:default}
/* checkbox gadget */
.ckb{display:inline-block;width:26px;height:18px;border:2px solid;border-color:var(--c1) var(--c2) var(--c2) var(--c1);background:var(--c0);position:relative;vertical-align:middle}
.ckb.on::after{content:"✓";position:absolute;left:6px;top:-1px;font-weight:bold}
/* cycle gadget */
.cyc{position:relative;padding-left:26px}
.cyc::before{content:"↻";position:absolute;left:6px}

/* ============================================================
   SHELL / console windows
   ============================================================ */
.conbody{
  background:var(--c0);
  color:var(--c1);
  font:14px/17px var(--tz);
  padding:2px 4px;
  overflow-y:auto;
  height:100%;
  white-space:pre-wrap;
  word-break:break-all;
  cursor:text;
}
.conbody .cur{background:var(--c3);color:var(--c2)}

/* ============================================================
   GURU MEDITATION
   ============================================================ */
#guru{
  position:absolute;inset:0;
  background:#000;
  z-index:2000;
  display:none;
  cursor:default;
}
#guru .alert{
  position:absolute;left:0;right:0;top:0;
  padding:18px 0 14px 0;
  text-align:center;
  color:#f00;
  font:bold 18px/1.9 var(--tz);
  border:6px solid #f00;
  animation:guruflash 1.1s steps(1) infinite;
}
@keyframes guruflash{50%{border-color:#000}}

/* ============================================================
   BOOT / Kickstart
   ============================================================ */
#boot{
  position:absolute;inset:0;
  background:#000;
  z-index:1500;
  overflow:hidden;
}
#kick{
  position:absolute;inset:0;
  background:#fff;
  display:none;
  align-items:center;
  justify-content:center;
}
#bootseq{
  position:absolute;inset:0;
  background:#000;
  color:#ccc;
  font:14px/18px var(--tz);
  padding:10px 14px;
  display:none;
  white-space:pre-wrap;
}
/* CRT overlay (optional, default off) */
#crt{
  position:absolute;inset:0;
  pointer-events:none;
  z-index:3000;
  display:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
}
#crt.on{display:block}
#crt::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.28) 100%)}

/* misc app styling */
.padbody{padding:10px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lbl{font-size:14px}
canvas{image-rendering:pixelated}
.paintcursor{cursor:crosshair}
.helpguide a,.guidebtn{
  display:inline-block;
  background:var(--c0);
  border:2px solid;
  border-color:var(--c2) var(--c1) var(--c1) var(--c2);
  color:var(--c1);
  text-decoration:none;
  padding:0 6px;
  margin:0 2px;
  cursor:default;
}
.guidebtn:active{border-color:var(--c1) var(--c2) var(--c2) var(--c1)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="dragghost"></div>
<div id="crt"></div>
<script>
"use strict";
/* ============================================================
   UTILITIES
   ============================================================ */
const $=(s,el)=>(el||document).querySelector(s);
const mk=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=(n,w)=>String(n).padStart(w," ");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const commas=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const stage=$("#stage");

/* Era-flavoured date formatting: DD-MMM-YY  HH:MM:SS */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function adosDate(d){
  d=d instanceof Date?d:new Date(d);
  return String(d.getDate()).padStart(2,"0")+"-"+MONTHS[d.getMonth()]+"-"+String(d.getFullYear()%100).padStart(2,"0");
}
function adosTime(d){
  d=d instanceof Date?d:new Date(d);
  return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");
}

/* ============================================================
   STATE MANAGER — localStorage persistence.
   "Save" prefs persist; "Use" prefs live only until reboot.
   RAM: never persists (cleared on reboot by design).
   ============================================================ */
const State={
  KEY:"amigaos31_museum",
  data:null,
  load(){
    try{ this.data=JSON.parse(localStorage.getItem(this.KEY))||{}; }
    catch(e){ this.data={}; }
    this.data.prefs   = this.data.prefs   || {};
    this.data.icons   = this.data.icons   || {};   /* snapshot positions by path */
    this.data.leftout = this.data.leftout || [];   /* Leave Out paths */
    this.data.wins    = this.data.wins    || {};   /* window snapshots by path */
    this.data.files   = this.data.files   || null; /* user FS overlay */
    this.data.shellHist = this.data.shellHist || [];
    return this.data;
  },
  save(){
    try{ localStorage.setItem(this.KEY,JSON.stringify(this.data)); }catch(e){}
  },
  /* prefs: {saved:{...}} persisted, plus a runtime "use" overlay */
  useOverlay:{},
  getPref(app,def){
    const saved=this.data.prefs[app];
    const use=this.useOverlay[app];
    return Object.assign({},def,saved||{},use||{});
  },
  usePref(app,val){ this.useOverlay[app]=Object.assign({},this.useOverlay[app]||{},val); },
  savePref(app,val){
    this.data.prefs[app]=Object.assign({},this.data.prefs[app]||{},val);
    delete this.useOverlay[app];
    this.save();
  }
};
State.load();

/* ============================================================
   SOUND MANAGER — Paula-flavoured Web Audio synthesis.
   Everything generated in code; toggle via Prefs → Sound.
   ============================================================ */
const Sound={
  ctx:null, enabled:true,
  init(){
    if(this.ctx)return this.ctx;
    try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    return this.ctx;
  },
  on(){ const p=State.getPref("sound",{enabled:true}); return p.enabled!==false; },
  /* one-pole lowpassed square blip — generic Paula-ish voice */
  tone(freq,dur,vol,type,when){
    if(!this.on()||!this.init())return;
    const c=this.ctx,t=(when||c.currentTime);
    const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
    o.type=type||"square";o.frequency.value=freq;
    f.type="lowpass";f.frequency.value=3200;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol||.12,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.15));
    o.connect(f);f.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+(dur||.15)+.05);
  },
  noise(dur,vol,fc){
    if(!this.on()||!this.init())return;
    const c=this.ctx,t=c.currentTime,n=c.sampleRate*(dur||.1);
    const buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();
    s.buffer=buf;f.type="bandpass";f.frequency.value=fc||900;f.Q.value=.7;
    g.gain.value=vol||.1;
    s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);
  },
  floppyClick(){ this.noise(.03,.08,1400); },
  floppyGrind(times){
    times=times||6;
    for(let i=0;i<times;i++)setTimeout(()=>this.noise(.05,.07,700+Math.random()*500),i*160);
  },
  diskInsert(){ this.noise(.09,.14,500); setTimeout(()=>this.noise(.05,.1,1200),90); },
  beep(){ this.tone(880,.14,.14,"square"); },
  boom(){ /* boing demo floor hit */
    if(!this.on()||!this.init())return;
    const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type="sine";o.frequency.setValueAtTime(160,t);
    o.frequency.exponentialRampToValueAtTime(38,t+.28);
    g.gain.setValueAtTime(.5,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.5);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.55);
    this.noise(.1,.2,180);
  },
  keyclick(){ this.tone(2400,.015,.02,"square"); }
};
/* browsers require a gesture before audio — arm on first interaction */
window.addEventListener("pointerdown",()=>Sound.init(),{once:true});
window.addEventListener("keydown",()=>Sound.init(),{once:true});

/* ============================================================
   MEMORY ILLUSION — chip/fast figures that breathe
   ============================================================ */
const Memory={
  chipTotal:2*1024*1024, fastTotal:8*1024*1024,
  chipUsed:713_728, fastUsed:1_892_352,
  claims:new Map(), _n:0,
  alloc(chip,fast){
    const id=++this._n;
    this.claims.set(id,[chip|0,fast|0]);
    this.chipUsed+=chip|0; this.fastUsed+=fast|0;
    Titlebars.refresh(); return id;
  },
  free(id){
    const c=this.claims.get(id);
    if(!c)return;
    this.claims.delete(id);
    this.chipUsed-=c[0]; this.fastUsed-=c[1];
    Titlebars.refresh();
  },
  chipFree(){ return Math.max(0,this.chipTotal-this.chipUsed); },
  fastFree(){ return Math.max(0,this.fastTotal-this.fastUsed); }
};
/* tiny random breathing so the figures live */
setInterval(()=>{
  Memory.chipUsed=clamp(Memory.chipUsed+((Math.random()*4096)|0)-2048,600000,Memory.chipTotal-65536);
  Memory.fastUsed=clamp(Memory.fastUsed+((Math.random()*8192)|0)-4096,1500000,Memory.fastTotal-262144);
  Titlebars.refresh();
},2600);

/* ============================================================
   TASK LIST ILLUSION — for Status / multitasking flavour
   ============================================================ */
const Tasks={
  list:[
    {n:1,name:"Workbench",pri:1},
  ],
  _n:1,
  add(name,pri){ const t={n:++this._n,name,pri:pri||0};this.list.push(t);return t; },
  remove(t){ const i=this.list.indexOf(t); if(i>=0)this.list.splice(i,1); }
};
/* ============================================================
   VIRTUAL AmigaDOS — volumes, drawers, files, assigns, RAM:
   Node: {t:"d"|"f", name, size, date, prot, comment, tool,
          kind (icon style), tooltypes[], text (file body),
          noicon (visible only with Show All Files), c:{children}}
   ============================================================ */
const FS={ volumes:{}, assigns:{}, };
function N(t,name,opts){
  return Object.assign({t,name,size:t==="d"?0:990,date:"1993-08-10",prot:"----rwed",
    comment:"",kind:t==="d"?"drawer":"project",tooltypes:[],c:t==="d"?{}:undefined},opts||{});
}
function addc(parent,node){ parent.c[node.name.toLowerCase()]=node; return node; }
/* journal a user-created file so it survives reload (RAM: excluded) */
function journalFile(dirPath,node){
  if(!dirPath||/^ram/i.test(dirPath))return;
  State.data.files=State.data.files||[];
  State.data.files.push({dir:dirPath,t:node.t,name:node.name,
    props:{size:node.size,kind:node.kind,date:node.date,text:node.text,
           tool:node.tool,customIcon:node.customIcon,pngData:node.pngData}});
  State.save();
}

function buildFS(){
  const D=(n,o)=>N("d",n,o), F=(n,o)=>N("f",n,o);
  /* ---------- SYS: (Workbench3.1) ---------- */
  const sys=D("Workbench3.1",{kind:"disk",date:"1994-04-30"});
  sys.volKind="hd"; sys.capacity=124_000_000; sys.used=31_204_352;

  const mkcmds=(names,dir,kind,sz)=>names.forEach((nm,i)=>addc(dir,F(nm,{
    kind:kind||"tool",size:(sz||1200)+((nm.length*371)%4096),prot:"----rwed",
    date:"1993-0"+(1+(i%9))+"-"+String(3+(i%25)).padStart(2,"0"),noicon:true})));

  const c=addc(sys,D("C",{noicon:true}));
  mkcmds(["AddBuffers","Assign","Avail","Break","ChangeTaskPri","ConClip","Copy","CPU","Date","Delete","Dir","DiskChange","Ed","Edit","Eval","Execute","Filenote","IconX","Info","Install","IPrefs","Join","List","LoadWB","Lock","MagTape","MakeDir","MakeLink","Mount","Protect","Relabel","RemRAD","Rename","RequestChoice","RequestFile","Run","Search","SetClock","SetDate","SetFont","SetKeyboard","SetPatch","Sort","Status","Type","Version","Wait","Which","Why"],c,"tool",900);

  const devs=addc(sys,D("Devs",{noicon:true}));
  addc(devs,F("system-configuration",{noicon:true,size:232,date:"1992-11-30"}));
  const dosdrv=addc(devs,D("DOSDrivers"));
  ["PC0","PIPE","AUX"].forEach(n=>addc(dosdrv,F(n,{kind:"project",size:120})));
  const keymaps=addc(devs,D("Keymaps"));
  ["d","gb","f","i","s","usa2"].forEach(n=>addc(keymaps,F(n,{noicon:true,size:1836})));
  const monitors=addc(devs,D("Monitors"));
  ["Multiscan","PAL","NTSC","DblPAL","DblNTSC"].forEach(n=>addc(monitors,F(n,{kind:"tool",size:412})));
  ["clipboard.device","printer.device","serial.device","parallel.device","narrator.device"]
    .forEach(n=>addc(devs,F(n,{noicon:true,size:5000+n.length*173})));

/* resolve "SYS:Tools/Calculator" → node (or null). Returns {node,parent,volume}. */
function resolvePath(path,cwd){
  if(!path)return null;
  path=path.trim();
  let vol=null,rest=path;
  const ci=path.indexOf(":");
  if(ci>=0){
    let vname=path.slice(0,ci).toLowerCase();
    rest=path.slice(ci+1);
    let hops=0;
    while(FS.assigns[vname]&&hops++<8){
      const tgt=FS.assigns[vname];
      const ti=tgt.indexOf(":");
      const trest=tgt.slice(ti+1);
      rest=trest?(trest.replace(/\/+$/,"")+(rest?"/"+rest:"")):rest;
      vname=tgt.slice(0,ti).toLowerCase();
    }
    vol=FS.volumes[vname];
    if(!vol)return {missing:path.slice(0,ci)+":"};
  }else{
    const r=resolvePath(cwd||"SYS:");
    if(!r||!r.node)return null;
    vol=r.volume;
    rest=(r.sub?r.sub+"/":"")+rest;
  }
  let node=vol,parent=null,sub="";
  for(const seg of rest.split("/")){
    if(!seg)continue;
    if(seg==".."){ /* parent hop: re-walk */
      const parts=sub.split("/").filter(Boolean); parts.pop();
      sub=parts.join("/");
      node=vol;parent=null;
      for(const s2 of parts){ parent=node; node=node.c&&node.c[s2.toLowerCase()]; if(!node)return null; }
      continue;
    }
    if(!node.c)return null;
    parent=node;
    node=node.c[seg.toLowerCase()];
    if(!node)return null;
    sub=sub?(sub+"/"+seg):seg;
  }
  return {node,parent,volume:vol,sub};
}
function volDisplayName(vol){ return vol===FS.volumes["ram disk"]?"Ram Disk":vol.name; }
function pathOf(vol,sub){ return volDisplayName(vol)+":"+(sub||""); }
function childList(node,showAll){
  if(!node.c)return [];
  const arr=Object.values(node.c).filter(n=>showAll||!n.noicon);
  arr.sort((a,b)=>(a.t===b.t?a.name.localeCompare(b.name):(a.t==="d"?-1:1)));
  return arr;
}

  const bev=`<rect x="1" y="1" width="20" height="18" fill="none" stroke="currentColor" stroke-width="0" />`;
  if(kind==="close")
    return s+`<rect x="7" y="6" width="8" height="8" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="9" width="2" height="2" fill="currentColor"/></svg>`;
  if(kind==="zoom")
    return s+`<rect x="4" y="4" width="14" height="12" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="4" width="8" height="6" fill="currentColor"/></svg>`;
  if(kind==="depth")
    return s+`<rect x="3" y="3" width="11" height="9" fill="var(--c0)" stroke="currentColor" stroke-width="2"/><rect x="8" y="8" width="11" height="9" fill="var(--c2)" stroke="currentColor" stroke-width="2"/></svg>`;
  if(kind==="sdepth")
    return `<svg viewBox="0 0 24 22" preserveAspectRatio="none"><rect x="3" y="3" width="12" height="10" fill="var(--c0)" stroke="currentColor" stroke-width="2"/><rect x="9" y="9" width="12" height="10" fill="var(--c2)" stroke="currentColor" stroke-width="2"/></svg>`;
  if(kind==="size")
    return `<svg viewBox="0 0 18 18"><path d="M16 2 L16 16 L2 16 Z" fill="var(--c0)" stroke="currentColor" stroke-width="2"/><path d="M16 8 L16 16 L8 16 Z" fill="currentColor"/></svg>`;

/* ---------------- Screens ---------------- */
const Screens={
  list:[], byId:{},
  create(id,title,opts){
    opts=opts||{};
    const el=mk("div","screen");
    el.dataset.sid=id;
    const st=mk("div","stitle");
    const stxt=mk("span","stxt",esc(title));
    st.appendChild(stxt);
    let smem=null;
    if(opts.mem){ smem=mk("span","smem"); st.appendChild(smem); }
    const sd=mk("div","sdepth",gadArt("sdepth"));
    st.appendChild(sd);
    el.appendChild(st);
    const body=mk("div","sbody");
    el.appendChild(body);
    if(opts.css)Object.assign(el.style,opts.css);
    stage.appendChild(el);
    const scr={id,el,title,stxt,smem,body,st,top:0,wins:[],menu:opts.menu||null,palette:opts.palette||null,onclose:opts.onclose||null,app:opts.app||null};
    this.list.push(scr); this.byId[id]=scr;
    sd.addEventListener("mousedown",e=>{e.stopPropagation();});
    sd.addEventListener("click",e=>{e.stopPropagation();this.cycle();});
    /* drag screen down by its title bar */
    st.addEventListener("mousedown",e=>{
      if(e.button!==0||e.target===sd||sd.contains(e.target))return;
      this.toFront(scr);
      const startY=e.clientY, startTop=scr.top;
      const move=ev=>{ this.setTop(scr,startTop+(ev.clientY-startY)); };
      const up=()=>{window.removeEventListener("mousemove",move);window.removeEventListener("mouseup",up);};
      window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
      e.preventDefault();
    });
    el.addEventListener("mousedown",()=>{ if(this.front()!==scr)this.toFront(scr); },true);
    this.restack();
    return scr;
  },
  setTop(scr,px){
    scr.top=clamp(px,0,stage.clientHeight-24);
    scr.el.style.top=scr.top+"px";
    scr.el.style.height=(stage.clientHeight)+"px";
  },
  remove(scr){
    const i=this.list.indexOf(scr);
    if(i>=0)this.list.splice(i,1);
    delete this.byId[scr.id];
    scr.el.remove();
    this.restack();
    Menus.close();
  },
  front(){ return this.list[this.list.length-1]; },
  toFront(scr){
    const i=this.list.indexOf(scr);
    if(i<0)return;
    this.list.splice(i,1); this.list.push(scr);
    this.restack();
  },
  toBack(scr){
    const i=this.list.indexOf(scr);
    if(i<0)return;
    this.list.splice(i,1); this.list.unshift(scr);
    this.restack();
  },
  cycle(){ /* front screen goes to back */
    const f=this.front();
    if(f)this.toBack(f);
  },
  restack(){
    this.list.forEach((s,i)=>{
      s.el.style.zIndex=10+i*10;
      s.el.classList.toggle("active",i===this.list.length-1);
      s.el.style.top=s.top+"px";
    });
    Titlebars.refresh();
  }
};
window.addEventListener("resize",()=>Screens.list.forEach(s=>Screens.setTop(s,s.top)));

    scr.wins.push(win);

      if(e.button!==0)return;
      if(e.target.closest(".gad"))return;
      const sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;
      const move=ev=>{
        el.style.left=clamp(ox+ev.clientX-sx,-el.offsetWidth+60,scr.body.clientWidth-30)+"px";
        el.style.top=clamp(oy+ev.clientY-sy,0,scr.body.clientHeight-20)+"px";
      };
      const up=()=>{window.removeEventListener("mousemove",move);window.removeEventListener("mouseup",up);};
      window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
      e.preventDefault();
    });
    if(gclose)gclose.addEventListener("click",e=>{e.stopPropagation();this.close(win);});
    gdepth.addEventListener("click",e=>{
      e.stopPropagation();
      /* depth gadget: if frontmost among siblings, push to back; else bring to front */
      const zs=scr.wins.map(w=>+w.el.style.zIndex);
      const mx=Math.max(...zs), mn=Math.min(...zs);
      if(+el.style.zIndex===mx&&scr.wins.length>1){ el.style.zIndex=mn-1; this.activate(this.topWin(scr)); }
      else { el.style.zIndex=100+(++WINSEQ); this.activate(win); }
    });
    if(gzoom)gzoom.addEventListener("click",e=>{
      e.stopPropagation();
      if(!win.zoomed){
        win.prevBox=[el.offsetLeft,el.offsetTop,el.offsetWidth,el.offsetHeight];
        el.style.left="0px";el.style.top="0px";
        el.style.width=Math.min(scr.body.clientWidth,760)+"px";
        el.style.height=Math.min(scr.body.clientHeight,520)+"px";
        win.zoomed=true;
      }else{
        const b=win.prevBox||[60,40,420,240];
        el.style.left=b[0]+"px";el.style.top=b[1]+"px";
        el.style.width=b[2]+"px";el.style.height=b[3]+"px";
        win.zoomed=false;
      }
      if(opts.onresize)opts.onresize(win);
    });
    if(gsize)gsize.addEventListener("mousedown",e=>{
      if(e.button!==0)return;
      e.stopPropagation();e.preventDefault();
      const sx=e.clientX,sy=e.clientY,ow=el.offsetWidth,oh=el.offsetHeight;
      const move=ev=>{
        el.style.width=clamp(ow+ev.clientX-sx,opts.minw||140,1400)+"px";
        el.style.height=clamp(oh+ev.clientY-sy,opts.minh||70,1000)+"px";
        if(opts.onresize)opts.onresize(win);
      };
      const up=()=>{window.removeEventListener("mousemove",move);window.removeEventListener("mouseup",up);};
      window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
    });
    this.activate(win);
    return win;
  },
  topWin(scr){
    let best=null;
    for(const w of scr.wins)if(!best||+w.el.style.zIndex>+best.el.style.zIndex)best=w;
    return best;
  },
  activate(win){
    if(this.active===win)return;
    if(this.active)this.active.el.classList.remove("active");
    this.active=win;
    if(win){
      win.el.classList.add("active");
      if(!win._depthClick)win.el.style.zIndex=100+(++WINSEQ);
      Menus.setContext(win.opts.menu?win:null);
    }
  },
  close(win){
    if(!win||win.closed)return;
    win.closed=true;
    Memory.free(win.memid);
    const i=win.scr.wins.indexOf(win);
    if(i>=0)win.scr.wins.splice(i,1);
    win.el.remove();
    if(this.active===win){ this.active=null; this.activate(this.topWin(win.scr)); }
    if(win.opts.onclose)win.opts.onclose(win);
  },
  setTitle(win,t){ win.wtxt.textContent=t; }
};

function requester(scr,title,text,buttons,cb,opts){
  opts=opts||{};
  Sound.beep&&opts.beep!==false&&Sound.floppyClick();
  const w=Windows.create(scr,{title:title||"System Request",x:opts.x!=null?opts.x:Math.max(10,(scr.body.clientWidth-380)/2),
    y:opts.y!=null?opts.y:60,w:opts.w||380,h:10,zoom:false,resize:false,close:false,chip:4000,fast:9000});
  w.el.classList.add("req");
  const t=mk("div","reqtext",esc(text));
  w.body.appendChild(t);
  if(opts.input!=null){
    const inp=mk("input","sgad");
    inp.type="text";inp.value=opts.input;inp.style.width="100%";inp.style.marginBottom="12px";
    inp.addEventListener("keydown",e=>{
      e.stopPropagation();
      if(e.key==="Enter"){ finish(0); }
      if(e.key==="Escape"){ finish(buttons.length-1); }
    });
    w.body.appendChild(inp);
    setTimeout(()=>{inp.focus();inp.select();},30);
    w.inputEl=inp;
  }
  const bb=mk("div","reqbtns");
  const finish=(i)=>{
    const val=w.inputEl?w.inputEl.value:undefined;
    Windows.close(w);
    if(cb)cb(i,val);
  };
  buttons.forEach((b,i)=>{
    const btn=mk("span","btn",esc(b));
    btn.addEventListener("click",()=>finish(i));
    bb.appendChild(btn);
  });
  w.body.appendChild(bb);
  /* size to content */
  setTimeout(()=>{ w.el.style.height=(w.body.scrollHeight+30)+"px"; },0);
  return w;
}
function sysRequest(text,buttons,cb){
  const wb=Screens.byId["wb"];
  Screens.toFront(wb);
  return requester(wb,"System Request",text,buttons||["Retry","Cancel"],cb);
}

const Menus={
  open:false, sticky:false, strip:null, scr:null, ctxWin:null,
  hotTitle:-1, hotItem:null, spec:null,
  setContext(win){ this.ctxWin=win; },
  specFor(scr){
    /* active window's menu wins if it lives on this screen */
    const aw=Windows.active;
    if(aw&&!aw.closed&&aw.scr===scr&&aw.opts.menu)return aw.opts.menu;
    return scr.menu;
  },
  show(sticky){
    const scr=Screens.front();
    if(!scr)return;
    const spec=this.specFor(scr);
    if(!spec)return;
    this.hide();
    this.scr=scr; this.spec=spec; this.sticky=!!sticky; this.open=true;
    const strip=mk("div","menustrip open");
    spec.forEach((m,i)=>{
      const t=mk("span","mtitle",esc(m.title));
      t.dataset.mi=i;
      strip.appendChild(t);
    });
    scr.el.appendChild(strip);
    this.strip=strip;
    this.hotTitle=-1;
  },
  hide(){
    if(this.strip){this.strip.remove();this.strip=null;}
    this.open=false; this.sticky=false; this.hotTitle=-1; this.hotItem=null;
    this.panel&&this.panel.remove(); this.panel=null;
  },
  close(){ this.hide(); },
  openPanel(i){
    if(this.hotTitle===i)return;
    this.panel&&this.panel.remove(); this.panel=null;
    this.hotTitle=i;
    [...this.strip.querySelectorAll(".mtitle")].forEach((t,j)=>t.classList.toggle("hot",j===i));
    if(i<0)return;
    const m=this.spec[i];
    const p=mk("div","mpanel");
    const build=(items,into)=>{
      items.forEach(it=>{
        if(it==="-"){ into.appendChild(mk("div","msep")); return; }
        const el=mk("div","mitem"+(it.ghost?" ghost":"")+(it.checkFn&&it.checkFn()?" checked":"")+(it.sub?" hassub":""));
        el.appendChild(mk("span",null,esc(it.t)));
        if(it.key)el.appendChild(mk("span","amk",esc(it.key)));
        el._item=it;
        if(it.sub){
          const sp=mk("div","msub");
          build(it.sub,sp);
          el.appendChild(sp);
        }
        into.appendChild(el);
      });
    };
    build(m.items,p);
    const tEl=this.strip.querySelectorAll(".mtitle")[i];
    p.style.left=Math.min(tEl.offsetLeft,this.scr.el.clientWidth-200)+"px";
    this.scr.el.appendChild(p);
    this.panel=p;
  },
  track(x,y){
    if(!this.open)return;
    const el=document.elementFromPoint(x,y);
    if(!el)return;
    const t=el.closest&&el.closest(".mtitle");
    if(t&&this.strip.contains(t)){ this.openPanel(+t.dataset.mi); this.setHotItem(null); return; }
    const it=el.closest&&el.closest(".mitem");
    if(it&&this.panel&&this.panel.contains(it)){ this.setHotItem(it); return; }
    if(!this.panel||!(el.closest&&el.closest(".mpanel"))){ /* off-menu: keep last panel open */ }
  },
  setHotItem(el){
    if(this.hotItem===el)return;
    if(this.hotItem)this.hotItem.classList.remove("hot");
    /* keep parent of submenu hot */
    this.panel&&[...this.panel.querySelectorAll(".mitem.hot")].forEach(x=>{
      if(el&&x.contains(el))return;
      x.classList.remove("hot");
    });
    this.hotItem=el;
    if(el){
      el.classList.add("hot");
      let p=el.parentElement&&el.parentElement.closest&&el.parentElement.closest(".mitem.hassub");
      while(p){ p.classList.add("hot"); p=p.parentElement.closest(".mitem.hassub"); }
    }
  },
  selectHot(){
    const el=this.hotItem;
    this.hide();
    if(!el)return;
    const it=el._item;
    if(!it||it.ghost||it.sub)return;
    if(it.cmd){ try{ it.cmd(); }catch(e){ console.error(e); } }
  }
};

/* --- right mouse button interception --- */
window.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("mousedown",e=>{
  if(e.button===2){
    if(Boot.running)return;
    Menus.show(false);
    Menus.track(e.clientX,e.clientY);
    e.preventDefault();
  }else if(e.button===0&&Menus.open&&Menus.sticky){
    /* sticky mode: left click selects */
    Menus.track(e.clientX,e.clientY);
    if(Menus.hotItem){ Menus.selectHot(); }
    else if(!e.target.closest(".menustrip")&&!e.target.closest(".mpanel")) Menus.hide();
    e.stopPropagation();e.preventDefault();
  }
},true);
window.addEventListener("mousemove",e=>{ if(Menus.open)Menus.track(e.clientX,e.clientY); },true);
window.addEventListener("mouseup",e=>{
  if(e.button===2&&Menus.open&&!Menus.sticky){
    Menus.selectHot();
    e.preventDefault();
  }
},true);
window.addEventListener("keydown",e=>{
  if(e.key==="F10"){
    e.preventDefault();
    if(Menus.open)Menus.hide(); else Menus.show(true);
  }
  /* Left-Amiga+M analog: Alt+M cycles screens */
  if(e.altKey&&(e.key==="m"||e.key==="M")){ e.preventDefault(); Screens.cycle(); }
  if(e.altKey&&(e.key==="n"||e.key==="N")){ e.preventDefault(); const wb=Screens.byId["wb"]; wb&&Screens.toFront(wb); }
},true);
/* ============================================================
   ICON ARTWORK — original, bevel-edged, limited-palette,
   drawn entirely in code (inline SVG). Two-state via CSS.
   ============================================================ */
const IconArt={
  svg(kind,customPix){
    const B='stroke="#000" stroke-width="1"';
    const bev=(x,y,w,h,fill)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" ${B}/>`+
      `<path d="M${x} ${y+h} L${x} ${y} L${x+w} ${y}" fill="none" stroke="#fff" stroke-width="1.5"/>`+
      `<path d="M${x+w} ${y} L${x+w} ${y+h} L${x} ${y+h}" fill="none" stroke="#000" stroke-width="1.5"/>`;
    let inner="";
    switch(kind){
      case "disk": case "ram":
        inner=bev(6,6,44,30,"var(--c2)")+
          `<rect x="12" y="6" width="22" height="12" fill="var(--c3)" ${B}/>`+
          `<rect x="26" y="8" width="6" height="8" fill="var(--c2)" ${B}/>`+
          `<rect x="12" y="24" width="32" height="10" fill="var(--c0)" ${B}/>`+
          (kind==="ram"?`<text x="28" y="33" font-size="9" text-anchor="middle" fill="#000" font-family="monospace" font-weight="bold">RAM</text>`:``);
        break;
      case "drawer":
        inner=bev(4,12,48,26,"var(--c0)")+
          `<rect x="8" y="16" width="40" height="8" fill="var(--c2)" ${B}/>`+
          `<rect x="22" y="18" width="12" height="4" fill="var(--c3)" ${B}/>`+
          `<rect x="8" y="27" width="40" height="8" fill="var(--c2)" ${B}/>`+
          `<rect x="22" y="29" width="12" height="4" fill="var(--c3)" ${B}/>`;
        break;
      case "tool":
        inner=bev(8,8,40,28,"var(--c3)")+
          `<rect x="13" y="13" width="30" height="12" fill="var(--c2)" ${B}/>`+
          `<path d="M18 30 h20 v3 h-20 z" fill="var(--c0)" ${B}/>`+
          `<circle cx="20" cy="19" r="2.4" fill="var(--c3)"/><circle cx="28" cy="19" r="2.4" fill="var(--c3)"/><circle cx="36" cy="19" r="2.4" fill="var(--c3)"/>`;
        break;
      case "project":
        inner=`<path d="M12 4 h24 l8 8 v28 h-32 z" fill="var(--c2)" ${B}/>`+
          `<path d="M36 4 l8 8 h-8 z" fill="var(--c0)" ${B}/>`+
          `<rect x="17" y="16" width="22" height="2" fill="var(--c3)"/>`+
          `<rect x="17" y="21" width="22" height="2" fill="var(--c3)"/>`+
          `<rect x="17" y="26" width="14" height="2" fill="var(--c3)"/>`+
          `<rect x="17" y="31" width="18" height="2" fill="var(--c3)"/>`;
        break;
      case "trash":
        inner=`<rect x="14" y="14" width="28" height="26" fill="var(--c0)" ${B}/>`+
          `<path d="M14 14 h28" stroke="#fff" stroke-width="1.5"/>`+
          `<rect x="10" y="9" width="36" height="6" fill="var(--c2)" ${B}/>`+
          `<rect x="23" y="5" width="10" height="5" fill="var(--c2)" ${B}/>`+
          `<rect x="20" y="19" width="3" height="16" fill="var(--c1)"/>`+
          `<rect x="27" y="19" width="3" height="16" fill="var(--c1)"/>`+
          `<rect x="34" y="19" width="3" height="16" fill="var(--c1)"/>`;
        break;
      case "prefs":
        inner=bev(8,8,40,28,"var(--c2)")+
          `<circle cx="20" cy="22" r="7" fill="var(--c0)" ${B}/>`+
          `<rect x="18" y="16" width="4" height="7" fill="var(--c3)"/>`+
          `<rect x="31" y="14" width="12" height="4" fill="var(--c3)" ${B}/>`+
          `<rect x="31" y="21" width="12" height="4" fill="var(--c0)" ${B}/>`+
          `<rect x="31" y="28" width="12" height="4" fill="var(--c1)"/>`;
        break;
      case "paint":
        inner=bev(6,8,44,28,"var(--c2)")+
          `<circle cx="18" cy="18" r="4" fill="#d22"/><circle cx="28" cy="16" r="4" fill="#2a2"/>`+
          `<circle cx="38" cy="18" r="4" fill="var(--c3)"/><circle cx="23" cy="27" r="4" fill="#dd0"/>`+
          `<path d="M33 31 l10 -10 l3 3 l-10 10 z" fill="var(--c0)" ${B}/>`;
        break;
      case "guide":
        inner=`<path d="M10 6 h36 v34 h-36 z" fill="var(--c2)" ${B}/>`+
          `<path d="M28 6 v34" stroke="#000"/>`+
          `<rect x="14" y="12" width="10" height="2" fill="var(--c3)"/><rect x="14" y="17" width="10" height="2" fill="var(--c1)"/>`+
          `<rect x="32" y="12" width="10" height="2" fill="var(--c1)"/><rect x="32" y="17" width="10" height="2" fill="var(--c3)"/>`;
        break;
      default:
        inner=bev(10,8,36,30,"var(--c2)");
    }
    if(customPix)inner=customPix;
    return `<svg viewBox="0 0 56 44">${inner}</svg>`;
  }
};

/* ============================================================
   WORKBENCH — disks, drawers, icons, windows
   ============================================================ */
const WB={
  backdrop:null, selection:new Set(),
  keyOf(vol,sub,name){ return pathOf(vol,sub?sub+"/"+name:name); },

  init(scr){
    this.scr=scr;
    this.backdrop=scr.body;
    this.backdrop.classList.add("wbback");
    this.applyPattern();
    /* rubber-band select on backdrop */
    this.rubber=mk("div"); this.rubber.id="rubber";
    this.backdrop.appendChild(this.rubber);
    this.bindRubber(this.backdrop,this.backdrop);
    /* disk icons */
    this.diskIcons();
    this.restoreLeftOut();
    this.backdrop.addEventListener("mousedown",e=>{
      if(e.target===this.backdrop&&e.button===0)this.clearSel();
    });
  },
  applyPattern(){
    const p=State.getPref("wbpattern",{grid:null});
    if(p.grid){
      const cnv=document.createElement("canvas");cnv.width=8;cnv.height=8;
      const cx=cnv.getContext("2d");
      const cols=[getComputedStyle(document.documentElement).getPropertyValue("--c0"),
                  getComputedStyle(document.documentElement).getPropertyValue("--c1"),
                  getComputedStyle(document.documentElement).getPropertyValue("--c2"),
                  getComputedStyle(document.documentElement).getPropertyValue("--c3")];
      for(let y=0;y<8;y++)for(let x=0;x<8;x++){
        cx.fillStyle=cols[p.grid[y*8+x]||0];cx.fillRect(x,y,1,1);
      }
      this.backdrop.style.backgroundImage=`url(${cnv.toDataURL()})`;
      this.backdrop.style.backgroundSize="16px 16px";
    }else{
      this.backdrop.style.backgroundImage="";
    }
  },

  diskIcons(){
    const defs=[
      ["Workbench3.1","workbench3.1",30],
      ["Work","work",130],
      ["Ram Disk","ram disk",230],
    ];
    defs.forEach(([label,volkey],i)=>{
      const vol=FS.volumes[volkey];
      const key=volDisplayName(vol)+":";
      const snap=State.data.icons[key];
      const ic=this.makeIcon({
        label:label==="Ram Disk"?"Ram Disk":label,
        kind:vol.kind==="disk"?(volkey==="ram disk"?"ram":"disk"):vol.kind,
        x:snap?snap.x:this.backdrop.clientWidth-110,
        y:snap?snap.y:24+i*84,
        vol,sub:"",node:vol,isDisk:true,key
      });
      if(!snap){ ic.el.style.left=(Math.max(600,this.backdrop.clientWidth-110))+"px"; }
      this.backdrop.appendChild(ic.el);
    });
  },

  makeIcon(o){
    const el=mk("div","icon");
    const kind=o.node&&o.node.kind||o.kind||"project";
    const custom=o.node&&o.node.customIcon;
    el.appendChild(mk("span","iimg",IconArt.svg(kind,custom)));
    el.appendChild(mk("br"));
    el.appendChild(mk("span","ilbl",esc(o.label)));
    el.style.left=(o.x||10)+"px";
    el.style.top=(o.y||10)+"px";
    const ic={el,label:o.label,kind,vol:o.vol,sub:o.sub,node:o.node,isDisk:!!o.isDisk,key:o.key,win:o.win||null,leftout:o.leftout||false};
    el._icon=ic;
    this.bindIcon(ic);
    return ic;
  },

  /* --------- drawer/disk windows --------- */
  openWins:{},
  openNode(vol,sub,node,fromIcon){
    const path=pathOf(vol,sub);
    if(node.t==="d"){
      if(this.openWins[path]&&!this.openWins[path].closed){
        Windows.activate(this.openWins[path]); return;
      }
      Sound.floppyClick();
      const snap=State.data.wins[path]||{};
      const isDisk=node===vol;
      const title=isDisk?volDisplayName(vol):node.name;
      const win=Windows.create(this.scr,{
        title:title,
        x:snap.x!=null?snap.x:40+Object.keys(this.openWins).length*30,
        y:snap.y!=null?snap.y:36+Object.keys(this.openWins).length*26,
        w:snap.w||460,h:snap.h||250,
        resize:true,scroll:false,
        menu:WBMENU,
        chip:9000,fast:26000,
        onclose:()=>{ delete this.openWins[path]; }
      });
      win.wbPath=path; win.wbVol=vol; win.wbSub=sub; win.wbNode=node;
      win.viewBy=snap.viewBy||"icon"; win.showAll=!!snap.showAll;
      this.openWins[path]=win;
      this.populate(win);
      this.bindRubber(win.body,win.body);
      win.body.addEventListener("mousedown",e=>{
        if(e.button===0&&(e.target===win.body||e.target.classList.contains("iconpane")))this.clearSel();
      });
      return win;
    }
    /* file/tool: dispatch */
    this.launch(vol,sub,node);
  },

  populate(win){
    win.body.innerHTML="";
    const node=win.wbNode, vol=win.wbVol, sub=win.wbSub;
    const kids=childList(node,win.showAll);
    if(win.viewBy!=="icon"){
      const pane=mk("div","wbody scrollable");
      pane.style.cssText="position:absolute;inset:0;background:var(--c2);overflow:auto";
      const sorted=kids.slice();
      if(win.viewBy==="size")sorted.sort((a,b)=>(b.size||0)-(a.size||0));
      if(win.viewBy==="date")sorted.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      sorted.forEach(k=>{
        const row=mk("div","listrow",
          esc(k.name.padEnd(24).slice(0,24))+" "+
          (k.t==="d"?"Drawer":pad(commas(k.size||0),9))+"  "+
          esc(k.prot||"----rwed")+"  "+esc(adosDate(k.date)));
        row.addEventListener("dblclick",()=>this.openNode(vol,sub?sub+"/"+k.name:k.name,k));
        row.addEventListener("mousedown",()=>{ pane.querySelectorAll(".listrow.sel").forEach(r=>r.classList.remove("sel")); row.classList.add("sel"); });
        pane.appendChild(row);
      });
      win.body.appendChild(pane);
      return;
    }
    const pane=mk("div","iconpane");
    pane.style.cssText="position:absolute;inset:0;overflow:auto";
    win.body.appendChild(pane);
    let ix=8,iy=6;
    kids.forEach(k=>{
      const kpath=this.keyOf(vol,sub,k.name);
      if(State.data.leftout.includes(kpath))return; /* lives on the backdrop */
      const snap=State.data.icons[kpath];
      const ic=this.makeIcon({
        label:k.name,node:k,vol,sub:sub?sub+"/"+k.name:k.name,key:kpath,win,
        x:snap?snap.x:ix, y:snap?snap.y:iy
      });
      ic.sub=sub; ic.childName=k.name;
      if(k.noicon)ic.el.classList.add("ghosted");
      pane.appendChild(ic.el);
      if(!snap){ ix+=96; if(ix>Math.max(300,win.el.offsetWidth-100)){ix=8;iy+=76;} }
    });
  },

  refreshWindowFor(vol,sub){
    const path=pathOf(vol,sub);
    const w=this.openWins[path];
    if(w&&!w.closed)this.populate(w);
  },
  refreshAll(){
    Object.values(this.openWins).forEach(w=>{ if(!w.closed)this.populate(w); });
  },

  restoreLeftOut(){
    State.data.leftout.forEach(p=>{
      const r=resolvePath(p);
      if(!r||!r.node)return;
      const snap=State.data.icons[p]||{};
      const ic=this.makeIcon({label:r.node.name,node:r.node,vol:r.volume,sub:r.sub,key:p,
        x:snap.x!=null?snap.x:400+Math.random()*80,y:snap.y!=null?snap.y:300,leftout:true});
      this.backdrop.appendChild(ic.el);
    });
  },

  launch(vol,sub,node){
    const tool=node.tool||"";
    Sound.floppyGrind(3);
    if(tool.startsWith("prefs:"))return Prefs.open(tool.slice(6));
    if(tool.startsWith("commodity:"))return Exchange.launchCommodity(tool.slice(10));
    switch(tool){
      case "shell": return Shell.open();
      case "calculator": return Apps.calculator();
      case "clock": return Apps.clock();
      case "multiview": return Apps.multiview(node,pathOf(vol,sub));
      case "say": return Apps.say();
      case "keyshow": return Apps.keyshow();
      case "iconedit": return Apps.iconedit();
      case "exchange": return Exchange.open();
      case "format": return Apps.format();
      case "diskcopy": return Apps.diskcopy();
      case "paint": return Paint.open(node.pngData?node:null);
      case "boing": return Boing.open();
      case "tracker": return Tracker.open();
    }
    if(node.text!=null)return Apps.multiview(node,pathOf(vol,sub));
    /* unknown tool: authentic complaint */
    sysRequest('Unable to open your tool\n"'+node.name+'"',["Ok"]);
  }
};
/* ============================================================
   ICON INTERACTION — select, double-click, drag, rubber-band
   ============================================================ */
Object.assign(WB,{
  clearSel(){ this.selection.forEach(ic=>ic.el.classList.remove("sel")); this.selection.clear(); },
  select(ic,add){
    if(!add)this.clearSel();
    this.selection.add(ic); ic.el.classList.add("sel");
  },
  bindIcon(ic){
    let lastClick=0;
    ic.el.addEventListener("mousedown",e=>{
      if(e.button!==0)return;
      e.stopPropagation();
      if(!this.selection.has(ic))this.select(ic,e.shiftKey);
      else if(e.shiftKey){ this.selection.delete(ic); ic.el.classList.remove("sel"); return; }
      const now=Date.now();
      if(now-lastClick<450){ lastClick=0; this.openIcon(ic); return; }
      lastClick=now;
      /* drag with ghost outline */
      const sx=e.clientX,sy=e.clientY;
      const parent=ic.el.parentElement;
      const ox=ic.el.offsetLeft,oy=ic.el.offsetTop;
      let dragging=false;
      const ghost=$("#dragghost");
      const move=ev=>{
        const dx=ev.clientX-sx,dy=ev.clientY-sy;
        if(!dragging&&Math.abs(dx)+Math.abs(dy)>5){
          dragging=true;
          ghost.innerHTML=ic.el.innerHTML;
          ghost.className="icon";ghost.id="dragghost";
          ghost.style.display="block";
        }
        if(dragging){
          ghost.style.left=(ev.clientX-28)+"px";
          ghost.style.top=(ev.clientY-24)+"px";
        }
      };
      const up=ev=>{
        window.removeEventListener("mousemove",move);
        window.removeEventListener("mouseup",up);
        ghost.style.display="none";
        if(!dragging)return;
        const dropEl=document.elementFromPoint(ev.clientX,ev.clientY);
        /* drop on backdrop = move icon there (implicit Leave Out for drawer items) */
        const dropWin=dropEl&&dropEl.closest&&dropEl.closest(".win");
        const dropIcon=dropEl&&dropEl.closest&&dropEl.closest(".icon");
        if(dropIcon&&dropIcon._icon&&dropIcon._icon.kind==="trash"&&dropIcon._icon!==ic){
          this.trashIcon(ic); return;
        }
        if(!dropWin&&dropEl&&(dropEl===this.backdrop||this.backdrop.contains(dropEl))&&!ic.isDisk&&parent!==this.backdrop){
          /* dragged out of a drawer window onto the backdrop */
          this.leaveOut(ic,ev.clientX,ev.clientY);
          return;
        }
        /* plain move within same container */
        const r=parent.getBoundingClientRect();
        ic.el.style.left=clamp(ox+ev.clientX-sx, -20, r.width-40)+"px";
        ic.el.style.top =clamp(oy+ev.clientY-sy, 0, Math.max(60,r.height-40))+"px";
      };
      window.addEventListener("mousemove",move);
      window.addEventListener("mouseup",up);
      e.preventDefault();
    });
  },
  openIcon(ic){
    Sound.floppyClick();
    if(ic.isDisk)return this.openNode(ic.vol,"",ic.vol);
    const sub=ic.win?(ic.win.wbSub?ic.win.wbSub+"/"+ic.node.name:ic.node.name):ic.sub;
    this.openNode(ic.vol,sub,ic.node);
  },
  bindRubber(zone,coordEl){
    zone.addEventListener("mousedown",e=>{
      if(e.button!==0)return;
      if(e.target.closest(".icon")||e.target.closest(".win")&&zone===this.backdrop)return;
      if(e.target!==zone&&!e.target.classList.contains("iconpane"))return;
      const r=coordEl.getBoundingClientRect();
      const sx=e.clientX-r.left,sy=e.clientY-r.top;
      const band=this.rubber;
      coordEl.appendChild(band);
      let moved=false;
      const move=ev=>{
        const cx=ev.clientX-r.left,cy=ev.clientY-r.top;
        moved=true;
        band.style.display="block";
        band.style.left=Math.min(sx,cx)+"px"; band.style.top=Math.min(sy,cy)+"px";
        band.style.width=Math.abs(cx-sx)+"px"; band.style.height=Math.abs(cy-sy)+"px";
      };
      const up=ev=>{
        window.removeEventListener("mousemove",move);
        window.removeEventListener("mouseup",up);
        if(moved){
          const bx=band.offsetLeft,by=band.offsetTop,bw=band.offsetWidth,bh=band.offsetHeight;
          this.clearSel();
          coordEl.querySelectorAll(".icon").forEach(el=>{
            const ic=el._icon; if(!ic)return;
            const x=el.offsetLeft+28,y=el.offsetTop+24;
            if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh)this.select(ic,true);
          });
        }
        band.style.display="none";
      };
      window.addEventListener("mousemove",move);
      window.addEventListener("mouseup",up);
    });
  },

  /* --------- menu operations --------- */
  selArray(){ return [...this.selection]; },
  snapshotIcons(){
    this.selArray().forEach(ic=>{
      State.data.icons[ic.key]={x:ic.el.offsetLeft,y:ic.el.offsetTop};
    });
    State.save();
  },
  unsnapshotIcons(){
    this.selArray().forEach(ic=>{ delete State.data.icons[ic.key]; });
    State.save();
  },
  snapshotWindow(all){
    const wins=all?Object.values(this.openWins):[Windows.active].filter(w=>w&&w.wbPath);
    wins.forEach(w=>{
      if(!w||w.closed||!w.wbPath)return;
      State.data.wins[w.wbPath]={x:w.el.offsetLeft,y:w.el.offsetTop,w:w.el.offsetWidth,h:w.el.offsetHeight,viewBy:w.viewBy,showAll:w.showAll};
    });
    State.save();
  },
  leaveOut(ic,cx,cy){
    if(ic.isDisk)return;
    const p=ic.key;
    if(!State.data.leftout.includes(p))State.data.leftout.push(p);
    State.data.icons[p]={x:(cx||300)-28-this.backdrop.getBoundingClientRect().left,
                         y:(cy||200)-24-this.backdrop.getBoundingClientRect().top};
    State.save();
    this.clearSel();
    if(ic.win)this.populate(ic.win); else ic.el.remove();
    const snap=State.data.icons[p];
    const nic=this.makeIcon({label:ic.label,node:ic.node,vol:ic.vol,sub:ic.sub,key:p,x:snap.x,y:snap.y,leftout:true});
    this.backdrop.appendChild(nic.el);
  },
  putAway(){
    this.selArray().forEach(ic=>{
      if(!ic.leftout)return;
      const i=State.data.leftout.indexOf(ic.key);
      if(i>=0)State.data.leftout.splice(i,1);
      delete State.data.icons[ic.key];
      ic.el.remove();
    });
    State.save(); this.clearSel(); this.refreshAll();
  },
  trashIcon(ic){
    if(ic.isDisk){ Sound.beep(); return; }
    const r=resolvePath(ic.key);
    if(!r||!r.parent)return;
    const trash=(ic.vol.c["trashcan"]);
    delete r.parent.c[ic.node.name.toLowerCase()];
    if(trash&&trash.c)trash.c[ic.node.name.toLowerCase()]=ic.node;
    const li=State.data.leftout.indexOf(ic.key);
    if(li>=0){State.data.leftout.splice(li,1);ic.el.remove();}
    State.save(); this.clearSel(); this.refreshAll();
  },
  deleteSel(){
    const sel=this.selArray().filter(ic=>!ic.isDisk);
    if(!sel.length)return;
    requester(this.scr,"Workbench Request",
      "Warning: you cannot get back what you delete.\nOK to delete "+sel.length+" object(s)?",
      ["Ok","Cancel"],(i)=>{
        if(i!==0)return;
        sel.forEach(ic=>{
          const r=resolvePath(ic.key);
          if(r&&r.parent)delete r.parent.c[ic.node.name.toLowerCase()];
          const li=State.data.leftout.indexOf(ic.key);
          if(li>=0){State.data.leftout.splice(li,1);ic.el.remove();}
        });
        State.save(); this.clearSel(); this.refreshAll();
      });

  renameSel(){
    const ic=this.selArray()[0]; if(!ic||ic.isDisk)return;
    requester(this.scr,"Rename","Enter a new name for '"+ic.node.name+"'.",["Ok","Cancel"],(i,val)=>{
      if(i!==0||!val)return;
      const r=resolvePath(ic.key);
      if(r&&r.parent){
        delete r.parent.c[ic.node.name.toLowerCase()];
        ic.node.name=val.trim();
        r.parent.c[val.trim().toLowerCase()]=ic.node;
      }
      this.refreshAll();
    },{input:ic.node.name});
  },
  emptyTrash(){
    const win=Windows.active;
    let vol=(win&&win.wbVol)||FS.volumes["workbench3.1"];
    const sel=this.selArray()[0];
    if(sel&&sel.kind==="trash")vol=sel.vol;
    const trash=vol.c&&vol.c["trashcan"];
    if(trash&&trash.c){ trash.c={}; Sound.noise(.2,.12,600); }
    this.refreshAll();
  },
  cleanUp(){
    const win=Windows.active;
    const pane=win&&win.wbPath?win.body.querySelector(".iconpane"):this.backdrop;
    if(!pane)return;
    let x=8,y=6;
    pane.querySelectorAll(".icon").forEach(el=>{
      el.style.left=x+"px";el.style.top=y+"px";
      x+=96;
      const w=pane===this.backdrop?pane.clientWidth-140:Math.max(300,pane.clientWidth-100);
      if(x>w){x=8;y+=78;}

  },
  selectContents(){
    const win=Windows.active;
    if(!win||!win.wbPath)return;

  },
  newDrawer(){
    const win=Windows.active;
    if(!win||!win.wbNode)return sysRequest("Select a disk or drawer window first.",["Ok"]);
    requester(this.scr,"New Drawer","Enter a name for the new drawer.",["Ok","Cancel"],(i,val)=>{

  },
  openParent(){
    const win=Windows.active;

/* ============================================================
   AmigaShell — console window + AmigaDOS command parser
   ============================================================ */
const Shell={
  count:0,
  open(){
    const n=++this.count;
    const scr=Screens.byId["wb"];
    const win=Windows.create(scr,{title:"AmigaShell",x:30+n*20,y:30+n*16,w:600,h:300,
      resize:true,menu:WBMENU,chip:14000,fast:38000,
      onclose:()=>{ Tasks.remove(sh.task); }});
    const body=mk("div","conbody");
    win.body.appendChild(body);
    const sh={win,body,n,cwd:"SYS:",hist:State.data.shellHist.slice(),hi:-1,line:"",task:Tasks.add("Shell "+n+" [CLI "+n+"]",0)};
    win.shell=sh;
    this.print(sh,"New Shell process "+n+"\n");
    this.prompt(sh);
    body.addEventListener("mousedown",()=>Windows.activate(win));
    win.el.addEventListener("keydown",e=>this.key(sh,e));
    win.el.tabIndex=-1;
    setTimeout(()=>win.el.focus(),30);
    win.el.addEventListener("mousedown",()=>setTimeout(()=>win.el.focus(),0));
    return sh;
  },
  print(sh,txt){
    sh.body.insertBefore(document.createTextNode(txt),sh.curEl||null);
    sh.body.scrollTop=sh.body.scrollHeight;
  },
  prompt(sh){
    sh.promptStr=sh.n+"."+sh.cwd+"> ";
    this.print(sh,sh.promptStr);
    sh.lineNode=document.createTextNode("");
    sh.body.appendChild(sh.lineNode);
    sh.curEl=mk("span","cur"," ");
    sh.body.appendChild(sh.curEl);
    sh.line="";
    sh.body.scrollTop=sh.body.scrollHeight;
  },
  key(sh,e){
    if(e.altKey||e.metaKey)return;
    if(e.ctrlKey&&(e.key==="c"||e.key==="C")){ this.print(sh,"***Break\n");this.endLine(sh);this.prompt(sh);e.preventDefault();return; }
    if(e.key==="F10")return;
    e.stopPropagation();
    if(e.key==="Enter"){
      e.preventDefault();
      const line=sh.line;
      this.endLine(sh);
      this.print(sh,"\n");
      if(line.trim()){
        sh.hist.push(line);
        State.data.shellHist=sh.hist.slice(-40); State.save();
      }
      sh.hi=-1;
      this.exec(sh,line);
      return;
    }
    if(e.key==="Backspace"){ sh.line=sh.line.slice(0,-1); }
    else if(e.key==="ArrowUp"){ if(sh.hist.length){ sh.hi=sh.hi<0?sh.hist.length-1:Math.max(0,sh.hi-1); sh.line=sh.hist[sh.hi]||""; } }
    else if(e.key==="ArrowDown"){ if(sh.hi>=0){ sh.hi=Math.min(sh.hist.length,sh.hi+1); sh.line=sh.hist[sh.hi]||""; } }
    else if(e.key.length===1&&!e.ctrlKey){ sh.line+=e.key; Sound.keyclick(); }
    else return;
    e.preventDefault();
    sh.lineNode.nodeValue=sh.line;
    sh.body.scrollTop=sh.body.scrollHeight;
  },
  endLine(sh){
    if(sh.curEl){sh.curEl.remove();sh.curEl=null;}
    sh.lineNode=null;
  },
  exec(sh,line){
    State.data.lastCmd=line;
    const done=()=>{ if(!sh.win.closed)this.prompt(sh); };
    try{ if(this.run(sh,line)===false)return; }
    catch(err){ this.print(sh,err.message+"\n"); }
    done();
  },
  /* returns false if the command manages its own prompt (async) */
  run(sh,line){
    line=line.trim();
    if(!line)return;
    const m=line.match(/^(\S+)\s*(.*)$/);
    const cmd=m[1].toLowerCase(), args=m[2];
    const P=t=>this.print(sh,t);
    const fail=n=>P((n||line.split(/\s/)[0])+": "+(FS.lastErr||"object not found")+"\n");
    switch(cmd){
      case "dir": return this.cmdDir(sh,args);
      case "list": return this.cmdList(sh,args);
      case "cd": return this.cmdCD(sh,args);
      case "makedir": case "md":{
        if(!args)return P("No name given\n");
        const parts=args.split("/");const nm=parts.pop();
        const base=parts.length?parts.join("/"):"";
        const r=resolvePath(base||sh.cwd, sh.cwd);
        if(!r||!r.node||r.node.t!=="d")return P("MakeDir: can't create "+args+"\n");
        const nd=addc(r.node,N("d",nm,{date:adosDate(new Date()),noicon:false}));
        journalFile(pathOf(r.volume,r.sub),nd);
        State.save();WB.refreshAll();return;
      }
      case "delete":{
        const r=resolvePath(args,sh.cwd);
        if(!r||!r.node||!r.parent)return P("Delete: object not found\n");
        delete r.parent.c[r.node.name.toLowerCase()];
        P("   "+args+"  Deleted\n");State.save();WB.refreshAll();return;
      }
      case "rename":{
        const a=args.split(/\s+(?:as\s+)?/i);
        const r=resolvePath(a[0],sh.cwd);
        if(!r||!r.node||!r.parent||!a[1])return P("Rename: object not found\n");
        delete r.parent.c[r.node.name.toLowerCase()];
        r.node.name=a[1].split("/").pop();
        r.parent.c[r.node.name.toLowerCase()]=r.node;
        State.save();WB.refreshAll();return;
      }
      case "copy":{
        const a=args.split(/\s+(?:to\s+)?/i);
        const src=resolvePath(a[0],sh.cwd), dst=resolvePath(a[1]||"",sh.cwd);
        if(!src||!src.node)return P("Copy: object not found\n");
        if(!dst||!dst.node||dst.node.t!=="d")return P("Copy: destination not found\n");
        const cp=JSON.parse(JSON.stringify(src.node));
        dst.node.c[cp.name.toLowerCase()]=cp;
        journalFile(pathOf(dst.volume,dst.sub),cp);
        State.save();WB.refreshAll();return;
      }
      case "type":{
        const r=resolvePath(args,sh.cwd);
        if(!r||!r.node)return P("Type: object not found\n");
        P((r.node.text!=null?r.node.text:"(binary file)\n"));return;
      }
      case "ed": case "edit":{
        const r=resolvePath(args,sh.cwd);
        Apps.ed(r&&r.node?r.node:null,args,sh.cwd);return;
      }
      case "avail":{
        const cf=Memory.chipFree(),ff=Memory.fastFree();
        P("Type   Available     In-Use    Maximum    Largest\n");
        P("chip "+pad(commas(cf),11)+pad(commas(Memory.chipUsed),11)+pad(commas(Memory.chipTotal),11)+pad(commas((cf*0.87)|0),11)+"\n");
        P("fast "+pad(commas(ff),11)+pad(commas(Memory.fastUsed),11)+pad(commas(Memory.fastTotal),11)+pad(commas((ff*0.92)|0),11)+"\n");
        P("total"+pad(commas(cf+ff),11)+pad(commas(Memory.chipUsed+Memory.fastUsed),11)+pad(commas(Memory.chipTotal+Memory.fastTotal),11)+pad(commas((ff*0.92)|0),11)+"\n");
        return;
      }
      case "assign":{
        if(!args){
          P("Volumes:\n");
          Object.values(FS.volumes).forEach(v=>P(volDisplayName(v)+" [Mounted]\n"));
          P("\nDirectories:\n");
          Object.entries(FS.assigns).forEach(([k,v])=>{
            if(["dh0","dh1","ram","work"].includes(k))return;
            P(k.toUpperCase().padEnd(16)+v+"\n");
          });
          P("\nDevices:\nPIPE AUX RAM CON\nDF0 DH0 DH1 PRT SER PAR\n");
          return;
        }
        const a=args.split(/\s+/);
        if(a[0]&&a[1]){FS.assigns[a[0].replace(/:$/,"").toLowerCase()]=a[1];return;}
        return;
      }
      case "info":{
        P("Mounted disks:\nUnit      Size    Used    Free Full Errs   Status   Name\n");
        const row=(u,v)=>{
          const size=v.capacity||2*1024*1024;
          const used=v.volKind==="ram"?("used" in v?v.used:81920):v.used;
          const free=size-used;
          P(u.padEnd(6)+pad(size>=1e6?((size/1048576)|0)+"M":((size/1024)|0)+"K",6)+
            pad(commas((used/512)|0),8)+pad(commas((free/512)|0),8)+
            pad((used/size*100)|0,4)+"%"+pad(0,5)+"  Read/Write  "+volDisplayName(v)+"\n");
        };
        row("DH0:",FS.volumes["workbench3.1"]);
        row("DH1:",FS.volumes["work"]);
        const ram=FS.volumes["ram disk"];ram.capacity=Memory.fastTotal;ram.used=131072;
        row("RAM:",ram);
        return;
      }
      case "status":{
        P("Process  1: Loaded as command: Workbench\n");
        Tasks.list.forEach(t=>{ if(t.n>1)P("Process "+pad(t.n,2)+": Loaded as command: "+t.name+"\n"); });
        return;
      }
      case "run":{
        if(!args){P("Run: no command\n");return;}
        const t=Tasks.add(args.split(/\s+/)[0],0);
        P("[CLI "+t.n+"]\n");
        /* a Run-launched counter task, visibly multitasking */
        if(/^count/i.test(args)){
          let i=0;
          const iv=setInterval(()=>{
            if(sh.win.closed){clearInterval(iv);Tasks.remove(t);return;}
            this.print(sh,"\rBackground count: "+(++i)+"\n");
            if(i>=parseInt(args.split(/\s+/)[1])||i>=30){clearInterval(iv);Tasks.remove(t);}
          },1000);
        }else{
          setTimeout(()=>{ this.run(sh,args); Tasks.remove(t); },50);
        }
        return;
      }
      case "version": P("Kickstart 40.68, Workbench 40.42\n");return;
      case "date":{
        const d=new Date();
        P(DAYS[d.getDay()]+" "+adosDate(d)+" "+adosTime(d)+"\n");return;
      }
      case "echo": P(args.replace(/^"(.*)"$/,"$1")+"\n");return;
      case "execute":{
        const r=resolvePath(args,sh.cwd);
        if(!r||!r.node||r.node.text==null)return P("Execute: can't open "+args+"\n");
        r.node.text.split("\n").forEach(l=>{
          l=l.trim();
          if(l&&!l.startsWith(";"))P("> "+l+"\n");
        });
        return;
      }
      case "wait":{
        const secs=parseFloat(args)||1;
        setTimeout(()=>{ if(!sh.win.closed)this.prompt(sh); },Math.min(secs,30)*1000);
        return false;
      }
      case "why": P("The last command did not set a return code\n");return;
      case "fault":{
        const codes={103:"insufficient free store",205:"object not found",212:"object not of required type",218:"device (or volume) is not mounted",221:"disk is full",226:"no disk in drive"};
        const n=parseInt(args)||205;
        P("Fault "+n+": "+(codes[n]||"Error not documented")+"\n");return;
      }
      case "loadwb": P("Workbench is already loaded.\n");return;
      case "endshell": case "endcli":{
        this.print(sh,"\n");
        setTimeout(()=>Windows.close(sh.win),120);
        return false;
      }
      case "say": return this.cmdSay(sh,args);
      case "cls": sh.body.textContent="";return;
      case "guru": case "meditate":
        setTimeout(()=>Guru.trigger("00000003.00C0FFEE"),400);
        P("Software failure imminent. It has been an honour.\n");return;
      case "mount": P("Mount: all simulated devices are already mounted\n");return;
      case "setclock": P("SetClock: battery backed up clock is a museum piece\n");return;
      case "which":{
        const r=resolvePath("C:"+args);
        P(r&&r.node?"Workbench3.1:C/"+r.node.name+"\n":"Which: "+args+" not found\n");return;
      }
      case "eval":{
        try{
          if(/^[\d\s+\-*/().%]+$/.test(args))P(String(Function('"use strict";return('+args+')')())+"\n");
          else P("Eval: bad expression\n");
        }catch(e){P("Eval: bad expression\n");}
        return;
      }
      case "protect":{
        const a=args.split(/\s+/);
        const r=resolvePath(a[0],sh.cwd);
        if(!r||!r.node)return P("Protect: object not found\n");
        if(a[1])r.node.prot=("--------"+a[1].toLowerCase()).slice(-8);
        return;
      }
      case "filenote":{
        const mm=args.match(/^(\S+)\s+"?([^"]*)"?$/);
        const r=mm&&resolvePath(mm[1],sh.cwd);
        if(!r||!r.node)return P("Filenote: object not found\n");
        r.node.comment=mm[2]||"";State.save();return;
      }
      case "install": P("Install: specified volume is a hard drive (and imaginary)\n");return;
      case "relabel": P("Relabel: not permitted in the museum\n");return;
      case "break": P("Break: process not found\n");return;
      case "setpatch": P("SetPatch 40.16 already installed\n");return;
      case "iprefs": return;
      case "prompt": return;
      default:{
        /* maybe it's a path to something runnable */
        const r=resolvePath(args?line:cmd,sh.cwd)||resolvePath(cmd,sh.cwd)||resolvePath("C:"+cmd);
        if(r&&r.node){
          if(r.node.t==="d"){ P(cmd+": object not of required type\n"); return; }
          if(r.node.tool){ WB.launch(r.volume,r.sub,r.node); return; }
          P(cmd+": file is not executable\n");return;
        }
        P(cmd+": Unknown command\n");
        return;
      }
    }
  },
  cmdCD(sh,args){
    if(!args){ this.print(sh,sh.cwd+"\n"); return; }
    let target=args;
    if(args==="/"){ /* parent */
      const i=sh.cwd.indexOf(":");
      const parts=sh.cwd.slice(i+1).split("/").filter(Boolean);parts.pop();
      target=sh.cwd.slice(0,i+1)+parts.join("/");
    }
    const r=resolvePath(target,sh.cwd);
    if(r&&r.missing){ WB.insertVolumeRequest(r.missing); return; }
    if(!r||!r.node||r.node.t!=="d"){ this.print(sh,"CD: can't find "+args+"\n"); return; }
    sh.cwd=pathOf(r.volume,r.sub);
  },
  cmdDir(sh,args){
    const r=resolvePath(args||sh.cwd,sh.cwd);
    if(!r||!r.node||r.node.t!=="d")return this.print(sh,"Dir: can't find "+(args||sh.cwd)+"\n");
    const kids=childList(r.node,true);
    const dirs=kids.filter(k=>k.t==="d"),files=kids.filter(k=>k.t!=="d");
    let out="";
    dirs.forEach(d=>out+="  "+d.name+" (dir)\n");
    /* files two-column */
    const names=files.map(f=>"  "+f.name);
    for(let i=0;i<names.length;i+=2)
      out+=(names[i].padEnd(34))+(names[i+1]||"")+"\n";
    this.print(sh,out||"  (empty)\n");
  },
  cmdList(sh,args){
    const r=resolvePath(args||sh.cwd,sh.cwd);
    if(!r||!r.node)return this.print(sh,"List: can't find "+(args||sh.cwd)+"\n");
    const kids=r.node.t==="d"?childList(r.node,true):[r.node];
    this.print(sh,"Directory \""+(args||sh.cwd)+"\" on "+DAYS[new Date().getDay()].toLowerCase()+" "+adosDate(new Date())+"\n");
    let files=0,dirs=0,bytes=0;
    kids.forEach(k=>{
      const nm=k.name.padEnd(24).slice(0,24);
      const sz=k.t==="d"?"   Dir":pad(commas(k.size||0),6);
      this.print(sh,nm+" "+sz+" "+(k.prot||"----rwed")+" "+adosDate(k.date)+" "+adosTime(new Date(2015,1,1))+
        (k.comment?"\n: "+k.comment:"")+"\n");
      if(k.t==="d")dirs++;else{files++;bytes+=k.size||0;}
    });
    this.print(sh,files+" files - "+dirs+" directories - "+commas(bytes)+" bytes used\n");
  },
  cmdSay(sh,args){
    const text=args||"hello, I am the amiga speech synthesizer";
    Apps.speakRobot(text);
    this.print(sh,"\n");
  }
};

  /* ---------------- Calculator ---------------- */
  calculator(){
    const scr=Screens.byId["wb"];
    const win=Windows.create(scr,{title:"Calculator",x:120,y:60,w:230,h:270,resize:false,chip:6000,fast:12000,
      menu:[{title:"Project",items:[{t:"Clear Entry",cmd:()=>upd("0",true)},{t:"Quit",key:"Q",cmd:()=>Windows.close(win)}]}]});
    const t=Tasks.add("Calculator",0);
    win.opts.onclose=()=>Tasks.remove(t);
    let disp="0",acc=null,op=null,fresh=true;
    const d=mk("div",null);
    d.style.cssText="margin:8px;padding:4px 8px;text-align:right;font:18px var(--tz);background:var(--c0)";
    d.className="bev-in";
    const grid=mk("div");
    grid.style.cssText="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 8px";
    const upd=(v,reset)=>{ disp=v; if(reset){acc=null;op=null;fresh=true;} d.textContent=disp; };
    const press=k=>{
      Sound.keyclick();
      if(k>="0"&&k<="9"){ disp=fresh?k:(disp+k).slice(0,12); fresh=false; }
      else if(k==="."){ if(fresh){disp="0.";fresh=false;} else if(!disp.includes("."))disp+="."; }
      else if(k==="CA"){ disp="0";acc=null;op=null;fresh=true; }
      else if(k==="CE"){ disp="0";fresh=true; }
      else if(k==="«"){ disp=disp.length>1?disp.slice(0,-1):"0"; }
      else if(k==="±"){ disp=String(-parseFloat(disp)); }
      else if(["+","-","×","÷","="].includes(k)){
        const v=parseFloat(disp);
        if(op&&acc!=null&&!fresh){
          let r=op==="+"?acc+v:op==="-"?acc-v:op==="×"?acc*v:(v===0?NaN:acc/v);
          if(!isFinite(r)||isNaN(r)){ Sound.beep(); upd("0",true); return; }
          r=Math.round(r*1e8)/1e8;
          disp=String(r);acc=r;
        }else acc=v;
        op=k==="="?null:k;
        fresh=true;
      }
      d.textContent=disp;
    };
    ["CA","CE","«","÷","7","8","9","×","4","5","6","-","1","2","3","+","0",".","±","="].forEach(k=>{
      const b=mk("span","btn",esc(k));
      b.style.textAlign="center";
      b.addEventListener("click",()=>press(k));
      grid.appendChild(b);
    });
    win.body.append(d,grid);
    d.textContent=disp;
  },

  /* ---------------- Clock ---------------- */
  clock(){
    const scr=Screens.byId["wb"];
    let mode=State.getPref("clock",{mode:"analog"}).mode;
    const win=Windows.create(scr,{title:"Clock",x:420,y:50,w:200,h:200,resize:true,chip:5000,fast:9000,
      menu:[{title:"Project",items:[{t:"Quit",key:"Q",cmd:()=>Windows.close(win)}]},
            {title:"Type",items:[
              {t:"Analog",checkFn:()=>mode==="analog",cmd:()=>{mode="analog";State.usePref("clock",{mode});}},
              {t:"Digital",checkFn:()=>mode==="digital",cmd:()=>{mode="digital";State.usePref("clock",{mode});}}]},
            {title:"Alarm",items:[{t:"Set...",cmd:()=>sysRequest("The alarm clock is asleep.",["Ok"])}]}],
      onresize:()=>size()});
    const t=Tasks.add("Clock",5);
    const cnv=document.createElement("canvas");
    cnv.style.cssText="position:absolute;inset:0;width:100%;height:100%";
    win.body.appendChild(cnv);
    const size=()=>{ cnv.width=win.body.clientWidth; cnv.height=win.body.clientHeight; };
    size();
    const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const iv=setInterval(()=>{
      if(win.closed){clearInterval(iv);Tasks.remove(t);return;}
      const g=cnv.getContext("2d"),w=cnv.width,h=cnv.height,now=new Date();
      g.fillStyle=css("--c0");g.fillRect(0,0,w,h);
      if(mode==="digital"){
        g.fillStyle=css("--c1");
        g.font="bold "+Math.max(14,(w/6)|0)+"px monospace";
        g.textAlign="center";g.textBaseline="middle";
        g.fillText(adosTime(now),w/2,h/2);
        return;
      }
      const cx=w/2,cy=h/2,r=Math.min(w,h)/2-8;
      g.strokeStyle=css("--c1");g.fillStyle=css("--c2");
      g.beginPath();g.arc(cx,cy,r,0,7);g.fill();g.stroke();
      g.fillStyle=css("--c1");
      for(let i=0;i<12;i++){
        const a=i/12*Math.PI*2;
        g.fillRect(cx+Math.sin(a)*(r-6)-1.5,cy-Math.cos(a)*(r-6)-1.5,3,3);
      }
      const hand=(val,len,wd,col)=>{
        const a=val*Math.PI*2;
        g.strokeStyle=col;g.lineWidth=wd;
        g.beginPath();g.moveTo(cx,cy);
        g.lineTo(cx+Math.sin(a)*len,cy-Math.cos(a)*len);g.stroke();
      };
      hand((now.getHours()%12+now.getMinutes()/60)/12,r*.5,3,css("--c1"));
      hand(now.getMinutes()/60,r*.75,2,css("--c1"));
      hand(now.getSeconds()/60,r*.8,1,css("--c3"));
    },250);
  },

  /* ---------------- Say ---------------- */
  speakRobot(text){
    try{
      if(window.speechSynthesis){
        const u=new SpeechSynthesisUtterance(text);
        u.pitch=0.1; u.rate=0.85;
        const vs=speechSynthesis.getVoices();
        const v=vs.find(v=>/en/i.test(v.lang));
        if(v)u.voice=v;
        speechSynthesis.speak(u);
        return u;
      }
    }catch(e){}
    /* fallback: buzzy Paula formant babble */
    const words=text.split(/\s+/).length;
    for(let i=0;i<words*3;i++)
      setTimeout(()=>Sound.tone(90+Math.random()*140,.09,.1,"sawtooth"),i*110);
    return null;
  },

(function(){

/* custom pointer sprite */
const Pointerify={
  defaultGrid(){
    /* classic-flavoured red arrow with black outline, drawn in code */
    const g=new Array(256).fill(0);
    const set=(x,y,v)=>{if(x>=0&&x<16&&y>=0&&y<16)g[y*16+x]=v;};
    for(let y=0;y<11;y++){
      for(let x=0;x<=Math.min(y,6);x++)set(x,y,1);
      set(Math.min(y,7),y,2);
    }
    for(let x=0;x<7;x++)set(x,11,2);
    set(2,11,1);set(3,12,1);set(3,13,2);set(2,12,2);
    for(let i=0;i<16;i++){ if(g[i*16]===1)set(0,i,g[i*16]); }
    return g;
  },
  apply(grid){
    grid=grid||this.defaultGrid();
    const cnv=document.createElement("canvas");cnv.width=16;cnv.height=16;
    const cx=cnv.getContext("2d");
    const COLS=[null,"#e44","#000","#fff"];
    for(let y=0;y<16;y++)for(let x=0;x<16;x++){
      const v=grid[y*16+x];
      if(v){cx.fillStyle=COLS[v];cx.fillRect(x,y,1,1);}
    }
    const big=document.createElement("canvas");big.width=32;big.height=32;
    const bx=big.getContext("2d");bx.imageSmoothingEnabled=false;
    bx.drawImage(cnv,0,0,32,32);
    document.body.style.cursor="url("+big.toDataURL()+") 1 1, auto";
  }
};
