  },
  loadPic(dataURL){
    const g=this.cnv.getContext("2d"),im=new Image();
    im.onload=()=>g.drawImage(im,0,0);
    im.src=dataURL;
  },
  refreshPal(){
    this.swatches.forEach((s,i)=>{
      s.style.outline=i===this.color?"2px solid #fff":"none";
      s.style.outlineOffset="-1px";
    });
    this.curSwatch.style.background=this.PALETTE[this.color];
  },
  setTool(t){
    this.tool=t;
    Object.entries(this.toolBtns||{}).forEach(([id,b])=>{
      b.style.background=id===t?"var(--c3)":"";
      b.style.color=id===t?"var(--c2)":"";
    });
  },
  snapshotUndo(){
    try{ this._undo=this.cnv.toDataURL(); }catch(e){}
  },
  undo(){
    if(!this._undo)return;
    const im=new Image(),g=this.cnv.getContext("2d");
    im.onload=()=>g.drawImage(im,0,0);
    im.src=this._undo;
  },
  bindCanvas(){
    const cnv=this.cnv,g=cnv.getContext("2d");
    let down=false,sx=0,sy=0,save=null;
    const pos=e=>{
      const r=cnv.getBoundingClientRect();
      return [ (e.clientX-r.left)*cnv.width/r.width, (e.clientY-r.top)*cnv.height/r.height ];
    };
    const dot=(x,y,col)=>{
      g.fillStyle=this.PALETTE[col!=null?col:this.color];
      g.beginPath();g.arc(x,y,this.size,0,7);g.fill();
    };
    cnv.addEventListener("mousedown",e=>{
      if(e.button!==0)return;
      this.snapshotUndo();
      down=true;[sx,sy]=pos(e);
      if(this.tool==="fill"){ this.floodFill(sx|0,sy|0); down=false; return; }
      if(this.tool==="brush")dot(sx,sy);
      if(this.tool==="erase")dot(sx,sy,this.bg);
      if(this.tool==="line"||this.tool==="rect")save=g.getImageData(0,0,cnv.width,cnv.height);
      e.stopPropagation();
    });
    window.addEventListener("mousemove",e=>{
      if(!down)return;
      const [x,y]=pos(e);
      if(this.tool==="brush"||this.tool==="erase"){
        const col=this.tool==="erase"?this.bg:this.color;
        g.strokeStyle=this.PALETTE[col];g.lineWidth=this.size*2;g.lineCap="round";
        g.beginPath();g.moveTo(sx,sy);g.lineTo(x,y);g.stroke();
        sx=x;sy=y;
      }else if(this.tool==="spray"){
        g.fillStyle=this.PALETTE[this.color];
        for(let i=0;i<14;i++){
          const a=Math.random()*7,r=Math.random()*this.size*3;
          g.fillRect(x+Math.cos(a)*r,y+Math.sin(a)*r,1.5,1.5);
        }
      }else if(this.tool==="line"&&save){
        g.putImageData(save,0,0);
        g.strokeStyle=this.PALETTE[this.color];g.lineWidth=Math.max(1,this.size/2);
        g.beginPath();g.moveTo(sx,sy);g.lineTo(x,y);g.stroke();
      }else if(this.tool==="rect"&&save){
        g.putImageData(save,0,0);
        g.strokeStyle=this.PALETTE[this.color];g.lineWidth=Math.max(1,this.size/2);
        g.strokeRect(Math.min(sx,x),Math.min(sy,y),Math.abs(x-sx),Math.abs(y-sy));
      }
    });
    window.addEventListener("mouseup",()=>{down=false;save=null;});
  },
  floodFill(x,y){
    const cnv=this.cnv,g=cnv.getContext("2d");
    const img=g.getImageData(0,0,cnv.width,cnv.height),d=img.data,W=cnv.width,H=cnv.height;
    const idx=(x,y)=>(y*W+x)*4;
    const t=idx(x,y);
    const tr=d[t],tg=d[t+1],tb=d[t+2];
    const hex=this.PALETTE[this.color];
    const nr=parseInt(hex.slice(1,3),16),ng=parseInt(hex.slice(3,5),16),nb=parseInt(hex.slice(5,7),16);
    if(tr===nr&&tg===ng&&tb===nb)return;
    const q=[[x,y]];
    let guard=W*H;
    while(q.length&&guard-->0){
      const [cx,cy]=q.pop();
      if(cx<0||cy<0||cx>=W||cy>=H)continue;
      const i=idx(cx,cy);
      if(d[i]!==tr||d[i+1]!==tg||d[i+2]!==tb)continue;
      d[i]=nr;d[i+1]=ng;d[i+2]=nb;d[i+3]=255;
      q.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
    }
    g.putImageData(img,0,0);
  },
  clear(){
    this.snapshotUndo();
    const g=this.cnv.getContext("2d");
    g.fillStyle=this.PALETTE[this.bg];
    g.fillRect(0,0,this.cnv.width,this.cnv.height);
  },
  swapPage(){
    this.pages[this.page]=this.cnv.toDataURL();
    this.page=1-this.page;
    const g=this.cnv.getContext("2d");
    g.fillStyle=this.PALETTE[this.bg];g.fillRect(0,0,this.cnv.width,this.cnv.height);
    const src=this.pages[this.page];
    if(src){ const im=new Image(); im.onload=()=>g.drawImage(im,0,0); im.src=src; }
    Screens.byId["paint"].stxt.textContent="Paint 1.2  — "+(this.page?"Spare Page":"Page 1");
  },
  save(){
    const dir=resolvePath("Work:Paintings");
    if(!dir||!dir.node)return;
    let n=1;
    while(dir.node.c[("untitled"+n+".pic").toLowerCase()])n++;
    const f=N("f","Untitled"+n+".pic",{kind:"project",size:30000+((Math.random()*20000)|0),date:adosDate(new Date()),tool:"paint"});
    f.pngData=this.cnv.toDataURL();
    addc(dir.node,f);
    journalFile("Work:Paintings",f);
    State.save();WB.refreshAll();
    requester(this.scr,"Paint","Saved as Work:Paintings/"+f.name,["Ok"]);
  },
  close(){
    this.pages=[null,null];this.page=0;
    Tasks.remove(this.task);
    Memory.free(this.memid);
    Screens.remove(this.scr);
    this.scr=null;
  }
};

/* ============================================================
   BOING — red-and-white checkered ball bouncing on a grid,
   on its own screen, in the spirit of the 1984 demo.
   ============================================================ */
const Boing={
  scr:null,
  open(){
    if(this.scr&&Screens.byId["boing"]){Screens.toFront(this.scr);return;}
    const scr=Screens.create("boing","Boing!  (a tribute, 1984 forever)",{
      css:{background:"#b8b8b8"},
      menu:[{title:"Demo",items:[
        {t:"Screen To Back",key:"B",cmd:()=>Screens.toBack(this.scr)},
        {t:"Quit",key:"Q",cmd:()=>this.close()}]}]
    });
    this.scr=scr;
    this.task=Tasks.add("Boing",-5);
    this.memid=Memory.alloc(260000,90000);
    const cnv=document.createElement("canvas");
    cnv.style.cssText="position:absolute;inset:0;width:100%;height:100%";
    scr.body.appendChild(cnv);
    scr.body.style.background="#b8b8b8";
    const fit=()=>{cnv.width=scr.body.clientWidth;cnv.height=scr.body.clientHeight;};
    fit();window.addEventListener("resize",fit);
    let x=200,y=120,vx=2.4,vy=0,rot=0,t=0;
    const R=Math.min(90,cnv.height/4);
    const g=cnv.getContext("2d");
    this.iv=setInterval(()=>{
      if(!Screens.byId["boing"]){clearInterval(this.iv);return;}
      const W=cnv.width,H=cnv.height;
      t++;
      /* physics */
      vy+=0.35; x+=vx; y+=vy; rot+=vx>0?0.045:-0.045;
      if(y>H-R-30){ y=H-R-30; vy=-Math.abs(vy)*0.995-0.2; if(Math.abs(vy)>3)Sound.boom(); }
      if(x<R+10){x=R+10;vx=Math.abs(vx);}
      if(x>W-R-10){x=W-R-10;vx=-Math.abs(vx);}
      /* draw */
      g.fillStyle="#b8b8b8";g.fillRect(0,0,W,H);
      /* purple grid backdrop */
      g.strokeStyle="#9750b4";g.lineWidth=1.4;
      const gw=40;
      g.beginPath();
      for(let gx=20;gx<W-20;gx+=gw){g.moveTo(gx,20);g.lineTo(gx,H-60);}
      for(let gy=20;gy<H-60;gy+=gw){g.moveTo(20,gy);g.lineTo(W-20,gy);}
      g.stroke();
      /* floor perspective */
      g.beginPath();
      for(let gx=20;gx<=W-20;gx+=gw){
        g.moveTo(gx,H-60);
        g.lineTo(20+(gx-20)*1.12-((W-40)*.06),H-18);
      }
      for(let k=0;k<3;k++){g.moveTo(20-((W-40)*.06)*k/2,H-60+k*14);g.lineTo(W-20+((W-40)*.06)*k/2,H-60+k*14);}
      g.stroke();
      /* shadow */
      g.fillStyle="rgba(80,80,80,.45)";
      g.beginPath();g.ellipse(x+18,H-40,R*.9,R*.22,0,0,7);g.fill();
      /* checkered sphere */
      const SEG=8;
      for(let i=0;i<SEG;i++){
        for(let j=0;j<SEG;j++){
          const th1=i/SEG*Math.PI, th2=(i+1)/SEG*Math.PI;
          const ph1=j/SEG*Math.PI*2+rot, ph2=(j+1)/SEG*Math.PI*2+rot;
          const P=(th,ph)=>{
            const px=Math.sin(th)*Math.cos(ph), pz=Math.sin(th)*Math.sin(ph), py=Math.cos(th);
            return [x+px*R, y+py*R, pz];
          };
          const a=P(th1,ph1),b=P(th1,ph2),c=P(th2,ph2),d2=P(th2,ph1);
          if(a[2]+b[2]+c[2]+d2[2]<0)continue; /* back-face cull */
          g.fillStyle=((i+j)%2===0)?"#e02020":"#ffffff";
          g.strokeStyle=g.fillStyle;
          g.beginPath();
          g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d2[0],d2[1]);
          g.closePath();g.fill();g.stroke();
        }
      }
    },33);
    Screens.toFront(scr);
  },
  close(){
    clearInterval(this.iv);
    Tasks.remove(this.task);
    Memory.free(this.memid);
    Screens.remove(this.scr);
    this.scr=null;
  }
};

/* ============================================================
   BOOT MANAGER — power-on, Kickstart insert-disk screen,
   boot colour strobe, startup-sequence, then Workbench.
   ESC skips. Hidden "no boot disk" mode: add ?noboot to the
   URL, or set localStorage key amigaos31_noboot.
   ============================================================ */
const Boot={
  running:true, el:null, skipReq:false,
  nobootMode(){
    try{
      return location.search.includes("noboot")||localStorage.getItem("amigaos31_noboot")==="1";
    }catch(e){ return false; }
  },
  kickstartSVG(){
    /* 3.x-style presentation: a floppy gliding into a drive slot,
       original artwork in the spirit of the ROM screen */
    return `
    <svg id="kickart" viewBox="0 0 400 260" style="width:70%;max-width:560px">
      <rect x="0" y="0" width="400" height="260" fill="#ffffff"/>
      <g id="kickdrive">
        <rect x="70" y="150" width="260" height="70" rx="6" fill="#dddddd" stroke="#555" stroke-width="3"/>
        <rect x="100" y="168" width="200" height="10" rx="3" fill="#333"/>
        <circle cx="310" cy="200" r="6" fill="#44aa44"/>
        <rect x="90" y="196" width="60" height="12" rx="2" fill="#bbb" stroke="#777"/>
      </g>
      <g id="kickdisk">
        <rect x="150" y="30" width="100" height="96" rx="4" fill="#3355bb" stroke="#112" stroke-width="3"/>
        <rect x="172" y="30" width="56" height="34" fill="#ccc" stroke="#556"/>
        <rect x="196" y="36" width="18" height="22" fill="#334"/>
        <rect x="162" y="78" width="76" height="40" rx="2" fill="#eee" stroke="#556"/>
        <text x="200" y="103" font-size="13" text-anchor="middle" fill="#334" font-family="monospace">3.1</text>
      </g>
      <path id="kickarrow" d="M200 8 l0 14 m-8 -8 l8 8 l8 -8" stroke="#cc3333" stroke-width="4" fill="none"/>
      <text x="200" y="250" font-size="12" text-anchor="middle" fill="#888" font-family="monospace">kickstart 40.68 — insert disk</text>
    </svg>`;
  },
  start(){
    this.running=true;
    const el=mk("div");el.id="boot";
    el.innerHTML='<div id="kick" style="display:none">'+this.kickstartSVG()+'</div><div id="bootseq"></div>';
    document.body.appendChild(el);
    this.el=el;
    const skip=e=>{ if(e.key==="Escape"){this.skipReq=true;} };
    window.addEventListener("keydown",skip);
    this._skipHandler=skip;
    const steps=[];
    const wait=(ms)=>new Promise(res=>{
      if(this.skipReq)return res();
      const t=setTimeout(res,ms);
      const iv=setInterval(()=>{ if(this.skipReq){clearTimeout(t);clearInterval(iv);res();} },60);
      setTimeout(()=>clearInterval(iv),ms+50);
    });
    (async()=>{
      /* a beat of dark screen */
      await wait(900);
      /* famous power-on palette strobe: dark grey → grey → white */
      for(const c of ["#333333","#888888","#ffffff"]){
        el.style.background=c;
        await wait(240);
      }
      el.style.background="#fff";
      /* Kickstart insert-disk screen */
      $("#kick",el).style.display="flex";
      const dsk=$("#kickdisk",el);
      if(dsk){ dsk.style.transition="transform 1.4s ease-in"; }
      Sound.floppyClick();
      await wait(500);
      if(this.nobootMode()){
        /* museum mode: sit at the insert-disk screen forever */
        const bounce=setInterval(()=>{
          if(!document.body.contains(el)){clearInterval(bounce);return;}
          const a=$("#kickarrow",el);
          if(a)a.style.opacity=a.style.opacity==="0.2"?"1":"0.2";
        },600);
        this.running=true;
        return;
      }
      /* the hard drive "boots": disk glides into the slot */
      if(dsk&&!this.skipReq){ dsk.style.transform="translateY(96px) scale(.92)"; Sound.diskInsert(); }
      await wait(1300);
      Sound.floppyGrind(8);
      /* startup-sequence flicker */
      $("#kick",el).style.display="none";
      el.style.background="#000";
      const seq=$("#bootseq",el);
      seq.style.display="block";
      const lines=["AMIGA ROM Operating System and Libraries",
        "Copyright © 1985-1994 Commodore-Amiga, Inc.","All Rights Reserved.","",
        "SetPatch 40.16","Kickstart 40.68, Workbench 40.42","",
        "Mounting DH0: (FastFileSystem)  ... ok","Mounting DH1: (FastFileSystem)  ... ok",
        "Mounting RAM: (ram-handler)     ... ok","",
        "Copy ENVARC: RAM:ENV ALL QUIET","Assign ENV: RAM:ENV","Assign T: RAM:T",
        "IPrefs 40.6","","LoadWB","EndCLI"];
      for(const ln of lines){
        seq.textContent+=ln+"\n";
        if(Math.random()<.5)Sound.floppyClick();
        await wait(this.skipReq?0:90+Math.random()*140);
      }
      await wait(400);
      this.finish();
    })();
  },
  finish(){
    window.removeEventListener("keydown",this._skipHandler);
    if(this.el){this.el.remove();this.el=null;}
    this.running=false;
    this.skipReq=false;
    Sound.floppyClick();
  },
  reboot(){
    /* clear the Ram Disk — veterans will test this */
    Screens.list.slice().forEach(s=>Screens.remove(s));
    stage.innerHTML="";
    Windows.active=null;
    WB.openWins={};
    WB.selection=new Set();
    Tasks.list=Tasks.list.filter(t=>t.n===1);
    /* Use-only prefs evaporate on reboot */
    State.useOverlay={};
    try{ speechSynthesis&&speechSynthesis.cancel(); }catch(e){}
    buildFS();           /* RAM: rebuilt empty, everything else from defaults */
    State.load();
    replayUserFS();
    this.start();
    const iv=setInterval(()=>{
      if(!this.running){ clearInterval(iv); initWorkbench(); }
    },150);
  }
};

/* very small persistence of user-created FS objects: we re-apply a
   journal of creations on top of the pristine tree (RAM: excluded). */
function replayUserFS(){ /* the full tree lives in code; user files persist via State.data.files */
  const j=State.data.files;
  if(!j)return;
  j.forEach(ent=>{
    try{
      const r=resolvePath(ent.dir);
      if(!r||!r.node||!r.node.c)return;
      if(ent.dir.toLowerCase().startsWith("ram"))return;
      const n=N(ent.t,ent.name,ent.props||{});
      r.node.c[n.name.toLowerCase()]=n;
    }catch(e){}
  });
}

/* ============================================================
   INIT — build the world, boot the machine
   ============================================================ */
function initWorkbench(){
  const wb=Screens.create("wb","AmigaOS 3.1  Workbench Screen",{mem:true,menu:WBMENU});
  wb.app="workbench";
  WB.scr=wb;
  WB.selection=new Set();
  WB.init(wb);
  Titlebars.refresh();
  /* apply Saved prefs (Use-only ones evaporated at reboot) */
  applyPalette(State.getPref("palette",DEFAULT_PALETTE));
  WB.applyPattern();
  const pp=State.getPref("pointer",{grid:null});
  Pointerify.apply(pp.grid);
}
function initAll(){
  buildFS();
  replayUserFS();
  Guru.init();
  Boot.start();
  const iv=setInterval(()=>{
    if(!Boot.running){ clearInterval(iv); initWorkbench(); }
  },150);
}
/* CRT toggle: Ctrl+F12 (subtle scanline flavour, defaults off) */
window.addEventListener("keydown",e=>{
  if(e.key==="F12"&&e.ctrlKey){ e.preventDefault(); $("#crt").classList.toggle("on"); }
  if(e.key==="F11"&&e.ctrlKey){ /* hidden museum mode toggle */
    e.preventDefault();
    try{
      const v=localStorage.getItem("amigaos31_noboot")==="1";
      localStorage.setItem("amigaos31_noboot",v?"0":"1");
      sysRequest("No-boot museum mode "+(v?"disabled":"enabled")+".\nTakes effect at next reboot (try the Guru).",["Ok"]);
    }catch(err){}
  }
});
window.addEventListener("beforeunload",()=>State.save());
initAll();
</script>
