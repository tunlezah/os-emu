  }
  const PROCFILES = ["version", "cpuinfo", "meminfo", "uptime", "loadavg", "filesystems",
    "mounts", "swaps", "interrupts", "ioports", "devices", "modules", "partitions"];

  /* ---- the questions the rest of the exhibit asks the disk ------------ */
  function rootPart()  { return parts().find(p => p.id === "83" && p.root) || parts().find(p => p.id === "83") || null; }
  function rootDev()   { const p = rootPart(); return p ? p.dev : "sda3"; }
  function swapPart()  { return parts().find(p => p.id === "82") || null; }
  function swapKb()    { const p = swapPart(); return p ? blocksOf(p) : 0; }
  function dosPart()   { return parts().find(p => p.id === "06" || p.id === "0b" || p.id === "04") || null; }

  function reset() {
    State.set("parts", JSON.parse(JSON.stringify(FRESH)));
    State.set("mounts", []);
  }

  return { HEADS, SECT, CYLS, CYLBLOCKS, TYPES, typeName, parts, setParts, blocksOf, mbOf,
           freeRanges, byDev, nextDev, mounts, setMounts, isMounted, mountedDev,
           mount, umount, materialise, proc, PROCFILES, dosVolume, cdVolume,
           rootPart, rootDev, swapPart, swapKb, dosPart, reset };
})();

/* ==========================================================================
   MODULE 7b — KERNEL IMAGES ON THE DISK
   --------------------------------------------------------------------------
   A kernel image needs an identity that survives a page reload, because the
   filesystem is rebuilt from the package list every time and file metadata
   is not carried in the overlay.  LILO records that identity when you run
   it, and the boot compares the two, which is the whole of the
   forgot-to-run-lilo consequence.
   ========================================================================== */
const Kimg = (() => {
  function all() { return State.get("kimages", {}); }
  function set(path, meta) {
    path = Fs.norm(path);
    const a = all();
    a[path] = meta;
    State.set("kimages", a);
    const n = Fs.lstat(path);
    if (n) { n.kernel = meta; n.kid = meta.kid; }
  }
  function get(path) { const a = all(); return a[Fs.norm(path)] || null; }
  function drop(path) { const a = all(); delete a[Fs.norm(path)]; State.set("kimages", a); }
  /* after the filesystem is rebuilt, put the identities back on the nodes */
  function reattach() {
    const a = all();
    let changed = false;
    for (const pth in a) {
      const n = Fs.lstat(pth);
      if (n) { n.kernel = a[pth]; n.kid = a[pth].kid; }
      else { delete a[pth]; changed = true; }
    }
    if (changed) State.set("kimages", a);
  }
  function nextId() {
    const n = State.get("kgen", 1) + 1;
    State.set("kgen", n);
    return "k" + n;
  }
  return { all, set, get, drop, reattach, nextId };
})();

/* the running kernel: what uname -a and /proc/version say, and the thing
   the visitor can replace by building their own */
const Kernel = (() => {
  function running() {
    const k = State.get("kernel", null);
    if (k) return k;
    return { ver: "2.0.30", build: 1, host: "darkstar",
             builder: "root", date: "Mon Oct 13 12:41:07 CDT 1997",
             custom: false, sound: null, opts: {} };
  }
  function set(k) { State.set("kernel", k); }
  /* the kernel the installer put there: bare.i, built by Patrick */
  function stock() {
    return { ver: "2.0.30", build: 1, host: "darkstar", builder: "root",
             date: "Mon Oct 13 12:41:07 CDT 1997", custom: false, sound: null, opts: {} };
  }
  /* what is actually in a file, for the times something copies a kernel
     somewhere and the copy has to stay the kernel it was */
  function imageAt(path) {
    return Kimg.get(path) || (Fs.stat(path) || {}).kernel || null;
  }
  return { running, set, stock, imageAt };
})();

/* ==========================================================================
   MODULE 8 — THE CHARACTER GRID AND THE VIRTUAL TERMINAL LAYER
   --------------------------------------------------------------------------
   The whole graphics stack for text mode: a grid of cells, each with a
   character and a foreground and background out of sixteen.  The BIOS, the
   kernel messages, fdisk, setup, bash, vi, pico, lynx, pine, menuconfig
   and every dialog box in this exhibit are drawn with this and nothing
   else, which is roughly the deal the hardware offered.

   Six virtual terminals on Alt+F1 to Alt+F6, and X on the seventh, which
   is exactly where Linux put them.  Each terminal keeps its own grid and
   its own key queue, so a program waiting for input on tty3 goes on
   waiting while you work on tty1.
   ========================================================================== */

/* the IBM VGA text palette, which is the palette */
const VGA = ["#000000","#0000a8","#00a800","#00a8a8","#a80000","#a800a8","#a85400","#a8a8a8",
             "#545454","#5454fc","#54fc54","#54fcfc","#fc5454","#fc54fc","#fcfc54","#fcfcfc"];
const AT = (fg, bg) => ((bg & 15) << 4) | (fg & 15);
const A_NORM = AT(7, 0), A_BOLD = AT(15, 0), A_DIM = AT(8, 0);

class Vt {
  constructor(name, cols, rows) {
    this.name = name;
    this.cols = cols || 80;
    this.rows = rows || 25;
    this.ch = new Array(this.cols * this.rows).fill(" ");
    this.at = new Uint8Array(this.cols * this.rows).fill(A_NORM);
    this.cx = 0; this.cy = 0;
    this.cattr = A_NORM;
    this.showCursor = true;
    this.keyq = [];
    this.waiter = null;
    this.stack = [];              /* what is running on this terminal */
    this.dirty = true;
    this.raw = false;             /* full-screen program: no scroll, no echo */
    this.echo = true;
  }
  /* ---- drawing ---- */
  idx(x, y) { return y * this.cols + x; }
  clear(a) {
    a = a === undefined ? this.cattr : a;
    this.ch.fill(" "); this.at.fill(a); this.cx = 0; this.cy = 0; this.touch();
  }
  fill(x, y, w, h, c, a) {
    for (let j = 0; j < h; j++) {
      const yy = y + j; if (yy < 0 || yy >= this.rows) continue;
      for (let i = 0; i < w; i++) {
        const xx = x + i; if (xx < 0 || xx >= this.cols) continue;
        const k = this.idx(xx, yy); this.ch[k] = c; this.at[k] = a;
      }
    }
    this.touch();
  }
  put(x, y, s, a) {
    if (y < 0 || y >= this.rows) return;
    a = a === undefined ? this.cattr : a;
    s = String(s);
    for (let i = 0; i < s.length; i++) {
      const xx = x + i; if (xx < 0) continue; if (xx >= this.cols) break;
      const k = this.idx(xx, y); this.ch[k] = s[i]; this.at[k] = a;
    }
    this.touch();
  }
  putc(x, y, c, a) { this.put(x, y, c, a); }
  /* a single-line box, in the characters the console font actually had */
  box(x, y, w, h, a, dbl) {
    const g = dbl ? ["╔","╗","╚","╝","═","║"]
                  : ["┌","┐","└","┘","─","│"];
    this.put(x, y, g[0] + g[4].repeat(Math.max(0, w - 2)) + g[1], a);
    for (let j = 1; j < h - 1; j++) {
      this.put(x, y + j, g[5], a);
      this.put(x + w - 1, y + j, g[5], a);
    }
    this.put(x, y + h - 1, g[2] + g[4].repeat(Math.max(0, w - 2)) + g[3], a);
  }
  /* the shadow that dialog(1) drew under every window */
  shadow(x, y, w, h) {
    for (let j = 1; j <= h; j++) {
      const yy = y + j, xx = x + w;
      if (yy < this.rows && xx < this.cols) { const k = this.idx(xx, yy); this.at[k] = AT(8, 0); }
      if (yy < this.rows && xx + 1 < this.cols) { const k = this.idx(xx + 1, yy); this.at[k] = AT(8, 0); }
    }
    for (let i = 1; i <= w + 1; i++) {
      const yy = y + h, xx = x + i;
      if (yy < this.rows && xx < this.cols) { const k = this.idx(xx, yy); this.at[k] = AT(8, 0); }
    }
    this.touch();
  }
  center(y, s, a) { this.put(Math.max(0, Math.floor((this.cols - s.length) / 2)), y, s, a); }
  /* ---- streaming ---- */
  scroll(n) {
    n = n || 1;
    const c = this.cols;
    this.ch.splice(0, c * n);
    for (let i = 0; i < c * n; i++) this.ch.push(" ");
    const na = new Uint8Array(this.at.length);
    na.set(this.at.subarray(c * n));
    na.fill(A_NORM, this.at.length - c * n);
    this.at = na;
    this.cy = Math.max(0, this.cy - n);
    this.touch();
  }
  nl() { this.cx = 0; this.cy++; if (this.cy >= this.rows) this.scroll(this.cy - this.rows + 1); }
  write(s, a) {
    if (a !== undefined) this.cattr = a;
    s = String(s === undefined || s === null ? "" : s);
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === "\n") { this.nl(); continue; }
      if (c === "\r") { this.cx = 0; continue; }
      if (c === "\t") { const n = 8 - (this.cx % 8); for (let j = 0; j < n; j++) this.write(" "); continue; }
      if (c === "\b") { if (this.cx > 0) this.cx--; continue; }
      if (c === "\x07") { Sound.bell(); continue; }
      if (this.cx >= this.cols) this.nl();
      const k = this.idx(this.cx, this.cy);
      this.ch[k] = c; this.at[k] = this.cattr;
      this.cx++;
    }
    this.touch();
  }
  writeln(s, a) { this.write((s === undefined ? "" : s) + "\n", a); }
  touch() { this.dirty = true; if (Con.active() === this) Screen.schedule(); }
  /* ---- input ---- */
  push(k) {
    if (this.waiter) { const w = this.waiter; this.waiter = null; w(k); }
    else this.keyq.push(k);
  }
  key() {
    if (this.keyq.length) return Promise.resolve(this.keyq.shift());
    return new Promise(res => { this.waiter = res; });
  }
  drain() { this.keyq.length = 0; }
}

/* ---- the key event, normalised once ---------------------------------- */
function mkKey(e) {
  const k = { name: e.key, ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, ch: null };
  if (e.key.length === 1) k.ch = e.key;
  if (k.ctrl && e.key.length === 1) {
    const c = e.key.toUpperCase().charCodeAt(0);
    if (c >= 64 && c <= 95) { k.ch = String.fromCharCode(c - 64); k.name = "^" + e.key.toUpperCase(); }
  }
  if (e.key === "Enter") k.ch = "\r";
  if (e.key === "Tab") k.ch = "\t";
  if (e.key === "Backspace") k.ch = "\x7f";
  if (e.key === "Escape") k.ch = "\x1b";
  return k;
}
const isEnter = k => k.name === "Enter";
const isEsc   = k => k.name === "Escape";

/* ==========================================================================
   MODULE 8b — THE SCREEN: SIZING, SCALING AND THE ONE RENDER LOOP
   ========================================================================== */
const Screen = (() => {
  /* the console is 80x25 in a cell of 16 by 32, which is a big logical
     screen that scales down cleanly.  X uses whatever XF86Config says. */
  let CW = 16, CH = 32;
  let logical = { w: 80 * CW, h: 25 * CH };
  let pending = false;
  let fontSize = 26;

  function measure() {
    const probe = el("span", { style: {
      position: "absolute", visibility: "hidden", whiteSpace: "pre",
      font: "100px \"DejaVu Sans Mono\",\"Liberation Mono\",\"Lucida Console\",Menlo,Consolas,\"Courier New\",monospace" } },
      "0".repeat(100));
    document.body.appendChild(probe);
    const adv = probe.getBoundingClientRect().width / 100;
    probe.remove();
    fontSize = adv > 0 ? (CW / (adv / 100)) : 26;
    const ch = $("#chars");
    ch.style.font = fontSize.toFixed(3) + "px/" + CH + "px \"DejaVu Sans Mono\",\"Liberation Mono\",\"Lucida Console\",Menlo,Consolas,\"Courier New\",monospace";
    ch.style.setProperty("--ch", CH + "px");
  }

  function setLogical(w, h) {
    logical = { w, h };
    const s = $("#screen");
    s.style.width = w + "px";
    s.style.height = h + "px";
    fit();
  }
  /* A CRT always fills its tube.  So the logical screen is stretched to
     the largest 4:3 rectangle that fits, on both axes independently --
     which is why 80x25 text looks slightly tall, exactly as it did. */
  function fit() {
    const vp = $("#viewport");
    const availW = vp.clientWidth - 16, availH = vp.clientHeight - 16;
    let bw = availW, bh = Math.round(availW * 3 / 4);
    if (bh > availH) { bh = availH; bw = Math.round(availH * 4 / 3); }
    const bz = $("#bezel");
    bz.style.width = bw + "px"; bz.style.height = bh + "px";
    const s = $("#screen");
    s.style.transform = "scale(" + (bw / logical.w) + "," + (bh / logical.h) + ")";
  }

  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; paint(); });
  }

  function paint() {
    const vt = Con.active();
    if (!vt || document.body.classList.contains("xon")) return;
    const root = $("#chars");
    const rows = [];
    for (let y = 0; y < vt.rows; y++) {
      let html = "", runAt = -1, run = "";
      for (let x = 0; x < vt.cols; x++) {
        const k = y * vt.cols + x;
        const a = vt.at[k];
        if (a !== runAt) {
          if (run.length) html += span(runAt, run);
          runAt = a; run = "";
        }
        run += vt.ch[k];
      }
      if (run.length) html += span(runAt, run);
      rows.push("<div class=\"r\">" + html + "</div>");
    }
    root.innerHTML = rows.join("");
    const cur = $("#curs");
    if (vt.showCursor) {
      document.body.classList.add("curson");
      cur.style.left = (vt.cx * CW) + "px";
      cur.style.top = (vt.cy * CH + Math.round(CH * 0.78)) + "px";
      cur.style.width = CW + "px";
      cur.style.height = Math.round(CH * 0.18) + "px";
      cur.classList.add("blink");
    } else document.body.classList.remove("curson");
  }
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function span(a, txt) {
    const fg = VGA[a & 15], bg = VGA[(a >> 4) & 15];
    return "<i style=\"color:" + fg + ";background:" + bg + "\">" + esc(txt) + "</i>";
  }

  function textMode() {
    document.body.classList.remove("xon");
    setLogical(80 * CW, 25 * CH);
    schedule();
  }
  function graphicsMode(w, h) {
    document.body.classList.add("xon");
    document.body.classList.remove("curson");
    setLogical(w, h);
  }
  function cell() { return { w: CW, h: CH }; }
  return { measure, setLogical, fit, schedule, paint, textMode, graphicsMode, cell,
           logical: () => logical };
})();

/* ==========================================================================
   MODULE 8c — THE CONSOLE: SIX TERMINALS, AND X ON THE SEVENTH
   ========================================================================== */
const Con = (() => {
  const vts = [];
  for (let i = 1; i <= 6; i++) vts.push(new Vt("tty" + i, 80, 25));
  const xvt = new Vt("tty7", 80, 25);          /* where X lives */
  let cur = 0;
  let switching = true;                        /* false during BIOS/install */

  function active() { return cur === 6 ? xvt : vts[cur]; }
  function vt(n) { return n === 7 ? xvt : vts[n - 1]; }
  function index() { return cur; }
  function allow(v) { switching = v; }
  function canSwitch() { return switching; }

  function show(n) {
    if (n < 1 || n > 7) return;
    if (n === 7 && !X.running()) return;
    cur = n - 1;
    if (n === 7) { X.reveal(); }
    else { Screen.textMode(); Screen.schedule(); }
    lamp();
  }
  function lamp() {
    const l = $("#vtlamp");
    if (!l) return;
    if (!switching) { l.innerHTML = "&nbsp;"; return; }
    const bits = [];
    for (let i = 1; i <= 6; i++) bits.push(cur === i - 1 ? "<b>F" + i + "</b>" : "F" + i);
    bits.push(X.running() ? (cur === 6 ? "<b>F7</b>" : "F7") : "·");
    l.innerHTML = "ALT+ " + bits.join(" ");
  }
  /* the whole machine's tty1, used by the BIOS, LILO and the installer */
  function console0() { return vts[0]; }
  function reset() {
    for (const v of vts) { v.clear(A_NORM); v.stack.length = 0; v.drain(); v.raw = false; }
    xvt.clear(A_NORM);
    cur = 0;
  }
  return { active, vt, index, show, allow, canSwitch, console0, reset, lamp,
           count: 6, all: () => vts.slice() };
})();

/* ==========================================================================
   MODULE 8d — Tty: WHAT A PROGRAM SEES
   --------------------------------------------------------------------------
   Every text program in this exhibit -- the installer, fdisk, xf86config,
   the shell, vi, pico, lynx, menuconfig -- is a plain async function that
   awaits input through one of these.  That is why they read like the
   programs they are imitating instead of like state machines.
   ========================================================================== */
class Tty {
  constructor(vt) { this.vt = vt; this.aborted = false; }
  get cols() { return this.vt.cols; }
  get rows() { return this.vt.rows; }
  out(s, a) { this.vt.write(s, a); return this; }
  outln(s, a) { this.vt.writeln(s, a); return this; }
  clear(a) { this.vt.clear(a); return this; }
  cursor(on) { this.vt.showCursor = on !== false; this.vt.touch(); return this; }
  at(x, y) { this.vt.cx = x; this.vt.cy = y; this.vt.touch(); return this; }
  attr(a) { this.vt.cattr = a; return this; }
  key() { return this.vt.key(); }
  /* a delay the visitor can hurry along with a keypress, because a
     twenty-minute installation is the exhibit and a twenty-minute
     animation is not */
  async pause(ms, skippable) {
    if (Museum.fast()) ms = Math.min(ms, Math.max(6, ms * 0.08));
    if (skippable === false) { await sleep(ms); return; }
    let done = false;
    const t = sleep(ms).then(() => { done = true; });
    await t;
    return done;
  }
  /* print a stream of text a character or a line at a time, the way a
     console at 38400 baud actually filled up */
  async type(s, per) {
    const lines = String(s).split("\n");
    for (let i = 0; i < lines.length; i++) {
      this.vt.write(lines[i] + (i < lines.length - 1 ? "\n" : ""));
      if (per) await this.pause(per);
    }
  }
  /* ---- line editing.  Not readline: bash 1.14 with the default inputrc,
     which is to say emacs bindings and no completion of file names that
     do not exist. ---- */
  async line(opts) {
    opts = opts || {};
    const hist = opts.history || null;
    let hi = hist ? hist.length : 0;
    let buf = opts.value || "";
    let pos = buf.length;
    const startX = this.vt.cx, startY = this.vt.cy;
    const echo = opts.echo !== false;
    const mask = opts.mask;
    const redraw = () => {
      const shown = mask ? mask.repeat(buf.length) : buf;
      this.vt.cx = startX; this.vt.cy = startY;
      const room = Math.min(opts.width || 9999, this.vt.cols - startX);
      let vis = shown, off = 0;
      if (shown.length >= room) { off = shown.length - room + 1; vis = shown.slice(off); }
      this.vt.write(vis + " ".repeat(Math.max(0, room - vis.length - 1)));
      this.vt.cx = startX + (pos - off); this.vt.cy = startY;
      this.vt.touch();
    };
    if (echo) redraw();
    for (;;) {
      const k = await this.key();
      if (this.aborted) return null;
      if (k.name === "Enter") { if (echo) { this.vt.cx = startX + Math.min(buf.length, this.vt.cols - startX - 1); } this.vt.write("\n"); return buf; }
      if (k.name === "Backspace") { if (pos > 0) { buf = buf.slice(0, pos - 1) + buf.slice(pos); pos--; if (echo) redraw(); } continue; }
      if (k.name === "Delete") { if (pos < buf.length) { buf = buf.slice(0, pos) + buf.slice(pos + 1); if (echo) redraw(); } continue; }
      if (k.name === "ArrowLeft") { if (pos > 0) { pos--; if (echo) redraw(); } continue; }
      if (k.name === "ArrowRight") { if (pos < buf.length) { pos++; if (echo) redraw(); } continue; }
      if (k.name === "Home" || k.name === "^A") { pos = 0; if (echo) redraw(); continue; }
      if (k.name === "End" || k.name === "^E") { pos = buf.length; if (echo) redraw(); continue; }
      if (k.name === "^U") { buf = ""; pos = 0; if (echo) redraw(); continue; }
      if (k.name === "^K") { buf = buf.slice(0, pos); if (echo) redraw(); continue; }
      if (k.name === "^W") { const m = /\s*\S*$/.exec(buf.slice(0, pos)); if (m) { buf = buf.slice(0, pos - m[0].length) + buf.slice(pos); pos -= m[0].length; if (echo) redraw(); } continue; }
      if (k.name === "^C") { this.vt.write("\n"); return null; }
      if (k.name === "^D" && !buf.length && opts.eof) { return undefined; }
      if (k.name === "ArrowUp" && hist) {
        if (hi > 0) { hi--; buf = hist[hi]; pos = buf.length; redraw(); } continue;
      }
      if (k.name === "ArrowDown" && hist) {
        if (hi < hist.length - 1) { hi++; buf = hist[hi]; pos = buf.length; redraw(); }
        else { hi = hist.length; buf = ""; pos = 0; redraw(); }
        continue;
      }
      if (k.name === "Tab" && opts.complete) {
        const r = opts.complete(buf, pos);
        if (r) { buf = r.buf; pos = r.pos; redraw(); }
        continue;
      }
      if (k.ch && k.ch.length === 1 && k.ch >= " " && !k.ctrl && !k.alt) {
        buf = buf.slice(0, pos) + k.ch + buf.slice(pos); pos++;
        if (echo) redraw();
      }
    }
  }
  /* a yes/no question in the shape the era asked them: the default in
     brackets, and no validation to speak of */
  async ask(prompt, def) {
    for (;;) {
      this.out(prompt);
      const a = (await this.line()) || "";
      const s = a.trim().toLowerCase();
      if (!s.length && def !== undefined) return def;
      if (s === "y" || s === "yes") return true;
      if (s === "n" || s === "no") return false;
      if (def !== undefined) return def;
    }
  }
  async anyKey(msg) {
    this.out(msg || "Press any key to continue... ");
    await this.key();
    this.out("\n");
  }
}

/* ==========================================================================
   MODULE 9 — dialog(1): THE WIDGET SET THE INSTALLER IS MADE OF
   --------------------------------------------------------------------------
   Slackware's setup, pkgtool, netconfig, timeconfig and liloconfig are all
   shell scripts that call dialog, an ncurses program that draws a box on a
   blue screen and returns an exit status.  That is the entire installer
   toolkit, and it is the reason the installation looks the way it looks.

   Reproduced here in the same shapes: msgbox, yesno, menu, checklist,
   inputbox, infobox, gauge and textbox, on the same blue backdrop, with
   the same shadow, and with Tab moving between the buttons.
   ========================================================================== */
const D_SCREEN  = AT(11, 1);      /* light cyan on blue: the backdrop      */
const D_BACK    = AT(15, 1);      /* the backtitle line                    */
const D_BOX     = AT(0, 7);       /* black on light grey: inside the box    */
const D_HI      = AT(15, 7);      /* the lit edge                           */
const D_LO      = AT(8, 7);       /* the shaded edge                        */
const D_TITLE   = AT(1, 7);       /* blue: the title                        */
const D_TAG     = AT(1, 7);       /* blue: menu tags and hot keys           */
const D_SEL     = AT(15, 1);      /* white on blue: the selection bar       */
const D_BTN     = AT(0, 7);
const D_BTNSEL  = AT(15, 1);
const D_HOT     = AT(4, 7);       /* red: the letter you press              */
const D_HOTSEL  = AT(14, 1);

class Dlg {
  constructor(tty, backtitle) { this.t = tty; this.vt = tty.vt; this.back = backtitle || ""; }

  backdrop() {
    const v = this.vt;
    v.fill(0, 0, v.cols, v.rows, " ", D_SCREEN);
    if (this.back) {
      v.fill(0, 0, v.cols, 1, " ", D_BACK);
      v.put(1, 0, this.back, D_BACK);
      v.fill(0, 1, v.cols, 1, "─", D_SCREEN);
    }
    v.showCursor = false;
    v.touch();
  }
  frame(x, y, w, h, title) {
    const v = this.vt;
    v.fill(x, y, w, h, " ", D_BOX);
    v.put(x, y, "┌" + "─".repeat(w - 2) + "┐", D_HI);
    for (let j = 1; j < h - 1; j++) { v.put(x, y + j, "│", D_HI); v.put(x + w - 1, y + j, "│", D_LO); }
    v.put(x, y + h - 1, "└" + "─".repeat(w - 2) + "┘", D_LO);
    if (title) {
      const s = " " + title + " ";
      v.put(x + Math.max(1, Math.floor((w - s.length) / 2)), y, s, D_TITLE);
    }
    v.shadow(x, y, w, h);
  }
  /* the dividing line dialog drew above the buttons */
  rule(x, y, w) {
    const v = this.vt;
    v.put(x, y, "├" + "─".repeat(w - 2) + "┤", D_HI);
    v.put(x + w - 1, y, "┤", D_LO);
  }
  buttons(x, y, w, labels, sel) {
    const v = this.vt;
    const rendered = labels.map(l => "<" + " ".repeat(2) + l + " ".repeat(2) + ">");
    const total = rendered.reduce((a, s) => a + s.length, 0) + (labels.length - 1) * 3;
    let cx = x + Math.floor((w - total) / 2);
    const spans = [];
    for (let i = 0; i < labels.length; i++) {
      const on = i === sel;
      v.put(cx, y, rendered[i], on ? D_BTNSEL : D_BTN);
      v.put(cx + 3, y, labels[i][0], on ? D_HOTSEL : D_HOT);
      spans.push([cx, rendered[i].length]);
      cx += rendered[i].length + 3;
    }
    return spans;
  }
  wrapText(text, w) { return wrap(text, w); }

  /* ---- a message with one OK button ---- */
  async msgbox(text, opts) {
    opts = opts || {};
    this.backdrop();
    const lines = this.wrapText(text, (opts.w || 60) - 6);
    const w = opts.w || 60, h = Math.min(this.vt.rows - 2, lines.length + 7);
    const x = Math.floor((this.vt.cols - w) / 2), y = Math.max(2, Math.floor((this.vt.rows - h) / 2));
    this.frame(x, y, w, h, opts.title);
    lines.forEach((l, i) => this.vt.put(x + 3, y + 2 + i, l, D_BOX));
    this.rule(x, y + h - 4, w);
    this.buttons(x, y + h - 2, w, [opts.ok || "OK"], 0);
    for (;;) {
      const k = await this.t.key();
      if (k.name === "Enter" || k.name === " " || k.name === "Escape") return true;
    }
  }
  /* ---- yes / no ---- */
  async yesno(text, opts) {
    opts = opts || {};
    this.backdrop();
    const w = opts.w || 62;
    const lines = this.wrapText(text, w - 6);
    const h = Math.min(this.vt.rows - 2, lines.length + 7);
    const x = Math.floor((this.vt.cols - w) / 2), y = Math.max(2, Math.floor((this.vt.rows - h) / 2));
    let sel = opts.def === false ? 1 : 0;
    const labels = [opts.yes || "Yes", opts.no || "No"];
    for (;;) {
      this.frame(x, y, w, h, opts.title);
      lines.forEach((l, i) => this.vt.put(x + 3, y + 2 + i, l, D_BOX));
      this.rule(x, y + h - 4, w);
      this.buttons(x, y + h - 2, w, labels, sel);
      const k = await this.t.key();
      if (k.name === "Tab" || k.name === "ArrowRight") sel = (sel + 1) % 2;
      else if (k.name === "ArrowLeft") sel = (sel + 1) % 2;
      else if (k.name === "Enter") return sel === 0;
      else if (k.ch && /^[yY]$/.test(k.ch)) return true;
      else if (k.ch && /^[nN]$/.test(k.ch)) return false;
      else if (k.name === "Escape") return false;
    }
  }
  /* ---- infobox: draws and returns at once ---- */
  infobox(text, opts) {
    opts = opts || {};
    const w = opts.w || 58;
    const lines = this.wrapText(text, w - 6);
    const h = Math.min(this.vt.rows - 2, lines.length + 4);
    const x = Math.floor((this.vt.cols - w) / 2), y = opts.y !== undefined ? opts.y : Math.max(2, Math.floor((this.vt.rows - h) / 2));
    this.frame(x, y, w, h, opts.title);
    lines.forEach((l, i) => this.vt.put(x + 3, y + 2 + i, l, D_BOX));
  }
  /* ---- gauge: the percentage bar every long operation had ---- */
  gauge(text, pct, opts) {
    opts = opts || {};
    const w = opts.w || 64, h = 8;
    const x = Math.floor((this.vt.cols - w) / 2), y = opts.y !== undefined ? opts.y : Math.floor((this.vt.rows - h) / 2);
    this.frame(x, y, w, h, opts.title);
    const lines = this.wrapText(text, w - 6);
    lines.slice(0, 2).forEach((l, i) => this.vt.put(x + 3, y + 1 + i, padr(l, w - 6), D_BOX));
    const bw = w - 8;
    const on = Math.round(bw * clamp(pct, 0, 100) / 100);
    const label = padl(Math.round(pct), 3) + "%";
    const bar = "█".repeat(on) + "░".repeat(bw - on);
    this.vt.put(x + 4, y + 4, bar, AT(1, 7));
    this.vt.put(x + 4 + Math.floor((bw - 4) / 2), y + 4, label,
      Math.floor((bw - 4) / 2) < on ? AT(15, 1) : AT(1, 7));
  }
  /* ---- inputbox ---- */
  async inputbox(text, init, opts) {
    opts = opts || {};
    this.backdrop();
    const w = opts.w || 62;
    const lines = this.wrapText(text, w - 6);
    const h = Math.min(this.vt.rows - 2, lines.length + 9);
    const x = Math.floor((this.vt.cols - w) / 2), y = Math.max(2, Math.floor((this.vt.rows - h) / 2));
    let val = init === undefined || init === null ? "" : String(init);
    for (;;) {
      this.frame(x, y, w, h, opts.title);
      lines.forEach((l, i) => this.vt.put(x + 3, y + 2 + i, l, D_BOX));
      const fy = y + h - 6;
      this.vt.put(x + 3, fy, " ".repeat(w - 6), AT(15, 1));
      this.rule(x, y + h - 4, w);
      this.buttons(x, y + h - 2, w, [opts.ok || "OK", opts.cancel || "Cancel"], 0);
      this.vt.showCursor = true;
      this.vt.cx = x + 3; this.vt.cy = fy;
      this.vt.cattr = AT(15, 1);
      const got = await this.t.line({ value: val, mask: opts.mask, width: w - 6 });
      this.vt.showCursor = false;
      this.vt.cattr = D_BOX;
      if (got === null) return null;
      return got;
    }
  }
  /* ---- menu: the workhorse ---- */
  async menu(text, items, opts) {
    opts = opts || {};
    this.backdrop();
    const w = opts.w || 68;
    const lines = this.wrapText(text, w - 6);
    const listH = Math.min(opts.listH || items.length, this.vt.rows - lines.length - 11);
    const h = lines.length + listH + 9;
    const x = Math.floor((this.vt.cols - w) / 2), y = Math.max(2, Math.floor((this.vt.rows - h) / 2));
    let sel = opts.def !== undefined ? Math.max(0, items.findIndex(i => i.tag === opts.def)) : 0;
    if (sel < 0) sel = 0;
    let top = 0;
    const labels = opts.buttons || ["OK", "Cancel"];
    let btn = 0;
    const tagW = Math.max.apply(null, items.map(i => i.tag.length));
    for (;;) {
      if (sel < top) top = sel;
      if (sel >= top + listH) top = sel - listH + 1;
      this.frame(x, y, w, h, opts.title);
      lines.forEach((l, i) => this.vt.put(x + 3, y + 2 + i, l, D_BOX));
      const ly = y + 2 + lines.length + 1;
      for (let i = 0; i < listH; i++) {
        const it = items[top + i]; if (!it) break;
        const on = (top + i) === sel;
        const row = " " + padr(it.tag, tagW) + "  " + padr(it.desc || "", w - 10 - tagW);
        this.vt.put(x + 2, ly + i, row, on ? D_SEL : D_BOX);
        if (!on) this.vt.put(x + 3, ly + i, it.tag, D_TAG);
      }
      if (items.length > listH) {
        this.vt.put(x + w - 2, ly, top > 0 ? "▲" : "│", D_LO);
        this.vt.put(x + w - 2, ly + listH - 1, top + listH < items.length ? "▼" : "│", D_LO);
      }
      this.rule(x, y + h - 4, w);
      this.buttons(x, y + h - 2, w, labels, btn);
      const k = await this.t.key();
      if (k.name === "ArrowUp") { sel = sel > 0 ? sel - 1 : items.length - 1; }
      else if (k.name === "ArrowDown") { sel = (sel + 1) % items.length; }
      else if (k.name === "PageUp") { sel = Math.max(0, sel - listH); }
      else if (k.name === "PageDown") { sel = Math.min(items.length - 1, sel + listH); }
      else if (k.name === "Home") sel = 0;
      else if (k.name === "End") sel = items.length - 1;
      else if (k.name === "Tab" || k.name === "ArrowRight") btn = (btn + 1) % labels.length;
      else if (k.name === "ArrowLeft") btn = (btn + labels.length - 1) % labels.length;
      else if (k.name === "Enter") {
        if (btn === 0) return items[sel];
        return { cancel: labels[btn] };
      } else if (k.name === "Escape") return { cancel: "Cancel" };
      else if (k.ch && k.ch.length === 1 && /\S/.test(k.ch)) {
        const c = k.ch.toUpperCase();
        const j = items.findIndex((it, n) => n > sel && it.tag.toUpperCase().startsWith(c));
        const j2 = j >= 0 ? j : items.findIndex(it => it.tag.toUpperCase().startsWith(c));
        if (j2 >= 0) sel = j2;
      }
    }
  }
  /* ---- checklist: SELECT, and the whole argument of the exhibit ---- */
  async checklist(text, items, opts) {
    opts = opts || {};
    this.backdrop();
    const w = opts.w || 70;
    const lines = this.wrapText(text, w - 6);
    const listH = Math.min(opts.listH || items.length, this.vt.rows - lines.length - 11);
    const h = lines.length + listH + 9;
    const x = Math.floor((this.vt.cols - w) / 2), y = Math.max(2, Math.floor((this.vt.rows - h) / 2));
    const on = items.map(i => !!i.on);
    let sel = 0, top = 0, btn = 0;
    const labels = opts.buttons || ["OK", "Cancel"];
    const tagW = Math.max.apply(null, items.map(i => i.tag.length));
    for (;;) {
      if (sel < top) top = sel;
      if (sel >= top + listH) top = sel - listH + 1;
      this.frame(x, y, w, h, opts.title);
      lines.forEach((l, i) => this.vt.put(x + 3, y + 2 + i, l, D_BOX));
      const ly = y + 2 + lines.length + 1;
      for (let i = 0; i < listH; i++) {
        const it = items[top + i]; if (!it) break;
        const cur = (top + i) === sel;
        const mark = "[" + (on[top + i] ? "X" : " ") + "]";
        const row = " " + mark + " " + padr(it.tag, tagW) + " " + padr(it.desc || "", w - 12 - tagW);
        this.vt.put(x + 2, ly + i, row, cur ? D_SEL : D_BOX);
        if (!cur) this.vt.put(x + 3 + 4, ly + i, it.tag, D_TAG);
      }
      if (items.length > listH) {
        this.vt.put(x + w - 2, ly, top > 0 ? "▲" : "│", D_LO);
        this.vt.put(x + w - 2, ly + listH - 1, top + listH < items.length ? "▼" : "│", D_LO);
      }
      this.rule(x, y + h - 4, w);
      this.buttons(x, y + h - 2, w, labels, btn);
      const k = await this.t.key();
      if (k.name === "ArrowUp") sel = sel > 0 ? sel - 1 : items.length - 1;
      else if (k.name === "ArrowDown") sel = (sel + 1) % items.length;
      else if (k.name === " ") on[sel] = !on[sel];
      else if (k.name === "PageUp") sel = Math.max(0, sel - listH);
      else if (k.name === "PageDown") sel = Math.min(items.length - 1, sel + listH);
      else if (k.name === "Tab" || k.name === "ArrowRight") btn = (btn + 1) % labels.length;
      else if (k.name === "ArrowLeft") btn = (btn + labels.length - 1) % labels.length;
      else if (k.name === "Enter") {
        if (btn === 0) return items.filter((it, i) => on[i]).map(it => it.tag);
        return null;
      } else if (k.name === "Escape") return null;
    }
  }
  /* ---- textbox: a file viewer, which is how the installer showed you
     a README you were about to ignore ---- */
  async textbox(content, opts) {
    opts = opts || {};
    this.backdrop();
    const w = opts.w || Math.min(this.vt.cols - 4, 76);
    const h = opts.h || (this.vt.rows - 4);
    const x = Math.floor((this.vt.cols - w) / 2), y = Math.floor((this.vt.rows - h) / 2);
    const rows = String(content).split("\n");
    const view = h - 5;
    let top = 0, off = 0;
    for (;;) {
      this.frame(x, y, w, h, opts.title);
      for (let i = 0; i < view; i++) {
        const line = rows[top + i] === undefined ? "" : rows[top + i].slice(off);
        this.vt.put(x + 2, y + 1 + i, padr(line, w - 4), D_BOX);
      }
      const pct = rows.length <= view ? 100 : Math.round(100 * (top + view) / rows.length);
      this.vt.put(x + w - 10, y + h - 4, padl(Math.min(100, pct) + "%", 5), D_LO);
      this.rule(x, y + h - 4, w);
      this.buttons(x, y + h - 2, w, [opts.ok || "EXIT"], 0);
      const k = await this.t.key();
      if (k.name === "ArrowDown") top = Math.min(Math.max(0, rows.length - view), top + 1);
      else if (k.name === "ArrowUp") top = Math.max(0, top - 1);
      else if (k.name === "PageDown" || k.name === " ") top = Math.min(Math.max(0, rows.length - view), top + view);
      else if (k.name === "PageUp" || k.name === "b") top = Math.max(0, top - view);
      else if (k.name === "ArrowRight") off += 8;
      else if (k.name === "ArrowLeft") off = Math.max(0, off - 8);
      else if (k.name === "Home") { top = 0; off = 0; }
      else if (k.name === "End") top = Math.max(0, rows.length - view);
      else if (k.name === "Enter" || k.name === "Escape" || k.name === "q") return;
    }
  }
}

/* ==========================================================================
   MODULE 10 — THE SHELL AND THE COMMAND REGISTRY
   --------------------------------------------------------------------------
   The rule this module exists to enforce: the shell finds a command by
   looking for an executable file along PATH in the virtual filesystem, and
   then dispatches on the implementation name recorded in that file's
   inode.  Implementations are registered here by name; they are reachable
   only through a file that a package installed.

   So there is no global command table for the shell to fall back on.  If
   the package that owns /sbin/ifconfig was never installed, or has been
   removed, the shell finds nothing along PATH and says so, in bash's own
   words, and no code anywhere is aware that ifconfig is special.
   ========================================================================== */
const IMPL = {};
/* One implementation can answer to several names, the way one binary
   answers to several links: gzip is also gunzip and zcat, and e2fsck is
   also fsck.ext2. */
function cmd(names, fn) { for (const n of String(names).split(/\s+/)) if (n.length) IMPL[n] = fn; }

/* the dynamic linker.  A program is a file plus a list of libraries it
   wants; this is the moment those two facts are compared, and it is the
   first moment, which is the whole wart. */
function linkCheck(node) {
  if (!node || !node.needs) return null;
  const dirs = ["/lib", "/usr/lib", "/usr/local/lib", "/usr/X11R6/lib", "/usr/openwin/lib"];
  for (const lib of node.needs) {
    let found = false;
    for (const d of dirs) if (Fs.exists(d + "/" + lib)) { found = true; break; }
    if (!found) return lib;
  }

cmd("awk", async c => {

  const body = prog.replace(/^\s*\{|\}\s*$/g, "");

    const vals = parts.map(p => {
      if (p === "$0") return line;
      const m = /^\$(\d+)$/.exec(p);
      if (m) return fields[Number(m[1]) - 1] === undefined ? "" : fields[Number(m[1]) - 1];
      if (p === "NF") return String(fields.length);

cmd("find", async c => {
  const args = c.args.slice();
  const starts = [];
  while (args.length && args[0][0] !== "-" && args[0][0] !== "!") starts.push(args.shift());
  if (!starts.length) starts.push(".");
  let nameP = null, typeP = null, doPrint = true, execCmd = null, maxdepth = null, iname = null;
  for (let i = 0; i < args.length; i++) {
    if (args[i] === "-name") nameP = args[++i];
    else if (args[i] === "-iname") iname = args[++i];
    else if (args[i] === "-type") typeP = args[++i];
    else if (args[i] === "-maxdepth") maxdepth = Number(args[++i]);
    else if (args[i] === "-print") doPrint = true;
    else if (args[i] === "-exec") { execCmd = args.slice(i + 1); break; }
  }
  const toRe = g => new RegExp("^" + g.replace(/[.+^${}()|\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".") + "$");
  const re = nameP ? toRe(nameP) : iname ? new RegExp(toRe(iname).source, "i") : null;
  const results = [];
  for (const s of starts) {
    const base = c.resolve(s);
    if (!Fs.exists(base)) { c.errln("find: " + s + ": No such file or directory"); c.status = 1; continue; }
    for (const p of Fs.walk(base)) {
      if (maxdepth !== null) {
        const d = p === base ? 0 : p.slice(base.length).split("/").length - 1;
        if (d > maxdepth) continue;
      }
      const n = Fs.lstat(p);
      if (!n) continue;
      if (typeP === "f" && n.t !== "f") continue;
      if (typeP === "d" && n.t !== "d") continue;
      if (typeP === "l" && n.t !== "l") continue;
      if (re && !re.test(Fs.baseOf(p))) continue;
      const shown = s === "." ? (p === base ? "." : "." + p.slice(base.length)) : p;
      results.push({ p, shown });
    }
  }
  if (execCmd) {
    for (const r of results) {
      const line = execCmd.filter(a => a !== ";" && a !== "\\;").map(a => a === "{}" ? r.p : a).join(" ");
      await c.sh.run(line);
    }
    return c.status;
  }
  results.forEach(r => c.outln(r.shown));
  return c.status;
});

async function pager(tty, text, opts) {

    vt.clear(A_NORM);

      const line = rows[top + i];
      if (line === undefined) { vt.put(0, i, "~", AT(8, 0)); continue; }
      vt.put(0, i, line.slice(off, off + vt.cols), A_NORM);
    }
    let status;
    if (msg) { status = msg; msg = null; }
    else if (top + view >= rows.length) status = name.length ? name + " (END)" : "(END)";
    else status = (name.length ? name + " " : "") + "lines " + (top + 1) + "-" + Math.min(rows.length, top + view) +
      "/" + rows.length + " " + Math.round(100 * (top + view) / rows.length) + "%";
    vt.put(0, vt.rows - 1, padr(status, vt.cols), AT(0, 7));
  };

    if (!search) return;
    let re; try { re = new RegExp(search, "i"); } catch (e) { return; }
    for (let i = top + dir; i >= 0 && i < rows.length; i += dir)
      if (re.test(rows[i])) { top = i; return; }

    draw();

    if (k.name === "q" || k.name === "Q" || (k.ctrl && k.name === "^C")) break;
    else if (k.name === " " || k.name === "PageDown" || k.name === "^F" || k.name === "f")
      top = Math.min(Math.max(0, rows.length - 1), top + view);
    else if (k.name === "b" || k.name === "PageUp" || k.name === "^B") top = Math.max(0, top - view);
    else if (k.name === "ArrowDown" || k.name === "j" || k.name === "Enter" || k.name === "e") top = Math.min(Math.max(0, rows.length - 1), top + 1);
    else if (k.name === "ArrowUp" || k.name === "k" || k.name === "y") top = Math.max(0, top - 1);
    else if (k.name === "d") top = Math.min(Math.max(0, rows.length - 1), top + Math.floor(view / 2));

    else if (k.name === "G" || k.name === "End" || k.name === ">") top = Math.max(0, rows.length - view);

      const s = await tty.line();
      vt.showCursor = false;
      if (s) { search = s; find(k.name === "/" ? 1 : -1); }

    else if (k.name === "N") find(-1);

  }

}

    c.outln("");

});
cmd("removepkg", async c => {

        { title: "SELECT PACKAGES TO INSTALL", listH: 12, w: 72 });
      if (!chosen || !chosen.length) continue;

      for (const f of chosen) {

  }

/* ==========================================================================
   MODULE 10j — THE DISK TOOLS
   --------------------------------------------------------------------------
   fdisk with single-letter commands and no undo, which is the tool, and
   cfdisk, which is the friendlier alternative it really was.
   ========================================================================== */
function fdiskTable(c, dev) {
  const P = Disk.parts().slice().sort((a, b) => a.start - b.start);
  c.outln("");
  c.outln("Disk " + dev + ": " + Disk.HEADS + " heads, " + Disk.SECT + " sectors, " + Disk.CYLS + " cylinders");
  c.outln("Units = cylinders of " + (Disk.HEADS * Disk.SECT) + " * 512 bytes");
  c.outln("");
  c.outln("   Device Boot   Begin    Start      End   Blocks   Id  System");
  for (const p of P) {
    c.outln(padr("/dev/" + p.dev, 11) + (p.boot ? "  *   " : "      ") +
      padl(p.begin || p.start, 5) + padl(p.start, 9) + padl(p.end, 9) +
      padl(Disk.blocksOf(p) + (p.id === "82" ? "+" : ""), 9) + "  " + p.id + "  " + Disk.typeName(p.id));
  }
  c.outln("");
}
cmd("fdisk", async c => {
  const f = c.flags("s:");
  const dev = f._[0] || "/dev/sda";
  if (f.l) { fdiskTable(c, dev); return 0; }
  if (!Hw.seesDisk(State.get("bootImage", "aha1542.s")) && !State.get("installed", []).length) {
    c.errln("Unable to open " + dev);
    return 1;
  }
  if (dev !== "/dev/sda") { c.errln("Unable to open " + dev); return 1; }
  /* fdisk works on a copy of the table.  Nothing reaches the disk until w. */
  let work = JSON.parse(JSON.stringify(Disk.parts()));
  let changed = false;
  const MENU =
    "Command action\n" +
    "   a   toggle a bootable flag\n" +
    "   b   edit bsd disklabel\n" +
    "   c   toggle the dos compatibility flag\n" +
    "   d   delete a partition\n" +
    "   l   list known partition types\n" +
    "   m   print this menu\n" +
    "   n   add a new partition\n" +
    "   p   print the partition table\n" +
    "   q   quit without saving changes\n" +
    "   t   change a partition's system id\n" +
    "   u   change display/entry units\n" +
    "   v   verify the partition table\n" +
    "   w   write table to disk and exit\n" +
    "   x   extra functionality (experts only)\n";
  const show = () => {
    const P = work.slice().sort((a, b) => a.start - b.start);
    c.outln("");
    c.outln("Disk " + dev + ": " + Disk.HEADS + " heads, " + Disk.SECT + " sectors, " + Disk.CYLS + " cylinders");
    c.outln("Units = cylinders of " + (Disk.HEADS * Disk.SECT) + " * 512 bytes");
    c.outln("");
    c.outln("   Device Boot   Begin    Start      End   Blocks   Id  System");
    for (const p of P) {
      c.outln(padr("/dev/" + p.dev, 11) + (p.boot ? "  *   " : "      ") +
        padl(p.begin || p.start, 5) + padl(p.start, 9) + padl(p.end, 9) +
        padl(Disk.blocksOf(p) + (p.id === "82" ? "+" : ""), 9) + "  " + p.id + "  " + Disk.typeName(p.id));
    }
    c.outln("");
  };
  const freeOf = () => {
    const u = work.slice().sort((a, b) => a.start - b.start).map(p => [p.start, p.end]);
    const out = []; let cc = 1;
    for (const [s, e] of u) { if (s > cc) out.push([cc, s - 1]); cc = Math.max(cc, e + 1); }
    if (cc <= Disk.CYLS) out.push([cc, Disk.CYLS]);
    return out;
  };
  for (;;) {
    c.out("Command (m for help): ");
    const line = await c.tty.line();
    if (line === null) { c.outln(""); continue; }
    const k = line.trim().toLowerCase();
    if (!k.length) continue;
    if (k === "m") { c.out("\n" + MENU); continue; }
    if (k === "p") { show(); continue; }
    if (k === "q") { c.outln(""); return 0; }
    if (k === "l") {
      const ids = Object.keys(Disk.TYPES);
      for (let i = 0; i < ids.length; i += 3) {
        c.outln(ids.slice(i, i + 3).map(id => padr(id + "  " + Disk.typeName(id), 26)).join(""));
      }
      c.outln("");
      continue;
    }
    if (k === "u" || k === "c" || k === "b" || k === "x") { c.outln("Changing display/entry units to sectors (command not implemented in this exhibit)"); continue; }
    if (k === "v") {
      let acc = 0;
      for (const p of work) acc += Disk.blocksOf(p);
      const total = Disk.CYLS * Disk.CYLBLOCKS;
      c.outln(padl(total - acc, 0) + " unallocated blocks");
      continue;
    }
    if (k === "d") {
      if (!work.length) { c.outln("No partition is defined yet!"); continue; }
      c.out("Partition number (1-4): ");
      const n = Number((await c.tty.line()) || "0");
      const i = work.findIndex(p => p.dev === "sda" + n);
      if (i < 0) { c.outln("Warning: partition " + n + " has empty type"); continue; }
      work.splice(i, 1); changed = true;
      continue;
    }
    if (k === "a") {
      c.out("Partition number (1-4): ");
      const n = Number((await c.tty.line()) || "0");
      const p = work.find(q => q.dev === "sda" + n);
      if (!p) { c.outln("Partition " + n + " does not exist yet!"); continue; }
      p.boot = p.boot ? 0 : 1; changed = true;
      continue;
    }
    if (k === "t") {
      c.out("Partition number (1-4): ");
      const n = Number((await c.tty.line()) || "0");
      const p = work.find(q => q.dev === "sda" + n);
      if (!p) { c.outln("Partition " + n + " does not exist yet!"); continue; }
      c.out("Hex code (type L to list codes): ");
      let code = ((await c.tty.line()) || "").trim().toLowerCase();
      if (code === "l") {
        const ids = Object.keys(Disk.TYPES);
        for (let i = 0; i < ids.length; i += 3) c.outln(ids.slice(i, i + 3).map(id => padr(id + "  " + Disk.typeName(id), 26)).join(""));
        c.out("Hex code (type L to list codes): ");
        code = ((await c.tty.line()) || "").trim().toLowerCase();
      }
      if (!/^[0-9a-f]{1,2}$/.test(code)) { c.outln(""); continue; }
      if (code.length === 1) code = "0" + code;
      p.id = code; changed = true;
      c.outln("Changed system type of partition " + n + " to " + code + " (" + Disk.typeName(code) + ")");
      continue;
    }
    if (k === "n") {
      if (work.length >= 4) { c.outln("The maximum number of partitions has been created"); continue; }
      const free = freeOf();
      if (!free.length) { c.outln("No free sectors available"); continue; }
      c.outln("Command action");
      c.outln("   e   extended");
      c.outln("   p   primary partition (1-4)");
      c.out("");
      const t = ((await c.tty.line()) || "p").trim().toLowerCase();
      if (t === "e") { c.outln("(extended partitions are beyond this exhibit; use primary)"); continue; }
      const dv = ["sda1", "sda2", "sda3", "sda4"].find(d => !work.some(p => p.dev === d));
      c.out("Partition number (1-4): ");
      let num = ((await c.tty.line()) || "").trim();
      if (!/^[1-4]$/.test(num)) num = dv.slice(3);
      if (work.some(p => p.dev === "sda" + num)) { c.outln("Partition " + num + " is already defined.  Delete it before re-adding it."); continue; }
      const range = free[free.length - 1];
      c.out("First cylinder (" + range[0] + "-" + range[1] + "): ");
      let firstS = ((await c.tty.line()) || "").trim();
      let first = firstS.length ? Number(firstS) : range[0];
      const band = free.find(r => first >= r[0] && first <= r[1]);
      if (!band) { c.outln("Value out of range."); continue; }
      c.out("Last cylinder or +size or +sizeM or +sizeK (" + first + "-" + band[1] + "): ");
      const lastS = ((await c.tty.line()) || "").trim();
      let last;
      if (!lastS.length) last = band[1];
      else if (/^\+(\d+)M$/i.test(lastS)) last = first + Math.ceil(Number(/^\+(\d+)M/i.exec(lastS)[1]) * 1024 / Disk.CYLBLOCKS) - 1;
      else if (/^\+(\d+)K$/i.test(lastS)) last = first + Math.ceil(Number(/^\+(\d+)K/i.exec(lastS)[1]) / Disk.CYLBLOCKS) - 1;
      else if (/^\+(\d+)$/.test(lastS)) last = first + Number(lastS.slice(1)) - 1;
      else last = Number(lastS);
      if (!(last >= first) || last > band[1]) { c.outln("Value out of range."); continue; }
      work.push({ dev: "sda" + num, boot: 0, begin: first, start: first, end: last, id: "83" });
      changed = true;
      continue;
    }
    if (k === "w") {
      Sound.chatter(500);
      /* the moment the previous table stops existing */
      const before = Disk.parts();
      Disk.setParts(work);
      /* a partition that has been redefined has no filesystem on it */
      const fmts = State.get("formatted", {});
      for (const p of work) {
        const old = before.find(q => q.dev === p.dev);
        if (!old || old.start !== p.start || old.end !== p.end || old.id !== p.id) delete fmts[p.dev];
      }
      for (const q of before) if (!work.some(p => p.dev === q.dev)) {
        delete fmts[q.dev];
        if (q.id === "06") { State.set("dosGone", true); Museum.note("dos-deleted"); }
      }
      State.set("formatted", fmts);
      c.outln("The partition table has been altered!");
      c.outln("");
      c.outln("Calling ioctl() to re-read partition table.");
      await c.tty.pause(700);
      if (State.get("installed", []).length) {
        c.outln("Re-reading the partition table failed with error 16: Device or resource busy.");
        c.outln("Reboot your system to ensure the partition table is updated.");
      }
      c.outln("Syncing disks.");
      Museum.note("fdisk-write");
      return 0;
    }
    c.outln(k + ": unknown command");
    c.outln("Command action");
  }
});
cmd("sfdisk", async c => { fdiskTable(c, "/dev/sda"); return 0; });
cmd("cfdisk", async c => {
  /* the friendlier alternative, which nobody had to be ashamed of using */
  const vt = c.vt;
  let work = JSON.parse(JSON.stringify(Disk.parts()));
  let sel = 0;
  const rowsOf = () => {
    const out = [];
    const sorted = work.slice().sort((a, b) => a.start - b.start);
    let cyl = 1;
    for (const p of sorted) {
      if (p.start > cyl) out.push({ free: 1, start: cyl, end: p.start - 1 });
      out.push({ p });
      cyl = p.end + 1;
    }
    if (cyl <= Disk.CYLS) out.push({ free: 1, start: cyl, end: Disk.CYLS });
    return out;
  };
  vt.showCursor = false;
  for (;;) {
    const rows = rowsOf();
    if (sel >= rows.length) sel = rows.length - 1;
    vt.clear(A_NORM);
    vt.center(1, "cfdisk 2.7", A_BOLD);
    vt.center(3, "Disk Drive: /dev/sda", A_NORM);
    vt.center(4, "Size: 1740308480 bytes", A_NORM);
    vt.center(5, "Heads: " + Disk.HEADS + "   Sectors per Track: " + Disk.SECT + "   Cylinders: " + Disk.CYLS, A_NORM);
    vt.put(4, 7, "    Name        Flags     Part Type  FS Type          [Label]        Size (MB)", A_NORM);
    vt.put(4, 8, " ------------------------------------------------------------------------------", A_NORM);
    rows.forEach((r, i) => {
      const at = i === sel ? AT(0, 7) : A_NORM;
      if (r.free) {
        const mb = Math.round((r.end - r.start + 1) * Disk.CYLBLOCKS / 1024);
        vt.put(4, 9 + i, padr("        " + padr("", 12) + padr("", 10) + padr("Pri/Log", 11) + padr("Free Space", 17) + padl(mb + "*", 12), 74), at);
      } else {
        const p = r.p;
        const mb = Disk.mbOf(p);
        const fs = p.id === "82" ? "Linux swap" : p.id === "83" ? "Linux ext2" : p.id === "06" ? "DOS 16-bit >=32M" : Disk.typeName(p.id);
        vt.put(4, 9 + i, padr("  " + padr("sda" + p.dev.slice(3), 12) + padr(p.boot ? "Boot" : "", 10) + padr("Primary", 11) + padr(fs, 17) + padl(String(mb), 12), 74), at);
      }
    });
    const r = rows[sel];
    const opts = r.free ? ["Help", "New", "Print", "Quit", "Units", "Write"]
                        : ["Bootable", "Delete", "Help", "Maximize", "Print", "Quit", "Type", "Units", "Write"];
    let x = 4;
    for (const o of opts) { vt.put(x, vt.rows - 3, "[ " + o + " ]", A_NORM); x += o.length + 7; }
    vt.put(4, vt.rows - 5, "  Use the arrow keys to move, and the first letter of a command.", A_DIM);
    vt.put(4, vt.rows - 1, padr("cfdisk: no changes written to disk yet.", 78), A_DIM);
    vt.touch();
    const k = await c.tty.key();
    if (k.name === "ArrowUp") sel = Math.max(0, sel - 1);
    else if (k.name === "ArrowDown") sel = Math.min(rows.length - 1, sel + 1);
    else if (k.name === "q" || k.name === "Q") break;
    else if ((k.name === "n" || k.name === "N") && r.free) {
      if (work.length >= 4) continue;
      vt.put(4, vt.rows - 1, padr("Primary or logical? [pl]: ", 78), A_NORM);
      vt.cx = 30; vt.cy = vt.rows - 1; vt.showCursor = true; vt.touch();
      await c.tty.key();
      vt.put(4, vt.rows - 1, padr("Size (in MB): ", 78), A_NORM);

async function mountOne(c, dev, dir, type) {
  dir = Fs.resolve(c.sh.cwd, dir);
  if (!Fs.isDir(dir)) return "mount: mount point " + dir + " does not exist";
  if (Disk.isMounted(dir)) return "mount: " + dev + " already mounted or " + dir + " busy";
  const base = Fs.baseOf(dev);
  if (base === "scd0" || base === "cdrom") {
    if (!State.get("cdIn", true)) return "mount: /dev/scd0 is not a valid block device";
    if (type && type !== "iso9660") return "mount: wrong fs type, bad option, bad superblock on " + dev;
    Sound.seek(6);
    await c.tty.pause(900);
    Disk.mount("/dev/scd0", dir, "iso9660");
    return null;
  }
  if (base === "fd0") {
    if (!State.get("floppyIn", false)) return "mount: /dev/fd0 is not a valid block device";
    Sound.floppyOn(1400); Sound.seek(10);
    await c.tty.pause(1400);
    Disk.mount("/dev/fd0", dir, "ext2");
    return null;
  }
  const p = Disk.byDev(base);
  if (!p) return "mount: the kernel does not recognize " + dev + " as a block device";
  if (p.id === "06" || p.id === "04" || p.id === "0b") {
    if (type && type !== "msdos" && type !== "vfat" && type !== "umsdos")
      return "mount: wrong fs type, bad option, bad superblock on " + dev + ",\n       or too many mounted file systems";
    /* msdos support is a module unless it was compiled in */
    const K = Kernel.running();
    const modular = !(K.opts && K.opts.msdos);
    if (modular && State.get("modules", []).indexOf("msdos") < 0 && !Fs.exists("/lib/modules/2.0.30/fs/msdos.o"))
      return "mount: fs type msdos not supported by kernel";
    Sound.chatter(300);
    await c.tty.pause(400);
    Disk.mount("/dev/" + p.dev, dir, "msdos");
    Museum.note("mounted-dos");
    return null;
  }
  if (State.get("formatted", {})[p.dev] !== "ext2")
    return "mount: wrong fs type, bad option, bad superblock on " + dev + ",\n       or too many mounted file systems";
  Disk.mount("/dev/" + p.dev, dir, "ext2");
  return null;
}

/* ==========================================================================
   MODULE 10l — LILO
   --------------------------------------------------------------------------
   lilo is a program you run, which reads lilo.conf now and writes block
   addresses into the boot sector now.  The whole easter egg of this
   exhibit lives in that sentence: copy a kernel, forget to run lilo, and
   the next boot loads the blocks the old kernel used to be in.
   ========================================================================== */
function parseLiloConf(txt) {
  const conf = { global: {}, images: [] };
  if (txt === null || txt === undefined) return null;
  let cur = null;
  for (let line of txt.split("\n")) {
    line = line.replace(/#.*$/, "").trim();
    if (!line.length) continue;
    const m = /^([\w.-]+)\s*(?:=\s*(.*))?$/.exec(line);
    if (!m) continue;
    const k = m[1], v = m[2] === undefined ? true : m[2].trim();
    if (k === "image" || k === "other") { cur = { image: v, kind: k }; conf.images.push(cur); continue; }
    if (cur) cur[k] = v; else conf.global[k] = v;
  }
  return conf;
}
cmd("lilo", async c => {
  const f = c.flags("C:");
  const path = f.C || "/etc/lilo.conf";
  const txt = readFileText(path);
  if (txt === null) {
    c.errln("Fatal: open /etc/lilo.conf: No such file or directory");
    return 1;
  }
  const conf = parseLiloConf(txt);
  if (!conf.images.length) { c.errln("Fatal: no images defined in " + path); return 1; }
  if (f.q) {
    for (const im of conf.images) c.outln(padr(im.label || Fs.baseOf(im.image), 12) + " *");
    return 0;
  }
  /* the check lilo really does: does the file named actually exist */
  const maps = [];
  for (const im of conf.images) {
    if (im.kind === "other") { maps.push({ label: im.label || "dos", other: im.image }); continue; }
    const p = Fs.norm(im.image);
    if (!Fs.exists(p)) {
      c.errln("Fatal: open " + im.image + ": No such file or directory");
      return 1;
    }
    const n = Fs.stat(p);
    maps.push({ label: im.label || Fs.baseOf(p), image: p, root: im.root || ("/dev/" + Disk.rootDev()),
                ro: im["read-only"] !== undefined, append: im.append || null,
                kid: n.kid || (Kimg.get(p) ? Kimg.get(p).kid : null) });
  }
  if (f.t) { for (const m of maps) c.outln("Added " + m.label + (m.label === (conf.global.default || maps[0].label) ? " *" : "")); c.outln("\nThe boot sector and the map file have *NOT* been altered."); return 0; }
  Sound.chatter(400);
  await c.tty.pause(500);
  const def = conf.global.default || maps[0].label;
  for (const m of maps) c.outln("Added " + m.label + (m.label === def ? " *" : ""));
  State.set("lilo", { boot: conf.global.boot || "/dev/sda", prompt: conf.global.prompt !== undefined,
    timeout: conf.global.timeout ? Number(conf.global.timeout) : 0, def, maps,
    written: Clock.now().getTime(), vga: conf.global.vga || "normal" });
  Museum.note("lilo-run");
  return 0;
});

/* ==========================================================================
   MODULE 10m — THE NETWORK
   ========================================================================== */
function netCfg() { return State.get("net", null); }
function ifUp(name) {
  const cfg = netCfg();
  if (name === "lo") return State.get("loUp", false);
  if (name === "eth0") return !!(cfg && cfg.up && Hw.net.ok());
  if (name === "ppp0") return State.get("pppUp", false);
  return false;
}
cmd("ifconfig", async c => {
  const args = c.args.filter(a => a.length);
  const show = name => {
    if (name === "lo") {
      c.outln("lo        Link encap:Local Loopback  ");
      c.outln("          inet addr:127.0.0.1  Bcast:127.255.255.255  Mask:255.0.0.0");
      c.outln("          UP BROADCAST LOOPBACK RUNNING  MTU:3584  Metric:1");
      c.outln("          RX packets:" + irnd(4, 240) + " errors:0 dropped:0 overruns:0");
      c.outln("          TX packets:" + irnd(4, 240) + " errors:0 dropped:0 overruns:0");
      c.outln("");
      return;
    }
    if (name === "eth0") {
      const cfg = netCfg();
      c.outln("eth0      Link encap:Ethernet  HWaddr " + Hw.M.net.mac);
      if (cfg) c.outln("          inet addr:" + cfg.ip + "  Bcast:" + cfg.bcast + "  Mask:" + cfg.mask);
      c.outln("          " + (cfg && cfg.up ? "UP BROADCAST RUNNING  " : "BROADCAST  ") + "MTU:1500  Metric:1");
      /* a card on the wrong interrupt: packets go out, none come back */
      const rx = Hw.net.ok() ? irnd(80, 3200) : 0;
      c.outln("          RX packets:" + rx + " errors:0 dropped:0 overruns:0");
      c.outln("          TX packets:" + (cfg && cfg.up ? irnd(60, 900) : 0) + " errors:0 dropped:0 overruns:0");
      c.outln("          Interrupt:" + (Hw.net.loaded() ? Hw.net.loaded().irq : Hw.jumpers().netIrq) +
        " Base address:" + (Hw.net.loaded() ? Hw.net.loaded().io : Hw.jumpers().netIo));
      c.outln("");
      return;
    }
    if (name === "ppp0") {
      const p = State.get("ppp", null);
      c.outln("ppp0      Link encap:Point-to-Point Protocol  ");
      if (p) c.outln("          inet addr:" + p.local + "  P-t-P:" + p.remote + "  Mask:255.255.255.0");
      c.outln("          UP POINTOPOINT RUNNING  MTU:1500  Metric:1");
      c.outln("          RX packets:" + irnd(20, 800) + " errors:0 dropped:0 overruns:0");
      c.outln("          TX packets:" + irnd(20, 800) + " errors:0 dropped:0 overruns:0");
      c.outln("");
      return;
    }
    c.errln("eth1: unknown interface");
  };
  if (!args.length) {
    if (ifUp("lo")) show("lo");
    if (ifUp("eth0")) show("eth0");
    if (ifUp("ppp0")) show("ppp0");
    if (!ifUp("lo") && !ifUp("eth0") && !ifUp("ppp0")) { /* nothing configured: nothing printed */ }
    return 0;
  }
  const name = args[0];
  if (args.length === 1) {
    if (name === "eth0" && !Hw.net.loaded()) {
      c.errln("eth0: unknown interface.");
      return 1;
    }
    if (name === "lo" || name === "eth0" || name === "ppp0") { show(name); return 0; }
    c.errln(name + ": unknown interface.");
    return 1;
  }
  /* configuring */
  if (name === "lo") { State.set("loUp", true); return 0; }
  if (name === "ppp0") return 0;
  if (name !== "eth0") { c.errln(name + ": unknown interface."); return 1; }
  if (!Hw.net.loaded()) {
    c.errln("SIOCSIFADDR: No such device");
    c.errln("eth0: unknown interface: No such device");
    return 1;
  }
  const cfg = Object.assign({ ip: "", mask: "255.255.255.0", bcast: "", gw: "", up: false }, netCfg() || {});
  for (let i = 1; i < args.length; i++) {
    const a = args[i];
    if (/^\d+\.\d+\.\d+\.\d+$/.test(a)) cfg.ip = a;
    else if (a === "netmask") cfg.mask = args[++i];
    else if (a === "broadcast") cfg.bcast = args[++i];
    else if (a === "up") cfg.up = true;
    else if (a === "down") cfg.up = false;
    else if (a === "mtu") i++;
  }
  if (cfg.ip && !cfg.bcast) cfg.bcast = cfg.ip.replace(/\.\d+$/, ".255");
  if (cfg.ip) cfg.up = true;
  State.set("net", cfg);
  return 0;
});

cmd("ping", async c => {
  const f = c.flags("c:i:s:");
  const host = f._[0];
  if (!host) return c.usage("usage: ping [-c count] host");
  const r = Net.resolve(host);
  if (r.err === "resolve") {
    c.errln("ping: unknown host " + host);
    return 1;
  }
  const count = f.c ? Number(f.c) : 4;
  c.outln("PING " + (r.name || host) + " (" + r.ip + "): 56 data bytes");
  let got = 0;
  const times = [];
  for (let i = 0; i < count; i++) {
    await c.tty.pause(i === 0 ? 300 : 1000);
    const reach = Net.reach(r.ip);
    if (reach.ok) {
      got++;
      times.push(reach.ms);
      c.outln("64 bytes from " + r.ip + ": icmp_seq=" + i + " ttl=" + reach.ttl + " time=" + reach.ms.toFixed(1) + " ms");
    } else if (reach.why === "unreachable" && i === 0) {
      c.outln("ping: sendto: Network is unreachable");
      c.outln("ping: wrote " + r.ip + " 64 chars, ret=-1");
      break;
    }
  }
  c.outln("");
  c.outln("--- " + (r.name || host) + " ping statistics ---");
  c.outln(count + " packets transmitted, " + got + " packets received, " +
    Math.round(100 * (count - got) / count) + "% packet loss");
  if (got) {
    const avg = times.reduce((a, x) => a + x, 0) / times.length;
    c.outln("round-trip min/avg/max = " + Math.min.apply(null, times).toFixed(1) + "/" +
      avg.toFixed(1) + "/" + Math.max.apply(null, times).toFixed(1) + " ms");
  }
  return got ? 0 : 1;
});

cmd("chat", async c => {
  const f = c.flags("f:");
  let script = "";
  if (f.f) { script = readFileText(c.resolve(f.f)) || ""; if (!script) { c.errln("chat: cannot open " + f.f); return 1; } }
  else script = c.args.filter(a => a[0] !== "-").join(" ");

cmd("pppd", async c => {
  /* pppd reads /etc/ppp/options first and then the command line, and the
     two are the same language.  The shell has already taken the quotes off
     the command line, so the options file is tokenised the same way and
     the two lists are joined. */
  const words = [];
  for (const l of (readFileText("/etc/ppp/options") || "").split("\n")) {
    const t = l.trim();
    if (!t.length || t[0] === "#") continue;
    for (const w of (t.match(/'[^']*'|"[^"]*"|\S+/g) || [])) words.push(w.replace(/^['"]|['"]$/g, ""));
  }
  const argv = words.concat(c.args);
  const all = argv.join(" ");
  const dev = (/\/dev\/(cua\d|ttyS\d)/.exec(all) || [])[0] || null;
  if (!dev) {
    c.errln("pppd: no device specified and /dev/tty is not a serial port");
    return 1;
  }
  /* connect takes one argument.  Written without quotes the shell splits
     the chat command across several, so the rest of the line is taken up
     to the next thing that is recognisably a pppd option. */
  const STOP = new Set(["defaultroute", "crtscts", "modem", "lock", "noipdefault", "persist",
    "debug", "kdebug", "mtu", "mru", "asyncmap", "user", "name", "remotename", "nodetach",
    "passive", "silent", "-detach", "disconnect", "auth", "noauth", "usepeerdns", "proxyarp"]);
  let connect = null;
  const ci = argv.indexOf("connect");
  if (ci >= 0 && argv[ci + 1] !== undefined) {
    connect = argv[ci + 1];
    if (/(^|\/)chat$/.test(connect)) {
      const more = [];
      for (let i = ci + 2; i < argv.length; i++) {
        if (STOP.has(argv[i]) || /^\/dev\//.test(argv[i]) || /^\d+$/.test(argv[i])) break;
        more.push(argv[i]);
      }
      if (more.length) connect += " " + more.join(" ");
    }
  }
  return Net.ppp(c, dev, connect, all);
});

cmd("lpr", async c => {
  const f = c.flags("P:#:");
  const pc = readFileText("/etc/printcap") || "";
  const entries = Printer.parse(pc);
  if (!entries.length) { c.errln("lpr: " + (f.P || "lp") + ": unknown printer"); return 1; }
  if (!Proc.has("lpd")) { c.errln("lpr: connect: Connection refused"); c.errln("jobs queued, but cannot start daemon."); return 1; }
  const files = f._.length ? f._ : null;
  const data = files ? files.map(a => readFileText(c.resolve(a)) || "").join("\n") : (c.stdin || "");
  const r = Printer.submit(entries[0], data, files ? files[0] : "(stdin)");
  if (r.err) { c.errln("lpr: " + r.err); return 1; }
  return 0;
});

cmd("passwd", async c => {
  const who = c.args[0] || Env.user();
  if (who !== Env.user() && Env.uid() !== 0) { c.errln("passwd: Permission denied"); return 1; }
  c.outln("Changing password for " + who);
  if (Env.uid() !== 0) {
    c.out("Old password: ");

  }
  c.out("Enter the new password (minimum of 5, maximum of 8 characters)\n");
  c.out("Please use a combination of upper and lower case letters and numbers.\n");
  c.out("New password: ");
  const p1 = await c.tty.line({ echo: false });
  if (p1 === null) return 1;
  if (p1.length < 5) { c.outln("\nPassword is too short.  Please use a longer password."); return 1; }
  c.out("Re-enter new password: ");
  const p2 = await c.tty.line({ echo: false });
  if (p1 !== p2) { c.outln("\nThey don't match; try again."); return 1; }
  const users = State.get("users", {});
  users[who] = Object.assign({}, users[who] || {}, { pw: p1 });
  State.set("users", users);

  Fs.write("/etc/shadow", (readFileText("/etc/shadow") || "").replace(
    new RegExp("^" + who + ":[^:]*", "m"), who + ":" + hashPw(p1)), { mode: 0o600 });
  c.outln("Password changed.");
  return 0;
});
function hashPw(p) {
  let h = 0;
  for (let i = 0; i < p.length; i++) h = (h * 31 + p.charCodeAt(i)) & 0x7fffffff;
  const A = "./0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
  let s = "";
  for (let i = 0; i < 13; i++) { s += A[(h >> (i % 5)) % 64]; h = (h * 1103515245 + 12345) & 0x7fffffff; }
  return s;
}

/* ==========================================================================
   MODULE 11 — THE NETWORK MODEL
   --------------------------------------------------------------------------
   A tiny simulated internet: this machine, its gateway, a nameserver, and a
   handful of hosts.  What matters is the order in which things fail, since
   that order is the whole diagnostic method the HOWTOs teach.
   ========================================================================== */
const Net = (() => {
  const HOSTS = {
    "localhost": { ip: "127.0.0.1", local: 1 },
    "192.168.1.1": { ip: "192.168.1.1", gw: 1 },
    "192.168.1.2": { ip: "192.168.1.2", ns: 1 },
    "ns.example.net": { ip: "192.168.1.2", ns: 1 },
    "gateway.example.net": { ip: "192.168.1.1", gw: 1 },
    "www.example.org": { ip: "198.51.100.4", far: 1,
      banner: "HTTP/1.0 200 OK\nServer: NCSA/1.5\nContent-type: text/html" },
    /* the four hosts that serve the pages this machine can actually fetch.
       A name that resolves and a page that exists are two different
       things, and both of them are two different things again from a
       route that works. */
    "www.linux.example.org": { ip: "198.51.100.4", far: 1,
      banner: "HTTP/1.0 200 OK\nServer: NCSA/1.5\nContent-type: text/html" },
    "www.slackware.example.com": { ip: "198.51.100.7", far: 1,
      banner: "HTTP/1.0 200 OK\nServer: Apache/1.2.4\nContent-type: text/html" },
    "www.example.com": { ip: "198.51.100.33", far: 1,
      banner: "HTTP/1.0 200 OK\nServer: Netscape-Enterprise/2.01" },
    "ftp.cdrom.example": { ip: "198.51.100.9", far: 1,
      banner: "220 ftp.cdrom.example FTP server (Version wu-2.4(3)) ready." },
    "sunsite.example.edu": { ip: "203.0.113.20", far: 1,
      banner: "220 sunsite.example.edu FTP server ready." },
    "news.example.net": { ip: "198.51.100.12", far: 1,
      banner: "200 news.example.net InterNetNews NNRP server INN 1.5.1 ready" }
  };
  function nameserver() {
    const rc = readFileText("/etc/resolv.conf") || "";
    const m = /^\s*nameserver\s+(\S+)/m.exec(rc);
    return m ? m[1] : null;
  }
  function hostsFile() {
    const out = {};
    for (const line of (readFileText("/etc/hosts") || "").split("\n")) {
      const t = line.replace(/#.*/, "").trim();
      if (!t.length) continue;

    return out;
  }
  /* the order in /etc/host.conf: hosts, then bind */
  function resolve(name) {
    if (/^\d+\.\d+\.\d+\.\d+$/.test(name)) {
      const h = Object.values(HOSTS).find(x => x.ip === name);
      const cfg = State.get("net", null);
      return { ip: name, name: null, local: name === "127.0.0.1" || (cfg && cfg.ip === name),
               far: h ? h.far : (name.indexOf("192.168.1.") !== 0) };
    }
    const hf = hostsFile();
    if (hf[name]) {
      const cfg = State.get("net", null);
      return { ip: hf[name], name, local: hf[name] === "127.0.0.1" || (cfg && cfg.ip === hf[name]) };
    }
    if (name === Env.host() || name === Env.fqdn()) {
      const cfg = State.get("net", null);
      return { ip: cfg && cfg.ip ? cfg.ip : "127.0.0.1", name, local: 1 };
    }
    const ns = nameserver();
    if (!ns) return { err: "resolve" };
    const h = HOSTS[name];
    if (!h) return { err: "resolve" };
    /* the nameserver is only reachable if the network is */
    if (!linkUp() && ns !== "127.0.0.1") return { err: "resolve" };
    return { ip: h.ip, name, far: h.far, gw: h.gw, ns: h.ns };
  }
  function linkUp() {
    if (State.get("pppUp", false)) return true;
    const cfg = State.get("net", null);
    return !!(cfg && cfg.up && Hw.net.ok());
  }
  function reach(ip) {
    if (ip === "127.0.0.1") return { ok: 1, ttl: 255, ms: 0.3 + Math.random() * 0.4 };
    const cfg = State.get("net", null);
    if (cfg && cfg.ip === ip && cfg.up) return { ok: 1, ttl: 255, ms: 0.3 };
    if (!linkUp()) {
      /* an interface that is up on the wrong interrupt: packets leave and
         nothing comes back, which looks like the far end being down */
      if (cfg && cfg.up && !Hw.net.ok()) return { ok: 0, why: "silent" };
      return { ok: 0, why: "unreachable" };
    }
    if (State.get("pppUp", false)) {
      if (ip.indexOf("192.168.1.") === 0) return { ok: 0, why: "silent" };
      return { ok: 1, ttl: 246, ms: 180 + Math.random() * 120 };
    }
    if (ip.indexOf("192.168.1.") === 0) return { ok: 1, ttl: 255, ms: 0.8 + Math.random() * 1.4 };
    if (!State.get("defaultRoute", null)) return { ok: 0, why: "unreachable" };
    return { ok: 1, ttl: 246, ms: 14 + Math.random() * 40 };
  }
  function banner(ip) {
    const h = Object.values(HOSTS).find(x => x.ip === ip);
    return h && h.banner ? h.banner : "Trying " + ip + "...";
  }

  /* ---- talking to a modem, which is where every dial-up problem starts */
  async function minicom(c) {
    const vt = c.vt;
    const dev = State.get("minicomDev", "/dev/cua1");
    if (c.args.indexOf("-s") >= 0) {

        if (r.tag === "Serial port setup") {

          if (p && !p.cancel && /Serial Device/.test(p.tag)) {

    }

    c.outln("");
    c.outln("OPTIONS: History Buffer, F-key Macros, Search History Buffer, I18n");
    c.outln("Compiled on Jun 23 1997, 21:14:03.");
    c.outln("");
    c.outln("Press CTRL-A Z for help on special keys");
    c.outln("");
    const which = State.get("minicomDev", "/dev/cua1");
    if (!Fs.exists(which)) { c.outln("minicom: cannot open " + which + ": No such file or directory"); return 1; }
    const isWin = which === "/dev/cua2" || which === "/dev/cua3";
    let ok = which === Hw.M.extmodem.port;
    c.outln("Initializing Modem");
    await c.tty.pause(600);
    if (ok) c.outln("AT S7=45 S0=0 L1 V1 X4 &c1 E1 Q0" ); else c.outln("");
    c.outln("");
    if (ok) c.outln("OK");
    else if (isWin) {
      c.outln("(nothing.  The device opens, and there is no modem behind it, because");
      c.outln(" the modem on that port is a " + Hw.M.winmodem.kind + " and the part that");
      c.outln(" answers AT commands is a Windows program.  See PPP-HOWTO section 9.)");
    } else {
      c.outln("(nothing.  There is no modem on " + which + ".)");

      if (!s.length) { continue; }
      if (!ok) { if (isWin || s.startsWith("AT")) { c.outln(""); } continue; }
      if (s === "AT") c.outln("OK");
      else if (s === "ATI3" || s === "ATI") { c.outln(Hw.M.extmodem.board); c.outln("V.34 / V.42bis  Rev 1.220"); c.outln("OK"); }
      else if (s === "ATZ") c.outln("OK");
      else if (s === "AT&F") c.outln("OK");
      else if (/^ATDT?/.test(s)) {
        Sound.handshake();
        c.outln("");
        await c.tty.pause(9000);
        c.outln("CONNECT 28800/ARQ/V34/LAPM/V42BIS");
        c.outln("");
        c.outln("Welcome to the example.net terminal server.");
        c.outln("");
        c.out("login: ");
        await c.tty.line();
        c.out("Password: ");
        await c.tty.line({ echo: false });
        c.outln("");
        c.outln("PPP session from (203.0.113.86) to 203.0.113.1 beginning....");
        c.outln("~ÿ}#À!}!}!} }4}\"}&} } } } }%}&áp}'}\"}(}\"C±~~ÿ}#À!}!}\"");
        c.outln("");
        c.outln("(that is PPP framing arriving at a terminal program.  You are in the");
        c.outln(" right place with the wrong tool: exit and use pppd.)");

      else c.outln("ERROR");

    c.outln("");
    c.outln("Leaving minicom.  Hangup.");
