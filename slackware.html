HDR("  Linux Installation HOWTO", "  Ruth Halvorsen, rhalvorsen@bergen.example.no", "4.2", "3 October 1997") + `
  How to obtain and install a Linux distribution, aimed at people who
  have not done it before.


  1.  Before you start

  Write down, on paper, before you go anywhere near a floppy disk:

       o  the make and model of your hard disk controller, and
          whether it is IDE or SCSI
       o  the make and model of your video card, and its chipset if
          you can find it, and how much video memory it has
       o  your monitor's horizontal sync range in kHz and vertical
          refresh range in Hz
       o  the I/O address and IRQ of your network card, if you have
          one
       o  the I/O address, IRQ and DMA channels of your sound card,
          if you have one
       o  how big your disk is, and what is currently on it, and
          whether you care about it

  Every one of these will be asked for, at a point where you cannot
  easily go and look. The sync ranges in particular are in the manual
  that came with the monitor and nowhere else.


  2.  Making room

  Linux needs its own partitions. It cannot be installed into a DOS
  directory, except by the UMSDOS route, which works and is slow and is
  not what you want if you have the disk space.

  If your disk is one big DOS partition with data on it that you want
  to keep, you need FIPS, which splits a DOS partition
  non-destructively, and you need to defragment first, and you need a
  backup, and you need to accept that this step is the one where
  people lose everything.

  If you do not care about what is on the disk, this is much simpler
  and much faster.


  3.  The boot disk and the root disk

  You install from two floppies. The first, the bootkernel disk, is a
  Linux kernel. The second, the root disk, is a small filesystem
  containing the installation programs.

  There are several dozen bootkernel disks and you must choose the one
  whose drivers match your disk controller. This is the first real
  decision of the installation and it is made before anything is on the
  screen to help you. Read the README in the bootdisk directory. The
  advice there is to use the disk with the fewest drivers that still
  covers your hardware, because the more drivers a kernel has, the more
  chances there are for two of them to collide while probing.

  If you choose a bootkernel disk that does not have a driver for your
  disk controller, the kernel will boot perfectly, the installer will
  start perfectly, and your hard disk will not exist. There is no
  message. The disk is simply not in the list. If that happens, you
  have the wrong bootkernel disk, and there is nothing else it can be.


  4.  Partitioning

  fdisk is a program with single-letter commands and no undo, and it is
  the standard tool. cfdisk is a full-screen alternative that is
  considerably friendlier and does exactly the same job. Nobody will
  think less of you.

  You need at least two partitions: one Linux native partition for the
  system, and one Linux swap partition. Swap should be about twice your
  RAM if you have 8 or 16 megabytes, and about the same as your RAM if
  you have more.

  Set the partition types by hexadecimal code. 83 is Linux native. 82
  is Linux swap. The type code is not cosmetic: the installer finds
  your swap partition by looking for type 82.

  Nothing is written to the disk until you use the write command. Up to
  that point you may quit and lose nothing. After it, the old partition
  table is gone.


  5.  setup

  Once you have partitions, run setup. It presents a menu:

       ADDSWAP    set up and enable your swap partition
       TARGET     choose and format the partitions to install on
       SOURCE     choose where the packages are coming from
       SELECT     choose which disk sets to install
       INSTALL    install them
       CONFIGURE  set up the installed system

  Work down the list in order.

  5.1  SELECT

  You are shown the lettered disk sets with a one-line description of
  each, and you tick the ones you want. You will not be told what needs
  what. There is no dependency information in this list because there
  is no dependency information in the distribution.

  This is worth being deliberate about, because the consequences turn
  up weeks later. If you skip the N series you will have no networking
  programs at all: no ping, no telnet, no ifconfig. If you skip X you
  will have no X. If you skip D you cannot compile anything, which
  includes anything you download.

  Sets almost everybody wants: A, AP, D, N. Add X and XAP if you want a
  graphical environment. Add F, because the documentation is the best
  thing in the distribution and it is small.

  5.2  The install modes

       full       install everything in the sets you chose, no
                  questions. Fast, and uses the most disk.
       menu       shows you the packages in groups and lets you pick
       expert     asks you about every single package individually
       newbie     asks you about most of them individually, with a
                  description, and pre-answers the required ones
       custom     use a tag file you have prepared
       tagpath    use tag files from a directory

  "newbie" asks you roughly a hundred and fifty questions. It is named
  for the person it is aimed at, not for the amount of work it saves
  them.

  5.3  CONFIGURE

  This asks about LILO, your mouse, your modem, your timezone, the
  console font, which services to start, and finally the root password.
  It also offers to make a boot floppy.

  Make the boot floppy. Have a blank formatted disk ready before you
  start the installation, because the moment you need it is the moment
  you cannot make it.


  6.  The first boot

  Remove the floppy. The machine will either present you with a login
  prompt or it will not. If it does, log in as root with the password
  you set and there will be no welcome message and no next step
  offered, because you are now the administrator of a Unix machine and
  it is assuming you know what you wanted it for.


  7.  Copyright

  Copyright (c) 1997 Ruth Halvorsen. Freely distributable.
`);

  /* ------------------------------------------------------------------ */
  doc("NET-3-HOWTO", { title: "Linux NET-3 HOWTO" },
HDR("  Linux NET-3 HOWTO", "  Ana Rezende, arezende@quilmes.example.ar", "1.6", "17 September 1997") + `
  How to configure TCP/IP networking on a Linux machine. This document
  is about addresses and routes. Getting your card recognised at all is
  the Ethernet-HOWTO.


  1.  The four numbers

  A statically addressed machine needs four things and no more:

       o  its own address                     192.168.1.9
       o  the netmask                         255.255.255.0
       o  the broadcast address               192.168.1.255
       o  the address of the default gateway  192.168.1.1

  and, to resolve names, a nameserver address in /etc/resolv.conf.

  Write them on paper first. Every mistake in this area is a typo.


  2.  Doing it by hand

       ifconfig lo 127.0.0.1
       route add -net 127.0.0.0
       ifconfig eth0 192.168.1.9 netmask 255.255.255.0 broadcast 192.168.1.255
       route add -net 192.168.1.0 netmask 255.255.255.0
       route add default gw 192.168.1.1

  The loopback interface is not optional and is not automatic. A
  machine with no lo interface behaves very strangely: programs that
  talk to themselves over TCP hang, and the errors do not mention the
  network.

  Check your work with

       ifconfig
       route -n
       netstat -rn


  3.  Doing it at boot

  Slackware puts this in /etc/rc.d/rc.inet1, which is a plain shell
  script with your addresses in it near the top. netconfig writes that
  script for you from the answers you give it. Either read the script
  and edit it, or run netconfig and let it write it, but do not do both
  and then wonder which one won.

  rc.inet2 starts the daemons: inetd, syslogd if it is not already up,
  portmap, and whatever servers you have enabled. Read it. It is a list
  of if-tests on whether a program exists, which is Slackware's whole
  approach to configuration in one file.


  4.  Testing, in this order

       ping 127.0.0.1               is my TCP/IP stack alive
       ping 192.168.1.9             is my own interface alive
       ping 192.168.1.1             can I reach my gateway
       ping 198.51.100.4            can I reach the world by number
       ping www.example.org         can I resolve names

  The first one that fails tells you which layer is broken, and there is
  no point looking at the layers above it. A machine that fails only the
  last test has a working network and a broken resolv.conf.


  5.  Copyright

  Copyright (c) 1997 Ana Rezende. Freely distributable.
`);

  /* ------------------------------------------------------------------ */
  doc("Hardware-HOWTO", { title: "Linux Hardware Compatibility HOWTO" },
HDR("  Linux Hardware Compatibility HOWTO", "  Steven Okonkwo, sokonkwo@fenwick.example.com", "97.09", "26 September 1997") + `
  A list of hardware known to work, and known not to.


  1.  How to read this document

  Presence on this list means somebody has made this device work and
  said so in public. Absence means nobody has said so, which is not the
  same as it not working.

  The list is maintained by reading the newsgroups, so it is biased
  towards hardware that gave people trouble. Boring hardware that just
  works is underrepresented, which is not the fault of the hardware.


  2.  The rule that will save you the most time

  Linux drivers are written by people who have the specifications. If a
  manufacturer publishes the register-level programming information for
  a device, a driver appears, usually within a year, usually written by
  somebody who owns one and got annoyed.

  If a manufacturer does not publish it, no driver appears, no matter
  how popular the device is, and no amount of demand changes this.

  So the practical rule when buying hardware for a Linux machine is not
  "is it fast" or "is it cheap". It is "does the manufacturer publish
  the specifications". This correlates almost perfectly with whether
  the thing will work, and it correlates negatively with price.


  3.  Categories of trouble

  3.1  Anything sold as requiring Windows

  A device whose box specifies a version of Windows and a minimum
  processor speed is doing its work in software on your CPU. The card
  is a socket. See the PPP-HOWTO section 9 for the modem case; the same
  applies to printers sold as GDI or host-based, and to some scanners.

  3.2  Plug and Play ISA cards

  ISA Plug and Play is a specification for negotiating resources at boot
  time between the BIOS and the cards. Linux 2.0 does not implement the
  operating-system half of it. A PnP ISA card whose resources were
  assigned by the BIOS may work; one that expects the operating system
  to configure it will not be configured, and will appear as a device
  at no address at all.

  The isapnptools package can configure these cards from user space
  before you load the driver, and it works, and it is fiddly, and it is
  in the contrib directory rather than the distribution for a reason.

  3.3  Very new video cards

  A card released in the last six months is likely to be supported by
  XFree86 only through the generic VGA path, at 640x480 in 16 colours,
  until somebody adds it. Check the XFree86 release notes for your card
  before you buy it, not after.

  3.4  Winprinters, and printers with no processor

  See the Printing-HOWTO. If the printer cannot interpret a page
  description language of any kind, your machine has to produce the
  raster, and somebody has to have written the code that produces the
  right raster for that printer.


  4.  Copyright

  Copyright (c) 1997 Steven Okonkwo. Freely distributable. Corrections
  welcome; new entries very welcome; complaints about section 3 should
  go to the manufacturers.
`);

  /* ------------------------------------------------------------------ */
  doc("SCSI-HOWTO", { title: "The Linux SCSI HOWTO" },
HDR("  The Linux SCSI HOWTO", "  Steven Okonkwo, sokonkwo@fenwick.example.com", "2.4", "19 May 1997") + `
  SCSI support under Linux: which host adapters work, how devices are
  named, and what termination is.


  1.  Device names

  SCSI devices are named in the order they are found, not by their ID.

       /dev/sda      first SCSI disk
       /dev/sda1     first partition on it
       /dev/sdb      second SCSI disk
       /dev/scd0     first SCSI CD-ROM
       /dev/st0      first SCSI tape

  If you add a disk with a lower ID than an existing one, every name
  after it shifts, and your /etc/fstab is now wrong. This surprises
  people once.


  2.  Host adapters

  The kernel needs a driver for your specific host adapter, and that
  driver either is or is not in the kernel you booted. The generic SCSI
  bootdisk contains nearly all of them, which is why it is large and
  why it is the one to use when you do not know.

  Adapters that work well and are common: the Adaptec 1542 family on
  ISA, the Adaptec 274x and 294x family, BusLogic MultiMaster, NCR
  53c8xx, UltraStor 14F and 24F, Future Domain TMC-16x0.

  Adapters bundled free with a scanner or a CD-ROM drive are frequently
  cut-down designs that only talk to the device they came with. If your
  adapter came in the same box as a CD-ROM drive, expect it to drive
  that CD-ROM drive and nothing else.


  3.  Termination

  A SCSI bus must be terminated at both ends and nowhere else. This is
  not advice, it is electrical.

  Symptoms of bad termination are not "it does not work". They are
  intermittent: transfers that fail under load, a device that is found
  at boot and disappears later, parity errors in the log, a machine that
  is stable until you use the tape drive. If you are seeing intermittent
  SCSI errors, stop reading the driver documentation and go and look at
  the terminators.


  4.  Interrupt sharing

  ISA host adapters cannot share an interrupt with anything else. This
  is the ISA bus, not the adapter. If the adapter is on IRQ 7 and you
  have a parallel port, or on IRQ 5 and you have a sound card, you have
  a machine that works until two things happen at once.

  The failure looks like a fault in whichever device you were using at
  the time, which is why this is written down here and referred to from
  the Printing-HOWTO and the Sound-HOWTO.

  Interrupts commonly free on a PC: 5, 10, 11, 12. Check
  /proc/interrupts for what has already been claimed.


  5.  Copyright

  Copyright (c) 1997 Steven Okonkwo. Freely distributable.
`);

  /* ------------------------------------------------------------------ */
  doc("Serial-HOWTO", { title: "The Linux Serial HOWTO" },
HDR("  The Linux Serial HOWTO", "  Marta Vlasek, mvlasek@ceti.example.org", "1.11", "1 August 1997") + `
  Serial ports, terminals, mice and modems.


  1.  Names

       /dev/ttyS0     COM1, for incoming use
       /dev/ttyS1     COM2
       /dev/cua0      COM1, for outgoing calls
       /dev/cua1      COM2

  The ttyS and cua devices are the same hardware with different locking
  behaviour. Dial out on cua, listen on ttyS. Mice go on cua.

  A PC has two serial ports and four possible addresses, and COM1 and
  COM3 share IRQ 4 while COM2 and COM4 share IRQ 3. Two devices on
  shared serial interrupts do not work simultaneously. This is why the
  internal modem that came with the machine so often had to be moved to
  COM4 and then did not work with the mouse on COM1.


  2.  setserial

  The kernel probes the standard addresses at boot and reports what it
  found:

       Serial driver version 4.13 with no serial options enabled
       tty00 at 0x03f8 (irq = 4) is a 16550A
       tty01 at 0x02f8 (irq = 3) is a 16550A

  A 16550A has a buffer and can run fast. A 16450 or an 8250 has no
  buffer, cannot reliably exceed 9600 baud under load, and is why old
  machines lose characters. setserial can tell the driver about ports
  it did not find, and about non-standard IRQs.


  3.  The mouse

  A serial mouse is a serial device and needs nothing but the port. gpm
  gives you a mouse at the text console, including cut and paste
  between virtual terminals, which is one of the small things about
  Linux that people who have it cannot do without.

  X talks to the mouse itself and does not use gpm, and if both have the
  device open the pointer will behave strangely. Run gpm in repeater
  mode, or turn it off before starting X. Slackware sets this up for you
  and this note is here for when it does not.


  4.  Copyright

  Copyright (c) 1997 Marta Vlasek. Freely distributable.
`);

  /* ------------------------------------------------------------------ */
  doc("Module-HOWTO", { title: "The Linux Kernel Module HOWTO" },
HDR("  The Linux Kernel Module HOWTO", "  Brian Kell, bkell@sundial.example.org", "0.9", "22 June 1997") + `
  Loadable kernel modules: what they are and how to use them.


  1.  What a module is

  A module is a piece of kernel code compiled separately and loaded into
  the running kernel on demand. Drivers, filesystems and network
  protocols can all be modules. The kernel itself, the scheduler, the
  memory manager and the driver for the disk your root filesystem is on
  cannot.

       insmod ne io=0x300 irq=10        load a module, with arguments
       lsmod                            list what is loaded
       rmmod ne                         unload it
       modprobe ne                      load it and anything it needs
       depmod -a                        rebuild the dependency file

  Modules live in /lib/modules/2.0.30/ in directories by category.


  2.  Why bother

  A driver you use once a month does not need to be in the kernel image
  taking up memory permanently. A driver you are trying to get working
  can be loaded and unloaded and loaded again with different arguments,
  in seconds, without a reboot. That second reason is the real one: a
  modular driver turns a twenty-minute build-and-reboot cycle into a
  five-second one.


  3.  What goes wrong

  3.1  "unresolved symbol" on insmod

  The module was compiled against a different kernel than the one
  running. Modules are not portable between kernel versions and are
  frequently not portable between two builds of the same version with
  different options. Rebuild the module against the running kernel.

  3.2  The module loads and the device does not work

  Wrong arguments. Load it with the io= and irq= your card is actually
  set to. See the Ethernet-HOWTO for how to find out what that is.

  3.3  insmod says the device is busy

  Something else has claimed the interrupt or the I/O range. Look at
  /proc/interrupts and /proc/ioports.


  4.  kerneld

  kerneld is a daemon that loads modules automatically when the kernel
  asks for a device that is not present. It works, and when it works it
  is invisible, and when it does not work it is very confusing, because
  a module you did not load has appeared and a module you did load has
  gone away.

  If you are debugging a driver, turn kerneld off and do it by hand.


  5.  Copyright

  Copyright (c) 1997 Brian Kell. Freely distributable.
`);

  /* ------------------------------------------------------------------ */
  doc("ELF-HOWTO", { title: "Linux ELF HOWTO" },
HDR("  Linux ELF HOWTO", "  Douglas Anselm, danselm@thule.example.edu", "1.4", "12 April 1997") + `
  The move from a.out to ELF, and what to do about shared libraries.


  1.  Two binary formats

  Linux used to use a binary format called a.out and now uses one called
  ELF. ELF is better in ways that matter to people writing compilers and
  in one way that matters to everybody: shared libraries under ELF are
  straightforward, and under a.out they were not.

  Slackware 3.4 is an ELF distribution. Everything in it is ELF. The
  a.out libraries are still shipped, in the aoutlibs package, so that
  old binaries you have lying around still run. You do not need them for
  anything you compile now.

  You can tell which is which:

       file /bin/ls
       /bin/ls: ELF 32-bit LSB executable, Intel 80386, dynamically
       linked, stripped


  2.  Shared libraries and the error everybody meets

  A dynamically linked program does not contain the library code it
  uses. It contains the name of the library, and the dynamic linker
  finds it at run time. If it cannot find it, you get this:

       nedit: error in loading shared libraries
       libXm.so.2: cannot open shared object file: No such file or
       directory

  This is the most common failure in a Linux system of this era and it
  is worth reading carefully, because it is telling you exactly what is
  wrong. The program is fine. The program installed correctly. There is
  a library called libXm.so.2 that it needs and that is not on this
  machine.

  Note what the message does not do. It does not tell you which package
  contains that library, or where to get it, or what else needs it. It
  tells you the file name. Finding out what provides a file called
  libXm.so.2 is your problem, and in 1997 the way you solved it was to
  ask somebody or to recognise the name.


  3.  ldd

  ldd lists the shared libraries a program needs and where the dynamic
  linker would find each one:

       ldd /usr/X11R6/bin/xterm
               libXaw.so.6 => /usr/X11R6/lib/libXaw.so.6
               libXt.so.6 => /usr/X11R6/lib/libXt.so.6
               libX11.so.6 => /usr/X11R6/lib/libX11.so.6
               libc.so.5 => /lib/libc.so.5

  A line reading "not found" is your answer. Run ldd on anything that
  will not start, before you do anything else. It is the first thing to
  try and most people learn it late.


  4.  ldconfig

  The dynamic linker does not search directories. It reads a cache,
  /etc/ld.so.cache, built by ldconfig from the directories listed in
  /etc/ld.so.conf. If you install a library by hand into a new
  directory, add the directory to ld.so.conf and run ldconfig, or
  nothing will find it however correct the file is.

  This is the other half of the "cannot open shared object file"
  message: sometimes the library is there and the cache does not know.


  5.  Copyright

  Copyright (c) 1997 Douglas Anselm. Freely distributable.
`);

  /* ------------------------------------------------------------------ */
  doc("Bootdisk-HOWTO", { title: "The Linux Bootdisk HOWTO" },
HDR("  The Linux Bootdisk HOWTO", "  Ruth Halvorsen, rhalvorsen@bergen.example.no", "3.1", "16 April 1997") + `
  How to make and use a boot floppy, and why you want one before you
  need one.


  1.  Why

  A Linux machine that will not boot is usually a machine with a
  perfectly good filesystem and a broken boot sector, a wrong entry in
  lilo.conf, or a kernel that panics before it can mount the root
  partition. In every one of those cases the data is fine and the
  system is fine and you cannot get to it.

  A boot floppy gets you to it.

  The Slackware installer offers to make one at the end of the
  installation. Say yes. It takes ninety seconds and it is the
  difference between a bad evening and a reinstall.


  2.  The two kinds

  2.1  A kernel on a floppy

  The simplest boot disk is a kernel written to a floppy with its root
  device set to your hard disk partition. The machine boots the kernel
  off the floppy and then uses the hard disk for everything else. This
  is what the installer makes and it is what you want in almost every
  situation.

       dd if=/vmlinuz of=/dev/fd0 bs=8192
       rdev /dev/fd0 /dev/sda2

  2.2  A whole system on a floppy

  A rescue disk with a kernel and a small root filesystem, so it boots
  with no hard disk at all. Slackware ships one: the rescue.gz root
  disk, used with any bootkernel disk. This is what you need when the
  filesystem itself is damaged and you have to run fsck on it from
  outside.


  3.  Using it

  Boot the floppy. If it is a kernel-only disk it will bring up your
  system normally. If it is a bootkernel disk from the installation
  set, you get a LILO prompt, and you can tell it where your root
  filesystem is:

       mount root=/dev/sda2

  Then, once you are up: mount the filesystem, fix what is wrong, and
  the step people forget, run lilo, because the boot sector is still
  wrong and the floppy is not going to be in the drive forever.


  4.  Copyright

  Copyright (c) 1997 Ruth Halvorsen. Freely distributable.
`);

  /* ---- mini-HOWTOs: shorter, scrappier, and often better ------------- */
  doc("mini/LILO", { title: "LILO mini-HOWTO", mini: 1 },
HDR("  LILO mini-HOWTO", "  Brian Kell, bkell@sundial.example.org", "1.5", "3 May 1997") + `
  1.  What LILO is, exactly

  LILO is not a boot loader that reads a file at boot time. That is the
  single most important sentence in this document.

  At boot, LILO's first stage is a few hundred bytes in the boot sector
  or the superblock of a partition. It contains a list of physical disk
  block numbers, and it loads those blocks. It cannot read a
  filesystem. It has no idea what a file is.

  The lilo command, run as root, is a program that reads
  /etc/lilo.conf, finds the kernels you named, works out the physical
  blocks they occupy right now, and writes that list into the boot
  sector.

  2.  Therefore

       o  editing lilo.conf does nothing until you run lilo
       o  copying a new kernel over an old one does nothing until you
          run lilo, even if the filename has not changed, because the
          new file is in different blocks
       o  moving a kernel with a defragmenter breaks the boot
       o  running lilo prints one line per stanza and nothing else,
          which is not it failing

  3.  The prompt

  If you set prompt and a timeout, LILO stops and waits. Press Tab to
  list the labels it knows. Type a label to boot it. Type a label and
  then extra words to pass them to the kernel:

       linux single             boot to single user mode
       linux root=/dev/sda3     boot a different root filesystem
       linux init=/bin/sh       when even single user mode fails

  Always keep a second stanza pointing at a kernel you know works.

  4.  If you did not

  Boot the floppy. If you did not make the floppy, boot the bootkernel
  disk from the installation set, and at its LILO prompt type

       mount root=/dev/sda2

  which boots that floppy's kernel against your real root filesystem.
  Then fix lilo.conf and run lilo. This works, and it is why the
  installer asked you to keep those floppies.
`);

  doc("mini/Partition", { title: "Partition mini-HOWTO", mini: 1 },
HDR("  Partition mini-HOWTO", "  Ruth Halvorsen, rhalvorsen@bergen.example.no", "2.0", "9 February 1997") + `
  1.  The type codes you need

       82   Linux swap
       83   Linux native
       05   Extended
       0b   Win95 FAT32
       06   DOS 16-bit >=32M
       07   HPFS / NTFS

  fdisk's l command lists all of them. The type code is a single byte in
  the partition table and it is advisory to the operating system and
  mandatory to the installer, which finds your swap partition by looking
  for type 82. A Linux swap partition left at type 83 will not be
  offered to you during installation and the reason will not be
  explained.

  2.  How many

  Two is enough: one root, one swap. Separate /usr, /var and /home
  partitions are a good idea on a machine with more than one disk or
  more than one user, and are a way of running out of space in one place
  while having plenty in another on a machine with neither.

  3.  Swap size

  Twice your RAM, up to about 64 MB, and then as much as you feel like.
  A 2.0 kernel can use up to eight swap partitions of 128 MB each.

  4.  fdisk has no undo

  Nothing is written until w. Before w you can quit with q and lose
  nothing at all. After w the previous partition table does not exist
  anywhere. There is no confirmation step beyond the one you have just
  read.
`);

  doc("mini/Swap-Space", { title: "Swap Space mini-HOWTO", mini: 1 },
HDR("  Swap Space mini-HOWTO", "  Marta Vlasek, mvlasek@ceti.example.org", "1.2", "28 January 1997") + `
  1.  A swap partition

       mkswap /dev/sda1
       swapon /dev/sda1

  and in /etc/fstab, so it happens at boot:

       /dev/sda1        swap             swap        defaults   0   0

  2.  A swap file

  If you have run out of partitions, a file works, slightly slower:

       dd if=/dev/zero of=/swapfile bs=1024 count=32768
       mkswap /swapfile 32768
       swapon /swapfile

  3.  How much is enough

  Enough that the machine does not run out; not so much that it swaps
  happily instead of telling you that you need more memory. If your disk
  light is on constantly and the machine is unresponsive, you do not
  need more swap, you need more RAM, and no amount of swap will fix it.

  4.  free

  free tells you the truth in kilobytes. The buffers figure is memory
  the kernel is using for disk cache and will give back immediately;
  people see it and conclude they are out of memory when they are not.
`);

  doc("mini/3-Button-Mouse", { title: "3 Button Mouse mini-HOWTO", mini: 1 },
HDR("  3 Button Mouse mini-HOWTO", "  Marta Vlasek, mvlasek@ceti.example.org", "1.1", "6 March 1997") + `
  1.  X wants three buttons

  X was designed on workstations that had three mouse buttons and it
  uses all three. Button 2, the middle one, pastes the primary
  selection, and a very large number of X programs put a menu on it.

  If your mouse has two buttons, tell X to emulate the third by
  treating a simultaneous press of both buttons as button 2:

       Section "Pointer"
           Protocol    "Microsoft"
           Device      "/dev/cua0"
           Emulate3Buttons
           Emulate3Timeout 50
       EndSection

  This works and it is unpleasant, and it is the reason Linux users of
  this era bought three-button mice on purpose.

  2.  Protocol, not brand

  The Protocol line is a wire protocol, not a manufacturer. A
  three-button serial mouse is usually "MouseMan" or "Logitech"; a
  two-button serial mouse is usually "Microsoft"; a bus mouse on its own
  card is "BusMouse"; a PS/2 port mouse is "PS/2".

  A pointer that moves but jumps, sticks, or runs to a corner when you
  click is the wrong protocol. It is not a broken mouse and it is not a
  broken port.

  3.  At the console

  gpm gives you the same three buttons at the text console, including
  cut and paste. Select with the left button, paste with the middle
  one. Nobody expects this to work at a text console and it does.
`);

  doc("mini/Reading-List", { title: "Reading List mini-HOWTO", mini: 1 },
HDR("  Reading List mini-HOWTO", "  Ruth Halvorsen, rhalvorsen@bergen.example.no", "1.8", "11 August 1997") + `
  1.  Read these first, in this order

       o  the manual page for the thing you are using. man man.
       o  the HOWTO whose name matches your problem
       o  /usr/doc/<package>, which is the documentation the author
          of the program wrote and which the packager kept
       o  the source, which is on the disk

  2.  On paper

  Running Linux, by Matt Welsh and Lar Kaufman. The Linux Network
  Administrator's Guide, by Olaf Kirch, which is also on the disk. The
  Linux Programmer's Guide. Anything by Kernighan and Pike.

  3.  On the newsgroups

  comp.os.linux.setup, comp.os.linux.hardware, comp.os.linux.x,
  comp.os.linux.answers. Read for a week before you post. Your question
  has almost certainly been answered in the last week, and the archives
  are searchable.

  4.  Before you post

  Say what hardware you have. Say what you typed. Say what it printed,
  exactly, by copying it rather than describing it. Say which HOWTO you
  have already read. A question that contains all four of those gets
  answered, usually within the hour, usually by somebody who has the
  same card.

  A question that says "X doesn't work, please help" gets told to read
  the XFree86-HOWTO, and correctly.
`);

  doc("mini/Colour-ls", { title: "Colour ls mini-HOWTO", mini: 1 },
HDR("  Colour ls mini-HOWTO", "  Ken Adeyemi, kadeyemi@laurel.example.net", "1.0", "14 June 1997") + `
  1.  The one improvement everyone makes on their first evening

  GNU ls will colour its output by file type. Slackware ships the
  configuration in /etc/DIR_COLORS and an alias in /etc/profile, and if
  your ls is not in colour, either your shell is not reading the
  profile or the terminal is not one DIR_COLORS lists.

       eval `+"`"+`dircolors /etc/DIR_COLORS`+"`"+`
       alias ls='ls --color=auto'

  2.  Changing it

  /etc/DIR_COLORS is a plain text file mapping file types and
  extensions to ANSI colour codes. Copy it to ~/.dir_colors and edit
  that. The syntax is documented in comments in the file itself, which
  is how nearly all configuration on this system is documented, and it
  is better than it sounds.

  3.  Why it matters more than it should

  A directory listing where directories are blue and executables are
  green and symbolic links are cyan is legible at a glance, and this is
  the first thing most people customise, and it is a completely
  reasonable thing to spend twenty minutes on.
`);

  function indexFile() {
    const have = n => D[n] ? "  *" : "   ";
    const L = [];
    L.push("                     Linux HOWTO INDEX");
    L.push("             Guy Keyes, gkeyes@sunsite.example.edu");
    L.push("                    v97.10, 4 October 1997");
    L.push("");

    L.push("  the collection and were not copied to this machine.");
    L.push("");

    for (const c of CATALOGUE) L.push(have(c + "-HOWTO") + "  " + c + "-HOWTO");

/* ==========================================================================
   MODULE 6 — THE PACKAGE MODEL AND THE DISK SETS
   --------------------------------------------------------------------------
   This module is the foundation, and it produces the exhibit's best
   property: what exists on this machine is a genuine consequence of what
   was ticked during the installation.

   There is no dependency resolution here.  Not a weak one, not a warning,
   not a hint.  Slackware did not have it in 1997 and does not have it now,
   on purpose, and every wart the exhibit demonstrates downstream of this
   point is a wart because of its absence.  A package declares the files it
   installs and the shared libraries its programs need; nothing anywhere
   compares those two lists before you find out the hard way.

   Package and disk set names are the real ones from the 3.4.0 release
   tree.  The file contents are written for this exhibit.
   ========================================================================== */

#
# /etc/rc.d/rc.S:  System initialization script.
#
# Mostly written by:  Patrick J. Volkerding, <volkerdi@ftp.cdrom.com>
#

# Mount /proc right away:
/sbin/mount -v proc /proc -t proc

# Enable swapping:
/sbin/swapon -a

# Test to see if the root partition is read-only, like it ought to be.
READWRITE=no
if echo -n >> "/etc/tstchk" 2> /dev/null ; then
 rm -f /etc/tstchk
 READWRITE=yes
else
 echo "Testing filesystem status: read-only filesystem"
fi

# Check the integrity of all filesystems named in /etc/fstab:
if [ ! ` + BQ + `cat /etc/fstab | grep -v '^#' | wc -l` + BQ + ` = 0 ]; then
 /sbin/fsck -A -a
 # If there was a failure, drop into single-user mode.
 if [ $? -gt 1 ] ; then
  echo
  echo "**************************************"
  echo "fsck returned error code - REBOOT NOW!"
  echo "**************************************"
  echo
  /bin/login
 fi
fi

# Remount the root filesystem read-write:
/sbin/mount -w -v -n -o remount /

# Remove /etc/mtab* so that mount will create it with a root entry:
/bin/rm -f /etc/mtab* /etc/nologin /etc/fastboot

# Mount the remaining local filesystems:
/sbin/mount -avt nonfs

# Set the system time from the hardware clock:
/sbin/clock -s

# Configure the system clock's timezone:
if [ -r /etc/localtime ]; then
 echo "Local time zone is: ` + BQ + `date +%Z` + BQ + `"
fi

# Load any custom keymaps:
if [ -x /etc/rc.d/rc.keymap ]; then
 . /etc/rc.d/rc.keymap
fi

# Load kernel modules.  This is a plain shell script full of commented-out
# insmod lines.  If you have hardware, this is where you tell the kernel
# about it, and nothing is going to do it for you.
if [ -x /etc/rc.d/rc.modules ]; then
 . /etc/rc.d/rc.modules
fi

# Set the hostname:
if [ -r /etc/HOSTNAME ]; then
 /bin/hostname ` + BQ + `cat /etc/HOSTNAME` + BQ + `
else
 echo "darkstar.example.net" > /etc/HOSTNAME
 /bin/hostname darkstar
fi

rm -f /var/lock/* /var/spool/uucp/LCK..* /tmp/.X*lock

  C.usrDocReadme = `
                      /usr/doc  --  READ THIS FIRST
                      ----------------------------

This directory contains the documentation that came with the programs on
this system.  Not documentation about them written by somebody else:  the
files the authors wrote and shipped, kept in the package and put here.

There is a directory per package.  Inside it you will find README,
INSTALL, CHANGES, TODO, COPYING, and whatever else the author thought was
worth keeping.  Some of it is excellent.  Some of it is a single line.  It
is what there is.

/usr/doc/faq contains the Linux FAQ and the HOWTO collection, which is
the documentation for Linux itself.  Start with faq/howto/INDEX.  If your
question is in a HOWTO, the answer is in that HOWTO, and it is better than
the answer you will get by asking.

A note on the tone of all of this.

Slackware assumes you can read.  It does not assume you already know
anything, and there is a difference, and the difference is the whole
design.  You will not be asked whether you are sure.  You will not be
offered a simpler alternative.  You will not be told that something has
been done for you, because as a rule it has not been.  What you get
instead is the actual file, in text, in /etc, with comments in it, and
the manual page, and the source.

That is not a boast and it is not an apology.  It is a description, so
that you know what you have got, and can decide whether it is what you
wanted.

--  the Slackware Linux Project
`;

  C.dosPlan = `Old .plan file, saved off the Linux partition before I wiped it.
                                                            -- dmw

------------------------------------------------------------------------

  Currently:  reading the XFree86 docs. All of them. Twice.

  Long version, since three people have now asked.

  The monitor that came with this machine was a 14 inch fixed frequency
  thing that did 640x480 at 60Hz and nothing else. I knew that. It said
  so on the box, which I still had.

  What I did not know is that XF86Config does exactly what you tell it,
  and that the numbers I had copied out of a posting on
  comp.os.linux.x were for somebody else's monitor, which was a
  multisync. I ran startx. The screen went dark and then made a noise I
  had not heard a monitor make before, sort of a rising whistle, and
  there was a smell.

  Nine seconds. I counted afterwards, from the tape of me telling my
  brother about it. Nine seconds is how long I sat there deciding
  whether what I was seeing was a mode problem or a monitor problem,
  and Ctrl-Alt-Backspace was two inches from my left hand the whole
  time, and I have thought about that a lot since.

  The documentation warned me. It warned me in capital letters, in a
  box, twice, in two different files. I had read both of them. I read
  them the way you read a seatbelt warning.

  So: the replacement is an Aureus DM-1564, it is a genuine multisync,
  and its manual is in this directory as dm1564.txt because I am not
  losing it. 30 to 64 kHz horizontal, 50 to 100 vertical, and if you
  are about to type numbers larger than those into an XF86Config on
  this machine, don't.

  My old XF86Config is in this directory too, as xf86conf.old. Do not
  use it. It is for the dead one.

  It cost 340 dollars. I get to tell this story as often as I like.
`;

# $XConsortium: xinitrc.cpp /main/34 1996/05/29 12:00:00 $
#
# This is the system-wide xinitrc.  startx runs it if you have no

#

  C.startxScript = `#!/bin/sh
# $XConsortium: startx.cpp /main/21 1996/05/29 $
#
# This is just a sample implementation of a slightly less primitive
# interface than xinit.  It looks for user .xinitrc and .xserverrc
# files, then system xinitrc and xserverrc files, else lets xinit choose
# its default.  The system xinitrc should probably do things like check
# for .Xresources files and merge them in, startup up a window manager,
# and pop a clock and serveral xterms.
#
# Site administrators are STRONGLY urged to write nicer versions.

userclientrc=$HOME/.xinitrc
userserverrc=$HOME/.xserverrc
sysclientrc=/var/X11R6/lib/xinit/xinitrc
sysserverrc=/var/X11R6/lib/xinit/xserverrc
clientargs=""
serverargs=""

if [ -f $userclientrc ]; then
    clientargs=$userclientrc
else if [ -f $sysclientrc ]; then
    clientargs=$sysclientrc
fi
fi

if [ -f $userserverrc ]; then
    serverargs=$userserverrc
else if [ -f $sysserverrc ]; then
    serverargs=$sysserverrc
fi
fi

xinit $clientargs -- $serverargs $@

if [ x"$REMOTE_SERVER" = x ]; then
    stty sane
fi
`;

  /* ---- deferred file contents ----------------------------------------- */
  /* Man pages, source files and X documentation are declared in the
     package tables as markers and filled in by MODULE 6b, which keeps the
     package tables readable.  An unresolved marker produces an honest
     stub rather than a lie. */
  const TEXT = {};
  function resolveText(d) {
    if (typeof d !== "string") return d;
    const m = /^(MAN|DOC|SRC):(.+)$/.exec(d);
    if (!m) return d;
    const t = TEXT[m[1] + ":" + m[2]];
    if (t !== undefined) return typeof t === "function" ? t() : t;
    if (m[1] === "MAN") return "No manual entry formatted for " + m[2] + ".\n";
    return "";
  }

  /* ---- the installed-package database --------------------------------- */
  /* Slackware's package database is a directory of text files in
     /var/log/packages, one per installed package, each containing the
     package's size, its description and the list of every file it put on
     the disk.  That is the whole thing.  removepkg reads that list. */
  function dbEntry(pk, loc) {
    const files = [];
    for (const f of pk.files) files.push(f.p.replace(/^\//, ""));
    if (pk.howto) for (const p of howtoFiles(pk)) files.push(p.replace(/^\//, ""));
    let unc = 0;
    for (const f of pk.files) unc += (f.sz || (f.d ? String(resolveText(f.d)).length : 1024));
    const L = [];
    L.push("PACKAGE NAME:     " + pk.n);
    L.push("COMPRESSED PACKAGE SIZE:     " + pk.k + " K");
    L.push("UNCOMPRESSED PACKAGE SIZE:     " + Math.max(1, Math.round(unc / 1024)) + " K");
    L.push("PACKAGE LOCATION: " + (loc || pkgPath(pk)));
    L.push("PACKAGE DESCRIPTION:");
    for (const line of pk.d) L.push(pk.n + ": " + line);
    L.push("FILE LIST:");
    L.push("./");
    for (const f of files.sort()) L.push(f);
    return L.join("\n") + "\n";
  }
  /* where on the CD the package came from, which pkgtool shows you */
  function pkgPath(pk) {
    if (pk.contrib) return "/cdrom/contrib/" + pk.n + ".tgz";
    const set = pk.set.toLowerCase();
    const idx = (PACKAGES.filter(p => p.set === pk.set).indexOf(pk) % 6) + 1;
    return "/cdrom/slakware/" + set + idx + "/" + pk.n + ".tgz";
  }

  /* the F series is the only package family whose contents are generated:
     the HOWTO library is split across howto1, howto2 and mini exactly the
     way the real disk set split it, so installing half of it gives you
     half of it. */
  function howtoFiles(pk) {
    const out = [];
    for (const name of Docs.all()) {
      const mini = name.startsWith("mini/");
      if (pk.howto === "mini" && !mini) continue;
      if (pk.howto !== "mini" && mini) continue;
      if (pk.howto === "A-M" && !/^[A-M]/.test(name)) continue;
      if (pk.howto === "N-Z" && !/^[N-Z]/.test(name)) continue;
      out.push("/usr/doc/faq/howto/" + name + ".gz");
    }
    return out;
  }

  /* ---- installing ------------------------------------------------------ */
  function put(f, owner) {
    if (f.dir) { Fs.mkdir(f.p, { pkg: owner, nolog: 1 }); return; }
    if (f.l) { Fs.symlink(f.p, f.l, { pkg: owner, nolog: 1 }); return; }
    if (f.dev) {
      Fs.write(f.p, "", { pkg: owner, mode: f.m, sz: 0, nolog: 1 });
      const n = Fs.lstat(f.p); n.dev = 1; n.blk = !!f.blk; n.sz = 0;
      return;
    }
    Fs.write(f.p, f.d === undefined ? "" : resolveText(f.d), {
      pkg: owner, mode: f.m, sz: f.sz, impl: f.impl || null,
      needs: f.needs || null, bin: !!f.bin, nolog: 1 });
  }

  function install(pk, opts) {
    opts = opts || {};
    Fs.begin();
    for (const f of pk.files) put(f, pk.n);
    if (pk.howto) {
      Fs.mkdir("/usr/doc/faq/howto", { pkg: pk.n, nolog: 1 });
      if (pk.howto === "mini") Fs.mkdir("/usr/doc/faq/howto/mini", { pkg: pk.n, nolog: 1 });
      for (const p of howtoFiles(pk)) {
        const name = p.replace("/usr/doc/faq/howto/", "").replace(/\.gz$/, "");
        const doc = Docs.get(name);
        Fs.write(p, doc ? doc.body : "", { pkg: pk.n, mode: 0o644,
          sz: doc ? Math.round(doc.body.length / 2.6) : 0, gz: 1, nolog: 1 });
        const n = Fs.lstat(p); if (n) n.gz = 1;
      }
      if (pk.howto === "A-M") {
        Fs.write("/usr/doc/faq/howto/INDEX", Docs.indexFile(),
          { pkg: pk.n, mode: 0o644, nolog: 1 });
      }
    }
    Fs.write("/var/log/packages/" + pk.n, dbEntry(pk, opts.loc), { pkg: null, mode: 0o644, nolog: 1 });
    Fs.end();
    const list = State.get("installed", []);
    if (list.indexOf(pk.n) < 0) { list.push(pk.n); State.set("installed", list); }
    return true;
  }

  /* ---- removing ------------------------------------------------------- */
  /* removepkg removes the files this package installed and nothing else.
     A file that also belongs to another installed package is skipped, and
     it says so.  Directories go only if they are empty afterwards.  This
     is the real behaviour and it is the structural test the exhibit is
     built to pass: remove the networking package and the networking
     commands stop existing, and nothing anywhere special-cases them. */
  function remove(name, log) {
    const pk = get(name);
    const dbPath = "/var/log/packages/" + name;
    const db = Fs.read(dbPath);
    if (!pk && !db) return { ok: false, err: "no such package" };
    let paths;
    if (db) {
      const i = db.indexOf("FILE LIST:");
      paths = db.slice(i + 10).split("\n").filter(s => s.length && s !== "./")
        .map(s => "/" + s.replace(/\/$/, ""));
    } else {
      paths = pk.files.map(f => f.p).concat(pk.howto ? howtoFiles(pk) : []);
    }
    /* which files are also claimed by another installed package */
    const others = new Set();
    const inst = State.get("installed", []).filter(n => n !== name);
    for (const n of inst) {
      const o = get(n); if (!o) continue;
      for (const f of o.files) others.add(Fs.norm(f.p));
      if (o.howto) for (const p of howtoFiles(o)) others.add(Fs.norm(p));
    }
    const dirs = [];
    let skipped = 0, gone = 0;
    Fs.begin();
    for (const p of paths) {
      const np = Fs.norm(p);
      if (others.has(np)) { skipped++; if (log) log("  --> " + np + " is shared with another package, skipping"); continue; }
      const n = Fs.lstat(np);
      if (!n) continue;
      if (n.t === "d") { dirs.push(np); continue; }
      Fs.nodes().delete(np); gone++;
      if (log) log("  --> Deleting " + np);
    }
    /* empty directories, deepest first */
    dirs.sort((a, b) => b.length - a.length);
    for (const d of dirs) {
      if (others.has(d)) { skipped++; continue; }
      if (Fs.list(d).length === 0) { Fs.nodes().delete(d); gone++; if (log) log("  --> Deleting empty directory " + d); }
      else if (log) log("  --> " + d + " is not empty, skipping");
    }
    Fs.nodes().delete(dbPath);
    Fs.end();
    /* and drop the same paths out of the overlay so a reload does not
       resurrect them */
    const ov = State.get("overlay", {});
    let changed = false;
    for (const p of paths) { const np = Fs.norm(p); if (ov[np] !== undefined) { delete ov[np]; changed = true; } }
    if (changed) State.set("overlay", ov);
    const list = State.get("installed", []).filter(n => n !== name);
    State.set("installed", list);
    return { ok: true, removed: gone, skipped };
  }

  function get(n) {
    return PACKAGES.find(p => p.n === n) ||
           CONTRIB.map(c => Object.assign({ set: "contrib", contrib: 1 }, c)).find(p => p.n === n) || null;
  }
  function bySet(id) { return PACKAGES.filter(p => p.set === id); }
  function isInstalled(n) { return State.get("installed", []).indexOf(n) >= 0; }
  function installedList() { return State.get("installed", []).slice(); }

  /* ---- rebuilding the whole filesystem from the package list ---------- */
  /* Called once at page load.  This is the module's contract with the rest
     of the exhibit: the disk is not stored, it is derived. */
  function rebuild() {
    Fs.clear();
    Fs.begin();
    const list = State.get("installed", []);
    /* aaa_base first if present, since everything assumes its directories */
    const ordered = list.slice().sort((a, b) => (a === "aaa_base" ? -1 : b === "aaa_base" ? 1 : 0));
    for (const n of ordered) { const pk = get(n); if (pk) { Fs.end(); install(pk); Fs.begin(); } }
    Fs.end();
    Disk.materialise();
    Fs.applyOverlay();
    if (typeof Kimg !== "undefined") Kimg.reattach();
  }

  return { SETS, PACKAGES, CONTRIB, SERVERS, TEXT, C,
           get, bySet, install, remove, isInstalled, installedList, rebuild,
           dbEntry, pkgPath, howtoFiles, resolveText,
           helpers: { B, SB, LIB, T, X, S, DIR, DEV } };
})();

SYNOPSIS
       startx [ [ client ] options ... ] [ -- [ server ] options ... ]

DESCRIPTION
       The startx script is a front end to xinit that provides a
       somewhat nicer user interface for running a single session of the
       X Window System.

       startx looks for ~/.xinitrc and uses it if it exists; otherwise
       it uses the system-wide xinitrc.  X exits when the last command
       in that file exits, which is why the window manager goes last and
       has no ampersand after it.

       startx is a shell script.  Read it.  It is about thirty lines and
       it explains the whole arrangement better than this manual page.

NAME
       xf86config - generate an XF86Config file

SYNOPSIS
       xf86config

DESCRIPTION
       xf86config is an interactive program that asks you a sequence of
       questions and writes an XF86Config file from your answers.  It
       asks about, in order: the mouse protocol and device, the
       keyboard, your monitor's horizontal sync and vertical refresh
       ranges, your video card and its chipset, how much video memory it
       has, and which modes you want at which colour depths.

       You are expected to know the answers.  In particular you are
       expected to know your monitor's sync ranges, which are in the
       manual that came with the monitor.

       WARNING:  it is possible to write a configuration that drives a
       monitor outside its specified ranges.  On some monitors this can
       cause permanent damage.  If you do not know your monitor's
       specifications, choose a conservative option.  The program will
       let you choose otherwise, because it has no way of knowing what
       is attached.

       If the result does not work, run it again, or edit the file it
       wrote, which is plain text.  There is no undo and there does not
       need to be, because nothing is written until the end.

NAME
       XF86Config - configuration file for XFree86

DESCRIPTION
       XF86Config is a plain text file read by the X server at startup.
       It is divided into sections:

       Files       the font path and the RGB database
       ServerFlags server options
       Keyboard    the keyboard
       Pointer     the mouse:  Protocol, Device, Emulate3Buttons
       Monitor     the monitor:  HorizSync, VertRefresh, and Modelines
       Device      the video card:  Chipset, VideoRam, Clocks
       Screen      which driver, which device, which monitor, and the
                   list of Modes at each Depth

       The Monitor section's HorizSync and VertRefresh lines are the
       specification of your physical monitor, in kHz and Hz.  The
       server uses them to decide which of the modes it knows about are
       safe to use, and it will refuse a mode that falls outside them.

       This is the safety mechanism, and it works, and it consists
       entirely of two numbers that you typed.

       Modelines describe timings directly and bypass that check when
       the ranges are set wide enough to admit them.  Do not write them
       by hand from a formula you found in a posting.  Use the modes the
       server already knows, and set your sync ranges honestly, and

  T["DOC:XREADMEcirrus"] = `
        README.cirrus -- XFree86 3.3.1 support for Cirrus Logic chips
        ============================================================

  The SVGA server supports the following Cirrus Logic chipsets:

        GD5420, GD5422, GD5424, GD5426, GD5428, GD5429
        GD5430, GD5434, GD5436, GD5440, GD5446
        GD6205, GD6215, GD6225, GD6235 (laptop chips)
        GD7541, GD7542, GD7543, GD7548 (laptop chips)

  Use the chipset name "cirrus" in the Device section, or let the server
  probe:  it identifies these reliably.

  Notes for the GD543x family:

  o  The maximum dot clock is chip and memory dependent.  With 2 MB of
     memory a GD5434 will do 1024x768 at 8 bits per pixel comfortably,
     800x600 at 16 bits, and 640x480 at 24 bits.

  o  1280x1024 is not usable on this family in 8bpp at any refresh rate
     worth having, and attempting it produces a picture with visible
     tearing.  It is not a configuration problem.

  o  Some boards have a jumper or BIOS setting for the memory clock.
     Cards set for the lower speed will drop pixels at the higher
     resolutions.

  o  If the display is stable but very slow, check the log: the server
     may have fallen back to unaccelerated code because it did not
     recognise the board revision.
`;

  T["DOC:glibcnote"] = `
        glibc 2.0.5c on Slackware 3.4 -- READ THIS FIRST
        ================================================

  This is GNU libc 2.0.5c.  It is not what this distribution is built
  on.  Slackware 3.4 is a libc5 system:  every binary in every disk set
  is linked against libc.so.5, which is version 5.4.33.

  glibc is better.  It is more standards-conformant, it is thread-safe,
  it has proper NSS, and it is where everything is going.  It is also,
  right now, a different C library, and a machine with two C libraries
  on it is a machine where you have to know which one every program is
  using.

  If you install this you are volunteering for a project.  You will
  need a second set of compiler wrappers, you will need to keep your
  include directories separate, and you will find programs that build
  against one and link against the other and fail in ways that are not
  obviously about the library at all.

  It is here because people asked for it and because in a year or two
  this note will be the other way around.
`;

  T["DOC:LinuxFAQ"] = `
                    The Linux Frequently Asked Questions
                              with Answers
                          v3.11, 2 October 1997

  Q1.1  What is Linux?

  Linux is a free Unix-like operating system kernel, written by Linus
  Torvalds and a large number of other people.  A Linux distribution is
  that kernel plus the GNU tools, the X Window System, and everything
  else that makes a usable system, packaged by somebody.

  Q1.4  Is Linux free?

  Yes.  It is distributed under the GNU General Public License, which
  means you may use it, copy it, modify it and sell it, provided you
  pass on the same rights and the source code.

  Q2.3  Why does my machine say "VFS: Unable to mount root fs"?

  The kernel booted and cannot read the filesystem your root partition
  is on, either because the driver for the disk controller is not in
  the kernel or because support for the filesystem type is not.  Both
  of those must be compiled in, not modular, because the kernel has to
  read the disk before it can load a module off it.

  Q3.1  I typed vi and now I cannot get out.

  Press ESC, then type :q! and press Enter.

  Q4.2  How do I find out what is using all my memory?

  Run free.  Then note that the buffers figure is disk cache, which the
  kernel will give back the moment anything needs it, and that a Unix
  system with free memory is a Unix system wasting memory.  You are
  probably fine.

  Q5.5  Something does not work.  What should I do?

  Read the HOWTO whose name matches your problem.  It is in
  /usr/doc/faq/howto and it was written by somebody who had your
  problem and solved it.  If that does not answer it, read the manual
  page.  If that does not answer it, read the source, which is on the
  disk.  If that does not answer it, ask on the newsgroup, and say what
  hardware you have and what you typed and what it printed.

  Q7.1  Will Linux ever be ready for ordinary users?

  This question is asked several times a week and the answers it gets
  are not useful, because the people answering it are not ordinary
  users and stopped being able to remember what one needs some years
  ago.
`;

  T["SRC:kreadme"] = `	Linux kernel release 2.0.30

These are the release notes for Linux version 2.0.  Read them carefully,
as they tell you what this is all about, explain how to install the
kernel, and what to do if something goes wrong.

WHAT IS LINUX?

  Linux is a Unix clone written from scratch by Linus Torvalds with
  assistance from a loosely-knit team of hackers across the Net.  It
  aims towards POSIX compliance.

INSTALLING the kernel:

 - If you install the full sources, do a

		cd /usr/src
		gzip -cd linux-2.0.30.tar.gz | tar xvf -

 - Make sure you have no stale .o files and dependencies lying around:

		cd /usr/src/linux
		make mrproper

CONFIGURING the kernel:

 - Do a "make config" to configure the basic kernel.  "make config" is
   a series of questions; "make menuconfig" is the same questions in a
   navigable menu and is what you want.

 - Every question has help.  The help was written by the person who
   wrote the driver.

COMPILING the kernel:

 - Make sure you have gcc 2.7.2 available.

 - Do a "make zImage" to create a compressed kernel image.

 - If you configured any of the parts of the kernel as modules, you
   will also have to do "make modules" followed by "make modules_install".

 - In order to boot your new kernel, you'll need to copy the kernel
   image to the place where your regular bootable kernel is found.

 - IF YOU USE LILO, RUN LILO AFTERWARDS.  Copying the image is not
   enough.  This catches everybody once.

IF SOMETHING GOES WRONG:

 - If you have problems that seem to be due to kernel bugs, please mail
   them to the person who is responsible.  You can find out who that is
   by looking in the MAINTAINERS file.
`;

This is the Linux sound driver (also known as the Voxware driver or

IMPORTANT: In this kernel series the low-level card drivers are

/* ==========================================================================
   MODULE 7 — THE DISK, THE PARTITION TABLE AND WHAT IS MOUNTED
   --------------------------------------------------------------------------
   A 1.6 GB SCSI disk with one DOS partition already on it, put there by
   the previous owner, and 1.4 GB of unallocated space.  fdisk edits this
   table, and it has no undo, and nothing is written until w.

   The DOS partition is not decoration.  It holds the previous owner's
   things, including the manual for the monitor currently attached to this
   machine, and it is mountable, and nothing anywhere points at it.
   ========================================================================== */
const Disk = (() => {
  const HEADS = 16, SECT = 63, CYLS = 3291;
  const CYLBLOCKS = Math.floor(HEADS * SECT / 2);          /* 1K blocks per cylinder */
  const TYPES = {
    "00": "Empty", "01": "DOS 12-bit FAT", "04": "DOS 16-bit <32M",
    "05": "Extended", "06": "DOS 16-bit >=32M", "07": "OS/2 HPFS",
    "0a": "OS/2 Boot Manag", "0b": "Win95 FAT32", "0c": "Win95 FAT32 (LBA)",
    "0e": "Win95 FAT16 (LBA)", "0f": "Win95 Extended (LBA)",
    "40": "Venix 80286", "51": "Novell?", "52": "Microport",
    "63": "GNU HURD", "64": "Novell Netware", "65": "Novell Netware",
    "75": "PC/IX", "80": "Old MINIX", "81": "Linux/MINIX",
    "82": "Linux swap", "83": "Linux native", "85": "Linux extended",
    "93": "Amoeba", "94": "Amoeba BBT", "a5": "BSD/386",
    "a6": "OpenBSD", "b7": "BSDI fs", "b8": "BSDI swap",
    "c7": "Syrinx", "db": "CP/M", "e1": "DOS access",
    "e3": "DOS R/O", "f2": "DOS secondary", "ff": "BBT"
  };

  const FRESH = [
    { dev: "sda1", boot: 0, begin: 1, start: 1, end: 406, id: "06", fmt: "msdos" }
  ];

  function parts() { return State.get("parts", JSON.parse(JSON.stringify(FRESH))); }
  function setParts(p) { State.set("parts", p); }
  function blocksOf(p) { return (p.end - p.start + 1) * CYLBLOCKS; }
  function typeName(id) { return TYPES[id] || "Unknown"; }
  function used() {
    const out = [];
    for (const p of parts().slice().sort((a, b) => a.start - b.start)) out.push([p.start, p.end]);
    return out;
  }
  /* the free cylinder ranges, which fdisk offers as defaults */
  function freeRanges() {
    const u = used(), out = [];
    let c = 1;
    for (const [s, e] of u) { if (s > c) out.push([c, s - 1]); c = Math.max(c, e + 1); }
    if (c <= CYLS) out.push([c, CYLS]);

  function byDev(dev) { return parts().find(p => p.dev === dev) || null; }

  const VOLUMES = { msdos: dosVolume, iso9660: cdVolume };
  /* the floppy in the drive, whatever the visitor last put there */
  function floppyVolume() {
    const kind = State.get("floppy", null);
    if (!kind) return null;
    if (kind.kind === "boot") return { "vmlinuz": null, "ldlinux.sys": null };
    return {};
  }

  function materialise() {
    Fs.begin();
    for (const m of mounts()) {
      let vol = null;
      if (m.type === "msdos" && m.dev === "/dev/sda1") vol = dosVolume();
      else if (m.type === "iso9660") vol = cdVolume();
      else if (m.type === "ext2" && m.dev === "/dev/fd0") vol = floppyVolume() || {};
      if (!vol) continue;
      Fs.mkdir(m.dir, { pkg: "\u0000mount" });
      for (const rel in vol) {
        const p = m.dir === "/" ? "/" + rel : m.dir + "/" + rel;
        if (vol[rel] === null) Fs.write(p, "", { pkg: "\u0000mount", mode: 0o444, sz: irnd(24576, 1400000) });
        else Fs.write(p, vol[rel], { pkg: "\u0000mount", mode: m.type === "iso9660" ? 0o444 : 0o755 });
      }
    }
    Fs.end();
  }

  function mount(dev, dir, type) {
    dir = Fs.norm(dir);
    const list = mounts();
    if (list.some(m => m.dir === dir)) return { err: "already mounted" };
    list.push({ dev, dir, type });
    setMounts(list);
    materialise();
    return { ok: 1 };
  }
  function umount(what) {
    const list = mounts();
    const i = list.findIndex(m => m.dir === Fs.norm(what) || m.dev === what);
    if (i < 0) return { err: "not mounted" };
    const m = list[i];
    /* take the volume's files back out of the filesystem */
    Fs.begin();
    for (const p of Fs.walk(m.dir)) {
      const n = Fs.lstat(p);
      if (n && n.pkg === "\u0000mount" && p !== m.dir) Fs.nodes().delete(p);
    }
    Fs.end();
    list.splice(i, 1);
    setMounts(list);
    return { ok: 1, m };
  }

  /* ---- /proc, which is generated and not stored ----------------------- */
  function proc(path) {
    const boot = State.get("bootTime", Clock.now().getTime());
    const up = Math.max(1, Math.round((Clock.now().getTime() - boot) / 1000));
    const K = Kernel.running();
    switch (path) {
      case "/proc/version":
        return "Linux version " + K.ver + " (" + K.builder + "@" + K.host + ") (gcc version 2.7.2.3) #" +
          K.build + " " + K.date + "\n";
      case "/proc/cpuinfo":
        return "processor\t: 0\ncpu\t\t: 586\nmodel\t\t: Pentium 75 - 200\nvendor_id\t: GenuineIntel\n" +
          "stepping\t: 12\nfdiv_bug\t: no\nhlt_bug\t\t: no\nf00f_bug\t: yes\nfpu\t\t: yes\n" +
          "fpu_exception\t: yes\ncpuid\t\t: yes\nwp\t\t: yes\n" +
          "flags\t\t: fpu vme de pse tsc msr mce cx8\nbogomips\t: 52.94\n";
      case "/proc/meminfo": {

          padl(3400 * 1024, 9) + padl(buf * 1024, 9) + padl(cch * 1024, 9) + "\n" +
          "Swap: " + padl(sw * 1024, 9) + padl(0, 9) + padl(sw * 1024, 9) + "\n" +
          "MemTotal:  " + padl(tot, 7) + " kB\nMemFree:   " + padl(free, 7) + " kB\n" +

          "Cached:    " + padl(cch, 7) + " kB\nSwapTotal: " + padl(sw, 7) + " kB\n" +

      case "/proc/loadavg":

      case "/proc/filesystems":
        return "\text2\n\tiso9660\nnodev\tproc\nnodev\tpipefs\n" +
          (Fs.exists("/lib/modules/2.0.30/fs/msdos.o") && State.get("modules", []).indexOf("msdos") >= 0 ? "\tmsdos\n" : "") +
          "\tminix\n";
      case "/proc/mounts":

          (mounts().length ? "\n" : "");
      case "/proc/swaps": {

          (sw ? padr("/dev/" + sw.dev, 32) + "partition\t" + blocksOf(sw) + "\t0\t-1\n" : "");
      }
      case "/proc/interrupts": {

        L.push("  2:  " + padl(0, 9) + "  cascade");
        if (Hw.net.ok()) L.push(" " + padl(Hw.jumpers().netIrq, 2) + ":  " + padl(irnd(40, 900), 9) + "  ne");
        const sk = Hw.sound.configured();
        if (sk && Hw.sound.working()) L.push("  " + Hw.jumpers().sndIrq + ":  " + padl(irnd(0, 40), 9) + "  soundblaster");
        else if (sk) L.push("  " + sk.irq + ":  " + padl(0, 9) + "  soundblaster");
        L.push("  6:  " + padl(irnd(2, 30), 9) + "  floppy");
        L.push("  " + Hw.M.scsiIrq + ":  " + padl(irnd(4000, 20000), 9) + "  aha1542");
        L.push(" 13:  " + padl(1, 9) + "  fpu");
        return L.join("\n") + "\n";
      }
      case "/proc/ioports": {
        const L = ["0000-001f : dma1", "0020-003f : pic1", "0040-005f : timer",
          "0060-006f : keyboard", "0070-007f : rtc", "0080-008f : dma page reg",
          "00a0-00bf : pic2", "00c0-00df : dma2", "00f0-00ff : fpu"];
        if (Hw.net.ok()) L.push(Hw.jumpers().netIo.replace("0x", "0") + "-" + "031f : ne");

        L.push("03c0-03df : vga+");
        L.push("03f0-03f5 : floppy");

          "Block devices:\n  2 fd\n  8 sd\n 11 sr\n";
      case "/proc/modules": {

        return m.map(n => padr(n, 20) + padl(irnd(2, 22), 6) + "  " + irnd(0, 2)).join("\n") + (m.length ? "\n" : "");
      }
      case "/proc/scsi/scsi":

          "  Vendor: VANTAGE  Model: CDR-800S         Rev: 2.0e\n" +
          "  Type:   CD-ROM                           ANSI SCSI revision: 02\n";
      case "/proc/partitions": {

        L.push("   8     0    1658880 sda");
