/* ==========================================================================
   MODULE 16 — THE MUSEUM'S OWN BOOKKEEPING
   --------------------------------------------------------------------------
   Separable from the simulation: it records what the visitor has done so
   the guide can talk about it, and it owns the two things the machine
   cannot do for itself -- the front-panel reset button, and a label
   floating over the screen when the monitor is being driven out of range.
   ========================================================================== */
const Museum = (() => {
  let locked = false;
  function notes() { return State.get("notes", []); }
  function note(tag) {
    const n = notes();
    if (n.indexOf(tag) < 0) { n.push(tag); State.set("notes", n); }
    if (typeof Guide !== "undefined" && Guide.refresh) Guide.refresh();
  }
  function did(tag) { return notes().some(t => t === tag || t.startsWith(tag + ":")); }
  function detail(tag) {
    const hit = notes().find(t => t.startsWith(tag + ":"));
    return hit ? hit.slice(tag.length + 1) : null;
  }
  function fast() { return State.get("fast", false); }
  function banner(text) {
    let b = $("#musbanner");
    if (!text) { if (b) b.remove(); return; }
    if (!b) {
      b = el("div", { id: "musbanner", style: { position: "absolute", left: "0", right: "0",
        bottom: "0", zIndex: "700", background: "#3a0f0fdd", color: "#ffd7d7",
        font: "12px/1.5 system-ui,sans-serif", padding: "7px 12px", textAlign: "center",
        pointerEvents: "none", borderTop: "1px solid #ff8f8f" } });
      $("#screen").appendChild(b);
    }
    b.textContent = text;
  }
  function lockup(why) {
    locked = true;
    Con.allow(false);
    banner("The machine has stopped responding. " + why + "  —  use Reset in the rail above.");
    Sound.beep(120, 900);
  }
  function isLocked() { return locked; }
  function unlock() { locked = false; banner(null); }
  return { note, did, detail, notes, fast, banner, lockup, isLocked, unlock };
})();

/* ==========================================================================
   MODULE 17 — THE BOOT MANAGER
   --------------------------------------------------------------------------
   POST, then LILO, then the kernel's messages, then /etc/rc.d/rc.S and
   rc.M -- which are really executed, through the shell, so that editing
   them changes what happens on the next boot.  Then a login prompt on a
   black screen that congratulates nobody.
   ========================================================================== */
const Boot = (() => {
  let booting = false;

  /* ---- the BIOS ---- */
  async function post(tty) {
    const vt = tty.vt;
    vt.clear(A_NORM);
    tty.cursor(false);
    const M = Hw.M;
    vt.put(0, 0, M.bios + "  Copyright (C) 1985-1997, Meridian Microsystems, Inc.", A_NORM);
    vt.put(0, 2, "MER-586HX  " + M.biosDate, A_NORM);
    await tty.pause(500, false);
    vt.put(0, 4, "Main Processor    : " + M.cpu, A_NORM);
    await tty.pause(260, false);
    vt.put(0, 5, "Memory Test       :", A_NORM);
    const total = M.ram * 1024;
    for (let k = 0; k <= total; k += 2048) {
      vt.put(20, 5, padl(Math.min(k, total), 7) + "K OK", A_NORM);
      vt.touch();
      await sleep(Museum.fast() ? 1 : 22);
    }
    Sound.beep(1000, 70);
    await tty.pause(300, false);
    vt.put(0, 7, "Memory Type       : EDO DRAM", A_NORM);
    vt.put(0, 8, "Cache Memory      : " + M.cache + "K, Enabled", A_NORM);
    await tty.pause(400, false);
    vt.put(0, 10, "Floppy Drive A    : " + M.floppy, A_NORM);
    vt.put(0, 11, "Floppy Drive B    : None", A_NORM);
    /* the IDE probe, which finds nothing, which is the first clue */
    vt.put(0, 12, "Primary Master    : None", A_NORM);
    Sound.chatter(200);
    await tty.pause(700, false);
    vt.put(0, 13, "Primary Slave     : None", A_NORM);
    await tty.pause(400, false);
    vt.put(0, 14, "Secondary Master  : None", A_NORM);
    vt.put(0, 15, "Secondary Slave   : None", A_NORM);
    await tty.pause(500, false);
    vt.put(0, 17, "Serial Port(s)    : 3F8 2F8", A_NORM);
    vt.put(0, 18, "Parallel Port(s)  : 378", A_NORM);
    vt.put(0, 19, "Display Type      : EGA/VGA", A_NORM);
    await tty.pause(700, false);
    /* the SCSI card's own BIOS, which is where the disk actually is */
    vt.clear(A_NORM);
    vt.put(0, 0, "Adaptec AHA-1542CF BIOS v2.11", A_BOLD);
    vt.put(0, 1, "(c) 1996 Adaptec, Inc.  All Rights Reserved.", A_NORM);
    vt.put(0, 3, "BIOS Address: " + M.scsiBios + "   IRQ: " + M.scsiIrq + "   DMA: " + M.scsiDma, A_NORM);
    await tty.pause(600, false);
    vt.put(0, 5, "Scanning SCSI bus ...", A_NORM);
    Sound.seek(5);
    await tty.pause(900, false);
    vt.put(0, 7, "  ID 0  : " + padr(M.disk.model, 18) + "Hard Disk", A_NORM);
    await tty.pause(500, false);
    vt.put(0, 8, "  ID 4  : " + padr(M.cdrom.model, 18) + "CD-ROM  " + M.cdrom.speed, A_NORM);
    await tty.pause(700, false);
    vt.put(0, 10, "  Press <Ctrl><A> for SCSISelect(TM) Utility", A_DIM);
    await tty.pause(800, false);
    vt.put(0, 12, "Boot device: SCSI ID 0", A_NORM);
    await tty.pause(600, false);
    vt.clear(A_NORM);
  }

  /* ---- the kernel's own boot messages, generated from this machine ---- */
  function dmesg(opts) {
    opts = opts || {};
    const K = Kernel.running();
    const L = [];
    const mem = Hw.M.ram * 1024;
    L.push("Memory: " + (mem - 6100) + "k/" + mem + "k available (708k kernel code, 384k reserved, 1024k data)");
    L.push("Console: 16 point font, 400 scans");
    L.push("Console: colour VGA+ 80x25, 1 virtual console (max 63)");
    L.push("pcibios_init : BIOS32 Service Directory structure at 0x000fdb40");
    L.push("pcibios_init : BIOS32 Service Directory entry at 0xfdb50");
    L.push("pcibios_init : PCI BIOS revision 2.10 entry at 0xfdba1");
    L.push("Probing PCI hardware.");
    L.push("Calibrating delay loop.. ok - 52.94 BogoMIPS");
    L.push("Memory: " + (mem - 6100) + "k/" + mem + "k available");
    L.push("This processor honours the WP bit even when in supervisor mode. Good.");
    L.push("Swansea University Computer Society NET3.035 for Linux 2.0");
    L.push("IP Protocols: ICMP, UDP, TCP");
    L.push("VFS: Diskquotas version dquot_5.6.0 initialized");
    L.push("Checking 386/387 coupling... Ok, fpu using exception 16 error reporting.");
    L.push("Checking 'hlt' instruction... Ok.");
    L.push("Linux version " + K.ver + " (" + K.builder + "@" + K.host + ") (gcc version 2.7.2.3) #" +
      K.build + " " + K.date);
    L.push("Starting kswapd v 1.4.2.2");
    L.push("Serial driver version 4.13 with no serial options enabled");
    L.push("tty00 at 0x03f8 (irq = 4) is a 16550A");
    L.push("tty01 at 0x02f8 (irq = 3) is a 16550A");
    if (!K.custom || K.opts.printer) L.push("lp1 at 0x0378, (polling)");
    L.push("Real Time Clock Driver v1.07");
    L.push("Ramdisk driver initialized : 16 ramdisks of 4096K size");
    L.push("hda: probing for IDE devices");
    if (!K.custom || K.opts.ide !== false) L.push("ide0: ports already in use, IDE side-channel not probed");
    L.push("Floppy drive(s): fd0 is 1.44M");
    L.push("FDC 0 is a post-1991 82077");
    /* the SCSI adapter, which is the whole first puzzle */
    if (!K.custom || K.opts.scsi) {
      L.push("aha1542.c: Detecting Adaptec 1542 at port 0x330");
      L.push("aha1542.c: Configuring Adaptec (SCSI-ID " + 7 + ") at IO:330, IRQ " +
        Hw.M.scsiIrq + ", DMA priority " + Hw.M.scsiDma);
      L.push("scsi0 : Adaptec 1542");
      L.push("scsi : 1 host.");
      L.push("  Vendor: VANTAGE   Model: " + Hw.M.disk.model + "     Rev: 1.14");
      L.push("  Type:   Direct-Access                      ANSI SCSI revision: 02");
      L.push("Detected scsi disk sda at scsi0, channel 0, id 0, lun 0");
      L.push("  Vendor: VANTAGE   Model: " + Hw.M.cdrom.model + "     Rev: 2.0e");
      L.push("  Type:   CD-ROM                             ANSI SCSI revision: 02");
      L.push("Detected scsi CD-ROM sr0 at scsi0, channel 0, id 4, lun 0");
      L.push("SCSI device sda: hdwr sector= 512 bytes. Sectors= 3399040 [1659 MB] [1.7 GB]");
      const parts = Disk.parts().slice().sort((a, b) => a.start - b.start);
      L.push("Partition check:");
      L.push(" sda: " + parts.map(p => p.dev).join(" "));
      L.push("sr0: scsi3-mmc drive: 8x/8x cd/rw xa/form2 cdda tray");
    } else {
      L.push("scsi : 0 hosts.");
      L.push("scsi : detected no SCSI disks or CD-ROMs.");
    }
    /* sound, if it was compiled in, which is the only way it works */
    if (K.custom && K.sound) {
      L.push("Sound initialization started");
      const j = Hw.jumpers();
      const match = K.sound.io === j.sndBase && Number(K.sound.irq) === Number(j.sndIrq) &&
                    Number(K.sound.dma) === Number(j.sndDma);
      if (Hw.sound.conflict() === "irq11-scsi") {
        L.push("sb: IRQ " + K.sound.irq + " is in use by another device");
        L.push("sb: SoundBlaster 16 initialization failed");
      } else if (!match) {
        L.push("sb: No SoundBlaster found at 0x" + String(K.sound.io).replace("0x", "") +
          " (irq " + K.sound.irq + ", dma " + K.sound.dma + ")");
      } else {
        L.push("<SoundBlaster 16 (4.13)> at " + K.sound.io + " irq " + K.sound.irq +
          " dma " + K.sound.dma + "," + K.sound.dma16);
        L.push("<SoundBlaster 16 MIDI> at 0x330");
        L.push("<Yamaha OPL3 FM> at 0x388");
      }
      L.push("Sound initialization complete");
    }
    /* the plug and play device nobody has a driver for */
    L.push("isapnp: Scanning for Pnp cards...");
    L.push("isapnp: Card '" + Hw.M.winmodem.board + "' at 0x220, no driver claimed it");
    L.push("VFS: Mounted root (ext2 filesystem) readonly.");
    return L.join("\n");
  }

  /* ---- LILO ---- */
  async function lilo(tty) {
    const conf = State.get("lilo", null);
    const vt = tty.vt;
    if (!conf) {
      /* nothing in the boot sector */
      vt.clear(A_NORM);
      tty.outln("");
      tty.outln("No operating system found.");
      tty.outln("");
      tty.outln("(there is a partition table on this disk and nothing in the master boot");
      tty.outln(" record.  Boot the installation floppies and run liloconfig, or make a");
      tty.outln(" boot floppy, which is what the installer asked you to do.)");
      return null;
    }
    tty.out("L");
    await tty.pause(120, false);
    tty.out("I");
    await tty.pause(120, false);
    /* the check that catches everybody exactly once: the blocks lilo
       recorded are not where the kernel is any more */
    for (const m of conf.maps) {
      if (!m.image) continue;
      const n = Fs.stat(m.image);
      if (!n) {
        tty.out("L");
        await tty.pause(200, false);
        tty.outln("-");
        tty.outln("");
        Museum.note("lilo-stale");
        return { fail: "gone", label: m.label };
      }
      const cur = n.kid || (Kimg.get(m.image) ? Kimg.get(m.image).kid : null);
      if (m.kid && cur !== m.kid) {
        tty.out("L");
        await tty.pause(240, false);
        tty.outln("-");
        tty.outln("");
        Museum.note("lilo-stale");
        return { fail: "stale", label: m.label };
      }
    }
    tty.out("LO");
    await tty.pause(300, false);
    tty.outln("");
    const msg = readFileText("/boot/boot_message.txt");
    if (msg) tty.out(msg);
    if (!conf.prompt) return { label: conf.def };
    let typed = "";
    let secs = conf.timeout > 0 ? conf.timeout / 10 : 0;
    tty.out("boot: ");
    const startX = vt.cx, startY = vt.cy;
    for (;;) {
      const k = await Promise.race([tty.key(), sleep(conf.timeout > 0 ? 1000 : 3600000).then(() => null)]);
      if (k === null) {
        if (conf.timeout > 0) { secs--; if (secs <= 0) break; }
        continue;
      }
      secs = -1;                     /* any key cancels the timeout, as it did */
      if (k.name === "Enter") break;
      if (k.name === "Tab") {
        tty.outln("");
        tty.outln(conf.maps.map(m => m.label).join("  "));
        tty.out("boot: " + typed);
        continue;
      }
      if (k.name === "Backspace") { if (typed.length) { typed = typed.slice(0, -1); vt.cx--; vt.put(vt.cx, vt.cy, " ", A_NORM); vt.touch(); } continue; }
      if (k.ch && k.ch.length === 1 && k.ch >= " ") { typed += k.ch; tty.out(k.ch); }
    }
    tty.outln("");
    const words = typed.trim().split(/\s+/).filter(s => s.length);
    const label = words.length ? words[0] : conf.def;
    const m = conf.maps.find(x => x.label === label);
    if (!m) {
      tty.outln("");
      return { fail: "nolabel", label };
    }
    return { label, args: words.slice(1), map: m };
  }

  /* ---- booting the floppy in the drive, which is how you get back in -- */
  async function floppyBoot(tty) {
    const lab = State.get("floppyLabel", null);
    const disks = State.get("floppies", []);
    let fl = disks.find(x => x.label === lab) || null;
    if (fl && fl.kind === "boot") fl = Object.assign({}, fl, State.get("floppy", {}) || {}, { kind: "boot" });
    Sound.floppyOn(2200); Sound.seek(18);
    tty.outln("");
    await tty.pause(1800, false);
    if (!fl) {
      tty.outln("Boot failed: not a bootable disk");
      tty.outln("");
      tty.outln("(there is a floppy in the drive and it is not bootable.  The BIOS tries");
      tty.outln(" A: before C:, which is also why leaving the installation disk in the");
      tty.outln(" drive stops the machine booting from the hard disk.)");
      return null;
    }
    if (fl.kind === "bootkernel") return { installer: 1, image: fl.image };
    if (fl.kind === "rootdisk") {
      tty.outln("Boot failed: not a bootable disk");
      tty.outln("");
      tty.outln("(this is the root/install disk.  It is a filesystem, not a kernel.  The");
      tty.outln(" bootkernel disk boots and then asks for this one.)");
      return null;
    }
    tty.out("Loading " + Fs.baseOf(fl.kernel || "vmlinuz") + "...");
    await tty.pause(1400, false);
    tty.outln("");
    Museum.note("floppy-rescue");
    return { label: "floppy", map: { image: fl.kernel, root: fl.root },
             kmeta: fl.kmeta || null, floppy: 1 };
  }

  /* ---- the whole sequence ---- */
  async function power() {
    if (booting) return;
    booting = true;
    Con.allow(false);
    Con.reset();
    Museum.unlock();
    Screen.textMode();
    Con.show(1);
    const tty = new Tty(Con.console0());
    await post(tty);
    /* A: before C: */
    let boot = null;
    if (State.get("floppyIn", false)) boot = await floppyBoot(tty);
    if (boot && boot.installer) { booting = false; return Installer.run(tty, boot); }
    if (!boot) {
      if (!State.get("installed", []).length) {
        /* No Linux on the disk yet.  The previous owner's DOS partition is
           still there and still bootable, and that is where you make the
           boot floppies, with RAWRITE off the CD, as everybody did. */
        const dos = Disk.dosPart();
        if (dos && !State.get("dosGone", false)) {
          booting = false;
          Museum.note("bare-machine");
          return Dos.run(tty);
        }
        tty.clear(A_NORM);
        tty.outln("");
        tty.outln("Non-System disk or disk error");
        tty.outln("Replace and strike any key when ready");
        tty.outln("");
        tty.outln("");
        tty.outln("(the DOS partition has been deleted and there is no operating system on");
        tty.outln(" this disk.  You need a boot floppy, and the machine that could write");
        tty.outln(" one for you was this one.  Reformat from the rail above.)");
        Con.allow(false);
        booting = false;
        Museum.note("no-way-in");
        return;
      }
      boot = await lilo(tty);
    }
    if (!boot) { booting = false; Con.allow(false); return; }
    if (boot.fail) {
      if (boot.fail === "stale" || boot.fail === "gone") {
        tty.outln("");
        tty.outln("(LILO printed LIL and stopped.  It has a list of block addresses in the");
        tty.outln(" boot sector, and the kernel is not in those blocks any more, because it");
        tty.outln(" was replaced and lilo was not run afterwards.");
        tty.outln("");
        tty.outln(" This is the moment the boot floppy the installer asked you to make");
        tty.outln(" becomes the only way back in.  Use the rail above.)");
        Museum.note("lilo-forgotten");
      } else {
        tty.outln("");
        tty.outln("(no such label.  Press Tab at the boot prompt to see the ones there are.)");
        await tty.pause(2000);
        booting = false;
        return power();
      }
      Con.allow(false);
      booting = false;
      return;
    }
    /* load the kernel that lilo actually points at */
    const img = boot.map ? boot.map.image : "/vmlinuz";
    /* a boot floppy holds a copy of the kernel as it was when the disk was
       written.  Building a new one and copying it to /vmlinuz does not
       change what is on the floppy, which is the whole reason the floppy
       is any use in this situation. */
    const km = boot.floppy ? boot.kmeta : (img ? Kernel.imageAt(img) : null);
    Kernel.set(km || Kernel.stock());
    /* the sound driver's idea of the card is fixed when the kernel is
       compiled, so it belongs to the kernel now running and not to the
       machine.  Boot a kernel without it and the card is a piece of ISA
       card again. */
    State.set("sndKernel", Kernel.running().sound || null);
    tty.out("Loading " + (boot.label || "linux") + ".");
    for (let i = 0; i < 12; i++) { await tty.pause(90, false); tty.out("."); }
    tty.outln("");
    Sound.chatter(600);
    /* the kernel's messages */
    const K = Kernel.running();
    const dm = dmesg();
    State.set("dmesg", dm + "\n");
    await tty.type(dm, Museum.fast() ? 0 : 26);
    /* the panics */
    if (K.custom && K.opts && K.opts.scsi === false) {
      tty.outln("");
      tty.outln("VFS: Cannot open root device 08:03");
      tty.outln("Kernel panic: VFS: Unable to mount root fs on 08:03");
      tty.outln("");
      tty.outln("(you built a kernel without the driver for the controller the disk is on.");
      tty.outln(" It cannot read the disk, so it cannot load a module off the disk to read");
      tty.outln(" the disk.  This is why that driver has to be Y and not M.)");
      Museum.note("panic-scsi");
      Con.allow(false);
      booting = false;
      return;
    }
    if (K.custom && K.opts && K.opts.ext2 === false) {
      tty.outln("");
      tty.outln("VFS: Unable to mount root fs on 08:03");
      tty.outln("Kernel panic: No init found.  Try passing init= option to kernel.");
      Museum.note("panic-ext2");
      Con.allow(false);
      booting = false;
      return;
    }
    if (K.custom && K.opts && K.opts.elf === false) {
      tty.outln("");
      tty.outln("Warning: unable to open an initial console.");
      tty.outln("Kernel panic: No init found.  Try passing init= option to kernel.");
      tty.outln("");
      tty.outln("(ELF binary support is off.  Every program on this system is ELF,");
      tty.outln(" including /sbin/init.)");
      Museum.note("panic-elf");
      Con.allow(false);
      booting = false;
      return;
    }
    State.set("bootTime", Clock.now().getTime());
    State.set("bootCount", State.get("bootCount", 0) + 1);
    /* rc.S sets the hostname from /etc/HOSTNAME, which is a file */
    const hn = readFileText("/etc/HOSTNAME");
    if (hn && hn.trim().length) {
      State.set("hostname", hn.trim().split(".")[0]);
      const dm = hn.trim().split(".").slice(1).join(".");
      if (dm.length) State.set("domain", dm);
    }
    State.set("modules", []);
    State.set("daemons", []);
    State.set("mounts", []);
    State.set("loUp", false);
    State.set("net", null);
    State.set("defaultRoute", null);
    State.set("pppUp", false);
    State.set("neLoaded", null);
    State.set("swapOn", false);
    Disk.setMounts([]);
    /* single user, if that is what was asked for */
    const single = (boot.args || []).some(a => a === "single" || a === "1" || a === "-s");
    tty.outln("");
    tty.outln("INIT: version 2.69 booting");
    await tty.pause(400);
    await runRc(tty, "/etc/rc.d/rc.S");
    if (single) {
      tty.outln("");
      tty.outln("INIT: Entering runlevel: 1");
      await runRc(tty, "/etc/rc.d/rc.K");
      Con.allow(false);
      booting = false;
      const sh = new Shell(tty, { cwd: "/" });
      sh.noProfile = true;
      State.set("curuser", "root");
      tty.outln("Give root password for maintenance");
      tty.outln("(or type Control-D for normal startup):");
      await tty.line({ echo: false });
      tty.outln("");
      tty.outln("Entering System Maintenance Mode");
      tty.outln("");
      await sh.loop();
      return power();
    }
    tty.outln("INIT: Entering runlevel: 3");
    await runRc(tty, "/etc/rc.d/rc.M");
    booting = false;
    Con.allow(true);
    Con.lamp();
    /* six login prompts, and the visitor lands on the first */
    for (let i = 1; i <= 6; i++) getty(i);
  }

  /* the rc scripts are executed, not simulated: the shell runs them, so
     what they do depends on what is in them */
  async function runRc(tty, path) {
    const txt = readFileText(path);
    if (txt === null) return;
    const sh = new Shell(tty, { cwd: "/" });
    sh.noProfile = true;
    State.set("curuser", "root");
    const ctx = new Ctx(sh, ["rc"], {});
    await sh.runScript(txt, [path], ctx);
    await tty.pause(200);
  }

  /* ---- the login prompt, on every virtual terminal ---- */
  function getty(n) {
    const vt = Con.vt(n);
    const tty = new Tty(vt);
    (async () => {
      for (;;) {
        vt.clear(A_NORM);
        tty.cursor(true);
        const issue = readFileText("/etc/issue");
        if (issue !== null) tty.out(issue);
        tty.out(Env.host() + " login: ");
        const who = await tty.line();
        if (who === null || !who.trim().length) continue;
        const user = who.trim();
        const known = user === "root" || !!State.get("users", {})[user];
        const wantPw = user === "root" ? State.get("rootpw", null)
          : (State.get("users", {})[user] || {}).pw;
        if (wantPw) {
          tty.out("Password: ");
          const pw = await tty.line({ echo: false });
          tty.outln("");
          if (pw !== wantPw || !known) {
            await tty.pause(1400);
            tty.outln("Login incorrect");
            tty.outln("");
            await tty.pause(700);
            continue;
          }
        } else if (!known) {
          tty.out("Password: ");
          await tty.line({ echo: false });
          tty.outln("");
          await tty.pause(1500);
          tty.outln("Login incorrect");
          tty.outln("");
          continue;
        }
        State.set("curuser", user);
        tty.outln("");
        const last = State.get("lastLogin", null);
        if (last) tty.outln("Last login: " + last + " on tty" + n);
        State.set("lastLogin", stamp());
        const sh = new Shell(tty, { cwd: user === "root" ? "/root" : "/home/" + user });
        await sh.loop();
        vt.clear(A_NORM);
      }
    })();
  }

  async function reboot(tty) {
    tty.outln("");
    tty.outln("Broadcast message from " + Env.user() + " (tty" + (Con.index() + 1) + ") " + stamp() + "...");
    tty.outln("");
    tty.outln("The system is going down for reboot NOW !!");
    await tty.pause(900);
    if (X.running()) X.kill("shutdown");
    tty.outln("INIT: Switching to runlevel: 6");
    await tty.pause(400);
    tty.outln("INIT: Sending processes the TERM signal");
    await tty.pause(600);
    tty.outln("INIT: Sending processes the KILL signal");
    await runRc(tty, "/etc/rc.d/rc.6");
    tty.outln("Restarting system.");
    await tty.pause(900);
    State.flush();
    return power();
  }
  async function halt(tty) {
    tty.outln("");
    if (X.running()) X.kill("shutdown");
    tty.outln("INIT: Switching to runlevel: 0");
    await tty.pause(400);
    tty.outln("INIT: Sending processes the TERM signal");
    await tty.pause(500);
    await runRc(tty, "/etc/rc.d/rc.6");
    tty.outln("Power down.");
    await tty.pause(600);
    Con.allow(false);
    const vt = tty.vt;
    vt.clear(A_NORM);
    vt.center(11, "The system is halted.", A_BOLD);
    vt.center(13, "It is now safe to turn off your computer.", A_NORM);
    vt.center(16, "(use Reset in the rail above to switch it on again)", A_DIM);
    vt.showCursor = false;
    vt.touch();
  }
  async function single(tty) {
    tty.outln("");
    tty.outln("INIT: Switching to runlevel: 1");
    if (X.running()) X.kill("runlevel change");
    await runRc(tty, "/etc/rc.d/rc.K");
    return 0;
  }
  return { power, dmesg, getty, reboot, halt, single, runRc };
})();

/* ==========================================================================
   MODULE 18 — MS-DOS, BECAUSE THAT IS WHERE THE FLOPPIES CAME FROM
   --------------------------------------------------------------------------
   You did not make Slackware boot floppies on a Linux machine, because you
   did not have one yet.  You made them under DOS, with RAWRITE.EXE off the
   CD, having first decompressed the root image with GZIP.EXE, and the
   README that told you which image to write was a text file you read with
   MORE.

   This machine still has its previous owner's DOS partition on it, and it
   still boots, so that is where the installation starts.
   ========================================================================== */
const Dos = (() => {
  let vol = null, cwd = "C:\\", drive = "C";
  /* the DOS partition is writable, and what the visitor puts on it has to
     survive a reload, so it is an overlay on the volume the disk model
     produces */
  function fresh() {
    vol = Disk.dosVolume();
    const made = State.get("dosFiles", {});
    for (const k in made) vol[k] = made[k];
  }
  function writeDos(path, data) {
    const k = path.replace(/^[A-Za-z]:\\?/, "").replace(/\\/g, "/");
    vol[k] = data;
    const made = State.get("dosFiles", {});
    made[k] = data;
    State.set("dosFiles", made);
  }
  /* DOS is case-insensitive and the volumes are keyed in lower case, so
     every lookup here folds case, which is also why DIR prints in capitals
     and TYPE does not care what you typed. */
  function list(dir) {
    const path = dir.replace(/^[A-Za-z]:\\?/, "").replace(/\\/g, "/").toLowerCase();
    const pre = path.length ? path.replace(/\/$/, "") + "/" : "";
    const files = [], dirs = new Set();
    const src = /^[Dd]:/.test(dir) ? cdVol() : vol;
    for (const k in src) {
      const lk = k.toLowerCase();
      if (pre.length && !lk.startsWith(pre)) continue;
      const rest = pre.length ? k.slice(pre.length) : k;
      if (!rest.length) continue;
      const i = rest.indexOf("/");
      if (i >= 0) dirs.add(rest.slice(0, i));
      else files.push(rest);
    }
    return { dirs: Array.from(dirs).sort(), files: files.sort() };
  }
  let cdCache = null;
  function cdVol() { if (!cdCache) cdCache = Disk.cdVolume(); return cdCache; }
  function read(path) {
    const p = path.replace(/^[A-Za-z]:\\?/, "").replace(/\\/g, "/").toLowerCase();
    const src = /^[Dd]:/.test(path) ? cdVol() : vol;
    for (const k in src) if (k.toLowerCase() === p) return src[k];
    return undefined;
  }
  function exists(path) { return read(path) !== undefined; }
  function full(arg) {
    let a = String(arg || "").replace(/\//g, "\\").toUpperCase();
    if (/^[A-Z]:/.test(a)) return a;
    if (a[0] === "\\") return drive + ":" + a;
    return (cwd.endsWith("\\") ? cwd : cwd + "\\") + a;
  }
  function sizeOf(path) {
    const v = read(path);
    const made = State.get("dosMade", {});
    if (made[path]) return 1474560;
    if (v === null) {
      const p = path.replace(/^[A-Z]:\\?/, "").replace(/\\/g, "/");
      if (/\.(i|s)$/i.test(p)) return 1474560;
      if (/\.gz$/i.test(p)) return irnd(900000, 1300000);
      if (/\.tgz$/i.test(p)) return irnd(20000, 1400000);
      if (/\.exe$/i.test(p)) return irnd(20000, 60000);
      return irnd(1024, 65536);
    }
    return v === undefined ? 0 : String(v).length;
  }

  async function run(tty) {
    fresh();
    const vt = tty.vt;
    drive = "C"; cwd = "C:\\";
    vt.clear(A_NORM);
    tty.cursor(true);
    tty.outln("Starting MS-DOS...");
    tty.outln("");
    await tty.pause(700);
    tty.outln("HIMEM is testing extended memory...done.");
    await tty.pause(500);
    tty.outln("");
    tty.outln("Adaptec ASPI4DOS.SYS  Version 3.35");
    tty.outln("  Host Adapter #0 - AHA-1542CF at Port 330h, IRQ " + Hw.M.scsiIrq);
    await tty.pause(400);
    tty.outln("Adaptec ASPICD.SYS   Version 2.11");
    tty.outln("  CD-ROM Drive 0 : " + Hw.M.cdrom.model);
    tty.outln("  Device Name    : MSCD001");
    await tty.pause(500);
    tty.outln("");
    tty.outln("MSCDEX Version 2.23");
    tty.outln("  Drive D: = Driver MSCD001 unit 0");
    tty.outln("");
    await tty.pause(600);
    Museum.note("dos-booted");
    for (;;) {
      tty.out(cwd + ">");
      const line = await tty.line({ history: State.get("doshist", []) });
      if (line === null) { tty.outln(""); continue; }
      const raw = line.trim();
      if (!raw.length) continue;
      const h = State.get("doshist", []); h.push(raw); State.set("doshist", h.slice(-40));
      const parts = raw.split(/\s+/);
      /* DOS looks for the program along the path, so a command typed with a
         directory in front of it is the same command */
      const cm = parts[0].toUpperCase().replace(/\.(EXE|COM|BAT)$/, "").replace(/^.*[\\/]/, "");
      const args = parts.slice(1);
      const pipeMore = / \| *MORE$/i.test(raw);
      const done = await dosCommand(tty, cm, args, raw, pipeMore);
      if (done === "reboot") return;
    }
  }
  async function dosCommand(tty, cm, args, raw, pipeMore) {
    const say = s => tty.outln(s);
    if (/^[A-Z]:$/.test(cm)) {
      const d = cm[0];
      if (d === "C") { drive = "C"; cwd = "C:\\"; return; }
      if (d === "D") {
        if (!State.get("cdIn", true)) { say("Not ready reading drive D"); say("Abort, Retry, Fail?"); await tty.line(); return; }
        drive = "D"; cwd = "D:\\"; return;
      }
      if (d === "A") { say("Not ready reading drive A"); say("Abort, Retry, Fail?"); await tty.line(); return; }
      say("Invalid drive specification");
      return;
    }
    switch (cm) {
      case "DIR": {
        let target = args.find(a => a[0] !== "/") || cwd;
        target = full(target);
        if (target.endsWith("\\")) target = target.slice(0, -1);
        const isFile = exists(target);
        const d = isFile ? null : list(target);
        say("");
        say(" Volume in drive " + target[0] + " is " + (target[0] === "D" ? "SLACKWARE34" : "MERIDIAN"));
        say(" Directory of " + target + (target.length === 2 ? "\\" : ""));
        say("");
        let n = 0, bytes = 0;
        if (isFile) {
          const nm = target.split("\\").pop();
          say(padr(nm.split(".")[0], 9) + padr(nm.split(".")[1] || "", 4) + padl(sizeOf(target), 10) + "  02-14-97  11:04a");
          n = 1; bytes = sizeOf(target);
        } else {
          if (target.length > 2) { say(padr(".", 13) + "     <DIR>        02-14-97   9:02a"); say(padr("..", 13) + "     <DIR>        02-14-97   9:02a"); }
          for (const dd of d.dirs) say(padr(dd.toUpperCase().split(".")[0].slice(0, 8), 9) +
            padr(dd.toUpperCase().indexOf(".") >= 0 ? dd.toUpperCase().split(".")[1].slice(0, 3) : "", 4) +
            "     <DIR>        02-14-97   9:02a");
          for (const f of d.files) {
            const p = target + "\\" + f;
            const nm = f.toUpperCase();
            const base = nm.indexOf(".") >= 0 ? nm.slice(0, nm.lastIndexOf(".")) : nm;
            const ext = nm.indexOf(".") >= 0 ? nm.slice(nm.lastIndexOf(".") + 1) : "";
            const sz = sizeOf(p);
            say(padr(base.slice(0, 8), 9) + padr(ext.slice(0, 3), 4) + padl(sz, 10) + "  02-14-97  11:04a");
            n++; bytes += sz;
          }
        }
        say("       " + n + " file(s)" + padl(bytes, 12) + " bytes");
        say("                    " + padl(target[0] === "D" ? 0 : 12093440, 10) + " bytes free");
        say("");
        return;
      }
      case "CD": case "CHDIR": {
        if (!args.length) { say(cwd); return; }
        let a = args[0].toUpperCase().replace(/\//g, "\\");
        if (a === "..") { const p = cwd.split("\\").filter(s => s.length); p.pop(); cwd = p.length > 1 ? p.join("\\") : p[0] + "\\"; if (!cwd.includes("\\")) cwd = cwd + "\\"; return; }
        if (a === "\\") { cwd = drive + ":\\"; return; }
        const target = full(a);
        const d = list(target);
        if (!d.dirs.length && !d.files.length) { say("Invalid directory"); return; }
        cwd = target;
        drive = target[0];
        return;
      }
      case "TYPE": {
        if (!args.length) { say("Required parameter missing"); return; }
        const p = full(args[0]);
        const v = read(p);
        if (v === undefined) { say("File not found - " + args[0].toUpperCase()); return; }
        if (v === null) { say("(binary file)"); return; }
        if (pipeMore) { await pager(tty, String(v).replace(/\r/g, ""), { name: p }); return; }
        tty.out(String(v).replace(/\r/g, ""));

      }

        if (!p) { say("(reading from standard input)"); return; }

        if (v === undefined) { say("File not found"); return; }

        say("(the DOS editor is not in this exhibit.  TYPE works, and so does MORE.)");
        return;

      case "CLS": tty.vt.clear(A_NORM); return;
      case "VER": say(""); say("MS-DOS Version 6.22"); say(""); return;
      case "MEM":
        say("");
        say("Memory Type        Total  =   Used  +   Free");
        say("----------------  -------   -------   -------");
        say("Conventional         640K       78K      562K");
        say("Upper                  0K        0K        0K");
        say("Reserved             384K      384K        0K");
        say("Extended (XMS)    " + padl(Hw.M.ram * 1024 - 1024, 6) + "K   " + padl(2048, 5) + "K   " + padl(Hw.M.ram * 1024 - 3072, 5) + "K");
        say("----------------  -------   -------   -------");
        say("Total memory      " + padl(Hw.M.ram * 1024, 6) + "K   " + padl(2510, 5) + "K   " + padl(Hw.M.ram * 1024 - 2510, 5) + "K");
        say("");
        return;
      case "GZIP": {
        const dflag = args.some(a => /^-?[dD]$/.test(a) || /^\/D$/i.test(a));
        const f = args.find(a => a[0] !== "-" && a[0] !== "/");
        if (!f) { say("gzip 1.2.4 (18 Aug 93)"); say("usage: gzip [-cdfhlLnNrtvV19] [files...]"); return; }
        const p = full(f);
        if (!exists(p)) { say("gzip: " + f.toUpperCase() + ": No such file or directory"); return; }
        if (!dflag) { say("gzip: " + f.toUpperCase() + " already has .gz suffix -- unchanged"); return; }
        if (!/\.GZ$/i.test(p)) { say("gzip: " + f.toUpperCase() + ": unknown suffix -- ignored"); return; }
        if (/^[Dd]:/.test(p)) {
          say("gzip: " + f.toUpperCase() + ": Read-only file system");

          say("");

        State.set("dosMade", made);
        writeDos(outName, null);
        say("");
        say("Decompressed " + f.toUpperCase() + " to " + Fs.baseOf(outName.replace(/\\/g, "/")));

        say("");

        if (!img) return;
        if (!dst) { tty.out("Enter destination drive: "); dst = ((await tty.line()) || "").trim(); }
        const p = full(img);
        const made = State.get("dosMade", {});
        if (!exists(p) && !made[p]) {
          say(""); say("Unable to open " + img.toUpperCase() + " for reading."); say("");
          if (exists(p + ".GZ") || exists(p + ".gz")) {
            say("There is a " + Fs.baseOf(p.replace(/\\/g, "/")) + ".gz here.  Decompress it first"); say("with GZIP -D."); say("");
          }
          return;
        }
        if (/\.GZ$/i.test(p)) {
          say("");
          say("This image is compressed.  RAWRITE writes a raw image and does not");
          say("decompress: run");
          say("");
          say("    GZIP -D " + Fs.baseOf(p.replace(/\\/g, "/")));
          say("");
          say("first, and then RAWRITE the file it leaves behind.");
          say("");
          return;
        }
        say("");
        const dl2 = (dst || "A").toUpperCase().replace(/:+$/, "");
        say("Please insert a formatted diskette into drive " + dl2 + ": and press -ENTER- :");
        await tty.line();
        /* which kind of disk is this */
        const base = Fs.baseOf(p.replace(/\\/g, "/")).toLowerCase();
        let kind = null, label = base;
        const bootImg = Hw.image(base);
        if (bootImg) kind = "bootkernel";
        else if (Hw.ROOTDISKS.some(r => r.n.replace(/\.gz$/, "") === base)) kind = "rootdisk";
        else if (made[p] && made[p].kind === "root") kind = "rootdisk";
        if (!kind) { say(""); say("Wrote 0 tracks: this file is not a disk image."); say(""); return; }
        Sound.floppyOn(9000);
        for (let track = 0; track < 80; track++) {
          tty.out("\rTrack: " + padl(track, 2) + " Head: " + (track % 2) + " Sector: " + padl(irnd(1, 18), 2));
          Sound.step();
          await sleep(Museum.fast() ? 2 : 95);
        }
        tty.outln("\rTrack: 79 Head: 1 Sector: 18   Done.        ");
        say("");
        const disks = State.get("floppies", []);
        const existing = disks.findIndex(d => d.label === label);
        const disk = { label, kind, image: base };
        if (existing >= 0) disks[existing] = disk; else disks.push(disk);
        State.set("floppies", disks);
        State.set("floppyIn", true);
        State.set("floppyLabel", label);
        Museum.note("rawrote:" + base);
        say("Wrote " + label + " to drive " + dl2 + ":.");
        say("");
        say("(the disk is in the drive.  Use Drives in the rail above to take it out,");
        say(" put another blank in, and write the other one.)");
        say("");
        return;
      }
      case "FORMAT": {
        say("");
        say("Insert new diskette for drive A:");
        say("and press ENTER when ready...");
        await tty.line();
        Sound.floppyOn(6000);
        for (let i = 0; i <= 100; i += 4) { tty.out("\r" + padl(i, 3) + " percent completed."); await sleep(Museum.fast() ? 2 : 60); }
        tty.outln("\rFormat complete.                      ");
        say("");
        say(" 1,457,664 bytes total disk space");
        say(" 1,457,664 bytes available on disk");
        say("");
        return;
      }
      case "COPY": case "XCOPY": {
        if (args.length < 1) { say("Required parameter missing"); return; }
        const src = full(args[0]);
        if (!exists(src)) { say("File not found - " + args[0].toUpperCase()); return; }
        if (/^[Dd]:/.test(full(args[1] || cwd))) { say("Access denied - " + (args[1] || "").toUpperCase()); return; }
        let dst = full(args[1] || ".");
        const srcName = src.split("\\").pop();
        const dl = list(dst.replace(/\\$/, ""));
        const isDir = dst.endsWith("\\") || dst.length === 2 || dl.dirs.length || dl.files.length;
        if (isDir) dst = dst.replace(/\\?$/, "\\") + srcName;
        writeDos(dst, read(src));
        Sound.chatter(500);
        await tty.pause(600);
        say("        1 file(s) copied");
        return;
      }
      case "DEL": case "ERASE": {
        if (!args.length) { say("Required parameter missing"); return; }
        const t = full(args[0]);
        if (/^[Dd]:/.test(t)) { say("Access denied"); return; }
        if (!exists(t)) { say("File not found"); return; }
        const made = State.get("dosFiles", {});
        made[t.replace(/^[A-Za-z]:\\?/, "").replace(/\\/g, "/")] = undefined;
        delete vol[t.replace(/^[A-Za-z]:\\?/, "").replace(/\\/g, "/")];
        State.set("dosFiles", made);
        return;
      }
      case "FDISK":
        say("");
        say("MS-DOS FDISK is on this disk and this exhibit does not implement it.");
        say("You do not want it: Linux's fdisk understands Linux partition types and");
        say("this one does not.");
        say("");
        return;
      case "FIPS":
        say("");
        say("FIPS version 1.5, Copyright (C) 1993-96 Arno Schaefer");
        say("");
        say("FIPS splits a DOS partition in two without destroying what is on it.");
        say("It is on the CD in \\INSTALL\\FIPS and it needs a defragmented disk and a");
        say("backup and a steady nerve, and this exhibit does not run it, because on");
        say("this machine there is 1.4 GB of unallocated space already and you do not");
        say("need to.");
        say("");
        return;
      case "EXIT": say(""); return;
      case "REBOOT": return "reboot";
      case "HELP":
        say("");

  /* ---- booting the bootkernel disk ---- */
  async function run(tty, boot) {
    const img = boot.image || "bare.i";
    State.set("bootImage", img);
    const info = Hw.image(img) || { n: img };
    const vt = tty.vt;
    vt.clear(A_NORM);
    tty.cursor(true);
    tty.outln("");
    tty.outln("Welcome to the Slackware Linux 3.4.0 bootkernel disk!");
    tty.outln("");
    tty.outln("If you need to pass extra parameters to the kernel, enter them at the prompt");
    tty.outln("below after the name of the kernel to boot (mount) followed by the extra");
    tty.outln("parameters.  For example, to boot a Mitsumi CD-ROM at port 0x300 you would");
    tty.outln("type this:  mount mcd=0x300,11");
    tty.outln("");
    tty.outln("In a pinch, you can boot your system from here with a command like:");
    tty.outln("");
    tty.outln("     mount root=/dev/sda1 noinitrd ro");
    tty.outln("");
    tty.outln("On machines with low memory you can use this to install without a ramdisk:");
    tty.outln("");
    tty.outln("     mount root=/dev/fd0 load_ramdisk=0");
    tty.outln("");
    tty.outln("If you would rather load the installation disks into memory, type: ramdisk");
    tty.outln("");
    tty.outln("PLEASE NOTE: You will have to use the 'root=' parameter above if you are");
    tty.outln("booting an installed system rather than installing.");
    tty.outln("");
    tty.out("boot: ");
    const line = await tty.line();
    const words = ((line === null ? "" : line).trim()).split(/\s+/).filter(s => s.length);
    /* mount root=/dev/sdaN : rescuing an installed system from the boot disk */
    const rootArg = words.find(w => /^root=/.test(w));
    if (rootArg) {
      const dev = rootArg.slice(5);
      const p = Disk.byDev(Fs.baseOf(dev));
      const fmt = State.get("formatted", {});
      if (!p || fmt[p.dev] !== "ext2" || !State.get("installed", []).length) {
        tty.outln("");
        await bootKernelMsgs(tty, info);
        tty.outln("VFS: Cannot open root device " + dev);
        tty.outln("Kernel panic: VFS: Unable to mount root fs on 08:0" + (p ? p.dev.slice(3) : "1"));
        Con.allow(false);
        return;
      }
      tty.outln("Loading ...........");
      await bootKernelMsgs(tty, info);
      Museum.note("rescue-boot");
      tty.outln("VFS: Mounted root (ext2 filesystem) readonly.");
      State.set("bootTime", Clock.now().getTime());
      State.set("modules", []); State.set("daemons", []); Disk.setMounts([]);
      tty.outln("");
      tty.outln("INIT: version 2.69 booting");
      await Boot.runRc(tty, "/etc/rc.d/rc.S");
      tty.outln("INIT: Entering runlevel: 3");
      await Boot.runRc(tty, "/etc/rc.d/rc.M");
      Con.allow(true);
      Con.lamp();
      for (let i = 1; i <= 6; i++) Boot.getty(i);
      return;
    }
    tty.outln("Loading ramdisk....");
    await bootKernelMsgs(tty, info);
    /* the root disk prompt, and the swap */
    for (;;) {
      tty.outln("");
      tty.outln("VFS: Insert root floppy disk to be loaded into RAM disk and press ENTER");
      tty.outln("");
      tty.outln("(use Drives in the rail above to take the bootkernel disk out and put the");
      tty.outln(" root disk in.)");
      await tty.key();
      const lab = State.get("floppyLabel", null);
      const disks = State.get("floppies", []);
      const d = disks.find(x => x.label === lab);
      if (!State.get("floppyIn", false)) {
        Sound.floppyOn(900);
        tty.outln("");
        tty.outln("end_request: I/O error, dev 02:00, sector 0");
        tty.outln("VFS: Disk change detected on device 2/0");
        continue;
      }
      if (!d || d.kind !== "rootdisk") {
        Sound.floppyOn(1400); Sound.seek(8);
        await tty.pause(1200);
        tty.outln("");
        tty.outln("RAMDISK: Compressed image found at block 0");
        tty.outln("crc error");
        tty.outln("VFS: Unable to mount root fs on 01:00");
        tty.outln("");
        tty.outln("(that is not a root disk.  The bootkernel disk is a kernel; the root");
        tty.outln(" disk is the installation system.  You need both.)");
        continue;
      }
      Sound.floppyOn(6000);
      tty.outln("");
      tty.outln("RAMDISK: Compressed image found at block 0");
      for (let i = 0; i < 24; i++) { Sound.step(); await tty.pause(160, false); tty.out("."); }
      tty.outln("");
      tty.outln("VFS: Mounted root (minix filesystem).");
      break;
    }
    /* the installation system boots */
    State.set("installing", true);
    State.set("hostname", "slackware");
    Fs.clear();
    Fs.begin();
    Pkg.install(ramdisk());
    Fs.end();
    State.set("installed", []);
    State.set("curuser", "root");
    Disk.setMounts([]);
    State.set("mounts", []);
    if (State.get("cdIn", true)) Disk.mount("/dev/scd0", "/cdrom", "iso9660");
    tty.outln("");
    tty.outln("INIT: version 2.69 booting");
    await tty.pause(500);
    tty.outln("Mounting /proc filesystem...");
    tty.outln("Loading keyboard map...");
    await tty.pause(400);
    tty.outln("Detecting CD-ROM drives...");
    await tty.pause(700);
    if (Hw.seesDisk(img)) tty.outln("Found a CD-ROM on /dev/scd0.");
    else tty.outln("No CD-ROM drives were detected.");
    tty.outln("");
    Con.allow(false);
    /* the login prompt on the install disk */
    for (;;) {
      const issue = readFileText("/etc/issue");
      if (issue) tty.out(issue);
      tty.out("slackware login: ");
      const who = await tty.line();
      if (who === null) continue;
      if (who.trim() !== "root" && who.trim().length) { tty.outln("Login incorrect"); tty.outln(""); continue; }
      if (!who.trim().length) continue;
      break;
    }
    tty.outln("");
    const motd = readFileText("/etc/motd");
    if (motd) tty.out(motd);
    const sh = new Shell(tty, { cwd: "/" });
    sh.noProfile = true;
    Museum.note("install-booted:" + img);
    await sh.loop();
    /* if the shell exits, put the login prompt back */
    return run(tty, boot);
  }

      L.push("eth0: NE2000 found at " + sw.io + ", using IRQ " + sw.irq + ".");
    }

    if (info.scsi === "all") {
      L.push("aha152x: processing commandline: ok");

        ", DMA priority " + Hw.M.scsiDma);
      L.push("scsi0 : Adaptec 1542");
      L.push("scsi : 1 host.");
    } else if (info.scsi) {
      L.push(info.scsi + ": no host adapter detected.");
      L.push("scsi : 0 hosts.");
    }
    if (Hw.seesDisk(info.n)) {
      L.push("  Vendor: VANTAGE   Model: " + Hw.M.disk.model + "     Rev: 1.14");
      L.push("  Type:   Direct-Access                      ANSI SCSI revision: 02");
      L.push("Detected scsi disk sda at scsi0, channel 0, id 0, lun 0");

      L.push("SCSI device sda: hdwr sector= 512 bytes. Sectors= 3399040 [1659 MB] [1.7 GB]");

      L.push(" sda: " + parts.map(p => p.dev).join(" "));
      L.push("sr0: scsi3-mmc drive: 8x/8x cd/rw xa/form2 cdda tray");

  async function addswap(d, tty, st) {
    const parts = Disk.parts().filter(p => p.id === "82");
    if (!parts.length) {
      await d.msgbox("No swap partitions were detected on this machine.\n\n" +
        "If you want one, you have to make it with fdisk and set its type to 82. " +
        "The installer looks for the type code and nothing else: a Linux swap partition " +
        "left at type 83 is invisible here and the reason will not be explained.\n\n" +
        "On a machine with 32 MB of memory you can install without swap. You will " +
        "regret it the first time you run Netscape.",
        { title: "NO SWAP SPACE DETECTED", w: 68 });
      return;
    }
    const p = parts[0];
    const yes = await d.yesno("Slackware Setup has detected a swap partition:\n\n" +
      "  Device      Start    End   Blocks  Id  System\n" +
      "  /dev/" + padr(p.dev, 8) + padl(p.start, 5) + padl(p.end, 7) +
      padl(Disk.blocksOf(p), 9) + "  82  Linux swap\n\n" +
      "Do you wish to install this as your swap partition?",
      { title: "SWAP SPACE DETECTED", w: 62 });
    if (!yes) return;
    const check = await d.yesno("Would you like to check the swap partition for bad blocks " +
      "first? This takes a while on a large partition and was worth doing on a disk of " +
      "unknown history.", { title: "CHECK SWAP PARTITION FOR BAD BLOCKS?", w: 68, def: false });
    d.backdrop();
    d.infobox("Setting up swap partitioning on /dev/" + p.dev + ".\n\nmkswap /dev/" + p.dev +
      " " + Disk.blocksOf(p), { title: "SETTING UP SWAP", w: 62 });
    Sound.chatter(check ? 3000 : 900);
    await tty.pause(check ? 3000 : 1100);
    const fmts = State.get("formatted", {}); fmts[p.dev] = "swap"; State.set("formatted", fmts);
    State.set("swapOn", true);
    st.swap = true;
    st.swapDev = p.dev;
    await d.msgbox("Your swap partition has been initialized and activated:\n\n" +
      "/dev/" + p.dev + "   " + Disk.blocksOf(p) + " blocks\n\n" +
      "It will be added to /etc/fstab for you at the end of the installation.",
      { title: "SWAP SPACE CONFIGURED", w: 66 });
  }

  async function target(d, tty, st) {
    const linux = Disk.parts().filter(p => p.id === "83");
    if (!linux.length) {
      await d.msgbox("You can't install Linux on this machine until you have made at least " +
        "one Linux partition (type 83) with fdisk or cfdisk.\n\n" +
        "If your hard drive does not appear in fdisk at all, then the bootkernel disk " +
        "you booted does not contain a driver for your disk controller. Nothing else " +
        "causes that. Reboot with a different bootkernel disk.\n\n" +
        "Exit setup, run fdisk, and come back.", { title: "NO LINUX PARTITIONS DETECTED", w: 70 });
      return;

    const pick2 = await d.menu("Please select the partition you wish to use for your root (/) " +
      "Linux filesystem:",
      linux.map(p => ({ tag: "/dev/" + p.dev, desc: "Linux native, " + Disk.mbOf(p) + " MB" })),
      { title: "SELECT LINUX INSTALLATION PARTITION", listH: Math.min(4, linux.length), w: 70 });
    if (!pick2 || pick2.cancel) return;
    const dev = pick2.tag.replace("/dev/", "");
    const p = Disk.byDev(dev);
    const fmt = await d.menu("If this partition has not been formatted, you should format it. " +
      "NOTE: This will erase all data on it.",
      [{ tag: "Format", desc: "Quick format with no checking" },
       { tag: "Check", desc: "Slow format that checks for bad blocks" },
       { tag: "No", desc: "No, do not format this partition" }],
      { title: "FORMAT PARTITION " + pick2.tag, listH: 3, w: 70 });
    if (!fmt || fmt.cancel) return;
    if (fmt.tag !== "No") {
      const inodes = await d.menu("Select the inode density you want. The default of one inode " +
        "per 4096 bytes is fine for nearly everything.",
        [{ tag: "4096", desc: "One inode per 4096 bytes (default)" },
         { tag: "2048", desc: "One inode per 2048 bytes (more files)" },
         { tag: "1024", desc: "One inode per 1024 bytes (many small files)" }],
        { title: "SELECT INODE DENSITY", listH: 3, w: 66, def: "4096" });
      d.backdrop();
      tty.vt.clear(A_NORM);
      tty.cursor(true);
      tty.outln("");
      tty.outln("Formatting /dev/" + dev + ".");
      tty.outln("Creating ext2 filesystem on /dev/" + dev + "...");
      tty.outln("");
      await IMPL.mke2fs(new Ctx(new Shell(tty), ["mke2fs"].concat(fmt.tag === "Check" ? ["-c"] : [], ["/dev/" + dev]), {}));
      await tty.anyKey();
    }
    const fmts = State.get("formatted", {});
    if (fmt.tag === "No" && fmts[dev] !== "ext2") {
      await d.msgbox("You chose not to format /dev/" + dev + ", and there is no ext2 " +
        "filesystem on it. The installation cannot continue onto an unformatted partition.",
        { title: "NO FILESYSTEM", w: 66 });
      return;
    }
    fmts[dev] = "ext2"; State.set("formatted", fmts);
    const pp = Disk.parts(); const q = pp.find(x => x.dev === dev); if (q) { q.root = 1; Disk.setParts(pp); }
    st.target = "/dev/" + dev;
    /* the other partitions, including the DOS one, which setup really did
       offer to put in fstab */
    const others = Disk.parts().filter(x => x.dev !== dev && x.id !== "82");
    for (const o of others) {
      const nm = Disk.typeName(o.id);
      const add = await d.yesno("Setup has found another partition:\n\n" +
        "  /dev/" + o.dev + "   " + Disk.mbOf(o) + " MB   " + nm + "\n\n" +
        "Would you like to add this partition to /etc/fstab, so it is available " +
        "from Linux? If you say yes you will be asked where to mount it.",
        { title: "ADD PARTITION TO /etc/fstab", w: 70, def: /DOS|FAT|HPFS|Linux/.test(nm) });
      if (!add) continue;
      const where = await d.inputbox("Where would you like to mount /dev/" + o.dev + "?\n\n" +
        "For a DOS partition, /dosc is the Slackware convention.",
        /DOS|FAT/.test(nm) ? "/dosc" : "/usr/local", { title: "SELECT MOUNT POINT", w: 66 });
      if (where === null || !where.trim().length) continue;
      st.extra = st.extra || [];
      st.extra.push({ dev: o.dev, dir: where.trim(),
        type: /DOS|FAT/.test(nm) ? "msdos" : /HPFS/.test(nm) ? "hpfs" : "ext2" });
    }
    await d.msgbox("Your target has been set to " + st.target + ".\n\n" +
      "Next: SOURCE, to say where the packages are coming from.", { title: "TARGET SET", w: 62 });
  }

  async function source(d, tty, st) {
    const r = await d.menu("Please select the media from which to install Slackware Linux:",
      [{ tag: "1", desc: "Install from a hard drive partition" },
       { tag: "2", desc: "Install from floppy disks" },
       { tag: "3", desc: "Install from CD-ROM" },
       { tag: "4", desc: "Install via NFS" },
       { tag: "5", desc: "Install from a pre-mounted directory" }],
      { title: "SOURCE MEDIA SELECTION", listH: 5, w: 70, def: "3" });
    if (!r || r.cancel) return;
    if (r.tag === "2") {
      await d.msgbox("Installing from floppy disks means feeding this machine one disk at a " +
        "time and answering a prompt between each one. The A series is 9 disks. The X series " +
        "is 26. The whole distribution is about 90.\n\n" +
        "People did this. It took a weekend, and if disk 7 of 9 was bad you found out on " +
        "disk 7 of 9.\n\n" +
        "There is a CD-ROM in this machine's drive. Use it.", { title: "INSTALL FROM FLOPPY", w: 70 });
      return;
    }
    if (r.tag === "4") {
      await d.msgbox("NFS installation needs a working network, which needs a bootkernel disk " +
        "with your ethernet driver in it, which is a different disk from the one you booted " +
        "unless you chose net.i or scsinet.s.\n\n" +
        "Not from here.", { title: "NFS INSTALLATION", w: 68 });
      return;
    }
    if (r.tag === "1" || r.tag === "5") {
      const p = await d.inputbox("What directory are the Slackware package directories in?",
        "/cdrom/slakware", { title: "SELECT SOURCE DIRECTORY", w: 66 });
      if (p === null) return;
      if (!Fs.isDir(Fs.norm(p))) { await d.msgbox("There is no directory " + p + " on this machine."); return; }
      st.source = p;
    } else {
      if (!State.get("cdIn", true)) {
        await d.msgbox("There is no disc in the CD-ROM drive.\n\nUse Drives in the rail above.",
          { title: "NO CD-ROM FOUND", w: 62 });
        return;
      }
      if (!Disk.isMounted("/cdrom")) Disk.mount("/dev/scd0", "/cdrom", "iso9660");
      const which = await d.menu("Scanning for a CD-ROM drive containing a Slackware disc...\n\n" +
        "Which type of CD-ROM drive do you have?",
        [{ tag: "auto", desc: "Scan all drives for a Slackware disc (recommended)" },
         { tag: "/dev/scd0", desc: "SCSI CD-ROM drive" },
         { tag: "/dev/hdb", desc: "IDE/ATAPI CD-ROM drive" },
         { tag: "/dev/sbpcd", desc: "Non-IDE Panasonic/SoundBlaster CD-ROM" }],
        { title: "SELECT CD-ROM TYPE", listH: 4, w: 70, def: "auto" });
      if (!which || which.cancel) return;
      d.backdrop();
      d.infobox("Attempting to mount your CD-ROM...", { title: "SCANNING", w: 52 });
      Sound.seek(6);
      await tty.pause(1600);
      st.source = "/cdrom/slakware";
      await d.msgbox("A Slackware disc was found in /dev/scd0 and mounted on /cdrom.\n\n" +
        "Source set to /cdrom/slakware.", { title: "CD-ROM FOUND", w: 62 });
    }
  }

  async function select(d, tty, st) {
    /* This is the screen the whole exhibit is about: the letters, one line
       each, and not one word about what needs what. */
    /* what setup really preselected: the base system and the sets it
       considered recommended.  X is not among them, so a machine with no X
       is a choice the visitor made rather than a default they inherited. */
    const REC = ["A", "AP", "D", "F", "N"];
    const items = Pkg.SETS.map(s => ({ tag: s.id, desc: s.d,
      on: st.sets.length ? st.sets.indexOf(s.id) >= 0 : REC.indexOf(s.id) >= 0 }));
    const chosen = await d.checklist(
      "Now it's time to select which general categories of programs to install on " +
      "your system.  Use the spacebar to select or unselect the software you wish to " +
      "install.  You can use the up and down arrows to see all the possible choices.  " +
      "Recommended choices have been preselected.  Press the ENTER key when you are " +
      "finished.",
      items, { title: "SERIES SELECTION", listH: 14, w: 76 });
    if (chosen === null) return;
    if (chosen.indexOf("A") < 0) {
      await d.msgbox("The A series is the base system and is required. It has been added back.",
        { title: "A SERIES IS REQUIRED", w: 60 });
      chosen.unshift("A");
    }
    st.sets = chosen;
    Museum.note("selected:" + chosen.join(","));
  }

  async function install(d, tty, st, c) {
    if (!st.target) { await d.msgbox("You have not selected a target partition yet. Do TARGET first."); return; }
    if (!st.source) { await d.msgbox("You have not selected a source yet. Do SOURCE first."); return; }
    if (!st.sets.length) { await d.msgbox("You have not selected any disk sets yet. Do DISK SETS first."); return; }
    const mode = await d.menu(
      "Now you must select the type of prompting used while installing.\n" +
      "\n" +
      "If you don't want to be prompted about every package, use 'full' or 'menu'.",
      [{ tag: "full", desc: "Install everything (2.9GB of software, requires 2.9GB)" },
       { tag: "newbie", desc: "Use interactive prompting for each package" },
       { tag: "menu", desc: "Choose groups of packages from interactive menus" },
       { tag: "expert", desc: "Choose individual packages from interactive menus" },
       { tag: "custom", desc: "Use custom tagfiles in the package directories" },
       { tag: "tagpath", desc: "Use tagfiles in the subdirectories of a custom path" },
       { tag: "help", desc: "Read the prompt mode help file" }],
      { title: "SELECT PROMPTING MODE", listH: 7, w: 74, def: "menu" });
    if (!mode || mode.cancel) return;
    if (mode.tag === "help") {
      await d.textbox(PROMPT_HELP, { title: "Prompt mode help" });
      return;
    }
    if (mode.tag === "custom" || mode.tag === "tagpath") {
      await d.msgbox("Tagfile installation reads a file called 'tagfile' in each package " +
        "directory, listing every package and whether to install it. You write those files " +
        "in advance, and then this mode installs a hundred machines the same way without " +
        "asking anything.\n\n" +
        "It is the best idea in this installer and almost nobody used it.\n\n" +
        "Falling back to 'menu'.", { title: "TAGFILE INSTALLATION", w: 70 });
      mode.tag = "menu";
    }
    /* build the package list */
    let list = [];
    for (const setId of st.sets) list = list.concat(Pkg.bySet(setId));
    if (mode.tag === "menu") {
      for (const setId of st.sets) {
        const pk = Pkg.bySet(setId);
        const req = pk.filter(p => p.req);
        const opt = pk.filter(p => !p.req);
        if (!opt.length) continue;
        const chosen = await d.checklist(
          "The " + setId + " series contains " + pk.length + " packages. " +
          (req.length ? req.length + " of them are required and are not in this list. " : "") +
          "Select the optional ones you want.\n\n" +
          Pkg.SETS.find(s => s.id === setId).d,
          opt.map(p => ({ tag: p.n, desc: (p.d[0] || "").slice(0, 40), on: p.rec || setId === "A" })),
          { title: "SELECT " + setId + " SERIES PACKAGES", listH: 13, w: 76 });
        if (chosen === null) return;
        list = list.filter(p => p.set !== setId || p.req || chosen.indexOf(p.n) >= 0);
      }
    }
    if (mode.tag === "expert") {
      for (const setId of st.sets) {
        const pk = Pkg.bySet(setId);
        const chosen = await d.checklist(
          "Series " + setId + ": every package, individually, with no distinction between " +
          "required and optional. If you clear the wrong one here you will find out in a " +
          "month.",
          pk.map(p => ({ tag: p.n, desc: (p.d[0] || "").slice(0, 40), on: true })),
          { title: "EXPERT: SELECT " + setId + " PACKAGES", listH: 13, w: 76 });
        if (chosen === null) return;
        list = list.filter(p => p.set !== setId || chosen.indexOf(p.n) >= 0);
      }
    }
    /* the newbie mode: asks about most of them anyway, one at a time */
    d.backdrop();
    tty.vt.clear(A_NORM);
    tty.cursor(false);
    const t0 = Date.now();
    let n = 0, kb = 0;
    const total = list.length;
    for (const pk of list) {
      n++;
      if (mode.tag === "newbie" && !pk.req) {
        d.backdrop();
        const yes = await d.yesno(
          "Package name:  " + pk.n + ".tgz  (series " + pk.set + ")\n" +
          "Compressed:    " + pk.k + " K\n" +
          "\n" +
          pk.d.join("\n") + "\n" +
          "\n" +
          "Install package " + pk.n + "?",
          { title: "PACKAGE " + n + " OF " + total, w: 74, yes: "Yes", no: "No" });
        if (!yes) continue;
        tty.vt.clear(A_NORM);
        tty.cursor(false);
      }
      tty.vt.clear(A_NORM);
      tty.vt.put(0, 0, padr(" Installing package " + pk.n + "-" + pk.set.toLowerCase() + ".tgz " +
        "[" + n + "/" + total + "]", 80), AT(15, 4));
      let y = 2;
      tty.vt.put(0, y++, "PACKAGE DESCRIPTION:", A_BOLD);
      for (const line of pk.d) tty.vt.put(0, y++, pk.n + ": " + line, A_NORM);
      y++;
      tty.vt.put(0, y++, "Installing " + pk.n + "...", A_NORM);
      const files = pk.files.filter(f => !f.dir).slice(0, 14);
      Sound.chatter(200 + pk.k / 3);
      for (const f of files) {
        tty.vt.put(0, Math.min(23, y++), f.p.replace(/^\//, ""), A_DIM);
        tty.vt.touch();
        await sleep(Museum.fast() ? 1 : Math.max(14, 900 / files.length));
      }
      kb += pk.k;
      const pct = Math.round(100 * n / total);
      tty.vt.put(0, 24, padr(" " + pct + "% complete   " + Math.round(kb / 1024) +
        " MB installed   " + (total - n) + " packages remaining", 80), AT(15, 4));
      tty.vt.touch();
      Pkg.install(pk, { loc: (st.source || "/cdrom/slakware") + "/" + pk.set.toLowerCase() + "1/" + pk.n + ".tgz" });
      await sleep(Museum.fast() ? 1 : 90);
    }
    /* The kernel and the base configuration files the installer writes.
       These are journaled: they belong to no package, so the overlay is the
       only record of them, and a reload rebuilds the disk from packages. */
    const rootDev = st.target.replace("/dev/", "");
    const swapDev = st.swapDev || (Disk.swapPart() ? Disk.swapPart().dev : null);
    let fstab = "";
    if (swapDev) fstab += padr("/dev/" + swapDev, 16) + padr("swap", 17) + padr("swap", 12) + padr("defaults", 17) + "0   0\n";
    fstab += padr("/dev/" + rootDev, 16) + padr("/", 17) + padr("ext2", 12) + padr("defaults", 17) + "1   1\n";
    for (const e of (st.extra || []))
      fstab += padr("/dev/" + e.dev, 16) + padr(e.dir, 17) + padr(e.type, 12) + padr("defaults", 17) + "1   0\n";
    fstab += padr("/dev/scd0", 16) + padr("/cdrom", 17) + padr("iso9660", 12) + padr("ro,noauto,user", 17) + "0   0\n";
    fstab += padr("/dev/fd0", 16) + padr("/floppy", 17) + padr("ext2", 12) + padr("noauto,user", 17) + "0   0\n";
    fstab += padr("none", 16) + padr("/proc", 17) + padr("proc", 12) + padr("defaults", 17) + "0   0\n";
    Fs.write("/etc/fstab", fstab);
    for (const e of (st.extra || [])) Fs.mkdir(e.dir);
    /* the kernel itself, which the installer copies off the bootkernel disk */
    Fs.write("/vmlinuz", "", { mode: 0o644, sz: 428032, bin: 1, needs: null });
    Kimg.set("/vmlinuz", { ver: "2.0.30", build: 1, host: "darkstar", builder: "root",
      date: "Mon Oct 13 12:41:07 CDT 1997", custom: false, sound: null, opts: {}, kid: "dist" });
    Fs.write("/boot/System.map", "c0100000 T stext\n");
    st.installed = true;
    Museum.note("installed");
    d.backdrop();
    const mins = Math.max(1, Math.round((Date.now() - t0) / 60000));
    await d.msgbox(total + " packages installed, " + Math.round(kb / 1024) + " MB.\n\n" +
      "Next: CONFIGURE. That is where the boot loader, the mouse, the timezone and " +
      "the root password get set, and where you are offered a boot floppy.\n\n" +
      "Take the boot floppy.", { title: "INSTALLATION COMPLETE", w: 70 });
  }

  async function configure(d, tty, st, c) {
    if (!st.installed) { await d.msgbox("Install some software first."); return; }
    /* 1. the boot disk */
    const mkboot = await d.yesno(
      "It is recommended that you make a boot disk for your new system now.\n\n" +
      "If anything ever goes wrong with the boot loader, or with a kernel you " +
      "compile yourself, this floppy is how you get back in. It takes ninety " +
      "seconds and it is the difference between a bad evening and a reinstall.\n\n" +
      "Would you like to make one? You will need a formatted floppy.",
      { title: "MAKE BOOT DISK", w: 72 });
    if (mkboot) {
      d.backdrop();
      d.infobox("Put a formatted floppy in the drive and press Enter.\n\n" +
        "Use Drives in the rail above to take the root disk out first.", { title: "INSERT FLOPPY", w: 62 });
      await tty.key();
      if (!State.get("floppyIn", false)) {
        await d.msgbox("There is no floppy in the drive. Skipping the boot disk.\n\n" +
          "You can make one later with:  dd if=/vmlinuz of=/dev/fd0 bs=8192\n" +
          "and then:  rdev /dev/fd0 " + st.target,
          { title: "NO FLOPPY", w: 68 });
        Museum.note("no-bootdisk");
      } else {
        d.backdrop();
        d.infobox("Creating a boot disk...", { title: "MAKING BOOT DISK", w: 48 });
        Sound.floppyOn(7000); Sound.seek(50);
        await tty.pause(6000);
        const disks = State.get("floppies", []);
        const lab = "bootdisk";
        const i = disks.findIndex(x => x.label === lab);
        const disk = { label: lab, kind: "boot", image: "vmlinuz", root: st.target,
                       kmeta: Kernel.imageAt("/vmlinuz") || Kernel.stock() };
        if (i >= 0) disks[i] = disk; else disks.push(disk);
        State.set("floppies", disks);
        State.set("floppyLabel", lab);
        State.set("floppy", { kind: "boot", root: st.target, kernel: "/vmlinuz",
          kmeta: Kernel.imageAt("/vmlinuz") || Kernel.stock() });
        Museum.note("made-bootdisk");
        await d.msgbox("Your boot disk has been created. Keep it.\n\n" +
          "It boots the kernel from the floppy and then uses " + st.target + " for " +
          "everything else, which means it works even when the boot sector on the hard " +
          "disk is wrong.", { title: "BOOT DISK CREATED", w: 70 });
      }
    } else Museum.note("no-bootdisk");
    /* 2. modem */
    const mo = await d.menu("A link in /dev called /dev/modem will be created, pointing at " +
      "the serial port your modem is on.",
      [{ tag: "no_modem", desc: "No modem" },
       { tag: "/dev/cua0", desc: "ttyS0 (COM1:)" },
       { tag: "/dev/cua1", desc: "ttyS1 (COM2:)" },
       { tag: "/dev/cua2", desc: "ttyS2 (COM3:)" },
       { tag: "/dev/cua3", desc: "ttyS3 (COM4:)" }],
      { title: "SELECT MODEM PORT", listH: 5, w: 66, def: "/dev/cua1" });
    if (mo && !mo.cancel && mo.tag !== "no_modem") {
      Fs.symlink("/dev/modem", mo.tag.replace("/dev/", ""));
      State.set("minicomDev", mo.tag);
      State.set("pppDev", mo.tag);
    }
    /* 3. mouse, for gpm */
    const ms = await d.menu("If you have a mouse, select its type. This sets up gpm, the mouse " +
      "server for the text console. X asks about the mouse separately and does not use this.",
      [{ tag: "ms", desc: "Microsoft compatible serial mouse" },
       { tag: "mman", desc: "Logitech MouseMan serial mouse" },
       { tag: "msc", desc: "Mouse Systems serial mouse" },
       { tag: "ps2", desc: "PS/2 port mouse" },
       { tag: "bm", desc: "Bus mouse (Logitech, ATI-XL, Microsoft)" },
       { tag: "none", desc: "No mouse" }],
      { title: "SELECT MOUSE TYPE", listH: 6, w: 70, def: "mman" });
    if (ms && !ms.cancel && ms.tag !== "none") {
      const port = await d.menu("Which serial port is the mouse on?",
        [{ tag: "/dev/cua0", desc: "COM1" }, { tag: "/dev/cua1", desc: "COM2" },
         { tag: "/dev/cua2", desc: "COM3" }, { tag: "/dev/cua3", desc: "COM4" }],
        { title: "SELECT MOUSE PORT", listH: 4, w: 60, def: "/dev/cua0" });
      const p = port && !port.cancel ? port.tag : "/dev/cua0";
      Fs.symlink("/dev/mouse", p.replace("/dev/", ""));
      Fs.write("/etc/rc.d/rc.gpm", "#!/bin/sh\n# Start/stop/restart gpm.\ncase \"$1\" in\n'stop')\n  /usr/bin/gpm -k\n  ;;\n*)\n  /usr/bin/gpm -m " + p + " -t " + ms.tag + "\n  ;;\nesac\n", { mode: 0o755 });
      State.set("gpmType", ms.tag);
      State.set("gpmPort", p);
    }
    /* 4. font */
    const ft = await d.yesno("Would you like to try out some custom screen fonts?",
      { title: "CONFIGURE CONSOLE FONT", w: 62, def: false });
    if (ft) {
      const f = await d.menu("Select a font. On a 1997 VGA card these were 8x16 bitmaps and " +
        "there were dozens of them.",
        ["default8x16.psf", "160.cp.gz", "8859-2.cp.gz", "alt-8x16.psf", "iso01.f16",
         "koi8-r.psf", "lat1-16.psf", "lat2-16.psf"].map(x => ({ tag: x, desc: "" })),
        { title: "SELECT A FONT", listH: 8, w: 60 });
      if (f && !f.cancel && f.tag !== "default8x16.psf") {
        Fs.write("/etc/rc.d/rc.font", "#!/bin/sh\nsetfont " + f.tag + "\n", { mode: 0o755 });
      }
    }
    /* 5. LILO */
    d.backdrop();
    tty.vt.clear(A_NORM);
    tty.cursor(true);
    await c.sh.run("liloconfig");
    /* 6. timezone */
    d.backdrop();
    await c.sh.run("timeconfig");
    /* 7. services */
    const svc = await d.checklist(
      "Slackware can start a number of daemons at boot. Turn off what you do not " +
      "use: a service you are not running is a service nobody can attack, and this " +
      "list is why /etc/rc.d/rc.inet2 is a file full of if-tests.",
      [{ tag: "rc.inet2", desc: "Basic network daemons (inetd, portmap)", on: true },
       { tag: "sendmail", desc: "The mail transport agent", on: true },
       { tag: "lpd", desc: "The printer daemon", on: false },
       { tag: "httpd", desc: "The Apache web server", on: false },
       { tag: "named", desc: "The BIND nameserver", on: false },
       { tag: "nfsd", desc: "The NFS server", on: false },
       { tag: "crond", desc: "The cron daemon", on: true },
       { tag: "gpm", desc: "The console mouse server", on: true },
       { tag: "atd", desc: "The at daemon", on: false }],
      { title: "SELECT SERVICES TO START AT BOOT", listH: 9, w: 74 });
    if (svc !== null) State.set("services", svc);
    /* 8. the root password, last, as it really was */
    d.backdrop();
    await d.msgbox("Now we will set the root password.\n\n" +
      "Do not lose this. There is no recovery tool and no security question. If you " +
      "forget it you boot from a floppy, mount the disk and edit /etc/shadow, which " +
      "is exactly as much security as a machine on a desk in your house needs and " +
      "considerably less than a machine on a network does.",
      { title: "WARNING: NO ROOT PASSWORD DETECTED", w: 72 });
    tty.vt.clear(A_NORM);
    tty.cursor(true);
    tty.outln("");
    for (;;) {
      tty.outln("Setting password for user root");
      tty.out("New password: ");
      const p1 = await tty.line({ echo: false });
      if (p1 === null) continue;
      if (p1.length < 4) { tty.outln("\nPassword is too short. Use at least four characters."); tty.outln(""); continue; }
      tty.out("Re-enter new password: ");
