  let cur = "argument";
  function build() {
    const tabs = $("#guideTabs"), body = $("#guideBody");
    tabs.innerHTML = "";
    for (const t of TABS) {
      const btn = el("button", { class: t.id === cur ? "on" : "" }, t.label);
      btn.addEventListener("click", () => { cur = t.id; build(); });
      tabs.appendChild(btn);
    }
    body.innerHTML = "";
    const t = TABS.find(z => z.id === cur) || TABS[0];
    t.build(body);
    body.scrollTop = 0;
  }
  function refresh() { if (cur === "state" || cur === "try") build(); }
  function toggle(force) {
    const on = force === undefined ? !$("#guide").classList.contains("on") : force;
    $("#guide").classList.toggle("on", on);
    $("#btnGuide").classList.toggle("on", on);
    document.body.classList.toggle("noguide", !on);
    if (on) build();
    State.set("guideOpen", on);
    /* the screen is a different size now */
    if (typeof Screen !== "undefined") setTimeout(() => Screen.fit(), 190);
  }
  function init() {
    build();
    $("#guideClose").addEventListener("click", () => toggle(false));
    $("#btnGuide").addEventListener("click", () => toggle());
    if (State.get("guideOpen", true)) toggle(true); else document.body.classList.add("noguide");
  }
  return { init, build, refresh, toggle };
})();

/* ==========================================================================
   MODULE 21 — THE MUSEUM CHROME
   --------------------------------------------------------------------------
   The rail above the screen is the visitor's hands: the reset button on the
   front of the case, the floppy drive, the lid of the machine, and the back
   of the monitor.  All of it is outside the simulation and none of it is
   inside it.
   ========================================================================== */
const Chrome = (() => {
  function ovl(card) {
    const ov = el("div", { class: "ovl" }, card);
    ov.addEventListener("click", e => { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
    return ov;
  }
  function closeBtn(ov, label) {
    const b = el("button", { class: "mus-btn" }, label || "Close");
    b.addEventListener("click", () => ov.remove());
    return b;
  }

  /* ---- the floppy drive and the CD-ROM ------------------------------- */
  function drives() {
    const card = el("div", { class: "card" });
    function rebuild() {
      card.innerHTML = "";
      const disks = State.get("floppies", []);
      const inDrive = State.get("floppyIn", false) ? State.get("floppyLabel", null) : null;
      card.append(
        el("h2", null, "Drives"),
        el("p", null, "This is the front of the machine. Changing a disk here is you standing " +
          "up and changing a disk."),
        el("h3", null, "Floppy drive A:"),
        el("p", null, inDrive
          ? el("span", null, "In the drive: ", el("b", null, inDrive), " (" +
              ((disks.find(d => d.label === inDrive) || {}).kind || "unknown") + ")")
          : "Empty."));
      const row = el("div", { class: "row" });
      if (inDrive) {
        const e2 = el("button", { class: "mus-btn" }, "Eject");
        e2.addEventListener("click", () => { State.set("floppyIn", false); Sound.step(); rebuild(); });
        row.appendChild(e2);
      }
      const blank = el("button", { class: "mus-btn" }, "Insert a blank formatted disk");
      blank.addEventListener("click", () => {
        State.set("floppyIn", true); State.set("floppyLabel", "blank");
        const d2 = State.get("floppies", []);
        if (!d2.some(x => x.label === "blank")) { d2.push({ label: "blank", kind: "blank" }); State.set("floppies", d2); }
        Sound.step(); Sound.floppyOn(700); rebuild();
      });
      row.appendChild(blank);
      card.appendChild(row);
      if (disks.filter(d => d.kind !== "blank").length) {
        card.appendChild(el("h3", null, "Disks you have written"));
        const t = el("table");
        for (const d2 of disks) {
          if (d2.kind === "blank") continue;
          const b2 = el("button", { class: "mus-btn" }, inDrive === d2.label ? "in the drive" : "Insert");
          if (inDrive === d2.label) b2.disabled = true;
          b2.addEventListener("click", () => {
            State.set("floppyIn", true); State.set("floppyLabel", d2.label);
            if (d2.kind === "boot") State.set("floppy", { kind: "boot", root: d2.root,
              kernel: "/" + (d2.image || "vmlinuz"), kmeta: d2.kmeta || null });
            Sound.step(); Sound.floppyOn(800); rebuild();
          });
          t.appendChild(el("tr", null, el("td", null, d2.label), el("td", null,
            (d2.kind === "bootkernel" ? "bootkernel disk" : d2.kind === "rootdisk" ? "root/install disk" :
             d2.kind === "boot" ? "boot disk for this system" : d2.kind), " ", b2)));
        }
        card.appendChild(t);
      } else {
        card.appendChild(el("p", null, el("b", null, "No disks written yet. "),
          "The two you need are made under DOS with RAWRITE, off the CD. See the guide's " +
          "\"Try this\" tab."));
      }
      card.appendChild(el("h3", null, "CD-ROM drive"));
      const cdIn = State.get("cdIn", true);
      card.appendChild(el("p", null, cdIn
        ? el("span", null, "In the drive: ", el("b", null, "Slackware Linux 3.4.0"), " (Walnut Creek CDROM)")
        : "Empty."));
      const cdrow = el("div", { class: "row" });
      const cdb = el("button", { class: "mus-btn" }, cdIn ? "Eject" : "Insert the Slackware disc");
      cdb.addEventListener("click", () => {
        if (cdIn && Disk.isMounted("/cdrom")) {
          alert2("The drive will not open: the disc is mounted. Unmount it first with " +
            "umount /cdrom. This is not the exhibit being awkward; a mounted CD-ROM drive " +
            "really did refuse to eject, which surprised everybody exactly once.");
          return;
        }
        State.set("cdIn", !cdIn);
        Sound.seek(3);
        rebuild();
      });
      cdrow.appendChild(cdb);
      card.appendChild(cdrow);
      card.appendChild(el("div", { class: "row" }, closeBtn(ov)));
    }
    const ov = ovl(card);
    rebuild();
  }
  function alert2(msg) {
    const card = el("div", { class: "card" }, el("p", null, msg));
    const ov2 = ovl(card);
    card.appendChild(el("div", { class: "row" }, closeBtn(ov2, "All right")));
  }

  /* ---- inside the case: original artwork, drawn as boxes and text ---- */
  function machine() {
    const card = el("div", { class: "card" });
    let tab = "case";
    function rebuild() {
      card.innerHTML = "";
      card.append(el("h2", null, Hw.M.brand));
      const tabs = el("div", { class: "row", style: { justifyContent: "flex-start", marginTop: "0", marginBottom: "12px" } });
      for (const [id, label] of [["case", "Inside the case"], ["monitor", "The monitor"],
        ["bios", "BIOS setup"], ["printer", "The printer"], ["note", "A note left in the case"]]) {
        const b = el("button", { class: "mus-btn" + (tab === id ? " on" : "") }, label);
        b.addEventListener("click", () => { tab = id; rebuild(); });
        tabs.appendChild(b);
      }
      card.appendChild(tabs);
      if (tab === "case") caseTab();
      if (tab === "monitor") monitorTab();
      if (tab === "bios") biosTab();
      if (tab === "printer") printerTab();

      card.appendChild(el("div", { class: "row" }, closeBtn(ov)));
    }
    function jumperBank(label, opts, current, set) {
      const bank = el("div", { class: "jb" }, el("div", { class: "jl" }, label));
      const pins = el("div", { class: "pins" });
      for (const o of opts) {
        const pin = el("div", { class: "jpin" + (String(o) === String(current) ? " set" : "") }, String(o));
        pin.title = "Move the jumper to " + o;
        pin.addEventListener("click", () => { set(o); rebuild(); });
        pins.appendChild(pin);
      }
      bank.appendChild(pins);
      return bank;
    }
    function caseTab() {
      const j = Hw.jumpers();
      card.append(
        el("p", null, "The lid is off. Four ISA cards and one PCI card. On an ISA card the " +
          "interrupt and the I/O address are set by jumpers or DIP switches on the card " +
          "itself, and the numbers are printed next to them, and nothing in the machine can " +
          "find them out for you."),
        el("p", null, el("b", null, "You can move these. "), "Click a position and the jumper " +
          "moves. What the software believes does not change when you do."));
      const grid = el("div", { class: "caseview" });
      /* the SCSI host adapter */
      const scsi = el("div", { class: "card-isa" },
        el("div", { class: "nm" }, Hw.M.scsiCard),
        el("div", { class: "sub" }, "16-bit ISA  ·  slot 2  ·  SCSI host adapter"),
        el("div", { class: "mono-note" },
          "BIOS  " + Hw.M.scsiBios + "\nIRQ   " + Hw.M.scsiIrq + "   (soldered, W2 removed)\nDMA   " +
          Hw.M.scsiDma + "\nPort  0x330\n\nID 0  hard disk\nID 4  CD-ROM"),
        el("div", { class: "fing" }));
      grid.appendChild(scsi);
      /* the sound card, whose jumpers matter */
      const snd = el("div", { class: "card-isa" },
        el("div", { class: "nm" }, Hw.M.sound.board),
        el("div", { class: "sub" }, "16-bit ISA  ·  slot 3  ·  " + Hw.M.sound.kind));
      const jb = el("div", { class: "jbank" });
      jb.appendChild(jumperBank("JP1 addr", ["0x220", "0x240", "0x260", "0x280"], j.sndBase,
        v => Hw.setJumper("sndBase", v)));
      jb.appendChild(jumperBank("JP2 irq", [5, 7, 9, 10], j.sndIrq, v => Hw.setJumper("sndIrq", v)));
      jb.appendChild(jumperBank("JP3 dma", [0, 1, 3], j.sndDma, v => Hw.setJumper("sndDma", v)));
      jb.appendChild(jumperBank("JP4 dma16", [5, 6, 7], j.sndDma16, v => Hw.setJumper("sndDma16", v)));
      snd.appendChild(jb);
      const conflict = Hw.sound.conflict();
      snd.appendChild(el("div", { class: "mono-note" },
        conflict === "irq7-lpt1" ? "IRQ 7 is the parallel port on this machine.\nSound and printing will not both work." :
        conflict === "irq11-scsi" ? "IRQ 11 belongs to the SCSI host adapter.\nThe driver will not claim it." :
        conflict === "dma5-scsi" ? "DMA 5 belongs to the SCSI host adapter.\nHanding it to sound will lock the machine\nthe first time anything opens /dev/audio." :
        "No conflict with anything else in this machine."));
      snd.appendChild(el("div", { class: "fing" }));
      grid.appendChild(snd);
      /* the network card, on DIP switches */
      const net = el("div", { class: "card-isa" },
        el("div", { class: "nm" }, Hw.M.net.board),
        el("div", { class: "sub" }, "16-bit ISA  ·  slot 4  ·  " + Hw.M.net.kind));
      const nb = el("div", { class: "jbank" });
      nb.appendChild(jumperBank("SW1 i/o", ["0x280", "0x300", "0x320", "0x340"], j.netIo,
        v => Hw.setJumper("netIo", v)));

    function biosTab() {
      card.append(

  /* ---- About ---------------------------------------------------------- */
  function about() {

        "1997: kernel 2.0.30, libc 5.4.33, gcc 2.7.2.3, ld.so 1.9.5, XFree86 3.3.1. One HTML " +
        "file, no external resources, works from ", el("code", null, "file://"), "."),
      el("h3", null, "Slackware, and Patrick Volkerding"),
      el("p", null, "Slackware is the oldest surviving Linux distribution. Patrick Volkerding " +
        "released the first version in July 1993, and he still maintains it, and it is still " +
        "released. It still has no automatic dependency resolution and still uses BSD-style " +

      el("p", null, "It outlasted essentially every distribution that was going to replace it. " +

      el("p", null, "This exhibit is an unofficial homage with no involvement from or " +

      el("h3", null, "Simulation, not emulation"),

      el("h3", null, "Artwork"),
      el("p", null, "All of it is generated in code: the character cells, the clock faces, the " +

        "own logo and mascot are not reproduced, and where a vendor mark would sit there is " +

      el("h3", null, "What is stored"),
      el("p", null, "LocalStorage holds the installed package set (and the filesystem is rebuilt " +

      el("h3", null, "Standing"),
      el("p", null, "Linux is Linus Torvalds'. Slackware is Patrick Volkerding's. XFree86 is the " +
        "XFree86 Project's work, now continued as X.Org. The HOWTOs in this exhibit are written " +

    const ov = ovl(card);
    card.appendChild(el("div", { class: "row" },

        target: "_blank", rel: "noopener" }, "slackware.com"); return b; })(),

  }

  /* ---- Reformat ------------------------------------------------------- */
  function reformat() {
    const card = el("div", { class: "card" },
      el("h2", null, "Reformat and start again"),
      el("p", null, "This erases everything stored in your browser for this page: the installed " +
        "packages and the filesystem they produced, every file you made or edited, the " +
        "partition table, your XF86Config, the kernel you built, the network configuration, " +
        "the jumper positions and the floppies you wrote."),
      el("p", null, "The machine goes back to how it was on the evening of 26 October 1997: a " +
        "1.6 GB SCSI disk with somebody else's DOS partition on it, a Slackware CD in the " +
        "drive, and no boot floppies."));
    const ov = ovl(card);
    const row = el("div", { class: "row" });
    row.appendChild(closeBtn(ov, "Cancel"));
    const skip = el("button", { class: "mus-btn" }, "Skip to an installed system");
    skip.addEventListener("click", () => {
      const c2 = el("div", { class: "card" },
        el("h2", null, "Skipping the installation"),
        el("p", null, el("b", null, "This is a deliberate choice and it has a label attached.")),
        el("p", null, "The installation is the exhibit. It is the part where you choose a boot " +
          "floppy out of fifty-seven with nothing to guide you, partition a disk with no undo, " +
          "and tick fourteen letters without being told what any of them need. Everything this " +
          "exhibit has to say about 1997 is in those twenty minutes."),
        el("p", null, "What you get instead is the last part: a working machine with A, AP, D, F, " +
          "N, X and XAP installed, LILO in the boot sector, no boot floppy, and ",
          el("code", null, "root"), " / ", el("code", null, "slack"), " to log in with. X is " +
          "not configured — that part you still do yourself."),

      const ov2 = ovl(c2);
      const r2 = el("div", { class: "row" });
      r2.appendChild(closeBtn(ov2, "Actually, let me install it"));
      const go = el("button", { class: "mus-btn warn" }, "Skip it, with the label");
      go.addEventListener("click", () => { Installer.skipToInstalled(); location.reload(); });
      r2.appendChild(go);
      c2.appendChild(r2);
    });
    row.appendChild(skip);
    const wipe = el("button", { class: "mus-btn warn" }, "Erase everything and start from DOS");

  /* ---- input routing -------------------------------------------------- */
  function keys() {
    window.addEventListener("keydown", e => {
      /* the guide's own key, outside the machine */
      if (e.key === "F9" && e.shiftKey) { e.preventDefault(); Guide.toggle(); return; }
      if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      /* The machine has the keyboard.  A button that has been clicked keeps
         the browser's focus, and a space or a return would then press it
         again -- which, when the button is Reset, is a memorable way to
         lose an afternoon.  Buttons inside the guide and inside a panel
         keep working, because there the keyboard is not the machine's. */
      const af = document.activeElement;
      if (af && af !== document.body && /^(BUTTON|A|SUMMARY|SELECT)$/.test(af.tagName) &&
          !af.closest("#guide") && !af.closest(".ovl")) {
        if (e.key === " " || e.key === "Enter") e.preventDefault();
        af.blur();
      }
      /* Ctrl+Alt+Backspace goes to the X server wherever you are */
      if (X.keydown(e)) return;
      if (Museum.isLocked()) return;
      /* Alt+F1..F7: the virtual terminals */
      if (e.altKey && /^F[1-7]$/.test(e.key)) {
        e.preventDefault();
        if (!Con.canSwitch()) return;
        Con.show(Number(e.key.slice(1)));
        return;
      }
      if (document.body.classList.contains("xon")) return;
      /* everything else goes to the active terminal */
      const vt = Con.active();
      if (!vt) return;
      if (e.metaKey) return;
      if (e.key === "Tab" || e.key === "Backspace" || e.key.startsWith("Arrow") ||
          e.key === "Home" || e.key === "End" || e.key === "PageUp" || e.key === "PageDown" ||
          e.key === " " || e.key === "Enter" || e.key === "F10" ||
          (e.ctrlKey && e.key.length === 1)) e.preventDefault();
      if (e.key.length > 1 && !/^(Enter|Tab|Backspace|Delete|Escape|Arrow|Home|End|Page|F\d)/.test(e.key)) return;
      vt.push(mkKey(e));
    });
    /* clicking the screen focuses it and, under X, is a pointer event */
    $("#screen").addEventListener("mousedown", e => {
      if (!document.body.classList.contains("xon")) e.preventDefault();
    });
    window.addEventListener("contextmenu", e => {
      if (e.target && $("#screen").contains(e.target)) e.preventDefault();
    });
  }

  function rail() {
    const set = (id, on) => { const b = $(id); if (b) b.classList.toggle("on", !!on); };
    set("#btnSound", State.get("sound", false));
    set("#btnScan", !State.get("noscan", false));
    set("#btnFast", State.get("fast", false));
    document.body.classList.toggle("noscan", State.get("noscan", false));
    $("#btnSound").addEventListener("click", () => {
      const v = !State.get("sound", false);
      State.set("sound", v);
      set("#btnSound", v);
      if (v) Sound.test();
    });
    $("#btnScan").addEventListener("click", () => {
      const v = !State.get("noscan", false);
      State.set("noscan", v);
      document.body.classList.toggle("noscan", v);
      set("#btnScan", !v);
    });
    $("#btnFast").addEventListener("click", () => {
      const v = !State.get("fast", false);
      State.set("fast", v);
      set("#btnFast", v);
    });
    $("#btnDrives").addEventListener("click", drives);
    $("#btnCase").addEventListener("click", machine);
    $("#btnAbout").addEventListener("click", about);
    $("#btnReset").addEventListener("click", reformat);
    $("#btnPower").addEventListener("click", () => {
      Sound.beep(500, 40);
      Museum.unlock();
      if (X.running()) X.kill("reset");
      State.flush();
      Boot.power();
    });
  }

  function init() {
    Screen.measure();
    Screen.textMode();
    Screen.fit();
    window.addEventListener("resize", () => Screen.fit());
    Pkg.rebuild();
    X.attachRoot();
    keys();
    rail();
    Guide.init();
    /* if the visitor was mid-installation when they closed the tab, the
       machine is where they left it: powered off, with the floppies they
       made still in the box */
    State.set("installing", false);
    Boot.power();
  }
  return { init, drives, machine, about, reformat };
})();
