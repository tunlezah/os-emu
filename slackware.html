<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slackware Linux 3.4 — The OS Museum</title>
<meta name="description" content="An interactive, single-file simulation of Slackware Linux 3.4.0, October 1997: boot and root floppies, fdisk with no undo, lettered disk sets with no dependency resolution, xf86config, and a login prompt that congratulates nobody.">
<style>
/* ==========================================================================
   Slackware Linux 3.4.0 — a single-file exhibit for The OS Museum
   --------------------------------------------------------------------------
   Kernel 2.0.30, libc 5.4.33, gcc 2.7.2.3, ld.so 1.9.5, XFree86 3.3.1.

   Everything here is original and generated in code.  No external fonts,
   images, scripts or stylesheets; no network access of any kind.  Runs from
   file:// with LocalStorage for persistence.

   The visual budget is deliberately tiny.  This machine spends most of its
   life as an 80x25 character grid, and XFree86 in 1997 was flat colour and
   bitmap fonts.  There is one drawing primitive in this file -- a character
   cell with a foreground and a background out of sixteen -- and everything
   from the BIOS through fdisk, setup, vi, menuconfig and lynx is drawn with
   it.  The budget went on the machinery instead.
   ========================================================================== */

/* ---- museum chrome (this is the museum talking, not Slackware) --------- */
:root{
  --mus-bg:#0a0c11; --mus-panel:#12151f; --mus-fg:#e8ecf5; --mus-dim:#94a0b8;
  --mus-edge:#242c40; --mus-accent:#7fd1a0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--mus-bg)}
body{font:13px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--mus-fg);-webkit-user-select:none;user-select:none}

.mus-rail{position:fixed;left:0;right:0;top:0;height:34px;z-index:900;display:flex;align-items:center;
  gap:7px;padding:0 10px;background:var(--mus-panel);border-bottom:1px solid var(--mus-edge)}
.mus-rail .brand{font:600 12px/1 inherit;letter-spacing:.02em;white-space:nowrap}
.mus-rail .brand span{color:var(--mus-accent);font-weight:400;margin-left:8px;
  font:11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase}
.mus-rail .spacer{flex:1 1 auto}
.mus-btn{background:#1a2032;border:1px solid var(--mus-edge);color:var(--mus-dim);border-radius:4px;
  font:11px/1 inherit;padding:6px 9px;cursor:pointer;white-space:nowrap}
.mus-btn:hover{color:var(--mus-fg);border-color:var(--mus-accent)}
.mus-btn.on{background:var(--mus-accent);border-color:var(--mus-accent);color:#06210f;font-weight:700}
.mus-btn.warn:hover{border-color:#ff8f8f;color:#ffd7d7}
.mus-rail a.mus-btn{text-decoration:none;display:inline-block}
.mus-rail .vtlamp{font:10px/1 ui-monospace,Menlo,Consolas,monospace;color:#6f7c94;letter-spacing:.1em;
  padding:0 4px;white-space:nowrap}
.mus-rail .vtlamp b{color:var(--mus-accent)}
@media (max-width:1000px){ .mus-rail .hideable{display:none} }

/* ---- the monitor ------------------------------------------------------- */
#viewport{position:fixed;left:0;right:0;top:34px;bottom:0;background:#05070a;overflow:hidden;
  transition:right .18s ease}
/* the guide takes room rather than covering the screen, because the right
   edge of an X display is where the pager and the taskbar's clock live */
body:not(.noguide) #viewport{right:412px}
@media (max-width:1080px){ body:not(.noguide) #viewport{right:0} }
#bezel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#0b0d10;padding:0;box-shadow:0 0 90px rgba(0,0,0,.9),0 0 0 1px #1b2130}
#screen{position:relative;overflow:hidden;background:#000;transform-origin:top left}
/* the phosphor.  Kept subtle: a real 15-inch shadow-mask tube, not a toy. */
#scanlines{position:absolute;inset:0;z-index:600;pointer-events:none;opacity:.20;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.55) 2px 4px)}
body.noscan #scanlines{display:none}
#vignette{position:absolute;inset:0;z-index:601;pointer-events:none;
  background:radial-gradient(ellipse 78% 78% at 50% 48%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}
body.noscan #vignette{display:none}
/* the monitor going out of range, and the moment nobody should reproduce
   faithfully: a rolling, tearing, dark screen with a rising whine. */
#rollfield{position:absolute;inset:0;z-index:590;display:none;pointer-events:none}
body.rolling #rollfield{display:block}
body.rolling #chars,body.rolling #x11{animation:roll 1.15s linear infinite}
body.rolling #screen{filter:brightness(.42) contrast(1.5) saturate(.6)}
@keyframes roll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
#tear{position:absolute;left:0;right:0;height:14%;top:0;background:rgba(255,255,255,.06);
  animation:tear 2.3s linear infinite}
@keyframes tear{0%{top:-14%}100%{top:100%}}

/* ---- the character grid ------------------------------------------------ */
/* One <div> per row, one <span> per run of identical attributes.  This is
   the whole graphics stack for text mode. */
#chars{position:absolute;left:0;top:0;z-index:100;white-space:pre;
  font-family:"DejaVu Sans Mono","Liberation Mono","Lucida Console",Menlo,Consolas,"Courier New",monospace;
  font-variant-ligatures:none;letter-spacing:0;text-rendering:geometricPrecision}
#chars .r{display:block;height:var(--ch);overflow:hidden}
#chars i{font-style:normal}
#curs{position:absolute;z-index:110;background:#aaa;mix-blend-mode:difference;display:none}
body.curson #curs{display:block}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
#curs.blink{animation:blink 1.06s steps(1,end) infinite}

/* ---- X11 -------------------------------------------------------------- */
/* XFree86 3.3.1 had no antialiasing, no compositing, no rounded anything
   and no shadows.  Everything below is flat fills and one-pixel lines. */
#x11{position:absolute;inset:0;z-index:200;display:none;overflow:hidden;
  font-family:"DejaVu Sans Mono","Liberation Mono","Lucida Console",Menlo,Consolas,"Courier New",monospace}
body.xon #x11{display:block}
body.xon #chars{display:none}
/* the root weave: a two-pixel checkerboard, which is what "grey stipple"
   actually was -- black and white pixels, not a grey. */
#xroot{position:absolute;inset:0;
  background-image:conic-gradient(#000 0 25%,#c0c0c0 0 50%,#000 0 75%,#c0c0c0 0);
  background-size:2px 2px}
#xroot.solid{background-image:none}
#xwins{position:absolute;inset:0;pointer-events:none}
#xwins>*{pointer-events:auto}
#xover{position:absolute;inset:0;pointer-events:none;z-index:520}
#xcursor{position:absolute;z-index:560;pointer-events:none;width:15px;height:15px;margin:-7px 0 0 -7px}
body.xon #screen{cursor:none}
body.xon.nativecursor #screen{cursor:default}
body.xon.nativecursor #xcursor{display:none}

/* X client windows.  The frame is drawn by whichever window manager is
   running; the client area is the same in all of them. */
.xw{position:absolute;background:#c6c6c6;color:#000}
.pager,.olmenu,.xmenu,#taskbar,#startmenu{color:#000}
.xw.raise{z-index:5}
.cli{position:absolute;overflow:hidden;background:#c6c6c6}
.xterm{background:#000;color:#c8c8c8;white-space:pre;overflow:hidden;
  font-family:inherit;line-height:1}
.xterm i{font-style:normal}
.bevo{border-style:solid;border-width:2px;border-color:#fff #545454 #545454 #fff}
.bevi{border-style:solid;border-width:2px;border-color:#545454 #fff #fff #545454}
.bev1o{border-style:solid;border-width:1px;border-color:#fff #545454 #545454 #fff}
.bev1i{border-style:solid;border-width:1px;border-color:#545454 #fff #fff #545454}

/* fvwm 1.23b / twm: grey, thin, and pointedly not decorated */
.fr-fvwm{background:#c6c6c6;border:2px solid #c6c6c6;box-shadow:0 0 0 1px #000}
.fr-fvwm>.tt{height:19px;background:#9a9a9a;color:#000;font:bold 11px/19px inherit;
  padding:0 4px;display:flex;align-items:center;gap:3px;overflow:hidden}
.fr-fvwm.act>.tt{background:#5e78a8;color:#fff}
.fr-fvwm>.tt .tb{width:15px;height:15px;flex:0 0 auto;background:#c6c6c6;
  border-style:solid;border-width:1px;border-color:#fff #545454 #545454 #fff;cursor:pointer;
  position:relative}
.fr-fvwm>.tt .lab{flex:1 1 auto;text-align:center;white-space:nowrap;overflow:hidden}
.fr-twm{background:#c6c6c6;border:1px solid #000}
.fr-twm>.tt{height:20px;background:#c6c6c6;border-bottom:1px solid #000;
  font:bold 11px/20px inherit;display:flex;align-items:center;gap:0;overflow:hidden}
.fr-twm.act>.tt{background:#dcdcdc}
.fr-twm>.tt .tb{width:20px;height:19px;flex:0 0 auto;border-right:1px solid #000;cursor:pointer;
  position:relative;background:#c6c6c6}
.fr-twm>.tt .tb.r{border-right:0;border-left:1px solid #000}
.fr-twm>.tt .lab{flex:1 1 auto;text-align:center;white-space:nowrap;overflow:hidden;padding:0 4px}

/* fvwm95-2: the configuration an enormous number of people really ran */
.fr-f95{background:#c0c0c0;border-style:solid;border-width:2px;
  border-color:#dfdfdf #404040 #404040 #dfdfdf;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #808080}
.fr-f95>.tt{height:18px;margin:2px 2px 0;background:#808080;color:#c0c0c0;
  font:bold 11px/18px inherit;display:flex;align-items:center;gap:2px;padding:0 2px}
.fr-f95.act>.tt{background:linear-gradient(90deg,#000080,#1084d0);color:#fff}
.fr-f95>.tt .lab{flex:1 1 auto;white-space:nowrap;overflow:hidden;padding-left:2px}
.fr-f95>.tt .tb{width:16px;height:14px;flex:0 0 auto;background:#c0c0c0;cursor:pointer;position:relative;
  border-style:solid;border-width:1px;border-color:#fff #000 #000 #fff;
  box-shadow:inset 1px 1px 0 #dfdfdf,inset -1px -1px 0 #808080}
#taskbar{position:absolute;left:0;right:0;bottom:0;height:28px;background:#c0c0c0;z-index:400;
  color:#000;border-top:2px solid #fff;display:flex;align-items:center;gap:3px;padding:2px 3px}
#taskbar .start{height:22px;padding:0 6px 0 4px;background:#c0c0c0;font:bold 11px/20px inherit;
  display:flex;align-items:center;gap:4px;cursor:pointer;
  border-style:solid;border-width:1px;border-color:#fff #000 #000 #fff;
  box-shadow:inset 1px 1px 0 #dfdfdf,inset -1px -1px 0 #808080}
#taskbar .start.dn,#taskbar .tbtn.dn{border-color:#000 #fff #fff #000;
  box-shadow:inset 1px 1px 0 #808080;padding-left:5px}
#taskbar .tbtn{height:22px;min-width:110px;max-width:160px;padding:0 5px;background:#c0c0c0;
  font:11px/20px inherit;display:flex;align-items:center;gap:4px;cursor:pointer;overflow:hidden;
  white-space:nowrap;border-style:solid;border-width:1px;border-color:#fff #000 #000 #fff;
  box-shadow:inset 1px 1px 0 #dfdfdf,inset -1px -1px 0 #808080}
#taskbar .tray{margin-left:auto;height:22px;padding:0 6px;font:11px/20px inherit;
  display:flex;align-items:center;gap:6px;border-style:solid;border-width:1px;
  border-color:#808080 #fff #fff #808080}
#startmenu{position:absolute;z-index:430;background:#c0c0c0;padding:2px;
  border-style:solid;border-width:1px;border-color:#fff #000 #000 #fff;
  box-shadow:inset 1px 1px 0 #dfdfdf,inset -1px -1px 0 #808080;display:flex}
#startmenu .spine{width:21px;background:linear-gradient(0deg,#000080,#1084d0);flex:0 0 auto;
  position:relative}
#startmenu .spine span{position:absolute;bottom:6px;left:3px;transform-origin:0 0;
  transform:rotate(-90deg);color:#fff;font:bold 13px inherit;white-space:nowrap}
#startmenu .items{flex:1 1 auto;min-width:170px;color:#000}

/* olvwm: OPEN LOOK, in a Linux package, after Sun had moved on */
.fr-olvwm{background:#d6d3cc;border:1px solid #000}
.fr-olvwm>.tt{height:22px;background:#d6d3cc;font:bold 11px/22px inherit;color:#000;
  display:flex;align-items:center;gap:5px;padding:0 4px;border-bottom:1px solid #8f8c86}
.fr-olvwm.act>.tt{background:#cfcbc2}
.fr-olvwm>.tt .lab{flex:1 1 auto;text-align:center;white-space:nowrap;overflow:hidden}
.fr-olvwm .pin{width:13px;height:15px;flex:0 0 auto;cursor:pointer;position:relative}
.olmenu{position:absolute;z-index:430;background:#d6d3cc;border:1px solid #000;
  box-shadow:2px 2px 0 rgba(0,0,0,.35);padding:2px 0;min-width:130px}
.olmenu .mi{font:11px/17px inherit;padding:1px 16px 1px 10px;cursor:pointer;color:#000;white-space:nowrap}
.olmenu .mi:hover{background:#a8a49b}
.olmenu .sep{height:1px;background:#8f8c86;margin:2px 4px}
.olmenu .ttl{font:bold 11px/16px inherit;padding:1px 10px;border-bottom:1px solid #8f8c86;
  margin-bottom:2px;color:#000}

/* generic X menus (fvwm/twm root menus) */
.xmenu{position:absolute;z-index:430;background:#c6c6c6;padding:0;min-width:132px;
  border-style:solid;border-width:2px;border-color:#fff #545454 #545454 #fff}
.xmenu .ttl{font:bold 11px/17px inherit;text-align:center;background:#9a9a9a;color:#000;
  border-bottom:1px solid #545454}
.xmenu .mi{font:11px/17px inherit;padding:0 14px 0 8px;cursor:pointer;color:#000;white-space:nowrap}
.xmenu .mi:hover{background:#5e78a8;color:#fff}
.xmenu .mi.dim{color:#7c7c7c}
.xmenu .sep{height:2px;border-top:1px solid #545454;border-bottom:1px solid #fff;margin:2px 0}

/* the fvwm pager: a virtual desktop you can actually see */
.pager{position:absolute;z-index:390;background:#5e78a8;border-style:solid;border-width:2px;
  border-color:#fff #545454 #545454 #fff;display:grid;cursor:default}
.pager .pv{border-right:1px solid #3d5379;border-bottom:1px solid #3d5379;position:relative;
  overflow:hidden}
.pager .pv.cur{background:#7e96c4}
.pager .pw{position:absolute;background:#c6c6c6;border:1px solid #000}
.pager .pl{position:absolute;left:1px;top:0;font:8px/9px inherit;color:#dfe6f4}

/* client interiors: xclock, xeyes, xbill, xload, xman, netscape-era browser */
.pad{padding:3px 5px}
.list{overflow:auto;background:#fff;border-style:solid;border-width:1px;
  border-color:#545454 #fff #fff #545454;font:11px/14px inherit}
.list .row{padding:0 4px;cursor:default;white-space:pre}
.list .row.sel{background:#000080;color:#fff}
.xbtn{background:#c6c6c6;font:11px/1 inherit;padding:3px 8px;cursor:pointer;display:inline-block;
  border-style:solid;border-width:2px;border-color:#fff #545454 #545454 #fff}
.xbtn:active,.xbtn.dn{border-color:#545454 #fff #fff #545454}
.brow{background:#c6c6c6;color:#000;overflow:auto;font:13px/1.35 "Times New Roman",Times,serif}
.brow .pg{background:#c0c0c0;padding:8px 10px;min-height:100%}
.brow h1{font:bold 24px/1.15 "Times New Roman",Times,serif;margin:0 0 6px}
.brow h2{font:bold 19px/1.2 "Times New Roman",Times,serif;margin:10px 0 4px}
.brow h3{font:bold 15px/1.2 "Times New Roman",Times,serif;margin:9px 0 3px}
.brow p{margin:0 0 9px}
.brow a{color:#0000ee;text-decoration:underline;cursor:pointer}
.brow a.v{color:#551a8b}
.brow hr{border:0;border-top:1px solid #808080;border-bottom:1px solid #fff;margin:8px 0}
.brow ul{margin:0 0 9px 26px}
.brow .blink{animation:blink 1s steps(1,end) infinite}
.brow center{display:block;text-align:center}
.brow .marq{overflow:hidden;white-space:nowrap}
.brow .marq span{display:inline-block;animation:marq 12s linear infinite}
@keyframes marq{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.brow table{border-collapse:collapse;margin:0 0 9px}
.brow td,.brow th{border:1px solid #808080;padding:2px 5px;font-size:12px}
.brow .under{background:#c0c0c0;border:2px ridge #808080;padding:5px 7px;margin:0 0 9px;font-size:12px}

/* ---- guide layer (separable; nothing in the simulation calls into it) -- */
#guide{position:fixed;right:0;top:34px;bottom:0;width:412px;z-index:920;background:#0c111ceb;
  border-left:1px solid var(--mus-edge);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .18s ease;backdrop-filter:blur(2px)}
#guide.on{transform:none}
#guide header{flex:0 0 auto;padding:10px 12px;border-bottom:1px solid var(--mus-edge);display:flex;
  align-items:center;gap:9px}
#guide header h2{font:700 13px inherit;flex:1 1 auto}
#guide .gtabs{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:4px;padding:7px 8px 0}
#guide .gtabs button{background:#141a28;border:1px solid var(--mus-edge);border-bottom:0;color:#93a2bb;
  padding:4px 8px;font:11px inherit;cursor:pointer;border-radius:3px 3px 0 0}
#guide .gtabs button.on{background:#0c111c;color:var(--mus-accent);font-weight:700;border-color:#39435f}
#guide .gbody{flex:1 1 auto;overflow:auto;border-top:1px solid var(--mus-edge);padding:12px 14px 40px;
  font:13px/1.55 inherit;color:#cfd6e4}
#guide .gbody h3{font:700 13px inherit;color:#fff;margin:16px 0 6px}
#guide .gbody h3:first-child{margin-top:0}
#guide .gbody p{margin:0 0 9px}
#guide .gbody ul,#guide .gbody ol{margin:0 0 10px 18px}
#guide .gbody li{margin-bottom:5px}
#guide .gbody b{color:#fff}
#guide .gbody code{font:12px ui-monospace,Menlo,Consolas,monospace;color:#ffd98a;
  background:#1a2030;padding:1px 4px;border-radius:3px}
#guide .gbody a{color:var(--mus-accent)}
#guide .note{border-left:3px solid var(--mus-accent);background:#141d1a;padding:8px 10px;margin:0 0 10px}
#guide .warn{border-left:3px solid #ff9d6e;background:#221a16;padding:8px 10px;margin:0 0 10px}
#guide .gbody table{border-collapse:collapse;width:100%;margin:0 0 10px;font-size:12px}
#guide .gbody td{border-top:1px solid #22293b;padding:4px 6px;vertical-align:top}
#guide .gbody td:first-child{color:#ffd98a;font-family:ui-monospace,Menlo,Consolas,monospace;
  white-space:nowrap}
#guide .gbody hr{border:0;border-top:1px solid #22293b;margin:14px 0}
body.noguide #guide{display:none}

/* the exhibit's own overlay panels share the guide's skin */
.ovl{position:fixed;inset:34px 0 0 0;z-index:930;background:#050810e8;display:flex;align-items:center;
  justify-content:center;padding:24px}
.ovl .card{max-width:720px;max-height:100%;overflow:auto;background:#0e1420;border:1px solid #2a3450;
  border-radius:8px;padding:22px 26px;font:13px/1.6 inherit;color:#cfd6e4}
.ovl .card h2{font:700 17px inherit;color:#fff;margin-bottom:10px}
.ovl .card h3{font:700 13px inherit;color:#fff;margin:16px 0 6px}
.ovl .card p{margin:0 0 10px}
.ovl .card ul{margin:0 0 10px 18px}
.ovl .card li{margin-bottom:5px}
.ovl .card b{color:#fff}
.ovl .card code{font:12px ui-monospace,Menlo,Consolas,monospace;color:#ffd98a}
.ovl .card a{color:var(--mus-accent)}
.ovl .row{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.ovl .card table{border-collapse:collapse;width:100%;margin:0 0 10px;font-size:12px}
.ovl .card td{border-top:1px solid #22293b;padding:4px 7px;vertical-align:top}
.ovl .card td:first-child{color:#ffd98a;font-family:ui-monospace,Menlo,Consolas,monospace;
  white-space:nowrap}

/* ---- inside the case: original artwork, drawn as boxes and text -------- */
.caseview{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:6px 0 4px}
.card-isa{background:#0d2416;border:1px solid #1d4a2e;border-radius:3px;padding:10px 12px;
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#bfe6cd;position:relative}
.card-isa .nm{font:700 12px/1.3 inherit;color:#e8fff0;margin-bottom:2px}
.card-isa .sub{color:#7fb495;font-size:11px;margin-bottom:8px}
.card-isa .fing{height:9px;background:repeating-linear-gradient(90deg,#c9a227 0 3px,#0d2416 3px 5px);
  margin:9px -12px -10px;border-radius:0 0 3px 3px;opacity:.8}
.jbank{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0 6px}
.jb{border:1px solid #2c6340;border-radius:2px;padding:4px 6px;background:#08170e}
.jb .jl{font-size:10px;color:#7fb495;letter-spacing:.08em;margin-bottom:3px;text-transform:uppercase}
.jb .pins{display:flex;gap:3px}
.jpin{width:13px;height:20px;border:1px solid #2c6340;border-radius:1px;background:#0b1f13;
  cursor:pointer;position:relative;display:flex;align-items:flex-end;justify-content:center;
  font-size:8px;color:#5f8f74;padding-bottom:1px}
.jpin.set{background:#1e1e1e;border-color:#c9a227}
.jpin.set::before{content:"";position:absolute;left:2px;right:2px;top:2px;height:11px;
  background:#111;border:1px solid #c9a227;border-radius:1px}
.jpin:hover{border-color:#7fd1a0}
.dip{display:flex;gap:2px}
.dsw{width:12px;height:22px;background:#12283a;border:1px solid #2c6340;cursor:pointer;position:relative}
.dsw::after{content:"";position:absolute;left:2px;right:2px;height:8px;background:#d9d9d9;top:2px}
.dsw.on::after{top:auto;bottom:2px}
.mono-note{font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#8fa8bd;white-space:pre-wrap}
</style>
</head>
<body class="curson noguide">

<!-- ================ MUSEUM CHROME — not part of Slackware ================ -->
<div class="mus-rail">
  <span class="brand">Slackware Linux 3.4.0 <span>The OS Museum</span></span>
  <span class="vtlamp hideable" id="vtlamp">&nbsp;</span>
  <span class="spacer"></span>
  <button class="mus-btn" id="btnPower">Reset</button>

<script>

/* ==========================================================================

const $  = (s, r) => (r || document).querySelector(s);

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);

    if (kid === null || kid === undefined || kid === false || kid === "") continue;

const pad2  = n => String(n).padStart(2, "0");

const padl  = (s, n) => { s = String(s); return s.length >= n ? s : " ".repeat(n - s.length) + s; };

const pick  = a => a[Math.floor(Math.random() * a.length)];
const uid   = (() => { let n = 1000; return p => (p || "id") + (++n); })();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MON   = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
/* Slackware is a US distribution of the era and the exhibit's clock reads
   October 1997, running at real speed from whenever the visitor arrives. */
const Clock = (() => {
  const BASE = new Date(1997, 9, 26, 21, 8, 12);
  const t0 = Date.now();
  return { now: () => new Date(BASE.getTime() + (Date.now() - t0)) };
})();
function stamp(d) {
  d = d || Clock.now();
  return DAY[d.getDay()] + " " + MON[d.getMonth()] + " " + padl(d.getDate(), 2) + " " +
         pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()) + " CDT 1997";
}
function lsdate(d) {
  d = d || Clock.now();
  return MON[d.getMonth()] + " " + padl(d.getDate(), 2) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
/* wrap a paragraph to n columns -- used by every man page, HOWTO and README */
function wrap(s, n) {
  const out = [];
  for (const para of String(s).split("\n")) {
    if (!para.length) { out.push(""); continue; }
    let line = "";
    for (const w of para.split(" ")) {
      if (!line.length) line = w;
      else if (line.length + 1 + w.length <= n) line += " " + w;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}

/* ==========================================================================
   MODULE 1 — STATE MANAGER
   --------------------------------------------------------------------------
   One key in LocalStorage, one module that touches it.  Everything the
   visitor changes lands here: which packages are installed and the
   filesystem that produced, every edited configuration file, .xinitrc and
   the window manager, XF86Config and whether X works, the kernel build
   state, the network configuration, files created, shell history, and the
   jumper positions on the cards.
   ========================================================================== */
const State = (() => {
  const KEY = "slackware34-exhibit-v1";
  let data = {};
  let timer = null;
  function load() {
    try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { data = {}; }
    return data;
  }
  function flush() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { } }
  function dirty() { clearTimeout(timer); timer = setTimeout(flush, 500); }
  function get(k, d) { return data[k] === undefined ? d : data[k]; }
  function set(k, v) { data[k] = v; dirty(); return v; }
  function reset() { data = {}; try { localStorage.removeItem(KEY); } catch (e) { } }
  load();
  window.addEventListener("beforeunload", flush);
  return { get, set, dirty, flush, reset, load, raw: () => data };
})();

/* ==========================================================================
   MODULE 2 — SOUND MANAGER
   --------------------------------------------------------------------------
   Optional, off by default, and entirely synthesized: floppy seek and step,
   hard disk chatter, the PC speaker, and a modem handshake.  The PC speaker
   is the only one of these that works before the sound card is configured,
   which is historically the point: the beep came off the motherboard.
   ========================================================================== */

  let ctx = null, whine = null;
  const on = () => State.get("sound", false);
  function ac() {
    if (ctx === null) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { ctx = false; } }

    return ctx || null;

    const c = ac(); if (!c) return null;
    const t = c.currentTime + (when || 0);

    o.type = type || "square"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol === undefined ? 0.05 : vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + ms / 1000 + 0.02);
    return o;

    const c = ac(); if (!c) return;
    const n = Math.floor(c.sampleRate * ms / 1000) || 1;

    beep(f, ms) { if (on()) tone(f || 880, ms || 90, 0.045, "square"); },
    /* the PC speaker, which is a square wave off a timer chip and sounds it */
    bell() { if (on()) tone(750, 110, 0.05, "square"); },
    /* one head step */
    step() { if (on()) noise(22, 0.16, 900, 2600); },
    /* a seek: a run of steps, which is the sound everybody remembers */

      if (!on()) return;

      for (let i = 0; i < n; i++) noise(18, 0.13, 800 + irnd(0, 900), 2800, i * 0.028);

      g.gain.setValueAtTime(0.03, t + (ms || 1200) / 1000 - 0.2);

      const dtmf = [[697,1209],[770,1336],[852,1477],[697,1336],[770,1209],[852,1336],[697,1477]];

HDR("  Linux Ethernet HOWTO", "  Paul Ostrowski, ostrowski@cs.tcd.example", "2.11", "14 August 1997") + `
  This is the Ethernet HOWTO. It describes which Ethernet cards work
  under Linux, and what you have to do to make them work. It does not
  cover the configuration of TCP/IP itself; for that, read the
  NET-3-HOWTO, which you should read anyway.


  1.  Introduction

  Nearly all of the trouble people have with Ethernet under Linux is
  one of three things:

       o  The driver is not in the kernel, or is not loaded.
       o  The driver is in the kernel but is probing at the wrong
          I/O address, or has been given the wrong IRQ.
       o  Two cards, or a card and something else, are on the same
          IRQ.

  There is no fourth thing. If you keep this list in front of you while
  you work, you will get there.

  1.1  Am I supposed to know my IRQ and I/O address?

  Yes. Nothing is going to tell you. On an ISA card, the I/O base and
  the interrupt are set with jumpers or DIP switches on the card
  itself, or with a DOS setup program supplied on a floppy that you
  have probably lost. If you still have the card in your hand, look at
  it: the settings are silkscreened next to the switches, and the
  manual, if you kept it, has a table.

  If the card is already in the machine and you cannot remember, take
  it out and look. This is not a joke and it is not a last resort. It
  is the normal procedure.


  2.  Which cards work

  The NE2000 and its clones are the most widely supported cards under
  Linux and the ones most likely to work with no argument. They are
  also the slowest and the most likely to be sold under a brand name
  you have never heard of. This is a fair trade.

  Cards using the 8390 chip (the NE1000, the NE2000 and the very large
  number of clones) are driven by the ne module. Cards using the LANCE
  chip use lance. 3Com cards use 3c503, 3c509 and so on by model
  number, and the model number is printed on the card.

  2.1  How do I tell what I have?

  If the card came in a box with a name on it that is not a chip name,
  the name on the box is unlikely to help you. Look at the largest chip
  on the card and read what is printed on it. A card whose largest chip
  says DP8390 or RTL8019 or anything ending in 8390 is an NE2000
  clone. Use the ne driver.


  3.  Getting the driver loaded

  If the driver is a module, you load it with insmod, and you tell it
  where to look:

       insmod ne io=0x300 irq=10

  If you do not pass io=, the ne driver will probe a list of common
  addresses, and if your card is not at one of them it will report

       ne.c: No NE*000 card found at i/o = 0x300

  which is the driver telling you, correctly, that it looked and there
  was nothing there. It is not a bug and it is not asking for your
  sympathy.

  If the module loads, the driver prints one line to the console
  describing what it found, including the Ethernet address, and this
  line is the only confirmation you are going to get.

  3.1  Making it happen at boot

  Slackware runs /etc/rc.d/rc.modules at boot, out of rc.S. It is a
  shell script full of commented-out insmod lines. Find the one for
  your card, take the # off the front, add your io= and irq=, and it
  will happen every time. Read the script before you edit it. It is
  shorter than this document.


  4.  Two cards, one interrupt

  If you have two devices on the same IRQ, one of them will not work,
  and which one it is may change between boots. Linux will not warn
  you, because Linux cannot tell: the ISA bus has no way to ask a card
  what interrupt it is using.

  Look at /proc/interrupts. Everything that has successfully claimed an
  interrupt is listed there, with a count of how many it has taken. A
  device with a count of 0 that ought to be busy is a device on the
  wrong interrupt.

  Interrupts that are almost always already taken on a PC:

       0    timer               8    real time clock
       1    keyboard            13   coprocessor
       2/9  cascade             14   first IDE controller
       3    COM2 and COM4       15   second IDE controller
       4    COM1 and COM3
       6    floppy
       7    the parallel port

  IRQ 5, 10, 11 and 12 are the ones you usually have to work with, and
  10 and 11 are the ones to try first.


  5.  It says the card is there and it still does not work

  Then the card is fine and your problem is the network configuration,
  which is not this document. Try:

       ifconfig eth0

  If that prints a configured interface with your address on it, the
  driver is working. If packets go out (TX) and none come back (RX),
  the card, the cable and the driver are all fine and you have a
  routing or an addressing problem. Read the NET-3-HOWTO.

  If TX is also zero, you have not brought the interface up.

  5.1  I have read the NET-3-HOWTO and it still does not work

  Read the Networking Overview HOWTO, and then read the NET-3-HOWTO
  again. Most of the questions asked on the newsgroups are answered in
  section 4 of the document the asker has just said they read.


  6.  Copyright and acknowledgements

  Copyright (c) 1997 Paul Ostrowski. This document may be distributed
  and modified freely provided this notice is retained. If you find an
  error, mail me; if you find twenty, mail me once.

  Thanks to everyone on comp.os.linux.setup who answered the same
  question forty times without complaining, and to the people who
  wrote the drivers, who owed us nothing.

  This document describes sound support in Linux, and what to do to get
  a sound card working. Read section 3 before you buy anything.


  1.  Introduction

  Sound under Linux is provided by a driver that is part of the kernel.
  It is not a program you install and it is not a module you can just
  load and expect to work. Under the 2.0 kernels you compile the driver
  into your kernel, and while you are compiling it you tell it, by
  hand, the I/O address, the interrupt and the DMA channels your card
  is set to.

  This is the part people do not expect, so it is worth saying
  plainly:

       The kernel does not detect your sound card. You tell the
       kernel where your sound card is, when you build it.

  If what you tell it is wrong, one of three things happens. Usually
  nothing at all happens and /dev/audio returns an error. Sometimes the
  card plays at the wrong speed or plays noise. Occasionally, if you
  have given it a DMA channel that belongs to something else, the
  machine locks up solid the first time anything opens the device, and
  you will need the reset button.


  2.  Finding out what your card is set to

  Take the lid off the machine and look at the card. This is the
  answer, and everything else in this section is a way of avoiding it.

  On a 16-bit ISA sound card of the Sound Blaster type you are looking
  for:

       o  the I/O base address, usually 0x220 or 0x240, sometimes
          set by a jumper block marked ADDR or IO
       o  the 8-bit DMA channel, 0, 1 or 3
       o  the 16-bit DMA channel, 5, 6 or 7
       o  the interrupt, usually 5, 7, 9 or 10

  A jumper block with the numbers printed beside it is telling you what
  the card is set to right now. A card with a jumper on the position
  marked 5 in the IRQ block is on IRQ 5, whatever the box said, and
  whatever the person who sold you the machine believed.

  2.1  I cannot find the manual

  Most cards of this type are set at the factory to 0x220, IRQ 7, DMA
  1 and DMA16 5. Most cards of this type have also been moved off IRQ 7
  at some point by somebody, because IRQ 7 is the parallel port, and a
  machine with a printer on it and a sound card on IRQ 7 has a problem
  that only appears when you print.

  IRQ 7 is the single most common cause of a sound card that works
  until you use the printer, and of a printer that works until you play
  a sound.


  3.  Which cards work

  Cards that are genuinely Sound Blaster 16 compatible work well, and
  most 16-bit ISA cards sold as compatible are. Gravis UltraSound cards
  work and are well liked. Pro Audio Spectrum cards work. Cards that
  say "Windows Sound System compatible" usually work.

  Cards that are cheap, PCI, and dated 1997 are a gamble, and cards
  bundled with a modem on the same board are usually a loss. If the box
  says the card needs Windows, believe it.


  4.  Building the driver

  Run make config, make menuconfig or make xconfig in
  /usr/src/linux. Answer Y to Sound card support. You will then be
  asked, one at a time, which low-level drivers you want, and for each
  one you say yes to, you will be asked for its numbers.

  For a Sound Blaster type card the questions are:

       Sound Blaster support                    (Y)
       I/O base for SB Card                     (0x220)
       Sound Blaster IRQ                        (5)
       Sound Blaster DMA                        (1)
       Sound Blaster 16 bit DMA                 (5)

  Put in the numbers you read off the card. Not the numbers in the
  brackets. The numbers in the brackets are the numbers somebody else's
  card was set to.

  Then:

       make dep
       make zImage

  and install the kernel: copy the image where LILO expects it, edit
  /etc/lilo.conf if the filename changed, and run lilo. If you forget
  to run lilo, the next boot will use the old kernel and you will spend
  an hour wondering why your changes did nothing. Everyone does this
  once.

  Reboot. On the way up you should see a line like

       Sound initialization started
       <Sound Blaster 16 (4.13)> at 0x220 irq 5 dma 1,5
       Sound initialization complete

  If you see the numbers you typed, the driver is in. That is not the
  same as the card working, but it is the half you control.


  5.  Testing it

  The simplest test is to send something at the raw device:

       cat /dev/urandom > /dev/audio

  which will produce a short burst of noise, and is the only diagnostic
  most people ever need. If you get

       /dev/audio: No such device

  the driver is not in your running kernel: you built it, you did not
  boot it, or you forgot to run lilo.

  If cat blocks forever and the machine stops responding, you have a
  DMA conflict. Reset, and change the DMA channel.


  6.  Troubleshooting

  6.1  There is no sound at all but no errors either

  The mixer is at zero. There is no reason to expect otherwise: the
  driver does not set a volume for you. Run a mixer program and turn it
  up.

  6.2  Sound plays at the wrong speed or is distorted

  Wrong DMA channel, or a 16-bit DMA channel given to a card that only
  does 8-bit transfers.

  6.3  Sound works, then the machine locks up when I print

  IRQ 7. See section 2.1.

  6.4  I have a card that is on the supported list and it does not work

  Check the numbers again. It is the numbers. It is nearly always the
  numbers.

  6.5  My card is on a modem, or the box says it needs Windows

  See the PPP-HOWTO, section 9, which explains the general shape of
  this problem for modems. The same reasoning applies to sound
  hardware, and the answer is the same answer.


  7.  Copyright

  Copyright (c) 1997 Marta Vlasek. Freely distributable, modifiable and
  quotable provided this notice survives. If this document helped you,
  send a postcard, not money.
`);

HDR("  The XFree86 HOWTO", "  Douglas Anselm, danselm@thule.example.edu", "3.6", "30 September 1997") + `
  How to get the X Window System running on a Linux machine, using the
  XFree86 3.3 distribution. Read section 4 before you run anything.


  1.  What you have

  XFree86 is a free implementation of the X Window System for machines
  with Intel processors and PC graphics hardware. It consists of a
  server, which is the program that talks to your video card and your
  monitor; a library, which programs link against; and a large number of
  clients, which are the programs you actually use.

  There is no desktop. There is no default set of things on the screen.
  X starts a server, reads a file called .xinitrc in your home
  directory, and runs whatever that file says. If the file says nothing,
  you get a grey stipple and an X-shaped cursor, and that is correct
  behaviour, not a failure.


  2.  Which server

  XFree86 3.3 ships one server per class of hardware, and you install
  the one that matches your card:

       XF86_SVGA      most SVGA chipsets, including Cirrus Logic,
                      Trident, Chips & Technologies, most ET4000
       XF86_S3        S3 801, 805, 928, 864, 964, 868, 968, Trio
       XF86_Mach64    ATI Mach64
       XF86_Mach8     ATI Mach8
       XF86_8514      IBM 8514/A and true compatibles
       XF86_AGX       AGX-014 and AGX-015
       XF86_P9000     Weitek P9000
       XF86_W32       ET4000/W32 series
       XF86_VGA16     any VGA, 16 colours, 640x480. The one that
                      always works.
       XF86_Mono      any VGA, monochrome. The other one that always
                      works.

  If you install the wrong one it will not work, and it will not tell
  you that it is the wrong one. It will tell you that it could not find
  a screen it can use, which is the same sentence it prints when your
  monitor settings are wrong, and this is the single most confusing
  thing about configuring X.

  If you do not know what your chipset is, run SuperProbe, which will
  tell you or will lock the machine up. Both outcomes are informative.

  2.1  If nothing works, use XF86_VGA16

  640x480 in sixteen colours is not a nice way to use X, but it is a
  working way to use X, and from inside it you can read this document
  in an xterm while you fix the real server. This is the single most
  useful piece of advice in this HOWTO and nobody takes it.


  3.  Running xf86config

  xf86config is a program that asks you questions and writes
  /usr/X11R6/lib/X11/XF86Config from your answers. It asks, in order,
  about your mouse, your keyboard, your monitor, your video card and
  the modes you want.

  It is an ordinary text-mode program and it has no undo. If you make a
  mistake, finish it and run it again, or edit the file it wrote, which
  is plain text and is meant to be edited.

  3.1  The mouse

  You will be asked for a protocol, not a brand. A serial mouse with
  three buttons is usually Logitech or MouseMan; a serial mouse with
  two buttons is usually Microsoft. If you choose the wrong one the
  pointer will move, but erratically: it will jump, stick, or drift
  when you press a button. A pointer that moves wrongly is a protocol
  problem, not a hardware problem.

  You will then be asked for the device, which is /dev/cua0 for COM1
  and /dev/cua1 for COM2. And you will be asked whether to emulate
  three buttons with a two-button mouse, because X needs three and
  assumes you have them.


  4.  The monitor, and the warning

  xf86config will ask you for two numbers about your monitor: the
  horizontal sync range in kilohertz, and the vertical refresh range
  in hertz.

  You are expected to know them. They are in the manual that came with
  the monitor, on a page near the back, in a table of specifications.
  If you do not have the manual, the numbers are sometimes on a label
  on the back of the monitor itself, and are sometimes obtainable from
  the manufacturer. They are not obtainable from the monitor by asking
  it, because a monitor of this era has no way to be asked.

       WARNING

       It is possible to drive a monitor outside the range it was
       built for. The X server will do exactly what your
       configuration file tells it to do, and your configuration
       file is what you typed.

       On a fixed-frequency or a badly protected multisync monitor,
       driving it out of range can damage it permanently. This is
       not a theoretical risk and it is not a warning added by
       lawyers. Monitors have been destroyed this way.

       If you are not certain of your monitor's specifications, pick
       a conservative range. A monitor running below what it is
       capable of is a monitor you still own.

  This is the part of installing Linux in 1997 that people remember,
  and it is the reason they remember it. You are being handed a text
  file, told that the numbers in it can break your hardware, and
  trusted to get it right.

  4.1  Choosing conservatively

  If you genuinely do not know, tell xf86config that your monitor is a
  standard VGA, 31.5 kHz horizontal only. You will get 640x480 and
  nothing better. It will work, it cannot hurt anything, and you can
  raise it later when you find the manual.

  4.2  What going wrong looks like

       o  The screen is stable but the resolution is far below what
          the card can do: your sync ranges are too conservative.
          Nothing is broken. Find the manual.

       o  The screen is black, or rolls, or tears, or shows a
          scrambled band, and the monitor is making a noise it does
          not usually make: the mode is out of range. Press
          Ctrl-Alt-Backspace immediately. Do not sit and look at it.

       o  X exits at once and leaves you at the console with a page
          of log: the server could not find a usable configuration.
          Read the last ten lines of the log, which say why.

  Ctrl-Alt-Backspace kills the X server instantly and returns you to
  the text console. It is how everybody recovers, it works even when
  the screen shows nothing, and it is the first thing to learn.


  5.  Starting X

  startx is a shell script that runs xinit, which starts the server and
  then runs your .xinitrc. Read startx. It is thirty lines and it
  demystifies the whole business.

  A minimal .xinitrc:

       xclock -geometry 80x80-1+1 &
       xterm -geometry 80x24+0+0 &
       fvwm

  The last line has no ampersand on purpose. X exits when the last
  command in .xinitrc exits, so the window manager goes last and
  everything else goes into the background. If you put an ampersand on
  the last line, .xinitrc will finish immediately and X will shut down
  the instant it starts, which looks exactly like a crash and is not
  one.

  5.1  Window managers

  fvwm is what Slackware sets up by default. twm is in the base
  distribution and is what X looked like in 1988. fvwm95-2, in the XAP
  set, is configured to look startlingly like a well-known commercial
  desktop, and a lot of people run it. olvwm, in the XV set, is Sun's
  OPEN LOOK window manager, and if you have used a Sun workstation it
  will feel like home and if you have not it will feel like Mars.

  If .xinitrc names a window manager that is not installed, X will
  start, the shell will report that the command was not found, and you
  will be looking at a grey stipple with your other clients on it and
  no way to move them. This is not a bug. You asked for a program that
  is not on the disk.


  6.  Troubleshooting

  6.1  X starts and immediately exits

  Read the last screen of output. Then read /var/log/XFree86.0.log if
  your server writes one. The answer is in there, in English.

  6.2  The pointer is in the wrong place, or inverted

  Wrong mouse protocol. See 3.1.

  6.3  Keyboard does nothing in X but works at the console

  Wrong keyboard section in XF86Config, or you are running a server
  built for a different XKB configuration. Comment out the XkbDisable
  line, or add one.

  6.4  Fonts are missing and the server says it cannot open the default
       font

  You did not install the font packages, or mkfontdir was never run in
  a font directory you added. X cannot start without a font it can use
  for its default, and it will say so and stop.

  6.5  Everything is very slow

  You are running a server that is using the generic VGA code path
  rather than your chipset's accelerated one, or you are in 16-bit
  colour on a card with not enough memory to hold it. Check the log:
  the server prints which chipset it detected and how much video
  memory it found.

  6.6  Colours are wrong in one program and right in every other

  You have run out of colormap entries. This is the era's normal state
  of affairs on an 8-bit display and there is nothing to fix.


  7.  Copyright

  Copyright (c) 1997 Douglas Anselm. Distribute freely. The warning in
  section 4 may not be removed from copies of this document, which is
  the only condition I put on it.
`);

HDR("  Linux PPP HOWTO", "  Ana Rezende, arezende@quilmes.example.ar", "2.8", "21 September 1997") + `
  How to connect a Linux machine to the Internet over a modem and a
  telephone line, using PPP. This document assumes you have an account
  with a service provider and a modem that works.


  1.  What has to be true

  Four things have to be right at the same time, and if any one of them
  is wrong the symptom is the same: the connection does not come up and
  the log says very little.

       o  the serial port and the modem
       o  the dialling script, which is called a chat script
       o  the pppd options
       o  the routing and the name servers, afterwards

  Do them in that order and test after each one. Do not write all four
  and then dial.


  2.  The serial port

  Under Linux the serial ports are /dev/ttyS0 and up for incoming use,
  and /dev/cua0 and up for outgoing calls. COM1 is ttyS0 and cua0. COM2
  is ttyS1 and cua1.

  Talk to the modem by hand before you do anything else:

       minicom -s

  Set the device and the speed, exit into terminal mode, and type

       AT

  The modem should answer OK. If it does not answer OK, nothing later
  in this document is going to work, and you should stop here and fix
  this. Check that you have the right device, that the speed is
  sensible, and that the modem is switched on.

  Type ATI3 and write down what it says. You will want it later.


  3.  The chat script

  chat is a program that has a conversation with the modem: it sends a
  string, waits for a reply, and sends the next one. A minimal script
  for a provider that gives you a login prompt:

       ABORT BUSY ABORT 'NO CARRIER' ABORT 'NO DIALTONE'
       "" ATZ
       OK ATDT5551212
       CONNECT ''
       ogin: myusername
       assword: mypassword

  Note ogin: and assword: rather than Login: and Password:. This is not
  a typo and it is not superstition. The first character of the prompt
  is frequently lost or arrives in the wrong case, and matching on the
  tail of the word is how everybody does it.

  Your password is in this file in plain text. Make the file mode 600
  and owned by root. Everybody's was.


  4.  pppd

  Put the options in /etc/ppp/options so you do not have to type them:

       /dev/cua1
       38400
       modem
       crtscts
       defaultroute
       noipdefault

  Then dial:

       pppd connect 'chat -v -f /etc/ppp/chatscript'

  and watch /var/adm/messages, or run it with the debug option and
  watch the console.

  4.1  What success looks like

       Serial connection established.
       Using interface ppp0
       Connect: ppp0 <--> /dev/cua1
       local  IP address 203.0.113.86
       remote IP address 203.0.113.1

  Two addresses is success. One address is not.


  5.  Afterwards

  defaultroute in the options file gives you a route. You still need
  name resolution, which is /etc/resolv.conf, which is two lines:

       domain myprovider.example
       nameserver 203.0.113.2

  A machine that can ping an address but not a name has a resolv.conf
  problem and nothing else. Test in that order: ping the gateway by
  number, then ping something distant by number, then ping something by
  name. The step that fails tells you which of the four things in
  section 1 is wrong.


  6.  Troubleshooting

  6.1  chat says it timed out waiting for CONNECT

  The modem is not dialling, or the line is busy, or you have the wrong
  device. Go back to section 2 and do it by hand.

  6.2  The modem connects and then pppd exits

  The provider is putting up a login prompt you are not answering, or
  is expecting PAP or CHAP and you are sending a login. Run chat with
  -v and read what actually arrived.

  6.3  It connects and drops after exactly two minutes

  lcp-echo-failure. The far end is not answering keepalives. Add
  lcp-echo-interval 0 to the options and stop worrying about it.

  6.4  Everything works but it is extremely slow

  Check that crtscts is in your options. Without hardware flow control
  a modem link at 28800 will lose characters under load and every lost
  packet is a retransmission.


  9.  Modems that are not modems

  There is a class of device sold in 1996 and 1997 as an internal
  modem, at a price that should have been a warning, which is not a
  modem. It has no controller of its own. The signal processing that a
  real modem does in hardware is done instead by a program running on
  your CPU under Windows, and that program is the modem. The card is a
  socket, an analogue front end and a bus interface.

  These are variously called winmodems, HSP modems, soft modems or
  controllerless modems. Under Linux they do not work. They do not work
  slowly, or work with a patch, or work if you find the right init
  string. There is nothing on the card to talk to.

  The manufacturers of these devices do not publish the specifications
  required to write a driver, and have generally declined to, and
  people have asked politely, at length, for years.

  If your modem is one of these, your options are to buy an external
  modem, buy an internal modem with a controller on it, or boot the
  other operating system to go online. There is no fourth option and
  there is no point in mailing me to ask whether there is one yet.

  How to tell: if the box says the modem requires Windows, or Windows
  95, or lists a minimum processor speed, it is one of these. A real
  modem does not care what your processor is.


  10.  Copyright

  Copyright (c) 1997 Ana Rezende. Freely distributable. Section 9 is
  the section people mail me about and it is not going to change until
  the hardware does.
`);

HDR("  The Linux Printing HOWTO", "  Ken Adeyemi, kadeyemi@laurel.example.net", "1.14", "8 July 1997") + `
  How printing works under Linux, which is not how you expect, and how
  to make a printer produce something.


  1.  The shape of the thing

  Printing on a Unix system is a queue and a daemon. You do not send
  data to a printer. You submit a job to a queue with lpr; a daemon
  called lpd notices the job, looks the queue up in /etc/printcap,
  passes the data through a program called a filter, and sends the
  result out of a device.

  Every part of that sentence is a place it can go wrong, and the
  error messages are famously unhelpful, so it is worth understanding
  the order before you start.


  2.  /etc/printcap

  This is a termcap-style file: colon-separated fields, backslash at
  the end of a continued line, and no forgiveness about whitespace. A
  minimal entry for a printer on the first parallel port:

       lp|local line printer:\\
               :lp=/dev/lp1:\\
               :sd=/var/spool/lpd/lp:\\
               :lf=/var/spool/lpd/lp/log:\\
               :if=/var/spool/lpd/lp/filter:\\
               :mx#0:\\
               :sh:

  The fields mean: the device, the spool directory, the log file, the
  input filter, no maximum file size, and suppress the header page. The
  spool directory must exist and must be owned by daemon. lpd will not
  create it and will not tell you that it is missing in a way you would
  recognise.

  Note that /dev/lp1 is the first parallel port. /dev/lp0 exists and is
  something else on most machines. This has cost people evenings.


  3.  The filter, and why plain text comes out wrong

  Send a text file straight at a PostScript printer and you will get
  either nothing or forty pages of PostScript source. Send a text file
  straight at a PCL printer and you will get the staircase effect:

       This is the first line
                             This is the second line
                                                   and so on

  This happens because Unix ends a line with a line feed and a printer
  wants a carriage return and a line feed. It is not a bug in Linux and
  it is not a bug in the printer. It is two conventions meeting.

  The fix is a filter. The smallest useful one is a shell script:

       #!/bin/sh
       /usr/bin/gs -q -dSAFER -dNOPAUSE -sDEVICE=ljet4 \\
                   -sOutputFile=- - < /dev/null
       exit 0

  and in practice nobody writes their own. Get one of the printing
  packages, or use the filter that came with your ghostscript
  installation, and point if= at it.

  Do not forget to make the filter executable. An input filter that is
  not executable produces a job that vanishes without an error, which
  is the worst failure mode in this document.


  4.  Ghostscript

  ghostscript is a PostScript interpreter that renders PostScript to a
  raster and sends it to a printer that does not speak PostScript.
  Since almost no printer sold to a home user in 1997 speaks
  PostScript, and almost every Unix program produces PostScript,
  ghostscript is not optional. It is the reason printing works at all.

  Find out which driver your printer needs:

       gs --help

  will list them. There are hundreds and yours may be there under the
  name of a different model in the same family.


  5.  Testing, in order

  Do these in order and stop at the first one that fails.

       1.  cat something at the device directly:
               cat /etc/motd > /dev/lp1
           If nothing comes out, this is a kernel, cable or hardware
           problem and nothing above it will work. Check that the
           parallel port driver is in your kernel and that the port is
           at the address the driver thinks.

       2.  Is lpd running?  ps aux | grep lpd

       3.  Submit a job:  lpr /etc/motd     then  lpq

       4.  If lpq shows the job and nothing happens, the filter is
           failing. Look in the log file named by lf=.

  6.  Troubleshooting

  6.1  lpr says "connect: Connection refused"

  lpd is not running. Start it, and add it to /etc/rc.d/rc.local so it
  starts at boot.

  6.2  lpq says the queue is empty and my job is gone

  Non-executable filter, or a spool directory with the wrong owner.

  6.3  The first page prints and then it stops

  mx#0 is missing from printcap and a size limit is truncating the job.

  6.4  It prints one enormous page of PostScript source

  There is no filter, or the filter is not being used because if= has a
  typo in it. printcap does not report typos.

  6.5  Everything is right and it still does not print

  Read the SCSI-HOWTO. Yes, really: if your printer is on a parallel
  port sharing an interrupt with a SCSI host adapter, the symptom is a
  printer that appears to work and produces nothing, and the SCSI-HOWTO
  is where the interrupt sharing rules are actually written down. This
  is not a joke, although several people have taken it as one.


  7.  Copyright

  Copyright (c) 1997 Ken Adeyemi. Freely distributable. If your printer
  is a GDI printer with no processor in it, see the closing section of
  the PPP-HOWTO, which is about modems but is the same argument.
`);

HDR("  The Linux Kernel HOWTO", "  Brian Kell, bkell@sundial.example.org", "1.9", "12 August 1997") + `
  How to configure, build and install a Linux kernel, and why you would
  want to.


  1.  Why

  The kernel that came on your distribution's boot disk contains
  drivers for a great deal of hardware you do not have, and does not
  contain some things you do. Building your own gets you a kernel that
  is smaller, boots faster, and has exactly the drivers your machine
  needs, compiled in, so nothing has to be probed or loaded.

  It is also the way you get support for hardware whose driver is not
  modular, which in the 2.0 series includes sound.

  This is presented in a great many places as an advanced topic. It is
  not. It is four commands and a text menu, and the reason everybody
  does it is that everybody has to.


  2.  Getting the source

  The source lives in /usr/src/linux. On Slackware that is disk set K,
  and if you did not install it, the directory is not there, and there
  is no clue anywhere that it was ever an option. Install it with
  installpkg or run setup again and choose K.

  /usr/src/linux should be a symbolic link to the versioned directory,
  because things that compile against kernel headers expect that path.


  3.  Configuring

  In /usr/src/linux, one of:

       make config        a very long list of questions, in order,
                          with no way back
       make menuconfig    the same questions as a navigable menu
       make xconfig       the same again, under X

  Use make menuconfig. make config asks you two hundred questions in a
  row and if you answer one wrongly you start again.

  Every option has help. Press ? or select Help. The help was written
  by the person who wrote the driver and it is usually the best
  documentation that exists for that piece of hardware.

  3.1  The three answers

  Options are Y, N or M. Y compiles the code into the kernel image. N
  leaves it out. M builds it as a module, loadable later with insmod
  and unloadable again.

  Rules of thumb that have survived: the filesystem your root partition
  is on must be Y, never M, because the kernel has to be able to read
  the disk before it can load a module off it. The driver for the
  controller that disk is on must be Y for the same reason. Everything
  you use occasionally can be M.

  3.2  Things that will bite you

  If you turn off ELF binary support you will build a kernel that
  cannot run any program on your system. If you turn off the
  filesystem your root partition uses you will build a kernel that
  panics on boot with

       VFS: Unable to mount root fs

  Both of these are recoverable, from the boot floppy, if you made one.


  4.  Building

       make dep
       make clean
       make zImage

  make dep works out what depends on what and takes a minute. make
  zImage compiles the kernel and takes, on a 486, most of an evening,
  and on a fast Pentium about ten minutes. There is no progress bar.
  There is a very long stream of compiler command lines, and the
  correct thing to do is go and have dinner.

  If it stops with an error, the error is usually in a driver you just
  turned on. Read the last twenty lines, turn that driver off, and
  build again.

  If you asked for modules, then afterwards:

       make modules
       make modules_install


  5.  Installing, and the step everybody forgets

  The new kernel is at arch/i386/boot/zImage. Copy it somewhere
  permanent:

       cp arch/i386/boot/zImage /vmlinuz.new

  Add a stanza to /etc/lilo.conf pointing at it, keeping the old one:

       image = /vmlinuz.new
         label = new
         root = /dev/sda2
         read-only

       image = /vmlinuz
         label = linux
         root = /dev/sda2
         read-only

  and then, and this is the important part:

       lilo

  LILO is not a boot loader that reads a configuration file at boot
  time. It is a program that reads the configuration file now and
  writes the physical block addresses of your kernel into the boot
  sector. If you copy a new kernel over the old one and do not run
  lilo, the boot sector still points at where the old kernel used to
  be, and the machine will either boot the old kernel, or load garbage
  and stop.

  Nothing warns you. lilo produces no output unless it has something to
  say. Everybody does this exactly once, and the way out is the boot
  floppy the installer told you to make.

  5.1  Keep the old kernel

  Always keep a working kernel in lilo.conf under a different label,
  and always keep the boot floppy. A kernel you built ten minutes ago
  is not yet a kernel you trust.


  6.  Afterwards

       uname -a

  will tell you the version, the build number, the date it was
  compiled, and the hostname of the machine it was compiled on, which
  is yours. That string is the receipt.


  7.  Copyright

  Copyright (c) 1997 Brian Kell. Freely distributable and modifiable.
`);
