  /* ---- chat: the dialling script ---- */
  async function dial(c, script, verbose) {
    const dev = State.get("pppDev", Hw.M.extmodem.port);
    const lines = script.split("\n").map(s => s.trim()).filter(s => s.length);
    const pairs = [];
    for (const l of lines) {
      if (/^ABORT/.test(l)) continue;
      const m = l.match(/'[^']*'|"[^"]*"|\S+/g) || [];
      for (let i = 0; i < m.length; i += 2) pairs.push([strip(m[i]), strip(m[i + 1] || "")]);
    }
    const has = re => pairs.some(p => re.test(p[0]) || re.test(p[1]));
    if (!pairs.length) { c.errln("chat: no script"); return 1; }
    if (verbose) c.errln("timeout set to 45 seconds");
    const wm = dev === "/dev/cua2" || dev === "/dev/cua3";
    for (const [exp, snd] of pairs) {
      if (verbose && exp.length) c.errln("expect (" + exp + ")");
      if (exp.length && wm) {
        await c.tty.pause(3000);
        c.errln("alarm");
        c.errln("Failed");
        return 3;
      }
      if (verbose && snd.length) c.errln("send (" + snd.replace(/\r?$/, "^M") + ")");
      if (/^ATD/.test(snd)) { Sound.handshake(); await c.tty.pause(8000); if (verbose) c.errln("CONNECT"); }
      else await c.tty.pause(300);
    }
    if (!has(/CONNECT/)) { c.errln("chat: never saw CONNECT.  The script does not dial."); return 3; }
    if (!has(/ogin|PAP|CHAP|assword/)) {
      c.errln("");
      c.errln("(the modem connected and the far end put up a login prompt that this");
      c.errln(" script does not answer.  chat exits, and pppd exits after it.)");
      return 3;
    }
    return 0;
  }
  function strip(s) { return String(s || "").replace(/^['"]|['"]$/g, "").replace(/^\\r$|^''$/, ""); }

  /* ---- pppd: the four things ---- */
  async function ppp(c, dev, connect, all) {
    State.set("pppDev", dev);
    if (dev === "/dev/cua2" || dev === "/dev/cua3") {
      c.outln("pppd: Serial line is not 8-bit clean:");
      c.outln("pppd: Problem: all had bit 7 set to 0");
      await c.tty.pause(2000);
      c.errln("pppd: Connect script failed");
      c.outln("");
      c.outln("(there is no modem on " + dev + ".  There is a " + Hw.M.winmodem.board + ",");
      c.outln(" and the part of it that would answer is a program for another");
      c.outln(" operating system.  PPP-HOWTO, section 9.)");
      Museum.note("winmodem-tried");
      return 1;
    }
    if (dev !== Hw.M.extmodem.port) {
      c.errln("pppd: cannot open " + dev + ": No such device");
      return 1;
    }
    if (!connect) {
      c.outln("Using interface ppp0");
      c.outln("Connect: ppp0 <--> " + dev);
      await c.tty.pause(3000);
      c.errln("LCP: timeout sending Config-Requests");
      c.errln("Connection terminated.");
      c.outln("");
      c.outln("(the port is open and there is no connection on it.  pppd will not");
      c.outln(" dial for you: that is what the connect script is for.)");
      return 1;
    }
    /* run the connect script */
    const chatm = /-f\s+(\S+)/.exec(connect);
    let script = "";
    if (chatm) script = readFileText(Fs.resolve(c.sh.cwd, chatm[1])) || "";
    else script = connect.replace(/^chat\s+(-v\s+)?/, "").replace(/\s+/g, "\n");
    if (chatm && !script) { c.errln("chat: cannot open " + chatm[1]); c.errln("pppd: Connect script failed"); return 1; }
    const st = await dial(c, script, /-v/.test(connect));
    if (st !== 0) { c.errln("pppd: Connect script failed"); return 1; }
    c.outln("Serial connection established.");
    await c.tty.pause(900);
    c.outln("Using interface ppp0");
    c.outln("Connect: ppp0 <--> " + dev);
    await c.tty.pause(1400);
    /* the options that have to be right, in the order they bite */
    const crtscts = /crtscts/.test(all);
    const defroute = /defaultroute/.test(all);
    c.outln("local  IP address 203.0.113.86");
    c.outln("remote IP address 203.0.113.1");
    State.set("pppUp", true);
    State.set("ppp", { local: "203.0.113.86", remote: "203.0.113.1", crtscts });
    if (defroute) State.set("defaultRoute", { gw: "203.0.113.1", dev: "ppp0" });
    Proc.add("pppd");
    Museum.note("ppp-up");
    if (!crtscts) {
      c.outln("");
      c.outln("(up, without crtscts.  There is no hardware flow control on this link,");
      c.outln(" so it will lose characters under load and every lost packet is a");
      c.outln(" retransmission.  PPP-HOWTO 6.4.)");
    }
    if (!readFileText("/etc/resolv.conf") || !/nameserver/.test(readFileText("/etc/resolv.conf"))) {
      c.outln("");
      c.outln("(up, and with no nameserver in /etc/resolv.conf.  You can reach");
      c.outln(" addresses and not names, and nothing will mention that file.)");
    }
    return 0;
  }
  function hangup() { State.set("pppUp", false); State.set("ppp", null); Proc.drop("pppd"); }
  return { resolve, reach, banner, nameserver, linkUp, minicom, dial, ppp, hangup, HOSTS };
})();

/* ==========================================================================
   MODULE 11b — THE PRINTER
   ========================================================================== */
const Printer = (() => {
  function parse(pc) {
    const out = [];
    const text = String(pc || "").replace(/\\\n\s*/g, "");
    for (const line of text.split("\n")) {
      const t = line.trim();
      if (!t.length || t[0] === "#") continue;
      const fields = t.split(":").map(s => s.trim()).filter(s => s.length);
      if (!fields.length) continue;
      const e = { name: fields[0].split("|")[0], raw: t };
      for (const f of fields.slice(1)) {
        const m = /^(\w+)([=#])(.*)$/.exec(f);
        if (m) e[m[1]] = m[3];
        else e[f] = true;
      }
      out.push(e);
    }
    return out;
  }
  /* what a printer does with bytes it is handed directly.  /dev/lp1 is the
     first parallel port; /dev/lp0 is a different port that has nothing on
     it, which is section 2 of the Printing-HOWTO and an evening of
     somebody's life. */
  function toDevice(dev, data) {
    if (dev !== "/dev/lp1") return { err: "No such device or address" };
    if (Hw.sound.conflict() === "irq7-lpt1" && Hw.sound.configured()) {
      paper({ result: "contended", file: "(direct)", data: data });
      return { ok: 1 };
    }
    paper({ result: "raw", file: "(direct)", data: data });
    return { ok: 1 };
  }
  /* the sheets in the output tray.  Kept short: this is a printer, not an
     archive. */
  function paper(job) {
    const out = State.get("paper", []);
    out.push({ at: Clock.now().getTime(), result: job.result, file: job.file,
               data: String(job.data || "").slice(0, 4000) });
    while (out.length > 6) out.shift();
    State.set("paper", out);
  }
  function tray() { return State.get("paper", []); }
  /* the staircase, which is what a line printer does with a Unix text file:
     a line feed moves the paper down and does not move the head back. */
  function staircase(text) {
    const lines = String(text).replace(/\r/g, "").split("\n");
    let col = 0;
    return lines.map(l => { const out = " ".repeat(col) + l; col += l.length; return out; }).join("\n");
  }
  function submit(e, data, name) {
    if (!e.sd) return { err: "no spool directory in printcap entry" };
    if (!Fs.isDir(e.sd)) return { err: "cannot open " + e.sd + ": No such file or directory" };
    const q = State.get("lpq", []);
    const id = 300 + q.length;
    q.push({ id, owner: Env.user(), file: Fs.baseOf(name), size: data.length });
    State.set("lpq", q);
    /* what actually comes out, which is the Printing-HOWTO in three cases */
    let result;
    const filt = e.if ? Fs.stat(e.if) : null;
    if (!e.if) result = "raw";
    else if (!filt) result = "nofilter";
    else if (!(filt.mode & 0o111)) result = "notexec";
    else result = "ok";
    setTimeout(() => {
      const qq = State.get("lpq", []).filter(j => j.id !== id);
      State.set("lpq", qq);
      const log = e.lf || null;
      paper({ result, file: Fs.baseOf(name), data });
      if (log) {
        const prev = readFileText(log) || "";
        Fs.write(log, prev + stamp() + " " + e.name + ": " +
          (result === "ok" ? "job printed" :
           result === "raw" ? "job sent to device with no filter" :
           result === "notexec" ? "cannot execute filter " + e.if :
           "filter " + e.if + " not found") + "\n");
      }
    }, 2600);
    return { ok: 1, id, result };
  }
  return { parse, submit, toDevice, tray, staircase, paper };
})();

          r.err ? "Alert!: Unable to locate remote host." : "Alert!: Unable to connect to remote host.",
          "", "lynx: Can't access startfile " + url, "",
          "(the network is not up.  See the NET-3-HOWTO, and test in the order it",

    for (;;) {

      vt.put(0, 0, padr("  " + title, vt.cols), A_BOLD);
      const view = vt.rows - 4;
      for (let i = 0; i < view; i++) {
        const l = lines[top + i];

        const re = /\[(\d+)\]/g;

          const after = l.slice(m.index + m[0].length).split(/[\s.,)]/)[0];

        }

      vt.put(0, vt.rows - 2, padr("  Arrow keys: Up and Down to move.  Right to follow a link; Left to go back.", vt.cols), A_NORM);
      vt.put(0, vt.rows - 1, padr("H)elp O)ptions P)rint G)o M)ain screen Q)uit /=search [delete]=history list", vt.cols), A_NORM);
      vt.touch();
      const k = await c.tty.key();
      /* lowercase q asks, uppercase Q does not, which is one of the small

      if (k.name === "Q") { vt.clear(A_NORM); vt.showCursor = true; return 0; }
      if (k.name === "q") {

        vt.cx = 35; vt.cy = vt.rows - 1; vt.showCursor = true; vt.touch();
        const a = await c.tty.key();

      }
      if (k.name === " " || k.name === "PageDown" || k.name === "+") { top = Math.min(Math.max(0, lines.length - 2), top + view); continue; }
      if (k.name === "b" || k.name === "PageUp" || k.name === "-") { top = Math.max(0, top - view); continue; }

      if (k.name === "ArrowLeft") { if (history.length) { url = history.pop(); break; } continue; }

        vt.put(0, vt.rows - 1, padr("URL to open: ", vt.cols), A_NORM);
        vt.cx = 13; vt.cy = vt.rows - 1; vt.showCursor = true; vt.touch();

   MODULE 13 — gcc, make AND THE KERNEL BUILD
   ========================================================================== */
cmd("gcc", async c => {
  const args = c.args.slice();
  const srcs = args.filter(a => /\.(c|cc|cpp|C|s|S)$/.test(a));
  const objs = args.filter(a => /\.o$/.test(a));
  const libs = args.filter(a => /^-l/.test(a)).map(a => a.slice(2));
  const oIdx = args.indexOf("-o");
  const out = oIdx >= 0 ? args[oIdx + 1] : null;
  const compileOnly = args.indexOf("-c") >= 0;
  if (!srcs.length && !objs.length) {
    c.errln("gcc: No input files");
    return 1;
  }
  const bodies = {};
  for (const s of srcs) {
    const p = c.resolve(s);
    const t = readFileText(p);
    if (t === null) { c.errln(s + ": No such file or directory"); return 1; }
    bodies[s] = t;
  }
  await c.tty.pause(400 + srcs.length * 300);
  /* the diagnostics this exhibit can actually produce, which are the ones
     that mattered: a missing header, a missing semicolon, an implicit
     declaration, and an undefined reference at link time */
  for (const s of srcs) {
    const t = bodies[s];
    const lines = t.split("\n");
    for (let i = 0; i < lines.length; i++) {
      const m = /^\s*#\s*include\s*[<"]([^>"]+)[>"]/.exec(lines[i]);
      if (!m) continue;
      const inc = m[1];
      if (!Fs.exists("/usr/include/" + inc) && !Fs.exists(c.resolve(inc))) {
        c.errln(s + ":" + (i + 1) + ": " + inc + ": No such file or directory");
        return 1;
      }
    }
    if (!/\bmain\s*\(/.test(t) && !compileOnly && !objs.length) {
      /* let it through: the linker will complain, which is the real order */
    }
  }
  /* which libraries does the source need, and were they named */
  const needsM = srcs.some(s => /\b(sqrt|sin|cos|tan|pow|log|exp|floor|ceil|atan2|fabs)\s*\(/.test(bodies[s]));
  const objName = out || "a.out";
  if (compileOnly) {
    for (const s of srcs) Fs.write(c.resolve(s.replace(/\.(c|cc|cpp|C)$/, ".o")), "", { sz: irnd(900, 4200), bin: 1, needs: null });
    return 0;
  }
  if (needsM && libs.indexOf("m") < 0) {
    /* the linker processes its arguments in order and does not go back */
    const s = srcs[0];
    const fns = Array.from(new Set((bodies[s].match(/\b(sqrt|sin|cos|tan|pow|log|exp|floor|ceil|atan2|fabs)\s*\(/g) || [])
      .map(x => x.replace(/\s*\($/, ""))));
    c.errln("/tmp/cca" + irnd(10000, 99999) + ".o: In function `main':");
    for (const fn of fns) c.errln("/tmp/cca" + irnd(10000, 99999) + ".o(.text+0x" + irnd(20, 200).toString(16) + "): undefined reference to `" + fn + "'");
    c.errln("collect2: ld returned 1 exit status");
    Museum.note("gcc-undefined-ref");
    return 1;
  }
  if (!srcs.some(s => /\bmain\s*\(/.test(bodies[s])) && !objs.length) {
    c.errln("/usr/lib/crt1.o(.text+0x36): undefined reference to `main'");
    c.errln("collect2: ld returned 1 exit status");
    return 1;
  }
  const needs = ["libc.so.5"];
  if (needsM) needs.push("libm.so.5");
  if (libs.indexOf("X11") >= 0) needs.push("libX11.so.6");
  if (libs.indexOf("ncurses") >= 0) needs.push("libncurses.so.3.0");
  const src0 = bodies[srcs[0]] || "";
  Fs.write(c.resolve(objName), "", { mode: 0o755, sz: irnd(4200, 14000), bin: 1,
    impl: "usercc", needs, cprog: src0 });
  const n = Fs.lstat(c.resolve(objName));
  if (n) n.cprog = src0;
  return 0;
});

      try {
        const v = Function("var argc=" + argv.length + ";return (" + a.replace(/\bM_PI\b/g, "Math.PI")
          .replace(/\bsqrt\(/g, "Math.sqrt(").replace(/\bsin\(/g, "Math.sin(")
          .replace(/\bcos\(/g, "Math.cos(").replace(/\bpow\(/g, "Math.pow(") + ")")();
        if (typeof v === "number") return /[fg]/.test(spec) ? v.toFixed(spec.indexOf(".") >= 0 ? Number(spec.match(/\.(\d+)/)[1]) : 6) : String(Math.trunc(v));
        return String(v);
      } catch (e) { return a; }
    });
    c.out(s);
    printed = true;
  };
  if (loop) {
    const from = Number(loop[2]), to = Number(loop[3]);
    for (let k = from; k <= to; k++) {
      for (const st of stmts) emit(st.replace(new RegExp("\\b" + loop[1] + "\\b", "g"), String(k)));
    }
  } else for (const st of stmts) emit(st);
  if (!printed) c.outln("(the program ran and produced no output)");
  return 0;
});

   Recompiling the kernel was routine, expected, and a rite of passage, and
   in the 2.0 series it is also the only way to make a sound card work,

  function currentConfig() {

  async function menuconfig(c) {
    const vt = c.vt;
    const T = tree();
    const cfg = Object.assign({}, currentConfig());
    let path = [];                 /* [] = top level, [i] = inside section i */
    let sel = 0;
    vt.showCursor = false;

      const inSection = path.length > 0;

 * This one does not build with the obvious command line.  The error you
 * get is at link time, not compile time, and it names a function rather
 * than a library, and working out which library that function is in is
 * the thing you are supposed to learn here.

 *   gcc -o circle circle.c

#include <stdio.h>

int main(void)

    double r = 2.5;

    printf("radius        %f\\n", r);

Pkg.TEXT["SRC:examplesreadme"] = `Two example programs.

  hello.c    builds and runs with the obvious command.

  circle.c   does not.  It compiles perfectly and then fails at the link
             stage with a message that names a function.  The function is
             in a library that gcc does not link against by default, and
             the flag that fixes it has to go at the END of the command
             line, after the file that needs it, because the linker
             processes its arguments in order and will not go back for a
             library it has already passed.

             directory and it is why circle.c is here.

`;

/* ==========================================================================
   MODULE 14 — THE X SERVER MODEL
   --------------------------------------------------------------------------
   XF86Config is a plain text file, and the X server does exactly what it
   says.  This module parses it and works out what happens, which is one of
   four things: it does not start and says why; it starts at a resolution
   far below what the hardware can do; it starts properly; or it drives the
   monitor out of range.

   dark, rolling, tearing screen and a rising whine, and a label.  There is

   deliberately.  The exhibit is about what it felt like to be trusted with
   a dangerous configuration file, not about how to write one.

    { name: "320x240",   w: 320,  h: 240,  hs: 31.5, vs: 60 },
    { name: "400x300",   w: 400,  h: 300,  hs: 37.9, vs: 60 },
    { name: "512x384",   w: 512,  h: 384,  hs: 48.1, vs: 60 },
    { name: "640x400",   w: 640,  h: 400,  hs: 31.5, vs: 70 },
    { name: "640x480",   w: 640,  h: 480,  hs: 31.5, vs: 60 },
    { name: "800x600",   w: 800,  h: 600,  hs: 35.2, vs: 56 },
    { name: "1024x768",  w: 1024, h: 768,  hs: 48.4, vs: 60 },
    { name: "1152x864",  w: 1152, h: 864,  hs: 63.9, vs: 70 },

      L.push("      tgui9680, tgui9682, tgui9685, ...");

      L.push("      Generic VGA, ET4000, ET3000, PVGA1, WD90C00, WD90C10, WD90C30,");
      L.push("      GVGA, Video7, ...");

      L.push("  " + res.server.replace("XF86_", "") + ": server for " + res.server.replace("XF86_", "") + " graphics adaptors");
    }
    L.push("(using VT number 7)");
    L.push("");
    L.push("XF86Config: /usr/X11R6/lib/X11/XF86Config");
    L.push("(**) stands for supplied, (--) stands for probed/default values");
    L.push("(**) Mouse: type: " + (res.proto || "?") + ", device: " + (Hw.M.mouse.port) +

    if (res.fail === "nodevice") {
      L.push("(--) SVGA: PCI: Unable to identify the chipset \"" + (res.chipset || "?") + "\"");
      L.push("");
      L.push("Fatal server error:");
      L.push("no screens found");
      L.push("");
      L.push("When reporting a problem related to a server crash, please send");
      L.push("the full server output, not just the last messages.");
      return L.join("\n") + "\n";
    }
    L.push("(--) SVGA: PCI: " + Hw.M.video.chipset + " rev 71, Base address 0xe0000000");
    L.push("(--) SVGA: chipset:  " + (res.chipset || "cirrus"));
    L.push("(--) SVGA: videoram: " + (res.ram || Hw.M.video.ram) + "k");
    L.push("(--) SVGA: clocks: 25.23  28.32  41.16  36.08  31.50  39.99  45.08  49.87");
    L.push("(--) SVGA: clocks: 64.98  72.16  75.00  80.01  85.23  89.98 100.19 108.00");
    L.push("(**) SVGA: Using " + (res.depth || 8) + " bpp, Depth " + (res.depth || 8) +
      ", Color weight: " + (res.depth === 16 ? "565" : "666"));
    if (res.hs) L.push("(**) SVGA: Monitor: HorizSync " + res.hs[0] + "-" + res.hs[1] +
      " kHz, VertRefresh " + res.vs[0] + "-" + res.vs[1] + " Hz");
    for (const r of (res.rejected || [])) {
      const why = r.why === "vram" ? "insufficient memory for mode" :
        r.why === "hs-high" ? "horizontal frequency " + r.m.hs + " kHz out of range" :
        r.why === "hs-low" ? "horizontal frequency " + r.m.hs + " kHz too low for monitor" :
        r.why === "vs-high" ? "vertical refresh " + r.m.vs + " Hz out of range" :
        "vertical refresh " + r.m.vs + " Hz too low for monitor";
      L.push("(--) SVGA: Removing mode \"" + r.m.name + "\" from list of valid modes: " + why + ".");
    }
    for (const a of (res.accepted || [])) {
      L.push("(**) SVGA: Mode \"" + a.name + "\": " + a.hs + " kHz hsync, " + a.vs + " Hz vrefresh");
    }
    if (res.fail === "nomodes") {
      L.push("");
      L.push("Fatal server error:");
      L.push("Unable to find a valid modeline for mode \"" +
        ((res.rejected[0] && res.rejected[0].m.name) || "640x480") + "\"");
      L.push("");
      L.push("Every mode in the Screen section was rejected.  The most common reason");
      L.push("is a Monitor section whose HorizSync and VertRefresh ranges do not");
      L.push("admit any of them.  Those two lines are the numbers you typed.");
      return L.join("\n") + "\n";
    }
    if (res.fail === "nofont") {
      L.push("");
      L.push("Fatal server error:");
      L.push("could not open default font 'fixed'");
      L.push("");
      L.push("The font directory named in the Files section has no fonts.dir in it,");
      L.push("or was never installed.  The server cannot start without a default");
      L.push("font and will not try.");
      return L.join("\n") + "\n";
    }
    if (res.ok) {
      L.push("(--) SVGA: Virtual resolution set to " + res.mode.w + "x" + res.mode.h);
      L.push("(--) SVGA: SpeedUp code selected for " + Hw.M.video.chipset);
      L.push("");
    }
    return L.join("\n") + "\n";
  }
  return { parse, evaluate, log, MODES, mode, val, quoted, range };
})();

cmd("xf86config", async c => {

  XMOUSE.forEach((m, i) => t.outln(" " + padl(i + 1, 2) + ".  " + m[0]));

    t.outln("");

    let page = 0;
    const per = 18;

      vt.clear(A_NORM);
      for (let i = 0; i < per; i++) {
        const j = page * per + i;

/* ==========================================================================
   MODULE 15 — THE X RUNTIME, AND FOUR WINDOW MANAGERS
   --------------------------------------------------------------------------
   X in 1997 was flat colour and bitmap fonts and nothing was antialiased,
   rounded or shadowed, and the exhibit does not fix that.  What it does
   reproduce is the arrangement: a server, a root window, clients that are
   separate programs, and a window manager that is also just a client and
   can be swapped by editing one line of a text file in your home
   directory.

   fvwm 1.23b and twm come from the X series; fvwm95-2 comes from XAP;
   olvwm and olwm come from the XV series and are Sun's OPEN LOOK managers
   surviving as a Linux package after Sun had moved on.  Which of them you
   can run is decided entirely by which disk sets you ticked.
   ========================================================================== */
const X = (() => {
  let on = false, srv = null, geom = { w: 640, h: 480 }, wmName = null, dying = false;
  let wins = [], zTop = 10, focused = null, deskCount = 9, desk = 0;
  let pointer = { x: 320, y: 240, b: 0 };
  let rootMenuOpen = null, startOpen = false;
  let killTarget = false;
  let sessionResolve = null;

  const $wins = () => $("#xwins");
  const $root = () => $("#xroot");
  const $over = () => $("#xover");

  function running() { return on; }
  function server() { return srv; }
  function res() { return geom; }
  function wm() { return wmName; }
  function clients() { return wins.filter(w => !w.wmwin).map(w => w.cmd); }

  /* ---- the pointer, drawn as an X, which is what it was -------------- */
  function drawCursor(shape) {
    const c = $("#xcursor");
    const s = shape || "X";
    if (s === "X") {
      c.innerHTML = "<svg width='15' height='15' viewBox='0 0 15 15'>" +
        "<path d='M1 1 L14 14 M14 1 L1 14' stroke='#000' stroke-width='3'/>" +
        "<path d='M1 1 L14 14 M14 1 L1 14' stroke='#fff' stroke-width='1'/></svg>";
    } else if (s === "arrow") {
      c.innerHTML = "<svg width='15' height='15' viewBox='0 0 15 15'>" +
        "<path d='M1 1 L1 12 L4 9 L6 14 L8 13 L6 8 L11 8 Z' fill='#fff' stroke='#000'/></svg>";
    } else if (s === "watch") {
      c.innerHTML = "<svg width='15' height='15' viewBox='0 0 15 15'>" +
        "<circle cx='7.5' cy='7.5' r='6' fill='#fff' stroke='#000'/>" +
        "<path d='M7.5 7.5 L7.5 3 M7.5 7.5 L11 9' stroke='#000'/></svg>";
    } else if (s === "hand") {
      c.innerHTML = "<svg width='15' height='15' viewBox='0 0 15 15'>" +
        "<path d='M4 14 L4 6 L6 6 L6 2 L8 2 L8 6 L13 8 L13 14 Z' fill='#fff' stroke='#000'/></svg>";
    }
    c.style.left = pointer.x + "px";
    c.style.top = pointer.y + "px";
  }

  /* ---- starting the server ----------------------------------------- */
  async function start(tty, opts) {
    opts = opts || {};
    const confPaths = ["/usr/X11R6/lib/X11/XF86Config", "/etc/XF86Config",
                       "/usr/X11R6/lib/X11/XF86Config." + Env.host()];
    let conf = null, confPath = null;
    for (const p of confPaths) { const t = readFileText(p); if (t !== null) { conf = t; confPath = p; break; } }
    if (conf === null) {
      tty.outln("");
      tty.outln("Fatal server error:");
      tty.outln("Unable to open config file.  Tried these:");
      for (const p of confPaths) tty.outln("\t" + p);
      tty.outln("");
      tty.outln("Run xf86config, or copy the example from");
      tty.outln("/usr/X11R6/lib/X11/XF86Config.eg and edit it.");
      tty.outln("");
      tty.outln("giving up.");
      tty.outln("xinit:  Server error.");
      return false;
    }
    const r = XCONF.evaluate(conf);
    const logText = XCONF.log(r, conf);
    Fs.write("/var/log/XFree86.0.log", logText);
    /* the server's output, which lands on the console you started it from */
    await tty.type(logText, 14);
    if (r.fail) {
      if (r.fail === "noserver") {
        tty.outln("");
        tty.outln("X: cannot execute /usr/X11R6/bin/" + r.server + ": No such file or directory");
        tty.outln("");
        tty.outln("The Screen section of your XF86Config asks for a driver whose server");
        tty.outln("package is not installed.  The servers are separate packages in the X");
        tty.outln("disk set, one per class of hardware, and setup does not pick one for");
        tty.outln("you.");
        tty.outln("");
        tty.outln("xinit:  Server error.");
      } else if (r.fail === "nolib") {
        tty.outln("");
        tty.outln(r.server + ": error in loading shared libraries");
        tty.outln(r.lib + ": cannot open shared object file: No such file or directory");
        tty.outln("");
        tty.outln("xinit:  Server error.");
      } else {
        tty.outln("");
        tty.outln("xinit:  Server error.");
      }
      Museum.note("x-failed:" + r.fail);
      return false;
    }
    /* the server starts */
    srv = r.server;
    geom = { w: r.mode.w, h: r.mode.h };
    on = true; dying = false;
    wins = []; focused = null; desk = 0; zTop = 10;
    State.set("xres", r.mode.name);
    State.set("xdepth", r.depth);
    Screen.graphicsMode(geom.w, geom.h);
    Con.show(7);
    $wins().innerHTML = ""; $over().innerHTML = "";
    $root().className = "";
    pointer = { x: Math.floor(geom.w / 2), y: Math.floor(geom.h / 2), b: 0 };
    drawCursor("X");
    document.body.classList.toggle("nativecursor", !!State.get("nativeCursor", false));
    /* the mouse protocol, which is the difference between a pointer and a
       pointer that jumps */
    State.set("xmouse", r.mouse);
    /* out of range: the outcome, as an artifact of its time */
    if (r.danger) {
      Museum.note("x-out-of-range");
      document.body.classList.add("rolling");
      Sound.whineOn();
      State.set("outOfRange", true);
      Museum.banner("The monitor is out of range. Ctrl+Alt+Backspace.");
    } else {
      document.body.classList.remove("rolling");
      State.set("outOfRange", false);
    }
    if (r.timid) Museum.note("x-timid:" + r.mode.name);
    else if (!r.danger) Museum.note("x-ok:" + r.mode.name);
    /* now run .xinitrc, which is what actually puts things on the screen */
    const rcPath = Env.home() + "/.xinitrc";
    let rc = readFileText(rcPath);
    let usedSystem = false;
    if (rc === null) { rc = readFileText("/var/X11R6/lib/xinit/xinitrc"); usedSystem = true; }
    if (rc === null) {
      /* xinit's last resort, which is one xterm and nothing else */
      rc = "xterm -geometry +1+1 -n login -display :0\n";
      usedSystem = true;
    }
    const sh = new Shell(tty, { cwd: Env.home(), display: ":0" });
    sh.noProfile = true;
    const lines = rc.split("\n").map(s => s.trim());
    let last = null;
    for (const l of lines) {
      if (!l.length || l[0] === "#") continue;
      if (/^(if|then|else|fi|for|do|done|case|esac|\w+=)/.test(l)) continue;
      if (/^(xrdb|xmodmap|xset|xsetroot|userresources|usermodmap|sysresources|sysmodmap)/.test(l)) {
        await sh.run(l);
        continue;
      }
      if (/&\s*$/.test(l)) { await sh.run(l); continue; }
      last = l;
    }
    /* the last line with no ampersand is the window manager, and X exits
       when it exits.  This is the rule that catches everybody. */
    if (last) {
      const argv0 = last.split(/\s+/)[0];
      const f = sh.lookup(argv0);
      if (f.err === "notfound") {
        tty.outln("");
        tty.outln(".xinitrc: " + argv0 + ": command not found");
        Museum.note("x-no-wm:" + argv0);
        wmName = null;
        Museum.banner("No window manager: a grey stipple and an X-shaped cursor.");
      } else {
        const missing = f.node ? linkCheck(f.node) : null;
        if (missing) {
          tty.outln("");
          tty.outln(argv0 + ": error in loading shared libraries");
          tty.outln(missing + ": cannot open shared object file: No such file or directory");
          wmName = null;
        } else {
          wmName = WMS[f.node.impl] ? f.node.impl : null;
          if (!wmName) { await sh.run(last); wmName = null; }
        }
      }
    } else wmName = null;
    State.set("wm", wmName);
    applyWM();
    /* wait here until the server dies */
    return new Promise(resolve => { sessionResolve = resolve; });
  }

  function kill(reason) {
    if (!on) return;
    on = false;
    dying = true;
    Sound.whineOff();
    document.body.classList.remove("rolling");
    for (const w of wins) if (w.onclose) { try { w.onclose(); } catch (e) { } }
    wins = [];
    $wins().innerHTML = "";
    $over().innerHTML = "";
    const tb = $("#taskbar"); if (tb) tb.remove();
    const pg = $(".pager"); if (pg) pg.remove();
    Museum.banner(null);
    Screen.textMode();
    Con.show(1);
    if (sessionResolve) { const r = sessionResolve; sessionResolve = null; r(reason || "exit"); }
  }
  function reveal() {
    if (!on) return;
    Screen.graphicsMode(geom.w, geom.h);
  }

  /* ---- windows ------------------------------------------------------- */
  /* X geometry: WIDTHxHEIGHT+XOFF+YOFF, where a negative offset is measured
     from the opposite edge.  Every client took this and it is the only
     placement mechanism there was. */
  function geometry(W, str, cellW, cellH) {
    if (!str) return;
    const m = /^(?:(\d+)x(\d+))?(?:([-+]\d+)([-+]\d+))?$/.exec(String(str).trim());
    if (!m) return;
    if (m[1] && cellW) { W.w = Number(m[1]) * cellW + (W.padW || 0); W.h = Number(m[2]) * cellH + (W.padH || 0); }
    else if (m[1]) { W.w = Number(m[1]); W.h = Number(m[2]); }
    if (m[3] !== undefined) {
      const gx = Number(m[3]), gy = Number(m[4]);
      W.x = m[3][0] === "-" ? Math.max(0, geom.w - W.w + gx) : gx;
      W.y = m[4][0] === "-" ? Math.max(0, geom.h - W.h + gy - (wmName === "fvwm95" ? 28 : 0)) : gy;
    }
    W.el.style.left = W.x + "px"; W.el.style.top = W.y + "px";
    W.el.style.width = W.w + "px"; W.el.style.height = W.h + "px";
    if (W.onresize) W.onresize();
    updateWM();
  }
  function place(w, h) {
    /* the placement fvwm and twm did: cascade, then wrap */
    const n = wins.filter(x => !x.wmwin).length;
    const x = 20 + (n % 6) * 26;
    const y = 20 + (n % 6) * 24;
    return { x: Math.min(x, Math.max(0, geom.w - w - 8)), y: Math.min(y, Math.max(0, geom.h - h - 8)) };
  }
  function makeWindow(o) {
    const W = Object.assign({
      title: "xterm", w: 400, h: 260, resizable: true, cls: "", cmd: "xterm",
      minW: 80, minH: 40, desk: desk, sticky: false, iconified: false, id: uid("xw")
    }, o);
    if (W.x === undefined || W.y === undefined) { const p = place(W.w, W.h); W.x = p.x; W.y = p.y; }
    W.el = el("div", { class: "xw", "data-id": W.id });
    W.body = el("div", { class: "cli" });
    wins.push(W);
    frameWindow(W);
    $wins().appendChild(W.el);
    raise(W);
    focus(W);
    if (WMS[wmName] && WMS[wmName].onNew) WMS[wmName].onNew(W);

/* ---- xterm: a real terminal, with a real shell in it ---------------- */
function xtermWindow(opts) {

    minW: 120, minH: 60

    position: "absolute", left: (olook ? scrollW + 2 : 2) + "px", top: "2px",
    right: (olook ? "2px" : "2px"), bottom: "2px",
    font: "11px/" + CH + "px \"DejaVu Sans Mono\",\"Liberation Mono\",monospace",
    background: opts.bg || "#000", color: opts.fg || "#c8c8c8" } });

     immediately noticeable thing about a Sun desktop */
  const bar = el("div", { style: {
    position: "absolute", top: "2px", bottom: "2px", width: scrollW + "px",
    left: olook ? "2px" : "auto", right: olook ? "auto" : "-14px",
    background: olook ? "#d6d3cc" : "#c6c6c6",
    borderStyle: "solid", borderWidth: "1px",
    borderColor: olook ? "#8f8c86" : "#545454" } });
  if (olook) {
    bar.appendChild(el("div", { style: { position: "absolute", left: "1px", right: "1px",
      top: "12px", height: "26px", background: "#a8a49b", border: "1px solid #000" } }));
    bar.appendChild(el("div", { style: { position: "absolute", left: "2px", top: "1px",
      width: "8px", height: "8px" },
      html: "<svg width='8' height='8'><path d='M4 0 L8 7 L0 7 Z' fill='#8f8c86' stroke='#000'/></svg>" }));
  }
  W.body.appendChild(screen);
  if (olook) W.body.appendChild(bar);
  const cur = el("div", { style: { position: "absolute", width: CW + "px", height: CH + "px",
    background: "#c8c8c8", mixBlendMode: "difference", pointerEvents: "none" } });
  screen.appendChild(cur);
  const grid = el("div", { style: { position: "absolute", inset: "0", whiteSpace: "pre" } });
  screen.appendChild(grid);
  screen.appendChild(cur);

  function paint() {
    const out = [];
    for (let y = 0; y < vt.rows; y++) {
      let html = "", runAt = -1, run = "";
      for (let x = 0; x < vt.cols; x++) {
        const k = y * vt.cols + x, a = vt.at[k];
        if (a !== runAt) { if (run.length) html += span(runAt, run); runAt = a; run = ""; }
        run += vt.ch[k];

      if (run.length) html += span(runAt, run);
      out.push("<div style='height:" + CH + "px'>" + html + "</div>");
    }
    grid.innerHTML = out.join("");

    cur.style.top = (vt.cy * CH) + "px";

    return "<i style='color:" + fg + ";background:" + bg + "'>" +
      txt.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</i>";
  }

    if (e.key === "Tab") e.preventDefault();
    if (e.ctrlKey && (e.key === "c" || e.key === "d" || e.key === "u" || e.key === "l" ||
        e.key === "a" || e.key === "e" || e.key === "k" || e.key === "w" ||
        e.key === "g" || e.key === "o" || e.key === "x" || e.key === "y" ||
        e.key === "v" || e.key === "b" || e.key === "f" || e.key === "n" || e.key === "p")) e.preventDefault();
    if (e.key === "Backspace" || e.key.startsWith("Arrow") || e.key === "Home" ||
        e.key === "End" || e.key === "PageUp" || e.key === "PageDown") e.preventDefault();

  };

    const nc = Math.max(20, Math.floor((W.w - (olook ? 26 : 12)) / CW));
    const nr = Math.max(4, Math.floor((W.h - (olook ? 30 : 30)) / CH));
    if (nc === vt.cols && nr === vt.rows) return;
    const old = { ch: vt.ch, at: vt.at, cols: vt.cols, rows: vt.rows };

    vt.ch = new Array(nc * nr).fill(" ");

      for (let x = 0; x < Math.min(nc, old.cols); x++) {

        vt.at[y * nc + x] = old.at[y * old.cols + x];

    paint();
  };
  const tty = new Tty(vt);
  const sh = new Shell(tty, { cwd: opts.cwd || Env.home(), term: "xterm", display: ":0",
    vars: { COLUMNS: String(cols), LINES: String(rows) } });
  sh.noProfile = !!opts.noProfile;
  W.onclose = () => { sh.exited = true; vt.push({ name: "^D", ch: "\x04" }); };
  paint();
  (async () => {
    if (opts.exec) { await sh.run(opts.exec); }
    else await sh.loop();
    X.closeWindow(W);
  })();

}

/* ---- the clocks ----------------------------------------------------- */
function clockFace(size, style) {
  /* drawn in code: a face, a bezel, three hands.  xclock's analogue mode
     and oclock's round window, both of which are 1980s X programs that
     shipped unchanged for twenty years. */
  const r = size / 2 - 2;
  const c = size / 2;
  const ticks = [];
  for (let i = 0; i < 60; i++) {
    const a = i * Math.PI / 30 - Math.PI / 2;
    const long = i % 5 === 0;
    const r1 = r - (long ? 6 : 2.5), r2 = r - 1;
    ticks.push("<line x1='" + (c + Math.cos(a) * r1).toFixed(1) + "' y1='" + (c + Math.sin(a) * r1).toFixed(1) +
      "' x2='" + (c + Math.cos(a) * r2).toFixed(1) + "' y2='" + (c + Math.sin(a) * r2).toFixed(1) +
      "' stroke='#000' stroke-width='" + (long ? 1.8 : 0.7) + "'/>");
  }
  const bg = style === "olook" ? "#d6d3cc" : "#c6c6c6";
  return { head: "<svg width='" + size + "' height='" + size + "' viewBox='0 0 " + size + " " + size + "'>" +
      "<circle cx='" + c + "' cy='" + c + "' r='" + r + "' fill='" + bg + "' stroke='#000' stroke-width='1.5'/>" +
      ticks.join(""), c, r };
}
function clockHands(c, r, d, seconds) {
  const hA = ((d.getHours() % 12) + d.getMinutes() / 60) * Math.PI / 6 - Math.PI / 2;
  const mA = (d.getMinutes() + d.getSeconds() / 60) * Math.PI / 30 - Math.PI / 2;
  const sA = d.getSeconds() * Math.PI / 30 - Math.PI / 2;
  let s = "";
  s += "<line x1='" + c + "' y1='" + c + "' x2='" + (c + Math.cos(hA) * r * 0.52).toFixed(1) +
       "' y2='" + (c + Math.sin(hA) * r * 0.52).toFixed(1) + "' stroke='#000' stroke-width='3.2'/>";
  s += "<line x1='" + c + "' y1='" + c + "' x2='" + (c + Math.cos(mA) * r * 0.78).toFixed(1) +
       "' y2='" + (c + Math.sin(mA) * r * 0.78).toFixed(1) + "' stroke='#000' stroke-width='2.2'/>";
  if (seconds) s += "<line x1='" + c + "' y1='" + c + "' x2='" + (c + Math.cos(sA) * r * 0.86).toFixed(1) +
       "' y2='" + (c + Math.sin(sA) * r * 0.86).toFixed(1) + "' stroke='#000' stroke-width='0.8'/>";
  s += "<circle cx='" + c + "' cy='" + c + "' r='2' fill='#000'/>";
  return s;
}

/* ---- xbill.  Not part of Slackware, installed from contrib by hand,
   and present on a remarkable proportion of the Linux machines that
   existed.  All sprites drawn in code, and the antagonist is an original
   figure rather than a likeness of anybody. ------------------------------ */
cmd("xbill", async c => {
  if (!X.running()) { c.errln("xbill: unable to open display \"\""); return 1; }
  const W = X.makeWindow({ title: "xbill", cmd: "xbill", w: 420, h: 320, resizable: false });
  X.geometry(W, c.flags("geometry:g:").geometry);
  const holder = el("div", { style: { position: "absolute", inset: "0", background: "#4a7a3a",
    cursor: "none", overflow: "hidden" } });
  W.body.appendChild(holder);
  const OSES = [
    { n: "linux", col: "#2b2b2b", mark: "L" },
    { n: "bsd", col: "#8b1a1a", mark: "B" },
    { n: "hurd", col: "#1a4b8b", mark: "H" },
    { n: "next", col: "#3a3a3a", mark: "N" },
    { n: "os2", col: "#6b4b1a", mark: "O" }
  ];
  const NCOMP = 6;
  const comps = [];
  for (let i = 0; i < NCOMP; i++) {
    comps.push({ x: 40 + (i % 3) * 130, y: 30 + Math.floor(i / 3) * 120,
      os: OSES[i % OSES.length], infected: false, spark: 0 });
  }
  let bills = [], score = 0, level = 1, lives = 3, running = true, held = null, t = 0;
  let bucket = { x: 360, y: 250 }, cursor = { x: 200, y: 160 };
  function spawn() {
    const edge = irnd(0, 3);
    const b = { x: edge === 0 ? -20 : edge === 1 ? 430 : irnd(0, 400),
      y: edge === 2 ? -20 : edge === 3 ? 330 : irnd(0, 300),
      target: pick(comps.filter(k => !k.infected)) || null, dead: false, hit: 0 };
    if (b.target) bills.push(b);
  }
  function svg() {
    let s = "<svg width='" + (W.w - 8) + "' height='" + (W.h - 30) + "'>";
    /* the computers */
    for (const k of comps) {
      s += "<rect x='" + k.x + "' y='" + k.y + "' width='54' height='44' rx='2' fill='#d8d4c8' stroke='#333'/>";
      s += "<rect x='" + (k.x + 5) + "' y='" + (k.y + 5) + "' width='44' height='30' fill='" +
        (k.infected ? "#7a2020" : k.os.col) + "'/>";
      s += "<text x='" + (k.x + 27) + "' y='" + (k.y + 25) + "' font-family='monospace' font-size='14' " +
        "fill='" + (k.infected ? "#ff6060" : "#e8e8e8") + "' text-anchor='middle'>" +
        (k.infected ? "!" : k.os.mark) + "</text>";
      s += "<rect x='" + (k.x + 14) + "' y='" + (k.y + 44) + "' width='26' height='8' fill='#b8b4a8' stroke='#333'/>";
      if (k.spark > 0) s += "<circle cx='" + (k.x + 27) + "' cy='" + (k.y + 20) + "' r='" +
        (14 - k.spark) + "' fill='none' stroke='#ffd040' stroke-width='2'/>";
    }
    /* the bucket */
    s += "<path d='M" + bucket.x + " " + bucket.y + " l34 0 l-5 26 l-24 0 Z' fill='#8899aa' stroke='#334'/>";
    s += "<ellipse cx='" + (bucket.x + 17) + "' cy='" + bucket.y + "' rx='17' ry='5' fill='#aabbcc' stroke='#334'/>";
    /* the antagonist: an original figure in a suit and round glasses */
    for (const b of bills) {
      if (b.dead) continue;
      s += "<g transform='translate(" + b.x.toFixed(0) + "," + b.y.toFixed(0) + ")'>";
      s += "<rect x='4' y='10' width='14' height='16' fill='#20304a'/>";
      s += "<circle cx='11' cy='6' r='6' fill='#e8c8a8' stroke='#000' stroke-width='0.6'/>";
      s += "<circle cx='8.6' cy='5.4' r='2.1' fill='none' stroke='#000' stroke-width='0.8'/>";
      s += "<circle cx='13.4' cy='5.4' r='2.1' fill='none' stroke='#000' stroke-width='0.8'/>";
      s += "<line x1='10.7' y1='5.4' x2='11.3' y2='5.4' stroke='#000' stroke-width='0.8'/>";
      s += "<path d='M11 12 l-3 5 l3 1 l3 -1 Z' fill='#c02020'/>";
      s += "<rect x='1' y='13' width='4' height='9' fill='#e8c8a8'/>";
      s += "<rect x='17' y='13' width='4' height='9' fill='#e8c8a8'/>";
      s += "<rect x='6' y='26' width='4' height='7' fill='#101820'/>";
      s += "<rect x='12' y='26' width='4' height='7' fill='#101820'/>";
      s += "</g>";
    }
    if (held) {
      s += "<g transform='translate(" + (cursor.x - 8) + "," + (cursor.y - 8) + ")' opacity='0.85'>" +
        "<rect x='0' y='0' width='18' height='24' fill='#20304a' stroke='#000'/></g>";
    }
    /* the hand cursor */
    s += "<g transform='translate(" + cursor.x + "," + cursor.y + ")'>" +
      "<path d='M0 0 L0 -12 L3 -9 L5 -14 L7 -13 L5 -8 L10 -8 Z' fill='#fff' stroke='#000'/></g>";
    s += "<text x='6' y='" + (W.h - 40) + "' font-family='monospace' font-size='11' fill='#fff'>" +
      "Level " + level + "   Score " + score + "   Lives " + lives + "</text>";
    if (!running) {
      s += "<rect x='" + ((W.w - 8) / 2 - 90) + "' y='" + ((W.h - 30) / 2 - 26) +
        "' width='180' height='52' fill='#c6c6c6' stroke='#000'/>";
      s += "<text x='" + ((W.w - 8) / 2) + "' y='" + ((W.h - 30) / 2 - 4) +
        "' font-family='monospace' font-size='13' text-anchor='middle'>Game Over</text>";
      s += "<text x='" + ((W.w - 8) / 2) + "' y='" + ((W.h - 30) / 2 + 14) +
        "' font-family='monospace' font-size='11' text-anchor='middle'>Score: " + score + "</text>";
    }
    return s + "</svg>";
  }
  holder.innerHTML = svg();
  holder.addEventListener("mousemove", e => {
    const k = X.curScale();
    const r = holder.getBoundingClientRect();
    cursor.x = (e.clientX - r.left) / k.x;
    cursor.y = (e.clientY - r.top) / k.y;
  });
  holder.addEventListener("mousedown", e => {
    e.stopPropagation();
    if (!running) return;
    /* squash one, or pick him up */
    for (const b of bills) {
      if (b.dead) continue;
      if (Math.abs(b.x + 11 - cursor.x) < 16 && Math.abs(b.y + 16 - cursor.y) < 20) {
        b.dead = true; score += 5; Sound.beep(900, 50);
        return;
      }
    }
    /* or pick up a dropped operating system and put it back */
    for (const k of comps) {
      if (!k.infected) continue;
      if (Math.abs(k.x + 27 - cursor.x) < 30 && Math.abs(k.y + 22 - cursor.y) < 26) {
        if (held) { k.infected = false; k.spark = 12; held = null; score += 10; Sound.beep(1400, 60); }
        else { held = k.os; }
        return;
      }
    }
  });
  const iv = setInterval(() => {
    if (!X.running()) { clearInterval(iv); return; }
    if (!running) { holder.innerHTML = svg(); return; }
    t++;
    if (t % Math.max(8, 40 - level * 4) === 0) spawn();
    for (const b of bills) {
      if (b.dead || !b.target) continue;
      const tx = b.target.x + 20, ty = b.target.y + 30;
      const dx = tx - b.x, dy = ty - b.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const sp = 0.7 + level * 0.15;
      b.x += dx / d * sp; b.y += dy / d * sp;
      if (d < 6) { b.dead = true; if (!b.target.infected) { b.target.infected = true; Sound.beep(200, 160); } }
    }
    bills = bills.filter(b => !b.dead);
    for (const k of comps) if (k.spark > 0) k.spark--;
    const inf = comps.filter(k => k.infected).length;
    if (inf >= comps.length) {
      lives--;
      if (lives <= 0) { running = false; }
      else { for (const k of comps) k.infected = false; bills = []; }
    }
    if (t % 500 === 0) { level++; for (const k of comps) k.infected = false; }
    holder.innerHTML = svg();
  }, 40);
  W.onclose = () => clearInterval(iv);
  Museum.note("xbill");
  return 0;
});

/* ---- the graphical browser ------------------------------------------- */
function browserWindow(o) {
  const netscape = o.kind === "netscape";
  const W = X.makeWindow({ title: netscape ? "Netscape: " + (Web.get(o.url) ? Web.get(o.url).title : o.url) : "Arena",
    cmd: o.kind, w: Math.min(X.geom().w - 20, 560), h: Math.min(X.geom().h - 40, 400) });
  let url = o.url;
  const visited = new Set();
  const chrome = el("div", { style: { position: "absolute", left: "0", right: "0", top: "0",
    height: netscape ? "58px" : "26px", background: "#c0c0c0", borderBottom: "1px solid #808080" } });
  const doc = el("div", { class: "brow", style: { position: "absolute", left: "0", right: "0",
    top: netscape ? "58px" : "26px", bottom: "20px" } });
  const status = el("div", { style: { position: "absolute", left: "0", right: "0", bottom: "0",
    height: "20px", background: "#c0c0c0", borderTop: "1px solid #fff",
    font: "10px/20px system-ui,sans-serif", paddingLeft: "6px", overflow: "hidden" } }, "Document: Done");
  W.body.appendChild(el("div", { style: { position: "absolute", inset: "0", background: "#c0c0c0" } }));
  W.body.appendChild(chrome);
  W.body.appendChild(doc);
  W.body.appendChild(status);
  const bar = el("div", { style: { display: "flex", gap: "3px", padding: "3px 4px" } });
  const mkb = (l, fn) => { const b = el("div", { class: "xbtn", style: {
    font: "10px/12px system-ui,sans-serif", padding: "3px 6px", borderWidth: "1px" } }, l);
    b.addEventListener("mouseup", e => { e.stopPropagation(); fn(); }); return b; };
  const hist = [];
  function go(u) {
    if (u !== url) hist.push(url);
    url = u;
    visited.add(u);
    render();
  }
  function render() {
    const p = Web.get(url);
    W.title = (netscape ? "Netscape: " : "Arena: ") + (p ? p.title : url);
    if (W.frameEl) { const lab = $(".lab", W.frameEl); if (lab) lab.textContent = W.title; }
    addr.value = url;
    doc.innerHTML = "";
    if (!p) {
      const host = (url.match(/^https?:\/\/([^/]+)/) || [])[1] || url;
      const r = Net.resolve(host);
      const reach = r.err ? { ok: 0 } : Net.reach(r.ip);
      status.textContent = r.err ? "Netscape is unable to locate the server: " + host
        : "Connect: Contacting host: " + host + "...";
      const pg = el("div", { class: "pg" });
      pg.appendChild(el("h2", null, r.err ? "Not Found" : "Unable to connect"));
      pg.appendChild(el("p", null, r.err
        ? "Netscape is unable to locate the server " + host + ". The server does not have a DNS entry."
        : "The connection was refused when attempting to contact " + host + "."));
      pg.appendChild(el("p", null, "Check the server name in the Location field and try again."));
      if (!Net.nameserver()) {

cmd("xv", async c => {
  if (!X.running()) { c.errln("xv: Can't open display"); return 1; }
  const W = X.makeWindow({ title: "xv", cmd: "xv", w: 360, h: 300 });
  X.geometry(W, c.flags("geometry:g:").geometry);
  /* the images are generated: a colour ramp, a dither test and a plasma,
     which is roughly what everybody's first xv session looked at */
  const cv = el("canvas", { width: 320, height: 220, style: { position: "absolute",
    left: "8px", top: "8px", imageRendering: "pixelated", border: "1px solid #545454" } });
  W.body.appendChild(el("div", { style: { position: "absolute", inset: "0", background: "#c6c6c6" } }));
  W.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const IMAGES = ["ramp", "dither", "plasma"];
  let which = 0;
  function draw() {
    const w = 160, h = 110;
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      let r, g, b;
      if (IMAGES[which] === "ramp") { r = Math.floor(x / w * 255); g = Math.floor(y / h * 255); b = 128; }
      else if (IMAGES[which] === "dither") {
        const v = ((x >> 1) + (y >> 1)) % 2 ? 255 : 0;
        r = g = b = v;
      } else {
        const v = 128 + 127 * Math.sin(x / 9) * Math.cos(y / 7);
        r = v; g = 255 - v; b = (v * 1.4) % 255;
      }
      /* eight bits deep and a shared colormap: quantise, visibly */
      const q = n => Math.round(n / 36) * 36;
      img.data[i] = q(r); img.data[i + 1] = q(g); img.data[i + 2] = q(b); img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(cv, 0, 0, w, h, 0, 0, 320, 220);
  }
  draw();
  const b = el("div", { class: "xbtn", style: { position: "absolute", left: "8px", bottom: "10px" } }, "Next image");
  b.addEventListener("mouseup", e => { e.stopPropagation(); which = (which + 1) % IMAGES.length; draw(); });
  W.body.appendChild(b);
  W.body.appendChild(el("div", { style: { position: "absolute", left: "104px", bottom: "14px",
    font: "10px monospace" } }, "xv 3.10a  Copyright 1994 John Bradley"));
  return 0;
});

cmd("maze", async c => {
  if (!X.running()) { c.errln("maze: unable to open display \"\""); return 1; }
  const W = X.makeWindow({ title: "maze", cmd: "maze", w: 300, h: 260 });
  const holder = el("div", { style: { position: "absolute", inset: "0", background: "#fff" } });
  W.body.appendChild(holder);
  const CW2 = 14, cols = 20, rows = 17;
  let grid, stack, cur, solving, path;
  function gen() {
    grid = [];
    for (let y = 0; y < rows; y++) { grid.push([]); for (let x = 0; x < cols; x++) grid[y].push({ n: 1, e: 1, s: 1, w: 1, v: 0 }); }
    stack = [[0, 0]]; grid[0][0].v = 1;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const opts = [];
      if (y > 0 && !grid[y - 1][x].v) opts.push(["n", x, y - 1]);
      if (y < rows - 1 && !grid[y + 1][x].v) opts.push(["s", x, y + 1]);
      if (x > 0 && !grid[y][x - 1].v) opts.push(["w", x - 1, y]);
      if (x < cols - 1 && !grid[y][x + 1].v) opts.push(["e", x + 1, y]);
      if (!opts.length) { stack.pop(); continue; }
      const [d, nx, ny] = pick(opts);
      grid[y][x][d] = 0;
      grid[ny][nx][{ n: "s", s: "n", e: "w", w: "e" }[d]] = 0;
      grid[ny][nx].v = 1;
      stack.push([nx, ny]);
    }
    cur = [0, 0]; path = [[0, 0]]; solving = true;
  }
  function draw() {
    let s = "<svg width='" + (cols * CW2 + 2) + "' height='" + (rows * CW2 + 2) + "'>";
    s += "<rect width='100%' height='100%' fill='#fff'/>";
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const c2 = grid[y][x], px = x * CW2 + 1, py = y * CW2 + 1;
      if (c2.n) s += "<line x1='" + px + "' y1='" + py + "' x2='" + (px + CW2) + "' y2='" + py + "' stroke='#000'/>";
      if (c2.w) s += "<line x1='" + px + "' y1='" + py + "' x2='" + px + "' y2='" + (py + CW2) + "' stroke='#000'/>";
      if (y === rows - 1 && c2.s) s += "<line x1='" + px + "' y1='" + (py + CW2) + "' x2='" + (px + CW2) + "' y2='" + (py + CW2) + "' stroke='#000'/>";
      if (x === cols - 1 && c2.e) s += "<line x1='" + (px + CW2) + "' y1='" + py + "' x2='" + (px + CW2) + "' y2='" + (py + CW2) + "' stroke='#000'/>";
    }
    for (const [x, y] of path)
      s += "<rect x='" + (x * CW2 + 5) + "' y='" + (y * CW2 + 5) + "' width='" + (CW2 - 8) + "' height='" + (CW2 - 8) + "' fill='#c00'/>";
    holder.innerHTML = s + "</svg>";
  }
  gen(); draw();
  const iv = setInterval(() => {
    if (!X.running()) { clearInterval(iv); return; }
    if (!solving) { gen(); draw(); return; }
    /* the classic right-hand-rule walk, which is what maze(1) did */
    const [x, y] = cur;
    const c2 = grid[y][x];
    const order = [["e", 1, 0], ["s", 0, 1], ["w", -1, 0], ["n", 0, -1]];
    let moved = false;
    for (const [d, dx, dy] of order) {
      if (c2[d]) continue;
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      if (path.some(p => p[0] === nx && p[1] === ny)) continue;
      cur = [nx, ny]; path.push(cur); moved = true; break;
    }
    if (!moved) { if (path.length > 1) { path.pop(); cur = path[path.length - 1]; } else solving = false; }
    if (cur[0] === cols - 1 && cur[1] === rows - 1) solving = false;
    draw();

});

  const f = c.flags("c:");
  if (f.c) return c.sh.run(f.c === true ? c.args.slice(c.args.indexOf("-c") + 1).join(" ") : f.c);
  if (f._.length) {
    const path = c.resolve(f._[0]);
    const txt = readFileText(path);
    if (txt === null) return c.usage(f._[0] + ": No such file or directory");
    const r = await c.sh.runScript(txt, [path].concat(f._.slice(1)), c);
    return r.status;
  }
  /* interactive: a nested shell, which is what happens and is why people
     end up four deep and confused about which exit closes what */
  const sh = new Shell(c.tty, { cwd: c.sh.cwd,
    vars: Object.assign({}, c.sh.vars, { SHLVL: String(Number(c.sh.vars.SHLVL || 1) + 1) }) });
  sh.noProfile = true;
  if (c.name === "tcsh" || c.name === "csh") sh.vars.PS1 = "\\h:\\w% ";
  if (c.name === "zsh") sh.vars.PS1 = "\\h%% ";
  if (c.name === "ash" || c.name === "ksh") sh.vars.PS1 = "$ ";
  await sh.loop();
  return sh.status;
});
