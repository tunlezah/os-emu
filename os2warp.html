<!DOCTYPE html>
<!--
  OS/2 Warp 4.52 simulation — single-file build.
  Generated by build.py; edit the sources under js/ and css/ instead.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>IBM OS/2 Warp 4.52</title>
<style>
/* ---- css/os2.css ---- */
/* ==========================================================================
   os2.css — Presentation Manager base: colour scheme, fonts, chiselled
   borders and the standard CUA controls (buttons, entry fields, list
   boxes, group boxes, static text, containers).
   ========================================================================== */

:root {
  /* --- Warp 4 default scheme ------------------------------------------- */
  --clr-desktop:        #008573;   /* teal-green Workplace Shell background  */
  --clr-dialog:         #cccccc;   /* PaleGray — window & dialog background  */
  --clr-dialog-alt:     #c0c0c0;
  --clr-field:          #ffffff;   /* entry field / container background     */
  --clr-field-alt:      #d8d8d8;
  --clr-text:           #000000;
  --clr-text-disabled:  #808080;
  --clr-text-disabled-h:#ffffff;

  /* bevel ramp — OS/2 uses four tones, lighter than the Win95 ramp        */
  --bev-white:          #ffffff;
  --bev-light:          #e4e4e4;
  --bev-mid:            #a0a0a0;
  --bev-dark:           #6e6e6e;
  --bev-black:          #3a3a3a;

  /* title bars: Warp 4 shipped gradient title bars                        */
  --title-active-a:     #0a2a80;
  --title-active-b:     #3f7fd0;
  --title-active-text:  #ffffff;
  --title-inactive-a:   #7a7a7a;
  --title-inactive-b:   #b4b4b4;
  --title-inactive-text:#e0e0e0;

  --clr-select:         #00007f;   /* selection / highlight                  */
  --clr-select-text:    #ffffff;
  --clr-menu-hi:        #00007f;

  --clr-scrollbar:      #b6b6b6;

  /* WarpCenter */
  --wc-bg:              #cccccc;

  /* metrics */
  --title-h:            20px;
  --menu-h:             20px;
  --frame-w:            4px;

  --font-sys: Tahoma, "DejaVu Sans", Verdana, Geneva, "Helvetica Neue", sans-serif;
  --font-mono: "Consolas", "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;
  --fs-sys: 11px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: var(--font-sys);
  font-size: var(--fs-sys);
  color: var(--clr-text);
  -webkit-font-smoothing: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}

body { display: flex; align-items: center; justify-content: center; }

.screen {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 1600px;
  overflow: hidden;
  background: #000;
  image-rendering: pixelated;
}

.hidden { display: none !important; }

/* ==========================================================================
   Chiselled borders.  OS/2 draws a 2px bevel with an outer dark keyline on
   raised controls; sunken (inset) fields get the reverse plus a keyline.
   ========================================================================== */

.bevel-raised {
  border-style: solid;
  border-width: 2px;
  border-color: var(--bev-white) var(--bev-dark) var(--bev-dark) var(--bev-white);
  background: var(--clr-dialog);
}
.bevel-sunken {
  border-style: solid;
  border-width: 2px;
  border-color: var(--bev-dark) var(--bev-white) var(--bev-white) var(--bev-dark);
  background: var(--clr-dialog);
}
.bevel-thin-raised {
  border-style: solid;
  border-width: 1px;
  border-color: var(--bev-white) var(--bev-dark) var(--bev-dark) var(--bev-white);
}
.bevel-thin-sunken {
  border-style: solid;
  border-width: 1px;
  border-color: var(--bev-dark) var(--bev-white) var(--bev-white) var(--bev-dark);
}
/* the characteristic OS/2 "chisel" — a groove between two panes */
.chisel-h { height: 2px; border-top: 1px solid var(--bev-dark); border-bottom: 1px solid var(--bev-white); }
.chisel-v { width: 2px; border-left: 1px solid var(--bev-dark); border-right: 1px solid var(--bev-white); }

/* ==========================================================================
   Push buttons
   ========================================================================== */

.pm-btn {
  display: inline-block;
  min-width: 74px;
  padding: 2px 8px 3px;
  margin: 0;
  font: inherit;
  font-size: var(--fs-sys);
  color: var(--clr-text);
  background: var(--clr-dialog);
  border: 1px solid var(--bev-black);
  box-shadow:
    inset  1px  1px 0 var(--bev-white),
    inset -1px -1px 0 var(--bev-dark),
    inset  2px  2px 0 var(--bev-light),
    inset -2px -2px 0 var(--bev-mid);
  text-align: center;
  line-height: 14px;
  cursor: default;
  outline: none;
}
.pm-btn.pm-btn-narrow { min-width: 0; }
.pm-btn:active:not(.disabled),
.pm-btn.pressed {
  box-shadow:
    inset  1px  1px 0 var(--bev-dark),
    inset -1px -1px 0 var(--bev-white),
    inset  2px  2px 0 var(--bev-mid),
    inset -2px -2px 0 var(--bev-light);
  padding: 3px 7px 2px 9px;
}
.pm-btn.default { border-width: 2px; padding: 1px 7px 2px; }
.pm-btn.disabled, .pm-btn:disabled {
  color: var(--clr-text-disabled);
  text-shadow: 1px 1px 0 var(--clr-text-disabled-h);
}
.pm-btn:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }

/* ==========================================================================
   Entry fields, multi-line edit, list boxes, combo boxes
   ========================================================================== */

.pm-entry, .pm-mle {
  font: inherit;
  font-size: var(--fs-sys);
  color: var(--clr-text);
  background: var(--clr-field);
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid), inset -1px -1px 0 var(--bev-white);
  padding: 1px 3px;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}
.pm-mle { font-family: var(--font-mono); resize: none; padding: 2px; }
.pm-entry:read-only { background: var(--clr-dialog); }

.pm-list {
  background: var(--clr-field);
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid);
  overflow: auto;
  padding: 1px;
}
.pm-list-item { padding: 1px 4px; white-space: nowrap; }
.pm-list-item.selected { background: var(--clr-select); color: var(--clr-select-text); }

select.pm-combo {
  font: inherit; font-size: var(--fs-sys);
  background: var(--clr-field);
  border: 1px solid var(--bev-dark);
  padding: 1px;
  border-radius: 0;
}

/* check boxes & radio buttons — OS/2 draws them square / diamond-less */
/* one control per line; wrap them in .row to place several side by side */
.pm-check, .pm-radio {
  display: flex; align-items: center; gap: 5px;
  padding: 1px 0; cursor: default;
  width: fit-content;
}
.pm-check .box, .pm-radio .box {
  width: 12px; height: 12px; flex: 0 0 12px;
  background: var(--clr-field);
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid), inset -1px -1px 0 var(--bev-white);
  position: relative;
}
.pm-radio .box { border-radius: 6px; }
.pm-check.on .box::after {
  content: ""; position: absolute; inset: 2px;
  background: linear-gradient(45deg, transparent 44%, #000 44%, #000 56%, transparent 56%),
              linear-gradient(-45deg, transparent 44%, #000 44%, #000 56%, transparent 56%);
}
.pm-radio.on .box::after {
  content: ""; position: absolute; inset: 3px; background: #000; border-radius: 3px;
}
.pm-check.disabled, .pm-radio.disabled { color: var(--clr-text-disabled); }

/* group box */
.pm-group {
  border: 1px solid var(--bev-dark);
  box-shadow: inset -1px -1px 0 var(--bev-white), 1px 1px 0 var(--bev-white);
  margin: 8px 0 4px;
  padding: 8px;
  position: relative;
}
.pm-group > .legend {
  position: absolute; top: -7px; left: 6px;
  background: var(--clr-dialog); padding: 0 4px;
}

/* spin button */
.pm-spin { display: inline-flex; }
.pm-spin input { width: 46px; }
.pm-spin .arrows { display: flex; flex-direction: column; margin-left: -1px; }
.pm-spin .arrows > div {
  width: 15px; height: 9px;
  background: var(--clr-dialog);
  border: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 var(--bev-white), inset -1px -1px 0 var(--bev-dark);
  display: flex; align-items: center; justify-content: center;
  font-size: 6px; line-height: 1;
}
.pm-spin .arrows > div:active { box-shadow: inset 1px 1px 0 var(--bev-dark); }

/* slider */
.pm-slider { display: flex; align-items: center; height: 22px; }
.pm-slider .shaft {
  flex: 1; height: 6px; margin: 0 8px;
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid);
  background: var(--clr-dialog-alt);
  position: relative;
}
.pm-slider .thumb {
  position: absolute; top: -7px; width: 11px; height: 18px;
  background: var(--clr-dialog);
  border: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 var(--bev-white), inset -1px -1px 0 var(--bev-dark);
}

/* static text / headings */
.pm-static { padding: 2px 0; }
.pm-sep { height: 2px; margin: 6px 0; border-top: 1px solid var(--bev-dark); border-bottom: 1px solid var(--bev-white); }

/* progress bar (OS/2 "slider" style progress indicator) */
.pm-progress {
  height: 14px;
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid);
  background: var(--clr-field);
  overflow: hidden;
}
.pm-progress > .bar {
  height: 100%; width: 0;
  background: var(--clr-select);
}

/* ==========================================================================
   Scroll bars — OS/2 arrows are solid triangles on a grey shaft
   ========================================================================== */
.scroll::-webkit-scrollbar { width: 16px; height: 16px; }
.scroll::-webkit-scrollbar-track { background: var(--clr-scrollbar); }
.scroll::-webkit-scrollbar-thumb {
  background: var(--clr-dialog);
  border: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 var(--bev-white), inset -1px -1px 0 var(--bev-dark);
}
.scroll::-webkit-scrollbar-corner { background: var(--clr-scrollbar); }

/* ==========================================================================
   Popup menus (mouse button 2 menus and menu-bar pulldowns)
   ========================================================================== */

.popup-layer, .drag-layer {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 9000;
}
.popup-layer > * { pointer-events: auto; }

.pm-menu {
  position: absolute;
  min-width: 140px;
  background: var(--clr-dialog);
  border: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 var(--bev-white), inset -1px -1px 0 var(--bev-dark),
              2px 2px 0 rgba(0,0,0,.35);
  padding: 2px;
  z-index: 9100;
}
.pm-menu-item {
  display: flex; align-items: center; gap: 10px;
  padding: 2px 6px 2px 20px;
  white-space: nowrap;
  position: relative;
}
.pm-menu-item .accel { margin-left: auto; padding-left: 24px; color: #333; }
.pm-menu-item .arrow { margin-left: auto; padding-left: 16px; }
.pm-menu-item:not(.disabled):hover,
.pm-menu-item.hover {
  background: var(--clr-menu-hi); color: var(--clr-select-text);
}
.pm-menu-item:not(.disabled):hover .accel,
.pm-menu-item.hover .accel { color: #cfcfcf; }
.pm-menu-item.disabled { color: var(--clr-text-disabled); text-shadow: 1px 1px 0 #fff; }
.pm-menu-item.checked::before { content: "\2713"; position: absolute; left: 6px; }
.pm-menu-item .mn { text-decoration: underline; }
.pm-menu-sep { height: 2px; margin: 3px 2px;
  border-top: 1px solid var(--bev-dark); border-bottom: 1px solid var(--bev-white); }
.pm-menu-title {
  padding: 2px 6px; font-weight: bold; background: var(--clr-dialog-alt);
  border-bottom: 1px solid var(--bev-dark); margin: -2px -2px 2px;
}

/* menu bar */
.pm-menubar {
  display: flex; align-items: stretch;
  height: var(--menu-h);
  background: var(--clr-dialog);
  border-bottom: 1px solid var(--bev-dark);
  box-shadow: 0 1px 0 var(--bev-white);
  flex: 0 0 auto;
}
.pm-menubar > .item { padding: 3px 8px; }
.pm-menubar > .item.open, .pm-menubar > .item:hover {
  background: var(--clr-menu-hi); color: var(--clr-select-text);
}

/* ==========================================================================
   Drag image
   ========================================================================== */
.drag-image {
  position: absolute;
  opacity: .72;
  pointer-events: none;
  text-align: center;
  width: 76px;
}
.drag-image img { width: 32px; height: 32px; }
.drag-image .lbl { background: var(--clr-select); color: #fff; font-size: 10px; padding: 0 2px; display: inline-block; }
.drop-target { outline: 2px dotted #fff; outline-offset: -3px; }

/* ==========================================================================
   Full-screen layers (boot, lockup, shutdown, VIO full screen sessions)
   ========================================================================== */
.boot-surface, .fullscreen-layer {
  position: absolute; inset: 0;
  background: #000;
  color: #b6b6b6;
  font-family: var(--font-mono);
  font-size: 15px;
  line-height: 1.22;
  padding: 8px 10px;
  overflow: hidden;
  white-space: pre-wrap;
  z-index: 500;
}
.fullscreen-layer { z-index: 8000; padding: 0; }

.boot-surface .amber  { color: #d8d8d8; }
.boot-surface .dim    { color: #8a8a8a; }
.boot-surface .hi     { color: #ffffff; }

/* the OS/2 boot "blob" — recreated in style, not copied artwork */
.bootlogo { position: absolute; inset: 0; background: #ffffff; display: flex;
            align-items: center; justify-content: center; flex-direction: column; }
.bootlogo .mark {
  font-family: var(--font-sys);
  font-weight: bold;
  letter-spacing: -2px;
  color: #10267a;
  line-height: .9;
}
.bootlogo .bar { height: 6px; background: #10267a; margin-top: 14px; }
.bootlogo .sub { font-family: var(--font-sys); color: #333; margin-top: 10px; letter-spacing: 3px; }

/* utility */
.row { display: flex; align-items: center; gap: 6px; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1 1 auto; min-width: 0; min-height: 0; }
.mono { font-family: var(--font-mono); }
.nowrap { white-space: nowrap; }
.pad8 { padding: 8px; }
.right { margin-left: auto; }
.center { text-align: center; }

/* ---- css/windows.css ---- */
/* ==========================================================================
   windows.css — Presentation Manager frame windows.
   OS/2 frame = 4px sizing border, title bar with system-menu icon on the
   left and Hide / Minimize / Maximize on the right.
   ========================================================================== */

.window-layer {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 100;
}
.window-layer > .pm-window { pointer-events: auto; }

.pm-window {
  position: absolute;
  display: flex;
  flex-direction: column;
  background: var(--clr-dialog);
  border: var(--frame-w) solid var(--clr-dialog);
  box-shadow:
    inset  1px  1px 0 var(--bev-white),
    inset -1px -1px 0 var(--bev-dark),
    0 0 0 1px var(--bev-black);
  min-width: 140px; min-height: 60px;
}
.pm-window.dialog { border-width: 4px; }
.pm-window.no-resize { }
.pm-window.animating { transition: none; }

/* ---- title bar ---------------------------------------------------------- */
.pm-title {
  height: var(--title-h);
  flex: 0 0 var(--title-h);
  display: flex; align-items: center;
  background: linear-gradient(to right, var(--title-active-a), var(--title-active-b));
  color: var(--title-active-text);
  padding: 0;
  overflow: hidden;
}
.pm-window.inactive .pm-title {
  background: linear-gradient(to right, var(--title-inactive-a), var(--title-inactive-b));
  color: var(--title-inactive-text);
}
.pm-title .sysmenu {
  width: 18px; height: 18px; margin: 1px 2px 1px 1px;
  flex: 0 0 18px;
  display: flex; align-items: center; justify-content: center;
}
.pm-title .sysmenu img { width: 16px; height: 16px; }
.pm-title .caption {
  flex: 1 1 auto;
  font-weight: bold;
  font-size: var(--fs-sys);
  white-space: nowrap; overflow: hidden; text-overflow: clip;
  padding-right: 6px;
}
.pm-title .btns { display: flex; gap: 1px; padding-right: 1px; flex: 0 0 auto; }

.tbtn {
  width: 17px; height: 16px;
  background: var(--clr-dialog);
  border: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 var(--bev-white), inset -1px -1px 0 var(--bev-dark);
  position: relative;
}
.tbtn:active { box-shadow: inset 1px 1px 0 var(--bev-dark), inset -1px -1px 0 var(--bev-white); }
/* Hide button: small square sitting on the baseline */
.tbtn.hide::after {
  content: ""; position: absolute; left: 4px; top: 8px; width: 7px; height: 4px;
  border: 1px solid #000; background: var(--clr-dialog);
}
/* Minimise: a low wide bar */
.tbtn.min::after {
  content: ""; position: absolute; left: 3px; bottom: 3px; width: 9px; height: 3px;
  border: 1px solid #000; background: var(--clr-dialog);
}
/* Maximise: full outline box with heavy top edge */
.tbtn.max::after {
  content: ""; position: absolute; left: 3px; top: 2px; width: 9px; height: 9px;
  border: 1px solid #000; border-top-width: 3px; background: var(--clr-dialog);
}
/* Restore: two overlapping boxes */
.tbtn.restore::after {
  content: ""; position: absolute; left: 2px; top: 4px; width: 7px; height: 7px;
  border: 1px solid #000; border-top-width: 2px; background: var(--clr-dialog);
}
.tbtn.restore::before {
  content: ""; position: absolute; left: 5px; top: 1px; width: 7px; height: 7px;
  border: 1px solid #000; border-top-width: 2px; background: var(--clr-dialog);
}

/* ---- client area -------------------------------------------------------- */
.pm-client {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
  background: var(--clr-dialog);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.pm-client.sunken {
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid);
  background: var(--clr-field);
}
.pm-client.padded { padding: 8px; }

/* status/info line at the bottom of container windows */
.pm-infoline {
  flex: 0 0 auto;
  height: 18px;
  display: flex; align-items: center;
  padding: 0 4px;
  border-top: 1px solid var(--bev-dark);
  box-shadow: inset 0 1px 0 var(--bev-white);
  background: var(--clr-dialog);
  font-size: 10px;
}

/* ---- sizing handles ----------------------------------------------------- */
.rz { position: absolute; z-index: 5; }
.rz.n  { top: calc(var(--frame-w) * -1); left: 0; right: 0; height: var(--frame-w); cursor: ns-resize; }
.rz.s  { bottom: calc(var(--frame-w) * -1); left: 0; right: 0; height: var(--frame-w); cursor: ns-resize; }
.rz.w  { left: calc(var(--frame-w) * -1); top: 0; bottom: 0; width: var(--frame-w); cursor: ew-resize; }
.rz.e  { right: calc(var(--frame-w) * -1); top: 0; bottom: 0; width: var(--frame-w); cursor: ew-resize; }
.rz.nw { top: calc(var(--frame-w) * -1); left: calc(var(--frame-w) * -1); width: 12px; height: 12px; cursor: nwse-resize; }
.rz.ne { top: calc(var(--frame-w) * -1); right: calc(var(--frame-w) * -1); width: 12px; height: 12px; cursor: nesw-resize; }
.rz.sw { bottom: calc(var(--frame-w) * -1); left: calc(var(--frame-w) * -1); width: 12px; height: 12px; cursor: nesw-resize; }
.rz.se { bottom: calc(var(--frame-w) * -1); right: calc(var(--frame-w) * -1); width: 12px; height: 12px; cursor: nwse-resize; }

/* tracking rectangle drawn while moving/sizing (authentic PM behaviour) */
.track-rect {
  position: absolute;
  border: 2px dotted #fff;
  mix-blend-mode: difference;
  pointer-events: none;
  z-index: 8500;
}

/* ---- dialogs ------------------------------------------------------------ */
.pm-dlg-body { padding: 12px 14px; display: flex; gap: 12px; }
.pm-dlg-body .dlgicon { flex: 0 0 32px; }
.pm-dlg-body .dlgicon img { width: 32px; height: 32px; }
.pm-dlg-text { flex: 1; line-height: 1.45; white-space: pre-wrap; user-select: text; }
.pm-dlg-btns {
  display: flex; gap: 8px; justify-content: center;
  padding: 4px 10px 10px;
}

/* ---- window list -------------------------------------------------------- */
.windowlist { display: flex; flex-direction: column; height: 100%; }
.windowlist .items { flex: 1; overflow: auto; }
.windowlist .wl-item { display: flex; align-items: center; gap: 6px; padding: 2px 5px; }
.windowlist .wl-item img { width: 16px; height: 16px; }
.windowlist .wl-item.selected { background: var(--clr-select); color: #fff; }

/* ---- minimised window viewer ------------------------------------------- */
.mwv-grid { display: flex; flex-wrap: wrap; align-content: flex-start; padding: 6px; gap: 4px; overflow: auto; }

/* ---- css/desktop.css ---- */
/* ==========================================================================
   desktop.css — Workplace Shell desktop, icon views, WarpCenter, LaunchPad
   ========================================================================== */

.wps { position: absolute; inset: 0; }

.desktop {
  position: absolute; inset: 0;
  background-color: var(--clr-desktop);
  outline: none;
  overflow: hidden;
}
.desktop.bmp-tiled  { background-repeat: repeat; }
.desktop.bmp-scaled { background-repeat: no-repeat; background-size: 100% 100%; }
.desktop.bmp-center { background-repeat: no-repeat; background-position: center; }

/* ---- object icons ------------------------------------------------------- */
.wps-icon {
  position: absolute;
  width: 76px;
  text-align: center;
  padding: 2px;
  cursor: default;
}
.wps-icon .glyph { width: 32px; height: 32px; margin: 0 auto; display: block; }
.wps-icon.small .glyph { width: 20px; height: 20px; }
.wps-icon .title {
  display: inline-block;
  margin-top: 2px;
  padding: 0 2px;
  font-size: 10px;
  line-height: 12px;
  color: #ffffff;
  text-shadow: 1px 1px 0 rgba(0,0,0,.75);
  word-break: break-word;
  max-width: 74px;
}
.folder-view .wps-icon .title { color: #000; text-shadow: none; }
.wps-icon.selected .title { background: var(--clr-select); color: #fff; text-shadow: none; }
.wps-icon.selected .glyph { filter: brightness(.82) saturate(1.2); }
.wps-icon.open-obj .glyph { opacity: .5; }
.wps-icon.dragging { opacity: .4; }

/* flowed (non-absolute) icon layout used inside folder windows */
.folder-view.flow .wps-icon { position: relative; display: inline-block; vertical-align: top; }

/* ---- folder windows ----------------------------------------------------- */
.folder-view {
  flex: 1 1 auto;
  position: relative;
  overflow: auto;
  background: var(--clr-dialog);
  padding: 4px;
  min-height: 0;
}
.folder-split { display: flex; flex: 1; min-height: 0; }
.folder-split .tree-pane {
  width: 210px; flex: 0 0 210px; overflow: auto;
  background: var(--clr-dialog);
  border-right: 1px solid var(--bev-dark);
  box-shadow: inset -1px 0 0 var(--bev-white);
  padding: 4px 2px;
}
.folder-split .split-bar { width: 4px; cursor: ew-resize; background: var(--clr-dialog); flex: 0 0 4px; }

/* tree view rows */
.tree-row { display: flex; align-items: center; gap: 3px; padding: 1px 2px; white-space: nowrap; }
.tree-row .twisty {
  width: 11px; height: 11px; flex: 0 0 11px;
  border: 1px solid var(--bev-dark);
  background: var(--clr-field);
  position: relative;
  font-size: 9px; line-height: 9px; text-align: center;
}
.tree-row .twisty.empty { border: none; background: none; }
.tree-row img { width: 16px; height: 16px; }
.tree-row .lbl { padding: 0 3px; }
.tree-row.selected .lbl { background: var(--clr-select); color: #fff; }

/* details view */
.details-view { width: 100%; border-collapse: collapse; background: var(--clr-field); }
.details-view th {
  position: sticky; top: 0;
  background: var(--clr-dialog);
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-white);
  font-weight: normal; text-align: left;
  padding: 2px 5px; white-space: nowrap;
}
.details-view td { padding: 1px 5px; white-space: nowrap; border-bottom: 1px solid #e8e8e8; }
.details-view td.num { text-align: right; }
.details-view tr.selected td { background: var(--clr-select); color: #fff; }
.details-view td img { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }

/* ---- WarpCenter --------------------------------------------------------- */
.warpcenter {
  position: absolute; top: 0; left: 0; right: 0;
  height: 26px;
  display: flex; align-items: stretch;
  background: var(--wc-bg);
  border-bottom: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 var(--bev-white), inset -1px -1px 0 var(--bev-dark);
  z-index: 400;
  font-size: 10px;
  padding: 1px;
}
.warpcenter.bottom { top: auto; bottom: 0; border-bottom: none; border-top: 1px solid var(--bev-black); }
.wc-sec {
  display: flex; align-items: center;
  padding: 0 3px;
  border: 1px solid transparent;
}
.wc-sep { width: 2px; margin: 2px 2px;
  border-left: 1px solid var(--bev-dark); border-right: 1px solid var(--bev-white); }
.wc-btn {
  display: flex; align-items: center; gap: 3px;
  height: 22px; padding: 0 4px;
  border: 1px solid transparent;
}
.wc-btn:hover { border-color: var(--bev-white) var(--bev-dark) var(--bev-dark) var(--bev-white); border-style: solid; }
.wc-btn.active { border-color: var(--bev-dark) var(--bev-white) var(--bev-white) var(--bev-dark); border-style: solid; }
.wc-btn img { width: 16px; height: 16px; }
.wc-clock {
  font-family: var(--font-mono); font-size: 10px;
  text-align: center; line-height: 10px; padding: 1px 5px;
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid), inset -1px -1px 0 var(--bev-white);
  background: var(--clr-dialog-alt);
}
.wc-gauge {
  width: 44px; height: 18px;
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid);
  background: #000;
  position: relative; overflow: hidden;
}
.wc-gauge canvas { display: block; }
.wc-mem { font-family: var(--font-mono); font-size: 9px; line-height: 9px; text-align: right; }
.wc-tray { display: flex; gap: 1px; }
.wc-title { font-weight: bold; letter-spacing: .3px; padding: 0 4px; }

/* ---- LaunchPad ---------------------------------------------------------- */
.launchpad {
  position: absolute;
  left: 50%; bottom: 12px; transform: translateX(-50%);
  background: var(--clr-dialog);
  border: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 var(--bev-white), inset -1px -1px 0 var(--bev-dark);
  padding: 3px;
  z-index: 390;
  display: flex; flex-direction: column; gap: 2px;
}
.launchpad .lp-row { display: flex; gap: 2px; align-items: flex-end; }
.launchpad .lp-pad {
  width: 46px; padding: 2px 0 3px; text-align: center;
  border: 1px solid var(--bev-white); border-right-color: var(--bev-dark); border-bottom-color: var(--bev-dark);
}
.launchpad .lp-pad:active { border-color: var(--bev-dark) var(--bev-white) var(--bev-white) var(--bev-dark); }
.launchpad .lp-pad img { width: 28px; height: 28px; }
.launchpad .lp-pad .cap { font-size: 9px; display: block; margin-top: 1px; }
.launchpad .lp-drawer { display: flex; justify-content: center; }
.launchpad .lp-drawer .tab {
  width: 46px; height: 9px;
  border: 1px solid var(--bev-white); border-right-color: var(--bev-dark); border-bottom-color: var(--bev-dark);
  font-size: 6px; text-align: center; line-height: 7px;
}
.launchpad .lp-sys { display: flex; gap: 2px; justify-content: center; margin-top: 2px; }
.launchpad .lp-sys .mini {
  width: 22px; height: 20px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--bev-white); border-right-color: var(--bev-dark); border-bottom-color: var(--bev-dark);
}
.launchpad .lp-sys .mini img { width: 16px; height: 16px; }

/* ---- lockup / shutdown surfaces ---------------------------------------- */
.lockup {
  position: absolute; inset: 0;
  background: #0a4f45;
  display: flex; align-items: center; justify-content: center;
  z-index: 8200;
}
.shutdown-screen {
  position: absolute; inset: 0; background: #000; color: #c8c8c8;
  font-family: var(--font-mono); font-size: 15px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 40px; z-index: 8300; white-space: pre-wrap;
}

/* rubber-band selection on the desktop / folder background */
.rubber {
  position: absolute; border: 1px dotted #fff; background: rgba(255,255,255,.08);
  pointer-events: none; z-index: 50;
}

/* ---- css/notebook.css ---- */
/* ==========================================================================
   notebook.css — the Warp 4 notebook control.

   Layout:  +---------------------------------+
            | page area                  | T |   major tabs run down the
            |                            | a |   RIGHT edge
            |                            | b |
            +----------------------------+ s |
            |  minor tabs (bottom edge)      |
            +--------------------------------+
   Page arrows and "Page n of m" sit at the bottom right of the page area.
   ========================================================================== */

.notebook {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;
  background: var(--clr-dialog);
  padding: 4px 2px 2px 4px;
}

.nb-body { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }

.nb-pagewrap {
  flex: 1 1 auto;
  display: flex; flex-direction: column;
  background: var(--clr-dialog);
  border: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 var(--bev-white), inset -1px -1px 0 var(--bev-dark);
  min-height: 0;
}

.nb-page {
  flex: 1 1 auto;
  overflow: auto;
  padding: 10px 12px;
  min-height: 0;
}
.nb-page h4 { margin: 0 0 8px; font-size: var(--fs-sys); font-weight: bold; }
.nb-page .fld { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.nb-page .fld > label { width: 130px; flex: 0 0 130px; }
.nb-page .fld > .pm-entry { flex: 1 1 auto; min-width: 60px; }

/* status strip: page arrows + "Page 1 of 3" */
.nb-status {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 4px;
  padding: 2px 4px;
  border-top: 1px solid var(--bev-dark);
  box-shadow: inset 0 1px 0 var(--bev-white);
  font-size: 10px;
}
.nb-arrow {
  width: 15px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  background: var(--clr-dialog);
  border: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 var(--bev-white), inset -1px -1px 0 var(--bev-dark);
  font-size: 8px;
}
.nb-arrow:active { box-shadow: inset 1px 1px 0 var(--bev-dark); }
.nb-arrow.disabled { color: var(--clr-text-disabled); }

/* buttons row (Undo / Default / Help) */
.nb-buttons {
  flex: 0 0 auto;
  display: flex; gap: 8px;
  padding: 6px 2px 2px;
}

/* --- major tabs: right edge --------------------------------------------- */
.nb-tabs-right {
  flex: 0 0 auto;
  display: flex; flex-direction: column;
  padding-top: 6px;
  width: 92px;
  margin-left: -1px;
}
.nb-tabs-right .nb-tab {
  position: relative;
  padding: 4px 4px 4px 8px;
  margin-bottom: 2px;
  background: var(--clr-dialog-alt);
  border: 1px solid var(--bev-black);
  border-left: none;
  box-shadow: inset -1px -1px 0 var(--bev-dark), inset 1px 1px 0 var(--bev-white);
  font-size: 10px;
  line-height: 12px;
  text-align: left;
  min-height: 22px;
  display: flex; align-items: center;
}
.nb-tabs-right .nb-tab.active {
  background: var(--clr-dialog);
  margin-left: -3px;
  padding-left: 11px;
  font-weight: bold;
  z-index: 2;
}

/* --- minor tabs: bottom edge -------------------------------------------- */
.nb-tabs-bottom {
  flex: 0 0 auto;
  display: flex; gap: 2px;
  padding: 0 0 0 10px;
  margin-top: -1px;
}
.nb-tabs-bottom .nb-tab {
  padding: 3px 10px 4px;
  background: var(--clr-dialog-alt);
  border: 1px solid var(--bev-black);
  border-top: none;
  box-shadow: inset -1px -1px 0 var(--bev-dark), inset 1px 0 0 var(--bev-white);
  font-size: 10px;
}
.nb-tabs-bottom .nb-tab.active {
  background: var(--clr-dialog);
  font-weight: bold;
  padding-bottom: 6px;
  margin-top: -1px;
}

/* colour / scheme palettes ------------------------------------------------ */
.palette-grid { display: grid; grid-template-columns: repeat(8, 26px); gap: 3px; padding: 8px; }
.palette-grid .swatch {
  width: 26px; height: 20px;
  border: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.5);
}
.palette-grid .swatch.sel { outline: 2px solid #fff; outline-offset: -4px; }

.scheme-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 8px; }
.scheme-card {
  border: 1px solid var(--bev-black);
  box-shadow: inset 1px 1px 0 var(--bev-white), inset -1px -1px 0 var(--bev-dark);
  padding: 3px; background: var(--clr-dialog);
}
.scheme-card.sel { outline: 2px dotted #000; outline-offset: -5px; }
.scheme-card .prev { height: 34px; border: 1px solid var(--bev-black); position: relative; overflow: hidden; }
.scheme-card .prev .t { height: 10px; }
.scheme-card .cap { font-size: 10px; text-align: center; padding-top: 2px; }

/* ---- css/apps.css ---- */
/* ==========================================================================
   apps.css — command sessions and the bundled Warp 4 applications
   ========================================================================== */

/* ---- VIO / command sessions -------------------------------------------- */
.vio {
  flex: 1 1 auto;
  background: #000;
  color: #b8b8b8;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.15;
  padding: 2px 4px;
  overflow-y: auto;
  overflow-x: hidden;
  white-space: pre-wrap;
  word-break: break-word;
  user-select: text; -webkit-user-select: text;
  outline: none;
  min-height: 0;
}
.vio.fullscreen { font-size: 16px; line-height: 1.2; padding: 8px 12px; height: 100%; }
.vio .caret {
  display: inline-block; width: 8px; height: 1em;
  background: #b8b8b8; vertical-align: -2px;
  animation: vio-blink 1.05s steps(1) infinite;
}
@keyframes vio-blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
.vio .err { color: #d0d0d0; }
.vio .hi  { color: #ffffff; }
.vio.dos  { color: #c0c0c0; }
.vio.winos2 { background: #008080; }

/* ---- editors ------------------------------------------------------------ */
.editor-area {
  flex: 1 1 auto;
  display: block;
  width: 100%;
  border: none;
  background: var(--clr-field);
  color: #000;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.25;
  padding: 3px 5px;
  resize: none; outline: none;
  user-select: text; -webkit-user-select: text;
  min-height: 0;
}
.epm-status {
  flex: 0 0 auto; display: flex; gap: 14px; padding: 2px 6px;
  border-top: 1px solid var(--bev-dark); box-shadow: inset 0 1px 0 var(--bev-white);
  font-size: 10px; font-family: var(--font-mono);
}

/* ---- Pulse -------------------------------------------------------------- */
.pulse-wrap { flex: 1; display: flex; flex-direction: column; padding: 3px; min-height: 0; }
.pulse-canvas {
  flex: 1; width: 100%; display: block; background: #000;
  border: 1px solid var(--bev-dark); box-shadow: inset 1px 1px 0 var(--bev-mid);
  min-height: 0;
}

/* ---- Icon Editor -------------------------------------------------------- */
.iconedit { display: flex; flex: 1; min-height: 0; }
.iconedit .canvaswrap { padding: 6px; }
.iconedit canvas.grid {
  image-rendering: pixelated;
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid);
  background: #fff;
  cursor: crosshair;
}
.iconedit .tools { width: 118px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.iconedit .swatches { display: grid; grid-template-columns: repeat(4, 20px); gap: 2px; }
.iconedit .swatches div { width: 20px; height: 16px; border: 1px solid var(--bev-black); }
.iconedit .swatches div.sel { outline: 2px solid #fff; outline-offset: -4px; }
.iconedit .preview { display: flex; gap: 8px; align-items: center; padding-top: 6px; }
.iconedit .preview canvas { image-rendering: pixelated; border: 1px solid var(--bev-dark); }

/* ---- Picture viewer ----------------------------------------------------- */
.picview { flex: 1; display: flex; align-items: center; justify-content: center;
           background: #6a6a6a; overflow: auto; min-height: 0; }

/* ---- Tune Editor -------------------------------------------------------- */
.tune-staff { flex: 1; background: var(--clr-field); border: 1px solid var(--bev-dark);
              margin: 6px; position: relative; overflow: auto; min-height: 0; }
.tune-note { position: absolute; width: 10px; height: 8px; background: #000; border-radius: 5px/4px; }
.tune-line { position: absolute; left: 0; right: 0; height: 1px; background: #000; }

/* ---- Help / INF viewer -------------------------------------------------- */
.inf { display: flex; flex: 1; min-height: 0; }
.inf .contents {
  width: 232px; flex: 0 0 232px; overflow: auto; padding: 4px;
  background: var(--clr-field);
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid);
  margin: 3px;
}
.inf .topic {
  flex: 1; overflow: auto; padding: 10px 14px; margin: 3px 3px 3px 0;
  background: var(--clr-field);
  border: 1px solid var(--bev-dark);
  box-shadow: inset 1px 1px 0 var(--bev-mid);
  user-select: text; -webkit-user-select: text;
  line-height: 1.5;
  min-width: 0;
}
.inf .topic h2 { font-size: 13px; margin: 0 0 10px; }
.inf .topic h3 { font-size: 12px; margin: 14px 0 6px; }
.inf .topic p, .inf .topic li { margin: 6px 0; }
.inf .topic pre { font-family: var(--font-mono); background: #eee; padding: 6px; overflow-x: auto; }
.inf a.link { color: #007070; text-decoration: underline; cursor: default; }
.inf .contents .c-row { display: flex; gap: 4px; padding: 1px 2px; white-space: nowrap; }
.inf .contents .c-row.selected { background: var(--clr-select); color: #fff; }

/* ---- WebExplorer -------------------------------------------------------- */
.webx { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.webx .toolbar { display: flex; gap: 4px; padding: 3px; align-items: center;
                 border-bottom: 1px solid var(--bev-dark); box-shadow: 0 1px 0 var(--bev-white); }
.webx .urlbar { flex: 1; }
.webx .page {
  flex: 1; overflow: auto; background: #c0c0c0; padding: 14px 20px;
  font-family: "Times New Roman", Times, serif; font-size: 14px; color: #000;
  user-select: text; -webkit-user-select: text; min-height: 0;
}
.webx .page h1 { font-size: 24px; margin: 0 0 8px; }
.webx .page h2 { font-size: 18px; margin: 16px 0 6px; }
.webx .page a { color: #0000ee; text-decoration: underline; }
.webx .page a:visited { color: #551a8b; }
.webx .page hr { border: none; border-top: 2px groove #fff; }
.webx .status { font-size: 10px; padding: 2px 5px; border-top: 1px solid var(--bev-dark);
                box-shadow: inset 0 1px 0 var(--bev-white); }
.webx .throbber { width: 20px; height: 20px; border: 1px solid var(--bev-dark); background: #001a4d; }

/* ---- Ultimail ----------------------------------------------------------- */
.mail { display: flex; flex: 1; min-height: 0; }
.mail .folders { width: 130px; flex: 0 0 130px; border-right: 1px solid var(--bev-dark);
                 box-shadow: inset -1px 0 0 var(--bev-white); overflow: auto; padding: 3px; }
.mail .right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.mail .list { height: 45%; overflow: auto; background: var(--clr-field);
              border: 1px solid var(--bev-dark); margin: 3px; }
.mail .body { flex: 1; overflow: auto; background: var(--clr-field);
              border: 1px solid var(--bev-dark); margin: 0 3px 3px; padding: 8px;
              font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap;
              user-select: text; -webkit-user-select: text; min-height: 0; }
.mail table { width: 100%; border-collapse: collapse; }
.mail th { background: var(--clr-dialog); border: 1px solid var(--bev-dark); font-weight: normal;
           text-align: left; padding: 1px 4px; position: sticky; top: 0; }
.mail td { padding: 1px 4px; white-space: nowrap; }
.mail tr.selected td { background: var(--clr-select); color: #fff; }
.mail tr.unread td { font-weight: bold; }

/* ---- Games -------------------------------------------------------------- */
.klondike { flex: 1; background: #007a4d; position: relative; overflow: hidden; min-height: 0; }
.card {
  position: absolute; width: 62px; height: 88px;
  background: #fff; border: 1px solid #000;
  font-family: var(--font-sys); font-size: 12px;
  box-shadow: 1px 1px 0 rgba(0,0,0,.4);
}
.card .corner { position: absolute; left: 3px; top: 1px; line-height: 12px; text-align: center; }
.card .corner.br { left: auto; top: auto; right: 3px; bottom: 1px; transform: rotate(180deg); }
.card .pip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-size: 30px; }
.card.red { color: #c00000; }
.card.black { color: #000; }
.card.back {
  background: repeating-linear-gradient(45deg, #16408a 0 4px, #2a5fbf 4px 8px);
  border-color: #fff;
}
.card.hint { outline: 2px solid #ff0; outline-offset: -2px; }
.pile-slot { position: absolute; width: 62px; height: 88px; border: 1px dashed rgba(255,255,255,.5); }

.chessboard { display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; width: 100%;
              max-width: 360px; margin: 8px auto; border: 2px solid #000; }
.chessboard .sq { display: flex; align-items: center; justify-content: center; font-size: 26px; line-height: 1; }
.chessboard .sq.l { background: #d8c8a0; }
.chessboard .sq.d { background: #7a6242; }
.chessboard .sq.sel { outline: 2px solid #ff0; outline-offset: -2px; }
.chessboard .sq.mv { box-shadow: inset 0 0 0 3px rgba(0,255,0,.45); }

.mahjongg { flex: 1; background: #1d6b3a; position: relative; overflow: auto; min-height: 0; }
.mj-tile {
  position: absolute; width: 34px; height: 44px;
  background: #efe6cc; border: 1px solid #6b5b34;
  box-shadow: 2px 2px 0 #a89765, inset 1px 1px 0 #fffbe8;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #1a3a1a;
}
.mj-tile.sel { background: #ffe9a0; }
.mj-tile.blocked { filter: brightness(.82); }

/* ---- Hardware manager / PMSEEK / clipboard ------------------------------ */
.hwm { display: flex; flex: 1; min-height: 0; }
.hwm .tree { flex: 1; overflow: auto; padding: 4px; background: var(--clr-field);
             border: 1px solid var(--bev-dark); margin: 3px; }
.hwm .detail { width: 250px; flex: 0 0 250px; padding: 6px; overflow: auto; }

.seek-results { flex: 1; overflow: auto; background: var(--clr-field);
                border: 1px solid var(--bev-dark); margin: 4px; min-height: 0; }

/* ---- Clock -------------------------------------------------------------- */
.clockface { display: flex; flex: 1; align-items: center; justify-content: center;
             background: var(--clr-dialog); min-height: 0; }
.clockface canvas { display: block; }
.clock-digital { font-family: var(--font-mono); font-size: 22px; text-align: center; padding: 6px; }

/* ---- Print queue -------------------------------------------------------- */
.queue-table { width: 100%; border-collapse: collapse; background: var(--clr-field); }
.queue-table th { background: var(--clr-dialog); border: 1px solid var(--bev-dark);
                  font-weight: normal; text-align: left; padding: 2px 5px; }
.queue-table td { padding: 1px 5px; border-bottom: 1px solid #e8e8e8; white-space: nowrap; }
.queue-table tr.selected td { background: var(--clr-select); color: #fff; }

/* ---- Trap screen -------------------------------------------------------- */
.trap {
  position: absolute; inset: 0; background: #000; color: #c8c8c8;
  font-family: var(--font-mono); font-size: 14px; line-height: 1.25;
  padding: 18px 24px; white-space: pre; overflow: auto; z-index: 8600;
}

<!-- ==================================================================
     The physical display.  Everything lives inside #screen so that the
     whole workstation can be letterboxed on modern aspect ratios.
     ================================================================== -->
<div id="screen" class="screen">

  <!-- Boot Manager surface (POST / logo / CONFIG.SYS) -->
  <div id="boot" class="boot-surface"></div>

  <!-- Workplace Shell -->
  <div id="wps" class="wps hidden">
    <div id="desktop" class="desktop" tabindex="0"></div>
    <div id="windows" class="window-layer"></div>
    <div id="warpcenter" class="warpcenter"></div>
    <div id="launchpad" class="launchpad hidden"></div>
  </div>

  <!-- Full screen sessions / lockup / shutdown take over the display -->
  <div id="fullscreen" class="fullscreen-layer hidden"></div>

  <!-- Transient UI: popup menus, drag images, tooltips -->
  <div id="popup-layer" class="popup-layer"></div>
  <div id="drag-layer" class="drag-layer"></div>

</div>

<noscript>
  <p style="font-family:monospace;color:#fff;background:#000;padding:1em">
  SYS0002: The system cannot find the file specified.<br>
  JavaScript is required to start the Workplace Shell.
  </p>
</noscript>

      TEXT["C:\\README.1ST"] = String.raw`==============================================================
 READ THIS FIRST
 OS/2 Warp Version 4.52  (Merlin Convenience Package 2)
==============================================================

This file lists last-minute information that was not available
when the online books were built.  Read it before you call for
support; several of the items below explain behaviour that is
working as designed.

CONTENTS
  1.  Installing over an existing Warp 4 system
  2.  Hard disk and file system notes
  3.  Display adapters
  4.  Networking
  5.  Multimedia
  6.  Known limitations

1.  INSTALLING OVER AN EXISTING WARP 4 SYSTEM
    Convenience Package 2 replaces the base operating system
    files, the Workplace Shell and the bundled TCP/IP stack.
    Your desktop is archived automatically before the first
    restart.  If the new desktop does not start, hold Alt+F1
    during the boot logo and choose one of the archived
    desktops from the recovery choices screen.

2.  HARD DISK AND FILE SYSTEM NOTES
    JFS is installed by default on this level.  A JFS volume
    cannot be used as the boot volume; keep the boot volume
    formatted HPFS.  CHKDSK on a JFS volume runs the log
    replay first and may appear to pause for several seconds.

    Extended attributes on FAT volumes are held in the hidden
    file "EA DATA. SF" in the root directory.  Do not delete
    it from a DOS session.

3.  DISPLAY ADAPTERS
    If the desktop starts in 640x480 with 16 colours, the
    installed adapter was not recognised.  Press Alt+F2 while
    the boot logo is displayed to see which display driver is
    loaded, then run Selective Install to change it.

4.  NETWORKING
    The TCP/IP stack is started from CONFIG.SYS by TCPSTART.CMD.
    If you configure the adapter for DHCP, remove any manually
    entered address from the TCP/IP Configuration notebook
    first; a static address always overrides the lease.

5.  MULTIMEDIA
    Digital audio playback requires the adapter to be listed
    in Hardware Manager.  Sound events are enabled from the
    Sound object in System Setup.

6.  KNOWN LIMITATIONS
    - A Win-OS/2 full screen session cannot be started while a
      seamless Win-OS/2 session is running.
    - Long file names are truncated when copied to a diskette
      formatted with FAT.
    - The Shredder does not prompt when confirmation has been
      switched off on the Desktop settings notebook.

==============================================================
